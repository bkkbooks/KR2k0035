front:
  text: 欽定四庫全書欽定熱河志卷七十六
  hash: sha256:fd1e533e88f3e8699deec91682af79853867879606c000326e16cbd5b28c8d43
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0035_WYG_076-1a, image: WYG0496/WYG0496-0216a.png}
body:
  text: 藩衛二藩衛以熱河諸部為尤近我皇上歲舉秋田依光咫尺乃者特詔國史館會同理藩院採輯各蒙古王公部落事迹編列表傳追闡成勞俾垂簡册矧兹熱河近部千里同風謹稽原始列為表志云爾喀喇沁喀喇沁在平泉州即八溝廳建昌縣即塔子溝廳境內明初以元海烏梁海舊作兀良哈今改正置外衛自全寧歷喜峯近宣府曰朵顔衛地在大寧衛北永樂初以大寧地賜三衛部長遂內徙此為朵顔衛所據後併於察哈爾以地豫其塔布囊是為喀喇沁我朝天聰二年塔布囊蘇布地偕色楞等舉部歸誠編為左右翼二旗康熙四十四年又增設扎薩克一旗凡三旗右翼旗在平泉州即八溝廳西北境東至土默特右翼及敖漢界西至熱河及圍場界南至平泉州及左翼旗界北至翁牛特右翼界增設之扎薩克一旗即在右翼之中左翼旗在建昌縣即塔子溝南境東至錦州府邊門界西至平泉州界南至永平府邊墻界北至右翼旗界其封爵則有多羅郡王多羅貝勒鎮國公輔國公頭等塔布囊公品級諸號多羅郡王崇德元年始封蘇布地之子古魯思竒布為貝子賜號多羅杜稜世襲掌右翼扎薩克事順治七年晉封為多羅貝勒康熙七年晉封其子班逹爾沙為多羅郡王多羅貝勒順治五年始封色楞為鎮國公世襲掌左翼扎薩克事康熙五十五年晉封其孫善穆巴喇什為固山貝子雍正九年晉封善穆巴喇什之子僧衮扎布為多羅貝勒又乾隆七年僧衮扎布之子扎拉豐阿封為輔國公二十年晉封郡王以罪削爵二十四年復封固山貝子四十四年晉封貝勒鎮國公乾隆七年封僧衮扎布之子呼圖靈阿為固山貝子十四年降鎮國公四十四年呼圖靈阿之子濟克濟逹扎布襲鎮國公又乾隆八年封右翼旗之敏珠爾拉布坦為輔國公二十四年晉封固山貝子二十五年敏珠爾拉布坦之子丹怎達爾扎降襲鎮國公輔國公雍正八年封右翼旗之羅布藏車布登為輔國公雍正九年以扎薩克旗之頭等塔布囊達穆巴陳亡追封輔國公世襲扎薩克頭等塔布囊公品級康熙四十四年以格勒爾所部繁盛增至三十八佐領别置一旗封為頭等塔布囊掌本旗扎薩克事五十九年格勒爾所飬伊弟之子喀寧阿襲乾隆十九年賞給喀寧阿之子齊齊克公品級按雍正十年别封喀喇沁旗屬額爾德尼為輔國公後無襲附識於此翁牛特翁牛特在赤峯縣即烏蘭哈逹廳境明初為烏梁海地後自稱翁牛特我朝天聰七年其濟農索音偕貝勒東等舉部歸誠編為左右翼二旗右翼旗東至敖漢及左翼旗界西至圍場界南至喀喇沁右翼界北至左翼旗及克什克騰界左翼旗東至阿祿科爾沁及奈曼界西至右翼旗及克什克騰界南至敖漢界北至巴林界其封爵則有多羅郡王多羅貝勒固山貝子鎮國公諸號多羅郡王崇德元年始封索音為多羅杜稜郡王世襲掌右翼扎薩克事雍正五年索音之四世孫倉津以罪削爵以其叔鄂齊爾襲鄂齊爾於康熙六十一年封輔國公尋晉封固山貝子至是襲郡王其子羅布藏於雍正五年襲爵為固山貝子十年晉封多羅貝勒至十一年襲郡王多羅貝勒崇德元年始封東為多羅逹爾罕岱青貝子世襲掌左翼扎薩克事康熙元年晉封其叟色為貝勒固山貝子雍正十一年封右翼旗之額爾德尼為固山貝子鎮國公國初有噶爾瑪率屬來歸且立軍功封為鎮國公入右翼旗世襲土默特土默特在朝陽縣即三座塔廳境明初以元後烏梁海置外衛自義州歷廣寧至遼河曰泰寧衛即以其部長掌衛事其地本在營州衛北永樂初徙衛於內地此為泰寧衛所據嘉靖以後小王子之裔居此者號曰土蠻是為土默特我朝天聰三年台吉俄木布偕塔布囊善巴等舉部歸誠後編為左右翼二旗右翼旗東至錦州府邊門及左翼旗西至喀喇沁右翼旗界南至喀喇沁左翼界北至敖漢及奈曼界左翼旗東至楊柳木牧厰界西至右翼旗界南至義州邊門界北至喀爾喀左翼界其封爵則有多羅貝勒固山貝子諸號其喀爾喀多羅貝勒附焉多羅貝勒崇德元年始封善巴為鎮國公賜號多羅逹爾罕世襲掌左翼扎薩克事康熙元年晉封其子卓里克圖為多羅貝勒固山貝子順治五年封古穆為鎮國公世襲掌右翼扎薩克事康熙元年晉封為固山貝子喀爾喀多羅貝勒康熙四年有喀爾喀台吉巴爾布氷圖因喀爾喀內亂率屬來歸附入土默特旗內封為多羅貝勒世襲敖漢敖漢在建昌縣即塔子溝廳北境明代為喀爾喀所據後分與其弟號曰敖漢素屬於察哈爾我朝天聰元年其貝勒塞臣卓里克圖舉部歸誠編為一旗其地東至奈曼界西至喀喇沁右翼界南至土默特右翼界北至翁牛特左翼界其封爵則有多羅郡王固山貝子輔國公諸號多羅郡王崇德元年始封塞臣卓里克圖之子班第為多羅郡王世襲掌本旗扎薩克事又國初有索諾木杜稜因察哈爾之亂率屬來歸且立軍功順治五年始封其子密濟克為多羅郡王世襲固山貝子雍正七年封固山額駙羅布藏為輔國公十年以軍功晉封固山貝子乾隆八年晉封多羅貝勒十八年羅布藏之子垂濟扎爾降襲貝子又乾隆二十四年封羅布藏什拉布為輔國公三十七年晉鎮國公四十年晉封貝子輔國公乾隆十八年封桑濟扎爾為輔國公奈曼奈曼在朝陽縣即三座塔廳北境明時為喀爾喀所據後分與其弟號曰奈曼素屬於察哈爾我朝天聰元年其台吉衮楚克舉部歸誠編為一旗其地東至喀爾喀左翼界西至敖漢界南至土默特界北至翁牛特界其封爵則有多羅郡王多羅郡王崇德元年始封衮楚克為多羅達罕郡王世襲掌本旗扎薩克事按康熙十四年别封奈曼旗屬烏魯木濟為固山貝子格勒爾為輔國公並於三十七年削爵無襲附識於此巴林巴林在赤峯縣即烏蘭哈逹廳北境明初為烏梁海地後為巴林部所據與喀爾喀為兄弟行素屬於察哈爾我朝天聰二年其貝勒塞特里偕滿珠習禮舉部歸誠編為左右翼二旗其地東至阿祿科爾沁界西至克什克騰界北至烏朱穆秦界南至翁牛特界其封爵則有多羅郡王固山貝子輔國公諸號多羅郡王順治五年始封塞特里之子塞布騰為輔國公七年以額駙晉封多羅郡王世襲雍正元年其四世孫里木布以罪削爵八年以里木布之叔輔國公桑里逹襲封郡王乾隆十九年桑里逹之子林沁恩加親王品級二十一年林沁之子巴圖仍襲郡王固山貝子順治五年始封滿珠習里為固山貝子世襲又封塞稜為固山貝子年代無考並世襲輔國公乾隆八年封林沁為輔國公後晉郡王見前郡王條下二十一年林沁之子德勒克襲輔國公喀爾喀左翼喀爾喀左翼在朝陽縣即三座塔廳東北境明時為喀爾喀貝勒古木布伊勒登所居素屬西北扎薩克圖汗我朝康熙三年舉部歸誠編為一旗稱喀爾喀左翼其地東至科爾沁界西至奈曼界南至土默特界北至扎魯特界其封爵則有多羅貝勒多羅貝勒康熙三年始封古木布伊勒登為多羅貝勒世襲欽定熱河志卷七十六
