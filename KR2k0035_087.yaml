  text: 欽定四庫全書欽定熱河志卷八十七
  hash: sha256:b74058e10ce97dbc33ceb003694bbdac9e590b7888a5c810e3d0cc30cdf6d7e8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0035_WYG_087-1a, image: WYG0496/WYG0496-0382c.png}
body:
  text: 人物一列女流寓方外并附熱河山川雄秀英傑鍾靈方今改設郡縣建立學校人材由是蔚興而前代自魏晉以還生其地者代有賢豪遼金及元為中京北京上都大寧地文武輩出亦炳然可觀焉兹特綜成事具録於篇至於列女貞操足風時俗與夫名賢流寓釋道棲真託迹靈區者並採附簡末俾來者觀感興起志人物第十八晉孫泳十六國春秋前燕録咸康四年趙率衆來伐朝鮮令昌黎孫泳帥衆拒趙大姓王清等密謀內應泳收斬之同謀數百人惶懼請罪泳皆赦之與同拒守俊二年伐趙趙征東將軍鄧恆焚倉庫棄安樂遁去都尉泳急入安樂撲滅餘火藉其穀帛俊以泳為廣寧太守謹按慕容氏時昌黎有二咸康三年以前昌黎郡當渝水下流海口在今錦州府境與熱河所屬無關至前燕録稱徙昌黎郡築好城以逼乙連事在咸康三年後其地已移屬龍城以西為今八溝東境卷中孫泳以下諸人事迹皆在咸康四年以後例得載入至廬副鳩為昌黎徒河人徒河本漢縣在前燕時亦𨽻錦州府境至慕容垂遣驃騎將軍農出􅝡螉塞攻令支討餘巖置幽州牧後已屬熱河境內詳見建置沿革故亦仍編載焉劉斌十六國春秋前燕録廆以昌黎劉斌典機要咸康二年皓遣斌送王齊等於建康俊二年伐趙留世子守龍城以內史斌為大司農與典書令皇甫真留統後事韓宰十六國春秋前燕録韓宰昌黎人仕俊為謁者僕射揚威將軍子昞降於魏谷衮十六國春秋後燕録谷衮昌黎人也膂力兼人彎弓三百斤勇冠當時仕垂至廣武將軍盧副鳩十六國春秋後燕録盧副鳩昌黎徒河人也仕垂為尚書令臨澤公北魏屈遵孫恆曽孫道賜魏書屈遵傳屈遵字子皮昌黎徒河人也魏書太平真君八年併徒河屬昌黎郡廣興縣名著當時慕容垂以為博陵令太祖南伐屬城長吏多逃竄遵獨告其吏民曰往年寶師大敗今兹垂征不還天之棄燕人弗支也魏帝神武命世寬仁善納御衆百萬號令若一此湯武之師吾欲歸命爾等勉之遂歸太祖素聞其名厚加禮焉拜中書令出納王言兼總文誥中原既平賜爵下蔡子從駕還京師卒遵子須須長子恆字長生沈深有局量少纂家業尤善書計給事諸曹遷將作監世祖即位稍遷尚書右僕射加侍中以破平涼功賜爵濟北公加平南將軍督諸軍東伐進號鎮東大將軍師次和龍馮文通致牛酒犒軍獻甲三千恆責其不送侍子數之以王命遂掠男女六千口而還世祖信任之委以大政車駕出征常居中留鎮與襄城公盧魯元俱賜甲第真君四年墜馬卒時世祖幸隂山恭宗遣使乘傳奏狀世祖悼惜謂使人曰汝等殺朕良臣何用乘馬遂令步歸恆子道賜襲祖爵進為尚書加散騎常侍善騎射機辨有辭氣世祖甚器之谷渾魏書谷渾傳谷渾字元沖昌黎人也父衮勇冠一時渾少有父風任俠好氣以父母在常自退抑晚乃折節受經業被服類儒者以善𨽻書為內侍左右遷前鋒將軍世祖即位從征赫連昌遷侍中安南將軍領儀曹尚書賜爵濮陽公渾正直有操行性不茍合趨舍不與已同者視之蔑如然不以富貴驕人時以此稱之卒諡文宣盧魯元魏書盧魯元傳盧魯元昌黎徒河人也曽祖副鳩祖父並至大官魯元敏而好學寬和有雅度太宗時選為通直郎以忠謹給侍東宫恭儉盡節世祖親愛之及即位以為中書侍郎拾遺左右寵待彌深魯元益加謹肅內外大臣莫不敬憚焉性多容納善與人交好掩過揚美由是公卿咸親附之工書有文才纍遷中書監領祕書事賜爵襄城公從征赫連昌世祖親追擊之入其城門魯元隨世祖出入是日微魯元幾至危殆真君三年車駕幸隂山魯元以疾不從及薨世祖臨其喪贈襄城王諡曰孝葬於崞山為建碑闕自魏興貴臣恩寵無與為比子統襲爵韓秀魏書韓秀傳韓秀字白虎昌黎人也祖宰父昞秀歷遷尚書郎賜爵遂昌子拜廣武將軍髙宗稱秀聰敏清辨才任喉舌命掌機密延興中尚書奏以敦煌一鎮界逺西北欲移就涼州秀獨謂徙就姑臧慮人懷異意乃從秀議太和初遷內侍長後為平東將軍青州刺史假漁陽公在州數年卒子務襲爵韓麒麟子興宗顯宗孫子熙魏書韓麒麟傳韓麒麟昌黎棘城人也魏書太平真君八年併棘城屬昌黎郡自云漢太司馬增之後父瑚麒麟幼而好學美姿容善騎射恭宗監國為東曹主書髙宗即位賜爵魯陽男加伏波將軍父亡在喪有禮後參征南慕容白曜軍事進攻升城師人多傷及城潰白曜將坑之麒麟諫曰勍敵在前便坑其衆恐自此以東人各為守三齊未易圖也白曜從之皆令復業齊人大悅髙祖時除冠軍將軍齊州刺史假魏昌侯在官寡於刑罰以新附之人未階臺宦士人沈抑宜推用豪望從之京都大飢復表陳時務卒於官遺敕殯以素棺事從儉約麒麟立性恭慎恆置律令坐傍臨終之日唯有俸絹數十匹其清貧如此贈散騎常侍安東將軍燕郡公諡曰康長子興宗字茂先好學有文才官祕書中散興宗弟顯宗字茂親性剛直能面折廷諍亦有才學法門法撫三齊稱其聰悟嘗與顯宗校試抄百餘人名各讀一遍隨即覆呼法撫猶有一二舛謬顯宗了無誤錯太和初舉秀才對策甲科除著作佐郎車駕南討兼中書侍郎既定遷都顯宗上書其一願輿駕早還北京省諸州供帳其二北都富室競以第宅相尚今因遷徙宜申禁約令貴賤有檢無得踰制其三輿駕還洛陽輕將數千騎銜橛或失願少垂省察其四願垂拱司契委下員成髙祖頗納之又上言進賢求才朝廷但檢門望不復彈坐當校其有寸長銖重者即先敘之又止姦在於防檢不在嚴刑又代京宜建畿置尹崇本重舊以光萬葉又伎作不可雜居士人不宜異處又僑置中州郡縣名數甚衆疑惑書記錯亂區宇非所以疆域物土可依地理舊名釐革又賜賚太過不可以親近之昵猥損天府之儲又諸宿衛內直者宜令武官習弓矢文官諷書傳今給蒱博之具徒損朝儀一宜禁止髙祖善之後為本州中正車駕南伐軍次赭陽蕭鸞戍主成公期遣髙法援等來擊顯宗親率拒戰斬法援首髙祖詔曰卿破賊斬帥何為不作露布顯宗曰臣頃聞鎮南將軍王肅獲賊二三驢馬數匹皆為露布臣在東觀私每哂之近雖仰憑威靈擒斬不多所以斂毫卷帛解上而已新野平以為鎮南廣陽王嘉咨議參軍後上表訴前征勳詔以白衣守咨議卒顯宗撰馮氏燕志孝友傳各十卷傳於世景明初追赭陽勳賜爵章武男興宗子子熙字元雍少自修整有學識侍中崔光舉為清河王懌常侍遷郎中令初興宗以爵讓弟顯宗不受子熙緣父素懷卒亦不襲及顯宗卒子熙别蒙賜爵乃以先爵讓弟仲穆父亡居喪有禮子熙為懌所眷元又害懌久不得葬每言王若不得復封以禮遷葬誓終身不仕靈太后返政以元又為尚書令解其領軍子熙伏闕上書靈太后義之乃引子熙為中書舍人後遂賜元又死子熙清白自守不交人事少孤為叔顯宗撫養及顯宗卒子伯華幼子熙友愛等同生長猶共居車馬資財隨其費用又上書求析階與伯華於是除伯華東太原太守興和中為侍講卒遺戒不求贈諡孫紹魏書孫紹傳孫紹字世慶昌黎人世仕慕容氏祖志入國父協字文和紹少好學隂陽術數多所貫涉初為校書郎稍遷給事中朝廷大事好言得失遂為世知與常景等共修律令性抗直每上封事懇切不憚犯忤兄世元早卒善彈筝紹後聞筝聲便涕泗鳴咽世以此尚之曽與百僚赴朝東掖未開紹於衆中引吏部郎中辛雄竊謂之曰此中諸人唯吾與卿猶享富貴雄甚駭愕未幾有河隂之難紹善推祿命事驗甚多遷左衛將軍右光祿大夫卒諡曰宣盧醜魏書盧醜傳盧醜昌黎徒河人魯元之族世祖為監國醜以篤學博聞入授經後以師傳舊恩賜爵濟隂公除鎮軍將軍拜尚書加散騎常侍出為河內太守延和二年卒北周怡峰周書怡峰傳怡峰字景阜遼西人也本姓默台因避難改焉髙祖寬燕遼西郡守魏道武時率戶歸朝曽祖文峰少從征役以驍勇聞永安中為都將討万俟醜奴以㓛授給事中明威將軍轉征虜將軍都督齊神武與魏孝武搆隙太祖令峰率輕騎赴洛陽至潼關值魏西遷即從太祖回洛復潼關拜安東將軍華州刺史尋轉大都督討曹泥進爵華陽郡公從破竇泰威名轉盛授開府儀同三司拜夏州刺史討劉平伏有㓛東魏圍頴川赴援至南陽疾卒峰沈毅有膽略得士心太祖嗟悼久之諡曰襄威子昻光春謹按北周時無遼西郡號自隋書地理志始稱遼西郡舊置營州統桞城周書成於隋代當時為怡峰立傳或即現在所置地書之亦未可知故仍載入豆盧寧弟永恩周書豆盧寧傳豆盧寧字永安昌黎徒河人本慕容氏前燕之支庶也髙祖勝燕皇始初歸魏授長樂郡守賜姓豆盧或云避難改焉父長柔元鎮將有威重見稱於時寧少驍果有志氣身長八尺美容儀善騎射永安中以别將授都督破万俟醜奴嘗與梁企定遇於平涼相與肄射懸莎草百步射之七發五中定服其能侯莫陳悅反率衆歸大祖從擒竇泰破劉平伏羌帥武興氐反叛討平之武成初為同州刺史封楚國公保定四年授岐州刺史大軍東討輿疾從薨於同州諡曰昭初寧未有子養弟永恩子績及生子讚親屬請為嗣寧曰兄弟之子猶子也以績為世子永恩少有識度與寧俱歸授殄寇將軍屢逢征討皆有功封沃縣公卒諡曰敬子通庾信豆盧公神道碑君諱永恩字某皓之後也尚書府君改姓豆盧筮仕於魏祖代左右將軍魏文皇帝直寢父長少以雄略知名謹按北魏之昌黎郡在今塔子溝東境北齊時為龍城縣地周承北齊之業則昌黎郡人例得編載至豆盧恩碑顧炎武金石文字記云今在咸陽縣碑云恩字永恩北史附見其兄豆盧寧傳但言永恩而闕其名據此則永恩本名恩後乃以字行耳庾信集諱字不同應以碑為正隋豆盧績子育兄通隋書豆盧績傳豆盧績字定東昌黎徒河人也本姓慕容燕北地王精之後也中山敗歸魏北人謂歸義為豆盧因氏焉祖萇父寧績生時周太祖親幸寧家時新破齊師因字曰定東聰悟有器局少受業國子學略涉文藝魏封義安縣侯周改丹陽郡公明帝時績自以經業未通請解職勑以本官就學拜卭州刺史未之官渭源燒當羌因飢作亂以績有才略轉渭州刺史甚有惠政德澤流行宣帝大象二年拜利州總管進位上大將軍月餘拜柱國髙祖為丞相益州總管王謙作亂績嬰城固守經四旬勢漸迫出竒兵擊之斬數千級降二千人使持節上柱國賜一子爵中山縣公開皇二年突厥犯塞以績為北道行軍元帥備邉嵗餘拜夏州總管以疾徵還卒諡曰襄子賢嗣賢弟育字道生少英果有氣節漢王諒出鎮并州育以妃兄為王府主簿征突厥以功授儀同三司煬帝即位徴諒入朝諒納咨議王頍之謀發兵作亂育苦諫不從因謂弟懿曰吾匹馬歸朝自得免禍此乃身計非為國也今且偽從以思後計育兄顯州刺吏賢言於帝曰臣弟育素懷志節必不從亂但逼凶威不能克遂臣請從軍與育為表裏諒不足圖也許之賢密遣家人齎敕書至育所諒出城將往介州令育與總管屬朱濤留守育謂濤曰漢王構逆敗不旋踵當與卿出兵拒之濤驚曰王以大事相付何得有是語拂衣去育追斬之閉城拒諒部分未定諒襲擊之遂見害時年二十八及諒平贈大將軍封正儀縣公諡曰愍子願師嗣通字平東績之兄也一名會有器局入朝官典宿衛出拜定州刺史轉相州刺史遷夏洪二州總管所在並稱寬惠卒諡曰安有子寬新唐書宰相世系表豆盧氏本姓慕容氏燕王廆弟西平王運生尚書令臨澤敬侯制制生右衛將軍北地愍王精降後魏北人謂歸義為豆盧因賜以為氏居昌黎棘城二子醜勝又考證沈炳震曰後燕録慕容寶傳精為慕容麟所殺未嘗降後魏南燕録慕容鍾傳鍾封北地王降後秦封歸義侯是北地王之封歸義侯者乃南燕之北地王鍾非後燕之北地王精且降後秦非後魏也謹按新唐書表沿隋書之誤但隋書歸魏無主名表則直指精耳十六國春秋運孫慕容永有傳所謂西燕者也制無考北地王精亦未知為何人後又周書首列勝合觀隋書及庾信二碑惟勝之子失名次曰代次曰長次曰寧曰永恩寧子曰績曰讃績子曰賢曰育育之子曰願師永恩子曰通通一名會子曰寬歷歷可考新唐書表萇子永恩永恩子通通子寬亦同長即萇也自萇以下皆系醜而不系勝蓋誤又豆盧得氏之始周書以為勝庾信碑以為勝之子而舊唐書豆盧欽望傳又以為萇俱不同大扺鍾降後秦為歸義侯而凡慕容氏皆從之改豆盧氏不必定在魏且鍾於皓為從子不得為運孫據庾信碑寧兄弟為皓後亦不得系之於廆弟運姑缺疑焉唐尚可孤唐書尚可孤傳尚可孤字可孤東部鮮卑宇文之别種世處松漠間天寶末𨽻安祿山復事史思明上元中自賊所歸纍授左右威衛大將軍封白水縣伯為神䇿大將以功試太常卿徙封馮翊郡王魚朝恩主衛兵器其勇飬為子名智德使將兵三千屯扶風武功歷十餘年隊伍間整朝恩死賜氏李名嘉勳李希烈叛擢為招討復本姓名纍戰有功朱泚之難召可孤可孤率兵三千道襄鄧而西遂收藍田德宗將遷梁州命引兵守灞上拜神䇿京畿渭南啇州莭度招討使進軍與李晟收長安為先鋒以功加檢校尚書左僕射又會諸軍進討李懷光次沙苑卒於軍可孤性謹審沈壯既有勳勞嘗自論功御衆公嚴晟數稱之侯希逸新唐書侯希逸傳侯希逸營州人長七尺豐下鋭上天寶末為州禆將守保定城安祿山反使中人韓朝敡傳命希逸斬以徇祿山又以親將徐歸道為節度使希逸率兵與安東都護王元志斬之遣使上聞詔拜元志平盧節度使元志卒共推希逸數有功然孤軍無援又為奚侵掠乃拔其軍二萬浮海入青州據之平盧遂陷肅宗因以為平盧淄青節度使自是淄青常以平盧冠使寶應初與諸軍討平史朝義加檢校工部尚書圖形凌煙閣希逸始得青治軍務農有狀後召還檢校右僕射封淮陽郡王遷司空未及拜卒謹按平盧軍屬營州都督故舊唐書希逸本傳稱平盧人其實一也後李惠登亦然張孝忠新唐書張孝忠傳張孝忠字孝忠本奚種世為乙失活酋長父謐納欵授鴻臚卿孝忠始名阿勞以勇聞燕趙間共推張阿勞王沒諾干齊名沒諾干王武俊也孝忠魁偉長六尺性寬裕事親孝天寶末以善射供奉仗內安祿山奏為偏將祿山史思明陷河洛常為賊前鋒朝義敗自歸以兵屬李寶臣易州諸屯委以統制十餘年威惠流聞田承嗣冦兾州寶臣付兵四千使出上谷屯貝邱承嗣見其軍整嚴歎曰阿勞在冀未可圖也寶臣晚節稍忌刻殺大將李獻誠等召孝忠不往寶臣死子嶽擅立詔朱滔討之孝忠遣易州録事參軍董真入朝德宗嘉之朱滔與武俊叛遣蔡雄説之啖以金帛皆不受滔悉兵攻之詔李晟率師援孝忠遂全其軍天子出奉天遣將楊榮國佐晟收京師貞元二年河北蝗民多餓死孝忠與其下同粗淡日膳裁豆䜺而已人推為賢將子茂昭茂宗茂和謹按權德輿撰碑稱諱孝字達忠不同為易州時封符陽郡王傳與碑同獨舊唐書本傳作范陽今易州有唐時石刻張公山亭再葺記其文云光祿大夫試太子賔客使持節易州諸軍事兼易州刺史充髙陽軍使兼御史中丞符陽郡王張公與權碑合則知以符陽為范陽者舊史之誤也李惠登唐書李惠登傳李惠登營州栁城人為平盧軍禆將安祿山亂從董秦泛海略定滄棣等州輕軍逺鬬賊戰輒北史思明反惠登陷賊以計挺身走山南依來瑱表試金吾衛將軍李希烈反屬以兵二千使屯隋州惠登挈州以歸即拜刺史州數被亂野如爇火人無處業惠登雖朴素無學術而視人所謂利者行之所謂害者去之率心所安暗與古合政清靜居二十年田畝闢户口日增人歌舞之於是節度使于頔狀其績詔加御史大夫升隋為上州俄檢校國子祭酒卒贈洪州都督謹按惠登在循吏傳又舊唐書韓愈傳昌黎人唐李翺作行狀宋程俱作年譜並同今詳新唐書宰相世系表韓頽當裔孫尋始遷潁川此愈所自出遷昌黎者尋之先與愈支别離愈亦自稱昌黎但以當日族望言耳新唐書愈傳鄧州南陽人據韓文考異辨宋洪興祖所作年譜以為河內之南陽鄧州傳蓋附會世系表頽當始居赭陽之説洪氏亦誤從之二地同名南陽然遷徙屢更不可逺引也今從考異定愈為河內南陽人兹不録謹按唐書地理志營州栁城郡縣一栁城西北接奚北接契丹其地當在今塔子溝三座塔境內詳見建置沿革至唐時營州都督府於萬嵗通天二年曽為契丹李萬榮所陷神龍二年移於幽州開元四年移還栁城八年又往就漁陽其地雖佹得佹失但尚可孤諸人事迹在開元天寶間去武后未逺計其生時在營州未遷以前故仍從舊志載入至李光弼唐書本傳雖稱營州栁城人但其父楷洛於武后時入朝已屬內地故不附載云欽定熱河志卷八十七
