body:
  text: 欽定四庫全書欽定熱河志卷七十三學校一教化之行建首善自京師始蓋以京師王化之基聲教所先也熱河自聖祖肇建山莊成都成邑我皇上率修前典嵗時獮狩萬國來同瞻就雲日無異京輦乃發德音興建學校改設府縣立師儒之官廣選造之額恩綸稠疊規制大備伏讀御製碑記及紀事釋奠諸詩於禮樂百年之興三致意焉猗歟盛美千載一時也臣等叨奉屬車伏覩此邦人士蹈詠鴻儀沐浴聖化謹次立學緣起志學校第十一其考棚書院亦附列焉御製文熱河文廟碑記己亥丙申夏駐蹕熱河避暑山莊曹秀先以禮部尚書扈從幾暇召見談及時政秀先云臣春卿也在職言職以為此處宜興學校以造就士朕曰俞哉亦其時矣於是乎有設學之旨於是乎有加額之恩學校既設則文廟亟宜建乃命相地伐材卜吉鳩工宫牆泮水殿廡禮樂一如制越二年己亥夏朕以來巡親釋奠而落成之夫熱河固自古關塞以外荒略之區也雖金遼有興州之稱然旋舉旋廢建置沿革率不可考而况有臯比之傳絃誦之聲哉是以我皇祖每年避暑於此亦不過名之曰山莊故有聚民至萬家之句蓋於禮樂之興未免存待以百年之意今則耕桑日以闢戶口日以滋以幅員計之不啻數千里而版籍或逾十萬焉此而無學以牖民迪俗豈宣祖猷揚聖化之道今西域烏魯木齊等處率置郡縣立學校以此較彼為尤近矣則兹文廟之建於時於地胥不可緩亦不待人之請而後行稱之曰熱河文廟者今雖升之曰承德府從其朔紀其因也昔蘇軾作韓愈碑記云公之神在天下如水之在地中豫謂韓愈因文見道我夫子體道垂文韓愈之所因者即夫子之所垂而見猶待乎行體則其本也且水在地中尚待求而得之我夫子乃天之經地之義山之峙海之淵無日不在人人心目之中範圍曲成而不遺豈待穿鑿求之而後得然則木鐸之音孰謂不可覺斯民於關外荒略之區也哉御製詩熱河承德府紀事八韻有序己亥上塞久鍾擅坤輿之勝概神臯特闢萃天府之奧區造化既具此山川分野自呈為都會溯惟熱河著號因泉溫而紀地靈逮乎承德命名初設州而今置府緬昔經營文囿始成避暑之莊及余纘習武功斯佇行秋之典煙井萬家而遞衍盈寧既叶屢豐禮樂百年而後興教化亦徴日盛作廟凖省垣之制熱河先建城隍廟像設祀典悉視保定省城建學崇孔子之堂文治甫彰賢書遂薦乃詔銓曹而集議悉依內地之成科首廳遷郡守之階即資統轄餘屬分牧令之職仍帶原銜人因舊而制則惟新規模於焉大備官不增而事無所廢庶政因之益修顧兩載已隔鳴鑾兹五月復臨駐蹕覽歡迎之士庶愈懷祖德之培貽撫肇錫之班聨恆凛泰符之熙洽用吟長律兼識大凡皇祖初名避暑莊熱河數典那云忘萬家煙火昔成聚萬家皇祖熱河詩有聚民至之句今不啻數倍矣千里幅員今闢疆承德建州癸丑始丙申升府繼先蘉因之擇地立文廟遂以育賢起學庠信是百年興禮樂欣其比戶富農桑漫猜林本鹿豖藪試看家增絃誦場朔定安興軍溯古遠於此置北安州興化軍屬中京大定府金改興州寧朔軍屬北京路豐灤建赤縣分傍熱河升為承德府統轄六屬並改八溝廳為平泉州四旗廳為豐寧縣喀喇河屯廳為灤平縣三座塔為朝陽縣塔子溝廳為建昌縣烏蘭哈逹廳為赤峯縣仍兼同知通判原銜咸隸承德府撫兹樂利蒙庥者保泰惟殷敬不遑文廟釋奠禮成有述聖祖於斯避暑曽養恬樂利被黎蒸閭閻此日較前盛禮樂百年以後興爰建廟堂欣慶落載因釋奠仰依憑菁莪雅化捷影響已有庠間俊秀升丙申夏詔於熱河興建文廟並定各廳入學額數丁酉秋順天鄉試即有熱河之生員中式者謹按文廟碑記熱河承德府紀事八韻詩俱御書刻石文廟釋奠禮成有述詩刻屏懸挂乾隆四十一年八月內閣奉上諭朕每嵗木蘭秋獮先期駐蹕熱河數十年來見該處户口日增民生富庶且農耕蕃殖市肆殷闐儼然成一都會惟絃誦之風未盛由於口外人多朴魯無所師承且未另立學額更無以示鼓舞因思熱河各廳所屬編氓及僑居年久者其子弟應不乏秀良誠能教育而振興之未嘗不足以示造就自宜創設義學延師訓課以勵文風並當建立學宫酌定庠額俾得藉以上進其如何興建籌辦著該督周元理悉心勘議具奏至學校章程並著會商學政羅源漢酌議奏聞副朕嘉惠塞民廣學育材至意欽此謹按先是熱河於雍正年間改設承德州乾隆三年議設學額至七年裁州歸密雲縣考試詳見部議各條下四十二年十二月內閣奉上諭前據周元理奏熱河請添建考棚俾七廳所屬士子生童得以就近應試事屬可行但工程事宜地方官素未諳習辦理恐未能妥協所有熱河考棚工程著𣲖劉浩辦理欽此四十三年正月內閣奉上諭熱河地方朕每嵗木蘭秋獮先期駐蹕數十年來户口日增民生富庶且農耕蕃殖市肆殷闐其秀民並知蒸蒸向化絃誦相聞現已興建學宫議定庠額並命設立考棚將來人文日盛已儼然成一大都會而名稱仍熱河之舊殊於體制未協因思熱河從前曽稱為承德州嗣後應改為承德府即以熱河同知改設其廨署并毋庸另建其餘六廳如八溝較大似應改為知州喀喇河屯等廳酌量改縣均隸新設之承德府管轄并隸熱河道考核著傳諭周元理將應行酌改各事宜悉心籌畫妥議具奏候朕另降諭旨將此諭令知之欽此四十三年正月內閣奉上諭學校人才之聚郡縣户口之系古者教飬並重治化覃敷至於荒略之地邊漠之區恆有聲教所未及而不𨽻版圖者我朝定鼎以來光宅函夏幅員日廓中外一家京畿東北四百里熱河地方在古北口以北其境於禹貢為兾州邉末而虞及殷周幽州之畫境也秦漢以來越在絶徼未入版圖元魏建安營二州唐時有營州都督府然不過僑治於內地遼金及元始薌其名而厯祚未久故址旋荒明棄大寧視為别域我國家撫臨寰宇薄海內外咸登版籍况熱河密邇畿輔自皇祖康熙四十二年肇建山莊秋獮經行往來駐蹕皇考率修前典設立熱河廳尋改承德州朕臨御之七年地方大吏建議此地究為關外仍設為廳八溝等六處悉如之蓋以其時士民尚少風俗椎魯立學建郡之制有未遑焉嗣後獮獵木蘭每嵗駐蹕於兹日見黎庶殷闐户口繁富里巷絃誦人文漸起此實國家積洽纍仁休養生息涵濡百餘年之久方克臻斯夫士為四民之首土著與僑居者久於其化子弟不乏秀良而學校未興師承無自其何以甄陶而鼓勵之况今西域如烏嚕木齊等處率皆立學校置郡縣以此較彼地既逺近懸殊風土人物亦皆過之按諸古者廣厲學官之意其地其時正相協焉爰於丙申秋命冬官量度規模鳩工庀材興建文廟朕親釋奠而落成之每年來巡斯土必先展拜廟貌秋仲丁祭遣大學士行禮率以為常所有酌定庠額分年取士並創設書院義學延師訓課悉令督臣與學臣議立章程以行近嵗士氓深被教澤既富方榖益見蕃昌閭閻安堵沐浴太平四方商賈之民駢集輻湊儼然成一都會計其地千有餘里而户口或逾十萬焉可以見耕桑日闢版籍日繁成都成邑之盛有明徴矣近者既創立學校樂育人材而其地猶仍熱河廳之舊凖諸體制未為允協因思向曽設承德州今宜升為承德府即以同知改設其餘六廳如喀喇河屯廳改為灤平縣四旗廳改為豐寧縣八溝廳其地較廣改為平泉州烏蘭哈逹廳改為赤峰縣塔子溝廳改為建昌縣三座塔廳改為朝陽縣賦稅戶籍之數悉𨽻於知府轄於熱河道以重考核官斯土者所宜悉心經畫措置協宜以副朕嘉惠邊氓教養兼施之意至於考訂舊聞搜羅掌故輯成熱河全志已命儒臣博採旁徴區分事類纂訂成書仍於山莊內肇建文津閣庋貯四庫全書琅籖祕笈炳耀興桓以示朕崇師惇典一道同文至意欽此四十四年五月內閣奉上諭熱河自皇祖建立山莊以來迄今六十餘年户口日滋耕桑益闢儼然一大都會禮樂百年而後興此正其時曽於丙申秋降旨添設學校書院加廣庠額以教育而振興之並相地鳩工建立文廟兹鑾輅來巡適屆落成親詣行釋奠禮宫牆泮水間青袍環列彬雅可觀從此文化益當蒸蒸日盛第現在庠生已有五十餘人均應與順天鄉試雖丁酉科曽經中式一人但邉外士子朴魯者多恐尚未能與通省貝字號每卷校藝獲售著加恩照宣化府之例另繕承字號每科鄉試取中舉人一名俾士子知上進有階愈加鼓舞俟將來文風漸盛人數多至百餘名該督臣學臣再行奏聞增額以示嘉惠上塞士林多方樂育至意該部即遵諭行欽此設學事宜乾隆三年議準熱河於雍正年間設立承德州未經建學今該州遵立義學延師訓課童生至二百五十六名自應量設學額照奉天新設州學例嵗科考各取進文童六名嵗考取進武童四名額設廪增各十名以逐年考試優等生員漸次充補俟廪額補足時三年一貢至八溝四旗同知通判所轄之漢人亦準一體與考其寄居流寓之人不得混冒七年承德州裁生童歸併密雲縣考試乾隆四十一年十月禮部等部議準熱河建立學宫事宜一文廟地基奉旨指定熱河城隍廟之東其工程事務交工程處辦理所有大成殿明倫堂均以仿照內地規制應行相度建造之處統聽管工程大臣辦理一每廳各設義學一處延請品學兼優之士分司訓課其束修膳金並生童膏火等項銀兩俟建設義學後按年報部動支一從前承德州學額取進文童六名武童四名其時祗有熱河喀喇河屯二處童生應試今七廳地廣人多較前已增數倍自應變通加額俾知奮勉嗣後嵗科二考熱河一廳每試取進文童四名其餘六廳各取進二名嵗考武童減半取進將來人丈日盛如應酌議增廣再行請旨辦理一熱河生童向係歸併密雲在通州應考今仍照舊考試將來人數日增應否於熱河地方添建考棚之處再行請旨辦理其鄉試一體編入順天北貝取中一七廳總設道學教授一員額定廪生十六名每逢嵗科二考將優等生員挨次拔補俟廪額補足照例三年挨貢一次十二年拔貢一次一熱河本無土著凡流寓民人身家清白寄籍二十年者俱準考試初考童生之時尚無廪保應令各廳查明飭取地鄰保結收考取定名數申送道考由道轉送學政考取入學將來廪額補足之後照例令廪生保結其有現在口外居住業於密雲等處入學者準其報明改歸熱河應試十一月管工程處尚書英亷等奏準恭查熱河建立文廟臣等遵照奏準燙樣按例詳細估計得熱河城隍廟之東新建文廟大成殿五間碑亭三間大成門五間崇聖祠五間東西配廡各十一間尊經閣五間犧牲所三間省牲亭一間明倫堂五間東西齋房各七間教授衙署一所泮池一處橋一座櫺星門一座東西牌坊二座大成殿前月臺一座焚帛爐一座門樓四座等項估需銀七萬三千二百二十九兩二錢請在熱河存貯備工銀內支用其應造龕案神牌籩豆供器及樂器舞儀等項應會同禮部太常寺查明另行辦理再查此項工程係在熱河地方修建請派熱河道明山保就近會同臣等派出之司員一同敬謹妥協辦理於彈壓稽查並錢糧工程均有禆益十二月禮部奏準熱河地方每歲夏秋為聖駕巡幸之所今特興黌序廣勵師儒文物聲名宜從美備現經臣英亷等照國學大成殿龕案陳設欵式遵旨辦理所有兩廡及崇聖祠龕案並各神牌位次均照太學成式製造安設至祭品樂器及一切供器等項除所供特頒周時法物外臣等謹查照太學所用各器另偹細册交臣英亷等如式制造再查太學例用文舞生三十六人樂生五十三人執事生二十八人應會熱河道轉飭所屬慎重遴選照太學名數充補由太常寺酌量揀派熟諳音律禮儀者前往教習如恭遇皇上駐蹕熱河或親臨行禮或遣官行禮樂章照太學所奏其香帛祭品應請照致祭闕里之例由地方官備辦若係該地方官承祭之時所用樂章祭品等項均照直省學宫辦理四十三年三月吏部等部遵旨將喀喇河屯廳改為灤平縣八溝廳改為平泉州四旗廳改為豐寧縣塔子溝廳改為建昌縣烏蘭哈逹廳改為赤峯縣三座塔廳改為朝陽縣又議準將熱河道教授學改為承德府教授又現奉諭旨建造考棚俾生童以就近應試其原定入學名數尚少應再行加增承德州原額四名加增二名其六州縣原額二名各增二名俱𨽻承德府學俟將來六州縣入學人數漸多另於各處建學以昭聖世同文之化七月吏部等部議準承德府屬各州縣童生照例録送承德府覆試其府境童生該府考後即送學臣考試毋庸再由道轉送又府州縣增設學額所需貢生旗匾并文武舉人進士盤費坊價等項銀兩在通省額設留支銀內撥給文廟在承德府治之東東西牌坊各一座向東額曰教垂萬世曰道洽八埏向西額曰執中含和曰參天兩地中櫺星門牌樓一座額曰化成久道內泮池一大成門一座內碑亭一大成殿五楹正位奉至聖先師孔子神位御書額曰廣大中和聨曰有開必先冠古今而垂教化無思不服合內外以振文章四配祀復聖顔子宗聖曾子述聖子思子亞聖孟子十二哲祀先賢閔子冉子冉子宰子端木子冉子仲子言子卜子顓孫子有子朱子東廡十一楹祀先賢蘧瑗淡臺滅明原憲南宫適商瞿漆雕開司馬耕梁鱣冉儒伯虔冉季漆雕徒父漆雕哆公西赤任不齊公良儒公肩定鄡單罕父黑榮旗左人郢鄭國原亢亷潔叔仲會公西輿如邽巽陳亢琴張步叔乘秦非顔噲顔何縣亶樂正克萬章周敦頤程皓卲雍先儒公羊髙伏勝董仲舒后蒼杜子春諸葛亮王通范仲淹歐陽修楊時羅從彥李侗吕祖謙蔡沈陳淳魏了翁王伯趙復許謙吳澄胡居仁王守仁羅欽順西廡十一楹祀先賢林放宓不齊公冶長公晳哀髙柴樊須商澤巫馬施顔辛曹恤公孫龍秦商顔髙壤駟赤石作蜀公夏首后處奚容蒧顔祖句井疆秦祖縣成公祖句兹燕伋樂咳狄黑孔公公西蒧顔之僕施之常申棖左邱明秦冉牧皮公都子公孫丑張載程頤先儒榖梁赤髙堂生孔安國毛萇鄭康成范寧韓愈胡瑗司馬光尹焞胡安國張栻陸九淵黃幹真德秀何基陳澔金履祥許衡薛瑄陳獻章蔡清陸龍其崇聖祠五楹祀肇聖王木金父公裕聖王祈父公詒聖王防叔公昌聖王伯夏公啓聖王叔梁公先賢顔氏曾氏孔氏孟氏先儒周輔成程珦蔡元定張迪朱松文廟東首御座一所宫門一座垂花門一座尊經閣五楹神厨一座神庫一座犧牲亭一間文廟西首學門一座垂花門一座東西齋房各七楹東曰進德曰日新西曰修業曰時習明倫堂五楹教授署一所釋奠儀注四十四年五月上駐蹕熱河時文廟落成丁未親詣行釋奠禮上御龍袍補服乘輿出行宫入大成左門降輿贊引官對引官恭引盥洗由殿中階進典儀官唱樂舞生就位執事官各司其事贊引官奏就位上詣拜位立典儀官唱迎神司香官捧香盒向上立唱樂官唱迎神樂奏昭平之章司香官進至香案傍跪贊引官奏上香上詣先師孔子香案前上香畢復位立分獻官就四配十二哲位前上香畢各復位立上行二跪六拜禮典儀官唱奠帛爵行初獻禮獻帛爵官各捧帛爵向上立唱樂官唱初獻樂奏宣平之章上跪讀祝官讀祝文畢上行三拜禮典儀官唱行亞獻禮唱樂官唱亞獻樂奏秩平之章典儀官唱行終獻禮唱樂官唱終獻樂奏敘平之章典儀官唱徹饌唱樂官唱徹饌樂奏懿平之章典儀官唱送神唱樂官唱送神樂奏德平之章上行二跪六拜禮典儀官唱捧祝帛香饌恭送燎位上轉立東旁望燎復位立贊引官奏禮畢對引官恭導上升輿還宫禮成賜順天學政汪廷璵大縀一紗一承德府教授米天瑛舉人薛聨元生員陸光儒等紗葛有差賜太常寺司樂官樂舞生等葛布銀錁有差翌日順天學政汪廷璵率教授舉人生員等奏謝上言欽惟我皇上統備君師化覃中外率俾暨光天之下千百國文德同昭用敷肇建極之原十六字心傳畢貫涉星波以負笈重瀛之紳佩偕來遍月窟而橫經逺徼之詩書齊肄惟興州之奧壤當朔野之名區自全輿歸形訓之官遂沃野成甸廛之會駐軒皇之華蓋豫逰常奉鳴鑾築堯帝之茨宫會極歡臚合瑞乘六龍而時蒞巡行垂法祖之猷屯七校以從搜肆覲展朝宗之典塞田留熟慶數千里匝隴桑麻仙館那居看十萬户環闉煙火班初升於赤縣彌覘地産殷繁志已蕆於黃圖尚軫人文朴略念序庠其有制聿遵太學之成模謂富庶其何加宜迪聖人之至教因誕敷夫恩綍俾特建夫新黌度爽塏而初營泮水則半規浮碧峙桷楹以並作宫墻則萬仭飛翬爰嚴栗主之隆儀仍凖戟門之令式禮崇文廟揭日月以升東號冠熱河紀山川而從朔秀鍾武列知衆𣲖之同歸瑞拱興安仰髙山之在望當採芹而思樂躬臨甫迓鸞旗乃釋菜而觀成展謁還紆玉輅盈階吉佾儀比圜橋列几嘉籩輝分闕里辨􅉔協竒褒之節啓萬乘以尊師陪禋偕奔走之司鏘六成而洽禮勒擘窠之巨榜墨海蟠虬摛紀事之鴻篇文園翥鳳嚮學而員稱弟子集舒雁之青襟分齋而職領師儒擁銜鱣之絳帳東西矗舍風廊列號爭排科歲分期棘院重垣初築席羅廣厦抽毫之晷刻添長榜展藝林鼓篋之姓名增置臣等班隨扈從獲與趨蹌會際鼓徴肅齊觀聼萃名都而陶淑欣依風雨之大和瞻盛典以軒鼚長頌星雲之丕焕又學政汪廷璵奏謝另編鄉試字號中額上言洪惟溫源衍脈㴠濡化溯於豐詒仁嶺鍾英環拱象符乎斗運萃神臯之廬井人服先疇沃奧壤之耕桑戶敦古處由耕而讀蒸然聞一邑絃歌既富且安久矣待百年禮樂往者畿闈籲俊曽徴擢秀於此邦今兹黌舍增員疊荷推仁於多士固已鴻慈髙厚合中外而甄陶文治光華遍膠庠而抃舞復以翠華蒞止迎鑾輸傾藿之忱丹殿觀成鼓篋引採芹之彥顧青襟之禮讓深嘉佩服雍嫺期紫塞之書升猶厪藝文弇朴敷作人之教化同文咸會車書定編號之章程加惠特宣綸綍沛新恩於省試一鳴爭獲雋之竒凖舊例於邊庠七屬與觀光之選企賢書而自奮入關皆歌鹿而來佇慶榜之旋開發軔即登龍而上日新月盛將聨翩更叶茅茹霞蔚雲蒸庶藹吉盡成桐菶臣幸逢盛際備荷隆施頌雲漢於中天鼓春風於大造朂肄三之始業願諸生勉副旁求仰御六之時行慶全郡遹臻郅治欽定熱河志卷七十三
