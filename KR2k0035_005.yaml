body:
  text: 山店內子山店誅茅亦易成居民火種復刀耕孶豚處處牢堆石防虎家家柵樹荆粗糲聊安衣食計逍遙且免市鄽征前驅俞騎休呵譙政欲窮簷悉隱情朝嵐朝嵐夕靄人常言率擬霞標而已矣不知斯亦氣流行如潮汐自滄海起兩山之間必夾川萬澗千溪滙於此嵐靄定從川下降倒行逆施無其理塞上厥候益分明曉暮添衣乃所以濛濛淰淰中嚲鞭自逺望之謂雲裏暖出關颯生涼塞上疑已霜崖口昨來入反覺暖異常亘嶺樹多緑綿谷草未黃侵晨著絮衣卓午換祫裳對時體溫肅隨地愛景光九月朔日秋惟季月清塞至興安迥潦盡潭益澄葉落山愈靜松蒼識徑節楓丹繪餘景肄武既云要勞衆亦應省事鮮兩全方為是頻耿耿霜盧龍真是塞青女每先時不待雲鴻報還惟巖鹿知素華明蓋羽颯冷拂鞭絲為憶從軍者天涯露宿披山月依依漸出林冏冏高映岑瑟瑟秋方季寥寥山復深網水上下光呦鹿悠揚音颯景自伊古靜會偶於今徘徊入我窗武帳延清襟坐見林巒間適者獵騎駸生風興固豪耐可間對心雪破曉雲濃傳罷獵霑衣將謂雨霏絲須臾亂灑氷花落塞景離竒幻若斯翠柏丹楓瓊蕊結側峯橫嶺玉屛開營邱畫與樊川句問爾何從見此來既密還疏飄散漫雖寒不濕靜便娟便教收取三清煮武帳由來有宿緣丙寅十月定興道中雪水煮三消茶曾題句遇閏遇閏深山秋益深每因趁暖一幽尋松盤嶺腹蒼中翠葉落波心靜裏沉鹿度巖邊看活畫禽嗚林際聽仙音養生自是斯間好勤政名軒敢忘欽暖通閏秋偏長關外侯尚暖乘時種宿麥翻犁趂間緩塞墐既已畢衣食粗云辦叶閭閻象安恬繡衣何必遣因知為政方居敬而行簡寒一夜山風急曉來生峭寒炎涼變何速消息理憑看坐愛當窗日遊遲隔水巒獨思扈蹕衆寧不怯衣單古澗泉古澗泉淙淙滴滴幽崖斟若冇若無斷且續盈科不競淺復深却如南華已稿之木又如五栁不絃之琴古澗泉惟應印古月以為心閏九月九日作遙村近墅霽煙光立馬崇椒了不涼自是登高宜上塞不妨把菊閏重陽天臨澄廓目因逺樹謝繁華意轉長邇以捷音待西北每當勸樂轉倣徨明窗山房淺置簷曦牖暖烘幕溫暾晃陽林朔氣避隂壑儒擬白駒速農喜黃棉著綈几陳藝編稽古一斟酌衰盾殊愛畏潔矩知所託積素積素迷離隱翠嶠朔天見晛未云消連村畫景張橫幅著樹梅花發野橋駝法石溪銅鐸細人投茅店酒旗招鳴鞭為卜邊關內可得盈疇被麥苗暖一線巖關變涼暖雪無餘白樹留青盈沖詎是移天紀起屬由來據地靈關內常暖於關外或謂一墻之隔氣候頓殊不知長城原據太行之幹而築山界南北涼暖自殊此理易知耳僕役衣單宵免歎圃場稼納嵗方寧謂宜慰矣翻悁悒西北捷音亟待聽秋熱丁丑關外逢秋熱忽如夏杪時葛收葙欲換扇衍篋重持每逐含風爽還思蒸兩滋天恩各知否華黍待成遲雨關外夏雨少山田早憂旱遣祈即霑澤稍救嘉種晚谷中緑回蘇黃萎惟山坂邇來厯厯看歉狀嗟盈眼晚蕎及秋菜皆可濟餐飯既蘇復待滋為之愁展轉夜雨聽枕上聲細意不滿陵晨巖雲重作勢續復斷蓄極乃大霈一洗餘威暵隨處為祈年詎止恣遊衍晴密林兩日極優霑既雨宜晴意為忺玉宇逈澄斜漢影絮雲已避逺山尖樹將暖旭輕籠牖花與香風並入簾稍幸樂成憑閣望晚禾半得有秋占八月朔日作天光澄綘河雲影斂青螺最是仲秋屇偏饒塞景多對時協平秩昔日此卷阿霽色生餘暖還欣利晚禾細雨細雨剛經五日才灑空􅓴雭復徘徊晚田恰喜蘇秋後野老都云帶澤來逺浦煙輕紅泛蓼斜蹊濕重緑漪苔祈年法祖吾恆願慶慰寧關天馬徠是時哈薩克頭目頻有投順者已遣使在途尚未至云遣懷豫齊數郡災賑賙亟籌畫遙心繫淮徐沙刷幸免厄畿南乃波及昏墊為愁劇關北復遭旱吾來始霑澤三輔雖有秋遏糴非良䇿所以粟轉貴天恩殊可惜近京一帶自春徂夏晴雨時秋成可稱豐稔因畿南被災商販轉運歉處取利而關外歉收又無入口之米昨京尹奏秋收九分而來價轉貴者以此一心周九宇曽無可逸隙山莊縱自佳耽佳豈可得初月初見中秋月還於避暑莊一鈎清不盡萬劫朗如常溪水依微瀲巖林掩映蒼倚吟兼睪望那礙晚風涼即事衣試輕寒添幾多野流無定繞陂陀緑雲底事紅霞襯始悟巖楓宿雨過山行山行不用命巾車徹步尋幽亦足嘉漲影過橋留枿莾曦光落澗起煙霞園中晴雨峯峯别塞外暄涼日日差何事未曽忘結習觸懷便擬試吟義八疊中秋帖子詞命扈蹕詞臣和之有序玉宇宵澄月屇秋中而愈皎屛山雲斂地臨塞上以彌清不有新吟何酬令節聿溯宜秋綵帖裁詩肇自丙寅駐兹避暑仙莊廖詠續成丁卯嗣是磧山帳殿載舉前規時當大液秋風咸循成例環周一紀氷輪常映氷心疊和八巡勝賞仍於勝境益廣詞林之典故並增嵗紀之華編令人喜亦令人間端正何須藉斧刪塞外偏饒風雅地試看玉䨲上錘山三千世界一輪光金粟依然發淨香妙趣風人如會得解頥應勝鼎來匡藉甚丹青命晝師曲屛八疊恰成詩湧金漫説錢塘好一例氷光瀲磧池山髙底事上層樓又紀清光丁丑秋風景皇州爭較異綵棚瓜餅貨街頭山村山村厯巡農築場納稼早問雨夏曽霑稍救青苗稿所以秋成况較迤南頗好額慶為茅簷庶得二釜飽共喜室家完且免租賦擾括田亦奚為藏富原有道谷中谷中落雨髙山雪向北應知氣候涼陡憶熱河遙隔嶺回蘇晚稼未登場急教巡視馳煙驛且課倉箱厯野莊彼此原多遺􅕗穗便皴峯玉審何妨雨三首海喇汗常靈應明易為雨亦易為晴重輜都過午圍罷霑灑秋山舍洗清塞上靈應山蒙古語謂之海喇汗不敢直稱其名也凡車騎經過其側無不雨雪俗云洗山屢試不爽空羅縹眇復舂容塞上煙光每慣逢最愛雨收霞腳露倚天玉積幾髙峯聲聲銀竹奏笙竽潤景寒山故愜豫倚著方窗聊縱望石渠似展米家圖夕錫宴駐行鑣乘間興亦饒夕陽隱西嶺暝色逼疏寮月上山空濶風過樹寂寥雲軒歸靜憩清夢或逢堯熱戊寅關外秋禾勝去年攬轡沿途為慰恱山莊近逺罨黃雲晶陽邇日更蒸熱固云時燠催西成當秋炎恐乖素節紗衣傍午欲換葛松牖延颸復搖箑菜畦苣圃胥待潤山岡易燥金曦烈因思涼雨一湔溉蕎麥作花方似雪情知萬事難兼全惟兾兼全意方愜微雨微雨聞清夜情知未即霑山田多益善塞苑冷何嫌菜町葉方茁蕎坡花尚纎老農與老圃寧識慮常兼雨塞山易作雲今秋乃艱致展轉切望霖晚田漸憔悴觸石膚寸合靈雨盆傾至既放更悠揚綿􅉈飄長勢婪熱復何有乍可夾衣試蕎黍總回蘇瓜菜泊餘惠去嵗關外旱來即叨明賜大田雖無救遲稼半穫遂今年早收定雨暘頗愜意邇來方待澤此雨真稱瑞勤民無間心祈農寧較地却懸關內望曽否均霑未驛章至知京師亦望雨詩以志事昨對秋霖偶繾情驛章今遞自都城一般蕎菜原需澤草日風雲太過晴敢以黍禾穫為解惟兹宵旰慮常縈先憂後樂本吾分終覺樂稀憂每盈塞山塞山過雨易生涼清曉居然换夾裳谷口沙含漲影退樹根草挂蔓絲長稱心野景呈虛牖極目秋田蘇逺岡傍午轉暄真恰當為催萬頃稼雲黃新月眉細中秋月冰寒欲滿空塞山髙見早素景逈難同瀲灧滄池浪徘徊疊樹叢錘峯玉臺是團鏡待懸東夜雨怪底山涼切枕衾􅓴􅓴夜雨落空林繼霑更較前朝渥疏滴旋聽密點斟楓葉不殊蕉葉響早田望到晚田心􅒴非急陳應遐被佇擬京師報喜音即事厄魯蕩平回部連止戈畢竟是何年固緣弦上矢必發終愧階前羽舞旋勃律正聞踵來接堅昆佇待首誅駢山莊行慶暇奚念念到庫車阿那邊涼曉起居然愛向陽塞人能爾變炎涼篋中率欲藏輕扇林下無煩泛野航且喜秋雲才過雨亦愁白露乍為霜一愁一喜緣何事萬頃田雲漸作黃雨山雲過午重秋雨帶涼來益覺蕎蔬好雅宜松竹陪霈膏霏亦易婪熱滌如摧京報霑仍兾昨閲驛章知京師雖得微雨尚兾大霈南瞻慮幾回京師得雨志喜京報傳來􅉈澤充北南霑潤一朝同十三日熱河逺近同時並得透雨那當秋日還喜雨慰在其中愧在中街頭米價早稱平京城秋初糧價稍昻命發倉米分糶近已平減却為晚田望澤怦蕎坂菜畦生意轉欣同農圃待西成遣興遣興寧蘄辭騁妍山莊書史足精研一心不息庶少過萬事由來忌太全詎以內安忘外靖那期後樂祗夏先題詩四壁驗今昔政學均慙尚闕然䇿馬䇿馬度山村過雨蘭蹊淨髙下稼滿谷穗飽纍垂柄便霜亦不妨西成料已定去嵗此間旱經過切憂怲今秋償倍蓗額手為深慶承平户口滋榖寶繫民命內地無遺利關外率墾竟一例祝倉箱豈復分庭徑設以漢唐論守在此所屛今古實異宜要在因時應保泰凛三無敕幾勤八政詠挂瓶大邑冰瓷巧就模擷芳隨處貯瓊敷郵程水陸延羣玉風月三千護蕊珠不是文殊命章子定為長吉背奚奴一塵弗染諸緣靜豈識尋常冇菀枯即景拂廬幾點曉霜輕跋馬剛欣卜爽晴問景雅宜詩外趣合圍總在畫中行塞山涼暖渾無定巘樹丹青最有情詎謂從禽忘一切庫車時刻念怦怦俊鶻驄歌烏良海獻胡青驄天間牧養經再冬本是俊骨易調習今來偹駕秋圍中左旋右抽盡如意發小殪大皆從容一馳疊獲鹿曰兩再馳更斃狐之封千二百騎所共覩無此此輩惟面從致力可息佳名賜亦不啻力德並同九月朔日作策馬凌晨了不涼縝紛疊巘錯青黃望中九日節將到塞上今年暖異常漫學鹿虞嫌候舛鹿嗚於秋分前後入哨率候是時今年秋暖故鹿哨尚未盛也欣同菜圃慶秋長待圍每選嘉隂坐攬景從容有句償題董邦達畫二首秋林絢采嶤峯雄厚落飛泉萬葉含霜綵翠鮮命意由來非蠁像得從扈蹕寫真詮宿雨含煙曉煙欲泮意猶酣野彴蒼蘆鎖碧潭應是中庭動秋思遄飛逸興到江南九日木蘭雅合度重陽處處登髙是勝場漢殿空傳蓬餌食拂菻還識鬱金香時布魯特隨國亦預宴賜唐書勃律傳地宜鬱金緑莎宜馬滋逢暖紅葉藏麋艷鬬霜小矣淮南稱盛會鴻絧萬騎總軒昻熱己卯十日前關內倣徨畏炎熇蒸雲懼為霖更慮暍輿僕五日前關外曉寒峭巖谷長此將早霜禾黍尚芃緑即今晴已定况復駐靈囿轉燠審無妨晶陽喜髙暴絮衣脫换紗叢樾爽風逐今秋已過閏情知涼應速此熱實利稼秀實催嘉穀靈臺非舛測農扈有厚福何莫非天賜為民額手祝中元夕放河燈過閏節占白露早便教塞館度中元却因少見翻如創底識推遷不者存夜浦愛看分芰炬野塘亦自有蘭盆金仙無物不超度何事林間鹿避喧待月西峯復下登舟賞玩山莊泛月偶一逢况值新秋清且美過望而復蔽東嶺白傅詩中悟其理急則計生因尋山敵則氣作且置水跋馬西峯最高處下視東嶺乃眼底不踰時尚未黃昏東海湧出銀盤子大千世界一廣寒棗葉須彌難比擬徐徐䇿騎下崇椒月隨我共登舟矣謝家高致昔留詩别開生而惟豫始設云卿士在箕疇旁求若濟亦將企詠唐時回銅器有序山莊舊藏古銅器一似豆而短足初以為三代青録耳迫視之形不叨餮銘不乙丁金銀錯其文則似回字令吐魯畨哈密回子等識之惟識噶愛兩字其餘皆不辨蓋彼經文亦有今古之異人不能盡曉也嘗考回鶻唐時始通中國史稱其先丐奴勾奴與今之蒙古相類則回回並非蒙古且殊教也元史始有回回國之名或稱其為大食國種大食在西域此稍近之明邱濬以為陳隋間始入中國在在有之在在有之者亦云其繁滋漢土者耳其的𣲖固不離西域也今平定葉爾竒木哈什哈爾此實開闢以來不異之回地回人若布魯特若哈薩克皆其蔓延繁滋或雜蒙古種者有之若唐史回鶻傳所稱善騎射喜盜鈔者實近厄魯特之習而非回人所能徒以回鶻音近回回因屬之纒頭之類耳究之耳食舌傳魚魯千里將以餘暇博考此姑俟之所喜者適獲此器於平定回城之時殱厥渠魁繫以白練兆在斯乎兆在斯乎故從而為之辭不是辛尊與啓匜考時應入李唐時纒頭回鶻人斯用餵肉葡萄宫所遺噶讀作平聲愛旁行粗可識水斯古籀豈咸知遷其重器兹先兆佇待俘來罷逺師午暄邇來候轉炎山雨昨夜洗驅盡婪尾熱峭涼侵袂矣豫心望晚稼未可便長此午暄暴晶陽華黍風尤美如是期十日黃雲庶可擬射巡狩寧稽除授官門前次第引來看隨村簡職仍餘暇以已先人與衆觀弓燥手柔秋正好侯空鵠揭月輸團鄭司農云方十尺曰侯四尺曰鵠如是則宜其百發百中矣今所謂把子者高四尺寬一尺以之試箭若鵠則周團僅止一尺而五層其中的則徑寸耳以之試骲頭所謂侯者方不過六尺空其中以懸鵠俗謂之檔子者也或中鵠或矢出其空處尚可若中檔子反有罰矣髫齡回憶原兹地屢中親承仁祖歡康熙六十一年豫年十二扈駕皇祖臨門引見罷輒常蒙命試射以示諸臣時曽屢中每承七年天語褒嘉回思卅事如在目前王維烈芙蓉秋鴨霜寒北漠鴨南回幾朵芙蓉貼水開正是山莊秋半景畫家那得見兹來聞京師得雨志事去嵗山莊遙盼澤去嵗秋旱關內關外無不望雨今年京縣渥霑膏此間不雨熟已定關外雨則氣寒早霜兹不雨實為宜也彼處即晴惠正叨京兆奏至雨後即晴甚叶農候云內外黔黎均意厪艱難稼穡為心勞候暄程改駐清蹕本擬七月十六日啓蹕往木蘭以候暖鹿未哨移於中秋後起程消得林泉興一陶新月一搯爛銀鈎可望不可揣堅欲玉尺量却入西林裏漢邊斂雲片庭前舒桂蕊情知中秋遙珍惜早爾爾全體本無虧示沖有如此涼半夜西風曉驟寒數聲霜信度雲端前朝跋馬看山稼逮熟無妨意為寬即目即目真情體物知鶴糧或竊鶴啼飢青田誰為供芻粟可使由之意若斯中秋帖子詞九疊前韻有序晶盤瑩采九十平分金粟馡香三千遍滿寄崇情於玉塞延麗矚乎雲莊原夫閏律暑遲田畯佇登禾之喜邊垣秋晚虞人需戒道之期看來鶴鹿皆馴祖澤常懷文囿聽去笙璈並韻慈顔近侍瑶池重隄曲水杯流虛白毫光和寶剎浮圖互映半壁高峯錘照空青黛色與降蕃列帳交縈遼哉萬里同晴關外歡聲傳擫笛捷矣百城俱下湟中徑響應宣鐃想一軍振稿先登快甚吳剛斧琢知二豎擒生立致迅逾博望槎回既開桂殿長筵將啓蘅臯清蹕紀旋鑣之盛事合勝停鑣賡秋帖之新裁宜過春帖曩者四篇製就固已都捐霓羽靡詞兹焉九疊吟成庶幾共叶莖韶雅奏云爾勝地良辰可放間携來詩稿自刋刪開編恰是中秋帖即事重吟玉塞山朗照寧分中外光揮毫墨染桂花香興州景詠才四度合京師木蘭諸處九疊前詞於山莊已為四度帖子矣西極功成逮一匡洸洸猶有逐回師獲醜佇成奏凱詩雖共儒臣賞佳節厪懷遙在察汗池二酋逃往之地欲招東魄上西樓略覺山寒不礙秋風月宜人𢋫九疊光隂瞥眼憶從頭登樓餘間聊爾試登樓近逺山田報有秋一月幾回開口笑萬幾無間悉心籌錘峯早上團圞魄濡水寧殊今古流此夕此時祗宜樂為懷西旅却增愁所見墾遍山田不剩林三十年以前凡關外山皆冇木可獵今則開墾率遍不見林木非木蘭獵場禁地皆不可行圍矣餘糧棲畝幸逢霖不教緹騎輕蹂躪能忘蒿宫惕照臨愁以得之慰亦切難而獲者惜猶深可知攬轡徐行處多少思艱圖易心涼六韻昨日塞雲重興安想雪飛迫來嵐氣峭迎去曉暾微復障聊成憩平林旋合圍蹄輕宜獵騎身冷換旃衣氷凌去聲隨溪下霜華到午晞馳驅藉取暖屢屢玉鞭揮八月二十三日皇考忌辰作二紀倐成昔一悲直至今北來秋序每南望白雲深善繼曽何有時思益弗禁從頭讀遺詔豫小子每值遺詔皇考忌辰必盥于恭讀一過志不忘也敢不勵初心捷報逆酋霍集占兄弟一創於霍斯庫魯克再創於阿爾楚爾勢蹙窮竄將軍富德等急躡之於伊西洱庫爾光拔達山連界地也時賊衆據峯負固我兵整陳剿擊中發大神威逺炮兼簡偏鋭用鳥鎗夾攻賊中有伯克等悉其大隊呼籲乞降霍集占自山頂遮截至手刃之不得止而我兵四路設伏盡起有徒步援絶壁進者轉戰一晝夜賊遂大潰計獲賊衆一萬二千有竒鎗械二千有竒牲畜一萬有竒逆酋僅以殘衆四五百人逸去富德等傳檄拔達山部長曉譬順逆令其尅日縛獻至是捷聞朕以二酋一日不獲軍務一日不竣雖仰賴鴻庥收城服衆而旁午擘畫何能釋懷爰志長言佇期永靖詎得已哉待圍小憩坐孱顔捷報飛傳達玉關奏牘機宜悉覽遍降蕃輜重盡遮還千軍直進伊西洱二堅旋逃拔達山除蔓斯之未底定可辭畫䇿旰宵間九日萬嶂嶔崎天泬漻木蘭菊節度今朝登髙即目無遺照在上惟懷不敢驕勝地恰宜風雨度是日微冇風雨芳筵兼聽管絃調以節日賜食近臣那易知冇喜劇待佳音正不聊時將軍富德等遣使扳達山諭擒逆酋和卓木兄弟尅口往返通計軍報旦夕當至行在深用厪懷野郵築場納稼石田收塞景寥蕭野郵兩嶺蒼煙連樹迥一川寒水共秋流罷圍聊可輕輿御自御啓行至出哨日乘馬罷圍始御輿邇年來率以為例有暇何妨警句酬回望雲山縹眇處幾多清興彼中留題金廷標畫疊前韻庚辰畫境兩疑然精神會一川開窗山宛似題句韻還連樹疊蒼茫嶺雲澄碧落天丹青本無翼到此訝居前舊作有寄教粘素壁待我印當前之句懋勤擕來預張壁間矣夜雨枕上淅瀝聲秋宵落山雨隔窗想颯沓度嶺鳴林楚晚田率穫罷潤尚滋蔬圃明當駐行蹕夫誰漸石苦雨可晴亦得幸值忘憂所夕靄靄萬山蒼蕭蕭一谷涼天河真覺近秋夜漸添長箭永蓮華漏篆消心字香可忘銀燭下籌筆昨年忙詠木變石千年木抱石為胎根柢糾纒猶木理名之為木已换形黝然古澤芝朵紫繩墨既不中琢磨非所擬材不材間全其天此木實達蒙莊旨村行三首迤北天寒惟一收一收豐亦擬三秋村民乘暇翻犂地播榖憐他隔嵗謀崖角山巔無隙地刀耕火種有餘思村童也解迎清蹕恰似蓬頭王霸兒一川流水百盤澗碎石堆筐架野橋撇捩何妨䇿馬渡秋晴正值漲䀶消夜雨半夜星羅宇四更山吐雲隔窗霏勢擬欹枕颯聲聞農務既云畢間情且自欣明當詠蒸涉亦欲習勞勤雨中塞上行夜雨連晨勢未已行旌先發難中止文侯罷獵必親往我亦何妨一仿此白榆緑栁時逢迎快哉雨中塞上行杜老前後則何有周王左右堪同𢋫製衣䇿馬跋泥淖誰言秋雨弗濕帽國語有秋雨不濕帽之諺謂秋雨不能久也行宫駐蹕豈不佳習勞先去聲衆從吾好鑾儀衛率校尉隨輕輿逸坐那肯為內扎薩及外厄魯櫜鞬扈從瞻威儀巒姿林態渾難狀配藜旁魄復滌蕩萬馬奔騰如萬舟雪浪銀山陵漭沆北人使馬南人船一合相真成大觀山村老農笠底笑明春種早不待言夕雲歸髙岫塞天明徒倚山寒向晚清那似去年臨此地驛章旁午策軍情復雨山雲散復聚塞雨密還疏度嶺幻明暗隨風作疾徐不妨徑策騎也覺厪漸車關內正滋麥欣生跋涉餘晴塞山捲下西北風怒號萬竅真是雄煙銷雲散無留蹤朗朗秋日懸髙空今朝晴定真堪喜明日大獮方伊始吉行五十里而遙後行輜重應至矣抱被入直庶免嗟試問誰匪懷居士塞山雪景夜帳摐聞雨點飄朝來玉色染崇椒凹陵旋旋因風積陽巘微微見晛消未凍煙蕪鹿正肥平岡磬控馬如飛何須濶論山隂棹九月木蘭雪打圍細莎嫩蘚全藏色翠柏丹楓未改形一谷溫暾迎曉日不妨按轡為延停松林獲鹿美於羊帶濕松枝燃亦香僧舍茶煙故清絶朝家古俗那宜忘玉屑銀沙萬嶂鋪尋蹤還擬捉於莬毳衣箇箇誇披得誰識詩人鄭鷓鴣千峯隱現曉煙濃活晝宜人面面逢實景真情欣始遇祇疑摩詰出形容晚晴晚晴明積素巖景益堪竒鏤玉為屏際斂雲歸岫時入圖浮霽色敲句引清思今夕蝦蟆冷東山故上遲立冬九月晦日平在元冥令來遊龍朔垠莭因行慶駐志詎暢觀勤京國風占候每當莭候太史例占風塞天霽斂雲小陽春律暖是日暖亦為從人欣題張宗蒼畫山莊驀見宗蒼畫向未題詩輒補題曲折雲林皆可入髙低澗道訝才躋誰分幻境將真境道是全提早半提昔失當前今鄭重羲辭聊擬玩先迷射射是朝家夙所長承平遊豫那宜忘擕來新附控弦部駐此當年避暑莊親御矢弧聊示度數頒幣帛用旌良樹侯疊中休稱頌是日發矢二十七中十之九破的者六及易小鵠復連中舊部新蕃監哈薩克陪臣侍觀者無不喜躍稱異敬仰前猷敢不蘉暖今年秋候長入冬氣尚暖朱鳥升東林騰暉巖谷滿羣稱及嚴寒今年圍期較遲俶裝時皆以歸程正居冬寒而邇日序尚暄和與往嵗回蹕山莊時無異忘之以轉眼堪因􅊖人情忖度寧待逺弦月弦月上嚴節氷天見塞山隔林猜窄濶輾漢疊團彎寒迫煙嵐峭光含網水潺創觀緣底事尋鹿入宵還曉鳥鳴當天雞山含曙色曉嵐涼雖淰淰空宇猶浩浩子輿稱旦氣調御乃成道於焉悟軌塗契會殊不少居髙山樓枕碧嶺小坐念居髙望治心徒棘勤民目久蒿言多後從面疵或索吹毛即景懷慙恧休云此避囂入深谷抱山還疊行行漸入深居然參理窟颯爾對寒林雲裏辨峯影氷間澀瀑音迫霄精舍構涯涘許誰尋即事冬山觸處耐吟憑呵凍摛詞興偶乘日落遙峯一片靄泉流古澗幾條氷披寒簷梠紛還鳥綴景招提不著僧尋鹿入宵歸趁月鋗人何事更張燈欽定熱河志卷五
