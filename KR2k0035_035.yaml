body:
  text: 行宫十一淡泊敬誠清舒山館戒得堂春好軒靜寄山房煙雨樓淡泊敬誠避暑山莊正殿凡七楹聖祖御題額曰淡泊敬誠宫殿榜多鐫刻兹則恭懸墨寶萬年家法心畫如存每聖節臚歡逺人肆覲則御兹殿扈從臣工暨外藩蒙古拜舞趨蹌展儀盛容仰堯􅗔之儉約溯虞典之精微恭誦宸章心源遙契御書聨曰先澤志欽承宵衣旰食民依心切念春雨秋暘東西壁聨曰四面雲山契仁夀萬家煙井念民和曰祖訓式欽思日監天行惟健體時乘左右配殿各五楹後殿亦五楹曰衣清曠亦聖祖御題墨寶東偏御書額曰寶筏喻聨曰法雲自護三乘義慧日常開四照花御製詩賦得淡泊敬誠甲申處處瞻奎藻殷殷仰聖情標言淡以泊繼曰敬兮誠明志由斯要持心在合并居存守良矱煩擾去私營易正義序不煩不擾淡泊不失無欲函三契有為得一貞堯茨垂永煥虞典溯惟精清舒山館水心榭東北山川明瑟林樾靜深以清舒山館為最凡五楹恭懸聖祖御題內曰承慶堂御書額曰煙霞澄鮮東楹奉聖祖宸翰榜曰氷奩聨曰解帶挂長松慣住山中忘鹿性披襟臨積水數行樹下識禽音西楹御書聨曰高擁三山臨水鑑勤思六宇上春臺內曰含德齋聨二曰雲移溪樹侵書幌風動巖花點硯池曰緑野明斜日青山淡晚煙後簷額曰聚雲復岫山房皆聖祖御題西南隅别殿曰蘿月松風御製詩清舒山館題壁乙丑徑步煙蕪緑染鞋藝窗小憩愛清佳數聲仙樂泉淙澗大塊文章花綴崖琴在壁間渾太古鹿來窗外識無懷秋蟲唧唧如相訴多少風光付蘚階清舒山館丁卯近樹遙峯罨翠光清秋偶此憩山房依然前嵗來遊地重撚吟髭爾許長山泉過雨冽而清更折枯枝松下烹一縷才看林際出片雲忽與半空橫蛩語花香秋未闌書屏書幌曉先寒泉淙劍峽琴誰弄橡墮苔枰碁自彈鹿來谷口窺人立魚向溪頭唼藻浮萬彚機緘歸易簡當前妙藴足研搜羲圖虞典陳班几流水高山寄玉琴要識清舒最佳處一溪一壑稱人心清舒山館己巳山館重來啓碧疏清秋景色果清舒巖風送爽辭紈扇林鳥銜花下玉除泉出石甘堪酌茗松依庭茂稱翻書今年頗覺吟情懶於此婆娑一起豫清舒山館己巳山館從來最暢情開軒况值九秋清多於前度為何事颯沓空庭落葉聲最宜觀處皆成畫於暫間時輒詠詩設使幾餘無二者更於何處遣情思霜染丹楓淡復濃扶崖鬱翠見喬松鹿鳴每向間窗聽知在蒼煙苐幾峯潦盡寒潭清見底林踈逺岫淡無痕重陽節近黃花放便是東籬處士村清舒山館辛未雲窗重此坐清舒峯翠迎人過雨餘前嵗今秋饒歷歷溪聲山色自如如單椒時下呦煙鹿芳沚頻浮唼浪魚欲倚喬松尋琥珀落來清露濕衣𥚑清舒山館對雨壬申山雲漏日午蒸炎凖擬今朝塞雨霑􅓏步長橋才瞬息珠絲先我掠前簷書館蕭秋坐雨便窗臨碧沼漠溪煙塞山楚水何分别祗覺瀟湘意與然山莊駐蹕尚斯須漸石無勞歎僕夫今嵗秋霖不愁過還愁關內飽霑無簷響泉聲互酌斟颯涼頓覺襲衣襟無端失却西峯色遼待時晴取次尋清舒山館癸酉山館悠然清且舒每來偏覺適幾除雲開逺岫蒼盈牖風過疏林紅點除雁背霜空秋意深晴和聊復一登臨泬寥邱壑無宗賞淡泊生涯靜者心映日芳菲九月菊過雲錦繡一房山縹緗隨意堪抽繹趂此秋齋片晌間清舒山館甲戍清舒舊愛三秋好却悟清舒夏最宜幽聽滿林風颯颯寒光當戶雨絲絲既深斯靜目因逺妙合而凝意與遲野雀不知人在座將雛時向緑窗窺清舒山館乙亥迤邐林扉敞碧關清舒聊趁片時間最宜天朗日晶候况復山環水抱間野卉向陽還艷冶石泉帶冷自潺湲坐中撿校前題句不隔如斯孰往還清舒山館丁丑林扉不用尋山復水之潯又是秋清候依然向會心窗含千軸畫壁有五絃琴一味寧耽靜舉頭舜日臨清舒山館戊寅座有瑶琴架有書清秋重此坐清舒禽魚總是忘機侣山水真成繕性居緑潤鋪林延爽細紅芳戀沼送香徐題詩四壁饒何事今昔分明靜校餘清舒山館己卯蘭露杉風又一時藝窗棐几小宜之似兹山館寧當負每至清舒例有詩水繞階前定無滓節臨秋仲若為遲舊題新什相聨續境詣如何藉自知清舒山館庚辰蘭蹊步入逈無塵有水潺潺有石磷山館依然臨水石一回觸興一回新浮雲盡捲東南去爽氣都從西北來明日便當清蹕啓藝窗今得少徘徊清舒山館辛巳紆步因延賞騁懷在集虛有書照今古無物惹清舒花栩莊生蝶池飛寧氏魚秋光自瀟落不異􅜼年初清舒山館壬午新秋促轡以圍期山館歸來仲序宜了識清舒最佳處可當頓置弗留詞不寒不暖娛人候有月有風速客時四壁圖書驗今昔緑窗曦影又西移清舒山館癸未山氣含清又展舒評量真是夏宜居琴書靜好晝方永衣帶涼生風入虛滿地緑雲滋秀草一湖香錦放新蕖年年題句多粘壁景會惟殊各起豫清舒山館甲申憩館自然會舒志當秋恰值最清期一天快霽與豁目幾片間雲不繫思喬樹隂中風喜拂好花芳處露常滋箇間習靜居然合却是吾恆鮮暇時清舒山館乙酉在在是仙都清舒最愜吾優遊皆道管光霽仰神模露重花房濕秋新草帶紆一年吟一度興會總欣殊清舒山館丙戌石徑致縈紆雲窗却曠芋遊睎得舒賞樂志足清娛鹿柴蹤常印蜂房蜜已輸年年有題句觸景緬軒虞清舒山館丁亥山向舒間此卜居水欣清處映紗疏智仁適會動還靜枕葄無非史與書露卉繞階香帶潤風松拂戶爽生虛曉秋景概從新閲育物對時益亹豫清舒山館戊子書館山間更水間輕輿迤邐入林關清秋舒志莫過此片刻憩躬原復還鳥識人來語益絮蛩因節至鬬頻㘖笑豫旬日方斯賞一為去聲喜新一少間清舒山館己丑林靄全收似啓扉既舒志復引清機鹿知熟徑尋常到鳥惜芳隂不忍飛境是天然嬴繪畫趣含理要入精微斯宜久坐領其妙得句便去聲旋自笑非題清舒山館庚寅假山年久似真山况有臨階碧水潺園裏斯當迤東地林端常見矗西鬟庭餘落葉聲隨步窗納浮嵐色伴間莫訝叩門新客到應為據座主人還清舒山館辛卯山莊嵗嵗臨山館秋孟匆匆忽季秋葉落隔窗疑雨落水流過砌共時流向陽暖處每久坐值暇餘中此漫遊景曰清哉莫如靜興於舒矣更宜收清舒山館壬辰緑隂深處徑尋前便有書堂枕碧川清矣衣衫如照鏡舒哉心意頓忘筌鹿看岸隔食蘋野鳥訝窗開窺簟筵山靜日長適逢會子西妙處得天然題清舒山館癸巳山館四時清惟秋清且舒何以知其然山蒼林漸疏雨後涼必增風前暑早祛騁目望則逺披襟爽有餘惟是幾政繁未能靜讀書清舒山館甲午嵗嵗有題留寧當頓置不舒懷略此際清景最於秋日逺樹隂張去聲氣􅋽花露稠門前一灣水駒隙共斯流題清舒山館乙未雲消不著片絲留氣爽天高可事遊山館由來是初至間情何必異前秋向年啓駕每於秋序即近嵗於夏月至山莊而臨此山館仍率逢秋月也清眸舒志故如此厭故喜新得免不駐此逾月而初至者雖因少暇亦因新構處率先往故自嘲云題壁年年原弗闕笑無佳句勝殊酬題清舒山館丙申緑隂喜清逺夏日正舒長遂與尋新徑依然得古堂泥融留鹿篆樹爽奏蟬簧原是常來處會心每異常清舒山館己亥山之復更水之隈别館偏宜擇向開清聽所欣謖濤耳舒懷都為快晴哉兩年嵗月如疇昔七字吟哦屬儻來身有餘間志無逸文筵未肯久徘徊清舒山館庚子秋入清謀目雲間暢舒心有風皆送爽無樹不張隂臺館藏幽奧詩書待祕尋笑豫少暇者餘月始來臨清舒山館辛丑清是三秋最霽惟一念舒月餘忽過彼幾暇始臨豫苔徑尋今步藝窗展昔書伊人真薄福承慶愧其儲是處總名清舒山館前堂額曰承慶乃皇祖御書蓋以賜舊皇太子者也我皇祖何嘗不欲其承慶而彼自不能承每一瞻仰惕然自警亦以戒我後人清舒山館書懷壬寅山館內書堂題額曰承慶有深意存焉即景緬祖聖蓋以居儲宫繼繩慎提命奈何其福薄庭訓弗聰聽去年曽有句期我後人警去年題清舒山館有伊人真薄福其承慶愧儲之句然後人視豫豫其敢不敬先業茍微乖兆民或少病豫罪其誰諉怵惕恆憂怲是用泐長言偶來輒自鏡賦得氷奩癸未清舒山館裏精舍曰氷奩清夜誰懸鏡氷輪常在簷當時邀月姊此日𬗟軒髯睫眼卌年過寒光依舊恬題含德齋辛巳書齋額含德每憩𬗟堯針俯仰禽魚趣無非精一心神詮昔曽揭理境此堪尋永懋日新志如承師保臨含德齋癸未水貴有曲折山貴有環抱茍其無含蓄一往奚稱好書堂山水間簷額𬗟聖藻德何獨不然㴠養期深造不敏請事斯竹素資探討含德齋丁亥復岫聚雲處屋簷後有岫山皇祖御書聚雲復房扁金風玉露秋有懷皆入靜無景不澄眸大塊開生靣天文仰上頭至今歌樂利含德永貽庥含德齋戊子滿屋馥藝香書㡡有縹緗與稽資汲古撫序正宜涼孔思去聲知仁樂軒文日月光萬年含祖德銘志那能忘含德齋庚寅已德不欲炫宋儒著涵養人德不欲忌包荒玩易象奎章勒簷楣含之為義廣韓文更申論能含吉乃享齋額當盤銘日新勵敬仰含德齋丙申已德不須誇要在含而蓄人德不須忌要在含而育含德之義大淑身治世屬書齋適在兹水抱山之曲即景多藴藉循名應佩服堯章豈徒云武銘可同讀敬題含德齋己亥書齋仰奎文含德標簷際兩字具大端千秋示深義為君撫寰宇其難守神器必有德可含方致歌樂利德豈易云乎愛民一言備勤心繼前規永懷詔後世敬題含德齋庚子含德垂堯文所包義實廣在兹當言兹則我蒙撫養舞象何知識成器叨深賞即今佛仔肩敢忍孤疇曩雖幸未隕越惟益勵劬勥含德齋壬寅德有小人與君子含殊致人及在已在已之德能自含是謂葆光誠善美我施以德致人含堯舜病諸誠艱矣有孚惠心貴勿問向嘗為乾清宫五屏風銘有安民若句何莫如惠施惠心勿問元吉易辭之蓋謂我施德惠非違道干譽之為而欲天下人之愛戴此非問乎此非不孚乎且九五為君位亦不應計及人之愛戴也因繹含德二字之義有會於此復申其旨期他含德亦私耳聖人兩語所包廣欽瞻有會申其旨戒得堂清舒山館之東堂五楹南嚮御題額曰戒得堂聨曰祖德紹稀齡戒垂務廣聖言明要道矩仰從心恭繹御製前後二記仰見頤和養粹聖敬日躋凡聖祖引而未發之旨敷言繹思昭示無極所以闡精一之心傳廣帝王之法戒胥於是乎在堂之後廡曰鏡香亭堂北層樓特起以待皓魄顔曰問月樓樓之東為羣玉亭其南有軒曰含古自軒而南為來薰書屋又南為佳蔭室室外俯臨流水有齋三楹與室相對曰面水齋御製文戒得堂記庚子孔子三戒之論朱子注謂以理勝之則不為血氣所使又引范氏之言以為養其志氣故不為血氣所動蒙引又引新安陳櫟之語以為志亦定向於理志有善惡理無不善諸説繹聖析理亦既擇之精而語之詳矣我皇祖聖夀望七時嘗欲鐫通用小璽命內廷翰臣擬文皆無當聖意者乃定戒之在得字用之此語聞之張照蓋爾時伊在南書房裏行也然當時聖意引而未發豫今年亦屇七􅐆於元旦試筆即櫽括此語為什兹駐蹕避暑山莊乃皇祖朝乾夕惕用此璽之處而豫受恩之所也適作書堂於清虛山館之左即以此題額而為記以闡皇祖之義曰帝王之學與占畢書生有不同則所戒亦當各異未定方剛之戒兹不復論兹所戒者當在得矣而得豈與庶人同乎欲得賢材而用之此可戒乎欲得億萬年永承天眷此可戒乎欲得寰宇安寧萬姓樂業此可戒乎欲得五風十雨屢綏普遍此可戒乎若夫欲得貨財為瓊林大盈金花內帑之私則是剜肉補創自速其亡之舉古有明戒而戒及此其亦小矣因敬思皇祖所云戒得者其在擴土兼逺之為乎擴土兼逺之不已必有窮兵黷武之事我皇祖雖征朔漠復衛藏非窮兵也不得已也豫小子欽承先志亦既平伊犂定回部靖金川擴土不為不遐兼逺不為不備然非敢恃兵之強將之略而窮黷以遂已之欲亦惟是不得已而用之耳幸蒙天助諸事順成今則夀登七旬亦既老矣尚何所不足敢弗以皇祖之戒為戒乎如是則先儒所謂志氣血氣胥不外一理然此理實非占畢儒生所得同而或有合於我仁祖垂示萬祀之義乎戒得堂後記辛丑戒得之義於前記言之宜無不盡兹後記何為而作也曰前記之義蓋言其欲得兹後記之義乃言其已得欲得者有形得與失任彼其過小已得者無形得與失任已其過大兹後記之戒所以不可不謹不可不作也夫已得則有形而吾謂之無形且曰任已而其過大者何試以吾之所得者言之平伊犂定回部靖金川不為不遐不為不備是皆有形者然而消息盈虛之理滿損謙益之機伏於無形茍有或渝復隍隨之故戊寅之嵗作勒銘伊犂之碑於凡栽培傾覆之道屯種萬里外非計之得三致意焉至今亦草餘年矣荷大之寵疆宇日以安耕闢日以廣方敢言有形之得而吾心之栗栗危懼於無形以戒夫或有所失而不能保其得全之意豈謂此一記遂足以息吾肩而卸吾責哉亦惟日慎一日以待吾歸政之日而已爾御製詩題戒得堂辛丑書堂昨夏始經營蹕駐宛看此落成攻匪庶民大雅異戒惟老者魯論精庭餘古樹全鋪蔭階繞新花自放榮雖曰殷勤曽著記得通皇祖聖夀望七時嘗鐫戒之在用小璽庚子駐蹕山莊作書堂於清舒山館之左因題曰戒得堂並為記以闡皇祖垂示萬祀之義斯干爰處愧猶生題戒得堂壬寅泐筆壬寅尚欠詩山莊蒞止已多時曽無羲畫高輝字是處為新構故無皇祖御書宜有藐躬祖述詞見堂記雨鮮庭莎録猶淺雲生峯樹白徒披即今亟望甘霖得此得又安能戒之問月樓辛丑室宇近東山見月遲他處因之置層樓幾去聲以先瞻顧假使登西山先斯早亦固自笑同孟語五十步百步問之意在兹青蓮非所慕問月樓壬寅東嶺鬱嵯峨高樓出樹科每因先見月最愛俯臨波弗計滿和半多供吟與哦如誠云致問不離應作去聲讀見月令畢云何來薰書屋口號辛丑書屋來薰額棟虹每來亦必值薰風五絃揮處歌解阜翹仰重華回莫同來薰書屋口號壬寅清泠書屋玉壺氷避暑真稱此絶勝風自南來正薰也解吾民愠又何曽佳蔭室辛丑有堂斯有室顯密要相資曼轉步廊接窈深憩席披就喬樹也山莊多古樹每就其下為室致古趣而得佳蔭為小築得蔭實偏冝幾暇無煩暑怡哉學古時佳蔭室壬寅邇日炎蒸劇都因勿雨然室猶嘉蔭下窗啓爽風延不必揮羽扇耐堪披􅗜編摛詞惟望澤此是我心懸含古軒辛丑軒弗設窗櫺而此窗櫺設支則延爽涼閉亦足幽悅插架有藝編坐可間翻閲是中含古意味之趣無竭面水齋有會辛丑臨水搆書齋水光漾窗裏觀瀾豈不佳而却蔽糊紙因之設玻璃通明無隔矣有魚任潛躍有鷺任立起即今生秋風涼亦避席几障而弗致礙可以契禪理羣玉亭辛丑山色四鄰曲徑通翼然亭子宛其中設如策府方羣玊枕葄興心亦不窮題鏡香亭壬寅戒得堂後廡臨池荷花盛開因名之曰鏡香亭而系以詩堂隂半𤱔方塘鑿此鏡由來不藉磨底事座間香撲鼻知因亭畔籟吹荷馥馡非爇沈檀鼎紅白是鋪錦繡窠設以花中擬君子得之豈合戒其多得趣室大食玻璃窗牖糊千巖萬壑景來輸坐看罨畫無窮趣得自他乎得自吾詠戒得堂牙刻九思屏壬寅書堂接軒廡因敞設清防牙刻鷺乾數鷺鷥數九蓋寓九思之義圖兼蓮萃芳前三詮以補後九寓誠良終日得思義原同戒義長春好軒萬樹園東南濵湖軒五楹御題額曰春好軒嘉樹駢羅文石碁布當清蹕經臨多在夏秋而麗景暄妍和風韶暢萬彚熙怡如在恆春化字中也內楹額曰花際霞峯聨曰上塞寄遙情煙雲入畫南榮開勝覽花鳥知春後為永佑寺浮圖撑空影在庭際軒後一亭額曰巢翠亭御製詩春好軒丙子年年清蹕傍秋巡那值東風入座新忽笑拘墟寧謂是階前粲者豈非春春好軒己卯地是恆春地莊原無暑莊仙林萬古秀真卉四時芳送語禽如識躍潛魚不忙文聰虛且靜敲句坐因長春好軒庚辰清暇偶憩文軒標題兩字堪論依然甌香硯淨而無花馥鳥喧落葉亂填書帙鳴鹿已懶蘋原鹿過時則不鳴莫謂芳菲節逺貞下行將起元春好軒有述辛巳兀為四德長仁實四性君以此言四序了知都是春蘅臯構廣軒棟宇朴且淳每來雖凛秋生意常懷新猶憶孟子言萬物備我身藹如可云息盎若當以純願言敷惠和躋臺薄海民春好軒題句壬午四圍錦簇霜枝麗一院芳含秋卉新都道仙莊稱避暑寧知勝地有恆春能言鳥起間翻影入夢蝶來香滿身萬物熙熙遊化宇至今總是戴堯仁春好軒題句癸未秋則常來夏偶居冬曽駐為去聲宴員渠惟餘春未六騶到默識元為平聲四德初樹張去聲葉皆由英始花彈苞總覺韶如羲經注出真消息不用韋編更展書春好軒甲申春好如何好好於想像中每來率秋月亦自有花紅萬物一生意四時總化工定期目擊者寧不付東風春好軒丙戌花開花落自春秋繞砌繁英灧露稠試看蜂忙與蝶亂寧知時序有遷流題春好軒丁亥天高氣爽湊蕭晨繞砌繁英灧露新軒外又慿七月景胸中常養十分春蝶薰翅紫花間栩鹿戴茸黃林際馴鹿角戴茸黃色尚未出尖則不甚肥必俟秋深氣􅋽然後牝牡合羣可即鹿矣且自對時玩生意無虞慢擬傍巖巡題春好軒壬辰今年先到逮半月已是東皇駕早還訝是虛名題玉額每教過節叩雲關三庚散步渾延爽七字搜吟聊趂間菊放九秋荷六月春光無日不人間題春好軒己亥早來或夏遲冬偶恆此當秋弗遇春問我一言何謂好曰他四德首惟仁胸中常養十分盎砌下試觀衆卉誾生意各懷即元長上聲其間責實已名循巢翠亭丁丑喬柯翁蔚一亭幽雲海中間不繫舟謾道秋風紛葉落簷間意足翠隂留巢翠亭己卯灌木嘉隂翠尚濃虛亭聊且失干峯前年惜翠心何似丁丑詠此亭有漫道秋風紛葉落簷間意足翠隂留之句流水行雲勒壁蹤巢翠亭口號癸未喬木千尋疏落落翠如圓布緑油幕凡禽其杪安敢棲只宜放出籠中鶴巢翠亭即景甲申重翠隂中一笠虛巖棲訝可喚巢居斯之潔矩未能信風俗何曽太古如巢翠亭丙戌喬樹四周圍一亭在深處秋來翠尚濃佳隂緑雲布習習時奏籟泠泠亦滴露森森既愜望寂寂還澄慮即境擬巢窠可似香山悟巢翠亭壬辰蓋影喬林萬葉交虛亭擬唤翠雲巢坐來九夏多寒意那更唐詩讀孟郊巢翠亭口號己亥葉雲濃布翠婆娑巢意無殊安樂窩遐想穴居野處世一亭猶覺此為多巢翠亭辛丑喬樹中間八柱空翠雲櫛櫛護籠蔥巢居雖以為亭額慚愧時無上古風巢翠亭壬寅雨濯林枝萬翠交良禽擇木穩而巢虛亭却似不相讓無意其中有意包靜寄山房環澄湖踞平阜邃宇穆然淵靜門南向榜曰月色江聲中為靜寄山房聨曰雄筆振清詞追賞得煙雲之趣佳辰逢勝景乘間探邱壑之奇軒網虛明簷楹清寂又內為瑩心堂額曰間止聨二曰自有山川連北極天然風景勝西湖曰取歡知仁樂寄暢山水音又內為湖山罨畫聨曰水當窗面天然白山接林端分外青並聖祖御題山房宛在水中而旁環萬峯以靜寄名者歸動於靜合知於仁伏誦宸篇人生而靜天之性山古以深日亦長聖心寄託悠然如見矣御製詩靜寄山房己卯碧草白沙步野塘槐隂還有讀書堂人生而靜天之性山古以深日亦長那慕征僑學仙術惟希周孔養心方睿題咀嚼義彌永縱覺瞪乎敢不蘉靜寄山房辛巳六根意無定出入剎那頃與其寄於動寧教寄於靜靜固不在外亦頗觀乎境不然佛成道奚在明星耿山房翠微間而帶清溪泂花木脫凡姿禽魚契平等大圓鏡智中吾將事清省靜寄山房四題辛巳假山翠扶青蔚圍孱顔那藉疊石於其間信知小許勝大許誰云假山非真山世間真假已紛矣棗葉須彌寧繫此却看嶷然幾岫中時有英英白雲起魚磯列溪之魚鮮且碩坐磯學釣藉苔席得魚固佳否亦可意在山青與水碧吕望釣得為公鄉嚴光釣失仍得名擲竿大笑非吾事不如放去任闖萍秋英我愛秋英勝春英春英木本秋草本草也猶能芳颯時固勝木逐韶華逺堂前堂後羅丁星冷黃悽紫難為名山蝶入叢看不見飛上研山滿案馨樝梨山中有樝秋已熟間庭自落聲簌簌野果含霜味亦佳何必張公珍大谷朔桃期棗總虛譽鳥啄鹿銜那禁渠英嗤傖父饋酸味酸味回甘甘有餘靜寄山房癸未山房却在水中央緬想當年趣寄長詎獨塵祛清淨界真教道愜知仁鄊成隂喬樹天然爽過雨間花自在香謾説田盤此數典盤山十六景總名之曰靜寄山莊會心何處不羮牆靜寄山房丙戌軒楹臨水裔水在萬山中不盡智仁趣由來氣味同至人歸靜寄百世仰鴻功試看靈臺闢寧因遊賞攻靜寄山房壬寅向浦碧波臨循隄芳徑尋靜專玩周易寄勝仰堯襟釋躁藴醇粹含虛悅湛深田盤此數典肯構永銘心靜寄山房二詠乙未月色江聲為避暑山莊三十六景之一其中堂扁曰靜寄山房皇祖御書也敬成二律以志景仰才見錘峯側忽升璇宇空萬方含一照卅景與俱融三十六景舉成數也塞樹標丹緑野花紛紫紅色皆有所藉月固不居功露共堯年灧魄懷謝賦沖千江歸至靜那論印來同右月色六韻河水非江也江聲到處流西岷寧地限武列有川悠觸石響隨作落灘韻未收五音足概耳六律可同不喻鑑思唐語觀瀾娛舜眸遊波去無寄無寄却是留右江聲六韻靜寄山房丙申山館别清舒山房臨靜寄無過一溪隔過橋數武至嵗久庭樹喬雨後樹隂翠葉蟬無躁音藻魚有潛意率足靜以觀而寓寄之致靜寄山房有會己亥山房額靜寄聖藻義仰尋寄靜意猶小靜字義實深寄於靜為逸片時圖娛心靜亦寄應會兩儀互為斟動之寄易知靜之寄難諶設能體靜寄大公因物任是真隂陽撰詎悅山水音題靜寄山房庚子山莊無不靜是處靜無過逺俗遙遮嶺澄懷近繞波最宜讀周易况值幸時和寄興非關動神堯詔我多瑩心堂乙亥煙波淡以如奎藻光猶宛繹思惟服膺將為出治本瑩心堂戊寅疏榭碧湖中澄觀若鏡空最堪窮理趣可以令機融望去寥蕭野披來颯沓風一輪端正好朗照此心同瑩心堂己卯秋湖四面古堂深寶額雲楣號瑩心政本不惟操治鏡理源兼可滌塵襟波涵玳箔虛無色風入霞衣萃蔡音臨董書看原勝董堂中董書皇祖御筆臨猶存敬思當日惜分隂瑩心堂庚辰平湖候冷碧波凝颯灑冬堂又絶勝自是瑩心多好會那更平聲真對玉壺氷瑩心堂癸未塞水滙成湖軒堂湖上圖印心澄到底謀目趣偏殊鏡裏真如是旃摩那藉夫敬窺題額意出治寓深謨瑩心堂甲申萬機惟一心堯典曰明欽譬以旃摩鏡猶之模笵金虛堂池上靜秋水面前臨翹首瞻奎畫聖人詔我深瑩心堂丙戌堂圍緑水瑩心清樹態山容漾影明欲效沖虛為鑑照妍媸祗任物來呈瑩心堂丁亥碧靜林堂渌水潯羲文觸目玩辭深𬗟懷四海規為鏡敬識千秋照在心恩擬汪洋垂自昔繼勤夙夜勉從今山莊嵗嵗聰聽近豈是無端為去聲豫臨瑩心堂水心構書堂即以名瑩心堂瑩斯誠易心瑩義實深茍非體危微率為去聲私欲侵一指蔽當前泰山不見岑動靜貴交養內外胥用欽奎章每敬繹昔訓恆垂今瑩心堂癸巳青山遙映戶碧水近縈門花錦麗非艷松濤靜不喧江淹􅐆間詠樂廣傳中論方寸常求瑩斯為出治源瑩心堂丙申四靣水圍鏡一庭山敞襟書堂幽致靜暇日步延尋會意道堪味循名實可吟瑩心思治理睿藻示人深瑩心堂壬寅塞垣艱致水此處水周堂心喜清波瑩目欽聖藻煌月臨真淡沱風入總文章澄志非無事萬幾靜答忙煙雨樓如意洲北舊名青蓮島建樓五楹御題額曰煙雨樓聨曰百尺起空濛碧涵蓮島八窗臨渺瀰澄印鴛湖樓四面臨水一碧無際每當山雨湖煙頓增勝概嘉禾咫尺宛在中央樓外青楊蓊蔚搆屋三楹曰青楊書屋山頂有亭翼然曰翼亭溪傍搆齋與青蓮島相對曰對山齋御製詩題煙雨樓二首辛丑攜圗去嵗興工始斷手今年蕆事勤數典可知自元璙賡詩更以憶陳羣煙雨樓本錢元璙所創為嘉禾勝迹向年南巡屢次經臨時錢陳羣在籍賡和頗多樓中並有陳羣書趙孟俯耕織圖詩屏最宜雨態煙容處無礙天高地廣文却勝南巡憑賞者平湖風遞芰荷芬十五年違煙雨樓昨春未免借情投雖然寫景原藏弆去嵗寫煙雨樓圖一貯內府一存浙江兹于山莊內肖圖為之莫若肖形可詠遊底論南吳及北塞敢忘後樂與先憂憑欄俯視清泠鏡武列鴛湖異水不煙雨樓四詠晴為煙則隂為雨羃實浮空淡蕩然盈手無形還不濕試噓分半又凝全飄飄初自鼎頭裊漠漠旋從簾角連承德朝炊萬家起熱河自民便皇祖肇建山莊有萬家煙火隨之句今將百年樂利北貽庥屹然京一大都會矣至今樂利沐堯年右煙大斯雱霈細霏微總助樓中潤景祈春望其興恆未至春多望雨時尚未至山莊也夏愁已甚冀無違豈常堆塞豫而樂此似鴛湖是也非暑雨自多怨咨者思艱每用緬前徽右雨青蓮島本水中央石刻三言聖藻煌是處本名青蓮島煙雨樓即築於此接壘假山因綴景相資髙閣作清防玲瓏頗具邱壑勢咫尺寧勞笻屐忙掩映四鄰真者在不知孰幻孰為常右假山借詢樹以若為真獨十八公名亶循駐島應從疏仡代得朋惟有大椿鄰煙恆冬亦雨恆夏月自秋而風自春摩詰後生猶絮語奚稱種作老龍鱗右真樹登煙雨樓即景為喜嘉禾樓望意搆樓玊塞俯澄瀛適當煙雨呈暑景便拾級梯攬潤情去嵗巡南因肖北今朝責實果循名循名可耳無須甚時我心中正盼晴題董誥煙雨樓圖素壁詞臣命寫圖遂看即景貌鴛湖是煙是雨真無定為北為南了不殊何必避嫌云著相果然入妙協清娛春巡昨况分明在依戀民情略繾吾寫煙雨樓圖用去嵗煙雨樓圖詩韻此亦弆懋勤殿者曽兩圖臨米昨嵗仿小米為煙雨樓圖凡二一弆嘉禾本處一弆懋勤殿匆匆已過時兹於塞之浙亦復畫而詩那辨異同鏡都饒煙雨絲函三原是一舊韻偶賡之煙雨樓對雨壬寅西南雲起有雷鳴眨眼天中雴雨傾竪灑橫排函暢意繁弦急管莫形聲八窗那得珠簾捲四宇紛披銀竹晶略釋渴憂生逸趣高樓今日善循名煙雨樓晴望七月朔日壬寅新秋今日逢月朔月朔晴占一月諧便與登樓聊騁目可知霽景正開懷錘峯帽嶺縱橫影蓮島鴛湖借助佳何必循名曰煙雨八徴洪範駐無乖煙雨樓秋望壬寅玉露金風爽素秋聘懷更上一層樓千林日閃畫初展五榖雲黃寶逮收鶴意喜高駐空唳山莊之鶴清曉每飛鳴雲際而翔集不離本處蓋鶴喜高空而栖止有定也鹿聲試朗出巖􅊯嬴他攜李惟春望豈識山莊澄景遒青楊書屋辛丑塞上之樹多青楊或亦名之為小葉閜砢拔枝干青雲亦不知經幾千劫適構書屋於其下蔽虧天日森􅕜㙷曰古寧非牧馬場曰今乃半攤書篋文何幸武何弗幸喬枝率附兩無涉青楊書屋壬寅玊塞青楊殊白楊櫛櫛銀雲葉獨小其下朴屋搆三間樹老因之屋亦老太古以來風月枝秋與吟蛩春與鳥却笑建木及靈椿等間名被人間曉翼亭辛丑嶮巘入巖扉緣梯上翠微假山真結搆四柱據巔巍歐曰有翼臨劉云無翼飛於是有無間吾將觀其幾翼亭壬寅山頂有亭臨翼然聚名遂與額楣懸由來惡旨殊六一却以樂深擬智仙青蓮島歌辛丑山莊舊有青蓮島峭峰三言泐聖藻借問島上何所有千年之松五色草詭石破硪坡曼延襟帶塞湖波浩渺塵迹不到舟可通方之蓬閬奚邇藐我欲肖為煙雨樓相度無如此地好飾云肯搆何敢當景仰高山朴為寶作歌敬詠青蓮島佛口所宣佛手拈一部華嚴真義了對山歌辛丑煙雨樓傍構溪齋靣靣波光罨紗牖而我名之曰對山對山之義人知否齋前堆石頗􅌑瓏如堂如霍如岡阜雖非取於太湖遙塞巒為我藏斯久取之無盡用不竭明月清風與共友粗皮詭質戴蒼苔樹根受氣仍盤紏待其抽枝並發葉何異四鄰舊林藪彼以大稱此小勝真何必是假寧否坐向屹一囅然聊學恭軍為享帚對山齋壬寅山莊無處不小齋而齋對山特名此却非崇岡峻嶺叢青蓮島上數峯耳詭石玲瓏假借堆久假不歸則真矣大者勝弗如小勝濟者勝應悟是理欽定熱河志卷三十五
