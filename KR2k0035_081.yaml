body:
  text: 欽定四庫全書欽定熱河志卷八十一寺廟五龍尊王佛廟在熱河東北八十里湯山溫泉出焉聖祖敕建廟其上御製碑記聖祖御製文湯山龍尊王佛廟記四集塞外山脈自西北來至熱河岡巒回合形勢鬱盤環左右百里間多名泉而山莊之東北有湯山其泉湧出山腰自然而溫浴之蠲煩除疴導和怡性朕始經其地謂水候微涼更得暄暖乃宜於體比再往則加燠矣記稱丘陵川谷能出雲為風雨者皆有神況是山藴金砂之氣蒸為醴液又應候如意豈非有神靈默相者歟爰於泉上繚以周垣搆行宫數椽為避暑沐浴之所而于其中建龍尊王佛廟以奉香火焉考湯泉著於史傳者驤山天都最為古迹其他亦散見於山經雜志而此地自古未入版圖故川原之勝蔽翳于荆榛沙磧間幸今中外一家兹泉始得呈其靈異古人謂地脈之興亦有待而然非虛語也夫君子澡身浴德如沃盥以去垢朕于此竊附湯盤之警期與天下日新而所以膏澤吾民以及蒙古諸部落使咸夀考康寧者則不能無望于佛之庇佑焉是為記火神廟在大街康熙五十年建關帝廟在二道街康熙五十四年建聖祖賜額曰開仁寺乾隆二十八年奉敕重修前殿供關帝額曰忠義北嚮供觀音額曰妙觀後殿供如來文殊普賢額曰雪山正覺皆聖祖御書寺有石碑一詹事府少詹事蔣廷錫撰文誠親王允祉書觀音大士廟在廣仁嶺北康熙五十七年建聖祖御書額曰妙德慈關帝廟在西南街雍正十年建御題額曰忠義伏魔每歲春秋及五月十三日官為致祭又關帝廟四一在糧食街康熙五十年建有碑一在獅子溝一在二道河並乾隆二十年敕修一在河東乾隆二十五年敕修藥王廟在獅子溝乾隆二十年敕修龍王廟在獅子溝乾隆二十年敕建炮神廟在右哨泛靈峯寺在五指山元敕建有碑額曰興州宜興縣五指山大靈峯禪寺大輪禪師碑銘下書北京大定高守寶同男高誼高諟刋大都大奉福禪寺傳法住持嗣祖沙門居實撰提點小師沙門廣純書丹功德主敕授進義校尉虎賁軍百户王琮敕授將士佐郎冝興縣尹兼管諸軍王文祐授武義將軍虎賁軍千户王瑢光祿大夫中書右丞相安童至元二十四年立碑上截完整近趺處刓缺殆盡云竹林寺在白馬川之敵樓山康熙四十三年修有僧照安撰碑言竹林寺建于元致和間寺內又有元至元間重修敵樓山天宫禪院碑記元僧顯月撰碑稱僧慧靄止于敵樓山之抱有古殿宇址號曰天宫惟設觀音神像乃結廬于山未逾三年復完紺殿及鐘樓方丈僧舍山門香積雲居廩庫賔館皆創搆之是天宫禪院始建在元以前僧慧靄又僧新之今竹林寺殆即天宫禪院故址謹按竹林寺內僧照安碑謂元致和間建今所存元碑為至元二十六年重修立石元代世祖順帝皆以至元紀年致和乃泰定帝年號在世祖至元後則竹林寺改額或當在其時云清泉寺在上板城村未詳創建年月康熙四十九年修刑部右侍郎張睿撰碑雲峯寺在青雲山未詳創建年月康熙五十二年修僧普臨撰碣天平寺在青雲山距雲峯寺南五里以上在今承德府境星龕巖寺在喀喇河屯西稍北五十三里康熙年間敕建就巖鐫三石佛梵相奇古大殿奉聖祖御書星龕額峭壁寺在喀喇河屯東南樺榆溝康熙年間建聖祖御書殿額曰天半香林亭額曰森萬象靜妙寺在喀喇河屯西藍旗營康熙年間建有聖祖賜靜妙寺額關帝廟在喀喇河屯東南康熙年間建每歲春秋及五月十三日官為致祭又關帝廟五一在喀喇河屯營西康熙五十四年建一在金沙灘康熙五十七年一在靳家溝一在青石梁官道側並乾隆二十三年敕修一在巴克什營以上在灤平縣境雲光洞廟在中關西北三十里石洞溝康熙六十一年建聖祖御書額曰雲寶珠光遂以名洞洞中供三世佛旁室奉紫微斗極及釋利大士有碑一內閣學士兼禮部侍郎蔣廷錫撰文翰林院侍讀學士陳邦彥書安禪寺在中關北三十七里什巴爾台康熙四十二年建有聖祖賜安禪寺額關帝廟在土城子西雍正十年建每歲春秋及五月十三日官為致祭又關帝廟七一在黃姑屯一在郭家屯北五十里湯泉上一在大閣兒東南七十里鑲黃旗營一在大閣兒東南九十里頭道營一在大閣兒北八十里上黃旗一在大閣北一二十里牛圈子一在大閣兒西北一百四十里四岔山金雲寺在土城子南二十里乾隆元年建河神廟在土城子萬載橋南乾隆十年建觀音寺一在土城子南二十里一在土城子東北一百二十里龍王廟一在土城子西北二十五里赫山一在大閣兒東北千佛寺一在土城子北八里一在大閣兒東北四十三里興隆寺在土城子東北九十里五峰山釋迦佛廟在五峰山蘇武祠在大閣兒東二十五里謹按顧炎武昌平山水記稱塞外有蘇武洞或即此祠之訛今土人呼為蘇公廟考武奉使胸奴徙北海上不應在此蓋古人遺迹人豔稱之故為立祠耳靈通寺在大閣兒東南五十里龍泉山過寺里許有龍潭三繞寺前石澗東南流入潮河洪湯寺在大閣兒西南六十里湯山山有溫泉康熙二十二年僧明林建寺甃浴池於泉側普濟寺在大閣兒西月珠寺在大閣兒北六十里喇嘛山寺有石佛鐫鏤絶工以上在今豐寧縣境關帝廟在八溝河南雍正十二年建每歲春秋及五月十三日官為致祭又關帝廟六在北二道河者二一為康熙五十五年建一為乾隆二年建一在扎薩克旗茶棚雍正五年建一在小子溝雍正八年建一在七家茶棚乾隆二年建一在八溝南乾隆三年建炮神廟在八溝南大吉口乾隆五年建火神廟在八溝西街乾隆六年建龍王廟一在八溝西街乾隆六年建一在八溝東北喀卜齊爾山廟側有泉靈峰院在八溝北翁牛特境內遮蓋山山有千佛洞今名大碾子洞有金皇統三年靈峰院千佛洞碑奉議大夫驍騎尉劉子初撰中京大定府長興縣鄉貢進士杜彥臣書前列都綱沙門曉和匡主沙門惠學千佛化主沙門遵説等名後列衆僧名及都提點趙孝慈邑政趙壤舉事趙璶邑判陳彥副判趙倫以下八人副提點劉忠信邑長孫公彥監造邑録梁國寧以下十人名姓碑稱縣東南有山曰遮蓋背山嚮溪有道場焉遼乾統三年有天台法師鑿山構殿殿後環洞名靈峰院後遭兵火至皇統辛酉歲僧遵説成千佛石像碑在今大碾子洞外又有明萬厯四十五年重修碑在洞內其文襲皇統碑荒陋無足採元一統志曰松州東南二十里遮蓋山有古寺即指此以上在今平泉州及赤峰縣境佑順寺在塔子溝東北二百八十里三座塔康熙三十七年敕建四十六年落成聖祖賜佑順寺額并檀香佛像前天王殿西關帝殿左右鐘鼓樓中為大殿東西配殿左右為藏經閣石碑二並康熙五十四年辨理土默特貝子旗事務户部主事諾岷撰文佑安寺在三座塔東北二百四十里康熙四十四年建聖祖賜佑安寺額寺內有碑承禧寺在塔子溝西九十里北宫康熙五十年聖祖駐蹕其地發帑建立賜承禧寺額𢎞慈寺在塔子溝北四百二十里敖漢界內康熙四十六年敖漢郡王扎木蘇建聖祖賜𢎞慈寺額關帝廟在塔子溝東街乾隆七年建每歲春秋及五月十三日官為致祭又關帝廟四一在三座塔城內東塔舊墓之右乾隆十三年建一在太鹿溝一在五道溝東南一在莊頭營清安寺在塔子溝東北七十里大城子康熙二年建天成觀在大城子東康熙六年建降魔寺在塔子溝西北二十五里小子城之東三里寺北有石洞一中供佛像土人呼曰喇嘛洞朝陽寺在三座塔東八十里康熙九年建又木頭城子東北八里有朝陽寺康熙中建有塔在山頂蒙古稱納林塔又塔子溝西南四十里亦有朝陽寺彌陀庵在三座塔東北一百六十里康熙十六年建興隆寺在三座塔大板上康熙四十一年建天仙廟在三座塔東鳯凰山聞仙洞下三里許康熙中建盛水寺在三座塔東南雲蒙山下康熙中建山下有泉靈佑宫在三座塔南羊山雍正十二年建卧佛寺在三座塔西昻吉山山周三十餘里寺基當其巔廣袤可六七十丈遼應厯七年石幢記尚存今寺為蒙古改建寺有石佛高八尺圍四尺天慶寺在卧佛寺下四里遼時建康熙十七年修寺有石胎觀音立像高七尺圍五尺有奇遼夀昌五年沙門智闕等唱和詩石刻尚存碑高五尺跌半沒土中字迹微泐篆額橫鐫玉石觀音像唱和詩碑九字詩以次列分四截書前署銜名有崇祿大夫檢校太師行鴻臚卿闕辦大師賜紫沙門智闕兵部尚書兼門下侍郎平章事鄭若愚左僕射兼中書侍郎平章事韓資讓兵部尚書興中尹趙廷睦諸行宫都部署尚書左僕射梁闕特進禮部尚書參知政事趙長敬觀書殿學士行尚書禮部侍郎知制誥焉闕俊中大夫昭文館直學士知御史中丞開國侯劉瓌度支使金紫崇祿大夫行尚書禮部郎史仲愛乾文閣待制史館修撰曲正夫朝請大夫充祕書監開國伯賜紫金魚袋王執中南面統制闕十一字員外郎闕二字光前樞密院吏房承旨行殿中少監王仲闕朝議大夫知制誥開國子孟初朝散大夫司農少卿知大定少尹賜紫金魚袋張識司農少卿知度支副使楊滌瑕守殿中少監知析津縣事李師範闕四字侍御闕二字賜紫金魚袋李闕提點宏法寺守將作監張闕內藏庫都點朝散大夫尚書虞部郎中借紫寇闕殿中丞直史館張嶠左承制閣門祇候韓汝礪崇祿大夫檢校司徒闕三字正大師賜紫沙門善闕共二十二人碑右側鐫講經法姪性闕門資講僧性覺二人和直書分上下層詩不甚工書頗古徑有法報恩寺在天慶寺東北大路下康熙五十一年重建華雲寺在天慶寺東北雍正十三年建有塔三學寺在三座塔北狼山舊為祥巒院金大定五年重修改額有興中府尹改建三學寺碑里人韓長嗣撰文并書將仕郎興中府都孔目官白霫王祁篆額後刻都維那銀青榮祿大夫興中尹上柱國廣陵郡開國公食邑二千户實封二百户高思亷妻廣陵郡夫人高氏二夫人高氏長男雲堂次男三學奴遼金舊制以經律論為三學擇僧行清高者為綱首舉諸郡內經律論學優者為三法師凡取經律論師差官考試於各宗出題答義中選者取三人命為三宗法師蓋最重之三學之名取諸此韓長嗣碑中稱遼建三學寺於府西兵興以來殿堂廊廡俱無寺廢久矣大尹出遊狼山其上有院曰祥巒廢為荆榛基址頗有制度乃改修為三學寺是遼於興中府建三學寺金始改建於狼山也元一統志興中州狼山上有三學寺即指此林泉禪寺在塔子溝東南月華山有元僧無際撰碑額曰大寧路惠州東錦川鄉月華山林泉禪寺創建地産四至碑字完好碑稱僧祥盤創立林泉寺正殿三楹壁繪毗盧聖像右觀音寶宫左威光堂歲至乙巳百廢具舉則寺落成于元成宗大德九年也元一統志月華山寺在惠州東一百九十里即指此後寺廢雍正十一年即碑側舊址重建此山有石竇東西相通故俗呼窟窿山廟以上在今建昌縣朝陽縣境謹按舊五廳圖册喀喇河屯有菩薩廟龍母廟財神廟四旗土城子北有七神廟黃姑屯有藥王廟黃姑屯及少府營各有玉皇廟黃姑屯東興龍山有吕仙廟郭家屯湯泉有真武廟郭家屯西北鳯凰山有天仙廟八溝河南有觀音廟八溝河南及龍鬚門各有藥王廟八溝東市有財神廟大吉口有真武廟二道河有大王廟八溝東瑙璃山有泰山神廟八溝南湯頭溝有喇嘛廟二八溝東北喀卜齊爾山及八溝西北一百四十里各有喇嘛廟塔子溝北有地藏廟藥王廟塔子溝南市有財神大城子天成觀西南有觀音堂三座塔西五佛洞有韋馱廟大板上有明聖寺波羅台溝有喇嘛廟大抵土人所建其規模無足紀録皆附載於此欽定熱河志卷八十一
