body:
  text: 欽定四庫全書欽定熱河志卷四十七圍場三行圍儀注凡木蘭行圍先期降旨應行事宜各衙門照例預備嚮導大臣率嚮導官兵於大駕所經之地飭所司儲備宗人府內閣部院司寺奏請欽點扈從王公大臣官員兩翼八旗奏請欽派前鋒護軍統領理藩院行文扎薩克王公等先時戒備隨圍執事駕行前一日遣官以秋獮虔告奉先殿屆期皇上御行衣乘馬出宫翊衛諸臣前引後扈百官采服跪送駕如巡幸儀自乾隆六年以後間嵗一舉十六年以後每嵗舉行至熱河駐蹕避暑山莊中秋後啓蹕行圍將啓蹕行在兵部領行圍禁令管圍大臣帶領隨圍官兵至圍場祗候先以百餘騎小獵於平甸撒圍國語曰阿逹密入圍場後御行營規制詳後護軍統領率官兵先往度地廣狹立御營扈從官兵等以次安帳行營前後嚴巡徼止夜行違者論如法先期前鋒於一二里外設卡倫每日五更管圍大臣率蒙古布圍人先往其餘扈從人等及輜重均毋許先出卡倫平明上啓蹕先駐看城規制詳後布圍用蒙古一千二百五十人圍中以大黃纛為中權其名曰佛勒兩翼左正白右正紅曰梅勒兩翼前各以一藍旗為前哨曰烏圖哩纛俱以綢為之不加緣正幅不施繒繡縿徑六尺四寸斿徑六尺杆長一丈四尺五寸以竹為之不加髹漆黑旄前哨進後隊以次隨發由逺而近繞圍場兩翼前各數騎擁纛飛馳曰跑烏圖哩將會於看城呼瑪喇哈則圍合矣皇上出看城躬佩櫜鞬具弓矢蒞圍所各獸羣集上引弓射後令御前大臣侍衛隨射者曰納勒布密如有逸出圍者許官兵追射之命中者紀諸册圍中有熊虎諸猛獸則管圍大臣遣侍衛馳報看城上䇿騎親至其處命虎鎗官兵掩殺或御神鎗及弓矢立殪之圍中麅鹿過多則開一面放之未初罷圍駕還行營陳牲數獲頒賜扈從王公大臣官員行圍竣出哨遣隨圍蒙古各歸部落回蹕自熱河旋京師告秋獮禮成聖祖御製詩塞外偶述二集曉霧迷前嶺蒙茸露未晞林中呼鹿罷山上射熊歸水繞周廬曲原髙衆幕圍時平疆域逺萬里盡庭扉世宗御製詩大獵五校雕弓徑三秋野獸肥乘時講武事大獮振兵威狡寧藏迹封熊悉入圍獵歸數軍實落日照龍旗中秋從獵塞外萬里清輝度塞寒一輪飛鏡耀雲端穹廬影靜金波蘸行漏聲沉玉露溥光射龍沙明逺磧香飄仙桂拂層巒普天今夕同欣賞何以趨承膝下歡御製詩獵辛酉秋搜文囿是王庭祖澤貽今赫濯靈桓﨣健兒身掠鷂驃姚車騎箭流星龍堆露冷鳥蒼鹿沙塞風髙語白翎大兕小豝親射得駝峯髙架進慈寧秋日奉皇太后口外行圍列塞騰千騎三秋駕六飛校搜遵祖制問寢奉慈闈纚纚田車好祁祁原獸肥金風如有意爽氣襲征衣代是熙和候秋當獮狩時風雲森羽衛物象擁旌旗皎日曈曨照涼颸左右吹近光多父老前導莫驅馳秋原零白露羣鹿應時鳴駭野車徒勝彌川草木平祗期軍律整無取大庖盈誰獻長楊賦臨風憶客卿暮色滿平川行宫景物妍砌蛩喧此夕梧月照當年皇祖曾停蹕孫臣獲侍筵幾多承雨露追想倍悽然行漏催寒夜銀檠虎帳懸霜笳鳴塞上星斗挂天邊牧馬聞呼聚飛鴻列陳旋禽荒曾有戒無逸誦終篇當秋鷹羽疾度塞馬蹄輕目極山川秀詩含草木清天髙雲帶影風徑壑傳聲更值西成好沿途喜氣迎獵癸亥雲斂髙空淨素秋較搜倩浰驟驊騮山翁山媪將毋訟天餉天公已富酬五校龍旌疑霧曳三驅羽騎訝星流清風吉甫羣陪輩吉日應同雅在周呦鹿聲髙露漸濃護霜雲傍紫芙蓉鴻侗輕騎看羅列駢衍徽車亦沇溶壯士同能扡蒼豨名王爭羡扈青龍匪誇多獸因農隙謾擬長楊弄筆鋒射熊寥蕭玉宇拂秋風掌樣霜鋒好射熊却笑漢皇猶赤帝空輸女子是英雄獵乙丑吉日詠車攻秋原豐草中古來稱玉塞南國勝雲瞢左右賢王會騂騏我馬同傍林張雉罟跨谷列麋罞觪角風霜徑銛鋒霹靂雄兩行成雁迤一貫總鴻絧更命開三面羣看發五豵眼前旋起嶂耳後欲生風詎敢從心欲多因習武功煌煌仁祖制景仰似崆洞獵丁卯金􅒫秩序玉旻清大獮乘時晃斾旌雲棧逈疑懸索度川塗還教貫魚行午原合處規弓滿曉翼舒時象鳥征虎圈豹房休更築谷蠡左右是林衡呦鹿􅊯鹿秋深鳴其聲隔澗聞雄者各護雌爭長難同羣合圍廣甸中麌麌乃畢臻避人相率馳命侣無區分不惟忘妬猜而轉情相親鬩牆禦外侮獸然何况人獵己巳山青雲白塞垣清快試秋圍趁曉晴淺水穿林衝暗渡橫岡冒霧落斜行雁行左右排千騎魚貫聫翩認五旌日暮頒禽喧弗禁為田猶足見虞情奇花瑞草總含芬少坐岡巒亦可欣幾樹濃青幾樹赤半峯晴藹半峯雲獸驚避箭驅叢夥人語呼圍隔嶂聞倩浰鴻絧原有度即兹深寓教三軍放鹿出谷霜風嚴冒嶺朝煙霿合圍廓堂皇輕騎劇鴻絧彌縱無漏罅呦鹿周却衆應弦紛屢踣疊雙頻命中他他已鋪原祁祁互奔撞肩怠繁弱張手疲逰龍鞚大庖既云足頒殺逮僕從於物誡盡取多或棄無用因命佽飛徒罷射快一縱歸林得所樂失侣懷餘慟習武會常來孳息仍厨供非希湯網名儒臣漫陳頌獵辛未豐草長林獸所都時平習武試三驅林霜始降鷹嫌葉野露猶霑馬惜蕪豈必虞人竭陂澤未能君子逺庖厨日斜頒獲帷城外惠逮惟均洽衆娛行圍四詠壬申撒圍塞山萬壑糾獵士五更行蒙古管圍諸王公每以五更率獵士先往撒圍撒陳常衝黑成行始質明蠶叢度袵席魚麗辨徽旌曾不言勞苦嘉哉奉上情待圍兩旗合帳殿設布城為看圍所奉始合皇大后觀覽兩翼首旗各馳至此為則衆騎以次徐進云千騎列雲涯試看止齊勢端稱左右宜彌縫休欲速磬控尚需時勒馬平岡待斐然立就詩合圍周却笑繁重善御信何稱豈有車從獸何殊屠命僧詭馳我所戒連中衆多能他藉無須亟留資嵗嵗仍罷圍地不傷農事情還聫衆歡陳牲蔽芳甸頒獲逮儒冠漢大臣隨圍者頒獲每及之習武毋忘業暢逰亦戒盤控弦教憩息西日在槍竿圍中獲白麅詩以紀之有序昨秋蒙古台吉必力滚逹賴以白麅進嘉其應時獻夀曾為之圖而紀以詩今行獮塞上於巴顔河落圍中復生致此毛色純潔性特馴擾周却所僅見也拈吟紀實匪侈祥符瑞獸貺三靈嘉符應六星性馴豈鋌走質異似來庭晴彩丹砂煉毛章白玉亭不教施赤羽端合飼蒼苓詞客希成頌仙人夙駕軿底須宣史館曾未注禽經圍中獲生麅致之避暑山莊即目得句生麅無數獲圍中放入山莊楓桕叢取之外囿置中囿豈是深謀荀息同行圍四詠疊去嵗韻癸酉撒圍秋令木蘭獵年來率按行伐齊既以習紀律亦因明據嶺排羣伍沿蹊致兩旌詎徒恣從獸要寓詰戎情待圍中軍例徐進猶在白雲涯選勝居其要乘間酌所宜層巒疊嶂際翠柏紫楓時隱若山靈詔依然合有詩合圍如星之拱所擬月以圓稱嶺碧遙拖栁峯圍逈矗僧碧栁嶺僧機圖皆圍場內地周遮羣效力馳射各呈能靈囿天然闢朝家奕世仍罷圍素志常銘內臨歡戒極歡息教歸布帳招底藉皮冠炊熟地為竈割鮮草作盤披星仍逮曉晏起敢三竿雨獵虞人破曉驟前斿圍合秋山雨腳稠成局不教傳罷獵佳名漫擬魏文侯千峯頃刻吐雲奇一陳涼絲馬上披頗念征人歎漸石關中秋麥却宜時度嶺踰溝萬點繁瀑垂何必藉遙源雨衣不漏知需瓦譎諫還因憶讜言時止時霏煙景宜凌風赤羽未嫌遲數畨馳射徐收伍跋涉吾原衆共之小獵甲戊諸部皆擕獵騎行為聽指使各將誠便教小試龍沙坦嘉彼殷勤奉上情麋鹿雖無饒雉兔平川淺草吉驎飛所乘馬名順吉麟肅罝不藉爰爰中嘉兆今秋第一圍黍田牧野間平岡愛看雲容漸作黃分付獵人避蹂躪便因失次審何妨魚貫雁行循律度控弦按隊識尊親忽臨中次傳收獵已避長途草里塵霧獵磧山作霧亦太奇白綿青嶂紛髙低依微回薄幻晴晦窈鬱散漫迷東西蒙古慣見不介意依然塞甸陳獵騎林中即鹿有虞人吾亦因之射生試風來霧散嵐嶺清偏伍不亂魚貫行據鞍大笑有如是區區何數劉雄鳴即事從覘奉上誠射虎行乙亥虞人來報虎負嵎羽林親率往斃諸度岡紀壑不數里榛叢早見藏於莬鉆鎗如雪周邅布耽耽有猛無逃處忽然挺走衆辟易欲往前山據深樹安吉驄如闞虎騮二馬名闞虎騮今老矣是日所御者乃安吉驄云籋雲一䇿飛鳥愁追奔肯使牛哀逸夏服在右烏號柔馥然中要只一矢炳文髙架駝峯紫厄魯齚舌頌盛稜是日新附諸厄魯特台吉適至笑謂今朝偶然耳雨獵丙子炎蒸為雨信有哉獵騎已布􅒴腳來連嶺隔谷罷誰是便冒霡霂催龍媒時忽飄絲時忽止光怪千峯難狀擬徑羽雖濕亦能飛駭鹿欲藏還瞥起應弦馥中萬人喜厄魯咋舌銜其指雨衣宜瓦非所知南北之強異張弛儒冠著製候和門不議今朝復有此行圍即事秋獮乘時嵗一來神臯素節靜無埃迾千二百騎惟羽布左右中官是材木葉已看吹籟落野花還自冒霜開揆文奮武難偏廢點筆賡箋每召枚神心妙逹是清秋地逈興安景更遒雲影山光含動靜泉聲葉響驗沉浮目鴻霞表懷因逺耳鹿崖邊興亦留校量常年得佳話隨圍今後有渠搜兩翼鴻絧隔嶺張黃麾據勢獨堂堂如身使臂臂使指舉綱有目目有綱地豈稻粳馳騁得林真錦繡詠歌常山靈似有相應處子墨虛文免賦揚雪獵丁丑一夜朔風吹凍雲髙峯低谷皆皴玉雖寒不濕可三驅連網周阹謝千軸供役左賢還右賢是皆慣馬且耐寒習勞示矩可辭冷我亦因之試玉韉六霙時止復時灑磬控疑驟藍田野丹黃青緑繢銀崚塞景清都入吟寫麗龜釋彌真快哉紫狐輕點祥花皚陡憶伊犁大於掌官軍尚待歌歸來放鹿麀鹿逾常夥開圍任赴榛聊因學宣牧木蘭之獸本如苑中所牧留以孳息亦欲取之不盡之意耳匪欲博湯仁悠逝得其所分頒逮尚均寧遼待取報明嵗獵甡甡叢薄行戊寅叢薄之中聞有虎三子逐逐隨其母鎗斃於菟及一子其二曳尾藏深莽惡獸應弗留餘孽是非所云不探卵叶因命生擒觀壯材羽林徼􅓈皆暴怒兩人搏一何足云一人獨攫誠堪詡其名乃曰貝多爾索倫侍衛中英楚手尾挈領安且詳須臾虎兕入柙虜被斑褲白涉鋪張豈似今朝萬目覩喜亦詎為萬目覩適有新歸化布魯圍中己卯圍中選勝坐翠垠嘉樹為蓋莎為茵時看足底飛白雲風吹落葉左右紛目不見俗心無塵我豈長林樂隱淪頗覺巢由不我擯隔川忽過蒼鹿羣圍逺未致驚迸奔擇肥命中施花神於虎用虎神鎗於鹿用花神鎗皆皇祖時所貽武功良具立斃其肉實鮮新奔走蒙古及索倫舉火即析山之薪割生炙熟不逡巡鸞刀手試嘗其􅘡呼前分賜飽德均上下和樂胥歡欣由來古俗匪自今叶景宗小哉安足論雪獵榑桑日出鹿罷鳴興安放圍趁曉晴須臾山頂塞雲興空谷橫配藜浩唐𡨕宜鏤氷翦水霏祥霙側峯橫嶺忽瑶京丹楓翠柏胥著英創景宜視復宜聽怒號萬竅不一聲砰磅汩濦駕廣陵鏦鏦錚錚兵馬行又如張樂於洞庭八音繁會歸和平是謂山靈示厥靈鴻絧騎夙慣經淫淫裔裔緣峻嶒迷津失岐又豈曽圍合廣甸無逸麖毳服蒙茸凌寒輕瓦衣不漏漫譏評烏號夏服手中抨命處藝殪奚足稱嘉哉札薩奉上情四十九旗諸札薩克蒙古隨圍執役較之喀爾喀青海及新厄魯特歸化尤久與八旗察哈爾遂無分别矣上下和樂延休禎亦不詡言戎索成玉田蹙踏旋歸營和門侍立漢九卿褒衣博帶誠儒生相如之賦爾應能射虎行圍中報有虎負嵎佽飛親率往殱諸隔谷白額欲潛遁神鎗一發早中去聲渠驚避深林曳尾掉迾騎前遮容逺跳金桃皮弓雕羽箭凌秋風如餓鴟呌馥然入其要害處耽耽雙目淪精曜蔚皮載駝聊足欣攘臂下車真可笑放鹿行邇年迤西率未到今來欲一窮其奧獵所未經獸所都湯武驅民義可曉叶夷坑拔鹵嗟太勤供役惟千二百人峯嶤谷阻弗遺棄雁行魚貫聫汾沄放圍隊疏漸進密麌麌之盛過沮漆大宛青總金僕姑或羣或友燕悉率肩疲腕怠獲他他廣原奔迸猶餘多物亦命也戒盡殛取之無厭理則那傳宣開圍任逸避長林豐草悠然逝索倫笑我喣嫗仁搢紳詡我祝網義詡我笑我兩弗居蓄養外囿斯深意九月朔日作庚辰秋季惟朔旦塞圍第一場千山斂雲氣萬樹絢晴光迥巘鴻絧合深溪魚貫長咸賔逮回部入覲之都爾伯特親王䇿凌烏巴什等向曾豫觀塞圍其回部酋長霍集斯伯克霍什克伯克等以賜爵留居京邸並屬櫜鞬從則自今歲始云執役有名王舊扎薩克王公台吉等率所部蒙古隨圍執役歲以為常柔逺繩先切詰戎寓意良寧當懈幾務獵罷閲封章行圍二首天府神臯百獸甡細莎灌木靜無塵最欣悉率升大阜底籍要遮事斥闉割胾炙鮮猶古俗炊金饌玉直癡人舊藩新部衆同樂獨者惟斯染翰頻千二百人各職司率先扎薩恐淹期衆扎薩克每日於五更時領衆前往撤圍圍將合即親至獵場率先馳射以均勞逸不令踰時久待尊為元后親為父威實何須恩實宜峻坂有時亦馳下神鎗無故不空施從來柔逺兹常厪武定遐懷益慎兹雪獵十韻九月十七日塞雲低靉靅朔雪灑氛霏萬嶂增嚴氣千林纈索輝月同光不濕風似定還飛壓帽輕於絮堆衣幻作璣藩王羣扈蹕漠嶺早張圍誰肯氊裘著都欣玉䇿揮襯蹄致馬疾刷羽益雕威搜穴虎呈迹炙鮮鹿薦肥彌漫迷澗户飄瞥嫿林扉乞相寒江上一蓑披得歸木蘭行圍即事雜詠八首辛巳將謂秋深柏峭寒新紅濃緑尚興安賡詩自有諸學士執役方來衆可汗魚麗雁字呼縝紛習獵由來寓習軍敢謂拓邊還定武周書垂訓此尊聞抨矢彎弧忘臂病今秋頗覺臂略痛亦因乘興亦先身都爾平聲伯特烏梁海况有新來觀化人黃幕高張面翠崚筵開灑馬錦雲騰呼韓上夀尋常事漢史嗤他太艷稱氊廬雖是不懷居宜月宜風便有餘適暇挑燈惟著句勝前嵗此治軍書丹楓翠柏金官繢山色溪聲大塊文寓意由來不留意閙中無礙靜中欣崇山尚自行泥淖今嵗秋霖盛絶殊陡憶楊橋歌瓠子即今歸舊有成無粗觀大意過秋山詩稿將盈篇幅間何必多今從杜語非關藏拙實偷間雨獵七月草六日壬午塞山清曉雲如油須臾雨羃千峯頭獵騎已放奚事止看城早駐藍旗斿凡行圍以大黃纛為中權以白紅二旗居左右翼之中兩翼前各以一藍旗分隊馳進至二藍旗俱會駐看城則回合矣櫜鞬䇿馬便親往衝煙冒霧尋清逰灑空時霏時却息巖枝澗葉翻銀流干二百卒宿精練鴻絧尚致野獸稠弓漸無礙燥手濡無礙柔一發中其麌再發斃其麀四十八旗夙習見哈薩厄魯心服尤中朝或有諳古者謂當罷獵學文侯既不受譽毁寧受詰武身先意所留一之為甚亦弗再傳宣明雨當停搜甸獵乙酉甸獵非山獵平原草未黃入崖斯小試便路例成常始入圍場駐行營次日方布大圍以路便簡百餘騎小獵平甸年來率成常例驚雉蔽空起崖口內野雉較往嵗尢多呼鷹逐影揚蘭中初獲鹿飛騎進仙莊是日祗獲一鹿以初獵所得遣侍衛馳至山莊恭進雨獵圍布秋山落驟霖罷之轉厪失人心文侯彼其去聲不同道扎薩今誠有共欽馬選上間馳濘坂鹿飛一箭斃深林冒雨獵騎不免迷失山谷故圍中鹿少祗見二鹿各一箭斃之文臣鵠立和門候涼雨猶當濕弗禁大學士尹繼善隨圍因請詩走筆成什調之丙戌久置馳生耳後風過五旬後雖每嵗行圍然不似向年御飛騎下峻阪矣偶然蘭阪驟雲驄雖拋射鵠五年閲向喜射鵠幾暇常集侍衛等試射中的恆十之八九自壬午以後因臂病不能如志弗為者五年於兹而馬射則仍緞送如常也原屢中去聲麚片刻中草四日圍中發矢連斃五鹿草五日復殪其三尹繼善見之驚為神異因命其射一疲卧之鹿則第三箭始著鹿身轉蹶起帶箭而去祗以賤良衆屬目笑稱馬步一張弓緑營不嫺馳騁馬弓之力率減於步弓遂有以馬步一張弓誇於衆者若我滿州則馬射更為得力故其弓較步弓尤強尹繼善久蒞外任習聞緑營語因戲及之隨圍老翰催成什譎諫相如同不同行圍二首一韻前章即景後章即事高秋塞景入精微按轡行吟契靜機水似客彈山陽曲山如僧著水田衣霜前紅葉才方染暖後緑隂猶覺肥應接何妨略無暇畫屏匼匝四鄰圍千騎周環一徑微嶤峯標處識僧機峯名向賦夷齊松即在峯下控弦總是無前士提馬偏宜短後衣弋逈賓鴻常墮落炙生祁鹿正鮮肥藩屏逺近同傾仰王制難循不合圍雪獵丁亥靈山有靈驗圍展雪來隨帶日飛冰片不雲布野陂拂林重燦蕊著鹿總成麋鹿皮無白章惟麋獨有興安有鹿而無麋迤南始間有馳射原無礙便宜更是詩射熊行虞人來報熊咆林佽飛親率崇椒尋倐眒羣逐出叢樾一箭要害洞中去聲深馥焉肆地目精散封駝有力馱難任復報翠微出其子駐馬掩搏觀勇士須臾子路入檻籠手羆足麢寧虛揣畜之虎圈暫貸生平原不射非所擬雨獵戊子大幹以北氣愈寒仲秋之杪例落雪今歲暄暖所罕逢山雲作雨殊清絶圍衆已布難中止縱送何妨衝雨獵馬馳草坂偃濕莖鹿出林岡帶飛葉千二百騎益鳬藻漸石霑裳非所説和門鵠立候儒冠布帳烹茶樂應别獵己丑萬嶺煙開紫翠光行圍詩興亦因償丹楓白樺皆堪詠日暖霜遲未覺涼峻坂疾馳不復作前禽連中固如常匣封飛遞軍營奏駐馬批裁務妥詳合圍後已䇿騎至山巔適經略大學士傳恆奏函由六百里遞到即於馬上批答並傳諭指授機宜以期妥速集事旋至獵場射鹿連有所殪仍無愆晷刻也雪獵庚寅雪獵非如雨馳驅興越豪不虞箭羽濕偏喜獸蹤邅雪鋪白色獸蹤益顯見馬習手中轡鷹翻臂上絛詩情在何處鏤出玉峯高雪九月十一日塞雲羃嶺漸霏微遂作六花彌谷飛一例玉驄馳磬控為去聲他撒就滿山圍布圍今謂之撒圍配藜合沓亂飛浮鏤莽雕林致最幽却是粘衣盡乾雪底須止獵學文侯迷離不辨濳林獸突出還教倒應弦所獲今朝多白鹿寧煩祥瑞詡文篇拈毫詠素我原間創景多欣值此間凍凝去聲岡巒應作滑傳宣明日罷圍還尚餘塔里雅圖一圍因念雪積山間入夜必凍獵騎蹴滑非宜遂傳諭罷圍即於十二日出哨駐張三營射生手壬辰國語及蒙古語皆謂之默爾根選善馳能命中者為之圍中射中獸則命若輩隨蹤獲取射生手射生手諸部人中無不有掄其精者侍兩傍御弧中去聲獸隨獲取射生手數近百挾弓抨矢舒雙翼百人中必有一中去聲後同中則都稱射生得千二百騎圍如輪驅來悉率宴一人百射那能必百中弗中羣憮中羣頌詰戎示度以已先奚啻十目之所觀一節亦識為君難行圍偶詠癸巳飛騎藍旗谷嚮宣撒圍時兩翼俱以藍旗為首每翼數騎擁纛飛馳謂之跑烏圖哩將至看城喧呼瑪喇哈則圍合矣彌縫兩翼拱中權待暄以出笑兹日視地而馳慙昔年時亦擇肥能命中無非示衆弗忘前細思頗合為君道不息自強曰體乾罷圍甲午屢曽雪獵喜為詩卷密放彌各有時適以萬林攢霰落遂教千騎免圍披未能親罷魏文慙去聲也覺吾衰宣聖思䇿馬還營慰心處迤南應雨麥田滋雨獵八月草一日丙申曰雨誠逢雨山靈不爽靈是日駐海喇堪山前忽霏一天白却隱萬峯青圍撒難中止布圍俗謂之撒圍馬馳隨密零擇肥仍命中去聲少習業猶寧題蘋鹿玉韘己亥白露為霜蘋野披肌肥色澤樂伊尼梵各鹿曰伊尼合圍命中兹重舉木蘭秋獮詰戎惠遠之意存焉兹既過二十七月依例行之弗以長年圖逸罷圍也出哨尋幽久不為哨鹿必趁天未曉鹿方鳴之時歷險尋幽而後得雖國家習勞舊制意聖母每以厪念故久不為矣今重思之不覺㴘然弓矢既調資佽手畫圖堪勝祗傳皮設如發羽方省度慎弗失之鑒在兹雨獵八月二十二日辛丑詰旦遙山早撒圍山雲忽挾紬絲霏擬如親往傳罷獵却是千人已濕衣是日出營時即微雨而撒圍者率於寅刻即前往由遙山徐徐而進以待然人皆備而具而往遂於雨中行獵蒙古供獵者千二百人云千者舉成數耳農人霑體還途足獵騎衝煙亦冒雲各有所司計衣食誰能一例免辛勤見説山靈果是靈洗山雨為衆人經是日經海喇汗山此處山神靈異凡人衆經過必有雨試之屢驗俗謂之洗山云倐看萬瀑全拖白何礙千峰暫斂青孟氏名言衆共之從來雨獵每勤斯向過此屢有雨獵之作軟弓仍可家風試往年騎射俱挽強自臂病後弓力大減今年逾七十雖軟弓仍可命中蓋國俗向有軟弓長箭快馬輕刀之語為長技云中鹿其長何足竒雪獵八月二十七日雪獵全勝雨況經習馬鞍獸蹤現莫隱山徑凍微乾罄控隨心穩復陶被體寒須臾紅日朗玉失萬峰攢雜詠辛酉木蘭從獵者晨星一二見康熙逮今辛丑四十載一二晨星靡孑遺入獵乘輿避曉涼向年木蘭行圍即於清晨策馬近年以春秋漸增曉涼乘輿至等城上圍則仍控馳如前也調間軟步試平岡無須重讀相如諫鄭重而今自合當新舊諸藩逮百旗從獵蒙古王公內扎薩克四十九旗又喀爾喀四部及四衛拉特并青海等部落各扎薩克不下百餘旗我朝中外一家之盛實史册所未見云底應甌脫外觀之或為子輩或孫輩親我老人左右隨癸亥學談蒙古語回畨唐古遞通多余自乾隆八年習蒙古語二十五年平回部習回語四十一年平金川習畨語四十五年因班禪來謁並習唐古忒語皆以學而能也而不學者光隂玩愒吾未如之何矣笑他玩日愒時者自畫無成奈汝何殪虎行壬寅秋獮額勒蘇那西額勒蘇蒙古語謂沙西那謂岡是日圍埸地名麌之羣紛其多肩墮腕疲獲已夥又報虎負崇山阿隔谷擇勝駐馬視佽飛健士周遮羅耽耽猛獸不能出翻陟峭壁沿嵯峨刺矛發矢不能到於菟意謂逃生過虎神鎗合此際用向壁命中無時何墮崖衆進獸已斃頺然橫陳荒草陂二子竄入攢石窟搜穴易殪祗頃俄魏明不忍寧謂此除惡務盡語豈訛戴衢亨獲麅即賜之因成是什並令和韻圍合山原飛走充儒臣扈蹕詠車攻拈毫倚馬本多秀入帳執禽乃獨雄九月朔日阿格究圍場於等城待圍時圍中逸出一修撰載衢亨執之以獻因即賜之獵騎訝看非等類文班喜語共和融狀元端是讓前輩丙申年木蘭行圍時大學士于敏中於行帳中獲一鹿以獻有獻禽署閭部之句于敏中乾隆丁巳修撰也大鹿小麅獲則同欽定熱河志卷四十七
