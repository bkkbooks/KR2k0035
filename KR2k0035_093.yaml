body:
  text: 欽定四庫全書欽定熱河志巻九十三物産二果之屬草荔支叢生結朱實至秋而熟味甘聖祖仁皇帝賜名曰草荔支御製詩草荔支甲戌叢生朱顆味甘且芳似普盤而無子普盤亦内地所無而塞外恒有此惟興安及烏喇乃有之皇祖時命移植山莊錫名曰草荔支當秋而實閩貢適至蠲渇生津難擬伯仲也滿口甘腴撲鼻芳女夷雅解遺去聲雲漿品題造物能名物比似元方與季方漫譜瓤平如絳雪饒稱核小尚丁香崇椒嘉植烟霞外那更羶薌待蔡襄普盤木本叢生結朱實味甘酸略似楊梅聖祖御製康熈幾暇格物編四集普盤即木苺一名懸鉤子爾雅所謂葥也按本草云懸鉤樹生髙四五尺其莖白色有倒刺其葉有細齒頗似櫻桃葉而狹長又似地棠花葉四月開小白花結實色紅味酸美人可多食之有以為即覆盆誤也葢苺有三種藤生縁樹而起者大麥苺乃入藥之覆盆也樹本挺而叢生者木苺一名山苺即普盤也草本委地而生者地苺一名蛇苺不可食今江南人謂之蛇盤也櫻額樹不甚髙叢生結實離離可愛形如黒葡萄而差小至秋熟可食味甘澁聖祖御製康熈幾暇格物編四集櫻額果屬也産於盛京烏喇等處古北口外亦有之其樹叢生果形如野黒葡萄而稍小味甘澁性温暖補脾止泄鮮食固美以至晒乾為末可以致逺食品中適用處多洵佳果也今山莊之千林島徧植此種每當夏日則纍纍綴枝遊觀其下殊堪娯目不獨秋實之可採也查盛京志云櫻額一名稠梨子實黒而澁上人珍之間者亦作麵暑月調水服之可治泄又查本草有楮李本髙一二丈低者八九尺葉如李但狹而不澤子於條上四邉生生時青熟則紫色若五味子至秋葉落子尚在枝治水腫腹漲滿除疝瘕積冷今闗陜間時有之稠梨或即楮李聲訛也倒弔果形如山梨而差小其花實皆下垂故名熟時可食其味酢聖祖御製康熈幾暇格物編四集倒弔果俗名弔搭果形似山梨而小體㣲長味酢肉多沙長蒂諸果始生時皆向上此果花實皆下垂故名生時堅澁熟乃沙性煖利健脾消食樹枝葉俱如梨為秦中物産今遵化沿邉有之而考之書籍草木諸譜皆不載倒弔之名惟司馬相如上林賦云荅遝離支荅遝音近打拉張楫注曰荅遝果名按梅堯臣牡丹詩用打拉二字北人方言以欹垂為打拉是打拉名果或因其下垂也説文海篇俱作榙果今名倒弔或是荅還音之轉耳花紅柰屬土人稱為沙果其一種大而赤色者為㯽子味㣲酸澁土人亦謂之香果元楊允孚灤京雜詠詩曰海紅不及花紅好注云海紅花紅皆果名考今之沙果亦名蘋果詩所云甘棠即沙棠也呼㯽子乃赤棠也詩甘棠毛𫝊云杜也鄭注云北之謂之杜梨爾雅杜赤棠注云今之杜梨今赤峯縣境内有杜梨子溝以地多此果故名聖祖御製康熈幾暇格物編四集李𩔖甚繁林檎其一也樹不甚髙枝葉皆如李花白唐人謂之月臨花實如李而差小有紅黄二種本草所謂金林檎紅林檎是也獨核有仁味甘津一名來禽亦名蜜果此果味如蜜能來衆禽於林故得林檎來禽蜜果諸稱學圃餘疏謂花紅即古林檎誤矣花紅柰屬也柰有數種其樹皆疏直葉皆大而厚花帶㣲紅其實之形色各以種分小而赤者曰柰子大而赤者曰㯽子白而㸃紅或純白圓且大者曰蘋婆果半紅白脆有津者曰花紅綿而沙者曰沙果西京雜記所以有素柰青柰丹柰之别也又有海棠果通志謂之海紅而闗西有楸子有榅桲滿洲呼山樝曰榅桲與陜西同音查梅堯臣有得沙苑榅桲詩政和本草附載榅桲扵柰内是宋時已有此稱其始或從陜西流名闗外或從闗外通音陜西俱未可知亦皆柰類葢李之與柰其枝葉花實固區以别而其子核之異尤最易辨堅而獨者李類柔小而四五粒者柰類草木諸書皆以林檎附於柰類其亦未嘗體認物性矣北天竺叢生深秋結實色正赤類南天竺子皇上賜名曰北天竺御製詩北天竺辛未塞山竒種異植茂宻䝉茸神農岐伯有所未辨郭璞陸佃夫豈能疏有倒生絶壁不與恒羣結子纍纍玫瑰靺鞨其色而扶緑葉者問之䝉古不能舉其名與南天竺子相類因名之曰北天竺而繫以詩佛説西天竺視如乾闥城而誰於卉物南東强借稱四維缺匪宜朱穂百八盈儼從兠羅手飛來證無生北亦有天竺吾今正其名是地秋嘗雪渥丹積素擎樷益滋其緐葉不改其青隠笑南方暄耐寒孰不能烏沙爾器樹髙數尺實如櫻桃而小可食味酸苦御製詩烏沙爾器乙亥樹名生塞外秋結紅果一枝纍纍千百顆見廣羣芳譜紅子垂垂緑葉飄巖闗一綫限春翹女夷賦物饒神解塞外竒㽔映綺寮是果皆花自作林珠囊錯落翠陰森笑他移植郭駝拙只許行宫伴倚吟常命移植御園雖成活而不茂地氣之限有如此者珊瑚為實玉為葉艶發秋風也自豪不向廣羣芳譜檢只疑天竺與櫻桃烏沙爾器二首用逥環韻體癸未朝來秋日又秋風特地秋光玉塞中底覺階前太分曉烏沙爾器一枝紅昨穂含青今綴紅信饒梧葉落庭中愛他千古依龍塞不入離騷與國風烏沙爾器丁亥珊瑚珠襯緑瓊葉是實非花花不如未入稽含閒檢校塞山太古自全初烏沙爾器壬辰前日全緑葉今朝紅果垂木難羞錯落火齊頓然疑夏後庭松側塞中天竺奇秋光劇滿眼不肯譲惟時奇石蜜食緑蒲萄也結實無子本布哈爾種西域平定後自回部移植御製詩奇石蜜食癸未回語緑蒲萄之名也凡蒲萄皆有子此獨無子截條植地而生回中古亦無此種云數百年前自布哈爾始得之布哈爾去葉爾羗西又數千里前年命取根移植禁苑今成活結實詩以紀事服食明垂貢旅􅋙苑中初熟緑蒲萄昔同目宿原有子中國蒲萄相𫝊種來自西域然皆有子者此便離支寧比髙魏文帝詔南方龍眼荔枝寧比西國蒲萄石宻石宻之音頗近回語豈當時亦曽見此耶廣志徒𫝊三種色廣志云蒲萄有黄白黒三種燕歌休詡一杯豪奇石讀作平聲蜜食賔方物慎徳那辭乾惕勞枝葉蟬封獻者同碧琉璃顆獨中空采條移植上林茂結實頒餐造物功欲笑醱醅歌太白直疑崖蜜詠坡翁本來無子根何託雞卵誰先辨豈窮榛元一統志曰大寧土産榛今塞山多有之實極美好土人每收貯鬻於闗内常山峪行宫中榛樹尤多山莊内之西嶺有榛子峪亦以此得名御製詩榛癸未塞外叢生塞裏無秋來佳實剥盤腴白鴉谷口栗如擬却未曽登杜老厨梨元一統志曰大寧路大寧富庶二縣恵州興中州建州皆土産梨元楊允孚灤京雜詠詩曰買得香梨鐵不如玻璃碗裏凍潛蘇注云梨子受凍其堅如鐵以井水浸之則味回可食今熱河山家多有之以甘脆勝不盡如允孚所詠也山莊内梨樹峪有梨花伴月之勝䝉古謂梨為阿里瑪建昌縣内有阿里瑪圖谷以有梨處得名又一種名為罐兒梨味甘而小一種名山梨一作酸梨又名香水梨味酢而多水爾雅謂之檖注云實似梨而小酢可食本草謂之野梨汁經煉成膏味鮮美棗元一統志曰大寧路富庶縣恵州興中州建州皆土産棗䝉古謂棗為齊巴噶今平泉州建昌縣諸境内有齊巴噶山及齊巴噶溝皆以棗樹得名又一種名酸棗似棗而小爾雅謂之樲注云樹小實酢者是也栗元一統志曰恵州土産栗塞外栗結實㣲小圖經謂燕山栗小而最甘今熱河所有大扺皆燕種也蒙古謂栗為呼什哈今灤平縣境内地有稱呼什哈者以栗得名核桃一名胡桃學圃餘疏曰核桃北果而宜山種今塞山多有之松子本草曰松嵗久則實繁中原雖有不及塞上者佳好也今塞山多有之桃元一統志曰大寧路大寧縣恵州興中州皆土産桃今豐寧縣之白雲洞平泉州之鳳凰嶺諸處尤多乂一種名山桃爾雅謂之榹注云實如桃而小不解核羣芳譜謂之毛桃杏元一統志曰大寧路大寧富庶金源三縣恵州興中州建州皆土産杏又富庶諸縣土産大杏仁今闗外多杏山中多老杏根文理細宻可以飾器柿山家有之經霜早熟其一種軟柿實小而長亦名牛奶柿安石榴山家有之其一種名海榴植以供盆玩亦能結實山樝土人稱為山裏紅味酸澁羣芳譜曰一種小者實有赤黄二色堪入藥大者經霜乃紅可食今塞山多有之櫻桃有赤白二種白者味㣲酢尤難得元一統志曰興中州土産櫻桃今平泉州境内有櫻桃溝又一種名山櫻桃子小而尖亦可食而味遜郁李棣也子如櫻桃可食即豳風之鬱元一統志曰大寧路和衆縣建州皆土産郁李仁考陸璣詩疏有白棣赤棣二種今所産惟赤實者為多葡萄有紫葡萄水晶葡萄馬乳葡萄數種元一統志曰白葡萄出興中州城西北隅明一統志謂三衛土産白蒲桃葢即据此又一種名山葡萄苖葉花實皆與葡萄相似惟實小而圓即豳風之薁也羣芳譜謂之野葡萄烏喇柰一名歐李子土人稱為酸丁廣羣芳譜曰烏喇柰塞外紅果也實似櫻桃而大味甘酸然不可多食巴㰖仁元楊允孚灤京雜詠詩曰杏子何如巴㰖良注云杏子巴㰖仁皆果名御製詩山果辛未山果靺鞨紅經霜甘且脆設使結炎方離支譜應次水果菱塞外多山少池塘是以水果較遜而山莊之内環帶澄湖實饒水産有採菱渡之勝御製詩菱癸未濶腰鋭角熟湖中渤海猶存太守風澷議浮根歸落莫須彌世界也依空艾菱辛丑菱與荷並生塞湖始原洲渚各分區侵尋菱占荷之界簇㦸角葉波間鋪荷之田田勢脆弱菱之蓛蓛興豪粗是謂小人害君子此而不治直道無因命艾菱俾荷暢紅花緑葉恣芳敷祛邪扶正非害物斯豈寧因逺觀圖聚散劄子讀牟氏絜矩恐有似此夫蓮荷實曰蓮山莊湖中多有之藕荷根曰藕山莊湖中多有之木之屬松宋王曽行程録曰自過古北口即蕃境山中長松鬱然元史松州在松林南境元一統志曰大寧路富庶縣龍山龍恵州皆土産松今近邉諸地經明嘉靖時胡守中斬伐遼元以來古樹略盡然山中尚多松林以黄松為貴又有白松廣羣芳譜謂之阡松其幹直上枝葉如盤下枝長以上漸短逺望無異浮圖其體最輕䝉古謂松為納喇蘓今塞外諸山多有稱為納喇蘇台者皆以有松處得名山莊内則喬松尤多諸勝景以松名者若萬壑松風松鶴清越及松壑間樓松霞室松雪樓松巖亭就松室其尤著也御製詩松乙亥千林蒼翠皆空幾株謖韻嚴風底視巖枝澗葉芳時許爾相同移松癸未松在襍林下屈抑弗得長雨潤及日晅莫被天恩蕩沮然色半黄恧矣顔如强上伏地溽濕草木咸資養乗睱課移植出蔽遷佳壤本疎培欲平擇向取髙敞會看放喬枝童童緑陰廣所樹不在茲樹人因可想松疊巘㕘天翠越濃韻金風籟謖重重低臨萬樹猶同色咨爾行將認老松稚松甲申稚松得地放新枝老榦凌雲定可期自喜栽培出豐蔀去年猶記雨中移倚松吟壬辰徙倚古松下因成倚松吟古松不知閲世幾何載但見㕘天黛色聳十尋横枝􅕜㙷張翠葢縱有赫曦其下仍濃陰因提疏仡以來共日月兒孫行去聲視秦松漢柏惟斯任惜哉未生長城以内地羶薌翰墨名𫝊今亦幸生茲塞外留本色彼其虚聲諛頌誠末事耳奚足諶倚松吟𣺌予心穉松甲午穉松種庭前不覺随年長縱無拏空枝自具凌雲想山中有喬柯少計以十丈阿誰為我植宜此付他賞况我託懐别良材要作養落葉松松葉移身生興安嶺北質極堅緻入水土中年久化為石芒刺傷人肌即腫難消其葉當霜後即脱與他松異今山莊亦種之廣羣芳譜曰蒙古以其皮代茶木性最堅其幹直挺㕘天枝葉蔚然松上寄生白脂厚五六寸光潔似玉微軟而堅聖祖御製康熈幾暇格物編四集五臺及口外興安髙寒之地有樹名落葉松枝幹與杉無異而針亦青蔥如葢惟經霜雪後則葉盡脱其木質甚堅有㣲毒斫伐時誤入肌膚驟難平復根株厯乆不朽沉埋水土中則變為石可供摩礪之需亦松杉之别種也御製詩塞外落葉松歌辛酉我聞松柏有本性經春不榮冬不凋此木亦被松之名當秋葉落何刁刁凌空足有偃葢枝詎無盤屈傲霜條或云塞外節候殊千林隕蘀秋寂寥嚴寒栗烈異徂徠故應落葉紛蕭蕭我聞此語増歎息古來志士不易撡因地寒暖變節㮣蒼松何以殊蓬蒿此木非松冐松名千秋定論應難逃落葉松丙子塞外有此種昔曽詠之有因地寒暖變節概蒼松何以殊蓬蒿之句今移植御苑亦森森成活非不菁蔥挿㙷居然松也一入冬則真偽分矣觸懐得句抑亦有所思焉亦被八公號移來千里途木蘭去此近者不過五百里逺或千里舉成數耳春前生嫩葉霜後賸枯株頗有充君子寧無假大夫真松莫相怨聊待嵗寒乎落葉松丁丑松有落葉者乃在興安北其山夏積雪風勁善蕩滌是木性宜寒翠雲盤崱屴而頗羞獨樹與衆同凋寂崖口向已無闗内何能得我命帶根移培平土固宻既因順木天遂如轉地力奇峰詭石側森森助景色材豈限於域由來繫培植鳳尾松松葉如鳳尾故名㫋檀林階砌間有石孔尺許乾隆乙未嵗植鳳尾松於此御製詩詠栴檀林鳳尾松十韻乙未砌石為樓階有孔以尺計命種鳳尾松偶然供㸃綴移根自别所徙植扵兹地其生與弗生固屬難定事視之六七年日見森長遂鬱鬱放枝葉蔥蔥吐青翠髙欲出樓檐粗欲彌孔際少當百春秋今人見弗逮然必有其時逮見夫何異聊識拱把姿乾隆乙未嵗詠栴檀林鳳尾松疊乙未舊作韻己亥随宜築山舍奚用延袤計而迥得佳概懸居若空綴懿此鳳尾松移根自别地恰值門前石有孔亦奇事孔圓徑一尺松纔拱把遂放根綽有餘得氣鬱蔥翠兹别復三載不殊彈指際雖覺分寸粗石孔粗未逮逮其同孔粗誰當詠靈異百年已難期而况期千嵗俗云千年松萬年柏若至千年此松當粗彌石孔矣詠栴檀林鳳尾松再乙未舊作韻辛丑於古有恒言種樹十年計是葢謂榆栁目前供景綴松柏異衆木十年根認地百年方拏空品髙無易事譬之君子人晩成弗速遂而我於石孔移種鳳尾翠初縁一時興思未及此際幸其得地氣粗増分寸逮巖間蔚古松相視何同異七年凡三詠再詠期十嵗韻已再叠詩書三首以後當以十嵗一叠為限耳詠靈珀庚子松柏含靈氣仙葩幻有無堪方􅕴茁砌漫擬􅛋生厨陽復漸成菀陰生逐就枯人心小天地視此定何殊梌即楓之屬叢生嵗久成文理甚為堅緻材中諸器聖祖御製康熈幾暇格物編四集楓樹南北不同北方原無楓樹之名自南巡見楓樹始知北方之梌木即是楓樹但南方厥木惟喬所以直生北方厥木惟叢故矮短耳其枝葉則相同也楓塞山多有之秋初未經霜已有紅葉秋漸深則全作頳紅與蒼崕碧嶂相間毎逢清蹕經臨秋容獻麗旌門輦道間望若錦繡嵗邀天藻留題山莊内則北嶺尤多有青楓緑嶼之勝御製詩楓癸未乍見新紅三五枝停鞭還為立移時吟丹自我償詩債近作有楓林槲阪遲詩約塞上重吟一片丹之句突緑看伊入畫姿松柏有心原共秀李桃無色敢争奇千秋知己應誰是只有司勲杜牧之匪同烏鵲歎無枝一例寒林却耐時絶勝衰楊翻葉態還如老菊傲霜姿嫣紅不數江花好頳紫惟應塞樹奇自是山靈儀衛肅樵蘓誰得斧斯之詠楓再叠前韻朔地依然越烏枝恍如霜落洞庭時滑稽重憶呉江句衰謝誰知漢苑姿百嵗為人應是幻千年成虎已標奇丹青天巧能渲染不藉名工顧愷之最喜重吟絳雪枝酣紅猶讓昔年時詎因改緑訾無節却為施朱發妙姿平抹如看霞外影常酡似飲米中奇千林秋色知多少欲向山靈一問之楓丁夘邇日晨霜重巖楓盡作丹樹中𫝊正色塞外識金官照日疑霞爛經風惜露殘林深鹿呼侣枝靜鳥梳翰變幻烟雲狀繽紛錦繡團山靈工㸃綴正及亸鞕㸔楓己巳江楓畫曽看山楓親所覩洞庭猶未波玉塞已如許殷峰雜早霞赬巘明秋宇幻𫝊或作人眈視每來虎今嵗與前秋白駒迅似流林景曽何異帷宫事不侔開窓聊縱目㸃㸃照人愁楓癸未纈峯鋪嶺猶青翠色與平林了不殊稍待染成紅數㸃始知格調有髙孤檜塞山多有之爾雅所謂栢葉松身者也與落葉松相似而非廣韻以為即栝也御製詩檜癸未森森鳳尾倚崚嶒惟十八公許作朋别有一般稱落葉落葉松似檜而非冬時落葉生興安嶺北近移植山莊亦成活氷天瞥眼可猶能榆元一統志曰大寧路富庶和衆龍山三縣恵州建州皆土産榆又髙州有榆山其山多榆木因名今塞山多有之熱河諸境稱榆樹溝及榆樹林者甚多䝉古謂榆為海拉蘓圍塲中地有稱海拉蘓台者亦以有榆處得名其堅老者可任車軸又有榆癭生榆樹上鋸為片色黄文細宻可以飾器土人稱為疙疸榆御製詩榆癸亥自昔稱榆塞經過乃識榆入林雖有徑望樹似無隅絶壑蟠深翠平沙卧老株鷽鳩時决起跳兎善騤瞿一帶排天仗千頭媿木奴縱輸春色好均被露華濡便是逰星漢焉知在朔區闗荆如到此健筆早應圖桑宋曽公亮武經總要曰白川州地宜桑柘民知織絍之地元一統志曰大寧路富庶金源龍山三縣利州恵州興中州建州皆土産桑宋王曽行程録謂但無桑柘者葢偶未見耳今土人亦間養山蠺考十六國春秋前燕録載慕容皝躬巡郡縣勸農桑後燕録亦載馮跋課民種桑柘令此則塞外種桑之始也柘塞山有之葉可飼蠶材可作器欂欏樹一土人取其葉以飼山蠶或以為即槲也爾雅注以槲為􅈪之别名本草謂之大葉櫟今朝陽縣土黙特山中尤多至秋深霜降其葉丹黄與楓林相映椵葉大如團扇初生時可裹粉餌蒸食秋月經霜鮮紅可愛爾雅注曰椵樹似白楊羣芳譜曰其皮土人取為魚網之綱牢固殊常元一統志曰大寧路和衆縣龍山縣土産椵木今灤平境内有椵樹嶺䝉古謂椵為多們圍塲中地有稱多們者亦以椵樹得名樺爾雅翼曰樺木似山桃本草曰其木有小斑㸃紅色皮厚而輕虚軟柔匠家用襯鞾裏及為刀靶之類謂之暖皮其皮色白元一統志曰大寧土産鵲樺皮明一統志亦云三衛土産鵲樺皮今灤平縣境内有大小樺榆溝蒙古謂樺為遜威平泉境内諸山多有稱為威遜圖者皆以有樺處得名凡弓矢諸器用多取資焉杉塞山有之䝉古謂杉為楚古爾蘇圍塲中地有稱楚古爾蘇者以杉樹得名柏元一統志曰恵州土産柏今塞山有之其大者亦可為器用梓元一統志曰大寧路和衆縣土産梓又其縣有梓木山其山多梓因名今塞山多有之槐青槐白槐二種土人收其子可以染黄櫟爾雅疏曰似樗之木圖經以為即柞也其子亦名橡實土人收之可以染皂御製詩古櫟歌辛丑古櫟不知其嵗月盤空緑雲蓊櫛櫛不火寧同楓桕焚山中之木厯嵗久或生火而自焚于木蘭中每見之惟櫟不生火見淮南子非材更逭斧斤伐塵世匠石且弗顧而况玉塞隣仙闕與雲霞䕶鹿豕逰鳳為羽儀龍作骨我每筍輿憇其下颯㳫清籟爽毛髮無用居然成有用質之南華語應訥將軍大樹彼何為莫擬重儓致唐突楊有青楊白楊二種青楊本草謂之水楊可為矢幹白楊株較髙大可勝屋材塞外多有之栁其條柔軟可供諸用又種名河栁爾雅謂之檉注云河旁赤莖小楊是也曬樹塞外樹名其花黄産山中灤平縣境内有大小曬樹溝六道木塞外樹名幹有紋六道細如線而界畫甚匀産山中明開夜合塞外樹名結實纍纍色紛紅狀如秋海棠中含紅珠晨放暮斂故名産山中其木色白可以飾器夜亮木生塞外山中枯木根入土千嵗煜有光晶移至暗室中毫髪皆見以素甆貯水投之澄澈通明略無障翳聖祖御製賦夜亮术賦并序初集塞上古木夜視有光遇雨益明移置室中即之可以燭物嘉其有異故賦猗嘉木之逈異垂四照之華英蜿輪囷扵川壌翠盤錯扵柯莖外稟巽徳内藴離精煥然夕皎灼爾宵明晼瑞星之初麗烱璧月之漸生既騰輝于山谷亦揚采于檐楹若乃靈根濯雨榮枝浥露芳澤加鮮澄輝逺布方隠之而彌耀旋即之而如晤洵昭質之無虧何冥行之是懼爾乃金膏炧蕋寉熖韜光獨飛熛而振彩長煜煜以煌煌吐瓊文于赤水懸瑤景于崑岡非朝華而夕謝殆積闇以能彰于是列之桂宫置以椒室流暎金鋪近燭緗帙豈浮艷之為容亮靈奇之足述庶含章之可貞雖在野而靡失御製賦夜亮木賦壬申東坡先生謫居黄州蠻烟瘴雨之鄉不改其樂青瑣玉堂之側敢忘其憂則施施而行舒舒而逰惟木石之與居亦鹿豕而為儔一日者入深林窮廻谿蒼然其暝不辨東西覩一物焉晶晶熒熒燦燦離離匪鮫人之宫宛呈火齊豈天祿之閣乃示燃藜逺而眎之謝寉熖之布煖暱而迫之肖螢火之生輝是何繼明之屬而光怪若是其離奇也哉於是徙倚傍偟瞻矚審詳厥有卧木于河于陽生意已盡葉落枝僵皮膚瓦裂癭瘤土嚢木魅之所揶揄山精之所潜藏千齡寂滅萬古荒凉雖有九轉之丹祖洲之草不能起其生機豈復兾其妍好是固匠石之所棄顧􅃮園徒資諧喻棟梁弗任䋲墨乖度永辭剞劂不受丹雘埋沒沉淪訖無用處乃其日月駐照雨露垂滋豈有取舍不分公私否之極者泰斯復暗之盡者影亦垂則見夫㣲㣲耀吐熠熠精發含陰火之怫鬱比木難之熻蔚可以奪車子之囊可以掩纎阿之闕失路者得津夜逰者棄燭文梓徒爾青牛貞松彼哉白鹿枯樹緬東陽之庭杇社託髙橋之陸蘓子愀然振腕竦立而嘆曰木必先腐也而後蟲生之謂永世其無用而尚有自見之時况萬物之最靈豈終不及乎斯相随二任顧而問焉是固極南離明之區也若夫長城之北迤邐陰山人跡之所罕至鳥獸之所盤旋陽燄陰燐氷碎曦暄孕炎揚爚舒爓争煓不假人力豈伊火𫝊孰繼其後孰啓其先蘇子失荅笑而弗言御製詩夜亮木己丑塞嶺多奇木奇過夜亮無不燃光自放遇濕耀偏敷照孰劉向者賦同郭璞乎明柴蜀中有較此想非殊按以上物産皆熱河果木中可指數者至聖祖御製詩皇上御製詩中如紅葉錦樹之類不専指名為彚列於後聖祖御製詩賦得霜葉紅於二月花三集塞鴻初度驚霜信楓葉流丹樹樹紅最喜山林清俗念故應暫却世塵風御製詩紅葉辛酉萬幅屏開積翠嵐霜林㸃綴正紅酣喻言未覺朱輸紫比色何妨青出藍訝許陶鎔稱杜牧那曽名狀紀稽含𫝊神除是闗仝筆極目渾㤀駐六驂古木古木厯嵗月孫枝歇芳鮮何年刼火餘横卧山之巔生意既寂滅枯榦猶曲巻其長勁矢過其圍合抱圓不為樑棟材乃以全其天徙倚興吟懐妙理然乎然落葉西風吹萬如鳴管剪緋纈綃千林滿霜晨丹紫正蕭蕭夕陽鴉鵲何纂纂却憶三春緑蔭濃一朝萎謝無留蹤徘徊不為歎搖落愛㸔蒼翠秋山容焦木乙丑焦木横山阿秃兀矗餘枿青黄曾未施枝葉已全脱僵立碍綫路成陰憶叢樾雨露雖均滋死灰豈復活烏鳶不頋棲鼪鼯時䟦躠何年經六渾炎官威尚烈聲不中孤琴色仍作青鐵成質斯有壊修短何分别謂云山木夀莊生殊未達錦樹丁夘錦樹髙低倚翠嶒風前作態恰相應霜飛碧落天容與曦晃赤城霞蔚蒸詎必芝蘭誇有味還教松柏結為朋山霛㸃染工神術畫裡闗穜得未曽紅葉戊寅叠嶂青雲放曉晴乍看紅葉一枝横徘徊體物難成句幾㸃玫瑰襯緑瓊何必過雲錦繡攢却欣少見耐吟安北寒知早連林紫逸興遄飛向木蘭錦樹三首己夘初來濃緑尚縝紛逾月棲遲秋已分舉目連林試騁望新紅幾㸃又堪欣含暉爓爓復飛飛韎韐玫瑰是也非林下麌麌忽行過錦張天鹿出唐機已㸔颯㳫未槎枒一坐遙峰亂晩霞特是山靈能解事設來孤注鬬春華山木山木年深率自焚新條嫩穎更縝紛世間何物不代謝理解當前悟後欣紅葉二首壬午青女行霜染塞林一般赩奕㸃蕭森世間紅紫安容擬目與為幽意與深鳴鞭猶憶緑雲纔生面連林萬錦開借問闗穜誇絶藝那能㸃筆一時該伐木癸未塞山雨挟風古木或摧折園丁持斧尋翦拂不可缺丁丁隔院聞其聲中音節敗枝與芟夷嘉榦益分别行仁寓扵義凡事可矩絜惜薪既供爨求友亦興平聲悦猶虞林漸稀謂言䕶萌蘖紅葉三首連林生翠色猶濃幾㸃新紅驀地逢打叠懋勤筆硯匣秋容衮衮到諸峰火盼巖霜不礙風葉紅端的勝花紅春園欲笑桃還杏秋巘請看桕與楓星星纔見渲枝梢爓爓行看變碧嶠自是金秋稱素節應教繪事出羣超塞樹甲申塞樹常自茁本不畏霜雪築牆為山園斯有賴培活去嵗見林稀申命䕶萌蘖譬彼十圍木始生未條達足可搔而絶手可擢而拔林丞奉行善枿芽都識别平野及髙岡簇簇荆標設既免鹿蹂躪那慮人抝折十年計堪指千章望無缺是謂因地利何煩用力劼育材得良方寧弗心生悦棫樸詠周詩輒復慚矩絜紅葉紅葉奚曽定待霜數枝早自爛晴陽塞山殊勝於何見火迫秋光是所長紅葉乙酉千峯重去聲翠尚杈枒幾㸃新紅入望賖不是春山二三月却疑林際始開花佳樹丙戌佳樹有陰亦有風憇於其下觀長空片刻千秋如可擬與鹿豕遊將毋同叢樾叢樾坐延颯爽新雲容峯態悦心神懸車頗有居城市却自髙稱林下人紅葉誰云秋暖今年甚幾㸃丹楓那譲時㵳泬鏡中觀電火世間何事不如斯芟樹深秋金令芟樹候發生氣畢歸根宿明年條達益充盈化而裁之實造就塞山層叠千萬林豈能一一柯斧尋無亦求諸近且便中庭坦與虚堂陰伐繁梢細留良幹翠柏蒼松方合選曲成中復有鑒别乍喜間去聲間平聲逺峯見拈毫偶爾坐南榮寓意還欣眼界明錯節亦可入模範何須利器誇升卿移樹丁亥山木易為生亦在人培植萌蘖既叢茁反覺相蓬塞乘閒課移種分科疏側匿宻葉於以舒紏枝去其逼而復空廓處楚楚新林飾事半功斯倍一舉欣兩得紅葉二首秋遲曡巘尚濃青一夜西風枕上聽頓覺殊觀清曉望碧琳天際㸃疎星陸陸離離青間去聲紅何曽渲染待霜融塞上尚未霜一般巖麓凝眸處昨日今朝致不同再詠紅葉黄紺青紅間去聲染殊錦機曾不費工夫春園欲笑花徒燦未許其間緑葉扶䕶樹戊子沿山種稚樹拱把未長上聲大恐防鹿蹂踐園人為去聲遮葢䕶之以枯枝繞樹束其外嫩條不得伸雨露艱霑溉頽兀鮮生意匪愛其實害知然去太甚格物亦一快紅葉己丑識時真箇是丹楓灼灼初翻八月風雅助山莊秋半景一枝相暎晩荷紅萬緑瓊中玫瑰相絶勝秋卉艷裳裳塞山月令原來别紅葉何曾定待霜紅葉辛夘秋令今年頗覺炎緑雲猶䕶逺峯尖金官昨夜研朱筆玫紫猩紅幾㸃添新紅剛染衆青中便覺林光致不同日日看來忽有此為能爾者是誰工紅葉甲午萬樹菁蔥蔚緑雲其中紅葉見一兩九夏何來九秋景塞山變幻非意想人固有之物豈無所以速成戒闕黨紅葉丙申緑雲猶自蔚巃嵸何事宛看一㸃紅代謝四時弗假借引人秋思不言中錦林最是數山莊幾葉先容報信忙説與文人得知否染秋原自不須霜山樹一首己亥一樹旉榮一樹枯相形豐嗇有差殊化工施豈分厚薄傾覆栽培自取乎紅葉萬緑叢中紅一枝塞山無藉染霜為兩年一瞬訝新見石火流陰又若斯錦樹辛丑錦樹無端見一枝山莊秋色又如斯石渠早度闗仝畫内府貯關仝蜀山棧道圖中多錦樹芸閣常吟杜牧詩緑綺葉中標爓爓白珠露下灧離離硃批奏摺猶餘瀋忙裏偷閒遂寫之欽定熱河志卷九十三
