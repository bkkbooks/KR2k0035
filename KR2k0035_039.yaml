body:
  text: 行宫十五靜含太古山房有真意軒碧靜堂靜含太古山房鷲雲寺之側萬嶂環之曠如奧如得靜者機焉築山房一區顔曰靜含太古邃谷含風穹林隱日纎塵不到衆籟閴然宛在羲皇上也由西廊而出曰不遮山樓髙入雲際林嵐回抱繚白縈青樓下曲徑纚連山腰石磴間不覺登陟之勞廊盡向南得小亭顔曰趣亭御製詩靜含太古山房壬午秀起堂名占髙朗山房别一區稱佳以幽僻契妙更清殊松不煩新種石皆入古圖子西善忖度心得乃先吾靜含太古山房癸未秀起真秀起讀文如大家巖徑更屧步仄磴盤雲斜别體築山房派擬郊島誇是時正小年太古靜且嘉子西曽未到先得同然耶靜含太古山房仄徑才容步過稿便到門藉峯作屏障倚巘築墻垣秋色來方稚風聲起欲軒既云含太古底事未忘言靜含太古山房夷嵕山屋祗三間得概欣看萬嶂環無暇翻思難應接有懷那謝一躋攀芬聞野卉巖邊纈響遞幽泉澗底潺不是子西髙尚輩安能箇裏鎮消間靜含太古山房甲申太古以來山築房含以靜孰古抑孰今房用無言領我心亦如之小坐趣為永巖風送爽至欣披真即景靜含太古山房乙酉緑樹全染紅紅又風前少色即空豈誣動歸靜有道恰如太古初名相非所曉山房足當之會於無言表靜含太古山房丙戍山房别一區乃在書堂下彼以迥而秀此則秀而野石泉階底淙松濤屋端瀉於何見古意塵念都蠲舍研匣又宣傳笑此奚為者靜含太古山房丁亥山房秀起堂名隅雲棧致縈紆委宛如藏密窈深足靜娛秋風滿座爽野景一窗輸城外山田見黃雲近逺鋪靜含太古山房戊子何處不太古山房獨擅稱階前俯閜砢窗外即崚嶒復目眸豁坐教心意澄梵鈴空際落便似悟南能靜含太古山房作歌己丑秀起堂名若大家李杜萬丈光芒透山房似别裁郊島無妨寒與瘦窈而曲如往而復倚巖小築三間屋漫嫌十笏才容膝萬壑千巒一忩足千巒萬壑自太古豈識朴室及華廡凝神契靜合忘言底用勞勞辨纂組靜含太古山房辛邜自我來山莊西峪兹兩至一以少間暇一以多政事對山頗自笑何必煩點綴增景則不無仍付鹿守訖叶巖房本弗多勝惟據幽邃太古豈其遙峯林詎改置就飾斯非難反靜未云易靜含太古山房癸巳仄徑下曲崦山房樓巘隅以幽不恆到惟靜足堪娛恰度小年候偶拈五字鬚景光又覺異興會自然殊靜含太古山房甲午鬱紆下崇阪山房藏窔奧幽峽落風寒密林蔽日曜六情於焉靜一塵所弗到不因小年來安識太古妙欲擬斯久坐還恐誤政要靜含太古山房乙未山房窈窱間尋常弗輕至夤緣兹偶遊喜值秋風霽氣澄一天涼林翻四鄰翠以幽轉致曠放彌出卷密叶堪注子輿書萬物於我備靜含太古山房丙申盤磴下威紆入壑窮委宛山房忽靣前既近仍疑逺云房含太古房實搆以晚太古實含房偶因房而顯涉名則論紛忘象乃契管叶而我曽何謂屢吟泐壁滿靜含太古山房己亥落斜不數武而總步仄徑於密忽小溪山房朴以淨鄰虛意為永據迥峯羅勝開窗引清風可望亦可聽松籟為絲竹石稜供餖飣靜色與清聲不塵總恱性把筆欲吟難思量無句稱靜含太古山房辛丑秀起堂右側澗道下踰窈得平過十尺室較十尺小而室乃三架計容膝不少山自太古有靜覺秋光好問誰知其含趣在五言表靜含太古山房壬寅山房藏委宛既狹中亦宏容房可三間祛華惟朴楹以延遙日可以澄素情我昔來遊此與之太古名然自太古來原有此亦誠恰值小年長宜靜絶外營而我敕幾人耽斯恐過生不遮山樓壬午山樓雖迥不遮山幾點新紅萬緑間竒破天慳欣始遇尋常林壑擬從刪題不遮山樓樓在萬山裏偏云山不遮名言何有定愜意與之遐為是初成趣歸來便領嘉喜新吾尚爾復古志徒賖再題不遮山樓肩輿西峪趂幾間振籜秋風頃刻間今日登樓有佳會别開生靣不遮山不遮山樓癸未山樓山復不遮山翠邏青縈逺近間拾級不言經嵗隔憑窗聊喜片時間不遮山樓口號夏葉密綢繆空懷不遮意山樓今欲云副實行將至不遮山樓甲申山樓倚巘出青霞凸態凹􅐾總不遮獨有當窗一枝好天然小幅展倪家題不遮山樓乙酉低小山樓號不遮冷窗全攬近還遐廓然雅契大公旨寧在林嵐罨目嘉不遮山樓口號丙戌山不遮樓樓不遮誰賔誰主總名加驀然林下逄蒼鹿勝我無言亦八義不遮山樓丁亥精小山樓翼若飛峯􅐾嶺態罨書幃魯論見説吾無隱觸目孰非靜者機不遮山樓戊子小閣開窗山不遮逺峯近巘各呈嘉夕陽欲落依西嶺幻起東林一片霞不遮山樓己丑洞逹層樓納颯風林光嵐翠四鄰通不遮寧為去聲看山色宋祖開門意正同不遮山樓辛卯拾級俯臨萬景披紅增緑褪仲秋時開門宋祖不遮意在彼吾心匪在斯題不遮山樓癸巳倚山築小樓靣前堪眺遐背後開虛窗見山亦不遮表裏須洞逹攬景何須賖攬景固佳矣而吾更有加人情紛萬殊一照寧無差明逹徹壅蔽卓哉惟重華不遮山樓甲午勝處起樓非背山開窗終日對孱顔不遮於此猶容易欲悉人情實則艱不遮山樓口號丙申山不遮樓樓納山偶來消得片時間設如較彼名實處我亦疑其賓主間不遮山樓辛丑曲折通廊處起樓枕翠微匪誇兩層逈却嘉四鄰圍守閟無藏妙鈎深每息機開窗萬峯納或免義山譏趣亭壬午小亭未足十笏勝趣乃占千山虛牖竒供曠覽崇巖逸謝勞攀流動則資石瀑周遮不厭林關欲藉澄心觀物詎云徒尚髙間題趣亭癸未夏山宜畫復宜詩喬翠低紅萬狀披真與小亭增趣矣尋思知趣者為誰趣亭試問今來情所關金聲多在翠微間領完夏趣領秋趣却是人忙亭祗間趣亭甲申十笏未為廣四時寧有窮延來總佳景妙處是天工秋葉尚餘緑山花亦作紅如詬趣所得不在色形中趣亭乙酉山深秋意佳葉落峯􅐾露孤亭何礙窄此中有真趣雖鮮上聲紅緑繪豈不聞後素時復作天籟悠然勝韶頀趣亭己丑委宛遊廊曲入深啓窗峯翠撲衣襟寧當小大評山景得趣由來盡可吟趣亭癸巳窈深之處疑巖扉擇向為亭枕翠微四柱空空趣無盡雖然識趣者應希有真意軒自西峪至秀起堂山徑縈紆架屋數楹御題額曰有真意軒軒外林巒髙下一邱一壑一草一木俱有真意陶潛詩所云欲辨忘言者殆曲盡其致軒左曰空翠書樓右曰小有佳處後有亭顔曰對畫雲崖飛瀑萬象空明倐忽變幻如見荆關筆妙也御製詩有真意軒癸未秀起昨年初搆堂入從西峪路微長山凹一曲宜憩步松下數楹恰受涼小許底須較大許機忘亦自并言忘雲容峯態標真意總在狹中委宛藏再題有真意軒誰則無真意知真復是誰春風秋月世過去未來時莫道景常改請看山弗移疏軒付不語小坐恰相宜有真意軒甲申開我今秋窗拂我昨年席歷歷有今昨碧空乃無迹剗土緣構軒土已變石壁雲散不覺欠雲來不覺益咄哉均戲論真意非語默有真意軒俯仰風行與水流太空落落祗清浮咄哉真意固如是豈在尋常色相求有真意軒乙酉意者心之旌真者偽之宰意茍真是託那為去聲偽所殆聖經言正心其先誠意在誠斯無不真豈復外物待然則命此軒固非因􅪾嶵有真意軒丙戌西峪路必經相過遂成憩輕輿豈復勞肩者未容恝叶一以暢豫懷一以息彼弊山莊本仙境何處不佳致廓然五間屋足受萬物備林風奏清涼巖雲幻隂霽即景得竒遭是謂有真意有真意軒秋軒徑入深秋宇落峯隂靜趣愜幽賞餘間又偶臨林踈山露骨溪淨水澄心意欲尋真者須來此處尋有真意軒丁亥窅映山谷處蔥朧林樹間自然稍位置雅喜足蕭間畫格當秋疊琴音過雨潺問豫真意託恆是憶民艱有真意軒入谷有蒼山望林無緑樹林谷環抱間書軒於此遇窗明受曦溫架馥貯竹素故是避暑莊斯則向陽處颯景雅宜人流隂亦堪悟有真意軒戊子最喜山深處兼來夕靄時翠峯非假色紅葉是新枝土劚久成石松喬下長上聲芝既云真意有拈詠復何為有真意軒己丑嶢軒隱重翠是日叩林關據榻來涼籟捲簾入碧山撫題思舊厯摘句伴今間真意有何處知於松石間有真意軒庚寅西峪幽居來往經今年却是此初停為欣齋額有真意復訝山容無定形坐愛向陽成永久觀惟忘物得清寧千林落盡紅兼紫祗剩巖松罨户青題有真意軒辛邜西峪幽深弗數至至斯佳趣得殊前愛循棧徑忘行倦忽造山軒可憩便閭舍鱗依城郭外􅎟禾墉積圃場邉問豫真意於何在不離去聲民情是我田題有真意軒壬辰經年曽未到今日偶偷間却對山林處原如昨近間衣涼天籟落屋潤嶺雲還那是饒真意視民每憶艱有真意軒癸巳有自無中生真乃假之對皆屬意所為賔主寧當背軒曰有真意倒置義似晦尋思可别解空空室何礙於意尚不居豈知有真在而我即景吟是謂遊物內題有真意軒乘間跋馬欵巖扉真意都詮靜者機澗水滌塵一帶繞雲峯展畫四鄰圍鹿知熟徑尋常到鳥惜芳隂不忍飛笑我無能注周易於斯息慮究精微有真意軒甲午過雨山蹊濕弗塵又非作濘宛堪循到來忽已成隔嵗會得居然值此辰雲縱晦明寧是幻軒無刻畫祇惟淳欲知真意應何託時不忍忘曰愛民有真意軒乙未多時西峪弗經遊山徑行輿路不修喜是林間恆見鹿幸遊松下未鳴騶巖軒簾軸堪延望繩榻書翻輒小留默會云何真意在一天風物總殷秋有真意軒歌丙申白家少傅樂府章曽云人心不可防是蓋歎其鮮真意徒稱心赤言如簧此軒謂之真意有實因山深蔽林藪山雖深而林雖蔽􅓏步以至山容林態無不畢露從人取是即有真意而無所藏試問人情可能似此否題有真意軒己亥西峪巖谷中是為最初地文軒據山凹向名有真意本來無忙務耐可坐而憩循名欲責實相羊引深思真者妄之對意者心之使必其心乎理所發乃純粹設匪克己功鮮弗為私蔽私蔽莫非妄求真實艱致豈如碧峯靜無言無不備題有真意軒庚子今年西峪此初行蘿徑蘭蹊步覺生無盡有真同一意萬夀山陽有題曰無盡兹曰有真意蓋無盡然後有真而有盡必致無真一而二二而一者也喜新厭舊亦常情至山莊十餘日始來此一以無暇一以遊涉新構諸景故次及乎斯庭前樹當夏隂張去聲巖側花過雨色榮人在屏南研之北成吟也覺粹而清題有真意軒壬寅萬夀山軒曰無盡避暑莊軒曰有真方寸之心祇一意有其無盡何無紛然而有真乃無盡設其有盡無真存一而二而二而一誠其意者思斯文空翠書樓癸未屋裏通廊才數武虛中納約有餘思四山空翠庭前落恰是書樓捲幔時空翠書樓髙下隨山勢為樓在所宜兩間亦稱迥八牖恰堪披平挹林光秀全收峯態竒庭隂空翠落為憶浩然詩空翠書樓甲申一谷秋風衣𬒮涼飄飄空翠染山光浮來忽向庭隂落孟氏詩中得趣長再題空翠書樓書樓曽是不恆來來亦何嘗坐久陪今日無端消半刻秋霖有意博吟裁迎襟颯爽掀簾入謀目溟濛共牖開得句肩輿原即去於凡淹繫底為哉空翠書樓乙酉西峪有佳趣一曲一改觀書樓因迥為樹杪縱目寬然不礙山翠浮空來座端生白盈虛窗凝黛猶逺巒足以興靜吟足以愜清歡何必學義公於斯覔心安空翠書樓丙戌兩間亦可號書樓灌木層巖葉尚稠一晌登臨得竒會落來翠影自空流空翠書樓丁亥屋裏遊廊曲轉通坐來暖日尚和融蜃窗試一間憑看始覺四山翠是空空翠書樓辛邜空林圍四面翠影落中庭耐可恱心性誰能擬色形既虛無侈望惟寂有餘聽書卷原陳几所慙善取型空翠書樓壬辰書樓向空翠空翠額書樓最契靜虛趣乃兼名實收曦間常欲閃風處又如流底事微紅點尋思節報秋空翠書樓口號癸巳開處竒觀一忩納落來生翠四山披恰如樓閣空中住未可尋常物色之空翠書樓甲午重閣八窗空四鄰疊巘通落來翠無盡望去景難窮豈是吟從事而將宗義公底因難著句心與境俱融空翠書樓丙申四山飛翠落虛空捲幔書樓默對中蓮影不花真是淨義公結宇可能同空翠書樓乙亥書樓枕㠍嶫空翠舊為名大似棲空宇而饒納翠情恰看收雨足滿意向晴迎巒壑濯新靣徐聽落瀑聲對畫亭癸未山陡溪艱水為亭跨上頭是誰經意想亦盡得風流有雨方成瀑無風不作秋丹青雖入妙可許逐時投對畫亭癸未一川颯沓落秋風四座清涼照碧空月户團圞直北望是誰寫出廣寒宫對畫亭甲申月户團圞不藉修座中何異廣寒遊四山飛翠雲垂腳一谷含涼樹動頭極目總無塵可對沃心惟有靜為謀展來畫幀伊誰筆王氏臨平正曉秋石渠寶笈有王蒙臨平曉秋圖對畫亭口號踈不嫌稀密不遮玻璃虛朗勝窗紗今朝朅爾逄秋雨畫意從新換米家對畫亭丙戌曰畫畫不若是亭亭鮮同真饒氣與韻豈在緑和紅澗落峯頭雨窗含谷口風藝林多作者似此孰能工對畫亭口號丁亥曲轉雲廊得小亭額題對畫豈丹青便教摩詰披真迹未覺如斯悅性靈對畫亭戊子畫幀懸來有是乎氣為神韻靜為腴所贏趙伯駒李成倪瓚黃公望者春夏秋冬景各殊對畫亭口號己丑拾級聊登更上層月窗虛處對崚嶒一聲呦鹿來林下元四大家畫豈能對畫亭庚寅依舊窗開岞崿間對來畫嶂是冬山林空峯瘦無點綴繪事贏他落筆艱對畫亭辛卯虛亭置牖糊雲母風月四時無盡藏嵐靄峯巒常變幻可能如是笑倪黃對畫亭壬辰暮靄朝嵐無定態秋來夏去有恆期欲贏般礴儃儃者那便丹青能爾為對畫亭癸巳不問四家及六法愛看林態與峯􅐾迎人蒼翠意無盡正是夏山如滴時對畫亭甲午壁上圎窗納景開夏山如滴眄崔嵬今朝訝合許渾句風滿樓知雨欲來對畫亭丙申回廊延步入一牖納嶔岑四季畫情别誰能粉本臨峯􅐾含霽景樹意作秋音看取雲間處悠然愜我心對畫亭己亥窗入千峯作畫看較於畫更備多端即如乍雨乍晴况李成馬逺知他欲狀難對畫亭口號庚子去情底論得其神此為畫品最上乘深入精微逈出塵讀舊句全如讀畫對之訝是七旬人對畫亭辛丑畫者每為山水圖擇宜率置小亭孤此亭畫裡還畫外對處艱成答語乎對畫亭壬寅是畫原恆對是亭亭前畫意雨冥冥多斯對者如鑿竅混沌因他太不寧碧靜堂倚山為堂絶巘浮青在煙嵐縹渺間御題額曰碧靜堂聨曰碧宇好秋澄坐延爽籟蒼山太古靜眺引清機堂之左曰松壑間樓右曰靜賞室雲容風態清賞有餘跨澗為樓曰淨練溪樓朴如小閣山髙水駛雨集漲盈不必梯級而倚閣憑虛飛瀑淙摐琉璃一片矣御製詩碧靜堂癸未入峽不嫌曲尋源遂造深風情活蔥蒨日影貼隂森秀色難為喻神機借可斟千林猶張王二字皆去聲留得小年心碧靜堂佳處山情似水情潤含紋疊罨簷楹恰如范氏嶽陽記一碧真看萬頃呈碧靜堂樹色碧無礙山光靜有餘明將啓蹕去且復憑窗虛塵意何曽到道心可驗諸便因思舜命耽逸豈因豫碧靜堂甲申借問山深趣山深靜有餘九霄懸碧照萬慮盡空諸側牖窺蒼鹿倒泉飛錦魚夕陽片時落幻作紫金蕖碧靜堂乙酉碧是色之靜堂居山以深了堪忘淨諦詎止空去聲塵心煩熱避空谷涼風生翠林丁丁橡子落飛啖亂巖禽碧靜堂丙戌堂在萬山中所以不常至至必趣非常而總饒靜意長空一片碧疊樹千章翠映帶難形容夫何可思議於無思議際如是偶清寄題碧靜堂丁亥一區隱峭蒨數息陟㟹嶆雖是輿而逸不忘肩者勞窗間延逺黛松下聽寒濤率意成新什苦吟那首搔碧靜堂戊子一徑入深林三間棲碧嶂既靜慮因澄惟虛觀亦暢逺山夫何似髙下翻翠浪可以滌塵襟而盡非時尚壁間新什闕此債應須償碧靜堂自嘲己丑巖一起一伏谷一抱一環為勝輒弗同而頗勞躋攀擇最築軒堂攬要圖坐觀原復肩輿至僕人忙不間推己之謂恕吾猶恧此間碧靜堂庚寅烘谷秋陽暖雅宜問景前徑穿出樹杪堂迥坐山巔縱目極空濶俗情都棄捐碧天真是靜無際一虛圎碧靜堂辛邜一谷經千曲非遙轉致深碧兮如濯目靜矣恰宜心林未玫瑰色泉猶琴瑟音秋長今嵗獨呦鹿且遲尋碧靜堂壬辰一曲巖阿閟四鄰山色圍秋光入蘿徑暇日欵松扉緑意猶如許素心初不違徘徊研竹素未易契精微碧靜堂癸巳羊腸才數轉螺髻又髙鶱拾級得門户構虛有室軒花清錦如濯松古籟非喧几上藝編設乘間手自翻碧靜堂甲午築堂倚㠍嶪開牖眄偨池太古碧無盡日長靜此時鶴林言則合栗里住斯宜距躍彼應樂逹聰我異為題碧靜堂乙未山堂棲翠崚雲棧幾盤登到似披圖入坐惟摘句應靜觀今日愜碧宇好秋澄亦欲無言去其如興每增題碧靜堂丙申今嵗今朝到昨年昨日同光隂誠迅速吟詠那終窮即景番畨異興懷旋旋融千林一色碧靜意接長空題碧靜堂己亥夏秋三月塞園居圍返山堂乃到初慙我未能領此靜知他畢竟笑其疏歸根樹葉露峯骨泛乳茶甌點菊菹一晌消間旋復去似兹構築若為諸碧靜堂庚子雲棧縈紆蕙露披肩輿步步入幽竒未渝碧也彼萬樹真是靜哉此一時鹿不避人忩下過鶴如陪客砌傍窺駐莊兩月斯初到自笑何須構築為碧靜堂壬寅過谷復登山書堂松壑間隔年猶碧靜快霽對孱顔日朗林愈翠風清忩不間摛吟惟遣興那擬破天慳松壑間樓癸未山隂多古松巖壑亦復杳就迥宜為樓兩間已不小側耳聽清泠謀目延窈窕惟覺道心生那有塵懷擾得句應脫凡為去聲在青雲表松壑間樓大壑之間有古松樓因松亦古情濃登樓祗聽濤聲謖不似通明許客逄松壑間樓甲申山抱偏欣水復環清秋為我闢林關坐來底覺衣襟颯樓在長松大壑間松壑間樓丙戌枝峯蔓壑不可數峙有長松千嵗古擇向為樓適其間天風颯沓為鼓舞照人碧靜成蒼顔白鶴下立階墀前廣成子乎洪崖仙舉手與我相周旋忽盼秋雨滋山田自笑畢竟無仙緣松壑間樓庚寅曲廊髙下有階通小小書樓大壑叢誰謂秋山生意少緑盤松蓋恰忩中松壑間樓壬辰蒼松生壑底上欲參青霄但看其貌古誰計其年遙構樓松之下對松開雲寮那藉巖風吹坐則聞謖濤擬當挾頴師朗然七絃調松壑間樓丙申山樓處處有此獨稱松壑不惟窈而深真是清堪樂淡淡谷神存謖謖天風落近者峯嶙峋逺者嶺回薄太古之祕室軒楹費構作混沌本自佳倏忽饒穿鑿促成五字去聊識興所託松壑間樓口號己亥松壑之間兩架樓千林葉落逮深秋愛他獨樹為竒者韻自寒濤翠自流靜賞室癸未愛向山深處搆居山深處趣試言諸雲容峯態靜無比月夕花朝賞有餘坐席尋常都集妙啓窗端是為延虛將迎內外胥教泯語著程家定性書靜賞室口號山深不期靜自靜室朴曰惟宜實宜却笑如斯延賞處偶來亟去信何為靜賞室甲申言靜莫過周易著詮曰有濂溪乾坤易簡合撰形神善惡斯齊樂水樂山仁智秋風秋月端倪造物四時無盡餘間惟古與稽靜賞室乙酉肩輿盤過翠微峯别有壷天隔嵗逄指向蜃忩聊縱目當前恰得一株松靜賞堂丙戌偶來靜賞室圖閲靜賞幽山川自太古風月仍清秋似此最佳處宜付隱者流匆匆肩輿去五字徒吟留靜賞室丁亥尋勝盤犖嶨造極闢林藪契妙不出庭納約原於牖造物無盡藏所遇隨人取饒靜本非寂曰賞夫何有靜賞室壬辰室朴山深林復虛惟餘一靜别無餘何當擺脫塵情了來讀尊盧時世書靜賞室癸巳曲磴緣廊上幽齋隔嵗逄據床眄翠壁當户撫蒼松雲淨寥天朗夏深叢樾濃茗甌與藝簡隨意作清供靜賞室口號丙申既云靜矣奚云賞有賞應知靜已紛不廢賞而無礙靜曰惟斯室獨超羣淨練溪樓癸未夾山溪陡水艱貯雨裏方看練影披著箇小樓存此意終當捲㡢俯天池淨練溪樓陡澗實非溪值雨有溪時跨澗屋非樓號樓頗覺宜一切名象誰所為人云亦云豈可辭欲藉想像之練影淨洗擬議之慮思仿佛溪樓首肯曰得之靜練溪樓甲申昨夜秋空才過雨今朝山閣下成溪恰如練影知看待觸興能無一再題淨練溪樓乙酉朴齋跨石澗清迥具樓意語已忽失笑拘墟在名字曰樓與曰齋豈非人所置秋山過雨久澗亦無水至不水而云溪其義如是寄淨練溪樓丙戌秋山未雨那成溪漫擬樓名孤負題曰待雨來觀淨練轉成認影笑頭迷淨練溪樓丁亥峽上三間俯碧嵤雖無樓實有樓形每教練意憑窗想何必溪聲待雨聽淨練溪樓戊子樓固弗樓練豈練山堂跨澗待泉披傍人却笑名不副此意曽非爾所知淨練溪樓癸巳澗空憑虛巖若樓開忩峭峽對尺咫有時飛瀑落摐摐淨練之名得因此却惜以偶弗以恆偶因過雨恆由晴今朝恰值夏霖後坐看銀影披巖層宿名所欣副始遇然亦詩成便言去淨練溪樓甲午石澗如溪落峭岏跨而為室作樓觀何當無事箇中坐淨曳練光雨裏看淨練溪樓乙未夏末秋初雨稍勤山溪處處挂泉分小樓今日名循實滌目澄懷迥不羣淨練溪樓丙申跨壑溪房可號樓夏山過雨落垂流實欣名稱去聲得逄鮮七字憑吟為少留淨練溪樓壬寅跨溪有室本非樓似閣居然溪上頭無水每疑名不副雨餘今日練光流欽定熱河志卷三十九
