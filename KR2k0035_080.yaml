body:
  text: 寺廟四普陀宗乘廟殊像寺廣安寺羅漢堂須彌福夀廟熱河城隍廟廣元宫穹覽寺琳霄觀普陀宗乘廟在行宫北里許乾隆三十五年舊藩新附溥慶臚歡命倣西藏布達刺都綱法式創建茲宇御書額曰普陀宗乘之廟東西二門額曰威嚴總持曰寶光普耀門內額曰廣圓妙覺寶坊前額曰普門應現後額曰蓮界莊嚴前殿八楹額曰無量福海又十六楹額曰千佛之閣皆兼四體書殿內聮曰妙相合瞻千利資諸福繁釐同祝萬歡洽羣藩中殿二十楹又十八楹後殿二十五楹殿外簷額曰落伽勝境曰文殊勝境曰萬法歸一皆兼四體書殿內額曰妙德圓成曰淨性超乘曰萬緣普應聫曰獅座具神威咸欽奮迅鷲峰瞻相好普現莊嚴曰法界􅘦中臺臻大歡喜化身現上塞護妙吉祥曰總持初地法輪資福勝因延上塞廣演恆沙梵乘能仁宏願洽新藩殿樓上聮曰梵教流傳宗遞演化身應現慧常融八方亭外額曰權衡三教六方亭外額曰慈航普渡皆兼四體書亭內額一曰精嚴具足一曰示大自在聮曰法界現神威即空即色梵天增大力非住非行又曰水鏡喻西來妙觀如是月輪悟南指合相云何樓額曰普勝三界四面羣樓額南曰祕密勝境北曰極樂世界東曰度經之閣東樓上曰阿閦鞞佛壇城曰觀世音菩薩壇城曰無量夀佛壇城曰釋迦佛壇城曰雅曼達噶壇城曰喜金剛壇城西曰大乘妙峯皆兼四體書聨十三一曰纓鬘垂護花龕彩獅象馴依鷲嶺輝一曰佛剎現乾城法資喻筏禪宗開震旦教演傳燈一曰以此無量慈同參不二喻彼有為法普渡大千一曰統須彌界天護持常住遍華嚴海會應現隨方一曰祕印妙持超四果圓光正覺示三乘一曰現法化報身曇霏遍蔭統先中後際象教同持一曰初地相光全總持一化諸天梵香聚共演三摩一曰般若相常融具五福德菩提心並證增八吉祥一曰覺觀印圓通能仁普示識田悟清淨妙智同修一曰功德示經文香薰薝蔔莊嚴瞻相好光映琉璃一曰持法利身心衆生並濟隨緣施願力一切常圓一曰佛光普護三千界夀域常開萬億春一曰寶樹交輝香不斷祥輪常轉法無邊廟謨輪奐天藻輝煌真佛國之化城人間之福地矣御製文普陀宗乘之廟碑文辛卯山莊迤北普陀宗乘之廟之建仿西藏非仿南海也南海普陀在浙東定海縣境朝山之舶嵗嵗凌越洪濤瀾涆間擎香頂禮惟謹曰大士道場舍茲奚屬是獨震旦緇流方隅所見故然考之貝夾普陀有三一居額訥特珂克一居圖伯特一居南海蓋南海特大士行教至此偶一示現云耳庸可以此為是而彼為非乎額訥特珂克即印度是由此以證西來因緣自印度而西藏自西藏而南海了了可識第印度金剛座遼逺難稽詎若西藏都綱法式具偹為天人攝受之閎規藩服皈依之總滙也哉乃者嵗庚寅為朕六慶辰辛卯恭遇聖母皇太后八旬萬夀自舊𨽻蒙古喀爾喀青海王公台吉等暨新附準部回城衆蕃長聫軫偕徠臚歡祝嘏念所以昭褒答示惠懷者前期咨將作營搆斯廟以乾隆三十二年三月經始至三十六年八月訖工廣殿重臺穹亭翼廡爰逮陶笵斤鑿金碧髹堊之用莫不嚴淨如制夫羣蕃信心回向厥惟大慈氏之教而熱河尤我皇祖聖祖仁皇帝撫綏列服嵗時肆覲之區嚮也西陲內面景從朕勤思纘述普寧安逺普樂諸剎所為嗣溥仁溥善而作也今也逢國大慶延洪曼羡而斯廟聿成三乘之宗實其統會於焉宣寶鐸演金輪關禽流梵樂之音塞樹種菩提之果一切國土善信膜拜歡喜以為得未曽有而久入俄羅斯之土爾扈特以其為外道非黃教所概舍久牧之額濟勒率全部數萬人歷半年餘行萬有數千里傾心歸順適於是時蒞止瞻仰善因福果誠有不可思議者是則山莊之普陀與西藏之普陀一如與印度之普陀亦一如與南海之普陀亦何必不一如然一推􅘦夫建廟所由來而如不如又均可毋論即如如之本義豈外是乎豈外是乎先是羣藩合辭請進千佛像懇欵弗可却因命就廟中度閣奉之别有記不復詳綴為説偈曰我聞瞻部洲古德有道場天龍各護持名四大結聚九華及二峩五臺亦初地普陀南海南觀自在所住其言限方所不出邊邪見譬如一搩手眯萬億由旬若人證三摩要令不失故衛藏妙莊嚴竺乾祖庭意興桓足香界成此大勝因百部諸賢王合十聆唄讚塞土黃金色是處菩薩面其前羅漢峯磬石為揵椎舉似象王巖非離亦非即其下獅子溝武列功德水舉似鐵蓮洋無垢亦無淨能具等正覺皆作如是觀五十三參竟還叩兩足尊長現調御相為説無生法御製詩普陀宗乘廟落成拈香得句辛卯遞肖何妨屢普陀普陀有三一居額訥特珂克即印度一居圖伯特即西藏一居南海而西來因緣則始自印度而西藏而南海南海特大士行教示現之所印度又逺不可稽惟西藏都綱法式具偹因於山莊北麓仿其制為之金剛四句括無多層樓金瓦輝香象偏袒黃衣演法螺虔為祝釐開八秩會逢歸極仰三摩今嵗恭遇此廟皇太后八旬萬夀因建慶迓慈禧茲屆蕆工慶落會土爾扈特汗渥巴錫等適至以其素重黃教命往瞻禮俾益深感悅撰良慶落欣瞻禮曰罪曰知且付他普陀宗乘廟即景壬辰震旦惟南海山莊護北峯莊嚴猶緒事清淨是真宗優鉢含風燦貝多帶露濃盤旋清蹕返聽逺隔林鐘普陀宗乘廟即事癸巳普陀本以撫遐為蒙古皆重黃教庚寅辛卯疊逢莊臚國慶舊藩新附諸部落咸集山歡祝迓慈嘏因仿西藏布達拉都綱法式建廟於此以夀而洽柔懷梵語布達喇即華言普陀也神道誠看有相之遂致逺徠土爾扈廟工將蕆而土爾扈特台吉渥巴錫等率屬歸順朝覲山莊之日適屆落成大慈氏廣大因緣不可思議如此即命至廟瞻禮俾益感忭土爾扈特急讀之則為土爾扈云因教羣禮總持尼即今法雨滋忍草萬古宗風振慧枝若論三乘皈一字謂猶一字屬多詞瞻禮普陀宗乘之廟因題丙申梵語布達拉震旦謂普陀南海本中華西域實倣摹叶陀普陀有三詳見碑記蓋西域布達拉本以山似普而屋宇則仍依藏式茲廟規制悉倣西藏為之斯乃肖藏式搆築無差訛土爾扈特來慶落演梵那辛卯秋廟工落成適土爾扈特汗渥巴錫等朝覲於此因命詣廟瞻禮俾益深感悅去嵗雨致頽根基未固羅重砌塊石堅僨事弗深訶昨嵗夏秋多雨廟之南面紅牆頽阤牽引地面上層樓閣亦有傾者即遣大臣勘驗知係原工築土未堅雨水滲入致牆基鼓裂層卸而下皆由前此承辦各員不諳作法尚非侵冒誤工故不加深譴因命易大塊石為基層層甃築經樓佛閣重加葺治未踰年而蕆工閔整如前而鞏固較勝於舊通計費用四十餘萬金例當工員賠補念各員力不能償止令其中數人亷俸最厚者酌賠什之一餘悉豁免其工員初時僅禠頂帶今於工竣之日仍加恩給還兹臨重瞻禮舊貫仍巍峩不有敗者相焉覩成者嘉叶成敗總六如如是觀如何布達拉廟瞻禮有作己亥布達拉原肖前藏落成土爾扈來賓土爾扈特急呼之則為土爾扈猶厄魯特急呼之為厄魯也無心招致彼殊域有意懷柔此近人蒙古素重黃教况此寺倣前藏之式尤為壯麗諸札薩克王公等每扈從瞻禮無不歡喜踴躍即此亦懷柔之一端也松樹種將嘉蔭滿山花開遍法雲彬更今札什煥倫布札什倫布華言須彌福夀也以班禪額爾德呢欲來京為余祝七旬萬夀特倣後藏式班禪所居廟建於此俾居之欣在觀光輻輳頻布達拉廟瞻禮用去嵗韻庚子普陀於右須彌左布達拉華言普陀宗乘札什倫布華言須彌福夀也揖讓無殊主與賔閲稼之餘臨梵地祈年莫匪為去聲農人落來雙樹風聲爽斂去寥天雲彩彬祝嘏欣逢聖僧駐班禪額爾德呢自後藏跋涉二萬里來此祝余七旬萬夀因為建札什倫布以資安禪亦時到布達拉廟講經放參諸番膜拜看填頻殊像寺在普陀宗乘廟西名因臺麓制倣香山緣起偹詳御製詩序寺門三楹南嚮恭刻御書殊像寺額寺額多具四體書左右有鐘鼓樓內為天王殿東西配殿各五楹東曰饌香堂西曰演梵堂內為會乘殿殿七楹額曰會通三際聫曰發心為衆生緣深入善權菩薩果現相如三世佛了分身住曼殊牀又東西配殿各三楹東曰指峯殿西曰面月殿其後建八方亭額曰寶香閣又曰淨名普現聫曰佛説是本師宏宣象教天開此初地示現獅峯又東西配殿各三楹東曰雲來殿西曰雪淨殿更內為樓十八楹額曰清涼樓又曰相合臺懷聫曰地上拈將一莖草樓頭現出五臺山樓下額曰妙五福德聫曰地分臺麓示居國座挹錘峯供養雲又東西配殿各五楹東曰吉暉殿西曰慧喜殿寺旁築室三楹額曰香林室又樓三楹額曰倚雲樓恭繹聖製清涼五峯香山塞山非彼非此所謂一而二二而一無分别見作平等觀曼殊闡義得未曽有也御製詩殊像寺落成瞻禮即事成什有序乙未五臺山為文殊師利道場梵語謂之曼殊師利山麓有寺曰殊像傳是文殊示現處妙相端嚴瞻仰生敬辛巳春奉聖母幸五臺祝釐瓣香頂禮默識其像以歸既歸摹勒諸石遂乃搆寺於香山肖碑模而像設之顔曰寶相兹於山莊普陀宗乘廟西營搆蘭若莊校金容一如香山之制而堂殿樓閣略倣臺山亦名以殊像從其朔也夫佛法無分别見清涼五峯固文殊初地香山塞山非彼非此矧以竺乾視之固同為震旦中菩薩示現之境乎是則闡宗風延曼夀功德利益又皆一合相之推廣平等者也工始於乾隆甲午夏逾年落成以詩代頌並志緣起如右殊像全規臺廟模撰辰慶落禮曼殊曼殊師利梵帙讀作平聲其音近滿珠故西藏達賴喇嘛等進丹書借稱曼殊師利大皇帝今俗訛滿珠為滿洲非也金經蒙古猶常有寶帙皇朝可獨無佛經本出厄訥特訶克是為梵帙一譯而為唐古特之畨再譯而為震旦之漢其蒙古經則康熙及乾隆年陸續譯成者朕以當我朝全盛之時不可無國書之佛經因命開館譯定譯以國書宣白業習之修士翊浮圖是寺之喇嘛皆令習清字經即闡曼殊師利之義雖然名實期相稱去聲師利應嗤謂是乎殊像寺丙申殊像亦非殊堂堂如是乎雙峯恆並峙與普陀宗乘之廟各據一峯相去半里半里弗多紆法爾現童子巍然具丈夫丹書過情頌西藏每於新嵗獻丹書稱曼殊師利大皇帝云云蓋以曼殊音近滿珠也笑豈是真吾殊像寺疊丙申韻己亥殊像像文殊豈云異貌乎濶違忽兩載瞻禮此重紆法演三千界心傳調御夫無生祇二字行處目瞪吾香林室乙未室築花宫側檀林擁淨香最宜引呼吸可以悟真常庭樹有嘉蔭砌葩無俗芳如云皆是藥識者大醫王香林室丙申塞上富者林兹以近佛地異衆獨名香而室幸斯置俯仰栴檀叢饜飫薝蔔味滿志惟清淨謀目足蔥翠何當屏萬慮從修入聞思香林室己亥是林無不香是處香之最室築梵宫旁自應餘津逮潤以沆瀣精吹以薝蔔籟耳根及鼻觀合相成靜會五木與都梁火氣直宜汰倚雲樓乙未寺傍隙地一區分倚巘為樓亦可欣虛牖却無來去相容容常挹德山雲倚雲樓丙申倚雲雲亦倚其樓正可羲經悟氣求若論山田霑渥雨豐隆祇合此間收倚雲樓口號己亥山樓兩架倚晴暉莫謂無雲便擬歸試看青蔥峭蒨者蔚林詭石豈其非廣安寺在普陀宗乘廟之西南嚮乾隆三十七年建御書門額曰持勝門又內樓六十二楹額曰淨香室曰定慧樓皆兼四體書面西聫曰香界擁諸天妙鬘普護塞山現初地淨土同持面南聨曰淨域頂光融莊嚴普現妙香鼻觀會功德常增樓上聫曰現法化報身總持淨業參誡定慧諦永駐祥輪寺中有戒臺恭懸御筆四體書額每嵗蒙古諸部鱗集式瞻寶相普結勝因慈宇洪寧不特花龕蓮筏已也御製詩廣安寺瞻禮六韻癸巳蒙古尊黃教其來已久時以神道而設因俗習為治用接宗乘右是寺在普陀宗乘廟之西俾修摩竭儀金容輝法相玉律示毗尼寺中有戒臺是日虔瞻禮萬年兼祝釐廣安寧詎此土扈即土爾扈特急呼之或兩字或三字皆可如厄魯特亦呼厄魯列藩維廣安寺乙未北山一帶佛宫羅居選畨僧演梵那殊像西鄰原不逺良辰餘暇遂相過雖云慈夀祝無量也覺莊嚴漸已多設以廣安喻治理儒宗釋典豈殊科廣安寺丙申蓮宫及鹿苑迤邐接北山一以祝慈夀一以示外藩相去弗其遙逰乘片時間未能空五藴那足悟三幡獨因歌耆定差云副廣安廣安寺疊乙未詩韻己亥亘山疊樹盡娑羅勝地真宜創舍那瞥眼誰期閲兩載散懷偶爾得重過昔年祝願成三幻寺本為詩紀聖母祝意竟釐而建曽於乙未及之孰成虛願此日虛無説六多柔逺詎惟宣梵教此寺居普陀宗乘廟之西與羅漢堂殊像寺俱在北山一帶地當塞苑之後琳宇駢羅益增勝概不僅宣揚黃教令蒙古王公等瞻仰生欽也即今棫朴作儒科今升熱河廳為承德府建立試院定以學額並度地創建文廟期塞外士子户習絃歌振興文教羅漢堂在行宫北里許乾隆三十九年建殿額皆御書左右有鐘鼓樓門內天王殿又內大殿額曰應真普現皆兼四體書大殿內額曰會乘證果東西配殿各六楹堂中應真像悉仿海寧安國寺制伏讀御製江南塞北妙相同觀而十六非少五百非多益證妙諦圓融也御製詩題羅漢堂癸巳潔治山堂據漫坡應真寫像各婆娑江南彼豈塞北此是間應真像肖海寧安國寺為之十六少非五百多色現聲求總邪道水流雲住契襌那知然是復何為者獅子峯髙借問他羅漢堂五百應真此休夏香筵列坐貌堂堂杯從何處同鷗渡錫駐於斯聚雁行一切有為法皆幻六如無著偈猶詳佛居淨土居塵世度世婆心正未央須彌福夀廟嵗在庚子恭逢皇上七旬萬夀時則班禪額爾德呢祝釐來自後藏上嘉其逺至於山莊建札什倫布廟居之唐古特語札什為福夀倫布謂須彌山也廟門南嚮恭刻御書額曰須彌福夀之廟廟額多具四體書東西二山門有題額一曰梵香遍滿一曰法界圓成碑亭一額曰智光普照寶坊一額曰總持佛境都綱殿樓三重額曰妙髙莊嚴殿內面南額曰寶地祥輪聫曰開大般若臺朗照宗鏡具妙莊嚴相深護法雲又曰證三摩菩提圓裝七寶超六波羅密座湧千花又曰圓鏡照三千是空是色妙香聞二六即佛即心又曰妙曼擁珠城莊嚴具足芬陀承寶蓋福慧圓成面北額曰福緣恆演聫曰現象香國身增五福德説最上乘法證八吉祥又曰仙露淨塵根花垂薝蔔香風翔法界樂送迦陵又曰證最勝因光華開七寶溥無量夀安樂演三乘東為御座樓聫曰風鈴常轉蓮花藏貝葉間披金字經更內佛樓二重額曰生歡喜心聫曰龍象莊嚴妙不可思議人天歡喜普如是吉祥又曰見性悟真源參聖如意定心觀妙諦示佛因緣殿上層額曰吉祥法喜殿內聫曰寶閣護香雲靜資禮梵靈峯呈夀相妙悅安禪下層額曰芬陀普湧殿內聫曰初地總持超梵乘恆沙普演護祥輪又御座樓南北殿各二重北殿懸南無阿彌陀佛額聫曰到來佛相原如是靜處塵心那更生又曰功德無邊復無量因緣非色亦非空南殿東楹聫曰現法化報身共依圓覺攝聞思修教遍示妙明西楹聫曰象法湧祥輪西方震旦智光騰寶炬海藏天宫客堂額曰萬法宗源聫曰便有香風吹左右似聞了義示緣因仰惟夀宇宏開皇風普鬯西方妙法同我太平伏誦御製記文仰見我朝聲教恢紘卓越千古非獨耆崛闍山阿耨達水頌無量功德已也御製文須彌福夀之廟碑記庚子黃教之興以宗喀巴為鼻祖有二大弟子一曰根敦珠巴八轉世而為今達賴喇嘛一曰凱珠布格埒克巴勒藏六轉世而為今班禪額爾德尼喇嘛是二喇嘛蓋遞相為師以闡宗風而興梵教則今之班禪額爾德尼喇嘛實達賴喇嘛之師也達賴喇嘛居布達拉譯華言為普陀宗乘之廟班禪額爾德尼居扎什倫布譯華言為須彌福夀之廟是前衛後藏所由分也辛卯年曽建普陀宗乘之廟於避暑山莊之北山以祝釐也亦以土爾扈特之歸順也今之建須彌福夀之廟於普陀宗乘之左岡者以班禪額爾德尼欲來覲而肖其所居以資安禪且遵我世祖章皇帝建北黃寺於京師以居第五達賴喇嘛之例也然昔達賴喇嘛之來實以敦請茲班禪額爾德尼之來覲則不因招致而出於喇嘛之自願來京以觀華夏之振興黃教撫育羣生海宇清晏民物籹寧之景象適值朕七旬初度之年並為慶祝之舉也夫朕七旬不欲為慶賀繁文已預頒諭旨而茲喇嘛之來則有不宜阻者蓋國家百餘年升平纍洽中外一家自昔達賴喇嘛之來至今亦百餘年矣且昔為開創之初如喀爾喀厄魯特尚有梗化者今則重熙休和喀爾喀久為世臣厄魯特亦無不歸順而一聞班禪額爾德尼之來其歡欣舞蹈欲執役供奉出於至誠有不待教而然者則此須彌福夀之廟之建上以揚厯代致治保邦之謨烈下以答列蕃傾心向化之悃忱庸可已乎既為記復作讚言印度既回遙佛教亦式微梵僧捨天竺多臨衛藏地自唐代已然是為法源處一譯猶云近三乘無舛訛宗乘向東昌誠如佛所記衛藏雖徼外實在震旦中達賴及班禪宗喀巴髙第前後燃智燈三車之綱領真文與滿字於是溯軌躅蒙古衆林林莫不傾心向皈依三寶門神道易設教茲聞班禪來如嬰兒遇母觀化闡宗風誠為吉祥事布達拉既建倫布不可少擇向興工作亦以不日成都綱及寢室一如後藏式金瓦映日輝玉幢揚風舞自成動靜偈朗標色空喻以是善因緣資無礙法喜祝嘏猶其小所欣象教宏舉似西域居無來亦無去上人演法輪蠢蠢普超度佐我無為治雨順與風調衆生登夀世慧炬永光眀合十作讚言初非為一已如懸大圓鏡遍照於十方而鏡本無心回向亦如是御製詩札什倫布廟落成紀事庚子華言福夀等須彌唐古特語倫布者須彌山札什者福夀也建以班禪來祝釐今年班禪額爾德尼來熱河為余祝七旬萬夀因仿後藏班禪所居廟式特建此寺舊例已遙遵順治謂北黃寺因五輩逹賴喇嘛於順治年間來京特敕建寺居之新工猶近比去聲康熙溥仁寺康熙五十二年建為熱河最古寺層樓初聳輝佛日萬樹分栽蔚慧枝一語欲詢駐錫者有無法也抑無為再題札什倫布廟曉趁輕涼出苑門札什讀作平聲倫布煥崇垣班禪輜重先云至班禪額爾德尼昨遣喇穆占巴四人並喇穆隨從五十餘人賫送輜重先至熱河因即以札什倫布旁舍居之夏季生衣預沛恩喇穆占巴及喇嘛等來自後藏尚服氊毳因各頒賜紗葛銀兩藥物有差彼以敬來酬以惠識其委欲􅘦其源莊嚴每謂非斯謂那待他人有後言札什倫布廟疊去嵗韻辛巳寺圖後藏奉阿彌福夀如山自兆釐札什為唐古特之福夀倫布為須彌之語本擬來宗闡法教那期入寂示恬熙班禪額爾德尼於庚子七月來覲山莊擬以次年春送還後藏不期於十一月示寂於黃寺滅生原不拘三乘規律猶然貽一枝上年班禪額爾德尼住此曽留其髙弟羅卜藏敦珠布帶領班第二十人在廟住持傳習後藏經律因派此地喇嘛百八十名隨從學習今嵗臨幸札什倫布見學習經律諸喇嘛漸次嫺熟雖班禪示寂而宣揚黃教規律常存實亦去來如一也如是去年對談處笑茲搆築信何為札什倫布廟再疊庚子韻壬寅由來芥子納須彌底論仰荒與俯釐見説福資三乘力祇圖茲濟萬靈熙堂中貝葉翻宗教階下禪林長慧枝舊果前緣一相證有為法豈及無為熱河城隍廟熱河自聖祖仁皇帝締搆山莊六十餘年為畿輔東北一大都會乾隆三十七年允督臣周元理請恭建茲廟四十三年奉旨設立承德府神皋鞏固秩禮攸宜御書殿額曰福蔭巖疆聫曰和會視畿封妥斯苞茂阜寧徵版籍報以馨香左右配殿各一楹又內後殿五楹東西配殿各一楹廟碑恭勒御製詩序嵗時展敬靈貺惟昭矣御製詩熱河初建城隍廟拈香瞻禮八韻有序城隍之神莫詳所自或謂始於唐李德裕之立於成都而李陽氷縉雲城隍神碑則謂惟吳越有之然張説在荆州張九齡在洪州並有祭城隍文可見不始於成都亦不獨行於吳越且蕪湖城隍建於吳赤烏二年則又不自唐始而考城隍名義實權輿於八蠟水庸則并不得謂自吳始矣逮宋以後天下通祀明初雖改從山川壇尋亦復舊今則省府州縣同之熱河向未有神廟壬辰秋督臣周元理以為請即發帑庀材飭治之或以為熱河故無城池於名毋乃不稱余曰否否神之號為城隍方隅是保氓庶是依熱河自皇祖締搆山莊以來迄今六十餘年民物恬熙井里殷富五廳𨽻屬咸臻阜寧儼然一大都會必有默相之者記不云乎有功於民能捍災患則祀之則熱河城隍之宜偹祀典於禮誠不可闕且行宫石城崇墉屹峙武列三源安流𨗳和何不可以循名徵實又詎在列雉重闉環濠曲塹方足以當斯義哉越癸巳夏五月工蕆余適臨幸山莊親致瓣香以落之作詩紀成並序緣起俾揭諸麗牲之石且告所司慎厥事焉八蠟分眀紀水庸謂由唐始見猶壅興州久矣民人聚新廟於焉鑒饗供佐帝佑氓宜有祀禦災錫祉顧無封燕公椒奠曽攄悃洪武泥塗或不恭避暑石城皇祖建廣仁雲嶺聖慈從昭靈助順萬年賴薦禮申誠此日逢猛獸毒蟲消百戾春祈秋報走三農七言用代豐碑勒土吏欽哉奉秩宗廣元宫廟制昉自岱宗盛於京輦東方德主生物列在祀典所以致精禋昭靈貺為民祈福之至意也熱河升為承德府人民蕃育神祀聿修於山莊內敕建茲廟以偹制度廟門南嚮恭刻御書廣元宫額東西山門各三楹左右有鐘鼓樓內為仁育門更內為香亭重簷復起額曰馨德亭又曰靈昭長養聫曰廣化佑天齊無逺弗屆元功叶仁育有感斯通東西配殿各三楹東曰邀山室西曰藴竒齋正殿五楹額曰仁育殿又曰普佑資生聫曰岱頂仰神庥功宣長育塞園崇廟祀福蔭蕃昌後山門外有亭一額曰古俱亭御製詩廣元宫六韻己亥元為善之長上聲生物主東方因肖岱宫式碧霞元君廟在泰山頂北方祠祀極廣屢著靈應京師建廟城外有五頂之稱而中頂南頂西頂尢著皆官為葺治茲倣其制為之落成靈宇慶萬家煙火庶兆姓息男昌承德今升府興文並設庠祈年協暘雨希佑富耕桑惟以民情願無非祖迹藴竒齋己亥峯層復嶺重嵐秀護階濃鎖徑多詭石羃簷著古松起思無定趣引睇鮮常容恰似青雲士諸竒藴一胸藴竒齋庚子玻璃窗對簇攢峯朝靄暮嵐無定蹤可識萬竒此中出而齋不識以為容藴竒齋庚子竒正由來兩勢分兼之誰似碧山云而齋藴以無窮趣顯露應嗤揚子雲中説揚子雲古之振奇士也藴竒齋口號辛丑竒者平之對合知齋中所藴乃多竒老來諸事喜平易即景聊因一詠斯藴竒齋偶爾有會口號因成壬寅窗前萬景納無遺即景因之額藴竒竒正自應殊甲乙竒惟宜藴正宜施邀山室己亥山本靜無動無動無去來而室顔曰邀其義何居哉諸峯自畫展一牖惟虛開朝暮恆與俱嵐靄恆與陪去亦弗遮留來亦弗拒推是謂不速客敬之終吉該邀山室有會庚子山豈有動理而室邀以來室亦寧鮮邀則因人至哉是三實假合闕一乃殊乖令假成一真知真原幻諧邀山室辛丑山之德為靜其實弗解動韻會凡物自動則上聲彼不動而我動之則去聲晰理頗精作室額曰邀斯乃有迎送而山常在室何曽待延羾是非彼自然乃由我所弄即室亦勿知支辭過誰訟古俱亭己亥喬松足有千載古峻嶺今看一竺俱小坐消搖得竒會忘年之友定無殊古俱亭作歌壬寅山實太古有喬松亦如之境雖荒略亦自有人居於茲其人何往而惟松及山也恆如斯亭實搆乎今山兮松兮與之俱古夫何疑吾欲泯名象忘今古漠然坐對謐神思穹覽寺在喀喇河屯行宫東南里許南嚮康熙四十三年聖祖駐蹕喀喇河屯隨侍人員恭建此寺以祝萬夀門額曰敕建穹覽寺門內左右為鐘鼓樓中植碑一恭鐫聖祖御製碑文內為正殿前楹恭懸御書寺額殿內題額曰清音貝葉又御書額曰性澄覺海東西為配殿又內為後殿御題額曰天半香林東西有配殿寺基為坡陀小阜門俯灤河如練如帶隔岸諸山螺髻湧現有俯視層霄之概云聖祖御製文穹覽寺碑文三集哈喇河屯者蒙古名色釋之即烏城也乃古興州之所轄因世久事殊前朝未及設官分職皇輿等書編察難考朕避暑出塞因土肥水甘泉清峯秀故駐蹕於此未嘗不飲食倍加精神爽健所以鳩工此地建離宫數十間茒茨土階不彩不畫但取其容坐避暑之計也日理萬幾未嘗少輟與宫中無異萬幾偶暇即窮經史性理諸書臨池揮翰膳後即較射觀德以安不忘危之念此其大略也因有離宫隨侍人員共祝萬夀而建寺不日即成又求匾額以垂永久朕賜書云穹覽取沈約驤首覽層穹之意在行宫之巽位寺勢雖微蓮社梵音鈴鐸經聲巨細皆偹內有三大士相仙衣飄揚瑞園涵漾以空寂為本慈悲為教汲引四生津梁三界清鐘夜聞逺近罔弗皈依月殿朗輝中外靡不瞻仰况右倚層巖左帶大河口外諸蕃來往進貢皆由經過三庚無暑六月生風地脈宜穀氣清少病誠為佳景前朝以戍邊不暇何得駐蹕今四海為一八表同風自京北至萬里如同家人父子豈有他術哉以誠而已今臣下歸福於朕朕曰天下皆福朕之福也先憂後樂朕之職也所願者年豐嵗稔煙塵永息余之念茲在茲之意足矣無以妄求佛有所知自有保護康熙四十三年嵗次甲申秋八月中秋日聖祖御製詩穹覽寺偶成三集塞北鐘聲久不聞梵宫列剎共氤氲雨花柏樹同僧老開世瞿曇永法雲御製詩窮覽寺辛酉招提鈴鐸午風吹罨畫山川入望竒徙倚試思草年事苔封碑字紀康熙琳霄觀在喀喇河屯行宫東南三里許康熙四十九年建南嚮門外樹坊二前曰興州勝境後曰紫塞春臺門額曰琳霄觀門內左右為鐘鼓樓內為靈官殿又內為聖母殿額曰資生保赤東西為配殿又內為火神殿額曰德炳南離皆聖祖御書門左植碑一工部侍郎兼翰林院掌院學士揆敘奉敕撰誠親王允祉奉敕書觀與穹覽寺相望淨界梵天鐘魚互答瑞靄吉雲真去天尺五矣欽定熱河志卷八十
