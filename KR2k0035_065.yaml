body:
  text: 山一承德府全境北界興安大嶺為陰山之正脈左右層巒疊巘皆其分支形勢之雄甲於紫塞若龍山為慕容氏國都七金馬盂諸山為遼金名勝徴名定位往往而合自仙莊肇啓巖巒獻秀錘峯東峙則酈道元水經注之石挺也廣仁西控則王曽行程録之墨斗嶺也加以六飛來往睿賞留題翠壁丹崖輝新雲日斯則林壑光華山靈望幸抑造化神秀顯見有時也爰就各境所屬分按道里證以史傳所紀取其翔實可徴信者著之凡蒙古諸名音譯舊多訛蹖兼為校正或名聞在昔而今無可考則約略方隅彚卷附存不敢以傳會失實至於木蘭界內群山合沓為巡蹕秋搜講武之地别見圍場門兹不復敘志山第九承德府即熱河廳磬錘峯在熱河行宫東八里承德府治東北十六里下鋭上豐俗稱棒捶峯聖祖仁皇帝賜今名每夕陽欲暝萬壑蒼然一峯秀矗亭亭倚天御題山莊三十六景中有錘峯落照峰側石幢一鐫㦿四字酈道元水經注武列水東南厯石挺下挺在層巒之上孤石雲舉臨崖危峻可髙百餘仭牧守所經命選練之士彎張弧矢無能屆其崇標者按古武列水即今之熱河詳見水門磬錘峰近在河東撑空聳秀知即石挺是也峰側石幢不知何時所建㦿為古户字見許愼説文為武瞾所造日字見郭忠恕佩觹餘二字無考御製詩錘峰歌壬申在天有六星開德宣符贊鴻運在地有崑崙嵥然中峙四維鎮崑崙一支走華區壇曼案衍羣峰都五嶽五鎮列方隅扼吭拊背據其樞神禹行水迹雖遍天祕地鑰無繇見小試僅得及底柱至今疏𨗳傳宇縣靈皋奧壤應有待乃回堯顧怡八彩帶河襟巘闢仙莊卓然峰立東岡在東岡峰立初無名象形闡義錫嘉稱宇宙以來便有此惟聖人通天地情造物妙在罏錘間奉三要達神明權平施稱物無容意治崇金鑑千秋傳八柱何當一已足馬援標名笑銅沃春來簇簇自為繡雪後晶晶幻成玉穹窿髙矗飛雲流亭亭入望偏宜秋一輪氷鏡正圓滿憑將挂著千山頭望錘峰作歌己邜晚熱寧不欲尋涼心中却幸農夫慶肩輿西嶺上絶頂錘峰東望遙相當天風吹寒颯衣袂攀陟雖炎爽此際乃知得逸恆於勞玉柱亭亭况佳致亭亭玉柱幾千秋風月與侣鹿豕儔而今遍野田廬稠亦復臺榭供清遊古人曾經到此不錘峰笑道非所求羅漢峰一名彌勒峰在熱河行宫東稍南三里承德府治東南九里岡巒曼衍望之似人趺坐坦腹迤北則磬鍾峰紅石巒在熱河行宫東南十里承德府治東南十六里羅漢峰之東綿亘十餘里其西地勢寬廣土人稱為紅石巒溝天橋山在熱河行宫東南三十五里承德府治東南三十八里山勢如飛梁跨空縹眇天半與宫內四面雲山亭相對御製詩天橋山歌甲戌亭子四靣雲山頂東瞻案衍拖橫嶺嶺上天橋對我亭輿梁誰駕虗無境仙人來往扶欄遊彼岸奚藉一葦浮祖龍鞭石空費力何如天造非人謀武夷長虹事乃幻謝傅永安桑海變恰似嵩山玉女窗中秋月每從中見朝陽洞在府治東稍南三十七里石竇嵌空橫貫山腹深二十餘丈廣二丈餘其東髙盈丈西半之曉日初生光射石罅隔山可見朝陽義蓋取此洞內外小佛祠各一帽盔山在府治東稍南八十里以形類兜鍪得名其北十里復有帽盔山土人稱為前帽盔石後帽盔石筆架山在府治東稍南九十里以三峰矗立故名五指山在府治東南四十里五峰崷崒儼如仙掌山有古靈峰禪寺寺有僧居實撰五指山大輪禪師碑至元二十四年建知此山舊名五指矣今土人稱雞冠山蓋側視五峰纍纍若雞冠云駱駝山在府治東南五指山之東敵樓山一名觀音山在府治東南一百六十里白馬川之南山有至元二十六年僧顯月撰敵樓山天宫禪院碑稱山在惠州西南巔峰峻拔按元惠州治在今平泉州界敵樓山在承德府最東南境與惠州西南方位相合碑文稱有古殿宇號曰天宫惟設觀音神像則觀音山之得名有自來矣鐡虎山在府治東南九十里滴水崖一名珍珠崖在府治東南一百三十里灤河流經其下山勢盤旋數十里松柏叢鬱積翠成屏臨河石壁削立山腰有洞流泉瑽琤若珠璣迸落故名僧冠峰在府治南稍東二十六里舊名僧官帽山乾隆三十九年賜今名峰形如毗盧覆頂土人以雲氣聚散占晴雨之驗輒應青雲山在府治南稍東一百二十里白河之旁林木翳蔚泉響潺然出叢薄中雲峰寺建其上烏龍山在府治東南二百五十里古盧龍山也盧龍塞當在其地酈道元水經注盧龍之險峻阪縈折故有九䋫之名矣按盧為黑色烏字義同音屬近似更以盧龍塞證之方位亦合水經注濡水東南徑盧龍塞塞道自無終縣東出渡濡水向林蘭陘東至清陘濡水即今灤河至承德府之東南境迤折而入邊牆所謂濡水又東南境徑盧龍塞也無終即遵化州在承德府南境邊內所謂塞道自無終縣東出也塞固以山得名境地自當毗接今烏龍山在承德府本境西南與灤河入邊處東西相望也况盧龍塞古稱長塹今灤河入邊處當永平府西北之潘家口為盧龍東塞魏志盧龍塞與密雲山綿亘不遠當今密雲縣西北與居庸塞相連為盧龍西塞今烏龍山正當長塹之中附近東塞也又庾杲之注揚都賦言盧龍山在罡城北平罡即平剛漢屬右北平郡班書平剛無終二縣接敘則平剛亦應在遵化州境適與烏龍山南北相直庾杲之所言不盡無據酈道元譏其孟浪失實過矣若水經注又載燕景昭元璽二年遣將軍步渾治盧龍塞焚山刋石令通方軌刻石嶺上以紀事功則不必定在烏龍山矣青松梁在府治南五十里鳯凰嶺在府治南二十五里與青松梁相接皆在灤河之南尖帽山在府治南一百八十里其南接遵化州界廣仁嶺在熱河行宫西十四里府治西十一里嶺之西南即灤平縣境自灤平縣治至熱河為輦路經行之處康熙五十七年聖祖仁皇帝發帑開治徑路平坦賜名廣仁嶺勒碑山上東麓建萬夀亭三十八年建碑亭一恭鐫御製雨中乘輿過廣仁嶺詩凡山莊西境諸山皆與廣仁嶺綿亘相接王曽行程録過烏灤河又過墨斗嶺亦名渡雲嶺長二十里許曽公亮武經總要北安州有墨斗嶺在德勝嶺北百二十里按遼北安州城在今豐寧縣東境之波羅河屯詳建置沿革門廣仁嶺在灤河之北正當遼北安州境內應為古墨斗嶺斗與斗特傳寫不同耳御製詩雨中乘輿過廣仁嶺癸巳雲羃山頭雨復施路經橫嶺引間思身先策馬恆劼昔年長上聲乘輿亦順時曩時行幸山莊啓蹕日即乘馬至回鑾始間乘輿然遇天雨及過嶺則仍乘馬兹春秋已逾六旬雨中嶺路泥滑因乘輿以過非尚逸而惡勞順時愼養之道宜如是也瀑響千巖奔渒煙迷萬樹幻離竒僕臣跋涉胥勤職行賞旌勞例有之風雲嶺在熱河行宫西北三里府治西北六里其北即獅子嶺獅子嶺在熱河行宫北五里府治西北九里嶺勢竒偉如狻猊俯聽帖依蓮座故名嶺下獅子園嶺之東地勢閎敞名獅子溝凡普陀宗乘廟諸巨剎多建于此詳見寺廟門金山在府治西北五十里山勢髙聳東與黑山對峙黑山在府治西北四十五里山脈周圍數十里一峯拔起髙出羣山石色如黳故名按凡附近熱河諸山皆金山黑山支派所分聖祖御製避暑山莊記所云金山發脈又北枕雙峰詩序所云西北金山東北黑山者是也大黑山在府治北一百八十餘里當張三營西北高二十餘丈周百餘里復嶂懸崖煙嵐蒸鬱遙望然伊遜河自北來流繞其足按此即古陰山分支也陰山自河套之西北蜿蜒東走經承德府全境之北其正幹為興安嶺是山在承德府北境形勢雄峻附屬興安自是而北直接圍埸內諸山蓋陰山逺脈經行旁絡之處凡府屬迤北諸山視此盤道梁在府治北境唐三營之東北象鼻山在府治北稍東四十四里山勢墮長形如象鼻故名湯山在府治東北八十里山出湯泉流入賽音河聖祖嘗駐蹕于此建龍尊王佛廟有御製碑記恭載寺廟門橫道梁在府治東北茅溝汛境內窰溝之北茅溝河流經其西灤平縣即喀喇河屯廳雙塔山在喀喇河屯行宫東北八里灤平縣治北八里大小二峯矗立百餘丈如窣堵波髙下相亞其一峯中開三孔表裏通明御製詩雙塔山癸酉雙峯聳翠肖浮圖鹿苑當年了不殊入影東西照灤水插雲南北擬明湖葦峪嶺在喀喇河屯行宫西南十五里灤平縣治西十里自王家營至喀喇河屯輦道必經又巴克什營北亦有葦峪土人稱為西葦峪御製詩過葦峪嶺癸巳塞外地勢殊山多平原少一嶺界兩溪縈繆相環抱土人刀而耕高低遍巖表美惡雖非齊亦自足溫飽葦峪兹過嶺沿路農功考頗覺遜迤南春膏知霑少近乃陳雨作稚禾始有秒為去聲之復望霖曷惠心默禱羽林却喜晴云弗致行潦明當至山莊雨不為遲好我意汝當知汝私我亦曉葦峪甲午葦峪迤北閲田功缺澤去年同一望却因昨夜得􅒴雨回蘇緑意看無恙客嵗黑城始遇霖喀喇河屯即漢語黑城在葦峪北去嵗駐行宫時夜雨早祇一宿那殊狀兹於常山峪即遇雨較去嵗早一日復思今夏啓鑾晚以是較則反遲宕昨嵗以五月初八日啓鑾今年則於五月十六日較遲八日而以距夏至後日期計之反為早五日也設更衡之夏至節日雖為晚時早償較長論短總緣農惟殷虔祝屢綏貺駝峰在灤平縣治西南一峰聳峙形似槖駝故名御製詩駝峰歌壬辰青山白雲宜目騁一峰遙見峙橫嶺問之其名曰駝峯昴首聳背還引領有如此哉造物竒以弗意匠匠肖之誰能翠釡食單列更鮮錦篇掞麗詞此地此名兩相當嶽嶽立向西南望意有未忘用有殊即今沙漠耕桑暢我亦因之繫於訪小黃土梁在灤平縣治西南二十里較常山峪西南之黃土梁形勢稍亞三道梁在灤平縣治西南五十里鞍子嶺在灤平縣治西南六十二里又大水峪口外白河之旁亦有鞍子嶺為灤平縣最西南境常山峪在灤平縣治西南七十里嶺勢回環如列屏障行宫建於麓正據其勝竒山在灤平縣治西南常山峪北距官道七里峯勢中開狀如擘裂黃土梁在灤平縣治西南八十里常山峪西南十里青石梁在灤平縣治西南九十里與黃土梁形勢相連自兩間房至常山峪群峰綿亘青石梁最峭拔高出諸山之上御製詩過青石梁甲申石棧隆崇雲裏盤北來屈指最髙巒昨朝細雨不成陳今日晴空回覺寬過嶺東西異流水策驄上下一征鞍剗修嵗久塗臻坦可復誰歌行路難過青石梁丙戌塞山過雨曉猶雲隱現諸峯濯黛紋為喜農功益茂實何妨旅景自殷勤近藩已有聯翩至一體曽無內外分祖訓聰聽仰深意髙談底更事云云青石梁丁亥石梁嵗往還佳景稱逰攀馬足若無路雲頭復有山飛流垂振鷺野卉鎖孱顔更喜逢秋霽都忘行旅艱雨中過青石梁戊子夜雨連纎曉未收製衣六書正訛雨衣謂製亦復發行騶途中雱霈乃愈甚馬上逍遙那可留荔阪都成千瀑落蘭蹊忽作一川流石梁過不逾十里别館常山稱去聲憩休下青石梁復過一黃土坎即常山峪行宫計里甚近雨過青石梁十月初四日辛卯徹夜連纎曉未晴輕輿已備御而行自辛酉秋狩以來雖甚雨雪皆乘馬過青石梁而行今晨以值雨所司備輕輿遂御之昨木蘭中曉往獵埸亦有乘輿以行之日雖從衆請自愧不如少年耳順時養體欽天道漸石膠車驗物情宜雪雨零候緣暖往年此際關外已作雪今嵗氣暖故仍雨降髙卑就谷循平披煙南望慰心處潤透冬田麥始萌過青石梁壬辰曉行塞雲布四宇意謂靈山或施雨須臾雲斂快開晴濯濯螺峰秀爾許﨑嶇砟硌凡千盤登逈造極眼界寬隆崇大幹東南去亦如瀛海蒼漫漫升覺路長降路短北髙於南信非誕麥尚未收禾黍芃愛此宜㿩著鞭懶星龕巖在灤平縣治西稍北五十三里聖祖仁皇帝御題巖名巖間鐫石佛像三有寺名星龕巖寺喇嘛洞在灤平縣治西七十里石洞中虗形如廣厦偏嶺有前後二嶺後偏嶺在灤平縣西一百里當鞍匠屯之南又南為前偏嶺王曽行程録過偏槍嶺四十里至卧如來館過烏灤河按偏嶺即行程録所載偏槍嶺烏灤河即今灤河偏嶺在喇嘛洞西三十里外疑喇嘛洞即卧如來館之舊也十八盤嶺有大小二嶺大十八盤嶺在灤平縣西南一百十里其南四為小十八盤嶺王曽行程録出古北口度德勝嶺盤道數層俗名思鄉嶺按十八盤嶺在古北口外直北境磴道回盤應即行程録所云德勝嶺也火石嶺在灤平縣西南二百三十里白馬關口外插箭嶺在灤平縣西南二百四十里髙家營北潮河流經其西七道嶺在灤平縣西南二百五十里椵樹嶺在灤平縣西南二百五十餘里潮河流經其麓五道梁在灤平縣西二百三十里廟兒梁在灤平縣西三百里豐寧縣即四旗廳元寶山在鑲白旗土城子即豐寧縣治東稍南十五里山形中凹旁峻以形似得名按豐寧縣治在鑲白旗土城子所屬四旗分地如前四旗廳之制兹編次境內諸山仍按四旗所屬分載方位道里以期明晰云博羅梁在鑲白旗土城子南六十里其南即灤平縣界官兒嶺在鑲白旗土城子西南二十里其西南即鑲黃旗界鐡家伙梁在鑲白旗土城子西六十里其西即鑲黃旗界赫山在鑲白旗土城子西稍北二十五里錫喇塔拉川之西山峯峭拔林木蔚然為縣西勝境五峰山在鑲白旗土城子東北九十里五峰環列澗壑深幽山有興隆寺白雲山在鑲白旗土城子東北一百二十里山腹一泉自洞中流出最為清冽筆架山在正藍旗黃姑屯即波羅河屯東稍北十里山正當波羅河屯行宫之東三峰列峙中翹旁亞作筆架形御製詩筆架峰戊寅筆架三峯逈出群支天萬古翠嶙峋宣毫湘管難堪倚合付尋常腹藁人化工著意玉雕鎪肯使詞人弄筆頭李白若曽經到此不知竒句幾多留於波羅河屯詠東山筆架峯戊子天開地闢此遺蹤未許南人弄藻鋒笑彼珊瑚誇寶重鎮兹鉢捺永提封祗今來往常凝望自古詩文必有宗不是杜韓大手筆誰當佳作倚高峯文昌雜録云契丹謂住坐處曰捺鉢按遼之後即今索倫其語與滿洲有相同者國語謂住處曰巴納若作鉢捺尚可云音譯之訛乃并顛倒其文則失之益逺矣總由彼時中國人言語不相通習信手妄書不自知其舛謬即如金遼元三史中類此者難以枚舉將悉為改譯而稗野流傳則經用始能辨訂耳􅌑瓏峯在中關行宫東十五里正藍旗黃姑屯東稍南六十里舊名興隆山山峯嵌空有洞西向深十六丈許隙光穿透非雕鏤所及乾隆十九年七月巡蹕經臨其地因賜今名御製詩􅌑瓏峰有序甲戌過中關行宫迤東十餘里有峰拔地㠍嶫崒嵂望若翠屏嵌空虗洞似仙人之所棲止名之曰􅌑瓏而係以詩朝催行騎緣谷東新程逐處咨民風沼岡度澗凡幾重路右遙見凌霄峰巍乎氣象回不同羣山拱伏孰與京叶倚天拔地超哉雄嵌空洞穴宛轉通嶊崣嶻嶭森巃蔥竒葩真樹那可名叶幻以雲氣鬱豐隆石户儼開守玉童丹竈碧火其焰紅垂垂鐡鎖懸長空凡骨悵望難尋蹤在昔下風訪崆洞塞垣荒略傳何從欣兹始遇名􅌑瓏飛來奚事艷吳中至今吟咏紛莫窮固都爾呼達巴罕在正藍旗黃姑屯東固都爾呼河經流其旁故名山脈始于官家厰蜿蜒而南至中關綿亘百餘里雲光洞在正藍旗黃姑屯南四十里山勢阻深其右有泉從石間出東南流會入固都爾呼河山麓有洞嵌空康熙六十一年就洞建寺聖祖仁皇帝賜額曰雲寶珠光故即以雲光名洞金厰梁在正藍旗黃姑屯南稍東三十里赤土梁在正藍旗黃姑屯南十里苔山在波羅河屯行宫之西正藍旗黃姑屯西北伊遜河之北有浮屠三級髙矗峯頂東則伊遜河西則伊瑪圖河蜿蜒如帶夾流山下平頂山在正藍旗黃姑屯東北七十五里頂平如砥而石壁劖削每白雲滃然瀰漫峰頂則山雨立至土人以為占候此山綿亘廣逺其北即圍場界按遼史地理志載髙州有平頂山遼髙州為赤峰縣境今豐寧縣為遼北安州地與髙州方位不合蓋山名偶同也大對山在正白旗郭家屯東南五十五里灤河流經其下黑山在正白旗郭家屯西南二十五里沙爾呼山在正白旗郭家屯西稍南八十里錫喇塔拉川即興州河發源於此其西即鑲黃旗界鳯凰山在正白旗郭家屯西北灤河之北喇嘛山在正白旗郭家屯北三里半山石洞一仄徑沿緣盤紆而上林壑幽絶湯山在正白旗郭家屯北三十五里山有溫泉東南流入小灤河窟窿山在正白旗郭家屯北三十五里三峯屹立有石穴在三峯間故名半壁山在正白旗郭家屯北六十里石壁陡削形若堵牆小灤河流經其下其北即圍場界龍泉山在鑲黃旗大閣兒東稍南五十里有大小龍潭三水從石罅中出三潭遞注東南流入潮河塔山在鑲黃旗大閣兒東南六十里山有古塔一白雲洞在鑲黃旗大閣兒東南七十五里亦名朝陽洞洞頂有雙瀑對懸飛流樹杪洞內有神像鐫額曰寶華臺不知何時書外種山桃百餘株春時霏紅掩映尤增勝致帽山在鑲黃旗大閣兒南稍西六十里山有石柱髙百尺三巨石疊立其上形若峩冠湯山在鑲黃旗大閣兒西南四十里山出溫泉洪湯寺建其側土人稱其地為湯上湯河發源于此按此與正白旗之湯山别考水經注沽水東南右合髙峰水又西南流出山沽水即今白河髙峰水即今湯河詳見水門湯河發源于湯山則山即髙峰之舊矣平西梁在鑲黃旗大閣兒西南八十五里其西即獨石口廳界大草坪梁在鑲黃旗大閣兒西南八十餘里其西即獨石口廳界按舊一統志謂李文忠敗元兵于駱駝山即此然考文忠當日出居庸趨開平為今之多倫諾爾迂道至此恐未必然也十八盤嶺在鑲黃旗大閣兒西一百三十里其西即獨石口廳界按此與灤平縣屬之十八盤嶺别又考元周伯琦扈從詩注曰入黑谷過色澤嶺髙峻曲折凡十八盤伯琦所經由今獨石口外迤東而行正厯今豐寧縣西境此十八盤嶺疑即色澤嶺伊克達巴罕在鑲黃旗大閣兒西北一百二十里其西即獨石口廳界喇嘛山在鑲黃旗大閣兒北稍西六十里羣峯回合有月珠寺建其上金碧觚稜隱出林杪最為幽勝按此與正白旗之喇嘛山别巴顔哈達在鑲黃旗大閣兒北稍西一百三十里韭菜梁在鑲黃旗大閣兒西北一百八十里灤河流經其下僧機圖達巴罕在鑲黃旗大閣兒北二百十里其北即多倫諾爾廳界平頂山在鑲黃旗大閣兒東北六十里山勢綿亘其東北與正白旗之沙爾呼山相接按此與正藍旗之平頂山别大黑山在鑲黃旗大閣兒東北九十里青石拉綿山在鑲黃旗大閣兒東北一百八十里土人亦稱為大山綿亘數十里其北即圍場界天財梁在鑲黃旗大閣兒東北一百九十里亦名官道梁欽定熱河志卷六十五
