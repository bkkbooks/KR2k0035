body:
  text: 行宮十七文津閣宜照齋山近軒文津閣山莊千尺雲之後卜高明爽塏以藏四庫全書題曰文津閣與紫禁御園三閣遙峙前為趣亭東則月臺西乃西山蓋昉范氏之成規兼米庵之勝概矣伏繹御製從源溯流要以知津仰見文思光被涵泳無涯而塞山勝地積書充棟邁古超前信乎川巖靈秀待時啓發者也歟御製文文津閣記甲午輯四庫全書分為三類一刋刻一抄録一祗存書目其刋刻者以便於行世用武英殿聚珍版刷印但邊幅頗小爰依永樂大典之例概行抄録正本備天祿之儲都為四部一以貯紫禁之文淵閣一以貯盛京興王之地一以貯御園之文源閣一以貯避暑山莊則此文津閣之所以作也蓋淵即源也有源必有流支派於是平分焉欲從支派尋流以溯其源必先在乎知其津弗知津則躡迷途而失正路斷港之譏有弗免矣故析木之次麗乎天龍門之名標乎地是知津為要矣而劉協所云道象之妙非言不津言津之妙非學不傳者實亦先得我心之所同然夫山莊居塞外伊古荒略之地而今則閭閻日富禮樂日興益兹文津之閣貯以四庫之書地靈境勝較之司馬遷所云名山之藏豈啻霄壤之分也哉御製詩題文津閣乙未庋四庫全書之閣凡三文淵文源而外山莊之文津其權輿也閣始於乾隆甲午秋月越次年乙未夏月蕆功適駐蹕於此賦詩落成若夫溯源必先於知津與夫倣式浙江范氏之天一閣則記已詳言之兹不贅四庫書成將弆之范家天一倣而為基營去嵗才擇向鼎落今朝弗滯時子晉漫誇祕書逮長沮徒議執輿知名山藏實無過此却待他年枕葄兹文津閣丙申四庫收精要千秋示率循寧惟資博物端以藉修身蕆事雖猶待集成斯已珍建閣為貯四庫全書之用然鈔録尚需數年閣中空曠用仿四庫書函之式裝潢古今圖書集成全部􅍥架排列亦頗可觀淵源如欲問仿浙江范氏天一閣規制初於山莊建閣以文津名之御園之文源大內之文淵則皆由此津逮也應自此尋津題文津閣己亥建由甲午成乙未四庫將因備弆珍即此鈔刋未及半彚輯四庫全書分别應刋應鈔并命繕為書册弆閣中今校録之功尚未及半羡他淵海那深真圖書先貯古今集閣中列架備貯全書因尚未藏事先令裝古今圖書集成陳之架間言行惟期枕葄循偶至據林輒蒿目望洋徒自愧知津題文津閣庚子三文閣以庋四庫文淵文源文津此獨遙兼玉塞清體大因之收物博昔營猶自滯今成閣建於甲午秋越次年乙未夏蕆工以貯四庫全書而録成則尚需嵗月奚妨豫築謀遼待每以餘間暢散行已貯圖書十千卷閣成後仿四庫全書函式裝潢古今圖書集成三十二典凡一萬卷庋架排列文津之名不為孤矣不為孤矣得先聲文津閣即景庚子綴景閣之前假山太古然明亭鄉去聲敞宇暗竇出幽泉物理叶聲應塵忘契道銓秋雲歸岫去生翠洗遙天題文津閣辛丑山莊建府敷文教禮樂興今逮百年預搆閣樓收四庫每勤魚魯校諸賢鈔胥何故偏其滯董事寧當任彼延木架香楠此空待幾時得覩貯全編題文津閣辛丑四庫欣看首部成文淵曾是宴儒卿今年春仲經筵以四庫全書第一部告成庋文淵閣即於是日賜總裁總纂總校分校提調等晏并升敘頒賞有差經營已異初草創次第堪循舊課程曾鞏黃香豈此到唐函漢略較他嬴六年期固非遙耳四庫全書第一部已成其第二三四部分庋盛京之文溯閣山莊之文津閣御園之文源閣者據館臣等奏通限六年全竣行見裝潢貯閣次第觀成云楠架行將插以盈趣亭乙未天一閣前原有池池南更列假山峙文津之閣率倣為故亦疊石成崴􅕲有峯有壑有溪澗澗水琴音瀉池泚東則月臺西西山又如寶晉齋傳米山亭因以趣為名林泉引興誠佳矣貯書四庫其趣多饜飫優遊意在此趣亭丙申石磴平巔十笏開俯觀諸趣面前堆襄陽帖語分明是西則西山東月臺趣亭己亥假山縱新成林古山因古峻峯隱曲澗活潑流泉吐仄徑可攀陟小亭栖岨峿穿奧遂得曠萬樹園堪覩其趣不可窮概以趣為所趣亭庚子閣外假山堆碧螺山亭名趣意如何泉聲樹態則權置靜對詩書趣更多趣亭辛丑四柱翼然臨巘頂林姿峯態攬無遺不因濟勝步嵒齬此趣還當付阿誰趣亭壬寅假山新疊作古石似天成根帶樹叢長上聲竅穿花蕊榮斯誠育物趣益契對時情映閣增清聽文津淙底鳴月臺乙未文源之閣在圓明園其前峙玲峯而為之歌有玲峯八十一穴勝米老此文津雖偶闕其假山石態却蒼好西山况復是真山真假因緣相植巧米家范氏謂范懋柱家天一閣兩兼奇而更御園所欠少最愛錘峯倚玉鏡登臺欣每得於早上下千古橫八方贏彼希逸資探討月臺丙申為愛顛翁語假山築月臺錘峯如挂矣渤海早升哉千古文章鏡四時景物胎循名微慙去聲者曾未一登來月臺口號己亥不盈十笏俯嶙峋也可稱臺望月輪大似襄陽帖中句却無甘露炫時人月臺庚子綴景平臺據上層石梯疊砌亦崚嶒入宵無處不見月昏黑崎嶇率懶登月臺辛丑假山之上石臺迥日取山高臺更高總為眺瞻先得月無窮人欲致人勞月臺壬寅石麓東頭搆月臺廣寒宮殿映遙開漫訾杜撰成粉本原自襄陽帖裏來宜照齋於西北門內倚石城搆齋五楹御題額曰宜照齋臨風致爽炎宇初晴谷蔭涼生林颷響答于照為宜也聯曰觸目無非遠塵俗會心皆可入研覃右為屬霄樓樓下東楹聯曰啼樹間禽疑對語隔峯馴鹿若堪招樓上聯曰雲外山為嶂風前葉照階齋左為却炎榭聯曰愛看畫影偏遲砌便有炎風解避疏由榭而東為就松室銅柯拂地黛影參天皆千百年前物其後為積嘉亭御製詩題宜照齋戊子擇向尤宜隨地勢築齋窗户正開西千峯夕照呈當面一室虛明雅入題翻葉林間閃金碧過雲階下幻高低此情此境本太古靜者於斯自取携題宜照齋己丑朴斫山齋倚石城遊歸下馬憩怡情愛風致爽秋方孟宜照非炎字正晴門外土鬆留鹿迹林間葉密護禽聲設於材品方清鑑未信斯之月旦評題宜照齋石城下馬入巖館憩躬佳日色上階漸秋聲奏樹皆驛章頻問信詩思漫安排萬事都宜照吾寧祗此齋題宜照齋庚寅途便巖城入山齋近偶慿林還標張王二字去聲峯不改崚嶒閲畫宛如活學詩可以興於凡總宜照返已懼無能題宜照齋辛卯巉巗跋馬進園門便有書齋向迥原庭據千峯延日朗窗標雙樹受風翻已看林色秋非夏愛聽禽聲靜不喧宜照寧惟供目眺萬幾潔矩一心存宜照齋壬辰垂鞭盤磴道咫尺入園門側左略延步向西别有軒於焉小留憩亦復切思存萬里都宜照雖然豈易言題宜照齋癸已齋近石城門恰旋獅子園向西恆此憩宜照總堪論樂是禽鳴樹僕教鹿守垣夕陽曽鮮到興乃託陶言題宜照齋甲午回馬遵崎棧便途入石城巖齋恆此憩藝座恰怡情隔嵗如昨日宜晹值放晴那能待夕照得句便教行題宜照齋乙未石城跋馬進咫尺巘齊披於此每言憩欣其足啓思樹深陰滿院卉野露瀼墀萬事都宜照民艱照更宜題宜照齋丙申宜照宜西照我來率午前循名如負矣責實此恆焉跋馬巖城入對螺松牖便從頭看舊什率意得新篇再題宜照齋獅園跋馬返山莊徑入山城便有堂於此徘徊何不可觀其徼妙亦殊常窗間景納迎眸淨松下風來滿意涼題額設詮宜照理祗應物我兩相忘題宜照齋己亥齋額顔宜照都因向擇西却來禺中近未值夕陽低孤景任其爾會心適我兮硯屛棐几置便與一吟題題宜照齋庚子盤巒石城入齋宇近東陲例此延小憩便因續舊詩循名當責實玩義切深思萬里都宜照民間照首宜宜照齋辛丑迤邐謁祗園回從西北門仍與陟山路不馬至巖軒向來由山路入西北門無不乘馬至宜照齋今嵗乃遂乘輕輿以至因記之庭樹披風爽階花帶露繁設思宜照義人已一心存題宜照齋壬寅一帶尋北寺例由山徑回齋仍今日入人是隔年來耐可時宜矣寧惟夕照哉設云虛應物心鏡豈須臺題屬霄樓戊子因迥事惟半巖樓具四臨既緣騁遙目無復著塵心碧可俯空宇翠非遮遠岑考功句宜此霄漢坐開襟屬霄樓己丑山高其上樓益高因以名之曰屬霄足底埤堄棲砧􅑇眼前星斗相招邀雖此崇隆無並倣聽卑者更崇蕩蕩漫欣下入高遍臨應知高亦下共仰十目所視其巖乎觸景粥粥倍惕吾屬霄樓癸巳堂不高數仭而樓曰屬霄豈其構築殊况均據崇椒樓因高於堂循名實可邀巍巍者以此匪以榱題驕藐説定何人永言聊解嘲登屬霄樓有作宜照齋傍聳疊甍更欣攬勝俯巖城入門得路不勞問據座開窗大愜情棧道歷教還七萃是日奉子園皇太后遊獅策馬回入巖城門扈從諸臣皆由城外棧道歸寓平原遙見駐雙旌二吉爾丹纛于最後所以止僕役濫行向前立法盡善馭輕居重垂規制百世千秋慎奉行屬霄樓甲午山樓雖不高而名曰屬霄其故可得言以據山嶕嶢星斗俯堪數上聲雲霞近相招榱題稱數去聲尺得志弗為豪寸木置岑樓孟語仍解嘲屬霄樓乙未樓無百尺高山有千尋卓置樓於山巔恢恢橫碧落屬霄因以名詎緣聳榱桷怡情迥超凡縱目適暢樂别有會心處君子慎所託却炎榭戊子秋田都喜暴時晹婪熱雖騰正不妨敞榭雅宜古松下却炎千里祗饒涼却炎榭己丑山嵐谷靄颯朝晡氊帽綿衣時或須便是午暄宜晚稼坐來炎意一些無却炎榭口號庚寅風颯林梢日入簷坐來猶欲毳衣添塞山秋仲如秋季那更重儓説却炎却炎榭辛卯已經處暑近白露况在高山蔭密林擬欲却炎炎早却祗饒恬淡恱秋心却炎榭壬辰清原因迥靜因深風滿簷楹涼滿襟不説却炎炎早却為他松下有佳隂却炎榭癸巳邇日山莊頗覺炎坐來山榭爽風添副名妙趣有如此身為去聲清涼意為恬却炎榭口號甲午避暑莊中榭却炎片時徙倚爽而恬雖然轉語應宜念美善由來忌並兼却炎榭口號乙未松隂楓籟颯然清不脫衣衫峭爽生到此翻無炎可却弗循名乃善循名却炎榭口號丙申炎如誠有應言却是處炎無却亦無似此額題乃虛設尋思萬事類斯乎却炎榭己亥此處應無炎可却以無炎却却炎稱因思名實胥兼半能所孰為真所能却炎榭辛丑三間敞榭步簷巡風物如秋總暢神借問其炎何以却香山七字早知津却炎榭壬寅邇來雨過覺風涼翻以紗衣换葛裳虛榭却如有所語去聲莫觀其暫請觀常就松室戊子百嵗之松不可移三間之室實易築邇來解會箇中趣每就喬松葺朴屋嘉隂却暑張童童靜籟翻涼吹謖謖致有片時坐掞箋猶覺長言之不足就松室己丑一樹當庭滿院涼山中知幾閲滄桑就松為室室亦古憩室看松松自蒼種代有誰傳姓氏披風無意傲羲皇未曾清夜根傍坐月下應輝琥珀光就松室庚寅就松作新室松古室亦古乃知附青雲馬遷非虛語秋仲復既望紅紫繪岨峿而此弗改者翠恆蔭庭宇便是鮮幾間尚應坐少許就松室口號辛卯蒼顔貞德信非虛樂道吾聞諸子輿管仲且猶不可召允當築室就之居就松室壬辰榭尚云其敞室更愛此幽都因就古松隨宜有額留天風拂間去聲間平聲六月如九秋泠泠披恰當謖謖聽未休設使覔新種去聲百年待則悠就松室癸巳松乃千年餘室以三間足室固來就松松亦欣覆屋度月影泠泠吟風聲謖謖然此胥人為意謂費搆築太古是山中喬柯未嫌獨就松室有會甲午松無就室理室有就松道老幹那可移新宇原易造及至室對松相得益彰好我聞賢比松賢實君之寶賢豈自來就君善求為要叶所以白駒篇風人示懷抱就松室乙未百年古松不可移三間今室易為置盤盤翠蓋蔭屋簷泠泠謖濤滌塵氣拂席偶坐消小年底須梅竹堪佳憩松弗就人人就松因之更悟招賢意就松室丙申築室本就松人亦恆就室究因松愛古匪為室圖逸是則松室間賔主分去聲當悉坐來謖濤聽九夏炎如失報我良不爽而松無意必就松室辛丑室本就松為松如就室茂無松室那古匪室松孤秀資殷得益彰胥藉良緣湊良緣無如何點筆吟章就就松室有會壬寅種松老何時就松室自老室以土木成豈解就之好則人使就之半朴半屬巧我來坐松隂復有就之道誰主更誰賔松室兩不曉積嘉亭戊子橫嶺竪峯周且遮山亭十笏鎖谽谺庭前松樹百年外積健為雄蔭復嘉山近軒軒在山莊西北峯巒窈窕環抱簷楹當萬山深處命名山近紀實也宫門三楹南向正殿五楹殿西三楹額曰清娛室東五楹額曰養粹堂堂之南為延山樓層構凌雲飛甍出樹因高得曠於延山宜面西敞亭三楹亭外奇石嵌空回廊曲注額曰簇奇廊踞東峯頂草亭一區有松蒼然額曰古松書屋御製詩題山近軒己亥古曰入山恐不深入山惟恐不深見韓愈文集無端我亦有斯心丙申初構己亥得是軒經始於丙申秋今於己亥夏落成仲夏新來清曉尋適興都因契以近摛詞那敢忘乎欽究豫非彼幽居者偶託聊為此暢襟再題山近軒已在萬山中更圖山之近於得不厭多人情率堪哂而軒乃蹈之蔥蒨盡以藴雖云靜何礙詎殊欲為準彼但徇欲者失靜害則允山近軒題種松庚子山近非逼仄軒高仍廓朗茍非窮幽深何以暢俯仰昨嵗種稚松今來盈尺長謂當待十年可與舊松倣十年則八旬艱期約弗爽山近軒對雨辛丑塞雨時作止山軒小憩停乍飛一川白頓失萬峯青擬議如觀幻畫圖難寫形須臾雲斂盡巖瀑尚餘聽題山近軒壬寅一􅒴能消萬斛愁軒稱山近得來遊林回生意才逭旱籟挾涼聲颯似秋點砌依然欣雨落歸峯故爾惜雲流殷雷未放十分霽渴亟吾仍冀霈優延山樓得句己亥出樹有高樓山􅐾舉目收四鄰若可攝一意與相投妙理間中悟清吟靜裏搜蓍占需上六不速客之儔題延山樓山本靜非動樓惟虛故延曾無費來往自得與周旋生翠罨窗牖清暉照几筵愛兹真徐孺陳榻覺卑焉題延山樓庚子山祗靜為體樓乃延之來而樓豈解延以人慿窗開三者設闕一斯名託誰哉子輿亦知此曰萬物我該愁覺執我矣未若順應恢延山樓辛丑近山軒左側樓復號延山一再寧非甚性情偶寄間開窗納蒼翠梯几俯孱顔點筆便宜者無勞事陟攀延山樓壬寅巖廊過奇處山樓得延所其延乃在安理會於斯可啓我八窗虛納彼萬峯岨是謂不速客敬之吉易語清娛室口號己亥窈窕中藏室一區遠塵因以號清娛雖然詎可恆安此吏治民生總繫吾清娛室有會山清室可娛清娛額簷際而我來兹室因繹清娛義九有大清國萬民永娛事養欲及給求思之甚艱致豈謂清供目豈謂娛滿志惟益增惕乾遑敢恣留憩清娛室庚子藝齋枕崿嵁颯景稱去聲吟探晴牖峯遠近風林葉兩三秋惟佳塞北潦陡憶江南睢寧郭家渡漫工雖現據薩載等奏水勢循流下注楷料亦在儹運而合龍尚難預期下遊田廬尚被淹漫未經涃出實深厪念我自憂勞者清娛詎可耽題清娛室辛丑為室由來必有鄰書軒山近步廊循取之左右適其可耐以周旋任彼真過雨山容翠如濯搖風樹韻靜而倫清娛欲得心無滓養此寸田福萬民清娛室壬寅山莊半月始臨吾疏懶由來有是乎書室潤芳延萬景清娛今日識清娛簇奇廊己亥穿石入壺天借巖架雲戺嵐靄蕩胸懷搖刖變尺咫攢簇列鏡中生動攬畫裏無之而不奇祗惜移步履簇奇廊庚子奇者正之對亦視用所宜於武偶藉此於文當戒兹又如恆居心貴正豈貴奇至夫偶騁目賞奇亦正資步廊顧其名即景解若斯簇奇廊幸丑奇者正之對正恆奇秪偶好正泰之機尚奇否之友兹廊稱簇奇乃因山景有橫嶺與𥪡峯青松及丹桕叶盡態復極妍而廊無不受受則弗失正而奇亦非醜五字志所會是亦一道否簇奇廊口號壬寅詭石危峯盡態奇飄然欲墮更安之其安以正本無事説與兵家當曉斯題養粹堂己亥詰曲幽蹊那厭遙豁然開朗見雲寮未經含粹憩養粹含粹齋在谷口此所皇祖題額也昔屢有詠來必經路昔訓垂堯今述堯詎喜山容純不雜擬窮理趣靜而超無須更展韋編讀舉目文言義總標養粹堂得句羲象分明曰純粹士希賢聖聖希天養之亦豈資他術可見行惟在體乾養粹堂庚子山堂據崇阜曠望非深邃以其鄰敷露顔之曰養粹取例橫渠銘謂西銘東銘無非淑身義更遠溯子輿曰養浩然氣浩然無不純純即粹之致然而孟近傲未若張平易居髙心自卑時存近民意古松書屋己亥草房雖不古而松與古之借問松何年不知種者誰宇宙以來山有山松在兹適兹構草房宛共松同時落落涼隂翻謖謖寒濤吹那覺當夏五直如對伊耆無須閲世書總可兒孫其戲題古松書屋己亥天公為我種龍鱗八百春秋共大椿偶向其間結茅屋非幽人強學幽人古松書屋口號庚子岧嶤山頂弗恆臨獨樹猶撑太古隂付與空空書屋對笑豫構築是何心古松書屋作歌辛丑古松依塞山無懷葛天世所有泰岱秦時五大夫去斯數百千年後古松有誰知大夫之名傳乃久彼何幸此何弗幸馬遷附青雲語誠非偶然而我詠大夫時則已對其新補率非舊叶府泰山五大夫松乃雍正年間內務總管丁皂保監修泰山工程時補種故辛卯詠五大夫松有曩日司工人補植之句豈如古松猶然太初真面目更悟有名者不若無名恆自守古松書屋作歌壬寅古松不計閲世年少言應在三代前秦松漢柏名炫久到此安能齊臂肩大椿建木徒稱謂豈如歷劫仍見蒼龍蟠古松於我誠有緣其下築屋才一間亦不頻至至則弗忍去羲皇以上風月與我相周旋試問羲皇以上民物為何若古松無言惟以謖籟傳曰築屋已失之而况更有斯問焉欽定熱河志卷四十一
