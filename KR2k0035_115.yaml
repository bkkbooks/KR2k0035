body:
  text: 藝文十本朝詩恭和御製幸避暑山莊啓蹕之作元韻嵇璜新霽塵清七萃毫輕雲濃樹隱周遭嘉年金德先徴穰閏月炎官未許叨行健共瞻龍騎騁頒恩又喜鳳綸叨吟鞭重指蠮螉塞望裏晴峯勢漸髙前題和珅曙光拂輦曉涼毫啓蹕欣逢吉日遭車駕香輪迎旭過馬銜玉勒逐風叨錦衣齊楚櫜鞬屬黃褶趨蹌扈從叨老稚盈途羣額手衆星環拱北辰髙前題梁國治飛斾天間選駿毫玉鞭影裏翠周遭煙臯雨潤三農喜餅餌風香百室叨占白果徴前諺合謄黃行見嵗恩叨千官跽送清塵路馬迹雲中向北髙恭和御製至避暑山莊駐蹕即事得句元韻嵇璜香花層擁羽旗前殿閣含薰愜靜便上界清涼信無暑半空紛郁望非煙書成輿志恢三輔地奉宸遊鞏萬年指點雲山説蓬島就中圖畫本天然恭和御製題戒得堂元韻謝墉八紘都是睿謨營丹雘欣從朴斫成念切得人兼得嵗心傳惟一又惟精堂懸寶訓垂金鑑函貯鴻章炳玉榮理氣發明昭萬祀帝王學自異儒生恭讀以帝御製戒得堂記王之得與占畢書生異如欲得賢材欲得年豐俱不在所戒而戒在開疆拓土洵為萬古不刋之鴻論前題董誥矩協從心自寡營葺堂申鑒聿觀成四言夙契雲章煥兩記新成寶翰精淡泊同源松棟翼清舒近映竹苞榮不貪義藴昭然揭帝範原殊占畢生前題孔育文館傍清舒意匠營書堂結構閲年成無私共仰宸居正有戒還欽寶訓精月印心淵千古鑑花開睿草四時榮古稀天子超前聖聖學原從聖敬生恭和御製溥仁寺瞻禮作元韻和珅寺因羣辟創鍚額見能仁頌祝千齡永皈依萬國親祥雲梵宇現佛樹塞垣春終古無生滅真同極樂民前題梁國治至矣公能溥難名聖與仁香花供自昔雲日仰如親空界諸天近聲聞萬里春堯風傳擊壤處處太和民前題杜玉林創始昭純嘏重熙仰至仁繼承惟祖烈瞻慕必躬親億萬斯年慶三千大地春羣蕃長效順化宇盡堯民恭和御製扎什倫布廟疊去嵗韻元韻和珅佛法無邊四部彌來從重譯肇鴻釐行因圓滿聊歸寂諦示宏深普兆熙髙弟尚留傳貝葉長松依舊挺香枝可知幻相皆空色過去還同現在為前題謝墉願力能將四大彌襌宗飛鍚祝蕃釐歸依得仰妙顔霽圓寂還留微笑熙樹坐恆思翻葉葉燈傳無盡照枝枝比丘百八三千律聖證無為寓有為前題馮應榴宗風宣播大千彌丕曜禪燈祝佛釐自識應身原不住偶來夀世驗重熙長開梵夾三車法先兆娑羅七葉枝見羅樹御製寫娑識語帝為羣生期普度憑將無礙證無為普超御製偈蠢蠢度佐我無為治恭和御製題煙雨樓二首元韻杜玉林名勝堪誇吳下景山莊構築倣勒摹空蒙直似臨鴛水渺瀰遙看浴鷺羣樹罨入忩呈活畫雲垂列嶂縱竒文青蓮島是真瓊島引入薰風菡萏芬樓外煙波波上樓鳬鷖拍拍葦間投列湖南北供憑眺浙水東西記豫逰耕織每關天下樂雨暘尚厪聖人憂熱河雨水稍多即開聖念盼晴殊切旋霽省方他日重經處風物嘉禾愧遜不恭和御製篋韘用癸巳恭題皇祖御用韘詩韻元韻和珅草連十九傳竒中神射真堪絶古今想見和荆調佽手不殊矍圃妙從心殪豵欣頌騶虞什弆篋知同琬琰欽珍重天題決拾句函封豈獨數華琳前題謝墉武功開國由來久聖孝承家直到今命中早殷貽厥意珍藏彌切僾然心銘恩彞器膚公奏昭德雅方手澤欽枯矢石砮輝册府萬年法守炳華琳前題董誥躬勤決拾垂謨逺祖訓留貽聿毖今詎以韋弦呈炯鑑直如盤鼎契精心三驅洞貫羣藩仰什襲函題億載欽纘武常懷無逸所珍緘奚啻護瑤琳恭和御製題錢陳羣和韻書册再疊甲午詩韻元韻嵇璜田間賡拜閲居諸眷舊深恩重賁書同直昔嘗推宿學賜歸後更擅髙譽品題泉石甘娛老宏奬風流愛起豫尚記扁舟歸秀水談詩夜半雨聲踈恭和御製緑毯八韻元韻嵇璜平沙嫩緑敷蔥蔚細毯鋪來避暑莊彌望疑分三秀種叢生愛傍百花場鴨頭淺染挼籃水螺髻濃連峭碧岡雨織如絲方更密風裁似剪不教長柔毫倍勝鴛為綺暖席寧煩麝送芳好擬吉雲移九景恰符朱草滿中唐行看白鹿扶雕輦坐倚青山作隱囊敬誦宸章昭儉德罽賔逺致詎稱良前題謝墉得意應從吉雲國多情絶勝五橋莊地靈織就莎蘿毯天巧鋪成町畽場麌麌行時供飽食茸茸茁處遍層岡繡屏臚列輝髙下瀑布飛流界短長金碧畫圖相映帶芩蒿雅詠共芬芳華蘋朱草嗤東漢野火春風陋晚唐煙靄恍籠青錦段露䀶凝溢彩絲囊來逰小憩文茵展仙鹿扶鑾當吉良前題圖敏林巒地擅錘峯秀圖畫天開玉塞莊乍喜碧蕪初被徑恰疑翠罽已鋪場繁英作陳連髙塢密剡成茵襯逺岡繚繞平添雲錦麗毿㲚遙引緑絲長鶴蹤淺印留輕篆燕蹴飛花雜衆芳得氣豐葺滋上苑乘時緑縟遍中唐地衣似展移春檻彩筆應歸拾翠囊略仿堯階茨土意氍毺奚必羡工良恭和御製題秀起堂元韻嵇璜書堂攬秀據巖嵬選勝真宜避暑來泉韻直從千澗落山容頓覺一時開意超象表佺期集興溢毫端甫白陪此是蓬壺最髙處塵蹤愧未列輿儓前題和珅堂名秀起勢嵬嵬萬壑千巖入座來澗落飛流知雨過窗延晴爽對風開一庭松翠間中賞四面雲巒靜裏陪蘚印苔䀶留鹿迹掃除無事付園儓前題梁國治堂臨西峪切雲嵬秀色真從太古來山水清音前句在畫圖生面隔年開松風迢遞千巖應石勢參差萬笏陪最好秋天摹淡墨寫成仿作米家儓前題孔育文山堂上倚碧嵬嵬攬勝頻邀御輦來雲構髙臨丹壑啓日輪近碾翠煙開竒峯特立當軒拱茂樹周遭入座陪到此應知閭闔迥三壺仙島亦輿儓前題圖敏峯崇西峪入雲嵬堂俯平林秀色來四面常時屏嶂列十洲仙境畫圖開髙居祗有煙霞護上界惟應鸞鳳陪塞苑名山多福地都教蓬閬作輿儓恭和御製幸避暑山莊啓蹕之作元韻和珅古稀天子所無逸時御欣瞻䇿馬行曉日曈曨迎彩仗薰風披拂發神京田塍潤澤融冬雪刈穫登場曝近晴夾路農民齊額手豫逰休助愜羣情前題謝墉方澤回鑾昭聖敬康衢䇿馬仰乾行八荒而外皆吾闥三古以來孰與京申警官針嚴舉錯時治民上厪念東省吏依申嚴黜陟軫懷農事課晴隂時上以雨澤未透時軫懷形諸歌詠騰歡一路歌休助郅治交孚上下情前題董誥豫逰每嵗無非事吉戊初程夙駕行豐水百年開上塞薰風七頓指灤京玉驄親御觀民物繡甸殷懷課雨晴忭慶不徒徴擊壤林巒亦有媚兹情前題戴衢亨至日方壇回法駕詰朝星駟肅天行涼生巖壑宜仙籞秀鬱川原遡上京熱河為金上京地麥穟香來喧老稚桞絲風起候隂晴小臣幸預雞翹末簮筆難忘鳬藻情恭和御製出古北口咏事元韻梁國治管鑰神京極望開興桓山翠撲鞍來一丸泥豈雄關恃六幕天教塞宇恢野水縈紆環曲岸行人指點説荒臺九重軫念惟民力壯築空勞可自咍前題戴衢亨層髙傍九霄開清曉遙傳警蹕來上塞舊稱天險固重關今見帝圖恢耕堫樂嵗饒豐壤煙雨前朝冷舊臺多事邊墻誇萬堞行人駐馬辴然咍恭和御製常山峪行宫三疊舊作韻元韻和珅出關程按頓山館近巖前靈峪青林裏離宫碧澗邊充庖蘋鹿脯列鼎菜羮筵移仗消長晝拈詩度小年風來行殿爽雨過塞峯妍明日河屯路鑾輿趁曉肩前題梁國治行殿常山峪周廬翠嶂前石梁郵記里土嶺界雄邊雲起生松牖風薰韻藻筵卑宫欽禹德駐輦溯堯年境寫三壺秀篇題八景妍秋來回蹕路豐穫喜赬肩前題嵩貴路出千盤上浮嵐滿目前林巒髙不極塞甸逈無邉羽葆停清蹕奎章煥御筵尋幽仍八景拈韻疊三年澗嚮空邇靜山光晚更妍莫言逰騁地聖學念仔肩恭和御製山雨元韻和珅時若甘霖恰值期雲生逺岫雨飄絲春苗已見登場富秋稼還欣出土滋老圃老農情得得引恬引飬樂嘻嘻塞田髙下都如此猶自勤劬勞來之恭和御製至喀喇河屯用前作韻元韻汪永錫河干仍際雨來期瑟瑟微涼又散絲傍砌已添蒼蘚潤捲簾彌愛碧峯滋內間馬過方超躍外服人來亦笑嘻更是一年安樂景聖心長與衆同之前題戴衢亨仙莊七日指前期小駐河屯歇雨絲地擅膏腴煙火輳天成坰牧水泉滋豫逰夏諺迎鑾幸笑語春臺擊壤嘻欵塞名王齊拜舞帝車遙過拊循之恭和御製至避暑山莊即事得句元韻嵇璜度嶺香花簇曉郵山莊景物比皇州百年禮樂聲明洽一郡官師府事修弦誦儒風斯盛矣方蓬勝境有殊不熙朝釀化孚中外世德從來本作求前題嵩貴七日程更報曉郵迎鑾喜氣滿邊州市㕓早見三條集禮樂新看四術修一豫一逰胥樂只成都成邑足方不皇𠂻更切持盈意富教殷勤事講求前題汪永錫聖教覃敷速置郵絃歌化被古興州儒風正直殷繁啓士行原依朴質修習禮明詩今若此掄材選俊昔曾不就瞻嵗許親雲日何事漸摩更别求恭和御製永佑寺瞻禮元韻和珅輪奐仙莊廟貌崇每先瞻禮致虔𠂻纘承光烈思繩武繼述前徽念集躬塔影髙齊南北嶺鐸聲嚮引去來風寺有舍利塔髙矗雲表宏功至孝登仁夀拜頌羲軒聖揆同前題梁國治到此先瞻廟貌崇洋洋如在凛淵衷百年歌詠思文祖萬國懷柔集聖躬震旦光華惟佛日時薰長養有皇風梵天世界歸仁夀功德從知示現同恭和御製寫心精舍元韻嵇璜聖心合天心浩浩自抒寫存心以養諸從心不踰也要惟致中和詎使根塵惹瀰綸遍寰瀛栽培及拱把行其所無事而無非事者指示底安瀾懷保心寧捨恭和御製煙雨樓對雨元韻和珅檻拂薰風靜籟鳴雨中夏木翠如傾冥濛望裏渾無迹淅瀝聽來寂有聲山色四圍青似染波光一片潔逾晶從知睿藻標題後逺勝江南舊擅名前題阿肅萬樹涼颸槭槭鳴荷珠碎濺聚還傾窗紗虗映煙巒色簷溜飛流雪瀑聲潑墨濃雲橫靉靆鎔銀平水漾光晶鴛湖好景移仙苑自荷宸章倍擅名前題杜玉林逺和泉聲瀉澗鳴近翻荷蓋作珠傾全消暑氣延風景漸點秋空識樹聲禾黍芄時添滲灑松篁洗後益光晶塞山煙雨供宸豫坐覺滮湖浪得名前題嵩貴㶁㶁奔流繞砌鳴迷濛咫尺雨如傾劈將幾縷飛梭影迸作千行潄玉聲列檻螺分巒湧翠侵簾縠淨沼含晶宸懷恰喜層軒賞不數鴛湖舊擅名恭和御製溥仁寺瞻禮元韻阿肅紺園羽衛肅鈎陳全地規模煥一新堂構今看基克紹升恆舊記福長申拓開蓮界真香滿養到松鱗古色皴白髮耆民迎翠輦齊歌世德頌能仁恭和御製題文津閣元韻和珅全書四庫御披成不是文章藉墨卿塞上瑤函聊有待宫中首部早依程今春首部告成先陳設津文淵閣其餘文溯文源文二三四部陸續告竣以次陳設淵溯源津斯最後史經子集各分贏戊申閲嵗期非逺仙館行看庋架盈前題謝墉經筵成禮慶書成喜宴恭叨厠墨卿仲春墉奉經筵臣命講書禮成與宴恭和聖製珥筆熙春逰册府屬車清夏扈雲程佇瞻幾暇三庚愜還比珍藏二酉贏嵗嵗來逰得津逮萬篇奎藻玉函盈恭和御製荷二首元韻和珅清靜偏宜靜裏觀紅粧點綴碧溪灘薰風譜入虞絃調十里荷香在筆端塞湖蕩漾芰荷風蓮葉田田翠間紅緑水一堤新漲滿好山分占岸西東前題謝墉清淨妙明如是觀早供宸賞發湖灘亦仙亦佛亦君子三教何曽有異端亭亭獨立裊薰風隔斷塵凡萬軟紅靈沼靜看魚躍處戲南戲北戲西東前題董誥亭亭不異液池觀玉井分來映碧灘月白風清塵不到淨因先得證毫端掩冉清芬引塞風水晶鉢裏曙雲紅作歌好譜江南曲戲看噞喁西復東前題錢載物理天時入靜觀芙渠五月已盈灘人煙輳處風先暖旋轉真關氣候端恭繹月下御注往年熱河荷花於六月始開今五旬已放向嘗為氣候詩有或者人煙輳以致默轉旋之句即此亦見一端誠以暖律駕幸山莊順時與務熱河近嵗民物蕃昌先吹適見於荷花之早發地氣所轉天氣應之理有必然者矣桞煙蒲雨更蘋風冉冉亭亭白間紅畫出六橋山正曉裏湖西隔裏湖東前題戴衢亨蓬萊佳處愜澄觀五月荷花發蓼灘水閣清涼天一碧忽看仙藻下雲端色是漪漣香是風田田斜接畫橋紅藕船十丈仙人種淨植分來太液東恭和御製題所放倪瓉獅子林圖五疊前韻元韻梁國治古淡天然展石渠墨池臨倣復題書山形水勢都因彼繪意詩情亦起豫初地香幢參玉版片時銀漏轉金胥幾間五疊紆清賞選勝真兼曠奧如恭和御製逰獅子園元韻梁國治獅峯想像寶蓮居松牖依然茂對餘示現緣同三世佛紹聞衣凛一人豫懸榜字天垂象輪近秋光月向諸玉燈錦淙瞻宛在如來法界證真如前題杜玉林瑞啓龍池興慶居我皇逰豫萬幾餘髙標聖迹瞻猶昔永念薪傳凛在豫景色關情重過此年華瞥眼未忘諸祥雲深處閛屏幛崒獅峯畫不如前題戴衢亨萬年松牖慶那居獅嶺名園締構餘上夀古稀恩溯昔亶聰天授德懷豫岡鳴翽鳳曾來此池躍飛龍孰擬諸最是林泉邀眷顧塞山長頌日升如恭和御製晴碧亭憶舊元韻嵇璜山莊勝處九夏涼盤空晴翠澄流碧翼然亭子踞山隂憶是當年賜居宅貽謀篤慶切堯心佳氣蔥蔥護層壁歡承溫語傍仙舟卿雲瑞捧初升日撫序俄看甲子周敬溯恩慈如夙昔山翠依然萬疊橫松青不改四時質古稀天子日孜孜與天同健誠無息濤聲謖謖韻薰絃繩武維殷兼述德前題嵩貴翼然亭峙溪山隈萬壑松隂罨層碧棟牖疑從太古來巖阿夙擅神仙宅雲霞舒卷圖畫開謖謖奔濤捲蒼壁此地當年仰賜居松翠千春如一日山色寧論舊與新溪聲但覺今猶昔九重付托萬年心此亭依約皆堪質即今避暑􅊩山莊幾暇遊歌憩焉息康強福履古云稀敬𫐠祖恩承一德前題戴衢亨晴碧亭前萬壑松嚮徹晴霄舞空碧此松曾侍軒皇來中有萬古之仙宅宅傍巖洞含清幽一徑煙蘿上層壁溪流如練石如屏水色山光似當日古稀天子純慕心六十年來恩溯昔昔時階下五粒松樛枝盡作蒼龍質松花松實自年年不數征僑駐胎息願陳天保頌如松萬載青青懷舊德恭和御製題戒得堂元韻和珅堂成作記復題詩去夏今秋閲嵗時顔額義明尼父訓發端别見武公詞庭依翠磴嵐光擁砌繞清溪細縠披得位得名並得夀總因善戒始兼之恭和御製觀瀑元韻戴衢亨瀑源構亭子秀與諸峯殊垂紳象宛爾摐玉聲淵乎風泉回宜眺雲構不可模目謀勝耳謀空色語非誣會心豈在逺靜觀有是夫蒙為德所育漸乃聖之謨文津從此滙願以覘道符恭和御製題山近軒元韻和珅巖軒清爽却炎愁山近璇題造化逰靜挹嵐光憑翠巘平分雨色借新秋都因地僻由心曠幻作雲停與水流一度登臨一吟咏聖情更厪普沾優前題梁國治甘膏昨已慰農愁霽後涼軒奉豫逰地迥近山宜避暑庭空得樹愛先秋濃涵雨氣煙嵐重影落湖光翠黛流多少塞田邀渥澤片雲生處萬家優前題孔育文時雨能銷望雨愁名軒幾暇暢來逰雲林繞壑清忘暑山翠當窗爽欲秋碧宇半銜斜照逺青霄還見晚虹流隂晴往往關宸念載頌恩膏到處優恭和御製古松書屋作歌元韻和珅岩阿閲歷不計年鎮古塞山秦漢前書屋之傍如偃蓋八千靈椿差比肩嵗寒不改後雕操凌霜傲雪節錯而根蟠特立自鮮蔦蘿緣結楹恰在岩石間青青鬱鬱庭前與簷際更有文禽馴鹿終日相回旋欲撫古松問其春秋凡幾度太古以來十八公號傳書屋結鄰仍情山靈呵護焉前題梁國治松柏之夀不記年此松母乃羲皇前築室方丈隔塵境啓戶欲拍洪崖肩山莊福地氣深厚其上石挺下有蛟虬蟠蒼髯一叟來何緣白鹿黃鶴逰其間山中甲子問以幾嵗月去來萬里羲娥雲霧交縈旋曽聞大椿之夀春秋八千嵗生物不測難以名言傳古稀天子無量於此古松何有焉前題嵩貴古松柯葉閲年年靈根秀鬱髙峯前倚天拔地一千尺下視雲壑相差肩書屋仙莊擅幽敻蒼苔一徑屈曲爭縈蟠樛枝不受蔦蘿緣宿雲盡日依其間黃山白嶽突兀現眼底時有千年老鶴振嚮凌風旋偓佺之倫餐英服實不足數又如名材老向岩阿傳顔曰古松書屋兩美相得益彰焉前題戴衢亨山如太古日似年書屋迥出層峯前亭亭松樹巖華蓋羞與凡木同比肩畢宏偉偃畫不得白書疑有風雨蒼虬蟠仙之人兮空萬緣谷神往往棲其間下有千年琥珀照幽澗上有枯籘百尺倒挂相回旋此松與屋不知孰賔孰為主岩阿古幹幸遇天筆傳屋之名也不朽松之際會豈偶焉恭和御製偶見元韻董誥萬物並育天地心蝝息蚑行無棄委聖人仁心覆載同物物總歸在宥裏山莊羍麑偃樹根麑母伎伎從奔徙宸矚偶及煦嫗周見生不忍見其死因命遙護候母來果看舐乳弭雙耳於物天性固有然蒸民夷秉尤懿美胡笳感動駝哺駒詩有御製詠駝胡笳奏其旁哀腔鳴嗚嗚感駝心生憐乳駒乃如初之句雌雄跳蕭鶴領子製鶴御領子詩有透壳宛成形淋滲未能立鴉鵲或來侵跳蕭護之急之句聖製體物教孝慈伏讀油然心生矣又如行圍放鹿毆有開御製巴顔布爾哈蘇台放鹿詩圍放犬羊恣其毆深山之句好生德洽有如是獸長麛麌斯一端吁嗟騶虞葭茁彼何况仁民保赤萬倍此恭和御製霞標弗待月元韻董誥霞標弗待月跋馬則依然年年木蘭御弧矢龍驤馳驟相回旋聖人寓意不留意待與不待此意胥同焉霞標弗待月虗白光生祥止止大千世界圓明中萬川一印非虗語金波穆穆錘峯升寶幢華鬘雲呈喜天心無待無弗待智珠朗照無窮矣光明淨鏡纖翳空問之望舒應識此旨耳恭和御製批摺元韻和珅封章必親披乙夜勤政要四十餘年來古稀邁益劭眷兹農務時厪念司民告時若見休徴盛夏不致潦有司視殿最黜陟示升調仙莊避暑居每禱甘霖膏休助在豫逰豈是山水樂凌晨運丹毫恩惠發郵報鑿井與耕田帝力皆周到纖微無不遺遑云治本約所以召和甘雨集不愁淖聖人止九過首慎視民傲前題戴衢亨仙莊每嵗來躬覽萬機要批決洞無遺咨訪意彌劭為厪農畝私每佇驛章告綢繆課早遲瑣屑占晴潦朂滋清慎勤軫彼租庸調今年三輔區隂雨芄苖膏懸知塞北豐更説江南樂齊州沃野滋豫壤甘霖報秦隴燕代間屈指秋成到休哉播嘉祥所貴登儉約時清鮮訟爭人和欣普淖似聞擊壤民鼓腹羲皇傲恭和御製蒙古田元韻嵇璜大漠逐水草擇善處斯去地氣本難齊不耕何以穫內外扎薩克久矣偹藩牧羣領與谷量蕃滋是所務稞蕎雖耐寒霜早亦可慮中外今一家風尚已非故耕鑿習而安雨㿩籌以豫板升得攸居花當又何懼或專學農圃分地嫻力作或仍習射生獷野性已除撥茶兼屯穀萬里安且固前代三衛人擁強恃殷庶兹同編戶者頗識田間趣我皇舉秋搜講武嵗有素名王扈三驅至意於是寓綏逺兼畏懷奚待象胥諭前題錢載邊氓耕獵牧三者不可去蒙古寖忘舊乃惟力播穫叶昔時告天收猶不廢獵牧叶蒙恭讀俗種御注古舊田畢含之去不復耘及穫之曰靠天收國朝設用之從征在軍務農而不習武是宜善所慮洪惟文皇朝大勳紀掌故蒙古實先服勍者使偹豫今聞青海嬉嘗逼黑帳懼黑帳房畨人耕堫何不為獵牧何不作邇者青海好飲偷安畨人不惟不之畏轉被劫奪蒙天恩訓飭令莫忘舊俗厄魯特諸部獵牧豈其除給之暖地耕飽則遐情固如村板升稠依山種落庶叶土臣恭讀拜甡御注蒙古語瓦屋曰明人訛為板升馴為邊外風近同邊內趣皇心顧以籌邊部還其素射獵畜牧勤兵即農隙寓爾田報有秋舊俗重宣諭恭和御製上駟元韻嵇璜聖人盡物性至理通馭馬止須害者捐不患知者寡往年慶武成西極歸宇下渥窪之所産嵗貢其常也飛黃來服皂龍媒亦紛若但得牧養方寧以奔踶舍除蓐則於春庇庌則於夏僕緣而拊之順時馬弗訝玉轡控自安金埓塵不惹俶儻權竒姿豈至汗盈把駿尾偶肅肅仍既佶間且皇心悅以豫薄言斯駉者良田愛護致亦本性馴雅習慣成自然勞逸不可假格物在類情停鞭得句寫恭和御製題鏡香亭元韻梁國治新亭戒得堂隂後水色山光月蕩磨四面鏡波搖露檻一川香氣聚風荷踈莖宛轉通鷗路密葉周遭隱翠窠盡日氤氲吹不散南薰添入御毫多前題戴衢亨香到鏡中涵瀲灔鏡宜香裏謝瑩磨炎消池館風生葛雨歇山莊水放荷曲檻浮漪窺鷺浴飛簷倒影綴珠窠空明天上清涼界自在真芬得已多恭和御製清舒山館書懷元韻梁國治承天子萬年繼體鍾餘慶題額凛心傳惟聖能知聖於斯深意存永言膺寶命窈矣無形視穆矣無聲聽仰兹羲畫懸夙夜如提警懿夫德日新實惟皇自敬問察逮芻蕘中外求利病求寧觀厥成未釋中心怲五字編雲楣萬古垂金鏡恭和御製戴衢亨獲麅即賜之因成是什並令和韻元韻戴衢亨扈獵材難下乘充長楊賦手愧專攻獻生敢謂天庖佐拜賜兼傳聖藻雄官笴應弦輸力薄詞林載筆荷恩融携歸喜倍期門侣一例頒禽未許同欽定熱河志卷一百十六
