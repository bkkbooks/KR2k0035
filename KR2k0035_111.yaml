body:
  text: 藝文六本朝詩恭和御製山莊燈詞八首元韻汪由敦萬樹天花燦遠空燈筵例比禁園中仙莊夏景過元夜大地歡聲內外同寶幢光搖五色雲踏歌聲裏漏聲聞尋橦宛轉新翻樣馬伎驍騰舊絶羣夏宵山近氣微寒萬盞燈疑九陌看絶勝昨秋三五夜桂輪氷淨露珠團零露恩濃賦蓼蕭丹霞百尺建神標人間天上渾難辨不夜城中第一宵鈞天日聽琅璈樂良夜還燒錦帶燈拜舞遙稱無量壽琉璃寶界集神僧花散千枝驚豔發光流百道絶空緣虹橋幻出通仙迹寶字排成拱御筵巖嵐林影紛成彩絳闕琳宫慶此宵瀛海蓬山能似否鬱蕭臺上列仙朝千枝渠碗帳前陳西域休誇百轉輪豈獨名王蒙遠耀祥光朗照萬方人前題王際華玉塞宵涼碧宇空離宫景乍度天中來賔新得焉耆長錫宴元宵事例同萬緑叢中散火雲雷轟電激四山聞映波百道金蛇掣倣佛紅旗競渡羣才挹冰漿瑪瑙寒魚龍百戲儘教看忽驚火樹銀花發映月連星并作團喜對薰風詠蓼蕭雲霞繞幕赤城標芳園已過黃梅雨月色燈光又此宵緑樹隂中雙鳯輦紅蕖池畔九華燈光明界即蓮花界照徹三千現古僧來從雁磧天西遠還結鼇山海上緣湛露三宵霑毳幕華林萬帳共芳筵正是星橋初啓處莫教玉漏易催宵龍光日日榮三接綘幘傳呼又早朝花開頃刻幻俱陳燈影旋移轉玉輪忭舞西來諸部曲從今常作太平人前題錢維城萬樹園開朗太空放燈如在上元中覲光初接狼㬻部應與朝正舊例同萬點攢星五色雲空中雷轉遠山聞鼓聲未驟紅初結火鳯銀龍各一羣不知明月水晶寒并對晴山火齊看夜氣自澄天宇淨鏡光融徹錦輪團初聞煙氣若燔蕭旋有霞光似建標嘉會勝情都不減藕花香裏試燈宵錦幄還垂五綵線蓮花合作九華燈更看寶樹玲瓏塔疑有琉璃界裏僧烏滸亦登同樂苑素娥偏結蕊珠緣已過仙艾靈絲節重預傳柑撤荔筵到來玉塞招涼地猶是金吾放禁宵麗正門開千隊入山莊仍設正衙朝魚龍曼衍畢分陳歡洽終宵轉玉輪好語西戎全入覲來同上國踏歌人恭和御製金蓮花元韻汪由敦灼爍爭看爛綺霞傳來嘉種自龍沙御袍拂處風初定玉砌開時日未斜淨植寧慚君子德清芬故在法王家承恩撤炬休相比不是尋常設色花恭和御製清舒山館元韻嵩壽登臨到處皆堪賞入夏尤於山館宜擎蓋有香蓮吐萼繁隂似織柳垂絲哢晴好鳥無心喚欲雨間雲作意遲靜裏天機隨領略晚來明月入簾窺前題陳德華是地炎歊從不到此中邱壑總相宜棲林鶴起驚松籟出岫雲來帶雨絲臨水能教塵壒淨看山不覺夕陽遲靜便何處煩囂著只許蟾光入夜窺前題國柱别館招涼當妙境三庚引興最為宜扇裁圓月氷為骨衣製輕雲雪作絲雨氣一簾蒼蘚潤風飄半篆翠煙遲紅塵萬斛飛難到惟有松間白鶴窺恭和御製題大寧塔元韻汪由敦大寧城廢名徒存賸峙孤塔臨荒原疑有梵筵開舍衛空傳詞賦説梁園舍利金剛縱靈異難鎮燕都天子氣北顧全無拊背憂南下方知翻手易踴來多寶定先知曾見潛師席卷時替戾秃當鈴自語長江髙閣重疇咨寧王後改封南昌珠簾碧瓦早沉消宿莾煙榛影動搖耕牛牧馬歸殘壘可識升平嵗月遙六龍東指時躋陟清曉陽烏才展翼雲來雲去乍迷離路隔空濠近城北亭亭可望不可登默數飛簷疊幾層駐馬踟蹰無片碣欲問誰建何由能龍沙卓立幾經秋爾日欣遭聖藻留廣漠野逍遙遊慿眺應銷萬古愁職貢而今此置郵恭和御製板升元韻汪由敦巢居苦風穴苦雨象取大壯肇棟宇疆畛所限習俗殊氊作穹廬恆聚處平沙廣漠格爾多駝馬滿谷羊滿阿誰教架構作籬落遂闢村莊藝麥禾候吏無呵容轉徙塞山到處營疆理或齊或晉失業民接踵栖依挈妻子一家中外樂時平舊史堪嗤詫板升祇今煙火通鄰里當日風塵擾甲兵輸幣嵗增虧帑用馬市才成旋請封拜甡契塔為冦資蒙古稱漢人為契塔蓋契丹之訛遼宋接境故以此為通稱耳隱然敵國聲勢重名藩內屬餘百年不逐水草事力田從獵公徒隨弭鞬迎鑾除道待行邊懷柔布德聖化宣板升更賴天藻傳恭和御製魚石屏歌元韻汪由敦少見多怪紛然疑偉哉造物能爾為由融而結誰指揮異石片片羅鯤鮞頑礦乃復藏神奇宛見緑波遊泳􅐾出聽豈繄聞絃徽銜鈎那待投竿絲乍疑妙繪網箋遺啖花影㺯垂柳枝或乃匠巧神工施刻畫鬐鬛分􅞟移想當秋水無津涯鱗鱗潑潑時紛其曝腮跋浪凌空虛叶此樂未許惠子知滄桑何代倐若斯帶還為礪匪夷思炎飈皓日漢沫滋大鈞飛焰陶青泥一氣所到理異宜石凝水態層層披魚為石質息不吹麻源螺蚌有先期製屏不藉丹青緇重以天章琬琰垂酉陽博物驗在兹恭和御製蒙古土風雜詠十二首元韻錢陳羣乳筒孰論得髓孰得皮以莢何曾一矢遺毛孔直參無漏義元霜要悟欲流時最憐初逹先知跪羊初生求乳必跪其母只恐生駒未受羈候火定教通味外醍醐應向此中移荒田偶紆翠蹕雲中騎來看黃沙雨後田試厯塞垠無棄地方知聖澤本同天縱橫自屬東南外樹藝仍居遊牧前力作不勞成嵗事升平一飽故依然卾博疊成齒齒復磷磷此是山川正直神便有攝儀行過客何曾施敬路旁人由來朴魯無淫祀終古祈求有嵗申挏乳炙牛存典禮居然風俗譜岐豳革囊一笈從來抵一奴行旅諺語拼擋家具此焉俱為筐不用裁江竹盛飥何妨當飯盂利涉亂流傳古法考工紉製陋諸儒蕭然囊槖隨行李自笑真成濩落軀柴車聞説紫芝乘此隱而今遺法塞垣多元德秀罷官後嘗乘柴車往來陸渾山中不巾不輻偏行遠非櫓非篙亦渡河載月咿鴉同小艇拖泥穩便比輕駝曾叨扈從陪車後沙路相逢一簇過骨占神占即可號神羊火象於焉義取掦灼炙既從呈坼兆仔肩如響定禨祥繁昌早驗明年牧近止能知遠戍郎魚亦問晴雞問卜乾坤至奧豈終藏馬竿孑孑緌緌及腹繩駃騠未許縱驍騰若非竿勢先馴致那得鞭絲便奏能罷釣任公時拂水脫族蘇相偶踰陵盡驅天馬來天廄絶技材官庶足稱兒版乳花啼笑劇堪憐韋紉雙縧貼兩肩不用歌詞傳靧靣豈因束縛礙吞拳牌頭籍免添丁稅臂上絲穿長命錢更指熊祥牀寢地壁間弧矢正髙懸灰簡布白編韋可代言結繩而後此苞元新陳遞嬗人稱便開闔虛中道可存春蚓秋蛇無定迹剡藤魚子不分門學書紙費成徒語執簡應同傳笏論竹筆如錐蘸墨便能揮老健中書未放歸豈假象犀稱玉笋敢邀湯沐著紅衣苕霅間製筆有名大紅袍者透來紙背方知是認去毫端只恐非倘得幾餘親一試行間鸞鳯會同飛口琴獨絃琴是口中吹匠氏偏工以冶為老眼看來真似鑷春蔥撥去恰成絲聲回合節筝應讓舌轉如流鶯未知行殿薰風傳解愠雷門布鼓笑閼氏轉經磨兜妙義自無文佛力風行衆所欣清淨輪回原自在波羅密諦本難聞萬緣旋轉空王國一手扶搖大地垠象教由來能護國焚修莫説誦持勤恭和御製出古北口元韻嵇璜一峯留斡控羣山古塞蠮螉是北關秋嶺風回雲氣合邊牆雨潰土花殷來庭遠服通軺傳迎輦歡聲動市闤底事長城誇設險八荒已在戶庭間前題夢麟馬足輕塵馬首山翠微堆裏逹嚴關雁沙風掃連雲白綺樹林髙帶雨殷煙靜丹梯間畫角天開碧嶂見通闤聖朝不用丸泥塞萬里伊犁指顧間恭和御製烏沙爾器元韻汪由敦丹㽔不逐塞榆飄火齊星攢壓翠翹若向西京論賦手君遷平仲是同寮答遝何曾到上林龍沙秋色曉森森故知遠軼嵇含狀果譜新添有睿吟靈砂點就神丹轉靺鞈奩開寶氣豪應笑朱方數紅豆漫勞西域問蒲桃前題劉綸好鳥榆關啄蕊飄離離星影綴雲翹相於合有北天竺妙鬘華纓結淨寮上蘭仙種擅珠林瓷斗分叢護碧森五雅釋箋都可廢品題乙夜入清吟赬虬探頷由來幻火齊傾柈詎足豪到眼吳儂慚物色料量郁李比含桃前題觀保芳叢疑有暗香飄朱顆圓勻壓翠翹道是珊瑚生貝闕何時移得傍山寮託根榆塞自成林材可為弓老幹森旖旎詎隨凡草木應將紅豆入新吟丹砂色綻堪同豔火齊光懸足並豪最是巗疆多異種引來山鳥誤含桃恭和御製常山峪行宫疊舊作元韻汪由敦雲軒青嶂外霞磴纈林前大獮方行令勳為定邊遵塗屇靈囿頓宿撫文筵回憶初臨日俄經十五年製舊御韻作於辛酉是年初恭和幸木蘭臣叨與扈從曾元韻煙嵐猶滃蔚風日更清妍八景披吟處御行宫有詩製八景新松正及肩前題董邦逹睿略馳方遠宸遊迹憶前行宫重駐蹕諸將近收邊秋色迎鑾輅山光拱御筵慿軒增勝槩觀稼樂豐年舊墨龍蛇徑新題藻采妍計程山館邇蕃部集駢肩恭和御製熱河啓蹕幸木蘭之作元韻汪由敦乘時肄武舊章循白露初過呦鹿甡峰指玲瓏林􅌄窱雲垂糾縵曉輪囷疇咨封事郵函速志喜宸萹點筆頻那待周阹誇遠服天威早懾大宛人前題劉綸灤河繞塞首塗循雉介風高聽鹿甡迎勒草香聞暗藹展圍山勢看盤囷大宛選騎調良並穆納旋轅送喜頻兩嵗陪筵許三接奉琛還待後來人時聞哈薩克陪臣將次入覲恭和御製出古北口詠古元韻汪由敦北門雄鎖鑰設險有嚴關一線通戎索千重矗塞山雉樓空曲上鳥道翠微間往昔藩籬重防秋士馬難時清邊備逺民晏古風還羽騎駸駸度雲峰相對間前題紀昀翠輦臨邊塞檀州有故關南來通一線北顧見羣山連弩思前代偏槍近此間飛猱行尚怯高鳥度應艱蘇轍題詩出王曾奉使還何如今一統秋曉戍樓間恭和御製至避暑山莊即事元韻裘曰修山莊到處秋如畫勝日來時境是仙壯士扈行親校射名王入覲嵗開筵謀深帷幄皆長算吟到禽魚有夙緣此地只如房闥內年年清蹕與周旋前題錢大昕到處林亭宜入畫望來巗壑宛疑仙澄泓水展空明鏡峭蒨山當翰墨筵滿眼禽魚皆至樂會心草木有真緣升平中外承嘉宴好待秋深羽葆旋恭和御製熱河啓蹕之作元韻裘曰修小駐還當啓蹕時曈曈初日照通逵人言白草黃沙地身到青山緑水涯八月田功觀晚穫三秋花事賞芳蕤塞垣未覺西風冷閏嵗應知節稍遲前題紀昀武列河頭雁過時勾陳羽衛啓通逵紅飄霜葉楓千樹緑繞寒澌水一涯蹀躞花驄隨日馭玲瓏芝蓋散雲蕤如聞蕃落諸渠長會獵梁鄒到恐遲恭和御製雨獵元韻劉統勳獵以肄武傳有哉中權直冒秋霖來掦威制勝在弧矢非弩非網非繇媒軍聲已動不遽止轟雷激電難比擬膠霑弦濕中轉奇白羽落處蒼鹿起沾濡無愁得雋喜氣挾風霆運臂指乃知聖意戒遲回弛者難張張易弛朂哉勇決重戎行蠡測管窺見如此前題裘曰修長林豐草何遼哉平時獵騎不敢來奔狐擾鹿叢虎迹館熊窟兔驕雉媒大獮乘秋行至止鵝鸛魚麗安足擬左縈右拂射疊雙毛驚角駭圍中起挽水天河真兆喜雨腳垂垂近堪指弦鳴彌覺點聲粗弓徑不愁膠力弛須知師律寓行圍號令如山今見此恭和御製行圍即事元韻汪由敦半嶺霜風颯颯來萬山高處絶纎埃欲齊衆志羅千騎應識天生用五材白㲲乍迎朝日上黃旗高捲朔雲開據鞍批答軍郵速那待飛書趣入聲召枚馬騰弓徑稱行秋極目穹窿遠勢遒猛虎伏崖林霧暗驚禽躍澗日光浮細尋伊遜河流曲遙辨長城古迹留即景拈吟待圍合飛箋曾不費冥搜屬櫜列纛力恢張險越厜㕒躪紀堂潮海沇溶回地軸風雲翕集揭乾綱繩聯碁布行無迹環合規圍制有常肄武正勤籌遠略大風歌就興飛掦前題劉統勳紫氣黃雲匝地來寒山影裏動纎埃平添西極追風足饒有東丹射鹿材賦就長楊難自炫營連細栁不輕開蕭蕭靜聽鳴鞭響我士無譁底用枚縈回玉勒詠新秋馬上萹章韻更遒黃葉試茶新火活蒼鷹趂兔片雲浮凸凹巗壑如常履窈窕林泉為少留何物擇人行舐掌佽飛矛利敕重搜蕃部旌旄左右張躬桓先已會明堂行行隊似星分野井井條如網在綱箭殪天狼隨指嗾芝銜銀鹿見尋常便從羽獵圖王會吉日車攻漫頌揚前題裘曰修仗外圍嚴斷往來萬蹄蹴踏不生埃黃衫煜煜文昌將翠羽翹翹武庫材耳後鴟鳴飛箭過懷中月滿引弓開詞臣屬目旌門下欵段追隨揖馬枚樹樹金鳯葉葉秋飢鷹直下力初遒雲排兩翼呼聲合日麗中權御氣浮馳道龍旗遙掩冉看城鸞輅小遲留賡吟每捧瑶箋出獨愧枯腸韻苦搜絡海包山大翕張神機猶是運朝堂華夷共戴環辰極文武兼資揭帝綱眼底風雲生咫尺草間狐只尋常即看一矢天狼殪凱奏西來喜氣掦前題錢大昕森嚴羽仗自天來雨霽重嵐掃碧埃控鶴三千神策士飛龍十二上襄材令懸旌斾和門合陳布風雲大幕開講武六軍皆整肅不煩司馬戒銜枚野濶天髙九日秋伊松河上塞風遒玉鞭乍到輕煙拂紫幄初開瑞靄浮雲入望中皆淡蕩山當佳處暫停留廣成欲進詞臣頌詰屈空慙短韻搜彌山絡野勢分張變化神機自廟堂蕃部傾心瞻法仗降王泥首懾天綱握奇齊列龍蛇陳懷德遙迎日月常頻見玉門西奏捷欃槍掃盡國威掦前題紀昀長林豐草射生來石徑清無半點埃冀馬於今皆逸足燕犀自古是良材行分鵝鸛雙旌動氣逐風雲萬里開聖主臨邊軍令肅無譁不用更銜枚獵獵風聲大漠秋高原塞馬力初遒旌旗影帶寒雲捲組練光含曉日浮霜隼盤空爭搏擊天狼避箭敢遲留巾黃奮欲摧雕虎荷戟深嚴更一搜雲罕天弧嵗嵗張儒生何用戒垂堂諸蕃震疊星從斗七萃森嚴網在綱蹴踏崑崙猶奮迅鞭笞頡利只尋常銘勳尚薄岐陽鼓遮莫區區侈馬揚恭和御製山村元韻汪由敦塞外常苦寒種禾取其早地瘠既遲發雨稀復易稿行行傍山村結穗實堅好彌望但黃茂攬之粒俱飽婦孺各恬熙雞豚亦馴擾宸遊信多樂勝賞滿馳道前題董邦逹八月納禾稼塞外西城早山田黃盡勻熟異科上稿穈芑種自嘉結粒堅且好遠邊成樂土八口終年飽婦子皆優遊雞犬不相擾得此功誰歸蕩平頌王道恭和御製谷中元韻汪由敦谷裏人家成小聚火耕嵗久地回涼曲依巗壑搘為屋平碾坡坨掃作埸經嵗吏呼曾不到中田婦饁亦相莊從遊恍見康衢象民氣知無莠種妨恭和御製入崖口元韻觀保區脫天開屹兩崖到來眼底得清佳疊屏山訝駝峯似度嶺人看蟻垤皆嵐氣每於雲氣合松聲時與水聲諧習勞不為遊觀樂好景偏如佇睿懷恭和御製氊廬元韻汪由敦白㲲剪裁潔文筠插架平自然成廣厦寧用侈雕甍霜隔簾衣重香凝黼座清由來陶復製存古見深情恭和御製題小金山元韻蔣溥中央小朵即飛閭絶頂蓮花建紫廬秋水似雲圍曲檻孤峯如畫映方諸綺明練靜滄江遠樹隱樓開碧澗虛睿思不殊浮玉勝勝於浮玉轉清疏恭和御製清舒山館元韻蔣溥鶴捧爐香燕拂書清秋山館日長舒結為塵外煙霞窟移就村間水竹居林靄乍霏朝旭潤茶聲輕揚午風徐惜隂檢點禽魚樂詩地分明筆力餘恭和御製塞山元韻劉綸穆納嵐光繪嫩涼餘歊淨滌快褰裳磧中野水穿沙響莊畔髙禾出屋長夜拭玉蟾遲遠榭晴摩霜隼趂平岡木蘭萬頃如香海崖口懸知葉未黃前題觀保塞外山多氣早涼如花紅葉已裳裳雲開諸嶺駝峯出雨洗寥空鳥道長榆栁數家依曲澗牛羊千隊散平岡秋光到處邀宸豫况是陂陀稼已黃恭和御製含粹齋元韻劉綸一區架構有餘清納納虛簷出廠平與皓氣俱非假象得天倪露是含精太元著草亭空峙秋水成萹檻漫橫會取名齋真義蘊兼含孔思復周情前題張泰開窈窕山齋萬象清朝嵐夕翠與簷平試看飛躍天機活便識行生道體精石落沙明秋水淨雲歸岫復夕陽橫天題妙括羲經義俯仰髙深契睿情恭和御製駐行營元韻劉統勳興桓之北松漠南肅肅勾陳羽衛駐疊嶂遙連紫塞垠行程却指紅雲路崔嵬帳殿臨髙原丹林翠壑天然趣大海蕩蕩水所歸諸蕃來似百川赴馬牛恆以山谷量酮乳時論斛石酤燒當無弋肩摩從駭愕中華強且富昆彌動色相顧盼贊普傳言互告諭此間氣象真堂堂絶漠威行良有故軍容嚴整神融怡疆域式廓帝命貽欲將王會入畫圖豈但石鼓陳歌詩蓋地之圗驂白鹿聞風而至其奚疑聲靈震疊邁邃古大哉玉檢明堂基前題劉綸一重兩重碧嶂開千騎萬騎黃城駐星廬匼匝翊帷宫髙下風竿辨蹊路行行設枑更通橋秋原延矚無邊趣司盟舊部馳傳來屬吏新藩踐更赴根移苜蓿抽嫩芻種獻蒲桃壓清酤佳名沃壤多巴顔德産從知饒美富扈圍西旅競歡呼義手脫帽難言諭金牙瀚海坐日嗤甫草上蘭空掌故時畋悉率皇情怡允文允武家法貽鋪敘不數陳倉碣典則寧誇敕勒詩膚功已奏繕軍實登三咸五夫何疑和門珥筆請為紀時萬時億恢鴻基恭和御製九日元韻劉統勳黃花開放趂秋陽黼幄平臨射雉埸侍從欲陳豳蠟美蕃渠新識糗梁香紫萸盞泛爭承露白雁聲多欲落霜更喜寒山都似畫登高一望翠低昻恭和御製出崖口元韻劉統勳講武連旬舉大搜六飛親涉道途修已陳虎旅行松漠競擁龍旗渡索頭伊遜河即水經注之索頭水此地諸蕃爭送輦古來長塹笑防秋躬桓濟濟陪嘉宴取次金樽湛露稠前題劉綸磨崖大字紀親搜旋軫渾忘路阻修翠嶂雙排開石骨朱闌一折界雲頭回瞻雁寨鴻天晚直指煙村水市秋此際觀風知倍喜坻京比似去時稠前題董邦逹寶鞈雕弧罷講搜六龍回蹕引途修千行灌木縈旗首一路仙雲簇馬頭攬轡共知循舊徑看山又是近深秋鵷行扈從重經過回望林巒萬疊稠恭和御製萬樹園賜布魯特觀煙火元韻劉統勳列溪秋水夜盈盈月色燈光倍有情萬里旃裘聯隊入千枝火樹照人明直將玉燭通銀漢坐覺琉璃湧化城料得傳言遍西域聞風爭拜護羌營前題劉綸交光燈月一時盈敷坐擎觴共洽情舞入魚龍隨隱現篆成蟲鳥更分明騰聲合到無雷國散彩疑遊不夜城使者來從星宿海底教瞪目屢怔營恭和御製塞田元韻蔣溥阪田競髙低迤邐接塞外入夏土􅍺乾播種尚有待宵旰勞聖心甘澤還立沛良苗何油油陂塘互縈帶慮歉轉獲穰三農慶應最碧溪水潺湲未為秋稼害明昭帝所貽穎栗民斯賴塞天霜氣遲自卜收穫倍想見築埸時萬井農情快恭和御製峽琴軒元韻于敏中軒前動操衆山皆攫醳無心韻自諧悟徹匣中兼指上聽從挂壁復橫階傳聲谷遞清和奏入律風調解阜懷相賞更餘真意在天然松石軫徽排恭和御製滄浪嶼元韻于敏中芳嶼臨清流秀色在階砌動影沖融間倒侵翠微翠回風淡漪瀾觸景紛妙詣歌從孺子聆亭仿詩人置淵懷湛然澄一理涵萬事恭和御製登四靣雲山亭子作歌元韻于敏中四山環合雲深處繚白縈青泊然遇笠亭螺徑凌嶕嶢吟朗煙霄若神助層雲蕩胸西復東卑之列岫羅窗中逸情遠出陶謝上活色恍與倪黃逢閬風嶈嶈俯塵世聚米周知八鴻事居髙視遠覼縷呈臚列川原可數計秋山明嫿秋日懸黃雲鋪隴覘豐年腰鐮行刈霜信前擔歸囷鹿人頳肩恭和御製射元韻蔣溥節應騶虞樂備官九重神藝許齊看良遊詎數華林射至德真同矍相觀彀滿雕弧風力徑堋開豹的月光團共知聖武超前古朱鷺聲傳萬象歡前題劉綸簽名行殿引材官御射先容列侍看法祖天弓神所授序賢臣鵠德為觀骹飛簉羽穿長埒的暈聯珠破小團按部蕃王能入彀賜衣鞠􅎽奉宸歡恭和御製瀑源元韻劉統勳靈源通地􅍺懸瀑穿天孔曲徑落㟏岈危磴圍穹嵸雨晴沫濺𥚑秋入雲飛隴披榛若搴幃刈蔓如開籠魚逰力上溯鳥過影倒覂崕張一𣲖垂峽隘千條攏空手照皛皛皓氣浮滃滃資深詎待濬奔湊知難壅此中澒洞含其下波濤洶皓魄滿欲流素奩寒不動象為石甕注周作嶽蓮聳根極四溟會鑿謝五丁勇萬古玉膏流半夜神光湧前題于敏中懸洪瀉曾青噴薄泯罅孔萌柢坱無垠天瓢㪺穹嵸權輿導江沱濫觴溯岷隴織路奧復峭潛廅翳若籠近瓜見疏窐寥霅然始發覂沓訝湯釡沸漉詫竹篘攏線澑巗腳穿匹練雲根滃遊潗既以泄黝鯈不得壅驥渴欻驫𩣊雷輥殷訇洶突窔蕩相摩緘紐靜即動毖惟蹇滻欱激或崷崒聳氣毋所胚凝拗勢如養勇天倪闢鴻濛言泉萬𣲖湧欽定熱河志卷一百十二
