禮可無三接酬誠素況復萬幾當務間未習朝儀曕北闕許隨典屬祝南山嘉賔旨酒同和樂仁祖懷柔想像間山莊啓蹕木蘭行圍之作山莊行慶攬衢歌寶月團圞莭並過搜狩九秋應在即棲遲草日覺無何輕嵐别岫雲封戶細雨遙源水漲波更有豫心欣慰處石田仍獲勝常禾宴蒙古諸王公瑞雲卿擁拂廬穹詐馬筵陳許貢𠂻典屬威儀五等列本朝恩數一家同屏藩各守無踰志敦朴羣欣有古風咨爾嘉賔思乃業自綿帶礪福無窮木蘭回蹕駐避暑山莊之作瀟灑山莊憩轡宜塞搜小别未逾時風前落葉蕭蕭下霜後飛泉瀲瀲垂湘筆每因幾暇點藝帷還趁午暄披山靈為我重渲染萬嶂丹青態越竒從容偏愛一忩暉菊有黃花映座馡收拾雲山還淡泊啓資思慮入精微鹿聲招侣臨髙呌鴈羽知寒背北飛打疊行幐詩就帙好因攸吉駕言歸入古北口曲折盤塞山長城遙在目昨記古長城傳名自我獨今秋木蘭行圍悉所謂古長城者為之作説地險本邱陵詎事逺舂築徒資後人議那勝前人躅搜狩返翠華深秋轉暄淑納稼圃積黃連村樹餘緑未盡熙老幼豈免勞臣僕入關誦古語愔愔式金玉十七年七月丁丑上奉皇太后啓蹕巡幸塞外已卯降旨蠲免所過地方額賦十分之三庚辰出古北口命賞盛京吉林黑龍江學習隨圍人員縀匹其兵丁各賞一月錢糧癸未至熱河行宫八月甲午御如意洲賜扈從王公大臣等宴戊戌御萬樹園賜扈從王公大臣蒙古王公台吉等宴庚子御如意洲復賜扈從王公大臣蒙古王公台吉等宴辛丑上萬夀聖莭詣皇太后行宫行禮御淡泊敬誠殿扈從王公文武大臣官員及蒙古王公台吉等行慶賀禮上奉皇太后於卷阿勝境侍膳賜王公大臣蒙古王公台吉等宴甲辰上行圍木蘭奉皇太后自熱河起行壬子駐蹕準烏拉岱蒙古王公等恭進御宴丙辰駐蹕默爾根烏里雅蘇台上奉皇太后閲馬戲九月辛酉駐蹕布祜圖賜扈從王公大臣蒙古王公台吉等宴丙寅重陽莭上詣皇太后行殿侍膳賜扈從王公大臣蒙古王公台吉等宴駐蹕阿貴圖庚午回熱河行宫癸酉上奉皇太后自熱河回鑾丙子入古北口已卯上奉皇太后回圓明園御製詩癸酉秋搜木蘭啓蹕之作秋是較搜天平明啓翠旃東朝常奉豫武烈每繩先背斂西山霧遙澄北嶺煙沿途看寶穡興會益軒然駐蹕避暑山莊作山館延緣駐翠旌每來偏值素秋清宜人山色看無厭入晝溪聲聽有情間染丹楓出緑樹全教蛩語代蟬鳴今年鹿信虞遲却兩日權停便擬行山莊啓蹕之作較獵乘時正􅏮秋巖關爽氣拂旌斿晴開塞囿千峰近雨挽山莊一日留野水拍橋沙漲落晚禾積圃石田收無遺地力繁生齒為此欣然為此憂木蘭回蹕駐避暑山莊作木蘭秋獮薄言旋山館重教此憩延菊有黃華幽傍砌桂餘金粟馥噴筵隔林麋哨聲遲鹿鹿哨早而麋哨遲山莊內所有皆麋木蘭乃鹿寫棟雲飛影亂煙往返停留頻屬詠箋揮壁勒自年年無幾何時往返周山容紫翠鬪深秋風吹落葉如聞雨潦盡寒潭逺見洲點綴間雲晴晦幻依遲别館性情投去時匆遽鳴征轡攬結今應數日留十八年八月戊戌上奉皇太后啓蹕巡幸塞外己亥降旨蠲免所過地方額賦十分之三辛丑出古北口甲辰至熱河行宫丁未上行圍木蘭奉皇太后自熱河啓行九月癸丑朔駐蹕穆壘喀喇沁昻阿賜蒙古王公台吉等宴辛酉重陽節上詣皇太后行殿侍膳賜扈從王公大臣蒙古王公台吉等宴是日駐蹕巴顔溝癸酉回熱河行宫甲戌御如意洲賜扈從王公大臣等宴丁丑復賜扈從王公大臣等宴庚辰上奉皇太后自熱河回鑾十月癸未入古北口丙戌上奉皇太后回圓明園欽定熱河志卷十五
