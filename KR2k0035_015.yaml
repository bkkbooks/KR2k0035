body:
  text: 欽定四庫全書欽定熱河志卷十五巡典三御製詩辛酉三秋時序萬寳告成命駕出口廵狩遵祖制也經過州縣百姓扶老携㓜歡呼爽路閭閻之間户有葢藏埸多􅕗穗深愜朕志爰下詔蠲免田租以示嘉惠元元之意武備由來重時巡意更深當秋排法駕預日足甘霖旭耀旌旗影風𫝊鼓角音停鑾問農事獻曝見民心户有倉箱積人多樂豫吟輿惜猶似昔祖徳到於今觧澤心無吝紹庭志倍欽茲行當黽勉詎一為從禽至博羅河屯四十八旗諸䝉古王等來接天恩歌有嵗祖澤賴無窮巡狩三秋日趨承萬里風歡聲毳帳合佳氣幔城通來享同遐邇咸賔混外中誠輸陳厥篚燕賜詠敦弓永念覃敷慶懐柔倍惕𠂻賜䝉古諸王公等宴屏藩伊古重遐邇迄今同巡狩邉闗外趨陪禮法中恩胥叨列土親不異分桐三爵應須遍舟行實可崇詩猶歌湛露騷豈擅雄風永念恊和治乾乾倍省躬迴鑾盤逰有度慎三驅翠嶺蒼崖輦路紆指日榆闗迴蹕處重㸔秋壠緑添蘇入古北口羽葢駸駸度玉闗三秋巡狩薄言還愛㸔緑麥鋪平甸漫憶黄羊遍塞山出塞雜詠用上平聲韻雕輿繡羽颯金風曉發都城旭影紅十部簫韶翻似海三千車騎氣如虹邉關峯色翠芙蓉萬古隄防笑祖龍守徳由來勝守險金湯禮義是提封静夜離宫月在牕獨裁章奏灺金釭鴈鳴逺浦𫝊霜信人過孤村引吠厖塞上峯巒萬景竒笳聲傍晩譜涼伊玉臺疊進琉璃酒氊屋周懸虎豹皮極北山髙近紫微片雲常作雪霏霏黄羊白鹿鋪平野好試今秋苐一圍龍沙八月似冬初獻賦長楊滿屬車最愛楓林新似染折來題句手親書警蹕何勞健騎趍㑹同中外豈伊殊王庭圍合春風滿幔屋筵開湛露濡漫道陳倉獲碧雞天狼一色萬頭齊蒲萄釀酒燕支色不數江南數北鞮鐡騎畨兒鴈字排霜鋒掌様浄磨揩新豐空有如澠酒辜負當年白鼻騧日射髙峯紫霧開驂驔羽騎蔽山來鸞旗影颺雲林外清蹕聲聲北狩迴平明雨洗屬車塵蹀躞驊騮稱意馴濯濯烟鬟看黛重萋萋麥壠愛青新塞上山髙截片雲常㸔晴雨半峰分三千色日熊羆士十二天閑驥騄羣青兕黄牛滿澤原欣㸔天餉助歸轅戍兒夜半吹羗笛此日春風度玉門當年勝事紀呼韓從獵争如各部攅羊酪馬酮都獻賣旋收歸轡别興安時巡詎止閱邉闗喜見年豐一解顔摇颺翠華佳氣滿都中争道六龍還乾隆六年七月戊子上奉皇太后啟蹕巡幸塞外己丑奉諭㫖朕初次行圍所有經過州縣前經屢降諭㫖不令絲毫擾累但安營除道未免有資民力著將該地方本年應徴額賦酌量蠲免統計十分之三以昭朕體恤閭閻之至意壬辰出古北口八月乙未駐蹕喀喇河屯丁酉上以邊糈𦂳要時值米價平減特命發帑購買貯熱河古北口等處以裕軍儲戊戌上行圍未蘭奉皇太后自喀喇河屯啓行己亥駐蹕博羅河屯䝉古諸王公等恭迎聖駕乙巳上萬夀聖節詣皇太后行殿行禮御行殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮賜王公大臣䝉古王公台吉等宴駐蹕凖烏拉岱九月乙丑駕迴至熱河行宫庚午上奉皇太后自熱河逥鑾辛未重陽節上奉皇太后於喀喇河屯行宫逍遥樓登髙乙亥入古北口壬午上奉皇太后迴圓明園御製詩癸亥七月初八日因往盛京叩謁祖陵恭奉皇太后始發圓明園作虞采綏旌次第排金風凑爽滿天佳王途于邁髙秋浄帳殿承歡愛日諧望裏闗東多王氣行經塞北暢清懐緜緜寳穡秋成近觸撥吾悰詎有涯出口山自穹窿水自潺扼吭朔塞此雄闗當年萬里朱殷地巡狩三秋數往還至博羅河屯䝉古四十八旗諸王公等來迎時巡經葆塞肆覲集逰藩莊子願逰其藩此言逰牧之藩也願入千牛衛欣㸔萬馬屯充庭誠納悃錫宴許歡言念此詒謀逺長懐列祖恩賜䝉古諸王公等宴穹窿幔屋塞烟浮賔客從容禮法脩魚麗徴詩欣既醉兕觥開宴詠其觩却教此日懐維翰不比當年畏脱甌告我後人勤纘續祖宗徳澤敢忘不樂奏名王起進觴晶陽髙映赭帷黄酪酥為酒當秋得牛馬輸芹以谷量三爵尚賢奚側弁四侯觀徳鄙穿楊列朝政教周寰海況是宗姻受澤長八年七月戊子上奉皇太后啓蹕詣盛京恭謁三陵取道熱河奉諭㫖朕奉皇太后前徃盛京㳟謁祖陵經過州縣不令絲毫擾累但安營除道未免有資民力朕心軫念著直𨽻總督髙斌奉天府尹霍備查明各該地方本年錢糧應徴數目請㫖蠲免以昭朕體恤閭閻之至意壬辰出古北口癸巳駐蹕常山峪賜密雲縣脩橋官員人等飯食銀幣有差乙未至熱河行宫己亥上行圍木蘭奉皇太后自熱河啓行庚子駐蹕博羅河屯䝉古諸王公等恭迎聖駕丁未上奉皇太后自木蘭啓行由諸䝉古地方恭詣盛京駐蹕庫哩葉圖塔拉敖漢郡王等恭進御宴庚戍駐蹕哈達和碩土黙特貝子等恭進御宴八月壬子駐蹕必疏台䝉古諸王公等恭進御宴辛酉駐蹕齊爾伯庫癸亥上萬夀聖節詣皇太后行殿行禮御行殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮賜王公大臣䝉古王公台吉等宴乙丑中秋節上詣皇太后行殿侍膳駐蹕烏塔圖科爾沁親王等恭進御宴嗣後九月癸夘迴鑾駕至入盛京十月辛亥自盛京丑山海闗十月甲戌上奉皇太后自盛京廻宫御製詩乙丑出古北口棲山駕海帶秦遼拓抱中原迴近霄此日無煩誇地險當年見説控天驕金甌詎恃一丸固玉燭恒慚六幕調来徃巡農兼閲武萬年家法仰神堯車駕至博羅河屯肆覲四十八旗並喀爾喀青海諸䝉古得詩八韻爽籟揚華斿前驅駐外郵迺田依古重肆覲以時修文母慈暉奉仁皇家法留日中張羽葢道左迓氊裘久矣皆歸化于焉盡仰流詎予恩有逮嘉爾職誠酬扈從馳千旅逶迤擁六虯來同思祖澤長此朂懐柔賜䝉古王公等宴異域為天府來賔届月氐是嵗青海諸王公幷來繡郊千帳合駐野六龍齊坂卉蒸霞爛山雲傍澗低地髙隣北極恩下逮東鞮錫宴晴暉皜徴詩湛露凄娱觀陳角觗獻技習駒踶月令注拘繋騰躍之駒防踶齧蒙古則執駒以施鞍轡令㓜童騎之任其踶齧然後駒得馴而成良馬常獻此戲以助宴樂之觀俗所云騎打馯者也三爵斯頒矣千秋胥樂兮貽謀懐祖徳天若敬常稽十年七月壬辰上奉皇太后啓蹕巡幸塞外奉諭㫖乾隆八年朕恭謁祖陵經過之州縣蠲免錢粮十分之三今年直𨽻地方間有雨澤未能霑足之處前已降㫖緩徴此次出口行圍所有經過地方不令絲毫擾累但安營除道未免有資民力著將近京一帯及宣府等處車駕經由之州縣本年應徴額賦蠲十分之四並宣諭官民等知之又奉諭㫖朕向來巡幸所過地方𣲖員嚴查隨從官兵人等不許躁踐農田滋擾百姓此次啓行之時正值秋成在望禾稼尚未登場誠恐約束不嚴以致踐踏禾黍有妨農務著都統䕶軍統領多𣲖官兵沿途察㸔嚴加鈐轄其隨從官員兵丁亦令將家人跟役自行管束如有不遵禁令傷及田禾者即行查叅乙未出古北口上以熱河米價未平命撥二溝地方米數千石運徃平糶戊戍至熱河行宫八月癸卯上行圍木蘭奉皇太后自熱河啓行甲辰駐蹕博羅河屯䝉古諸王公等恭迎聖駕乙巳駐蹕張三營命以密雲古北口運到漕米及喀喇河屯㕔四旗㕔倉粟酌撥平糶兵民貧無力者借給己酉駐蹕凖烏拉岱賜䝉古王公台吉等宴庚戍行圍殪虎辛亥駐蹕都木逹烏拉岱賜䝉古王公台吉等宴壬子上萬壽聖節詣皇太后行殿行禮御行殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮賜王公大臣蒙古王公台吉等宴甲寅駐蹕巴顔溝乙卯賜扈從王公大臣䝉古王公台吉等宴乙丑駕自庫爾齊勒巡幸多倫諾爾九月壬午入張家口甲午上奉皇太后迴圓明園御製詩丁卯秋日恭奉皇太后巡行塞外曉發圓明園即景成什拂曙行旌發金天凑好晴有風皆遞爽無露不晞明野水溪邊退塞山馬上迎大安欣奉處觸目慶西成塞堞倚層巒遥遥雲際㸔整輜塵净路䇿馬潦收灘纓犬思馳足韝鷹欲奮翰時巡古有制詎是重逰盤三時勤望嵗歴覽夙憂舒黄已禾堆圃青還菜繞廬花邊蜨引轡樹底鳥窺閭得句催賡韻鄒枚在屬車長空莽霽烟栁外聴鳴鞭秋色真佳矣農功庶慰焉風清人意適川濶騎行連閱塞兼修武仁皇丕烈𫝊出古北口繆尋遺蹟問燕秦埤堄棲荆雉堞堙不信匃奴號驕子端知嬴政是癡人懋遷已見閭閻富勤樸還蘄俗尚淳百嵗熈和經外戸黔黎欣奉屬車塵賜宴諸外藩豹尾龍旌駐塞陲穹窿帷幕慶雲披底將外視稱甌脫即㸔來賔逮月支千禩永遵清制度中朝間去聲用漢威儀挏官三爵何須限正是秋髙湛露時中秋日侍皇太后宴野曠髙秋淨天空素月光漢懸蟾閣影風送桂輪香露宇宵方永帷宫夕未凉南山應有約隔嵗一稱觴塞外行圍問嵗舉行率值中秋節令云木蘭迴圍駐蹕避暑山莊山容紫翠劇增憐迎面西風大獮旋别館重來纔隔月六驄此去動經年荷如憶夏泛新豓樹不言涼以意傅迴首朔雲稠叠處射鴻應在那層邉秋深潦水盡寒塘鳬雁乗波下幾行翠管誰教翻楚曲疏眉雅解易唐粧楓排列嶂欺霜緑菊先重陽冒雨黄即景試吟親切句每因代謝悟真常重九日侍皇太后宴樹杪雲標地鴻賔鹿侣天巖齋臨繡野村景蕩朝烟節以題糕設盃因獻壽傳山靈應忭喜重見菊花筵進古北口鳴梢旋度玉闗雄秋老林巖颯颯風回首龍庭程已杳前瞻畿甸氣方葱屏藩北界金湯壯來徃南朝玉帛通樓櫓堞垣須整飭由來設險重王公侵晨䇿馬尚行霜闗内暄妍逈異常似寄丹楓塞以外便逄緑栁嶺之陽題糕數日纔過節納稼千村已滌場何幸今年如舊嵗長官須計有餘藏十二年七月戊申上奉皇太后啟蹕巡幸塞外辛亥出古北口乙卯至熱河行宫戊午賜䝉古王公等宴八月庚申御無暑清凉賜扈從王公大臣等宴辛酉上行圍木蘭奉皇太后自熱河啟行壬戌駐蹕博羅河屯䝉古諸王公等恭迎聖駕戊辰駐蹕凖烏拉岱賜䝉古王公台吉等宴辛未上萬夀聖莭詣皇太后行殿行禮御行殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮賜王公大臣䝉古王公台吉等宴駐蹕布爾哈蘓台癸酉中秋莭上詣皇太后行殿侍膳賜扈從王公大臣䝉古王公台吉等宴駐蹕巴顔溝九月戊子朔駐蹕白虎溝降㫖蠲免所過地方額賦十分之三庚寅駐蹕博羅河屯賜䝉古王公台吉等宴壬辰迴熱河行宫丙申重陽節上奉皇太后幸錘峰落照登髙侍膳賜扈從王公大臣等宴丁酉奉皇太后自熱河迴鑾辛丑八古北口丙午奉皇太后迴宫御製詩己巳塞上行圍奉皇太后啟駕載覽西成有象即景秋曉成吟七襄雲物九秋清是日七夕莭正值朝来湊快晴頻歲巡遊奉慈輦乗時蒐狩發行旌千畦香撲黄雲徧列嶂屏拖碧靄横邀得壽康賜言笑勝常年看好西成駐蹕避暑山莊因成近體六韻較獵臨藩塞行秋駐御莊軒庭懸聖日巖壑蔚龍光思示諸兒法臨御以來是嵗始携諸皇子扈從欣承文母慶沿途看寳穡勝地息雲驤五字吟新句千言詠舊章舊作山莊百韻詩書於壁間觸縁皆可樂何事轉神傷延薫山館召太學士傅恒史貽直及内翰侍御諸臣賜膳賦詩輙成首倡雨後晨清齊景開山莊相共賞靈臺智仁樂在山兮水賡詠才看鄒與枚巖下仙泉鳴舜樂庭間温樹識堯培舊時侍從今元老鳩杖中朝未扈來如大學士張廷玉來保今皆以年髙在朝辦理政務不扈駕來此矣䝉古王公等進宴因賦六韻玉磧開嘉宴穹廬覆慶雲輸誠因素切獻曝亦堪欣上壽尊王母傾心奉大君酪酥為湛露䍲牸作香芹勇闘撲跤戲雄看詐馬羣懐柔仰祖烈巡狩勉時勤萬夀節賜宴王公藩王及廷臣因成近體晴光蕩漾瑞烟浮介夀龍堆勝十洲白雪調歌白雪塞預日㣲雪鹿鳴詩賦鹿鳴秋侍臣