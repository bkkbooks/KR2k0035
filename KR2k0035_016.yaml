body:
  text: 欽定四庫全書欽定熱河志卷十六巡典四御製詩甲戌恭奉皇太后啓蹕幸避暑山莊之作有序溯豐鎬發祥之地靈萃萬年憶椒薌躬薦之秋星周一紀載瞻祖烈祗謁丹邱爰諏日至之上旬適度天中之令節敬扶安輦暫駐山莊時則準噶爾部策凌策凌烏巴什等率衆來歸迎鑾肆覲用即卷阿之勝境錫兹湛露之鴻儀逮夫候屆金􅒫乃復時巡東國禮因事舉詩以日增啓蹕初程命篇伊始追逺柔遐慶典覃天中卜吉啓行驂東巡五載兹惟倍前以乾隆癸亥至盛京閲今十年餘矣西極四夷彼剩三凖夷四部曰準噶爾曰都爾伯特曰和碩特曰輝特策凌等則都爾伯特部也計里方欣日正永清塵喜值雨霑甘山莊避暑今年信家法欽承敢即耽出口雜詠詰旦鳴鞭趁曉涼白雲逺嶠復蒼茫黍禾已勃寧晴好自哂吾懷曷有常塞田每看好秋成緑茂彌岡已慰情暗卜有收疑信半大都期望忌其盈萬峰濃濯翠芙蕖南北隄防慨想餘今日玉關為外户年年巡狩奉安輿輕雲不雨風含爽迤邐山行那覺塵自是玉驄黃繖蓋却欣䔩日惠多人巖關背指障崔嵬塞外嵐光直北開真是不征閭左富聖人深意示招徠沿邊諸口皆有稅惟古北口無皆康熙年間定制云駐蹕避暑山莊仁祖當年兹避暑今年避暑奉慈親敢圖逸豫忘深慮亦為去聲柔懷恤逺人勝地秋臨雖已屢好山夏景訝初新却思卅二年前事豫十二嵗時侍皇祖避暑於此今三十二年矣聖日依然照此身山莊燈夕錫宴聨句有序𬎼賔應律朱輅方陳遵祖制以行時奉安輿而避暑乃有員渠部長欵玉塞以來王因兹風土清嘉就仙莊而祗覲用大柔懷之義聿隆燕愷之恩萬樹園開合舊旅新賔而伸笑語三巡爵遍敘名藩渠帥以賦龍光喜因閏夏之餘涼復舉上元之往例雲屏風靜氷宇天寬百道虹流恍入恆春之界千枝錦燦同來不夜之城載集詞臣共揚盛事調變柏梁之舊近體聯賡鑣分石鼎之章七言遞奏御製西極來賔示寵章升平燈宴錫山莊欲因柔逺非誇富早識歸仁敢恃強嘉與朝正同燕衎快當避暑愜清涼詩吟樂愷周遐邇臣傅恆占合豐盈協雨暘萬樹芳園煙羃羃三霄佳夕露瀼瀼乍教貔虎陳仙仗臣陳世倌御製更幻魚龍集廣場望過東岡月猶朗節逾北至夜初長穹窿圓幕卿雲擁左右賔筵綺席張熠熠鶱鸞呈錦繡呦呦鳴鹿應笙簧蚖膏爛處明宫栁臣劉統勳鶴𦦨髙時出苑牆塔現玲瓏森寶網花敷頃刻燦螢囊玉蛾來往飛如織臣汪由敦御製銀蝶參差舞欲狂拔地虹流峯樹射殷天雷碾塞雲翔上元不夜渾今夜勝事無方洽四方素䨲擢毫團窟桂赤烏刷羽燭榑桑蓬山忽訝六鼇戴臣方觀承朱闕欣看五鳯蹡枝聳珊瑚搖碧海奩堆韎􅞘映朝陽星毬結字分還合臣介福御製氷鏡排輪低復昻熚烞聲中山答響輝煌影裏水翻光天開奇景龍沙創序借新年燕綵揚吐火吞刀爭獻伎尋橦履索列成行折腰引手盤旋架臣嵩夀急拍髙歌上下吭捷逞都盧紛雜沓樂陳僸昧震礌硠紅雲一片揚旌斾臣錢維城御製緑罽雙馳過驌驦翡翠翎垂文士帽時命尚書劉統勳協辦陜甘總督統勳乞翎因以賜之麒麟錦製外臣裳叵羅潼乳三巡遍甲煎沈檀百和香跋浪長鯨動鱗甲空掣電耀精芒錦棚未散靈絲會臣程景伊絳紙還烘樺燭裝重聽踏歌喧象板無煩競渡楫沙棠黃梅氣爽清文囿臣陳德華御製紅藕風多襲御床珠勒馬頒天廄秣蹴蔬羊出大官湘按陸遊詩有蹴蔬羊之句注謂有人常食菜忽食羊夢五臟神曰羊踏破菜園云云然國語及蒙古語凡驛程食物謂之舒蘇蹴疏音相近陸詩或訛用此注語反覺牽強傳柑一例同堂陛奉賮千羣共享王新舊籓邦都待從暖寒嵗令總庥祥團圞接坐依華幄臣王際華次苐呼名賜玉漿燕笑親聆天語近鴻篇宣示聖恩洋逰從瑶島歡何極臣張泰開御製禁放金吾漏未央長夏尚徴春有象寰瀛真見恱無疆欽承家法聨中外鞏固金甌奕葉慶七月五日東巡自避暑山莊啓蹕之作避暑居停逮曉秋朝來清蹕啓龍斿逺人宴賚鴻儀備炎月棲遲馬足休恰悟兹來即向往因思欲進每資留山田是處蔥華黍未敢先期道有收上陵誠藴十年餘皓日金風行色舒山館南看嶂猶近吉林東指路還紆每懷侯度咨休助常喜慈寧奉起居七萃率能知大義寧因跋涉怨咨豫蒙古諸王公進宴即席賦句隆崇圓幕據蘭坰將悃聨情自可聽遊牧爾安職斯述懷柔我厪化惟寧技呈詐馬鋪雲錦樽酌南山映座青文織精鏐頒後賚異他嵗幣享王庭冬至次日啓蹕再幸避暑山莊即事言懷有序粵惟今夏序屆天中當西渠來覲之辰適東國時巡之會爰臨仙館慰彼瞻依廣錫崇封沛豫膏澤繼而西藩部長歸誠而均籲來同時輝特台吉阿睦爾撤納等和碩特台吉班珠爾等均率其屬欵關內附時乃豐邑祖陵展謁而方勤逺駕念彼生於邊塞入都則痘症足虞因而再幸山莊頒賚而燕衎斯溥次惟三宿期匝一旬良由典重郊禋屆一陽之來復更以節逄慈慶祝萬夀之無疆兹惟時哉不遑暇處無非事者用示懷柔長句述情新篇紀事夙識羲經不省方和鸞却事幸山莊惟欽昨始禋穹昊必告朝還謁夀康澤逮新歸盡鳬藻勞因屢駕厪龍驤懷柔要豈耽遊豫戎索方疇永奠疆十九年五月甲申上奉皇太后啓蹕詣盛京恭謁三陵取道熱河乙酉降旨蠲免所過地方額賦十分之三丁亥出古北口庚寅至熱河行宫準噶爾都爾伯特台吉䇿陵等入覲凡各部落歸誠入覲一切封爵賜賚典禮祥見徠逺門甲午御萬樹園賜扈從王公大臣蒙古王公台吉及都爾伯特台吉等宴乙未復御萬樹園賜宴觀火戲凡四日己亥庚子復賜宴七月壬午上奉皇太后自熱河啓鑾前詣盛京丙戌駐蹕大寧城西辛卯駐蹕吉倫郭勒蒙古王公等恭進御宴賜扈從王公大臣蒙古王公台吉等宴嗣後八月甲寅駕至吉林九月丁亥鑾十駕至未盛京甲午自盛京回月丁入山海關十月丙辰上奉皇太后自盛京回宫十一月乙酉上啓蹕再幸熱河丙戌出古北口戊子至熱河行宫凖噶爾輝特台吉阿睦爾撤納和碩特吉台班珠爾都爾伯特台吉納默庫等入覲庚寅御萬樹園賜扈從王公大臣及凖噶爾台吉等宴凡預宴之王公大臣等各賜表裏有差乙未自熱河回鑾丙申入古北口戊戌上回圓明園御製詩乙亥恭奉皇太后幸塞外啓程之作西戎底定素節方臨將宴凱旋之師亦賜新歸以爵載塗者有需時日乘暇而先舉獮搜覲謁便以木蘭燕衎仍於山館匪效上林之為周阹繁重爰示我朝之度振古如斯用志言懷無非事者皓日金風發蹕旌武成愷樂愜輿情分茅有待均頒惠櫜矢方將大會盟萬里伊犁朝北極三秋多稼閲西成安輿可識增欣豫福夀駢臻算介瀛出古北口霽景嶙峋朗曉山古來控北數上聲雄關常修塞獮三秋過早見巖楓一樹殷埤堄幾重就頽廢工商萬室輳鄽闤於今惟厪懷柔偹外户伊犁詎此間駐蹕避暑山莊作中外而今果一家止戈奉朔邁流沙兩臨先是曾施惠去嵗都爾伯特台吉策凌等來歸以五月宴於山莊比輝特台吉阿睦爾撒納等繼至十一月再至山莊錫宴大賚兹畨永定遐雲館桂芳秋正半山田黍熟嵗云嘉勤民繼武願俱愜惟日孜孜敬益加熱河啓蹕幸木蘭之作數日山莊慶典循木蘭時屆鹿甡甡白露後鹿始出聲而鳴人肖其聲可呼而至國語曰木蘭今即為圍場之通稱矣櫜鞬早候一千騎蒙古備圍例以一千二百舉成數云村落都看三百囷向北添衣涼益峭自西馳牘喜猶頻新降衆台吉將至哈薩克近亦冇遣使歸化之信今年秋獮增佳話曰有條枝執靮人諸宰桑有命為侍衛供役者木蘭回蹕駐避暑山莊三首背指木蘭山迢遙清蹕還祈農誠有慶勤政本無間疊樹留紅錦孤峯削翠鬟雲容浮動處得句率其間偶寄林泉賞休言松菊存含飴切深憶繼武識前言山靜心逾淡秋長氣尚溫明朝開麗正山莊前宫門名新附遍加恩雲色避空宇秋聲冷澗泉飛鴻下沙渚鳴鹿隔林煙何必惜花栁端宜親簡編慈闈常侍奉松鶴祝延年山莊內名曰皇太后所御宫松鶴齋熱河啓蹕還京之作巖館雲莊旬月稽順時行慶每折折新徠舊附霑恩遍後舞前歌振旅齊列巘詩情寄餘興小春鞭影促歸蹄僕人單冷還堪厪野渡驅車有凍澌入古北口曦影小春明雄關返蹕旌蒼山漸縹眇緑樹尚逢迎閭左誠云庶巖巔已遍耕嚲鞭非問景民務動縈情二十年八月丁未上奉皇太后啓蹕巡幸塞外戊申降旨蠲免所過地方額賦十分之三庚戌出古北口壬子至熱河行宫癸丑上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王台吉等宴甲寅上萬夀聖節詣皇太后行古行禮御淡泊敬誠殿扈從王公文武大臣官員及蒙古王公台等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉等宴凡三日丁巳上行圍木蘭奉皇太后自熱河啓行九月壬申朔駐蹕英圖昻阿賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯甲戌駐蹕扎克丹鄂佛囉凖噶爾綽羅斯台吉噶爾藏多爾濟輝特台吉巴雅爾和碩特台吉沙克都爾曼濟等入覲已卯駐蹕張三營賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯庚辰重陽節上詣皇太后行殿侍膳駐蹕博羅河屯壬午回熱河行宫癸未上侍皇太后膳賜扈從王公大臣蒙古王公台吉及凖噶爾台吉等宴甲申復賜宴御萬樹園賜觀火戲凡三日己丑復賜宴凡四日乙未凖噶爾和碩持台吉色布騰等入覲上侍皇太后膳賜扈從王公大臣蒙古王公台吉及凖噶爾台吉等宴凡二日丁酉御萬樹園賜宴觀火戲十月辛丑朔上侍皇太后膳賜扈從王公大臣蒙古王公台吉及準噶爾台吉等宴凡五日丙午復御萬樹園賜宴觀火戲丁未復御萬樹園賜宴是日皇太后賜策訥穆庫妻等宴戊申上奉皇太后自熱河回鑾辛亥入古北口甲寅上奉皇太后回宫御製詩丙子秋日奉皇太后幸口外行圍啓蹕之作膝下常承愛日歡不暄節復不嚴寒山山海海增遐算嵗嵗年年奉大安逺近黃雲馬首逄西成定矣慰良農三時望念一時副始覺東來喜氣濃夏書曾是戒禽荒秋獮春搜典更詳肄武寧邊具深意萬年家法仰仁皇出古北口詠古夜雨朝晴候襟燕帶塞關遼哉綿萬里壯矣據千山豈復藩籬固誰知肘腋間鬼工猶覺費民力信其艱此日滋耕鑿行秋每往還不隨今古變一片嶺雲間至避暑山莊即事巖莊松塢行行到水石煙花在在仙月宇真稱離俗地雲窗雅喜讀書筵試聲秋鹿曾何謂弄影春駒有底緣嘉宴年來多惠逺翻愁渴望凱音旋熱河啓蹕之作大獮乘秋貴及時朝來清蹕啓雲逵一天霽景浮輕爽幾曲寒流溯逺涯龍塞風光看迤邐雞翹儀衛發葳㽔仙莊漫惜餘吟興歸轡尋題詎是遲九日侍皇太后宴並賜內外王公諸臣食即席得句氣霽興安景廓澄南山映座祝如陵羊頒儘有銼炊土糕飾何須旗翦綾節喜延齡欽孝飬宇恢廣漠惕靈承重陽自古傳佳話龍塞登高信孰曾木蘭回圍駐蹕避暑山莊翠罕逶迤大獮旋仙莊駐賜逺人筵三秋山景欣逄閏踰月林光稍異前菊有黃華迎籟馥楓多丹葉綴霜鮮問豫餘興曾何是千里雲峰阿那邊二十一年八月癸丑上奉皇太后啓蹕巡幸塞外降旨蠲免所過地方額賦十分之三乙卯出古北口戊午至熱河行宫庚申上行圍木蘭奉皇太后自熱河啓行壬戌駐蹕張三營都爾伯特台吉伯什阿噶什等入覲賜扈從王公大臣蒙古王公台吉及都爾伯特台吉等宴九月庚午行圍臺殪虎駐蹕墨爾根烏里精蘇台辛未蒙古諸王公等恭進御宴上奉皇太后閲馬戲癸酉行圍殪虎駐蹕鄂爾楚克哈達甲戌重陽節上詣皇太后行殿侍膳賜扈從王公大臣蒙古王公台吉及都爾伯特台吉等宴丁丑駐蹕按巴鳩和洛土爾扈特使臣吹扎卜等入覲賜扈從王公大臣蒙古王公台吉及都爾伯特台吉土爾扈特使臣等並隨圍兵丁等飯戊寅行圍殪虎駐蹕額勒蘇錫納庚辰行圍殪虎駐蹕庫爾圖察罕博爾齊爾丁亥駐蹕張三營賜蒙古王公台吉及都爾伯特台吉土爾扈特使臣等並隨圍兵丁等飯庚寅回熱河行宫閏九月丙申朔御萬樹園賜扈從王公大臣蒙古王公台吉及都爾伯特台吉土爾扈特使臣等宴丁酉上奉皇太后于卷阿勝境侍膳復賜扈從王公大臣蒙古王公台吉及都爾伯特吉台土爾扈特使臣等宴凡三日庚子御萬樹園賜宴觀火戲凡二日戊申上奉皇太后自熱河回鑾辛亥入古北口甲寅上奉皇太后回宫御製詩丁丑秋日奉皇太后幸塞外啓蹕之作潤塵夜雨聽深更啓蹕旋看放午晴最嘉晚田滋玉粒恰宜新爽應金行誠輸屬國咸來覲每嵗行圍木蘭四十九旗蒙古及喀爾喀例來謁因以行慶施惠澤浹大宛初受盟去嵗我師至哈薩克本為追我逋逃並非有害於彼故今嵗即遣使來降將至山莊宴賚敬奉安輿行慶典歡承慈夀祝山瀛出古北口秋獮嵗常經巖壑悉曲折臨洮及瀛海一帶如睂列廢興懷千古守德可無設即今乃外户何用增築缺關外夏報旱赤地愁龜裂為之祈甘霖雖霑恐過節按轡兹厯覽殊與所慮别山巔固稀種種亦多夭札稍下及谷中芃芃原穗結十分則已失仍可望七八所以市鄽間米價原一轍前途則未知詎可即怡悅至避暑山莊得句山莊臨上塞皇祖具深猷最是承恩處敢忘繼志謀諸藩羣入覲蘇對逺來投蘇對沙那即大宛見史記待至將行慶貽庥庶少酬八月十六日熱河啓蹕木蘭行圍之作山莊節過桂花筵哨鹿期臨八月天爰以及時發警蹕底須好逸戀林泉虞旌獵騎行招引舊屬新歸相後先更待貴山使者至大搜嘉與惠威宣重陽日張三營行宫賜蒙古王公及行圍人宴並金幣有差詩以記事罷圍依例犒筵加施惠兼因答嵗華耐可行宫逢九日雅宜應節見黃花朱提分賜一千騎一千二百獵騎舉成數耳文騎均頒􅕊九家俗所謂四十九家王子者也蘇對何妨頻令預是日哈薩克使者亦預宴由來澤欲不遺遐木蘭回蹕至山莊作羽騎駸駸出哨歸山莊秋杪靄清睴寒魚怯與回波漾野鳥紛隨落葉飛籌政奚曾間宵旰柔遐惟是驗從違幾間更復饒何事理詠頻因悟化機熱河啓蹕還京即事習武柔遐以次行驂驔六御啓歸程雲莊慢自留清戀麥坂旋因閲宿耕駝􅕫每嫌野渡冷馬臕還趂暖曦晴觀光率可從人願宛使何妨携入京哈薩克使臣求隨蹕至京師許之二十二年七月戊申上奉皇太后啓蹕巡幸塞外降旨蠲免所過地方額賦十分之三辛亥出古北口癸丑至熱河行宫八月辛未上奉皇太后于卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉等宴壬申上萬夀聖節詣皇太后行宫行禮御淡泊敬誠殿扈從王公文武大臣官員及蒙古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉等宴凡三日乙亥上行圍木蘭奉皇太后自熱河啓行九月庚寅朔行圍殪虎駐蹕博羅莫林賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯甲午駐蹕布祜圖左部哈薩克使臣根扎噶喇等入覲賜扈從王公大臣及哈薩克使臣等宴乙未駐蹕按巴鳩蒙古諸王公等恭進御宴閲馬戲戊戌重陽節上詣皇太后行殿侍膳賜蒙古王公台吉及哈薩克使臣等並隨圍兵丁等飯賜隨圍蒙古王公以下銀幣有差駐蹕張三營辛丑回熱河行宫壬寅上侍皇太后膳賜扈從王公大臣蒙古王公台吉及哈薩克使臣等宴癸卯御萬樹園賜宴觀火戲及健鋭營兵立馬技甲辰復御萬樹園賜宴觀火戲乙巳御卷阿勝境賜宴是日上奉皇太后自熱河回鑾戊申入古北口辛亥上奉皇太后回圓明園欽定熱河志卷十六
