body:
  text: 欽定四庫全書欽定熱河志卷三天章三御製詩示七弟及諸皇子己巳汝曹讀書久茲命隨時巡詎云事嬉逰吾意良有因祖制不可忘勉繼在後人汝觀此稼穡勤哉勞萬民汝觀彼部落何以來相親乘馬汝安逸僕役殊苦辛深宫汝豐裕蔀屋多窶貧見獵可悟學射鹿應懷仁潔矩汝其蘉大旨斯略陳即景洞房雲館皆依舊前嵗今朝頓不同我是逭愁來此地近作早桂詩有塞逰兼擬逭神傷之句翻教即景惹憂忡中元夕放燈煙光露色早秋天望夕氷輪滿意圓例事盂蘭傳梵唄便看朔塞放燈船照巖霞錦驚眠鹿貼浦雲葩綴敗蓮千古詩人吟不盡湖山風月總無邉山中雨景山莊駐蹕逢秋雨淨滌餘炎益晚禾行旅何曽愁且怨農夫祗覺舞而歌朵雲剛見吐遙峰雨不崇朝膏澤濃好待晴明詠新景萬山濯出紫芙蓉點經塞樹聲偏壯籟度山樓氣忽寒却為空濛宜縱目添衣還倚石闌干鹿避濕依深樹立魚喁漚傍碧荷浮金官權被山靈擅幻得新秋似杪秋題蔣溥寫生即用其韻露玉風金塞景清秋花待客發幽榮拈來迦葉不禁笑問去嵇含無定名細朵含颸銀麝艷斜枝映水錦粧明師承家法間圖出溥父廷錫向曽扈仍舊駕塞外圖山花以進是圖稿也右相丹青有後生張若澄塞山欲雨小幅西嶺吐雲東嶂合薈兮才間復滃然從知墨戲傳王洽意在空濛作雨前雨後雨後泉聲壯風前樹態狂洗空萬里碧變候一畨涼谷靄凝朝潤秋花散晚香向來無此景始快宿心償偶成低樹以為帷髙樹以為幕山鳥不驚人選枝山果落即事雲裏峰姿開錦繡風間松籟韻笙簧乍當日午微嫌熱便忘清晨尚怯涼野水無心東復西間雲不繫髙忽低蹊花露滿知蛩樂岩柏月明遲鶴栖窗間坐愛峰迎面樹下間來鹿乳見羽客若求不老法應於此處劚靈芝波光不讓琉璃淨嵐翠常如帷幄浮數日幽探清興足明朝去賞塞垣秋曉行二首背指雲莊碧巘標輕寒微遞素秋朝兩山抱谷行十里一水縈流渡草稿常喜村墟聞犬吠不教父老訝雞翹精藍猶在翠微裏只許鐘聲林外飄漩澓回環白石磷蒼蒼露芷更煙蘋源頭自是新過雨渡口旋看暴漲津通野望中全入畫問程行處那生塵所欣髙下豐收定才得茅簷鮮歎貧涼昨夜西風力一夜更氣候衾枕已覺寒晨起山颸驟䇿馬歷蘭衢露光白如玖叶華黍被山田西成實云富乍思日可愛胡尚隔東岫出谷朱鳥騰仍此婪暑晝塞垣無定莭妙理得時狩咨彼羲和氏何以副敬授䇿馬䇿馬山椒復水限玉鞭斜軃不須催灌園村叟籬邉接獻鹿虞人林外來黍秀奄觀髙翼翼蕎花重喜白皚皚常年此處秋成好一倍秋成見此回山中村數家茅屋亦稱村六畜兼宜乳字蕃樺木髙排成虎落豆花斜蔓隔羝樊揀田隨意墾山上避賦成羣到塞中縱是漏巵聽亦得丈量底更命司空塞上秋羣山糾紛水抱環水如玉白山霞殷豈是東王公幻戲由來商令司金官椒風蘿露將鳴鹿重著棉衣意不足吳江楓冷已太遲巫峽秋髙較應恧颯景偏覺稱人心特是林泉效靜深三十日佳看易過塞上行圍以三十日為率草首詩成未入吟舊作生秋詩草首未曾及塞上云秋晚巖嵐谷籟清秋晚西舂半隱雲標巘旌門射罷適餘間帷宫何必遜林苑窗虛几淨堪逍遙燈明千幕無喧囂年年武帳渾如舊憮然忽念前春朝我是逭愁逰塞上近作有塞遊兼擬逭神傷之句翻教即景生恨悵嶤峰偏解惹人愁火迫丹楓纈遠嶂止頓止頓宣傳休獵騎紙窗贏得曉秋間封章昨日剛批閲無事今朝飽看山夜雨連明霏細絲因教停憩衆情宜乍分忽合雲容幻低升髙峰畢獻竒氊廬布帳繞營開須傍山限避水隈泥濘莫愁供億缺牛車伊軋趂墟來霧氣離披欲放晴山容紫翠又新更侍臣試問枚臯侣今日清詩幾首成間塞雨因成旃室間豈惟容膝亦怡顔面山臨水如􅉨者落葉秋風復此間愁入舊懷遮莫遣詩成結習未全刪誰云艮止真能止試看雲中幻黛鬟晴塞雨滋秋野金風助快晴翠巒新沐濯紅日越晶明草色猶含馥溪流乍咽聲底須慮泥滑牧法馬蹄輕牧法者牧得其法也凡馬春忌水秋忌草馳驅之後必繫至深夜汗落而後飼焉則馬益壯而無蹉跌之虞此之謂得法山中山中秋日勝春日木葉微脫精神出更餘淺緑與深紅拂以涼颷衆響逸滃然吐雲萬態幻詩不能工畫停筆待圍澤地時憩留撫松藉草坐石頭子陵垂釣景宗獵各適其適心悠悠我遜重華希有志木石與居鹿豕遊文嘉疏花冷蕊小幅用畫間題者韻四首野草間花遍谷香誰教冷蘂綻旃堂當秋乍看氷心白破臘全欺磬口黃右文嘉塞山那有藐姑姿携得行幐軟玉肌消暇不教開牖看恐防朔吹十分吹右周光小金山閣俯灤江曾貌疏花入月窗近于喀剌河屯行宫小金山閣中曾畫寒梅一枝並成詩云興來點筆開生面宛見氷姿窗外斜今日真梅端在目翻嗤布鼓不成腔右王稚登花常不落蘂常開笑我無能引緑杯有子停雲真未往無妻和靖儼重來右居節八月朔日作金􅒫臨仲月玉衡指星虛曠谷武帳間單椒商籟噓怡神向神邱敕幾凛幾餘西成近逺嘉平秩懷差舒而胡黯然傷往往悲來豫前嵗景目中排遣仍紛如霜向北日以寒逐漸添衣裳朝來履中庭地白霏輕霜巖楓益纈丹甸草將變黃呦鹿已爭鳴虞人喜欲狂塞外姑聽之遲早異時光春秋記殺菽內地為災傷聞京師西成豐稔喜而有作今年春夏秋三時時雨時㿩無不宜近自畿輔遠滇粵麥收普稔秋堪期新秋發駕臨塞外奄觀銍乂猶待而意謂晴雨協一月千倉萬箱穫無疑果如所望出望外而况塞外尤倍之江淮之間微苦潦百分一二才毫釐惟恐向隅深望澤先事撫恤命所司京兆露章奏豐稔欣觀詎止飫已飢歉為天責豐天佑此實我職奚容辭作詩匪云誇亨豫任重道遠紓遐思閲本綸閣封函驛騎馳豈因遊獵怠疇咨心殷籲俊其難矣政在養民每念之所幸題章鮮速議各省奏報災傷皆批該部速議此雖舊例實寓勤民之義為逢秋稔適惟時深虞豐豫渝乾惕思日孜孜勉敬寅秋宇秋宇本寥廓塞旻益曠間雲斂蔚藍迥清光皓日懸崇邱欲倚杵髙處不勝寒遐晞一騁懷偨池俯衆巔案衍舞波濤瀏蒞非絲絃可會不可著無色聲界天移頓六韻逐水頻移頓止頓必擇水草之地以便衆也曽無草里賒以行圍每日移營不過十餘里建營今似昨取勢正還斜壘或多因舊凡木蘭內止頓處率因其舊竈無須更加亦冇尋舊竈而炊者賣蒸原有市換馬要增茶人以所騎瘦馬換蒙古肥馬再加以茶布之類即可得內外奚分界休和久一家朝程回首望煙散滿林霞不廢不廢吟詩習字常欣跋馬登山身勞未始非逸心靜覺有餘間新月八月五日一鈎宛見生西宇十日猶遲正滿輪自是中秋勝常月未中月便有精神漢邉斜拂漾微明借助龍沙景色清林外窺人渾是舊誰能此際暫忘情雖寒不濕光盈手未滿將圓意逼人消得遲眠風露下目窮西嶺更逡巡煙火全無朗磧臺巖枝澗葉夜光皚絶塵佳景吟難盡可惜詩人鮮到來霞塞山易雨晴亦速金風西北吹林麓殢雲滿空去何方幾縷惟餘繞峰矗夕暉返照成落霞色雜丹楓紅䔩䔩翻壁何須待入江齊飛或見來孤鶩晶熒晃朗蒸赤城不火而逢陸渾谷張若澄關城疊嶂小景巖關白界列峰青乘障當年據勝形便是昨來經過處雲山回望意為停夕曠野暮雲收寒光黯欲流風如矜朔塞月已競中秋颯景供澄觀陳編契靜搜匪云誇博覽愛與古為謀雨塞雨剛逢止頓時氊廬點滴入清思暗迷逺嵪鹿呼侣斜掠平林鵲選枝無盡寒光偏對户幾多涼意忽侵帷迢遙南望關心處恰值秋深種麥期雪山靈幻戲能剪水展新雪景又如此雪景從來我最耽何况塞山清無比塞山幾度舊曾來玉粧粉飾逢今回樊川詩與營邱畫未若真界天然開丹楓翠柏偨池露嫦娥耐冷守顧兔司天妙算此間窮却待新晴吟積素晴新晴虎帳暢吟看積素龍堆果大觀朱鳥已烘一谷暖玉山猶勒兩峰寒更添喬柏千尋翠未改疏楓幾葉丹今日成詩真可和何殊六出點朝冠旃室拈題憶保陽興飛白戰韻鏗鏘丙寅十月自五臺回蹕于保陽道中遇雪倣蘇軾聚星堂體凡四疊原韻云試看畢獻山靈技莫怨新添旅客涼入畫無舟休訪戴烹茶有婢底慙羊千林日上開生面白玉屏蒸紫翠光疊前嵗中秋帖子韻并令扈駕翰林等和之有序向以中秋佳莭適近萬夀慶辰桂筵繼介祉傳觴綵服猶延禧具飾歡騰中外對佳夕而賡祝嘏鴻詞時際熙和巡朔塞亦詠冝秋彩帖自去嵗遭安仁之感每登樓傷貞觀之懷况乎大安奉處顧瞻缺侍几良逑值兹令莭相於俯仰憶脫簮舊侣斯誠戚矣能不愀然然而虛擲良宵抑亦難抒夙恨是以名言戒其一往梵帙喻以六如興盡悲來固其數也悲過興繼又復宜之維時玉宇開金風霽則見鵷行虎拜環幔城而呼九如於以雁磧龍沙望蟾宫而臨十五屬車扈蹕粵有騁妍抽祕之儔大漠矢音宛成弄月吟風之地例依前嵗句各新裁評量今昔值清間萬慮誰能一例刪囑付中秋玉輪月照豫千載塞垣山無滓精神不濕光澄觀只合一罏香繁絃急管從來厭底藉名言疏讀匡帖子宜秋我作師每教塞景艷新詩昨來積素溶金液新沐秋蟾出玉池髙處為居便是樓今年雁磧不孤秋東山凹處錘峰畔倣佛嫦娥笑點頭中秋即景磧風拂拂夜光流滿意氷輪見舉頭此際素娥應耐冷今年玉塞又信平聲秋無須對景翻思舊不必臨池更倚樓極大圓中圓魄度何曾痕迹著些留暖積雪皚隂磴暖氣蒸陽巘霏微細雨零倐忽朝霧卷金烏晃楓林生色畫屏展重裘欲換棉豈是朱明轉山中候無定和仲詎能辨隨時愛景光此間興不淺塞中即景風清月白仲秋天問景龍堆漫嚲鞭碧宇泬寥雁書字蒼巖㠍嶫鹿呼煙山隂雪凍山陽雨谷尾溪喧谷口泉日日意行頻得句霜林真比曉春妍崇邱作鎮鬱壇曼萬派千支勢拱攢碧澗似鞶圍嶺腹白雲為斾裊槍竿試看秋景如春景端是木蘭勝上蘭一月行程詩遞詠嘉陵粉本不殊看塞山夕景哨鹿宜曉夕復宜虞人技懩無不為平岡獵罷合夕哨我亦因而姑聽之下㫪荏苒落西嶺疏星寥亮天四陲丹楓翠柏纈遠嶂忽隱繁縟惟參差須臾參差復全隱萬化冥合心神怡遠瞻燎火指歸路曲尋淺水渡野溪偶然一試古人語佳景乍得聊成詩雨塞雨又逢止頓日山靈有意示神竒設非親見誰能信告未曾來人定疑前朝霏雪今朝雨塞上寒暄曉暮殊贏得間情摹杜老底將經世問堯夫打幕頻聽淅瀝聲石漸月離驗輿情猶欣供億隨營足菆井山墟列布棚添些紅樹明晨景展却新圖此際間秋獮將完促歸轡留看塞上米家山山村按轡度山村富秋觀次苐往來一月間五穀已登備棲畝有餘糧納圃無隙地山田租賦薄茅屋俯仰遂此心慰始定額手洪鈞賜伊余有後思古今人殊致耕九而餘三既富教斯繼是道豈非要行之貴無事茍其不得人匪愛乃實害叶莫如令蚩蚩各自為生計所願錫屢豐何虞民不治屢豐豈可必孜孜勉祈嵗覽熱河井邑之盛知皇祖煦嫗之深即目九秋斷章三首萬家煙火較前增今則皇祖詩云聚民至萬家不止於萬儼成大邑矣井邑紛填有賣蒸可識聖人𢎞愛育山莊小試有明徴避賦避災離里閈熱河本無土著率山東山西之民遷移來者然總不出此二事墾原墾隰藝桑麻慙無為養因無禁遷移而來者豈非惰民然內地户口日增今有塞外可墾之地則亦聽之而已故不事丈量督察也中外由來久一家蚩眩喧聞列肆聲髙樓縱目玉旻清有秋市物翻增價近利人言却至情此間惟米價最平而他物無不增價者詢之市人則云隔嵗來巡吾儕趂此獲利此雖無厭之談而實人情所有山中杪秋煙雲朝暮變紫翠槲楓兼籟動風滿谷波澄月一奩景深素秋杪興寄碧峰尖無盡藏真界取之豈礙廉間窗日影上書室足清光誰謂山林內而無翰墨香藝編堪汲古菊莭待重陽入畫相應處千峰罨一房暖皮衣脫却換棉衣塞外秋暄見所稀真對黃花堪落帽坐看紅葉稱搴幃人家煙火催時暖煙火多則地因以暖熱河向為寒地今則頗似關中矣沙漠風霜限地違幽贊洪罏誰復識神虞當日協璿璣夜雨春霖慮或少秋霖慮或多惟有杪秋時多少無不宜叶萬寶既告成冬麥恰始播叶山莊茲駐蹕夜雨占天和亷纎窗外聲庭樹想婆娑更無愁漸石此景實可歌伊余較雨暘年來熟研摩特喜杪秋雨供賞無虞他勤民家法貽祈嵗理則那追惟當日心此際應如何曉起間雲數片當晨散落葉一庭比昨添涉獵詩書覽秋景山莊隨意足清恬曉起庭樹烏聲出曙窠披衣試問夜如何挈壺已報晨星少擁帚誰嫌落葉多繞户山嵐輕送冷入窗池影漸增波報章未至心餘暇拈得清詩一晌哦晴辛未秋山易雨亦易晴金風奏爽天宇晶此時消盡間籌度禾􅎟香中旅騎行山月效韋應物體向暝羣山隂入夜諸籟靜惟有清秋月徘徊弄寒影寒影入我懷我懷與月佳天容既澄廓露氣滋芳荄相望有餘意何異遊蓬萊山雨山雨霏空送嫩涼煙絲極目益蒼茫中元眀日傳停蹕漸石長途諒不妨溪流溪流勃雨後雨止流亦止勦襲為學者奚以異乎此中元日放河燈碧空雲散夜清妍解讓秋蟾初度圓雅合山莊陳節物較贏江國閙燈船千枝朗徹巖邉樹萬朵輝交火裏蓮漏下松齋歸靜憩依稀颯景似前年涼塞野度行旃新涼馬首前近山嵐氣峭拂草露華鮮催穀登場候報人宜獵天欲詢民疾苦村墅且停鞭山雨一片秋雲吐萬絲山雨縈塞垣經已慣立馬待天晴曉月曉月清可憐塞天益寥朗上下泉箔明隱映林扉敞遙峰似玉臺古鏡大于掌勒馬據崇椒聊結廣寒想讀書張廬萬山裏展卷一窗下是中有深味玩輒不忍罷博覽謝彼能體認肯自借匪誇乙夜勤值此清秋暇繡壁夏山薈蔚冬山稿惟有秋山稱恰好恰好秋山孰擅勝塞上峰巒出類表案衍神局姑弗云壁立萬仭凌參昴霜降不遲還不早茈虒枝葉渲葩藻紺黃纁絳間青翠天工設色非人巧益之盤桓食蘋鹿雜以絃管啅林鳥朝嵐夕靄呈變幻千態萬狀難窮討解衣磅礴恧關生過雲錦繡工杜老似是山靈有宿約每起子思於金皓沈德進南巡詩章並所和詩至冉疊舊韻賜之塞山七月似三春朅詠賡章意倍親恰好清秋此氊室又逢南國彼詩人功稱德頌曾何益吏習民艱要並陳節相老來還喜事為卿特地答筒筠德居鄉每命督撫代進奏摺詩章是萹適髙斌代為奏至木蘭行營故云忽憶勾吳清麗春底須南北較疏親重吟迎蹕萹中句似有捉刀牀畔人南巡諸作原難為工德老矣亦不必以是為工所進三十章似出代作因深知德潛手筆故戲及之百二十章心窟藴所和詩百二十六章則皆德所作非他人所能到甲乙丙夜案頭陳靈巖阿那青楓坂問爾孤登可藉筠霜白點霜華增曉寒翠峰幻出許多丹機緘妙趣當前悟繪事原應素後看即事即事摛詞亦可歡發清機不礙秋寒無塵雅似江南美有地惟應塞北寬紅纈翠扶壁萬仞沙縈石絡澗千盤儻教借得西湖水處處吳山足大觀新月魄彩吐寒空中秋月未中塞光偏覺異恆質迥難同結念香聞桂遊睎影揚楓玉臺髙倚鏡奩帕半猶蒙暖出哨剛逢暖木蘭哨鹿之區或即謂之哨地云皮衣易絮裳穀場歌嵗稔菜圃慶秋長村景觀無盡豫懷慰莫量浙東方告歉南望為去聲民傷張宗蒼山水畫避暑山莊題句驛使傳來山水圖山莊著壁作清娛蒼蒼寫出遊神趣往往逢於跋馬途石罅泉聲動亦靜雲涯峰色有還無不難結撰成溪壑誰解如斯味道腴疊中秋帖子詞韻命翰苑諸臣和之秋中令節從來歌咏之場塞外靈臺自昔豫遊之地此時此處寧可漠然載倡載酬堪云暢爾遂令廣寒法曲音連三十年前肯教翰苑鴻詞格遜四朝詩後萬家煙火隨民便而無改堯模千畝山田報嵗豐而有愈任顧雕瓜繪餅塞垣節物增佳抹月吟風山莊慶宵莫負底須五字輕嗤宋玉老兵仍叶七言可效韓偓內翰莫嫌頻韻聊紀一時風月湖山卅載間今朝歌舞不宜刪姮娥也似添豪興早上璇霄映碧山最滿氷輪異樣光巖楓皆作桂枝香髙低樓閣湖贏聖上下淪漣瀑學匡鄒枚扈從集師師便合賡吟帖子詩翰苑從來紀佳話鳳毛還在鳳凰池依巘軒齋近水樓此間不易值中秋他年試覓新題句應在千峰最上頭中秋即事慶月真宜避暑莊樓臺髙下朗寒光一輪久照輝蓬閬億載如恆祝夀康不遣絮雲翳空宇早扶蟾魄上東岡野潭瀲灧金波湧何必平湖更憶杭野店野店居安忘寄寓塞外居民多齊晉各省流寓者貧民生計自為謀漫詢公賦如何納且喜山田薄有收虎落編柴防夜徑魚梁疊石截寒流稔秋村景方生慰轉念南邦又益愁雨壬申塞雨灑蕭秋繁聲入夜稠輕寒來覺驟婪熱避如流蕎菜皆資潤豆禾未畢收怦怦縈遠念畿內得霑不涼一嶂巖牆能爾為颯然涼氣馬前披由來不藉秋官令直欲輕移造物時野水渡人心為怯曉煙食店目因遲生衣雨日更綿絮境與情遷乍可思八月朔日作夜雨釀晨寒午暄柏秋熟山莊駐清蹕遼待玉輪足將于此度中秋始進木蘭問政勵憂勤劭農常度卜關內近優霑僅及資菜菽夏中希大有此志實欲速孤望得小稔略可濟惸獨惸獨難遍濟如傷此焉恧霧坌入嵐煙忽滿庭騁眸乍失遠山青濛濛衣濕非飄雨惟覺巖花發野馨新月中秋初度月近塞此回看恰好生銀漢依然映玉欄入懷真是潔盈手不妨寒詎肯孤佳景留攀桂樹團暄農父有常諺秋長喜倍深雲頻霜避菜日燥暖依林未可拋紈扇何妨濯峽琴山中足清暇無斁協時心疊中秋帖子詞韻仍命翰苑諸臣和之有序湖山有竒遇亦待其人風月無盡藏恰當今日若夫龍堆雁磧南方曩視為畏途而茲御苑仙莊翰林羣稱云佛國樂樂利利敢忘經始文王語語言言載奉無疆夀母峰姿波態都覺秋清寶月慶霄適如人意徴詞選律勝彼眺蟾望鵠之為錫爵頒饔惟是合樂聨情之舉蓋經五作仍續四章倚樹吳剛不耐間繁柯取次著修刪數枝恰向仙莊落便覺天香滿塞山端正輪規朗潔光桂宵無物不含香緑杯銀管休孤負簷際徐移輾漢匡恩科萬夀試京師倜儻伊誰玉局詩且共從臣賡綵帖好看磧魄徹滄池徘徊真是倚瓊樓風物今宵繼昨秋法曲梨園渾厭閙王簫水調按歌頭中秋夕玉塞廣寒宫人間逈不同近天惟直北出海便升東盈手光堪掬入懷情自通輕雲如解事故與作朦朧涼靈山能轉候嵐氣送晨涼楓染通紅葉露凝騰白霜獵人欣逐獸農叟慶登場别有宜詩景遙峰繢紫黃風微風亦覺豪直北氣偏髙裂葉千峰露吹林萬竅號雲頭斂隂翳水面􅐈波濤蓬草曽無礙飛揚任爾曹山村即景蘭衢侵曉點繁霜馬上羊裘尚覺涼日出旋烘一谷暖黃綿襖子遍田莊築場納稼先去聲豳風南北寒暄協紀中多是晉齊流寓客安居朔塞故鄉同刀耕火種遍良農不讓楓榆占碧峰誰道石田率荒鹵年年頗覺有秋逢連延東崦復西鄰遮莫桃源此隱淪三十年前曽過者却云初祗數家人意行意行初不較涼炎馬上成詩信口占薄霧卷空開岫障微風拂澗揭泉簾霜華怯日融融減繢葉隨程旋旋添北望木蘭秋獮近起豫興在遠山尖霧塞山幻戲何爾竒白棉彌谷乾闥移履髙若低隱乍現障近成遠東疑西城郭臺觀舉倣佛蜃樓海市非人為或如王母降玉輦或如木公駐葆旗張公五里裴三里鷽鳩何異榆枋枝日中氛鬱倐歸岫千巖萬嶺明偨池旋覺皮衣著體暖塞山霧後必晴而暖生風耳後花驄馳偏伍彌縫有莭制曾無一騎隍中迷南人行船北人馬有能不能難強其肩輿得得來翰苑蔣溥汪由敦皆南人不習騎以肩輿從故戲及之縱觀卒愕相嗟咨爾亦何必相嗟咨為吾走筆為新詩雨靈境蒸雲易為霖亦太竒又逢洗山雨正是罷圍時谷漲羊腸水林湔鶴頂枝氊廬開牖坐何必道催詩覽本口號報豐為喜報災愁愁喜無常似轉流只有愛民些子志寸田千載惻然留曉月猶是中秋月應教日日憐四更東壁上半魄白榆邉鴈過蘆鋪水鹿鳴楓護煙清遊達明發塞景愛霜天即事田車古之制宵雅宣尼采但以施之今原獸孰容待設復遇山嶺銜橛且致殆豈昔儦俟羣不奔復不駭格物有所窮此理殊難解王良羞詭遇邱陵多弗為守正何必強當恐人莫知宋襄惜二毛傷股其奚辭夏候論樂毅迂回難通宜枉道莫從彼正理日月垂無權乃賊義差謬爭毫釐盡信不如無孟子自言之讀史記隨筆有序遷史始自黃帝類皆網羅舊聞其世職卓才則備見於漢興以來諸紀載所謂千秋良史信無愧焉壬申秋獮塞上率以寅往哨鹿及晡罷圍虎帳幾餘輒快讀終卷因掇漢君臣事迹關于治亂者紀之他不復及略分世代隨得即書不為詮次云葉定關中治已周山河帶礪建諸劉小嫌何足傷親誼櫟釜翻為羔頡侯指示功人第一宜所嘉更在舉宗隨鄼候劍履登朝日可憶鮑生進䇿時善罵無妨仍好士一時割愛重鬚眉恢宏大度有如此豈係留候計出竒借箸前籌才數語漢家基業鞏千年趣銷趣刻如兒戲從善端知老轉圜販繒屠狗自嬰樊附驥恩流逮子孫托拾成編端委具却因他廣備為言三議堂堂建宋昌大橫吉兆應重光文休景養培元氣何異周家成與康五利文成疊受封公孫才見大人蹤惟應駕海神鞭石一節還教讓祖龍故衣獨步越丰姿俯泣低頭恨可知尹亦自饒真藻鑑禇先生論更堪思田竇相傾勢利關灌夫引重為居間却因杯酒媒深禍首鼠轅駒盡腆顔數竒受誡部書催豈大將軍特忌猜責簿刎身人盡惜殺降應悔有由來鈎弋雲陽遇暴風娥姁肇禍實無窮少孫漫許為賢聖豈是千秋定論公一文一質變相生陳粟相因露積贏黷武求仙平凖創炎劉治亂此分明九月朔日作玉塞冝秋山金􅒫屆季月窪稜丹漸稀寥迥藍益蔚霞標蕩光幻峰尖時出沒菊節應指日何必黃花發登髙於此佳逸興已先勃霜花塞草著霜花迷離入望賒幻堪參富貴詩更憶蒹葭火迫鹿鳴野寒傳雁落沙結珠憑少女蕭寂轉紛華塞山雲海歌我曾澄海樓頭望溟渤髣佛蓬萊方丈銀宫闕又曽吳山之側觀潮來似神而非者三真幻哉方意天一之靈無並比乃今塞山重見此世間何事不有偶造物安能外斯理秋旻星斗歷落懸䇿騎曉陟崇岡巔萬山足底才分色須臾兜羅綿現疑湧波浪相連延乍合乍散掎五嶽何竒何怪吸百川章亥盧敖詎極屆豐隆巫女方昻軒鞠陵朱鳥為弭節陽城神石無須鞭於焉遊詄蕩之皓氣駕方廣之石船探萬斛鮫人之珠搴十丈玉井之蓮信壯哉其樂志笑癡矣而求仙詩成將以寄德潛為詢黃山畢竟何如焉沈德有黃山雲海詩新月中秋西去又生西依舊秋光銀漢低待滿輪規爭數日擬摶鏡影乏長梯山髙月小情真到樹直煙橫望欲迷試想嫦娥經浩劫幾回循轉可容稽習字氊室就窗暉經箋趁手揮力應嗤木強妍復戒豐肥消此清間晏澄來繹思微曾聞得爭道聊亦悟行圍九日重陽會有百回遭攬勝崇山創且豪自是開天此度節恰成隨地可登髙設筵詎必茰簪帽陟巘剛欣楓點袍斜日射熊歸帳殿便因餘興一揮毫村行塞外人煙集寒威漸不侵天地之氣自南而北口外嚴寒之地今以人煙輻輳率較前為暖云秋深林尚茂俗厚誼能任穫畢農無事畋餘鹿罷尋連村見髙廪稍足慰吾心咏鏡行幄供清鑑依人片月空塞山還越水些子不留中山店山店零星不成村防虎縛落聊植援徙薪曲突取室溫是中聚首長兒孫蓬頭垢面蔽短禈懸瓜積茭家計論大都流寓內地民山田無賦賴安身安得廣厦吾心存堯舜猶病復何言即目月似軒轅鑑山如玉鏡臺足寄千秋興何須計往來欽