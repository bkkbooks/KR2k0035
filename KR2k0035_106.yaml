  text: 欽定四庫全書欽定熱河志卷一百六
  hash: sha256:05da0ac853ae1edbdc0598c61f21d8a66bb1b8d93aa86ea4aa82fea0c4fd1234
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0035_WYG_106-1a, image: WYG0496/WYG0496-0625a.png}
body:
  text: 外記四明按前卷敘次及唐其遼金元三朝本境已為內地故不録録明代烏梁海諸酋之𨽻於本地者以為外記之終焉烏梁海按大寧故烏梁海地也元為大寧路明永樂改北平行都司為大寧都司徙保定而以大寧故地卑三衛𨽻今境者諾音舊作朵顔今改正泰寧三衛其福餘衛不居境內故不敘録托爾楚舊作脫兒火察又作脫兒察又作脫魯忽察兒今改正哈拉固岱舊作哈兒兀歹今改正葉向髙諾音三衛考洪武二十一年故元宗室遼王阿拉實哩舊作阿里失禮今改正及諾音諸酋內附詔立三衛自全寧扺喜峰近宣府為諾音衛以托爾楚為指揮同知明史諾音傳永樂元年使指揮蕭尚都齎敕諭明年夏頭目托爾楚等隨尚都來朝貢馬命托爾楚為左軍都督府都督僉事哈爾固岱為都督指揮同知掌諾音衛事賜誥印冠帶及白金沙幣襲衣明太宗實録永樂元年十一月丙子烏梁海頭目哈拉固岱遣其部屬托郭斯舊作脫忽今改正等來朝貢馬命禮部賜幣襲衣並賞馬直十一年十一月諾音衛都督僉事托爾楚遣人貢馬命禮部遣指揮多爾濟舊作孟秃歌今改正等賫金帛往賜之默爾格舊作孟秃歌今改正明太宗實録永樂三年冬十月乙丑命來朝韃靼頭目默德格等為諾音衛副千戶賜冠帶襲衣並銀沙綵幣有差都哩圖舊作都兒秃今改正明太宗實録永樂五月正月癸亥諾音衛指揮都哩圖等率所部頭目諾木衮特木舊作奴溫塔木今改正等來朝貢馬賜鈔幣有差噶布拉舊作斡不兒今改正明太宗實録永樂十五年又十一月乙亥諾音衛頭目噶布拉等來朝貢馬賜鈔有差哲辰舊作者赤今改正阿爾庫哩舊作阿兒苦哩今改正明宣宗實録宣德元年冬十月乙酉賜諾音衛指揮僉事哲辰泰寧衛指揮僉事阿爾庫哩等綵幣表裏襲衣靴襪有差烏塔舊作兀台今改正旺孔圖舊作宅者禿今改正實都爾岱舊作失秃兒朵今改正鼐爾巴哈舊作乃兒不花今改正圖罕舊作禿干今改正和爾實舊作火兒失今改正巴罕舊作保罕今改正納延特穆爾舊作乃顔帖木兒今改正卓郭勒台舊作扎忽魯台今改正庫爾舊作古里今改正明宣宗實録十一月己未諾音衛故指揮僉事烏塔子旺扎圖實都爾岱子鼐爾巴哈圖罕子和爾實巴罕之孫納延特穆爾故千戶卓郭勒台子庫爾等十六人阿實克特穆爾舊作阿失帖木兒今改正明宣宗實録宣德二年十二月丁巳諾音等衛指揮僉事阿實克特爾等來朝貢馬旺扎勒特穆爾舊作完者鐵木兒今改正明宣宗實録宣德四年三月諾音等衛頭目旺扎勒特穆爾等來朝貢馬七年十二月癸卯以諾音衛指揮僉事旺扎勒特穆爾屬遣人朝貢賜敕奬諭併賜金織文綺綵絹哈喇哈斯舊作哈喇哈孫今改正明史諾音傳宣宗七年秋以諾音頭目哈喇哈斯恭事朝廷久加賜金綵幣表裏有差恩楚舊作安出今改正明宣宗實録宣德七年七月戊午遣賜諾音衛都督指揮僉事恩楚等成格勒舊作逞吉兒今改正明宣宗實録宣德七年十一月丙子諾音等衛指揮僉事成格勒等來朝貢馬十二月戊子賜諾音衛指揮僉事成格勤等鈔綵幣絹布有差布達拉和克舊作不哈兒花斡今改正明宣宗實録宣德八年二月辛卯諾音等衛指揮布達拉和克遣千戶巴爾貢馬及方物癸卯賜諾音等衛千戶巴爾等鈔綵幣絹布衣金織紆絲襲衣有差多羅干舊作朵羅干今改正明宣宗實録宣德八年秋七月乙亥諾音衛都督僉事托爾楚卒其子多羅干遣人進馬且請襲職遂命多羅干為都督指揮同知升都指揮僉事哈喇哈斯亦為都督指揮同知明英宗實録天順三年三月甲辰升諾音衛都督同知多羅干為右都督哈瑪爾台舊作哈瑪歹今改正明宣宗實録宣德九年六月甲寅諾音衛指揮哈瑪爾台等七人來朝且奏邊事賜鈔綵幣表裏金織襲衣有差巴延特穆爾舊作伯顔帖木兒今改正托克托沁舊作脫脫赤今改正多羅特穆爾舊作朵羅帖木兒今改正珠爾噶岱舊作只兒瓦歹今改正迪錦舊作倒斤今改正達蘭特穆爾舊作朵蘭帖木兒今改正章圖舊作宅秃今改正伯特舊作伯台今改正綽爾齊舊作拙秃今改正呼喇呼舊作忽烈谷今改正特穆爾舊作帖木兒今改正博羅舊作索羅今改正烏蘭阿古舊作兀剌阿互今改正竒爾岱舊作曲列歹今改正鼐爾巴哈舊作納兒不花今改正噶爾薩舊作歌里子今改正永和爾舊作容乞兒今改正阿勒楚爾岱舊作安出兀歹今改正巴海舊作把愛今改正威台舊作委塔今改正固哩勒舊作苦列兒今改正董實哩舊作董失里今改正多羅圖舊作朵羅禿今改正蒙克圖舊作忙歌禿今改正努圖克巴哈舊作奴塔不花今改正賞都阿果穆爾舊作阿古蠻今改正鼐爾章舊作能列占今改正阿勒哈舊作阿魯花今改正徹辰圖舊作扯扯禿人作扯扯土今改正實哩舊作失來今改正格爾根舊作歌魯歌今改正托克托巴哈舊作脫脫不花今改正哈喇塔拉舊作哈剌哈兒今改正察實舊作擦實今改正格哷克舊作歌羅該今改正鄂拉齊舊作阿倫赤今改正訥克林舊作揑可來今改正迦凌巴舊作赤蘭伯今改正巴爾台舊作卜台今改正古裕舊作歸均今改正阿爾齊默克舊作阿兒乞今改正穆爾岱舊作卯打今改正布濟克舊作卜齊今改正烏遜特穆爾舊作兀孫帖木兒今改正呼圖哩舊作歡娛兒今改正恩克特木爾舊作俺克帖木兒今改正多和圖舊作忽秃今改正穆爾薩舊作迷兒咱今改正誇喇哈舊作苦郎哈今改正托克托舊作脫脫今改正伯勒齊舊作李齊今改正伯勒舊作孛來今改正阿延特穆爾舊作奄顔帖木兒今改正呼蘭台舊作忽蘭台今改正伊楞烏舊作亦剌兀今改正哈齊哈舊作哈即哈今改正圖們德勒舊作土木得兒今改正都薩阿舊作土領阿今改正蒙克舊作猛可今改正枽阿舊作顔􅳜今改正伊克特穆爾舊作影克帖木兒今改正蒙克薩勒舊作猛克塞兒今改正托克托博羅舊作脫脫孛兒今改正克卜特特格舊作肯帖帖該今改正滿濟勤噶舊作滿滿劄該今改正按以上諸人並見明英宗憲宗實録皆以入貢來朝為名而隂合額森舊作也先今改正輩為邊患明綱不振甘受其愚耳因其事實略同故不贅述僅存其名如右特穆爾博羅舊作帖木兒孛羅今改正明孝宗實録宏治十六年正月己丑諾音衛指揮特穆博羅等來貢並賜紗縀衣服等物哈當舊作花當今改正巴爾斯舊作把兒孫今改正鄭曉吾學編正德初部落既蕃陽順隂逆纍肆侵盜諾音都督哈當求添貢其子巴爾斯深入虜掠烏梁海諾音為大部諾音哈當為貴種十年巴爾斯入馬蘭峪塞殺參將陳乾遣都督桂勇討之巴爾斯遣察克圖舊作扯托今改正等來言請入貢且獻馬贖殺乾罪未幾入寇參將魏祥全軍覆沒葉向髙諾音三衛考兵部尚書王瓊建議諭哈當必以巴爾斯償乾陳乾等先戰沒馬蘭峪乃罷兵許貢哈當言巴爾斯已逺遁請入馬贖殺乾罪瓊初持議堅後竟許哈當貢明史諾音傳哈當退去屯注紅羅山匿巴爾斯使其子達哈舊作打哈今改正等入朝請罪詔釋不問明史世宗實録嘉靖二年六月癸丑都給事中許復禮言頃諾音衛巴爾斯以逆回被虜人口守臣言其功因授巴爾斯千户臣竊聞巴爾斯往年殺害參將陳乾上未伏法而反加秩乞追奪之各守臣曲為陳情亦冝懲戒上曰巴爾斯待後有勞績奏來授職各邊鎮被虜逃回人守臣從實報若匿情罔上者罪之葉向髙諾音三衛考肅皇帝立都御史孟春言巴爾斯修貢謹又歸我人畜請豫一秩詔豫千户給事中許復禮謂不宜豫事乃格是時巴爾斯與小王子婚屢誘敵入冦都督馬永禦之頗有斬獲孟春復請毋惜一官以餌敵御史盧瓊疏罷之格爾博羅舊作革列孛羅今改正格爾台舊作革蘭台今改正鄭曉吾學編格爾台者哈當孫也哈當長子格爾博羅早死其弟巴爾斯驍勇屢謀奪適諸酋惡之不相附尋亦死哈當種人皆附格爾台格爾台遂入寇漁陽諸小關堡皆殘破嘉靖十一年九月巡撫王大用欲通諾音與厚賂城其霿靈山不果是時酋阿多哈喇齊舊作阿堆哈剌赤今改正數入建昌喜峰太平諸塞殺掠人畜格爾台又乞升官兵部言大用喜事請以毛伯溫代大用出漁陽巡撫十十年格爾台求添貢衛三百人不許請衛二百人又不許時時出沒塞下輒云結小王子旦夕大舉入塞會諳達舊作俺答今改正濟農舊作吉囊今改正自大同深入太原不得已許其補前貢失斯者衛二百人蒙克岱舊作猛可歹今改正明武宗實録正德八年十二月癸亥諾音衛差頭目蒙克岱等貢馬補賀萬夀聖節並賞綵幣等物實琳博羅舊作失林孛羅今改正明武宗實録正德十年閏四月戊寅命諾音衛所鎮撫實琳博羅襲祖職右都督伊克拜舊作影克卜今改正明世宗實録嘉靖八年十月丁丑諾音衛頭目伊克拜等貢馬補賀聖節賜宴賞給如例圖爾哈舊作土兒罕今改正明世宗實録嘉靖十六年十一月甲辰給賞諾音衛圖爾哈等綵縀表裏有差伊克舊作影克今改正葉向髙諾音三衛考嘉靖二十七年格爾台死子伊克襲三十八年巴爾爾舊作巴都兒今改正十萬騎挾諾音酋伊克哈該舊作哈兒今改正為鄉導潰墻深入明年伊克勾巴圖爾犯一片石遊擊郭琥敗之伯克舊作伯革今改正達哈舊作打哈今改正明史諾音傳當巴爾斯犯邊時詔削其職巴爾斯死其子伯克入貢嘉靖九年詔興伯克父爵而達哈自以哈當子不得職怒遂先後掠冷口擦崖喜峰間參將袁繼勳等失於防禦皆逮治按伯克襲父爵從巡撫順天僉都御史周期雍奏也明實録在嘉靖十年壬子此作九年者誤台達爾舊作歹答兒今改正明世宗實録嘉靖十三年十一月壬辰諾音三衛都督台建爾各差頭目雙和爾舊作可升合兒今改正等入賀冬至節宴賞如例巴爾斯哈喇舊作伯思哈兒今改正明世宗實録嘉靖三十五年六月癸卯諾音都指揮巴爾斯哈喇引間諜數人窺邊會守備詹承恩引兵出哨盡殺之綽滿舊作炒蠻今改正阿雅爾台舊作阿牙塔今改正多和舊作董灰今改正明世宗實録嘉靖四十年二月乙酉升諾音衛正千戶綽滿及頭目阿雅爾台俱為都指揮僉事頭目多和為正千户以進送人馬盔甲及報事有功也博羅舊作孛孛今改正明穆宗實録隆慶五年正月庚戌諾音衛博羅等補賀長至令節宴賞如例多和倫舊作董忽力今改正葉向髙諾音三衛考多和倫勾土蠻十萬人入寇勢甚猖獗折墻出至棒捶崖迷失道墜坑死無算是後督臣談倫總兵戚繼光協謀練兵增垣控制有方迄隆慶三衛奉職稍謹邊恃稍安按明諾音三衛即今哈喇沁地自永樂中以大寧地卑三衛始拓地至今承德府境其間不應有土蠻當屬土默特之訛今土默特左右翼二旗在朝陽縣舊塔子溝廳北境之東北境與喀喇沁接壞當時三衛聨結理或然也至棒捶崖今土人尚呼為棒捶山當即磬錘峰自古北口外道殊徑坦以本地人行熟路何至迷失且山不甚髙何至墜死無算皆緣中土昧于譯音傳聞失實以至紀載訛淆其不足慿類如此耳圖罕舊作通罕今改正明史諾音傳朵顔國罕者諳達子星哈舊作辛愛今改正妻父也嘉靖四十二年古北哨卒出關為諾音所撲殺俄圖罕叩關求賞副總兵吳鎮伏兵執之總督楊選將為牽制星哈計乃拘繫圖罕令其子更尖為質三衛恨甚遂導諳達入掠順義及三河昌昻舊作長昻今改正明史諾音傳萬厯初諾音昌昻益強挾賞不遂數紏衆入掠截諸畨貢道十二年秋復導土蠻以四千騎分掠三山三道溝錦州諸處守臣李松請急剿昌昂等朝議不從僅革其月賞于是昌昻益跋扈自恣擾諸邊十七年入寇又二年大掠獨石路二十二年復擁衆犯中後所攻入小屯臺明年潛入喜峰口二十九年納欵請復寧前木市許之三十四年昌昻死諸子稍長按明實録正統三年朵顔衛所屬哈拉該舊作哈喇該今改正衛指揮納克林舊作揑可來今改正等來朝欵有誤字哈拉該當是人名無此衛名姑闕之欽定熱河志卷一百六
