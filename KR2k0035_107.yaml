body:
  text: 欽定四庫全書欽定熱河志卷一百八藝文二本朝賦秋郊大獵賦梁詩正惟聖作都乃文乃武智勇天鍚逺邁前古道洽化淳覃敷下土繼志述事遹追皇祖𬗟惟謨烈之垂於鑠搜苗之舉乘農隙而詰戎兵厯周原而臨津圃時巡經五十餘年賔服暨四十八部匪徒樂乎從禽實以資乎講旅爾其寒蟲作語殘蟬咽鳴域中氣爽塞上秋清開廣野而百里聳疊嶂之千層露點山楓丹黃成幄潦收石澗清冽無聲草淺獸肥則儦儦而俟俟風高馬健斯龎龎而駉駉撫良辰之方屆應令典之時行天子乃簡爾卒徒卜焉允吉六師載陳萬乘以出旌幟飛掦騂騏走軼循一徑以逶迆喜百昌之茂實雄關瞻眺則馬上賦詩廣陌咨諏則林間駐蹕戒金吾之漫警無害田禾詔賦額之量蠲克知民恤遂乃縈紆沙磧攀陟巃嵸飈凌百谷露隱三嵏奮一人之神武擁千衛之羆熊左右賢王負弓弩者從公于邁渥窪名産效服襄者我駕既同行聮雁翅勢總鴻絧森鸛鵝陳之圖法嚴赤白羽之軍容綺霞耀色皎日臨空將赳桓于七萃訖聲教而四通則見夫野豕連羣黃羊彌陸雉兔星流麞麅波屬始則環林箐以成圍繼乃驟岡巒而爭逐任駭獸之馳奔臨至尊而懾伏惟時我皇佩烏號挾夏服澤射麋林即鹿蹂躪封豨捎接鸑鷟鷹逞攫拿盧供呼蹴風翎掣耳霜鋒睒目莽莽叢搖飛鳥頸縮看一發之威張仍三驅之澤渥受殪者流血朱殷逸圍者驚魂觳觫用循狩野之文藉供登爼之肉陋上林於漢武嗤七澤於周穆於是大綏罷抗上殺紛馱計鮮數獸甡甡孔多兩牡之從莫比三狐之獲奚過特賞聿酬乎虎旅餘恩兼逮夫鸞坡刀割火燔鱗次駢羅厥儀以備其禮則那此聖主載覲耿光非侈雄風之賦而從臣欣傳盛事欲賡吉日之歌者也夫聖烈克善繼繩大孝尤垂永久有事武功敬求文母黍禾低拂扶輦塍間幕殿高張問安門右升幔城而怡色笑既豫以康視御膳而進肥鮮維旨且有方閲秋中再經重九受琛有艾納之香介夀薦菊花之酒雖大漠其偶臨徴尊養之彌厚臣職司槖筆行效服裝數奉清塵於豹尾獲瞻偉績於龍驤力乏䇿鞭彌慙短馭才非作賦雅慕長楊不諳釋氏之經未嘗止殺曾讀相如之疏頗鑒垂堂竊綢繆於未雨願警戒乎作荒凛登危之明誡懷御朽之良方永為後式迪惟前光歌曰時搜畋兮奉祭祀戒不虞兮習戎矢考舊典兮禮經煥新猷兮天子仰丕烈之於昭兮奉慈顔之有喜涼風戒塗兮法駕北指雲罕兮輕移塞垣兮戾止羽林夾扈兮連鑣番部來同兮結軌大圍兮周環沿溪谷兮邐迤屹如山兮逝如水百獸匿兮深林裏月弓星炮兮惟君之使落飛鳶兮殪大兕法湯仁兮網乃弛大庖充兮娛慈寧旌門錫兮勞將士簡軍實兮柔逺邇苞桑永固兮千萬紀秋郊大獵賦以天人同澤上下交歡為韻冇序錢陳羣是嵗八月十日己酉上閲武行至凖烏拉代地方道右之圍既合車駕詣行宫有旨眀日駐蹕於此修道左圍及晨上乘馬出宫門從官之執事圍中者咸先期儲偫臣與大學士臣查郎阿等侍立門右仰瞻雲日霽色順時魚須之旗既導雕玉之輿既隨行未數里遣侍郎臣傅恆傳諭臣等綴筆為賦以紀斯典臣惟大閲載於春秋教田垂於月令周宣內修政事外攘夷翟復文武之境土會諸侯於東都以講武事其時詩人為之賦車攻賦吉日以書其美弧矢以來兹為近古後世子虛上林羽獵諸篇鋪陳過實君子譏之他若華林之舉非其時元武之局於其地庾信張説扯撏掦厲亦無取焉我皇上法祖勤民興仁興孝恩澤所覃沾溉庶類乃以安不忘危有偹無患四年冬舉大閲禮六年秋修大獵事八年幸盛京恭謁三陵蠲租賜赦進從官階一級中外震疊歌咏明盛今年七月下浣恭奉慈闈復修田事凡行圍所過之地皆聖祖當日三至五至之區塞農野老林立道旁得睹天顔無異為兒童時仰覿神堯也而畨部名王之率衆來迎者亦相望於途維時山川效靈風雨和會臣陳羣偹員禁近得隨輦路末行旃帳濡豪不文是恧謹拜手稽首而作賦曰蓐收乘令少皥司天禱申房伯道指燕然選車徒者數萬號賁育者三千掦祖烈於龍沙平移華蓋奉慈顔於黃屋廣列細旃肅馬政以訓五戎既間既好遵秋原以瞻百榖實栗實堅下令師中禁蹂躪於長路沛恩畿近賜田租之半年夜雨知時潤庶草而征衣不濕秋山入畫罨衆卉而鈴斾自妍於時鎖鑰元戎屏息凛節穹廬君長抗手獻珍負弓弩者備東樓之裔通膏沐者列西雍之賓拖豨之矛非假淬而後利射熊之館不待移而自陳規延袤以星羅路方千有餘里偭爽塏以枰列圍設一十五巡肅慎悉暈重圓聖乎又縱烏號自呈滿月天也非人於是八部分行視前旌以為導兩翼競進拱大纛而居中人影環山揮袂雲連靉靆馬蹄踏草風來香染芎藭匝鷹窠之千嶺審􅚵迹於三嵏洵無幽而不入亦靡奧之弗通凡兹輕鳥道而用命者莫不因田事而抒忠則見驚羣彯獸窟不能營挂矰文禽木不能擇鹿麌麌而緣岡兔爰爰而越陌黃羊之起殷殷斑雉之飛彳彳狐失氷聽豹迷霧澤狼雖顧而離披熊欲申而狼藉虓虎迎天􅓡以就殱大兕嬰地羅以自扼或迸石而墜崖或獲雙於射隻縱突圍其延喘終魄褫而神虩爾其角力既敵於羣材獻絶復及於衆養髯官遞嗾天狗狰獰奚奴指頥海青迅往隼脫韝而奮擊犬帶鈴而直上小試則似石壓卵大受則如獅搏象中必要害來必惝恍乍飈發於雲間仍馴伏於御仗况夫德稱於駟力優於馬獸多若陵亘禽墮如雨下實既登籍矢猶盈把按轡於峩嵲之峰馳驟於廣莫之野于以見軍旅之止齊而餘勇之可賈也衆志懌矣皇情寫矣名墨卿而灑翰何揚風而扢雅爰整七校爰建長旓序涉涼候厯偏秋郊解湯網之恢廓筮顯比之象爻簡左膘之上等進慈寧之嘉肴貴胄公孤頒以肥脆羽林鵷鷺逮以燔炮豈惟示雨露之均亦以定上下之交是役也發軔流火回軫初寒深谷長松迢遞盡乎遼土鐵漿芹菜館舍覽夫契丹應氣而行巨典撫景而得大觀示禦攘課繕完威武耀磐石安惟德車之逺馭占玉衡之長端賦成紀實歌以志歡歌曰於鑠皇旅則時邁兮仁育義正敷天對兮祖烈重光威無外兮日未靡旃無已太兮又歌曰率左右兮從羣醜還宸居兮薦嘉卣天祿申兮昭受式下武兮萬夀秋郊大獵賦謹序劉綸臣聞三田詳於王制匪止充庖四隙載自周官爰勤講武故大閲以義舉大搜以禮行俾步伐示我行間而風聲貽諸逖聽六師繇兹有赫七德職是無虧往牒彌文意同一揆伏見皇帝陛下光宅海寓文武兼資湛恩龎鴻中外蒙福懿惟祖宗時巡率狩永肩在今咨彼徼荒鱗集仰流內靣亦久乃以乾隆十四年秋七月戒臚人鳩禁旅校獵於木蘭由啓塗訖蕆事茂典修濃化浹愈愈乎勿勿乎昭暗之氣通歈誦之音作矣臣菰蘆下走承迹屬車瞻望清塵退而竊忭不揣檮昧輒受簡以為之賦目尚迷夫鼮鼠敢云句擬子雲心冀識夫騶虞或且嗤同曼倩焉爾拊興桓以北睇臻穆納以南睋太行緣陲而竦嶂灤水絶漠而增波六扇關門塞日射丸泥之谷一圍天幕邉風清敕勒之歌首塗則十二軌方繪秋原於指掌奉引則三千迾卒圜法駕以駢羅是時也蓐收告辰大丙陪位雷􅗗麟班雲捎罕翠遺人充其廥儲掌舍摻其枑陛離宫表記里之鼓九野垣墉馳道消甌脫之偵一家尉吏古卉服而窮居今雲宿而露積蓋别部星萃周廬櫛比廣場郵置喁喁遂遂以待天子之所有事爾其曙暾昭回莽䍚洞開橫襟雁磧高枕龍堆長阹曼曼其垂螮儀鍠矗矗其轉魁命大章竪亥之侣程翹關超距之材而止止而行行窅乎如陽施隂設儼一纛之綰中台也曰左左曰右右趫乎若箕張翼舒俄雙旌之糾外回也羌蕞列以茅班又轅轘而輻輳玦抱珥而環循綱引維而目就閣閕大壑臆梯接而􅥗懸􅍶崒重崖睎人寸而馬豆於是夏箙抽鳥號彀發縱齊指麾授快得雋於一呼矧疊雙乎多又乍獢睒以鷹瞵卉穿腋以刌脰突圍趢趗下折角乎犀兕麚麙失穴褵褷上縮踆乎鼪鼯猱狖洵不媒而不囮竟何飛而何走皇帝乃出和門遵靈囿奉大安上慈夀祝湯網㪺堯酎則有蕃封君長庭實多儀頒禽壓案行酒捧匜帣韝鞠􅛏起而敶辭昔也荷皇祖之龍光今焉陪聖孫之燕私韙三驅於大甸嫻九伐之閎規况新覩巴子蠶叢之式化曾不煩寸纓尺組以縻之又奚俟哆五柞於漢賦捫十鼓於周詩然後筮師貞而思羣䇿圗王會以志招携哉謹拜手稽首系之頌曰天山窿窿塞草膴膴有若駝峯崎磴搘拄有若羊腸洄洑邪竪皇帝臨汝如闥如户金風既膢玉趾斯舉員獵員遊山祗蹈舞足足般般四靈為府闓乎至仁皇矣大武武纘厥緒仁篤其祜元會萬憶登三咸五哨鹿賦劉綸皇帝幸上塞修時畋五戎燀七萃闐三扈表禽二虞獻豜别有守大羅氏之職者以致鹿告緌請前厥制不罟不阱匪號匪筌從其類乎神以兹而全者托於音矣哨可得而傳焉方其未之哨也瞰衆歸伺叢薄測卉泉窺聚落為町為疃既登場以目營或抗或􅚵爰逐迹而臆度良有合乎師行之外諜旁偵而豫紓夫卷甲銜枚之勝略至夫白藏露塗青女霜鋪啓明東耿朒影西晡設宵田之爟火殊夜獵之戴罏時其簡練比其耦俱太人占之即鹿無虞於是坂緣九折隊麗三伍旅屯於郛鋭冞其阻聮絡聲援若傴若僂若肱若膂又不翅營陳之六伐七伐五步七步駢坒乎𣪚伏而蹴部也其貌之則皮其冠也角之芟然首之班然奚取乎中黃朱鬕之植髮如竿也其召之則木斯竅也抑之窅然抗之噭然無需乎淘河鳥脛之大號而小號也當斯之時密利迦羅䠑踽迉遲求牡俟俟遊牝祈祈駴谷聲之自答宛命匹而要之退彳亍乎如遺進蹩躠乎如疑恍同同而睥睨訝異異而詆謀彼跚然其獸舞紛胡為乎來思此闖然其人立􅌓不知夫所為於焉呼急鎗捫列宿會若連襼解若脫胄趣後車選徒而舉胔信天弓不虛夫先彀儻銅牌之可識昨者憶釋網於帝圍或芝草之能銜今也願捧觴為慈夀乃復有司衡之佐典澤之儔希光道周爰咨爰諏進而稱曰蓋聞至人寓物造化神謀故卭或驉負雉或媒求意釣者時忘其魚入羣者不驚其鷗苟有氣乎斯應豈於林乎是􅊧凡天降與地出寧盡緤以窮韝方今聖天子德化醰粹彌洽澨陬庶彚由庚咸和咸柔詎惟在囿者感姫文而攸伏居山者際重華而與遊也哉上乃摛天藻敕賡載羅訓典阹雕繢皇綱帝紘囊括乎圜內雖有馬鄭專家鄒枚齊輩𨽻事罕習巵言失概未效江陵射者之吹竊陋畝邱封人之對莫不居觚緘喙操牘汙背遷延而辭退哨鹿賦謹序于敏中皇帝臨御以來海宇乂安羣生茂育殊方别區沭德化而憺威稜者莫不陸讋水栗奔走內附乃履盛惕若逸不忘勞嵗以秋八月搜於塞上繼繩祖武有事於哨鹿順時應機即小喻大義宏且逺爰於武帳濡翰抒藻親製前後哨鹿賦翕若璧合粲然錦襄長言載賡纎悉具舉美哉洋洋乎天地之大文古今之能事偹矣彼相如賦上林揚雄賦長楊詞夸意騁固璅璅焉不足稱嫓若射雉一賦體物繪情可謂擬諸其形容矣而義囿於文莫能籠函萬有以方聖製殆猶瓦缶黃鐘難以儕響者也小臣無似承命給札神惴汙惶不知所云退而齋心殫思積時纍日忘弇鄙之愚志賡揚之榮譬諸爝火思附光太陽而蛙黽妄依聲天籟也敬拜手稽首而獻賦曰蓋聞哨鹿之為制也實權輿於索倫匪角力以鬪捷弗詭遇以掩羣酌劑乎仁義𠂻度乎屈伸離合盡熊翕闢互根其動也無端其致也不紛占即鹿之無虞厥功嫓乎至神猗歟聖祖爰躬爰親我后是則纘兹武功叶練吉日撰良辰肅周徼戒虞人曵羽罕靡雲旗叶清道按列天行星陳駢衍陸離乃蒞止乎木蘭其為地也沃野千里連山透迆㠍嶫􅔍鬱嶔崟崎礒周表包絡以界乎左右叶邈谽谺之中豁峙儲胥與槍櫐豐彼圃草芊綿猗靡帶以羊腸之河阻以伊遜之水峻者如削平者如砥曲者窈繚曠者哆侈騁覽矚於巘原渺不知其逺近叶是蓋天闢神壤隩衍豐矣廣陪漢苑樂均靈囿叶無事設以周阹而足供三田植旌抗綏之所叶若此故其地乃可喜也爾其磅礴鬱積物産斯聚毛羣羽族穴藏谷處禽經不暇載獸簿不及舉彼伊尼之蕃息更日孳而嵗廣叶有麚有麀有􅕱有麈判彼麔麎差其䴠叶甡甡跂跂儦儦麌麌七星八歧雙頭一角殊形而詭狀者蓋不能以更僕數爾乃白藏屇商風引露既降木葉隕乳字以時匪靈伊蠢紛其求牡習焉逰牝既挾偶以兼羣遂分圻而畫畛逞驍健以自衛僄環角而植吻或寢或訛或馴或踳忌他族之實逼同類之相近彼孱弱者逡巡􅌓眙已望形而伈睍而桀雄據守夫澤中方且睅睹旁睞畜趪猛而餘忿故得因勢施巧乘間度情攻其無偹奪其必爭伊濯濯之與居信呦呦而善鳴爰制器以象之乃能疾徐進退宛轉而相迎匪笳而凄匪笛而清脛無取乎淘河管弗效乎簧笙把宫彈角翕焉中音叶是則哨之為用所以握勝而操贏也於時清霜栗側宿煙蒼莽朓影西流啓明東上巗韜景以暗曖野含曙而曭㬒乃簡徒御屏衛仗星廬拱和門敞七校靜六轡騁叶蚖鐙赩列以雙導羽騎分而犄張叶前驅後扈或三或兩枚肅無譁鈴􅌢無響驟躞蹀以相羊於焉望崖嶺而遄往爰荷長哨被短衣其裘則獺其冠則皮載以象首出諸簏笥綴毛體之般般聳義角以觺觺搬彼町疃拄兹薈翳始蠖伏以密伺徐跂張而仰窺既儲精於閴寂奮先聲以出竒虞原獸之罕至因舉哨以宣之脣引則響集吻吮則音移噭然而高窈然而微和囉㘊霵如倡斯隨㖤㗅紆鬱若距若追嘹如引吭嚍如鼓頥懾狡黠于幽遐應友聲而是求叶彳于旁皇睢盱錯愕將前忽却既進復沮魂悚悚以狼狷心􅓥􅓥而猶豫懼羣匹之或失矯長鳴以捍禦恣狼戾而獷猤突生猜而觸妬乍凝聽以曲睨旋擢身而思赴鬱狂迸而陸梁恃角搶與題注狡焉願鬭瞥爾相遇斯時也厭躡深潛屛息矚顧不震不撓不徐不遽逮心煩而伎懩始悚立以騰湊叶倐脫帽以呈形忽應叱而少住翳喬桀之殊才遂乃脈脈狋狋子霓瞪眄而不能去於是釋哨具進神鎗規分刌測毫芒心平視審手正機張奮駍聲激流光虩虩煜煜霆擊雷轟叶眨電火之一掣已中髃而洞腸或小創之蹶起俄應聲而復僵亦有去如脫兔駭若驚麞或挺而驁或怯而尩或曶霍以猋迅或蹙竦以霧藏劈捻躍而盤辟若負固而不自量凖鯨牙之軒輊又無不殪於廣莫之場至若或騰或倚或羣或友掉而不來逐之輒走𬗟讋怖以郤步尚倐眒而抗首膽劣目眴足蹯迹􅚵遽聞聲而逋竄莽凌躐而相蹂固縱之而弗追亦舍旃而弗誘掩不計多獲不厭少叶失也其常得也其偶斯蓋仁者之事君子所取又何必罼戈彌谷罻罿蔽藪前遮後轔徼􅓈屬軌叶他他藉藉乃為偹物而咸有哉既而皇清洽恩澤宣弭節乎神臯儲與乎皮軒乃論上射乃擇左肩登於大庖以炙以燔嘗其旨否進諸大安割鮮染輪野饗從官升觴既釂羣情悅歡咸避席擎拳鞠􅛏而頌曰允矣聖人如天之好生叶逰非樂乎耽盤義固凖夫秋獮欲左者左欲右者右有殷湯祝網之仁焉舍逆取順失禽不誡有周文三驅之訓叶焉信乎美善莫得而形容徴引無藉乎更端者矣矧愚臣之孱弱徒授簡而拘牽職有忝乎執戟力不勝夫控弦目未睹秋田之盛身未習講武之班驟與語夫哨鹿等捫燭而扣槃竊幸蹈詠奎藻紬繹鴻篇庶聾瞶之一振聆鐘簴之在縣縱極揣靡窺測雍容揄揚曾未能得其涯涘又何足補於邱山也哉跋御製避暑山莊三十六景詩恭跋張廷玉康熙五十一年六月臣等恭注御製避暑山莊三十六景詩仰見皇上聖學崇深含經味道純粹以精發為詩歌上繼雅頌囊括百家臣等學識弇陋管窺蠡測未能宣揚盛美兹蒙恩諭俾得附名簡末且喜且愧不容於心欽惟我皇上聲教覃敷極天所覆盡入版籍要荒之外率同畿甸自京師東北行羣峯回合清流縈繞至熱河而形勢融結蔚然深秀古稱西北山川多雄竒東南多幽曲兹地實兼美焉蓋造化靈淑特鍾於此前代威德不能逺孚人迹罕至皇上時巡過此見而異之念此地舊無居人闢為離宫無侵民田廬之害又去京師至近章奏朝發夕至綜理萬幾與宫中無異乃相其岡原發其榛莽凡所營搆皆因巖壑天然之妙開林滌澗不采不斫工費省約而綺綰繡錯煙景萬狀標其尤者凡三十有六清涼爽塏於夏為宜每至盛暑則奉皇太后駐蹕焉泉甘土沃居此逾時聖容豐裕精神益健蓋皇上憂勞萬民德合於天皇上之逰息也臣等忝列侍縱時賜宴逰諸景皆嘗目擊而莫能摹寫及伏讀御製詩則林泉蒼靄一一湧現於胸中蓋此地之景乃天地山川自然之氣所發著非皇上化工之筆莫能傳也而臣等尤有厚幸者伏讀皇上御製避暑山莊記及諸詩奉慈闈則徴寢門問膳之誠憑臺榭則見茅茨不剪之意觀溉種則念稼穡之艱難覽花蒔則驗隂陽之氣候玩禽魚則思萬物之咸若凡讀者因詩以求諸景之勝豈獨未見者如親厯哉即皇上敬天勤民與覆載同流之氣象可以昭示天下萬世永永無極矣御製古長城説恭跋汪由敦御製古長城説以化工之筆行自然之文深入顯出宇宙在手尋繹再四心目曠然在昔山經地志類出文人承傳沿襲掇拾諏採輒矜為創獲其經目覩記可覆按者百不一二數也况絶塞僻逺逰躅所不至之地哉兹以六御所經名王部長旃裘之衆親履而指數之其核實為何如者且謂天地自然所生以限南北尤不易之論蓋嘗觀之百家之聚千室之邑率冇岡巒川阜縈回環抱之勢至通都郡國則具厄塞阻要顯然為之疆域屛翰皆非人力所能為聖人者為之相其隂陽建城郭宫室規重門禦暴之制無非因其自然易曰地險山川邱陵也王公設險以守其國此物此志也蒙恬之為長城後人專罪其長惡勦民其垂死所歎為絶地􅎃者一若設詞以自文而不知其拂天地之經而不因其自然彼固未嘗不自知之而深悔之也然非親厯而得其實其孰從而證之或疑塞外蕃部聨屬雖逐水草亦各有分地且此故元上都興州近境安知非昔之居是者殘壁故壘荒略失傳者耶是或未可知然西北之瀚海流沙東北之窩集是非天地所限耶不寧惟是凡大川之達江海其入處必有沙橫亘若户閾然濬輒復淤是乃在水中又豈昔人所為耶觀此則天地所生自然者益信碑記敕修承德府關帝廟碑記梁國治乾隆四十三年嵗在戊戌詔升熱河廳為承德府其餘六廳改𨽻為州縣於是鼎建文廟選造生徒增置解額以明年己亥五月上親詣釋奠是月復詔協辦大學士尚書英亷侍郎和珅重修麗正門右關帝廟改易黃瓦殿宇崇閎規制大偹臣國治恭承嘉命為文以記臣竊惟古者立國必先建學設廟所以定民志一耳目也承德近接塞垣前代聲教所不及邉關之氓不見通都大邑禮樂威儀之盛非一日也我國家揆文奮武邁古超前自聖祖肇啓山莊成都成邑朝宗輻湊萬國會同我皇上覲揚光烈四十五年以來開闢疆宇二萬餘里自蒙古諸王公喀爾喀及四衛拉特回部諸藩等莫不傾心託命奔走俯伏來享來庭於是承德為古北口外一大都會將山川靈淑之氣藴於古而發於今耶抑天眷有德聖天子赫聲濯靈薄言震之莫不震疊者也夫制禮以作民敬也立廟以作民誠也關帝廟祀遍天下各直省府州縣建祠設像守土官吏嵗時展謁典禮視文廟况承德距京師數百里日月所照臨中外所瞻就廟貌之成可以見國家褒崇忠義凛乎綱常名教之大焉可以使逺近更易觀聽動其嚴威儼恪之忱焉秩祀之修庸可已乎工經始於乾隆四十四年五月越明年五月工竣凡用銀五千八百九十三兩有竒新廟既成文武吏士邦人咸喜而蒙古外藩嵗時朝覲者亦展禮廡下以申畏神服教之誠以昭文德武功之盛臣國治奉命撰述與有榮也謹拜手稽首恭記欽定熱河志卷一百八
