body:
  text: 疆域三灤平縣即喀喇河屯㕔灤平縣境東西距四百四十五里南北距二百六十八里自縣治東迤南至石門子接承德府界四十里西至大曬樹溝接獨石口㕔界四百五里南至古北口接順天府宻雲縣界一百三十八里北至老千溝接豐寧縣界一百三十里西南至大柴峪口接獨石口㕔界四百十里東北至金厰接承徳府及豐寧縣界六十里西北至西石灰窑接豐寧縣界二百七十里自縣治至熱河行宫四十里縣屬村庄詳載於後喀喇河屯為灤平縣治灤河經流其東北有行宫東北至廣仁嶺頂三十二里接承徳府界樺榆溝在縣治東南十五里釣魚臺在樺榆溝東南三里大柵子在釣魚臺東南八里小樺榆溝在大柵子東南八里石門子在小樺榆溝東南六里接承徳府界右灤平縣東迤南境馮家營在縣治北稍西五里四泉莊在馮家營西五里三道灣在四泉莊西北十五里應家營在縣治北十里雙塔子在應家營東北二里其西有雙塔山大三岔口在雙塔子東十里单塔子在大三岔口東七里伊遜河經流其西入灤河小三岔口在单塔子東十三里小營子在小三岔口西北二十里金厰在小營子東北八里右灤平縣北迤東境八里莊在縣治西八里葦子峪在八里莊西七里其西境有葦峪嶺小黄土梁在縣治西稍南十八里藍旗梁在小黄土梁西北八里七間房在小黄土梁西二十二里右灤平縣西境以上俱屬喀喇河屯汛轄傅家營在縣治南十二里紅石巒在縣治南稍西二十二里王家營在紅石巒西南六里有行宫羊草溝在七間房南十七里靳家溝在羊草溝南五里三道梁在靳家溝南十里楊樹底在三道梁南三里蕨菜溝在楊樹底西南五里鞍子嶺在蕨菜溝西南四里常山峪在鞍子嶺南八里有行宫朝陽洞在常山峪西十里黄土梁在朝陽洞南十二里馬圈子在黄土梁西南十里在縣治西南八十里設馬圈子汛青石梁在馬圈子西南三里曬樹溝在青石梁西南八里右灤平縣南境屬馬圈子汛轄三間房在曬樹溝西十里在縣治西南九十五里兩間房在三間房西南五里有行宫一間房在兩間房西南三里侯家營在一間房西南六里古城川在侯家營西十二里狼窩在古城川西南六里西葦子峪在狼窩西八里南接宻雲縣古北口邊墻界花樓子溝在西葦子峪西六里在縣治西南一百十八里巴克什營在花樓子溝西南十二里有行宫山神廟在巴克什營西六里對山在山神廟西十八里南接宻雲縣古北口邊墻界北店子在對山西二十二里在縣治西南一百里猴山在北店子西二十里殷家營在猴山西十里戴家營在殷家營西十二里髙家營在戴家營西十五里西有馮家峪馮家峪河發源其南司家營在髙家營西十里涼水泉在司家營西十五里火石嶺在涼水泉西二十二里火石溝在火石嶺西十里南接宻雲縣白馬闗邊墻界右灤平縣西南境自三間房至西葦子峪屬古北口司馬臺汛兼轄自花樓子溝至對山屬古北口潮河川汛兼轄自北店子至火石溝屬白馬闗汛兼轄張博灣在七間房西十里在縣治西六十里喇嘛洞在張博灣西十里在縣治西七十里設喇嘛洞汛三岔口在喇嘛洞西三里王家溝在三岔口西南十里小城子在王家溝西五里興州在小城子北三里興州河經流其東北兩間房在興州西北五里興州河經流其東西石門子在北兩間房西十里北楊樹底在西石門子西北八里老千溝在北楊樹底西北十二里北接豐寧縣界韮菜溝在張博灣西北十里金鈎屯在韮菜溝北十里灤河沿在金鈎屯北十里斗溝在灤河沿北二十里橋頭在韮菜溝東北十二里灤河經流其北錫喇諾海在橋頭北十四里長嶺在灤河沿東十里白旗在長嶺北五里紅旗在白旗南十里星龕巖在紅旗南五里灤河經流其北喀卜齊爾在星龕巖東北五里三家兒在喀卜齊爾北十里右灤平縣西迤北境屬喀喇洞汛轄鞍匠屯在王家營西二十里在縣治西九十里有巡檢司治後偏嶺在鞍匠屯西南十里呉家柵在後偏嶺西南八里噶海溝在呉家柵西十里西釣魚臺在噶海溝南八里三岔口在西釣魚臺西南十里太平莊在三岔口南六里大店子在太平莊西二十里在縣治西一百十里設大店子汛大十八盤在大店子西南十里小十八盤在大十八盤西南四里前偏嶺在小十八盤西十里䳺鶉溝在前偏嶺西十五里項家柵在䳺鶉溝西五里在縣治西一百二十五里小白旗在項家柵西北十里三道河在小白旗西南十五里四道河在三道河西五里五道河在四道河西六里六道河在五道河西南五里七道河在六道河西南八里呼什哈在七道河西南十里在縣治西一百五十里設呼什哈汛潮河經流其東白旗在呼什哈西四十里西三岔口在白旗西十里龍潭在西三岔口北二十里孟家營在龍潭西十里右灤平縣西境自鞍匠屯至䳺鶉溝屬大店子汛管轄自項家柵至孟家營屬呼什哈汛轄東石灰窑在孟家營西三十里在縣治西二百六十里西石灰窑在東石灰窑西十里湯河經流其東碓舊溝在西石灰窑南十里潮河經流其東八道河在七道河西五里龍潭溝在八道河西十里喇叭溝在龍潭溝西四十五里湯河口在喇叭溝西二十里石門坑在湯河口西十里長哨子在石門坑西南六里石洞溝在長哨子西南五里黄石堂在石洞溝西二十里馬圈子在黄石堂西南十里鴿子堂在馬圈子西南十五里湯河經流其東寳山寺在鴿子堂南二十里鞍子嶺在寳山寺南十里鞍子嶺河發源其南東倚白河廟兒梁在鞍子嶺西北三十里湯河經流其西琉璃廟在廟兒梁西十里老公營在琉璃廟西南十里西倚白河巴普堂在老公營西南十八里大柴峪在巴普堂西南二十里大柴峪河發源於此東流入白河有大柴峪汎道溝峪在大柴峪西十里鰲魚溝在道溝峪西南二十里