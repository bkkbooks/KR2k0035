body:
  text: 欽定四庫全書欽定熱河志卷七十七寺廟一寺廟之在山莊內者靈山寶地聖迹留貽如永佑寺所以推恩薦福水月菴諸寺廟所以垂示勝因也其在山莊外者覲揚祖烈輪奐如新諸藩虔搆精廬延洪錫羡則溥仁溥善之建自康熙癸巳始我皇上繼武延祺武成再告絶徼歸誠則有普寧安逺諸剎之建而普陀宗乘尤為莊嚴巨麗當秋獮駐蹕諸部臚歡瞻禮咸仰光華乃者班禪額爾德尼來覲祝釐特建須彌福夀之廟琳宫屹峙勝概益增洵乎會八部龍天而讚誦遍百神河嶽以皈依矣至於叢祠名剎祀典猶存碑篆未泯其在承德府境內者如前燕之龍翔寺北魏之堯祠白鹿山祠遼之卧佛金之三學元之鎮國林泉諸寺稽之史册足資考證者今並載於篇志寺廟第十三欽定四庫全書欽定熱河志卷七十七寺廟一永佑寺水月菴永佑寺在山莊內萬樹園乾隆十六年建南嚮聯額皆御書門外樹坊三中曰仁夀世界曰慈悲法門東曰法瞻龍象曰錫振雷音西曰優曇耀采曰簷蔔霏香門三楹額曰永佑寺入門前殿五楹供彌陀佛額曰住世慈緣聯曰得現一切色身善應常修智方便成就甚深慧力普明獨證法圓通丹墀刻碑二恭鐫御製碑文左一通前清文後蒙古文右一通前漢文後西畨文後為寶輪殿五楹供三世佛八大菩薩額曰法雲真際聯曰松磴雲開宛呈真實相蓮池月朗長印妙明心配殿東曰妙覺西曰慧昭又後殿五楹供無量夀佛額曰身心平等配殿東曰普惠西曰廣仁其東為能仁殿額曰無畏清涼聯曰凡有為中皆幻相到無心處是真禪後殿之北拔地窣天為舍利塔額曰妙蓮湧座八方各有聯南曰佛幢結鬘安禪竟僧帽披雲禮梵初東南曰觚稜日上槃承露鈴鐸風回座散花東曰屹峙錘峯標窣堵分流濡水指神州東北曰浮圖彩煥神明舍塞苑祥開納鉢天北曰户外七星羅玉宇園中萬樹拱珠標西北曰積雪全消橫逺嶺浮雲淨卷俯髙樓西曰夕靄明邉雁臺出晨霞起處鷲峯來西南曰挂簷新月參三點射角明河映九層塔凡九層層各有額曰初禪精進曰二諦超宗曰三乘臻上曰四花寶積曰五智會因曰六通普證曰七果圓成曰八部護持曰九天香界第一層東北壁恭刻御製詩塔後豐碑屹立靣南鐫御製永佑寺舍利塔記靣北鐫御製避暑山莊百韻詩并序靣塔殿三楹聯曰軒庭懸舜日岩壑蔚龍光上有樓正中恭奉聖祖仁皇帝御容上每至山莊必先詣展拜乾隆二十七年秋八月二十三日恭遇世宗憲皇帝諱辰上思慕齋居情殷懓愾爰奉御容於樓之東楹至日躬親瞻仰用申依戀樓西偏精藍三楹為寫心精舍額曰日就月將聯曰今昔感頻增綣兹風露寸分隂並惜寄彼縹緗為恭謁神御時臨憩之所寺基在甫田叢樾之東左傍宮牆後環列水樂成閣峙其東北春好軒敞其東南松牖雲扄花香鳥語誠龍象之福徵也御製文永佑寺碑文辛未昔如來以法王御世宏濟人天遍現十方虛空不住顧其安立道場必在靈山寶地鷲峯鹿苑精舍莊嚴蓋聖迹所留尤福佑之所聚矣我皇祖聖祖仁皇帝以無量夀佛示現轉輪聖王福慧威神超軼無上省方覽勝乃眷熱河建山莊為清暑地因岩壑自然之勢示茆茨不翦之規養性怡神從容綜理而風雷之所鼓動雨露之所涵濡神化周通不疾而速猶佛之林間燕坐灑落安禪而説法則聲震大千度生則施洽羣有也豫小子蚤年隨侍仰見我皇祖清晏娛遊無逸乃逸對時育物天地同流至於今彈指三十餘年秋獮之餘時復稅駕於此松雲如舊榱桷翹瞻感陟降之在庭思報恩而薦福遂即山內萬樹園之地創立精藍爰名永佑固不特鐘魚梵唄足令三十六景借證聲聞我皇祖聖日所照千秋萬歲後子孫臣庶無不永如在之思是即釋迦之耆闍崛山金剛法座天龍擁護相好依然而朕之繩武寧親祝釐養志者於是乎託庶其無沗前志云爾永佑寺舍利塔記甲申自辛未奉慈輦南巡於夫招提蘭若轉輪祝釐無不虔奉金根隨喜檀界乃識所謂金陵之報恩武林之六和歸而欲肖之以延鴻算無何而一不戒於火其一將成而圮龜玉毁於櫝有司者不能辭其責也雖然豫豈肯以工作微過而責人於是一無所問且或者如形家之言北方其誠不可如南方之為塔乎則有志過之作永罷塔而弗為然同時之建於熱河之永佑寺者不可中止恐其蹈轍乃命拆其弗堅及築不如式者而概易之石越十歲甲申窣堵乃成巋然峙於避暑山莊較京師為尤北則堪輿風水之論固不足憑此亦默有以啓豫之心不必信八會地節之濫陳禍福以聳聽乎若夫工匠於未經試繩墨者棘手瞪目亦人情之常不必畏難塗廢而棄前功於無用也然是塔經營之初實為四衛拉特來歸西師籌畫之始至自今大功告成伊犁耕牧日以開闢而堵坡法輪舍利回煥所謂有志者事必成儒釋雖殊途其理則一也兹故詳志其事而於剎工僧祗化城福田之説則略之抑以金剛六如雖調御相好有所弗屑何有於塔也塔隂勒避暑山莊百韻詩敬闡皇祖巡狩之義欲以垂範永世乃豫本意後人讀是碑者當以繼武詰戎為兢兢正不必以闡象教期利益為亟亟則思過半矣御製詩永佑寺瞻禮皇祖神御感成長句己卯靈臺經始庶民攻逐處奎章仰聖蹤神御肇禋思所喜祖恩如昨報何從恬文嬉武戒常凛揚烈覲光志益恭三十七年舂鼓夢涼風白日感重重永佑寺瞻拜神御作癸未永佑義從恩佑建考容敬奉祖容旁山莊以神御皇祖素喜遊憩之地於甲戌年即恭奉每來必展拜去歲始敬擬並奉皇考御容兹至山莊祇謁行禮維欽雲日心無斁益勵繼繩志不遑樂利男耕將女織昭回水態與山光年年萬樹宴新附敢曰能承少謝蘉永佑寺瞻拜神御作甲申下馬先瞻神御宮覲揚惟切一心中砌蟲仍是向來韻庭樹又披今度風穹塔傑碑落巍煥是年舍利塔初落成碑以志事祖功宗德並髙崇幸逢秋穡將登稔待歲殷懷昔日同千畝山田待歲豐也皇祖御製詩句永佑寺瞻拜神御作乙酉上塞如中禁奉尊神御同虔瞻又隔歲翹想切微衷砌浥秋花露簾掀古樹風勳華垂萬祀佑啓賴無窮永佑寺瞻禮神御紀事丙戌祖功宗德萬年垂每至欽瞻有所思問已庶幾未隕越勤民詎曰致雍熙於今率土猶懷惠自昔為君重繼貽堂額紀恩御園創合將事例述於斯康熙壬寅春明園皇考奉臺皇祖於圓之牡丹觀花侍宴以豫名奏聞遂蒙壑松眷顧育之宫中其年即扈侍山莊賜居於萬風日承提命歷夏閲秋為時最久今歲於御園顔堂曰紀重而恩并為記以述承恩所自始付託所洊志豫兢業勉副之意兹拜瞻御園神御回溯昔蹤將於舊所居室亦仿題額用申感慕永佑寺瞻禮神御有述丁亥羮牆猶想像雲日近昭臨每至先瞻謁無遑善繼心秋風今古颯庭樹歲年侵蒙業安惟永持盈敬益深詣永佑寺瞻禮神御戊子神御欽如在山莊况所欣萬年家法示永衣去聲德言聞過雨山容淨拂風花氣芬樓前呈色相依舊似歌薰永佑寺瞻禮庚寅神御崇居雲日懸到來謁必致誠虔萬方樂利恆貽後百世繼繩可忘前遊豫倍思稚齡日春秋閲忽六旬年明朝更值重讀詔每逢詔三皇考忌辰必敬讀也遺十五年恆如一日撫己追懷倍黯然永佑寺瞻禮辛卯一年一度仰如雲是日秋風豁霽氛緑水青山恆悅聖繩前啓後示為君幼齡恩育那能忘望歲虔求祗益勤將撫新來行慶賞庶幾昭鑒有餘欣永佑寺瞻禮作壬辰層樓神御仰雲天午日當庭塔影懸祖德宗功誠浩浩肯堂矧構益乾乾壁題幸有柔遐句去歲瞻禮有將撫新來行慶賞庶幾未來昭鑒有餘欣之句謂土爾扈特歸順也去歲者將以今秋宴賞之途况欣成穫麥篇新附更畨逮朝覲優恩三接例依前永佑寺瞻禮神御敬成長句癸巳大田膏雨喜優霑至止山莊景倍添永佑拜參攄悃愫重樓傑峙聳清嚴承先示後惟存敬保泰持盈在守謙默祝慈寧錫康健年年欣慶奉來瞻永佑寺瞻禮甲午禮固從來由義行到斯瞻仰敬攄誠僾然見矣欽神御久以化之慙顧成水鏡雲紳昔聖迹田耕井鑿此民情承庥蒙業惟勤亹遑敢云云望郅平漢史顧成之名師古已斥服虔之非即應劭所云制度卑狹若顧望而成於義亦無所取卑宫室則可卑宗廟則不可也獨如淳謂若尚書之顧命為近之蓋顧命者顧子孫而命之顧成者顧子孫之守成耳然身存而為廟漢諸帝遂以為家法斯實不經因用此字並申其説如右永佑寺瞻禮乙未繼繩何處不欽思知遇偏深此地悲四十年哉以即位言之有成愧六旬歲矣故吾嗤雖云旰食還宵衣去聲未致民安與物熙永佑即今祈佑者軍營早晚遞紅旗永佑寺瞻禮丙申下馬先攄瞻禮誠層樓神御曉曦晶屢申此日養親志敬法當年避暑情夕惕朝乾敢或懈勑幾律已戒其盈紅旗三捷歌耆定祈佑叨恩幸武成昨歲瞻禮句云永佑即今祈三捷佑者軍營早晚遞紅旗自去秋及春紅旗逆黨全俘武成耆定兹展謁之下彌感貺於神御垂庥惟益凛持盈敬承嘉無斁耳永佑寺瞻禮己亥至止先兹瞻禮虔祖功宗德日中天惟欽巍蕩垂萬世不覺光隂閲兩年頗幸雨暘以時若正愁隄堰未工堅自去歲七月河決儀封之十六堡屢築屢衝至今尚未合龍深以為慮今朝肅􅉔申誠處為憶前畨益淚漣永佑寺瞻禮庚子功祖德宗垂萬􅑤年年謁必於初來以云無沗惟欽爾設曰有恢實愧哉此際拜茵多感慨前巡掖輦異追陪敢增神御蹈豐昵松鶴齋名時所聖母昔御惟應一寫哀永佑寺瞻禮辛丑皇祖當年喜此居自應神御奉如初禮因義起言思彼仁以憲章事創豫至必先瞻欽繼述念惟切已敢舒徐不期梗化回猖亂復此有征盼捷書撒拉爾畨回肆逆一案已屢有詩紀事昨阿桂奏川省屯練土兵等到齊欲令預悉華林山勢及進兵路徑先於閏五月初三日派海蘭察明亮等帶領阿拉山馬兵及屯練兵由龍尾山繞至華林山西南斜撲賊卡又派舒亮等帶滿漢奮勇兵過溝由山南直壓賊卡額森特及伍彌泰等在山坡山梁分路䇿應除鎗炮殲賊不計數外三次攪戰約殺賊六七十名現擬於初九初十雨日尅期大舉四路攻圍以期一舉殄滅晝夜惟望捷音速至耳永佑寺瞻禮壬寅山莊皇祖創垂崇到必虔瞻申緬衷詎祗几筵欽舊迹益思宵旰朂微躬渴懷傅説霖為雨漫擬重華薰鼓風塞外行宫奉神御皇清威德古誰同登永佑寺舍利塔作歌甲申玲瓏九層塔江南則夥江北無我因南巡忽欲肖傑搆曾倣六和報恩之塔於京都一圮一燬終弗蕆厥事亦吟志過之作語出於衷實非誣同時建於此者乃無恙鑒前轍命改築為以徐閲十年斯巍然成窣堵秋巡拾級乃得暢意觀宏模八窗洞達琉璃道曽非枝撑蔽虧之處尋幽途上造天門通皓氣其下惟有青雲扶列水咫尺細似帶塞山遙拱圍如郛豎窮萬古橫遍十方界到此一彈指頃皆空諸何况形家之言本誕幻區分南北為拘墟是塔與京師所建同時經始或因二塔適然中輟惑於形家南北異宜之説不知山莊更在京師之北又何以稱記中已詳及之試看舍利光煥永佑矗林閭因之詰戎馭遠懷久圖登舍利塔乙酉千仭俯瑶林九層聳玉臺金輪昨初就石闕此重去聲開八忩朗洞達萬級拾崔嵬西户齊山縈東欄馮水回栱積出雲霞鈴響驚風雷雨足忘微勞一心無點埃於以泯色相乃復愛徘徊欲待夜深時應有神燈來聖母登舍利塔恭紀壬辰永佑寺中舍利塔聖慈每到必斯登八旬有一如常健億萬斯年信可徵天與夀因德與夀歡無勝更望無勝九層窣堵夫何幸視履恆瞻福履增六月朔日紀事甲午昨晚霖霑曉霽兮爽風落宇曙光䨑良時敬以掖慈輦朔旦因之禮拓提即招提也見增輝記大德躬應五福備髙年塔復九層躋永佑寺內舍利塔髙九層八旬皇太后每至必登其巔聖夀有三躋陟如常實萬年額慶福夀之徵益深一層祇祝增十歲聖夀當同窣堵齊恭侍聖母登舍利塔喜而成什丙申山莊朝爽了無炎慈輦梵宫奉拜瞻曼夀已登八十五堵波猶陟九層尖似兹健步佛仙佑益切衷心愛慶兼大德自應具四得千秋彤史孰曾覘寫心精舍作癸酉叢樾建蕭寺甫田叢樾三十六景之一地既平敞爰建精藍名曰永佑以志皇祖之恩於無窮精舍構其側名寺曰永佑寫心舍之額一時此徘徊千秋志恩澤流水與行雲夫何有無迹寫心精舍乙亥欲因山水覔知音精舍居然向碧林大塊何曾鎮韜藴髙秋常自效深沉翠煙低處巖鳴鹿白浪衝開渚下禽觸緒由來成靜觀去聲不知寫者更何心寫心精舍丁丑精舍傍花宫面勢向平楚構室就喬柯結宇依淨土不聞清梵音雅愛幽禽語間者有餘樂豫惟無逸所宵旰念民瘼拮據繩祖武偶藉詠卷阿寫心良可覩寫心精舍戊寅層樓奉神御精舍構其右寫心則不無繼武誠奚有言念甫齠齡何以蒙恩厚聖顧直注今敢不朂授受勤政勵渺躬籌治惠黔首安內逮厥外慎始要以久惟是羮牆瞻瞪乎益覺後寫心精舍庚辰每到瞻神御因教憩寫心􅜼年忽成古一念注於今敢不益黽勉安能忘敬欽怡情曰山水末矣詎知音寫心精舍辛巳每至思皇祖今朝皇考思益深悲序繼實恐負謀貽武幸臻耆定豐惟祈屢綏向誰寫心是無我息肩時八月草三日皇考忌辰題寫心精舍壬午去歲圍前駐去歲此日亦駐此曽有詩今年圍後來永思歎時迅回憶輒神摧祖德貽遊豫宗功仰擴恢並當奉神御恆此寫心哀寫心精舍癸未精舍永佑旁向曽名寫心問心於何寫繼述豫日欽勤民視如傷畏天凛難諶崇文慮文恬詰武戒武淫祖功與宗德如日月照臨遊巡貴有事寧在盤山林寫心精舍得句癸巳永佑寺中此精舍瞻拜禮畢恆憩臨愾如聞悲僾如見顯以昔愧承以今空空色祗山月照謖謖庭遞松風吟把筆不知何所道付之風月寫豫心寫心精舍甲午此而懷昔此居今心寫那更平聲曰寫心逝水光隂無喻速如天承顯祇生欽庭曦仍是恩暉照林籟寧非解愠音少小惟知侍色笑何期鬢髮亦霜侵寫心精舍乙未精舍永佑寺之傍寺之為言義可詳詎止祗圍修象教試看大理與太常古人定名原有以久假不歸屬緇黃祈佑在此豈在彼紹庭陟降思時蘉我欲寫心弗忍寫中心藏之何日忘寫心精舍丙申萬事及萬物無不由心者心為一切本則皆心寫也而此曰寫心殊覺風牛馬然亦有可説義或出般若色空即空色寫心仍心寫過者是去年來者為今夏而皆不可得孰真復孰假寫心精舍作己亥神御樓之側精舍幽而雅每因成小憩近率逢仲夏叶山靜日方長景合子西也槐隂及松籟别我兩年者胡為如是乎撫心不能寫寫心精舍作辛丑神御樓側置精舍我向題額名寫心瞻拜之餘此小憩憩思紬繹昔至今曰悲曰慕曰繩繼恐致隕越臨難諶適百里半九十里慎終如始惕益深寸田尺宅萬幾藴家法一字無逾欽寫心精舍壬寅書屋曰寫心問心如何寫繩繼固瞪乎安阜總茫也即如河之決瓠子歌愁惹屢望屢僨事絶望益沒把豫省堵築青龍岡漫口屢敗於垂成因命于上遊南岸履看地勢為改絃更張之計嗣據阿桂奏請于蘭陽三堡至商邱添築南隄一道開挑引河𨗳水下注商邱歸入正河大溜勢必全掣約於秋冬間竣事改絃别成河成在秋冬者此際豈真恝我豈民誠捨水月菴在山莊內西北隅東嚮門外石坊一御書額曰光涵上下聯曰印不即離間是相非相悟最澄明處內空外空後額曰圓徹中邉聯曰山靜塵清水恭如是觀天髙雲淨月喻本來心門額石為水月菴內殿三楹供水月大士相額曰普陀善現聯曰雲岫無心參自在石泉不垢見真如菴當西嶺深處山之半曰山心精舍由精舍後達西嶺山巔一笠登陟愈髙為放鶴亭云御製詩水月庵壬午一嶺迥隔西東竺庵石徑曲通如是花宫林下何殊寶月水中真機不藉僧梵清華亦有松風空翠庭隂忽落問誰習寂義公水月庵水月竺庵如是住山心精舍適於旁欲因動靜標仁智不向異同論幻常水月庵癸未一區竺宇萬山中無路其間有路通是水何妨皆是月如如大士坐觀空過嶺遂至水月庵甲申一障隔東西陟髙易降低因乘功倍局遂步熟由蹊石棧曽非遠竺廣宛若徯夕陽别嶺上滿谷晚涼凄水月菴乙酉飛來懸宇駐㟹嶆大似廣寒霄漢髙試看崖枝將澗葉也如碧海舞波濤水月菴丙戌梵區本在萬山中達觀去聲原如水月同下界每因翹絶頂廣寒何異麗虛空不生波處心恆定大寂光天相去聲總融未可於斯便止步栴檀林有路還通下東嶺遂至水月菴丁亥自西降東謂之下自東升西謂之上東西升降本何常由人謂之遂成象日之夕矣降東宜步步隂鋪就涼爽竺菴水月碧山凹恰似氷輪呈漭沆適才較量胥戲談大士如如不動想水月菴戊子樹色千峯翠浪流花宫懸是廣寒秋於中大士如如坐問爾起心分别不水月菴己丑徑似虹橋有路登月天天水映空澄來瞻恰值中元節燃百千燈祗一燈過東嶺遂至水月菴辛卯自東而升嶺謂西自西而升嶺謂東崇岡橫拖豈有改以人分别致不同適坐夕佳樓名攬山氣爓爓葉影翻丹翠秋暄未免意向涼圖就峯隂皓曦避巖樓已自髙近天略陟數武嶺造巔由斯就下乃甚易峯隂步步隨人遷熱則喜涼寒喜暖誰恆其情誰知滿水月菴中大士云如來轉物物物轉水月菴壬辰波翻萬樹碧瀛同如是中間梵宇通水月漫言虛想像琉璃界本廣寒宫水月菴癸巳憩息既已久陟降亦言歸山棧下盤旋林光鎖翠微竹庵當路中依岩闢禪扉屏營禮大士水月相去聲依稀是室豈維摩不希花雨飛水月菴甲午盤磴下崇椒岞崿更幾曲就平得小菴弗莊嚴尚朴白衣坐大士如月水中浴言一猶不可何况以二目解者曰千江真成狗尾續過東嶺至水月菴乙未自西而東謂之東自東而西謂之西彼嶺何曽有分别人自東西強謂之所以蒙莊真達者著論欲使物物齊今朝適從創得陟背夕陽指錘峯錘卓立當水月菴户如如大士蓮座徯我來屏息一瞻禮向所謂者擬啓咨是第一諦抑二諦無言之示含天倪水月菴丙申盤旋仄棧落斜深路便歸途竺宇尋大士蓮花鬚上坐如如常聽海潮音山心精舍辛巳山心有招提恰似水中月大士坐如如清淨衆香馞返聞得真寂孰髓孰為骨蔚翠自有常受虛總無竭適從西嶺下聊就北齋歇即目與題名匪云學禪悅山心精舍壬午信步入山深窈窕延幽賞攢簇羅諸峯變幻含萬象風吹林葉多秋肅鹿聲響白泉細愈颯丹楓踈益朗精舍竺菴旁計地才盈丈披忩數衆竒歷若指諸掌山心精舍灑然精舍築山陲小憩雲忩攬衆竒雙嶺回環作閽闥一峯孤柱是爐錘化工真閲煙霞表道管非從色相窺不約而來朅爾去普門水月證無為山心精舍癸未舍搆半山腰如月水中養暑熱不屢登為在雲間仰今朝隂而風巖扉覺颯爽因之命筍輿數入聲息夤緣上歷險欣得夷入狹攬益廣種松才拱把期以凌霄長山心精舍甲申四鄰青障護一徑白雲穿精舍花宫側虛忩月宇懸種松期合抱放鶴任昂肩憩坐觀元化錘峯正靣前山心精舍乙酉精舍普門傍趣佳委宛藏鹿聲隔林聽鶴羽向峯翔東澗落漲水西巖隱夕陽攀躋原覺熱憩坐頓生涼山心精舍丙戌水月菴邉搆精舍秋山四靣此為心向東一線開虗白正映錘峯返照臨山心精舍丁亥菴傍精舍衆山心翠展屏風具四臨觸目何曾勞應接興懷惟是契深沉收雲萬樹生新色過雨千溪吐細音著句便成成便去所欣芥了無侵山心精舍戊子林嵐窅映處精舍搆其間到此意為寂偶然幾值間空青淨秋氣潑黛沐峯鬟安得長居是佺喬與往還山心精舍辛卯菴旁精舍號山心繚曲因之復窈深庭有香泥鹿留迹樹多嘉蔭鳥耽吟一忩風月偶來往四壁詩書自古今瞥眼不知幾閲歲種松枝幹已森森山心精舍壬辰菴旁精舍在久矣號山心地靜宜成憩徑通不藉尋峯猶落伽境樹是海潮音願力知無分隨緣且獨吟山心精舍癸巳子輿氏有言心之官則思是舍山之心其思當屬誰忩色納山光新題鄰舊詞是即其思否精舍曰不知山心精舍甲午水月菴傍精舍山心自我名之彼水固為假彼斯山豈是真斯昨去今來偶爾花香鳥語不移足識安心竟矣會麼慧可大師山心精舍乙未陟降就畝平精舍仍山心菁蔥雖四圍隙處具俯臨假借以為名其義原可尋取象艮為山其德止則諶在止於至善正心聖經針豈徒緣賞佳吾將勉自今山心精舍丙申竺宇邉傍精舍搆坐欣九夏似深秋不因儒墨尋陳迹已忘去聲筌蹄此偶遊忽遇來親林下鹿可呼相狎海中鷗山門正與東峯對謂錘峯爐錘去聲之間看舉頭山心精舍庚子精舍搆山心悠然靜且深以遙不常到偶暇一相尋忩納縈青態庭饒空翠隂鹿聲聞弗見疊樹鎖林岑山心精舍壬寅仄徑盤回下輿人亦已勞憩言有精舍遊目值秋髙閟始豁隨現放彌卷密韜山心我心得無物此中撓放鶴亭壬午或有貢鶴者綵籠巧莊校曳尾塗中龜笥藏非本好艱飛羽已翦仰食喉空呌憐其類乘軒榮不存所樂叶深山叢樾間放去任騰掉一歲養翼成二歲和子效原在山莊中施亦有佳報林家明聖致張氏雲龍調於我何有焉我意其明告既以遂煙霞亦以省粱稻叶貴適生物性非學幽人操放鶴亭對鶴作歌癸未去年放鶴因名亭今年鶴在如有情棲松友鹿頗適性餐風飲露已養翎四柱何曽與為檻鶴自不去生吾感豈伊猶憶稻粱恩此而放之翻覺慊嗟哉物類有若斯掉頭去者誠何為放鶴亭放歌山心已陟半山髙案衍西嶺實不遙過嶺即可造創得事半功倍難辭勞適百里者半九十自畫未可中路拋因之賈勇復前進或輿或步為清遨小亭又在嶺之半去年放鶴因名標鶴去不知向何處中鋗拍手徒呼招爾又非張氏之僮林氏僕翩然羽客豈能俯首逐逐隨爾曹戲題放鶴亭用今春雲龍山放鶴亭韻乙酉相如一笠搆山巔放鶴亭兹第四傳前詩雲龍瀛􅤍虎邱巔都有亭因放鶴傳蓋彼三處皆有之笑我題詩亦已屢幾曽髙致似坡仙欽定熱河志卷七十七
