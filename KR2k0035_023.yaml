body:
  text: 徠逺一山莊為秋獮廵莅之地自西事肇始暨武功告成諸部欵闗逺人納賮仰流鱗集咸萃茲土我皇上徳威遐暢懐柔綏馭之方踰越曩牒若都爾伯特若哈薩克布魯特等部久𨽻臣僕逮歲辛夘土爾扈特全部向風内靣䟦渉萬有餘里不招自徠聖化所被訖於無外庚子嵗恭遇七旬萬壽班禪額爾徳呢自後藏入覲祝釐益欽聲名洋溢中外一家之盛謹先後臚次而錫封賜宴諸典依類恭紀志徠逺第三乾隆十九年上詣盛京恭謁祖陵駕幸熱河凖噶爾都爾伯特台吉䇿凌䇿凌烏巴什䇿凌孟克等來朝御製詩甲戌至避暑山莊日都爾伯特台吉策凌等接見路左傾誠候属車來歸憐逺自員渠識時稱傑惟嘉爾敷徳賔遐何有予錫爵都教加衮服賜飱還擬賦嘉魚一家中外歡言暢底事周官藉象胥流杯亭小宴都爾伯特親王䇿凌等宛轉清流繞石渠羽觴小宴欵康居呼前手賜笑言接喜可身偱禮法初荒畧從來事抔飲傾誠那解飾虚譽褭蹏錦叚頒中禁滿載歸教豔拂廬宴都爾伯特親王䇿凌郡王䇿凌烏巴什等於萬樹園詩以紀事萬樹参天煥曙霞穹廬酒醴樂柔遐薰風五月偏含爽湛露三廵共拜嘉天與人歸寧可拒茅分爵錫自應加徴招應律歡情洽試聼編鐘設虡牙渠搜何必鎮天驕來賀傾誠不憚遙外廐馬為中廐獻新賔人併舊賔邀時四十九旗扎薩克并青海諸部王公台吉畢集行在皆令入宴鐻鍝自可随方俗冠服同教式本朝䇿凌等入覲後即賚以冠服俱従本朝之制避暑匪今厪惠逺千秋家法仰仁堯山莊燈詞八首傍晩山雲静碧空芳園萬樹幕當中鐻鍝君長新來享應許觀燈示大同火樹騰輝暎綠雲鳯簫聲應鹿鳴聞御園節景年年賞誰識山莊逈出羣巖風入夕覺輕寒五月烟花快意看更向幔城舉首望錘峯早挂玉輪團玉蛾火蕋勢飄蕭借助琳巒落翠標今嵗不惟逢閏月都稱閏得上元宵玉塞天寛不礙月雲莊夜静恰宜燈法輪輝朗空王現膜拜殊勝碧眼僧何必夏惟夜方短果然燈與月為縁黄沙青海胥來賀湛露薰風普預筵龍膏鶴燄光明蔵翠柏青楓澹蕩宵嘉客欣看千帳會詞臣漫詡九瀛朝倒椀吞刀百戲陳昇平歌裏踏燈輪重䄄列坐歡情洽底用通言藉舌人先是乾隆十八年十一月定邉左副將軍成袞扎布奏言準噶爾都爾伯特台吉䇿凌䇿凌烏巴什䇿凌孟克等率部衆三千餘户來降暫駐厄克阿拉爾遣使告稱準噶爾逹瓦齊自立後與小策凌敦多卜之孫訥墨庫濟爾哈爾連嵗搆兵策凌等惶惑莫知所從因相與計議投誠天朝以求永逺生聚於十月二十一日由伊犁河起行來至卡倫等語奏入上命成袞扎布即遣軍營大員傳諭䇿凌等由厄克阿拉爾移入卡倫内分給牛羊口糧擇地安挿尋命侍郎玉保傳㫖往諭復諭成袞扎布俟䇿凌䇿凌烏巴什到軍營時即行傳諭伊等逺來歸誠必急於瞻仰朕躬但䝉古部落中未經出痘者甚多京城氣候與邉塞不同伊等到此即傷一僕從朕心亦為不忍著將伊等及所部詳悉詢明曽否出痘再行酌量同來不可忽畧况明年夏令朕廵幸熱河其地較京城涼爽若今冬未得前來將來自可於彼處瞻仰更與入京無異繼勿汲汲赴京轉負朕矜恤之意旋㨿玉保奏言䇿凌等聞命感激跪泣云噶爾丹䇿零時我等即思歸順大皇帝其時法度頗嚴人心未變今逹瓦齊等搆兵無已俱來調遣不得安生是以歸命大皇帝久思瞻仰天顔䝉將軍等傳奉諭㫖以口内炎熱我等未經出痘者多若傷一僕從聖心亦為不忍誠不勝欽感但我等螻蟻微生未得瞻仰大皇帝心實不安懇祈代奏於明年聖駕廵幸時俾得遂瞻仰之願等語至是䇿凌等抵熱河五月庚寅上至避暑山中都爾伯特台吉䇿凌䇿凌烏巴什䇿凌凌孟克等扵道旁跪迎聖駕辛夘上御澹泊敬誠殿受朝䇿凌䇿凌烏巴什䇿凌孟克等行禮如儀詔封䇿凌為親王䇿凌烏巴什為郡王䇿凌孟克塞卜騰為貝勒孟克特穆爾班殊爾根敦為貝子瑪什巴圖剛巴圖孟克為公逹什敦多卜恭沙喇巴爾為頭等台吉均授為扎薩克至二十年晉封䇿凌為特古思庫魯克汗䇿凌烏巴什為親王䇿凌孟克為郡王等爵各有差其來降諸台吉之来至熱河者不具録並賜冠服復申諭䇿凌等各約束教養所屬安分謀生以副上恩壬辰上御延薰山館賜䇿凌等宴甲午上御萬樹園賜䇿凌等及凖噶爾來使敦多克是年閏四月陜甘總督永常奏報準噶爾使人入境時逹瓦齊欲求貿易遣使來請等宴乙未復御萬樹園賜宴賜觀火戯丙申至戊戍亦如之己亥復賜䇿凌等宴庚子亦如之謹按西陲用兵始末具詳御製詩文及欽定方畧兹苐就有事熱河者錄之是年為經理西陲之始準噶爾内亂相尋諸部離貳稔惡已滿然非諸䧏人絡繹欵塞亦無由盡得要領我皇上於前後事機洞若觀火一興問罪之師而電激風馳大勲遂集五年之内平準夷定囘部拓地二萬餘里皆由神謨獨㫁力排羣議所以上承天祐迅告武成至於額魯特諸部自䇿凌等降附後聞風納欵率屬偕徠厥後若綽羅斯和碩特輝特等部成以叛亂翦滅惟都爾伯特部忠謹獨存列爵編旗永為臣僕斯又聖朝柔逺之仁所由威服與徳懐各得其道矣是年十一月上再幸熱河準噶爾輝特台吉阿睦爾撤納和碩特台吉班殊爾都爾伯特台吉納墨庫等來朝御製詩甲戍凖噶爾輝特部台吉阿睦爾撤納歸誠信至詩以識事恵逮條枝宴賚陪駐避暑山莊賜宴都爾伯特台吉䇿凌等封以王公等爵命返遊牧烏孫又報挈羣來敢云徳化俾苖格信是天恩致宇恢重賞崇封吾豈靳推心置腹彼何猜山莊計日應重到將以冬月復臨熱河晉見施恩深意當年萬載培至避暑山莊日輝特台吉阿睦爾撤納等接見冬節山莊此重去聲尋衝寒為慰逺藩心開疆擴土非吾志機輳人歸藉帝臨朕自登極以來初無用兵意邇年凖夷内亂纂奪相仍都爾伯特輝特和碩特諸台吉率衆来歸先後接踵既當為降人籌久長計且實有可乗之機皆藉上蒼黙眷云迎蹕翹瞻猶卉服詰朝寵錫易華簮薰風五月員渠宴壁上詩牋一再吟錫封輝特親王阿睦爾撤納等謝恩朝見詩以紀事初秋欵塞柏冬權山館来迎表寸丹阿睦爾撤納以七月至即請入覲朕因其未出痘命俟東廵逥蹕至熱河迎謁中國懐柔寜過厚逺人禮數且從寛乍瞻大典身猶踧得厠親藩意倍歡阿睦爾撤納同来歸附渠長二十餘人各錫郡王貝勒公封爵均命為札薩克與内札薩克諸藩等寵示諸侯王上位漢家終是畏呼韓賜宴輝特親王阿睦爾撤納等詩以紀事黄幄高張宴析支懐音内面後先隨敷文底事稱干羽施恵何難與解推疆埸都欣効奔走命阿睦爾撒納赴北路軍營以來年出師意甚踴躍衣冠已覺習威儀来歸諸台吉皆賜冠服入宴時拜跪如禮晚来燈景還教預恰值冰輪正滿時是日仲冬之望即事松塢雲莊往復還新藩三接恰餘閒歸心底限窮邊外繼踵頻来數月間今年两至熱河五月中歸誠之都爾伯特台吉䇿凌等迎謁加恩燕賚錫爵冇羌比輝特台吉阿睦爾撒納繼至復以冬至復駐山莊受朝錫賚如初頃烏良海宰桑禡木特等降附則因其已出痘即於京師見之便擬皇風浹西海果然積雪㸔南山南山積雪為三十六景之一舊作有留觀直待到深冬之句蜃牕萬景供吟凭冰磴寒林懶試攀先是八月定邉左副將軍䇿楞奏言準噶爾輝特台吉阿睦爾撤納等遣使至卡倫告稱阿睦爾措納班殊爾訥墨庫等自博束齊烏英齊率所部四千餘户來降且言阿睦爾撤納原住塔爾巴噶台因逹瓦齊遣宰桑竒塔特額布進烏克圖等三人來侵與力戰敗之移居都蘭哈逹逹瓦齊又遣䇿凌巴雅爾等來追又敗之於哈布齊垓河其後宰桑布林復來亦力戰敗去我等交戰時台吉諾爾布宰桑瑪木特宰桑哈薩克沙拉等帶領額魯特烏梁海兵八千擄我游牧阿睦爾撤納遣其兄扎木參追至額爾齊斯河與戰復敗之我等即移牧向内又遇扎那噶爾布帶兵追截扎木參又敗之方得前進並搶得瑪木特屬下六十餘户及牲畜等物行走四十餘日到此等語奏入上命貝子扎拉豐阿等齎賞前往𫝊諭又命參贊大臣薩喇爾自軍臺迎勞阿睦爾撤納等頒賞俟冬令聖駕迴鑾派侍郎玉保帶赴熱河朝謁復以阿睦爾撤納及班珠爾訥墨庫逺來各賜辦裝銀両牛馬羊隻俾資生計至是阿睦爾撤納等抵熱河戊子上至避暑山莊輝特台吉阿睦爾撤納和碩特台吉班珠爾都爾伯特台吉訥墨庫等於廣仁嶺道旁跪迎聖駕上駐蹕避暑山莊召見阿睦爾撤納班殊爾訥墨庫等賜茶召封輝特部阿睦爾撤納為親王和碩特部班殊爾都爾伯特部訥墨庫為郡王輝特部扎木參齊木庫爾都爾伯特部剛多爾濟巴圖博羅特為貝勒輝特部徳濟特普爾普克什克都爾伯特部布圖克森額爾徳尼洛壘原端為貝子輝特部根敦扎卜固木扎卜和碩特部納噶查都爾伯特部布穆特古斯孟克博羅特為公輝特部伊什克什克特都爾伯特部烏巴什伯勒克為頭等台吉均授為扎薩克並賜冠服復申諭阿睦爾撤納等以安分供職遵循訓㫖永逺荷恩已丑上御澹泊敬誠殿受朝設儀仗奏樂阿睦爾撤納班珠爾訥墨庫等謝恩行禮如儀上御延薫山館賜阿睦爾撤納等宴庚寅上御萬樹園賜阿睦爾撤納等宴辛夘復御萬樹園賜宴賜觀火戲壬辰至甲午亦如之乾隆二十年上秋獮木蘭準噶爾綽羅斯台吉噶爾藏多爾濟輝特台吉巴雅爾和碩特台吉沙克多爾曼濟等來朝上自木蘭迴鑾至熱河和碩特台吉塞布騰等來朝御製詩乙亥駐蹕興安綽羅斯台吉噶爾藏多爾濟等來謁詩以紀事定逺非勞一矢加仰流鱗集不辭遐烏孫歸去新䝉號觻得頻來共拜嘉開宴旋當賚黼黻俟至熱河合新舊諸䝉古王台吉普加宴賚賜新至者冠服是日先賜鞍馬扈圍先此賜駰騢朝家獮狩應教預慢擬長楊事大誇命噶爾藏多爾濟諸台吉隨圍即事得句懐恵無勞詠匪茹櫜鞬左右聽相於底須嶻嶭㭬為弋自有興安周作阹子弟三韓善枉矢後先四部讋穿鐻厄魯特四姓又謂之衛拉特四部山莊指日旋清蹕凱宴還賡零露湑宴噶爾藏多爾濟等即席得句風清日朗好秋時嘉會新藩式燕儀衆建一如札薩克悉臣今逮綽羅斯四衛拉時綽羅斯氏為彼中正派向未内附兹始封噶爾藏多爾濟為綽羅斯汗其餘王公及札薩克以次分封一如喀爾喀及内四十九旗之制露瀼畢令霑三爵䝉古善飲酒而厄魯特為尤甚是日汗王及諸台吉皆手賜三爵月上仍教閲九枝是夕陳烟火賜觀詎我懐柔能致逺神堯威恵萬年垂萬樹園燈詞舉首錘峯月正圎蓮花萬樹爓輝鮮乍教秋夕成春夕共道今年勝去年觻得鈞耆昔受盟賜觀燈事沐光榮綽羅斯氏彼中貴共拜新恩奉大清底須節物玉粱餻菊酒纔過興尚豪四靣雲山絶頂處勝他元胄共登高黄幕穹廬向逺開燈光月色共徘徊紫霞滿酌親分賜毳服儒冠襍遝來内外䝉古汗王台吉以次召至御前賜酒内廷詞臣亦得與賜烟火三畨萬樹園去嵗夏宴都爾伯特冬宴輝特和碩詩今始合四部衛拉特而封以漢王各爵銀花髙下玉蛾繁今宵未弛金吾禁自九月十三至十五凡三夕都道居然度上元蚖膏鶴燄千重艷雞踏龍銜萬種竒㝡愛鹿鳴青嶂外分明鼓瑟譜周詩照夜華鐙陳雁塞借春碧海戴鼇山綵牋書得新詞就賡韻還催侍従班九月龍堆了不寒金鳬銀燕萬枝攅恩膏永欲遐方被宴賞寜尋一己歡先是三月定邉右副將軍薩喇爾奏言準噶爾綽羅斯台吉噶爾藏多爾濟等遣使告稱情願率屬投誠上命侍郎玉保前徃𫝊諭頒賞尋又奏輝特台吉巴雅爾等率屬投誠復命侍衛端濟布前往宣㫖頒賞又和碩特台吉沙克都爾曼濟等亦由北路來降上命扎拉豐阿在西路阿蘭㤗在北路帶領各台吉等前赴熱河朝謁又和碩特台吉塞布騰等亦同時來降朝謁至是噶爾藏多爾濟等先後抵熱河九月甲戍上駐蹕扎克丹卾佛洛大營綽羅斯台吉噶爾藏多爾濟輝特台吉巴雅爾和碩特台吉沙克都爾曼濟等於道旁跪迎聖駕上御行殿召見噶爾藏多爾濟巴雅爾沙克多爾曼濟等即命扈從觀圍並賜鞍馬壬午聖駕迴駐避暑山莊癸未上御澹泊敬誠殿受朝噶爾藏多爾濟巴雅爾沙克都爾曼濟等行禮如儀詔封噶爾藏多爾濟為綽羅斯汗巴雅爾為輝特汗沙克都爾曼濟為和碩特汗和通額黙根逹瓦布魯爾為公巴㤗曼集鄂勒春逹克巴為扎薩克頭等台吉並賜冠服復申諭噶爾藏多爾濟等以董率所屬各勒教養永受上恩賜噶爾藏多爾濟等宴甲申復賜噶爾藏多爾濟等宴上御萬樹園賜觀火戲乙酉丙戌亦如之己丑復賜宴庚寅至壬辰亦如之乙未準噶爾和碩特台吉塞布騰等至上御澹泊敬誠殿受朝塞布騰等行禮如儀詔封塞布騰巴桑為公三濟特洪郭爾為扎薩克頭等台吉特墨齊巴爾濟逹克巴為閑散台吉並賜冠服復申諭塞布騰等以董率所屬各勒教養永受上恩賜塞布騰等宴丙申亦如之丁酉上御萬樹園賜塞布騰等宴並觀火戯十月辛丑朔復賜宴壬寅乙已亦如之丙午復賜宴御萬樹園賜觀火戯丁未復御萬樹園賜宴謹按凖噶爾以逹瓦齊之亂諸部台吉等率屬欵闗後先踵至我皇上俯納其降錫之封爵遂由西北两路進師長驅直入迅奏膚功維時伊犁既平擒厥渠魁輯安新附以凖噶爾舊有四衛拉特仍其部落各置汗為長衆建王公各安游牧我皇上繼絶舉廢之心與覆幬同量乃阿睦爾撤納中途逃叛羣黨相繼煽亂於是王師再整重定伊犁天山南北永歸綏靖其事以屢變而愈康其功乃一勞而永逸此以知天心佑順必欲使之咸入版圖霑我皇化惟聖主奉天時若運籌握䇿悉協機宜葢聖心即天心矣乾隆二十一年上秋獮木蘭都爾伯特台吉伯仆阿噶什烏巴仆等土爾扈特敦嚕布喇什遣使吹扎卜等來朝上自木蘭迴鑾至熱河吐魯番莽阿里克遣子白和卓來朝御製詩丙子都爾伯特台吉伯什阿噶什來覲封為親王詩以紀事來歸就弟兄前年來歸之䇿凌策凌烏巴什皆其同族弟兄嚮化慕簪纓不作逆天黨伯什阿噶什曾於軍營告逆賊阿睦爾撤納反謀逆賊招之不赴惟殷捧日誠用兹嘉乃績便與錫殊榮式戒蜩螗沸永遵帶礪盟宴土爾扈特使臣烏孫别種限羅义土爾扈特亦凖噶爾厄魯特也舊為四衛拉特之一日綽羅斯曰都爾伯特曰和碩特曰土爾扈特䇿妄阿拉布坦時與土爾扈特構釁土爾扈特全部西北去乃名輝特為一衛拉特故今土爾扈特南則限扵哈薩克東則限於俄羅斯欲至中國必假道扵俄羅斯俄羅斯又名羅义云假道﨑嶇歲月賖戌年自彼部起程今始至天闕不辭欽獻賮雪山何礙許熬茶䝉古以詣西藏熬茶為要務故並許之覆幬誰可殊圓蓋中外由來夲一家彼以誠輸以誠恵無心蜀望更勤遐萬樹園宴都爾伯特親王伯什阿噶什及土爾扈特使臣吹扎卜即席得句碧霄晴旭曉光澄穹幕高張翠毾㲪禮法不拘從所習友羣何礙集相仍捧盈常切子心懼奠逺惟欽祖徳慿萬樹清暉懸聖日未曾可識昔猶曾萬樹園賜都爾伯特親王伯什阿噶什及土爾扈特來使觀燈鱗集來王有後先堅昆馳使又踪連衢樽錫宴前朝洽寳炬装燈午夜妍銀燕火蛾紛樹下驚麞駭鹿避崕巔侈觀詎為誇遐屬曶爽光明示别權先是二十年六月定北將軍班第等奏言都爾伯特台吉伯什阿噶什等率所部四千餘户來降並以哈薩克部情形告上嘉之封伯什阿噶什為親王台吉烏巴什為貝子諭以明年赴熱河朝謁又土爾扈特部長敦嚕布喇什遣使扎卜等假道俄羅斯入貢又吐魯番部莽阿里克請將其族人設旗編佐領上命加㤙封莽阿里克為公莽阿里克復遣其子入朝至是伯什阿噶什等先後抵熱河八月壬戌上駐蹕張三營行宫是日都爾伯特台吉伯什阿噶什烏巴什等至上御行殿召見賜茶復賜宴九月甲戍駐蹕鄂爾楚克大營賜伯什阿噶什等宴丁丑駐蹕按巴﨣和洛大營是日土爾扈特台吉敦嚕布喇什使臣吹扎卜至上御行殿召見賜茶復賜宴丁亥駐蹕張三營行宫賜伯什阿噶什烏巴什吹扎卜等宴庚寅駕迴駐避暑山莊辛夘上御澹泊敬誠殿受朝都爾伯特親王伯什阿噶什貝子烏巴什土爾扈特使臣吹扎卜吐魯畨公莽阿里克之子白和卓等行禮如儀宴賚有差閏九月丙申朔上御萬樹園賜伯什阿噶什烏巴什吹扎卜白和卓等晏凡六日乾隆二十二年上秋獮木蘭左部哈薩克汗阿布賚遣使根扎噶喇等來朝御製詩丁丑哈薩克使臣至令随圍獵並成是什伊古從來化外蠲間闗馳使逺朝天不知中土歲月日乃隔長安萬二千塞外便教預獵喜山荘旋與錫恩駢即今行國多天馬附會誰窮太史編哈薩克在漢為西域地史漢所記匃奴在北西南夷在西南西域諸國在西為最遼逺相傳哈薩克為古大宛然史記言大宛為城郭之國則正今之揶爾竒穆哈什哈爾及土魯畨一帶囬部非哈薩克也哈薩克雖亦囬教而實行國與布魯特同俗又所稱大宛産苜蓿葡萄今哈薩克亦絶無徒以產馬與大宛相似然西北諸部何處不產馬耶盖漢時大宛烏孫康居奄蔡月氏扞罙于闐諸國綂為西域而大宛部落强盛附庸者多哈薩克在彼時當是其部中之一國耳史記稱大宛東北則烏孫而土魯畨之東此即額魯特諸部烏孫䝉古語謂水也額魯特逐水草而居史所謂隨畜與匈奴同俗者也且今哈薩克在額魯特之北是又不同矣史稱大宛東則扞罙于闐扞罙音韻與今之哈宻為近史記之扞罙漢書作扞彌又或作拘彌而史記所載為最先漢書之扞彌或因字畫偶誤相沿不改展轉訛謬至云拘彌則益失之逺矣且于寘于闐音聲逈異二者之間必有一誤于寘絶無可考于闐產玉厯代相傳今囬部之和闐水多美玉當為于闐故地也益知大宛非定哈薩克明矣或又以哈宻為古伊吾引厯代開田屯兵建設州郡為據然焉知非漢占伊吾之地屯田設戊而扞罙乃西遷近于闐而居乎又安知非中國浸微而扜罙仍来其故處乎在昔夷漢言語絶不相通所傳不免悠謬今文武将吏往来西域與行内地無異則史所謂大宛烏孫康居奄蔡月氏扞罙于闐諸國與今之額魯特哈薩克布魯特揶爾竒穆哈什哈爾其同異大小皆可以次而徐考且厯代傳記西域諸國所云勝兵數百者其寔不過如今之凖噶爾廿一昂吉之一囬部賽里木阿克蘇等小城有一酋長即可稱一國之𩔖耳設以今所定凖噶爾哈薩克及囬部相較則史所稱西域三十六國者不啻九牛一毛矣必執史漢為據則司馬遷班固並未身厯其地即至其地而語言不通文字不曉其傳訛有必然者故注其大畧如右寄題哈薩克獨樹有序哈薩克西北隅有獨樹一株其上五枝盤拏陰廣可蔽二百騎哈薩克謂之鄂埒引噶克义莫朶鄂埒者河名噶克义莫朶者獨樹之謂本土爾扈特所稱名也樹生河源久聞其語今問之來使信然夫宇宙之大何竒不有然非實據見聞者奚足稱焉昔既為長白瑞樹歌今復悉此物必有對其理信然獨惜其逺處天末異域伊古及今文人學士且不聞其名安能𫝊其實㸃筆紀事盖不如漆園寓物謬悠而已獨樹鬰輪囷物惟久故神哈薩克過其下者必膜拜供獻而不敢稱其名盖如䝉古之卾博矣卾博見舊作詩卷中陰周二百騎嵗閲八千春建木誰曾見竒蹤我所詢依稀北谷子䭀飯此修真道書登真隠訣云䭀飯方受西梁真人時在大宛北谷萬樹園宴哈薩克使臣詩以紀事萬樹丹青艷霽霜秋陽送暖似春陽多須深月遵典屬卾畚槎耏二處皆哈薩克地名歸職方耀武未煩貳師李窮源底藉鑿空張近安逺服休稱慶益勵吾心敬不遑九月十五日賜哈薩克使臣觀燈火九瀛一合貴山朝火樹依前絳蠟燒可識仙莊原月宇只疑鹽澤接星橋霜林葉落還装葉霞嶠標藏重去聲建標恵逺行時詎尋樂謾稱預節賞元宵先是六月定邉右副將軍兆惠奏言哈薩克阿布賚遣使四人進馬四匹告稱願率全部歸順其弟阿比里斯附遣使二人賫托忒字表文投誠入覲至是根扎噶喇等抵木蘭九月甲午上駐蹕布祜圖大營御行殿左部哈薩克汗阿布賚使臣根扎噶喇烏木魯台都楞阿蘭扎阿布賚之弟阿比里斯使臣塔那錫白克奈行禮如儀賜茶復賜宴即命扈從觀圍戊戍駐蹕張三營行宫賜根扎噶喇等處辛丑駕迴駐避暑山荘壬寅賜根扎噶喇等晏癸夘復賜宴上御萬樹園賜觀火戲立馬技甲辰復御萬樹園賜宴觀火戲乙巳上御卷阿勝境賜根扎噶喇等宴乾隆二十三年上秋獮木蘭東布魯特瑪木特呼里拜邁塔克遣使車里克齊舍爾伯克舒庫爾等來朝御製詩戊寅布魯特使臣至賜宴即席得句七戎舜教逺難稽布露通唐付狄鞮布魯特自古未通中國考唐書西域傳始載布露或云勃律有大小兩王其時雖稱内屬不過覊縻勿絶而已部昔两王稱大小人今一派别東西布魯特有東西之號在東者分卾拓克為五在西者分卾拓克為十五新恩恰值伊綿峪布祜圖昻阿乙亥歲平準噶爾噶爾藏多爾濟等来朝扵此丁丑哈薩克歸化使臣根札噶喇亦来朝扵此今歲布魯特歸化其使臣亦適朝覲扵此地靈佳兆有如此神竒者因名其峪曰伊綿伊綿者國語會極歸極之意也舊識兼逄逹瓦齊時逹瓦齊扈駕預宴詢諸使臣知其舊為台吉時曽識之笑語甚􅌚勤逺拓邊凜古戒捧盈恭已奉天禔萬樹園宴布魯特即席得句鱗集仰流鹿食苹筵開萬樹洽輿情舊藩毎㸔聨新部夜雨剛欣凑午晴聲教逺通婆夷水恩膏直逮孽多城敢云揚烈幸無忝惟益臨深勵守成萬樹園賜布魯特人觀燈火錘峯正掛玉輪盈時九月望日夕合燦煙花惬逺情卉服毳裳朝麗正山荘正門名逖䟽曶爽耀光明從來不識燈王法布魯特本囘部不似䝉古敬黄教幻裏疑逰迦布城彼處地名嵗嵗山莊行盛典心殷保㤗益屏營先是七月定邉將軍兆恵奏言據侍衛托倫㤗告稱招服霍索楚卾拓克頭目邁塔克啟台鄂拓克頭目喀喇博托等遣人來言東布魯特分左右翼右翼瑪木特呼里拜等管領左翼喀喇博托等管領霍索楚啟台兩卾拓克各千餘尸情願投誠又奏㨿侍衛烏爾登招服塔拉斯頭目瑪木特呼里拜並請遣使朝貢瑪木特呼里拜遣車里喀齊及其弟舍爾伯克邁塔克遣其弟舒庫爾其克喇博托所遣侄哈畢啟病留中途至是車里克齊等先後抵木蘭九月丙戌上駐蹕布祜圖大營是日東布魯特瑪木特呼里拜使臣車里克齊至上御行殿召見賜宴以連年西域諸部降附俱於此朝謁賜名伊綿峪己丑駐蹕薩爾巴里哈逹大營是日東布魯特瑪木特呼里拜使臣舍爾伯克至上御行殿召見賜宴辛邜駐蹕烏蘭哈逹大營是日東布魯特邁逹克使臣舒庫爾至上御行殿召見賜宴壬辰駐蹕阿貴圖大營賜車里克齊等晏丙申駕迴駐避暑山莊丁酉上御澹泊敬誠殿受朝東布魯特使臣車里克齊舍爾伯克舒庫爾行禮如儀賜茶復賜宴上御萬樹園賜車里克齊等觀火戲立馬技戊戍復御萬樹園賜宴並觀火戲是月右部哈薩克汗阿比里斯投誠奏至木蘭行在御製詩戊寅右部哈薩克歸化遣使朝貢詩以紀事有序右部哈薩克其汗曰阿比里斯與塔什罕城囘人等接壤襍居地廣人稠不下左部阿布賚所屬向為厄魯特間阻未通聲教今年秋叅贊大臣都統富徳追捕凖夷餘孽哈薩克錫拉兵至其地會塔什罕與右部哈薩克搆釁互撃因遣侍衛蒙固爾岱等宣諭威徳哈薩克叩首輸誠即日遣使朝貢而囘目莫爾多薩木什和卓亦悔悟息争並令頭目同時入覲念兵非得已而所至如歸披閲郵函輙臚其縁起如此偏師西海𠞰逋逃取便恩宣雜種曺豈謂解紛更釋難時右部與囘人方背水决勝䝉固爾岱等單騎入两陣間指揮宣檄即解甲聼命匪徵目宿與葡萄情歆左部榮同被其䟽畧云右部素與左部阿布賚同為雄長今得均𨽻臣僕自効請倍左部語尤愷摰徳慙去聲兩階會偶遭厚往薄來九經式持盈保㤗一心撡謹按軍營奏報右部哈薩克歸化上幸木蘭恭紀是編其使人扵是年十一月在盤山入覲隨至南苑與觀大閲偹詳方畧兹不具錄欽定熱河志卷二十三
