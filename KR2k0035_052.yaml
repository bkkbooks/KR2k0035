body:
  text: 疆域四豐寧縣即四旗㕔豐寧縣治在土城子為鑲白旗察哈爾地東正藍旗北正白旗西鑲黄旗東西距五百二十里南北距二百二十里縣治東至正藍旗荒地接承徳府界二百五十里西至鑲黄旗十八盤嶺接口北道屬獨石口㕔界二百七十里南至鑲白旗博羅梁接灤平縣界六十里北至正白旗半壁山接圍塲界一百六十里東南至正藍旗中闗接承徳府界一百八十里西南至鑲黄旗大草坪梁接獨石口㕔及灤平縣界二百八十里東北至正藍旗官家厰接圍塲界二百八十里西北至鑲黄旗僧機圖嶺接口北道屬多倫諾爾㕔界三百二十里自縣治至熱河行宫一百八十里縣屬村莊詳載於後土城子為豐寧縣治及土城子廵檢司治縣屬鑲白旗地以土城子為中東西距九十里南北距六十八里東至北店子接正白旗界三十里西至鐡家伙梁接鑲黄旗界六十里南至波羅梁接灤平縣界六十里北至千佛寺接正白旗界八里東南至興隆莊接灤平縣界五十里西南至官兒嶺接鑲黄旗界二十里東北至北什巴爾台接圍塲界一百五十里西北至猪首營接正白旗界十五里元寳山溝在縣治東六里東南有元寳山頭道營在元寳山溝東四里北店子在頭道營東二十里東接正白旗界灤河經流其北以上為鑲白旗東境周家營在北店子東南十五里中踰灤河太平莊在周家營南二里興隆莊在太平莊南三里南接灤平縣界以上為鑲白旗東南境鞍口在縣治南十二里孤房兒在鞍口南十三里哨虎營在孤房兒南十五里波羅梁在哨虎營東南二十里設波羅梁汛南接灤平縣界以上為鑲白旗南境白家營在縣治西三里門家營在白家營西南十七里新莊兒在門家營西八里安家營在新莊兒西北十二里西即鐡家伙梁接鑲黄旗界以上為鑲白旗西境沙智營在縣治西北十里猪首營在沙智營北五里北接正白旗界以上為鑲白旗北境少府營在土城子東三十里至北店子東入正白旗界又東七十里至此復為鑲白旗境和尚營在少府營北十四里西南有五峰山台吉營在和尚營西五里八檔營在和尚營北六里西北境有白雲山宰桑牛录在八檔營北二十里伊瑪圖川經流其東濟爾哈朗圖在宰桑牛录西北五里有行宫喇嘛柵在宰桑牛录北十里白虎溝在喇嘛柵北十里設白虎汛髙麗營在白虎溝西北十五里桞條溝在髙麗營北十五里歩歩溝在桞條溝北十里阿穆呼朗圖在歩歩溝西五里有行宫阿拉超爾營在歩歩溝西北十二里蘇魯克在阿拉超爾營北十二里北什巴爾台在蘓魯克北六里北即伊瑪圖口接圍塲界伊瑪圖川從此入口南行至宰桑牛录俱伊瑪圖川經流䖏以上為鑲白旗東北境右察哈爾鑲白旗地黄姑屯為黄姑屯廵檢司治在縣治西一百二十里即波羅河屯有行宫縣屬正藍旗地以黄姑屯為中東西距二百里南北距七十八里東至官家營接承徳府界八十里西至沙石堆接正白旗界一百二十里南至冷水頭接灤平縣界三十里北至坡頼村接承徳府界四十八里東南至中闗接承徳府界六十里西南至諾海營接正白旗界五十里東北至官家厰接圍塲界一百四十里西北至孫家營接鑲白旗界一百二十里伊遜河溝在黄姑屯東稍北十里東北有筆架峯噶岱溝在伊遜河溝東四十五里官家營在噶岱溝東稍北二十五里以上為正藍旗東境什巴爾台在黄姑屯東南二十里有行宫韓麻營在什巴爾台東南十里有韓麻營汛麻花營在韓麻營南十里石洞子在麻花營西南十里西有雲光洞中闗在麻花營南二十里有行宫南有固都爾呼逹巴罕又東踰固都爾呼河有興隆山玲瓏峰其南接承徳府界以上為正藍旗東南境順徳溝在黄姑屯南稍東十里金厰梁在順徳溝南稍東二十里赤土梁在黄姑屯南十里冷水頭在赤土梁南二十里以上為正藍旗南境諾海營在黄姑屯西南五里為正藍旗西南境藍旗營在黄姑屯西十二里即入正白旗頭道營界又西八里為鑲白旗少府營界又稍北五里至此復為正藍旗界趙小厮溝在藍旗營北又入鑲白旗之和尚營界至白虎溝復西共八十五里至此復為鑲藍旗界沙石堆在趙小厮溝西北二十里西接正白旗界以上為正藍旗西北境苖道營在黄姑屯西北二十二里其西有苔山靠山營在苖道營西北二十五里平頂山在靠山營西北三十里通事營在平頂山西北十里尹家營在通事營西北十里烏圖厰在尹家營西北五里十間房在烏圖厰西北十里孫家營在十間房西北十里西接鑲白旗界以上為正藍旗北稍西境阿拉營在黄姑屯北五里四間房在阿拉營北十里和洛營在四間房北二里大湯頭溝在和洛營北十里設大湯頭溝汛沈家屯在大湯頭溝北十里坡頼村在沈家屯北八里北接承徳府界伊遜河于此入境經流其東以上為正藍旗北境張家營在黄姑屯東八十里之官家營東北五里韓家營在張家營東北五里喇嘛廟在韓家營東北五里荒地在喇嘛廟東北十五里設荒地汛官家厰在荒地北三十里北接圍塲界以上為正藍旗東北境右察哈爾正藍旗地郭家屯為郭家屯巡檢司治在縣治北一百里大灤河經流其北小灤河會而東南流縣屬正白旗地以郭家屯為中東西距一百十里南南北距一百五十二里東至沙石堆二道營接正藍旗界三十里西至沙爾呼山梁接鑲黄旗界八十里南至千佛寺接鑲白旗界九十二里北至半壁山接圍塲界六十里東南至四道營接灤平縣界一百八十七里西南至佟家柵接鑲白旗界一百三里東北至陳家溝接圍塲界二十里西北至蘓家店接鑲黄旗界六十里湯頭溝門在郭家屯東十八里沙石堆二道營在湯頭溝東十二里東接正藍旗界以上為正白旗東境沙石堆三道營在沙石堆二道營南十三里大對山在沙石堆三道營南十二里中踰灤河南有大對山四道溝在大對山南五里髙家營在四道溝南七里舊郭家屯在髙家營南五里三道溝在舊郭家屯東南十三里中踰灤河馬柵子在三道溝南十里两間房在馬柵子東三十里蘓木營在两間房東十里頭道營在蘓木營東十里入鑲白旗少府營界又東八里至此復為正白旗界二道營在頭道營南八里中踰伊瑪圖川三道營在二道營南五里四道營在三道營南十二里喀卜齊爾在四道營西稍南十里中踰伊瑪圖川南接灤平縣界以上為正白旗東南境山神廟在郭家屯南三十里頭道營在山神廟南三十里二道營在頭道營南十里藍家營在二道營南十里千佛寺在藍家營南十二里南接鑲白旗界以上為正白旗南境大廟上在郭家屯西南三十里西北有黒山燕子窩在大廟上西十里荷包溝在大廟上西南二十里張小懐營在荷包溝南三里官兒營在張小懐營西稍北三十里佟家柵在官兒營南二十里南接鑲白旗界以上為正白旗西南境趙家營在郭家屯西四十里王家舖在趙家營西十里花家營在王家舖西二十里線匠營在花家營南二十里沙爾呼山梁在花家營西十里西接鑲黄旗界以上為正白旗西境𤓰地在郭家屯西北三十里摩訶兒溝在𤓰地西北十里中踰大灤河二道河在摩訶兒溝西北十里中踰大灤河蘓家店在二道河北十里中踰大灤河西北接鑲黄旗界以上為正白旗西北境郭家屯營房在郭家屯北五里東有喇嘛山設郭家屯汛熱水溝在郭家屯營房北十五里亦名魚梁子湯山在熱水溝西北二十里中踰小灤河窟窿山在湯山北十里半壁山在熱水溝北四十里北接圍塲界小灤河從此入境以上為正白旗北境陳家溝在郭家屯東北三十里東北接圍塲界為正白旗東境右察哈爾正白旗地大閣兒為大閣兒廵檢司治在縣治西一百二十里縣屬鑲黄旗地以大閣兒為中東西距二百十里南北距三百三十里東至鐡家伙梁接鑲白旗界八十里西至十八盤嶺接獨石口㕔界一百三十里南至崗子上接灤平縣界一百二十里北至僧機圖嶺接多倫諾爾㕔界二百十里東南至官兒領接鑲白旗界一百三十五里西南至大草坪梁接獨石口㕔及灤平縣界八十里東北至沙爾呼山梁接正白旗界八十里西北至伊克嶺接獨石口㕔界一百二十里四道河在大閣兒東八里蘓公廟在四道河東十七里長閣兒在蘓公廟東五里古房兒在長閣兒東十里姜家營在古房兒東十里吳家營在姜家營東十里東即鐡家伙梁接鑲白旗界以上為鑲黄旗東境龍潭溝在大閣兒東稍南五十里中踰潮河塔爾黄旗在龍潭溝南十里鑲黄旗營在塔爾黄旗東二十里頭道營在鑲黄旗營東十八里木匠營在頭道營東稍北十四里石人溝在頭道營東稍南八里山神廟在石人溝東稍北十五里東即官兒嶺接鑲白旗界以上為鑲黄旗東南境窄林兒在塔爾黄旗南二十里中踰潮河富兒營在窄林兒西南五里八間房在窄林兒南五里小遼東在八間房南二十里崗子上在小遼西南十里南接灤平縣界以上為鑲黄旗南稍東境新營子在大閣兒西稍南二十里燕子窩在大閣兒西南二十里林家營在燕子窩西南二十里和尚舖在林家營西二十五里湯上在林家營西南二十里西北有湯山下有温泉其西二十五里為平西梁接獨石口㕔界大草坪梁在湯上南二十里中踰湯河西南接獨石口㕔及灤平縣界以上為鑲黄旗西南境撒袋溝在大閣兒西十五里五道營在撒袋溝西四十里十七道溝在五道營西三十里鄧家柵在十七道溝西二十里十八盤嶺在鄧家柵西二十五里西踰湯河西接獨石口㕔界以上為鑲黄旗西境白塔兒在大閣兒北十二里六間房在白塔兒北十八里四間房在六間房西北二十里喇嘛山在四間房西北十里巴顔哈逹在喇嘛山北七十里四岔口在巴顔哈逹西北二十里設四岔口汛小嶺子在喇嘛山西北三十里伊克嶺在小嶺子西北四十里西北接獨石口㕔界以上為鑲黄旗西北境洞兒上在六間房北十五里城根營在洞兒上北二十五里上黄旗在城根營北十里設上黄旗汛劉家營在上黄旗汛稍西復北十里石遼天溝在劉營北四十里千溝門在石遼天溝北三十里中踰韮菜梁灤河驘子溝在千溝門北三十里僧機圖在驘子溝北二十里中踰灤河設僧機圖汛其北十里為僧機圖嶺接多倫諾爾㕔界以上為鑲黄旗北境大黒山在上黄旗汛東北十里東接正白旗界天財梁在僧機圖汛東稍南四十里東接正白旗界以上為鑲黄旗東北境右察哈爾鑲黄旗地欽定熱河志巻五十二
