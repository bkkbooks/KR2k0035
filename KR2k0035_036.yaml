body:
  text: 行宫十二緑雲樓創得齋緑雲樓越湧翠巖有樓聳峙地當西峪為瀑源所自出深林修翳緑影參差疊嶂層雲滃然四合額曰緑雲樓聨曰泉臨香澗落峯入碧雲高旁三楹虗敞隱映樓畔額曰木映花承聨曰風裊爐煙移晝漏月臨書幌正宵衣又前三楹額曰水月精舍聨曰空澄正印虗明體搖漾又宜流動情並皇上御題西南與珠源寺近水月清華翠洗山光鏡澄林影耳聆目遇誠造物者之無盡藏云御製詩緑雲樓庚辰就崖搆精舍出樹得高樓騁望天無際憩身雲上頭拂簷鳥影瞥隔谷鹿聲呦自是常如此我來興偶投再題緑雲樓初來緑樹蔚層甍為愛新樓輒命名一月往還看突兀恰隨天末與同征題緑雲樓辛巳巖齋領要即如樓况是真樓在上頭澗葉巒枝皆蔚翠朝嵐夕靄却澄秋心間乃自雲間得逸趣都因緑趣投何必沈家誇八詠千年風月占興州緑雲樓壬午出樹聳高樓緑雲尚爾稠蔚青俯足底繚白見山頭愛此非為雨憐他幸傲秋何來紅數點不擬再回眸緑雲樓癸未小樓臨樹杪萬葉正縝紛高處原無暑俯來總是雲松風涼颯沓花露氣氤氲棄日觀書史恧哉尊所聞緑雲樓癸未書樓拾級意為欣斂盡秋雲俯緑雲恰展韋編讀初六謂應陶侃惜加分緑雲樓甲申小樓峭崖巔崖高樓益迥上下一緑間恰似雲垂影弗雨雅宜晴含風亦惟靜鹿蹤映日迷鶴聲依露警開窗因展書趣在羲皇境緑雲樓丙戊樹葉猶然密似雲秋暄濃蔚緑氤氲何當頃刻為霖雨菜圃蕎田望正勤緑雲樓丁亥秋前密葉尚敷紛試上書樓俯緑雲正喜千林翠如滴誰教一縷白仍分近帷已潤藝青色逺嶠還封螺黛紋祗有鹿聲藏不得呦呦時共隱芝聞緑雲樓戊子緑樹偨池近逺岡翻風葉葉送微涼山田遙見罫方者却喜雲容欲作黃緑雲樓己丑豈礙雲間去不留山樓猶俯緑浮浮非緣貪看林嵐致涼送清風滿意投題緑雲樓近嶺遙峯濯黛紋雨收花木衆香聞乍來今嵗如昨嵗飛去白雲餘緑雲樹密傳聲禽喚侣泥融留迹鹿過羣山田早晚都占稔登眺因之意亦欣緑雲樓壬寅天上雲間候山中雲尚稠四鄰全是緑三架恰宜樓日處色無定風間韻若流塞田又殊致黃染欲登秋題緑雲樓癸巳層甍據崇嶺乘暇試登樓始訝俯雲表旋思出樹頭界來白微逺望去緑還稠底事頓生戀西風已報秋緑雲樓甲午莫謂雲間矣斯雲緑重不緑圍羣嶺腹雲接逺峯頭級始今朝拾句應五字留到來過平聲兩月虗擲笑何由緑雲樓乙未夏木方張王二字皆去聲山樓未寂寥三間恰臨迥一碧直連霄肯使豐隆擅還贏王母謡天風與流蕩解令暑全消題緑雲樓丙申巖樓出樹枕層椒橫嶺豎峯拱近遙却是仙莊到彌月才教迥級拾今朝昨年新句成陳迹一晌幾餘樂景撩忽訝丹邱如可遇遨遊原在碧琅霄緑雲樓己亥樹既幻稱雲雲復幻稱緑緑本非雲色雲豈真樹族是因假藉名非有惡知木真幻及是非惟偶託名目萬事似此多欲數上聲難更僕緑雲樓辛丑回廊曼轉接書樓萬樹偨池翠欲流咨爾緑雲莫張王二皆去聲可知時節已新秋緑雲樓壬寅巖樹雖高樓更高近林逺樾景無逃緑雲設與山雲合嘉􅉈即應大霈膏水月精舍庚辰精舍花宫側襟崖復帶溪松風亦常聽水月乃全提千一何分合虧盈總管倪憑觀才擬議魄影倐橫西水月精舍冬月颯可憐塞水寒未凍巖齋一再登俯暢誠堪弄心掬不以手鏡光翻在棟氷魚潛罷躍谷鳥啽猶哢聖教標清華因之緬鸞鳯水月精舍辛巳月是中秋好水當白露澄因緣真罕遘俯仰恰兹憑朗照大千界飛流百道氷花宫畔精舍靜對佛心燈水月精舍壬午臨水有山崖崖巔小築齋波心常得月座上恰宜懷半滿都無礙古今鮮並佳六情淘洗盡剩祗靜因皆水月精舍癸未月在天中水在湖不離不即那同殊謝他恆印千而一到此堪知有若無且喜小年風自爽漫言清夜景常孤亦思駐久應偷暇試證分明或可乎水月精舍遲開隄畔舫且坐嶺標居仰見天心皎俯含水面虗今朝名實副前月約期如適作有亦思駐久應偷暇試證分明或可乎之句何事曽恭指綺言習未除水月精舍甲申水本月所生月復水中含精舍據巖標得一還兼三我來每值晝清華曽未覘咄哉循色相了無契理談水月精舍丙戌尋常豈不往來見為在巖端到却稀亦以致佳故多處因之返已頓知非澗邉水映座無滓松下月臨窗有輝詎獨清華滿襟袖神心直欲契精微水月精舍丁亥巖上書齋俯澗溪水聲月色帶高低幾曽佳夕頻探景祗趂餘間偶覔題貞觀去聲兩言出想像南華六卷識端倪清宵試問饒何物沙岸紛紛印鹿蹄水月精舍戊子丹崖俯緑水精舍築崖巔秋仲方言到西南新月懸清華連上下逈意泯蹄筌元奘勤詮釋安知指上禪水月精舍詠新月己丑架屋據壁巔開窗俯溪靣秋水正澄清秋月復新見影未深林飛光已真金鍊圓固上下圓半亦上下半雖然全體在示沖偶隱現戲題水月精舍壬辰精舍迥臨巖上頭野灘潦水潄巖流一彎新月浮波委那識人間夏與秋山莊彌月此初來來亦非逢水月皚題額簷端似虛設笑豫竟屬若為哉水月精舍癸巳精舍臨石壁塞湖渟壁根名之曰水月崇情寓文言偶來每即去夜景非所論付與玻璃窗虛明恆此存别有會心者輪匡未留痕水月精舍甲午西日欲下山弦月正在水虛窗所恆見而我偶值此浮光接清華妙趣含至理誰知流蕩間屈指中秋矣水月精舍乙未峭壁十尋溪帶底上築精舍俯清泚名曰水月已有年春魄秋蟾恆在裏我惟偷暇偶一臨幾曽玩彼影娥美軒楹真是善循名我所見乃虛名耳尋思若此者多矣水月精舍丙申精舍溪邉搆翠微俯臨逺眺興遄飛三間雲閣清含潤四季氷輪朗映輝看鹿遊寧關逺害同鷗狎那藉忘機兹來更有便宜處籌筆無勞月下揮水月精舍己亥巖頂架精舍其下俯溪水溪至此而寬雅稱銀蟾委豈必泛舟棠祗須倚窗綺然而於月夕則從未憑此如是何為名寓意而已矣水月精舍辛丑精舍據厜㕒一灣碧水披對宜月光皎來每午過時祗自存其意因之屢有詩然而窗俯際非即亦非離水月精舍壬寅平岡上搆舍其下臨碧水水與月契反題額乃所以然必當夕遊方可領其美我則偶乘興日中率蒞止是乃實孤名曰寓意而矣創得齋西峪最深處踞山為屋三楹曰創得齋其後右偏為樓三楹額曰夕佳千峯夕照義取陶詩前小樓二楹曰枕碧室內榜曰一塵不到門外長松竦肅石林嵯峨悉成行列蒼顔古色罩絡羣峯之表岫壑沖深澗橋宛轉每幾餘攬勝即景會心妙趣當前都成創獲矣御製詩創得齋得句庚辰去年即鹿至山隂詭石蒼松悅可心小築書齋稱創得欣逢秋日此經臨軒楹雖早胸中寫圖畫真從物外尋記取拈毫最初句從今有暇便來吟再題創得齋二絶巖齋創得可人心幾暇重教䇿馬尋不是無端適遊興邇來性漸喜山深石橋幾轉沿山澗雨後淙淙響暗泉萬緑叢中拾級到齋窗俯挹樹梢煙創得齋庚辰入山不見墅到墅忽臨山依古松為幄疊蒼石作關既深斯悅性惟靜可怡顔阿那丹臺表容成想像間戲題創得齋庚辰創得景得創頻來輒有詩民焉寄淳檏吾尚愛新奇風嶺松落子霜坳鹿引兒自然塵俗逺心與許巢期創得齋得句庚辰溪山深處愜幽探礀道頻驅小步驂人面峯開墅忽到樹頭樓出景全含掀籠放去沖霄鶴捲幔招來落嶂嵐五度經臨詩六首笑看創得作陳談創得齋辛巳松下石門僻巖端柏棟深初來即創得觸目總怡心山靜有餘趣秋雲無定隂經年彈指頃應與暢幽尋再題創得齋辛巳昨嵗初得齋即景名以創前日乃重來額已題簷上今朝復著句熟處誰能忘創得自千秋日新無故狀再題創得齋辛巳路轉峯回得石關巖齋小坐眄秋山目同碧宇朗無盡心與白雲散以間暖勒疊林猶緑緑潦收幽澗尚潺潺來經慣矣疑始遇信有移情是此間創得齋壬午了知深谷有山房䇿馬西峯下夕陽今嵗初來即創得昨秋熟處已將忘鳥吟花笑自餘樂月白風清無盡藏婪熟固欣宜晚稼愛他嘉蔭亦乘涼創得齋壬午創得得三載每來輒愜情巖松作屏障澗水奏竽笙幽籟千般謖夕陽一片眀奇觀又始遇覺未負斯名再題創得齋壬午小憩永恬居言入西崦路林霏繚而深一步奇一步澗餘九夏氷峯有千年樹山齋逺不見石門近忽遇創得真創得勝概紛來輸萬景供平聲知新五言當去聲溫故題創得齋癸未知有幽齋倚碧峋山蹊熟路可遵循由來創得成先得一切名言底是真石門進更步松巖靜色寒聲迥不凡誰道山中能駐景午峯日影訝西銜再題創得齋癸未野橋才過石門邅仍步丹梯百級高塵世煩囂那許到祗聞謖謖泛松濤鶴依階側鹿窗前借問斯為幾洞天却笑劉郎非解事勞勞海上去求仙度西嶺遂至創得齋癸未登高一步艱就下片時易過嶺未逾刻山齋業已至搆築弗擇向隨宜為點綴不入水衡度乃具巖居致階前有古松盤盤嘉蔭邃小坐屏諸營以觀萬物備題創得齋甲申石門重此步清秋齋室猶然峯上頭庭際松排若張蓋階前雲布訝乘舟愛山不盡供詩料樂水惟清與性投一晌徘徊旋復去祗饒粉壁又題留創得齋乙酉仲秋候覺涼度嶺向西陽數武巖齋是隔年别興長不頻來即創有所得應償歷歷壁間什聊因驗景光過西嶺遂至創得齋丙戊栴檀林已據崇椒西嶺明知路匪遙事半倍功因命駕秋清夕照此憑寮今朝重得寧非創去嵗回思亦若飄箇裏定當有仙在不同道耳笑難招再題創得齋丙戌階下亭亭松作蓋故應涼蔭滿庭中銜光更見西峯日送爽偏來北牖風一陳花香引煙蝶幾叢草細唱秋蟲誰云創得得已久佳興畨畨致不窮肩輿至創得齋憩坐得句路入深山更向西心儀創得一攀躋遵其徑曲觀其徼知我松喬盡我徯拂座有風皆颯颯霑衣不雨亦淒淒今秋又此初吟句原未楣間負却題入谷遂至創得齋戊子今朝值偶暇遂擬窮幽賞西崦有山齋經年結豫想沿緣蘿薜徑熟路攀而上喬松逺即見朴屋近猶仰到來一撫榻衣袂為之爽三幡忽欲息十笏尚疑廣底事云創得率以忘已往由西峪遂至創得齋因題句己丑尋勝巖蹊乘夕涼已踰半月駐山莊明知創得非新得熟處難忘却易忘納嶂窗中猶罨緑種松階下漸成蒼年來結搆微嫌富即景雖欣愧不遑遊創得齋得句庚寅永恬居西北去入谷乃創得齋以其極幽隘不數入聲尋路仄今朝至山居斯則近咫尺半途而即回山靈笑孔棘溪壑歷數曲趣已殊胸臆人面起峯稜石根出泉液初訝向未逢徐悟夏霖積琮琤珠玊滴隱現雲巖泐其色固無定其聲亦誰識韶韺廟堂韻非也仙樂格所得又為創五字弗能默創得齋辛邜石溪往往響流泉泉盡峯回門靣前誰謂山齋得已久今朝又創豈非然高下巖松翠蔭籠後凋不改鎮童童於斯漫擬得非創亦有新責鬛與鬃創得齋壬辰兩峯夾路極崔嵬一月餘兹始到來齋與秋光皆創得可能不為去聲小徘徊谷繆山縈不易窮永恬已在半途中退而弗進實自畫率可悟夫為學工澗葉巖柯翠潤披新紅一點綴高枝拈毫觸目皆新會却是常年得句時創得齋作歌癸巳翠重青邏相縈紏尺寸殊觀蔽林阜石泉可聽不見形山嵐欲把還盈手丹梯宛轉歷百層澗橋過處豁崖口喬松之下見書齋創得非創得斯久僕人攀陟無乃勞坐以撫帖聼憩取欲聞花馥近臨階為納風涼敞開牖好鳥選樹緩緩鳴馴獸遵蹊欵欵走委宛窈窕廓而深由來是我藏詩藪沿嶺降創得齋再題自東而升齋據上由西以降齋居下西北高而東南卑山河萬古形非假兹升西北降東南齋在嶺腰固卑者因知鎡基必待時前畨攀陟為勞也再題創得齋松下山齋倚翠嶠弗頻至以棧蹊遙小遊適喜仲秋暇歷數應過十九橋自瀑源口至此溪谷縈紆凡過十九橋咫尺懸居開月宇泬寥蕭景會晴寮西成有望軍心定今嵗各省奏報約計秋收分數均在八九分以上可慶屢豐而軍營自阿桂全師退駐翁古爾壟豐升額仍駐宜喜軍心大定只候新兵續到為收復小金川及進勦金川之舉略得間情韻句調創得齋六韻甲午肩輿入山徑喜靜不言長曲彴泉鳴隱深林風度涼便因排石戶聊與憩松堂碧宇流雲活青楓過雨香今來實創得昔去合相忘却笑餘結習間中摘句忙肩輿至創得齋因而得句乙未永恬至創得已占途之半事半而功倍豈必中途返叶肩輿遵巖蹊宛轉形常換左溪右則山右岡左必澗峯回水流處率有板橋貫如是歷數橋自永恬居至創得齋凡十橋巖齋前忽見一以憩僕役一以試筆硯峯態與林姿繢情供几案然宜祛藻辭拂箋弗輕讃至創得齋小憩因題句丙申肩輿更向西聊乘片時暇峯回路屢轉峽陡泉常㵼入深益窈窕步仄頻上下巖齋亦已到緑隂茂松架謖濤送微涼於焉憩敞榭泠泠聽漏聲隙影弗少借去嵗所吟句壁間陳迹訝創得齋丙申麗正門前送駕還九月十二日命皇子等奉草二皇太后啓鑾緩程而行留駐至十六日啓程於日同聖母還御園是日在麗正門前恭送循近年例也三朝留駐趂幾間野橋幾曲巖齋到紅日一窗木榻間舊得偶來即創得夏山閲罷是秋山壁題瞥眼草年事石火流隂默對間創得齋得句己亥今朝有餘暇便擬入山深風日宜新霽峯巒是故林肩輿陟雲磴坐榻俯瑶岑耐可稱得創旬餘始一尋題創得齋庚子連朝快霽棧蹊乾遂命輕輿尋勝看巒壑漸深愜攬結齋堂宛在得盤桓今年此日目為創碧宇無雲適與寬西北金山近咫尺山在牆外西北為金山東北為黑山皇祖詩所云乾地金山坎黑山也翠煙含照罨簷端創得齋辛丑永恬居更向西行岡路威紆最有情幾轉石溪淙細瀑千章峯樹晃新晴蝶尋露蕊常翻影鹿食秋蘋欲試聲駐蹕山莊將兩月創來得句副其名題創得齋壬寅意行茷骫密林穿豁朗石門宛目前幾曲野橋流水渡三間迥室倚峯懸到來心境俱澄矣閲過詩詞似幻焉仍復拈毫寫新會便云創得亦應然枕碧樓三首庚辰創得齋旁樓兩間虛窗納勝枕孱顔山容蒼矣意聊寄彈指明秋挹翠鬟種松待老意嫌遲就樹齋成嘉蔭披欲速縱乖鄒嶧論靜觀雅契太原詩谷口延緣不見樓到來俯視白雲頭蜃窗嫩日宜清坐樹樹山山窗在眸再題枕碧樓山樓雖小有迎逢拾級居然枕萬峯遮莫霜林紅染遍蔚窗松色尚重重枕碧樓辛巳高與蒼松齊項背靜將翠嶺接精神經年權借山公領今日依然屬主人枕碧樓壬午老松橫谷石溪斜縱入深山却是家巖閣有窗皆納樹竹爐無火不烹茶餘多濃翠全因暖著幾新紅幻作霞應接萬奇真莫暇分毫方寸那曽加枕碧樓癸未三間齋閣兩間樓曲榭相通景各投拾級不嫌高可到開窗恰喜緑方稠雲來氣韻增生動風過音聲解蕩流淡抹濃粧渾欲滴遇欣所以異清秋枕碧樓甲申一碧憑萬頃是樓非嶽陽霜前色猶重風裏意含涼灔帶秋霖潤晶翻夕照光山田縱遙目却喜有雲黃枕碧樓丙戌樓枕碧楓林日斜秋未深翻光閃金翠動影護嶔崟坐為去聲乘涼久登因賞遇臨山蹊歸適可珠勒響如琴枕碧樓壬辰山樓據林端林葉翻如水一碧真萬頃洞庭不殊此風與為波瀾霧與為練綺玩之枕席上弗異蓬窗裡所戒雕朽訓藉悟乘桴旨枕碧樓癸巳萬木林中聳峻樓浮于水更緑于油而今欲問躗言者枕碧何如爾枕流枕碧樓口號甲午山樓風喜北窗涼一碧林瀛萬頃茫我自宵衣孜矻者那能高枕夢羲皇枕碧樓口號乙未樓窗開處迥含虛澗葉峯枝一碧如不肯於斯試高枕恐妨晝寢類乎豫枕碧樓丙申出樹居然有逈樓扶欄朅爾暢吟眸層層風送碧波泛不異子荆欲枕流枕碧樓口號己亥巖樓兩架枕孱顔無地臨乘片刻間擬衆設如稱碧海忘筌雅似到三山枕碧樓庚子巖樓疊樹中高出揖寥空似枕碧雲表堪呼皓氣通欲咨葉有意莫傲緑無窮試看枝梢上星星幾點紅枕碧樓壬寅齋傍復有樓高出衆林頭過雨青還碧如波泛不流五言孰今古萬頃自春秋設擬三山近真攜期羡遊夕佳樓庚辰山中搆室難擇向就卑因迥取合宜小樓三間挹嵐岫開窗疊樹紛參差紅者為楓翠者柏夕陽返照光陸離造物為張關同畫胸懷全契陶潛詩初經斷手待題額即以夕佳而命之夕佳樓得句尋深有渴懷步屧不知逺峭寒薄邃谷曦光蔽崇巘忽造創得齋橫樓接廊轉齋髙樓更高一窗冬日滿夕佳昨命名萬態呈組纂言情陶莫過體物杜猶善而我别有會含毫欣嫩暖夕佳樓辛巳天高氣霽萬峯排夕景今朝果是佳却悟此佳不因境大都憂樂繫人懷夕佳樓傍晚常教信馬來千峯夕照翠雲堆因緣時節宜留句又得松窗片刻陪夕佳樓壬午一谷當西日隨宜築小樓開窗延照朗落嶺潑光流霞熻紅新染嵐浮緑尚稠坐惟消片刻佳趣自千秋夕佳樓癸未窗對西峯樹萬章高低葉態晃斜陽須臾眀影含蒼意又喜搖風送翠涼夕佳樓即景甲申今日登樓正及時千山佳氣映鬚眉破除思慮歸澄照五栁先生不我欺夕佳樓乙酉小樓棲迥緑松叉山氣常看日夕佳原是晚來遊趁暇因緣時節巧為排夕佳樓丙戊屋宇向西開常延夕照來有光翻樹底得蔭在巖隈栗里陶情邈錦江杜句該致佳欣偶值小坐試茶杯夕佳樓口號丁亥尋常已愛看山氣今日猶欣暢晚晴萬葉輝光一川緑七言妥貼片時成夕佳樓戊子山色無不佳亦有夕佳時夕佳其故何凹處緣向西小樓築此間常受斜陽披金碧翻林葉爓朗而陸離我來孟秋杪恰如仲秋期坐對不覺暄塞中能爾為夕佳樓庚寅一窗烘暖日半晌棄幾間位置煙霞表依稀佺羡間蕪存欣近砌葉盡見遙山自是塵氛逺何須更閉關夕佳樓辛卯築室隨山向山樓所向西故常含夕照因以額前題紫翠色如幻偨池狀莫齊無殊元亮趣歸去每來兮夕佳樓癸巳石磴出松林有樓倚碧岑一時思孟譬五字藴陶吟窗罨層青影庭來空翠隂無塵猶緒語那説淨塵心夕佳樓丙申夏晚猶炎冬晚冷夕佳景最合深秋西南開牖正當嶺東北倚山舊有樓紅葉都從緑葉染松林特異槲林留砌邉更喜黃花放一幅陶家畫總收夕佳樓己亥較齋又略髙縱目正出樹四圍山濯翠一宇晴澄素邇來雨已足千峯喜斂霧到兹以卓午夕陽景未遇然而一樓中固恆貯佳趣夕佳樓辛丑樓以夕佳稱偶來惟日午坐亦弗暖席陶句安從覩然而山之氣恆在樓簷宇我自不相值過弗在樓所倣佛嵐靄間首肯吾斯語欽定熱河志卷三十六
