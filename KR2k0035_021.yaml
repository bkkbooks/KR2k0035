body:
  text: 欽定四庫全書欽定熱河志卷二十一巡典九御製詩癸巳恭奉皇太后啓程駐蹕避暑山莊作高齡避暑塞園清撰吉平明發蹕旌五日節剛三日過今年程按去年行野芃雲緑緣逢雨場積墉黃正喜晴陌柳吹風迎靣爽較贏秋熱愜輿情出古北口作巖城高下踞崔嵬讓水平川百丈開古北口城牆舊本緣山跨水為之庚寅夏潮河驟漲牆當水衝者俱圯隨發帑繕完辛卯秋河復漲水上牆復圮因思牆值河溜勢難與水相事與其隨葺隨隤徒勞工作毋寧讓地於水以避其衝且今中外一家更無藉此繚垣為命於牆缺處結築瞭樓以偹形勢水靣不復遮堵任其暢流為經久䇿古季防秋真足鄙清時避暑更誰猜課官月出非遼逺文武月選官及外省應行升調人員自駐蹕熱河後令吏兵二部堂官每月輪值一人帶至行在引見免其在京久候衛士番更聽往回侍衛及護軍等令其前後分班畨值俾得休息曰此雄關關詎此伊犁户外靖邊埃五月十四日至避暑山莊山莊駐蹕每移前今年夏至在五月初二日以閏在至前故較昨嵗早二十日北郊禮成即涓吉啓蹕亦較上年早半月餘夏凊都因頥大年方澤祭過撰良日三庚節先去聲避炎天五月二十二日初伏今日尚在伏前七日伏向皇太后緩程安行計十八日至山莊亦尚未入年七月啓程率在伏中未免婪暑猶熾後程緩進期安逸此日先臨撫市鄽煙火萬家仰昔詠民至皇祖御製山莊三十六景詩有生理農桑事聚萬家又有萬家煙火隨民便之句今休飬生息閲六十餘年井里繁盛更數倍於昔矣益勤恬飬勵乾乾出麗正門恭迎皇太后至避暑山莊喜而成什昨晚欲霖慮嶺崇今朝快霽迓徽宫前晚密雨徹旦昨晨雲氣猶濃懼成霖致淖因有明當西嶺鳯輿度渥矣其㿩為繾情之句午後漸次開晴今晚遂大霽嶺路坦平恭迓輿喜慰之城倍切夀無量故福無量喜有同因頌有同鶴是仙禽依砌下松為貞樹列庭中松鶴齋奉養也聖母晏居頥齋前恆奉慈顔顧萬嵗千秋樂莫窮中秋後一日啓蹕木蘭行圍之作秋仲例搜啓蹕應有行必告候居興撫遐習武斯攸繫罷彼留兹特未能溪溯石磯還木約農登西隴復東塍午前稅駕行宫近摹帖因之暇几憑木蘭回蹕至避暑山莊恭問皇太后安喜而成什向北圍程又一周歸來安適敬咨諏日增食履天同健景獻園林時豫逰六十慕希五十慕八千秋祝萬千秋年年如是申忱忭不覺其間隙影流入古北口秋暖竟殊常今嵗閏月後節氣率早而秋暖較往嵗尤長入關更向陽連看樹增緑關外樹尚緑而關內則緑更濃無礙草微黃官吏紛迎接村莊富蓋藏翻犂種秋麥一嵗總農忙三十八年五月丙寅上奉皇太后啓蹕巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫降旨蠲免所過地方額賦十分之三己巳出古北口壬申至熱河行宫丙子上詣廣仁嶺恭迎皇太后駕至熱河行宫丁亥上奉皇太后於卷阿勝境侍膳七月壬午賜扈從王公大臣蒙古王公台吉等茶果凡四日丙戍閲步踏八月戊子賜扈從王公大臣蒙古王公台吉等茶果凡二日庚寅土爾扈特貝子沙喇扣肯等入覲賜扈從王公大臣蒙古王公台吉及土爾扈特貝子等茶果凡四日丙申上奉皇太后於獅子園侍膳戊戌上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉及土爾扈特貝子等茶果己亥上萬夀聖節詣皇太后行宫行禮御淡泊敬誠殿扈從王公文武大臣官員蒙古王公台吉及土爾扈特貝子等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉及土爾扈特貝子等宴凡三日壬寅上啓蹕行圍木蘭皇太后仍駐蹕熱河行宫丙午行圍殪虎駐蹕布敦口丁未行圍殪虎駐蹕坡賴口辛亥駐蹕森吉圍蒙古王公等恭進御宴閲馬戲甲寅行圍殪熊一虎一駐蹕永安巴依口九月丁巳朔行圍殪虎駐蹕薩達克圖庚申駐蹕阿穆呼朗圖賜蒙古王公台吉及土爾扈特貝子等飯甲子回熱河行宫恭請皇太后安戊辰上出麗正門恭送皇太后回鑾壬申上自熱河回鑾乙亥入古北口戊寅上奉皇太后回圓明園御製詩甲午恭奉皇太后啓程駐避暑山莊二律已過北郊祭應為避暑行慈輿循近頓清蹕啓前程既愜豫遊志還申溫凊情年年諭頻奉嵗嵗例無更東門仍據鞍出長春園東門御馬而行送駕列千官豈不林林立欲求采采難曉風輕拂爽緑野逺開寬一例急需雨嚲鞭弗忍看出古北口潮河水弱翕循川異漲衝城𬗟昔年一自讓流乃無事長城舊跨潮河上庚寅夏河水暴漲牆當其衝隨流而圮隨發帑修復舊觀次年秋河復漲牆復圮因思城本占河何如讓地於水且本朝中外一家又豈在此水上繚垣為藩蔽因命將臨河城垜葺完以備規制而跨河之城即不復築遂得相安無事即云防北詎斯然清時避暑常來往到處勑幾勵惕乾遺迹勝朝多敗壘蓋餘百嵗息烽煙至避暑山莊作廣仁嶺名去嵗雨憑輿策馬平明此過諸利穡霑膏還憶彼去嵗關內春夏雨甚佳關外四五月間略缺澤五月十四至山莊日始優霑今嵗則關外之澤乃勝關內也習勞示衆每厪豫青山緑水真佳處奧室敞軒各灑如所愧昔年臨此者依然午夜問軍書出麗正門恭迎皇太后至避暑山莊喜而成什嵗嵗蘭衢迓鳯鑾十朝翹企一朝寬高年養志奉逰豫哀愫顒躬祝適安近駐緩行斯蒞止明山秀水總承歡諄諄慈諭期恆例每承欽奉慈諭以年年如是為例之外實無可言也祇有欽遵無别端山莊啓蹕木蘭行圍之作齋趨松鶴敬安諏山莊內曰松聖母恆憩息處鶴齋遂以虞旌發蹕騶小潤寢門草餘日丕承家法萬斯秋西成厯覽欣綏屢北部羣隨聚仰流攬轡據鞍同往嵗肯因耽逸懈貽謀木蘭回蹕至避暑山莊恭問皇太后安喜而成什乘時修獮返山莊厯攬秋收喜報穰境是真仙恣逰豫歡承王母倍康強霜輕紫槲爭松翠氣暖紅荷共菊黃回蹕山莊正當菊花之時而湖中荷花尚有開者節過寒露即內地亦不能若此實為罕覯蓋由苑中本有溫泉是以地脈融煦而今年氣候倍暖故爾日上明窗供點筆那忘即景惜流光進古北口作巖關此日度歸驂四月流隂一瞬參閭左秋成聊用慰山東變故頓因慙夀張姦民王倫倡為白蓮邪教糾衆作亂侵掠夀張陽榖堂邑三縣戕害縣官縱囚劫庫占據臨清舊城擾􅊣旁近村落而山東緑營兵怯懦無用不能攻克因派京兵一千令固倫額駙拉旺多爾濟等帶領特命大學士舒赫德往彼董理軍務並敕周元理何煟各統兵於境上邀截逆首自可尅日成擒削平賊黨以靖地方么髍敢作不靖雖其自取殱誅但四十年來愛養羣黎豈宜尚有此叛逆之衆思之實為憤悶耳回頭塞景還瞻北撲靣暄風以向南絶壁懸崖連埤堄爾時民力若為堪三十九年五月戊辰上奉皇太后啓蹕巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫降旨蠲免所過地方額賦十分之三辛未出古北口甲戍至熱河行宫戊寅上詣廣仁嶺恭迎皇太后駕至熱河行宫七月丁丑上奉皇太后於卷阿勝境侍膳賜扈從王公大臣及蒙古王公台吉等茶果凡四日八月癸未復賜扈從王公大臣及蒙古王公台吉等茶果凡三日丙戍土爾扈特貝勒默們圖等入覲賜扈從王公大臣蒙古王公台吉及土爾扈特貝勒台吉等茶果凡三日庚寅上御避暑山莊門閲射都爾伯特貝勒巴桑等入覲癸巳上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉及土爾扈特都爾伯特貝勒等茶果甲午上萬夀聖節詣皇太后行宫行禮御淡泊敬誠殿扈從王公文武大臣官員蒙古王公台吉及土爾扈特都爾伯特貝勒等行慶賀禮上侍皇太后膳賜扈從王公大臣蒙古王公台吉及土爾扈特都爾伯特貝勒等宴凡三日丁酉上啓蹕行圍木蘭皇太后仍駐熱河行宫辛丑行圍殪熊駐蹕海拉蘇台乙巳駐蹕都穆達烏拉岱蒙古王公等恭進御宴閲馬戲九月癸丑行圍殪熊駐蹕伊遜河甲寅行圍殪熊駐蹕塔里雅圖乙卯駐蹕張三營賜蒙古王公台吉及土爾扈特都爾伯特貝勒等飯並銀幣有差戊午回熱河行宫恭請皇太后安己未上奉皇太后於卷阿勝境侍膳賜御前大臣軍機大臣等飯壬戍上出麗正門恭送皇太后回鑾丙寅上自熱河回鑾己巳入古北口壬申上奉皇太后回圓明園御製詩乙未恭奉皇太后幸避暑山莊是日啓程即事成什年年避暑奉慈闈慈諭欽承弗敢違土厚氣清宜夏凊千秋萬載扈音徽前行後宿依恆例昔往今來驗道機夜雨朝晴便平聲跋馬習勞即是敕惟幾出古北口作秦築長城土色紫因名紫塞至今貽見崔豹古今注殘垣剩堵依然見冠嶺梯巖那搆思興者不知作者苦前人徒遺去聲後人嗤塞邊使不侵中國邊境而今豈謂斯至避暑山莊即事得句仁皇避暑此卷阿恭奉慈輿嵗一過適以明禋舉方澤遂教啓蹕秩南訛仙莊夏景迎吟馬畫嶂晴光濯黛螺五十餘年憶恩顧昨朝今日不爭多出麗正門恭迎皇太后至避暑山莊喜而成什啓程翼曉雨淋漓駐蹕湯泉待彴搘每嵗一日慈駕自啓鑾至駐湯蒞山莊計十今年初頓山因夜雨稍大漲潦侵橋隨令莊親王永瑺率虎鎗侍衛前往督同司道促治輿梁翼日而得聖母在湯山僅信宿即就道安行是以較向年臨駐熱河之期止多一日十日縈思一日喜八旬聖母六旬兒似兹逰豫誠希也祇有康強永祝之不可不知孔子訓我惟知不忍言知熱河啓蹕木蘭行圍之作武功文德並宜昭謨烈欽承自聖堯撰吉行旌指北塞詢安寢閣謁東朝獮搜節合仲秋月往返期惟草二朝丙夜紅旗仍問捷幾曾行幄得逍遙木蘭回蹕恭問皇太后安喜而成什惠遐詰武要惟均蕆事山莊返蹕巡四海臣民咸共仰高年福祉慶恆申捷旗到早知而喜徽閣瞻增精與神將奉安輿入京國弗寒猶先去聲小陽春四十年五月壬申上奉皇太后啓蹕巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫乙亥出古北口六月戊寅至熱河行宫癸未上詣廣仁嶺恭迎皇太后駕至熱河行宫七月庚午上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉等茶果凡二日癸酉甲戍亦如之乙亥閲步踏八月戊寅上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉等茶果凡二日庚辰土爾扈特貝子沙拉扣肯等入覲賜扈從王公大臣蒙古王公台吉及土爾扈特貝子等茶果凡三日丁亥復賜扈從王公大臣蒙古王公台吉及土爾扈特貝子等茶果戊子上萬夀聖節詣皇太后行宫行禮御淡泊敬誠殿扈從王公大臣官員蒙古王公台吉及土爾扈特貝子等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉及土爾扈特貝子等宴凡三日辛卯上啓蹕行圍木蘭皇太后仍駐熱河行宫丙申行圍殪熊駐蹕呼魯蘇台己亥駐蹕都穆達烏拉岱是日定西將軍阿桂等奏攻克勒烏圍紅旗報捷命御前侍衛春寧馳詣皇太后行宫稱賀癸卯行圍殪虎駐蹕鄂爾楚克哈達九月丁未行圍殪虎駐蹕烏蘭哈達戊申行圍殪熊駐蹕坡賴口己酉行圍殪虎駐蹕他里雅圖口庚戍駐蹕張三營賜蒙古王公台吉及土爾扈特貝子等飯癸丑回熱河行宫恭請皇太后安丁巳出麗正門恭送皇太后回鑾辛酉上自熱河回鑾甲子入古北口丁卯上奉皇太后回圓明園御製詩丙申恭奉皇太后幸避暑山莊啓程之作東巡回蹕剛半月北幸啓程又一時無乃太勤車馬爾未嘗少懈旰宵斯堯皇家法寧容弛文母高年合奉怡避暑長兹承夏凊修齡永祝侍期頥出古北口塞有塞之意古來畏北人發端始蘇李扼險自嬴秦征戰多傷􅊣戍屯良苦辛難言惟守在得要亦相親即此往來度恆聨中外臣敕幾勤一已施惠接嘉賓自秦人北築長城畏其南下防之愈嚴則隔絶愈甚不知來之乃所以安之我朝家法中外一體世為臣僕皇祖闢此避暑山莊每嵗巡幸俾蒙古未出痘生身者皆得意覲見宴賞鍚賚恩益深而情益聨實良法美超越千古云敢不遵家法寧徒事豫巡紓懷摛五字揭義示千春至避暑山莊即景成什蘭露松風曉氣清廣仁嶺過見巖城萬家煙火滋增倍我家及皇祖山莊詩有聚民至萬萬家煙火隨民便之句五榖倉箱望益誠智水仁山怡性謐髙畦低壠喜天晴更豫一節便冝者午夜軍書罷問程出麗正門恭迎皇太后至避暑山莊喜而成什朝晴夜雨符汛灑路左迎鑾此夙興十日牽縈欣大慰萬年康健福駢膺惟兹避暑期恆豫不覺喬齡逐漸增欲擬求仙為駐景秦皇漢武有明徴熱河啓蹕木蘭行圍之作甫過月節發天間例寓詰戎懷逺未可刪千百年承垂家法草餘日契濶慈顔自八月十六日啓蹕至九月初八日回蹕山莊問安違侍聖母計二十一日勤思無逸欣馬御是日自山莊乘馬出至尖營始易車厯攬有收慰穡艱里祇由旬駐猶早至中關行宫四十七里掞辭紀事趂幾間木蘭回蹕至避暑山莊恭問皇太后安喜而成什仲秋啓蹕季秋還來往剛消草日間却比向年增慕志乃欣先節謁慈顔精神逾健天恆錫山水供怡日永間頥養固知此地好微歉者略逺京關九月十六日避暑山莊回蹕駐喀喇河屯行宫作翠羽平明轉蹕輪河干别館駐逡巡憶來林態才仲夏重到山光釀小春瞥眼便為經嵗事問心底是惜隂人甌香研淨多清暇點筆聊因紀此辰四十一年五月癸未上奉皇太后啓蹕巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫降旨蠲免所過地方額賦十分之三丙戍出古北口己丑至熱河行宫癸巳上詣廣仁嶺恭迎皇太后駕至熱河行宫七月己丑土爾扈特郡王舍楞等入覲甲午上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉及土爾扈特郡王等茶果凡五日辛丑閲步踏八月辛丑上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉及土爾扈特郡王等茶果凡三日甲辰土爾扈特郡王䇿伯克多爾濟等入覲賜扈從王公大臣蒙古王公大臣及土爾扈特郡王等茶果凡二日辛亥亦如之壬子上萬夀聖節詣皇太后行宫行禮御淡泊敬誠殿扈從王公文武大臣官員蒙古王公台吉及土爾扈特郡王等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉及土爾扈特郡王等茶果凡三日乙卯上啓蹕行圍木蘭皇太后仍駐熱河行宫辛酉行圍殪虎駐蹕那爾蘇台癸亥駐蹕都穆達烏拉岱蒙古王公恭進御宴閲馬戲九月癸酉駐蹕張三營賜蒙古王公台吉及土爾扈特郡王等飯丙子回熱河行宫恭請皇太后安庚辰上出麗正門恭送皇太后回鑾甲申上啓蹕自熱河回鑾丁亥入古北口庚寅上奉皇太后回圓明園欽定熱河志卷二十一
