  text: 欽定四庫全書欽定熱河志卷八天章八御製詩
  hash: sha256:a84eaa47bc1cce4b32dea7495cdb7aff568828779b7b7c1bbb838921331f039f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0035_WYG_008-1a, image: WYG0495/WYG0495-0130c.png}
body:
  text: 處暑日雨七月草九日丁亥庚伏昨朝盡婪暑今日處猶恐炎或留滌之以涼雨山莊到三日輜重率至所益欣利晚田兼弗厪行旅溟濛萬峯煙潺湲千澗滸畫意惟米芾詩情合杜甫更覺饒兩翁鹿聲聞隔岵題和闐玉應真觀泉圗是玉為和闐珍品向命玉工成此圖而不戒於癸未之回祿英氣盡矣然琢磨結搆不可泯焉則以匹之常玩置於山莊夫一炬之不抵又何有三日之燒焉誠如白居易之言斯天下終無真玉矣觸目興懷因成是什厜㕒卓錫偶觀泉祝水能生十丈蓮慢誚精英同假玉居易詩注云真玉燒三日不熱可知寂滅是真禪一塵微裏何妨轉大火聚中如是全求劍莫尋契舟處白居易語豈其然題金廷標雜花四種石榴細葉繁枝護大紅開常弗謝畫屏中何須重舉元徽崔語阿措真看不畏風蜀葵蜀葵亦有向陽名紫萼娉婷且自榮不置階前照曦影誰知二物假和誠蜀葵不向陽而韓琦許衡輩謂之向日故戲及之百合素質應羞時世裝陸遊家藝兩叢芳不曽睡鴨夕薰换撲鼻居然百合香金絲桃塞外宛看塞外花階前形影映橫斜去年命寫尋常事今日誰知珍重加時廷標已物故每遇其畫輒珍惜題句晴昨朝雨竟日傍曉霽開雲詎為山遊適惟因農務欣秋陽熾髙曝碧雨淨纎氛風過叢林下還垂珠露紛午熱煙火庶山莊年來熱亦常曝懸秋日赤催得稼雲黃未可藏紈扇還教换葛裳河名真不負谷口愛乘涼曉涼山中有定候午熱暮朝涼已覺寒侵簟便當厚著裳望欣澄碧宇坐欲近陽光塞景自如是人情却鮮常雨閏七月初五日午熱蒸成湊雨雲秋期五日不為勤半宵粉絮才方密清曉煙絲遂以棼鄉滴蚌珠叢樹葉色藏螺黛逺山紋既霑終覺宜暘好當晝千峯斂霧氛濬川野潦挾沙草塞川每淤壅易見流咉咽艱致水洶溶鳩工事畚鍤疏治除鬱擁廓然清泚呈月入金波湧渚際遊鷗鳬池心恱鯉鮦其下乃深湖原不勞力董山雲一首山雲幾片冉冉興旋布長空作隂矣借問豐隆一何神適才午熱緣有此霏為細霔固無妨散露新蟾益可喜即事深谷樹蒙密熱欲葛裳盤旋登峻巔風來滿意涼始登亦覺勞其熱不可當既至涼風披弗勞爽奚償為學及為政視此均可方新月新月逮上弦徘徊漸有光入夕更雲散時現半輪匡清影漏踈樹映我燕寢堂適已命輿歸坐賞亦足償何必復登樓髙致學謝郎清間口號人言難得是清間我略清間輒赧顔設使樂斯更何慮滿招憂亦在其間雨閏七月十三日連朝晴已好思得雨湔暄細霔潤以久濯枝聲弗喧池寒荷有淚林濕鳥無言原圃滋蕎菜農民笑倚門即事南暖北漸寒秋收别遲早邇來接南音次第西成報叶率稱雨㿩時可以登萬寶畿輔實目擊其他披閲曉湖北及安徽近江或被潦不過彼省中百一災誠小然亦命妥恤毋致有餓殍合之寰宇觀今嵗堪云好何修而遇斯益勉勤民道細雨口號細雨看不見濛濛暗濕衣放他巖際鹿潤草且增肥晴前日細雨渥終朝昨日雲猶散未盡清曉喜轉西北風片片薄雲去相引本來不致愁霖多究覺宜㿩利隰畛霑哉非潦農幸誠爽矣弗寒時協允吾心略慰是斯辰泰而不驕益恪謹曉涼曉涼衣著棉萬嶂晃晴煙誠慮霜行至旋思塞固然間雲消回宇野水落前川卓午原暄暖催收晚種田策馬策馬石城外觀農近若何菜瓜村舍護􅕗穗圃場多已有西成象較於去嵗過去嵗塞外頗旱今年晴雨應時故收成倍豐山田任墾闢誰與計升科即景昨朝細雨零蕎菜欣滋長今日快霽逢禾􅎟熟晴爽兼之西北風雲淨天髙朗千山生翠煙萬畝登秋象陸續閲奏書各省率豐穰處順懼滿盈抑志勵深想夜雨八月初四日半月宜晴暢三更落雨喧近聞簷滴瀝遙想樹冥昏涼意侵宵枕農功厪野村大田收已定菜圃正滋繁即景即景為題信口拈山莊樂事實無厭蒼麋巖際行行見紅葉林間漸漸添碧宇雲稀天廓落寒潭潦盡水沈潛詎惟攬結供吟興靜會端知理趣兼新月愛看秋中月偏於塞上逢冰眉才想像漢角已舂容萬葉寒影一彎開藻胸吟安剛五字倐忽隱西峯中秋即事千秋逢令節萬嵗奉慈寧地迥光疑近夕升輪欲停丹楓未藏色金桂正含馨雲雁鳴蟾曲宵麋借􅊵形巖關益寥朗瀑水自清泠明曉發搜轡十六日早即起蹕幸木蘭每嵗率以為常羽林燦衆星村行三首野橋人迹點輕霜過閏中秋已迫涼却喜山田都銍艾納收無暇畝棲糧一水溯源凡幾度短長木彴接回溪相聞雞犬安耕鑿淳朴閭閻景入題去年關外微嫌旱今嵗山村普報豐又苦穫同無處糶嗟哉民瘼竟何窮即事行令宜秋獵覲光有大宛哈薩克陪臣杜勒特克勒等入覲即於和門宣見並賜以櫜鞬裘服俾扈行圍錦雲披草木祁鹿滿山原武帳歸間憩驛章閲喜言東朝真纍慶五世㺯元孫是日驛章至知得曽孫之喜仰惟皇太后慶育元孫五世含飴益徵母以多福即馳使奏聞聖洽慈禧物性雕鶚擊狐狼鷹鸇搏雉􅊵狐狼害牲畜雉免供鼎鑊叶弱雉免易與強狐狼難捕不求易避難朝歌錯節遇鶻師識物性用各當厥務鷙百不如一孔融語非誤器使豈殊斯顧難審其素負暄口號陽巘試負暄憩勞更披暖回想延涼時其意何相逺山行遇雨之作草日餘程喜快晴山莊兹雨遇山行自因問景聊憑輦衆弗歌勞為駐旌赴岫濃雲如有約落林濕葉却無聲遙遙南望生欣處秋麥播齊潤始萌曉起塞苑背秋將涉冬夜長曉起敢耽慵曙簷有鳥如傳漏山寺無僧亦撞鐘且未展書玩義理却先問政致勤恭金烏旋自東南上西北髙輝幾箇峯拈題信手拈題信口哦樹頭葉少樹根多秋山四璧明無障野水平湖凍不波雉避風藏深草谷鹿知寒下向陽坡授衣時節豳詩詠蒿目民艱竟若何熱戊子塞外宜爽涼翻覺熱如許其中有權衡明朝當處暑炎官設孤注婪尾力一弩固知屆秋後長此安容覩獨是蒸山雲夜來慮作雨晴過午天中淨斂雲晶陽髙暴散濃氛白含沙岸魚鱗影翠現石峯螺黛紋晴值孟秋真叶序風來西北果超羣宜農仍復利行旅即景拈吟慰以欣中元夕放河燈此日值中元河燈舊例存是花皆並蒂出水却無根紅朵東西泛金光上下翻寧須學唐代百萬飾蘭盆按舊唐書王縉傳代宗七月望日於內道場造盂蘭盆飾以金翠所費百萬事雖奢靡亦不無過甚之詞今山莊所設盂蘭盆及河燈所費不過數百金以今較昔知其言為誣矣山中山中午熱早晚涼是謂不常乃其常午熱樹隂坐納爽早晚涼著夾衣裳弗涼鹿那致肥澤弗熱稼豈成雲黃相資並濟欣兩得吾亦隨時賞景光濬溪塞山雨景竒萬瀑爭騰奮然每挾沙石注溪致淤填叶必有事濬疏方得清流進畚噪集衆力給值工成迅長溪復舊觀風漪還月印我因悟為學克已貴不吝心源茍茅塞亦賴以時濬即景昨晚細雨潤蕎菜今晨快晴暄禾􅎟曰晴曰雨兩宜時幸共良農值綏屢叶碧空寥廓淨纎雲曉涼披處青山覩青山緑水真稱遊却恐斯非無逸所題錢維城九秋圗秋海棠態與小名定不差馬嵬坡下斷腸花臨風仍似恨瓶史侍婢如何判鄭家紫茉莉艷葩繁葉護苔墻茉莉應輸時世粧獨有一般懷慊處誰知衣紫反無香秋葵蕊擎火齊瓣裁金那説西風涼不禁自有丹心稱向日陽光照處却無心翦秋羅緑葉已看當夏發紅葩惟是到利開此花解識時寒暖應節輕羅早翦裁洋菊一例秋芳種益雜出竒競勝態姍兮雖然得與東籬並陶令何曽識海西玉簪聲價非髙品自潔幽香淨色護墻隂東村儘有效顰者也解摘來頭上簪金桂粟想芳㽔金想黃西風常與逐蜂狂誰知一種江南卉也做中秋塞北香秋花九種維城圖以進避暑山莊者山莊今亦有桂云紫木槿五月開花至九月番畨綻朵不妨秋無心學取長生術却是卉中壽者流翠桃紫雲花江南俗名翠桃度索寧無草本花彩霞幻作翠為霞漫言枝上缺秋實意寓傾陽亦可嘉維城自識有小草傾陽之語即景晨寒前日欲裝綿午熱今朝頓熾然無礙延涼有溪榭却欣催熟利山田蒸雲出岫還歸岫漲水上川落下川擬減豪吟圗靜賞興因即景又成篇即事正厪南方雨若何驛章次第報非訛霑來霈澤三省遍救得秋成大半多彰寶奏江蘇各屬七月間圴霑􅉈雨水鄉仍可豐收惟髙阜補種不及者間有一隅被旱馮鈐奏安徽七月以來雨均優渥髙田尚可種蕎較窪地收成僅減十之一二永德奏浙西自入七月以來雨澤勻透晚禾長發可冀冇秋浙東早稻已穫通計八分前因江浙夏雨愆期隨諭各督撫察勘妥辦今節次覽奏稍為慰懷亦有髙田終莫及仍教長吏察無詑旰宵惟是勤民敢恣遊歌卷者阿中秋即景石梃邊升端正輪山莊秋節又從新樂聲喜有鹿聲和樹影都成桂影勻光曜遍含大千界慈寧永奉萬年巡宫庭樂豈分中外扈從那無望思人雨八月草二日名山果有神過必雨隨輪喜是圍剛畢對宜幕展頻洗山哨內巴龍桑蘇台山能作風雨謂之海喇堪每圍場過輒雨名曰洗山露蒼樹灑道淨黃塵傍晚收雲片嶤峯倚碧旻八月二十三日作三十三畨誦遺詔五旬八嵗似親年如何便棄臣民去痛處無言仰望天暖興安暖異常磬控稱棉裳拂樹惟輕籟點岡才薄霜草青騰馬健楓紫厲鷹揚氊室開窗坐千峯繪緑蒼雪九月初三日中宵聞雪落一刻變暄寒不測有如是竒逢殊可觀傳宣教罷獵迤邐且􅑀鞍萬樹珠為綴千峯玉作谷虛堪問路林密莫分巒駝漫嫌馱重鳥藏得託安彌空方即即望逺正漫漫帳殿驀前到開窗素景看題錢維城雪景生面塞山雪景披侍臣扈蹕寫神姿朱樓白屋渾無藉玊嶺銀峯别有竒布帳邀途鬻酒暖哨內許市民隨行每有於路旁設小布帳搘其前幅溫酒以鬻僕從過者或沽飲禦寒氊廬到宿帶氷支四宜居氊廬三楹中室顔曰四宜居為視事延見臣工之所獨饒清致收瀹三清茶名又一時登臺待月上遂策馬遊山至湖復泛舟攬景得詩八韻己丑過望月遲上登臺暫憩留才看湧東嶺旋覺照西樓低則輪飛迅光於鏡攬遒緣梯降不離按轡跋相儔萬木紛如影千峯幻似流隂森都入趣汗漫正堪遊出谷原隨馬臨湖復命舟笑他蘇玉局曽得擬斯不即事山中早晚涼夾衣猶覺怯卓午原炎蒸單衣仍揮箑涼以催鹿肥持銃尋山峽炎以曝禾熟觀田俯樓堞隨時賞景光於心頗為愜陡意師啓行傅恆奏七月二十日自騰越起程至野牛壩督促船成即分路進勦便因望馳捷夜雨七月草五日山莊駐浹旬日日逢晴霽雖曰愜觀山吾寧為遊戲京畿報屢霑昨京兆奏京城及近畿初九得雨茂十四夜復陳雨數寸田禾倍為暢口外鮮遍暨大田已結穗不雨無害事蕎麥及菜蔬得雨乃暢遂以此冀優霖切切慮難置晚雲暗千峯頗有作雨勢入夕落􅓴􅜾時疏時密繼數入聲問霈如何高枕那能寐逹曉知渥足籌農真慰意自春逮秋初時若蒙天賜即今甫望澤甫望旋叨惠自問奚以承敬勤勉弗替曉晴二首優霑夜雨歇清晨日射雲開霽景新正喜宜暘利秋稼軍書又報逺夷賓經略大學士傅恆奏猛拱土司遣大頭目詣軍營乞降云其土司久有歸順天朝之心向為緬賊所阻今緬酋所遣防守戛鳩之盞拉機因其國中有事撤回並知經略大臣統大兵進勦願率屬內附迎候王師情辭極為誠懇遂優賞而納其降猛拱為江外一大聚落首先投誠適傅恆進兵在即實師行順遂之先徵也猛拱迎師早備船統軍萬里國威宣乘機速進雖應爾未免遙遙意念懸猛拱所屬有船二百餘其土司願在戛鳩濟師並預偫芻供億恭順有足嘉者傅恆不俟我軍到齊即簡徑旋五千先率往渡戛鳩江由猛拱進至蠻暮西岸籌聯水陸聲勢甚協機宜益深綣念曉千林宿雨收萬巘曙煙泮谷風送曉寒旭影錘峯燦夾衣尚覺涼昨熱避如幻無定中之定塞外秋恆見傳宣問軍章可曽遞䮉傳雨八月初四日山雲鋪厚絮晚雨落棼絲雅助仲秋景未遇十日期既疏還密繼從夕入宵宜菜圃與蕎坂及時潤益滋晴千林斂朝靄一晌放新晴雲腳遙天去源頭漲水生農功既慰志山景足怡情正接軍營報時暘利啓程經略火學士傅恆奏騰越自七月初十日起晴多雨少十八日以後連日皆晴二十日啓行天氣尤為霽朗軍行利便士氣歡騰此誠仰賴天恩佑助實深項雨八月初七日夜雨達清晨優霑真愜人逺山藏不見喬樹潤來勻煙舫無須泛石蹊有可循林中逢濕鹿較比往時馴晴四山雲斂碧空晴既渥宜暘皓日晶額手心同老農樂無勞較量待西成中秋夕即景午熱知有雨是日微雨宵晴特應時中秋誠不負上塞雅相宜點綴雲偏好晦明峯亦竒天香盆桂放即是廣寒枝微雨八月十八日西來地燥略生塵傍晚山雲落雨勻未致淋漓礙行路也教飄灑恱農人菜畦蕎隴皆潤意苔砌楓庭總靜因安樂窩如邵康節是處地名濟爾哈朗圖行宫蒙古語謂安樂也那能點易逮其津出關庚寅出關馬上益逢涼迤邐山蹊度野莊峽水易流潦未逮秋田薄穫圃餘藏飛鴻嘹唳髙還下疊樹菁蔥緑間黃吟緒今來圗少輯其如觸目有題償微雨八月草五日半月晴真好山雲傍午皴遂霏珠點細旋羃玉虛勻鹿濕避深樾魚喁上藴淪明朝應啓蹕泛灑恰清塵即景秋是木蘭好深秋益可人常年回蹕候今嵗布圍辰今嵗進哨較每年計遲十日常時重陽前後即可回至張三營兹則九月初合圍伊始塞冷雨為雪境山地不塵却看活錦繡飄揚玉嶙峋儀鎗行按鎗本鼎類又酒器俗以為刀槍之槍又火器亦名為鎗均誤也作儀鎗行因並識之羽林中有虎鎗騎用以持鎗尋虎刺闞如負嵎孰敢攖賈勇直前弗退避乃有儀鎗厠其間所司導引為儀衛鑾輿發處必前行不取枝精取數備短白其褂亦佩鎗虎鎗人著短白褂别於衆險谷叢林曽未識虎鎗跋涉覓虎蹤儀鎗日受虎鎗賜每日傳膳例有虎鎗之賜皆儀鎗者食之莊叟寓意説支離世間誠復有其事十月朔日作入哨三日行已速今嵗因朕六旬慶節自京啓蹕較常年遲一月餘且後節氣亦早至山莊駐三日即幸木蘭及旋蹕熱河氣候仍然和暖聖母深以塞苑顧居為適因復駐半月始行回鑾出圍半月駐猶應明當清蹕言旋矣幾度拈毫得句曽水態山容小春麗千秋萬嵗懿歡承朝中此日例頒朔壽錫寰區百草增每嵗十月朔日例於午門前頒來嵗之朔曽諭司天時憲自辛卯年為始於紀年慶增注六十一嵗至百二十嵗使花甲環周益綿壽世之欽定熱河志卷八
