body:
  text: 欽定四庫全書欽定熱河志卷二十五行宫一自昔離宫别館以備巡逰資息宴非法宫正殿受朝臨政比也我聖祖仁皇帝展巡塞甸肇啓山莊皇上敬繩祖武嵗時駐蹕於是乎敷文德播武功八紘和會萬里目前遐邇由而一體中外所以一家豈惟都會繁昌班朝蒞政而已至于山川秀發水木清華前後三十六景外勝境日闢松雲棟牗締構天成謹各繪圖系説而以沿途行館附焉若夫聖迹留貽宸章炳蔚天文所被巨細靡遺敬依類排次分載簡端不徒範水模山增輝藝苑已也避暑山莊昔我聖祖仁皇帝於康熙四十二年肇建避暑山莊隂陽向背爽塏髙明地居最勝其間靈境天開氣象宏敞俯武列之水挹聲錘之峯疊石繚垣上加雉堞如紫禁之制周十六里三分南為三門中麗正門東德滙門西碧峯門其東及東北西北門各一東門外長堤蜿蜒北起獅子溝南盡沙隄觜延袤十二里甃石七層廣約丈許宫中左湖右山山勢自北而西曰梨樹峪曰松林峪曰榛子峪曰西峪回抱如環濕翠晴嵐朝夕異狀不可殫名湖水自東北演迤而南至萬樹園之陽淨練澄空沙隄曲徑如意洲在焉其北為千林島凌空落影望不可即瀑源來自西峪垂於湧翠巖之巔玉噴珠跳晴雷夏雪滙注湖中湖岸曲樹翬飛長橋虹駕引而東南至德滙門之左為出水閘以時蓄泄髙雲入峯清流見底凡夫敞殿飛樓平臺奧室莫不因地形任天趣不崇華飾妙極自然伏讀聖祖避暑山莊記及我皇上御製前後二序紹聞垂訓意至深逺周詩臺沼不得専美於前矣聖祖御製文避暑山莊記三集金山發脈暖溜分泉雲壑渟泓石潭青靄川廣草肥無傷田廬之害風清夏爽宜人調養之功自天地之生成歸造化之品彚朕數巡江干深知南方之秀麗兩幸秦隴益明西土之殫陳北過龍沙東逰長白山川之壯人物之朴亦不能盡述皆吾之所不取惟兹熱河道近神京往來無過兩日地闢荒野存心豈誤萬幾因而度髙平逺近之差開自然峯嵐之勢依松為齋則竅崖潤色引水在亭則榛煙出谷皆非人力之所能借芳甸而為助無刻桷丹楹之費喜泉林抱素之懷靜觀萬物俯察庶類文禽戲緑水而不避麀鹿映夕陽而成羣鳶飛魚躍從天性之髙下逺色紫氛開韶景之低昂一逰一豫罔非稼穡之休戚或旰或宵不忘經史之安危勸耕南畝望豐稔筐筥之盈茂止西成樂時若雨㿩之慶此居避暑山莊之概也至于玩芝蘭則愛德行睹松竹則思貞操臨清流則貴亷潔覽蔓草則賤貪穢此亦古人因物而比興不可不知人君之奉取之於民不愛者即惑也故書之於記朝夕不改敬誠之在兹也御製文恭跋皇祖聖祖仁皇帝御製避暑山莊三十六景詩樂善堂集曩年十二時蒙皇祖聖祖仁皇帝推愛我皇父之肫摰特令孫臣隨侍宫中朝夕承歡不離左右其年四月隨駕往熱河避暑凡三十六景之地無不周覽聆聖訓被賞賚不可勝紀孫臣時雖少然受皇祖深恩嘗思久侍慈顔長領訓誨謹身約已庶無過尢以報髙厚之德於靡窮昊天不弔其年冬龍馭上賔我皇父哀毁過禮食不甘味時同兄弟問安必勉怡顔色以舒皇父之憂退而自號哭於廬次澘然不絶蓋恐傷我皇父之心而每念我皇祖哀慟思慕實不能自已也數年來皇父屢命往祭景陵冠劍猶存音容安在一望山陵魂飛魄越雍正七年冬敬讀皇祖御製避暑山莊三十六景詩兼披圖畫回思曩時承歡侍顔蒙恩寵而被誨愛者如在昨日興言及此淚欲霑衣夫以皇祖天亶之聖卓越古帝王深仁厚澤六十餘年浹於民心載在史册固非言詞所能贊揚於萬一孫臣在諸孫中最為鈍魯然天地之澤靡不均被而有得之最深者焉孫臣得皇祖之澤最深者也敢恭紀於後以志思慕之誠久而益篤云恭和皇祖聖祖仁皇帝御製避暑山莊三十六景詩序辛酉乾隆六年秋命駕出口北巡蕆事言旋道經避暑山莊撫今追昔情不能已向於雍正戊申曾敬跋圖記用述聖恩髙厚今身厯其地彌切音容如昨之感爰恭和御製避暑山莊三十六景詩原韻以志孫臣思慕之忱與嵗並增耳避暑山莊三十六景詩序壬申我皇祖建山莊於塞外錫以三十六景之名蓋一邱一壑向背稍殊而半忩半軒領略頓異故有數楹之室命名輒占數景者非若漢主離宫唐家别館彌山蔽谷猶云未足也向曽恭和御製原韻兹以駐蹕清暇復各題五言近體雖不足以窺測髙深然劉昭禹所云四十賢人者或庶幾云爾再題避暑山莊三十六景詩序甲戌避暑山莊者玉塞之神臯金庭之奧域也我皇祖聖祖仁皇帝肇斯靈囿標三十六景題句繪圗垂示册府朕既恭次元韻附刻篇末前秋周覽勝概復各賦五律一章仍就舊題成咏今年敬奉安輿永駐於此自夏至初過訖於處暑招涼延爽弦望再更幾政之餘登臨攬結乃知三十六景之外佳勝尚多萃而録之復得三十六景各題二十八字其中有皇祖當年題額者亦有邇年新署名者統前後計之得列仙福地之數匪謂泄造物無盡之藏蓋即由舊之中寓知新之旨云爾避暑山莊後序壬寅我皇祖於辛卯年成此避暑山莊三十六景繢圖賦什為序以行之而豫適生於是年此中因緣不可思議即位後於辛酉年始為巡狩之舉至山莊徘徊思慕因敬依元韻以志景仰甲戌年又增賦三十六景蓋以皇祖昔曾題額而未經入圖及余逰覽所至隨時題額補定者總弗出皇祖舊定之範圍故永恬居之詩曰已是洞天傳玉簡得教福地續琅書永恬居即皇祖御書也御序至矣盡矣兹後序何為而作蓋豫之生年既同山莊而豫之侍皇祖適以壬寅而今嵗又恰當壬寅六十餘年藴於深𠂻者不可以不明白宣示以自戒已者戒我後人耳夫居此山莊日凜敬天法祖勤政惠民柔逺寧邇諸大端見之詩文者不知凡幾何尚有未宣之深𠂻乎無而為有是欺已有而弗宣是欺人我皇祖建此山莊所以志戎綏遐崇朴愛物之義見於御製序中意深逺也是以皇考十三年之間雖未舉行典常面諭曰豫之不往避暑山莊及木蘭行者蓋因日不暇給而性好逸惡殺生是豫之過後世子孫當遵皇考所行習武木蘭母忘家法煌煌聖訓豫與和親王及爾時軍機大臣實共聞之而今皆無其人矣豫如不言後更無知皇考聖意者又數年來日涉成趣於向所定景外不無建置如創得齋戒得堂之類不下二十處既見之昨嵗知過之論矣而豫之意猶有未盡者亦不可不宣示後人也蓋漢唐以來離宫别苑何代無之然不過費人財逞已欲其甚者乃至破國亡家是可戒無足法也若今之山莊乃在關塞之外義重習武不重崇文而今則升府立學駸駸乎崇文矣然杜甫所云將軍不好武稚子總能文之句余嘗駁之以為各有其地其職也設衆人遂以此為美亦美中之不足矣又扈蹕之衆厯數月于役采薇出車古人所以恤下此亦不可不念俾人知其所繫者大且時加惠賜焉則勞而不怨若圖已樂而忘人苦亦非仁人之所為也若夫崇山峻嶺水態林姿鶴鹿之逰鳶魚之樂加之巖齋溪閣芳草古木物有天然之趣人忘塵世之懷較之漢唐離宫别苑有過之無不及也若耽此而忘一切則豫之所為羶薌山莊者是設陷穽而豫為得罪祖宗之人矣此意蓄之久而不忍言今老矣終不可不言故書之既以自戒仍敬告我後人若後人而忘豫此言則與國休戚相關之大臣以及骨鯁忠直之言官執豫此言以諌之可也設諫而不從或且罪之者則是天不佑我國家朕亦無如之何也已矣聖祖御製詩塞外山莊三集嶻嶭連青嶂懸崖挂緑溪魚隨淵靜戲鶴喜樹髙棲洞逺行僧斷林寒過客迷惟豫心舊好逸興少同躋秋日山莊偶成山花野菊喜清風塞北煙光報嶺楓無暑不知秋氣至教叢蘭蕊放離宫夏日山莊四集日永炎風盛純隂在內含扶陽求物理避暑豈幽探山靜清歊熱泉瀠照碧嵐隨時駐步輦無著亦無貪其二畏景消煩慮吟詩續古風野花羅檻外山鳥滿林中雲氣氤氲合鶯鳴颯爽同無能尋麗句賦物愧難工山莊四季節屇三春勝發生萬彚齊諸花候御輦百榖待村犂九夏愁㿩雨千林葉正肥祗因思避暑端拱計頻違金風多爽颯清露滴堙浮目睹倉箱滿方知嵗有秋嵗暮添霜鬢殷勤宵旰勞地寒盈尺雪還慮北風髙山莊晚晀島嶼堪圖畫溪橋宛自成池邊樹影接峯外月華生衆鳥巢簷穩羣麞伏地平無知知德化推擴至民情御製詩恭讀皇祖御製避暑山莊三十六景詩並閲圖感成長句五首樂善堂集天開勝境比卷阿浩蕩春熙萬物和祇為養親溫凊備非關奉已豫逰過迎涼臺榭依山逈延爽軒窗傍水多頷領孫曽難數計扈逰何幸沐恩波猶憶壬寅三月春隨鑾方始奉恩綸天顔近接承歡久日角時臨賜喜頻在耳德音猶似昨開函御筆鎮如新祇緣深眷吾皇意愛育餘波及小臣金泉避暑闢離宫行樂還期兆庶同書史研求遵古訓桑麻藝植愛豳風追陪六膳分銀繪趨侍三驅躍玉驄指點圖中當日事鼎湖何處可攀龍靈臺不見文王御仁夀空傳唐帝宫樓閣簾櫳虛夜月殿堂松柏老秋風當年逰賞疑天上此日辛酸對畫中賸有宸章恭雒誦幾回青睞憶重曈鼓響舂音夢裏遷披圖不覺淚潛然詩侔風雅傳千載畫聚煙霞扃一編爽籟秋風噓大塊雲章星彩麗髙天冷窗課罷頻吟諷回首光隂已八年避暑山莊行宫懷舊離宫對碧岑峭石聳成林壁有曾題字庭餘獨樹隂簾帷秋日靜彞鼎篆煙沉况是承恩地能無憶舊心幻塵同夢鹿佳境似逰仙帆影留雲在江聲共月懸雲帆月舫月色江聲皆宫內别院名也緑窗蛛織網粉壁鳥銜鈿回首驚心處流隂忽草年避暑山莊為皇祖臨幸最愛之地亦孫臣受思特深處也八年秋謁陵便道駐蹕數日曷勝今昔之感詩以志弗忘云軒墀敞御園草樹靜髙原逰豫思仁祖庥和逮孝孫橋山將酹爵玉館此停轅罨畫山容在修蛇電影奔禽言欣客至蛩語訴秋繁階篆苔紋暗碑詩叉腳存聖蹤猶可想𠂻曲向誰論倍切乾乾志虞孤覆載恩避暑山莊作乙丑逺樹輕嵐互吐吞迢迢清蹕駐山園當秋水態澄心會過雨巒光靜體存如是野花呈色色于時幽室樂言言昔恩詎待重來憶即境重來倍憶恩間齋偶啓舊書帷昔日今時有所思試想山容天外老即看花影座中移食蘋野鹿穿林過華黍香風隔嶺吹物土耕桑今倍萬事聚皇祖避暑山莊詩云生理農桑民至萬家覩茲户口日增益歎汪濊深仁貽謀良厚也含哺都道聖恩貽山莊雜興地僻軒逾靜山深草亦馨風前霏亂錦忩裏罨濃青潤挹雲霞氣真參泉石靈抽毫難得句倚柏小延停經雨溪流漲臨秋天宇髙徂雲戀峯岫爽氣逼衫袍饒有心堪會原無暑可逃林泉愜清興舒嘯寄東臯朝暮山容變髙低眼界移能添詩者句應是畫家師馴鹿眠煙磴殘蟬挂露枝行吟情稍倦一棹泛滄池斷岸一徘徊寥天縱目恢雅宜伸愫抱底用舉樽罍澗口飛虹落雲標畫障開逰觀豈可極佇待奏章來避暑山莊丁卯勝地闢離宫時巡駐蹕同金行邊塞外聖日照臨中翠柏千秋色青嵐四面通洗塵飛好雨傍晚更濛濛隔嵗駐山莊山容鎮似常風來花作態雨過草生香小鳥窺簾捲清琴倚壁張含飴叨厚澤觸景那能忘煙容罨翠岑逐處稱幽尋石秀今秋草潭明古月心蘚蛩吟露冷蘋鹿度雲深極頂衆山小悠然暢逺襟避暑山莊百韻詩有序我皇祖建此山莊於塞外非為一已之豫逰蓋貽萬卋之締搆也國家承天命撫有中外於古未有之地盡入版圖未服之國皆受封爵而四十八旗諸部落屏蔽塞外恭順有加每嵗入朝錫賚燕饗厥有常典但其人有未出痘者以進塞為懼延頸舉踵以望六御之臨覲光欽德之念有同然也我皇祖俯從其願嵗避暑於此鱗集仰流而來者無不滿志以歸且也三代以上無論矣三代以下享國最久者莫如漢唐宋明然四姓皆一再世而變亂生焉是豈天心之怠眷亦人事之偷惰實致之我皇祖有鑒於此故自三逆底定之後即不敢以逸豫為念巡狩之典或一嵗而二三舉行耗財勞衆之論夫豈不慮然而凜天戒鑒前車察民瘼備邊防合內外之心成鞏固之業習勞苦之役懲宴安之懷所全者大則其小者有不必恤矣使誠以逰冶是尚即深居九重厭見百辟恣聲色怠政事誰其禁之而必往來沙塞風塵有所不避飲食或致不時以是為樂固未見其樂也豫小子自十二嵗蒙皇祖恩養育宫中侍奉左右扈蹕至此親見皇祖髙年鬚白允宜頥養尚且日理萬幾暇則較射習網閲馬合圍雖天行之健自強不息亦聖度之恢與時偕行也故繼序以來敬惟昔日時巡之意更值四方寧謐之時實不敢使文恬武嬉以隳聖祖之家法而每駐蹕山莊羮牆之見雲日之瞻惻然有不能自已者敬成百韻略識皇祖卷阿之遺志并申孫臣孺慕之悃誠云爾開國超三代承天撫八陲鴻功常有赫厚貺本無私於古亶騰邁而今被皥熙顯承三聖緒底奠萬年基滇海銷兵靜王庭納幣馳玉關間戌壘銀渤息鯨鬐以守還無創居安不忘危時巡曾見舜即辟詎惟岐勝境山靈祕昌時造物貽來逰頻可託經始乃於兹土木原非亟山川已獻奇製猶尊土砌巧不尚雕栭掖輦慈顔預揮豪天藻摛劭農咨寶穡勤政飭鳩司鳥獸歸咸若夭喬總蔚而賢王誠愛戴好爵豈羈縻內外一家合休和百世禆六龍天浩浩四牡嵗騤騤頥養精神健疇咨經緯施故知非適已實以藴深思况匪牟耕地何曾費帑資給支需內府結搆宛蘭錡卓立峯名磬構拖嶺號獅灤河鍾坎秀單澤擅坤夷繚堵依巖迥周廬寫月規陟原量逺近列表度參差宛似天城設無煩班匠治就山為傑閣引水作神池允矣儉斯稱佳哉奢豈為景標三十六章綴畫圖詩次第聊申咏規模略可窺煙波欣致爽景物首應推右煙波致􅐩芝徑逶迤接雲隄左右歧右芝徑雲隄延清三伏日右無暑清涼解愠五絃絲右延薰山館巖秀原增夀水芳可謝醫擇宜開牖宇攝靜適襟期右水芳岩秀萬壑松風奏千秋畫坐披右萬壑松風清溫維色養清越合神怡右松鶴清越勝地臨平野髙樓納逺思右雲山勝地雲嵐四面罨斗室幾楹宜右四面雲山北枕巒凌漢右北枕雙峯西瞻霞赩曦右西嶺晨霞錘峯長矗矗右錘峯落照雪岫更嶷嶷右南山積雪碧月白梨院右梨花伴月紅荷緑水湄右曲水荷香風泉清聽滿右風泉清聽濠濮素心隨右濠濮間想日監欽天縡雲窗俯玉墀層霄宛可接敻宇暢無涯右天宇咸暢暖溜蒸霛液暄波漾淺漪心神堪澡雪興會益淋漓右暖溜暄波石壁泉源邃右泉源石壁青楓緑嶼蕤右青楓緑嶼戴顒聽偶慕右鶯囀喬木周子愛堪師右香逺益清花以金名貴根從佛地移右金蓮映日飛流頻詠李天樂不須夔右逺近泉聲月舫浮芳沼雲帆挂翠㕒右雲帆月舫臨流弄竿線右芳渚臨流俯水鑑鬚眉右雲容水態繞石鳴琴築右澄泉繞石澄波疊錦綦右澄波疊翠熊飛寧待夢魚樂或能知右石磯觀魚鏡水風微皺披來若渺瀰雲岑態多幻望去忽嶔﨑右鏡水雲岑夾鏡湖光滙右雙湖夾鏡長虹練影欹右長虹飲練甫田多瑞穀叢樾出喬枝右甫田叢樾流水心無覽間雲意與遲右水流雲在三山依約在四序始終之大塊文成繪聖人情見辭嘉兹仙境擴致彼物華滋隴麥雙歧挺町禾九穟纍實堅還實好維秬亦維秠瓜圃青丸綴蔬畦紫菂垂珠櫻春爛爛玉李夏離離恍覩豳風象奚妨文囿遺綏豐願寰宇祈嵗肅黃祗緑野瓜見膏厚單椒豐草彌窗暄裊書帶石古長鳬茨杜若芳繁蔚江蘺態鬱漪信堪蕃坰牧便以試􅊏驪驒駱􅬼騢駵騅駓騂驈騏色分披錦假羣别待金羈冠木惟松柏叢生有杞機丹楓將翠橡堤栁更庭椅為恱長林茂爰來野獸祈跳騰推赤豹雄健獨黃羆仙有書牌鹿官無入澤麋惟應育麟鳯豈許匿狐狸羽客青田種文禽丹岫姿書空成篆籕刷羽接罘罳每見鱨鯊麗何勞鷸蚌持美兼丙穴鯉品奪富春鰣凡此嘉生富要歸茂對時幾曽誇豫大彌復厪寒飢經國留規範籌邊肇保釐每來增惕息言念重吁􅐵嵗月何云速恩勤不可追省方頻駐蹕觸景憶􅍭飴聖日常懸照秋風轉益悲天施誠浩蕩神器重肩仔敢復圖休逸惟期矢敬寅外安先內撫夕訪並朝咨天運欽調幕人情畏舉棊古今垂炯鑒書史足元龜遺烈母忘祖揚休祇愧台纘承奕祀勉福履萬年綏避暑山莊晚秋嵐氣千峯斂金風一谷寒長空無點翳潦水盡澄灘菊瘦緣依石松蒼不礙巒豁然慿縱目心與太虛寬九日避暑山莊九秋節駐九仙家追賞乘時意趣賖却勝前年臨紫塞只緣今日對黃花前嵗塞外有九日無菊之作遙吟俯暢澄天宇結佩浮觴趂物華别有登髙心慰處榆關外見好桑麻山莊雜咏辛未每先秋獮駐山莊水態峰姿引興長佳景天成勝江國早藏靈境待仁皇萬壑松風一室幽藝忩如昨每吟留卅年問學無些進空覺羲娥迅似流秋山雨過濯濃青逺近泉聲謖入聽新搆雲居號松鶴千秋萬載奉慈寧點筆文軒命墨娥成書便擬號歸禾未如七十傳靈囿動植飛較總多山莊曉景甲戌肅轡凌露晨趁涼陟層巒霏微夜雨散離披朝雲鶱人家在谷口井閭騰曉煙塞氣逼不升變霧如白綿我欲乘之逰滄海逗三山山莊咫尺間乃作萬里觀山莊晚景癸未山莊晚景越清嘉秋獮眀當發翠華居兩月餘才一瞬閲真山那異空花魚貪新水浮行上鹿趁夕陽倚落斜日涉所成趣不淺黃綾詩本付生涯山莊深秋即景甲午昨日門前送鳯幨後程因致小留淹林稀鹿向平原出水冷魚尋深沼金氣肅消幽塢外碧霄朗接逺峰尖最佳處合忘諸慮盼切捷音志未忺山莊即事乙未沿革興州難考尋山莊肯構亹豫心嵐來氣挾蹛林逺漲落波奔滄海深較雨量晴每蒿目探奇攬勝亦開襟繼繩敢謂庶無忝惟是常瞻聖日臨季秋山莊即事鳯鑾恭送向都還後發徘徊五日間夏月無何逮秋月青山即漸作蒼山逰因遣興聊乘暖意戒耽盤敢愛間雖是紅旗已初報繼兹其至盼猶艱至避暑山莊即景成什丙申蘭露松風曉氣清廣仁嶺過見巖城萬家煙火滋增倍我家及皇祖山莊詩有聚民至萬萬家煙火隨民便之句五榖倉箱望益誠智水仁山怡性謐髙畦低壠喜天晴更豫一節便宜者午夜軍書罷問程山莊即事己亥電光石火刻難駐不到山莊隔兩冬知我有悲白雲色慙他無改碧山容堂題樂夀成虛望曾敬聖母所駐山莊行殿向題樂壽堂額以寓祝望心識音顔祗夢逢懼不忍言昔所詠昔孔子於父母之年不可不知謂一則以喜一則以懼余向惟知有喜而不忍言懼甲午秋曾有知年不忍舉宣尼之句乙未夏有我惟知不忍言知之句今復何言哉而今覔懼亦何從山莊即景庚子無暇今年幸木蘭仲秋山景御莊看連林髙下猶蔚緑問樹兩三忽染丹支繖尋吟趁午熱倚窗習字避晨寒舊新蕃部都散遣消得清間幾日槃肩輿入西峪即景成什癸未西峪屬創得峯巒實案衍而復工曲折溪壑萬千轉是間搆書堂縹帙藝香展其他姑且置首當命步輦輿者逸固佳肩者勞猶繾十步一憩息率就緑隂善以遲到乃速居髙下盡辨日所不暇給誰云足一臠人情喜鮮新斯之未能免西峪西峪秋深清且嘉林疏牆外見人家授衣時節宵鳴杵撾穗圃場午響耞終歲勤勞亦亟矣九重安逸豈宜耶今朝所得殊前度不為去聲搜吟玩物華肩輿入西峪肩輿入西峪輕雲籠日光樹下有微風時時送爽涼猶恐肩者勞數息審不妨秀起堂名雖尚遙空翠樓名當路旁可以坐而憩况無要務忙西峪西峪秋深好林稀見逺巒嫩暄稱去聲逰涉颯景助清歡陽巘蕪餘緑隂崖葉綴丹凹中得屋暖眀處憑窗寬題壁行將遍摛毫亦底難然當弭吟興欲以待田盤將以回鑾之便往田盤一逰肩輿入西峪乙酉西峪我所喜初來即命逰筍輿原可造山路不言修鹿訝林間立蝶翻花上浮却思肩者瘁隂下每停留西峪薄雪深秋出哨回輕輿西峪此重來境因徑曲詩情逺山為林稀畫坐開納稼村豐隔城見向陽屋暖倚窗陪佽飛陡繾衝寒衛小駐言旋適可哉於山莊駐四日息衆遂回鑾西峪丙戌西峪連朝率未來午炎揮汗廑輿儓却欣入谷風吹爽便有出峯雲布開處暑猶然似當夏趂涼何必在登臺石城以外山田見熟賴秋長仰化裁西峪西峪深秋了不涼肩輿行意賞煙光前朝峭冷又迥暖今嵗塞園始見霜鹿喜平坡草猶緑鴈過去聲空宇葉初黃石城外即山村近且幸崇墉積圃場西峪丁亥西峪不常來來必有奇遇浮雲與張蓋清風與奏頀午炎頓覺失秋涼真可豫𬗟懷古作者曾誰到此處箕山祇培塿尚有人生慕西峪壬辰寺别碧峯北更西峪深益窈益清兮千章夏木如連葉百折山蹊不作泥步輦度隨鹿行迹懸崕轉聽鳥呼啼圖間亦識辭多躁佳景其如畢我徯西峪癸巳數日未曾西峪來清秋山景又殊哉霽開曦御皓乎曝雨過林蹊靜不埃汲古翻書白駒隙消間橅帖墨蛾陪窗間却見石城外銍艾黃雲遍壠堆西峪甲午山莊到十日西峪始來尋峯態昨非昨溪聲今自今行惟期意適憩必選林隂富矣供詩料摛詞仍酌斟西峪乙未西峪窈而深來必先至此其下乃西溝山路俯迤邐適才之所經後馱過行李碧峯門在兹進兹近五里曷弗從是入麗正門名當陽啓行貴不由徑何處外斯理肩輿兹尋勝乃益窮宛委亦堪悟為文膚淺無一是西峪問景紀所得丙申西峪臨石城蘭徑循􅧧迤向北有書堂其名曰秀起我每臨山莊例必先至彼而峪定所由遵路可捨此林嵐忽明晦增趣之所以晦處有鹿伏非時無害理此時鹿尚瘦故弗持鎗往即之而鹿亦麌麌近人如海鷗之狎也海鷗狎即斯萬事一貫耳明處見牆外駝馬過行李勞實廑衆人逸可恣一已肩輿問景間所得聊紀是西峪己亥山莊至草日西峪今初到佳處久濶置恐貽山靈笑是時小雨過酷暑略已消叶因之趂餘暇藉用暢清眺一以攬畫趣一以尋詩料片雲忽飛來棼絲羃巖峭皎日照半天無礙銀竹落叶幻景乃若是新爽宜懷抱叶楓林有襲芬蘭坂無生淖須臾復朗霽萬峯濯翠嶠厯厯靜之會蕩蕩仁者樂設非偶命駕安知如許妙西峪辛丑今來西峪始為逰隔嵗景光待詠酬祗以賞新暫置舊誰無已得又他求試觀人欲靡窮也亦悟世情足戒不路入碧峰寺深靜拈毫厯厯記從頭西峪壬申山莊駐五日西峪今始到一因懶遊興一因籌政要似此實粗疏名山得毋笑雨餘趁爽涼遂與窮窱謖籟落喬松可聞不可貌有欲無欲間胥可觀其妙欽定熱河志卷二十五
