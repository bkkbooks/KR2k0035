body:
  text: 寺廟二碧峯寺栴檀林彚萬總春廟鷲雲寺珠源寺斗姥閣靈澤龍王廟碧峯寺在山莊內碧峯門之左東嚮御書額曰碧峯寺前為天王殿內為正殿前楹額曰法華寶殿殿中榜曰雲鷲香臺聫曰紺宇初開現四禪天寶花積碧峯常靜證三摩地吉雲扶配殿左曰松風右曰水月更內為經樓額曰宗乘閣閣下聫曰山色不遮螺湧出佛光無量鷲飛來閣上額曰法輪最上聫曰檀身隨現清涼窟雲岫宜尋歡喜園寺後有書屋南嚮疏泉引流候火試沸瀹茗為宜顔曰味甘其右偏為叢碧樓飛簷層檻上出木末前為池作亭臨之曰回溪亭御製詩碧峯寺甲申碧峯門裏碧峯寺法界慈雲此日開殿倚喬松如古剎階圍流水作香臺佛無色相何需爾山有清真亦幻哉為去聲是徑尋西峪路不妨過往輒留陪碧峰寺乙酉招提門對碧崚增峪路從茲步步登上界本來清淨界一燈燃得百千燈並無暮鼓常逰鹿雖有雲房不著僧好景奚妨逐時異隨緣摘句我猶能碧峯寺丙戌寺門常對碧峯開鎮日無僧有鹿來借問為同抑為異果然彌勒笑咍咍碧峯寺丁亥山寺猶然對碧峯曽無白足寺前逢箇中那是全提句相照光光證月容碧峯寺戊子山寺寥寥不著僧青松蒼鹿自相應何須更藉金繩度已是諸天最上層碧峯寺己丑門對碧峯開籠隂松與槐真堪稱鹿苑遂以禮蜂臺至此誰為此如來無去來一聲清磬響遮莫不言該碧峯寺庚寅梵宇招提對碧峯六時常寂寺樓鐘不安僧侣談宗教祇許空巖護象龍碧峯寺辛卯調御中間坐丈夫飛來花雨著僧無門前正與碧峯對試問於斯同也殊碧峯寺壬辰山寺巍然向碧峯龍鱗作是種成松何妨鹿有千羣迓却喜僧無一個逢碧峯寺癸巳梵宇門常對碧峯堂堂蓮座現金容焚修不藉僧雛濫苑戶六時自撞鐘碧峯寺甲午翠滴嶤峯螺黛紋招提門對與平分無僧日日間貝帙祇有鐘聲報曉聞寺不設僧惟園吏司灑掃每晨鳴鐘而已碧峯寺乙未碧峯實乃肖祗園點綴園姿畫意存亦弗著僧守門戶常看有鹿到庭軒雲開色濯山容翠雨過聲添澗響湲即色即聲誰所設不知何以悟三幡碧峯寺丙申門對碧峯因額寺寺而曽弗著僧徒禪枝忍草自佛法鶴下鹿逰任物娛偶到不知今與昔忘言那論有和無道場亦自松引路何至誇多曰萬株黃梅道場有引路松萬株見圖經夫萬株列路其長應數十里語涉誇誕是寺路傍亦種松不過數百株耳碧峯寺辛丑石徑兩傍松山門對碧峯漫云屈玉食便以禮金容祗樹動風靜禪花過雨濃不教白足守南北那尋宗碧峯寺壬寅門對碧峯寺以名有松蒼翠有泉清不教僧往汚淨域儘許鹿來守化城到此即空還即色邇時宜雨亦宜晴心間那更禪心悟觸目消間七字成味甘書屋甲申書屋臨清泉可以安茶銚取用乃不竭奚慮瓶罍誚泉甘茶自甘那繫龍團貌展書待爾澆頗復從吾好是中亦有甘誰能味其調味甘書屋乙酉書屋秋風滿意涼筠爐瓷碗趣偏長茶斯可於言否善猶然憶趙良味甘書屋丙戍寺後有書屋偶然題味甘山泉堪煮茗犀液正含嵐不擬喫茶偈原非計碗貧小停旋命駕西峪待幽探味甘書屋丁亥石髓巖邊潔且芳便教竹鼎試烹嘗苦言藥也甘言疾我却因之緬趙良味甘書屋戊子寺後有隙地可構房三間竹爐置其中乃復學惠山石泉甘且潔就近聊烹煎中人熟伺候到即呈茶盤我本無間人亦不容我間味甘書屋口號己丑山泉將謂瀹飛淙嘗是收來荷露缸伺候慣經聊聽爾以言甘實此無雙味甘書屋庚寅精藍之後搆書廬啜茗泉甘得味餘一晌南華悟口徹緩烹細瀹兩成虛味甘書屋辛卯寺後蕭然精舍宜浮香漉雪試聊為設如每事耽甘者語有之乎亦可思味甘書屋壬辰書屋清依古佛庵越甌吳鼎稱幽探今朝又異其中味半是泉甘半雨甘味甘書屋癸巳汲泉煮茗武夷尖口為去聲生津心為恬却笑回甘蘇氏帖還稱崖蜜十分甜味甘書屋甲午向汲山泉飲而甘書屋味甘名以此竹爐茗碗設妥帖試而烹斯偶一耳偶一之故室三間露臺十家産愧矣雖然乃更有進焉味甘敢忘味苦彼味甘書屋乙未几淨甌香早瀹煎頓消諸慮祇如然譬人飲水知冷暖甘否由來豈在泉味甘書屋丙申書屋綴景為灑然蕭寺左隔嵗此初來有暇便小坐茗甌及竹罏安設原貼妥石泉汲以烹略試文武火既非竟陵癖更殊趙州果擎杯吟五字爽然有會我味泉或偶宜味言殊未可味甘書屋口號辛丑寺後三間精舍幽竹爐茗碗味相投東坡却道輸崕蜜試問為同為異不味甘書屋口號壬寅竹爐到處學江南書屋因之號味甘泉固尚甘茶尚苦其間調劑義應探叢碧樓甲申下臨無地上虛空拾級心將皓氣通若問寺樓絶勝處徘徊祇在碧雲叢叢碧樓在碧峯寺松梢遙見剎竿雙寺後書樓朴且龎行亦不辭延逺徑坐惟喜近向陽窗葉疏林杪全呈嶺水退崕根祇剩矼猶是昨來題句處碧雲倐為去聲綘霞降題叢碧樓乙酉書樓枕坦岡畫樹四鄰張本是愛叢碧何來綴點黃聽惟增籟謖坐喜近曦光猶記前畨到開窗此納涼叢碧樓葉落歸根紫緑鋪叢間縱目那糢糊山樓有問如何答碧意其中亦豈無叢碧樓丙戌今嵗未登樓初登如昨秋四山碧雨洗一瞬景川流風過涼猶嫩日臨隂尚稠年來頻有句歷厯閲從頭叢碧樓丁亥寺後有書樓緑雲樓上頭覆隂猶密葉作籟恰新秋今嵗仍初到輕涼合少留小哉彼王粲咄咄祇言愁叢碧樓口號戊子底事逰眸不覺寬四圍山樹碧雲攢拈吟聊復酬風景欲棄陳言戛戛難叢碧樓己丑曲轉有廊通髙樓衆碧叢林中猶隱鹿鹿於八月始出林相哨天畔未歸鴻映日色流麗含雲氣鬱蔥漫斯誇張王二字皆去聲樹上已金風叢碧樓庚寅乘間聊拾級樓在碧雲叢孰謂全依緑居然半是紅越教牖增色可據座觀空去嵗拈毫况偶思同不同叢碧樓壬辰昨朝陳雨頗驅炎山路易乾濘不嫌便與輕輿尋窈窕因之層閣暢吟拈萬叢恰合真空界一碧寧容他色添襟袖飄然訝何也徐看風爽落林尖題叢碧樓癸巳寺後書樓萬碧叢登樓縱目四鄰通乘桴乍可喻浮海挂布何妨便趂風伯仲底須頻較緑艷濃端識絶勝紅壁粘舊作如昨日電影流光想像中叢碧樓甲午髙枝低葉總一碧萬頃都呈目前在山閣設若擬樓船是謂泛乎大青海何來幾點紅於中恰似星沈李句乃李商隱句星洗碧海當窗見叢碧樓乙未山樓八窗敞山峯四鄰納葉態與枝姿一碧萬叢合然疑嶽陽記奚必煙波挹縱目擬雲鋪披襟喜風颯據座略生慙斯豈陳蕃榻叢碧樓丙申樓出萬樹叢俯瞰連一碧恰似泛滄波洞庭與震澤而無風浪憂饒有煙霞癖憑窗偶會心可以喚浮宅却笑五湖人未免餘形迹叢碧樓辛丑山中所長去聲物曰惟髙下林一碧亦萬頃蔽峰還羃岑而樓于其中如泛緑海潯天籟落雲間飽聆激抮音設如撫絲桐成連或可尋回溪亭山凡一轉必回溪溪上有亭翼若棲今日吾心頗悅豫不妨觸處與留題栴檀林在山莊內水月菴之後殿三楹南嚮喬林彌望岩葩洞卉風過皆馨御書額曰衆香勝處聫曰佛國土三千花霏衆妙鼻功德八百林藹恆薰又聨曰巖秀蔚摩黎祥風遞馥林香薈薝蔔花雨交芬旁曰天籟書屋岩頂天池渟涵湛徹者曰淡軒堂坳咫尺勢若滄溟者曰滄洲趣松蟠雲蔚者曰松雲樓東為澄霽樓更東為超然宇境路幽敻上有樓額曰雲潤觸石浮空縈青繚白與天無際也御製詩題栴檀林乙酉竺菴過水月香林入栴檀颯然來天風鼻根清淨官靜室坐調御相好青蓮端綴景則不無而非心所安栴檀林丙戌馥郁天香石徑穿入流忘所得聞詮漫言薝蔔方堪並澗葉崖葩一體全栴檀林八詠風卉翕何來奏夏鈞聲聞總以靜為因了知室是維摩室吹去天花不著人雲薈蔚朝隮每潤樓傍楹間寫傍林浮霑衣何礙循溪步即是黃山暢逺逰月山腰半畝貯澄渟印入金輪泯色形丈室端然調御坐月天子聽法王經松就松築室松為幄資益常聽謖籟吹設使移來新子種童童若此定需時楓塞未飛霜葉未丹濃青猶復鎖林端問斯可是栴檀否八辨看來祗一般花潑黛秋山若沐鬟野芳紅紫淺深間釋迦大地胥拈起迦葉作麼笑破顔鹿命侣出林了弗藏印渥有篆不成章月明如水諸天靜鹿苑羣來謁鹿王蛩夕瑟晨簫伴玉塞草間石底韻金風五香薰體都清淨慈力何曾遺小蟲栴檀林水月菴傍入徑紆言尋精舍暢清娛一窗暖日遲豫坐四面秋山得爾殊法苑依然來鹿友梵居曽不著僧芻天香恆自林間噴豈繫尋常菀與枯栴檀林丁亥盤旋陟林巘清淨結花宫枝葉霏天香栴檀將毋同早是鼻根寂何有眼界逢應真左右圍調御坐居中室中供墨刻如來及十六應真像不以裝嚴飾內空內外空彈指視昨年猶為塵念蒙栴檀林戊子壘嶵更盤上雲棧殊嶔崟夾徑霏衆香是為栴檀林結宇雖不多廓落凌千尋聞復翳根除那覔去來今調御及應真室中奉如來及十六應真畫像坐證以無心栴檀林己丑岰㠡攀援上芬芳遞襲聞有聲皆靜寂無色亦氤氲調御恆如是應真迥不羣設云示真相真相落功勳栴檀林八詠霜坂白露為霜耀日鮮玉鋪谷底復山巔印來鹿迹疑人迹神向飛卿句裏傳氷池小小山池淳且澄塞寒九月早凝冰漫言稀見淪漣趣心向不波處可徵蜃窗山中朝暮䪺增寒暖席坐來久益安却喜蜃窗無障礙煙霞變態儘人看毳幔到處精廬書幔施􅯋􅰸禦冷代為之午暄縱望還因捲愧異仲舒久下帷落葉蔌蔌蕭蕭點砌陲落來初不藉風吹六章憶得曽研練詞費而今弗爾為緑蕪塞外誰云朔氣寒向陽原有緑蕪攢坐來獨惜濓溪老曾未於斯生意觀鶴磴龕鬖羽客唳崇椒不放何須更説招却笑丹臺伴仙子恐應輸此恣逍遙雀簷麻雀恆隨屋處安有屋處必有雀無屋處則無相關樂意啅簷端即今玉塞為靈囿微物應忘紇那干栴檀林辛卯跬步峰形有萬千淨香披處忘塵緣何須兜率天中覔澗葉巖枝豈不然栴檀林壬辰遵岡復少降精舍得夷嵕林入栴檀境味參微妙風莊嚴謝願海清淨契禪叢萬壑鳴天籟不空真是空過東嶺遂至栴檀林癸巳創得齋依東嶺近奈因事半陟嶔崟旋從隂巘清涼境降嶺脊則太陽落西為隂巘矣遂至栴檀功德林月宇延山千疊處天池貯水一泓深箇間只合忘諸慮何事居然又敲去聲吟過東嶺復至栴檀林自西而升嶺為東自東而登嶺為西乃知東西非定物借問莊生何以齊山齋創得已嶺半再進殊不勞攀躋遂由西升向東降栴檀林淨如我徯調御丈夫坐靜室一切分别忘筌蹄斯而詹詹仍有詠其于道也誠醯雞過東嶺至栴檀林甲午創得齋已居山腰東嶺非遙望中在趁爽肩輿便可登事半固知功有倍鯉脊卓立隂陽分陽暄那似隂涼塏過嶺清風滿襟袖林近栴檀所以乃調御應真儼同堂無去來今此誰待題栴檀林乙未風日今朝佳筍輿信所往溪邊泉落清樾下籟來爽棧道縱崎嶇亦可夤緣上遙見栴檀林已自生淨想衆香之所稡無聞以為賞精舍臨諸天豁然而開朗調御祗堂堂應真各儀像聖賢所從殊儒釋豈有兩題壁去年辭陳迹瞥俯仰過東嶺至栴檀林丙申橫嶺分東西東則栴檀林水月菴亦近向每留清吟巖齋謂創得躋嶺半言返類畫今事半而功倍進也語良諶水月兹姑舍檀林適可尋數武事已到坐我虛堂深一以息衆力一以暢逺襟巖枝及澗葉浮碧萬頃臨篤耨底須燒是香非世音反嗅得聞思調御證愔愔再題栴檀林八詠風林號栴檀非梵宫每來書屋坐秋風清機發處聞天籟仿佛東川寄瑩公雲山雲來去本無心我亦無心巖谷尋小坐却仍命輿返祇饒嵐氣濕衣襟月一燈朗朗戶前懸萬古光明玉塞天圎亦非盈半非缺法王面相印如然松秦家羞與大夫儔世外煙霞本色留欲問童童赤松子應真隊裏可曾逰