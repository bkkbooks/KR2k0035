不測澄懷託滄溟淡軒丙戌一泓貯天池山雨之所積了知底無泉靈氣蒸為液披風亦有瀾印月亦有璧可以泛虛舟可以對文席總不離淡然是謂適其適淡軒天半滄洲趣波瀾近砌坳雲霞勢若吐荇藻影常捎乍可鬚眉鑑何曽竿線拋慿觀淡然際君子悟相交淡軒壬辰一泓岩嶺似天池却近軒階淡照披半借人工半借雨亦㴠雲影亦涵曦鷗眠夜月從來穩魚樂春波未許知儻爾慿觀儻爾去底須芳餌弄竿絲淡軒口號甲午一泓天半即天池人力天工兩借之山腰雖有微泉得雨則水益壯不然亦借㪺水添之今日慿臨經雨後淡然恰喜鏡光披淡軒口號乙未天池雖小大於鏡徹底無風不作瀾寓義由來取其淡寧須江海較深寬淡軒丙申山巔艱致水一泓呈鑑池寧須波瀾寬所愛縠紈漪小軒搆其上每喜澄光披漫議石泉細半藉人力資夏雨滿陂塘亦有微漲時盈科縱無進濯清還有期賦得滄洲趣乙酉絶頂得天池滄洲趣正宜底須論大小常此貯瀾漪潤與雲為腳印呈月是眉牆圍防鹿友階俯數魚兒湛淨恆無竭渟澄詎有涯泉林緬遐想夫子在川時滄洲趣己亥天池原艱致窪樽戽以水頗具溶漾勢趣寓滄洲耳究費人力勞薄賞每於此每當無雨時憩此所司必汲水注池為點綴因酌量賞之今來乃弗藉雨足水存裏亦復梳荇藻亦復成沼沚小許無待多濯清有所喜滄洲趣疊己亥舊作韻辛丑在水每憶山於山復思水人情欲兩全斯即可知耳岩齋偶逰目俯清恰得此其源不可窮其流弗離裏雲衣與浮沈天池為渚沚得句亦超然秋晴值心喜詠滄洲趣壬寅塞上艱致水成湖自早年嶺巔塘半畝則因鑿蓄然旱亦若井眢雨亦如池淵􅉈後偶來對滄洲趣澄鮮觸景悟為學遑論枯于前松雲樓丙戍松倚雲為侣雲依松作巢濃青相映帶淡白有含包層構潤無盡虛疏望若交便當致秋雨優渥利山郊松雲樓甲午雲與松為友松將雲作衣髙樓恰相值據座似來依響愛披風颯潤疑作雨湄我非𢎞景逸祇仰五絃揮松雲樓乙未山中多古松不辨何年種自是虞夏物老於右丞弄就此築為樓四鄰蒼雲控濤翻嘉蔭活簧奏謖音送塵心息以淨那更云入夢松雲樓丙申雲來每依松雲去松還在固知雲無定而松恆不改雖然有轉語松雲詎他待試看緑容容豈非碧霞綵是則貫四時是其所以乃澄霽樓己巳戶牖平臨霽景䨑偶來登眺衆峰低山中草木霑堯澤樓上雲霞葆御題澄霽樓甲戌浮雲斂盡霽光披疊樹重巒靣靣奇不一層梯騁遙目安知物色此間宜澄霽樓癸未昨宵枕上聞雷雨曉起登樓納翠寒霽景澄鮮故宜望錘峰猶在片雲端澄霽樓即景乙酉快霽髙秋景最宜颯涼濕潤憑欄披昨朝驟雨飛千壑宫在水晶正爾為澄霽樓丁亥傑峙山樓樹杪懸千峰近逺矗晴煙坐來無際長空朗恰與吾心共廓然澄霽樓即目戊子一天霽景朗新秋千里金風滿谷流趙嘏不同携長笛也飛逸興倚髙樓澄霽樓作歌志懷己丑昨宵細雨曉快晴早收晚種均資利驅炎恰致人情欣不泥更喜馬蹄遂偶因餘暇一登樓騁目四鄰翻濕翠庭前種樹亦已長上聲有如是哉都順意都順意乃意易矜故弗敢康惕弗置澄霽樓即目書懷辛卯邇日秋山每作雲護霜緑樹惜殷勤霜遲斯葉緑雲布則無霜偶登樓級澄逢霽恰對簷題望特欣映旭枝頭翠猶滴翻風葉背紫微分林巒趣易知詳悉物理民情較此紛澄霽樓壬辰擇向各從宜山樓枕迥陂聊因秋爽陟恰喜霽光披漸覺生衣疊猶欣彩筆摛徘徊閲簷額即景信諧時澄霽樓口號癸巳山田望雨雨云霑晴亦佳哉爽却炎試上層樓俯霽景平看坐底逺峰尖澄霽樓己亥秋日何所宜所宜曰澄霽禾黍苗而秀秀而都吐穗晶陽以曝之結實乃飽致拾級偶登樓兩字額簷際萬里無片雲天水光含翠俯仰一縱目愜然適滿志在彼不在斯樂同彼農意澄霽樓言懷庚子孟秋之月屢作雲幸而小霔霖未遂山溪勃發無暴漲其來雖速退亦易無過行旅略遲滯山田好在潦弗致即今秋仲晴實定碧空萬里淨雲翳乘涼􅓏步一登樓欣懷澄霽真澄霽然亦欣懷豈誠欣南望低田猶繾意昨據馳問畿輔况已報窪區間去聲被沴昨因熱河一帶雨水頗勤南望雲氣更濃口內雨水必大低田不無被淹隨馳問袁守侗據奏詳查直屬州縣低田被水者計有十分之二而此二分中髙地仍屬有收統俟查明己未成災頃畝分數酌量籌賑等語因此殊深繾念澄霽樓壬寅天淡雲間時素宇宜澄霽霽景加以澄秋光美鮮上聲儷而更宜登樓萬里無纎翳乃知謝重誤奚必資點綴農功慶時暘茂實結榖穗題超然宇乙酉遙望雲中迥莫齊到來惟覺衆山低最欣倚檻逰目豁遂與揮毫信手題下士那曽知塞上東坡不異記膠西何當諸慮都蠲淨一卷南華悟管倪超然宇丙戌有宇曰超然恢恢樹杪懸秋清目愈豁霞舉意如仚夕照千峯落空山一徑連問誰送歸路蒼鹿與周旋超然宇丁亥因地既以髙得趣自以超然則資境乎子輿言非誵翹然企廣居寧祇圖遊遨超然宇戊子構宇雲霞表天風颯四筵暢觀無障礙結習總除蠲玉局見稱獨我心獲實天逰於物之外所遇自超然超然宇壬辰崇椒髙出萬峯螺結宇虛宜暢逺睋但得超然塵外趣底須作記倩東坡超然宇癸巳豁開敞宇衆山巔百里宛看在目前却笑御風詡旬七千秋一瞬總超然超然宇甲午地據衆峯巔泬寥空宇懸一心會倪管萬象泯蹄筌祇有虛為合却無塵可捐青雲表逰目得句亦超然超然宇乙未結宇層明崇嶺巔宇超然意亦超然居髙乃易卑視物戒在茲懷謙牧虔超然宇口號丙申與天為蓋與雲齊南望千山眼底低設論逰乎物之外子瞻未得詡膠西超然宇作歌己亥山已髙哉臺更髙因之名曰超然宇詎云津逮彼兩蘇覺勝膠西難計數徂雲片片無流連天光山氣相澄鮮一塵不到萬緣靜吾意亦與同超然雖然吾意更有説髙則無物不照徹古之帝王蔽冕旒水至清亦愁魚竭超然宇辛丑玉塞已絶塵塞山更逈宇至宇心超然寥景宜清睹爽風來有緣間雲去無所偶此暢余心亦復興别緒居髙可恃髙近民戒貽古超然宇壬寅地勢北髙南向卑膠西那足並肩斯須教蘇句重提意亦在于心自得之雲潤樓乙酉山雲本無定來去信誰羈能沃筆花潤疑霏墨雨滋寫楹愛斜帶出岫任橫披分付摛詞者休稱糾縵為雲潤樓山谷通靈氣英英羃翠饒吐時隱巖岫浮或入忩寮常覺衣衫潤渾堪坐起招歌卿當日事不舜却於堯雲潤樓丁亥豈必豐隆有所司英英靄靄吐無時坐來不覺衣裳濕始晤巖樓能爾為雲潤樓戊子雲以潤而生既雲復生潤相需相得彰氣求聲應迅層樓枕翠微寫楹時亦縉自下而觀者蜃閣猶疑信雲潤樓乙未緣廊進有屋拾級下為樓位置真稱巧餘間適可逰生雲潤靉靅度籟爽颼飂漫惜衣裳濕尋常易遇不雲潤樓丙申夏日易生雲山更生雲處層樓倚山架出楹恆寫霧天衣潤人衣任來亦任去作雨惟片時旋復曦光露名實信兩收農桑庶不誤雲潤樓口號己亥恆喜英英雲潤樓今來雨足望雲收一天霽景供和墨硯瓦却餘珠露留雲潤樓辛丑佳處緣何此到稀恐防深入致霑衣今朝得句真殊勝爽籟千林耀朗暉雲潤樓壬寅玉塞遍霑雨自今嵗至山莊承德府屬及蒙古札薩克地方雖屢得雨澤究未霑足至六月望前始得􅉈雨各屬及蒙古地方俱十分深透田禾暢發秋收可期豐稔山莊正喜㿩巘原都蔚緑草木總含芳拾級髙樓迥抒懷夏景長何非雲所潤今日不孤望彚萬總春之廟熱河水泉饒沃嘉植茂生自建置山莊以來人居稠密地氣早暄芳菲特盛每逢鑾輅駐臨夏卉秋英爛然盈目爰於御園內建廟以妥花神榜曰彚萬總春之廟廟門南向正殿五楹左右配殿各三楹廟傍為書舍曰華敷塢其東為峻秀樓廟基在煙波致爽東北戒得堂之後伏繹御書題額四時之氣賅備于春春之德普矣豈特為司花數典已乎御製詩彚萬總春之廟成因題句壬寅物具形斯神具司司花塞外豈無之新祠建置成不日示像因緣定有時水陸芳菲胥藉佑北南氣候漫嫌遲興州禮樂侵尋盛鼓吹應知是女夷題華敷塢彚萬總春之廟傍書舍名以華敷塢塞外花信固云遲桃李亦必春暮吐我來每值夏之仲華敷時節恆弗覩循名責實似不當雖然我亦有轉語夏卉秋葩豈不然何必拘墟執時序稽含草木疏稱博勝地靈根恐漏譜峻秀樓樓對東山稱峻秀朝陽暉映滿園芳芳鄰華也秀鄰實酌劑劉楨言此合當鷲雲寺在山莊內西峪秀起堂之側東嚮御書門額曰鷲雲寺內為正殿三楹供諸佛菩薩前簷額曰福因殿殿中額曰法鏡同圓聫曰上塞湧花宫全莊七寶西峰開鹿苑合證三輪殿後崇樓三層前簷額曰香界閣最上額曰須彌春滿次曰蓮峰甘露下曰普門妙現雕甍插漢寶鐸韻風俯視羣山若蓮臺層湧也珠源寺在水月精舍西南東嚮聫額皆御書門外石橋跨坊二前曰恆河普渡曰德水通津後曰彼岸同登曰法流喻筏門前石坊面北額曰披雲演梵聨曰香界現金銀無量無邉莊嚴最勝法琉滙珠琲不離不即感會真常西南額曰聽雪超塵聫曰優鉢光中證十二因緣金剛常住摩尼圓際參八百功德水觀同澄寺門額曰珠源寺門內三楹額曰定慧門前為天王殿中為佛閣上額曰宗鏡閣下額曰海藏持輪聨曰梵天閣湧金光聚香水瀾回珠顆圓後殿為大須彌山供一切諸佛菩薩最後飛樓十三楹曰衆香樓寺據瀑源來處故曰珠源斗姥閣在山莊內青楓緑嶼之上南嚮殿三楹前簷額曰慈蔭天樞殿內額曰巨光普潤聨曰獻夀千年外來朝數月間並聖祖御筆西配殿皇上御題額曰蓬山飛秀閣冠崖巔雲霄尺五萬象皆呈如依斗極而拱北辰也靈澤龍王廟在山莊內湖北岸東嚮恭祀龍神上懸聖祖御書額曰靈澤皇上御書額曰潤沃濡源湖水從東北入宫牆滙為太液澄流衍澤潤被塞堧蓋龍之靈昭昭云欽定熱河志卷七十八
