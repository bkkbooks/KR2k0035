body:
  text: 行宫五雲帆月舫芳渚臨流雲容水能心澄泉繞石澄波疊翠石磯觀魚鏡水雲岑雙湖夾鏡長虹飲練甫田叢樾水流雲在雲帆月舫倣舟形作室上為樓面北聖祖御題額曰雲帆月舫在如意洲延薰山館之西窗櫺洞達綺縠疏通前挹湖波後銜沙渚波平風軟宛然水際虛舟也聨凡三一曰似疑畫楫浮天上欲挂輕風入鏡中一曰秋心宛在水精域晴色遙呈罨畫天後楹聨曰照澗波縈青雀舫輕橈相趂木蘭堂聖祖御製詞雲帆月舫調太平時三集臨水倣舟形為閣廣一室袤數倍之周以石闌疏窗掩映宛如駕輕雲浮明月上有樓可登眺亦如舵樓也閣影凌波不動濤接靈鼇蓬萊别殿挂雲霄粲揮毫四季風光總無竭卧聞簫後樂先憂薰絃意藴羲又御製詞雲帆月舫恭和皇祖聖祖仁皇帝御製元韻調太平時辛酉鎮倚朱闌看翠濤壓金鼇層樓十二薄璇霄好抽毫與物皆春民共樂舞韶簫宇宙太和一人德地天爻御製詩雲帆月舫壬申舟閣傍煙湖浮居有若無波流帆不動漲落棹如孤牖幔披雲揭樓欄共月扶水原資地載所見未云殊芳渚臨流由萬壑松風西行稍折而北傍湖一曲有亭南嚮聖祖御題額曰芳渚臨流巨石嵌空巉巖秀削夾岸嘉木灌叢芳草如織清輝倒景迎風自馨遊鱗來往於苔隂逺禽出沒於煙際藻影涵空溪喧流韻洵乎飛潛動植交呈化機者矣聖祖御製詩芳渚臨流三集亭臨曲渚巨石枕流湖水自長橋㵼出至此折而南行亭左右岸石天成亘二里許蒼苔紫蘚豐草灌木極似范寬圖畫隄栁汀沙翡翠茵清流芳渚躍凡鱗數叢夾岸山花放獨坐臨流惜谷神御製詩芳渚臨流恭和皇祖聖祖仁皇帝御製元韻辛酉池如明鏡草如茵瀺灂時看泳錦鱗自是天心樂育物花香鳥語總怡神芳渚臨流壬申孤亭據懸岸座俯水晶宫曦影錯金碧春流泛紫紅塞情間入古川氣冷隨風來者為誰氏維詩味不窮雲容水態梨樹峪之東懸崖列嶂靈澤龍王廟建焉山麓砥平架屋臨衢壘石為堞其南有殿五楹東嚮聖祖御題額曰雲容水態橫峯側嶺獻秀爭竒有時片雲觸石則繚白縈青與遙波相際當寫照澄潭空明淡蕩㴠影流光狀難究擬蓋雲無定容水非一態也面西樓三楹切漢倚霄疑在天半登臨縱覽氣象萬千御題額曰曠觀聖祖御製詩雲容水態三集關口之南有室東向緣坡下望緑樹為田青峯如堵川流溶溶白雲冶冶不知孰為雲孰為水也由長橋而渡疑入四明山中一徑分過雲南北雨過雲容易散波流水態長存悠然世俗為念必得經書考原御製詩雲容水態恭和皇祖聖祖仁皇帝御製元韻辛酉水態溪邊尚爾雲容天際猶存夢裏舂音世逺身沐恩波我原雲容水態壬申寄意屬空濶開軒見水雲波輕含蔚靉煙細結漪紋飛鳥去何極遙舟望莫分祗饒風度處依約櫓聲聞澄泉繞石入梨樹峪一徑青蒼延緣山趾泉自石竇出峯回路轉隨石曲折數里許有亭北向聖祖御題額曰澄泉繞石後倚層巘前鏡清漪泉流回洑如琴築響如璆琅音雲根緑淨水石相遭之勝備矣聖祖御製詩澄泉繞石三集亭南臨石池西二里許為泉源源自石罅出截架鳴簹依山引流曲折而至雨後溪壑奔注各作石堰以遏泥沙故池水常澄徹可鑒每存髙靜意至此結衡茅樹密開行路山長疑近郊水泉繞舊石雉雀樂新巢晴夜荷珠滴露凝衆木梢御製詩澄泉繞石恭和皇祖聖祖仁皇帝御製元韻辛酉不必棟稱玉偏誇茨是茅石泉回緑野草木遍青郊溪漲魚添子春深燕補巢琅玕刻畫處猶有兩三梢澄泉繞石壬申一注亦何取端宜石與停動中原有靜秀處總能靈出匣寧非玉支機本是星山花將釀酒可以駐千齡澄波疊翠亭三楹北向在如意洲之隂聖祖御題額曰澄波疊翠湖光一碧遠極天際面北諸峰岡連嶺屬遙青萬點空翠千尋仰出層霄俯臨無地斯亭之大觀也亭畔古松一樹根四出盤石上鱗鬛蒼然時聞松子落聲大可皆合抱云聖祖御製詩澄波疊翠三集如意洲之後小亭臨湖湖水清漣徹底北面層巒重掩雲簇濤湧特開屏障扁舟過此輒為流連正如韋應物詩云碧泉交幽絶賞愛未能去疊翠聳千仭澄波屬紫文鑑開倒影列返照共氤氲御製詩澄波疊翠恭和皇祖聖祖仁皇帝御製元韻辛酉月上池開鑑風來水弄文千秋垂睿藻煙翠共氛氲澄波疊翠壬申峯翠落湖心悠然意與深遊魚欣覔樹飛鳥訝迷林宸藻猶雲日崇情自古今煙霞蟠水府深夜有龍吟石磯觀魚由遠近泉聲而下略彴斜通清溪一曲有石磯焉俯視澄波潛鱗涵泳噞喁瀺灂悉可指數如浮空際如在鏡中石平如砥可以坐釣作亭其上東向額曰石磯觀魚聨曰栁嫩牽詩舫鷗眠穩釣磯可以想在沼之文遊仰在川之聖悟矣聖祖御製詩石磯觀魚三集遠近泉聲而南渡石步有亭東向倚山臨溪溪水清徹修鱗銜尾荇藻交枝厯厯可數溪邊有平石可坐以垂釣唱晚漁歌傍石磯空中任鳥帶雲飛羡魚結網何須計備有長竿墜釣肥御製詩石磯觀魚恭和皇祖聖祖仁皇帝御製元韻辛酉重把青竿坐釣磯間看溪鳥掠波飛漁歌漫憶吳江水絶勝鱸魚秋後肥石磯觀魚壬申野水時深淺遊魚意更嘉名奚辨鯉鰋樂豈避鳬駕或躍浮波月間喁落壁花坐磯竿不把適可悟南華鏡水雲岑殿五楹在天宇咸暢閣下西向聖祖御題額曰鏡水雲岑聨曰阜接東山浮栁嫩泉連西苑泛花新又曰雙澗常流月千峰自合雲殿倚山搆極水周三面曲廊外布回抱如半月檻隂架渚櫩彩乘漪中懸御書金山額以狀似紫金浮玉得名下有亭曰芳洲練影灣環雲峰縹眇北固諸勝如在目前視江心拳石更覺别開生面也聖祖御製詩鏡水雲岑三集後楹依嶺三面臨湖廊亷周遮隨山髙下波光嵐影變化煙雲佳景無邊令人應接不暇層崕千尺危嶂涵緑幾重碧潭獅徑盤旋道北松枝宛轉山南沉吟力盡難得懸象俯察仰參至理莫求别伎經書自有包函御製詩鏡水雲岑恭和皇祖聖祖仁皇帝御製元韻辛酉古樹迷離翠嶂秋波澄徹寒潭畫舫渡人溪北虛窗留客軒南楓葉槲葉紛錯松枝竹枝差參宸章千載猶爛妙理萬象都函鏡水雲岑壬申水鏡涵虛朗岑雲逺接連儘看流動意不著象言詮嵐影落空翠波光合暝煙仰參兼俯察懸象皇祖御題有俯察仰參之句易藴睿題全賦得鏡水雲岑己亥水鏡靜含照岑雲動以間四言留聖迹五字破天慳不競觀流處俱遲對在間金山畫如展是處亦名金山玉局帶難扳仁智妙兼會羮牆望久間瞪乎行莫逮把筆益慙顔金山甲戌湖中一峯聳起上建傑閣步廊周遭碧波千頃皇祖記所云如登妙髙峰上北固煙雲海門風月皆歸一覽真情實景不即不離銀瀛一朵青蓮聳瑤屏琳岫相環拱龍鱗之石翠羽木祖洲碧草鋪菶峯枝撑才出緑雲幽朱閣三層居上頭恍如妙髙陟浮玉北固嵐光與目謀灤江已似惜稱小寫景天然此真好洞庭樂是鶴鹿鳴猶憶軒轅茲訪道金山用舊作遊金山寺再疊蘇軾韻癸未江無塞外與關中宛轉東流同入海歸宿既同源豈殊此何不可金山在亦峯聳秀亦坡陀包山屋亦圍臨波層樓阿閣實遜彼但取其意寧取多四十年前武丁楫南戒北戒一舜日逺懷南國錫北名玉篆金題璽文赤是時新秋過望魄氷輪遲上晚微黑須臾朗照大千眀坡翁奇想同堪驚英雄欺人索須識江心火炬誠何物坡也而誠歷塞山應更奇想句警頑笑我嘵嘵詞不已如對江海而言水雙湖夾鏡湖水自東北入南滙山泉為小湖山口石堰橫亘隄岸天成南北卧長橋水從西而東泛衍為大湖跨橋寶坊二其北額曰雙湖夾鏡南額則長虹飲練蓋隄礄左右分一湖為二也石稜沙觜迤邐連延每曦光散曉魄影澄秋如玉鏡新磨氷奩對啓鳬鷖水寉顧影飛翔天水空明煙雲演漾雙湖勝境難畫難書矣聖祖御製詩山中諸泉從板橋流出滙為一湖在石橋之右復從石橋下注放為大湖兩湖相連阻以長隄猶西湖之裏外湖也連山隔水百泉齊夾鏡平流花兩隄非是天然石岸起何能人力作雕題御製詩雙湖夾鏡恭和皇祖聖祖仁皇帝御製元韻辛酉卧波新緑帶痕齊那數餘杭蘇氏隄把筆試吟草年事秋風黃葉不堪題雙湖夾鏡長橋界平渚雙鏡恰連波蕩槳蒼蒲隱鳴鞭碧浪過春煙低岸栁露氣襲汀荷白也詩無敵於斯津逮多長虹欽練長橋之南寶坊額曰長虹飲練與雙湖夾鏡對峙皆聖祖御題橋碑文石恭勒御詩于上兩岸煙瀾渺瀰楊栁紛敷異花滋蔓掩映白蓮縟采清芬彌望如一每風來彀皺雨霽霓橫元暉淨練之詞太白彩虹之句合之兹橋兼擅其勝矣聖祖御製詩長虹飲練三集湖光澄碧一橋卧波橋南種敖漢荷花萬枝間以內地白蓮錦錯霞變清芬襲人蘇舜欽垂虹橋詩謂如玉宫銀界徒虛語耳長虹清徑羅層崕岸栁溪聲月照階淑景千林晴日出禽鳴處處入音諧御製詩長虹飲練恭和皇祖聖祖仁皇帝御製元韻辛酉武夷帳幄列雲崖為有虹橋可作階此日逰仙重容與溪聲猶奏緑琴諧長虹飲練壬申垂虹天際亘望近到猶遙象渚源瓊曲鷗波影綺搖城疑乾闥幻樂是洞庭調􅓏步披三秀何殊陟紫霄甫田叢樾湖北岸最東亭曰甫田叢樾聖祖駐蹕山莊於兹閲習步圍故有取於甫草之義地與萬樹近平原茂木曠如翳如飛走充盈連羣接翼廣場地迥靈囿天成不數華林勝概也聖祖御製詩甫田叢樾三集流杯之北􅏨圃之西平原如掌豐草茂木麕麚雉兔交牣其間秋涼弓徑合蒸徒行步圍誠獵場選地留憩田間樂曠觀恤閭閻叢林欣賞處遍地豫豐占御製詩甫田叢樾恭和皇祖聖祖仁皇帝御製元韻辛酉緬想雍熙治深恩被閭閻太平無氣象只向萬民占甫田叢樾壬申膏壤傍雲涯藝藝動植皆含生適真性妙趣託澄懷試馬掄懸鏡玩鵝辨折叉周詩徒頌武未若此間佳水流雲在湖北岸最西亭曰木流雲在聖祖御題三十六景以茲為殿其地漸近長隄湖水澄虛空明上下水連天而澄碧雲映日以浮光曰流曰在水有本而雲無心即一亭之取義動靜交呈淵深妙旨悠然與造化同符矣聖祖御製詩水流雲在三集雲無心以出岫水不舍而長流造物者之無盡藏也杜甫詩云水流心不競雲在意俱遲斯言真有體驗雨後雲峰澄水流逺自凝岸花催短鬢髙年寸寸增御製詩水流雲在恭和皇祖聖祖仁皇帝御製元韻辛酉秋水與天澄行雲倒浦凝撫今還憶昔乾惕寸𠂻增水流雲在壬申留憩觀雲水澄渟會意悠逐章經遍和五字更從頭遊豫無非事經綸有大猷日流日常在聖意照千秋欽定熱河志卷二十九
