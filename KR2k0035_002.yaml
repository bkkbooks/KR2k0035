興邈悠遙峰青乍掩空宇白如流牧馬聲全息虞人火未收蒼茫煙靄意恰似憑江樓度林霑落葉拂鳥濕輕翰沙磧渾無坱蹄涔略有瀾却迷千里翠微覺一畨寒贏得氊廬暇拈題興未闌意行意行騎馬徐馺婆塞山磧水來參我忽上層峯下視雲如泛千里凌風舸潦收澗口汲冷泉葉脫枝頭摘殘果松崖雨後緑髯張楓岸霜前赤霞鎖縈青繚白含大虛乾端坤倪豁􅛦閜更從天外眄遙尖點點煙螺殊砐硪飛來靈鷲只虛名似對雄風言堀堁應接無暇足吟拈千仞岡頭凝慮坐今朝御鳳小遊仙洪崖右拍赤松左曠觀契妙所得多謂豫從禽聊復可曉月過望月就匡大明引朝暾寒光尚欲流素影直可捫中秋倐已徂撫景懷髙奔溪霜點清冷巒煙互吐吞西宇不忍傾隱隱留纎痕即事忽捲朝嵐露嶂屏芙蓉面面佛頭青瀑飛天半徐聽處疑是東陽水樂亭紫翠繽紛萬狀竒停鞭攬結恰移時有情詩思無聲畫誰為山靈一寫之繡壁繡壁雲開當面時是他是我費尋思若云他我原無二碧眼胡僧笑汝癡讀書效朱子體丁邜古人曾有言力學如行路設不進一步即為退一步髙秋駐行宫清暇鮮幾務耽書有宿緣娛此深山暮即景自體驗未覺勝前度踟蹰生愧慙空復尋章句行漏塞北燕南隨境别風晨雨夜報時同因之悟得相應處只在尋常不息中涼塞雨能增冷秋山不障寒馬蹄輕可試鷹羽徑思摶埭草將霏白巒楓欲作丹總催秋稼納農慶築場寬曉行曉行亘驛路夾衣侵峭涼愛此晨曦殷離離白露光馬度阪莎濕風拂崖荔香山田銅雀鳴秋稼如雲黃誰云地利遺墾植彌遐荒究不免飢寒翻以增徊徨新月西宇遙看挂玉弓中秋數上聲日未云中已勝十一月中月普照三千空外空椒風荔影共徘徊疑是仙家白玉臺漫説錢塘潮好看萬山齊赴湧金堆朦朧煙樹夜齋清借助遙村雙杵鳴會得前秋詩境界太虛何物惹間情沈家村前嵗沈家村他處歉秋此較好今嵗沈家村却同他處登萬寶安得遍海宇皆似沈家村旱暵可戽潦可泄五穀常穫孶雞豚村內老翁抱其孫憮然獨不喜蹙眉相與言三時勤農實已憊逺近俱收向誰賣塞山塞山紛合沓逺近望中分有樹都張錦無峰不範雲馬前橫黛影空際疊螺紋孫綽天台賦那如大塊文雨塞雨灑涼秋山雲湧似流輕寒增幕底野水漲溪頭牧馬嘶聲壯飢鷹側翅愁命車傳罷獵聊學魏文侯止頓就平崖千廬次第排攻車雖有制漸石亦堪懷楓嶺湔紅葉蘭臯潤緑荄消間帷殿裏書史作生涯晴急雨如飛晴亦速夾衣馬首頓生涼擘雲朱鳥天中杲朗照千峰紫翠光椒風謖謖椒風壯商聲果是商入林驚落葉隔嶺淡晨光藉草全霑露純綿且禦涼吟成聊紀節屬賦讓歐陽八月初十日對月有作東嶺漸徘徊流光朗磧臺弓弦將欲滿桂樹若為栽五日何須盻中秋依舊來棘闈相照處遙企得真才曉行即景夜雨釀晨寒曦輪隱峰半旋旋暖光吐林樾增輝絢露重馬蹄濕巒回鳥道轉曠谷捲千幕野火騰餘爨氣壓不能升結作白雲片始穿雲際出忽據雲上看乃知嵐靄竒總自人意幻攬轡立斯須清吟紀所見中秋即景豈誇朗朗與昭昭大漠凄清天泬寥萬里隂晴同此夕千秋吟賞逮今宵繁絃急管聲翻閙氊室藤窗興自饒莫更翠峰升極頂嫦娥那許便呼招疊舊嵗中秋帖子韻并令梁詩正蔣溥和之有序羲和轉嵗仍當少昊蕭辰塞磧冝秋恰值望蟾佳節眄側峰與橫嶺都歸朗照之中更荔露而蘿煙總助廣寒之景單椒止頓萬幕雲披蘭殿稱觴千秋山對歡同中外翠瓜并花餅分頒澤逮輿儓原鹿與澤麋遍及又何必中庭地白歎秋思之誰家塞外草衰感邊聲之四起者哉因思鸞箋綵帖創自去年便教步韻連吟用酬今夕縱非彤墀瑣闥陪屬車者越有鄒枚何妨摛藻拈豪居右座者莫期司馬爰成首倡各進載賡風清月白好秋間應節吟詩不可刪底事今宵輪見早此山髙外更無山嫦娥還守一輪光倣佛風吹桂子香今夕三條銀燭下萬人昻首眄雲匡帖子宜春例可師堆盤瓜餅入新詩偶拈舊韻氊帷裡不異秋風太液池籟是仙韶松是樓廣寒法曲宴中秋便教即景龍堆畔也勝徴詞玉殿頭曉月泫露凄風碧漢陲寒光偏共曉光披莫嫌規影將虧半不讓團圞三五時蕭疏涼影落楓楸白處微知澗水流西嶺不教飛度速應緣回首惜中秋大漠四更山吐月秋風八月馬嘶晨前年詩景分明在瑩目清光不染塵山雨山雨斜飛馬上看崿峰浴翠樹湔丹溟濛作勢霏林霧倐忽奔流漲峽瀾麥隴菜畦方沐澤氊廬布帳漫愁寒清吟别有關心處萬慮何能一戚歡閲本口占此豐彼歉總難同物理人情豈易窮只有孜孜勤政意無分塞外與宫中霜塞垣先識冷白露早為霜度草無留緑霏林不約黃蕭森餘夜氣熠耀晃晨光鴻雁偏知信南飛呌數行山市行海客談蜃樓絳宫明滅杳難覩齊人詡瀛洲三島荒唐無處所豈如山市擅竒觀惜乎初未聞之古秋山行旅舊曾圖煙樹蒼茫知幾許水氣嵐光同一如爰為標名詩以譜雁塞龍堆萬嶺盤風清霜白九秋序曉星初上殘月明寥天將曙朱輪吐停鞭絶頂少徘徊山腰薈蔚才一縷非煙非霧復非雲如嶽如樓更如櫓須臾變幻滿空白幾點金焦露齲齲翠柏丹楓時隱現陡壁懸崖互容與乍合倐離難捉摸馬騰波赴誰部伍如從雲海泛騫槎咫尺琳宫並瑤圃谷神遊戲有是哉畫家留白此鼻祖暖侵尋軟暖變輕寒栁尚拖青楓半丹因識秋光留避暑木蘭行獵畢將回蹕駐避暑山莊從教涼意别興安風緣谷曠全非峭天為山疏漸覺寬菜圃蕎畦均倍穫農功南望頓生歡九月朔日作夜雨漲野水曉風驅絮雲驛路九秋景客鞭涼露晨鹿柴有人家煙火東西鄰塞行將及月聞雞意却欣萬里玉關外憶彼長戍人村行山田收罷圃場盈拍拍時聞耞板聲一路好秋經飽看思量不負嚲鞭行蔭槐環栁柴扉接背嶂臨溪板屋重不道古來征戍地家家水碓熟冬舂老翁曝背繞兒孫莫笑田家老瓦盆東舍炊煙引西舍後村流水到前村韭圃松畦生意足豆棚瓠架葉聲乾從容茅店咨終嵗迤邐蘭衢破曉寒點綴霜華白石津蓽門隱映靜無塵隔林却見青簾颭便有尋廬問酒人婦織男耕長作計雞鳴犬吠鎮相聞即看邊外閭閻富百嵗熙和豈易云即景萬嶂自縝紛中峰獨出羣紅霏殷露葉白重護霜雲漲影懸崖落剽聲古寺聞詩人易看待點筆與平分一嶺界雙水雙流滙一溪問誰為布置莫與識端倪野鳥呼名異山田納稼齊侵鑣寒氣重滿谷霽煙低素節凄清裏秋山來往中賞心隨所遇拈詠詎從同樹耐微霜緣峰銜落照紅豁然無點翳寄興在長空振蘀行山莊回蹕林猶緑一夜霏霜幻何速兼以谷風颯沓之振蘀須臾萬山秃鹿呌榛煙失所藏幽禽下樹􅡪殘黃平湖貼貼如湔錦奚必三湘七澤傍宛轉忙飛更問委憶六年前曾詠此同時賡者存歿半况兹薄質胡可恃雨戲成一韻體剛覺詩題少山靈送雨霏應緣留宿宿便與駐騑騑罨牖峰無滓迎階菊有馡晴開雲巘迥畫境是耶非曉行寒峭霜蹄重長村復短村意行供攬結到處足雞豚度寺聞清磬停鞭愛曉暾石田租稅少無慮吏敲門欽定熱河志卷二
