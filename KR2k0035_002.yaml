body:
  text: 欽定四庫全書欽定熱河志卷二天章二聖祖御製詩塞外對雨初集奮雷殿殷鳴大澤飛雨千山萬山白草色花香濯更新荒岡處處流泉脈回望神京接塞雲雨聲應得四郊聞黍苗翼翼平疇逺多少農人話夜分塞北早秋萬馬邊聲合千旓嶂口開霜威隨出塞秋色壯登臺雁度連營去鷹呼絶巘回蒼茫雲海月永夜照龍堆興安夜連峰橫亘塞東西緹幕髙臨百尺梯坐覺銀河天際近仰看珠斗夜深低夏日口外寄宫中二集翠蓋鸞旌出平明刻漏同油雲驅暑氣時雨引清風山脈經年秀泉形此日充遙遙千里外回首憶深宫養病塞北寒蟬鳴野樹旅雁過秋蓬嶺外皆紅葉城邊有緑桐身虛苦夏熱多病愛清風山色猶然在人顔漸不同幸無烽火事喜有智神功古北塞上望月桂樹清光挂碧天雲開萬里塞無煙逺人向背由敷政惟在籌邊與任賢口外中秋荒外天低夜有霜一輪明月照蒼涼不貪玉宇瓊樓看獨在遐陬理外疆塞外新秋三集松塞雲峰轉邊陲秋氣長楓林消溽暑柏葉送清香禾黍宜關外情懷喜夜涼年豐還重穀處處有餘糧夜聞雷雨大作曉賦志喜秋成望澤意懸懸駐蹕山莊已數天雷送溪聲連夜雨罏凝香靄潤鸞箋開襟漏報殘鐘曙破夢茶敲活火煎半百無文惟自樂頓教心地作清漣賦得緑樹隂濃夏日長緑槐影蔭碧紗厨茂樹紛紛葉漸殊綿雨新霖消九夏薰風初熱未三驅末垂蟬咽濃隂下修景雲開炎署無長日山中吟詠畢氣清塞外鄙涼珠古戍三絶隱隱山頭皆古戍中原民力盡邊城曾聞父老經年戰回首生靈血淚盈其二金甌永固識人和萬里烽煙發興多設使山林有暗曉更須太息論如何其三舊日山中罷馬歎今時避暑樂清風窮兵豈若為觀德仁義無私八表同賦得雨灑石壁來潤葉隨風洗緑枝羣峰著雨盡離披隂霖又念農家業事事何煩先預知每日屆炎暑即赴口外掖輦視膳朝夕溫清自初夏皇太后偶爾違和故不至此清涼之境因詠懷一首敬書于箑頭恭進以接清風而舒逺慕之微悃而已遙想京中暑氣闌猶思上苑有冰紈山莊咫尺何曾逺欲進瑤池一笑看避暑駐蹕山莊六月間隂霖少晴自立秋日晴霽喜懷亢陽望十雨霪雨思晴天纍日貫秋序終朝潦水綿身雖無暑汗心實抱迍邅忽覩西風緊油雲逐嶺巔山莊夜雨聽灤河溜聲臨流震耳似驚潮滚滚泠泠眺綺寮夜色初分秋景霽風聲已送積霖飄皆因百壑歸來逺非是孤川自去饒何比長江無棄物小河水涸豈容橈山莊書懷賜大學士待旦勤勤望雨晴京南塞北察安氓已知雲斂無霪潦未卜田間有稻粳八月秋成歡宇內四方風景解春卿大川舟楫同憂戚更覺凝承信洛英賦得山林引興長四集曾讀杜詩解紛紛議論多遇時非泰運行道至蹉跎托迹山林趣披懷水石歌千年賦比興後世豈能過詠夏甘泉日永秩南訛清氣重雲入句多性理精研過盛夏豈因白首廢編摩其二信風已盡接朱明長養舂容草木亨潄露調冰消暑氣何如心靜則神清山居即事清商方至催蟬急林葉吟風暑漸遙三伏炎蒸才過半山居遍地喜禾苗秋幸出郊見收成志喜節屆啇秋早農忙屢嵗豐柴門歌再稔比屋樂同風人煙多慶色霜樹雜微紅極目髙低景山川一望中其二滌暑髙風至中分白露微草肥宜牧馬林薄好行圍水向階前注峯排雲外稀斜陽臨帳殿晚色祕天機賦得冬日可愛復卦初生處景隨玉管回前旗分鳥道後仗向龍堆愛日冬偏暖臨橋氷未開寬河行幸地越嶺少塵埃京中報到霖雨普霑亢陽愁久旱霖雨滿溝渠倐忽枯枝潤須臾卷葉舒千村勤襏襫萬頃足犁鋤企望收成後欣看穀賤書夏至山莊逢夏至齋戒禁中同翠渚萍先緑荷池花未紅葛衣求體便蔬食養心功偶得因幾暇偷間碧樹叢山中自詠一生何事不斟量老至偷間自可傷倦體每思依石憩俗情且喜對山忘舂容無計尋方便荏苒誰能駐景光濯足滄浪清水在企思歸詠舞雩傍山居迎薰避暑駐山莊四顧重重邱壑長雨後雛鶯歌密樹風前練雀舞斜廊靜觀得趣無非景佳興涵虛可致涼烹茗汲泉清意味箇中誰解有真香喜嶺外水土霜凝肥草淨無塵處處泉源漾碧津食少事多宵旰老暫偷間暇養吾身世宗御製詩夏日泛舟殿閣風生波面涼溯洄徐泛芰荷香栁隂深處停橈看無數纎鯈戲碧塘晚泛畫橈間泛暮霞明風細波微暑氣輕更轉碧山尋勝迹恰逢雙鶴似相迎月下間步間行曲岸邊西嶺暮蒼然草蔓迷幽徑橋危咽細泉溪風吹緩帶夜色逼吟肩徙倚看林杪雲間月影遷觀雨密雨如膏灑碧絲稻花漠漠繞長陂虛齋睡起推忩看私喜甘霖正及時前廊曲廊斜轉接修篁坐倚層巖意興長細草敷榮侵榻緑野花爭艷襲衣香碧梧枝上聽蟬噪翠栁隄邊看鶴翔此際間身無一事怡然嘯詠自徜徉書齋秋暄幽齋新雨後爽氣泛池荷碧落疏星淡晴忩皓月多隔花聞漏滴倚枕和漁歌更愛流螢好悠揚拂檻過扈蹕途中觀穫秋爽獵邊城天髙氣象清登場占物候觀穫暢皇情巖谷縈車騎雲霞拂斾旌豫遊叨扈從薄劣愧恩榮塞外中秋駐蹕邊庭夜中秋一鏡圓遙從滄海畔飛落碧峯巔溢彩浮堯斚流輝拂舜筵坐深光愈迥景物倍清妍塞外秋興二首路出關山外秋空日漸髙清霜凝曉斾寒色透征袍風徑飛鷹捷川長獵騎豪皇威揚四逺邊徼戢弓刀其二駐蹕依林麓風多野水鳴旌旗飄暮靄鐃吹咽邊聲雞塞霜逾白龍沙月更清卻看行殿外諸部盡歡迎避暑口外爽塏髙原古上都鬱蒸節候熱全無千尋木蔭招涼扇幾道泉飛辟暑珠時任鏤氷為鳥獸灣從銷夏泛菰蒲銷夏灣在吳郡洞庭西山何如此地隨仙蹕披拂清風勝舞雩口外山村鳥外窺煙樹微茫磧路斜地寒宜種黍坡暖好栽瓜比户裁駝褐居人置罝誰將淳朴意傳寫入中華田家即事二首沙磧髙低禾黍盈羣飛銅雀繞田鳴竹弓蒿矢堪驅嚇漫向黃雲試射聲其二戍烽罷舉息征塵肆力耕耘屬幸民榆栁隂疏秋社近緣邊笳鼓賽田神塞上晚眺倒影餘霞麗晴沙入望平千峯含暮靄萬幕起秋聲度壟牛羊下歸鞍雉盈割鮮將進酒邊月照髙旌雨後涼雨晴偏好邊秋氣轉清虹從林杪斷月傍隴頭生落葉飄含潤回沙溜有聲仰觀羣雁度寒影貼雲明途次暑雨泱漭夏雲屯滂沱塞雨繁繞渠沙路淨注澗石泉渾鸛浴依邱垤駝鳴傍水源涼颸起林末吹入小行軒山頂船樓樓居製倣船居好山檻風如水檻多飄渺千峯翻翠浪怒號萬木吼蒼波晴霞片片開帆影禽鳥聲聲唱棹歌間拄一篙雲外泛青松白石任吟哦早起寄都中諸弟曉起輕寒透薄帷風光節物暗催移正當邊塞秋臨早况是關山月落遲一雁孤鳴驚旅夢千峯攢立動詩思鳳城諸弟應相憶好對黃花泛酒卮熱河間詠七首塞北開行殿忩臨萬壑松雲封雙塔嶺煙鎖磬錘峯飄渺層巒接盤迥曲徑重紅塵難到處何事不從容其二一人臨塞北萬里息邊鋒朽木含生意間花逞冶容夔魈潛隱迹虎豹盡藏蹤羣動無紛擾惟聞響梵鐘其三避冗原無意搜竒念久灰境幽饒野趣山靜絶浮埃馴鹿時來去間雲自往回長年頥養得何畏景光催其四卜居豈為避三庚巒壑幽深氣象清絶頂蒼松多古韻前川皓月倍常明薄衾坐擁渾忘我髙枕欹吟别有情萬籟寂然銀漢轉一聲破夢曙鐘鳴其五泠泠碧澗勝絲竹疊疊蒼嵓列畫圖異卉手拈陳几案野蔬親摘付庖厨間中隨展經千頁睡起新烹茶半壺莫謂超羣解遺世廟堂清福一慵愚其六山深地僻塵囂隔斜蔭苑堂百尺松石辟有斑憑雨鑿柴門無鑰倩雲封盤巖曲磴留麋迹繞砌平沙印鶴蹤夢覺南窗何所事獨吟獨酌儘從容其七間來忘署兼忘我浩氣沖融貫太虛城市山林君子宅山林城市帝王居不尋仙客談元旨懶覔髙僧講梵書天地古今惟一嘯悠然自得有誰如熱河道中山色嵐光映馬韉軟沙細草緩鳴鞭花開遍野時飛蝶雲散晴空好射鳶孤店酒簾飄栁外幾家溪水繞門前穿林暮返擕鋤叟略彴欹斜度晚煙初夏扈蹕熱河行苑留仙蹕層巒儼赤城煙光濃樹色暑氣散泉聲地僻花偏艷山深夢亦清瞻依欣聖豫風物慰皇情山亭蔦蘿滿樹帶煙垂篩月梳風作幔帷流水似琴還似築青山宜畫又宜詩飢鼯竊果緣枝捷乳雉呼羣出草遲獨倚石闌舒逺目亭前幽谷起雲時畫欄薰風披拂畫欄東照眼榴花爛熳紅暑氣不親松閣內清隂常在竹窗中由來邱壑情堪寄即此蓬瀛路可通次第藥階香晚露纎纎新月上梧桐御製詩曉行辛酉滴窮玉漏夜闌干習習金風拂曉鞍野馬出山涼氣肅陽烏隱樹曙光寒孤村犬吠門猶掩古驛人行露未乾一幅河陽秋旅意不須重展畫圖看耆民趙可立一百二嵗矣扶兒迎謁道左尚能道前朝事龎眉皓髮扶鳩杖道左擕兒望翠華為説平生無外慕村居勤朴課桑麻山行萬壑千巖宿霧封朝暾光射見重重霜前楓色丹猶嫩霽後山容翠更濃煙塢雲程頻借問農夫野叟每相逢愛聽塞上傳聞語一百年來不舉烽野渡秋水添新漲晨光羃野煙漂波沙失岸䇿渡馬為船孤沚歸鴻集寒流絶塞連蒼茫迷近逺源在白雲邊涼山行涼氣逼煙徑露華濡村爨寒難起峰巒曉欲鋪丹黃楓葉染嘹唳雁聲呼松雪傳真迹邊關逆旅圖秉燭待章奏未至不為巡遊懈敕幾離宫獨坐厪民依銀檠猶待封章至鳥路應遲驛騎飛風裊爐香移夜漏月明虎帳正宵衣今秋稍解祈年慮遍野黃雲擁六騑新月山靜秋深新月小楸梧風動驚栖鳥歸羣牧馬聽人呼唧唧蛩音泣寒草猶憶昨年太液池金波搖漾光琉璃飛觴沸管詎不樂風餐露宿將何為將何為清歌一曲有所思塞上曉行馬踏霜華怯曉寒聲聲傳警列材官潺湲溪水行行渡罨畫山峯面面看壯士試開弓五石髙人猶卧日三竿升平閲武兼巡狩觸目吟懷興未闌關山月關山月秋倍明塞楓磧草涼颸生皎皎懸空漠海白沙蛩霜雁寒聲并關山月今異昔烽煙久靖田疇闢不似當年戌卒憶家鄉亦或戰場覆沒孤魂魄關山月昔異今即今秋搜乘興惟間吟前車堪作後車鑒持盈保泰惕豫心霧密鎖千林樹迷離暗曉光乍看平野白却失逺山蒼捲速全消日收遲為護霜塞上霧多則霜降遲停鞭遙望處添得幾峰黃馬上吟白雲紅樹鬪清秋盤鬱層巒紫翠浮霧捲馬頭山忽見橋臨谷口水微流停鞭愛看邊鴻度隔峪時聞野鹿呦笑我耽詩猶喜獵每逢佳景興偏留中秋夜對月崖巔升玉魄流彩座中移明是今宵甚看尤邊塞宜桂香初想處笳韻未終時猶憶幃城外秋思動者誰塞上秋塞逺朝逾冷霜濃曉倍晴千山紛葉落萬籟怒秋聲雲淨天容濶秋澄眼界明御風懷列子襟袖颯然清夜靜讀書日暮促歸鞍龍堆夜氣寒銀檠輝幔屋玉魄上槍竿嶺也把卷光明映忘言子細看邊笳忽吹動幾處落梅殘將軍塔爾岱久著勤勞養年私第今聞朕出口行圍不辭勞瘁而來詩以賜之百戰歸來矍鑠身凌煙姓氏竟誰倫養間合適林中趣憐爾仍隨輦後塵赫奕虎符叨寵舊輝煌竹簡紀功新為詢閲厯疆場事幾度聞之厪念頻塞上行緑含眉黛逺山斜點綴楓林襯彩霞莫遣寒笳吹玉塞更裁新句詠龍沙野田積土有人耕蕎麥收時秋麥生謾道二師能闢地當年空築受降城塞上中秋月似霜牧羣歌起疊伊涼歸駝都載新搜鹿絶少征人夜望鄉荒山時見有城闉舊話翻驚入聽新自是太平無戰伐莫教歡樂忘艱辛秋山秋山雨霽别穠纎觸目詩題逐便拈落葉風前自瀟灑野蔬霜後更清甜磧程遼濶行行逺樹色丹黃日日添射獵歸來回望處紅霞猶繞數峯尖聞畿輔雨澤霑足喜而有作六飛迤邐閲西成已慰祈年午夜情封奏更聞霑渥澤郊原秋麥想新耕塞上秋景盧龍風日寒況復臨素節藝黃帶露稀峯翠經霜潔宇空雲影淡流冷泉聲咽夙志慕髙清對此聊怡悅霧行霧行那識山程逺鳥道