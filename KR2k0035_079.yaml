body:
  text: 寺廟三溥仁寺溥善寺普寧寺普佑寺安逺廟普樂寺溥仁寺在熱河行宫東三里許康熙五十二年聖祖仁皇帝六旬萬壽蒙古諸藩恭建祝釐寺南嚮門額曰溥仁寺兼清漢蒙古文門內天王殿三楹恭懸聖祖御書寺額又內正殿七楹供三世佛聖祖御書額曰慈雲普蔭皇上御書額曰具大自在聨曰以清淨果證因護持斯萬現廣長舌説法震動大千殿廡立碑二恭鐫聖祖御製溥仁寺碑文左清文左漢文碑隂及碑左方恭鐫御製詩又內後殿九楹供無量壽佛御書額曰寶相長新聨曰虛無梵唄空中唱縹眇天花坐上飄寺屏山帶水剎影干雲恭繹聖製繼繩紹述慕切羮牆所由大千世界咸躋仁壽之域也聖祖御製文溥仁寺碑文四集康熙五十二年朕六旬誕辰衆蒙古部落咸至闕廷奉行朝賀不謀同辭具疏陳懇願建剎宇為朕祝釐朕思治天下之道非奉一己之福合天下之福為福非私一己之安遍天下之安為安柔逺能邇自古難之我朝祖功宗德逺服要荒深仁厚澤淪及骨髓蒙古部落三皇不治五帝不服今已中外無别矣論風俗人情剛直好勇自百年以來敬奉釋教並無二法謹守國典罔敢隕越不識不知太和有象朕每嘉焉鑒其悃誠重違所請念熱河之地為中外之交朕駐蹕清暑嵗以為常而諸藩來覲瞻禮亦便因指山莊之東無關于耕種之荒地特許營度為佛寺陶甓于冶取材于山工用無輸挽之勞金錢無踰侈之費經始訖功告成不日歷觀往史遹遡前朝版籍有區幅員未廣兹熱河之奧壤乃紫塞之神臯名號不掌于職方形勝無聞于地志朕以涼德撫育萬方邉牆之外悉為畿甸諸藩于此建寺介福率先恐後無小無大罔不來同觀我觀民思維此理特題額曰溥仁將欲汪濊之澤均霑率土升恆之慶廣洽普天遍覆含宏民胞物與咸躋夀考各遂生成藉諸藩祝朕之忠誠為萬方祈純嘏之錫爰紀斯文勒諸貞石康熙五十三年三月十八日御製詩詣溥仁寺甲戌祇園山館東佳氣鬱蘢蔥帶水塵凡隔屏山秀色融度橋尋淨地指樹識禪叢五日宜人霽一天華黍風占年惟此樂禱久更何衷拱讀穹碑罷是寺建於康熙五十二年中有皇祖御製碑文天襟想像中溥仁寺癸未朔日禮蘭若渡言武列濵松門瞻玉篆蓮座現金身忍草衆香國禪枝大法輪敬窺當日意溥願物歸仁過武列水詣溥仁寺瞻禮甲申武列潦全退柴稿宛易搘過河路非逺策馬意為怡香界梵聲出寥天霽色披早粱有穫者按轡看移時出山莊詣溥仁寺瞻禮丙戌梵宇建多年每來展謁虔過河無盛潦滿谷有良田即看西成近稍紓午夜懸仁皇貽樂利溥被浹垓埏詣溥仁寺瞻禮己丑河畔多年建梵宫寺建於康熙癸巳年雖以時修葺兹奉皇太后慈諭復飭莊嚴鼎新瞻禮策青驄顧名緬昔期民樂寺名賜額皇祖所也祈實斯今祝嵗豐有相莊嚴亦真諦惟檀德業自慈躬瓣香心願於何結無量夀希與佛同溥仁寺瞻禮庚寅渡河策馬謁花宫聳倚峯青垣繚去聲紅兩字溥仁含覆遍千秋聖日照臨中誰云佛教異儒教試看不同有大同詎止山莊孳萬户九州恩澤被無窮溥仁寺瞻禮壬辰渡河梵寺禮金容結搆猶堪仰舊蹤真是虞書見唐帝奚稱宋史贊仁宗民情樂利芃青稼聖日光華朗碧峯無作率由尚瞪若亹豫惟益勵寅恭六月望日溥仁寺瞻禮因閲稼癸巳過河禮梵寺便以閲山田華黍翻風秀錦蔬帶露鮮法門入不二月相映同圓敬識當年意溥仁遍大千溥仁寺瞻禮甲午興州最古寺每到禮應親策馬河橋度垂鞭農務詢即看優澤霈實勝小霑頻熱河一帶近每霑三四寸之陳雨然不似此畨十分透足也屏息法雲地溥仁真溥仁過河詣溥仁寺瞻禮乙未祇園底事定瞻禮為有奎章楣梠懸六十餘年敷厚澤百千祀世示乘乾能仁仁亦謂斯耳曰溥溥誰得並焉煙火萬家民樂利萬家煙火隨民便山莊中皇祖御書聨句也山莊小試已如然過河詣溥仁寺瞻禮丙申穹碑一拱讀康熙癸巳恭遇祝釐皇祖六旬萬夀諸蒙古王公懇搆梵剝皇祖鑒其誠悃遂仁允於山莊東建此寺額曰溥御製文紀其事立碑寺中猶見衆藩誠懷畏至今切河山奕世盟伊余守家法逺域奉朝正自平定準噶爾以後新附諸藩俱以每嵗八月間至山莊隨內札薩克諸蒙古王公慶祝及土爾扈特全部歸順其汗渥巴錫等復率衆朝覲宴賚於此隕越庶免議惕乾益凜情過河詣溥仁寺瞻禮己亥清曉鳴鞭過武列詣溥仁寺必須過橋此河為固都爾呼即古之武列水也乘涼減從謁祇園祝釐昔日諸藩部此寺係康熙癸巳年蒙古王公等捐建以祝皇祖六旬萬壽考迹此時古法門熱河所有諸寺以此為最古試看度生藉慈力詎殊畫象注乾元循名責實于斯切佛道中原世道存溥仁寺庚子最久招提武列東此寺康熙癸巳年蒙古王公建為為皇祖六旬萬壽祝釐于諸寺中最久奎章題額企思中溥仁原寓止仁意梵教由來儒教通樂利仍看今自昔人天底論色分空施檀供養留慈迹瞻禮無端感切衷溥仁寺瞻禮作辛丑初地真初地是寺為康熙年間衆蒙古扎薩克恭祝皇祖萬壽而建為熱河創有佛宇溥仁緬溥仁萬方貽樂利百世仰尊親慧樹三天古禪花四季春教為神道設總為去聲牖斯民溥仁寺瞻禮壬寅祇園歷六十年陳肯搆於斯合鼎新溥仁寺自康熙癸巳蒙古王公等為周甲皇祖恭祝六旬萬夀所建計今又逾爰敕所司重新丹艧亦志堂搆之意恰值丹青兹慶落因來瞻禮至誠申渡河多稼迎眸潤過雨千峯著意皴免賦以三蠲漕二將天皇祖時曽特頒免一恩諭下額賦三年輪周其各省漕米並御極加恩分作三年輪免一次實亘古未有之曠典余以來于丙寅庚寅丁酉三次蠲免天下正賦丙戌庚子兩次蠲免各省漕糧亦惟仰承皇祖仁愛之心敬承無斁云爾繼繩亦曰溥前仁溥善寺在熱河行宫東溥仁寺後百步許康熙五十二年聖祖仁皇帝六旬萬夀蒙古諸藩恭建祝釐寺南嚮門內天王殿又內前殿三楹左右配殿各三楹又內正殿七楹御書聨曰總攝三摩資善果普函萬象護祥輪左右配殿各三楹又內佛樓七楹僧一區普寧寺在熱河行宫東北五里獅子溝乾隆二十年平定準噶爾上幸避暑山莊四衛拉特部落來覲賜宴封賚敕建普寧寺以昭武成仿西藏三摩耶廟制寺南嚮聨額皆御書門外樹坊三中額曰勝緣曰法護東額曰金界曰寶林西額曰福田曰覺海門額曰普寧寺門內正中碑亭植碑三恭鐫御製碑文左右鐘鼓樓中天王殿五楹又內正殿七楹供三世佛前楹額曰金輪法界聨曰鎮留嵐氣間庭貯時落鍾聲下界聞殿內額曰大雄寶殿聨曰福溥人天阿耨耆闍開紫闕妙涵空有栴檀薝蔔擁金繩殿內佛背光上額曰仁佑大千後楹聨曰震旦教宏宣廣剎曇霏普資福蔭朔陲功未定新藩鱗集長慶寧居殿後從盤道上閣供諸佛菩薩額曰大乘之閣月臺左右五色浮屠四列四大部洲四小部洲閣三層各七楹下層額曰鴻庥普蔭前楹聨曰耆崛天開金碧輝煌香界朗精藍雲護栴檀馣􅶠梵林深閣內聨曰具大神通完十行是真清淨現三身二層聨曰廣大真言參不漏色空妙諦證無遮上層額曰真如圓滿聨曰傳大千法寶闡第一宗風閣東精舍五楹為臨憩之所額曰妙嚴室聨曰對物共春臺豳風入詠願人登福地王會成圖閣西為講經堂洪維我皇上以無量願力創開福地俾西域萬象億載普寧入寺瞻仰者合掌頂禮頌神功而祝聖夀真如普賢震旦湧現皈依也御製文普寧寺碑文乙亥乾隆二十年夏五月平定準噶爾冬十月大宴賚四衛拉特部落舊附新歸之衆于避暑山莊曰綽羅斯曰都爾伯特曰輝特曰和碩特四族台吉各封以汗王貝勒貝子公若而人其無隸屬之宰桑則歸之公如內八旗外四十九旗喀爾喀四部之例至是而內外一家遐邇同風之言允符昔我皇祖之定喀爾喀也建彚宗寺于多倫諾爾以一衆志式循舊章建普寧寺于山莊之北麓而為之記曰皇天有輔德之私至聖有越世之度君子有見幾之作兆人有可格之誠我國家撫有衆蒙古詎準噶爾一部終外王化雖庸衆有威之不知畏惠之不知懷地不可耕民不可臣之言其然豈其然哉以我皇祖皇考聖德神功經文緯武其于奠伊勒銘格登山朝四部落之衆而錫之爵賜之幣式宴陳舞可汗起奉酒稱萬夀如今日者何難默契大造意有待是以遵養時晦垂成弗為豫小子敬承乾佑以為不可失者時遲徊觀望寧二聖付託藐躬之意且此山莊即皇祖嵗時巡覲諸蒙古賓客之所也越三十年而克見準噶爾之衆咸覲于此豈非皇天無私惟德是輔至聖之度越世先知而見幾君子之作豫亦不敢不勉衛拉特之衆豈終不可格以誠哉蒙古向敬佛興黃教故寺之式即依西藏三摩耶廟之式為之名之曰普寧者蓋自是而雪山蔥嶺以逮西海恆河沙數臣庶咸願安其居樂其業永永普寧云爾復依普賢世界品而述偈言抖贊轉輪王功德甚深大造寺於西域其名三摩耶逮今千嵗餘願海裝嚴就肖彼須彌山巍閣凡三層日月在兩肩地金風水輪其內小鐵圍大鹹海水滿持地障礙山馬耳及善見擔木並持軸持雙凡七山其中乃香水其上堅手天持鬘及恆憍四天王所住復有四方天其數各以八中乃忉利天善見帝釋宫欲界四天子色界無色界次第居其上東曰勝神洲小勝及勝勝左右以次住南曰瞻部洲妙拂並小拂左右以次住西曰牛賀洲行道將小行左右以次住北曰俱盧洲最勝復諂勝左右以次住供養物無數如普賢願海復為四色塔義出陀羅尼四智標功用懿此避暑莊古佛所遊歷較彼衛藏地佛土無差别有來衆蒙古及新衛拉特咸敬黃教人爰作大利益肖彼三摩耶為奉天人師作此曼拿羅嚴潔身口意依法香泥塗一切皆清淨香花供養具法螺法音聲轉無量法輪聚無量法衆誦無量法寶作無量法事我聞普賢言華藏莊嚴海是毗盧遮那往劫修行處種種寶光明大雲遍一切捨身等塵剎以昔願力住遍十方國土出苦向菩提方便示調伏世界所有塵一一見法界現佛如雲集此是如來剎大願周法界一切化羣生莊嚴從此出西土及震旦究竟無同異衆生皆安穩暨蠕動肖翹遂生明佛性稽首天人師普賢行如是平定準噶爾勒銘伊犁之碑乙亥惟天盡所覆俾我皇清罔不在宥惟清奉昊天撫薄海兆庶悉主悉臣叶太祖太宗世祖肇基宅中皇耆其武聖祖世宗覲光揚烈克臻郅隆逮豫藐躬思日孜孜期四海同風咨汝準噶爾叶亦蒙古同類何自外攜數世梗化篡奪相仍碩仇其下厥達瓦齊甚毒于酲衆心疷疷如苖斯蟊如虺斯螫衆口嗷嗷視爾嗷止豫焦勞止期救不崇朝止視爾疷止豫噫嘻止亟出汝塗泥止乃命新附爾為先鋒熟悉其路乃命徑旅攜數月糧毋或掠虜師行時雨王旅嘽嘽亦無潦阻左旋右抽王旅渾渾既遐以休烏魯木齊及五集賽度之折折台吉宰桑迎降恐後奚事斧吭波羅塔拉闥爾奇嶺險如關闔倒戈反攻達瓦齊走旦夕途窮回部遮獲彼鼠斯喙地入無隙露布飛至受俘午門爰貸其罪自今伊始回部我臣伊犁我宇叶曰綽羅斯及都爾伯特和碩特輝特封四可汗衆建王公遊牧各安宰桑公臣屬我旗籍誰爾苦辛爾恭爾長爾孳爾幼徐以教養爾駝爾牛爾羊爾馬畜牧優遊分疆各守毋相侵陵以干大咎齊禦外域曰布魯特越哈薩克醉飽食敬興黃教福自天錫伊犁平叶矣勒貞珉矣於萬斯年矣平定準噶爾後勒銘伊犁之碑天之所培者人雖傾之不可殛也天之所覆者人雖栽之不可殖也嗟汝準噶爾何狙詐相延以世而為賊也強食弱衆凌寡血人于牙而蔑知悛易也云興黃教敬佛菩薩其心乃如夜義羅剎之以人為食也故罪深惡極自作之孽難逭活也先是分封四部衆建宰桑四圖什墨草一昻吉蓋欲繼絶舉廢以休以息也而何煽亂不已焦爛為期終于淪亡胥盡伊犁延袤萬里寂如無人之域也是非我佳兵不戢以殺為德也有弗得已耳西師之什實紀其詳悉也以其反覆無常遲益久而害益深則其叛亂之速未嘗非因禍而致福也是蓋天佑我皇清究非人力也伊犁既歸版章久安善後之圖要焉已定者詎宜復失也然屯種萬里之外又未可謂計之得也其潛移默運惟上蒼鑒之豫惟奉時相機今日之下亦不敢料以逆也是平定準噶爾後勒銘伊犁之碑所由作也御製詩妙嚴室有序丁丑乾隆乙亥平定四衛拉忒諸部落皆尊敬黃教故肖西藏三摩耶式建普寧寺於山莊之北置室其旁以為憩息之所名曰妙嚴而係以詩疆拓因來四衛拉寺營爰肖三去聲摩耶花宫具見嚴而妙别室還饒清且嘉彈梵禽音出松架疊屏山翠入忩紗即聲即色皆香氣童子當年悟未差用楞嚴經語普寧寺觀佛事己卯蒙古等皆敬宗喀巴黃教故於山莊之北建此梵剎聚黃衣者流而唪梵唄且達什達瓦餘衆歸降者嚮風慕化咸使安居樂業兹令演步蹈法事俾衆觀之並成是什塞垣筏寶煥林珠大聚衣黃偏袒徒宗喀巴傳慧燈耀三摩耶式梵宫圖是寺肖西藏三摩耶寺為之象龍步蹈惟天力老幼駢觀與衆娛神道何妨權設教若論佛法本來無妙嚴室六韻辛巳梵寺肖三摩文軒别一窩當秋常至止值暇聽波羅耨水帶峯鷲香林襟嶺螺憑忩參妙偈摛管得新哦那有寒山入堪招玉局過天花都不著幽籟拂雲和普寧寺癸未厄魯胥平定因之建普寧敢云識耆武惟是藉蒼靈新戶遷來衛達什達瓦部下餘衆遷居寺旁授室給食休養日久遂成一大聚落名經轉處聽八年事已過是寺建於乙亥年贔屓永亭亭普佑寺在熱河行宫東北六里許乾隆二十五年敕建寺南嚮門三楹御書額曰普佑寺內為正殿額曰大方廣殿聨曰妙相現莊嚴仁敷華梵慧因資福德喜洽人天殿內額曰大千功德聨曰法演大乘妙因宗海藏福覃諸界慈願溥恆沙更內為天王殿後為法輪殿最後為經樓寺中諸佛皆倣西藏塑像地較諸寺最東漸近錘峯倚山麓而開道場最為幽勝慈雲慧日廣蔭大千當有八部天龍護持寶界矣安逺廟在熱河行宫東北山麓距普寧寺東南二里許乾隆二十四年以降人達什達瓦部遷居山下二十九年敕建安逺廟倣伊犁固爾札廟式廟西南嚮門額曰安逺廟繚垣正方四面各有門中為普度殿三層周以回廊六十有四楹所謂都綱也回廊前立石鐫御製詩具清漢蒙古唐古忒四體書殿內御書聨曰竺乾雲護三摩峙朔塞風同萬里綏殿壁周繪佛國源流各識佛號於其旁亦四體書殿最上層恭藏御用甲伏昭鴻勳也每嵗藩部入覲咸集廟下莫不歡喜膜拜讃嘆佛力涵濡聖恩安逺之義大矣御製詩安逺廟瞻禮書事有序乙酉伊犂河北舊有廟曰固爾扎都綱三層繚垣周一里許當噶爾丹策凌時以五集賽更畨居此誦經每嵗首盛夏準噶爾之衆膜拜頂禮者逺近咸集其俗素奉黃教往往捐珍寶施金銀以事􅋔嚴廟之閎贍遂甲於漠北阿逆之叛賊黨肆掠焚劫廟乃燬廢曽用韓愈陸渾山火詩韻以紀其事及我師再平伊犂其地並建城堡而梵宇之僅存煨燼之餘者已不可復整亦不必為之復整也因思山莊為秋搜肆覲之所舊蕃新附絡繹鱗集爰規東北岡阜肖固爾扎之制營建斯廟名之曰安逺集梵僧演步蹈以慶蕆事惟時都爾伯特郡王策凌烏巴什等適以朝賀至與達什達瓦部衆之𨽻居兹土者歡喜額手僉謂琳宫晃曜妙相莊嚴不常曩時在固爾扎禮都綱聞唄讃也然余之所以為此者非惟闡揚黃教之謂蓋以綏靖荒服柔懷逺人俾之長享樂利永永無極云因系十韻以識緣起如此伊犂兵燹後梵宇為去聲重為縮地齊近逺歸宗何改移今朝初慶落戎索永延釐聳峙輝山麓來瞻渡水涯制仍固爾扎境一毗耶離唱唄格隆侣喇嘛中之格隆如僧中之受五戒者歸其達瓦貽達什達瓦舊屬歸旗者居於此其願為喇嘛者聽之維新同致敬憶舊孰含悲羣訝胡寬市豫懷范燮辭藉無示敗彼詎有覩成斯置器厪安處恢綱靖逺陲安逺廟丙申東嶺琳宫接題門各有名匪尊不二法緣繫衆藩情蒙古素奉黃教而伊犂之固爾札廟莊嚴特盛尢其所尊禮者仿其制建安逺廟於此每嵗駐蹕山莊舊藩新附絡繹鱗集俾之瞻仰斯廟益增歡喜以示柔懷逺人之意非只闡揚象教也佛日迎薰朗慧雲收雨征金川兹武定安逺永銷兵安逺廟辛丑新疆底定後安逺建只林是廟肖準噶爾固爾扎之式為之萬里夜來往自平定新疆後伊犂駐以將軍回部各駐欽差大臣烏魯木齊則設都統興屯耕驛跕相通百姓來往貿易者夜行無恐較之內地尤為安貼也草年久靜愔衆生資庇蔭一己致虔欽回逆偏猖近阿桂奏閏五月初九日分派官兵四路攻勦賊營搶得賊卡四座殺賊百餘名乃賊人尚敢傾穴出迎拚死抵拒現在另籌進取于賊營迤心嚴密圍困令其無路覔食等語連日切盼佳音又未能即刻擒獲殊增憤悶陳師却愧心安逺廟壬寅始自逺人徠先是癸酉冬都爾伯特台吉䇿楞等率衆來歸甲戌秋輝特台吉阿睦爾撒納和碩特台吉班珠爾又各率數萬人來歸若而人不可使占居喀爾喀地于是始議兩路進師既而定伊犁闢新疆嵗乙酉遂仿伊犁固爾扎都綱建廟額曰安逺非期疆宇恢迹乖成事順功就賴天培西師之役自乙亥春兩路進兵遂摛逹瓦齊定準噶爾諸部無何阿睦爾撒納叛逃逆黨煽附丙子春我師追討阿逆竄迹哈薩克嗣哈薩克稔其反復請擒賊自效阿逆隻身竄入俄羅斯竟伏𡨕誅又回部大小和卓木久為準噶爾所居我師既定伊犁擇其囚恩撫之乃二酋孤恩助惡屢抗官軍賴天恩助順狡謀莫逞二酋逺遁入拔達克山其汗素爾坦沙殺賊函首以獻回部悉平西陲底定蓋屢變屢安適成我事詳見所著開惑論責實誠幸耳循名豈易哉伊犁耕作圖保泰慎籌裁普樂寺在熱河行宫東北二里許西陲平定後既建普寧寺安逺廟以示綏懷廟南地勢寬廣三十一年復敕建兹寺東嚮御書門額曰普樂寺前殿額曰宗印殿左右配殿各一北為勝因殿南為慧力殿皆兼清漢蒙古唐古忒四體書正殿供上藥王佛額曰福慧圎成聨二一曰龍象護諸天毫相瞻時妙嚴普覺漠瀛會初地法輪轉處安樂常臻一曰三摩印證喻恆河人天皆大歡喜七寶莊嚴現香界廣輪遍諸吉祥西有門達經壇門內植碑一恭鐫御製碑記壇上四面有門東額曰須彌增勝西額曰舍衛現祥上有圓亭二層前簷額曰旭光閣皆兼四體書亭中四面有聨東曰竺乾法示西來意震旦光圓東嚮因西曰化成層拱通乾闥屬國環歸過月氐南曰花凝寶蓋皈真相雲擁祥林現化身北曰妙演梵城超最上廣臻法會樂無遮又東山門一座額曰通梵門亦兼四體書每嵗秋巡諸藩入覲瞻禮金容如上春臺同逰化宇也御製文普樂寺碑記丁亥避暑山莊當興桓隩區直北地亘獅溝西南官廨民廬聚落殷羡獨其東偏列嶂邈綿周原案衍則諸經所稱廣長清淨于佛土宜乾隆乙亥西陲大功告成衛拉特各部長來會時事嘗肖西域三摩耶建寺曰普寧嗣是達什達瓦屬人內徙即次旅居環匝山麓越嵗乙酉復于迤左仿伊犂固爾扎都綱建廟曰安逺然自廟南延望錘峯式塏式閎厥壤猶隙惟大濛之俗素崇黃教將欲因其教不易其俗緣初搆而踵成之且每嵗山莊秋巡內外扎薩克覲光以來者肩摩踵接而新附之都爾伯特及左右哈薩克東西布魯特亦宜有以遂其仰瞻興其肅恭俾滿所欲無二心焉咨之章嘉國師云大藏所載有上藥王佛乃持輪王佛化身居常東嚮洪濟羣品必若外闢重闉疏三塗中翼廣殿後規闍城內疊磴懸折而上置龕正與峯對者則人天咸遂皈仰將作如置以丙戌正月經始洎丁亥八月訖工爰取普樂顔寺額而為之記曰自西人之瀕於塗炭也湫隘阽危不能終日朕則為之求寧也既寧之後奔走偕徠室家還定朕則為之計安焉既寧且安其樂斯在譬如佛影覆于鴿身四大得所離怖畏想生歡喜心蘄自剎那以逮億劫同逰春臺化宇樂其樂而不能名其樂真上樂耳雖然曷易此臻哉語曰民可與樂成難與慮始又曰先天下之憂而憂後天下之樂而樂是朕所由繼普寧安逺而命之為普樂者既以自慰且重以自朂而匪直梵文勝因福利之云云也記成并系以讃善哉大能仁無去亦無住以何因緣故現此説法身人天咸護持功德甚希有云何稱上樂自小千中千暨三千大千法界無究竟爾時兩足尊甘露為灌頂一切諸衆生若有情無情念彼佛力者受持陀羅尼三世諸如來神力並加汝第一具根性即身得證佛其次小乘人得八大成就靈丹淨眼方徹地智慧劔空行遍周厯延年無疾病自洛義俱胝無量僧祇劫萬行齊完滿求福不唐捐普種福德田普蔭如意樹普覆大慈雲普渡大願船震旦閻浮提清寧共安隱而彼狼荒俗永脫修羅天合十白佛言此是法王力要知大自在本分元自足無苦強言樂即墮分别相樂故無名名上亦無等等東峯開妙鬘寶閣照旭光舉似日出處了了正知見光與日無盡誰識所本來八寶莊嚴成香華天樂偹大會啓無遮同證無上道御製詩渡河詣普樂寺瞻禮乙未野彴砌石架木為漲來易圮亦易就月前經雨兹重搘便以渡河禮耆囿彼岸平原多種田低禾髙􅎟如錯繡才十餘日未曽觀則已吐穗碩且茂或垂禾穗或仰柔穗總殊致芃緑釀黃各爭候西成可望為額慶時尚遙虞望難副普樂之意原在斯六波羅蜜非所究欽定熱河志卷七十九
