body:
  text: 山三建昌縣即塔子溝廳月華山在建昌縣東南一百八十里有石竇東西相通髙一丈五尺廣倍之土人稱窟窿山山有林泉寺存元大德中僧無際撰月華山林泉寺碑元一統志月華山在惠州東一百九十里按元大德林泉寺碑文稱大寧東南三舍餘有山名月華突然秀出面山之腹有巖竇號曰空洞知是山以洞稱勝由來久矣又稱山在惠州東錦川鄉知建昌縣東南境為元時惠州東境此山即志稱在州東一百九十里者是也長夀山在建昌縣東北六十里大城子西山有元雲峯真人康太真墓碑又距山四百步許有玉京觀舊址存元至元二十四年李察撰利州長夀山玉京觀地産碑黃金山在建昌縣東南三十五里延七十里山石礧砢逺望作黃金色山半有石洞西南半里有泉涌出冬夏不竭巴顔濟魯克山漢名牛心山在建昌縣東南一百十里喀喇沁左翼境為左翼貝子旗駐處鄂倫和固諾克山在建昌縣屬喀喇沁左翼東十二里布祜圖山漢名白鹿山在建昌縣屬喀喇沁左翼東三十里即古白狼山漢書地理志白狼縣有白狼山故以名縣三國志魏武紀北征烏丸引軍出盧龍塞東指桞城未至二百里登白狼山魏書地形志營州建德郡石城縣有白鹿山祠水經注石城川水東流徑石城縣故城南北屈徑白鹿山西即白狼山也元一統志白狼山在建州南二十五里按一統志原本以此為古白狼山引水經注謂白鹿山即白狼山為據考魏書地形志營州建德郡石城縣有白鹿山祠則白狼山之改稱白鹿山當始於魏時其實一山也考漢書白狼縣縣以山名魏武稱未至桞城二百里登白狼山又田疇傳稱登白狼山去桞城二百餘里水經注亦云未至桞城二百里登白狼山望桞城是白狼山當在桞城之西南二百里古桞城與龍城相近詳見建置沿革門今為朝陽縣治三座塔即龍城故地布祜圖山北距三座塔約二百里而遙正當古桞城之西南知為古白狼山也水經注稱石城川水東徑石城縣故城南北屈徑白鹿山即白狼山又東注白狼水是白狼山本與白狼水相近北魏石城縣在今建昌縣南詳見建置沿革門白狼水即今大凌河詳見水門發源于喀喇沁左翼南亦在建昌縣南境而布祜圖山即居其東方位均與相合元一統志謂山在建州南蓋今建昌縣南境本元建州地也邁拉蘇台喀喇山漢名柏樹山在建昌縣屬喀喇沁左翼東四十餘里搜濟河發源於此又左翼西北八十里及左翼北八十里各有邁拉蘇台喀喇山香爐山在建昌縣屬喀喇沁左翼東稍北一百五十餘里阿布察山在建昌縣屬喀喇沁左翼東南五里塔本逹巴罕漢名五嶺在建昌縣屬喀喇沁左翼東南三十里有塔本泉噶海圖波羅山在建昌縣屬喀喇沁左翼東南五十六里紗帽山在建昌縣屬喀喇沁左翼東南七十里山頂一峯形如岸幘故名伯爾克喀喇山在建昌縣屬喀喇沁左翼東南八十六里青石嶺在建昌縣屬喀喇沁左翼東南一百六十里其南接寧逺州明水塘門界錫喇哈逹圖山在建昌縣屬喀喇沁左翼南五里大凌河河流經其麓摩該圖逹巴罕在建昌縣屬喀喇沁左翼南三十里摩該圗河發源於此翁噶里勒圖山在建昌縣屬喀喇沁左翼南四十五里額里葉逹巴罕在建昌縣屬喀喇沁左翼南七十里額里葉河發源於此托和多喀喇山在建昌縣屬喀喇沁左翼南七十里搜濟河流經其麓瑞雲山在建昌縣屬喀喇沁左翼南七十里山有五洞第一洞廣二丈五尺髙一丈五尺中有佛像石罅玲瓏五色互映雕繪之功所不及旁行一竇竇底石若純漆自壁以上白如堊秉燭視之具種種草木禽獸形第二洞廣五尺髙三尺中隱四竇其二為墜石所塞不得入其二皆深丈許石作黃金色亦具人物形第三洞無他異第四第五洞皆廣七尺髙五尺上下相通狀如重屋洞南坡下有泉水極清冽東流會搜濟河泉南二里又有一洞內生石筍如人背立形變態種種悉出天工山有雲溪觀舊址存元至正七年張道中撰瑞州海濵鄉周家莊雲溪觀碑元一統志雲巖洞在瑞州西一百三十里周家莊按元雲溪觀碑稱瑞州北二百里許有山曰瑞雲山洞曰天一大洞今土人但稱為雲山洞元一統志作雲巖洞在瑞州西蓋此地在元時為瑞州西北境也鎚子山在建昌縣屬喀喇沁左翼南九十里塔本陀羅海山漢名五鳯山在建昌縣屬喀喇沁左翼南一百里青山嶺在建昌縣屬喀喇沁左翼南一百餘里布勒圖喀喇山漢名寬山在建昌縣屬喀喇沁左翼南九十餘里布勒圖河發源於此威遜圖山漢名樺山在建昌縣屬喀喇沁左翼西南四十里大凌河流經其麓柞子嶺在建昌縣屬喀喇沁左翼西南一百里呼什哈圖山漢名栗山在建昌縣屬喀喇沁左翼西南一百餘里貴石嶺在建昌縣屬喀喇沁左翼西南一百十里察罕額里葉山漢名白鷹山在建昌縣屬喀喇沁左翼西南一百四十里托蘇圖喀喇山在建昌縣屬喀喇沁左翼西五里和爾圖河發源於此胡圖克圖喀喇山在建昌縣屬喀喇沁左翼西三十里僧機圖山漢名窟窿山在建昌縣屬喀喇沁左翼西四十里僧機圖河發源於此占塔噶爾山在建昌縣屬喀喇沁左翼西五十里和爾圖逹巴罕亦名長嶺又名順山嶺在建昌縣屬喀喇沁左翼西八十五里托津圖喀喇山在建昌縣屬喀喇沁左翼西一百四十里額林畢老圖逹巴罕在建昌縣屬喀喇沁左翼西一百四十里固沁喀卜齊爾谷在建昌縣屬喀喇沁左翼西一百四十餘里察喇齊山在建昌縣屬喀喇沁左翼西北三十里鴻吉爾岱山在建昌縣屬喀喇沁左翼西北六十里賽音台河發源於此巴顔烏蘭山漢名大赤山在建昌縣屬喀喇沁左翼西北七十里巴顔察罕山漢名大白山在建昌縣屬喀喇沁左翼西北八十里庫克山在建昌縣屬喀喇沁左翼西北一百四十里逹罕碩隆山漢名騮山在建昌縣屬喀喇