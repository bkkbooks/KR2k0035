body:
  text: 行宮十六含青齋玉岑精舍文園獅子林含青齋架巖為屋疊石成階與敞晴齋隔溪相望御題額曰含青齋齋內面北額曰清暉娛人聯曰雲影罨簷留遊情繚白山光排闥送畫意浮藍每深秋臨幸楓林晚照槲葉朝霜俯視軒櫺尚饒深碧左曰挹秀書屋右曰松霞室山容峭蒨松徑陰深當仙莊西北隅南望五雲則碧榭紅闌瑶岑玉水宛在仙山畫圖間矣御製詩題含青齋癸未西北林巒幽且敻昨年尋勝得山行因教小築間齋者業已宛看别墅成信矣可居入畫格慎哉求適出人情坐來擬欲披圖史不為欣生為愧生再題含青齋孟秋荏苒仲秋臨一瞬堪因視古今延步不妨乘候爽到齋偏喜對山深蝶如戀影長依卉鹿已聞聲尚隱林恰見遙峯紅幾點翻興平聲爾許惜青心策馬至含青齋甲申隔谷巖齋路不遙乘間遂與欵松寮誰知攬景忽逾嵗且是駐莊已十朝此最佳寧當恝置縱無語亦解相邀萬年松下脂成珀聞説偓佺曾遺去聲堯含青齋乙酉底事愛山深山深愜道心四鄰圍峭蒨一徑入陰森巖想丹猶隱窗慿翠越侵潤濃螺黛處更有鹿堪尋含青齋丙戌含青與敞晴相隔一谷耳秋晚尚餘間可能孤尺咫千林已失青萬嶂惟標紫將謂青意無少坐悟其旨芳菲指明年機括藏於此含青齋丁亥門前峯展屛疊樹尚濃青連得碧無際落來翠滿庭既饒深以靜莫擬色分形蒼鹿尋難見呦音却可聽過谷復至含青齋隔谷復有齋木可拋尺咫况欣值爽涼宜與窮宛委爓爓翠明葉馥馥丁星蕊庭前呈靜機色香胥妙理弗來得幾朝日影上窗矣題含青齋戊子浮藍繚翠罨簷櫺畫意無形復有形半座生來虛室白一簾含得萬山青樂兮偶學仲長論陋則非同禹錫銘猶是林光蓊蔚候鹿聲難隱却頻聽含青齋己丑齋據山之陰户對山之陽翠峯與緑嶂面面胥包藏雖秋葉未稀不描畫自張但覺林間風吹來帶微涼欲會含青者識幻乃得常策馬過谷遂至含青齋己丑乘興跋驂驔巖齋問景堪寥光澄素宇飛翠落晴嵐風峭樹聲颯露濃花氣馣適才詠青處原在此中含題含青齋庚寅巖齋極西北幽阻弗恆到今朝風日暄肩輿一窮奧林姿縱廓落谷勢仍䆞窱出狹亦造宏軒楹敞棲嶠青乃失以忽含則空成笑慿窗合無欲轉得觀其妙含青齋辛卯石城盤陟進園門向北巖齋可憩言樹色千峯猶張王二皆去聲秋曦一牖耐溫存虛中足納青瑤入風處還疑碧練翻庋閣藝編堪汲古慙無多暇靜探源含青齋壬辰獅子園向獅子峯峯東溝便稱獅子石城門即鎖溝口䇿馬言旋每進此東為宜照西含青兩齋相望近尺咫今朝舍東而就西却是今年到斯始面北開軒據坦岡隔溪㠡嶤嶂峙高枝低葉總含青潤露搖風幻無比設置步兵於齋中亦當青眼相對是肩輿過谷復至含青齋兩齋敞晴含青隔一谷東西近相望謂近行乃遙陟降歷巖嶂今朝趂爽涼徐步肩輿向過谷入窈窕造堂得朗曠面北峙嶤峯屛風開緑嶂含青信含青萬林猶張王二皆去聲亟來豈無意秋光漸已傍含青齋癸巳直北山齋仍向北非秋天氣却如秋一窗含處納無盡滿目青來翠欲流鹿伏禽藏任容與朝嵐夕靄相沉浮出藍勝負何須校彼二者曾分别不策馬至含青齋蜀先主歎髀肉生英雄所見常人異重熙纍洽非其時晏安鴆毒亦當忌肩輿步輦寧詎無每蒞山莊喜乘騎適才攬轡觀良田便沿崇棧園門至入園循谷造山齋朗開窗户納青翠豈因玩景暢間情率以摛詞寓深意題含青齋甲午今朝風日甚清遒北谷乘間試一遊欲闢巖關已滿志及慿藝牖更宜眸峯姿聳濯黛螺滴葉態低鋪碧海浮輸與虛齋生白者真佳斯亦弗相謀題含青齋乙未肩輿欲言歸有暇風日美過谷即巖齋便可一憩止含青真含青四面翠如洗雖云混松柏亦弗艷桃李佳哉出藍觀如遇倬雲士再題含青齋跋馬山城入睥睨循谷遂以山齋至山齋本是額含青騁望紅葉三五綴仲秋風物故如斯緑邏翠縈艱久勢色空空處有何青曰含含乃無盡意題含青齋丙申望日祗園瞻禮回筍輿徐進石城隈巖齋路石聊成憩今嵗夏中初度來窗裏含青宿雨過昨夜陳雨即晴天邊拖白曉雲開林間鹿本出無意却似有心作客陪含青齋石街西轉路非遠入室何妨小憩遲青欲變紅誰挽得此齋却得永含之到含青齋因題句己亥别兹冬夏二年餘到復晨昏七日疏似此幽佳不經意何須構築合慙豫溪流山峙呈來靜翠邏青縈妙入虛湊以新晴風日爽一塵弗染潤盈裾含青齋庚子降畀就夷嵏出谷隨流水書屋築山陰面向山陽嶬入秋色已清秋稚青又美山莊駐逾月趂暇初來此笑語付虛齋佳趣含之耳題含青齋辛丑一谷東山隔山齋得畝平肩輿不數武循徑遂至庭閲嵗兹初到奚妨稍憩停千峯生翠煙晃朗羲光晶玩景猶餘事籌農真愜情廓然任彼含獨我年非青題含青齋壬寅山城迤邐入巖扄路便山齋小憩停隔嵗由他自生白慿窗詔我尚含青槲楓底用分殊品松柏終看有卓形似此一塵不到處何當靜坐玩羲經挹秀書屋癸未山陰初卜築因迥得高居至每為去聲乘興坐還可檢書凌清志愈淡瞰遠目恆舒秀則誠無忝挹之斯有餘挹秀書屋曲轉回廊窈窕通蜃窗綈几俯秋空清風明月取無盡山峙川流用不窮石越瘦如道士醉松惟孤見丈夫雄玉壺氷弗纎塵著豈計尋常指顧中挹秀書屋近山構書屋山景屋中收挹秀有如是於佳不厭求楓疏紅益染松古緑還留亦欲無言去其如詩思投挹秀書屋甲申逐處山房可貯書貯書為問意何如寧須富詡三萬軸無逸一篇已愧豫挹秀書屋丙戌秋山問題品一字秀惟當望處迎眸淨披來滿意涼丹楓非渲染翠柏是真常書屋得佳挹何殊六藝芳挹秀書屋丁亥書屋千峯裏嵌崎秀以深青林無别色野鳥有佳音景颯隔塵境山空生道心挹之恆不竭信可暢清襟挹秀書屋戊子一牖當空聳碧岑性靈適愜秀而深注兹挹彼誠無竭愷弟因思君子心挹秀書屋己丑逐處有書屋坐便可讀書獨是無多暇兼之山徑紆偷間一遊攬詠此復賞餘安能把藝編玩味深其腴剽襲固非他疏略實愧豫挹秀書屋辛卯藝編插架靜愔愔取便翻看足沃心六藝清芬真萃秀挹之不藉更他尋挹秀書屋壬辰拾級回廊上書齋别有天築基凌砧􅑇繞户祗雲煙衆岫列簾下古松當座前乾坤易簡現即是玩韋編挹秀書屋癸巳廊轉升今室窗明展古書六經無隱彼一卷足開豫日永年成小風清暑乍袪四時秀不盡挹處定何如挹秀書屋甲午書屋藝編次第開山光相映秀相陪從來六藝多芳潤取裁去聲由人自挹哉挹秀書屋丙申秀色四鄰都可餐挹之無盡憩之安壁間舊句接新句盟戒綺言却屢寒挹秀書屋己亥山中書屋原含秀經雨山容秀更佳林下過來猶滴露風邊披去欲開懷挹秀書屋庚子曲廊委宛石梯通窗罨山光近遠中藝帙稡來千古秀挹之不盡用無窮挹秀書屋壬寅書屋無過十笏寬固非鄴架插多般偶然一卷間披覽亦覺其中秀可餐松霞室癸未山中搆朴屋隨宜不擇向曲廊宛轉通窈窕而清暢開窗對喬松落落隔近嶂欲速嗤右丞看此千尋放松霞室又題傍喬松下得幽居松古因之居古如映帶飛霞才一朵緑瓊地襯紫金蕖松霞室彭澤先生徑華陽隱士家居安彼皆合寓意我聊嘉夕照何妨染朝嵐故與斜便宜斯室者四季蔚青霞松霞室丙戌閉户何曾此著書老龍鱗自峙前除童童下更丹楓爓始信松霞名不虛松霞室口號丁亥古松翠參天新松緑盈把會見新松似古松然不可期年月者如是應無種松人貞翁弗言笑而啞松霞室己丑窗外拏空百尺亭雲霞映帶亦成青祗宜靜坐聽寒籟未肯其根劚茯苓松霞室辛卯春風秋月經千嵗暮靄朝嵐鎮古形誰曰山中無定色盈窗看取是恆青松霞室壬辰丈尋已上見枝拏覆室團圞布蔭嘉楊炯恰如經少室照天起處滿青霞松霞室癸巳喬柯落落映窗紗動奏清濤靜亦嘉設不聲求以色見紅霞非也是青霞松霞室甲午循廊上有室對户外多松嵗以千年計時宜九夏逢態疑霞與蔚神是露為濃漫誚青奪赤童原箇老容松霞室乙未幽室開窗正對松千年那得問前蹤藝篇中却識其事恰似子房驀地逢松霞室丙申白雲徂遠天赤氣待騰晚而何松下室青霞忽滿眼挾雨非所知照日聊且緩鬱蔥與蓊濛團支緑油繖此景太古來相值情何限南樓老人筆室中懸女史陳書長松圖意謂得佳伴松霞室口號己亥容容落落罨窗紗夢裏為吾醒不差浪説饋堯堯弗受赤松常自傲青霞松霞室庚子霞色自紅紫曰青希目謀試一數其曲蓋妃道家流室偶憩松霞信其語有投陰布緑油繖形舞翠鱗虬揚風為聚散晃日疑泛浮不殊九曲房元始曾憩遊松霞室辛丑回廊略轉上書室棲巖邇索當窮其奧陳畫况在裏室內有陳書畫長松圖數千百年松正對窗前峙而窗糊玻璃神韻相面視若主若賔間我亦難為擬朝暮蔚煙霞亦弗分彼此欲問太古初大誰餐之矣松霞室壬寅户外青霞非赤霞虬枝百尺上盤拏南樓小幀張屋壁壁間所張長松圖女史陳書畫自號南樓老人相印精神本一家玉岑精舍山莊西北溯澗流而上至山麓攢峯疏岫如懸圃積玉環列瑶篸精舍三楹顔以玉岑聯曰活畫展王維川回空翠清吟尋杜甫峯並高寒室右偏曰貯雲簷穿雲陟徑有亭二曰湧玉曰積翠依山梁構室曰小滄浪回廊盤折倚壁梯巖下臨深壑每秋雨初過明漪澄練湛然淨淥矣御製詩玉岑精舍癸未西北峯益秀戌削如攢玉此而弗與居山靈笑人俗精舍豈用多瀟灑三間足可以玩精神可以供吟矚嵐靄態無定風月藏有獨長享佳者誰應付山中鹿再題玉岑精舍搆舍初看斷手成玉岑近對聳峥嶸林間蒼鹿鳴不已想是無端認客生玉岑精舍搆屋對崚嶒雲煙朝暮興碧溪緣雨過紅葉視前增心賞益無厭目遊可當登生輝映襟袖始悟藴來能玉岑精舍甲申精舍意所屬萬玉圍崔嵬却以無多暇三日方一來亟深故益靜心與化機諧是間無别物巖鹿時相陪王岑精舍乙酉北峪最深處今年乃創尋披來雲是徑對得玉為岑既曰能清慮如何尚綺吟自難答斯問層峭或知音王岑精舍丙戌西北峯巒益幽迥三間精舍對嶔崎不常到越藏深趣得少坐因啓祕思澗水未流嫌雨短巖風才過喜涼隨昨秋題句分明在今日重看去若馳玉岑精舍當前峭壁接雲空上有山堂路可通拾級不嫌勞步履却從坐底俯巃嵸玉岑精舍丁亥山莊駐五日精舍乃初到蓋因尚炎蒸故遲造幽奧新晴趰颯爽試一觀其妙肩輿數息至密樹忽開徼面對怪峯聳下臨深澗窔塵無一點滓秋有八分料草蟲唧唧聲如訴去年約下高峯至玉岑精舍作戊子肩輿下高峯下自比登易及至巉嶮處原不如策騎可與知者言弗知嚼蠟味而惟能騎然不能不可試能則與馬習左右皆如意坐輿肩者勞顛簸反成纍不能則畏馬乃翻為苦事不如坐輿穩那慮人勞勩精舍旋亦到玉岑聳青翠岑既罷重登慿窗吟五字題玉岑精舍己丑迤西徑更幽巑岏歷敻阻眄彼委宛間是我藏詩所精舍若真人不欣亦不拒翛然任往來夫豈勞言語玉岑精舍庚寅精舍構幽深面擔聳玉岑林空那有色山靜似無心土潤鹿留迹霜清鶴峭音坐斯仍問政未可祗耽吟玉岑精舍辛卯西北山居此最深等間跋馬不常尋陟高降下斯稱便據榻拈毫率與吟未可依然為慢語所欣卓爾寄崇心促成大笑鳴鞭去付爾千秋對玉岑玉岑精舍壬辰既已登峻高降下斯為易萬里胥如是在人善會意精舍最西北溪谷敻深邃乘便步筍輿今嵗今始至巖嵐都好在以靜饒佳致石溪有水流覺向得無事尋思前後霖空去聲山潦所積山無泉者雨後浸出細流俗謂之空山水題玉岑精舍癸巳精舍西北隅山深谷益奧佳境自所閟問景不恆