於暮春首夏每過夏至始來駐驆故不見也磴道磴以曲致佳道實近若逺因思求道人不如斯蓋鮮而我步其間潔矩勵返本占峯亭亭占一峯巔一峯俯足底遊目望四鄰萬峯納於裏奇遇問所欣在彼不在此忘己物備我可以悟至理清淑齋花木淑景山水清音嵐靄朝夕天地古今不同不殊有壬有林造物無言會者隨心而齋受之以虛為斟小香幢竪峯一朵似香幢調御端居朗慧釭徒以肖倪為綴景幾曽因此覔心降探真書屋書屋構文園探真事可論所思切乎已時復發於言不著人驚句此語反杜甫詩意惟疏茅塞源心傳即治法總覺未窺籓延景樓石林雲磴極叢攢中有層樓俯迥寬南秀北雄此兼得躍魚濯鹿豈無端漫訾平聲燕塞重儓見雅喜倪黃合作看獅林為倪迂創始而今屬蘇門黃氏為涉園又畫家有倪黃合作之語假藉用之發帑固逾十家産凡有經營皆發內帑和雇然較之十家産則已過矣因之漢史每慚觀畫舫可讀書還可閲畫煙波載月那須賖試詢數典於何得不是歐家定米家雲林石室林態既蓊蔚石勢復容裔披林入石徑都有雲之意坐室衣裳潤不知其來際橫碧軒湖裔得平坦虛軒架幾楹水山呈動靜上下印空明北塞無雙處西峯一帶橫氣佳供日夕陶句味精評水門水門來往可通舟有暇還因作卧遊却笑武陵誇祕境能無花片付溪流文園四詠乙未石南方石玲瓏北方石雄壯玲瓏類巧士雄壯似強將風氣使之然人自擇所向松涉園松參天吳中獅子林今屬黃氏為涉園文園松齊肩境新斯植墀而亦森蒼然右招西嶺者老逾彼千年鹿野鹿如牛羊日夕每下來溪邊及巖畔可與共徘徊此地之所長江南何有哉謂涉園鶴吳中曾一見綴景置雕籠豈如縱以飛來往翺煙空質之倪高士首肯應我從逰文園獅子林丙申園裏文園才一隅却成十六景分鋪取諸左右源堪挹别以高低趣便殊朝暮靄嵐標活句清真山水列奇圖問從何處得粉本格法依稀自懶迂文園六詠丙申房迹自倪傳今屬黃世間執業底為常雲林圖展試一證慙愧草房易瓦房山四面真山中假山頗因詰曲露孱顔暇餘偶向其間步真假何須辨等間水雁齒橋欄照影紅金閶想像畫圖中雖然入海殊遙近及至其間合相同松峯側嶺端合點綴槖駝教種稚松新設如拱把例桐梓孟氏良言思養身魚網罟絲竿例不動鏡中撥剌錦成雲文園當日原靈沼於牣何殊樂利羣蟬流響欣聞綽爾齊塞外之蟬蒙古名曰綽爾齊蓋謂歌曲者蛙聲自合異高低聽來却欲笑王晏鼓吹寧須慙孔圭清閟閣對雨六月十七日五月期非舛嘗謂夏月五日一雨實佳昨十二日雨三庚景最清詩成倪子處畫玩米家情遠喜山禾潤近觀水卉榮前池今嵗種荷正開高峯對僧帽僧帽峯雲羃則雨久否則速晴今見峯知雨弗久也可卜即開晴題文園獅子林十六景己亥獅子林文園塞北此時開移得江南粉本才獅吼一聲大千遍悟知無去亦無來虹橋駕水石橋宛若虹波光浮動有無中武夷帳幔何須擬未脫塵寰色與空假山真山四面假成斯其故云何别有思薄假貴真試遊目山猶如此戒應知納景堂面水背山敞四筵景筵遠近納無邊灑然對處依然念不覺光陰隔兩年清閟閣高閣倪家苑在此既清且閟遠塵喧何須更展迂翁畫喬樹蒼山古法存藤架覆橋為架架藤枝引蔓分條葉滿披散步緑陰俯流水漫嫌曾不遇花時磴道磴道層層砌假山林岑曲折費登攀設如次第論詩品祗在郊寒島瘦間占峯亭一峯之上一亭幽近翠遙青四面酬占取無邊好佳處原從腳底漫他求清淑齋山館清舒祗隔河齋在清舒山館之南相隔一河山館之名皇祖所題也齋名清淑意如何卷阿家法近咫尺憩息中懷肯構多小香幢一間小閣竪疑峯幻作香幢護相容大士有云泯能所不知何物稱去聲清供探真書屋瀟然書屋額探真綈几藝編次第陳豈在章尋與句摘要當實責以名循延景樓兩嵗曾無拾級尋仍看風樹與雲岑儻然延景愴然憶大異前巡愛日心畫舫塞水艱於可泛舟居然池面貯澄流煙篷月棹隨飄漾賖與清河作卧遊雲林石室雲為林復石為室會以天然遠以塵而我原非習靜者不過偶至一怡神橫碧軒近沼遙峯映綺疏碧霄含蓋永如如莫非奇也竒之最軒以無言領有餘水門跨水為門月樣空往來時許一舟通偶然寄趣因成涉勤政吾當恆惕衷再題文園獅子林十六景庚子獅子林今嵗吳中獅子林一三三一了難尋兹來重憶昨年句笑我未忘分别心御園及文園皆有吳中獅子林并倣雲林為圖各弆之昨嵗時有移得江南粉本才之句是一是三未免尚存區别見耳虹橋枕岸如弓弦未平徐因展步俯波清波中試看影浮動始信斯橋善副名假山四鄰疊翠夥真山名此因何以假顔可識有真那無假莊生齊物破天慳納景堂近欣水繞遠峯羅豈必金閶較若何一著由來取勝者殊他墻外聒笙歌清閟閣城市終輸太古山謂雲林清閟閣在蘇城中雅應兩字額簷間底須書畫於中弆獅林閣中木倪迂築以蓄貯古書畫人罕迹其所云水態峯容稡以間藤架夾橋曲折支竹木種以藤蘿引蔓繁莫謂花時率弗遇芳菲意自架頭存磴道高低詰曲石為階行飯恆於此散懷委宛喜他藏妙趣直弦畢露有何佳占峯亭亭底由來祗一峯縈青繚白四鄰供以兹名實俱收者欲問仙卿雲林别號也意可從清淑齋架學鄴侯富縹緗薰風來處有微涼清舒清淑相照映山莊內清舒山館石徑縈紆臨湖清漾可以延爽納涼與清淑齋相映俱藝窗勝景也一例披藝消夏長小香幢佛閣假山據上層蕭然木榻對冓燈問他僧寺住旬日謂元鎮見顧元慶雲林遺事此景可殊曩日曾探真書屋聖賢語無不真者祗在讀書人自尋於我為何最親切始終堯典曰惟欽延景樓南至又看彌月過階延曦影上簾紋光陰駒隙誠堪惜何暇其間計寸分雲林石室室倚石林雲吐石靜斯為主動斯賔文然寫出倪家號何必其間坐箇人橫碧軒疏眉八字帶西橫過雨新螺濯以清返照入湖翻得趣翠雲􅌨􅌨一時明畫舫舫非畫也而稱畫豈是安名特好去聲生看取鏡中流動意何殊六法得神情水門弗通車馬祗通舟亦得門名枕碧流恰似子遊心以會並思言行可符不熱河文園獅子林成因再倣倪瓚獅子林圗貯清閟閣中并疊御園倣獅子林圖韻甲午石疊奇峯水引渠文園題景各分書依稀茂苑境移彼一再獅林圖倣豫真似望洋歎河伯祗同嗜古事鈔胥懶迂雅愛參佛偈如是欲詢可是如驛致蘇州所弆倣倪瓚獅子林圖再題以句甲午豈不獅林宛而兹御園所倣已成有詩偶懷南卷驛觀之漫言是一已非一應識離斯乃即斯境裏倪黃胥幻若圖舊為倪瓚作今為黃氏涉圗圖中燕塞又紛其既於御所倣吳中獅子林題以十六景復於塞苑倣其景為文園亦系以詩兹驛取南卷欲證筆境若何仍書其後而還之題成仍付北風去親愛民情遠繫思再題所倣倪瓚獅子林圗仍疊前韻丙申倪圖一再仿渠渠蘇州獅子林御園及此而三皆仿雲林為圖各弆之并有題詞卷內書翰墨因緣雖慕昔亭臺建置覺過平聲豫遊觀富固輸吳會山水清原自赫胥重此拈毫賡舊韻東坡往事每因如一韻數疊惟東坡愈出愈奇再題所倣倪瓚獅子林圖仍疊前韻己亥由來水到便成渠斯語堪詮畫與書園建獅林原慕彼圖藏清閟復題豫幽佳此日傳上塞同異明春證古胥一再倣之一再詠自維何事太紛如題所倣倪瓚獅子林圖三疊前韻庚子朴室原非夏屋渠愛他宜畫更宜書兩番粉本粗臨彼四韻成章又疊豫水復潺湲慿式列春同遊豫到姑胥迂翁簡筆含多趣面目如之神未如題所倣倪瓚獅子林圖四疊前韻辛丑逸品倪圖藏石渠倣為一再並題書孤高祗以迹傳彼搆築因之事創豫眷展神遊到姑熟几慿清夢擬華胥吟成依舊蠅頭寫老眼先慚昔不如題所倣倪瓚獅子林圖五疊前韻壬寅山自圍房水瀉渠圖成題已五番書雖云倣彼真慚彼不曰知豫當罪豫喜有野禽歌宛轉又看小木長上聲扶胥一時偶爾抒間興那較迂翁如不如欽定熱河志卷四十
