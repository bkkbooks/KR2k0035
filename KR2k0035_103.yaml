body:
  text: 外記一烏桓鮮卑之在漢魏慕容氏髙氏馮氏之在晉宋及北魏奚契丹之在隋唐諾音舊作朵顔今改正泰寧等之在明聲教所阻宛若異域然二千餘年間君長渠帥之名氏散見諸書或詳或略未可以闕而弗紀其盛衰興廢梗概差存均藉是可考亦輿記所不容遺也爰各標名氏為綱與故事門相表裏互資審核其事迹旁見側出不能繫之一人者别為附録綴各國之末云志外記第二十三漢烏桓按烏桓在漢初為丐奴冒頓所破餘衆孤弱臣服丐奴武帝時霍去病擊破胸奴左地徙烏桓於上谷以東五郡塞外光武郝旦等內附復置之塞內於是緣邊諸郡漸為烏桓所據其在今承德府境者曰遼西烏桓曰右北平烏桓曰漁陽烏桓而遼西烏桓為最強兹敘郝旦以下諸人如左又按漢時丐奴建庭直代雲中不在承德府境其有事於上谷以東者已載故事門兹纂外記不列丐奴斷自烏桓始遼西烏桓郝旦後漢書烏桓傳建武二十二年丐奴國亂烏桓乘弱擊破之丐奴轉北徙數千里漠南地空二十五年遼西烏桓大人郝旦等九百二十二人率衆向化居塞內布於緣邊諸郡遂為漢偵候助擊丐奴鮮卑漁陽烏桓歆志賁後漢書鮮卑傳漁陽赤山烏桓歆志賁等數冦上谷永平元年祭彤賂偏何鮮卑名擊歆志賁破斬之遼西烏桓於秩居後漢書鮮卑傳烏桓大人於秩居等與連休遼西鮮卑有宿怨共郡兵奔擊大破之元初四年漁陽烏桓扶潄官後漢書鮮卑傳烏桓豪人扶潄官勇健每與鮮卑戰輒陷敵詔賜號率衆君永建六年右北平烏桓烏延後漢書烏桓傳靈帝初右北平烏延衆八百餘落自稱汗魯王遼西烏桓邱力居後漢書烏桓傳靈帝初烏桓大人遼西有邱力居者衆五千餘落自稱王中平四年前中山太守張純叛入邱力居衆中自號彌天安定王遂為諸郡烏桓元帥冦掠青徐幽冀四州五年以劉虞為幽州牧虞購募斬純首北州乃定遼西烏桓樓班踏頓後漢烏桓傳獻帝初平中邱力居死子樓班年少從子踏頓有武略代立總攝三郡謂遼西烏桓右北平烏桓遼東屬國烏桓衆皆從其號令建安初冀州牧袁紹與前將軍公孫瓚相持不決踏頓遣使詣紹求和親遂遣兵助擊瓚破之紹矯制賜踏頓難樓蘇僕延烏桓二字行文烏延等皆以單于印綬後難樓蘇僕延率其部衆奉樓班為單于踏頓為王然踏頓猶秉計䇿及紹子尚敗奔踏頓時幽冀吏人奔烏桓者十餘萬户尚欲慿其兵力復圖中國建安十二年曺操自征烏桓大破踏頓於栁城斬其首虜二十餘萬人袁尚與樓班烏延等皆走遼東遼東太守公孫康並斬送之其餘衆萬餘落悉徙居中國按袁紹矯制所封之單于自踏頓烏延之外尚有難樓為上谷烏桓蘇僕延為遼東屬國烏桓以不在今承德府境故不録又漢書所列烏桓封單于者四人三國魏志亦謂賜踏頓難樓峭王即蘇僕延汗魯王即烏延印綬皆以為單于而裴松之注引英雄記則謂拜烏桓三子為單于及載詔封之版文則稱遼西率衆王踏頓右北平率衆王汗盧維遼東屬國率衆王頒下所謂盧汗維者當即烏延或因其自稱汗魯王而訛所謂頒下者當即蘇僕延魏志傳太祖臨陳斬踏頓首速附九樓班烏延等走遼東所謂速附九亦即蘇僕延武帝紀亦作速僕九名號各殊難於稽證則中外字書音譯成訛理固然耳右北平烏桓能臣抵之三國志魏武帝紀北征三郡烏桓未至二百里虜乃知之尚熙與踏頓遼西單于樓班右北單于能臣抵之等將數萬騎逆軍按袁紹所封之右北平單于為烏延是時與魏逆戰者據後漢書三國志烏桓傳烏延亦在其內而魏武記獨作能臣抵之當是别為一人其所以稱為單于别無可考又按後漢時烏桓名之見於漢書者有烏桓大人勿柯烏桓大人戎朱廆率衆王侯咄歸去延等俱未詳其屬於何部故不録鮮卑按鮮卑在漢初亦為冒頓所破竄於遼東塞外未嘗通中國建武初始與烏桓隨丐奴冦北邊永元中耿夔擊破北丐奴因徙據其地稍稍近邊其後寖大至延熹時分為三部右北平以東為東部以西為中部今承德府境蓋得東部十之七中部十之三兹敘連休以下諸人如左遼西鮮卑連休後漢書鮮卑傳元初四年遼西鮮卑連休等燒塞門冦百姓遼西鮮卑烏倫其至鞬後漢書鮮卑傳永寧元年遼西鮮卑大人烏倫其至鞬率衆請鄧遵降奉貢獻詔封烏倫為率衆王其至鞬為率衆侯建光元年秋其至鞬復叛纍殺郡守控弦數萬騎後其至鞬死鮮卑抄盜差稀按鮮卑之在後漢於光武時首先內屬受封者為於仇賁滿頭然其所居在遼東於桓帝時最強大者為檀石槐凡東西中三部大人皆屬之然其卓帳在髙栁北三百餘里並在今承德府境外故不列後倣此遼西鮮卑宇文普回莫那北史周本紀其先出自炎帝為黃帝所滅子孫遁居朔野其後有葛烏莬者鮮卑奉以為主遂總十二部落世為大人及其裔孫曰普回因狩得玉璽三紐文曰皇帝璽普回以為天授已其俗謂天子曰宇文故國號宇文因以為氏普回子莫那自隂山南徙始居遼西是曰獻侯為魏甥舅之國九世至侯豆歸為慕容皓所滅按自晉以上九世為宇文莫那約計當在漢時故附録於此侯豆歸即十六國春秋所載逸豆歸詳見後魏烏丸即漢烏桓魏書作丸按漢武北討以後烏丸微矣今録其可考者二人右北平烏丸冦婁敦遼西烏九護留三國志毌邱儉傳毌邱儉率幽州諸軍屯遼隧右北平烏丸單于冦婁敦遼西烏九都督率衆王護留等昔隨袁尚奔遼東者率衆五千餘人降冦婁敦遣弟阿羅槃等詣闕朝貢封其渠帥二十餘人為侯王景初元年按烏丸傳裴松之注引魏略護留作護留葉當即等字之誤隨袁尚奔遼東作遼西阿羅槃作阿羅奬二十餘人作三十餘人當從儉傳為正又北魏書徒河段就六眷傳有漁陽烏桓庫辱官約略時世當在魏末晉初然無確驗附著於此鮮卑按魏初鮮卑軻比能為最強其地自雲中五原東抵遼水實盡有今熱河全境然其卓帳當并州之北在今承德府境外比能見殺之後其餘衆散居潢水之南黃龍之北亦皆無名氏可考今惟録檀石槐舊部受魏封爵者著於篇素利彌加厥機沙末汗成律歸三國志鮮卑傳業素利彌加厥機皆為大人在遼西右北平漁陽塞外建安中因閻桑上貢獻通市太祖皆表寵以為王厥機死又立其子沙末汗為親漢王延康初又各遣使獻馬文帝立素利彌加為歸義王太和二年素利死子小以弟成律歸為王代攝其衆魏書鮮卑傳檀石槐分其地為中東西三部從右北平以東至遼東接夫餘濊貊為東部二十餘邑其大人曰彌加厥機素利槐頭從右北平以西至上谷為中部十餘邑其大人曰柯最闕居慕容等按檀石槐東部大人以魏書所載方位證之彌加厥機素利當在今境然三國志以素利彌加為一人厥機為一人魏書又似以彌加厥機為一人素利為一人未詳孰是其中部大人亦未審孰居今境並附存之晉鮮卑烏九附按西晉之末北州紛擾熱河北境為鮮卑宇文氏地為詳著卷內其時烏丸已弱餘種尚雜處其間故祇從附載至熱河南境雖為段氏疆域所涉而段氏世居令支建亭不在今境內如檀石槐軻比能例不書鮮卑宇文莫圭魏書作莫廆十六國春秋前燕録太安初鮮卑宇文單宇莫圭部衆強盛遣其弟屈雲冦邊别帥素德延晉書載記及魏書作素延攻掠諸部廆親擊敗之素怒延復率衆十萬圍廆於棘林衆咸震懼廆曰素怒延軍無法制已在吾計中諸軍但為力戰無所憂也乃躬貫甲胄馳馬出擊大敗之追奔百里俘斬萬餘人按庾信周上柱國齊王憲碑晉太康之世據有黃龍當太安初宇文莫圭攻慕容廆之時距太康止十有餘年史稱莫圭部衆強盛自稱單于則所謂據有黃龍者當即莫圭鮮卑宇文悉獨官魏書作遜昵延十六國春秋前燕録太興二年廆封略漸廣據棘城晉平州刺史東夷校尉崔毖乃隂結髙句麗及宇文氏段氏謀滅廆以分其地三國進攻棘城廆閉門自守遣使獨以牛酒犒宇文大人聲言於衆曰崔毖昨有使至二國疑宇文氏與廆有謀各引兵歸宇文大人悉獨官曰二國雖歸我當獨兼其國率衆數十萬逼城連營四十里廆使召其子翰於徒河翰遣使謂廆曰悉獨官舉國為冦彼衆我寡易以計勝難以力勝今城中之衆足以禦冦翰請為竒兵於外伺其問而擊之乃聽翰留徒河悉獨官聞之曰翰素名驍果今不入城或能為害當先取之城不足憂也遂分遣數千騎擊翰翰潛知之詐為段氏使者逆於道曰慕容翰久為吾患聞當擊之吾已嚴兵相待宜速進也使者既去翰即出城設伏以待之宇文氏之騎見使者大喜馳行不復設備進入伏中翰奮擊盡獲之乘勝徑進遣間使語廆出兵大戰廆使子皓與長史裴嶷將精鋭為前鋒自將大兵繼後悉獨官自恃其衆初不設備見廆兵至方率衆逆戰前鋒始交翰將千騎從旁直衝其營縱火焚之衆皆震擾不知所為遂大敗之悉獨官僅以身免盡俘其衆獲皇帝玉璽三紐按皓破悉獨官得玉璽三紐與周書普回文合知悉獨官以下至乞得歸逸豆歸即九世中之三世也鮮卑宇文乞得歸晉書載記及魏書作乞得龜十六國春秋前燕録太寧三年春三月石勒遣使通和廆拒之送其使於建康勒怒加宇文迄得歸官爵使之擊廆廆遣皓拒之以遼東相裴嶷為右部都督率索頭段國為右翼命征虜仁自平郭趣伯林為左翼乞得歸屯保澆水固壘不戰遣兄子悉拔雄襲仁於伯林仁逆擊悉拔雄斬之悉虜其衆乘勝與皓攻乞得歸大破之乞得歸棄軍走皓仁入其國城使輕兵追乞得歸過三百里而還盡獲其國重器畜産以百萬計徙其民數萬户以歸先是海出大龜枯死於平郭至是而乞得歸敗其東部大人逸豆歸逐而殺之因自立為王鮮卑宇文逸豆歸涉奕干十六國春秋前燕録宇文逸豆歸既殺乞得歸自立咸和八年八月皓率騎討之軍於廣安逸豆歸懼請和遂築榆隂安晉二城而還咸康元年七月遣右司馬封奕率兵襲擊宇文别部涉奕干一作涉夜干大獲而還涉奕干率騎追戰于渾水又敗之二年六月段遼遣弟蘭將攻栁城西曲水宇文逸豆歸入冦安晉以為蘭聲援皓引兵北趣安晉逸豆歸棄輜重走皓遣封奕率輕騎追擊大破之收其軍實館穀二旬而還十月使封奕攻宇文别部大捷而歸五年又使子蕩冦將軍恪平敵將軍霸等擊宇文别部建元元年二月宇文逸豆歸遣其相國莫淺渾將兵來伐諸將爭欲擊之皓不許渾以皓為憚已荒酒縱獵不復設備皓遣翰率騎擊之渾大敗僅以身免二年正月皓與左司馬髙詡謀伐宇文逸豆歸以翰為前鋒將軍劉佩副之分命廣威將軍軍慕容軍也渡遼將軍恪平敵將軍霸及折衝將軍慕輿根將兵三道並進逸豆歸遣驍將南羅大涉奕干將精兵拒翰翰自出衝陳奕干將應之霸從旁邀擊遂斬奕干宇文士卒不戰而潰燕兵乘勝逐之遂克其都城逸豆歸逺遁死漠北宇文氏由是散亡皓悉收其畜産資貨闢地千餘里徙其部民五萬餘落于昌黎改涉奕干所居城為威德城使弟左將軍彪戍之而還鮮卑木堤附烏桓悉羅侯十六國春秋前燕録咸和九年正月皓遣軍咨祭酒封奕攻鮮卑木堤干白狼揚威將軍淑虞攻烏丸悉羅侯於平岡皆破斬之前燕按慕容氏自廆居棘城尚在今承德府境外後併段氏宇文氏其境始大自廆及皓並受晉封號洎稱燕王漸成外域皓都龍城實居今境故記録自皓始俊之二年始南徙數年之間不乏事迹兹具著於篇并及龍城留臺以下諸人不列慕容暐者以其都鄴不在今境也慕容皓十六國春秋前燕録慕容皓字元貞小字萬年廆第二子晉成帝咸和八年五月廆卒皓嗣遼東公位九年三月段遼冦徒河皓别將張萌擊敗之遼遣弟蘭冦栁城不克而退休息二旬復益兵來攻卒不能拔皓遣寧逺將軍汗及封奕等共救之與蘭遇于牛尾谷大敗奕整陳力戰得不沒咸康二年六月段遼遣中軍將軍李詠夜襲武興遇雨而還都督張萌追擊禽之遼别遣弟蘭率步騎數萬屯於曲水亭將攻栁城西曲水皓率步騎五萬擊之師次栁城蘭不戰而遁皓謂諸將曰虜恥無功而歸必將復至冝於栁城左右設伏以待之乃遣封奕率騎潛伏於馬兜山七月遼果來冦抄奕夾擊大破之斬其將榮伯保十月使世子俊伐段遼諸城大捷而歸三年正月徙昌黎郡築好城於乙連東戍之以逼乙連六月遼又遣從弟揚威將軍屈雲夜襲皓子遵于興國城大戰於五官水上雲敗斬之九月左長史封奕等以皓任重位輕宜稱燕王遂以三年十月丁卯僭即王位大赦改備羣司十一月皓以段遼屢為患稱藩於趙乞師討遼自請盡率國中之衆會之并以弟寧逺將軍汗為質石虎大悅辭其質期以明年大舉四年正月皓遣都尉趙槃如趙聽師期虎將擊段遼募驍勇者三萬餘人悉拜龍騰中郎率舟師十萬步騎七萬伐之三月槃還至棘城皓引兵攻掠令支以北諸城段遼弟蘭來拒戰敗之掠五千餘户及畜産萬計以歸五月趙王虎至徐無遼奔密雲山虎進入令支怒皓之不會師先攻遼而自專其利率衆來伐燕人震恐皓成周內史崔燾等凡三十六城皆叛應之趙兵進攻棘城圍守旬餘左右或勸皓降皓曰孤方取天下何謂降也遣子蕩冦將軍恪等率騎二千晨出擊之趙兵棄甲逃潰恪等乘勝追擊斬獲二萬餘級皓分兵討諸叛城皆下之拓境至凡城築戍凡城而還十二月段遼降皓遣使詐降于趙請兵接應石虎遣征東將軍麻秋率衆三萬迎之皓自率諸軍迎遼遣伏精騎七千于密雲山大敗麻秋於三藏口擁段遼及其步衆以歸五年四月虎使鎮逺將軍石城據後趙録當作石成入冦凡城不克進陷廣城當作成六年皓率驍騎二萬出蠮螉塞長驅至於薊城掠徙入幽薊三萬餘户而還七年正月使築龍城改栁城為龍城縣八年七月營龍城新殿十月皓遷都城大赦晉康帝建元元年十月皓躬巡郡縣勸課農桑復大起龍城宫闕二年四月趙平北將軍尹農率衆冦凡城不克而去晉穆帝永和元年二月賜大臣子弟為官學生號髙門生立東牆於舊宫以行鄉飲之禮親造太上章以代急就又著典誡十五篇並以教胄子十月皓以古者諸侯即位各稱元年於是始不用晉號自稱十二年十四年正月皓親幸東庠十月享羣臣於承乾殿以久旱丐百姓田租十五年七月皓畋於西鄙馬倒被傷九月丙申薨於承乾殿時年五十二在位十五年十月葬於龍山偽僭號追諡文明皇帝廟號太祖陵曰龍平按録內慕容汗慕容恪當時俱為將軍然止因事著號故不另標題後倣此慕容俊十六國春秋前燕録慕容俊字宣英小字賀賴拔皓第二子僭即燕王位稱元年大赦罒月發兵伐趙以恪為輔國將軍評為輔弼將軍陽騖為輔義將軍霸為前鋒都督建鋒將軍簡精卒二十餘萬二年二月使霸將兵二萬自東道出徒河慕容根自西道出蠮螉塞俊自中道出盧龍塞代趙留世子守龍城三月攻陷薊城入都於薊兵至范陽太守李産率八城令長出降四月悉置幽州郡縣守宰自將擊鄧恆於魯口引兵還薊八月徙代郡民於凡城九月南徇冀州十月還薊留諸將守之還至龍城謁陵廟二年二月冉閔僭稱大號攻圍襄國趙主石祇危迫乞師閔聞俊欲救趙遣大司馬從事中郎常煒來聘俊囚煒於龍城遂還薊八月克中山釋煒囚使居凡城十二月俊如龍城元璽元年正月俊還薊稍徙軍中文武兵民家屬於薊四月恪與閔戰於魏昌廉臺擒閔送之於薊斬於龍城遂攻鄴六月鄴北郡縣悉降八月魏校尉馬願等開鄴城納燕兵十一月戊辰僭即皇帝位大赦建元元璽國號大燕時晉永和八年也建留臺於龍城二年二月立妻可足渾氏為后世子為皇太子皆自龍城遷於薊宫三年九月俊如龍城四年四月俊自和龍還薊城五年七月太子卒偽諡猷懷光壽元年二月復立次子中山王暐為太子大赦十一月自薊徙都於鄴十二月使昌黎遼東二郡營起廆廟建熙元年正月甲午俊薨時晉升平四年也葬於龍陵偽諡景昭皇帝廟號烈祖龍臺留臺尚書三人乙逸十六國春秋前燕録元璽元年十一月建留臺於龍城以元菟太守乙逸為尚書專委留務慕容垂十六國春秋前燕録元璽三年四月命冀州刺史吳王霸徙治信都更名曰垂尋遷侍中留録臺事鎮龍城大得東北之和俊忌之復召垂還慕容亮十六國春秋後燕録慕容令密謀起兵鎮東將軍渤海王亮鎮龍城令將襲之亮閉城拒守前燕録建熙十一年十一月冝都王桓率鮮卑五千奔龍城殺鎮軍將軍渤海王亮併其衆奔遼東按慕容俊建龍城為留臺以乙逸為尚書又以慕容垂代逸尋召垂還而不言代垂之人以慕容令之叛及慕容桓之事考之知代垂者亮也終前燕鎮龍城者此三人栁城守將二人石琮慕輿埿十六國春秋前燕録段遼遣弟蘭與慕容翰冦栁城栁城都尉石琮與城大慕輿埿并力拒守蘭等不克而退復益兵來攻圍二旬琮埿拒守彌固殺傷千餘人卒不能拔凡城守將一人悅綰十六國春秋前燕録悅綰榼廬城大人也初仕皓為司馬石虎入冦遣征北張舉襲凡城皓以綰為禦難將軍授兵一干以守之好城守將一人蘭勃十六國春秋前燕録咸康三年正月築好城于乙連東使折衝將軍蘭勃戍之以逼乙連四月乙連飢甚段遼以車數千輛輸乙連粟勃邀擊獲之昌黎太守一人髙開十六國春秋前燕録慕容俊三年趙故太尉劉準土豪封放别聚衆自守俊使昌黎太守髙開討準放開至渤海準放迎降附録十六國春秋前燕録建熙五年七月遣太尉封奕侍中慕輿龍詣龍城徙宗廟及所留百官於鄴都十月封奕等迎神主於和龍十一年秦兵至鄴十一月暐與上庸王評樂安王臧定襄王淵左衛將軍孟髙殿中將軍艾朗等數十騎出奔昌黎堅使郭慶追之執暐送於堅慶進至龍城評奔髙句麗前秦按慕容暐為苻堅所破地入於秦前後燕之間十有餘年秦之職官及境內事不可闕也列序如左龍城鎮將一人苻洛十六國春秋前燕録堅從弟行唐公洛鎮和龍平州刺史二人石越十六國春秋前秦録建元十六年八月分幽州置平州以石越為平州刺史領護鮮卑中郎將鎮龍城苻沖十六國春秋前秦録建元二十一年幽州刺史王永平州刺史苻沖帥幽并人衆擊慕容垂按秦初滅燕其幽州刺史鎮和龍及苻洛以和龍叛平洛之後乃分幽州置平州于是幽州刺史鎮薊州而平州刺史鎮和龍此惟地入于秦十數年間如是前後皆不然也又前秦録太安元年十一月苻丕以王兖為平東將軍平州刺史十二月以宋敞為平州刺史是時和龍已入于慕容垂兖與敞但有刺史之名而未能至其地故但附識于此昌黎太守二人王緼十六國春秋前秦録苻洛舉兵以昌黎太守王緼為右司馬宋敞十六國春秋前秦録建元二十一年王永苻沖頻為慕容垂將帶方太守平視等所敗乃遣昌黎太守宋敞焚和龍薊城宫室率衆三萬進屯壺關按魏書張衮傳衮父卓昌黎太守考昌黎郡至魏世祖太延時始入於魏張衮之厯官在魏太祖時衮父張卓為昌黎太守計其世次當在秦苻堅時並識於此附録十六國春秋前秦録建元十二年十月堅遣安北將軍幽州刺史行唐公洛為北討大都督帥幽冀兵十萬擊魏又遣後將軍并州刺史俱難鎮軍將軍鄧羌尚書趙遷御史中丞李柔前將軍朱彤前禁將軍張蚝右禁將軍郭慶帥步騎二十萬東出和龍西出上郡皆與洛會十六年三月行唐公洛自稱大都督秦王以平規為輔國將軍幽州刺史四月洛率衆七萬發和龍將圖長安堅使屯騎校尉石越率騎一萬自東萊出石徑浮海四百餘里襲和龍五月斬平規及其黨羽百餘人幽州悉平欽定熱河志卷一百三
