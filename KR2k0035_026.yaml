body:
  text: 行宫二烟波致爽芝徑雲隄無暑清凉延薰山館水芳巖秀萬壑松風松鶴清越雲山勝地烟波致爽澹泊敬誠殿後第三重為殿七楹聖祖御題額曰烟波致爽為三十六景之冠殿宏敞髙明旁挹雲嵐後帶湖渚毎夏雨初晴秋颸乍起纎塵不到積霧全空或晨曦吐旭夜月銜規清暉朗照自来迎人真曠然上清天宇也中懸皇上御書聨二一曰鳥語花香轉清淑雲容水態向暄妍一曰雨潤平臯桑麻千頃緑晴開逺嶠草樹一川明聖祖御製詩烟波致爽三集熱河地既髙敞氣亦清朗無䝉霧霾氛桞宗元記所謂曠如也四圍秀嶺十里澄湖致有爽氣雲山勝地之南有屋七楹遂以烟波致爽顔其額焉山莊頻避暑静黙少喧譁北控逺烟息南臨近壑嘉春歸魚出浪秋歛雁横沙觸目皆仙草迎忩徧藥花炎風晝致爽綿雨夜方賒土厚登雙榖泉甘剖翠𤓰古人戍武偹今卒斷鳴笳生理農桑事聚民至萬家御製詩烟波致爽恭和皇祖聖祖仁皇帝御製元韻辛酉時和逄嵗稔𤇺静絶邉譁蒐狩三秋舉登臨萬壑嘉楓黄接雁塞霜白㸃龍沙廻蹕逰仙地空庭遍野花幾多今昔感無那嵗年賒露砌飄殘葉秋籬綴晩𤓰蛩音驚短夢宵韻起寒笳祖制今猶烈金吾漫憶家烟波致爽壬申玉色山原富烟波此處饒虚明疑漢上綺縠漾雲標毎愛秋蟾印長教暑氣消牙琴漫湏數曽入五絃調芝逕雲隄由萬壑松風之前北行長隄蜿蜒直渡芳洲洲大小凡三聖祖御製詩序所謂若芝英若雲朶復若如意者也隄左右皆湖中架木為橋橋南北樹寳坊兩岸平沙似席芳草為茵央道垂楊湖波鏡影額曰芝陘雲隄盖因洲形取義化工體物曲盡其致云聖祖御製詩芝逕雲隄三集夹水為隄逶迤曲折逕分三枝列大小洲三形若芝英若雲朶復若如意有二橋通舟楫萬幾少暇出丹闕樂水樂山好難歇避暑漢北土脉肥訪問村老尋石碣衆云䝉古牧馬塲並乏人家無枯骨草木茂絶蚊蠍泉水佳人少疾因而乘騎閲河限灣灣曲曲滿林樾測量荒野閲水平莊田勿動樹勿發自然天成地就勢不待人力假虚設君不見磬錘峰獨峙山麓立其東又不見萬壑松偃盖重林造化同煦嫗光臨承露照青葱色轉頻嵗豐遊豫常思傷民力又恐偏勞土木工命匠先開芝逕隄随山依水揉輻齊司農莫動帑金費寜拙捨巧洽羣黎邉垣利刃豈可恃荒淫無道有青史知警知戒勉在兹方能示衆撫遐邇雖無峻宇有雲樓登臨不解㡬重愁連巖絶澗四時景憐我晩年宵旰憂若使扶養留精力同心治理再精求氣和重農紫宸志𤇺火不烟億萬秋芝徑雲隄細雨歸舟四集長隄一線入芝徑小艇乗涼隔岸移水向方橋瀠細浪風吹菡蓞倒垂枝秋成已慶年豐兆暑盡無憂雲漢詩遺事陳𤓰為七夕偶因佳節賦清辭御製詩芝徑雲隄恭和皇祖聖祖仁皇帝御製元韻辛酉六飛廻轡指金闕離宫故館兹停歇蕭齋乍啓舊窓櫺蘭若重尋古碑碣銀鈎鐡畫覩璇題趙肥董弱無筋骨寂寥帷幔掛珊瑚欹斜几席巢蛇蠍因思廿載倐流隂電光石火無踰疾苔封石鼎杳無煙惟有金颸蕩寒樾旋歩雲隄憶夙逰倚吟轉覺逸興發丹黄四靣展畫屏一幅關全色乍設寒林窮處忽成峰彷彿如登泰麓東山葩野卉難争􅝰五株疑是秦時松郊原秋景尤堪望比櫛崇墉萬戸同祈年詎異當年志長願田疇歌屢豐大徳曰生恩惠洽道之猶足泫羣工金湯禮義足防隄懸橦度索聲教齊利我後人猶頼敷天雨露蘇黔黎乆安䝉業詎宜恃千秋金鑑垂圗史紹武常懐乾惕衷敢云王化寧遐邇日暮歸來獨倚樓撫今追昔増凄愁歡娯但覺春風暖宵旰誰知午夜憂我詩聊當銘座右願言治理虚心求繼繩祖武懼不逮惟應此志萬千秋芝逕雲隄壬申一逕界雙湖芊綿仙草敷探擕皆上藥招引入方壺魚牣潛還躍鹿馴來可呼劚雲如有興記取十洲圗仇英有著色採芝圗無暑清涼芝逕雲隄東北洲曰如意建殿三重第一重靣南為門五楹聖祖御題額曰無暑清涼洲四靣皆水門當其前廣厦洞闢不施屏蔽平流滑笏逺渚鋪奩飛鳥掠波游魚吹沫徃來紅蕖綠盖間真覺佛地清涼人天勝境矣聖祖御製詩無暑清凉三集循芝徑北行折而少東過小山下紅蓮滿渚緑樹縁隄靣南夏屋軒敞長廊聫絡為無暑清凉山爽朝来水風微度冷然善也畏景先愁永晝長晩年好静益徬徨三庚退暑清風至九夏迎凉稱物芳意惜始終宵旰志踟蹰自問濟時方谷神不守還崇政暫養回心山水莊御製詩無暑清凉恭和皇祖聖祖仁皇帝御製元韻辛酉一縷遥循隄徑長松軒月榭暫徊徨苔紋千㸃萬㸃緑菊蕊三枝五枝芳自是洞天無處覔袛餘元圃可相方根塵乆悟風旛㫖題句還如蝶夢莊無暑清凉太古日偏長朱明暑却蔵有詩惟舉白作記合稱唐松菊開三徑雲山貯一房金蓮紛暎砌心境總清凉五臺清凉山出金蓮花故云延薫山館如意洲正殿七楹左右配殿各五楹在無暑清涼内第二重南向牓曰延薫山館西忩聨曰雲標金闕迥樹杪玉堂懸皆聖祖御茟中楹皇上御題聨曰石劍攅青千林天仗合水衣縈碧一鑑月槎横聖祖御製詩延薫山館入無暑清涼轉西為延薰山館楹宇守樸不艧不雕得山居雅致啟北户引清風㡬忘六月夏木隂隂葢溽暑炎風𣢾𣢾守峯銜山中無物能觧愠獨有清涼免脫衫御製詩延薰山館恭和皇祖聖祖仁皇帝御製元韻偶撫虞琴山館静祝融未覺暑頭銜萬方樂利心胷内解愠何須更脫衫延薰山館壬申洞逹軒窓唘炎朝最納涼松聲風入静花氣露生香竹素恱心永珠林味道長披薰今昔意與物樂時康水芳巖秀延薰山館後殿十五楹在如意洲最深處鏡波繞岸瑶石依欄聖祖嘗以㡬暇讀書其中額曰水芳巖秀左壁聨曰經書同杲日詞賦和卿雲後楹聨曰波漾書林来自九天甘雨花浮墨􅜲長看四季祥雲殿中皇上御書額曰奉三無私聨曰山月滿庭影疎横藻荇松風遶壑韻逺叶笙簧殿之東閣額曰随安室聖祖御製詩水芳巖秀三集水清則芳山静則秀此地泉甘水清故擇其所宜䆳宇數十間於焉誦讀㡬暇静養可以滌煩可以悦性作此自戒始終之意云水性雜若甜水芳即體厚名泉亦多覽未若此為首頥卦明口實得正自養夀擇地立偃房根基度長乆莭宣在茲求勤儉勿落後朝忩千巖裡峭壁似天剖逺託思雲漢怡神至星斗精研書家奥臨池愈澁手清淡作飲饌偏心惡㫖酒讀老無逸萹年年祝大有御製詩水芳巖秀恭和皇祖聖祖仁皇帝御製元韻辛酉巖秀㩀艮靈水芳擅坤厚即此溪壑佳何必稱牛首緬懐智者樂願效仁者夀茲地可會心亭軒建已久澄流遶其前疏峯羅厥後仙壺常秘奥無乃神人剖璇題猶在簷奎文麗星斗顔栁步後塵張王謝敏手明訓垂日月所惡在㫖酒紹庭志雖殷繼武吾何有水芳巖秀智仁山水徳結念喜雙清鏡朗羣芳照屏開衆秀争豪材誰擬議妙詣謝将迎本色羲皇代還忘蕩蕩名随安室癸巳寓名隨所寓而安此日隨安良獨難向祗談經資饜飫茲惟籌治戒盤桓一民失所政應愧必世後仁語未觀勝地雲山昔逰豫瞠乎仰望意遑寛萬壑松風前殿據岡背湖漸近湖為坡陁殿五楹北嚮長松數百掩暎周廻顔曰萬壑松風聨曰雲捲千松色泉和萬籟吟皆聖祖御書康熙壬寅上以冲齡随侍山莊賜居於此伏讀紀恩堂記并題壁感舊詩仰維聖祖眷顧之深我皇上繼繩之切羔墻企慕閲乆彌篤也殿後三楹曰鑑始齋坡下亭曰晴碧聖祖御製詩萬壑松風三集在無暑清凉之南據髙阜臨深流長松環翠壑虗風度如笙鏞迭奏聲不數西湖萬松嶺也偃葢龍鱗萬壑青逶迤芳甸雜雲汀白華朱蕚勉人事愛敬南陔樂正經御製文避暑山莊紀恩堂記癸巳圓明園之紀恩堂紀受恩之自避暑山莊之紀恩堂紀受恩之蹟名同而實異文異而事同一而二二而一者也葢皇祖養育予於宫中之㫖原降於圓明園之紀恩堂兹不復贅然其時實仍居皇考藩邸中及從皇祖来避暑山莊乃賜居斯堂之側堂即三十六景中所謂萬壑松風者夙興夜寐日覲天顔綈几翻書或示章句玉筵侍膳每賜芳飴批閲章奏屏息侍傍引見官吏承顔立側或命歩射以示衆臣持滿連中皇祖必為之喜色至於釣魚而得則令持去以給皇考若隔旬餘半月則遣往獅子園以謁聖母而其年秋随皇祖幸木蘭又有宜紀者入木蘭初圍塲曰永安莾喀圍中有一熊皇祖御火鎗中之熊伏不動乆之皇祖謂其已斃命御前侍衛引予去射之意欲使予於初圍得獲熊之名也其時予甫欲上馬而熊突起奔前皇祖御虎鎗殪之事畢入武帳皇祖顧温惠皇貴太妃指予曰伊命貴重乃以射熊事告之曰使伊至熊所而熊起馬驚成何事體又一日虞者告有虎皇祖命二十一叔父後封慎郡王者往予跽奏願去皇祖曰汝不可去俟朕往之日擕汝去耳似此深恩彼時不知至於今每一念及即欲堕淚夫五十餘年之事歴歴如昨而予六旬有三亦視曽孫矣不有以紀之子若孫其何由知之此予所以追憶而渉筆也子若孫其尚念我皇祖何以眷顧我之深及我之乾乾矻矻何以不敢負皇祖之恩将憶萬斯年永丕基而承天眷胥在矣詎惟一堂之記云乎哉御製詩恭瞻萬壑松風圖感而有作樂善堂集老松經萬年幽壑紛千派蜿蜒掃黛眉虬龍結青葢耳際無餘聲颯㳫泛天籟奔騰鐡騎馳遥見捲旌斾神韻動諸天妙意殊堪會大哉造化功金泉創仙界髙堂臨萬壑一瀉松風快當年諸孫行惟我承恩㝡賜居亭畔室虬枝森一帶盛夏如秋深日夕静相對謖謖吹衣襟谷神守清㤗轉瞬成昔遊感企瞻圖畫萬壑松風恭和皇祖聖祖仁皇帝御製元韻辛酉猶是當時傲雪青重開軒閣俯溪汀廿年未識門牆奥長憶文筵獨授經萬壑松風予當年扈䠋之賜居云萬壑松風舊日賜居也因題其壁癸亥書室依巖俯緑汀重開䆫網午隂亭廿年無限舂音夢只有虬枝未改青雲歸逺岫碧虛髙觸目成吟便搦毫踐履未能融氣習當年慚愧此焚膏草長書帶緑侵階依舊巒光入户佳擬向山靈話離况挈壺偏報午時牌質魯無能歎末由徒驚嵗月逝波流於昭在上恩如海比並乾坤萬古留康熙六十一年予扈皇祖駕居於萬壑松風軒之側今嵗擕諸皇子至此仍以以是處居之朅爾經臨撫然感舊己巳佔畢書齋還似舊兒時居處處上聲諸兒越教俯仰懐恩澤用勵勤修示範儀萬壑松風壬申蒼翠欎氤氳巖端細逕分四時無改色衆木有超羣葢影晴仍暗濤聲静不紛髫年讀書䖏終是愧尊聞康熙壬寅随侍此䖏皇祖賜居讀書題萬壑松風舊書屋甲戌髙槐書屋緑隂匀睫眼流光卅二春昔日恩承仁祖䖏今来又作抱孫人鑑始齋丙子地是諸天上山如太古初披芸人不識疏仡以前書題鑑始齋壬午松風萬壑涼曰有讀書堂絶勝閒花草依然昔縹緗慎終念惟厥無水監於當思義顧名䖏初心寧敢忘鑑始齋癸未翠隂籠護萬松深鑑始恒教一再臨此是當年受恩䖏益因刻勵覲揚心題鑑始齋己亥鑑始顔齋額興予憶舊長含飴沭恩渥舞象課書蘉望七今同嵗康熙壬寅予居此時年甫十二是嵗矣皇祖正六十九壽兹予亦六十九當秋偶自傷息肩兹尚未不息曰惟強題鑑始齋壬寅萬法誠誰是不遷齋題鑑始尚依然幼齡十二承恩䖏瞥眼流隂六十年題紀恩堂丙戌紀恩何䖏不思恩新額堂名例御園每至山莊追慕祖惟兹書屋賜居孫卌餘載付舂音響巖下溪猶水逝翻孤負幸無肩歇未慎脩思永敢空言題紀恩堂壬辰堂額雖由御園述御園恩紀此叨駢賜居書屋今斯在教侍山莊昔有縁敢不繩承勵初志亦惟宵旰佛仔肩松風萬壑還依舊是處景之御題萬壑松風為山莊三十六一向日子賜居也瞥眼流光五十年晴碧亭憶舊壬寅萬壑松風山之隂枕溪有亭曰晴碧我年十二随至此即指殿旁為賜宅望見御舟泊亭畔呼名趨下層岩壁顧謂勿疾恐蹉跌是即初䝉恩眷日即今歩履偶借扶那復騰蹌健如昔白頭宫監消磨盡祇有岩松足為質左右無人知此者六十年遥迅瞬息而我勿言更誰言永朂惕乾酬祖徳松鶴清越山莊内西偏為榛子峪殿門五楹南向聖祖御題額曰松鶴清越聨曰竒花文石娱朝夕白鶴蒼松永嵗年每嵗駕幸山莊奉寜夀宫於兹殿其地窈然虚曠青盖垂隂九臯振響丹邱福庭無以踰斯殿皇上御題額曰静餘軒聖祖御製詩松鶴清越三集進榛子峪香草遍地異花綴崖夹嶺虬松蒼蔚鳴鶴飛翔登蓬瀛臨崑圃神怡心曠洵仙人所都不老之庭也夀比青松願千齡葉不彫銅龍鶴髪健喜動四時調御製詩松鶴清越恭和皇祖聖祖仁皇帝御製元韻辛酉白鶴志猶㓗蒼松獨後凋景仰終身慕詎止温凊調松鶴清越當時奉皇太后居於此松鶴清越壬申胎仙将夀客結友嶠洲中蔥蒨入森秀飛翔樂逺空天垂四幕碧泉帶百花紅色養𫝊家法齋名此日同是䖏為當年奉莊内寧壽宫豫逰之所兹於山奉皇太后起居處亦名松鶴齋遵先志也松鶴清越二首甲申皇祖奉寧夀庭前夥植松老龍鱗已作百行孝為宗風過聲猶謖秋来翠越濃祇疑蒼蔚䖏定有偓佺逢右松前嵗放雙鶴時時還自来秋巡今即昔至樂約而該丹嶠弹喉響碧霄振翅迴琳輿不湏駕王母在瑶䑓右鶴静餘軒甲申動復歸有静静更動之初以兹相衡校端知静有餘此意自古然而我名山居山居静所會幾餘常憇諸或時詠新什或時讀古書皆足澄心神庸渠去聲遊空虛無逸曰不遑是同非異如静餘軒丙戌四面青山書屋幽既深而静又清秋那能長此躭佳趣惟是餘閒片刻留静餘軒丁亥入幽披菁蔥據勝開軒榭山川足竒遇位置非假借屋中何所有書史滿鄴架道徳企優逰氣質欲變化却欣消片時此静得餘暇静餘軒己丑處䖏有山居恬如復澹如中和氣已備晏息體常舒花露濃噴馥松風颯入虗雖云一晌静原是萬幾餘静餘軒有會静餘有二義一曰静有餘是則軒所獨而我偶領諸一曰餘以静乃每心憪予萬幾日待理清暇艱致於静更躁之反餘復饒所如未能饒以静且圖躁或祛題静餘軒辛丑於軒為静餘于人為餘静有識人無識軒間犂然本殊境有識者為暫無識者為永暫永已弗敵有無豈相等而我嘵嘵言自謂不自省雲山勝地煙波致爽之後髙樓特起八牕洞逹俯瞰羣峰夕靄朝嵐頃刻變化不可名狀聖祖御題額曰雲山勝地樓之西楹奉佛聖因净業秀攬青蓉皇上御書牓曰蓮花室聨曰雲影澄觀妙悟太空参合相山光恱性静因常住識真如聖祖御製詩雲山勝地三集萬壑松風之西髙樓北向慿牕逺眺林巒烟水一望無極氣象萬千洵登臨大觀也萬頃園林逹逺阡湖光山色入詩箋披雲見水平清理未識無愆守莭宣御製詩雲山勝地恭和皇祖聖祖仁皇帝御製元韻辛酉黄雲近壠復遐阡想像豐年入頌箋二十年来衣食足黔黎猶戴聖恩宣雲山勝地壬申峻宇昔垂戒山莊今可稱地靈延晝永峰秀蔚雲興結構因時勝逰歌所事仍年年奉慈輦惬願祝如陵題蓮花室辛巳雲山勝地聳髙樓靜室蓮花樓上頭調御丈夫無色相應直十六有源流憑𠫭水月還天月如是今秋即昔秋一切塵心兹凈掃不忘兩字祖恩留蓮華室癸未香楠木榥刻蓮花大士無言轉法華妙法蓮花經一曰法華經勝地雲山自千古是室即雲山勝地樓上暖閣雲山勝地皇祖題額也問心何處剥蕉芽再題蓮華室靜室據髙樓蓮華凈業脩底須翻七巻常此伴三秋調御丈夫相應真雲水流斯之未能信惟是厪先憂欽定熱河志卷二十六
