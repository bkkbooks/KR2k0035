body:
  text: 水一塞垣以外萬山合沓而襟帶縈絡當以水道證之承德府屬全境諸水按以水經注名少相合土俗所稱原無準字地居邊徼載籍傳訛故難印證也自聖朝創建仙莊川涯河渚半為輦道所經我皇上駐蹕之暇指示源流若武列水濡水之源巨製親裁徴信萬古編摩之臣以今證昔得有稟承其水徑各州縣境難於按屬分𨽻則提某大水為綱而以所會某某諸小水附入俾源流分合一覽瞭然其經流出各州縣境者則分注云舊某廳境其經流不出各州縣本境者則云源出某山某境入某州縣境以清界址其有古今異名無從徴驗者則引據舊本書以闕疑附之篇末以傋考稽至木蘭境內之水並依諸山之例彚載圍場卷中志水第十熱河有三源一出圍場東南界察罕陀羅海之西固都古爾卡倫之南在熱河行宫東北二百餘里為西源合平頂山南諸小水南流徑豐寧縣即四旗廳屬察哈爾正南旗境屈曲南流徑固都爾呼達巴罕名固都爾呼河又西南流至中關行宫之東一出平泉州即八溝廳屬喀喇沁右翼西境默沁達巴罕西之玳瑁溝在喀喇沁右翼西一百餘里當平泉州治西北境為中原初名默沁河西南流徑承德府即熱河廳東北之茅溝汛境名茅溝河至至中關之東與固都爾呼河合而南流一出喀喇沁右翼西南境霍爾霍克達巴罕西之三道溝在喀喇沁右翼西南一百二十餘里亦當平泉州治西北境為東源名賽音河西南流入承德府東北境有溫泉注之又西與固都爾呼河會三源合而西南流徑黃土坎行宫及釣魚臺行宫之東又西南流環避暑山莊之東行宫內又有溫泉流出注之始名熱河南流折而東復折而南至下營子入灤河即古武列水水經注武列水三川派合西源右為溪水亦曰西藏水東南流出溪與蟠泉水合西藏水又西南流東藏水注之水出東溪一曰東藏水西南流出谷與中藏水合水導中溪南流出谷南注東藏水故目其川曰三藏川水曰三藏水東藏水又南右入西藏水亂流右會龍泉水又東南流與龍芻水合又東南流徑列溪謂之武列水東南厯石挺下其水東合流入濡按今熱河即武列水固都爾呼河茅溝河賽音河即古三藏水至溫泉會流之後始名熱河臣等恭讀御製熱河考於熱河濡水之分源辨證精詳並審晰􅐱注三川先後合流之舛誤源流洞悉曠若發蒙知道元當日未得躬親目覩故言之不精不詳無足徴信也兹仰承聖訓垂示永久爰約舉酈注原文以為緣起云御製文熱河考戊子考水源而不親履其地晰其支派脈絡分合之由雖博綜載籍稽諸故老之流傳不能參互而訂其踳曩或以熱河為濡水之源余固心疑之而未暇深考夫濡水即灤河自多倫諾爾之北而來其源甚逺又折而東南數百里乃厯喀喇河屯又東南流數十里至鳳凰嶺熱河乃南注會之不應其源反出於此蓋濡自有源而熱河又别有源是不容紊今秋駐山莊遣喀喇沁郡王拉特納錫第內大臣努三往尋熱河之源則得之于察罕陀羅海蒙古語察罕謂白陀羅海謂首蓋以山阜得名其地距熱河二百里而贏流經固都爾呼達巴罕麓蒙古語固都爾呼者伏行達巴罕者嶺也遂名固都爾呼河西南至於中關東茅溝河水自玳瑁溝出西南流注之又合而南流賽音郭勒河水蒙古謂好為賽音河為郭勒自霍爾霍克蒙古語謂熟食達巴罕之三道溝出南流折而西南與湯泉泉出山莊東北湯山合又西注之三源既滙又西南流沿山莊東北厯錘峯下山莊行宫內亦有溫泉流出滙之於是始有熱河之名南流折而東復折而南入於灤是則熱河乃會濡水而非濡源審矣酈道元水經注云濡水又東南流武列水入焉其水三川派合西源曰西藏水西南流東藏水注之東藏水出東溪西南流與中藏水合又南右入西藏水故目其川曰三藏川又東南流徑列溪謂之武列水東南厯石挺下層巒之上孤石雲舉髙可百餘仭其水合流入濡按道元所言石挺即今錘峯其曰三藏即今固都爾呼茅溝賽音郭勒三源則熱河之為武列水無疑第古今異稱今人但知熱河而不知武列耳然所云三川合流之序則不足據今考固都爾呼為西源茅溝為中源賽音郭勒為東源西源自北而來先合中源又南始與東源合道元所謂西藏水又豈能越中藏而先與東藏合哉此其敘述錯綜已足滋惑而以中藏為先合東藏則又其顯然大謬者也又如以濡水為經白檀比夫白檀乃今密雲實非濡水所經則誤以漢書地理志之洫水亦名鮑邱水即今潮河為濡又從而傅會之矣蓋徒尚耳食而未親履其地晰其支派脈絡分合之由毋怪乎其舛也或以為熱河既會濡而東入於海則謂之濡源亦無不可何須置辨是大不然夫江淮河濟何一不入於海而皆謂之海可乎昔禹貢載導河自積石或以為亦若江之岷山淮之桐柏矣及今平定回部乃知河源自蔥嶺以東之和闐葉爾羌諸水瀦為蒲昌海即鹽澤蒙古語謂之羅布諾爾伏流地中復出為星宿蒙古語謂之鄂敦諾爾即元史誤譯為火敦腦兒者其水在枯爾坤之東昔皇祖遣使窮河源得之於此未入御製文以記其時回部版圖故止及星宿海也至積石始名黃河則大禹所記亦第就目所經見者而言道元又安能以所未經見者而一一詳訂其曲折也耶茍非命使親履其地烏知此之為是而彼之為非乎近敕儒臣輯熱河志故考其源俾知所從事若夫濡水之源則更俟他日詳考之默沁溫泉源出平泉州即八溝廳屬喀喇沁右翼西一百十五里有二泉一自默沁河東境西流一自默沁河西境東南流俱會默沁河下流為茅溝河綽諾河源出平泉州即八溝廳屬喀喇沁右翼西南一百二十里西流會賽音河溫泉源出熱河行宫東北八十里之湯山見山門泉水湧自山半溫暖適宜康熙年間每駕幸山莊多臨御焉有聖祖御製湯山龍尊王佛廟碑記恭載寺廟門其水東南流會賽音河按熱河附近多溫泉而湯山所出為最著遼史皇子表載普賢努拜南京留守至北安州浴溫泉今熱河為遼北安州地所稱溫泉或即指此石洞溝泉源出中關西北三十里豐寧縣即四旗廳境內石洞溝東合黑水溫泉東南流會固都爾呼河山莊內溫泉源出熱河行宫內自德滙門之東流出東南流會固都爾呼河為熱河按水經注載蟠泉水東流九十里注西藏水在武列水三源未合之前又有龍泉水出東山下西南流注三藏水又有龍芻水出龍芻溪東流入三藏水皆在武列水三源既合之後皆在今熱河所會諸小水之中因古今異稱附識于此新河在熱河行宫之南境長六百九十餘丈廣七丈乾隆三十六年所開以泄西南諸山夏秋漲水由南山下東歸熱河御製文開新河記辛卯熱河之水有二其自東北來者為固都爾呼河三源滙而為一即水經注所謂武列水也繞山莊東北錘峯下中關東溫泉為一源又山莊行宫內亦有溫泉流出滙之遂有熱河之名東南流入於灤其水雖大然向有隄以障之時復培鞏故得循軌而有所歸宿即盛漲不為患其自西來者為廣仁嶺及獅子嶺諸山之水水本無源常時無涓涔迹雨後則循山東赴至西紅橋轉而北又由東紅橋轉而南始緣南山溝流入熱河而溝道紆狹久復淤墊故宣導不能速向以其無大患亦遂易而忽之己邜夏大雨驟霔西南諸山水一時並集平地漲丈餘經西紅橋趨突北山下石激波轉勢益洶悍自北而南衝擊東紅橋奔湍蕩越市㕓廬舍當之者多隨波而圮事聞發內帑賑恤且量漂屋楹數給資繕復之及庚寅災仍如之其賑恤繕復亦如之夫十年之間兩遭其害警於己事曷可不籌度以善其後顧無源之水不能以有形治惟順其勢而疏之使下流暢達則其上自不復壅潰為害防弭之道無過於此蓋是水之致患徒以兩紅橋溝狹而不能容耳若舍此狹溝使緣南山下新濬河寬而能容東赴熱河宜免搏擊之勢乃命內大臣三和御前大臣努三等偕直𨽻提督王進泰熱河道明山保由南山下寬開河道西自同知衙前東至旗營長六百九十餘丈濶皆七丈深隨地形髙下自三尺八寸至一丈二尺有差其河身經流有直民居者令移搆岸旁髙地仍計屋授之值俾各得安處工始於辛卯三月初至六月中告蕆通費內府金一萬三千兩有竒新河既成是秋雨復大漲復盛而水皆循河安行無過無溢其效固已覩矣熱河自聖祖締搆山莊以來迄今六十餘年四方之民環集輻輳駢坒殷闐盛若都會朕敬繩祖武嵗奉聖母駐此承志頥和因以順時行搜習武從官衛士之扈行以逮新舊諸藩之執役者內外咸集以故熱河煙火之盛月益嵗增則計所以保聚而安全之者誠為切要而此新河之利尤大且逺也繼此之修濬惟勤毋使堙塞實蒞斯土者之責可不慎諸惟茲廣仁嶺下為每年恭迓安輿所必至爰即疏河起處規隙地朴築數椽以偹憩候其前實臨經塗因植碑為亭記其原始以昭示無斁以上皆入熱河之水茅溝河賽音河皆入固都爾呼河以其並為熱河之源故不復另列灤河自獨石口外東北一百三十里牧厰界內之巴顔屯圗古爾山發源初西北流徑獨石口廳界內一百五十餘里至上都店入多倫諾爾廳界北流復折而東北流徑舊開平城南亦名上都河又折而東南流至桞條溝共行四百七十餘里始入豐寧縣即四旗廳屬察哈爾鑲黃旗境南流至僧機圗汛之東又南至大廟灣折而東又折而西南復折而東南仍折而東徑韭菜梁又東流徑正白旗境又東徑鳳凰山至郭家屯之東北小灤河自北來會之始名灤河折而南流徑大對山之側又折而東仍折而南至北店子徑鑲白旗境南流至興隆莊共行縣境四百十八里入灤平縣即喀喇河屯廳境南流又折而西南復折而東南至張博灣之北興州河自西來會之折而東流至小營子伊遜河與伊瑪圖河合流自北來會之遂繞喀喇河屯行宫之北而東又東南流至石門子共行縣境二百十八里入承德府即熱河廳境東流至下營子熱河自東北來會之折而南流徑上板城至白河口前白河自西來會之又老牛河自東北來會之又東南流徑下板城至桞河口桞河自西來會之又車河自西來會之又來南流至門子哨接平泉州即八溝廳西境共行府境二百二十里入永平府遷安縣邊外界沿平泉州之西復會黃花川清河豹河至潘家口入邉即古濡水也漢書地理志肥如縣濡水南入海陽水經注濡水出禦夷鎮東南其水二源雙引夾山西北流出山合成一川又北西徑禦夷故城東鎮北百四十里北流左則連淵水注之右則汗水入焉又北徑沙野西又北境箕安山東屈而東北流徑沙野北東北流徑林山北又東北流徑孤山南東北流吕泉水注之又東盤泉入焉又東南水流回曲謂之曲河鎮東北三百里又東出峽入安州界以下誤入徑白檀要陽之文辨正見建置沿革門又東南索頭水注之又東南流武列水入焉又東南五渡水注之又與髙石水合又東南徑盧龍塞塞道自無終縣東出渡濡水向林蘭陘東至清陘按灤河自漢以前皆書為濡漢書地理志肥如縣濡水顔師古音乃官反正讀如灤水經注又稱濡水為難河謂濡難聲相近俗語訛耳亦書作渜唐韻謂水名在遼西肥如縣者是也至灤字本作灓説文但載漏流一訓而不及水名考新唐書地理志漁陽郡下有渡灤河之文舊唐書稱薛訥由檀州出灤河權德輿劉濟墓碑亦稱飲馬灤河之上則濡字作灤當由唐始王曾行程録言自偏槍嶺四十里過烏灤河蓋遼有是名元人亦名御河元史延祐四年上都城南御河西北岸為水衝嚙命及時修治是也又以屈徑上都之南名上都河土語傳曰商都若明李實奉使録言土人以河水青緑急流呼曰商都者妄也至水經注濡水自發源至入盧龍塞所會之水凡九內大要水一條係誤入今灤河自獨石口外牧厰發源至入潘家口其附入者不下三十餘水以今證古確指為難然濡水始而西北流繼而北流折而東北流又折而東流復折而東南流其水道固至今無異也水經注稱水流回曲謂之曲河又東出峽今灤河自多倫諾爾之大河口以後羣山環束屈曲奔赴徑豐寧縣即四旗廳郭家屯之北山勢始稍豁與酈注出峽之父正合古濡水自東南流之後始會索頭水武列五渡水髙石水今灤河自徑郭家屯之後即折而南流自入灤平縣即喀喇河屯廳境之後始折而東南流則今之伊遜河可當索頭水今之熱河可當武列水今之老牛河可當五渡水今之豹河可當髙石水按其方位考委尋源猶可得故道惟今之前白河桞河車河黃花川諸水無古名可考當是道元時安州諸郡縣後俱淪陷入庫莫奚故所載未免遺漏或因其小水不載耳臣等伏讀御製灤河濡水源考證敬謹紬繹為疏其大略如此聖祖御製詩灤河塞邊逺繞至灤河徹底清明不見波駐輦徘徊千萬里石鯨兩岸影嵯峨灤河泛舟平沙漠漠接長河天際浮雲落照多兩岸蒼山相竦峙扁舟一棹任清波次上都河磧裏水潺潺前旌杳靄間長風吹海月一夜照關山虎旅嚴宵衛星宫列從班髙峯望縹眇明發欲躋攀灤河濡水源考證己丑濡水見史傳者凡五説文出安東入漆涑者涿郡之濡也廣輿記出易州窮獨山一名聖女水者易州之濡也並音儒左傳出髙陽者河間之濡也音而三水皆由天津入海此獨石口外之濡讀如難音與灤近其水自由永平府之樂亭縣入海與畿內三濡逈不相涉又水經注蒼梧之濡水出永豐縣濡山字亦音儒名亦適相同耳而惟灤河之濡水源逺流長雄於其四酈道元水經注所云出禦夷境者也昨嵗命方觀承考濡源委亦既繪其梗概條分縷析而為之説矣然以漢文訓蒙古語未如同文韻統得字音之正而鄂博之類穿鑿更甚蒙古語謂堆砌石以表祭處為鄂博方觀承乃書作峩軷且引鄭氏及詩大雅之言證為軷祭行路神之義鑿而謬矣曽為鄂博説以證其誤他如們綽克之為們催達巴罕之為大埧類此者不可枚舉難以一一為之辨訂也因命嚮道大臣努三挈方觀承所遣同知黃立隆者重循其源以至其委於是二千餘里之灤河曲折分合盡得其實因詳注其地名及諸水之滙流而酈道元歐陽修等並元史河渠志所載相舛誤者都為四條考證如左夫江淮河濟中國之四瀆也其理大物博較之灤河濡水不啻倍蓰而禹貢以數語盡之兹注濡水數千言猶有未盡焉古今相去不可及者如此蓋得其簡則足以提要欲其詳反不免致繁抑以塞外中土語言不同人迹罕至斯固難易所由殊然則就同文韻統會中外而傳濡水之實詎不在此時乎哉灤河源出獨石口外東北一百餘里巴顔屯圗古爾山山為興安正幹自張家口而東至獨石口外為大山折而西北過上都城入於圍場之海喇堪與興安大嶺相連屬出泉處較興安山梁尤為特出山陽山隂樹木茂密與他山異信為名山山陽為民人居址山隂皆察哈爾蒙古遊牧地四泉湧出名都爾本諾爾涓流曲折伏而復現西北經訥克里和洛有小水自東注之又北經哈丹和碩之西噶爾都思台之水自東注之又曲折西北流至茂罕和碩自都爾本諾爾至此計七十餘里三道河自東來滙之其水一出摩霍爾巴逹罕一出伊克達巴罕一出楚庫爾蘇達巴罕各相距十餘里滙為一河河流始暢又西北流復有二小水一自布爾噶蘇台一自克爾哈達先後來注之八十里經察罕格爾俗名西涼亭烏蘭河屯至上都店入多倫諾爾界又北流十餘里經淖海和碩折而東北二百五十餘里經博洛河屯至庫爾圗巴爾噶遜河屯喀喇烏蘇自東注之又三十餘里至上都河屯上都即元開平府藻水經其城南故名上都河察罕諾爾自北注之又六十餘里經都什巴延珠爾克山至察罕鄂博東克伊綳河自東北來滙之河出興安山梁之陽南流伊克霍爾昆巴罕霍爾昆伊札爾三水自東注之西與海留台河合而為一入於上都河河水倍暢折而東南流十八里至磴口額爾德尼布拉克自西注之其水經多倫諾爾之北又十二里至大河口圗爾根伊札爾河自東北來滙之其水亦出興安山梁之陽逶迤西南流錫喇札拜自北入之又西南流摩霍爾伊札爾自東南入之滙注於此又南流七里沙岱布拉克自西注之又折而西南流二里霍洛圗布拉克自東注之又九里海拉蘇台河自西注之又一里搜集布拉克自東注之又南流一里渾齊布拉克亦自東注之又十里察罕郭勒自西注之又十一里什巴爾台河自東北注之其水出伊克空卾洛鄂博西為木蘭圍場西界又折而西復折而南八里克籌布拉克自西注之又十七里經鷹北灘入四旗廳界布爾噶蘇台哈丹和碩河自西注之又十七里經半壁山又南經大廟灣折而東復折而西南五十八里頭道河自西注之又二里羅蜜塔子亦自西注之轉而東南流三十二里至木厰又折而東流二十四里經韭菜梁又九十五里經小遼東至瓜地摩霍爾阿爾善所出之湯泉自南注之又二十七里經西屯庫爾竒勒河俗名小灤河自北來滙之其水出興安山梁之陽三支分引過托霍隆和洛合為一西南流會瑪尼圗卡倫哈朗圭達巴罕珠爾噶台海拉蘇台諸水折而東南會霍來郭勒哈爾渾諸水又噶拜卓索阿魯布拉克昂阿諸水復先後會之合為一河注於此自此遂名灤河又二十七里至郭家屯折而南流四十六里至大對山又折而東復折而南屈曲行八十餘里至興隆莊入喀喇河屯界南流五十九里經五道河折而西南流四十九里至張博灣興州河自西北來滙之其源出沙爾呼山西經土城子東南流曲注於此折而東流七十餘里經喀喇河屯繞行宫東流伊遜河自北來滙之其水發源圍場內西流經博洛河屯與伊瑪圖河合西南流屈折注此東南流三十四里至石門入熱河廳界又四十七里經鳳凰嶺固都爾呼河自東北來滙之其源出固爾呼逹巴罕西南流與都茅溝河合又與賽音郭勒河合三源既滙沿避署山莊東北其水會茅溝後即與湯泉合至是行宫內亦有溫泉流水滙之遂名熱河水至此益大折而南流四十三里白河自西注之此與發源瑪尼圖達巴罕經密雲縣會潮河之白河異又三十三里老牛河自東北注之又三十三里至滴水崖南二河自東注之又十里桞河自西注之又六里車河自西注之又三十餘里至門子哨入遷安縣界黃花川自西注之又三十二里清河自東注之又九里豹河自東北注之折而西流二十里經灤河灘又南流折而東復折而西經楊枝峪又東南流二十一里入潘家口折而東又折而西十里經走馬哨又二十四里至潵河橋潵河自西注之又曲折東南流七十餘里至白布店恆河自西北注之又折而東流十餘里至煤峪口長河自東北注之又七十三里過平崖子清河自東北注之此與黃花川南之清河異折而南流二十餘里至峽口蛤螺河自東注之又二十九里過遷安縣西經黃臺山又二十三里折而東三里河自東注之其河與二道泉合又南流二十餘里經孤竹城入盧龍縣界又三十五里至合河口青龍河自東北來滙之其源出特布克入桃林口復有一水自冷口來會之經永平府城西過虎頭石入於灤河流至此勢益寬大又十一里繞雪峯寺又二十一里過武山西橫河自西注之又三里至偏涼汀入灤州界又南東五十六里過定流河入樂亭縣界又三十六里至老河口灤河故道金涸又西南流二十里至小河崖清河自西北注之此與黃花川南及平崖子之清河俱異又七里至石家坨灤自此分支名髙密河常涸大雨時仍分流達海折而西南流五十餘里至新橋口入於海自河源至此約二千餘里酈道元水經注云濡水出禦夷鎮東南按禦夷鎮為北魏六鎮之一其建鎮之所雖不可考而魏太祖紀云築長城於長川之西自赤城西至五原延袤二千里又魏世祖破蠕蠕列置降人於漠南東至濡源西概五原隂山分六鎮是禦夷居六鎮之東自獨石口外至開平皆其故地以今所上都河源方向核之道元考所言非盡無稽惟云二源雙引夾山西北流則未能實辨都爾本諾爾為濡水正源而以夾山來會之三道河誤為濡源雙引其云出山合為一川則即今之茂罕和碩耳至云又西北徑禦夷故城東其遺迹無可據惟以鎮北一百四十里計之當在今烏蘭河屯之地其餘諸山水雖與今圗不能悉合然所云又北徑箕安山東屈而東北流似即今之多倫鄂博圗其云徑沙野西又徑沙野北則似指伊克們綽克至喀喇烏蘇一帶沙磧言之其云三泉鷹次合為一水注吕泉水則似今之克伊綳河合伊克霍爾昆等三源也云逆流水則似今之伊札爾也云木林山水則似今之海留台水也云又東盤泉水自西北東南流注濡河則似今額爾德尼布拉克也又所云東南水流回曲謂之曲河鎮以今圖屈折形勢觀之蓋即今大河口自此以下道元即闌入白檀要陽按其地距所云會武列水之熱河境尚七百餘里漢時郡縣安得至此其舛尚何待深辨乎至濡水又東南徑盧龍塞則為今之潘家口無疑其云塞道自無終東出渡濡水向林蘭陘東至清陘無終為今玉田林蘭陘蓋今喜峯口清陘即今冷口即此以證不特塞垣疆界了然即田疇引曹操回軍盧龍塞之處亦可得其大概矣其自潘家口以內至入海處􅐱注所記州邑山水雖名稱今昔不同而以志乘訂之皆約略可數而未至大舛蓋道元於諸水源委詢考綦詳故所言時有相合者惟未嘗親履其地且以漢言志蒙古山水名目往往傳訛傅會更不免謬以千里則泥古而不知核實之過也歐陽修云灤水出炭山東北胡三省通鑑注因之其後陳組綬職方圖考顧祖禹方輿紀要皆從其説今考獨石口外無所謂炭山者惟巴顔屯圖古爾山據努三云土人名其山為黑老山按昔人有謂濡水出黑龍山者龍老音轉承訛黑龍山之言似不為妄今巴顔屯圗古爾山其陽石色黝黑所謂炭山或即此而明一統志乃以萬全縣南之炭山當之其地距獨石三百餘里則更風馬牛不相及矣元史河渠志灤水出金蓮川中今獨石口外濡源相近處無所謂金蓮川者按金史地理志云桓州曷里滸東川更名曰金蓮川又元史地理志云世祖命劉秉忠相宅於桓州東灤水北之龍岡中統元年為開平府五年加號上都即今之上都河屯正在灤水之北桓州尚在其西考元周伯琦扈從北行記云至失八兒秃地多泥淖驛路至此相合地多異花有名金蓮花者似荷而黃至察罕腦兒猶漢言白海也厯數驛始至桓州又王惲中堂事記云灤野蓋金人駐夏金蓮云云考其地皆與上都河屯相近失八兒秃當為什巴爾台蒙古語泥濘處也在上都西少北察罕腦兒當為察罕諾爾蒙古語白湖也在上都南少西金蓮川當在什巴爾台察罕諾爾之間元陳孚金蓮川詩云茫茫金蓮川日映山色赭昔人建離宫今但存古瓦蓋金時於此建景明宫為避暑之所許安仁疏有金蓮千里之外語以距京師道里計之亦相合又今什巴爾台少西北有和洛和山蓋即今史所謂曷里滸者川在其東去獨石口幾五百里其非濡源明甚周伯琦賦得灤河送蘇伯修詩云清灤悠悠北斗北千折縈環護邦國直疑銀漢天上來金蓮滿川淨如拭蓋灤河先徑金蓮後至上都伯琦詠灤河而兼及金蓮殆指河流所經言之修元史者直以為灤出金蓮川中誤矣御製詩灤江癸巳今嵗灤江水甚微誠以入夏缺雨故深處不過三四寸淺者或至沙觜露河陽原有别墅在小舟牽泄乃可渡前日西北雲容重情知當得山雨遇果然千峽落暴漲衝橋適值狂波怒漲過仍此或淺川其涸立待言可悟其涸立待言可悟故吾不取不虞譽瓜地溫泉源出豐寧縣即四旗廳屬正白旗郭家屯西北三十里縣治土城子北西一百三十里有浴池在泉側其水東流入灤河庫爾竒勒河俗名小灤河源出圍場內興安嶺之陽會諸小水初西南流折而南流出海拉蘇台柵徑半壁山入豐寧縣即四旗廳屬正白旗境南流至熱水溝有溫泉注之又南流至郭家屯之東北入灤河熱水溝溫泉源出豐寧縣即四旗廳屬正白旗郭家屯北三十五里之湯山在縣治土城子北一百三十里有浴池在泉側其水南流會庫爾竒勒河錫喇塔拉川一名興州河以在古宜興州地得名源出豐寧縣即四旗廳屬正白旗郭家屯西稍南八十里之沙爾呼山在縣治土城子西北九十里東南流徑花家營之西又屈曲東南流至赫之東徑鑲白旗境又東南流至波羅梁汛之西南入灤平縣即喀喇河屯廳境東南流復折而東流徑金鈎屯之東入灤河伊瑪圖川源出圍場內會諸小水屈曲南流出瑪尼圖柵徑什巴爾台入豐寧縣即四旗廳屬鑲白旗境南流徑阿穆呼朗圖行宫及濟爾哈朗圗行宫之西又南流至少府營之東徑正白旗境又南至四道營與伊遜河會南流入灤河伊遜河一作伊松河俗稱羊腸河源出圍場內伊遜色欽色欽即源之謂也會諸小水屈曲南流出伊遜喀卜齊爾柵徑石片子入承德府即熱河廳境南流徑張三營行宫之西又南流至坡賴村折而西南流入豐寧縣即四旗廳屬正藍旗境又西南流繞波羅河屯行宫之西徑正白旗境伊瑪圖河合而西南流又折而東南入灤平縣即喀喇河屯廳境復屈曲南流至喀喇河屯行宫之北入灤河即古索頭水也水經注濡水又東而南索頭水注之水北流南徑廣陽僑郡西今安州治又南流注於濡水按水注載索頭水之入濡水在武列入濡水之前今灤河先會伊遜河而後會熱河所云濡水又東而南亦與今郭家屯汛以下灤河形勢相合知伊遜河即古索頭水惟所云索頭水北流與今不合然既曰北流不應又曰南徑知北流乃自北流來酈道元解漢書地理志侯水北入渝句亦曰蓋自北而南知水經注有此例也又按伊遜河舊作伊松河或作衣素河又作宜孫河復儀粟河方輿紀要作以遜川作譯語對音隨呼輕重故字多互異今照本音以伊遜為正御製詩伊松河癸亥伊松河水當秋澄伊松河畔秋風清我來策馬渡河汏但見蒼煙羃䍥連沙汀蒹葭采采花欲白中流浴浪無鵁鶄牛輜駝馱入畫意山容樹態皆詩情逝者如斯憶前嵗惟餘長波㶁㶁無停聲汲伊遜水烹茶癸酉所遇名泉必試品揚子苐一故藉其廬山瀑簾雖未悉以此知彼豈虗審玉泉伊遜真巨擘難為伯仲均天稟標名趵突澤皇都澗瀍利永阜豐廪塞搜此地每經過可無表德垂終念是時秋煙正霽川鴐鵝翔集魚鮪淰氊廬綆汲煮行鐺清賞作歌乃自朕蟹魚懶舉火候常肘腋慢道風生凛八功德水宛在盂浮玉湧金盡斂祍詎惟摛藻供澆書一時萬幕資烹飪冉疊前韻伊遜之水苐一品其質則輕味甘甚萬古靈脈祕龍沙造物有待斯言審大禹惡旨戒在酒好茗何妨從性稟罷圍武帳值幾間聊事松雲烹石廪汲來清冽洵無雙候中文武須厯稔從獸猶然不廢吟觀魚何用無忘淰消渴兼因消芥泯象乃至泯兆朕舉杯千嶂正臨窗紫翠絢采秋光凛颯景恍可豁迎眸涼風底慮輕拂衽自怡悅亦何足云大亨還厪水火飪前白河亦名乾白河在承德府即熱河廳南境其水無源隨雨消長自莊窠峪東南流上板城之東南白河口入灤河柴河在承德府即熱河廳南境源出遵化州馬蘭關外山中東北流至柴河口會前白河老牛河源出承德府即熱河廳東境西南流徑四溝五溝六溝至下板城入灤河即古五渡水也水經注五渡水北出安樂縣丁原山南流徑其縣故城西其水入五渡塘又南流注於濡按水經注載五渡水之入濡水在武列水入濡水復今灤河自會熱河以後雖有前白河及桞河車河黃花川諸水來會然皆東流與水經注不合其南流者求惟老牛河故知即古五渡水桞河源出馬蘭關外霧靈山下東流至板谷嶺徑承德府即熱河廳南又東至桞河口境入灤河亦名流河方輿紀要流河近蜜雲牆子嶺邊外紅門川各山谷水泉皆流合焉自西南而東北厯遵化諸關口外近三臺山關北境合於灤河其水回環曲折繞渡九次名曰九道河按方輿紀要所載流河與今桞河方位相合桞流字音相近則傳寫之殊耳車河在承德府即熱河廳南境源出遵化州邉外山中東流至桞河口之南入灤河黃花川在承德府即熱河廳東南境源出遵化州邊外東流至門子哨之西黃花川口入灤河清河一名嬭兒河亦名白馬川在平泉州即八溝廳西南境滙近山澗水西南流入遷安縣界至清河口入灤河豹河亦名暴河源出平泉州即八溝廳東北四十里密雲溝黃土梁下一線蜿蜒貫穿石罅合烏勒呼瑪梁南諸山澗水始滙成川西南流合烏拉林河又西南流徑州境南合濟北格河南流徑會州城之東亦名察罕河屯又南徑寬城之東亦名寬河又西南流至氷窖之西南入遷安縣界共行一百五十餘里入灤河古髙石水也水經注髙石水東出安樂縣東山西流厯三會城南下注濡水元一統志薄河源出會州西北林津山南至冷嶺合為寬河明史地理志寬河守禦千户所東南有寬河一名豹河下流徑遷安縣西北又東合於灤河按水經注載髙石水之入濡水在濡水將入盧龍塞之前今豹河之會灤河正在潘家口外且係西流來會與水經注相合故知即古髙石水寬河之名見於元史明史方位相合元時又名薄河元一統志謂薄河源出惠州西北南至冷嶺合為寬河是也又在遼時則謂之桞河與今承德府南境之桞河各異蓋桞河之名宋人屢言之皆指今平泉州境之豹河而非府境之桞河宋史劉敞傳奉使契丹自古北口至桞河回曲殆千里敞質譯人曰自松亭趨桞河甚徑且易不數日可抵中京何為故道此考松亭故關在今喜峯口北一百二十里其東北距大寧故城三百六十里若今承德府之桞河轉在其西不應道出於此反謂之徑易王曽行程録言過烏灤河又過墨斗嶺度雲嶺芹菜嶺至桞河館過松亭嶺甚險峻若今府境之桞河在灤河之南不應先渡灤河乃至桞河知所云桞河實今豹河也遼之中京即今平泉州東北之大寧故城當日所行之道由古北口經今灤平縣承德府境至平泉州自不如由喜峯口趨松亭至桞河直抵大寧之為徑易矣若今府境之桞河即舊志所稱流河流與栁以音近而訛既稱流河為桞河而豹河所有桞河之名反引二河名同而地異且相近易淆故詳辨之托津圗河即豹河之上流在平泉州即八溝廳東北境西南流會諸小水為豹河烏拉林河原出平泉州即八溝廳北境東南流至州治之東會托津圖河濟伯格河漢名鏵子河源出平泉州即八溝廳西境東南流徑州治西之老嶂子亦名老嶂子河又東南流至州南會豹河錫爾哈河源出平泉州即八溝廳西北境南流會濟伯格河拉克拉哈爾泉源出平泉州即八溝廳境之拉克拉哈爾山東南流會豹河潵河亦作撒河源出平泉州即八溝廳西南境邊城之外東南流至龍井關入邉下流入灤河遼史地理志澤州有潵河元一統志潵河源出惠州西南乾山東流至灤陽站東合灤河按遼澤州元惠州皆屬今平泉州南境與潵河方位適合青龍河蒙古名固沁河源出平泉州即八溝廳屬喀喇沁右翼東南二百里之昌吉爾岱山南流至列山梁之南入建昌縣即塔子溝􅈦屬喀喇沁左翼西境又徑縣治之南至桃林口入邊下流入灤河元一統志青龍河源出惠州之灰嶺流經龍山縣南二百里入平灤路境按元志稱青龍河經龍山縣南屬建昌縣境湯圖河源出建昌即塔子溝廳西南境東南境流徑遷安縣邊外至石柱子會青龍河什巴爾台河漢名泥濼亦名涼水泉源出建昌縣即塔子溝廳東南境西流會青龍河以上皆入灤河之水熱河亦入灤河已専提為綱故不復附灤河下欽定熱河志卷六十九
