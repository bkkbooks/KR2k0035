body:
  text: 行宮九凌太虛千尺雪寧靜齋玉琴軒凌太虛北山之巔亭曰凌太虛拔地倚天巖巒如揖憑虛搆極皓氣清英登之飄飄然有凌雲之致下為殿五楹額曰清溪逺流聫曰赴谷逺因探放之而凖在山清可會逝者如斯並皇上御題東為含粹齋則聖祖宸翰也齋凡三楹與殿並為一區當山水勝處恭繹命齋之義所謂因詞見聖情也御製詩凌太虛亭居北嶺之復孤峯拔地羣山環拱登斯亭者如陟閬風俯懸圃禦寇泠然未足為喻冠峯亭子倚崚嶒與皓氣俱六位乘設使步兵曾到此應聞長嘯發孫登賦得清溪逺流一水帶千澗千峯罨一房自然含動靜即此示真常源溯白雲迥流歸碧海長惟應學子在不必問仙鄉賦得清溪逺流兩山成夾輔一水恰中分源逺盈科進流長不息勤雲中練影辨石處布聲聞欲鹿遵巖裔浴禽下渚濆有波皆淡沱無氣弗氤氲藉此澄心鏡居然得所欣賦得清溪逺流往歲清溪裏逺流時有無今年恆見矣夏雨或多乎未至勃衝激山水偶值雨大則衝堤激石時或有之今歲乃無蓋緣雨雖勤而弗驟却緣細澍濡淙淙鳴不絶淡淡照常輸濈竒底藉縈洄趣已殊寧惟資朗鑑亦切􅘦源圖賦得清溪逺流疊去歲韻今嵗塞中旱初來水惜無月之上浣逮自六月初四及十三十五等日連得逗雨後溪水增長每隔數日時有陳雨雨矣繼霑乎林木菁蔥遍山溪髙下濡兹臨為一豫衆壑看羣輸流則鏡斯異清仍玉不殊詞臣原扈蹕為我作新圖命董誥為圖含粹齋水復山環處秋辭冬稚初一窗欣暖日半卷閲經書含粹無過此名言實起豫會心期浴德詎為注蟲魚含粹齋盡得風流入靜觀坐來渾忘杪秋寒虞鄉草四品如較一字於斯著亦難含粹齋山靜林空秋氣清巖齋坐與白雲平花香鳥語堪探賾露潔風髙總至精畫展諸峯窗外竪琴調一水澗前橫稱文果是深於易我亦因辭見聖情含粹齋登山汗不揮為是候涼爽巖齋底須多三間含萬象颯景信純粹妙理得俯仰設無秋為斂豈鎮夏而長五言志會心兩字生企想含粹齋四德乾元亨利貞大哉一氣與流行小春即景聊觀象純粹於焉見性情含粹齋辛巳齋倚西山得隂早門臨北澗對泉清固欣秋熱宜農計却逐風涼暢塞情鹿始分羣試聲懶鵲猶引子學飛生仰觀俯察皆羲象含粹從窺注易精含粹齋壬午三間書舍敞林扉天藻標題義入微問景詎寧欣若繢甄心益覺慎惟幾靜専動直都包括內聖外王時發揮擬欲間吟概從省羲經獨此究編章題含粹齋癸未近西得隂早信步為乘涼遂造三間屋坐來九夏長堪因玩周孔那擬傲羲皇乳燕新雛引風前自頡頏含粹齋乙酉旁通六爻情而無六爻迹山峙與川流由來自開闢孟秋忽仲秋代謝成今昔飛潛及動植其中各適適是謂純粹精萬物演羲畫天文示精詮奚藉田何易含粹齋丙戌山純粹復水純粹如是峙兮如是流恰稱去聲書齋觀玩象當前妙趣契羲周含粹齋丁亥門外清溪溪外山溪聲山色共秋間自然純粹而精趣合把羲經讀此間含粹齋癸巳緑水青山動盡詮乾坤易蕳總包全深于易者不言易題額從窺聖學淵含粹齋甲午愈下愈就平書齋得于此對户亦有山繞階亦有水斯誠兩美兼可弗片時止楣額昔年留純粹而精矣安得息萬緣居此窮易理含粹齋乙未落斜坦平谷齋額聖章懸至訓明垂後殷懷益仰前不敢私意雜乃得道心全親切無多子兩言曰體乾含粹齋己亥逺流恆此帶清溪是處巖室名清溪逺流齋其别舍也巖室南頭别舍棲曰水曰山皆道管惟純惟粹合天倪逢源左右垂雲藻仰慕髙堅朂日躋安得他年真謝政於斯讀易靜探稽含粹齋辛丑溪畔繚山垣過溪遂入門文言取乾象聖意示書軒納景既無雜淑身識有源老來深契此底事又辭繁含粹齋壬寅奎文兩字耀千春善易不言易實真試看山清與水秀誰何不是粹而純千尺雪寒山千尺雪以瀑得名翠華南幸因於西苑田盤各肖其景山莊玉琴軒之東數十武懸流噴薄搆殿五楹亦懸茲額瀑源來自雲根捲沫跳波寒光四射若六花飛舞晴空也塞候髙涼雲峰峭拔於瀑尤宜雖名仍吳下而實則逺過之矣御製詩千尺雪歌辛未吳中寒山千尺雪自趙宦光疏剔之後膾炙人口久矣然未免藉人工山莊之內有溪如建瓴置屋其側泠然灑然噴薄之聲隱巖階泛瀲之光翻月戶蓋塞地無𤱔平因其勢而導之吸川濺沫之勢有不必以千尺計者獨喜其名因以名軒非云慕藺聊志因王問雪有聲聲亦有矮屋疏籬篩風後無過騷屑送寒音那似淋浪喧戶牖何來晴晝飛玉花玉花中有聲交加人間絲竹比不得似鼓雲和之瑟湘靈家雪落千尺亦其素乃中去聲宮商勝韶頀導之則來詎巧營即之則虛堪靜悟跳波噴沫粉潺湲赴􅊤一㵼無復還借問盈科放溟海奚如止坎渟蒼灣疊石開軒致瀟灑雪色簷端雪聲下秋水之中有六鼇豈必學彼任公釣竿把陡憶春月臨勾吳寒山疏剔傳凡夫趙宦光號凡夫聽雪信美未可云久駐今來不假人力而得突過之仙區於焉棄虎跑之石泉却惠山之竹罏謝南國之虛聲守北地之故吾清風明月蒼山碧湖雖曠古而無聞欣始遇之逈殊千尺雪歌疊舊作韻壬申凛秋無雪雪乃有宜在玉塞崇山山之後層隂積氷彼其常夫何近帶山莊映軒牖奔崖飲澗噴瓊花匉訇磕砉衆響紛交加八音六律此繁會似過摯干繚缺方武陽襄家君不見繪事後於素又不見土鼓先雲頀我非子也在川上乃亦因心愜清悟渟漴漩澓潺且湲鴐鵝麕鹿往復還試看一放勢莫禦其始涓涓滴滴渟滀山之灣導流曲折階前灑雪色雪聲交上下去年種樹初點綴今來翠幹已盈把北何鳫磧南何吳一家中外咫尺夫取名聊爾寄清賞豈知清賞原在神仙區便教溪側安茗罏緑杯香雪書澆吾秋雲在天水在湖興於雲水了不殊千尺雪歌再疉舊韻癸酉物無姸媸貴已有譬之雞口與牛後趙家寒山雖鼻祖豈似奔川帶我牖落葉雨如散天花八功德水無更加湱然淨練挂千尺披圖倣佛荆關家千林一色皆凝素雪耶聲胡作英頀聞觀寂復似無聲妙覺都來歸靜悟時為渟注時潺湲對我邇年幾往還如斯逝者曾不改依然沙渚縈雲灣枕流靜室瀟而灑影漾蜃窗光上下清機颯景湊秋深興恰當吟篇把宗蒼吳人還寫吳盤山吾亦規摹夫春卿點筆繪西苑學士實則圗斯區去年逰盤山自為千尺雪圖而以寒山屬宗蒼西苑屬董邦達熱河則命錢維城各為一圖四卷合裝分貯之四卷匣庋伴竹爐一覽備􅊖事創吾風在林端月在湖取之無盡何同殊千尺雪甲戌吳中寒山千尺雪明處士趙宧光所標目也南巡過之愛其清絶因於近地有泉有石若西苑盤山及此並倣其意而命以斯名且為四圗合貯其地詳具圗卷中為愛寒山瀑布泉引流疊石儼神傳楞嚴驀地臨溪寫離即憑參屬偶然千尺雪三首乙亥引流疊石落飛泉千尺窗前雪色懸漫擬春明稱轉㪺所欣結搆借天然淙淙曲注結輕氷瓷碗筠罏此恰應怪底茶煙寒不起逺山微削玉崚嶒弆藏四卷各傳神山莊及西苑田盤寒山均有千尺雪各寫為圗合貯笥中每至一處四卷皆備同異頻參總靜因分付寒山聽雪閣臨流搜句待明春將以明春南巡千尺雪疊去嵗韻丙子如聼雨彂言泉對似披圖訝雪懸摩詰小幀右軍帖一時默會景依然軒窗清似玉壷冰偶睱憑臨詎未應常住此中合誰是翻饒窗外碧崚嶒去年吳下已馳神欲攬寒山續舊因却為長官勤賑務南巡還命罷今春亥秋題卷有分付寒山聼雪閣流臨搜句待明春之句尋以江省秋歉罷南巡之命頃乃命於丑春舉行千尺雪題句丁丑湣湣淑淑復湝湝逺帶雲林近繞階松竹有聲三友别陶匏不奏八音諧秋風秋月常如是江北江南底各儕小異支硎千尺者襄陽抱宿託髙懷皮日休有抱宿支硎雪之句千尺雪戊寅地真塞北無雙地泉不江南第幾泉太古林嵐人鮮識付他秋月與春煙疊石疏流落澗鳴滙為汀沼泄然清若從雲外來源計千尺稱猶太屈生題千尺雪己卯底誇薊北更吳中塞苑為家西苑同四卷畫圖一時賞無過佳話付秋風雲外來源遙且迥概之千尺例諸方侶魚蝦復友麋鹿須識此間是所長千尺雪庚辰鹿期催向去雪色待今來即看清如爾寧當虛擲哉帶林寒皎皎落澗素皚皚却是輸真者蘭中早漉杯木蘭中遇雪已收水烹茶故云千尺雪辛巳塞中沙水曲千灣過雨渾流落下潺便使六霙真箇對的應今日是嵰山筠爐瓷碗伴幽嘉緑水浮香便試茶雖是習勞毖武地奚妨清供學山家湱然鏗爾復純如千斛塵蠲水石居西苑盤山將惠麓異同同異漫分疏再題千尺雪辛巳窗納平林野意賖山之曲復水之涯煙舟便可從兹放欲訪還應是戴家千尺雪歌三疊舊韻辛巳辛未之秋此創有題名為幸寒山後壬申癸酉一再疊皆早揮毫勒户牖此來辛復一周花迅哉駒影真無加其間七嵗闕疊韻非不嵗嵗來此如居家葛沙日逐抒誠素食黮懷音響咸濩軍書旁午費運籌那得餘間領清悟武成事共逝水湲豫有干城奏凱還行秋習獮止常例乃得乘暇掞藻崖之灣崖之灣雪灑灑光翻上響徹下始如處女後脫􅊵急不可捉曰緩安能把明春行復當臨吳聽雪小閣依然夫四圗具美自佳話微嫌芥猶分區文章大塊真錘爐今來昔往咄咄徒云吾􅡶􅡶振鷺落野湖曽不知過去未來現在勞逸同與殊千尺雪得句壬午源水千峯外秋齋萬樹間賞心惟表物得句乃幾間尺寸何須計北南豈浪扳挾沙緣過雨訝是對嵰山千尺雪癸未引流曲注落巖端素色清聲欲狀難名借吳中千尺雪便教九夏意生寒隔嵗居然又到斯緑窗白水坐移時四圖各卷非同異春仲田盤早見之千尺雪凡有四各為圗四卷分置四處千尺雪甲申午炎火迫塞田黃都喜今年秋信長設使朅來千尺雪定知飽沃洗心涼顧渚烹泉成例事越甌犀液早擎來尚茶不誤斯為喜火候安知文武哉寒山鼻祖塞山同猶憶吳人體物工若以來源雲外計便教倍萬也難窮千尺雪乙酉活水寧須蜀兩孫濺崖倒看六花掀遙源雲外知何處少計猶將千尺論秋月春風總覺宜憑欄朅爾引清思寒山聽雪閣之上不異臨流得句時千尺雪丙戌有塵難到雲深處無雪不飛石罅間却訝未曽渡揚子當秋每此對寒山不嫌落瀑雪微絳乍喜遙源雨較優塞山經雨漲水驟至每挾沙而流色如絳雪四卷畫圖一合相便因結習閲從頭坐來茗碗剛擎到熟火沸湯備早間憐彼尚茶忙已甚肯教消受片時間千尺雪二首丁亥就濕由來水性常成渠利導豈竒方雪其白色髙千尺今日那知亦有黃雨餘野潦挾沙泥下注流成澱澱溪却以名同引興逸遄飛直到范園西千尺雪為吳中范氏山圍自辛未逰後西苑盤山及此地皆引泉肖境為之再題千尺雪前來新雨後渾流殊不潔今來過白露潦盡寒潭徹繽紛間去聲湱嵗真是有聲雪滄浪清濁喻遂有纓足别而泉豈自知由人騰口説千尺雪戊子幾日逰山已暢情今朝觀水目尤清因之悟得宣尼旨曰知曰仁實並行聼如響磬看彎環坐石憑消片刻間濾滌固應無結習那更數典憶寒山落澗飛流凡幾層赴溪無事祗空澄摐摐聲色非聲色拈出如來最上乘千尺雪己丑雨過渾流落灣灣濺崖自潺湲漫疑雪色無相似了識嵰山即此間詎止遙源千尺長迸翻石髓浴苓香邇來餘暑頗稱劇對此不期滿意涼千尺雪庚寅態是氷花意是涼人間無物可相方因名雪耳因還笑玉尺阿誰解去量野灘潦盡挾沙無盛夏新秋瀑總殊真是雪從巖際落指看今善副名乎千尺雪辛卯引釃由來一水源髙低景各占芳園因而有悟為文法氣以行之緒是言㵝㵝溶溶繞碧潯誰云滕六弗知音設如數典寒山畔祗擬遙思不擬臨千尺雪壬辰亦在山邊亦水邊山容水態總天全訝當六月何來雪挹悟飛泉解與然四處名區一額顔愛吳中寒山千尺雪之勝于西苑盤山及此並仿各景復各為圗四每處合弆之不忘數典自寒山獨憐玉塞天開境説與南人疑信間千尺雪二首癸巳擘峽飛流赴野塘寒山縮地置山莊坐來底識千尺雪披處偏欣六月涼颯颯為聲朗朗色噴花六出更何疑乘間四疊長歌韻心慕東坡偶效之千尺雪歌四疊舊韻千尺雪歌四章有辛未創前辛巳後其間已歷整十年各寫銀箋粘壁牖流隂瞥眼迅空花逮今又復一紀加長篇畏難弗再和豈不貽笑眉山蘇氏家言志永言喜所素寧論下里及大頀臨流坐石試摛毫冷色寒聲皆可悟迸珠落澗㵼湲湲觸磯到峽漩澓還誰知入畫江南境都作宜詩塞上灣大如席六月灑豈徒言看上下却嗤太白詠燕山虛擬何如實吟把即景遣睱非憶吳蒼岩應付趙凡夫趙凡夫與李太白幾曽至此真仙區錘峰萬古鼓洪爐那復數彼山稱吾吾家山在鄧尉西北距寒山不遠今塞苑山川自成真境何必更數吳中赴川溶溶為塞湖四疊興殊韻不殊千尺雪甲午夏令非冬莭奚來滕六乎落崖珠點噴赴壑玉花鋪揣色清無比侔聲靜以輸田盤暮春對盤山千尺雪較此各有所長今嵗三月初駐彼曽一再題詠于此定何殊千尺雪二首乙未軒榭經營歷有年龍鱗松巳鬱庭前源頭近搆文津閣因貯四庫全書建文津閣以待之閣在此北據上源也益契選家賦兩篇謂文選陸機文賦謝惠連雪賦颯颯皚皚飛灑間清涼坐遣片時間偶因六月六花對頓繾遙情到雪山畨地雪山盛夏猶積雪金川適當其地今王師進𠞰將逼巢盼望紅旗即至宵旰縈懷雖逰覽所及不禁願名繾念耳千尺雪二首丙申雨過溪流漲野灘噴珠峽口落飛湍坐來未可默然置欲去陳言戛戛難憑流耐可小徜徉幸罷軍書頻問忙戰將歸來談玉壘此時落雪正尋常千尺雪己亥雄聲涼色互交加石縫雲端欹復斜前日塞山初過雨落來絳雪自仙家一處弆藏四處圗西苑盤山及此俱仿吳中千尺雪各為一圗圖凡四卷分貯四處每至一處展卷則彼三處俱如在目前也展看何異遍逰娛寒山明嵗試數典端覺難分同與殊千尺雪庚子從天所落水曰惟雨雪二自地所出水曰瀆有其四歸宗於大海總因泉湧致北壑與南江田盤西苑暨四各以泉勝均假雪名字然泉時或弱則以不雨匱一雨無不佳兹攬雪如意雪實雨所為用闡天一義千尺雪二首辛丑天髙塞逺是源頭千尺小哉論短修南北去年吟雪意一時分付與東流砏磤澎汃落深潭聲色摐摐正好參漫議每年來著句忘言誰得似雲嵐千尺雪二絶句壬寅初來望雨懶吟詩既雨斯來又一時落漲挾沙頓改色薛昭絳雪略同之卜築山邊復水邊臨流摘句亦多年拈鬚已是古稀者耳裏清音不異前寧靜齋千尺雪之後依山搆齋皇上御題額曰寧靜後樓恭懸聖祖御筆曰清敞淡泊寧靜語本諸葛而即景寫心契山水知仁之樂託諸詠歌形於毫素一皆聖學精微觸境會心者矣御製詩寧靜齋甲戌諸葛孔明淡泊寧靜二語千古名言皇祖所至若御園之淡寧居山莊之淡泊敬誠皆取其義兹以名齋匪惟慕賢實以述祖既深始靜心堪會致逺而寧道亦該妙契神詮參不盡武侯豈獨幹時材寧靜齋己卯窗入萬螺青階臨一鏡渟心倪恭有象道籥契無形水動山惟靜天清地亦寧武侯示微旨可以注羲經寧靜齋庚辰間庭樹葉落歸根一坐明窗日晏溫即景不須翻蜀志武侯兩字箇中存寧靜齋辛巳青山本是常寧體緑水原來至靜心著箇間齋山水窟神寧氣靜得資深寧靜齋壬午窗含水白與山青無色聲天妙淨形雖是每來愛摛藻靜中得句意常寧寧靜齋癸未石上水流動皆靜雲間山出幻而寧孔明借會逺堪致禹錫休稱德以馨題寧靜齋甲申山以靜為德復以寧為體書齋倚碧山稱去聲名固其理庭餘緑樹圍砌有秋花美金風玉露間致逺惟清綺稱平聲孔殊近哉寧靜以致逺孔明之語也坐可觀無始寧靜齋乙酉寧靜我所喜詎惟一室然萬民逢稔嵗四海靖烽煙願則常如是艱哉豈盡全以斯慎宵旰致逺總無緣寧靜齋丙戌搆齋山水窟山寧水復靜壘嶵標秀姿溶㵝含清影啓沃良已深徘徊亦為永因知人世間自有神仙境何必求蓬萊逺涉風濤猛寧靜齋丁亥青山逺映水前墀水靜山寧啓沃思自合忘言契神管掞箋摛藻又奚為寧靜齋戊子寧為靜之效靜乃寧之本水縈山邏間得此書齋宛境清神自謐那更期致逺是宜居畸人樂飢恣肥遁而我憂勞者豈能鎮息偃偶然寄意可諒不為大損寧靜齋己丑右倚崇山左帶溪山寧溪靜示端倪設因題額言吾志速定朱波奠逺黎寧靜齋甲午魯論幼曽讀弗忘山水樂藝齋山水間清冷帶蒨峭不息性寧深恆峙體靜奧適合武侯言原從吾所好設更譬致逺捷望金川報寧靜齋口號丙申邇嵗有征事吐蕃旰宵籌筆不辭煩受俘宴凱行而至寧靜真知是此畨寧靜齋壬寅山以靜為體夏因長故寧小年于此度陋室似其銘適矣觀物理慚哉何德馨非關武侯緬致逺亦當停用戒得堂記意玉琴軒與寧靜齋並峙為玉琴軒皇上御書額殿面南額曰圗史自娛聫曰寓情最覺靜可樂玩物始知間不爭並聖祖御題軒當潨流激湍間觸石琮琤清越相應何必絲與竹山水有清音蓋玉言色琴言聲也伯牙雅調志在髙山流水間矣御製詩玉琴軒甲戌千尺雪之南曲澗湍流潺潺衆玉中韻合宮徵正不必撫絃動操已令子期神往玉自無言比桃李水因不競中宮商五絃正是薰風莭治慕虞廷化日長玉琴軒丁丑神瀵注陂陀左右環交屬朴斫恰搆兹階下釃紆曲不盈亦不竭非笙復非築揣稱號文琴酌聲擬哀玉造物自成連移情在澄穆題玉琴軒庚辰細泉階下注氷渠今日絲桐訝澀踈漫道寂寥艱著句小春景概故逢初玉琴軒辛巳一水階前環碧漻泠泠常作七絃調雅豫入耳會心處不在徵招在角招玉琴軒壬午前浚繞流泉泠泠潺且漩無絃並姑含不鼓鎮鏗然秋氣澄見底月光印正圓水仙乘赤鯉深夜此周旋玉琴軒癸未雲館山之裔更臨水之涯引流繞階前活活復湝湝是中八音具繹如和且佳玉琴雅可方筝琶非所諧即景於何當南風企遙懷玉琴軒甲申水曲復山深文軒號玉琴非桐曽出㸑是璞定藏琳魚泳宛知樂禽鳴每和去聲音奚愁聲剌萬古響秋金玉琴軒乙酉是地易為水導來亦藉渠音成絃引軫坐喜玉循除汩㶁浮花片布沈受露湑流杯亭在即觴詠却拋如玉琴軒丙戌循除淙鳴泉比琴琴曰玉而泉豈知然安名人與屬因思百年上野流沙渚曲絶無人迹尋祗有鷗朋浴亦一自在耳羶薌寧所欲玉琴軒丁亥前後繞石渠流泉相激迸此聲彼則振宛是宮商應乘暇斯偶坐湱然入清聽諸慮於焉澄藉因知水性明道言可方動定靜亦定玉琴軒戊子曲注繞書軒有聲靜不喧是惟七絃似自具八音存何必四山響未忘五字言昨年憑坐興已共逝波翻戲題玉琴軒己丑繞階饒緑水入户逺紅塵有調皆成古不彈乃是真今來昔往閲新句舊題鄰自笑辭多矣得無為躁人玉琴軒庚寅階下有鳴琴聽為哀玉音幻哉更喻幻吟矣豈妨吟原是現前水欲忘過去心流泉付不識如是注溪潯玉琴軒辛卯底知最佳處山抱水環深擇勝築雲館揣稱名玉琴幾曽慮剌琴不善謂之剌恆是俯跳平聲沈比似淵明器無絃却有音題玉琴軒壬辰漸辭谷口漸溪邉遂造溪軒一聽泉謝彼指工攫揮法起豫心在徵招絃松風却暑泠泠者月露知音淡淡然惟是薰披仰我舜寧須海泛悟其連玉琴軒癸巳樂山既彼數入聲樂水合斯兼近物取堪喻小絃亮且簾暗音繞階砌明影漾楣簷正是薰風候重華企仰瞻玉琴軒甲午引水愛其清取名喜以譬無須蔡桐斫却訝陶絃置泠泠幾曲間朗朗五音備因思復古戴句淺言具深義聆聲既清越睇色復純粹操縵素未學不可無斯致玉琴軒乙未長風落虛谷繞砌足流泉既可坐延爽還因悟在川無聲不入律有色總捐妍設以焦桐喻吾惟愛大絃玉琴軒丙申引水藉地勢成軒不日中每來昔有詠愛此興無窮但聽咽危石寧誇識㸑桐如云五絃撫慙愧是薰風玉琴軒作歌玉琴軒文津閣軒前本舊有閣後實新作一水為之帶萬石為之壑閣未成時每到軒即今閣恆有詠軒乃數載闕句著厭舊喜新我尚然如是世情儘堪度兹來一聆玉琴音太古之曲不藉人醳攫成連伯牙其後輩空向絲桐勞模索玉琴軒壬寅山中冨流泉隨處皆可引激石必成聲聲如調玉軫太古即有斯律呂鳴無盡雷氏造詎然鍾子知豈允設擬五絃揮解阜以為凖欽定熱河志卷三十三
