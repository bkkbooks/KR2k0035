  - {type: page-break, offset: 0, content: '', id: KR2k0035_WYG_083-1a, image: WYG0496/WYG0496-0331a.png}
body:
  text: 文秩熱河自秦漢以來越在外徼諸部錯居未有官守之設也元魏建安營二州分置守令唐時有營州都督府不過僑治於內地遼金及元始全有其境官制之見於史志者綦詳明初𨽻北平布政司僅屬遙領未幾即棄於三衛無復有王官矣我國家光宅區夏薄海內外咸𨽻版圖而熱河尤密邇畿輔置道分廳吏治賅備近復改設府州縣規制與內地等守土之臣嵗奉時巡親承訓示整飭紀綱勤宣厥職下逮庶司奔走匪懈故兆民登祍席之安而衆務收臂指之效法立政成犁然盡善謹次先後建置之由志文秩第十四承德府即熱河廳分巡熱河等處地方兵備道一貟乾隆五年設轄承德府并所屬一州五縣兼轄武辨駐承德府知府一員先是雍正元年於熱河等處設理事同知一員掌旗民事務十一年設承德州以知州専理民務以同知専理旗務遇有旗民交關之事則彼此會同辦理乾隆七年裁承德州知州即以熱河同知移駐州署仍統理旗民四十三年改為承德府知府其喀喇河屯廳改為灤平縣四旗廳改為豐寧縣八溝廳改為平泉州塔子溝廳改為建昌縣烏蘭哈逹廳改為赤峰縣三座塔廳改為朝陽縣俱𨽻府治教授一員先是乾隆四十二年設熱河道學教授四十三年改承德府學教授經歷一員先是乾隆七年設熱河巡檢一員専管道廳監獄及熱河之左哨右哨中關等汛巡緝事冝四十三年改為承德府經歷仍攝巡檢兼管司獄事張三營巡檢一員乾隆七年設管理唐三營茅溝石片子等汛巡緝事冝灤平縣即喀喇河屯廳理事通判管知縣事一員先是乾隆七年設喀喇河屯廳理事通判一員管旗民事務四十三年改為灤平縣仍以通判管知縣事屬承德府巡檢兼管典史事一員乾隆七年設管理監獄及喀喇河屯馬圈子司馬臺潮河川等汛巡緝事宜四十三年兼管灤平縣典史事鞍匠屯巡檢一員乾隆元年以西河司巡檢移駐管理鞍匠屯卯正喇嘛洞大店子虎什哈等汛巡緝事宜屬承德州七年裁州改屬喀喇河屯廳今屬灤平縣豐寧縣即四旗廳理事通判管知縣事一員先是雍正十三年以東河通判移駐於四旗適中土城子地方管理蒙古鑲黃正白鑲白正藍四旗命盜事件四十三年改為豐寧縣仍以通判管知縣事屬承德府土城子巡檢兼管典史事一員乾隆元年設巡緝鑲白旗土城子地方及管四旗廳監獄事宜四十三年兼管豐寧縣典史事黃姑屯巡檢一員乾隆元年設巡緝正藍旗黃姑屯地方郭家屯巡檢一員乾隆元年設巡緝正白旗郭家屯地方大閣兒巡檢一員乾隆元年設巡緝鑲黃旗大閣兒地方平泉州即八溝廳理事同知管知州事一員先是雍正十年設八溝廳理事同知一員與管理藩院章京分管喀喇沁蒙古民人緝捕盜賊等事以八溝東街之鋼義帽烏勒瑚瑪梁南嶺等處地方𨽻之十三年東河通判移駐土城子其所轄八溝西街之雅圖溝龍鬚門等汛併歸廳治凡旗民命盜錢榖専歸八溝同知管轄四十三年改為平泉州仍以同知管知州事屬承德府巡檢兼管吏目事一員雍正十年設乾隆四十三年兼管平泉州吏目事赤峰縣即烏蘭哈逹廳理事通判管知縣事一員乾隆三十九年析八溝廳北境置烏蘭哈逹廳設理事通判一員四十三年改為赤峰縣仍以通判管知縣事屬承德府巡檢兼管典史事一員乾隆二十年設𨽻八溝廳同知三十九年改𨽻烏蘭哈逹廳通判四十三年兼管赤峰縣典史事建昌縣即塔子溝廳理事通判管知縣事一員先是乾隆四年設塔子溝廳理事通判一員管理喀喇沁貝勒扎薩克塔布囊兩旗蒙古民人事件十三年令兼轄土默特兩旗事務十七年復以奈曼一旗𨽻之四十三年改為建昌縣仍以通判管知縣事屬承德府巡檢兼管典史事一員乾隆五年設四十三年兼管建昌縣典史事朝陽縣即三座塔廳理事通判管知縣事一員乾隆三十九年析塔子溝廳東境置三座塔廳設理事通判一員四十三年改為朝陽縣仍以通判管知縣事屬承德府巡檢兼管典史事一員乾隆十六年設𨽻塔子溝廳通判三十九年改𨽻三座塔廳通判四十三年兼管朝陽縣典史事理藩院差員管理平泉州即八溝廳地方蒙古民人事務兼理稅務司官一員乾隆十七年設管理赤峰縣即烏蘭哈逹廳地方蒙古民人事務兼理稅務司官一員乾隆十三年設管理朝陽縣即三座塔廳地方蒙古民人事務兼理稅務司官一員乾隆十三年設協理建昌縣即塔子溝廳地方稅務筆帖式一員乾隆十八年設謹按熱河創建府州縣為畿輔上郡自道府以及庶司以次臚列至前代官制廣稽史書所戴凡𨽻兹土者附録於左以備舊聞北魏州二安州營州天賜二年制諸州置三刺史宗室一人異姓二人太和二十三年制上州刺史第三品中州刺史從第三品下州刺史第四品安州郡一廣陽營州郡一昌黎天賜二年制郡置三太守太和二十三年制上郡太守第四品中郡太守第五品下郡太守第六品廣陽郡縣三廣興燕樂方城昌黎郡縣三龍城廣興定荒天賜二年制縣置三令長太和二十三年制上縣令第六品中縣令第七品下縣令第八品北齊縣一龍城齊制上上縣令屬官有丞中正光迎功曹光迎主簿功曹主簿録事及西曹户曹金曹租曹兵曹等掾市長等員合屬官佐史五十四人上中縣減上上縣五人上下縣減上中縣五人中上縣減上下縣六人中中縣減中上縣五人中下縣減中中縣一人下上縣減中下縣一人下中縣減下上縣一人下下縣減下中縣一人隋郡一遼西縣一柳城隋制郡置太守丞尉正光迎功曹光迎主簿縣正功曹主簿西曹金户兵法士等曹市長等員併佐史合一百四十六人縣置令丞尉正光迎功曹光迎主簿西曹金户兵法士等曹佐及市長等員合九十九人遼中京宰相府左相右相左平章政事右平章政事中京度