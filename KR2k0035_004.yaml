body:
  text: 欽定四庫全書欽定熱河志卷四天章四御製詩雨癸酉秋暖蒸為雨霏空勢渺茫盡湔婪尾熱忽送打頭涼圃老欣畦潤征夫怨路長人情評度處難得兩全方雨臨秋清暇好作雨塞山靈著樹湔紅緑霏空幻色形適當停蹕際便可倚窗聽兩兩沙禽度衝煙落逺汀八月草三日作恨以終身志推遷倐復臨有懷雲日杳無那嵗時深默處山莊寂間聽簷雨斟重欽瞻顧命益凛繼繩心駐蹕細雨朝仍灑宣傳清蹕留亦因戀佳境何必急鳴騶卓午旋開霽乘涼暢盛遊山靈真解事著我恣吟秋尋題尋題得句旋移境乘興為書不擇箋若問山莊殊勝處逢源左右總超然霜氣寒邉塞外白露早為霜萬里晴連漢十分曉變涼山田收刈罷蔀屋墐熏忙物候親經慣關中正不妨即事山村到處慶逢年民事咨諏緩著鞭詰曲籬邉聞犬吠髙低樹裏起炊煙雲裏髙峰雨不知漲添千澗只移時輕煙片刻全開霽碧宇晶陽幻太竒千峰紫翠畫屏迎不定尋常隂與晴截水愛看橫蟹斷隔林時聽􅕫駝聲早征早征早蒞止庶事暇有餘蹉跎或宴行奔迫將何如可通為學方及時戒趑趄所以古之人孜孜惜居諸老大嗟何及慎哉君子儒題董邦逹秋山煙靄小卷為便行囊作袖珍秋山浮靄霽光新展當氊室千峰入著語難分畫與真即事崇邱倚杵玉繩低開錦風前百鳥啼山體靜存雲幻動馬頭東向霧迷西溶溶淡帶晨蟾影􅜓􅜓幽尋野鹿蹊詎為盤逰恣從獸詰戒深意此中稽重陽九日惟今日登髙此最髙天空秋益肅峯逈興偏豪擷秀寒於菊割鮮腴勝糕景光隨處賞賡咏有仙曹即事塞宇雲生欲變寒征裘逐日換歸鞍築場納稼逢迎好農務民艱取次看過嶺東西兩流水映溪上下一停巒山田頗有豐年慶祗恐茅簷尚怨歎雨行程指兩月為日亦不少長此竟無雨麥收安期飽或夜雨朝晴否則駐蹕好人有不能從何况於天道知然胡戚戚慮衆行泥潦習勞率藉茲自解聊紓抱紓抱焉能紓遙遙憶淮徐秋霪實異常河徙奪洪湖嗟嗟昏墊民漂搖棲沮洳所希霖潦減或可事歌瓠此憂無解方南望以齎吁雉朝飛甲戍通閏候遲矧塞寒仲夏雉朝飛塞山據岡雊侣輝藻翰氣滿不惜繡頸斷叶失者索莫得者間揚翼決起青雲間楚國路人或欺為鳳賜金十倍憐其意重如是郭隗得亦何用夜雨朝晴夜雨宜農務朝晴利旅行兩全實艱致竟夕比秋清澗漲東西水亭開長短程山莊至指日喜氣早逢迎雜詩時雨復時晴山田如助長塞外秋常豐今來悉其象百人抗浮勞一人挈而往得要為力易勇夫出重賞祈農厪恆心籌逺運今想誰為無事人况我人所仰山雲山雲易雨易為晴恰似隨人意止行暄潤利農真復慰越因慰後凛持盈絶句稚松喬桞下屈抑不得長其咎在圃師樹人因可想遊山雜詠赫曦方報夏颯籟頓含涼避暑真仙境逰山趁夕陽青雲赩赤霞背影看翻鴉生色王維畫誰鋪魚網麻希革鹿未肥漫試射生手忘機亦近人寧獨鷗堪友巖花錯野繡可嗅不可象黃蝶栩雙雙量來大於掌迷離蔚榛煙瀲灔霏蘿露蹀躞珠勤馬徑往風涼處伏日名稱避暑莊而無暑可避三庚熾藴熇不到清涼地林深山益幽木喬隂乃邃仰眺浮雲鶱暢披􅐩籟至乃悟境隨心心靜熱安寄祈農志略慰柔逺禮粗備偶間聊可乘小年詎宜棄藝編足古歡鈿几研精義喜晴塞雨易為晴昨夜雨達曙黃梅正此時何妨霈甘澍北地莭令遲麥秋方刈穫叶久霖懼黴變以此生憂慮不至關山外焉知風土殊叶率土皆我民到處厪農務棼絲向曉稀翔陽傍午露徂雲忽割開繁懷逐雲去熱避暑翻欣暑山田熱乃宜寧惟圖已豫常此驗農期莭候隨人轉民艱到處思炎歊雖覺酷風過有涼時夕陽東峰絢曜西峰暝低樹蒼蒼髙樹明空雲忽染綘綺色獨愛光翻鴉背翎雨潤既優日暄好農應西成登萬寶誰謂射生孶牧疆都識較晴量兩道百嵗休和事不易因之益凛持盈意後樂低似先憂多暫時寄興摛詞慰荷露烹茶平湖幾里風香荷荷花葉上露珠多瓶罍收取供著茗山莊韻事真無過惠山竹罏倣易得山僧但識寒泉脈泉生于地露生天霄壤寧堪較功德冬有雪水夏露珠取之不盡仙漿腴越甌吳莢聊澆書匪慕煉玉燒丹罏金莖漢武何為乎習字間日視閣章凡臨幸內閣奏本每間二日一至其機要重務不在此例山莊有清暇有暇亦何為讀書及習射書亦六藝一自古重墨稼棐几鋪玉版嘉隂就松架繕性歸平易變體祛竒詫舉首瞻奎文當年此消夏日影浮隂每蔽日今日乃豁朗塞天益寥落千里浩莽蒼庭樹弄其影靄靄沿階上花蝶粉翅翩榛蟈凄聲響何當中伏莭忽作新秋象老大誰所為如駛催時往去何於其中欣來不懷曩禹惜良有以陶言兼可想新月將為載月遊蛾眉便延頸雖遲滿輪光已作宜人景星榆誰則覩塞樹佳莫並露坐不知寒目共踰西嶺喜晴兩日晴訖利塞田昨宵雨又逹晨連徂雲過午收殘腳一片斜陽墮馬前塞雲雨易晴還易幻景斯須莫可形信步乘涼登極頂四鄰山色一時青到處籌農較雨晴封章近每喜音呈飾詞諒不頻來瀆祗慮吾心或滿盈山城夏霽歌題錢維城畫赤夏賴雨亦賴晴潤之烜之禾怒生老農較量誠不易幾多辛苦方西成是時山莊駐翠旌甘霖早澍溝渠盈解作既息暑亦滌鵲呼正報開初晴片雲歸岫弱無力涼風吹樹壯有聲黍髙粱下盡滋渥油油葉瀲炎曦明延樓埤堄曰綺望登臨縱目堪怡情餘事萬概都恰當一喜所遇皆欣迎層峰沓障濯新翠煙坑石谷淙繁鳴深林露墜茅屋濕野水漲到扁舟輕何來塞景肖江國謝公佳句真豪清侍臣扈蹕圖所見宛然夏霽呈山城髙張白壁拂􅐩氣巖間輝映新陽晶題張宗蒼雪景略彴縈紆俯凍灘遙峰天際玉巑岏誰知自寫江南意雅合髙張塞北看閲本三日一閲閣部章一日幾務三日當寧毋喜逸怠於忙否或忙裏失精詳能言行則敢弗蘉綴辭用針勵自強邇來逺近時雨暘西成顒望萬寶穰去嵗災重厪淮揚麥收幸得米價平叶祗聞山水發閩漳室廬則壞稼未妨命亟撫恤令獲康詎云視民能如傷要惟斯志恆不忘習射佳山佳水漫遊娛習射相將校壯模詎可太平耽燕鴆從來男子事桑弧心平體直爭何害志定功成語不誣猶憶髫齡兹扈蹕樹侯連中被恩殊爽雲散寥天逈風來大野長多人欣却暑萬寶慶宜㿩耐可紗衣試何妨紈扇藏不須秋意至此地本清涼荔枝閩中嘉實到秋前朱顆纍纍湛露鮮塞北氷盤供夏清定知解暑更延年廣博誰能窮蔡譜品題都識數陳家連樹擎來青石嶺却疑兩度過仙霞赤珠囊綴翠瓊株方物何須辭不須一騎紅塵味仍敗始知記載率多誣題張宗蒼畫驛便擕來山水圖滿林濕潤尚糢糊本來合是巖齋挂簾外嵐光了不殊立秋日作無暑謂當秋不覺誰知秋信益分明昨朝婪熱蒸為雨今日新涼迫放晴何必碧桐方識節桐性畏寒塞外獨無由來皓日已懸清山田迎望西成近層閣慿臨一暢情張宗蒼竹亭觀瀑踈篠喬柯匝檻前飛流百文落平川昨來湧翠巖前况山莊觀瀑處石壁鐫湧翠巖三字點筆居然得我先擬古詩三十首有序擬古之作蓋於選辭命意之中寓論世知人之旨曩於幾暇擬古詩十九首復倣江文通雜擬每一染翰如見古人於毫楮間今年夏山莊永晝瀏覽篇籍念自西京迄於六代才人林立緣情之什各具性靈丈選所甄菁英斯備諷詠之次輒思摹效而衆體殊塗興懷異趣名家麗製美不勝掇因仿文通例各取其一聊見舉偶至四言則漢魏僅涉餘波自必溯源風雅七言數章椎輪太質欲暢斯旨又當馳騁三唐其他單章偶見如紹統泰機輩本未成家概從刪汰别體若束晳補亡應璩百一鮑照數詩往嵗均有專製無取復出又文通雜擬中媫妤紈扇而外别鮮流傳孫許元虛選臺未録故亦略諸且河梁贈答為五言權輿醴泉祗存都尉兹乃首列子卿以補其闕綜而計之得三十篇亦如文通之數敘其梗概用示别裁以次綴篇自娛清晏云爾蘇子卿贈别武日日金馬門相對或無語聞君當逺行語不盡愁緒乃識非傷暌何當惜歡聚願為並翼飛而乏凌雲羽之子身歷地伊我心馳所况子非常人武勇紹乃祖努力酬主知莫繫交情苦仰瞻日與月東西相背處其心茍不隔合朔從堪覩魏文帝芙蓉池作丕琳池植水華因名芙蓉池芙蓉照水鮮其芳清襲余叶擕我翰墨侣言燕淡蕩時遵陸雕輦陳涉川華舟隨慿軾覽嘉禾建旄摩喬枝畢景出皓星拂暑吹涼颸戰勝倘未能佺喬安可期不如愛景光及此青年姿曹子建白馬篇植白馬錦連錢遙從大宛來大宛有龍種其始出天池碗蹄善汗血珍重藏二師漢使持金求遮攻反居竒以此命廣利期至堅城陲郡國惡少年數萬人以西子辭白首父夫别紅顔妻哀鳴忘鴻雁壯志勵熊羆雕戈耀日明羽檄臨風馳左摧陷鮮卑右突陵月氐青年近億往黃髮盈千歸請聽天馬歌蒲稍西極徠俶儻遊閶闔權竒觀玉臺何如獲白狼犬戎終不隨王仲宣從軍粲不能安蓬蓽乃復求簮纓食祿盡臣莭此理亦易明朝聞刁斗嚴明公當西征秉羽笑懦夫割鉛本儒生既愧主吏蕭發蹤功已成兼慙留侯張坐謀帷幄稱我公智勇恢安藉贊襄仍伐檀恥素餐槖筆猶堪行閭閻戒繹騷儲胥夙克盈津前方桂舟河上營蘭坰親友逺來餞揮去無戀情雖云一旅勞所務萬方寧行看大勳就凱歌入鄴城莊馗花似煙平樂酒如澠河必繫吾土永言希令名劉公幹贈徐幹楨任已無不可事君良獨難菅蒯攻占畢致身希朝端誰知動拘束禮法不為寬譬彼鳥攖羅豈能刷羽翰與君隔豈遙數仭之掖垣犁然限東西有情不能宣鄙人對終日可以無一言同心而暌乖一日如三年鳥亦有翼並樹亦有枝連吁嗟我不如沉思發浩歎繾辭冀紓憂憂乃益甚焉阮嗣宗咏懷籍歡聚離别端繁華憔悴根富貴豈不重更有重者存茍非喬羡質失路徒悲辛髙奔速人老憂懷託藻言張茂先情詩華飽不知飢餒聚不知别苦胡然琴瑟和而各秦越處月亦照我帷風不拂我户怦怦撫空牀脈脈與誰語展䇿誦關雎爰獲我心所陸士衡贈弟士龍機友生有離聚兄弟無西東卒然當逺别愵焉傷我衷居者勸加餐行人囑保躬臨岐逝將分悲意填秋空胡為鶺鴒原竟覿牛馬風陸士龍答張士然雲士固信知已微君孰與言遙遙動參商有言曷能宣於時况行邁悠悠山復川井邑豈宿識風俗非所便故鄉真可懷逰子吁可憐夢寐或見君宛是樂羣年驚覺嗟索居寫恨酬斯篇潘安仁河陽縣作嶽我本志煙霞拔茅非所希一朝荷明揚儼與諸公陪混玉既心恧妨賢亦面怩無禆人或容豈不畏虗縻以此解組黻天陵駕言歸東山有美林秀蔭發華滋登髙偶舒嘯臨流或賦詩弱不勝耒耜課耕常及時自謂可終年越畔無外思孰謂十行降復禆百里司既已承明命寧令為繭絲此邦頗知禮朱博治異齊臨水每有悟淆之濁匪宜鈎距我不能所能尚無為登城眄廣原阡陌緑依依巾車循鄙鄉薑芋分町畦男耕而婦織民和訟亦稀弦歌或可聽卓魯安足期夫子儻相過能無笑割雞潘正叔贈河陽尼事君貴行道內外詎殊途召父及杜母至今垂令譽廊廟豈不佳衮職慙補苴聞君一縣花與民共歡娛户不閉深夜遺不拾通衢東山林谷幽寧復懷歸無張景陽詠史協易稱見幾行寧以終日需醴忘穆生去申公徒嗟吁遙遙千載下此風一何孤惟有二疏傅髙尚能繼諸十二通論語吾職不為辜宦成而不去後悔將何如公卿飢之行祖帳臨東都髙詠蟋蟀篇揮霍尋歡娛多財志損賢多財過益愚不獨肥遁嘉卓識堪為模左太沖招隱思青雲蓋危地窮林足安身山水不論價煙霞可養神巖阿太古室鹿豕忘憂賔松篁奏仙籟薜蘿掃俗塵天池沆瀣涵其中有錦鱗惟其不貪餌是以鮮挂緡巢許是我師涓務是我鄰衡門有芳謡可以書諸紳劉越石扶風歌琨西京舊帝都扶風拱黃圖昔為繁華里今為禾黍墟金張貴既歇鄒枚文亦忽惟有金銅仙流淚辭漢月僕夫秣我馬家人送我行客途始於此據鞍且復停四顧何所往吾意方茫茫涼秋多悲風偏拂征人裳放馬蘼蕪坡散步松楸下拾得鄼侯名未央前殿瓦帝業尚如此何况蓬茨間憤緒填胸臆欲語哽不言悲傷令人老棄置勿復道瞥電能幾時成名苦不早蠖屈以求信龍蟄以存身至今西山下幾見餓死人利獲害每隨失暫得亦恆請聽扶風歌勸君權重輕盧子諒時興諶璿璣無停運四序調嵗籥但見春復秋豈悟今非昨百年等瞬息石火稿熲若北邙有鬱柏東海無大藥不如愛景光隨時自為樂清風動帷幌華月蕩林薄洗心鏡至清振衣踞崇崿天機存其真詎因物止作可道非常道希夷契沖漠郭景純逰仙璞仙人世常有所貴凌世出燕照及漢武安得有仙日東海水湯湯蓬萊山崒崒元圃種琪花神皋聳玉室是中煉水碧羽化定可必子登授我簡云是瑶臺律大隱亦甚難只有園稱漆何敬祖雜詩劭有風西南來知是行金商四序本遞嬗何獨於秋傷草芳日以歇樹緑日以黃砧聲發逺村月色延虗堂虗堂獨不見迢迢憶逺行篋我齊紈扇箷我越羅裳仰瞻河鼓星相會宛成雙會則其歡短别則其愁長陶淵明咏貧士亨屯信有命逹人安所丁巳或不介意旁觀為惻生傷哉彼貧士踽踽林中行未火出蓽門見肘歸柴楹豈不苦飢寒嗟來羞見稱愧我誠何謂五斗猶繫情謝康樂逰赤石進帆海靈運撰辰尋勝逰際斯莭清和擷芳佩蘭茝窮變餐煙霞赤石近枕海進帆凌滄波乘桴我素志况可拾影娥朝陽神來賔元螭以馭車恬瀾導我遊此樂信如何疑見三壺山縹眇復嵯峨溟澥雖萬變不離一勺多終焉任虗舟泛覽窮天河謝宣逺張子房詩瞻紫色及畦聲聖王之驅除三秦屬弗靖有征發車徒方舟蓋長川組練明廣衢頓此項城隂息衆且斯須葆祠四百年鬱鬱松柏扶借問祠何人留侯神清臞和鈴爰至止椒桂陳樽壺甄揚乃在德聖心夫豈徒歌詩命從官表宅之意乎𬗟想嬴政虐期民離炭塗公子報韓仇博浪中屬車下邳契幽叟深折乃授書卒為王者師能忍藴廟謨蒼旻佑赤靈龍凖德充符伊人實贊襄婉婉多竒謀運籌帷幄中決勝千里餘功成求赤松翩飛向仙都我后方沛公良其人則無奮藻揚休風旋顧慙嗟吁謝法曹秋懷惠連能令人傷者夫惟值金秋有月皆慘淡無風不颼飀載觀古之人宋玉亦我儔當其悲來時逼塞填九州是時天宇晶絳河見舉頭一嵗才一會感彼女與牛露立濕衣裳幽薄螢火流竹響何颯沓蛩吟復唧秋人生百嵗間駒隙難喻遒一往不復還自審安為謀英雄誇兄嫂蘇子志已酬買臣訶其妻覆水難再收不殊鄙丈夫焉及東陵侯曠觀無可依不如事豪逰太華停我車少海維我舟却笑求仙人勞生終何投顔延之始安郡懷都延年星斗既上懸山河亦下列大禹錫元圭至今九州别江漢海朝宗嵾衡地奠臬讜憶子期諫誕鄙髙唐説我來守此邦撫字慙心拙去去奉明詔省闥班聨綴內外亦何殊行道宜及莭進退兩無就俯仰一何劣於古有明訓尸祿戒位竊行將謝華簮躬耕敦素恱鮑明逺玩月城西門𪠘中照髙堂漫張燈九華非夜明空庭度螢火其光何猥瑣微蟲彼何為蘭膏有盡時何如天上月萬古騰清輝徘徊銀漢表淡蕩玉閨時浮雲無纎䀶千里同一思宦遊多拘束乘間偶遊目隔窗散塵襟蔽櫳延清矚始聞曲發郢既命琴抽蜀親串及友朋共此敘情睦芳夕隨地佳何必深山曲王琅邪答顔延年僧逹竊聞君子交久敬淡如水琴音失鍾期伯牙不復理余於五倫中忘年遇吾子崇情實師􅚘清氣消吝鄙惟蘭芝並馨惟鼓聲相倚敬業竹素園奧研翰墨理時當莭序佳百昌向華美春山翠可望新波緑瀰瀰載泛李杜舟言溯顔曽旨此樂何倐忽一日三秋矣瑶篇寄逺音深誼託精擬佩以矢弗諼答以云如是謝元暉直中書省朓委佩近彤庭書紳依紫殿瓦鴛散日輝渴烏傳漏箭緑隂藹禁林已有新鶯囀當階紅藥芳影翻視草案鳳池盍仙朋豈以樗材贊承明有直宿寢門違視膳怦焉鬱吾衷賢勞何獨見緤組非夙志願託凌風翰沈休文咏湖中雁約春來水滿塘回雁報年光唼錦新花暖梯縠碧浪涼往羽帶南雲歸背點北霜飛空或成羣宿浦必以雙兩翅依春秋一心惟瀟湘范彥龍古意贈王中書雲昔者尹與邢磬折服中心何必定相妬等是侍禱衾北海蒙知初南皮被恩深遭逢都大同光儀獨可欽梧桐豈散木鳳皇非凡禽將託萋菶枝必有雍喈音余獨何為者濫竽集泮林願言企良覿省闥隔沉沉任彥升贈郭桐廬昉維舟富陽江遲我心儀者云是早見候失期乃吾也有心悲共傾有手歡同把竹柏懷三冬冠蓋輝五馬聚艱離每易音衆知則寡後會杳茫茫欲别還難捨從此天一涯有衷向誰寫江文通望荆山淹桐柏襟淮源江漢帶荆甸湘沅既已疏衡巫於是奠楚望快平生蠡測愧疏餞俯仰翰墨林唱酬風月宴金樽亦有醇玉几寧無薦中心别感傷遊賞非所戀汩羅淪靈均永懷淚如霰邱希範早發漁浦潭遲春水漲漁潭朝霞起赤亭富春深秀區峭蒨含餘清置浦何淡淡標峰盡亭亭行春爰及時攬俗兼課耕停彼錦埭車發此鏡川舲煙景幻迷離水物呈芳馨愧無能卜居合暫託幽情糾慢諒未能卧治庶可稱熱谷風爽彌月午炎劇今日明當祝融歸後徑亦理必山田况賴烜恆涼奚秀實此熱不可無黃雲奄觀銍山榛蕩輕籟行宫清且謐對時思花機即境契彛秩地限誠有權天行終不失農稼資蒸溽行旅畏炎歊兩全誠甚難思艱寸心勞炎官信其令胡不於昨朝吾寧乏清涼車馬多囂囂音敖南瞻避暑莊無暑恆逍遙新月碧漢秋眉露一䀶晚涼行館靜塵喧掃愁亦是添愁者冷露無聲桂影鶱處暑究是行秋地那更處暑時葉從人面落爽自馬頭披煙驛長和短雲山幻復竒田疇看漸熟惟有祝霜遲七夕萬古凄涼夕雙星聚會辰塞髙疑漢近鵲翥儼橋陳何必層樓結依然簷鼓新不知月露下秋思動何人曉行一夜西風谷變涼行人迫曉換征裳山田亦自知時候頴栗垂垂漸染黃鳴鞭速亦停鞍速晏起遲還歇頓遲因識習勞常得逸誰能修業不趨時雨午熱剛虞駝馬疲雲峰逺宇吐來竒須臾止頓輕涼送武帳秋風度萬絲長途豈乏後行人漸石應教受苦辛暑雨怨咨今不啻每因即景慎臨民山田日日看雲黃都喜惟時若雨㿩可識先憂饒後樂塞中還為祝豐穰輕雷斷雨一川晴西塞槍竿夕照明還見遙天飛電影紗衣不勝谷寒生西北風七月十四日噫氣涼盈谷驅雲天淡空非關少女候真是大王雄翼退橫霄鷁蹄輕噴玉驄停鞭西北望萬里此來同月七月十五日畢景羣山暝林端滿月飛呈寒無纎翳委照有餘輝拂我文木牀搴我薄羅帷靜對無不佳况此深翠微奚問中元莭河燈滿液池急雨急雨正當止頓後午暄驅盡峭寒生箔雲捲淨雷聲斷夕照一川紫翠明聞京師秋成有象即事志慰農家有常談豐年收成早今嵗穫新糧乃在六月杪青黃價未增預識苖秀好啓駕及停蹕緑雲歡載道避暑居山莊兩月恣幽討惟是關內田來往縈懷抱京兆報佳音西成逮萬寶巡方有常度祈年切久禱慰慶志愈欽際泰貴善保蔣溥進所作塞外雜詠依韻和之氊廬耽逸懷居理則那拂廬取便穩裝駝放彌卷密施功易水驛山程淂景多近渚恰宜臨野蓼依峰偏愛罥煙蘿方圓毳幕施俱可揔是人間風月窩駝裝鈴聲替戾度行駝致逺擔勞有足多訝可知風還聽水最耽桞陌與沙坡剛欣卸重成羣臥又迫臨明逐隊過飼秣恩誠思致報﨑嶇路亦慎防蹉馬絆伯樂偏虞馬易馳維連以絆出竒思除將麋鹿難為繫任是驊騮亦設羈卓立試嘶清夜月恣眠常憶白莎陂縶之亦欲飫之莭此事維應善牧知風竿雨朝風夕自飄搖誰翦襄雲落綘霄有意恰知馬足倦無言應解客心招低翩髙颭皆成畫圎碧方紅各取標最是幕中鼾睡遍一竿月露漾清宵雨溝雨腳飛來碧嶂頭周防已作未然愁落空任灑人形帳就下都歸之字溝㶁㶁應知看立涸涓涓且擬聽新流奚童畚鍤勤疏鑿底慮棼絲鎮相入聲繆設卡沿岡一帶勢連雲露重莎平淨翳氛鈴索宵明依制設官郵今昨計程分隍中祗慮聲驚獸磧裏兼存意習軍陳利誰何更無藉頒禽也足當酬勳地竈朝晡惟是供炊用增減非關設計深撥草乍欣逢舊穴烹魚奚藉溉新鬵聃觚未易尋常踞墨突休言不待黔移頓莫教輕掩棄即看昔製乃資今安市車載肩桃逐逐來營東逺列任囂豗米鹽日計應教聚蚩眩風澆未許開縱便罷譏何有惠豈常負販不儲材蠅頭笑彼旋糜盡滿槖盈囊若箇回征衣衣裁短後合時趨打疊巾箱備逺途豈是從戎歎離别也須著意稱身軀鵜梁慢誚輕濡翼韋褶偏宜淡染蕪頗有鄒枚尚寬博果然實必與名俱銅晷巧製伊誰意最初不淆方位指南如宵明長短無差報十二時辰有定書測景每教臨日下尋題便以適幾餘今人雅合分隂惜陶侃名言實起子頒鹿罷圍休息羽林羣營外頒禽率未申獨享不盈􅐪臘藏去聲均霑偏厚膳虞人堆來已看彌平壤持去從教饋比鄰自割懷歸且無罪空還應慮細君嗔和詩每因得句命廢詩韻府類函儘覽披畢竟老成還獨步可憐後進亦攀追古今風雅誠誰是宵旰憂勤只自知不是賞花釣魚處呈箋難與辨姸媸張宗蒼白雲紅樹乙亥北來重見南宗筆畫裏全收戶外山過眼驀懷去秋景補吟聊趂此時間曉月猶是中秋月偏宜北塞晨銜峰矗髙樹入水漾清淪寒益侵川路光維照旅人行裝多打疊縟毳覺堪親曉行銀河欲落月正午踈星三五猶堪數一𣲖嵐煙谷口橫曉色曶昕東方明須臾朱鳥槍竿升霜華離離羃野蘋隔嶂恰聞呦鹿鳴千幕捲撤向前頓我亦因之為曉行繢峰茈虒紛紅紫佳處不妨行且止豐城客子曽有言本意由來是山水九月朔日作野濶天益寥節肅秋惟季疊樹半餘紅喬柯全挺翠霜叢燦曉華風葉含涼吹彬兹圍獵場裒時易簡地扈從有儒冠可以攄吟思停蹕停蹕仙莊亦有因仰流遲待後來頻秋潭菊落波心艷冷砌筠翻窗影新叢樾稀餘那隱鹿名山住久覺親人驛章進止饒清暇觸處間參總靜真即事霜重湖益澄葉落林逾靜呦鹿呌煙懶鹿惟鳴秋入冬則斂聲矣間鷗護波冷稚冬藹清暉隨時愛寒景幾餘展藝編明忩虛且迥故知此其常相值意為永欽定熱河志卷四
