body:
  text: 欽定四庫全書欽定熱河志卷二十二巡典十御製詩己亥幸避暑山莊啓程之作有序典具如初法駕展七程之始禮循乎古吉行踰兩載而遙𬗟祖制之常遵秋搜仍飭歎慈歡之夙奉夏凊難追時則栁陌微涼梅霖正霽爰御驄而曉發習勞還似當年憶扶輦以徐臻紀事頓殊前度歷山郵而臨避暑北道依然排星罕以指清河東門詄若撫盈眸之禾黍劭農藉用慰焉接撲面之雲嵐顧我何為情也適來行館合有新吟朅爾宣毫忍披舊什長言志感小引抒懷又是常年避暑時由來兩嵗未行斯分明似昔全殊境展轉於懷那措詞經國深猷述祖德奉輿欽養𬗟慈儀山莊指日蹕將駐踊懼難為即景詩出古北口兩年未此度巖關昔嵗情懷想像間戎詰敢因忘祖制歡承那再奉慈顔閭閻滋庶籌衣食市肆無征任往還古北口雖設關門啇賈出入例不征稅承德府新興學校兼觀士習可雍嫻至避暑山莊得句承德新升以府名四民歡忭路旁迎山河自是萬古閲寒暑忽教兩嵗更雖曰勵躬法祖志傷哉回首養親情初來例有詩篇紀慙愧無端七字成熱河啓蹕木蘭行圍之作中秋節過啓搜程祖制昭垂奕葉明肯以長年有所倦亦惟勵已不渝誠乍驚兩嵗倥􅘓閲益切諸藩愛戴情回望難堪追憶處幾曾清曉問安行向年啓蹕幸木蘭日必先詣情出告之禮於今追憶實難為慈闈請安申木蘭回蹕至避暑山莊作往還原自向年同疊樹高低緑變紅稅駕徒然駐塞苑問安那復謁慈宫即今對景淡無味憶昔承歡恨不窮清夜藝齋頻有夢夢醒其奈總成空四十四年五月乙未上啓蹕巡幸塞外是日駐蹕石槽行宫降旨蠲免所過地方額賦十分之三戊戌出古北口辛丑至熱河行宫丁未上詣文廟行釋奠禮詳見學校門七月丙午上御卷阿勝境賜扈從王公大臣蒙古王公台吉茶果丁未巳酉亦如之庚戌閲步踏八月甲寅上御卷阿勝境賜扈從王公大臣蒙古王公台吉茶果凡六日乙卯土爾扈特貝子竒布坦等入覲丁巳杜爾伯特札薩克台吉伯拜等入覲並賜茶果癸亥亦如之甲子上萬夀聖節御淡泊敬誠殿扈從王公文武大臣官員蒙古王公台吉及土爾扈特貝子杜爾伯特札薩克台吉等行慶賀禮御卷阿勝境賜王公大臣蒙古王公台吉及土爾扈特貝子杜爾伯特札薩克台吉等茶果凡三日戊辰上啓蹕行圍木蘭丙子駐蹕穆逹烏拉岱蒙古王公進御宴閲馬戲丁丑行圍殪虎駐蹕巴顔布爾哈蘇台九月甲申行圍殪虎駐蹕伊遜河丙戌駐蹕張三營賜蒙古王公台吉及土爾扈特貝子杜爾伯特札薩克台吉等飯己丑上回熱河行宫甲午上啓蹕自熱河回鑾丁酉入古北口庚子上回圓明園御製詩庚子幸避暑山莊啓程之作祭澤傳臚遴庶士蕆諸務益敬勤增巡方歸未半月閲避暑諏惟吉日應鷺序鴛行列班聚玉鞭珠勒啓行仍古稀天子猶乘馬回蹕旬日各官北郊殿試散館選翰林引見文武諸務次第悉舉即於二十一日啓程幸避暑山莊凌暑䇿騎控御如常雖年已七十未覺鞍馬煩勞也無逸幾去聲垂元與曾出古北口千載巖城雖就隤亦餘埤堄枕崔嵬藉看歷代興亡迹不外一言德險該禾黍青䓤經雨後黔黎踴躍識鑾來守斯足矣為門户慚愧伊犂萬里恢至避暑山莊駐蹕即事一律過嶺廣仁遙看日上東山莊萬木翠雲籠右祠城隍廟左廟文廟胥瞻暨後海先河此意同避暑兼因避曠典朕五旬六旬大慶之年皆於宫中御殿受賀後乃啓蹕來熱河今年有所不欲故照常例五月即啓行致間返以致躋公熱河官吏兵民乃略有綴景為迎鑾慶夀之舉雖事已成然非所喜也雖然昨嵗曾經駐切切懷思未解𠂻八月十三日於避暑山莊行七旬慶典即事成什御殿庚寅禮未仍每嵗誕辰率在山莊逢大慶始於京師御殿受賀故庚寅嵗有十年一度一臨軒之句今嵗以不能似庚寅率羣臣於舉行慈寧宫行禮故不忍御殿受賀祇在山莊照例山莊聊聽慶岡陵七旬屈指數上聲今古六帝因心驗法懲三代以後帝王享國年逾七旬者六帝漢武帝梁高祖唐明皇宋高宗元世祖明太祖其中可法者惟元世祖明太祖然亦不能無遺憾焉其餘皆豫所鄙以為戒者北塞駢田朝衆部西天歡喜祝神僧班禪額爾德呢自後藏逺來慶祝各蒙古王公台吉喀爾喀衛拉特等一聞其來無不歡忭踴躍實為我國家吉祥盛事宜言吉日弗言戚東望松齋戚不勝正殿之左即率羣松鶴齋為昔年逢萬夀節臣行禮之處避暑山莊回鑾謁陵駐蹕喀喇河屯之作踐祚之初草五曾居諸忽逮七旬增未其隕越深蒙業用是東西敬謁陵蹙蹕罷圍非少懈今年豫七旬初度禮應恭謁即於兩陵虔申展謁因罷木蘭行圍八月二十八日自熱河啓行計廽蹕至圓明園仍在九月下旬初指莊豫訂勵丕承灤陽别墅行來近穩度輿梁衆喜仍昨因夏潦浮橋難立往來行人問渡稽滯兹秋爽連晴輿梁穩度扈從人等並無跋涉之苦入古北口敬以謁陵清蹕旋巖關入乃早常年寥寥空宇淨雲氣昨夜微雨矗矗諸峰朗霽煙石彴紫橋斂秋潦崇墉比櫛獲山田迤南窪地多遭沴繾彼忘兹祇􅍀然四十五年五月己亥上啓蹕巡幸塞外是日駐蹕石槽行宫降旨蠲免所過地方額賦十分之三壬寅出古北口乙巳至熱河行宫七月癸巳年班回部葉爾羌三品阿竒木伯克貝子色提布阿爾第等又杜爾伯特親王䇿楞悟巴什土爾扈特貝子沙拉扣肯等恭祝萬夀及喀什噶爾四品噶咱納齊伯克愛逹爾之子烏曽克等入覲上御依清曠殿並召見賜茶甲午木坪宣慰司堅木恭囊康及各上司土舍頭日等入覲於惠迪吉門外丁酉班禪額爾德呢自後藏至詳見徠逺門於淡泊敬誠殿跪請聖安上御依清曠殿賜坐賜茶果命班禪額爾德呢至須彌福夀之廟居住庚子上御萬樹園賜班禪額爾德呢等並扈從王公大臣蒙古王公台吉及回部阿竒木伯克貝子杜爾伯特親王土爾扈特貝子及木坪宣慰司等宴賞賚金幣有差辛丑杜爾伯特汗嗎克蘇爾札布等土爾扈特郡王色楞等恭祝萬夀入覲上御卷阿勝境並召見命同班禪額爾德呢等並扈從王公大臣蒙古王公台吉及回部阿竒木伯克貝子杜爾伯特親王土爾扈特貝子及木坪宣慰司等賜茶果壬寅悟梁海散秩大臣伊素特等恭祝萬夀入覲上御卷阿勝境召見命同扈從王公大臣蒙古王公台吉及回部阿竒木伯克貝子杜爾伯特汗土爾扈特郡王及木坪宣慰司等賜茶果癸卯甲辰乙巳皆如之丙午閲步踏八月戊申上御卷阿勝境賜扈從王公大臣蒙古王公台吉及回部郡王阿竒木伯克貝子杜爾伯特汗土爾扈特郡王悟梁海散秩大臣及木坪宣慰司等茶果乙酉上御卷阿勝境賜班禪額爾德呢等及扈從王公大臣蒙古王公台吉回部郡王阿竒木伯克貝子杜爾伯特汗土爾扈特郡王及木坪宣慰司等茶果庚戌辛亥皆如之丁巳上御避暑山莊宫門土爾扈特汗䇿凌那木札爾等及朝鮮正使錦城尉朴明源等同時入覲恭祝萬夀跪請聖安戊午上御卷阿勝境賜班禪額爾德呢等並扈從王公大臣蒙古王公台吉回部郡王阿竒木伯克貝子杜爾伯特汗土爾扈特汗朝鮮正使及木坪宣尉司等茶果己未上萬夀聖節御淡泊敬誠殿扈從王公大臣文武官員蒙古王公大臣貝勒台吉回部郡王阿竒木伯克貝子杜爾伯特汗土爾扈特汗朝鮮正使悟梁海散秩大臣及木坪宣慰司等行慶賀禮並命隨至卷阿勝境賜茶果庚申上御卷阿勝境復賜茶果是晚上御萬樹園賜班禪額爾德呢等並扈從王公大臣蒙古王公台吉回部郡王及阿竒木伯克貝子杜爾伯特汗土爾扈特汗朝鮮正使及木坪宣慰司等觀火戲辛酉上御卷阿勝境賜扈從王公大臣蒙古王公台吉等茶果壬戌亦如之是晚上御萬樹園賜班禪額爾德呢等並扈從王公大臣蒙古王公台吉等觀火戲乙丑上御萬樹園賜班禪額爾德呢等並扈從王公大臣蒙古王公台吉等宴甲戍上自熱河回鑾謁陵九月丁丑入古北口乙未上回圓明園御製詩辛丑幸避暑山莊啓蹕之作通宵雲淨曉晴豪避暑行巡例向遭衣用夾紗破晨爽帽垂釐毳却炎叨東門依舊千官送廣甸懷新多稼叨袖嚲玉鞭控珠勒珠勒雖為鞍轡用語然國語及蒙古語皆為小步馬之稱即俗所為走馬也敢為圖逸謝年高出古北口按頓行宫清蹕移巖關度處爽風披今來古往供詩料敗壘殘垣入畫姿萬里原非一時舉一心恆繫萬年思固知不藉兹為守却恐侵尋或守兹至避暑山莊駐蹕即事得句山莊避暑例依前是日行旌涖止便皓日揚輝瀼麥露輕風拂爽引槐煙經營敬迎垂奕世跋涉寧當謝長上聲年仍擬木蘭親校獵徒云即鹿豈其然八月十六日避暑山莊啓蹕往木蘭之作去嵗罷圍因大慶今年行獮例依常中秋甫過餅瓜節上塞非遙麅鹿場幾度溪橋消野漲歷觀村圃得中穰近年塞外雨雖勤然旋雨旋霽不致大潦尚有三䮒之收古稀有一仍繩武不息體乾勵自強木蘭回蹕至避暑山莊作回看射鹿木蘭邉千里雲收淨碧天蒞止山莊秋又季搜吟書屋景當前峯容林態自終古安問歡承異昔年不可無言紀時日有言祇益意悽然四十六年閏五月庚戍上啓蹕巡幸塞外是日駐蹕石槽行宫降旨蠲免所過地方額賦十分之三癸丑出古北口丙辰至熱河行宫七月辛酉安南國使臣阮維宏等於惠迪吉門外道旁瞻覲天顔上加賞該國王縀匹及使臣等銀幣有差乙丑上御卷阿聖境賜扈從王公大臣蒙古王公貝勒額駙台吉等茶果凡五日庚午閲步踏入月壬申上御卷阿勝境賜扈從王公大臣蒙古王公貝勒台吉等茶果癸酉甲戌皆如之乙亥上御卷阿勝境土爾扈特台吉額爾德呢等入覲召見賜茶並命同扈從王公大臣蒙古王公貝勒台吉等賜茶果丙子亦如之丁丑哲布尊丹巴胡土克圖入覲上御依清曠殿召見賜茶戊寅杜爾伯特扎薩克台吉布爾布逹爾濟等入覲於惠迪吉門外跪迎聖駕庚辰上御萬樹園賜扈從王公大臣蒙古王公貝勒台吉等及哲布尊丹巴胡土克圖並土爾扈特台吉杜爾伯特札薩克台吉等宴是晚上御萬樹園賜扈從王公大臣蒙古王公貝勒台吉等及哲布尊丹巴胡土克圖並土爾扈特台吉杜爾伯特札薩克台吉等茶果觀火戲壬午上御卷阿勝境賜扈從王公蒙古王公貝勒台吉等及土爾扈特杜爾伯特等茶果癸未上萬夀聖節御淡泊敬誠殿扈從王公大臣文武官員等行慶賀禮御卷阿勝境賜扈從王公大臣蒙古王公貝勒台吉等及土爾扈特台吉杜爾伯特台吉等茶果甲申上御卷阿勝境賜扈從王公大臣蒙古王公貝勒台吉及土爾扈特台吉杜爾伯特台吉等茶果乙酉亦如之丙戍上啓蹕行圍木蘭庚寅行圍殪虎駐蹕海拉蘇台己亥行圍殪虎駐蹕阿穆巴究溝口喀拉沁郡王那特納錫第恭進御宴閲馬戲九月庚子朔行圍殪虎駐蹕烏蘭哈達癸卯駐蹕張三營賜蒙古王公貝勒台吉等飯丙午上回熱河行宫乙卯上啓蹕自熱河回鑾戊午入古北口壬寅上回圓明園御製詩壬寅幸避暑山莊啓蹕之作老年人率不禁暑避暑誠應每嵗行况是山莊貽聖祖遂教吉日發都京前朝炎熱兹更平聲爽左近霑霖此却晴步出東門仍御馬既勤已亦愜輿情出古北口詠事古北今城夜戶開山莊避暑復兹來有懷莫致雄關守無黨惟欣王道恢沙壓水衝餘廢址巖梯嶺冠尚存臺弗資民力那能此似此勞民信可咍至避暑山莊即事得句宿雨清塵度嶺郵府今承德昔興州人勤農賈滋而庶户有絃歌教以修學政金士松嵗試承德府生童甫畢率令諸生於是日迎駕冉問孔云斯正合李唐趙宋此能不撫時益切持盈志曰奉無私莫外求啓蹕木蘭之作霽景川原麗曉晴撰辰却喜發虞旌自強一已仍乘馬扈蹕諸藩衣是鶯扈駕衆蒙古賜黃祫者多真一朵黃雲也幾曲野橋新漲到滿空清籟嫩涼輕秋收非稔亦非歉三釜差堪慰細氓木蘭廽蹕至避暑山莊作往還草日覺無何颯景山莊換幾多已是丹楓贏翠桞却看黃菊伴紅荷雀如話别簷頭噪雁解傳霜嶺外過詩本黃綾頁將滿合饒默賞閣吟哦四十七年五月戊申上啓蹕巡幸塞外是日駐蹕石槽行宮降旨蠲免所過地方額賦十分之三辛亥出古北口甲寅至熱河行宫七月己未上御卷阿勝境賜扈從王公大臣蒙古王公貝勒台吉等茶果凡五日甲子閲步踏八月戊辰上御卷阿勝境土爾扈特頭等台吉阿拉克巴等入覲召見賜茶命同扈從王公大臣蒙古王公貝勒台吉等賜茶果並賞冠服金幣有差己巳土爾扈特協理台吉德爾德史等入覲上御卷阿勝境召見賜茶並命同扈從王公大臣蒙古王公貝勒台吉等及土爾扈特頭等台吉等賜茶果並賜冠服金幣有差庚午上御卷阿勝境賜扈從王公大臣蒙古王公貝勒台吉及土爾扈特台吉等茶果辛未上御卷阿勝境都爾伯特貝子羅卜藏薩木坦等入覲召見賜茶並命同扈從王公大臣蒙古王公貝勒台吉等並土爾扈特台吉等賜茶果並賜冠服金幣有差壬申上御卷阿勝境賜扈從王公大臣蒙古王公貝勒台吉等並土爾扈特台吉都爾伯特貝子等茶果丙子亦如之丁丑上萬夀聖節御淡泊敬誠殿王公大臣文武官員等行慶賀禮御卷阿勝境賜扈從王公大臣蒙古王公貝勒台吉等並土爾扈特台吉都爾伯特貝子等茶果戊寅上御卷阿勝境賜扈從王公大臣蒙古王公貝勒台吉等並土爾扈特台吉都爾伯特貝子等茶果癸未上啓蹕行圍木蘭甲午行圍殪虎駐蹕額勒蘇什那九月乙未朔駐蹕阿穆巴究溝口喀拉沁郡王納特那鍚第恭進御宴閲馬戲丙申行圍殪虎駐蹕烏蘭哈達己亥駐蹕張三營賜蒙古王公貝勒台吉等飯壬寅上回熱河行宫庚戍上啓蹕自熱河回鑾甲寅入古北口丙辰上回圓明園欽定熱河志卷二十二
