body:
  text: 欽定四庫全書欽定熱河志卷十九廵典七御製詩丙戌恭奉皇太后秋廵唘蹕之作昨夜微霏雨洗車朝來霽景暢晶如天髙氣爽臨秋囿山峙川流奉懿輿自有三千驅赳赳那須十二駕魚魚沿途又此屢豐閱曰慰曰兢並切予出古北口闉闍棲嶂迴嶙峋望幸黎元迓蹕廵雖是一年經一度憐他每度較前親北門鎖鑰重去聲提封組練旌旗列㡬重謾道清時全不用聽教平聲例事耀軍容鬼工猶恐不能兼人力安施峭壁尖設使千秋無此蹟至今誰復笑䝉恬身先去聲從來雨不辭鳴鞭迤邐破煙絲予心自有惬懐處正是秋田結穗時至避暑山荘即事得句雲勢侵晨欲放晴廣仁嶺過朗曦迎山荘早悦遥看目衢市先殷衆迓情祖澤至今歌樂利予心惟永戒驕盈時廵近逺藩王集不必言威惠以誠出麗正門恭迎皇太后衹覺八朝隔不知十里遥秋晨氣真爽山路潦全消歡悉凊温適親承甘㫖調仙荘奉文母家法自神堯熱河啟蹕木蘭行圍之作尊養去聲去年例萬年昨嵗啟蹕幸木蘭時恭奉年頥皇太后仍駐山荘以適髙養並留皇妃皇子代諭永承成例温清奉有慈為興居晨謁啟行旃慈雲南望一心戀爽氣北迎衆意便落漲本微渉塞水今秋迤北雨短塞水本微獲收逾半閱山田熱河一帶秋收較往年為遜然尚有過半之收圃塲亦自櫛比也逺臣西北翩聨至時都爾伯特貝子額爾徳尼等烏梁海内大臣察達克等並以朝賀至行在即扈從行圍示度懐遐詎偶然重九日賜䝉古王公等宴賚罷圍應犒賚況復值良辰筵對黄華設恩頒翠綺均寜須拘禮數實可見情親即命還游牧役人不欲頻木蘭迴蹕至避暑山荘恭問皇太后安豈不郵章悉起居北蒐將及月旋初屏翰平聲仰望難孤彼甘㫖親嘗更廑予逰豫仙荘身益健趨承松牖志方舒山荘内名松皇太后所居處鶴齋萬年循例今年始昨嵗自木蘭迴蹕詣山荘皇太后宫問慈寜駐舊典也曽䝉安遵諭以皇祖奉嵗聖母自此將循康熈年間成例欽承深切欣依今嵗即敬循慈訓之始自今當永為例事云信是天倫樂莫如入古北口兩月秋巡此進闗先殷農況閱民間果然口内勝口外塞田今年夏秋缺雨收穫祗得中豐闗内則秋成大稔景象勝於口外云無㡬看過平聲又看還風栁面迎陌頭緑霜楓背指嶺眉殷祝釐敢不遵慈命便以紆臨了髻山了髻山修葺莅拈神廟落成距宻皇太后欲親香申敬山雲一程因紆道經臨便途由盤山迴蹕三十一年七月丙子上奉皇太后啟蹕廵幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫丁丑降㫖蠲免所過地方額賦十分之三己卯出古北口壬午至熱河行宫癸未上詣廣仁嶺恭迎皇太后駕至熱河行宫乙未上奉皇太后於卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉等茶果凡三日八月己亥復賜王公大臣䝉古王公台吉等茶果凡七日丁未亦如之己酉上侍皇太后膳賜王公大臣䝉古王公台吉等宴庚戌上萬夀聖節詣皇太后行宫行禮御澹泊敬誠殿扈從王公大臣文武官員及䝉古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉等宴三日癸丑上啟蹕巡幸木蘭皇太后仍駐熱河行宫丁卯行圍殪虎駐蹕鄂蘭索郭圗九月戊辰朔行圍殪虎駐蹕額勒蘇錫納己巳行圍殪虎駐蹕按巴鳩和洛昂阿壬申行圍殪熊駐蹕坡賚昂阿丙子駐蹕張三營賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯己邜迴熱河行宫恭請皇太后安丙戌上奉皇太后自熱河迴鑾己丑入古北口十月己亥上奉皇太后迴圓明園御製詩丁亥恭奉皇太后幸避暑山荘御園唘蹕之作昨朝霖雨夜來晴正值蒐廵唘翠旌為奉康寜緩後頓仍循警蹕肅前行途旁萬姓聽趨覲路近三分俾免征降㫖免經過地方額賦十分之三嵗以為常俾蹕路羣黎頻沾惠澤秋節雖遲月臨廿是月十四日始立秋故唘行於月之二十日涼颸已覺馬頭迎出古北口蒐廵又此出長闗便覺迎來爽滿顔秋塞已開峯伍伍曉空猶掛月彎彎遺蹟何須欵祖龍千秋炯鑒慎邉封野橋漲水潮河急昨晩山雲西北濃去年塞坂微嫌旱今嵗山田幸兆豐未逮登塲知未定越因切切惕吾衷至避暑山荘即事得句千峯歛霧矗螺鬟嶺過廣仁接闠闤雖是旬餘遲出蹕却饒一月暢居山今嵗七月逄閏立秋節遲唘鑾較往年緩十餘日而距進哨尚早可多駐山荘一月評量農務黄雲際唘廸詩情緑樹間更有予心深喜處明當䇿馬迓慈顔出麗正門恭迎皇太后至山荘即事得句日日伻人悉起居豈同躬覲太安輿康强真是夀無量愛敬從知樂莫如多稼沿途經覽豫好山滿苑奉懐舒秋陽曝處暄宜穡恰有松風入綺䟽仲秋唘蹕木蘭行圍之作秋中行狩臨六轡發如琴豈不晨昏念亦惟繩繼欽南瞻遥塞苑北指近雲岑納稼山村景崇墉真愜心䝉古王公等進宴即事成什帳殿崔巍向逺坰傾誠貢宴得教聽稱觴共上南山夀奏樂還欣北曲聆蘇對洛那咸扈衛是日哈薩克陪臣亦命預宴黄河青海更家庭古來斯事稱希有保泰持盈慎自銘髙適詩云青海只今將飲馬黄河不用更防秋夫防秋乃在黄河則其時邉界武備從可知矣明季河套始終為梗夏言欲恢復竟搆大獄卒亦無成若本朝則鄂爾多斯乆為臣僕執役惟謹其居河套與各省民人之各安井里何異耶青海亦與四十九旗䝉古無别随獵侍宴恭敬有加兹武帳列坐誠如家人父子詩以誌事非敢為誇益因自勵駐張三營行宫賜蒙古王公及隨圍人等宴賚作别館開佳宴列茵秩有倫勞去聲勤例行賜逮下澤教均誰曰甌曽脫端知秋似春羣欣稱世僕我則道嘉賔迴蹕至避暑山荘恭問皇太后安及月山荘豫養崇慈顔瞻喜益加豐朝家馭逺千年計寝閣承歡一念衷砌以向陽草猶緑忩因延景樹紅如斯時莭如斯事萬載如斯願不窮恭奉皇太后山荘啟蹕迴鑾之作兩越月餘駐奉言安馭旋闗山自風景莭序暗推遷頥養宜真境逍遥若上仙歡欣承懿旨來豫定年年三十二年七月壬午上奉皇太后啟蹕巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫䧏㫖蠲免所過地方額賦十分之三乙酉出古北口戊子至熱河行宫己丑上詣廣仁嶺恭迎皇太后駕至熱河行宫閏七月丁巳上奉皇太后於卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉等茶果凡五日八月甲子復賜王公大臣䝉古王公台吉等茶果凡五日癸酉上待皇太后膳賜王公大臣䝉古王公台吉等宴甲戍上萬夀聖節詣皇太后行宫行禮御澹泊敬誠殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台等宴凡三日丁丑上啟蹕廵幸木蘭皇太后仍駐熱河行宫辛巳哈薩克使臣都勒特克勒等入覲是日駐蹕海拉蘓台乙酉駐蹕都穆逹烏拉岱䝉古諸王公等恭進御宴閲馬戲己丑駐蹕鄂爾楚克哈逹賜扈從王公大臣䝉古王公台吉及哈薩克使臣等宴九月戊戌駐蹕張三營賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯辛丑迴熱河行宫恭請皇太后安丁未上奉皇太后自熱河迴鑾庚戍入古北口癸丑上奉皇太后迴圓眀園御製詩戊子孟秋恭奉皇太后幸避暑山荘唘蹕之作嵗嵗行秋奉大安康强欣侍萬年歡一天霽景人心爽七日吉程馬足盤自京至熱河吉行七日程圖逸不教平聲進輕輦習勞常是控雕鞍村民趨覲無呵止十分去聲三供例與寛凡所經過州縣正供例免十分之三出古北口塞闗嵗嵗此途遵闤闠歡欣接駕民祗有殷勤籌富教那更平聲往事說嬴秦將謂秋風出塞凉日中婪熱拂征裳金官酌劑人知否火迫良田穂染黄水抱山環盤曲蹊兩行緑栁布隂齊今來幸以去年景禾􅎟鄉中度䡶輗至避暑山莊作灤陽計里不由旬自喀喇河屯至山荘祇三十餘里梵經一由旬謂四十里按轡清晨度廣仁嶺名在山荘西闤闠至今踰萬户萬家煙火随民便皇祖詩句也蒼黔自昔仰時巡撫兹敢懈繼繩志睠彼依然樂利民更有予衷深幸者山田欣閱屢綏頻出麗正門恭迎皇太后駕至避暑山荘作一日後違八日遲啓程之日後一皇太后至湯山駐蹕故逐日程至今凡八日矣不眠數問夜何其欣知此際臨安輦恭迎去聲先期候野達曰喜真成莫大喜如斯實願萬年斯康强福夀誠誰並祇以徳崇用受禧仲秋啓驆木蘭行圍之作仙荘彌月駐行旌時届秋蒐此啓程車馬蕭蕭指北塞􅎟禾栗栗報西成鷄鳴犬吠山村接鷙臂盧牽獵士迎習武朝家有常度遵循詎為去聲恣逰情木蘭迴蹕至避暑山荘恭問皇太后安郵章雖悉起居便邇嵗圍期每䟎前定省顧違廿餘日豫遊願奉萬斯年亭䑓總是長生境鶴鹿皆成不老仙退憩巖齋誠慶慰罨忩紅緑繢峯妍入古北口九月十九日秋暖今年實異哉入闗路更潤無埃黄華把憶重陽過緑樹看從塞外來毎嵗闗外樹葉黄落入闗始見緑樹今秋闗外樹色尚緑故云菘薤尚留畦町上聲蔚􅎟禾已納圃場堆村民頗有逢年慶却廑畿南慮㡬迴今嵗畿輔髙阜處仍属豐收自哨門至闗内沿途景象頗佳惟京南瀕水州縣秋雨稍多有積潦成灾者深為廑念三十三年七月癸巳上奉皇太后啟蹕廵幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫降㫖蠲免所過地方額賦十分之三丙申出古北口己亥至熱河行宫庚子上詣廣仁嶺恭迎皇太后駕至熱河行宫壬子上奉皇太后於卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉等茶果凡三日八月丁巳復賜王公大臣䝉古王公台吉等茶果凡七日丁卯上侍皇太后膳賜王公大臣䝉古王公台吉等宴戊辰上萬夀聖節詣皇太后行宫行禮御澹泊敬誠殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台吉等宴凡三日辛未上啟蹕廵幸木蘭皇太后仍駐熱河行宫己卯駐蹕都穆逹烏拉岱䝉古王公等恭進御宴閱馬戲行圍殪虎駐蹕鄂爾楚克哈逹九月壬辰駐蹕張三營賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯乙未迴熱河行宫恭請皇太后安辛丑上奉皇太后自熱河迴鑾甲辰入古北口丁未上奉皇太后迴圓眀園御製詩己丑恭奉皇太后幸避暑山荘御園啟蹕之作入秋三日屢逢晴撰吉平眀啟綵旌緩奉安輿循後宿例驅柔轡肅前程輕風楊栁迎頭爽濃露郊原蓄目清足博慈顔倍歡豫勝常禾􅎟逮西成出古北口塞隘近如國北門棲巖底事整頺垣闠闤列肆無征賦一百年來沐厚恩古北口雖設宫詰察行人而於商旅往來例不徴𣙜百餘年來人民樂業闗城貨肆日益緐盛綵亭預祝貢輿情提督王進㤗奏古北口兵民以明年為朕六旬萬夀籲陳綵亭預祝因其事已成且無煩費姑聽之不說由來事已成且喜未曽費物力碧天雲浄朗秋晴是日晴明既利行程亦不致霑漬鋪設也縈紆石棧嚲鞭過蒼緑千林鎖髻螺色合國言紐幹哩金語與本朝國語相同而漢字金史地理志載古北口國言曰留幹嶺義無可釋音亦不協因思國語謂蒼緑色為紐斡哩當時或山樹命名漢人不曉金朝言語妄為音譯展轉成訛今命釐定金國語觧特為舉出以正其謬乃知金史譯成訛出闗例看秋成好今嵗秋成倍往時迎駕有來諸扎薩北東言更勝於斯闗外山田秋稼多稔今年倍勝於常而科爾沁敖漢諸扎薩克王公等至此迎鑾僉云迤北迤東各部落田禾景象較尤豐蔚至避暑山荘即景成什萬家列肆接闉扉駐熟山荘到若歸一路飽看秋稼好千峯疊矗曉雲稀今而來似昨而去旰以食仍宵以衣永佑寺名層樓神御奉處瞻先敬寫心依寺傍有冩心精舍出麗正門恭迎皇太后至山荘敬成長句誌喜廣仁嶺名在山荘西經之皇祖所賜額為必路西望是瑶池王母雲車降此時汎灑昨宵霏細雨晶眀清曉霽髙曦三秋有象供怡豫四海無央祝夀祺食履倍康逰攬健歡承慈訓永來隨木蘭行圍熱河啟蹕之作度節行秋獮邇年率以八月十六日啟程往木蘭詢安便啟程仙荘數入聲南望寶稼逮西成過雨千溪漲烘晴萬嶂明中闗行宮地名午前到咨政慎權衡至避暑山荘恭問皇太后安即事誌喜行館凌晨發山荘傍已臻加豐慈體豫至樂慕懐伸日影忩延暖秋園氣藹春萬年結心願如願籲天申入古北口作今年秋暖長候不限邉墻闗外樹仍緑籬根花始黄優膏後微欠今嵗闗内外秋稼極為豐茂惟七月以後雨澤畧欠霑透收成未足十分而口内秋麥亦因地土稍乾未能一律翻種奢望未全償更繫予懐者稀看宿麥芒三十四年七月戊子上奉皇太后啟蹕廵幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫降㫖蠲免所過地方額賦十分之三辛卯出古北口甲午至熱河行宫乙未上詣廣仁嶺恭迎皇太后駕至熱河行宫丁未上奉皇太后於卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉等茶果凡三日八月辛亥復賜王公大臣䝉古王公台吉等茶果凡七日辛酉上侍皇太后膳賜王公大臣䝉古王公台吉等宴壬戍上萬夀聖節詣皇太后行宫行禮御澹泊敬誠殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台吉等宴凡三日乙丑上啟蹕巡幸木蘭皇太后仍駐熱河行宫丙子行圍殪虎駐蹕按巴鳩和洛色欽九月辛巳行圍殪虎駐蹕薩爾巴里哈逹壬午駐蹕按巴鳩和洛昻阿䝉古諸王公等恭進御宴閱戲馬癸未行圍殪虎三駐蹕烏蘭哈逹丙戍駐蹕張三營賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯己丑迴熱河行宫恭請皇太后安乙未上奉皇太后自熱河迴鑾戊戍入古北口辛丑上奉皇太后迴圓明園欽定熱河志卷十九
