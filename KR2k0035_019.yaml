body:
  text: 欽定四庫全書欽定熱河志卷十九巡典七御製詩丙戌恭奉皇太后秋巡啓蹕之作昨夜微霏雨洗車朝來霽景暢晶如天髙氣爽臨秋囿山峙川流奉懿輿自有三千驅赳赳那須十二駕魚魚沿途又此屢豐閲曰慰曰兢並切豫出古北口闉闍棲嶂回嶙峋望幸黎元迓蹕巡雖是一年經一度憐他每度較前親北門鎖鑰重去聲提封組練旌旗列幾重謾道清時全不用聽教平聲例事耀軍容鬼工猶恐不能兼人力安施峭壁尖設使千秋無此迹至今誰復笑蒙恬身先去聲從來雨不辭鳴鞭迤邐破煙絲豫心自有愜懷處正是秋田結穗時至避暑山莊即事得句雲勢侵晨欲放晴廣仁嶺過朗曦迎山莊早悅遙看目衢市先殷衆迓情祖澤至今歌樂利豫心惟永戒驕盈時巡近逺藩王集不必言威惠以誠出麗正門恭迎皇太后只覺八朝隔不知十里遙秋晨氣真爽山路潦全消歡悉凊溫適親承甘旨調仙莊奉文母家法自神堯熱河啓蹕木蘭行圍之作尊養去聲去年例萬年昨嵗啓蹕幸木蘭時恭奉年頥皇太后仍駐山莊以適髙養並留皇妃皇子代諭永承成例溫清奉有慈為興居晨謁啓行旃慈雲南望一心戀爽氣北迎衆意便落漲本微涉塞水今秋迤北雨短塞水本微獲收逾半閲山田熱河一帶秋收較往年為遜然尚有過半之收圃場亦自櫛比也逺臣西北翩聨至時都爾伯特貝子額爾德尼等烏梁海內大臣察達克等並以朝賀至行在即扈從行圍示度懷遐詎偶然重九日賜蒙古王公等宴賚罷圍應犒賚況復值良辰筵對黃華設恩頒翠綺均寧須拘禮數實可見情親即命還遊牧役人不欲頻木蘭回蹕至避暑山莊恭問皇太后安豈不郵章悉起居北搜將及月旋初屏翰平聲仰望難孤彼甘旨親嘗更廑豫逰豫仙莊身益健趨承松牖志方舒山莊內名松皇太后所居處鶴齋萬年循例今年始昨嵗自木蘭回蹕詣山莊皇太后宫問慈寧駐舊典也曽蒙安遵諭以皇祖奉嵗聖母自此將循康熙年間成例欽承深切欣依今嵗即敬循慈訓之始自今當永為例事云信是天倫樂莫如入古北口兩月秋巡此進關先殷農況閲民間果然口內勝口外塞田今年夏秋缺雨收穫祗得中豐關內則秋成大稔景象勝於口外云無幾看過平聲又看還風栁面迎陌頭緑霜楓背指嶺眉殷祝釐敢不遵慈命便以紆臨了髻山了髻山修葺蒞拈神廟落成距密皇太后欲親香申敬山雲一程因紆道經臨便途由盤山回蹕三十一年七月丙子上奉皇太后啓蹕巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫丁丑降旨蠲免所過地方額賦十分之三己卯出古北口壬午至熱河行宫癸未上詣廣仁嶺恭迎皇太后駕至熱河行宫乙未上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉等茶果凡三日八月己亥復賜王公大臣蒙古王公台吉等茶果凡七日丁未亦如之己酉上侍皇太后膳賜王公大臣蒙古王公台吉等宴庚戌上萬夀聖節詣皇太后行宫行禮御淡泊敬誠殿扈從王公大臣文武官員及蒙古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉等宴三日癸丑上啓蹕巡幸木蘭皇太后仍駐熱河行宫丁卯行圍殪虎駐蹕鄂蘭索郭圗九月戊辰朔行圍殪虎駐蹕額勒蘇錫納己巳行圍殪虎駐蹕按巴鳩和洛昂阿壬申行圍殪熊駐蹕坡賚昂阿丙子駐蹕張三營賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯己邜回熱河行宫恭請皇太后安丙戌上奉皇太后自熱河回鑾己丑入古北口十月己亥上奉皇太后回圓明園御製詩丁亥恭奉皇太后幸避暑山莊御園啓蹕之作昨朝霖雨夜來晴正值搜巡啓翠旌為奉康寧緩後頓仍循警蹕肅前行途旁萬姓聽趨覲路近三分俾免征降旨免經過地方額賦十分之三嵗以為常俾蹕路羣黎頻沾惠澤秋節雖遲月臨草是月十四日始立秋故啓行於月之二十日涼颸已覺馬頭迎出古北口搜巡又此出長關便覺迎來爽滿顔秋塞已開峯伍伍曉空猶挂月彎彎遺迹何須欵祖龍千秋炯鑒慎邉封野橋漲水潮河急昨晚山雲西北濃去年塞坂微嫌旱今嵗山田幸兆豐未逮登場知未定越因切切惕吾衷至避暑山莊即事得句千峯斂霧矗螺鬟嶺過廣仁接闠闤雖是旬餘遲出蹕却饒一月暢居山今嵗七月逄閏立秋節遲啓鑾較往年緩十餘日而距進哨尚早可多駐山莊一月評量農務黃雲際啓迪詩情緑樹間更有豫心深喜處明當䇿馬迓慈顔出麗正門恭迎皇太后至山莊即事得句日日伻人悉起居豈同躬覲太安輿康強真是夀無量愛敬從知樂莫如多稼沿途經覽豫好山滿苑奉懷舒秋陽曝處暄宜穡恰有松風入綺疏仲秋啓蹕木蘭行圍之作秋中行狩臨六轡發如琴豈不晨昏念亦惟繩繼欽南瞻遙塞苑北指近雲岑納稼山村景崇墉真愜心蒙古王公等進宴即事成什帳殿崔巍向逺坰傾誠貢宴得教聽稱觴共上南山夀奏樂還欣北曲聆蘇對洛那咸扈衛是日哈薩克陪臣亦命預宴黃河青海更家庭古來斯事稱希有保泰持盈慎自銘髙適詩云青海只今將飲馬黃河不用更防秋夫防秋乃在黃河則其時邉界武備從可知矣明季河套始終為梗夏言欲恢復竟搆大獄卒亦無成若本朝則鄂爾多斯久為臣僕執役惟謹其居河套與各省民人之各安井里何異耶青海亦與四十九旗蒙古無别隨獵侍宴恭敬有加兹武帳列坐誠如家人父子詩以志事非敢為誇益因自勵駐張三營行宫賜蒙古王公及隨圍人等宴賚作别館開佳宴列茵秩有倫勞去聲勤例行賜逮下澤教均誰曰甌曽脫端知秋似春羣欣稱世僕我則道嘉賔回蹕至避暑山莊恭問皇太后安及月山莊豫養崇慈顔瞻喜益加豐朝家馭逺千年計寢閣承歡一念衷砌以向陽草猶緑忩因延景樹紅如斯時莭如斯事萬載如斯願不窮恭奉皇太后山莊啓蹕回鑾之作兩越月餘駐奉言安馭旋關山自風景莭序暗推遷頥養宜真境逍遙若上仙歡欣承懿旨來豫定年年三十二年七月壬午上奉皇太后啓蹕巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫降旨蠲免所過地方額賦十分之三乙酉出古北口戊子至熱河行宫己丑上詣廣仁嶺恭迎皇太后駕至熱河行宫閏七月丁巳上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉等茶果凡五日八月甲子復賜王公大臣蒙古王公台吉等茶果凡五日癸酉上待皇太后膳賜王公大臣蒙古王公台吉等宴甲戍上萬夀聖節詣皇太后行宫行禮御淡泊敬誠殿扈從王公文武大臣官員及蒙古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台等宴凡三日丁丑上啓蹕巡幸木蘭皇太后仍駐熱河行宫辛巳哈薩克使臣都勒特克勒等入覲是日駐蹕海拉蘇台乙酉駐蹕都穆逹烏拉岱蒙古諸王公等恭進御宴閲馬戲己丑駐蹕鄂爾楚克哈逹賜扈從王公大臣蒙古王公台吉及哈薩克使臣等宴九月戊戌駐蹕張三營賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯辛丑回熱河行宫恭請皇太后安丁未上奉皇太后自熱河回鑾庚戍入古北口癸丑上奉皇太后回圓眀園御製詩戊子孟秋恭奉皇太后幸避暑山莊啓蹕之作嵗嵗行秋奉大安康強欣侍萬年歡一天霽景人心爽七日吉程馬足盤自京至熱河吉行七日程圖逸不教平聲進輕輦習勞常是控雕鞍村民趨覲無呵止十分去聲三供例與寬凡所經過州縣正供例免十分之三出古北口塞關嵗嵗此途遵闤闠歡欣接駕民祗有殷勤籌富教那更平聲往事説嬴秦將謂秋風出塞涼日中婪熱拂征裳金官酌劑人知否火迫良田穗染黃水抱山環盤曲蹊兩行緑栁布隂齊今來幸以去年景禾􅎟鄉中度䡶輗至避暑山莊作灤陽計里不由旬自喀喇河屯至山莊祇三十餘里梵經一由旬謂四十里按轡清晨度廣仁嶺名在山莊西闤闠至今踰萬户萬家煙火隨民便皇祖詩句也蒼黔自昔仰時巡撫兹敢懈繼繩志眷彼依然樂利民更有豫衷深幸者山田欣閲屢綏頻出麗正門恭迎皇太后駕至避暑山莊作一日後違八日遲啓程之日後一皇太后至湯山駐蹕故逐日程至今凡八日矣不眠數問夜何其欣知此際臨安輦恭迎去聲先期候野達曰喜真成莫大喜如斯實願萬年斯康強福夀誠誰並祇以德崇用受禧仲秋啓驆木蘭行圍之作仙莊彌月駐行旌時屆秋搜此啓程車馬蕭蕭指北塞􅎟禾栗栗報西成雞鳴犬吠山村接鷙臂盧牽獵士迎習武朝家有常度遵循詎為去聲恣逰情木蘭回蹕至避暑山莊恭問皇太后安郵章雖悉起居便邇嵗圍期每趲前定省顧違草餘日豫遊願奉萬斯年亭臺總是長生境鶴鹿皆成不老仙退憩巖齋誠慶慰罨忩紅緑繢峯妍入古北口九月十九日秋暖今年實異哉入關路更潤無埃黃華把憶重陽過緑樹看從塞外來每嵗關外樹葉黃落入關始見緑樹今秋關外樹色尚緑故云菘薤尚留畦町上聲蔚􅎟禾已納圃場堆村民頗有逢年慶却廑畿南慮幾回今嵗畿輔髙阜處仍屬豐收自哨門至關內沿途景象頗佳惟京南瀕水州縣秋雨稍多有積潦成災者深為廑念三十三年七月癸巳上奉皇太后啓蹕巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫降旨蠲免所過地方額賦十分之三丙申出古北口己亥至熱河行宫庚子上詣廣仁嶺恭迎皇太后駕至熱河行宫壬子上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉等茶果凡三日八月丁巳復賜王公大臣蒙古王公台吉等茶果凡七日丁卯上侍皇太后膳賜王公大臣蒙古王公台吉等宴戊辰上萬夀聖節詣皇太后行宫行禮御淡泊敬誠殿扈從王公文武大臣官員及蒙古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉等宴凡三日辛未上啓蹕巡幸木蘭皇太后仍駐熱河行宫己卯駐蹕都穆逹烏拉岱蒙古王公等恭進御宴閲馬戲行圍殪虎駐蹕鄂爾楚克哈逹九月壬辰駐蹕張三營賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯乙未回熱河行宫恭請皇太后安辛丑上奉皇太后自熱河回鑾甲辰入古北口丁未上奉皇太后回圓眀園御製詩己丑恭奉皇太后幸避暑山莊御園啓蹕之作入秋三日屢逢晴撰吉平眀啓綵旌緩奉安輿循後宿例驅柔轡肅前程輕風楊栁迎頭爽濃露郊原蓄目清足博慈顔倍歡豫勝常禾􅎟逮西成出古北口塞隘近如國北門棲巖底事整頺垣闠闤列肆無征賦一百年來沐厚恩古北口雖設宫詰察行人而於商旅往來例不徴𣙜百餘年來人民樂業關城貨肆日益繁盛綵亭預祝貢輿情提督王進泰奏古北口兵民以明年為朕六旬萬夀籲陳綵亭預祝因其事已成且無煩費姑聽之不説由來事已成且喜未曽費物力碧天雲淨朗秋晴是日晴明既利行程亦不致霑漬鋪設也縈紆石棧嚲鞭過蒼緑千林鎖髻螺色合國言紐幹哩金語與本朝國語相同而漢字金史地理志載古北口國言曰留幹嶺義無可釋音亦不協因思國語謂蒼緑色為紐斡哩當時或山樹命名漢人不曉金朝言語妄為音譯展轉成訛今命釐定金國語解特為舉出以正其謬乃知金史譯成訛出關例看秋成好今嵗秋成倍往時迎駕有來諸扎薩北東言更勝於斯關外山田秋稼多稔今年倍勝於常而科爾沁敖漢諸扎薩克王公等至此迎鑾僉云迤北迤東各部落田禾景象較尤豐蔚至避暑山莊即景成什萬家列肆接闉扉駐熟山莊到若歸一路飽看秋稼好千峯疊矗曉雲稀今而來似昨而去旰以食仍宵以衣永佑寺名層樓神御奉處瞻先敬寫心依寺傍有寫心精舍出麗正門恭迎皇太后至山莊敬成長句志喜廣仁嶺名在山莊西經之皇祖所賜額為必路西望是瑶池王母雲車降此時泛灑昨宵霏細雨晶眀清曉霽髙曦三秋有象供怡豫四海無央祝夀祺食履倍康逰攬健歡承慈訓永來隨木蘭行圍熱河啓蹕之作度節行秋獮邇年率以八月十六日啓程往木蘭詢安便啓程仙莊數入聲南望寶稼逮西成過雨千溪漲烘晴萬嶂明中關行宮地名午前到咨政慎權衡至避暑山莊恭問皇太后安即事志喜行館凌晨發山莊傍已臻加豐慈體豫至樂慕懷伸日影忩延暖秋園氣藹春萬年結心願如願籲天申入古北口作今年秋暖長候不限邉墻關外樹仍緑籬根花始黃優膏後微欠今嵗關內外秋稼極為豐茂惟七月以後雨澤略欠霑透收成未足十分而口內秋麥亦因地土稍乾未能一律翻種奢望未全償更繫豫懷者稀看宿麥芒三十四年七月戊子上奉皇太后啓蹕巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫降旨蠲免所過地方額賦十分之三辛卯出古北口甲午至熱河行宫乙未上詣廣仁嶺恭迎皇太后駕至熱河行宫丁未上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉等茶果凡三日八月辛亥復賜王公大臣蒙古王公台吉等茶果凡七日辛酉上侍皇太后膳賜王公大臣蒙古王公台吉等宴壬戍上萬夀聖節詣皇太后行宫行禮御淡泊敬誠殿扈從王公文武大臣官員及蒙古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉等宴凡三日乙丑上啓蹕巡幸木蘭皇太后仍駐熱河行宫丙子行圍殪虎駐蹕按巴鳩和洛色欽九月辛巳行圍殪虎駐蹕薩爾巴里哈逹壬午駐蹕按巴鳩和洛昻阿蒙古諸王公等恭進御宴閲戲馬癸未行圍殪虎三駐蹕烏蘭哈逹丙戍駐蹕張三營賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯己丑回熱河行宫恭請皇太后安乙未上奉皇太后自熱河回鑾戊戍入古北口辛丑上奉皇太后回圓明園欽定熱河志卷十九
