body:
  text: 行宫十三觀瀑亭食蔗居觀瀑亭山莊崖館雲阿深林穹谷咸以瀑流增勝實者其聲空者其色及泝流窮源則乳竇穿空雲根吐溜瓊簾懸注泉立峯飛搆亭山麓聖祖御題額曰觀瀑㳟繹御詩以觀括聴從色覔聲所謂目謀耳謀心謀神謀者一以貫之觀之時義大矣山半有亭御書瀑源二字由是再陟則笠雲亭倚空側立如溟濛烟雨青笠伊紏也御製詩觀瀑癸亥天籟豈徒風地籟無過此松篁不敢鳴琴筑那堪比清聴既云暢塵心一以洗却似南華仙萬物歸秋水瀑泉相問答各唱于喁聲跳珠出浦圓垂虹掛川晴飛鳴集鸂鶒躍戯濳鼯鼪佳景擬圖畫圖畫豈天成誰將洗頭盆從空輕拄倒懸崖界翠屏赴壑梳文藻因心悟色形入耳蠲煩惱對此娯清暇静理恣探討危亭架波上波影漾文檐颯㳫誠可聴澄澈亦足欣濺衣借微風飲鹿當夜蟾分明洞天路只隔水晶簾雨中對瀑乙丑塞山作雲雲滿空蒸為靈雨飛濛濛雨師谷神豈有柄誰實司之造化功早稼益實晩苗秀高原下隰均芁茂最是呼鷹牧馬場至今猶識耕耘候喜雨歌餘知雨奇耳目眎無不宜就中對瀑擅佳趣妙色真聲兼占之飛泉得雨聲愈壯驟雨飛泉色相向渾似水晶宫裏遊即之轉離為想像聴瀑再作虚亭對懸厓珠簾垂我戸到此輒坐忘泉石誠太古天公助佳景霏以清秋雨摩詰畫不得成連未及譜誰能悟真聲共汝以耳覩雨中對瀑之作膩雲四合傍峯低借助飛泉繡壁西可是山靈人解意每教秋雨凑詩題前年駐此亦有雨中聴瀑詩琴音上下聴來合雪色繽紛望裏迷石鼎烹雲纔片刻即看新水漲前溪色色聲聲總淡如悠游而眺静聴諸不經意作吟無盡恍可人懐會有餘跳沬錦鱗依石岸飲泉蒼鹿下林閭賞觀㡳事登廬阜妙䖏當前實起予聴瀑己巳雨後來聴瀑淙淙響益繁大都得之耳惟此不為喧赴澗來鳴鹿攀林飲渇猿山中足佳趣難與俗人言聴瀑辛未濺瀑落巖鳴清機愜静聲寒垂一條玉虹掣九秋晴亂㸃侵危石澄光襲敞楹寒山千尺雪假藉若為名瀑布繡屏開紫翠珠箔滴琤琮不舍赴川勢難尋出竇蹤光争晴雪落聲帶晩煙㫪可飲去聲書牌鹿每於松下逢對瀑壬申漫數香罏復吕梁紳垂萬仞闢鴻荒侈聲嫌柞弇聲鬱玉色猶温雪色涼無間斷惟赴谿勃有形容亦隠煙光詩人南國多雕繢仙境伊誰合品詳聴瀑癸酉瀑聲常認雨雨裏瀑偏奇纔識空摹擬不如真者宜煙絲及珠㸃離奇互上下寄語倪黄流此景若為寫聴瀑癸酉謂當雨裏無過矣可識晴來更恰然白界翠屏迂緩畫律和聲瑟沅湘絃秋心宛在水精域煙色遥開玉塞天今日始知謫仙句妙因霽後對前川觀瀑虚亭搆沙渚懸流落石激奚啻供耳謀實堪恱目撃繽紛濺磯迸斷續盈科滴似張匡廬圖誰面少室壁今朝大快意覩近勝聴逖對瀑甲戌虚亭臨崎岸􅥼濈落深流千澗初過雨四牕颯似秋花香紅錦亂樹宻緑雲稠欣遇多殊狀新題觸興投觀瀑乙亥耳聞所弗及目視皆能窮所以般若諦眼冠去聲六識中虚亭懸睿藻聖意契禪宗偶來閲清暇坐對飛銀龍淪漣並激湱錯落皆真空詎惟聴何有乃至觀亦忘叶勒句鄰昔題會心復不同雨中觀瀑丙子湧翠巖邉水閣宜清秋雨共瀑簾垂澄觀契妙恰於此摛藻成吟又一時㸃滴難分光上下溟濛一合相然宜是聲是色是空寂今昔何須每繋思雨中觀瀑丁丑懸溜石林表天然大壑叢落來不離即接上祗空濛聲色歸真静襟懐冺異同靈源定何處左右白雲中聴瀑二首戊寅振鷺飛泉落野灘閒亭有暇每觀瀾世間無物可形狀滿耳仙韶滿目寒西壁懸流也自奇東來野水滙成池南人只道邉闗苦北地何曾知合詩觀瀑己夘非聲亦非色宜視復宜聴一道界開白兩峯相對青濺崖猶磊落滙浦自清泠何異臨川上堯思即孔庭瀑源瀑簾常目前瀑源久心孔會須一窮探散步循巃嵸石棧左右移木彴鎖其隴如此經千曲上皆翠雲籠叶疏隙時見天坐井觀同覂崥崹平轉邃嶊崣擴復攏歴爾許剏見乃得天池滃鍾乳出縫罅棘蔓或閼壅闗鬲稍疏治放乎流益􅍅掃苔坐俯澄弄影浮雲動乃悟地中行自下視如聳居高詎忘卑獲奇在賈勇香罏三千尺亦自足底湧對瀑庚辰昨夜秋雨飛千山湢湱颯沓喧岡巒隔牕簷溜已落瀑真瀑翻在想像間今朝快霽澄浮煙是聲皆寂惟瀑懸乃知幻者有作歇何如真者恒當前我每對瀑率得句欣茲會心有别趣四柱虚亭百尺崖讓他常住無來去對瀑六韻飛瀑我常對所欣對以冬挂來氷筯簇流處氣機濃從識根源逺不遷節令逢微聞聲颯沓畧戢勢㳙淙落磵鹿猜飲入池魚罷喁洗頭宜玉女應律逮黄鐘觀瀑辛巳虚榭又來憑飛泉恰絶勝喧於聞處寂素與望中􅊹六律渾非樂一條都是氷自詩自成和差免誚徐凝對瀑壬午對瀑嵗有吟今秋尚闕寫憑欄眄振鷺落落凌空下潦盡沙灘露流壯石峽瀉有本與無本於斯可悟也適從瀑源來足底涓涓者觀瀑癸未瀑於聲為聴瀑於色為觀不曰聴曰觀其義何所安聖意引未發從得窺一端觀音有大士聴色無耳官是觀可括聼聲中覓色難垂巖活活者滿目鳴氷寒對瀑癸未明知源在處引逺頓殊觀訝似從空落聲猶帶樹端其喧皆至寂既聴復宜看底識秋來對音中增峭寒題瀑源亭子癸未山中此瀑源乳竇注潺湲自逺梯巖引從空劈峽奔亭無心可洗今與古休論高謝康王谷千秋嘖有言雨中觀瀑甲申隨山疏咉咽瀉澗垂幡纚何時不宜觀最宜觀雨裏與淙淙色色聲聲美接上疑有根落下復無底一合相清真那可以言擬觀瀑乙酉耳目皆心官宜聴者自合宜觀又曰百聞曾弗如一見所以六根惟眼居耳前是則觀瀑之語具深義豈徒偶爾徴言詮嶤峯快霽生紫煙千尺飛瀑當秋懸晶光上下㴸網水坐令神心濾滌毛髪寒徘徊著語那可著不空色界還忘看對瀑丙戌一年一對瀑對瀑必成吟興自番番異聲因落落斟宜晴亦宜雨非石復非金設使伶倫叶犂然中去聲八音觀瀑二首丁亥激謞出峽落偏幡水樂八音會以繁却是耳根輸眼界適從峽上見其源源頭纔見細涓涓落脚旋看萬弩懸不以耳聴以心會畧從家語識真詮觀瀑戊子瀎潏擘澗垂飛虹響鍧渒金石同是聲是色非聲色觀瀑即以為觀空直注旁濺勢未巳咫尺亦須論萬里却悟適從瀑源來一線細流潺足底觀瀑二首己丑盈科後進本無争激作飛流便怒鳴偶此憑欄心有會大都物貴得其平秋風八月葉微黄不獨臨流始覺凉設使横琴膝上寫居然音亦中宫啇瀑源壬辰淙淙足底濆上聲輕絲注下丈餘成小池復㡬曲為落崖瀑金人銘背意如斯觀瀑谷裏瀑源谷口瀑里餘髙下頓殊觀誰知曲注隨來者砏汃飛成滿意寒謾説康王百丈懸迸流何處境非仙庚寅辛夘都闕詠是二年皆未於此觀瀑不可今年再置㫋對瀑二首癸巳幡練影随風颺上下鑑光與日明却是依然落崖水今朝忽爾作秋聲飛峽龍拏雪浪皚等閒應訝九天來瀑源適甫縁谷䧏因識原淙脚㡳纔觀瀑甲午曰觀曰聴義相生聖藻題檐别寄情記得髫齡承眷處至今不斷爾時聲觀以其形聴以音兩般雖異總由心設將心向瀑中覔逺矣失之何處尋觀瀑乙未遙源引水來遇峽懸流落不言聴言觀聖意别有託聴在音摐然觀於色澹若一動而一静是理宜斟酌觀瀑丙申屧步溪廊遂至亭垂流擘峽落溪渟高懸聖藻曰觀瀑可識觀中即具聴石泉逺引石崖沿到此宛成尋丈懸都大世間驚耳目半因人力半天然觀瀑四首己亥晴瀑飛擘蒼崖落碧川晴齋忽看掛簷泉偶然憶得青蓮句日照香爐生紫煙雨瀑助得天龍噴雨絲相應律吕奏來宜漫云是水不洗水合相試看接上時月瀑輞水淪漣空不空玉輪相映正於東僧繇妙蹟石渠弆張僧繇夜月觀泉圖為石渠寶笈上等笑我無端亦畫中風瀑解添新爽濯婪炎便有微風亦不嫌飛㸃無過畧傍灑那能掀起水晶簾觀瀑庚子瀑聲宜聴狀宜觀聴在匉訇觀在瀾今日會心於孟氏縱其横者溯雲端錯落鏡中無定態淪漣網裏有恒聲邇來晴久畧望雨認作九天嘉􅒴傾觀瀑壬寅聴逺觀為近耳目力各殊目官司色也耳官則聲乎逺聲雖早聞清濁本一模近色縱遲覩妍媸差弗誣以是較觀聴觀為親切夫聴言要觀行宣尼示良謨而吾於觀瀑仰緬聖同符笠雲亭癸巳虚亭因迥畧夷嵏千里塞山望不窮一片間雲飄若笠副名端自勝吴中寒山千尺雪之旁有笠亭儼然草笠結緌太嫌著相茲則虚亭冠於山椒循其名而不襲其貌差覺勝於呉下耳食蔗居聴瀑而尋其源縁山取徑繚繞數折乃至食蔗居凡三楹松林峪之深境也未至十步不見屋角及巖齋乍啟周覽徬徨則萬象森羅如臨戸牖盖徑既幽迥地復髙敞奥如曠如轉深轉妙題曰食蔗取其漸入佳境云爾左二楹額曰小許菴右有亭曰倚翠東北山亭曰松巖御製詩題食蔗居辛巳食蔗末益甘是居有若是石溪㡬轉遙巖逕百盤裏十步不見屋見屋到尺咫攀磴坐南榮縱目在千里信馬去秋得斷手今年矣三間與剏名萬象該精㫖此無警句酬想乃無其理再題食蔗居辛巳迴峯絶澗厯千盤精潔山居峭壁端身世蕭然滿秋意大官休說有漿寒面臨幽谷背層峯峯上蒼蒼多古松我故無心學仙者也疑佺羨此間逢食蔗居壬午循流探谷源以漸入佳境得居名食蔗虎頭趣自領因迥易為髙憑軒目堪騁紅紫萬嶂紛青松獨崇嶺品奇託亦殊于于意為去聲永食蔗居癸未山居猶在瀑源上谷夐巖深颯似秋若謂無端秋令到如何滿座翠隂流食蔗居癸未勅㡬既得暇問山亦當秋秋意方始來欸欸而猶猶有風必含涼無巒弗抱幽經此凡㡬曲乃造巖之陬倚巖數間屋望如緑樹頭穿樹拾級登又如坐虚舟耳目之所食不竭與静謀寒擬玉壷冰彼漿更藉不食蔗居甲申山莊居數日食蔗此初來一以暇少耳一以成久哉喜新吾猶然厭舊人莫咍如言幽實幽能不片晌陪食蔗居乙酉小小山居藏委宛趣佳咀嚼正無窮空林行不見門徑祇在峯遮崦邏中食蔗居丙戌深谷窮其源既狹峯陡止頗如食甘蔗至末益最美巖居有如是題名乃所以搆成四五年亦覺慣經矣山莊到六日趂暇方來此然豈害致佳幽夐故爾爾食蔗居丁亥食蔗漸入佳自尾至於本山居有如是因委達源逺設無攀陟勞安悉精微藴出幽得極豁攬遙幻若近詎惟遊暢哉萬理堪斯準食蔗居戊子幽居在深谷曲棧歴千盤雲林夾兩崖翠流青復攢肩輿凡數息乃始造其端行亦覺㣲勞到則得所安為學及莅政率可絜矩觀天風謖然落夕陽隠西巒襟袂爽涼披如食蔗漿寒題食蔗居己丑一徑尋山岨千峯落夕陽棲巖原有屋問景可憑牀鴉影背翻現蛩音脇鼔藏心神滿涼意奚用大官漿食蔗居辛夘委宛藏山佳居因名食蔗尋鹿探窈深偶此憩巖榭既狹復豁開誰能窮變化天花落石壁謖濤在松架衣袂颯生涼漿寒底須借食蔗居壬辰㡬日駐山莊山居茲始到一慮輿人勞一待驛章告今朝頗爽涼况已閲閣報乘暇此探奇取便因尋奥谷狹源漸窮崖平屋堪造寛弗出十笏静實具千妙於此度小年那復知塵閙尋思所無逸未易從吾好食蔗居癸巳言欲尋歸路碧山猶㡬重遵蹊䧏幽谷得室倚髙峰何不可為憩依然似始逢隆中樹易長上聲階下有喬松食蔗居甲午徑幽弗屢至居迥稱間憑月牖延眸望雲梯拾步登俯臨極寥廓背峙尚崚嶒林際飄絲雨言歸亦恰應食蔗居乙未言自西峪旋縁嶺可降諸山房棲翠㣲精小别一區憶從剏得時顔曰食蔗居寓意取虎頭漸入佳境夫山莊駐逾月今朝遊以初撫座試思義顧名了未殊食蔗居丙申西峪晩言旋山居路左便問溪仍詰曲㩀榻小流連颯景宜今日隙隂憶去年每於末後至食蔗意存焉食蔗居己亥犖嶨衆峯攢山居三架安來盤千澗曲到憩一壷寛味固甘無盡景因静可觀壁題隔兩嵗其故欲言難食蔗居辛丑居據巖谷最深䖏嶺環溪抱殊䆞窱今朝風日喜爽涼便命肩輿試遊到既狹乃曠迥怡神得逸於勞俯而眺林姿峯態報新秋景謐心澄惬觀妙設曰食蔗至末甘月餘始臨亦相肖食蔗居壬寅將謂斯為最深矣西北巖壑深邃庚辰秋信馬得之是搆是居辛巳落成有食蔗末益甘之句因以名之侵㝷西北更深探秀起碧静諸堂皆成於此後而更在西北肩輿乘興一偶到綴景問心多所慚尾美究欣窮處好漿寒頗覺伏中堪回看碧静難尋静應讓山居為去聲指南小許菴辛巳食蔗居旁小許菴更難小矣大偏含擬於方寸猶為大可識名言總戱談小許庵口號壬午十笏為庵静以便底從名象較言詮納來芥子應無數何啻三千與大千小許菴癸未物外為遊大小肩東坡見說記超然恰如秋景方稱稚世界三千一氣全小許菴甲申兩間巖屋可稱菴虚受朝霞與夕嵐設向南華齊小大須彌棗葉亦閒談小許菴丙戌食蔗祇三間小許更減一聞之繋𫝊言君子退藏密方寸能㡬何萬有於中出何當去安排斯焉養静謐小許菴丁亥小許居然得號菴可知大亦此中含漆園苐二篇如讀較量由來是戯談小許菴戊子芥子須彌幻變更髙談且置聴常評世間大者應無數何一不從小許生小許菴己丑山菴小許頗堪棲一過何曾此久稽設向其間論空色是為楊葉止兒啼小許菴辛夘涓涓水與星星火昬暮叩門有必資小許由來成大用使如菽粟正難之小許庵壬辰剷削巉巖築小齋千奇萬變月牕排恰如真率王懷祖勝得多多許自佳小許菴癸巳每來必少坐松疏獨以小稱妙有餘試問世間云大者誰能不自此權輿小許菴甲午四面好山一室青不嫌十笏為延停因思何大非由小即境瞿然欹器銘小許菴口號乙未小許寧云玩景徒瞿然别有會心殊試思萬事善與惡孰弗因其小始乎小許菴丙申松軒兩架俯巃嵸拾級迴廊宛轉通莫謂巖菴祇小許開牕攬景亦無窮小許菴己亥昔來小許菴意每謂其大茲來小許菴意乃别有會大含小固常小致大堪戒不必談禪理實宜味儒話儒話古有之謹小慎微戒小許菴口號辛丑小為萬姓總林林許以不知不識心此景唐虞世乃有艱哉至矣惕而欽小許菴壬寅豈闗問景與探竒容膝以安静以宜行已立身如絜矩慎㣲謹小亦應思倚翠亭辛巳虚亭倚巖壁翠色迥含秋恱可容雙膝遙宜縱逺眸老松自古獨衆木尚隂稠杜句雖恒憶謂賦詩何必多其如興每投倚翠亭辛巳窈窕廊通步虚明亭暢懷有牕安牡蠣著壁倚雄崖望去青霄近排來翠色佳寧云緬堯儉却是土為階倚翠亭甲申一間亭窈窕數仞壁嶙峋倚處若無地翠中寧有垠牕虚重去聲來凭廊轉適堪循畫裏伊誰格王家荷葉皴倚翠亭丙戌翼然亭子倚嶕嶢翠色連空影動搖徐識天風翻落下適來煩熱一時消倚翠亭丁亥搆亭倚傾崖開牕俯牝壑平陵出岫雲下視歸林雀萬葉尚張王二字皆去聲如張平聲緑油幕清供目之寓雅契心所託倚翠亭戊子笠亭倚翠微緑葉正幡纚開牕納長風虚明洞表裏旋旋日影移惜隂乃所以倚翠亭辛夘亭如倚翠峯峯亦與亭倚譬之色即空無彼安有此賓主了難分同異将奚擬交蘆辨見中一倒復一起静思悟其因所懼西風委倚翠亭壬辰峭壁聳􅣯幽亭倚蔥舊拾級造清迥巖谷都俯見雲歸白旋封雨過翠猶絢開牕似展畫據几欲抛扇底識塞上寒始聞黄鶯囀松巖辛巳孤亭四柱俯松巖巖上松濤了不凡七處徵心八辨見何如坐此悟楞嚴欽定熱河志卷三十七
