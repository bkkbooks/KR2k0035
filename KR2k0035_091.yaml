front:
  text: 欽定四庫全書欽定熱河志卷九十一
  hash: sha256:03e41cd1582cb39989f3539a6272df5f800969c4df728a4f000ac051401f245c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0035_WYG_091-1a, image: WYG0496/WYG0496-0429a.png}
body:
  text: 食貨熱河為古邊􅗲財用之式無聞我朝幅員廣逺民物阜繁舊於其地設七廳乾隆四十三年改設承德府領一州五縣申畫郊圻規模大備謹按洪範八政所先具列貢賦稅課倉儲户口條目志食貨第十九藏冰為幽詩所重並以附焉貢賦凡旗地每畝上則征銀一分四釐中則征銀七釐下則征銀三釐五毫民地每畝上則征銀六分中則征銀三分下則征銀一分五釐柴山每畝征銀一分園地每畝上則征銀二錢五分中則征銀一錢二分五釐下則征銀六分二釐五毫灤平縣香火民地征銀準民地下則例豐寧縣香火民地征銀準民地上中下則例其籽荒并基地征銀旗民地各準下則例承德府即熱河廳旗地八百八十六頃三十四畝有竒共征銀四百一十三兩三錢二分有竒民地二千零七十三頃二十三畝有竒共征銀四千一百一十三兩五錢七分有竒灤平縣即喀喇河屯廳旗地一千二百九十三頃六十三畝有竒共征銀五百零八兩三錢五分有竒民地八百七十九頃二畝有竒共征銀一千五百六十八兩七錢四分有竒平泉州即八溝廳旗地三千四百三十四頃三十五畝有竒共征銀三千一百九十五兩三錢六分有竒民地四百三十六頃九十三畝有竒共征銀九百零九兩九錢一分有竒豐寧縣即四旗廳旗地一萬二千一百七十七頃四十一畝有竒共征銀九千一百一十五兩三錢八分有竒民地五十二頃二十畝有竒共征銀七十八兩三錢有竒建昌即塔子溝廳赤峯即烏欄哈達廳朝陽即三座塔廳等三縣無額征旗民地其所屬各旗地俱由王子貝勒公札薩克等交民人佃種取租稅課承德府每年額銀五千六百九十八兩五錢五分有竒灤平縣每年額銀三百零二兩四分有竒豐寧縣每年額銀二百三十兩以上三處由該府縣經征儘收儘解交直𨽻布政司庫平泉州每年額銀一萬一千五百一十二兩六錢附收龍鬚門額銀一百一十七兩六分有竒小子溝銀一百七十五兩八錢二分有竒建昌縣每年額銀五千九百八十二兩八分有竒附收大城子額銀二百三十五兩一錢七分有竒赤峯縣每年額銀一千八百三十七兩九錢八分有竒朝陽每年額銀一千四百四十七兩四分有竒附收木頭城額銀三百七十四兩三錢三分二十家子額銀一百七十兩三錢五分以上一州三縣由理藩院奏派司員征收除稅局支銷并奏請恩賞各札薩克銀兩外餘悉交部解納倉儲承德府額貯穀二萬六千八百一十九石有竒灤平縣常平倉現貯穀六千六百九十五石有竒又鞍匠屯倉現貯穀八千五十石平泉州額貯穀一萬五千三百七十四石有竒又廣裕倉存貯八萬三千四百五十四石有竒豐寧縣現存穀二萬四千六百六十七石有竒建昌朝陽赤峯縣三縣無額征地糧並未建倉户口承德府現在户口共計八千九百七十九戶男婦四萬一千四百九十六名口灤平縣現在戶口共計五千二百三十户男婦一十萬六千六百三十二名口平泉州現在户口共計二萬九千三百十五户男婦十五萬四千三百零八名口豐寧縣現在户口共計二萬零八百七十一户男婦七萬二千零七十九名口建昌縣現在户口共計二萬三千七百三十户男婦九萬九千二百九十三名口赤峯縣現在户口共計一萬五千三百五十六户男婦六萬一千二百二十名口冰窖承德府喇嘛寺原設冰窖八座豐寧縣中關波羅河屯二處各設冰窖一座灤平縣喀喇河屯常山峪兩間房三處各設冰窖一座平泉州建昌朝陽赤峯三縣未設冰窖欽定熱河志卷九十一
