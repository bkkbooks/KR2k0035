body:
  text: 水二潮河源出豐寧縣即四旗廳屬鑲黃旗大閣兒北七十里之城根營西南山下在縣治土城子西北一百三十里屈曲南流至大閣兒之東折而東南流復折而西南仍折而南龍潭溝水自西來會之又南流至岡子上共行縣境一百八十里入灤平縣即喀喇河屯廳之西北境徑哈什哈汛之東又南至椵樹嶺折而東南流至巴克什營之西復折而西南流共行縣境二百八十里至古北口關西之潮河川入邊至密雲縣境會白河即古洫水也漢書地理志白檀縣洫水出縣北蠻夷中亦名鮑邱水水經注鮑邱水出禦夷北塞中南流境九莊嶺東俗謂之大榆河又南徑鎮東南九十里西密雲戍西又南左道合人溪水又東南流白楊泉水注之又東南龍芻溪水自坎注之又東南出峽徑安州舊漁陽郡之滑鹽縣南左合縣之北溪水按漢志白檀縣洫水經注引以入濡水條下或疑洫字與濡字本相近然師古注肥如縣濡水音乃官反此洫水音呼鵙反不應一字兩音一水兩注知非漢書傳寫之誤乃酈氏誤引漢書也潮白二河俱係大川漢書於漁陽郡不應載沽水而遺鮑邱水以今方位考之白檀縣北之水大無過於潮河則洫水之即鮑邱水信矣夫潮河源在今豐寧縣境而漢志謂在蠻夷中桑欽水經謂從塞外來道元注在禦夷謂北塞中則斯地在當時本處邊外而非郡縣所及益可知矣又按密雲戍與密雲縣異後魏時已置有密雲縣而水經注但稱戍者其非縣可知密雲戍在禦夷鎮東南九十里與鎮甚近自當在邊外賈耽謂密雲去禦夷鎮幾九百里道元時六鎮已陷沒或傳聞之誤記載成訛蓋未知其本為兩地也御製詩潮河橋丁卯出口風增峭臨橋水疊波常年度清蹕昔日此潮河荒戍縈煙荔山田茁雨禾名言思守德觸景畏心多潮河甲申白河過浮橋厗奚厯迤邐潮河帶城南弗渡遵其涘近郭列市鄽枕堰非髙峙緩急何所賴尋思蓋久矣謀安民自知寧必更張屢叶洶湧奔新漲竹箭莫喻駛昨晚東北雷聞聲今見爾龍潭溝在豐寧縣即四旗廳屬鑲黃旗大閣兒東南五十里縣治土城子西南一百里龍泉山靈通寺之西南為潭者三第一潭過寺里許形如偃月南北二丈東西斜袤十丈餘過潭東南登山十餘步轉南五十餘步為苐二潭仄徑﨑嶇佝僂攀附乃得上潭徑三丈作菱角形懸崖嶄絶繞潭而南上下百餘步得苐三潭旁哆中狹略如銀鋌約徑二丈餘四圍林木薈翳俯瞰深碧隔潭南望水從石罅中出岔湧跳踐勢如激矢相傳每潭入水三尺天霽水澄了然可辨其斯為神虬之所宅也三潭髙下遞注由寺前石澗東南流十餘里入潮河清水河源出灤平縣即喀喇河屯廳南境邊城外西南流至墻子峪之北入邊下流入潮河按顧祖禹方輿紀要及顧炎武昌平山水記皆以為即古要水漢要陽縣以此得名蓋古要水本入鮑邱水即今潮河而不入濡水即今灤河水經注載要水于濡水條下者誤耳詳見建置沿革門方輿紀要又謂潮河亦有灤河之名乃因水經注之誤而曲為之説其實潮與灤河河判然二水不相假也乾塔河原出灤平縣即喀喇河屯廳南境邊城外西南流至黑峪關入邊下流會清水河按水經注鮑邱水自徑滑鹽縣以前皆當在邊外其所會諸水以方位計之道人溪水合孟廣硎水會鮑邱水當在今豐寧縣境白楊泉水出白楊溪注鮑邱水又龍芻溪水自注鮑邱水當在今灤平縣境今悉無可考惟龍潭溝水東南流入潮河似為左入鮑邱之道人溪然道人溪源流頗逺與龍潭溝亦不甚相類若方輿紀要謂道人溪水在密雲縣東北石􅌉峪源發龍門流徑縣界入潮河又以今之霧靈山為古孟廣硎以今之乾塔河為古孟廣硎水然水經注所載道人溪水距鮑邱水發源之處未甚相逺尚不應在邊城之內一統志原本謂水經注道人溪在禦夷鎮東此在石盤峪者蓋密雲縣境之小水而冠以舊名其説為是至霧靈山本即水經注伏凌山之訛霧靈山既不得為孟硎則乾塔河之為孟廣硎水亦未可據且乾塔河本先會清水河方輿紀要既以清水河為古要水則今之乾塔河或即水經注所謂要水出塞外三川並導之一源而又别以為孟廣硎水於義兩無當矣以上皆入潮河之水白河自獨石口外瑪尼圗達巴罕發源南流入獨石口徑赤城堡東流仍出邊至判官渡入灤平縣即喀喇河屯廳西境東流四十里至湯河口湯河自北來會之折而南流七十里至石塘口關入邊至密雲縣境又南會潮河即古沽水漢書地理志漁陽縣沽水出塞外水經注沽水出禦夷鎮西北九十里丹花嶺下東南流大谷水注之又南出峽岸有二城世謂之獨固門又南左合乾溪水又西南徑赤城東又東南與鵲谷水合又東南右合髙峯水又西南流出山徑漁陽故城西而南合七度水湯河源出豐寧縣即四旗廳屬鑲黃旗大閣兒西一百二十里十八􅌉嶺東之麻線溝在縣治土城子西北三百六十里南流至湯山有溫泉注之始名湯河又南流至大革坪之東共行縣境百餘里入灤平縣即喀喇河屯廳境又南流九十里至湯河口入白河洪湯寺溫泉源出豐寧縣即四旗廳屬鑲黃旗大閣兒西南六十里之湯山在縣治土城子西南一百八十里泉上建洪湯寺有浴池在泉側其水南流會湯河按水經注沽水自合鵲谷水以下始入今灤平平縣境其所載髙峯水髙峯戍東南城在山上其水西南流又屈而東南入沽水今湯河南入白河當即古髙峯水今之湯河口即所謂右合髙峯水之處也水峪河源出灤平縣即喀喇河屯廳西南二百六十里之道溝峪東南流至黃崖關外入白河白馬關河源出灤平縣即喀喇河屯廳西南二百三十里之火石嶺東南流至白馬關入邊下流入白河馮家峪河源出灤平縣即喀喇河屯廳西南二百九十里之恆梁南流至馮家峪口入邊下流入白河鞍子嶺河源出灤平縣即喀喇河屯廳西南二百五十里之鞍子嶺東南流至石塘口入邊下流入白河七度河俗名依度河源出灤平縣即喀喇河屯廳西南二百五十里之分水嶺東南流至大水峪口入邊下流入白河水經注七度水出北山黃頒谷亦謂之黃頒水東南流注於沽水按水經注載沽水之合七度水在漁陽城南今七度河入白河亦在邊城之內方位相合又眀成祖實録載永樂元年命武安侯鄭亨於七度河設煙墩候望警息即指此以上皆入白河之水英金河亦名英河源出圍場內都呼岱山會諸小水東南流出英格柵亦名英格河徑都呼岱山入赤峯縣即烏蘭哈達廳西北翁牛特境東南流一百四十里會錫爾哈河又東流七十里徑縣治之北又東流八十里徑察罕陀羅海溝之東入建昌縣即塔子溝廳北敖漢境與老河會東流入潢河即古饒樂水也後漢書鮮卑傳季春月大會於饒樂水上魏書太祖紀北征厙莫奚渡弱洛水班賞將士十六國春秋後燕録慕容寶襲厙莫奚己未北行庚申渡澆洛水距龍城一日程杜佑通典厙莫奚理饒樂水北饒洛水一名如洛環水遼史地理志中京在饒洛河水之南又髙州有樂河按饒樂水魏書作弱洛水十六國春秋作澆洛水通典又作如洛環水稱名雖有稍殊實一水也一統志原本以饒洛水為今潢河在英金河之北詳見後之别名考漢書注但稱饒樂水在營州北而不詳其里至然隨唐諸史皆以潢水為契丹所居而饒樂水别為奚地魏書太祖紀十六國春秋言因征襲厙莫奚而渡此水通典亦謂奚理饒樂水北則饒樂水之為奚所居無可疑矣唐書奚契丹列傳凡契丹奠長內附者皆封松漠府都督以平地松林在其國也奚酋長內附者皆封饒樂府都督以饒樂水在其國也地理志稱營州西北百里松陘嶺其西奚東契丹富弼行程録自中京北二百六十里至崇信館過崇信館即契丹舊境其南皆奚地是奚之疆域北不過崇信館東不過松陘嶺不得逺取契丹境內之水為奚之府名也且舊唐書于契丹傳曰居黃水即潢水之南於奚傳曰自營州西北饒樂水以至其國兩名分見知其必非一水而大寧以北之水源逺流長無如英金河者故知為古饒洛水也大寧為遼中京云在水之南則在水中京北境可知遼史又云髙州有樂河髙州南至中京一百四十里正當中京之北與今英金河之在平泉州即八溝廳北方位亦合若方輿紀要謂饒樂河在大寧衛北源亦出馬盂山其下流東北入於潢河今以水道論之發源馬盂山者惟有老河詳見後至英金河發源之處去馬盂山絶逺方輿紀要所稱蓋未盡可據也竒布楚河源出圍場北境界海喇堪達巴罕之東在赤峯縣即烏蘭哈達廳屬翁牛特右翼最西北境初名竒布楚色欽東南流沿圍場之東北界至竒布楚溝柵入英金河錫爾哈河源出圍場內會諸小水北流出納林錫爾哈柵入平泉州即八溝廳西北喀喇沁右翼境東北流徑赤峯縣即烏蘭哈達廳屬翁牛特右翼境又東北入英金河按此與會入豹河之錫爾哈河别烏拉岱河源出圍場內會諸小水東流出烏拉岱柵入赤峯縣即烏蘭哈逹廳西北翁牛特右翼境東會錫爾哈河錫伯河源出平泉州即八溝廳屬喀喇沁右翼西一百餘里察罕陀羅海山之東東流徑右翼旗之南又東北入翁牛特右翼境會錫爾哈河哈爾吉河源出平泉州即八溝廳屬喀喇沁右翼南四十五里北流會錫伯河卓索河源出赤峯縣即烏蘭哈達廳屬翁牛特右翼西境東流會錫爾哈河以上皆入英金河之水老河亦名土河蒙古名老哈穆楞源出平泉州即八溝廳屬喀喇沁右翼南一百九十里之永安山在州治西北境會諸小水東北流自大寧故城之西南徑大寧之東北故城又北流入赤峯縣即烏蘭哈達廳境徑翁牛特左翼南境入建昌縣即塔子溝廳屬敖漢西北境會英金河又東北流入朝陽縣即三座塔廳屬奈曼北境至喀爾喀左翼西北界出朝陽縣境共行五百餘里與潢河會下流為遼河即古託紇臣水亦名土護真水也隋書契丹傳當遼西正北二百里依託紇臣水而居唐書地理志長城口北八百里有土護真河奚王牙帳也奚傳依土護真河遼史地理志聖宗過七金山土河之濵因議建都又中京大定府有土河金史地理志大定府大定縣有土河長興縣三韓縣有塗河元一統志塗河源出惠州西北經州界八十里東北流入大寧縣南境至大寧縣東北境二百二十里入髙州境又東北流至行營草地即此葉隆禮契丹國志契丹有水曰北乜里沒里復名陶猥思沒里源出中京馬盂山東北流西華言所謂土河也顧祖禹方輿紀要土河自馬盂山發源經大寧衛南又東北流至朵顔衛境之木葉山合于潢水者是也米萬春薊門考大寧城北有老花母林即老哈穆楞番云大河也自青山流來繞過大寧城南往東北與捨喇母林即錫喇穆楞為遼水之西源合共入遼東三岔河按老河之為土河至今兩名互稱隋書稱託紇臣水唐書稱土護真水土護真水即託紇臣譯語之轉音遼金二史謂之土河為護真河之省文金史及元一統志又稱塗河則當屬轉音耳隋書稱契丹依託紇臣水唐書又稱奚依土護真水者蓋土河經流五百餘里發源今平泉州即八溝廳境流入今建昌縣即塔子溝廳朝陽縣即三座塔廳境當初發源時為奚王牙帳所在及東北流至潢河南則屬契丹之地正當隋遼西郡正北也一統志原本以古託紇臣水土護真水並為今潢河潢河詳見後之别名並據舊唐書安祿山傳討契丹至土護真河即北黃亦作潢河之文考舊唐書言契丹在黃水南若土護真河即潢河則既至土護真河即為契丹牙帳矣何以下文云又倍程三百里奄至契丹牙帳新唐書亦謂至土護真河晝夜行三里知所謂即北黃河者乃北即黃河之誤舊唐書契丹傳載此事云舊黃水南契丹衙與之戰新唐書契丹傳云大戰潢水南可為明證隋書稱託紇臣水在遼西隋遼西郡即營州今建昌朝陽縣舊塔子溝三座塔廳地正北二百里此亦指土河之在敖漢奈曼境者言唐書稱潢水在營州北四百里則託紇臣水尚在潢河之南相距二百里不得強合為一明矣又遼史地理志統和二十四年五帳院進故奚王牙帳地二十五年城之號曰中京府曰大定可見奚王牙帳在中京正今老河流經之地若以潢河為土護真河是逺出四百餘里之外與中京無涉唐書地理志漁陽郡下言古盧龍至奚王牙帳六百里又東北行傍吐護真河五百餘里至契丹牙帳正與今老河至潢河所厯道里方向相合而土護真河之即今老河無可疑矣方輿紀要又謂土河亦名溫榆河考遼史地理志稱奚部建牙當饒樂河水之南溫榆河水之北下文又稱聖宗土河之濱因議建都是土河過與溫榆河明非一水方輿紀要所稱蓋未盡可據也又按一統志原本謂土河之名始於遼時其前無可考證疑即水經注之白狼水今以水經注大遼水所會白狼水考之與今老河水道有難以強合者水經注遼水自塞外東流直遼東之望平縣西望平縣在今錦州府廣平縣東北境屈而西南流徑襄平縣故城西襄平縣在今奉天府遼陽州西北境又東徑遼隊縣故城西遼隊縣在今奉天府海城縣西境又南小遼水即今渾河在海城縣西北合遼河注之又右會白狼水至安市在今奉天府蓋平縣東北境入於海而於白狼水下復云東南流至房縣在今廣寧縣東南境注於遼是白狼水之入遼河在大遼水既會小既會小遼水之後將入海之前今老河之會潢河即大遼水之上源在喀爾喀左翼境其去古房縣甚逺且白狼水必當與古白狼山相近水經注稱石城川徑白鹿山西即白狼山也又東北注白狼水考白狼山在建昌縣即塔子溝廳喀喇沁左翼東三十里其距老河亦甚逺又水經注稱白狼水徑黃龍城東龍城故址在今朝陽縣東北之三座塔境亦非老河所行之道反覆求之無一可通者舊志乃謂老河經古黃龍之北與水經注白狼水合然水經注原文本謂白狼水徑黃龍城東而強改為北可乎至隋書契丹傳有託紇臣水而地理志又有白狼水唐書地理志有吐護真河奚傳有土護真水而又有白狼河兩河分見必非一水知老河之非即白狼水白狼水為今大凌河詳見後則水經注白狼水條下所徑白狼石城廣城諸縣地其不在今老河左右又不待辨矣竒札爾台河即老河之上流源出平泉州即八溝廳屬喀喇沁右翼南一百六十里在州治西北境東流合諸小水為老河呼察河源出平泉州即八溝廳屬喀喇沁右翼南一百四十里之呼察察罕陀羅海山在州治西北境東流五十餘里會竒札爾台河霍爾霍克河源出平泉州即八溝廳屬喀喇沁右翼南一百二十餘里霍爾霍克達巴罕之東在州治北境東南流一百五十餘里入老河布爾罕阿蘭善河漢名上神水河以左翼亦有神水河故稱此為上神水源出平泉州即八溝廳屬喀喇沁右翼南一百里在州治北境東流三十餘里入老河烏魯斯台河源出平泉州即八溝廳屬喀喇沁右翼東南一百里在州治東北境西北流入老河烏巴河源出平泉州即八溝廳屬喀喇沁右翼東一百五十里之哈特哈山在州治東北境西北流入老河伯爾克河源出平泉州即八溝廳屬喀喇沁右翼東南一百五里之喀喇和碩山在州治東北境北流入建昌縣即塔子溝廳屬敖漢西南境又北入老河納林崑都楞河源出平泉州即八溝廳屬喀喇沁右翼南九十里在州治北境東北流澆大寧故城之北共行一百五十餘里入老河松吉納河源出平泉州即八溝廳屬喀喇沁右翼南八十里在州治北境東流八十餘里會納林崑都楞河巴蘇台河源出平泉州即八溝廳屬喀喇沁右翼南四十里在州治北境東流會納林崑都楞河和爾圖河源出平泉州即八溝廳屬喀喇沁右翼東南十五里在州治北境東南流會納林崑都楞河伯爾克河漢名落馬河源出赤峯縣即烏蘭哈達廳屬翁牛特右翼北境在縣治西北境東南流徑布爾克爾圗山又東入老河金史地理志三韓縣松山縣有落馬河元一統志落馬河在松州北八十里發源州界鑼鍋嶺下流入髙州境一百里東入塗河按金之三韓松山縣元之松州皆在今赤峯縣境河名與方位俱相合金元史所載落馬河應即指此摩該泉源出赤峯縣即烏蘭哈達廳屬翁牛特左翼東南一百二十里在縣治東北境東流入老河崑都楞喀喇泉漢名橫黑水泉源出建昌縣即塔子溝廳屬敖漢東北九十里南流入老河玉瀑在建昌縣即塔子溝廳屬敖漢北境縣治北五五百五十里即老河之下流石壁髙聳懸為飛瀑土人名曰響水乾隆八年皇上東謁祖陵鑾輿經此賜名玉瀑御製詩觀敖漢瀑布水我聞奧區天所祕疑信向半今信然浩浩萬里沙漠塞乃有瀑水崇岡懸車塵方苦紛堨􅝙豁開壺裏别有天侵尋峰岫羅嘉樹漸潤澗谷無埃煙是時仲秋曝晶日忽聞雷聲殷前川坐令林巒失輕籟朗吟清眺萬慮蠲大者明珠小者璣如傾拷㧯投深淵虎狼駭走不敢飲下疑千載蒼龍眠巨石橫斷無土壤粵生美箭竒而堅山葉紅緑如錯繡無名野草相新鮮鸛鵠徘徊不忍去鼪鼯時向虬枝穿禹鑿龍門未至此胡乃三級限鱅鰱蒙古相傳瀑水以下鱗類甚夥而以上絶無亦甚竒云吁嘻泉石誠觀止賞咏自我羌誰先匡廬香爐無足喻山靈占此永不遷設置飛觴搦管地混沌竅鑿應難全朕恭謁祖陵至敖漢覩此巖懸水跳珠琮琤蒙古逰牧地所少也因名此水為玉瀑而繫以詩癸亥崇椒列巘點丹楓樹色煙容緑間紅始信人間無玉闕水晶簾內水晶宫却笑拘墟李謫仙匡廬當目便茫然飛流詎止三千尺絶勝銀河落九天沈沈碧潭毛髮寒琮琤不斷仙珮珊渾如白傅歌中句大珠小珠落玉盤清泄縈回受復斟忘筌對坐可觀音何須隱約求絃指已寫成連山水心玉名名瀑玉誰名名相由來總現成逝者如斯來不舍長懷尼父在川情寄題敖漢瀑布水我愛敖漢瀑布水今來路隔三百里題詩睫眼十一年乾隆八年東巡途經其下題長句大書磨崖今年取道迤東相距三百餘里故賦此寄題其後以紀嵗月飛注東流殊未巳以上皆入老河之水英金河亦入老河已提為綱故不復附老河下欽定熱河志卷七十
