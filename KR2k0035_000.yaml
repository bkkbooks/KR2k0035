body:
  text: 欽定四庫全書御製熱河志序為各省之志書易為熱河之志書難彼其以漢人書内地事且各府州縣本有晋乗楚檮杌薈而輯之其易也不待燭照數計而龜卜也熱河之志則以關外荒略非内地而遼金元之史成於漢人之手所為如越人視秦人之肥瘠忽然故曰難夫遼金元非若唐宋之興於内地而據有之也又其臣雖有漢人通文墨者非若唐宋之始終一心於其主語言有所不觧風尚有所不合且遼金元皆立國不久旋即遜出則所紀載欲其得中得實盖亦難之况紀邊關以外荒略之地乎其不能得中得實亦益明矣當今之時熱河之志不可不成者則以本朝荷天之寵百有餘年累洽重熙漢人已數世被覆載生育其語言風尚薫陶漸漬不可以遼金元之漢臣例之亦理之必然况我皇祖建山莊於此地非爲一已之豫遊實貽萬世之締構而顧可無書以垂永久乎山莊内本有温泉出而滙武列之水俗遂有熱河之稱兹雖為府為縣而仍以熱河稱之者存其朔便於衆也皇祖有詩云聚民至萬家葢篳路之際人烟尚少後乃閭閻日以富耕桑日以闢至於今將百年屹為都㑹皇祖雖嘗名之曰避暑山莊序詠三十六景而未輯志者其或有待耶抑亦文獻不足徴而遲遲為之耶山川里邑建置沿革與夫古蹟人物司事之臣雖捃摭遺逸猶有未備未信者其説具見於前而吾之序是書以行世者正所云在此不在彼欽定四庫全書欽定熱河志進表御前大臣領侍衛内大臣户部尚書臣和珅經筵講官户部尚書臣梁國治誠懽誠忭稽首頓首上言臣等奉勅編輯熱河志成書謹奉表上進者伏以乾元握紐九畿環紫塞之垣辰極恢紘三輔拓黄圖之版宅神皋而納爽别開薫館於仙莊臨朔野以綏邊肅奉秋田於御蹕環興安之萬嶂皆成采甸之疆導武列之三源特敞梁鄒之囿控膏腴於左部蹟擅金湯攷形要於中京圖陳竹素通都四闢提封連大漠而遥載籍重編數典記温泉之舊坤維壯色壁府騰輝竊惟景緯初分聿區斗野廣輪肇啓爰列禆瀛周官載紀職方班志詳疏郡道徴實則嵗時入記訂疑則風俗成書體裁並侈於曩篇規制相沿於雜志然而龍沙逺界猶仍荒畧之名鴈塞層開孰究邊隅之境築長城於徼外秦家之讓地已多通屬國於寰中漢室之分疆亦隘况乎炎基東造幕南不入方輿晋祚西遷冀北胥成外域郝旦諸蕃之内徙稱冦頻聞鮮卑刋部之分雄建庭漸逼逮乎慕容立國營都邑於栁城拓跋開基置安州於松漠而光壽建熙之後變故相仍孝昌武泰之間淪胥益甚是以前後燕之州郡舊鮮徴名東西魏之地形每稱寄治齊周隋三朝逓嬗紛争常在龍城奚契丹兩部同興錯處並依狼水唐設羈縻之府領蕃族而多淆宋修交聘之儀録行程而未備葢居檀薊平諸州之外詎能深悉方隅即在遼金元三史之中亦但麤傳經畫降自大寧之棄適當永樂之初割裂土疆盡入諾音三衛摧殘兵燹全虚富峪四城昄章久限於邊牆甌脱頓荒於戍壘厯稽簡牒殊方並阻幽遐遍遡垓埏今日同臻熙皞欽惟皇帝陛下功參覆幬治荗登咸吹玉琯以誠和海㝢應同風之律握摇樞而廣運星階聨拱斗之符辨位正方仰神謨之首出象功昭徳紹景運之丕承昔在太宗肇龍興於諸部粤惟世祖奠鰲紀於中原遂使玉障之封悉𨽻金城之宇我聖祖仁皇帝綏懐藩屬整飭邊防值久安長治之時厪肄武習勞之義修甫田於吉日虞衡匪侈遊觀萃靈囿於羣藩牧圉交輸誠藎雲軒屢駐名區成和㑹之都巖館初營勝境闢清涼之府揭雲霞之煥爛當年寳翰長留經雨露之㴠濡兹地編㕓益聚我世宗憲皇帝際承平之統増理事之官上塞輿圖悉𨽻神州之籍諸藩部落咸趨尉吏之符我皇上膺下武以承庥纉前文而展義龍光嵗覲期門羅七萃之儀鳯葆時廵仙苑駐六飛之駕每清塵之載道當滌暑之佳辰林巒則秀本天成亭榭則靈由地獻祥葩秀草皆符對育之襟瑞獸胎禽各繪恬熙之象愜宸遊於三十六景豫奉鳴鑾陳王㑹於億萬千年歡臚輯瑞若夫典稽表貉禮舉行畋羽騎齊陳獵場載啟金鞍耀日拂寳駿之三花玊纛捎雲映高牙之五色騐寥天之露重正逢呦鹿之辰乗廣漠之風高恰應祭貙之令鴻絧蔽野排隊伍之森嚴虎落連山括岡巒之起伏仰天弧之親挽百中稱神瞻御鞚之遥臨三呼効響加以威棱疊播風動濛池疆索宏開路逾瀚海慶雪峰之底定琛玉盈庭欣月竁之來同鐻鍝合部習朝儀於行殿封崇五等之班隨法仗於和門命扈三驅之典洎夫皇風普鬯佛日遐輝祀寳算於中天演法輪於後蔵耆闍䟦利通紫漠而徠賔兜率伊蒲譯丹書而獻壽頌曼殊之功徳慶洽聲聞廣震旦之宗傳懽陳舞蹈若乃封陲廣衍版藉充殷貨别千埸居環萬井名都對郭金墉分𦂳望之區上郡專城繡斧轄旬宣之使拓三邊而建治統壹旗㕔聫七屬以宣猷肇新州邑俗安耕鑿家餘高廪之儲化盛紘欹户有横經之彦育菁莪於阿澗壁水澄輝擷芹藻於宫墻金絲叶奏寵頒上舍捧縑而喜溢黌門額定賢書握槧而歡騰蕊榜際風聲之丕洽宜簡冊之旁徴特命廷臣肇修輿志俾蒐羅於文獻用審定於幅員前兹副稿臚呈已編摩之略具繼以綸言指示期辨訂之加詳葢邊徼之區分傳疑最易而舊聞之引据襲誤尤多在漢史唐書未及通其疆域即桑經酈注何由晰厥源流是以洫水要水之沿譌奉折𠂻於宸㫁灤河熱河之𣲖脈經考證於聖裁大綱既得所遵循餘𩔖各加之采訪臣等學疎汲綆職忝操觚朶殿趨蹌幸光華之近被旌門侍從欣典禮之親瞻爰披志籍以研搜更集圖經而校勘山川風土敷陳悉據奎章甲乙丹黄刋削謹承榘訓二十四門州居部次期鉅細之無遺一百廿卷𩔖别區分庶初終之畢貫𬗟天題於軒籙文成糺縵之華敷聖藻於虞絃響叶韶韺之奏省方問俗頌時邁以編年率屬歸誠紀綏徠而㑹極陳棟宇經營之制樂文囿於靈臺美山林蕃育之陬陋周京於甫草辨疆隅之分合越幽并而疊按經涂考建置之異同遡秦漢而厯尋障塞晷景星圖之逓騐燦若列眉山經水誌之旁搜瞭如指掌幸烝髦之蔚起治煥同文偉庠序之崇開規詳立學環衛重屏藩之守别舊系於茅封勝因閎刹宇之名創新模於蓮界設監樹長統臂指以承流置邏分營寄𤓰牙而飭備釐姓名於近牒仕籍駢羅徴治行於陳編官遊踵述人物則風謡尚朴士女貞良民材則食貨居先農商樂刹至若嘉生庶殖共入品題與夫廢壘荒墟俱經摭拾故事分詳厯代例起於兩都外記徧録羣雄名傳於各部彚羣言之斧藻式彰能賦之長集徃哲之緖餘亦備洽聞之助淹期載筆媿牋素之難窮計日成編幸汗青之甫就撫金甌而紀盛願綜括乎亥維章歩之墟紬石室以探竒欣擴充乎錐指管闚之識麋丸虎僕新成益地之圖馬服龍庭悉耀光天之治攷酉陽之奥籍裒地志於縑緗荷乙覽之親裁錫天言而弁冕伏願頒垂冊府宣示藝林賅形訓於九瀛軼寰宇太平之記待甄羅於四庫備熙朝廣内之儲庶㡬邁邱索之竒編圖増白阜入嫏嬛之秘録字煥丹函臣等無任瞻天仰聖激切屏營之至謹奉表恭進以聞欽定四庫全書欽定熱河志凡例一熱河以温泉得名自聖祖仁皇帝肇建避暑山莊人民樂育我皇上翠華臨蒞徳澤涵濡益臻殷阜近奉㫖改承徳府轄領州縣規制崇閎今志仍稱熱河名存其朔云一是書分二十四門曰天章曰廵典曰徠逺曰行宫曰圍埸曰疆城曰建置沿革曰晷度曰山曰水曰學校曰藩衛曰寺廟曰文秩曰兵防曰職官題名曰宦蹟曰人物曰食貨曰物産曰古蹟曰故事曰外記曰藝文每門各標小序謹識縁起一避暑山莊聖祖御題三十六景繪有成圖我皇上復增三十六景此外竒秀所鍾地靈日闢謹各系圖説其沿途行宫並依地臚次一木蘭周千三百餘里分圍塲七十餘所詳列全圖用彰靈囿之盛一建置沿革三代以前無考燕秦兩漢時在漁陽右北平遼西三郡邉外其分併之蹟畧有可徴晉宋間為慕容氏髙氏馮氏所據曽置郡縣元魏地形志所載多因前後燕之舊然其時郡縣境外地尚與奚契丹共之自隋迄唐仍為奚契丹兩部錯居雖建饒樂松漠兩府止虚示覊縻未能實𨽻版籍也逮遼金元始全治具地然史志沿革多以漢時邉内諸縣强移於外殊不足據自明棄大寧以後幅􅊷轉蹙不能逺有今所載自周迄明以列代疆域提綱於前以所引諸書分目於後復名加按語以證其是非同異庶㡬展卷瞭然一建置沿革首系承徳府屬全表以府州縣為經以厯代為緯復繪周泰以迄明代為十二圖恭觀分合用資考鏡一熱河境内遼金元皆置郡縣而三史地理志無里至可考方位莫詳今据元一統志考其四至八到所未備者叅以武經總要庶幾形勢向背道里逹近可約畧而得一自來地志合山水為一今境内之山各按府州縣分載而水之大者或連跨數百里若割屬諸境則源流未能明晰故從水經注例以大水為綱小水為目核其分合及所經之方向道里詳著之不必與山一例至於一府一州五縣山水大半發脉於圍埸有闈埸卷中已列其名而復著於山水門者不妨互見一熱河設立學宫敕建文廟以及考棚書院次第興舉規制美備並頒内府所蔵周時法物用光爼豆今詳具圖説以昭盛典一藩衛如喀喇沁翁牛特土黙特祭曼巴林敖漢喀爾喀左翼皆𨽻熱河境各臚列世系為藩衛表其内外札薩克非境内者不具録至察喀爾編𨽻四旗附入兵防門一山莊内寺廟皆奉勅建修其在山莊外者或建自諸藩以申慶祝或威示外徼以肅觀瞻邇年土爾扈特全部歸順則有普陀宗乗之建班禪額爾徳尼入覲則有須彌福壽之建尤為莊嚴鉅麗今各系圖説而以叢祠古利附焉一熱河官制我朝大備文職自教授以上武職自佐領守偹以上次其任事先後詳誌題名至前代官斯土者嵗月無考别為宦蹟一門一熱河全境秦漢以來在邊外為諸部分據未入内地疆域至慕容燕及北魏時始有建置可考今志宦蹟人物皆㫁自晋魏始一承徳府即熱河㕔平泉州即八溝㕔灤平縣即喀喇河屯㕔豐寧縣即四旗㕔赤峯縣即烏蘭哈逹㕔建昌縣即塔子溝㕔朝陽縣即三坐塔㕔今志仍於府州縣下綴注舊名以詳原委一引書以正史為據正史不足則旁引諸書如慕容燕始都此晉書所未詳者並採十六國春秋遼金於此設京元於此分路遼金元三史所未偹者兼採契丹國志大金國志及元一統志為證一邊外山水地名多䝉古語向無凖字我朝同文韻統切音精當舊時對音未合者遵加校訂至書中所引遼金元人地名亦俱遵新定三史改正以免沿習之訛欽定四庫全書史部十一欽定熱河志地理三都㑹郡縣之屬目録卷一天章一卷二天章二卷三天章三卷四天章四卷五天章五卷六天章六卷七天章七卷八天章八卷九天章九卷十天章十卷十一天章十一卷十二天章十二卷十三巡典一卷十四巡典二卷十五巡典三卷十六巡典四卷十七巡典五卷十八巡典六卷十九巡典七卷二十巡典八卷二十一巡典九卷二十二巡典十卷二十三徠逺一卷二十四徠逺二卷二十五行宫一卷二十六行宫二卷二十七行宫三卷二十八行宫四卷二十九行宫五卷三十行宫六卷三十一行宫七卷三十二行宫八卷三十三行宫九卷三十四行宫十卷三十五行宫十一卷五十六行宫十二卷三十七行宫十三卷三十八行宫十四卷三十九行宫十五卷四十行宫十六卷四十一行宫十七卷四十二行宫十八卷四十三行宫十九卷四十四行宫二十卷四十五圍塲一卷四十六圍塲二卷四十七圍塲三卷四十八圍塲四卷四十九疆域一卷五十疆域二卷五十一疆域三卷五十二疆域四卷五十三疆域五卷五十四疆域六卷五十五