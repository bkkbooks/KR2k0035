body:
  text: 行宫七頤志堂暢逺臺静好堂冷香亭採菱渡觀蓮所清暉亭般若相滄浪嶼一片雲頤志堂清舒山館之西數楹南向聖祖御題額曰頤志堂又曰光風霽月為㡬餘典學之所堂外磊石依岸澄波遶欄曲牖生涼明牕納爽其西有殿東向曰學古堂皇上紹庭稽古傳心聖學恭誦御製顧名思義益仰宸衷乾惕非特頤志典墳也御製詩頤志堂甲戌河亭迤北疎軒面爽皇祖題曰頤志堂陸士衡有言頤情志於典墳豈徒繕性保真之為適窈窕山深水復清虛堂夏五足怡情欲因致逺惟寧静匪慕嵇康自養生頤志堂屏峯曲抱林廬鏡渚清涵綺疏或牝或牡過鹿曰潛曰躍任魚枕流潄石非彼對時育物惟予悦目無過山水賞心祗有詩書頤志堂述事癸未聞之心欲安天君方泰然又曰身欲勞公旦無逸編幼齡扈蹕來勤政緬髙年勞矣亦安止動直静則專書堂額頤志而吾請進旃惟聖乃從心並行養實便吾方覺瞠乎祗有勵惕乾頤志堂甲申几有箋毫架有書設論頤志莫斯如尊聞又曰行如貴為是檢心恐負初頤志堂丁亥古屋水之涯年深景越嘉樹喬隂佈廣蘿静月梳斜跡印呼羣鹿聲傳反哺鴉承歡頤懿志此樂更無加頤志堂戊子溪堂碧水潯乘暇偶遊尋練影披前沼晶光蕩逺林雨過鹿留蹟風送鳥騰吟頤志固縁静仍當収放心題頤志堂庚寅頤志多芸籍當年樂縹緗仙莊好風日聖母駐徜徉即此怡神永故知取義長願言千萬嵗伴奐正無央頤志堂壬辰背巘復臨池溪堂愜静思慈萱避暑奉聖藻至今垂魚鳥化機適詩書古鑑披惕乾恒勵志便我取為頤頤志堂丙申頤志頤慈志額顔皇祖留教正即家法夀祝擬仙籌夏凊日方永山停水自流懿懷増豫者耆定奏功収頤志堂疊丙申詩􅸘己亥頤志頤誰志徒餘五字留丙申題頤志堂詩曽有頤志頤慈志及夀祝擬仙籌之句重來悲仰額空説夀増籌兩嵗景如幻一川水鎮流水流何所似似我涙難収頤志堂作歌辛丑昔日頤志尋無方言之猶自餘悲傷今日頤志不易得曰惟時若雨與暘頤者養也志欲豫然其豫也必有常隠居却掃非吾事吾之豫在萬民康恐作秋霖茲快霽額手西成或卜穰怵惕猶當厪半月再半月即為白露節無慮秋霖矣庶㡬黍稷登倉箱頤志堂作歌壬寅昔年頤志尋無蹤頤訓養也曽子養志難再同今時頤志殊艱致頤如意箕疇時若不易逢奎文輝煥猶麗榜敬緬當日兩事亦厪躬敢不聰聴聖訓勵寅恭學古堂戊寅樸室山水間軒篆題學古揷架富芸編觸目堪為矩近思孰挈要應是無逸所皇祖信得師我勉師皇祖學古堂庚辰當前即為今已過即為古今實不可住古亦無定所鴻荒與昨日未覺異爾許學古應如何我願於近取嵗嵗臨山莊聖日瞻仁祖欲從雖末由遑敢不力努學古堂辛巳信步過煙隄書堂隠石蹊奎文懸日月義路示端倪稽則心有獲議斯政不迷髫年今半百識訓耳言提學古堂壬午書堂帶水復屏山小坐心常恧此間勉學祖功猶未逮那曽學古有餘閒學古堂癸未太古此山寧獨似書堂曰學有攸聞聖人直示惟從政大塊由來亦假文揷架牙籖照今古開編芸氣吐芳芬問予切已應何在不出周書無逸勤學古堂甲申山静曽聞太古如書堂又貯古來書千秋興廢眀昭彼兩字憂勤益切予敢曰遊觀斯樂亟亦惟仁智議㡬餘説言原在務時敏訓注寧誇蟲與魚學古堂口號丙戊顧名書屋義還思師古非難難擇師封建井田稱善政效行後世豈其宜學古堂丁亥耕當問僕織問婢不學何殊立面牆在我寧惟資愽洽要應治理法虞唐學古堂口號己丑琴尚薫絃緬舜徽秋風落葉拂書幃與其學古寧學祖於此拳拳或庶㡬學古堂口號癸巳學古顔楣燦脚釵繹思别有會于懷井田封建寧非古師意弗師迹乃佳學古堂己亥石隄展步轉東廂緑樹隂籠學古堂説訓詎惟資廣博躬行祇覺意茫茫學古堂口號庚子服膺兩字勉修身猶恐能言行未純謂我學成無可學知他不識學之人學古堂口號壬寅學古由來貴學心典謨終始曰惟欽設無準酌泥去聲陳迹封建井田豈合今暢逺臺清舒山館之左因周垣舊基亘為長廊下依淥水有臺巍然聖祖御題額曰暢逺聨曰長對流光觀物性静中佳趣得天和每風日晴眀川原如繪登臨縱覽萬象紛羅俯察仰觀之樂備於斯矣御製詩暢逺臺甲戌清舒山館之東臨鏡湖為崇臺緑栁遙隄紅荷近渚牆外羣山羅列奔湊矯首遐觀斯為最暢崇臺湖上俯澄清暢逺新標即景名淵鑑當年超物表静觀萬𩔖入空明静好堂徑清舒山館後曰静好堂筠篁叢碧巘岫縈青堂外飛樓疎櫺四啟曰澄霽樓樓下堂室區分各系榜聨曰風泉滿清聴聨曰雲晴當檻碧山曉入樓青曰山水含清輝聨曰鈎簾雲霧生衣上當幌山川入鏡中曰髙山流水聨曰石激水流處天寒松色間曰岫幌聨曰日影飛花殿風文積草池並聖祖御書御製詩静好堂甲戌山莊幽䆳静如太古盖無地不然此間竹浄苔清覺鳥語泉聲都増静賞翠屏遮户静無塵􅋾􅋾階前長緑筠琴薦筆床都恰當想因翰墨緬風人静好堂庚辰趁暖搴帷萬象低霽煙歛盡朗撐犂䝉古語謂天為騰額哩漢書訛為撐犁然音韻頗近宜於塞外用之底湏在御誇琴瑟自覺當前契筦倪冷香亭静寄山房之側臨水東向曰冷香亭山莊荷花秋深未落與晩菊寒梅同韻伏讀御製諸什始知品異凡葩也亭北三楹曰峽琴軒與亭鱗次石㟁盤廻波淙響越水香㣲送雅韻鑑流渢渢乎如聞海上水仙操矣御製詩冷香亭甲戌方亭東向俯臨碧沼荷浄蘋香露白風清時冰心玉壺殆不是過四柱池亭繞緑荷冷香雨後襲人多七襄可識天孫錦彌望盈盈接絳河冷香亭己夘潦水寒潭蘆荻蒼汀沙白露欲為霜晩荷㡬朶支欹影風韻今朝挹冷香冷香亭壬辰亭枕蓮塘玩水芳十分花帶五分凉因之悟得遲禁平聲久兩字名真副冷香峽琴軒己夘流水風松静與皆嶧桐不操八音諧西山爽氣正當户東沼初陽又上階每憶虞絃歌復旦寧誇陶壁傲無懷懋勤慣是能供奉江硯宣毫率已排採菱渡湖之南有小舟可登舟北渡搆亭其漘曰採菱渡亭如一笠側影湖中每新菱出水與蓮花蘋葉相間庾肩吾所云上林紫水雜蕰藻而俱浮也亭後殿三楹聖祖御題曰環碧聨曰夾岸好花縈曉霧隔坡芳草帶晴烟御製詩採菱渡甲戍湖波澄碧水面多菱葉浮貼水背日花開佳實脆香與蓮房水芝並薦故取摩詰詩中語名其處菱花菱實滿池塘谷口風來拂棹香何必江南羅綺月請看塞北水雲鄉觀蓮所延薫山館西南崇亭傍水南向萬柄芙蓉涵光照影鷗浮上下魚戯東西山莊之蓮自闗内及敖漢來者諸景中多標其盛實以茲為最中懸聖祖題額曰觀蓮所聨曰能解三庚暑還生六月秋恭讀御製感賦諸篇洵乎山水炳靈承暉徹露天葩瓊蕊所由與衆卉殊矣御製詩恭瞻皇祖恩賜御筆感賦樂善堂集亭俯玻璃荷芰芳名觀賜書處蓮所孫枝獲侍聖人旁寸心已覺趨陪幸尺幅曽頒翰墨光羲畫軒書叨賜屢玉函金笥貯恩長只今空對宸章麗瞻仰徒迴九曲腸分隂宵旰萬㡬繁餘暇精神寄筆端運腕力如撐海岳揮毫形似舞龍鸞當年歡忭承榮賜此日依遲忍重看詎止宋臣飛白記涕流頻拭那能乾觀蓮所乙丑擷芳倚檻暫徘徊葉是仙盤花似杯不為靈根能駐嵗稱觥曾獻聖人來濯清偏稱過秋霖廿二年前未解吟一段横塘烟雨意好教他日驗斯今不染由來是染塵誰能拈出此花真秋風過處香盈袖暫許詩人對碧淪亭亭冩照鏡池寛徼露承暉意未䦨應是仙葩具神解每留顔色待人看觀蓮所甲戍平湖曲渚在在荷香景中以之標名者不一此間雲廊䆗窱方亭虚敞聖祖題額在焉洵為甲觀寳題恒煥聖人字冰牖仍憑君子花助感每教驚逝水追歡曽未泛流霞清暉亭如意洲東臨水一亭垂楊披岸亭角出栁隂中聖祖御題額曰清暉亭謝靈運詩所謂清輝能娱人也靈運工於賦景所云林壑暝色雲霞夕霏芰荷映蔚蒲稗因依歴歴清暉茲亭彷彿遇之璇題標舉名義彌新御製詩清暉亭甲戍虛亭臨水清曠絶塵宵月晨曦春林秋蓼揚輝絢目所謂清暉娱人恍然可遇水複山重静且便竒葩異草四時鮮始知謝客饒佳句擬學唐家度小年般若相清暉亭西精舍一區南向中奉佛像額曰法林寺内殿三楹額曰般若相皆聖祖御題左右殿各三楹後殿七楹地即雪山湖為香海色相皆空了然雙林説法處𣑽言般若此云智慧仰佛日之寳輪契真如之妙諦所謂翠竹黄花無非般若者矣御製詩般若相甲戌山莊清浄地有水皆阿耨無峯非靈鷲别剏蘭若奉妙莊嚴相當是踞獅子座説大般若經時雁堂小築竺招提獅子林如畫出倪無相相中真實相梵稱般若豈無稽滄浪嶼嶼不滿十弓而峭壁直下有千仞之勢中為小池石髪冐池如緑雲空由西嶺晨霞閣沿緣而下有室三楹牕外臨池四圍石壁空嵌谽谺豁閜後擔北向懸聖祖御書額曰滄浪嶼聨曰松生青石上泉落白雲間御製詩滄浪嶼甲戌山泉滙為湖沼澄泓見底孤嶼臨流悠然得滄浪趣緑洲朗潤蕙蘭榮日對滄浪之水清俯潔搴芳無限趣那更分别足和纓滄浪嶼戊寅澄泓半畆即天池池上疏軒四季宜疊石入波疑倒揷嵌楓經籟故紛披禽魚得所情含樂星月涵虛意想知此處本不常臨夜景更所未覩雅似御園畫禪室御園池上居又名畫禪室長夏恒憩息處是室似之一般摛藻搆吟思滄浪嶼己夘玲瓏壁罨牕淡沲池繞砌垂手可濯清舉目惟延翠空澄含峭蒨淺會皆神詣造物獨鍾秀於何勞位置縹緗展往訓自取慎所事滄浪嶼庚辰石壁圍峭蒨上有緑雲覆一泓貯天池靈源淙乳竇旱澇不乾溢神龍所䕶守叶詎惟託清濁兼可寄枕潄聖藻在簷端每來輒思舊滄浪嶼癸未洲嶼中間復有池搆軒其上臨階基坐而玩之淡神氣憑以鑒者數鬚眉曰清曰濁惟自取不盈不竭夫何為塞上風月伊千古檻前俯仰欣一時滄浪嶼丙戌㡬曲怪石森一泓止水浄有風亦漣淪無月不照暎牆圍鹿弗顧天空鷗下盟呌錦鱗長寸餘作隊相游泳坐玩几席上物物各適性纓足兩弗濯清濁無心競滄浪嶼丁亥池上書齋古渫然俯一泓牆圍辭鹿飲沼澈數上聲魚行澄影觀几席漪光翻梠楹緬懷聖人意原取濯纓清雙松書屋題句庚子辛酉初來拱把曽盤盤今見出檐層種松多嵗他有似閉户著書我未能舊屋新名原恰當撫箋題句亦相應􅕊年瞥眼如一瞬且與消閒暢攬凭雙松書屋階際撐雙幹塤箎伯仲兮閲年難與計隔嵗若相徯霜露那能犯滄枽可共稽僧機圖忽憶曽是賦夷齊木蘭僧機圖嵿下有喬松一根二幹逺望為兩樹實同本也因名曰夷齊松而係以歌至己夘重經其下則松已燬於火有嘆夷齊松賦雙松書屋壬寅伯夷聖之清叔齊豈不似如讀孟子書二老宛在此我偶坐謖隂聲色俱忘矣去嵗與今年由來不隔耳一片雲山莊在五雲中人間塵土不到由延薫山館再折而東面山殿八楹聖祖御題額曰一片雲當朝雨欲來午隂乍合雲起膚寸瀰漫布濩其或晴雲天際舒卷自如五光十色所謂郁郁紛紛蕭索輪囷覺岱嶽雲峯天都雲海未能獨檀其勝御製詩一片雲甲戌山中雲氣朝暮晴雨變滅無端或起樹中或浮水面或來樓牕几榻間以片目之所謂一滴水知大海味也白雲一片纔生岫瞥眼岫雲一片成變幻千般歸静寄無心妙致想泉明一片雲對岫山房一片雲祥籠寳篆鎮氤氲試聴細籟琅玕戛何異風篁嶺上聞名勝志餘杭風篁嶺上有一片石青潤􅌑瓏舊稱一片雲欽定熱河志卷三十一
