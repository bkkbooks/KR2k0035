  text: 欽定四庫全書欽定熱河志卷六十四
  hash: sha256:f2cff7038d8eb81f220354b015f6afcebc901e193522056c3de9947f9b2e6ec4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0035_WYG_064-1a, image: WYG0496/WYG0496-0076a.png}
body:
  text: 晷度一授時齊政肇始虞廷而後世測量之法以起極度晷影每憑地以覘天而總以北極出地高卑度分為樞紐又以子午線為中得東西偏度由是分布時刻加入節氣諸線得節氣度分言天文家歷代遞沿而西法尤為精密承德府全境居赤道北四十度至四十二度強在地圖東面中線偏東四十三度至四十七度強京師偏東一度至四度強與夫分至日景及晝夜刻候皆可以按地分考蓋天象雖虛而地體則實據表器之器精心以求髙卑贏縮芒忽難淆理固然也我皇上學貫天人識超今古闢分野拘墟之舊説而占候讖緯尤灼知其傅會難徴臣等仰窺御製禹貢指南詩旨固已曠若發蒙茲論次承德府諸境極度晷景謹為分屬排纂而於分野星次則略舉史傳遺聞而更詳辨其不可信庶俾管窺槃扣者流恍然幬載之全量益欽惟聖知天非星史諸家所得仰希萬一也志晷度第八承德府即熱河廳州凡測晷極度晷景俱以府縣治所為準北極出地高四十一度一十分距京師偏東一度三十分夏至正午日景三尺一寸九分有竒定表高一丈後倣此晝五十三刻十四分強夜四十二刻一分弱冬至正午日景二丈一尺一寸一分有竒晝四十二刻一分弱夜五十三刻十四分強春秋分正午日景八尺七寸四分有竒晝夜各四十八刻餘州縣同灤平縣即喀喇河屯廳北極出地高四十度五十八分距京師偏東一度二十分夏至正午日景三尺一寸五分有竒晝五十三刻十四分夜四十二刻一分冬至正午日景二丈零九寸二分有竒晝四十二刻一分夜五十三刻十四分春秋分正午日景八尺六寸八寸有竒豐寧縣即四旗廳北極出地高四十一度三十三分距京師偏東初度二十八分夏至正午日景三尺二寸六分有竒晝五十四刻一分夜四十一刻十四分冬至正午日景二丈一尺四寸八分有竒晝四十一刻十四分夜五十四刻一分春秋分正午日景八尺八寸六寸有竒平泉州即八溝廳北極出地高四十一度二分距京師偏東二度一十三分夏至正午日景三尺一寸六分有竒晝五十三刻十四分少強夜四十二刻一分少弱冬至正午日景二丈零九寸八分有竒晝四十二刻一分少弱夜五十三刻十四分少強春秋分正午日景八尺七寸有竒赤峯縣即烏蘭哈逹廳北極出地高四十二度二十四分距京師偏東二度五十分夏至正午日景三尺四寸三分有竒晝五十四刻三分夜四十一刻十二分冬至正午日景二丈二尺三寸四分晝四十一刻十二分夜五十四刻三分春秋分正午日景九尺一寸三分有竒建昌縣即塔子溝廳北極出地高四十一度三十八分距京師偏東三度五十分夏至正午日景三尺二寸八分有竒晝五十四刻一分夜四十一刻十四分冬至正午日景二丈一尺五寸六分晝四十一刻十四分夜五十四刻一分春秋分正午日景八尺八寸九分有竒朝陽縣即三座塔廳北極出地高四十一度四十四分距京師偏東四度二十一分夏至正午日景三尺三寸有竒晝五十四刻一分強夜四十一刻十四分強冬至正午日景二丈一尺六寸六分有竒晝四十一刻十四分弱夜五十四刻一分強春秋分正午日景八尺九寸二分有竒元史天文志北京北極出地四十二度強按元授時術周天三百六十五度二千五百七十五分今法周天三百六十度元史所云四十二度強者當今四十一度半弱元之北京治大寧城在今平泉州治東北一百六十里與今測亦不甚逺蓋地居天中地體渾圓與天度相應中國當赤道之北北極常現南極常隱南行二百里則北極低一度北行二百里則北極高一度東西亦然經緯有常度測有常法推之二分二至日晷晝夜分刻立表見景理可明徴也若列星分野之説肇自周官秦漢以來傳述不一在天或以次言或以星舉在地或據州或據國中土之地已盡二十八宿方位推之大地七萬二千里數有所窮是中土星野之分特出於天文家之拘墟沿襲而未足為據也今承德府全境當古幽燕東北舊説星分尾箕析木之次今據歷代史書所載而綴以論説如左周禮保章氏以星土辨九州之地所封封域皆有分星鄭康成注析木燕也爾雅釋天大辰房心尾也大火謂之大辰析木謂之津箕斗之間謂之漢津也史記天官書尾箕幽州淮南星部地名尾箕燕漢書地理志燕地尾箕分野也東有漁陽右北平遼西遼東西有上谷代郡雁門皆燕分也樂浪元莵亦宜屬焉自危四度至斗六度謂之析木之次燕之分也費直周易分野析木起尾九度蔡雍月令章句自尾四度至斗六度謂之析木之次燕之分野皇甫謐帝王世紀自尾十度至斗七度百三十五分而終曰析木之次今燕分野晉書天文志自尾十度至南木十一度為析木燕之分野屬幽州漁陽入尾三度右北平入尾七度遼西入尾十度魏書律歷志心四至斗一析木唐書天文志尾箕析木津也初尾七度餘二千七百五十杪中箕五度終南斗八度自渤海九河之北得漢河間涿郡廣陽及上谷漁陽右北平遼西遼東樂浪元莵古北燕孤竹無終九夷之國宋史律歷志赤道過宫尾宿四度十五分杪五十四入燕分析木之次黃道過宫尾三度八十六分杪六十四入燕分析木之次按宋志又載觀天歷黃道過宮尾宿八度入燕分與前説異金史歷志太陽黃道十二次入宫宿度尾三度九十七分九十二抄外入燕分析木之次元史歷志黃道十二次宿度尾三度一分一十五杪入析木之次按承德府全境在古漁陽右北平遼西郡邊外其入某宿度分史傳無明文漢書地理志尾箕分野東抵遼東唐書天文志亦及於遼東北燕則承德府屬星分以尾箕屬燕之舊説附近推之亦略可考見然古人分星或以配食或以主祀初未嘗以恆星之次第配九州東西南北之方位亦未嘗以地之大者星土必廣地之小者星土必狹其附近邊徼之地即緣邊徼所分之星而係屬焉如星紀為吳越分春秋時未有交趾九真南海日南之地也漢置為郡亦不過附於星紀之次如鶉首為秦分春秋時未有武威張掖酒泉敦煌之地也漢置為郡亦不過附於鶉首之次如析木為燕分春秋時未有元莵樂浪遼東西之地也漢置為郡亦不過附於析木之次蓋緣三代以下拓地不廣故附諸中土而有餘若以今之道里計之西域新疆逺拓二萬餘里已非秦分井鬼二宿所能該况推之以盡地面一周則中土以外大地尚多又將分以何星屬以何次乎恭讀御製題毛晃禹貢指南詩注史記天官二十八舍主十二州引星經如云角亢鄭之分野之類乃以二十八宿主十二州分配無餘此外更當何屬夫天無不覆星麗乎天亦當無不照今十二州皆中國之地豈中國之外不在此昭昭之內乎且其間有地少而星多亦有地多而星少以天度地輿凖之亦不均如井鬼為雍州陕西甘肅皆是其道里之廣已非兩舍所能該而今拓地逺至伊犂葉爾羌喀什噶爾較禹貢方隅幾倍蓰其地皆在甘肅以外將以雍州兩星概之乎抑别有所分屬乎此又理之難通者蓋分野之説本不足信而災祥則更鄰于讖緯皆非正道仰聖論之昭垂誠足以破千古拘墟之見而懸為正的矣且即以舊説論之爾雅以尾屬大辰星與次已相違漢代不知嵗差以節氣交宫分十二次之界其交宫又非當時實測後漢賈逵諸人始以史官所注冬夏至日躔所在正之於是十二次紛紛改定晉虞喜始知嵗差宋何承天祖沖之隋劉焯等言之益詳唐初傅仁之始用嵗差朝論不以為然李淳風復去嵗差不用及一行乃博考廣證分天自為天嵗自為嵗更以七宿之中分四象中位而著其分野然觀其區别各次與堯典春秋傳復時有出入明神宗時西法入中國以中氣過宫如日躔冬至即為星紀宮之類而恆星既有嵗進之差於是宮無定宿宿可以遞居各宫古法因之遞變再以恆星東移嵗差五十杪積算之六千餘年之後南易而東西易而南萬二千餘年之後南易而北西易而東方位更而分野亦易是則分野以屬星分星以屬次即中土十二州之地前後已多參錯况大地之全乎兹故採綴舊説折衷聖裁見向來十二州分星之説不過天文家之沿襲傅會加以占驗禨祥尤多恍惚非獨事難徴信亦理不能通耳又按古分野之法限於中土則大地難周統全局以規大勢當以周天三百六十度配大地七萬二千里每二百里分應一度盡地面一周而二十八宿之分野始盡説似較為無弊也第欲以周天分屬大地而恆星有東移之差則以某宿屬某處將以何者為準而後左右推暨乎曰恆星雖嵗差五十秒然二十八宿始初之體原有定位角亢氐房心尾箕為蒼龍居東斗牛女虛為元武為元武居北奎婁胃昴畢參觜為白虎居西井鬼柳星張翼軫為朱雀居南是也宿有東西南北地亦有東西南北以二十八宿東西南北之本位分配大地東西南北之定位按諸古志十二州分星之説惟燕為尾箕之野方位適相符合蓋以中土地偏東北隅京師又居中土之東北於八卦屬艮於十干屬癸甲之交於十二支屬寅於十二次屬析木於星屬尾箕尾箕二宿之本位亦正在東北隅也以尾箕燕分為準而後左右推之盡地面之一周皆與各宿本位相合是為亘古不易之星分而十二次因之至恆星東移嵗差五十杪亦隨大地為轉易某年屬某宿某度若干分杪以各宿本位所屬不變者為體以按年遞值者為用如是以言分野則數不窮而理猶可據為附著其説以備考欽定熱河志卷六十四
