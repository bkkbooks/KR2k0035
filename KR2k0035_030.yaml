body:
  text: 行宫六麗正門勤政殿松鶴齋如意湖青雀舫綺望樓馴鹿坡水心榭麗正門乾隆十有九年嵗在甲戍皇上駐蹕避暑再題三十六景以麗正門為冠上御題額也門制崇宏髙明廣大門左右朝房內則重門五楹恭懸聖祖御書避暑山莊題額每秋巡駐蹕蒙古諸藩於焉述職邇年平定西域諸部向風咸于山莊瞻就雲日入斯門者歡欣踴躍拜天閶而拱宸極閎深肅穆萬國來同矣御製詩麗正門甲戍行宫因山髙下繚以石城正南一門曰麗正朝臣啓事外藩入覲皆由於此巖城埤堄固金湯詄蕩門開向午陽避暑山莊門舊稍偏東因闢此門應當陽之義兩字新題標麗正車書恆此會遐方石城髙下石城將草里山莊石城周回計十七里半曽無七十里延長文王臺沼猶民力鳩築山莊發帑償力役之征古所不廢惟本朝則無其事凡河工城郭郊廟宫殿偶有修飾工作皆動正帑雇夫匠至於園亭並不用正帑率以內府餘帑給價或貪官汙吏罰其出資助值山莊石城即康熙年間令喝里修築者即事紀實亦家法萬年所宜守也勤政殿麗正門之左南向殿二重前五楹曰勤政殿我皇上敬天法祖以勤民隱巡行所至臨朝視政無異宫中凡離宫别殿悉循圓明園之例題以勤政名言允出如見宵肝深衷殿內面南額曰正大光明面北額曰髙明博厚聨曰中外同風持盈長保泰山川競秀彌性並怡情後殿前簷額曰卷阿勝境殿內聨曰文囿俯川原千載遊歌地勝豳風咨稼穡三秋圖畫天開後簷面北額曰雲牖松扉殿前樓五楹長廊周匝慶賚燕饗之典御焉御製詩勤政殿甲戌離宫視事之所顔以勤政皇祖皇考舊章也山莊前殿亦以是名之漫施藻梲長階莎具足雲山四靣羅不息自強勵勤政永欽家法詠卷阿松鶴齋淡泊敬誠之東搆大殿七楹以奉慈寧翠水丹山祥開福地問安視膳祝嘏延釐皇上御書額曰松鶴齋尊養偹隆敬承家法御書聨曰岫列喬松雲屏開翠巘庭間馴鹿雪羽舞瑶階御製詩敬題松鶴齋己巳昔我皇祖於山莊中奉寧夀宫處名之曰松鶴清越我聖母為是先徽所憩息避弗敢御且以離豫所居較逺也則于寢殿之東葺室一區以為偶臨山莊聖慈燕居之所顔之曰松鶴齋猶皇祖志也鶴羽千年白松姿不老青惟兹真上瑞堪以祝慈寧嘹亮聲聞野蘢葸色滿庭作朋瑶島上王母駕為停松鶴齋甲戌皇太后所御內殿齋名松鶴祝頤夀也兹奉慈聖於山莊之東亦以名齋隨時隨地長樂春暉用以志慶常見青松蟠户外更欣白鶴舞庭前西池自在山莊內慈豫長承億萬年恭奉聖母命題松鶴齋敬成長句齋名松鶴起居奉嘉蔭清音美景全步處可辭繖與蓋聽來都勝管和絃夏炎叶凊食履泰秋冷宜溫宴息便咨爾胎仙赤松子同承慈豫萬斯年詣松鶴齋感成四韻己亥舊日攸宇夏凊曾齋顔松鶴夀希徵關情生憶兹尤切以禮制心持未能對鏡徒慚孤所望捧床祗恨呌無應胎仙朗韻誰為聽蒼客嘉隂莫與憑歎是三年倐已過思惟神御敢頻增山莊永佑寺惟敬奉祖妣皇祖皇妣皇考神御不敢並及皇松鶴齋雖宫聖母昔年駐憩之所亦如神御夀康暢春園例不敢增奉也杯棬列置胥如昔言及斯真痛弗勝荔支初至詣松鶴齋薦新感而成句己亥雖無神御有居停陳紫初來敬薦馨每嵗荔支至必敬奉永佑寺皇祖皇考神御前至聖母不敢屢奉齋則神御之義已見於向所作詩注中而松鶴昔年夏清之地也故敬詣薦新香扆依然徒搶地聽於視矣泯聲形如意湖作亭于湖隈東向前臨如意洲左則芳渚臨流聖祖御題額曰如意湖芷岸蔭林苔階潄水彌望煙渚晴霞展舒若鋪錦臨風洲勢逶迤作芝英半偃狀由亭而西為芳園居其旁路直林遙悉在花光水氣中也御製詩如意湖甲戌山莊勝處政在一湖隄偃橋橫洲平嶼矗隱䁐亭榭境别景新此則曲岸若芝英故以如意目之塞水恆流此處渟栁湖蓮島偶摹形煙容波態皆如畫屬意悠然在杳冥青雀舫山莊以山名而趣實在水瀑之濺泉之渟溪之流咸滙于湖中有御舟題曰青雀舫聨曰虛檻月移松桂影仙源風送芰荷香每舟行湖上四圍山色亭臺上下花木參差皆供擷攬至如皓月空盈澄波鏡淨蘭橈徐動如度廣寒清賞吟情兹為一助舟有塢在臨芳墅旁御製詩青雀舫澄湖放艇溯光搖碧載月為宜衝雨亦有竒致黃龍綵鷁無取過華溶溶塞水浩無涯桂楫蘭橈向晚移月朗寥天駕青雀空明宛是泛瑤池泛月己巳漸上東岡素彩鮮晚涼試泛木蘭船那忘前嵗曽逰景却喜今秋初度圓赤壁移來紫塞外銀河朗到白榆邊印波若悟同中異一指何妨半與全雨中泛舟己巳引水為湖足放舟煙篷越可作清遊誰知塞景新宜雨不意園池舊泛秋飽挹涼風侵翰席倐看潦水漲溪流空明獨對蕭條境底有機心猜野鷗泛月甲戌泛月宜何處山莊景最新夏宵含颯爽塞水漾明輪鶴唳孤松頂鹿尋曲澗濵錘峯玉臺逈溫嶠早癡人載月用舊作秋夜泛湖賦唐文皇爽氣澄蘭沼得詩五首原韻甲戌載月夫何為為是納涼爽抑知塞景佳羲皇未呈象古鏡若可攬千里近指掌青雀舫名乘虛無瀛洲恣俯仰俯仰仲夏徂上伏又云既山靄夕送涼誰云秋尚未際此銀蟾輝所遇欣為貴謝賦興邈然那染雕蟲氣雕蟲習氣澄靜賞得心凝九夏渾無暑一輪都是冰桂棹蕩寧緩絺衣涼不勝雲巗蒼鹿呦何殊嘯孫登孫登蘇門山嚴陵富春灘獨樂信無悶楚宋嘉荃蘭文皇我同道遐心企貞觀惟懷萬民憂非圖一已歡已歡不可亟繁星晶塞沼維舟息巖館挈壺傳漏秒舉首眄紗窗緑影西移了新晴今夕佳明夕當更皎泛月三首己卯山古湖寬列仙地氣澄雲斂好秋時御園漫惜啓蹕早塞苑端欣泛舸宜野湖傍晚十分涼執事傳宣換絮裳何不言旋歸邃宇愛他蕭景引懷長滿目氷光滿意清前年佳趣記分明甲戍曾此泛月笑他癡羡廣寒者未識人間有玉京泛月癸未崦嵫日未落白榆月已懸由來惜景心比我猶殷然乘涼泛青雀舫名水氣颯爽延西舂輪漸微半魄影始姢因悟陽德昭凡光莫爭先在湖斯言湖良夜詎可捐清輝方就盈氷匡過上弦塞中不易值萬山翠逼天須臾翠不見白水湧金蓮倚吟曽得句猶憶甲戌年彈指九春秋契濶誰為憐月夜遊湖四詠癸未山月山峰一帶有低髙低處輪團髙半韜稍待飛升雲漢表誰能特地掩分毫湖月溶溶塞水滙成湖也有金波一片鋪已自清涼欣少見何須謾説御園孤林月塞中何處不叢林最喜偨池傍碧潯每自度踈見寥朗更因入密悟深沈舟月凌波青雀起平臺座裏銀蟾覿面來岸轉峯回無不共直疑飛駕上蓬萊秋湖泛月弦月居然光漸鋪教開青雀泛秋湖滿空風露標真淨倒影林嵐入畫圖已覺天香欲生桂底須夕彩定流梧晚涼何礙添衣著玉塞銀蟾未可孤載月偶成蘭舟待藕灘塞景耐盤桓天暝山疑近月髙湖似寬琉璃為世界星斗未闌干適可歸巖館川風落夕寒泛舟即景四首甲申去嵗淤泥大剗治新秋活水滿清池輕舟訝似行於鏡凡事因思在豫為錦雲叢裏衆香馣真是泉甘土亦甘千葉蓮花大於斗誰云塞北遜江南菰蒲淡蕩野鳬依疑似江鄉是也非舟過無心學相狎見人故自不知飛西山一帶浸湖光簇簇芙蓉波底藏攀陟何須勞步履坐遊耐可泛沙棠泛月丙戌塞湖泛以初輕舫適相於素月上已上清風徐不徐四圍山隱樹一片水明蕖萬景空澄裏銀蟾祇自如泛月作歌丁亥山莊有湖亦有月泛舟載月始艱逢秋巡啓蹕嵗有例仲秋已涼孟秋率過中今年夤緣值閏月饒我一度明鏡圓當空塞湖不涼復不炎熱熾此而弗賞無乃孤負佳景當前供仰觀萬里淨一碧四山翠影侵尋漸隱青芙蓉錘峯玉輪亦旋上隱者復現如於鏡裏呈玲瓏快哉今宵得始遇而原太古所有非由人力實由造化工勿謂既望漸致東山升遂晚猶當登絶頂以待其載之也不以沙棠之舫而以驅青驄泛月四首戊子山莊初到月幾望更值晚炎稱去聲泛舟似是纎阿有神解不教此獨擅山遊山莊過望月遲上每䇿騎遊山故昨於御園泛月有行將駐塞館䇿騎更山遊之句清到塞天無更清明當秋夕是真明碧琉璃界虛無表著箇扁舟汗漫行四圍山色入蒼茫一片湖光生峭涼貪看空塵接寥朗不妨添著夾衣裳清風徐不水興波赤壁之遊想若何所借髯仙斯未到到時竒句定應多泛月四首己丑早知秋月妙山莊雖過中元滿璧匡是月十六日方月望况值晚來殘暑熾半因攬景半乘涼澄瀛耐可漾樓船樓上先看輪湧圓占盡謝家雙絶勝還饒玉塞此無前山中萬樹水中蓮弄影搖輝總淨妍雖是四鄰峰切漢玉蟾何礙燭髙天湖靄山嵐入夕涼隨時便換夾衣裳近隄分付蘭舟艤巗館載來滿院光塞湖載月之作壬辰載月本宜湖塞湖更佳趣十載乃一遘那可孤斯度久欲泛舟遊晚每隂雲遇僂數過上弦霞斂霽天露不宜再徘徊青雀山莊泛湖船名候以豫萬山四圍翠一水當中素月午光正晶如逢雅人故於此默無言山川笑我固御園亦有湖每嵗載月遊比及來至此率已值新秋况多逾望夕輪缺寒風故雖斯對月未曽開蘭舟乘涼惟夏宜蟾光見舉頭湖則同御園山實勝百籌結想既因償興懷良復悠悠哉忽轉念便以問軍郵載月十詠月天一碧泬漻無片雲底須點綴藉他紛大圓鏡裏小圓鏡謾説猜疑布與黂月星初看月朗漸星生經緯分明縱與橫此是素娥莫大德一明還任衆分明月峯本自生西移漸東半匡入夕皎天中錘峰亦自具神解望後擎輪孰與同月林簫參髙嶺復低岡都作蓊蒙丹桂看應是廣寒容不了枝枝天馥布山莊月湖塞水易流艱作湖箇間百頃碧平鋪四圍平護明珠顆舉似人間此景無月閣漾過沙汀復栁岸岸旁水閣聳楣簷大光明裏相看笑嬴一籌無須軸簾月舟何處而無載月舟誰曽塞上月湖遊梨園小部渾無用自有鶴鳴與鹿呦月橋沙隄幾曲幾條橋撤板容舟過碧漻漫擬吳中稱月樣生波猶待晚來潮月岸無過乘興偶吟慿適可艤舟岸便登如此月明奚借燭厭他早候兩紅燈月坡松齋猶在月坡巔緩緩肩輿松徑穿弄影流光渾不定琉璃界入布金田月夜遊湖作歌天下不少名山與名水二者兼之應鮮矣即有兼者路途遙無因遊奕而往就之理塞外避暑斯山莊去京不過四百里山明水秀萃美善况逢佳夕中旬始傍晚暑退爽風來輕霞影綴月輪綺須臾片影亦消盡逮望冰匡碧波委木蘭舟桃花紙延緣拈詠興無已舉頭蟾魄漸西移寓意不留頗似此秋湖泛月當年望後遲升魄今嵗望前又滿匡載月蘭舟詎耽玩未宜孤負好秋光影搖金塔漾漣淪可望誰能拾級頻千百年前塞湖裏朗吟清賞屬何人蕩橈芝徑過雲隄芝徑雲隄乃山莊三十六景中之一輪印東湖復印西一月千江堪例此半提原即是全提不見荷花見荷葉箇中别解有誰徵洛神驀遇月天子回避霞車自合應塞湖泛月之作癸巳璇霄既斂雲曜靈亦俄景我適至山莊月當幾望頃斯地復斯時不可孤不領蘭舟待南磯銀蟾上東嶺載以泛澄瀛如遊廣寒境四山收暮色一輪漾波影寥朗無纎翳詄蕩有餘靜騁望目為寒託興意因永是宜屏粗心次第敲吟綆塞湖泛月即景河源雨過晚霞明霞盡祇餘迥宇清恰好蘭舟待曲岸便邀桂魄泛空瀛返觀爐錘去聲那施巧謂錘峯也上弦入夕月在天中不升東壁誰上弓弦欲就盈時方上弦髙燭四山惟靜碧平磨一水特光晶對來直擬忘形色挹處真教悟性情試問千秋載月者此時此景若能并載月四詠癸已錘峯月晚春雲縷散天涯早擎去聲東風未夜時軒鏡例當欠黍杪時五月十四日漫教唐突議爐錘薰風月南來風朗拂涼微聲處依稀弦五揮心仰重華歌解阜便因玩景勵宵衣塞湖月沙縈石路源來淺岸轉舟行閘貯深千載塞湖千載月一時幽興一時吟松嶺月小遊適可命維舟雲館言歸嶺上頭松際流光勝秉燭恰同謝客復登樓塞湖泛月甲午山莊五月到過望季夏今宵值上弦未滿光欣鋪欲滿將圓輪似勝於圓却看雲霧都歸嶺耐可空明一放船疑彼素娥如有謂莫孤時節好因緣猶有浮雲來往行似於素魄妬還生因而一晌悟至理合是諸凡忌太明塞宇空時懸鏡半溪風爽裏送舟輕何須小部梨園奏恰喜林中聽鹿鳴載月八首甲午月宇未滿冰匡碧宇懸下舂有意讓流妍不須遲去聲待錘峯上每於過望月遲上時登霞標臺以待錘峯月吐便可乘涼早泛船月峯底識望前真妙趣羣峯都入照無遺小遊仙處觀壺嶠玉筍森森碧海基月樹不辨松蒼與柏翠偨池一例互交撑廣寒世界忽疑窄放出桂枝輪外生月荷夕陽紅緑一湖明入夕花藏祗葉晶荷花見日而放見月而合出梵典試之果然却是清香收不住因風馥郁送舟輕月鹿弗逺避還弗伏藏下來日夕似牛羊馴坡馴鹿坡為山莊後三十六景之一命侣殊牝牡鹿惟八九月其牝隨牡行餘月則牝牡各為犀而不相雜希革新看澤月光月螢腐草中生無翼飛舫邊熠耀故相依蜎蟲弗識蒙莊語月下為光那論微月湖金波萬疊細鏻鋪審睇中還有夜珠太古已來此野水豈知今作影娥湖月隄岸楊遙看行行近上下緑波相映浮遊興由來戒一往傍隄青雀舫名恰宜收塞湖泛月乙未塞山每晚慣作雲雲則玉蟾時顯晦謝重真非箇中人乃願太空有點綴今夕碧天散纎翳上弦甫過將圓際山莊勝景未可孤青雀山莊舫名早待湖之裔乘涼玩素兩可兼峻嶺崇山鏡中對蒼然暮色暗遙川琅霄皎皎寒光麗太古已來龍沙景而今却在園牆內安排筆硯擬長言翻思真境難為繢載月八首疊去嵗韻月宇髙燭懸霄半鏡懸星辰入影共清妍却繞塞水添疑慮淡蕩何來漾畫船月峯四圍多有奇峯𥪡一照由來總莫遺雅以銀瀛擎玉柱因思髙以下為基月樹無論平林及山樾不分色相祗支撑米顛曽未至斯境糊突圖何太肖生月荷紅花爭映晚霞明霞隱黃昏葉露晶少旋去聲葉花都不辨隨船惟送暗香輕月鹿那見深林鎮避藏成羣崖岸任相羊誰能指此呼為馬朗照髙空有月光月螢葦叢初出故飛飛隨舫如為有意依最是素娥善容物任他碧宇放光微月湖三千世界鏡中鋪照乘十枝小矣珠笑彼魏王真嚇鼠蹄涔將以傲江湖月隄適興片時適可止言旋隄傍繫舟浮誰知夜塞無邊景都在月詞八首收泛月塞苑早晚涼秋湖率罷泛今嵗恰通閏七月中伏占夕陽熾炎熱波風披瀲灧上弦倐已過團輪祇微欠快霽淨纎翳木蘭徐解纜乘流任去來弗棹亦弗蚖四山暮色侵一空澄景鑑始覺暑氣消漸喜寒光淰叶心與境俱融神如水以淡岸蛩忽送聲原此金􅒫驗泛月有詠志懷丙申泛月本宜夏山莊宜之最傍晚坐溪亭冰輪且遲去聲待叶西嶺隂下落東峯曦迥在須臾曦亦隱舉頭素蟾對暮色旋已蒼寒光頓可愛爰開綵畫舟以遊琉璃界四山圍明鏡皎魄印其內更思夜明照原包四山外外內通體淨上下合相去聲快恰似遨金田誰云居玉塞昨年亦斯境而廑籌筆會耆定今餘間適興聊弗害瞿然謂失言無逸應恆戒泛月即景得句己亥山莊夏泛月拋已兩年向雨後值快晴佳景可孤放夕陽猶下舂乘涼湖裔曠須臾暮色蒼遂登青雀舫山莊舊有舟名青雀既消搖塞湖亦澄泓玉蟾正麗午過弦光漸明萬樹猶偨池千峯將合并東壁騰餘輝視之如赤城赤城原非霞峻挺幻赤色緑樾繪丹嶂可望不可即乃在石城外縱目景全得説與泛湖者天然詎人力人力不易為勝地太古藏水芳而巖秀妙義詮奎章函蓋無不具繹思為傍徨如月燭九霄見之此山莊載月己亥塞苑常時早晚涼未宜月夕泛蘭航乍炎却似乖金令乘爽因之載魄光可使好秋竟孤負便教即景試徜徉底緣識得殊朱夏素彩流來帶露瀼塞湖泛月庚子過弦宜泛月雨墮却間坐今晚乃放晴塞湖開舟可颯景天水連澄光左右妥去嵗未孤彼此宵仍詠我餘雲戀空宇忽縷忽成朵太清何礙滓纎翳奚妨娜因思景重言其意亦自頗塞湖泛月四詠辛丑塞湖斂淨碧霄清幾平聲望氷輪倍覺明傍晚乘涼兼玩景遂教青雀舟名泛澄瀛閘貯湖將里計寬落來嵐氣不妨寒舟過荷浦霞光入紅玉鏡擎緑玉盤錘峯剛影樹參差旋燭寥天漭沆披此景原從太古有拈毫得句者伊誰橫拖金塔閃清漻巧與波颸影蕩搖不異向年御園景所殊夏夜似秋宵塞湖泛月壬寅曉雲欲散䨲光披湖靣荷風馥馥吹一以乘涼一泛月知魚磯畔放舟時每年泛舟率從此登舟雖是平臺却是舟青雀舫上有平臺既髙益耐延月倚欄延得素光流滮湖夜景何多讓妥貼橫陳煙雨樓泛月佳蟾應在月之望况值雲開霽光放塞湖此景不可孤因教青雀舟名乘時漾餘縷初夕猶徘徊團輪甲夜遂朗暢乍欣桂楫浮露潤何必錦帆逐風揚小部鼓吹都弗藉鶴唳偏宜和鹿唱稍容與便命棹還長夜為歡懼弗當泛月四首寒水風涼秋泛少今秋却暖泛舟逰紓懷豈為去聲資清賞慰在秋長萬寶收月到秋來輝益朗水當潦退色愈清光光相映明明鏡靜悟由來胥假名碧宇鶴飛如得意緑林鹿出欲揚聲似兹朗潤清華境不是廣寒亦玉京桂棹金波清景遒銀河一例向西流輾輪等度非無意卅日應當端正秋綺望樓碧峰門之左倚城為樓凡九楹北向御題額曰綺望樓聨曰汲泉磯畔魚知樂試墨松邉鶴喜陪又曰一庭縹眇雲霞氣四壁清涼水石心又曰間尋綺思千花麗靜想髙吟六義清登臨極望水木雲巒組分繡錯後樓三楹南向舟廬環列原隰髙下如指諸掌恭懸聖祖額曰坦坦蕩蕩聨曰萬家煙火隨民便千畝山田待嵗豐御製詩綺望樓甲戌樓在城西南隅下視緣隄廬舍闤闠歷厯可數山環水抱儼在畫圖中埤堄岑樓聳翠林每因眺逺一登臨萬家煙火隨民便此語乃今懸皇祖御書聨句樓上聖度原如天地心綺望樓己卯樓登綺望一憑看錦繡原非纂組觀雖乏桑麻富禾黎塞外非育蠶之地桑麻女紅勢不可言求衣於食又何難綺望樓辛巳傍晚陟西岡就隂為趁涼門階倚山谷樓戶俯城牆碧宇開金皓黃雲報綺望祗年今昔揆即景祝宜㿩綺望樓癸未樓傍山城騁目宜遐阡近隴緑雲滋今朝綺望神心暢絶勝披華啓秀時登綺望樓樓稱綺望目堪窮詎在松青與桕紅城俯閭閻計安永田芁禾黍為祈中火煙蔀屋年年庶雞犬山村處處通今日登臨真有喜勝常萬寶逮歌豐賦得坦坦蕩蕩甲午延樓臨城牆可見山田及閭閻况皇祖御額懸於正中敬賦五言用詔千祀履卦幽人吉箕疇王道崇四言標合撰萬古示深衷識矣其君子廓然惟大公對時八莭序應物七情同煙火隨民便山田待嵗豐二語櫽括中聨皇祖御書樓句翹瞻仰雲日祖述念何窮馴鹿坡塞山産鹿麏麚麖麑孳息蕃衍而山莊所畜特馴山徑逶迤草平沙軟或羣或友各適其天至金飈薦爽玉露微涼儦俟或行樂依文囿御書馴鹿坡三字勒於石御製詩馴鹿坡甲戌靜宜園有馴鹿坡乃黑龍江將軍所進其地以使鹿為俗山莊則濯濯麌麌惟性所適無異家畜故亦以名坡馴鹿親人似海鷗丰茸豐草恣呦呦靈臺曽被文王顧例視寧同塞上麀水心榭石梁跨水南北方各一中為榭三楹飛桷髙騫虗簷洞朗聖祖御題額曰水心榭憑楹東望青翠杳然波間上下天光影落空際西則銀濤萬疊浩渺溟濛丹碧樓臺幻成異采與長虹飲練雙湖夾鏡兩坊相映逾石梁而北有亭名曰牣魚御製詩水心榭甲戌界水為隄跨隄為榭彌望空碧倣佛笠澤垂虹景色明湖蘇白未得專美一樓隄分明外湖上頭軒榭水中圖因心秋意蕭而淡入目煙光有若無水心榭癸未隄界內外湖外低內水髙虗榭隄中間夾鏡光相交練影漾楣梠築聲喧砌坳如在玉壷氷奚用垂麟毫江城問謝公何以獨稱遨水心榭口號乙酉內水原髙外水低水心虛榭枕長隄設如秋水南華悟於不齊中水本齊水心榭己亥隄界內外湖內髙外即低然為水則一敞榭實當之水心額楣端猶是堯年題澄照翻漪影左右無不宜山林展書鏡鳶魚協化機隨方入靜觀鄭崇喻何卑欽定熱河志卷三十
