body:
  text: 行宫二十王家營行宫常山峪行宫巴克什營行宫兩間房行宫釣魚臺行宫黃土坎行宫中關行宫什巴爾台行宫波羅河屯行宫張三營行宫濟爾哈朗圖行宫阿穆呼朗圖行宫王家營行宫在常山峪東北四十里康熙四十三年建榜曰引流成溪凡四重東西所亦如之其陽面山地勢平曠澗壑交流宫內廊軒接比院宇髙明右則居民鱗次場圃縱橫煙村掩映宛在豳風圖畫間也常山峪行宫在兩間房東北三十三里康熙五十九年建南嚮殿五楹曰蔚藻堂內曰青雲梯西曰虛白軒後曰如是室宫基面山丹崖翠壁列若屏障軒窗披覽領妙延清蔚藻堂之右曰翠風埭曰緑樾徑曰楓香坂曰陵霞亭皆創於聖祖時我皇上標為八景御書題額分章成詠天藻敷華地靈增勝矣御製詩常山峪行宫辛酉憶昔髫齡際趨陪聖祖前于今巡幸至駐蹕故宫邊湛露曾叨澤含飴想侍筵秋風悲此日軒屋尚當年鳥語如懷舊花香故逞妍恩勤終古慕承顯一身肩再疊前韻經國猷垂後承家志繼前三秋修武備萬乘閲嚴邊勝地停鑾御離宫啓玉筵欣逢無事日喜覩有秋年插笏峯爭秀披圖景鬭妍永懷無競烈景仰懼難肩常山峪行宫疊舊韻癸亥景愛三秋始恩思草載前音容魂夢裏嵗月鹿蕉邊小憩松篁閣還陳翰墨筵誠知仙是幻堪以日為年列岫迎窗翠間花繞砌妍繼繩吾未逮矢此一心肩常山峪行宫八景緑樾徑灌木盤山腰濃陰日蓊翳豁開壺中天迥異人間世虛白軒虛空能生白一氣常函三間情空外寄妙道箇中參青雲梯青雲信有梯丹崖暫延佇鹿豕出翠微逢迎務光侣楓香阪清吟步修阪衣袂泛秋涼金風颯然過微聞山楓香蔚藻堂花木暢生意大地蔚菁藻忘言入靜觀欣然愜懷抱如是室如是如是室坐對清秋山遊山室中人不費往與還翠風埭野木不知名雨後增新翠誰云塞北山却有江南致陵霞亭危亭搆峯頂面面青㟏岈踏石片雲飛去作天邊霞常山峪行宫懷舊己丑青雲叢處敞離宫昔日今時駐蹕同捲幔山嵐千面合開軒巗樹四鄰通垂紳瀑水無心白對客間花著意紅草載恩勤成一瞬幾畨青睞仰髙空常山峪行宫八景緑樾徑灌木重重翠鬱森秋來猶自有清隂攜笻不為尋佳勝觸目無窮山水心虛白軒架得蕭軒三五楹偶來輒喜向虛明前秋詩約分明在指點煙嵐是舊盟青雲梯幾疊林巒碧靄凝盤紆界道一條氷幽偏不是青雲路只許詩人偶一登楓香阪欲紅未紅楓樹枝寥蕭涼籟襲人吹恍疑身在耆闍窟參得香林拖地眉蔚藻堂清秋巒壑淡煙光翰墨香生蔚藻堂西抹東塗渾不藉由來大塊假文章如是室室名如是如何是如是室名如是何而我朅來吟七字今原非此昔非他翠風埭叢林籟作風含翠曲埭秋來葉有丹一嘯蘇門天地濶飄飄直欲駕仙鸞陵霞亭亭子峰巔四望賖衣裾輕拂惹煙霞問誰倚石雲根動散作天邊一縷斜常山峪行宫即景丁卯捲幔秋光到座邊雲開為我矗青蓮步苔衣濕蛩吟露望坂楓香鹿呌煙自是林泉多藴藉依然書史得周旋饒他只有松陰鶴夜夜空山抱月眠常山峪行宫晚秋山容似畫淡彌趣秋色如詩老益工拾級丹梯搴露荔背屏翠壁眄霜楓谷口風來聲覺壯溪頭潦盡影含清朝隮一縷因移石去作白雲天外橫嶢峯無數入窗紗寫照窗前了不差正慮遙天無點綴林邊恰噪晚歸鴉急雨驅雲增暮寒秋英繞砌濕闌干遣懷不苦吟情澀底用拈鬚一字安常山峪行宫八景己巳緑樾徑隔嵗未尋緑樾徑當秋恰到白雲間行圍塞上看山好路便先教看好山虛白齋行宫結字底須多據景標名便可歌虛室三間無别物到來惟見萬籖羅青雲梯嫩翠濃青杳莫分天風吹織紫綃雯自知不是安期侣是底胡然步入雲楓香阪仙人石室青霞封偓佺招我相陪從琥珀遺堯不曾食念兹長謝遊仙蹤蔚藻堂吟句無煩求俊逸淺言亦可暢清懷翠崖有問如何答記我今朝意甚佳如是室自是新秋坐清晝不殊前嵗對間窗碧空似我澄無滓何所得來心可降翠風埭巗樹風過翠浪翻重重罨秀入山軒未教楓色霜前紫且聽溪聲雨後喧陵霞亭峰頂有亭真翼然下臨無地上空天莫云一宿堂堂過暮靄朝嵐結覽全常山峪行宫八景辛未緑樾徑一徑引人入勝千林苑爾相親怪底宜來雨後懸崖濺沫垂紳虛白軒小軒虛白堪怡匡床憑几棲遲驀憶前秋此際清光不隔多時青雲梯蓊匌千重罨秀巉巗百級絶塵大似子房竒士陳平何物堪倫楓香阪青楓過雨霏香詰曲蘭椒里強陟頂砉然長嘯千峰紫翠夕陽蔚藻堂蔚藻爾時書堂每來翰墨生香正擬摛詞且置無過大塊文章如是室秋初山有餘翠霽後室生爽寒最是長宜靜坐奈豫每少幾間翠風埭威紆翠埭林穿草蟲花蝶風前俯仰物物自得會心一為聽然陵霞亭夷嵕位置孤亭四鄰山色來青六法誰能貌取嵐靄都無定形常山峪行宫疊舊作韻乙亥行宫向題句勒壁迹成前此曰方綏逺流沙已擴邊凱歸應勞酒新附合賔筵翠罕臨遙塞黃雲閲有年窗問一晌靜霽後萬峰妍詎曰今無事吾方未息肩常山峪行宫作丙子依緑搆行館標紅見早楓秋光逢塞外詩意滿窗中常山峪行宫疊舊作韻戊寅好山如活畫面面向人前拱北近仙境去避暑山莊九十餘里維南帶古邊古北口一帶古邊界地堂皇開太室俎豆展賓筵風自無塵地雲猶歌旦年聘懷真致靜得句欲姢妍最喜翠微表洪崖可拍肩再題常山峪行宫八景庚辰緑樾徑塞山秋中緑猶濃過雨蹊留白鹿蹤却是今來添别致幾枝紅葉出髙峰虛白軒一年兩度坐文軒生白恆斯悟漆園七字寧云聊即景清機爾許箇中存青雲梯層層緑樹蔚巗梯尋鹿常教步屧躋宇宙以來便有此龍門却誤擬夷齊楓香阪青楓茈虒鎖雲巒意蕊心香靜鼻觀設置江南文翰地又將儀比麝和蘭蔚藻堂背山臨水得書堂一宿居停有縹緗更不課虛將叩寂蔚然大塊假文章如是室山恆如是室如是一晌棲遲似去年何必炷香參白業金剛四句會當前翠風埭莫道山風無色相巖枝澗葉與形容泠然往返誰相見惟有洪崖及赤松陵霞亭孤亭迥出衆山頭暮靄朝嵐漾若流峰不黃山三十六也從雲海泛虛舟七月草四日常山峪行宫作辛巳潦盡朗秋晴大安亦啓程是日諴親王奏報恭奉慈輦登程駐石槽溪橋胥穩駕沿途留諸臣董率地方吏修除橋路皆就巖館忽前迎香撲青楓坂虛生白室楹後山親獲鹿飛騎進行營再題常山峪行宫八景癸未緑樾徑今年緑樾真緑樾為是尋蹊當夏時批閲封章尚餘暇不妨一再與題詩虛白軒生白惟虛藴妙理一年一度此言徴明朝仍便匆匆去故是斯軒所獨恆青雲梯千層蔚緑倚嶙峋階級分明總絶塵為問尋梯進步者幾人真是箇中人楓香阪塞山露重如垂雨飛翠流芬潤意凝幾度青楓林下過衆香國裏得相應蔚藻堂靜中動是山水態動裏靜惟花鳥情看待主人無别物起吟佳趣面前呈如是室延清觀妙會心皆擬議寧因梵帙排虛室設為刮目待猶如是亦底稱佳翠風埭無色形天有色形鳴條送爽復流青東坡昔日乘涼處翠幕張如擇勝亭陵霞亭煙霞負帶迥孤超支父方回若可招賦讀天台工體物居然塞外赤城標常山峪行宫即景乙酉玉露金風候崇山峻嶺間居停有古屋是日闢林關窗納三秋爽門縈一水環置郵傳閣本批閲敢偷間再題常山峪行宫八景丙戌緑樾徑曉秋叢樾緑猶濃過雨縱橫印鹿蹤徑欲循蹊到深處忽然一片白雲封虛白軒曰虛曰白曰秋時止止生祥引妙思不改昔時此軒射悽然為憶此含飴青雲梯青青疊樹蔚如雲意寄菁蔥亦自欣不似登龍題鳯輦於中覔路望徒勤楓香坂散步楓林馥郁然此香非火亦非煙晚華自叶天然靜李賀空稱蜀國弦蔚藻堂山葩應恐漏離騷那數人間八斗曹却笑綺言猶未戒依然對景一揮毫如是室天地干支似轂旋今秋丙戌豈殊前屏風聖藻書唐句却閲流陰六十年室內屏風有絶句皇祖御筆唐人七言八首乃康熙丙戌年所書閲今星甲適周荏苒流光瞻仰益增追慕翠風埭樾埭秋風翠浪翻有聲為寂不為喧了知未可畫工寫雅合攜將靜者論陵霞亭塞天過雨大羅淨祗剩東南幾片霞著我山亭霞以上騁懷遊目正無涯常山峪行宫即景丁亥南北連山色東西接路程有軒真可憩無牖不含清近聽禽鳴樹遙看鹿食蘋偶因吟舊句仍復發新情常山峪晚坐納涼癸巳巖館西峯陰尚早滿庭喬樹發輕颸何曾關外熱關內畢竟候常非候移有暇拈毫還摘句乘涼橅古亦臨池晚來西北油雲布滌暑惟時兩正宜常山峪行宫作甲午去嵗行宫此納涼去嵗於此有晚坐納涼之作今來涼却逼衣裳都緣前日過山雨遂致峭風解夏陽路近因之到常早齋虛覺以靜無忙支窗西北巗雲蔚其庶雨乎引領望再題常山峪行宫八景丙申緑樾徑萬緑叢中一徑延循門得入景無邊興來擬欲賡前什不覺光陰隔十年八景詩凡六作止丙戌嵗逮今丙申已越十年矣虛白軒電光石火忽旬嵗筆點箋鋪又一時比似虛軒生白者自無而有亦如斯青雲梯行宫計里駐來均例以閣章到此辰向例三日內閣發本一次自啓鑾後計日發報必當至常山峪行宫故云宣召諸臣悉批答阿誰不是步雲人楓香坂非煙而靄復非雲葉葉枝枝吐淨芬最是此香無火氣了當領以不聞聞如是室素屏羲畫寫唐詩室內素屏八扇丙戌歲翰如皇祖御書唐句逮今七十餘年藻新每一仰瞻倍生欽慕拱讀恆生若見思明月清風七十載室猶如是景光披蔚藻堂書堂七十春秋閲猶憶當年聖藻垂趨侍幼齡方舞象康熙壬寅余年甫十二趨侍山莊穫覩聖藻親揮雖未能窺測見餘如筆妙而追憶之天文動也天文妙處未能窺翠風埭陳雨收雲才片刻層層埭樾翠如湔風來西北翻林海雅勝五音奏管絃陵霞亭八柱山亭特據髙肩輿尋勝陟蘭皋颯然爽氣滿襟袖霞舉因之興亦豪再題常山峪行宫八景己亥緑樾徑夏仲千林葉已稠容容張蓋緑如油步來却恐滅明笑在彼仍當行不由虛白軒重到雲軒頓覺悲憶常夏凊適於斯歡娛掖輦那能再虛矣白乎付不知青雲梯幾疊青林罨碧疏雲如更復擬梯如寄言菅蒯慕斯者踏實還當戒踏虛楓香坂山楓過雨浴芳馨低坂髙陵一色青展步分明淨香界恰宜小閲梵王經如是室如是寧云談佛偈今朝如是有餘思屏風八扇奎文煥室內屏風為絶句皇祖御書唐人七言八首繼述鴻規豈外兹蔚藻堂不須啓祕更抽妍大塊文章列目前試看形形與色色起豫無盡自天然翠風埭風豈翠乎林翠之請觀葉颭與枝披一般飛動菁蔥者舍巽二能能更誰陵霞亭岡頭一笠欲凌空階下鋪雲日照紅設以赤城相比擬亦堪賦句傲興公常山峪行宫晚景庚子雨後夏增爽況於關外居四山雲吞吐一谷稼幪與髙樹夕陽朗間庭晚籟虛例斯批閣本有暇亦翻書常山峪行宫八景辛丑緑樾徑行過獨樹如張繖忽入連林似設帷一例青油布陰處問誰煮靛染為之虛白軒此軒終嵗守恆虛此日忽看生白與借問誰為領妙者究之非彼亦非豫青雲梯展步層巗認作梯分明百級有髙低士無賢不肖由此應識南華論物齊楓香坂山花野草無不馥何事其香獨屬楓意謂秋來變霜露饒他幾點特餘紅如是室向年入室人如是今嵗入仍如是人試曰相應定何者一篇説著古稀新蔚藻堂逺觀近攬總相宜筆硯精良又此時三百一言蔽之耳笑豫何必以多為翠風埭風自有聲却無色偶參合相愜於斯泠泠天籟翻崕落借得林光與翠之陵霞亭西嶺翻來晚照明林欺霞色鬬新晴今朝祗喜無纎翳豈計尋常點大清常山峪行宫三疊舊作韻壬寅黃土才過嶺青石梁東為黃土嶺過嶺即常山峪常山見目前蹕途數里近行館一溪邊知路步幽徑據床梯翰筵耐他今日景伴我古稀年野鳥殷勤語間花自在妍聖蹤欽想像瞪若敢云肩巴克什營行宫出古北口十里許以巴克什營為止頓殿五楹南嚮後殿左右各二重旁東西嚮康熙四十九年建規制純朴南望邊牆髙出山上雉堞參差與雲煙出沒惟聞潮河聲奔流入塞自昔安屯置戍之區今日田疇井里婦子嘻然不覺在邊關外矣兩間房行宫塞外多山出古北口四十餘里為兩間房行宫康熙四十一年建南嚮殿五楹額曰秀抱清芬曰鏡風含月後殿越小橋當山東北隅曰澄秋軒盤折而東髙出木杪有亭曰暢遂題額並御書塞外山川此地首當形勝自昔以兩間得名者今且成聚成都農鄽布列煙火相望雞犬之聲相聞矣御製詩兩間房行宫即景甲申樹陰深處覺微涼脫却單衣換夾裳開戶對山如話舊隔林見鹿不能詳庭禽喜客殷勤語砌卉當秋自在芳墾種人家已滿百昔名猶説兩間房兩間房行宫即景丁亥數典猶稱房兩間而今倍蓰聚鄽闤到來循徑欣憑座所喜開窗便見山繞砌秋花饒野意當庭古柏越蒼顔緑旗擬武陳觀罷古北口提標兵每於此陳習徑弓藤牌角勝枝輒於行宫門校閲行賞著句聊消片刻間兩間房行宫即景丙申塞外氣本清矧值新晴後白水自繞門青山欣入牖行館架五楹詎止兩間久每來供靜憩朴室饒虛受披襟喜爽涼夏五如秋九況罷軍書問兼冀農功有心怡神自謐得句亦無垢釣魚臺行宫在避暑山莊東北十三里乾隆七年建自熱河啓蹕至木蘭中關為首程釣魚臺為止頓宫門南嚮殿東嚮廊環邃宇亭枕屏山地距山莊甚近工人舊呼雙黃寺當熱河上流三源既會水勢涵蓄實産嘉魚故名釣魚臺云黃土坎行宫在釣魚臺東北十七里康熙五十六年建自熱河至中關清蹕止頓者再一為釣魚臺一則黃土坎也南嚮殿五楹後殿九楹左右各三重院宇明淨規制淳朴宫之北則賽音河會人固都爾呼河鄽道元水經注所謂武列水三川合派者也中關行宫在黃土坎行宫東北七十里康熙五十一年建南嚮五楹榜曰松間明月後殿榜曰雲林蔚秀聨曰松籟座中聞笙竽風遞山屏窗外列錦繡雲開過行宫東十餘里有峰嶄然洞穴嵌空錫名玲瓏峰自宫中望之縹眇雲際若方壺圓嶠可望而不可即也什巴爾台行宫在中關行宫北三十七里康熙五十九年建自中關至波羅河屯以什巴爾台為止頓南嚮大殿五楹後為永懷堂左傍喬峰石倚蘭若殿後陟山及半有亭清溪逺岫曠望髙深俯視則塞田萬頃秋稼盈疇可以見豐亨之景象可以驗膏澤之旁流也波羅河屯行宫在什巴爾台行宫北十八里康熙四十二年建殿南嚮後依崇巘前俯平林有額曰山泉賞曰秋澄景清曰簷際千峰聨曰山月滿庭篩竹影松風繞壑亂泉聲東望筆架三峯岧嶤隱見益知塞山清奧藴秀含靈又非荆關筆墨所能到也御製詩駐蹕波羅河屯丁卯涼颸獵獵裊旌斿乾鵲喧鳴霽景浮塞外山川還似昔谷中禾黍總登秋離宫平楚依清賞金令豐原事大搜鱗集名藩環道左愧豫何德此懷柔回鑾至波羅河屯大獮時修返翠鑾築場正及按途看村炊香氣騰饘粥頓解心顔為益餐此櫛崇墉似去秋今來稍解望年愁長官道左休誇稔耕九餘三好共籌行宫秋景尚清嘉喜先重陽對菊花丹翠林光依畫壁淺深山色入窗紗波羅河屯作己巳塞館清涼車駕停仰流鱗集衆藩屏亦咨力穡秋稱好蒙古今亦知稼穡為重矣更喜攻駒境永寧長計何須誇絶幕恩柔遂以撫來庭尋常視此殊艱致謨烈躬承勉德馨波羅河屯行宫作壬申秋日散清輝秋空澄碧落我意與之然去來何執著寒花步今徑陰樹褰昔幕會心足希夷容膝且寬綽是處有縹緗無妨讀書樂波羅河屯行宫作塞垣秋獮薄言歸别館才經草日違便有迎人三徑菊更欣送暖一窗暉興餘豪處應還淡思不紛時可入微試看滿庭張錦樹風來落葉亦霏霏波羅河屯行宫作癸酉一谷輕寒破曉風幾灣流水溯源通已看别館行來近且喜山田報處豐過雨秋苔依砌緑含霜野果綴枝紅底緣到此多吟興筆架三峰正峙東行宫東山峰矗立土人名曰筆架山波羅河屯行宫疊舊嵗韻白雲背塞垣紅葉間村落流來內地民日久成土著何敢誇奠甌惟是欽調幕連朝閲豐收劭農心為綽别館景依然靜憩饒清樂九日波羅河屯行宫作乙亥秋獮言從塞上還行宫佳節值清間花糕惠逮鐻鍝長綵筆吟聨侍從班數朵金鈴還栗里三峯玉架儼龍山行宫東山三峯矗立名筆架山詔人萬古如斯景河畔盈盈月一彎波羅河屯行宫即景己卯山峯過筆架行宫東峯俗名筆架山誰歟凌鮑謝河屯到波羅誰歟演檀那由來名象曾何關梵言華語都須刪太古以來此川野數宇行宫蔥舊間風清月白鎮如是那識客往與客還波羅河屯行宫即事庚辰雲裏遙看筆架峰到來行館憩從容鶻師狗監先來候甫草山猶隔幾重一株松樹滿庭陰可識離宫嵗月深攬鏡霜華略增昔於中不改繼繩心秋宇剛欣霽色䨑西山薈蔚復淒淒宣傳支帳尋髙升今夜恐防雨漲溪於波羅河屯行館作乙酉處處有行館匪奢惟朴佳秋搜常駐蹕聖藻永懸齋雲外山為障風前葉點階晚來霏細雨吟興又安排於波羅河屯行宫作丁亥青城何代迹蒙古語波羅為青又謂舊河屯為城此處有舊城迹故得名蔓草護堆沙獵囿經常駐行宫朴弗華向暄逢緑樹應節有黃花是日重陽明便承慈豫山莊喜不遐回圍至波羅河屯行宫作外藩都遣去內吏屢迎來納稼野村畢駐旌行館開潦消崕腳聳葉落樹根堆再宿山莊蒞心馳先幾回波羅河屯即景己丑舊城今不見蒙古語舊謂波羅城謂河屯新戶日加增難考金元迹欣看稼穡登黃雲一谷滿素節仲秋憑筆架矗東壁行宮東有筆架峯聞誰倚筆能於波羅河屯作二首一韻丙申青城仍此度蒙古語波羅青色又訓舊河屯城也民舍較前增內外寧界限耕桑到處興柔遐要安近勉繼亦貽繩蜀郡洞天在仙蹤底藉徴秋收逢倍好髙廩圃場增筆架度峰峻行宫東三峰峙立土人謂之筆架山詩裁即景興怡神行畫坐騁目緩鞭繩菜坂略資雨隨時驗庶徴至波羅河屯行宫作壬寅筆架逺瞻峰在行宫之東山行行别館逢風開林徑路露茂菜田濃最是心之賞室懸山泉賞額得之皇祖御筆也向有賦作寧惟膝所容青城譯舊語波羅河屯蒙古語譯漢則為青城懶惰問仙蹤賦得山泉賞壬午雲房聖藻懸志在賞山泉堪會知仁趣都包今古詮動歸緣有靜後樂以憂先實政吾猶未崇情祗喟然張三營行宫在波羅河屯行宫北六十二里康熙四十二年建北即石片子也地近崖口山勢雄竒峭拔積翠霏藍送爽迎秋雲煙萬狀嵗行秋獮東道由波羅河屯駐蹕於此殿額曰雲山寥廓過此則御行營逮木蘭回蹕宴賞從獵諸蒙古亦多於此舉行云御製詩木蘭回蹕駐張三營行宫之作丙子駸駸羽騎木蘭回别館依然此去來窸窣聲中楓葉下馣馦香處菊花開圃場且喜千村稔槖籥明參一氣培輔相對時繄我責無厭從獸豈宜哉出哨駐張三營行宫作丙申出哨行宫駐翠旄木蘭北望興猶豪往來幾日無多子窗牖明曦爾許髙先節黃花標菊逸經霜緑樹識松操諸藩散遣教歸去行賞因之奬衆勞張三營行宫即事己亥夜雨曉來晴山蹊厯坦平當秋看納稼未午駐行旌執役迎獵騎喀爾沁隨來之布圍蒙古例於此接駕獻新來射生不同往年事向年入崖口之前先遣射生者於圍場外捕得麅鹿即遣侍衛馳進慈闈以獻新味回思往事不禁戚然戚戚若為情濟爾哈朗圖行宫在波羅河屯行宫西北二十八里入圍埸有二道東道自張三營入崖口西道自濟爾哈朗圖及阿穆呼朗圖入伊瑪圖口乾隆二十四年命建行宫於兹地制最簡朴殿內御書聨曰所無逸而安行搜講武亦有秋可樂省斂歌豐濟爾哈朗圖者蒙古語安樂所也地在伊瑪圖川之右水泉甘美庶草蔚豐因以得名御製詩濟爾哈朗圖行宫作己卯濟爾哈朗圖者蒙古語謂安樂所也凡水草佳處則名之以居波羅河屯卜克打坂之中命發內府餘儲建行宫數宇以省行營駝載之勞工既落成蹕適旋駐賦以七字詩得二章北來按頓有行宫自熱河至崖口沿路行宫皆皇祖時所建卜克今年路再通致逺欲休羣畜力木蘭中以有獵場日行不過草數里自卜克至此七十餘里駝載為勞故建行宫以息物力發儲匪藉庶民攻溪山不盡足真趣藻繢毋施愛朴風容膝已佳此多矣禹無間處企難同納稼田餘􅕗穗多富秋厯閲喜無過一溪流水村前繞四面晴山戶外羅便犒諸藩歌湛露是日以圍罷宴賚諸外藩及行圍衆蒙古僉宣翰苑詠卷阿蘇門審勢差相似不約而同安樂窩濟爾哈朗圖行宫疊去嵗韻庚辰幾架巗齋也號宫山姿入望四鄰通恰欣秋令來棲宿況復西陲罷戰攻白石磷磷溪漲雨翠峰濯濯樹搖風分明去嵗初經地此日襟懷了不同已安容膝底須多茅土階茨較太過山是真圖非筆染戶無長物有書羅愛觀颯景開虛牖不盡崇情寄迥阿秋雨既優晴實好豐隆傍晚劈雲窩濟爾哈朗圖行宫作壬午卜克嶺名今秋西取途先臨濟爾哈朗讀作平聲圖戰櫜早慶貞符彼己卯過卜克嶺曾有詩時尚未定西域也安樂蒙古語濟爾哈朗漢語為安樂也非謀悅志吾黃野稼逢潦餘有碧空雲斂晚來無勤民習武均心黽詎為髙齋景足娛濟爾哈朗圖行宫作癸巳巖館枕煙郊獵還駐翠旓詎寧容膝愜那免暢懷嘲白髮存公道蒼山是故交巒楓盡紅葉庭栁尚青梢毆氏書畫舫邵家安樂巢蒙古語濟爾哈朗圖即漢語安樂所也藝編如有語慙愧四年拋未由此處行者蓋四年矣濟爾哈朗圖行宫作壬午癸巳向曾駐壬寅今重去聲臨訝看松檜古消幾樂哀心葉自當秋落鳥如話别吟九年才一瞬何以惜分陰四照亭口號行館依山圍石牆山亭四照額楣昂雖云遊目宜因迥可識一心遍萬方阿穆呼朗圖行宫在濟爾哈朗圖行宫北四十三里乾隆二十七年建殿內御書聨曰勝地叶貞符詩賡櫜戢那居供靜憩疇演康寧當西入圍場之路間嵗清蹕一臨架構無多而山色泉聲足資聽覽地在伊瑪圖口之外於獵場最近櫜鞬左右以候六飛阿穆呼朗圖者蒙古語康寧也御製詩阿穆呼朗圖行宫作壬午一宿圍場近搆齋此憩停天然足山水成趣得軒庭率省牽馱力堪頤情性靈顧名每思義寰海願康寧蒙古語阿穆呼朗漢語為康寧也阿穆呼朗圖行宫作甲申一由旬里路非遙滿谷秋田倍覺饒數宇軒庭頗足憩千廬竿幟各為招石泉陡澗銀拖界霽景嶤峰翠落標甌研適當神謐處間來摛句亦清超阿穆呼朗圖行宫疊壬午舊作韻丙戌今嵗從西進自東入木蘭由崖口進自西入則自伊瑪圖口進今嵗由西此處為必經之路行宫一宿停秋中涼滿谷樹久陰去聲盈庭景與神心洽山資翰墨靈射生獲新鹿命人於近圍場處獲鹿即遣騎進山莊使騎獻慈寧阿穆呼朗圖行宫作己丑秋獵路由西於焉駐馬蹄三年如昨日自丙戌至今始從此路進一晌閲前題蛩脅報寒鼓鳥喉話别啼嶺名欣卜克進圍西嶺曰卜克向屢有詩頗叶貞符願即協佳叶經略大學士傅恆月初當自戛鳩至猛拱佇盼俠音阿穆呼朗圖行宫即事壬寅獵蹕又從西十年景迅兮一區山表見千騎路傍徯蒙古行圍者千二百騎舉成數也以今日來迎至止成新憩徘徊讀舊題虞人呈初獲覩物益增悽丙戌年經此獲鹿即馳進慈山莊有射生獲新鹿使騎獻寧之句今已不可復得祗增悽感欽定熱河志卷四十四
