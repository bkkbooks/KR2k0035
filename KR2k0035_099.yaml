body:
  text: 故事一承德府全境越在關外自漢迄明惟遼金元三朝全得之其餘諸代皆分割參錯之壤也其一時用兵勝負封貢往來以及邊防營建行幸振貸諸典載在史傳事迹紛如於諸卷門類無可附麗而又不容遺逸爰别彚成帙以代相繫以類相從袪繁復而資參互庶一展卷間時會之興衰幅員之廣隘約略可覩焉志故事第二十二漢胸奴按漢初胸奴冒頓最強然其建庭直代雲中不在今承德府全境內今境乃漁陽右北平遼西三郡邊外與胸奴左方相接地也至武帝拓塞之後為漢塞地胸奴更徙而西北去今境益逺茲但就其有事於上谷以東者録之漢書胸奴傳燕王盧綰反率其黨且萬人降胸奴往來上谷以東時在髙帝末年胸奴數千人盜邉漁陽尤甚漢使將軍韓安國屯漁陽偹胡元光六年胸奴二萬騎入漢殺遼西太守略二千餘人又敗漁陽太守武帝紀作入漁陽敗都尉軍千餘人圍將軍安國安國時千餘騎亦且盡會燕救至胸奴乃去元朔元年漢書韓安國傳安國為材官將軍屯漁陽捕生口虜言胸奴逺去即上言方佃作時請且罷屯罷屯月餘胸奴大入上谷漁陽安國壁乃有七百餘人出與戰安國傷入壁胸奴虜略千餘人及畜産去上怒使使責讓安國徙益東屯右北平即元朔元年事漢書武帝紀元朔二年冬胸奴入上谷漁陽殺略吏民千餘人荀悅漢紀元朔五年春將軍李息將軍張次公出右北平擊胸奴漢書胸奴傳漢使博望侯武帝紀作衛尉張騫及李將軍廣武帝紀作郎中令李廣出右北平擊胸奴左賢王左賢王圍李廣廣軍四千人死者過半殺虜亦過當會博望侯軍救至李將軍得脫盡亡其元狩二年胸奴入右北平定襄各數萬騎殺略千餘人元狩三年漢書李廣傳廣以郎中令將四千騎出右北平博望侯張騫將萬騎與廣俱異道行數百里胸奴左賢王將四萬騎圍廣廣軍士皆恐廣乃使其子敢往馳之從數十騎直貫胡騎出其左右而還報廣曰胡虜易與耳軍士乃安為圜陳外嚮胡急擊矢下如雨漢兵死者過半漢矢且盡廣乃令持滿毋發而廣身自以大黃射其禆將殺數人胡虜益解會暮吏士無人色而廣意氣自如益治軍軍中服其勇也明日復力戰而博望侯軍亦至胸奴乃解去即元狩二年事漢書王莽傳遣誅貉將軍陽俊討穢將軍嚴尤出漁陽莽二年討胸奴也烏桓按漢武帝擊破胸奴左地因徙烏桓於上谷漁陽右北平遼西遼東塞外在今承德府北境漢書胸奴傳互見後漢書禹桓傳烏桓嘗發先單于家胸奴怨之發二萬騎擊烏桓大將軍霍光欲發兵邀擊之問中郎將范明友明友言可擊於是拜為度遼將軍將二萬騎出遼東胸奴聞漢兵至引去初光誡明友兵不空出烏桓時新中奴兵明友既後胸奴因乘烏桓敝擊之斬首六千餘級獲三王首還元鳯三年按范明友所誅之三王或係武帝所封或即自稱為王史記漢書俱未詳昭帝紀謂遼東烏桓反以中郎將范明友為度遼將軍將北邉七郡兵二千騎擊之觀胸奴及烏桓傳知明友本為邀擊胸奴而出特乘烏桓之敝耳後漢書烏桓傳烏桓復冦幽州明友輒破之元鳳六年宣帝時乃稍保塞降附漢書胸奴傳胸奴遣使者責烏桓稅烏桓距曰奉天子詔條不當與胸奴稅胸奴使怒收烏桓酋豪縳到懸之酋豪昆弟怒共殺胸奴使及其官屬單于聞之發左賢王共入烏桓責殺使者因攻擊之烏桓分散或走上山或東保塞胸奴頗殺民人毆婦女弱小且千人去置左地告烏桓曰持馬畜皮布來贖之烏桓見略者親屬二千餘人持財畜往贖胸奴受留不遣在平帝時按武帝所徙之烏桓在五郡塞外而塞上自為亭障之地宣帝以後烏桓始保塞乃入居塞上之漸後漢胸奴按胸奴當後漢時分為南北二庭自相攻擊罕為漢患南單于居西河美稷去今承德府境殊逺而北單于則更逺矣兹亦但録其在上谷以東之事後漢書胸奴傳單于畏漢乘其敝乃遣使詣漁陽求和親建武二十二年北單于入雲中遂至漁陽大守亷范擊郤之永平十六年延熹九年南單于諸部並畔遂與烏桓鮮卑冦緑邉九郡以張奐為北中郎將討之單于諸部悉降烏桓按烏桓在後漢時入居塞內今承德府皆烏桓地故于上谷等五郡為患尤甚後漢書烏桓傳光武初烏桓與胸奴連兵為冦代郡以東尤被其害朝發穹廬暮至城郭五郡民庶家受其辜至於郡縣損壞百姓流亡後漢書祭彤傳建武初胸奴鮮卑及赤山烏桓連和強盛數入塞殺略吏人朝廷以為憂益增緣邉兵郡有數千人又遣諸將分屯障塞後漢書天文志元興元年遼東貊人反鈔六縣發上谷漁陽右北平遼西烏桓兵討之後漢書烏桓傳永初三年夏漁陽烏桓與右北平胡千餘冦代郡上谷後漢書靈帝紀中平四年漁陽人張純與同郡張舉舉兵叛攻殺右北平太守劉政遼東太守楊終護烏桓校尉公綦稠等舉兵自稱天子冦幽冀二州劉攽曰案張舉自稱天子誤出一兵字五年九月遣中郎將孟益率騎都尉公孫瓉討漁陽賊張純等十一月公孫瓉與張純戰於石門大破之六年三月幽州牧劉虞購斬漁陽賊張純公孫瓉傳烏桓反畔與賊張純等攻擊薊中瓉率所領追討純等有功遷騎都尉張純復與畔胡邱力居等冦漁河間渤海入平原多所殺略瓉追擊戰於屬國石門虜遂大敗棄妻子踰塞走悉得其所略男女瓉深入無繼反為邱力居等所圍於遼西管子城二百餘日糧盡食馬馬盡煮弩楯力戰不敵乃與士卒辭訣各分散還時多雨雪墜坑死者十五六虜亦飢困逺走栁城劉攽曰案逺當作還瓉常與善射之士數十人皆乘白馬以為左右翼自號白馬義從烏桓更相告語避白馬長史乃畫作瓉形馳騎射之中者咸稱萬嵗劉虞傳中平初車騎將軍張溫討賊邉章等發幽州烏桓三千突騎而牢廩逋懸皆畔還本國前中山相張純私謂前太山太守張舉曰今烏桓既畔皆願為亂子若與吾共率烏桓之衆以起兵庶幾可定大業舉因然之四年純等遂與烏桓大人共連盟攻薊下燔燒城郭虜略百姓舉稱天子純稱彌天將軍安定王誘使烏桓峭王等步騎五萬入青冀二州虞復拜幽州牧設賞購舉純舉純走出塞餘皆降散純為其客王政所殺送首詣虞三國志魏武帝紀三郡烏丸承天下亂破幽州略有漢民合十餘萬户袁紹皆立其酋豪為單于以家人子為已女妻焉遼西單于踏頓尤強為紹所厚故尚兄弟歸之數入塞為害建安十二年公將北征三郡烏桓諸將皆曰袁尚亡虜耳夷狄貪而無親豈能為尚用今深入征之劉備必説劉表以襲許萬一為變事不可悔惟郭嘉勸公行五月至無終七月大水傍海道不通田疇請為鄉導公從之引軍出盧龍塞塞外道不通乃塹山堙谷五百餘里經白檀厯平岡涉鮮卑庭東指栁城未至二百里虜乃知之尚熙與踏頓遼西單于樓班右北平單于能臣抵之等將數萬騎逆軍八月登白狼山卒與虜遇衆甚盛公車重在後被甲者少左右皆懼公登髙望虜陳不整乃縱兵擊之使張遼為先鋒虜衆大奔斬踏頓及名王已下胡漢降者二十餘萬口遼東單于速僕丸及遼西北平諸豪棄其種人與尚熙奔東尚有數千騎遼東太守公孫康斬尚熙及速僕丸等傳其首烏丸傳裴松之注引英雄紀曰袁紹遣使拜烏丸三王為單于皆安車華蓋羽旄黃屋左纛三國志魏武帝紀裴松之注引曺瞞傳曰時寒且旱二百里無復水軍又乏食殺馬數千以為糧鑿地三千餘丈乃得水既還科問前諌者衆莫知其故人人皆懼公皆厚賞之曰孤前行乘危以徼幸雖得之天所佐也故不可以為常諸君之諫萬安之計是以相賞後勿難言之田疇傳疇常忿烏丸昔多賊殺其郡冠蓋有欲討之意而力未能太祖北征烏丸先遣使辟疇隨軍次無終時方夏水雨而濵海汙下濘滯不通虜亦遮守蹊要軍不得進太祖患之以問疇疇曰此道秋夏每常有水淺不通車馬深不載舟船為難久矣舊北平郡治在平岡道出盧龍達於栁城自建武以來陷壞斷絶垂二百載而尚有微徑可從今虜將以大軍當由無終不得進而退懈弛無備若默回從盧龍口越白檀之險出空虛之地路近而便掩其不備踏頓之首可不戰而擒也太祖曰善乃引軍而還而署大水表於水側路旁曰方今暑夏道路不通且俟秋冬乃復進軍虜候騎見之誠以為大軍去也太祖令疇將其衆為鄉導上徐無山出盧龍厯平岡登白狼堆去栁城二百餘里虜乃驚覺單于身自臨陳太祖與交戰遂大斬獲追奔逐北至栁城軍還入塞烏丸傳太祖自征踏頓於栁城潛軍詭道未至百餘里虜乃覺尚與踏頓將衆逆戰於凡城兵馬甚盛太祖登髙望虜陳栁城軍未進觀其小動乃擊破其衆臨陳斬踏頓首死者被野鮮卑按鮮卑興於建武之初至漢末檀石槐益強分為三部其卓帳雖在代郡北今承德府境亦其疆域所及也後漢書鮮卑傳永元十三年遼東鮮卑冦右北平因入漁陽漁陽太守擊破之延平元年鮮卑復冦漁陽太守張顯率數百人出塞追之兵馬掾嚴授諫曰前道險阻賊勢難量宜且結營先令輕騎偵視之顯意甚鋭怒欲斬之因復進兵遇虜伏發士卒悉走惟授力戰身被十創手殺數人而死顯中流矢主簿衛福功曹徐咸皆自投赴顯俱殁陳鄧太后策書褒歎賜顯錢六十萬以家二人為郎授福咸各錢十萬除一子為郎後漢書安帝紀元初四年鮮卑冦遼西遼西郡兵與烏桓擊破之互見鮮卑傳後漢書鮮卑傳永建三年四年鮮卑頻冦漁陽六年秋耿曄遣司馬將胡兵數千人出塞擊破之冬漁陽太守又遣烏桓兵擊之斬首八百級獲牛馬生口後漢書靈帝紀建寧元年十二月鮮卑及濊貊冦幽并二州熹平二年十二月鮮卑冦幽并二州四年五月鮮卑冦幽州五年鮮卑冦幽州六年十二月鮮卑冦遼西光和二年十二月鮮卑冦幽并二州三年冬閏月鮮卑冦幽并二州四年十月鮮卑冦幽并二州中平二年十一月鮮卑冦幽并二州三年十二月鮮卑冦幽并二州按後漢之季鮮卑屢冦邉郡兹取其與今境相近者載之餘不具録晉前燕按慕容氏自涉歸以後至廆及皓並受晉封逮晉咸康三年皓始稱王永和元年始不用晉年號故自涉歸以後凡有事於今承德府全境者並録之十六國春秋前燕録慕容廆父涉歸一名奕洛韓以全栁城之勳進拜鮮卑單于晉太康二年冬涉歸始冦昌黎安北將軍嚴詢敗走之斬獲萬計四年涉歸卒廆出避難五年通鑑作六年國人迎廆立之代領部落初涉歸與宇文鮮卑素有隙廆將修先君之怨表請討之武帝弗許廆怒入寇遼西殺掠甚衆帝遣幽州諸軍討之自後復掠昌黎每嵗不絶按晉書武帝紀載涉歸冦昌黎事作太康二年十月鮮卑慕容廆于昌黎三年三月安北將軍嚴詢敗鮮卑慕容廆于昌黎殺傷數萬人據十六國春秋及通鑑俱作慕容涉歸蓋慕容廆以太康五年始立也當屬晉紀之疏因廆後復掠昌黎而致誤耳晉書康帝紀建元元年石季龍帥衆伐慕容皓皓大敗之七月石季龍將戴開帥衆來降丁巳詔曰慕容皓摧殄羯冦乃至死沒八萬餘人將是其天亡之始也中原之事宜加籌量且戴開已帥部黨歸順宜見慰勞其遣使詣安西驃騎咨謀諸軍事十六國春秋前燕録永和元年冬十月皓以古者諸侯即位各稱元年於是始不用晉年號晉書穆帝紀永和三年夏五月進慕容皓為安北將軍前燕録作安北大將軍按慕容氏世受晉封自慕容廆於太康十年拜鮮卑都督大興元年拜龍讓將軍大單于三年加監平州諸軍事安北將軍平州刺史四年拜使持節都督幽州東夷諸軍事車騎將軍平州牧進封遼東郡公慕容皓於咸和九年拜鎮軍大將軍平州刺史大單于遼東公持節都督承制封拜一如廆故事咸康四年加征北大將軍幽州牧領平州刺史七年拜持節侍中大將軍大都督河北諸軍事幽州牧大單于燕王以是時未都龍城尚不在今境內故不録穆帝紀永和五年四月假慕容俊大將軍幽平二州牧大單于燕王慕容儶載紀永和五年僣即燕王位依春秋列國故事稱元年是嵗穆帝使謁者陳沉拜儶為持節侍中大都督都督河北河諸軍事幽冀并平四州牧大將軍大單于燕王承制封拜一如廆皓故事按十六國春秋載俊元年受晉封爵與晉書載記同而載記與本紀互異今兩存之考前燕慕容皓於晉成帝咸康八年十月始居龍城至其子慕容俊二年當晉穆帝永和六年復遷於薊今但録其在龍城時事北燕十六國春秋北燕録太平九年四月跋遣王特兒等入貢於晉魏章武太守捕之五月晉青州刺史申永遣使浮海來聘跋使中書郎李扶報之按後燕慕容寶永康二年始去中山走保龍城當晉安帝隆安元年至北燕馮跋太平九年當晉安帝義熙十三年中間與晉久相隔絶惟是年一通使餘無事可書宋北燕南史朱修之傳太武伐馮文通修之及同沒人邢懷明並從又有徐卓者亦沒魏復欲率南人竊發事泄見誅修之懷明懼禍同奔文通不見禮停一年會宋使至修之名位素顯傳詔見便拜彼國敬傳詔呼為天子邊人見傳詔致敬乃始禮之時魏屢伐黃龍文通遣使求救修之乃使傳詔説而遣之宋書文帝紀元嘉十二年正月封黃龍國主為燕王十六國春秋北燕録大興五年正月宏遣使詣建康稱藩奉貢於宋四月遣右衛將軍孫德乞師於建康按北燕馮宏大興五年即宋文帝元嘉十年宋書髙句驪傳跋死子文通立屢為索虜所攻不能下大祖世每嵗遣使獻方物元嘉十二年賜加除授按文通跋之季弟晉書載記魏書十六國春秋並同宋書以為跋之子誤欽定熱河志卷九十九
