body:
  text: 藝文七本朝詩恭和御製出古北口得詩四首元韻于敏中巖關洞闢綵斿過塞上風雲儼護訶形勝此間南北合全收兩戒入山河舊部新蕃侍獵同周阹漫詡上林中梁騶何有長城限今日伊西是外墉維魚豐兆信猗歟到處茨梁蔽舍廬關外歡聲比畿內什三免賦詔隨輿秋半恰冝巖鹿哨霜前初見塞鴻征丹楓緑桞參差間一幅營邱畫裏行前題王鳴盛留幹雙崕七校過雨師灑道作前訶昨晚微雨蒼煙紅樹秋嵐外一線淙淙響白河熙熙文軌萬方同重鎮雄關坦蕩中漫道邊墻古設險任教耕牧上髙墉六穗雙岐信有歟囷箱露積滿田廬豐穰關外同關內處處衢歌候翠輿七十二坳太行脊冷陘遼碣信遄征黃圖直拓于闐外兹地渾如户闥行恭和御製灤陽墅放歌元韻竇光鼐興桓千山灤水出離宫經構半水陽就中架巖開别墅漩澴俯視舟可方南有留幹古塞之峮嶙北有山莊列岫之環張在昔仁祖日肆覲羅名王四十八部享大邦車牛熐蠡鮮膏薌我皇嵗狩躋斯堂維時聲教訖伊犁哈薩布露回部二萬餘里如要荒啓仙館兮重扄眄崇阿兮千常翠雲迥榭生虛涼小金山宛浮澄江林丹澗碧相炫耀夕嵐晚照含餘蒼天風瑟瑟石瀨湯湯浩歌叢雲晞景扶桑微臣授簡局強韻徒慚墨守同公羊恭和御製題敞晴齋元韻陳兆崙髙齋因地敞勝覽及秋晴暖愛村煙色香知澗草名畫屏開逺勢緗帙引崇情何以酬風日慿軒四韻成恭和御製繪韻樓元韻劉綸常言畫境奇如真肖羣動於真又疑畫天倪鑿無孔乃知韻勝時衆妙此兼總結樓署新銜山靈亦驚寵盡發煙雲扄一一奎章奉恭和御製山行原韻劉統勳勤民紀事動成詩尋鹿山行寓靜思偶以入林成野趨轉因摛句得新知幽探巖壑藏無盡格凖風騷出愈奇罨畫雲巒回夕照清機環引聖情怡前題于敏中塞苑山呈畫裏詩意行隨處發清思風雲引勝延緣入泉石逢佳閲厯知尋鹿蹊回餘曠奧探驪句得總神奇知仁翕闢真機盎動適天倪即靜怡恭和御製塞山風景原韻劉綸下帳傳鈔上塞吟九邊佳勝繪分陰青莎閏後重裀淺絳葉秋前一幕深馬垺長筵因雨罷圍中以雨等進諭停蒙古王公宴鹿場清篳待霜尋時鹿哨莭候尚早天山卓歇同餘暖負弩歡增黍穀心恭和御製命製鹿角椅並題以句元韻劉綸有美丰茸質言裁曲録能即供當寧御猶記列仙乘武帳威難缺文茵雅合承雲莊尊鶴馭寶閣度龍興制擬攻工補時兼月令徵分解御製鹿角記于冬夏之候辨證精核足正千古傳訛賦形昭物則異巧底須稱前題于敏中器以因材貴工惟尚象能合模仙角具端拱法宫乘瑩若雙瓊戴森然八柱承式型遵聖作示儉溯龍興手澤詩曾述癸亥觀幸盛京有鹿角御製敬太宗所御椅詩心裁記並徵辨麋御製鹿角記鹿角之訛座銘體無逸詎為揣形稱恭和御製萬樹園賜宴即席得句劉統勳天香馥郁玉津長苑樹陰清御幄張上夀奉觴旋右陛示慈錫爵引中央屏藩職貢虔無懈瀛海兵銷樂且康兩序班行聞好語西濛秋稼滿倉箱恭和御製肩輿入西峪即景成什元韻劉統勳山外愛㟏岈山中喜平衍西峪具靈秀佳處隨意轉恭繹即景詩儼如圖畫展泉坳可灌溉石笋冝致輦入望情已遙既過興猶繾雜花與時鳥點綴悉完善目謀詎無神瑩景自辨倪黃富邱壑雋味嗜一臠到此應憮然拘墟知不免前題于敏中苑西多岨山入峪喜曠衍風來谷含峭雲斷徑忽轉巖扉窅􅌄闢峯坐凹凸展山堂峙秀起磴級可容輦新境臻益佳回蹊陟餘繾因髙乃見下道得潔矩善譬之登岱嵩培樓一覽辨瑣若列餖飣鬱若陳膾臠圖經標洞天穿鑿嗤未免恭和御製登四面雲山亭子作歌元韻于敏中山亭􅗥立霄漢上諸峰羅列山腰齊夏雲四面幻雲海蓮花擎出蓮葉低西霞東照南積雪餘縈繚者皆能稽俯覽遂造閬風頂時有霱靄緣來蹊涼生噓吸通皓氣泠然恍見飈輪躋千巖萬壑在指顧晴晦瞥爾殊䨑每來吟眺敞蕭宇鐫刻翠墨光崖溪山靈訶護復解事更喁爽籟邀新題恭和御製放鶴亭對鶴作歌元韻董邦逹清標玉立何亭亭芝田飲啄恆關情自入蓬萊叨豢飬舊時六翻生茸翎愛向天家傍瑶檻九皋鳴出生成感食粟將雛意已便翔雲警露心何慊懷仁戀德鶴有斯補經應繼浮邱為恭和御製移松元韻于敏中松性本徑逹移植當夏長既離叢薄翳乃識泰宇蕩左詩慰蔭鬱璪筆釋枯強自天栽者培得地全所養幸因潤溽暑矧復託豐壤疏碧倚石森新柯眄庭敞之而勢與遂􅕜㙷滋益廣詎惟十年計行作百尺想恭和御製濬溪元韻于敏中山溪挾沙易濁淤濁者冝滌淤冝疏今來苑沼值清夏因勢利導籌良圖斗泥畚益培塿長丈葑捲讓菱蓱鋪離褷照影時下鷺瀺灂數計多遊魚樂成事半功乃倍既復舊迹恢新模決渠歌欲徵鄭白祝田笑豈鄰淳于嘗聞即小可喻大神禹剔鬟之智猶是乎恭和御製登永祐寺舍利塔作歌元韻劉綸興桓古之北口北盤盤捺鉢淩虛無山莊閟剎鎖雙楔其上乃有穹塔縹眇懸仙都辨方協紀厥位艮史告吉卜牖見足闢堪輿誣青邏萬樹園名翠矗一峰錘影互離即不數螺尖浮玉鈴語流南徐中央九級平安旁出八櫺拓元工司契象外呈神模佛説標身標口此標意見峯塔御製玉詩注印可五際皈三途我皇省成天筆記本末豐碑典重靈只扶溯昔肇營四衛拉特叩關至事具塔記御製疆索太濛戴極聚米同闉郛兩年凖部五年回部勳大集及兹周甲事半功倍運掌如示諸是塔以十年工峻載瞻普寧寺亦以四部來歸時敕建崇閎走重譯氣壓固爾札廟西陲舊日名廟膜拜鎮彼墟矧復環以降藩比屋為爻閭什山莊東北皆逹達瓦部衆所居看取行秋絶頂王會開全圖恭和御製味甘書屋原韻于敏中煎茶味其甘寓意事甌銚酌兹石泉腴藐彼崖蜜誚臨流可用汲詎襲瓶綆貌書屋清且佳隨冝適真好竹罏貯山房異名乃同調恭和御製靜餘軒元韻彭啓豐兀坐見太古穆然溯皇初動靜相環生要道無所餘觀易玩來復樂山冝安居水流與雲在性體恆徵諸主靜立人極敬勝針丹書藴真藏至寶睿照涵清虛自得有真相即此為如如恭和御製出古北口作元韻劉星煒邊柝秋清畫角寒相烏風轉戍旗竿皇馗九軌平如掌跋馬能隃十八盤員渠納賮欵關門厄塞空餘睥睨存絶勝亂山通小徑潁濵句子試重論虎歇翹關禁旅同是日試緑旗兵藤牌挽強手搏諸技賞賚有加朱提清醑賚尤豐跪聆天語溫如纊那有陰山雪未融恭和御製喀喇河屯行宫作元韻于敏中望裏雲莊嶺路東川原迤邐景尤同鱗居嵗阜村煙密獵騎秋肥塞草豐逺水拖藍縈畫墅小山浮玉冠花宫清吟漸覺輪輝滿仙籙三元月近中是日為中元前二日恭和御製至避暑山莊作元韻于敏中雲山四面蔚林光天闢神皋聖闢莊貉表行搜驤逸驃日以上每行圍回鑾啓蹕即御御騎為常始聞輿輦雁臣入覲旅中黃都爾伯特郡王策淩烏巴什等於廣仁嶺前覲謁即諭隨侍衛扈行駐將輝罕循東道始駐蹕至中秋後幸木蘭圍場規得都綱控北荒山莊東北仿固爾扎都綱之制建廟今適落成錫名安逺以示柔􅜯之義井里殷闐豐已屢即功猶為厪田康恭和御製登舍利塔元韻于敏中奇觀創龍塞傑構超雁臺戶豁星斗入標跨風雲開斷手十年絫塔經始於乾隆乙亥至甲申春蕆工躡足九級搜法華寶全湧只樹香交回塔傍即萬樹園逺駐西竺輪俯殷南山雷􅐓洞通皓氣􅌑瓏淨氛埃鷲翼此翥騫象步時邅徊諸天妙鬘護極頂瞻如來前題劉星煒溫旃檀林駊騀蓮花臺九級盤磴上八牖凌雲開玉􅙞閟精爽金鈴懸嵗嵬敲景磬石秀倒影灤江回珠旒朗慧日塔建永佑寺鐘梵闐殷雷艮位鎮窣堵震旦袪氛埃燈王受調御法駕斯邅徊佛言息辨囿此峯寧飛來恭和御製灤陽别墅元韻尹繼善何年成别墅一徑入雲深虛室風生座髙秋月滿林山明呈畫卷水急響琴音嵗嵗遊觀地天然入睿吟前題于敏中仙墅灤河北登臨嵗月深新涼生澗户逺景帶巖林水淨魚知樂秋髙鹿有音夜來還聽雨簷瀑助清吟喀喇河屯頗望雨是夜甘􅉈優霑惠多御製有即欣夜霔巖齊聽正利晚田農之句前題觀保别館詒謀逺雲扉入望深泉甘魚在藻山靜鳥依林自有煙霞色何須絲竹音幾餘欣寓目景物助清吟恭和御製至避暑山莊即事得句元韻尹繼善玉輦初臨放好晴祥雲出岫早來迎千山翠色冝朝爽四野觀聲見衆情縱有池亭供眺覽時於場圃望充盈熱河雨澤略少時蒙厪僉敬思四十年前事祖德難忘本至誠前題于敏中嶺路雲開敞曉晴仙莊如畫馬頭迎涼颸最愜延薰意秋稼尤紓省斂情香界裝因安逺設安逺廟仿固爾札廟之式為之諸蕃素重黃教來增覲者尤抃喜星廬環似會朝盈麗正門內增設各部院直廬一如正朝之制更欣市值平於昔樂在綏豐信益誠今嵗市中物價較每嵗尤為平減恭和御製金蓮花元韻申甫仿佛銀塘植亭亭塞水堧自舒明月夜偏映夕陽川寶炬傳鼇禁華芝緬鶴田文殊方示現處處湧金蓮恭和御製題紀恩堂元韻尹繼善卅載前叨眷育恩山莊猶是舊林園覲光此日思文祖侍宴當年識聖孫康熙壬寅年春祖眷上於年圓明園之牡丹臺侍宴蒙聖顧其扈侍山莊睗居於萬壑松風今於申感御園顔堂曰紀恩以慕翠黛千峰秋日冷丹楓萬壑晚風翻於今亭沼留題處念念追維凛訓言恭和御製淡軒元韻觀保寒山秋雨過澄潭一甌積正如醴無源隨處湧靈液瀠洄淡不流方圓漾圭壁層軒俯青光瑟瑟動瑶席遙企川上心皇情有餘適恭和御製興州攬古言懷元韻汪廷璵今之神皋昔阻荒近代遺迹簡佚亡猗歟皇圖跨亥章日月出入測袤長興州之壤淀名涼其俗務本豐屢償司徒司空宣畝詳車攻令典巡東方秋初奉輦來雲莊流覽井牧歌浩穰逺攬間討名山藏儒臣誰擅班馬香毋沿魚豕體例妨皇指示之職業揚煌煌編載逢時昌恭和御製塞垣元韻于敏中繚垣迤邐亘崇阿佳景環生塞苑多雲削芙蓉排萬嶂波澄綺練貫雙河人家煙樹春城似仙界林巒福地過六山莊前後各三十景適符福地之數檢點山經兼水志操觚其奈鮮聞何時奉臣亦敕編輯熱河志恭與校勘恭和御製塞草元韻尹繼善恩深無處不培滋紅滿楓林緑滿陂塞外溪山吟未了還將小草入新詩恭和御製千尺雪元韻尹繼善曾經江外看飛雪又喜從遊到此間千尺泉聲穿石罅似聽琴築響秋山亭邊對瀑思前夢却比江南景更優江南寒山冇亭對瀑智樂天機原在水好從活潑問源頭䰐鬖白髮叨恩遇石徑探幽步未孄恰與香山詩句合忙人到此亦須間恭和御製旃檀林八詠元韻于敏中風香海風輪轉大鈞非空色界淨塵因入林吹萎還新好天籟隨機指示人雲縹眇煙非幻蜃樓妙鬘垂罨碧林浮坐看起處還無住應有諸天自在遊月月不留波波自渟中邊了徹總隨形娑羅超出衆香國妙境光明得未經松作蓋合於香界護聆音或有法螺吹靈胚琥珀何年結證大因緣是此時楓巖坂奚論青與丹色香分别漫更端若參八百鼻功德檀炷楓脂豈兩般花聞説天花散霧鬟曼陀紛集有無間已空結習何曾著合付維摩一囅顔鹿只林遊不涉行藏曾聽華嚴第幾章銜得巖花參上乘三車妙演梵天王蛩鳴竅偶然窺寶月塵根小許拂香風音聲求處如能見八識應分别草蟲前題汪廷璵風霜裏鐘清送萬鈞簷端幡影逗初因來皈調御求襌悅度盡聲聞學道人雲都梁馥郁結為樓兜率天宫妙鬘浮五色光中仙樂度獅林欣仰寶幢遊月石壇虛敞碧潭淳千月還如一月形寶相天中懸慧照絶勝燭下讀傳經松已看纓絡枝頭綴疑有笙簧煙外吹初地植來先結蔭便如五葉證襌時楓一葉吳江色易丹碧陰未改鷲峰端只因法雨霑來近真覺人天境一般花優曇林裏坐螺鬟香在蓮臺彈指間乞得如來拈一笑欲將意蕊奉金顔鹿寶筏誰探貝葉藏三車倩載度人章聽禪已化山林性花裏時來迓法王蛩龕下長明能伴影月中梵唱共吟風苾芻淨植欣依託智慧還期度草蟲恭和御製網魚元韻于敏中澄湖魚計滋出網豐且美大哉好生仁多取非所喜銀絲足縷膾素鬐矜失水縱之任泳潛洋洋化機裏伊誰觀朵頤而欲動食指敬惟曩南巡陳漁罷渒彼只候南巡駐西湖地方大吏陳漁舟屢敕罷之以遂方春生育之令順時全鯤鮞亭育凖乎此與物留有餘是亦愛之理恭和御製待鹿元韻于敏中千峯紫碧夕爽來鹿羣濯濯秋山隈馴依嘯侣自麋至譬彼逺服懷綏徠或飲於池或蹲地或食蘋蒿蔭林翠咸若及物全天倪茂對以時鬯生意待之不迫詎奔走躑躅芳坡任先後如大舜居適與遊聞文王囿樂其有山莊木蘭判若何於彼示獮兹育和哨期猶可兩旬計時距進哨之期尚二十餘日西風涼未翔駕鵝恭和御製山卉原韻汪廷璵山窗隨意攬叢芳深院秋光蛺蝶黃開亦可人無俗艷種雖近草獨清香數畦低映蕎花細一穗平分黍粒薌得與階英同入詠散材喜比蓼蕭瀼恭和御製行圍二首一韻前章即景後章即事元韻尹繼善獵騎淩晨繞翠微秋深景色暢天機平原草緑莎為毯曲磴苔斑石有衣逺樹經霜林欲瘦野蘋著雨鹿初肥岡頭立馬渾如畫一望蒼煙幕四圍晴靄初生逺黛微穿林連中妙神機槍排虎穴風生岫草沒驦蹄露滿衣七校頻分泉府賜千官屢飫大庖肥由來武備傳秋獮不忘先勞式九圍前題于敏中木蘭今嵗峭涼微峰景青紅錦一機信雁呌雲初作字候蛩飲露未催衣今嵗候暖哨內尚未有霜人過短彴回溪窄馬趂平蕪帶雨肥布帳家家猶露坐無須榾柮地罏圍木蘭每至此時多爇薪擁坐今年尚不須親火也周阹初合曙熹微按隊分旌待指機總為先勞操轡組共欽神武御弓衣參連中鹿坡前殪每日行圍鹿殪上皆連發矢射之三錫名騮塞上肥天閎連得良馬蒙睗號者凡三孱弱未嫻陪羽獵割鮮何幸屢頒圍臣頻蒙實感特賜圍中所獲鹿異數欽定熱河志卷一百十三
