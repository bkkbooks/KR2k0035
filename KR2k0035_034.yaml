body:
  text: 行宮十臨芳墅知魚磯湧翠巖素尚齋永恬居臨芳墅水流雲在亭之隔岸西折而南臨芳墅在焉殿五楹其西楹聫曰岸花霑露滿湖月漾波寛為聖祖御筆墅左右則曲渚迴汀藥欄荷沼咸吐秀於晨風夕露間對清華而供吟賞一莖一葉悉含生意矣御製詩臨芳墅甲戌曲阜平岡縁蹊被隰無葩不秀有卉皆芳别墅數椽自足幽趣竒葩異草四時芬八百功常鼻觀聞是藥是花俱採取文殊於此亦疑黂臨芳墅己夘别墅水之涯清華復静美團團榆槐隂羅羅花藥蕋偶憩如乆居心恒不離此不離此縁何簷額揭妙㫖對時育物心翥鳯飛龍體臨芳墅庚辰義取對時将育物候過葉緑與花紅分明羲畫標微㫖一氣貞元無始終臨芳墅口號辛巳别墅蕭閒碧水涯中秋依舊有荷花臨芳設問為誰宅應對濓溪周子家臨芳墅癸未軒文題墅繹思長面對秋荷绽滿塘端識聖人愛君子寧徔凡卉賞芬芳臨芳墅壬辰面山兼面水仁智樂兼斯近沼風來爽逺峰隂上遲過弦月漸朗艤㟁舫相随待夕澄瀛泛言看色景竒題臨芳墅乙未野花繞砌燦芳㽔待月開船每在兹墅落西山赤烏早岸披東沼素蟾宜倚窓如舫狎鷗彼㩀座平林友鹿斯去嵗今年何所異鏡中増得㡬莖絲知魚磯臨芳墅前殿五楹面南皇上御書額曰知魚磯踞湖之北與采菱渡對可一葦杭也每蘭池澹沱鱗族出逰時躍時潜並呈天趣豈特莊惠知魚之樂辨之濠上者耶御製詩知魚磯甲戌湖水清甘魚樂國也石磯臨流無心垂餌相忘之適當非濠上所知出水輕鯈樂意洋臨磯欣覺會心長由來萬物天機適安用勞勞辯恵莊知魚磯己夘古樹两株水一溪逰鱗潜躍任倪倪底湏博辯誰知者了識䝉莊未物齊知魚磯癸未莫道魚無知亦有在沼時莫道魚無樂亦有浮而躍魚自樂魚自知耳知樂否乎辨可已月在天心風在水不言之中存至理知魚磯癸巳石磯臨碧沼即景號知魚不擬風生浪常看月入虚躍潜随適耳綱釣搃忘諸恒此開蘭舫塞湖載望舒湧翠巖瀑自巖而下巖間殿三楹東向聖祖御題曰湧翠巖殿後為佛廬有樓三楹額曰自在天聫曰松逕飛花雨蓮䑓藹法雲並皇上御書每朝暾初上曙露未晞飛瀑中烟巒布濩恍疑大士説人天妙法倐忽慈雲遍滿大千界内若雨後瀑懸磬飛林外鐘度雲中則又妙演潮音於空際聲現色中相也御製詩湧翠巖甲戌石罅泉源出山莊西北淙淙潺潺下為瀑布依巖為佛廬隔林明殿三楹東向晨曦朝爽空翠四合㧞地青蓮聳德水天人來徃作音娛驀逢杖錫權教住試問眉毛拖地無素尚齋山莊邃境曰梨花伴月最上一重殿五楹面南聖祖御題額曰素尚齋地在山巔因髙得勢軒宇曠然階下梯級百重長廊翼覆仰視如天中樓閣而結構渾樸不施雕繢堯茨貽則堂構留思天藻繹吟每為拳拳三復云御製詩題素尚齋己巳山莊山水佳天然去雕飾是齋顔素尚古風猶可識開窓見千峰對之有所得揮毫戒繁華聖人示我則題素尚齋癸酉數間樸屋萬山中鹿豕為逰溪壑樷造物由來敦素尚書生未足詡家風霽空色朗依峯白雨葉聲䌓㸃砌紅近嵗遥年頻撿校㡬畨静悟不同同素尚齋甲戌梨峪清軒不施雕繢丹雘皇祖常所御處崇朴素明雅尚備見扵天筆標題两字中矣棄日無過静讀書讀書静合是山居披翻却又難耽静無逸明明啟迪予素尚齋乙亥風勁樹葉稀秋深澗流細盡掃丹翠紛全露峯巒致巖居委宛藏磵道﨑嶇試騁懐煙霞標逰目塵囂外素尚亦頻來兹焉契真義素尚齋即景丙子蕭蕭落葉下亭臯入牖峰棱瘦且髙盡洗鉛華歸素尚頓捐色相得真陶五三了可恭幡蓋咫尺那湏想濮濠結習由來未忘却率因即景一摛毫素尚齋丁丑㡬灣流水㡬橋搘嶺複閒齋宛在兹蓄目髙秋原恰當印心昔景不曾移蕭然自是樸斵好紛彼何煩藻繢施詎止崇情惬幽賞風聲敦俗要於斯素尚齋戌寅齋接永恬居相望平聲前後廬磴廊斜轉上巖牖朗開虚得趣景殊状題名義各臚要同歸静觀去聲一致每欣於素尚齋己夘太古山中室髙秋時節天有懐惟淡泊無物不神仙候暖林猶翠露繁花益鮮却嗤芥蔕者動説俗塵蠲素尚齋庚辰古屋剏堯年奎文寳構懸理叅従檏趣治覺返淳賢甄性神明境陶情翰墨筵淑清此埏埴灜臺淑清院中書室亦顔之曰素尚齋義取諸此終是遜天然再題素尚齋磵道津橋試重尋巖扉耐可惬予心虚庭煙月誰同調上塞氷霜我素襟四壁詩題自今昔一窓冬日是光隂迤西更闢新齋在不厭山深轉就深素尚齋辛巳詰屈山徑幽緑雲蔚其上綫天中得路到齋却寥曠向來延縁䖏歴厯都在望五楹所虚受峯巒乃萬状偶此寄崇情于焉惬素尚素尚齋壬午永恬居後齋百級拾廊階既迴眺因逺當秋攬總佳不遷谷神景恒識聖人懐返樸闗行政勤思六宇皆素尚齋癸未軒楹無藻飾圖史有芸香示後惟欽禹起予寧待商野花似蘭馥幽籟過松涼行飯辭輕輦攀登百級强素尚齋甲申書齋猶在上便與步丹梯恱志延新趣欽心仰昔題泉聲銀鑿落樹影緑玻瓈髙嶺夕陽好看時旋旋去聲低素尚齋乙酉莭梲非山藻林嵐近梠扉延懐疑月窟觸目暢天機秋景正寥泬爽風落翠微淑清此數典西苑淑清書院室亦以素尚名之尚志仰前徽素尚齋丙戌倚巖㡬架搆書齋尚不期華素是佳豈曰獨稱山水趣化民當日寓深懐素尚齋丁亥書齋更山上疊磴以廊通每仰額垂手常欽儉率躬野禽呼檻外蒼鹿過窓中尼父言詩㫖玩辭義不窮素尚齋戊子飛廊陟巖磴上復有書齋既是無俗尚因之惬素懐山禽寂窺户梨實落鳴階雖則片時坐永言意託佳素尚齋己丑梯巖疊石磴其上覆雲廊拾級隂森處軸簾前後堂是齋在永恬居上即前後屋也近非費物力髙可挹山光題額相輝映繹思垂訓長素尚齋庚寅斜廊将百級齋乃搆其上濟勝步㤀疲居髙目宜望凸巘與凹壑無所逃形状豈藉繁藻繢真存太古様因之坐成乆心焉惬素尚素尚齋辛夘拾級迴廊上畢窮前後齋更髙目斯豁尚素意尤諧樹蜜不遮户草生直到階當年斯示儉聡聴敢違乖素尚齋壬辰拾級猶饒百步攀坐開窓戸俯林闗問予素尚于何是祗在青山緑樹間素尚齋癸巳人孰無所尚其間惟素宜苟非務華目庶可不紛思林宻風還度山深涼自披迤西有佳處步輦向前移素尚齋甲午齋更居之巔迴廊攀以上愈髙斯愈豁聳目欣蕭朗鳴禽語殷勤犮鹿來三两山花雨後開山蝶大於掌物具天然趣夫誰勞意想素固匪因縁尚亦豈勉强今日適清閒棧溪向西徃素尚齋乙未更拾丹梯上有齋素尚顔東西帶碧澗南北峙青山塵俗自應逺華囂不藉閑詎惟供性賞政教每因闗素尚齋丙申拾級陟迴廊㩀牀坐素堂嵐光飛翠逈松籟落空涼會景忘今昔潜心䆒縹緗尚哉知禮後得矣起予商素尚齋己亥巖廊重攀陟文席小棲遲山夏還依舊松風特相入聲宜乗閒堪綴墨觸景憶含飴两字欽心繹千秋教意垂素尚齋庚子􅓏歩上岩廊齋在岩平處窮幽乃得曠是可會理趣朱補格物章貫通無不具後聖契先賢我于朱皇祖究心性理子尤特表章顔齋日尚素于心祛紛馳于境得絜矩叶如舜恭南面萬㡬舉而措素尚齋辛丑素尚接永恬必由迴廊陟聊乗一時閒那惜雙步力然匪窮逰興寔用緬先式盖欲恬心者宜以素為則居安斯禮復去華在已克堪以註魯論永言謝淵徳素尚齋壬寅仍步岩廊上山齋宛在兹古稀有二矣祖徳敢忘之修已即為政勤民要課時如云敦素尚却覺費新詞永恬居素尚齋之前殿五楹面南聖祖御書額曰永恬居後三十六景至此攬其全伏讀御製詩以引養引恬慎修思永之㫖紬繹天文義至深逺盖山莊水木澄明烟巒静妙肖翹動植盡荷生成我皇上臨御以來一逰一豫歛時敷福薄海内外永慶安恬所由放彌六合退藏於宻者與御製詩題永恬居己巳夷嵕築閒館邱壑占幽偏落葉如聴雨開簾不捲烟景光新意趣書史舊周旋道味真無斁心恬足永年永恬居辛未搆築深谷中嵐靄幻朝暮名之曰永恬允得岩居趣叠樹罨蒼翠曲流繞蹊路仙卉四時芳竒峰一窓具澹泊足恱怡㫪容而静窹買山合周孔羲經於是注題永恬居壬申簾垂四壁幽忩入千峰絢樝棃熟自落野菊艶初綻青宻鳥未驚紅殘蝶餘戀誰與幻山色輕雲飛一片便可寄題興舒箋掞柔翰永恬居癸酉山不厭其深屋豈期其華巖居非雕繪叠樹相周遮恱性適因静會心奚必遐命筆戒綺言澹泊以為嘉永恬居甲戌山中境爽氣和致足怡神恱性既佳風景且樂阜安引養引恬慎修惠永皇祖御題齋額意在斯乎壺中瓊島鬱懸居景物惟恬氣象舒已是洞天𫝊玉簡得教福地續琅書永恬居乙亥峯翠屏張後溪清帶繞前重臨舊書室静對好秋天不約神襟朗那求俗慮捐偶成四十字但未必皆賢永恬居丙子精舎築山深雲逕殊窈窕始披䝉絡入忽㩀槎枒表瀑細石骨瘦霜澄峯態皎六情不期恬萬慮何能擾逸興託髙清妙契良不少永恬居丁丑雲閒欲歸牖山翠每迎檐景趣來來别詩題旋旋添梓材養昔引蘓對花新霑泞待縛渠獻逆賊阿睦爾撤納復投哈薩克軍營阿布頼欲縳之以獻逆賊竊馬挟六騎夜邇阿布賴窮追指日可獲干戈戢永恬永恬居戊寅水複山重處金風玉露時僻非塵所到静與性為宜居永真堪憩心恬恰好思所思在何許皇祖聖踪遺永恬居己夘地僻山深未可耽君師責重一身兼簷端寳訓分明示寰海蒼生要引恬戯題永恬居庚辰今日來思後日去去來歴歴正何嫌讓他書舎千峰裏樹態雲容此永恬永恬居疊舊作韻庚辰一谷温暾日坐來滿屋簷餞秋冬景破半百鬢星添松翠雪輕壓楓紅霜飽霑卷阿真愜意魚海洗兵恬舊作有佇待俘渠獻干戈戢永恬之句永恬居庚辰冬山淡如睡巖居益致静所耽在泉石寜辭䟦寒冷野橋度數曲似入神眀境林扉詎藉敂仙界奚煩請翻嫌紫翠艶都覺色空屏歸藏有餘藴樞紐於焉省觸縁愜性靈不期坐已永永恬居澷題辛巳闗内度秋霖一刻似三日闗外閲晴稼日三似刻一歴喜易愁難百年同是律何如太古山復此虚白室無喜亦無愁止止恒祥吉永恬居壬午詎是陶家逕依然松菊存流隂閲吹葉至理悟歸根鹿麌動皆静禽音靖不喧袛宜諸慮浄仍繾一人恩永恬居癸未翠隂覆曲折有路草纎纎出樹即為墅入山了不炎軒窓惟静寄書史供去聲清拈底識斯居好能令情性恬秋日永恬居癸未素景又新投昨年纔瞬眸繹思恬者靖恰悟莭臨秋露浥花香泛風翻葉翠流一雙閒瓦雀棲樹懶飛浮永恬居甲申駐乆方言至居真委宛蔵憑窓思昔景開牖納山光蛩有殷勤韻花惟自在香永恬垂聖訓甄性那宜忘永恬居乙酉一澗前階帶千峯後户羅山莊景誠冨今嵗此初過窓畫依然好壁題漸以多向陽常覺熱秋矣識無何永恬居丙戌由東斯為登由西斯為下適從創得降言憩可因暇接待有佳趣天真非假借烟壁峙前虚石泉淙底罅心神不期恬永言觀妙化永恬居丁亥山居幽谷裏聖藻泐楣檐為去聲念恩勤永兼欣情性恬座間臨樹杪忩隙入峯尖安得恒斯坐義探書理潛永恬居戊子食蔗與永恬相隔祇一嶺越嶺不數武復覺殊山景乃知仙莊竒歩歩進佳境幽居㩀𤱔平既深斯致静視聴寂諸縁澹懷黙以領永恬居己丑仄蹊原熟識􅓏歩逺何嫌峯險鹿單過樹深鳥互覘到欣書史伴坐覺性情潜萬刼秋山色天文與永恬題永恬居庚寅一徑穿林入人蹤襍鹿蹤山居到成憩俗念覔何從落葉無留樹餞秋将柏冬性因恬以永不必問禪宗永恬居辛夘谷轉向西行歩随境入清板橋經㡬架雲閣見層甍素榻偶然據好山依舊呈兩言垂訓誨萬緒冺将迎永恬居壬辰永恬所必到頋濶一月餘時炎路復阻慮勞僕役徒金風日爽况值清暇予入各樹交隂譬張幕于途數武一駐憩旋亦造山居山深境自凉楓籟益颯如繹言思所由津逮惟詩書永恬居癸巳稅駕巳數日問山偶此時㡬條板橋過一所石林披步磴得門入㩀床向牖窺嵐光與楓籟静永足恬思題永恬居甲午太古此山中永恬居一所居則實永恬奎章額簷梠緬企揮毫時雲日空翹覩是意安能恬悽然立延佇題永恬居乙未巖居每嵗所必来祗以無暇來遲耳亦因新建者先往厭故喜新弗免矣據牀屈指試一數上聲則到仙莊十日已夏山過雨爽頓生庭樹籠隂暑不起物象皆恬心自恬聖人先我示微旨永恬居戊申蘭逕向西循松齋倚巘脣偶來值初伏言到却逾旬到山荘己逾旬日矣山色總依舊世情率喜新一端因永念誰是得恬人永恬居己亥野橋㡬渡水澶湉倚巘山居驀地詹覺與昔年初不異欣於六月了無炎檐禽對客意為永林鹿狎人心亦恬豈必練研求警句興之所至筆因恬永恬居庚子曲棧入山深山居宛待臨題檐繹两字罨牖繢千岑寧渠性情淡那來私欲侵徘徊思祖訓克已近為仁永恬屈辛丑岩谷向西轉肩輿數息行㡬礄跨澗築一水落溪鳴旋亦山居到依然夏景呈身心都與静足見聖人情題永恬居壬寅登骫披叢樾巉岩厯衆崦乍如雲闢闕遂見樹籠檐樸斵緬垂教淵襟契引潜寰區同樂利永沭聖恩恬欽定熱河志卷三十四
