body:
  text: 行宮十臨芳墅知魚磯湧翠巖素尚齋永恬居臨芳墅水流雲在亭之隔岸西折而南臨芳墅在焉殿五楹其西楹聫曰岸花霑露滿湖月漾波寬為聖祖御筆墅左右則曲渚回汀藥欄荷沼咸吐秀於晨風夕露間對清華而供吟賞一莖一葉悉含生意矣御製詩臨芳墅甲戌曲阜平岡緣蹊被隰無葩不秀有卉皆芳别墅數椽自足幽趣竒葩異草四時芬八百功常鼻觀聞是藥是花俱採取文殊於此亦疑黂臨芳墅己卯别墅水之涯清華復靜美團團榆槐隂羅羅花藥蕊偶憩如久居心恆不離此不離此緣何簷額揭妙旨對時育物心翥鳯飛龍體臨芳墅庚辰義取對時將育物候過葉緑與花紅分明羲畫標微旨一氣貞元無始終臨芳墅口號辛巳别墅蕭間碧水涯中秋依舊有荷花臨芳設問為誰宅應對濓溪周子家臨芳墅癸未軒文題墅繹思長面對秋荷綻滿塘端識聖人愛君子寧徔凡卉賞芬芳臨芳墅壬辰面山兼面水仁智樂兼斯近沼風來爽逺峰隂上遲過弦月漸朗艤岸舫相隨待夕澄瀛泛言看色景竒題臨芳墅乙未野花繞砌燦芳㽔待月開船每在兹墅落西山赤烏早岸披東沼素蟾宜倚窗如舫狎鷗彼據座平林友鹿斯去嵗今年何所異鏡中增得幾莖絲知魚磯臨芳墅前殿五楹面南皇上御書額曰知魚磯踞湖之北與采菱渡對可一葦杭也每蘭池淡沱鱗族出逰時躍時潛並呈天趣豈特莊惠知魚之樂辨之濠上者耶御製詩知魚磯甲戌湖水清甘魚樂國也石磯臨流無心垂餌相忘之適當非濠上所知出水輕鯈樂意洋臨磯欣覺會心長由來萬物天機適安用勞勞辨惠莊知魚磯己卯古樹兩株水一溪逰鱗潛躍任倪倪底須博辨誰知者了識蒙莊未物齊知魚磯癸未莫道魚無知亦有在沼時莫道魚無樂亦有浮而躍魚自樂魚自知耳知樂否乎辨可已月在天心風在水不言之中存至理知魚磯癸巳石磯臨碧沼即景號知魚不擬風生浪常看月入虛躍潛隨適耳綱釣總忘諸恆此開蘭舫塞湖載望舒湧翠巖瀑自巖而下巖間殿三楹東向聖祖御題曰湧翠巖殿後為佛廬有樓三楹額曰自在天聫曰松徑飛花雨蓮臺藹法雲並皇上御書每朝暾初上曙露未晞飛瀑中煙巒布濩恍疑大士説人天妙法倐忽慈雲遍滿大千界內若雨後瀑懸磬飛林外鐘度雲中則又妙演潮音於空際聲現色中相也御製詩湧翠巖甲戌石罅泉源出山莊西北淙淙潺潺下為瀑布依巖為佛廬隔林明殿三楹東向晨曦朝爽空翠四合拔地青蓮聳德水天人來往作音娛驀逢杖錫權教住試問眉毛拖地無素尚齋山莊邃境曰梨花伴月最上一重殿五楹面南聖祖御題額曰素尚齋地在山巔因髙得勢軒宇曠然階下梯級百重長廊翼覆仰視如天中樓閣而結構渾朴不施雕繢堯茨貽則堂構留思天藻繹吟每為拳拳三復云御製詩題素尚齋己巳山莊山水佳天然去雕飾是齋顔素尚古風猶可識開窗見千峰對之有所得揮毫戒繁華聖人示我則題素尚齋癸酉數間朴屋萬山中鹿豕為逰溪壑叢造物由來敦素尚書生未足詡家風霽空色朗依峯白雨葉聲繁點砌紅近嵗遙年頻撿校幾畨靜悟不同同素尚齋甲戌梨峪清軒不施雕繢丹雘皇祖常所御處崇朴素明雅尚備見于天筆標題兩字中矣棄日無過靜讀書讀書靜合是山居披翻却又難耽靜無逸明明啓迪豫素尚齋乙亥風徑樹葉稀秋深澗流細盡掃丹翠紛全露峯巒致巖居委宛藏澗道﨑嶇試騁懷煙霞標逰目塵囂外素尚亦頻來兹焉契真義素尚齋即景丙子蕭蕭落葉下亭臯入牖峰稜瘦且髙盡洗鉛華歸素尚頓捐色相得真陶五三了可恭幡蓋咫尺那須想濮濠結習由來未忘却率因即景一摛毫素尚齋丁丑幾灣流水幾橋搘嶺復間齋宛在兹蓄目髙秋原恰當印心昔景不曾移蕭然自是朴斫好紛彼何煩藻繢施詎止崇情愜幽賞風聲敦俗要於斯素尚齋戌寅齋接永恬居相望平聲前後廬磴廊斜轉上巖牖朗開虛得趣景殊狀題名義各臚要同歸靜觀去聲一致每欣於素尚齋己卯太古山中室髙秋時節天有懷惟淡泊無物不神仙候暖林猶翠露繁花益鮮却嗤芥蒂者動説俗塵蠲素尚齋庚辰古屋創堯年奎文寶構懸理參從檏趣治覺返淳賢甄性神明境陶情翰墨筵淑清此埏埴灜臺淑清院中書室亦顔之曰素尚齋義取諸此終是遜天然再題素尚齋澗道津橋試重尋巖扉耐可愜豫心虛庭煙月誰同調上塞氷霜我素襟四壁詩題自今昔一窗冬日是光隂迤西更闢新齋在不厭山深轉就深素尚齋辛巳詰屈山徑幽緑雲蔚其上線天中得路到齋却寥曠向來延緣處歷厯都在望五楹所虛受峯巒乃萬狀偶此寄崇情于焉愜素尚素尚齋壬午永恬居後齋百級拾廊階既回眺因逺當秋攬總佳不遷谷神景恆識聖人懷返朴關行政勤思六宇皆素尚齋癸未軒楹無藻飾圖史有藝香示後惟欽禹起豫寧待商野花似蘭馥幽籟過松涼行飯辭輕輦攀登百級強素尚齋甲申書齋猶在上便與步丹梯恱志延新趣欽心仰昔題泉聲銀鑿落樹影緑玻璃髙嶺夕陽好看時旋旋去聲低素尚齋乙酉莭梲非山藻林嵐近梠扉延懷疑月窟觸目暢天機秋景正寥泬爽風落翠微淑清此數典西苑淑清書院室亦以素尚名之尚志仰前徽素尚齋丙戌倚巖幾架搆書齋尚不期華素是佳豈曰獨稱山水趣化民當日寓深懷素尚齋丁亥書齋更山上疊磴以廊通每仰額垂手常欽儉率躬野禽呼檻外蒼鹿過窗中尼父言詩旨玩辭義不窮素尚齋戊子飛廊陟巖磴上復有書齋既是無俗尚因之愜素懷山禽寂窺户梨實落鳴階雖則片時坐永言意託佳素尚齋己丑梯巖疊石磴其上覆雲廊拾級隂森處軸簾前後堂是齋在永恬居上即前後屋也近非費物力髙可挹山光題額相輝映繹思垂訓長素尚齋庚寅斜廊將百級齋乃搆其上濟勝步忘疲居髙目宜望凸巘與凹壑無所逃形狀豈藉繁藻繢真存太古樣因之坐成久心焉愜素尚素尚齋辛卯拾級回廊上畢窮前後齋更髙目斯豁尚素意尤諧樹蜜不遮户草生直到階當年斯示儉聰聽敢違乖素尚齋壬辰拾級猶饒百步攀坐開窗戶俯林關問豫素尚于何是祗在青山緑樹間素尚齋癸巳人孰無所尚其間惟素宜苟非務華目庶可不紛思林密風還度山深涼自披迤西有佳處步輦向前移素尚齋甲午齋更居之巔回廊攀以上愈髙斯愈豁聳目欣蕭朗鳴禽語殷勤犮鹿來三兩山花雨後開山蝶大於掌物具天然趣夫誰勞意想素固匪因緣尚亦豈勉強今日適清間棧溪向西往素尚齋乙未更拾丹梯上有齋素尚顔東西帶碧澗南北峙青山塵俗自應逺華囂不藉間詎惟供性賞政教每因關素尚齋丙申拾級陟回廊據牀坐素堂嵐光飛翠逈松籟落空涼會景忘今昔潛心究縹緗尚哉知禮後得矣起豫商素尚齋己亥巖廊重攀陟文席小棲遲山夏還依舊松風特相入聲宜乘間堪綴墨觸景憶含飴兩字欽心繹千秋教意垂素尚齋庚子􅓏步上岩廊齋在岩平處窮幽乃得曠是可會理趣朱補格物章貫通無不具後聖契先賢我于朱皇祖究心性理子尤特表章顔齋日尚素于心祛紛馳于境得潔矩叶如舜恭南面萬幾舉而措素尚齋辛丑素尚接永恬必由回廊陟聊乘一時間那惜雙步力然匪窮逰興實用緬先式蓋欲恬心者宜以素為則居安斯禮復去華在已克堪以注魯論永言謝淵德素尚齋壬寅仍步岩廊上山齋宛在兹古稀有二矣祖德敢忘之修已即為政勤民要課時如云敦素尚却覺費新詞永恬居素尚齋之前殿五楹面南聖祖御書額曰永恬居後三十六景至此攬其全伏讀御製詩以引養引恬慎修思永之旨紬繹天文義至深逺蓋山莊水木澄明煙巒靜妙肖翹動植盡荷生成我皇上臨御以來一逰一豫斂時敷福薄海內外永慶安恬所由放彌六合退藏於密者與御製詩題永恬居己巳夷嵕築間館邱壑占幽偏落葉如聽雨開簾不捲煙景光新意趣書史舊周旋道味真無斁心恬足永年永恬居辛未搆築深谷中嵐靄幻朝暮名之曰永恬允得岩居趣疊樹罨蒼翠曲流繞蹊路仙卉四時芳竒峰一窗具淡泊足恱怡㫪容而靜窹買山合周孔羲經於是注題永恬居壬申簾垂四壁幽忩入千峰絢樝梨熟自落野菊艷初綻青密鳥未驚紅殘蝶餘戀誰與幻山色輕雲飛一片便可寄題興舒箋掞柔翰永恬居癸酉山不厭其深屋豈期其華巖居非雕繪疊樹相周遮恱性適因靜會心奚必遐命筆戒綺言淡泊以為嘉永恬居甲戌山中境爽氣和致足怡神恱性既佳風景且樂阜安引養引恬慎修惠永皇祖御題齋額意在斯乎壺中瓊島鬱懸居景物惟恬氣象舒已是洞天傳玉簡得教福地續琅書永恬居乙亥峯翠屏張後溪清帶繞前重臨舊書室靜對好秋天不約神襟朗那求俗慮捐偶成四十字但未必皆賢永恬居丙子精舍築山深雲徑殊窈窕始披蒙絡入忽據槎丫表瀑細石骨瘦霜澄峯態皎六情不期恬萬慮何能擾逸興託髙清妙契良不少永恬居丁丑雲間欲歸牖山翠每迎簷景趣來來别詩題旋旋添梓材養昔引蘇對花新霑濘待縛渠獻逆賊阿睦爾撤納復投哈薩克軍營阿布賴欲縳之以獻逆賊竊馬挾六騎夜邇阿布賴窮追指日可獲干戈戢永恬永恬居戊寅水復山重處金風玉露時僻非塵所到靜與性為宜居永真堪憩心恬恰好思所思在何許皇祖聖蹤遺永恬居己卯地僻山深未可耽君師責重一身兼簷端寶訓分明示寰海蒼生要引恬戲題永恬居庚辰今日來思後日去去來歷歷正何嫌讓他書舍千峰裏樹態雲容此永恬永恬居疊舊作韻庚辰一谷溫暾日坐來滿屋簷餞秋冬景破半百鬢星添松翠雪輕壓楓紅霜飽霑卷阿真愜意魚海洗兵恬舊作有佇待俘渠獻干戈戢永恬之句永恬居庚辰冬山淡如睡巖居益致靜所耽在泉石寧辭跋寒冷野橋度數曲似入神眀境林扉詎藉叩仙界奚煩請翻嫌紫翠艷都覺色空屏歸藏有餘藴樞紐於焉省觸緣愜性靈不期坐已永永恬居漫題辛巳關內度秋霖一刻似三日關外閲晴稼日三似刻一歷喜易愁難百年同是律何如太古山復此虛白室無喜亦無愁止止恆祥吉永恬居壬午詎是陶家徑依然松菊存流隂閲吹葉至理悟歸根鹿麌動皆靜禽音靖不喧袛宜諸慮淨仍繾一人恩永恬居癸未翠隂覆曲折有路草纎纎出樹即為墅入山了不炎軒窗惟靜寄書史供去聲清拈底識斯居好能令情性恬秋日永恬居癸未素景又新投昨年才瞬眸繹思恬者靖恰悟莭臨秋露浥花香泛風翻葉翠流一雙間瓦雀棲樹懶飛浮永恬居甲申駐久方言至居真委宛藏憑窗思昔景開牖納山光蛩有殷勤韻花惟自在香永恬垂聖訓甄性那宜忘永恬居乙酉一澗前階帶千峯後户羅山莊景誠冨今嵗此初過窗畫依然好壁題漸以多向陽常覺熱秋矣識無何永恬居丙戌由東斯為登由西斯為下適從創得降言憩可因暇接待有佳趣天真非假借煙壁峙前虛石泉淙底罅心神不期恬永言觀妙化永恬居丁亥山居幽谷裏聖藻泐楣簷為去聲念恩勤永兼欣情性恬座間臨樹杪忩隙入峯尖安得恆斯坐義探書理潛永恬居戊子食蔗與永恬相隔祇一嶺越嶺不數武復覺殊山景乃知仙莊竒步步進佳境幽居據𤱔平既深斯致靜視聽寂諸緣淡懷默以領永恬居己丑仄蹊原熟識􅓏步逺何嫌峯險鹿單過樹深鳥互覘到欣書史伴坐覺性情潛萬劫秋山色天文與永恬題永恬居庚寅一徑穿林入人蹤雜鹿蹤山居到成憩俗念覔何從落葉無留樹餞秋將柏冬性因恬以永不必問禪宗永恬居辛卯谷轉向西行步隨境入清板橋經幾架雲閣見層甍素榻偶然據好山依舊呈兩言垂訓誨萬緒泯將迎永恬居壬辰永恬所必到顧濶一月餘時炎路復阻慮勞僕役徒金風日爽况值清暇豫入各樹交隂譬張幕于途數武一駐憩旋亦造山居山深境自涼楓籟益颯如繹言思所由津逮惟詩書永恬居癸巳稅駕巳數日問山偶此時幾條板橋過一所石林披步磴得門入據床向牖窺嵐光與楓籟靜永足恬思題永恬居甲午太古此山中永恬居一所居則實永恬奎章額簷梠緬企揮毫時雲日空翹覩是意安能恬悽然立延佇題永恬居乙未巖居每嵗所必來祗以無暇來遲耳亦因新建者先往厭故喜新弗免矣據牀屈指試一數上聲則到仙莊十日已夏山過雨爽頓生庭樹籠隂暑不起物象皆恬心自恬聖人先我示微旨永恬居戊申蘭徑向西循松齋倚巘脣偶來值初伏言到却逾旬到山莊己逾旬日矣山色總依舊世情率喜新一端因永念誰是得恬人永恬居己亥野橋幾渡水澶湉倚巘山居驀地詹覺與昔年初不異欣於六月了無炎簷禽對客意為永林鹿狎人心亦恬豈必練研求警句興之所至筆因恬永恬居庚子曲棧入山深山居宛待臨題簷繹兩字罨牖繢千岑寧渠性情淡那來私欲侵徘徊思祖訓克已近為仁永恬屈辛丑岩谷向西轉肩輿數息行幾礄跨澗築一水落溪鳴旋亦山居到依然夏景呈身心都與靜足見聖人情題永恬居壬寅登骫披叢樾巉岩厯衆崦乍如雲闢闕遂見樹籠簷朴斫緬垂教淵襟契引潛寰區同樂利永沭聖恩恬欽定熱河志卷三十四
