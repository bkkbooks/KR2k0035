body:
  text: 欽定四庫全書欽定熱河志卷二十巡典八御製詩恭奉皇太后啟行幸熱河駐蹕木蘭行圍之作慶辰佳節遞都過合奉慈輿幸熱河習武未宜疏駟鐵矢音恒是詠卷阿恩深顧復行常侍恒䝉之例慈諭宜循聫情皇祖毎嵗幸熱河習武施惠外藩所幸加慈體日益康强每奉豫遊大福懿顔必豐厚誠亘古未有之慶也體益康强喜實多納稼更無慮蹂躪潦餘旋轉幸如何今年閏月中雨水過多瀕河地有被澇者六月以後雨𤾉頗調髙阜稼仍美好昨楊廷璋奏統計通省収成八分有餘兹蹕路所經則大田悉已登場沿村囷鹿頗積竟得轉歉為収督臣言果不妄為之慶慰出古北口感懷古北復鳴鞭今秋殊往年異常經潦漲格外命恩宣六月間潮河異漲衝齧城根舊垣随圮兵民廬舍亦多有漂捐者特派大臣同提督王進泰查勘撫䘏即開倉平糶以資接濟並發内府金四萬兩倍賞被水兵民補葺屋宇仍飭遣工匠繕復城牆今經過則塞門已修築如舊室廬亦漸次完整惟城牆則待補築更念災餘物價稍昂官兵衣食未免拮据復加恩賞借一季餉銀俾生計充裕廬舍茍完矣雉墉未築焉長城真自壞觸景倍悽然毎嵗巡行大學士傅恒無不扈蹕今物故矣去嵗征緬之役本不欲遣往以其敦請甚力命往經畧乃以勤勞受瘴致殞失此賢臣毎懷耿耿悔之無及矣至避暑山莊作慶典原無廢習蒐略遲啟蹕過中秋行將蘭塞千圍合外藩例備千二百人行圍且許山莊三日留今嵗啟行遲山莊祗駐三日便赴木蘭行圍錦繡開屏間去聲紅綠珮環淙峽互渟流迎鑾萬姓休稱謝六月間熱河山水驟漲居民廬舍被淹業已加恩撫䘏並賞銀葺治屋宇仍發倉粟平糶以資日用今來萬衆歡呼叩謝朕實廑災餘元氣之未能遽復也元氣還廑可復不出麗正門恭迎皇太后至避暑山莊即事成什昨宵數問夜何如為是連朝濶起居老幼黔黎𩔖善錫動言式右史堪書街衢已復舊觀矣六月間山水猝發紅橋以西地勢稍低者市多被衝損隨倍賞内帑葺治今已整繕如舊警蹕奚須逺避諸䇿馬躬迎聖母喜六旬子帝掖安輿木蘭行圍自熱河啟蹕作雲收萬嶂喜新晴獵馬虞旌值啟程習武繩前奉慈訓承歡惜濶繫深情積㸔穀圃秋原穫潤逼蘭衢塵不生舊部新藩都效職翩聫鞠􅎽路傍迎重陽日䝉古王公等進宴即席成什今嵗行蒐十日遲重陽恰度木蘭時登山無地非髙處進宴有心值節期詐馬依然元制度什榜讀作平聲底藉漢威儀厯觀史冊如兹少䖍鞏金甌慎自持至避暑山莊恭問皇太后安喜而成什三度減圍期今年較往嵗凡减三圍問安心早馳䟎程瞻懿履仙境適慈頤廿日身益徤千秋願若斯吾惟知以喜不忍憶宣尼入古北口朔氣變寒嚴休工春日僉塞山盿壘頹垣固無事修葺而此正當路衝觀瞻所繫故發内帑重築近塞地土凍早城工暫停力作俟春融興工本無事修葺徒以繫觀瞻省嵗麥籠𤱔禦冬舎接閻安民企黄霸築塞鄙䝉恬三十五年八月己丑上奉皇太后啟蹕巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫謹按毎年地方啟蹕巡幸係直降㫖蠲免所過額賦是嵗隸省輪免正賦之年所過地方已在普蠲之内壬辰出古北口降㫖加恩豫賞古北口駐防及綠營兵丁一季錢粮乙未至熱河行宮降㫖加恩豫賞熱河駐防及綠營兵丁一季錢粮丁酉上詣廣仁嶺恭迎皇太后駕至熱河行宫己亥上啟蹕行圍木蘭皇太后仍駐熱河行宫九月乙巳行圍殪虎駐蹕準烏拉岱戊申行圍殪虎駐蹕巴顔溝壬子駐蹕按鳩和洛昂阿䝉古王公等恭進御宴閲馬戯乙夘駐蹕張三營賜䝉古王公台吉並隨圍兵丁等飯戊午迴熱河行宫恭請皇太后安十月甲戌上奉皇太后自熱河迴鑾丙子入古北口庚辰上奉皇太后迴圓明園御製詩辛夘七月十日啟程幸熱河駐蹕木蘭行圍即事疊去嵗啟蹕詩韻有序三驅獮候吉涓將啟虞旌兩日秋霖漲盛致稽蹕路展行期之信宿快晴已過洗車遣衛士以經營稳渡無煩涉馬牽舟誠速昨來正報梁成灑道何頻晨後又逢雨集豈柔金之生水信有恒占乃旬嵗而一經竟無愆度辛巳之成規可按大安之豫適宜遵小駐御園計里畧同緩頓先臨行館詰朝仍勑停鑾惟農事之闗心積潦懼妨良稼幸田功之蓄目如雲暢好髙原十五蠲租倍常年而更咨善䘏七言紀事疊舊韻而兼誌惄懷膩霖今嵗又逢過生水陰金屢漲河辛未辛巳皆大雨水今嵗又然或以辛為陰金值嵗主多水占騐之説豈果有之乎橋待畢成權駐輦途㸔可治先去聲循阿幸然髙隴仍秋熟惜矣低田受潦多滿望懼將作虚望今嵗春夏少雨自夏至後膏澤優霑早稼晩禾並皆芃茂滿擬可望豐收乃七月朔日以來大雨兩晝夜漲潦殊盛深懼妨農今沿途所見髙田豐蔚可觀實為得之意外然下隰業已受傷勑免經過租賦十分之五視常例有加並令督臣勘察被水成災者照例撫䘏用副廑念自慙之外更云何白河水漲待橋未成因暫返御園恭問皇太后安即事書懷有序伏庚甫退時行宿漲猶留處暑初交置頓成杠未遍諮首途而請紆掖輦稍須東上之園率前導而期偫方舟徐駐適中之館乃問白河而徑度戒道將需半旬因瞻紫籞而依馳詢安已經三昔爰迴御苑敬侍慈顔雖兩辛之卜胥符演潤或緣乎嵗紀而一水之占倍惕沮塗偏軫夫農功至如典重詰戎佇俟風髙而表扈矧若恩推懷逺行看日近以迎鑾是用摛言以當誌事今嵗秋霖過辛巳奚異漲候橋搘五朝待那安清蹕密雲地外白河水勢湍急深至二丈餘不能及時減落搘柱既難以施工牽舟又艱於速致努三在彼督辦橋座云非四五日弗克蕆事若因此停蹕乆待殊為無益且違定省已閲三日因於十三日仍迴御園恭請成再聖母安俟奏報橋奉安輿啟行三日濶應謁聖慈遮莫園中仍復返逍遥河上豈其宜箕疇黙騐咎徴應惕與慚俱祗自知恭奉皇太后啟程之作臨河轉蹕謁徽萱五日徘徊駐御園漲退橋成馳奏牘秋髙途治啟鑾軒前以白河漲盛宻雲橋難猝成仍囘御園駐蹕敬詢聖母起居既命努三等於河干董視架橋並遣侍衛往來詢促昨始奏報剋日成梁遂於十九日恭奉安輿啟行而經凃坦治如常則由豫勅步兵代為執役因行賞以旌之已期舊例可違約毎嵗巡辛木蘭隨圍之扎薩克王公台吉等例於古北口外次第迎鑾今已逾期十日豈可復令其乆待乎况覲新來待沛恩土爾扈特汗渥巴錫等率全部來歸諭令於木蘭覲謁觀園囘至山莊宴賚一切亦須早為部署也尚有低田存潦水民艱一路重詳論出古北口柔金勝剛金生水自倍蓰秋初漲潮河勢過昨嵗已而何新築城嚙根復致圯頼人知豫防避潦早遷徙所以災轉輕不幸中幸耳今嵗潮河漲勢較去嵗更甚因軍民等曾經水患七月初一等日見天雨晝夜不止即徙髙處豫防水至雖廬舍被衝而人無傷損猶為不幸中之幸然人鮮寧居亦堪廑念因發帑賞葺房屋並開倉平糶賞借月粮以資口食兹復降㫖將旗營各兵糧嵗支本色兩季使米穀留餘贍給永期饒裕經過漲已消沙痕存岸涘頺牆埋草木原占川路峙再築仍再傾當讓地於水昨嵗新修邊牆復經水傾圮兹親臨閲視其地適當來水之衝盪撃勢所難免不宜與水相争因諭就缺處結築礟臺以存規制現傾之垣竟毋庸補修使讓地於水可杜後患宣命罷重為庶免紛更屢如云弛禦邊禦邊豈繋此自古長城之築原以設險禦邊已昧在徳之訓我朝幅員逺訖口外仍屬近畿即䝉古新舊諸藩皆隸臣僕并不得僅云中外一家更無可議為輕弛邊備又何藉此重門之禦屢事修復滋費耶至避暑山莊即事有作漲消橋就坦途培至止還遲十日來初傳㫖於七月八日啟鑾因雨展期兩日復以白河漲盛密雲橋難猝就仍自懷柔囘駐御園直至督促橋成於十九日啟程較每常至山莊計遲旬日嶺過廣仁境詄蕩門臨麗正象昭囘峯容水態如相迓松牖雲莊暢好陪不事招徠歸逺域行看嘉宴此重開土爾扈特汗渥巴錫等率全部十萬衆投誠其汗及台吉等逺來覲謁計九月中旬可至山莊當於萬樹園開宴行賞如都爾伯特筞凌等之例也出麗正門恭迎皇太后即事誌喜橋稳途平鳯輦移康强逢吉謁慈怡無疆慶外有餘慶不敢期間願永期簷際錘峯對閬苑階前列水即瑤池神仙境藴中和氣豫養髙年百倍宜熱河啟蹕幸木蘭行圍之作有方必告敬詢安綪茷㫋旌指木蘭宿雨汎塵途不濘曉雲漏日氣非寒問程已熟行來近納稼逢饒志為寛適報逺人歸順至朝家蒐典俾同觀木蘭旋蹕至避暑山莊即事有作木蘭肄武罷秋圍是日山莊旋蹕歸勑政旰宵仍别殿詢安歡喜謁慈闈舊藩莅止入邸舍四十八旗王公等以執役嵗乆此間或有置邸舍者新附隨來换黻衣土爾扈特台吉渥巴錫等於木蘭入覲後即令其隨至山莊將行宴賚是日先加封爵並視其秩予以章服有差行慶施恩舉次第園看萬樹有光輝恭奉皇太后自熱河還蹕之作行慶柔倈畢蕆儀栢冬旋蹕指京師仙莊嵗至漫迴顧仁嶺雲齊景仰思鹿仁嶺康熙五十七年賜名來往所必經一路承歡申愛敬髙年益徤愜衷私如斯百度猶無厭層巘喬松與永期三十六年七月戊申上奉皇太后啟蹕巡幸塞外降㫖以今嵗雨水較大加恩蠲免所過地方額賦十分之五其被水成災者仍照例察䘏上駐蹕石槽行宫庚戍上諭今年七月雨水較大已展期兩日啟鑾及過蘭溝時橋雖已成而未能堅整即遣使奏聞皇太后請暫駐御園俟沿途橋座俱成再請啟駕朕仍先駐石槽行宫閲視所經橋道以便掖輦安行今日駐蹕懷柔縣遣福隆安馳往密雲察看河勢情形據奏白河盛漲勢難驟落牽舟駕梁均非可以剋日施工因思既不能按程遄行而坐待橋成為時太乆亦屬無益著於十三日仍囘蹕圓明園恭請皇太后安俟努三督率修理橋座完成奏到時再行傳㫖起程是日命議叙沿途修理橋道各官辛亥迴圓明園丁巳上奉皇太后自圓明園啟行是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫庚申出古北口癸亥至熱河行宫甲子上詣廣仁嶺恭迎皇太后駕至熱河行宫丙寅上奉皇太后於卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉等茶果凡三日八月庚午復賜扈從王公大臣䝉古王公台吉等茶果凡七日庚辰亦如之辛巳上萬壽聖節詣皇太后行宫行禮御澹泊敬誠殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台吉等宴凡三日癸巳上啟蹕行圍木蘭皇太后仍駐熱河行宫九月乙巳駐蹕伊綿峪土爾扈特台吉渥巴錫等入覲丙午駐蹕薩爾巴里哈逹賜扈從王公大臣䝉古王公台吉及土爾扈特台吉等宴丁未駐蹕按巴鳩和洛昂阿䝉古王公等恭進御宴閲馬戯戊申行圍殪虎駐蹕烏蘭哈達庚戌行圍殪虎駐蹕他星雅圖阿辛亥駐蹕張三營賜䝉古王公台吉及土爾扈特台吉並隨圍兵丁等飯甲寅迴熱河行宫恭請皇太后安丙辰御萬樹園賜扈從王公大臣䝉古王公台吉及土爾扈特汗渥巴錫等南掌國貢使叭西哩門遮昆宴賜王公大臣䝉古王公台吉等表裏及土爾扈特汗渥巴錫等銀幣有差戊午賜扈從王公大臣䝉古王公台吉及土爾扈特汗渥巴錫等宴凡三日辛酉後御萬樹園賜宴觀火戯凡二日癸亥復賜扈從王公大臣䝉古王公台吉及土爾扈特汗渥巴錫等宴十月己巳上奉皇太后自熱河迴鑾辛未入古北口乙亥上奉皇太后迴圓明園御製詩壬辰恭奉皇太后幸避暑山莊即事二律有序獮待行時塞舘駐原夙莅莊宜避暑慈幃凊適寧居因念昨秋積雨漲川橋煩再架何如當夏蠲辰啟蹕途怏覩先登既稟承聖母以忻俞遂宣命諸司以豫飭時則炎蒸未熾薰拂微凉四朝甫過北郊六舍言循東道髙年順志緩程更安御肩輿令典習勤前導仍肄驅閑駟矧官人而課績時幾不廢疇咨復減從以恤勞更畨并容休代幸篝車之滿獲晩麰雲尚鋪黄欣烜潤之均調早稼油都㵼碧雖先秋較逾匝月豐迺全占惟愛曰欲至萬年喜誠永矢長言再系短引兼成又奉慈遊逮啟行較常時早月餘程秋霖恐蹈咋年跡夏凊真循避暑名最利禾濃侵曉露宜收麥湊接朝晴依然乘馬烟郊厯送駕人瞻喜倍生承歡顧愛並殷如山舘康遊八袠餘展頓敬圖早憇息每嵗懐柔皇太后初頓頓而駐湯山行宫次日壽駐縣後即按常行今以聖母逾八旬尤宜安適擬自懷柔以下凡中道程益皇祖所建舊行宫皆可憇息因恭奉臨駐冀緩而到益早并沿途祗備肩輿御行倍適頥養肩輿自覺益安舒因成徐進增情戀仍復先行例道除祗識此他非所識宣尼深語敢萌予出古北口即事東方曉日萬峯明山路盤旋䇿馬行巖堞軸頹半有地市鄽櫛此永無征凡闗皆有征税惟古北口不設𣙜司遵皇祖遺制也旅人那慮漸石濘農父偏欣曬麥晴讓水即為治水䇿費財奚事築邊城古北口邊牆縁山跨水以築潮河穿水門入庚寅夏大雨數日河漲數丈餘奔騰突激繚垣及城闉皆毁於水以其為經涂觀瞻所繋發衡緡繕完之辛夘秋霖又盛河漲如前新繕垣復圮迨出口臨閲察其故葢邊牆踞河上正當其衝河流即移逼城根非可人力争禦若屢弛屢葺雖無力役勞民之事而縻金錢疲工作非計也至於遏其勢致横溢傷民廬益非計也且今中外一家闗以外尚隸畿輔又安藉此防邊為北門固屹然壯觀餘堞本無所輕重因命視牆峙處結築礟臺以具規制闕者委之於河使其暢流順軌行水之智貴乎因勢利導讓之乃所以治之然於此正可若夫内地民稠之處則又不可六月朔日至避暑山莊即事成什皇祖山莊此剏居毎來恩訓不忘初快晴喜共將旬及避暑到猶早月餘今嵗因昨秋霖􅕙稽程啟鑾時早途中每日晴霽凉爽倍勝常年到山莊較早一月冇半於避暑亦為名實相副云因以循名勵責實敢惟玩物益孜予髙年駐近遲四宿毎嵗縣餘皇太后初頓駐湯山次頓駐懐柔仍按常程到山莊祗遲一宿今嵗自懐柔以下凡中道四宿皇祖所建舊行宫皆奉聖母駐憇較常則遲矣葢程益緩而駐益早冀增安頣養得倍適耳屈指殷心迓鳯輿出麗正門恭迎皇太后至山莊喜成是什愉怡候道邊迎駕命趨前詢先至安後奉候嵗㦤㫖命䇿馬山莊恭以為常倍迎髙齡健却紓十日懸山林供爽眺溫凊適清便孝則吾何敢慕誠過舜年熱河啟蹕幸木蘭行圍之作節過啟程依例常平明清蹕發仙莊或輿或馬遵慈訓多黍多稌閲嵗穰野郭山村經迤邐舊藩新部扈相將詰戎義以行圍寓家法聰聴百世長木蘭迴蹕至避暑山莊恭請皇太后安喜而成什復不過時歸不賖歸來食履悉康嘉萬年祝願冀如願四海為家兹更家秋暖葉林紅間綠雨輕塞宇霧成霞是日重陽微雨黄州詩稱去聲重陽節可耐庭前潤菊花出麗正門恭送皇太后啟鑾之作今巡步輩奉慈歡税近先行取日寛今年肩輿皇大后幸熱河因奉並御緩行慈顔甚喜承均懿㫖於九月十二日先行按途間所有小行宫駐憇計行十一日朕仍十六日啟行於廿二日同至御園以中頓小行宫不能容多人駐宿也仍擬御園共早到欽承懿訓永年刋前旌嶺路瞻徐發後軔山莊駐暫盤去送來迎意何極南山為祝鎮斯㸔入古北口仲夏出關秋入闗倐如信宿往和還乍逢夾路草猶緑故合依峯樹未殷敗壘徒教留埤堄皆仄聲崇墉欣㸔接鄽闤迤南見麥思早雪因識人情知足艱三十七年五月己未上奉皇太后啟蹕巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宫降㫖蠲免所過地方額賦十分之三壬戌出古北口六月乙丑朔至熱河行宫己巳上詣廣仁嶺恭迎皇太后駕至熱河行宫七月戊午賜扈從王公大臣䝉古王公台吉等茶果凡三日辛酉上御澹泊敬誠殿土爾扈特郡王巴木巴爾貝子布顔楚克等入覲賜巴木巴爾布顔楚克王如意洋表鼻烟壺並賜巴木巴等頂帶冠服有差壬戌閲步踏八月庚子上侍皇太后膳賜扈從王公大臣䝉古王公台吉及土爾扈特郡王貝子等茶果凡六日甲戍亦如之乙亥上萬夀聖節詣皇太后行宫行禮御澹泊敬誠殿扈從王公文武大臣官員䝉古王公台吉及土爾扈特郡王貝子等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台吉及土爾扈特郡王貝子等宴凡日丙子上御萬樹園觀火戱戊寅上啟蹕行圍木蘭皇太后仍駐熱河行宫丙戌駐蹕阿爾蘓台䝉古王等恭進御宴閲馬戱九月戊戌駐蹕張三營賜蒙古王公台吉及土爾扈特郡王貝子等飯辛丑迴熱河行宫恭請皇太后安甲辰上出麗正門恭送皇太后迴鑾戊申上自熱河迴鑾辛亥入古北口甲寅上奉皇太后迴圓明園欽定熱河志卷二十
