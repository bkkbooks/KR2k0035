body:
  text: 欽定四庫全書欽定熱河志卷一百九藝文三本朝詩辛酉扈從出喜峯口髙士竒清蹕出雄關鳴笳厯荒徼夾嶂真天開壁立盡竒峭往時設重戍藉此為險要戰壘虛風生孤城斜日照年年荷戈人未得息征調自從被至德逺近奉明詔遂使邉隅民不用驚烽燎喜隨萬乘來快哉肆登眺晚宿白臺髙士竒塞行未十里塞景已殊異入目多荆榛亂峯含紫翠翹首睇長城萬載嚴邉備連幕宿山陽迢徑橫晚吹虎嘯巖谷鳴颯颯風隨至幕火𣪚繁星周廬環七萃來朝屬車塵應抗凌雲志過嶺髙士竒六龍乘曉發萬騎陟重岡灌木翳青天亂石縈羊腸縱橫澗水流隱約山花香山花非一狀紅紫含芬芳更有青楓樹嘉隂凝衣裳仰面觀竒峯怪石紛低昻時當四月初猶覺山風涼曠然心眼豁不似披遐荒兼旬實壯遊塵慮為之忘黃土巖髙士竒何年鑿山骨屹立疑千尋徙倚不可即駐馬空沉吟藤梢與葛刺蒙密何隂森懸崖支一木微徑通崎嶔巖扉有遺迹邈矣煙霞深杳靄青松際白雲迷至今駐蹕寬城北五里水次髙士竒省方入逺疆駐蹕蒼崖裏崖下俯長河波瀾最清駛娟娟三兩峯掩映雲霞紫微風馨澗松殘陽下流水幽賞平生懷對此翻然喜捲幔息銀燭愛看山月起將出逹什喇卜齊爾口作髙士竒衆山向背殊峯峯自回互石上漾清泉山根叢茂樹咫尺誤行蹤往來遵細路彎環數十轉潺湲八九渡林花雜春夏風景變朝暮勝覽意不忘塞行有深趣駕出逹什喇卜齊爾口喀喇沁諸部落率其所屬伏迎道左髙士竒直北幽崖早向誠不須更築受降城職方記載梯船路王會傳呼拜舞聲紅綻邊花迎雉扇碧搖巖樹轉龍旌太平遊幸非征伐應笑元封自勒兵從獵髙士竒蒼山萬疊雨初晴從獵朝看塞景清月兔射來誇技絶星狼追得鬬身輕班聨翡翠翎中坐隊入鵝黃褶裏行十二羽林皆健將只容欵段一書生臣班在親隨侍衛之列駐蹕巴爾漢湯泉泉較遵化更熱髙士竒夕照下西嶺平楚生荒煙旌旗散晚獵萬馬奔前川忽看碧草際一水流濺濺深澗轉澄徹暖氣如沸煎少坐濯塵纓云是古湯泉逺聽鐃吹發帟幕燈光懸四望盡暝色圓月明山巔射虎行并序髙士竒巡徼者報夜來虎至營中傷一驪馬尚在山前上率侍衛往射殪之恭紀皇輿蕩蕩界蒙古玉輦時巡厯兹土回岡巨壑叢棘多隂森林木不知午干乘萬騎排空來夜張行幄山之塢月上忽聞羣馬驚傳道山前出猛虎曉看一馬果摧殘殷血淋漓在兩股龍鑣飛鞚陟層崖衛士騰驤齊負羽摉巖剔藪無幾時一箭橫胸洞肺腑逺人手額復戰栗跽言此虎為患苦道傍白日每捕人傷戕行旅莫可數幸兹惡劣得剪除聖主當陽真神武從來射虎多耳聞何似臣今得目覩因歎蠢頑本不靈貪叨無厭乃自取不然長林豐草間餐眠何畏施弓弩殺人安人王者心即此推之澤自普扈從雜紀四首髙士竒古人邊塞吟但道沙場苦誰知逺徼外峯崖更參伍地腴苜蓿肥山幽松樹古若令勤耕織其益豈小補穹幕山之陽終嵗牧牛羖近稍敦禮義漸漸識規矩傴僂謁道隅趨蹌申拜舞欣看古甌脫今受大化撫空山狐兔羣終嵗少人迹叢條蔽逺岡墮葉堆荒澤首夏猶苦寒邊風日將夕夜雨聲瀟瀟燈光暗油碧雲黑峯巒沉但見炊煙白喬松干餘株枝枝盡竒矯逺望青岑邊似在白雲表雨過林壑清天空初日曉羽騎來驂驔霓旌更縹眇迤邐入山谷細路厯深窅終日臨髙峯嶔﨑復盤繞回首顧榆關萬山青不了方知地軸雄結構非藐小人生宇宙間志願當何如不行萬里路即讀萬卷書早嵗慕五嶽中年困窮居耳目苦未廣懷抱慙空虛鳴鑣隨禹載攬轡觀皇輿出境雖不遙閲厯皆異墟朝朝扈蹕行非是勞征車詩成傲往彥徒見征伐餘賜宴喀喇沁諸部落恭紀髙士竒黃幄髙張羽衛陳遐方述職盡稱臣金螺酒醴頒三爵寶碗茶膏遍一巡問俗逺同虞出狩要盟欲笑漢和親長城有險休重設至治從來守四鄰賜賚喀喇沁諸部落恭紀髙士竒帝澤遙敷到八埏精鏐文織散窮邊應羞使者通西域何用將軍欵右賢錦繡平添林嶠色雲霞四映塞垣天賈生五餌終迂論何似懷柔大化宣過大石磯行雨中高士竒流雲浮皛皛山川雜煙霧出沒多竒峯穹窿各吞吐驅馬上懸崖崖傾馬驚顧百里盡蒙密杳靄失前路古道幾登頓亂流繞深樹活活雨腳低隱隱雷聲布澗外起長虹旌斿閃薄暮曉行將入喜峯口新霽高士竒雲際露山頂青林來日光曉從六龍行髙下逾重岡巖花落未殘澗道餘芬芳鳥聲辨關樹人語如故鄉鐃歌清吹發逺風旌斾掦鏨鑿萬仭餘鬱岪臨大荒厯兹戰鬬地壯士顔慨慷願施造化功處處知耕桑癸亥扈從出古北口古鎮青山口雙崖對面削線路通兩軌峯如犬牙錯險阻自天成何人施鏨鑿怪石虎狼蹲硤角馬驚愕盛世尚柔逺邊陲久開拓葳㽔列雲旓金支耀叢薄憶昨經榆關山川恣搜索春來望雁門千里窮寥廓懷抱早超然當暑再持橐出色起長謠皇心在經略十八盤嶺髙士竒塞行不厭山騁望少平陸北上更岧嶤鳥徑繚而曲前旌趨平岡後隊出灌木籠蔥巖蔭繁滴􅅹澗泉足火雲照衣裳炎景近初伏馳驅萬馬蹄蓊匌走深谷向午聞鳴蜩凌風振輕縠塞花勵杜訥姹紫嫣紅鬬午晴韶光倣佛是春明近天雨露均霑潤遍地芳菲不辨名異種合教鵝絹寫濃香長傍馬頭生盛朝茂育真無外百卉邊陲共向榮塞草勵杜訥萋萋澗石復巖腰和雨和煙色最饒軟碧迎來袍影舊芳茵襯處馬蹄驕多因地僻膏偏沃為喜風和翠未凋生長幸承雕輦路蘢蔥小草並含韶塞外觀月勵杜訥乍湧氷輪萬里清光騰行幄儼瑤京遲他五夜晶初滿坐到三更魄倍明此夕似疑邊地雪當年曽照漢家營龍沙盡繪升平景侍輦多慚謝賦精野芍藥勵杜訥山坡逺望見花枝宛似豐臺綽約姿野質未曽登上苑芳名猶自號將離喜逢化雨霑濡日得有臨風爛漫時塞植盡皆㴠聖澤莫云草木便無知扈從出口山川景物觸目賞心恭紀十首陳元龍土美從人説身輕始稔知清泉甘似醴豐草滑如脂不信風霜厲還看物産滋小臣誠厚幸策馬自忘疲山行深更好恍在畫圖中絶巘千尋碧疏林萬樹紅原禽棲茂草仙鹿出芳叢目賞真難給朝朝景不同靈液不知源涓涓逺石根臨流清可覽潤物氣常暄沁骨能祛疾充腸更滌煩南陽空記異菊水漫稱尊綿亘山無極鳴鞭入紫煙凌寒花自滿映日翠逾妍樹杪雙旌出雲中六轡連巨靈何日擘巡幸待堯年竒花難問種珍果不知名艷若鋪霞錦香疑襲杜蘅金光隨手摘火實傍車迎漫道江南好霜柑幾樹盈近塞羊初美髙原雉正肥擊鮮真足樂下豉漫相譏珍豈誇婁膳貧還笑朔飢徒縈蝦菜慕嘗此味全非旦暮寒暝異終朝備四時午風初夏好斜日晚秋宜春服隨人著冬裘入夜披自然安作息雲卧不須疑青崖多植黍䓤鬱自成叢不費耘耔力無勞灌溉功餘糧棲畝畔滯穗樂年豐擊壤皆熙皞猶存上古風誰言沙漠地鎮曰作山遊嵐翠侵衣濕溪聲傍枕流汲泉烹苦茗撥火試新篘自愧詩萹拙難題塞上秋堯封應未及禹貢幾曾收景物移三島輿圖隘九州山從高掌拓水載廣輪浮不是倍仙蹕疇能快壯遊熱河記事四首陳元龍干山環紫塞一水護丹邱土沃風猶古農耕户已稠地靈迎日馭天意待宸逰隨蹕重過此清涼五月秋行殿無雕繢山原有性情髙卑因地勝簡朴儼天成林壑千重護煙雲四面生寰中新樂土嵗嵗駐霓旌官自文章舊恩因顧問新地傳真閬苑人識老儒臣高厚難酬主衰殘未乞身摩挲雙眼暗開卷每逡巡僦舍三間潔移花一院香新泉烹茗啜野菜入羹嘗室淺風翻帙墻低月滿床七年塵土夢到此暫心涼熱河髙其倬好景天開古塞垣百靈翹首奉行軒峯回翠黛煙長護水孕丹砂氣自溫五色雲來知入夏萬家人聚喜成村年年雨露隨雕輦千里桑麻接廣原熱河山莊髙其倬昆圃原宜苑神山自有樓煙雲開紫塞職覲近皇州壑邃炎難到湖平淡不流聖人行處好翠色十分秋渡灤河髙其倬天晴渡灤河漲落水初縮古岸留舊痕磷磷沙映玉回思夏潦盈萬騎走平陸重來幾何時波靜揚輕縠青山亦多情千里同回曲返照上遙鬟秋影落蛾緑纎鱗依鏡遊晚路抱煙宿清賞惜須臾搖鞭轉前麓扈從出古北口二首蔣廷錫詰旦飛雲霓連峯忽中鑿蜿蜒一線開青蔥下縈薄山城據雄勢睥睨俯萬壑聖人大無外天險非楗鑰居民儼廬井關吏靜鈐柝乃知至治世元化自寥廓和風迎面來逺煙吹漠漠石路車聲髙青林深且邃重山互回抱淡日照空翠小橋架潺湲恍然闢天地夾衣生微寒頓覺氣候異書生處海濵見聞僅一二竒觀新耳目美景豁胸次多幸事聖明談笑竦輕轡夜光木蔣廷錫乍見星芒映室中喜看藜火照窗櫳夜明簾簿來西域徑寸珠圓出海宫清似晶融還貫月碎如螢散逺隨風此身恍入琉璃界寧羡金蓮蠟炬紅雙塔峯歌蔣廷錫逺山月落天雞唱長峯吹雪度層嶂霧花作雨十里香扶桑鞭促金烏上斷雲忽露兩峯尖半隱半明失顧瞻太陽髙照隂靄散塔影雙插驚排籖紅雲一握遞迎送糝金石色光浮動誰將玉斧中劈開比肩而立相伯仲左峯倣佛生紫煙鏤開三穴皆天然山根疑與鑿圭竇上穴大小珠窩圓日光直射圓鏡赤玲瓏透漏仇池天右峯稍低如拱揖浮圖相對神功全須臾馬首齊向東兩峯體合如一峯石屏方正卓然起峯巔緑樹隂濛濛行行二里山腳走右峯轉左左轉右嵌空突兀亦非常面面皆驚峯勢陡憶從先臣宦粵省梅花村上羅浮頂百二十里老人峯沒膝黃雲盤石磴復記前年登華山蓮花朵朵雲霓間仙人掌冷挹紫瀣玉女盆虛圍翠鬟今朝所見真大觀半空落下青琅玕山回溪轉雙塔隱行人馬上回頭看生平足迹探竒祕飽眼山川皆帝賜愧無米芾畫石筆寫出雙峯挂帆勢上幸海拉蘇臺大獵恩賜觀圍恭紀蔣廷錫秋髙弓徑萬馬肥千山紅葉連霞飛外藩部長率帳落來奉君王大合圍平川幾點人如豆漸見烏闌畫逺岫青旗引路時飄揚四無人聲約步驟峯腰變出常山蛇羣馬班駁雜五花陳腳欲轉勢未合草間出沒驚麏麚東偏飛騎下林麓山頂人排城堵矗圍場圓放十里寬四面回還衣帶束儦儦俟俟何處來長角大耳跳蒿萊倉皇急欲突圍走掦鞭噪逐喧春雷羽林掠圍靜無擾馬密人齊圍轉小雲麾五色八門開盤屈遊龍頭尾繞十尋黃纛吹長風晴天皎日光曈曈山祗地靈共鞭策悉率羣友居圍中繡玉勒疾馳騁乾草霜蹄逐風影天威手挽八石弓十四把長餘箭鋌前鹿已中金僕姑雕翎灑血紅糢糊後鹿一發中其項髙坡仰僕鳴嗚嗚須臾連射二十鹿箭服曽無遺一鏃天網還開三面恩下馬撤圍教止戮秋冬獮狩古所傳維皇聖武縱自天仁風已捲鶴麗陳勇氣尚挂魚須旃外藩健兒千二百忽掃雲屯散無迹疾徐進退心力齊知是吾君恩所格始信天下一家語絶域遐邊總畿輔小臣袖手得賜鮮敬繼岐陽歌石鼓上命登興安髙處眺恭紀四首蔣廷錫馬蹄得得踏寒莎日色雲光兩蕩摩穩立興安最髙處青天左界看山河花飛短荻雲千疊葉落喬松玉萬株無數春蠶沙上卧絶勝平逺范寬圖掠掠風從腳下生始知身已接空冥真將目力窮千里著地天垂一線青沙痕奔馬晴還捲風力􅌉雕怒自號此處重陽無幾日山頭先已賜登髙上親射金錢豹恭紀蔣廷錫朔塞雲深候南山霧隱年韜文藏白草焕采發寒煙爪利騰張猛身輕跳躍便志貪全鹿飽路值六龍旋木落千林矗塵飛一騎先出房金鏃疾彎月寶弓圓鷙性思拏肉天威易縛綿奔逃方股栗僵仆見腢穿置負明駝背携歸行殿前驚看人聚堵環立衆摩肩鬚徑垂霜潔毫班帶血鮮舊曽聞艾葉今始識金錢雪照胸間色風腥口上涎真堪雄並虎寧止倍於豜孔武羔裘句長楊射獵篇幸隨豹尾後窺管頌秋田癸未六月扈從出古北口查慎行太行蜿蜒二千里七十二坳連首尾東趨遼碣西冷陘留斡一門屹中疊古北口一名留斡嶺見金史巨靈擘石如擘雲雲根俯插黃花軍煙氛突過掃無迹風雨欲來天半聞出關彌望神州壤六飛清暑頻來往髙墉已斷山不斷無數芙蓉列仙掌川回岡轉輦路長涼亭舊驛今村莊元時避暑沿路多涼亭賜東西涼亭軍士糧鈔見文宗本紀帝獵北涼亭見趙世延傳明洪武之之名二十七年置古北口十四驛猶存東涼亭驛禽魚共識天顔喜草木中含御氣香小臣多年客燕代夢想何曽踰紫塞自謂遭逢老更竒停鞭飲馬長城外兩間房直廬作查慎行隨班番直又晨興金鑰銜魚轉數層延閣日長無箇事坐消清簟一壺氷過青石梁查慎行天豁新開嶺鸞旗曉向東古藤攀石度絶壁過雲通鳥啄山花雨蟬嘶槲葉風林巒行不盡長在畫圖中駐驆鞍子嶺連雨驟涼查慎行復磴中涵金碧姿小青山外蹕初移愛迎嵐翠晨趨直貪傍燈明夜咏詩泉脈曲通行帳外雨聲渾似滴蓬時水晶宫殿清涼國傳語人間總未知賦夜光木查慎行積水生神木俄登几案旁四時無改火五夜必騰光近映藜輝淡遙分桂魄涼頓教虛室白臨卷勝螢囊五更隨駕發鞍子嶺行至三道梁天始明查慎行金壺虬箭響登登霽月流天景漸澄谷罨一重環翠幕雲移雙仗識紅燈風輪暗激飛梁轉松頂遲看旭日升滿篋纎絺長什襲此來何處有煩蒸駕幸釣臺召臣等隨行賜膳釣魚恭紀六首查慎行髙臺俯瞰樺榆溝指示灤河最上流記得銀絲繪鮮鯽欣從塞外識源頭已刻水下流上樓召臣等至指臺諭曰此灤河上流也魚藻池邊輦路平直隨仙仗到蓬瀛官厨初飫紅蓮飯御饌仍分碧澗羔午刻米飯栁賜御饌紅蓮根魚羔山莊一帶並河壖人衆如魚盡力田要與周詩占吉夢早開埸圃待豐年一條羅帶水拖藍只少魚舟著兩三滿眼丹青輸畫手鶯聲栁色似江南文鱗躍處起漣漪水族沾恩樂此時不是網罛施不得為留餘澤及鯤鮞佳名原自栁根來魚名栁根赤蓋栁根之色赤此魚好噉栁根故名釣得仍將栁貫腮分賜詞臣三百尾插竿騎馬雨中回直廬磁瓶草花查慎行澗草巖花摘小叢祕磁㪺水愛青紅不教開落塵沙畔只似栽培雨露中映壁數枝開曉日入簾雙蝶帶西風誰將蟋蟀籬邊景移向灤河避暑宫賦野杏根查慎行古根埋不爛搜剔豈能辭斑剝舊苔蘚槎丫新菌芝乾坤無棄物研席得竒姿自有天然質何煩斧鑿為雙塔峯歌查慎行灤河之水鳴淙淙晨光欲透草木蓊千巖浮動萬壑充十里霧濕三光鬃陽烏展翅煙攄虹倒射石壁紛青紅中有兩峯迥不同向人騰躍比祝融厥初生時誰所礱分而為二疑靊窿自從巨斧開鴻濛勢欲復合難彌縫小者為霍大者宫前髙後亞兒隨翁其顛石笋各卓空如窣堵波劖圓穹其旁老松垂薤蔥雨露已費千年功初從南麓瞻崇隆恍然御氣乘罡風青天一碧懸雙篷仙舟出沒波濤洪形隨徑轉日在東併作髙柱孤巄嵷首末稍斂中微豐異哉三竅何玲瓏下空一門拆崆洞中央一線星光通最上一穴磨青銅團團皎月非朦朧洞貫腹背豈羿弓誰與人力爭天工須臾位置移匆匆左右互易驚愚矇漸行漸逺漸不窮回頭依舊藏霾雺我思佛力大且雄含利所在塔廟崇十方照耀開盲聾僧伽興廢會有終豈如兹山嫓華嵩巍峩俯闢荆榛叢綿亘古塞接蠮螉劫火不壞況兵戎地雖僻左秀獨鍾昔名未彰今始蒙吾皇盛德邁帝鴻盡攝六合歸牢籠年年雅詩賦車攻山莊近在封域中已獲顧盼邀重瞳何須秩祀偕三公小臣作歌逹聖聰特與此日慶遭逢塞田雙穗嘉榖恭紀查慎行屬車到處瑞徴竒嘉榖俗呼小米子欣看燕尾垂異畝比禾皆九穗連畦如麥總雙歧澤流膏雨珠兼玉譜入豳風畫亦詩從此康年豈勝紀太平天子是農師駐蹕巴龍桑阿蘇台上於附近山中行圍賜臣等全鹿恭紀查慎行雉尾雞翹曉望分旌旗髙捲萬山雲威加草木秋行令禮重貙膢畫掩羣從獸總歸司馬法回鑣如策凱旋勳只慚未效三驅力拜賜長先七校軍駕幸海拉蘇臺大獵賜臣等觀圍恭紀查慎行聖朝雄略彌宇宙四海為家同在宥行宫直過大青山纘武年年寓巡守川原蕃膴少甌脫邊障清寧罷峯堠盡收種落當郊樊大展岡巒作靈囿涼秋八月商飈發霜氣凝嚴氷未溜朝來下詔大合圍草淺林迹宜往狩三干虎旅移前帳十萬龍驤出華廄竒毛箇箇五花文表貉揚旜遍巖岫層層葉幄絢紅紫面面山屏圍錦繡前行十里雪初晴千步場如築新僦遙看數騎林西麓畫裏依微人比豆鴈行齒序列後先魚貫班聨隨長幼綿綿翼翼逺不斷整整斜斜近相湊須臾旋繞山之東觀者同時盡回首舉鞭初可一二數錯落星文排列宿長松冠嶺嶺插空人馬從空俄下走呼聲幾處震虛谷驚起雕翎落飛狖此時已有鹿斯奔闌入圍埸孤引脰東跳西顧迷所向首鼠張皇等鼯鼬魚麗鸛翼頃刻成變幻圓方詎能究陳圖本是邱井法旌立和門嚴介胄合圍漸緊壤漸平匝布叢攢勢相繆不知鹿羣何處來俟俟儦儦紛邂逅麏麚麞麝麋麖麑麅􅪲麜麎麔希間偵伺前復却防內怔惶駭而驟渴舌長如飲澗垂野心思民重圍透天威奮武臨咫尺頓轡齊鑣不容竇神機獨握舉大綏衆志成城鹿為鍭虹流電掣忽飛鞚月滿弓開胥入彀逸足公然帶箭馳先聲所至隨弦仆一人獲雋萬人歡羣祝君王千萬壽大弨旋韔不盡發餘勇猶浮衮龍袖網開一面頌皇慈節應騶虞叶仁獸雲收霧捲圍乍撤萬騎如風散晴晝小試真同掃塞氛盈庖豈獨充飣餖觀兵耀德典彌崇行賞頒餘功孰懋竊聞上古有大甸秋獮相傳本由舊青邱自行吞雲夢吉日先須卜庚戊漆沮甫草偶于畋悉率從王惟左右今之健兒千二百來自諸蕃踰尉候大同兵蒙古兵一千二百五十人皆出喀喇沁諸部落期門將士但旁觀山力何曽技輕奏此皆至尊善撫馭同軌歸誠車輻輳國家恩澤浩如天蕃部寧非天所覆自然忭舞羣用命王用三驅此其又車攻寧數小雅材羽獵應嗤西漢陋矢詩槖筆本臣職況著征衣隨短後雖慚無力效殳鋋盛事千秋幸親覯駐蹕興安嶺有旨命臣等登絶頂逺眺恭紀四首查慎行崇岡斗起杳難攀翠罕華旌嵗往還六合一家寧恃險九邊三面總無關龍沙展勢提封外鳥道盤空霄漢間詔許重登峯頂望始知髙出萬層山忽開眼界向層巔指掌圖成立馬前東走陪京山委浪北踰瀚海地黏天牛羊白散千屯雪草木青回萬竈煙四十九藩齊望幸呼嵩聲徹半空傳甲帳辰旗紫邏長極天晴色辨微芒黃榆不斷庭方路白日能消氷雪光獵騎嘶風爭北向野鷹隨鴈亦南翔西山蒼靄遙相椄直似登臨在帝鄉輿圖逺闢古興安鳳舞龍回氣鬱蟠半嶺出雲鋪大漠喬松落葉倚髙寒嶺以北松皆落葉丹青不數東南秀俯仰方知覆載寬萬里乾坤千里目欣從竒險得竒觀駐蹕伊遜河源上親射石熊以熊掌頒賜臣等恭紀查慎行千峯萬峯爭落木秋聲蕭蕭氣肅肅連朝纘武大掩羣殪盡山中雪斑鹿西風捲地餘怒號虎豹股栗豺狼逃老熊何物敢自匿出林獨叫求其曹天威赫業掦雲罕搗穴直窮熊所館公然人立向人啼正值雕弓彀初滿皮毛與石孰比堅不聞射石石亦穿須臾三發三命中搖尾大似求哀憐忽看趫捷如猿鳥騰上千年松樹杪神機别以火器攻霹靂斜飛貫其腦半空拗折青珊瑚松耶熊耶墮地俱皇心因材有生殺倔強那得逃天誅雉飛兔走清林莽重馬馱來遍行賞驁性寧非恃爪牙焚身竟至因蹯掌駝蹄鹿尾猩猩唇舊傳此味配八珍大庖袛合供御饌榮施何幸加詞臣臣聞南山之下渭水濵從禽搏獸空鋪陳賦家漫誇三十六終日射侯原非真豈如吾皇勇且仁除凶服猛胥躬親已靖六合無纎塵山林兼使異獸馴他年珥管紀上瑞郊藪行見逰麒麟上親射金錢豹恭紀查慎行朔漠回鑾候君王罷獵時忽聞山下豹正逐草間麋詎縱顔行抗還將餘勇施三驅爭效命七校復揚旗金鏃霜花淬飛龍電影追應弦疑樹鵠拔箭已連胔直作摧窮冦真如殪伏雌右髃充上殺全質少微疵貍首斑斑血貓睛䁡䁡眵鬚雄粗縮蝟爪利善藏錐自匿荆榛窟初含霧雨姿氣曽吞虎兕力肯讓熊羆緩死俄無路偷生詎有期但令供獮狩猶得壯威儀鎗桿風搖尾鞍橋錦冒皮呈文留炳蔚取用及捐糜師武當關險兵韜示象竒小臣慚獻頌何異管中窺駕發藍旗營乘舟網魚命臣等沿河騎隨賜鮮鯉人各一尾恭紀查慎行雪光皛皛山稜稜千山映雪朝日升灤河之水暖不氷刳舟剡楫凌空去三尺黃龍帝親御川后前驅風伯助峽形漸束波愈清潛鮮帖帖何敢驚人聲不聞聞水聲須臾船重皇情樂銜尾駢頭來繹絡八紘一張魚載躍鰷鱨鰋鯉旨且多義不盡取收網羅滿渠新漲餘天波詞臣拜恩已無算復賜紅鱗長尺半馬上擕歸萬人看命侍衛射虎召臣等同觀恭紀查慎行後射豹前射熊隂方凛凛生寒風既殺熊復殺虎積雪皠皠映強弩君王威德彌寰宇坐致遐方歌樂土闢田築室藝稷黍猛獸寧容此逼處爾牙如鋸我鏃銛焚林蕩谷期盡殱溪東距溪西相望十餘里忽聞響應徹山巔天語遙傳順風耳西洋人所製六飛所幸成坦途冥頑何物乃負嵎期門壯士能手搏奉令何異天行誅天生聖人能格物檮杌窮竒情狀悉耳端一缺戕一人厥罪昭然何待詰自從殺此虎邊牧蕃雞豚自從殺此虎莊户長子孫黃熊赤豹同噬吞腥風掃盡無一存小臣稸眼嗟未見談虎尋常色為變此來快覩三害除直似倍遊向畿甸扈從入古北口查慎行金支影轉翠微間萬馬驕嘶並入關雉堞連雲軍角壯虎牙憑險戍旗間西風漸老河邊栁積雪回看塞外山正是清秋好時節六龍行狩扈南還欽定熱河志卷一百九
