body:
  text: 故事四元上都路興州松州元史世祖紀中統二年十月詔指揮副使鄭江將千人赴開平指揮使董文炳率善射者千人由魚兒泊赴行在所指揮使李伯裕率餘兵屯潮河川十一月那海舊作訥懷今改正從阿呼岱舊作阿忽帶今改正出古北口駐興州帝親將諸萬户漢軍及衛軍由檀順州駐潮河川三年免興州松州望雲州親舊差賊以雲望雲松山興州課程𨽻開平府烏葉爾舊作吾也兒今改正傳興州監軍珠爾舊作重兒今改正以兵叛烏葉爾往征之賊軍射殺所乘馬軍士憤怒奮戈衝擊大破賊軍世祖紀至元二十七年二月興州興安飢給九十日糧十一月興松二州隕霜殺木免其租二十九年正月興州之興安宜興兩縣飢賑米五千石元史文宗紀致和元年八月阿蘇舊作阿速今改正衛指揮使托克托穆舊作脫脫木兒今改正帥其軍自上都來歸即命守古北口及上都諸王實喇舊作失剌今改正平章政事鼐瑪台舊作乃馬台今改正詹事奇徹舊作欽察今改正戰於宜興斬竒徹於陳擒鼐瑪台送京師戮之實喇敗走徹爾舊作徹里今改正傳子實勒們舊作失列門今改正直宿衛致和元年八月從知托克托穆爾至潮河川獲旺扎勒巴圖爾舊作完者八都兒今改正愛勒德濟舊作愛的斤今改正等十二人戮八人執四人歸京歸復於宜興遇實喇鼐瑪台等迎戰奮戈擊死二人以功賞白金楮幣元史順帝紀至元三年五月以興州松民飢禁上都興和造酒至正二十四年四月圖卜沁特穆爾舊作秃堅帖木兒今改正以兵入居庸關皇太子率侍衛兵出光熙門東走古北口趨興松至路兒嶺詔追及之還宫庚申外史至正二十八年七月二十一日大軍自通州進兵克永平伊蘇舊作也速今改正軍潰於是檀會順利大興等處以次皆降附焉按以上諸條載興州松州事其地屬今承德府境故著之其概言上都俱不録大寧路按大寧路元初為北京路至元七年改大寧嗣改武平後復為大寧凡紀傳中書北京者皆大寧路事在今承德府境故全録之元史太祖紀九年十月穆呼哩舊作木華黎今改正征遼東髙州盧琮金朴等降十年二月穆呼哩攻北京金元師音逹琿舊作寅答虎今改正烏庫哩舊作烏古倫今改正以城降以音逹琿為留守烏葉爾權兵馬都元帥鎮之興中府元帥石天應來降以天應為興中府尹四月詔張鯨總北京十提控兵從南征鯨謀叛伏誅七月紅羅山寨主杜秀降十一年春鯨弟張致陷興中府穆呼哩討平之王珣傳太師穆呼哩略地奚霫珣率吏民出迎承制以珣為元帥兼領義川二州事張致僭號錦州隂結開義楊伯傑等來掠義州珣出戰伯傑引去會致兄子以千騎來衝珣選十八騎突其前復令左右犄角之一卒以槍刺珣珣琿刀殺之其衆潰走獲其馬幾盡時興中亦叛穆呼哩圖之召珣以全軍來會致窺覘其虛夜襲之家人皆遇害及興中平珣無所歸穆呼哩留之興中遣其子榮祖馳奏其事帝諭之曰汝父子宣力我家不意為張致所襲歸語汝父善撫其事俟逆黨平彼之族屬城邑人民一以付汝吾不吝也珣以穆呼哩兵復開義擒伯等等殺之進攻錦州致部將髙益縳致妻子及其黨千餘人以獻穆呼哩志以付珣但誅致家其餘皆釋之始還義州太祖紀十二年夏盜祁和尚據武平史天祥討平之遂擒金將巢元帥以獻元史世祖紀中統元年六月詔燕京西京北京三路宣撫司運米十萬石輸開平七月敕燕京西京北京等路宣撫司造羊裘皮帽袴靴皆以萬計輸開平二年八月敕北京運糧於魚兒泊食貨志中統二年免北京差發以鈔一千二百定於上都北京西京等處糴三萬石世祖紀中統三年正月耶律鑄詣北京餉諸王軍仍遣宣撫司柴楨等增價糴米三萬石益之三月括北京鷹坊等户丁為兵蠲其賦四月以北京廣寧豪懿州軍勞興弊免今年稅賦兵志中統四年八月命阿海充都元帥專於東京北京平灤懿州蓋州路管領見管軍人凡民間之事母得預焉世祖紀中統四年三月命北京元帥阿海發漢軍三十人赴開平五月詔北京運米五千石赴開平其車牛之費並從官給八月命中書省給北京西京轉運使車牛價鈔至元元年正月敕北京西京宣慰使和糶以備糧餉二年正月命兆京行省給扎拉齊舊作扎剌赤今改正户東徙行糧萬石十二月宋子貞請罷北京行軍中書省别立宣慰司以控制東北州郡從之按紀書中統二年罷行省置宣慰司至十五年又書改北京行省為宣慰司而八年至十四年復屢書特訥克舊作頭輦哥今改正亷希憲張附哈達舊作合答今改正行省如故則是十五年以前行省未嘗罷也史書從之必有誤元史世祖紀至元八年正月賑北京飢七月以國王特納克行尚書省於北京遼東等路食貨志金課在遼陽者至元十年聽李德仁於龍山縣胡碧峪淘采每嵗納課金三兩世祖紀至元十一年五月敕北京中京等新附軍恐不宜暑權駐上京十一年二月以亷希憲為中書右丞北京等處行中書省事七月敕山北遼東道提刑按察使烏魯斯布哈舊作兀魯失不花今改正同參知政事亷希憲行省北京國王特訥克母署事有大事則希憲等就議十二年八月免北京等路今嵗絲銀十三年六月以北京行中書省亷希憲為中書右丞行省於荆南府以户部尚書張附參知政事行中書省於北京十四年正月詔上都隆興西京北京四路編民捕獵等户僉選丁壯軍三千人防守上都二月命北京選福住所統軍三百赴上都三月以郡王哈達為平章政事行中書省於北京十五年四月改北京行省為宣慰司九月詔發東京北京軍四百人戍應昌府十月詔河西西京南京西川北京等處宣慰司案牘宜依江南近例令按察司照磨移河南河北道提刑按察司十六年二月詔河南西京北京等路課程令各道宣慰司領之五月烏朗哈特舊作兀里飬合帶今改正言賊北京西京車牛俱至可運軍糧帝止之十八年二月以京大定諸州早免今嵗稅賦之半二十年五月省北京提刑按察司副使僉事各一員八月敕大名真定北京衛輝四路屯駐新附軍於東京屯田十月罷北京鹽鐡課程提舉司二十三年七月罷遼陽等處行中書省復北京感平宣慰司鄂都濟蘇舊作斡脫吉思今改正部民飢就食北京二十四年四月諸王納延舊作乃顔今改正反免北京今嵗絲銀仍以軍旅經行給鈔三千定賑之五月遣額森舊作也先今改正傳旨諭北京等處宣慰司凡穎納延所部者禁其征來母使乘馬持弓矢托爾楚舊作塔出今改正傳托爾楚探知納延謀叛遣人馳驛上聞有旨領軍一萬與皇子阿雅噶齊舊作愛也赤今改正同力備禦女直碩達勒達舊作水逹逹今改正官民與納延連結托爾楚遂棄妻子與麾下十二騎直抵建州距咸平千五百里與納延黨台繖巴圖爾舊作太撒拔都兒今改正等合戰雨中流矢繼知其黨特爾格舊作帖哥今改正綽爾齊舊作抄兒赤今改正等欲襲皇子阿雅噶齊以數十人退戰千餘人扈皇子渡遼水納延軍來襲托爾楚轉鬬而前射其酋特古勒岱舊作帖古歹今改正中口鏃出於項隊馬死追兵乃退遂軍懿州州老幼千餘人焚香羅拜道旁泣曰非宣慰公吾屬無遺種矣世祖紀至元二十四年六月諸王實都爾舊作失都兒今改正所部特爾格舊作鐡哥今改正率其黨取咸平府欲劫取豪懿州守臣以乏軍求援敕以北京戍軍千人赴之九月咸平懿州北京以納延叛民廢耕作又霜雹為災告飢詔以海運糧五萬石賑之食貨志至元二十四年九月除北京馬五百匹世祖紀至元二十五年二月省遼東海西道按察司入北京改北京為武平路按元初沿金北京之名至是始改武平地理志載至元七年改北京為大寧然紀中仍書北京未見以大寧紀事也世祖紀至元二十五年二月遼陽武平等處除今年租稅及嵗課貂皮二十六年十月武平路飢發常平倉米萬五千石賑之十一月武平路飢免今嵗田租十二月武平路飢以糧二萬三千六百石賑之二十八年三月武平路飢百姓田於盜賊軍旅免其去年田租賑遼陽武平飢民仍弛捕獵之禁四月以地震故免侍衛兵籍武平者今嵗徭役五月賑上都桓州武平寬河等處飢民十月武平路飢免今嵗田租十一月武平平灤諸飢弛獵禁其孕字之時勿捕食貨志至元二十八年詔武平路絲綿並除之按元史食貨志載中統五年北京市糴即至元元年事是年三始改元兹不重録世祖紀二十九年正月以武平地震全免去年稅四千五百三十六錠今年糧輸之止徵二千五百六十九錠六月大寧路惠州連年旱潦加以役繁民飢死者五百人詔給鈔二千錠及糧一月賑之按元史地理志武平後復為大寧不詳年月紀中無復武平為大寧事以此年正月紀武平六月紀大寧證之則知改名在元二十九年春之間蓋從此始定為大寧矣元史成宗紀大德五年七月大寧路水以糧千石賑之元史仁宗紀七月大寧等路隕霜敕有司賑恤按是年為武宗至大四年仁宗七月已即位故入仁宗紀仁宗紀皇慶二年二月以大寧飢禁酒四月大寧路免今嵗鹽課延祐四年惠州銀洞三十六眼立提舉司辦課元史泰定帝紀九月大寧蒙古大千户部風雪斃畜牧賑米十五萬石按是年為英宗至治三年泰定帝已即位故入泰定紀泰定帝紀泰定二年十二月大寧路飢禁釀酒惠州等處飢賑糴有差三年十一月大寧等路水民飢賑鈔五萬錠是嵗大寧路大水溺死者人給鈔一錠四年三月大寧廣平二路屬縣飢賑鈔二萬八千錠致和元年四月大寧屬縣飢發粟賑之元史順帝紀元統二年六月大寧廣寧遼陽開平懿州水旱蝗大飢詔以鈔二萬錠遣官賑之庚申外史上都與紅羅山未平庚申帝在上都紅羅山在東南伊蘇駐兵在焉上都恃有紅羅山為之籓籬紅羅山恃上都為救援而不設備常遇春使人覘知之即以大兵鋭騎晝夜兼行六月破紅羅山七月破上都城按是年為至正二十九年明太祖洪武二年明興州衛明太祖實録命遇春自鳯翔赴北平以平章李文忠輔之自北平往取開平道三河徑鹿兒嶺過惠州敗故元將江文清兵次全寧故元丞相伊蘇復以兵迎戰又敗之伊蘇遁去進攻大興州乃分兵千餘為八屯伏其歸路大破之明史李文忠傳拜征虜左副將軍與大將軍分道北征至北慶州而還道興州禽國公江文清等降三萬七千人至紅羅山又降楊思祖之衆萬六千餘人按江文清常遇春傳作汪文清字誤也明太祖實録洪武四年二月罷山後諸州徙其民於山南中書右丞相魏國公徐達奏山後順寧等州民雖已招集來降未見安土樂生恐其久而離散已徙順寧宜興州沿邊民入壯平州縣洪武七年九月燕山衛都指揮使朱杲通州衛指揮僉事鄭治汝寧衛指揮僉事馮俊密雲衛指揮僉事張斌等率師出古北口防秋卒遇敵皆力戰死明史成祖紀洪武三十五年十月命北平州縣棄官避靖難兵者朱寧等二百十九人入粟免死戍興州大寧衛營州衛明太祖實録洪武四年十一月賜北平紅羅山新附韃靼軍五萬七千七百餘人綿花綿布蘇木五年六月振武衛指揮僉事王常先等招集紅羅山故元將阿蘇舊作阿速今改正所部軍士七千人來降七年七月左副將軍李文忠帥師攻髙州大石崖克之斬故元宗王托多實哩舊作朵朵失里今改正禽其承制伯嘉努舊作百家奴今改正餘衆敗走文忠復遣指揮唐某追擊之至氊帽山遇故元魯王營於山下以兵攻之斬魯王及司徒達噶濟舊作答海後今改正平章巴爾舊作巴剌今改正知院呼都克舊作忽都今改正獲魯王妃蒙克圖舊作蒙兒秃今改正并金印一玉圖書一十二年六月命都督僉事馬雲統兵往大寧明史太祖紀二十年正月馮勝為征虜大將軍傅友德藍玉副之率師征納克楚舊作納哈出今改正三月師出松亭關城大寧寬河會州富峪六月踰金山納克楚降閠月師還次金山都督濮英殿軍遇伏死之九月置大寧都指揮使司明太祖實録十月征虜大將軍永昌侯藍玉奏留人馬戍守大寧會州等處二十一年命北平都指揮使司調新籍軍士赴大寧屯戍代還舊軍二十三年遣使敕遼東都指揮故旻朱勝率所撡軍馬往大寧候總兵官調遣其駝牛馬非備戰者悉發大寧運糧二十五年八月置營州後屯衛命指揮郭麟守之二十六年二月置營州前屯衛於興州右屯衛於建州中屯衛於龍山縣左屯衛於塔山北按興州當作興中州誤脫一字明史太祖諸子列傳寧獻王權太祖第十七子洪武二十四年封踰二年就藩大寧在嘉峯口外古會州地東連遼左西接宣武為巨鎮帶甲八萬革車六千所屬諾音舊作朵顔今改正三衛騎兵皆驍勇善戰權數令諸將出塞以善謀稱明太祖實録二十八年四月調大寧左右二衛為寧王營州左右二護衛明史惠帝紀建文元年八月詔興州營州開平諸衛軍全家在伍者免一人十月燕兵自劉家口間道襲陷大寧守將朱鑑死之總兵官劉貞都督陳亨援大寧亨叛降燕燕以寧王權及諾音三衛卒歸北平太祖諸子列傳建文元年朝議恐權與燕王合使人召權權不至坐削三護衛其年九月江隂侯吳髙攻永平燕王往救髙退燕王遂自劉家口間道趨大寧詭言窮蹙來求救權邀燕王單騎入城欵洽不為備北平鋭卒伏城外吏士稍稍入城隂結三衛部長及諸戍卒燕王辭去權祖之郊伏兵起擁權行三衛彍騎及諸戍卒一呼畢集守將朱鑑不能禦戰殁王府妃妾世子皆隨入松亭關歸北平大寧城為空明太宗實録七月庚寅守遵化指揮蔣玉言都督劉貞陳亨都指揮卜萬引大寧兵出松亭關駐沙河將攻遵化壬辰上率兵援之劉貞等聞上將至走還松亭關乙未命千户李濬等領兵至關劉貞等閉關不敢出適邏騎獲大寧二卒至乃作招卜萬書盛稱奬萬而極毁詆亨緘識牢密召一卒飲之酒且厚賚之而置書其衣中俾歸與萬其同獲之卒竊窺之問守者曰彼何為者守者曰遣歸通意故得厚賚卒請偕行遂俱遣而不與賚不得賚者至即發其事劉貞陳亨搜卒衣得與卜萬書遂疑萬執下獄籍其家九月議攻大寧乙未師行十月戊戌師至劉家口路極險隘守關百餘人乃命鄭亨領徑卒數百卷斾登山斷其歸路而從後攻之悉擒守關者師遂度關壬寅師抵大寧適西南隅城崩遂克之獲都指揮房寬遣陳亨家奴并城中將士家屬報亨等劉貞等引軍來拔軍士聞家屬無恙皆解甲寧王權三護衛軍為朝廷削奪者尚留城中至是皆歸附上悉以還寧王丁未劉貞陳亨回至亂塔黃崖亨與營州中護衛指揮徐理右護衛指揮陳文夜襲破貞營貞單騎走廣寧亨等率衆降甲寅拔大寧之衆及寧王權皆回北平乙卯我軍至會州以大寧歸附之衆分𨽻各軍丁巳師松亭關按明史言燕王詐入大寧而實録言城西南隅崩而入事迹互異今兩存以備考明太宗實録十月命兵復議大寧營州興州三衛凡各衛官軍先調遼東等處及在京並有坐事摘戍邊者皆令復原衛屯田命户部尚書王鈍馳驛往北平與新昌伯唐雲經度屯糧十一月令武安侯于千户寨灰嶺慶州神樹西馬山七度河皆設煙墩使屯守知備仍令新昌伯以領軍自小興州至大興州東接牛嶺會州塔山龍山諸處屯種北勿令出會州西勿過千户寨永樂元年二月辛亥以興州左屯興州右屯興州中屯興州前屯興州後屯𨽻北京留守行後軍都督府按明史地理志興州諸衛永樂元年二月徙治玉田遷安良鄉豐潤三河實録不言徙治史官之疏也明太宗實録永樂元年二月改營州左護衛為隆慶左衛右護衛為隆慶右衛中護衛為寬河衛三月調營州左屯衛於順義右屯衛於薊州中屯衛於平谷前屯衛於香河後屯衛於三河衛設左右中前後五所仍𨽻大寧都司明史成祖紀永樂元年三月改北平行都司為大寧都司徙保定始以地畀烏梁海舊作兀良哈今改正諾音衛泰寧衛明史諾音傳成祖從燕起靖難患寧王躡其後自永平攻大寧入之謀脅寧王因厚賂三衛説之來成祖行寧王餞諸郊三衛從一呼皆起遂擁寧王西入關成祖復選其三千人為竒兵從戰天下既定徙寧王南昌徙行都司於保定盡割大寧地畀三衛以償前勞按烏梁海初在黃河北明太祖二十二年分置三衛以居之其部落始內徙然猶有大寧等衛錯處而監制之如都護然及成祖盡撤諸衛以地全畀烏梁海終明之世邊徼遂無寧嵗明太宗實録永樂十年四月福餘等三衛指揮使鼐爾巴哈舊作南不花今改正等如敕書遣人納馬贖虜掠邊卒之罪十九年十一月命遼將置邏騎營於古北口之北神樹之地作深溝髙塹以自固二十年七月車駕次捕虜川始諸將之赴烏梁海也諭之曰官軍至彼虜必西走以兵從西要之可獲也至是率精騎數萬馳赴之命武安侯鄭亨成山侯王通陽武侯薛祿率大營諸將軍後行甲戍烏梁海寇黨老弱者詣軍門待罪命釋之八月戍戍車駕次玻璃谷諸將先受命征烏梁海者奏云已入寇穴寇悉衆來敵大敗之斬首數千級餘衆潰而西走盡收其口孳畜先道大寧入喜峰口明史宣宗紀宣德三年八月丁未帝自將巡邊九月辛亥次石門馹烏梁海寇會州帝帥精卒三千人往擊之乙卯出喜峰口擊寇于寬河帝親射其前鋒殪三人兩翼軍並發破之甲子班師癸酉至自喜峰口六年七月許諾音三衛市易明宣宗實録六年正月宥泰寧福餘諾音三衛剽竊之罪敕諭其大小頭目七年五月諾音衛指揮使司差指揮圖嚕特穆爾舊作都兒帖木兒今改正奏所降印信為巴延實哩舊作本雅里今改正掠去請再給賜從之十年十月鎮守遼東太監伊實喀舊作亦失哈今改正等奏諾音三衛縱其部落數來擾邊乞舉兵征勦明英宗實録正統四年九月右參將都指揮使楊洪領軍追捕叛虜至白塔兒十岔口遇烏梁海五百餘騎射死十二人生擒三人并獲其馬匹軍器六年十月左參將都督僉事黃直等率兵巡哨至巴顔舊作伯顔今改正山遇虜騎百餘擊走之明日至明安舊作閔安今改正山復與烏梁海三百餘騎遇都指揮朱謙文洪廣等率衆又敗之至莽賚舊作莽來今改正泉賊遁去八年四月錦衣衛指揮僉事王息奉使烏梁海三衛還九年正月命成國公朱勇興安伯徐亨都督馬亮陳懷等分統兵出境勦賊時烏梁海三衛雖陽朝貢屢寇遼東延安邊境命勇出喜峰口恭順侯吳克忠佐之亨出界嶺口亮出劉家口懷出古北口各將兵萬人約至黃河土河兩大口等處探賊蹤迹葉向髙諾音三衛考勇等兵渡栁河經大小興州過神樹至全寧遇福餘逆戰敗之次虎頭山及流沙遇泰寧諾音又敗之明英宗實録初肥河衛都指揮伯勒格舊作别里格今改正奏烏梁海拘殺其使人朝廷許其報復伯勒格遂同敖罕舊作嘔罕今改正河衛都督尼克塔舊作你哈答今改正等率衆與戰大敗之明史諾音傳正統十二年衛拉特舊作瓦剌今改正擊殺鼐爾巴哈舊作乃兒不花今改正大掠以去額森繼至諾音泰寧皆乞降福餘獨走避諾衮舊作腦溫今改正江三衛益衰畏衛衛拉特強不敢背仍嵗來致貢止以利中國賜賚又心銜邊將勦殺潛圖報復十四年夏大同參將石亨等復擊其盜邊者於箭溪山三衛益怨秋導衛拉特大入英宗遂以是役北狩按正統是諾立三衛入貢邀賞無慮數十次其間六年則一年五至四年五月則一月四至考土木事在十四年而正月中猶有來朝者上下恬嬉懵然不悟彼豈獨賜賚為利蓋為衛拉特所使耳兹諾音傳所言庶幾得其實矣明英宗實録諾音衛都指揮阿爾齊默舊作阿兒乞蠻今改正遣其頭目哈喇等來朝奏言為衛拉特額森所逼徙其部落於黃河穆楞舊作母納今改正之地昨者欲召三衛頭目令發壯丁隨營攻戰臣等以祖父以來世臣中國不願從之且言額森欲分道南向恐為邊患并進馬匹詔宴勞之先是泰寧等衛都督僉事格根特穆爾舊作革干帖木兒今改正等遣人上書願附塞居住為中國籓籬耳乞大寧廢城及甲盾見賜如有外侮願備前驅令去塞二百里居住天順二年諾音衛欲從宣府入境朝貢守臣以聞命仍從喜峰口入明憲宗實録成化十年正月重給諾音衛印從本衛署印知院托和齊舊作脫火赤今改正言其印為瑪拉噶舊作毛里孫今改正所掠故也二十三年六月諾音三衛為那海舊作那孫今改正等逐掠各㩦人畜入關避匿敕遼東守臣嚴為戰守之備仍遣譯諭三衛聽其暫駐近邊明孝宗實録宏治十一年十二月巡撫薊州都御史洪鍾奏潮河川去京師僅二百里居兩山之間約廣百餘丈每夏秋山水漲溢則汪洋巨浸水退則坦然平路虜可擁衆而入請於本處之東三里許第二第三兩寨之間其山內髙外低約餘二丈鑿為兩渠以殺水勢復於口外斜砌石堰使水由川中行仍於石堰之內築立外關一座以百人防守使虜不衝突從之明史諾音傳三衛之迭犯也實諾音部哈丹舊作哈丹兒今改正陳通事為之二人者俱中國人被虜遂為三衛用嘉靖二十九年俺答謀犯畿東哈丹為指潮河川路俺答移兵白廟近古哈丹詐言敵已退邊備緩俺答遂由鴿子洞曹榆溝入直犯畿甸已而俺答請開馬市哈丹復往來誘阻之三十年薊遼總督何棟購捕至京伏誅欽定熱河志卷一百二
