body:
  text: 建置沿革一承德府屬全境自慕容燕都龍城始有建置可言越晉以前上溯周秦雖鄰界北邊總未入內地疆域為州郡所不及若太平寰宇記引開元十道略舜築栁城既荒逺不可考遼史地理志以中京大定府為虞營州則不知舜分青州為營州所得者遼東之地不得逾遼水以西也蓋今承德府境於禹貢為冀州邊外而虞及殷周幽州之邊外也秦漢而還在漁陽右北平遼西三郡邊外為諸部分據北魏雖設安營二州亦與奚契丹雜居遼金與元各建郡縣而宅中未久故址旋荒明棄大寧視為外域我國家撫臨函夏中外一家設廳分治以來久成都會近復改設府州縣規制不殊內地珥筆扈從之臣親承指示得識其山川道里數千年沿革之迹釐然可考兹倣史記年表之例以地為經以時為緯為承德府建置沿革全表而周秦以來並按代編纂各糸以圖用便省覽志建置沿革第七承德府全屬州縣分境建置沿革考略熱河全境設承德府及所屬一州五縣其建置沿革自周秦迄元明援據史書旁採碑碣按代考證已偹見前卷兹復舉府本境及州縣各境析時代以從疆域分舉大凡用便觀覽如承德府本境則周秦為東胡地漢為胸奴左地武帝時為塞地後入烏桓後漢初為烏桓地後屬鮮卑中部魏為鮮卑軻比能地後與素利彌加厥機諸部雜居晉初為鮮卑假氏地北境為宇文氏地後併入慕容氏為前燕地苻堅時為秦地屬幽州慕容垂復國後為後燕地屬幽州馮跋時為北燕地北魏為安州廣陽郡燕樂縣地北境厙莫奚地後併入厙莫奚北齊周隋唐因之隋唐去厙莫字但名奚遼為中京道澤州灤河縣及北安州地金為北京路興州興化縣宜興縣地大定府神山縣地元為上都路興州興安縣宜興縣地大寧路惠州地明初為興州衛廢入諾音舊作朵顔今改正衛本朝初內屬雍正元年設熱河廳十一年改設承德州乾隆七年罷州仍設熱河廳四十三年改設今府此承德府本境之建置沿革也灤平縣境則周為東胡地秦初為東胡地後併入胸奴漢為胸奴左地武帝時為塞地後入烏桓後漢初為烏桓地後屬鮮卑中部魏為鮮卑地晉初鮮卑假氏地後併入慕容氏為前燕地苻堅時為秦地屬幽州後燕復國屬幽州後為北燕地北魏為安州廣陽郡廣陽縣地西境為禦夷鎮地後併入厙莫奚北齊周隋唐因之遼為中京道北安州地西境奚王府地金為北京路興州興化縣宜興縣元為上都路興州興安縣宜興縣地明初為興州衛後廢入諾音衛本朝初內屬乾隆七年設喀喇河屯廳四十三年改設今縣此灤平縣境之建置沿革也豐寧縣境則周為東胡地秦初為東胡地後併入胸奴漢為胸奴左地武帝時為塞地後入烏桓後漢初為烏桓地後屬鮮卑中部魏為鮮卑地晉初為鮮卑宇文氏地後入慕容氏為前燕地苻堅時為秦地屬幽州後燕復國屬幽州後為北燕地北魏為安州廣陽郡燕樂縣方城縣地西南境為禦夷鎮地北境為厙莫奚地後併入厙莫奚北齊周隋唐因之遼為中京道北安州利氏縣西境奚王府地金為北京路興州興化縣宜興縣地西北境兼得西京道桓州地元為上都路興州興安縣宜興縣地西北境兼得開平府開平縣地明初為興州衛地西北境為開平衛地後俱廢入諾音衛本朝初內屬乾隆元年設四旗廳四十三年改設今縣此豐寧縣境之建置沿革也平泉州境則周初為山戎地後併入東胡秦初為東胡地後併入胸奴漢為胸奴左地武帝時為塞地後入烏桓後漢初為烏桓地後屬鮮卑東部魏為鮮卑地晉初為鮮卑段氏地後併入慕容氏為前燕地苻堅時為秦地屬幽州後屬平州後燕復國屬平州尋改營州後為北燕地北魏為營州建德郡陽武縣冀陽郡平剛縣北齊為營州建德郡冀陽郡地周時為北齊髙保寧地隋為遼西郡地西境為奚地唐為奚地遼為中京大定府大定縣長興縣勸農縣富庶縣文定縣升平縣歸化縣金源縣恩州恩化縣澤州神山縣金為北京大定府大定縣長興縣富庶縣金源縣神山縣元為大寧路大定縣後改大寧縣富庶縣金源縣惠州明初為大寧衛新城衛富峪衛會州衛後俱廢入諾音衛本朝初內屬雍正七年設八溝廳乾隆四十三年改設今州此平泉州境之建置沿革也赤峰縣境則周初為山戎地後併入東胡秦初為東胡地後併入胸奴漢初為胸奴左地武帝時為塞地後入烏桓後漢初為烏桓地後屬鮮卑東部魏為鮮卑地晉初為鮮卑段氏地北境為宇文氏地後併入慕容氏為前燕地苻堅時為秦地初屬幽州後屬平州後燕復國屬平州尋改營州後為北燕地北魏為厙莫奚地北齊周時因之隋唐時為契丹地遼為中京道髙州三韓縣上京道松山州松山縣饒州長樂縣臨河縣安民縣上京臨潢府臨潢縣定霸縣保和縣潞縣宣化縣金為北京路大定府三韓縣松山縣靜封縣全州安豐縣臨潢府臨潢縣盧川縣元為大寧路高州上都路松州全寧路全寧縣兼得魯王分地明初為大寧衛全寧衛地後廢入諾音衛本朝初內屬雍正七年設八溝廳為廳北境地乾隆三十九年析置烏蘭哈逹廳四十三年改設今縣此赤峰縣境之建置沿革也建昌縣境則周初為山戎地後併入東胡秦初為東胡地後併入胸奴漢初為胸奴左地武帝時為塞地後入烏桓後漢初為烏桓地後屬鮮卑東部魏為鮮卑地晉初為鮮卑宇文氏地後併入慕容氏為前燕地苻堅時為秦地初屬幽州後屬平州後燕復國屬平州尋改營州後為北燕地北魏為營州建德郡石城縣廣都縣冀陽郡栁城縣北境為契丹地北齊為營州建德郡地北境為契丹地周時為北齊髙保寧地北境為契丹地隋為遼西郡地北境為契丹地唐為營州栁城郡栁城縣地後與契丹雜居北境契丹地西境奚地遼為中京道利州阜俗縣澤州龍山縣榆州和衆縣永和縣東南境兼得隰州海濵縣地北境惠州惠和縣兼得髙州三韓縣地金為北京路利州阜俗縣龍山縣大定府和衆縣東南境兼得瑞州海濵縣北境大定府惠和縣兼得三韓縣地元為大寧路和衆縣龍山縣利州東南境兼得瑞州地南境惠州地北境惠和縣明初為營州衛地後入泰寧衛本朝初內屬乾隆三年設塔子溝廳四十三年改設今縣此建昌縣境之建置沿革也朝陽縣境則周初為山戎山地後併入東胡戰國時東南境屬燕秦初為東胡地後併入胸奴漢初為胸奴左地武帝時為塞地後入烏桓後漢初為烏桓地後屬鮮卑東部魏為鮮卑地晉初為鮮卑宇文氏地後併入慕容氏為前燕地苻堅時為秦地初屬幽州後屬平州後燕復國屬平州尋改營州後為北燕地北魏為營州昌黎郡龍城縣廣興縣定荒縣地北境為契丹地北齊為營州龍城縣廣興縣北境為契丹地周時為北齊髙保寧地北境為契丹地隋初為營州建德郡後廢州置總管府改置遼西郡龍山縣後改栁城縣北境為契丹地唐為營州栁城郡後與契丹雜居北境為契丹遼為中京道興中府興中縣營邱縣象雷縣閭山縣建州永霸縣永康縣安德州安德縣川州咸康縣宏理縣宜民縣武安州武安縣成州同昌縣東境兼得宜州宏政縣西境兼得大定府神水縣東南境兼得來州地金為北京路興中府興中縣建州永霸縣永德縣宜民縣大定府武平縣東境兼得義州宏政縣同昌縣元為大寧路興中州建州川州武平縣東境兼得義州懿州地西北境兼得魯王分地明初為營州衛地後廢入泰寧衛本朝初內屬乾隆三年設塔子溝廳為廳東境地三十九年析置三座塔廳四十三年改設今縣此朝陽縣境之建置沿革也前卷分撰各表皆以時為經以地為緯兹復以地為經以時為緯彚撰列表一篇著于左方欽定熱河志卷五十五
