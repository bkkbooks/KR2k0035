body:
  text: 物産五蟲之屬蟬爾雅釋蜩有七種皆蟬之屬揚雄方言列諸蟬多至二十餘名蓋是物本隨地而異今關外之蟬不入關內其出聲較內地稍遲而音特清壯蒙古謂蟬為綽爾齊御製詩塞蟬較內地者大而聲壯蒙古名之曰綽爾齊綽爾齊者胡笳也甲戌塞榆雨霽流繁響靜聼啁嘹亦自嘉蒙古不知虗體物指聲直謂是胡笳塞蟬辛巳綽爾齊爭噪霽川關外蟬不入關內其音較內地宏而直蒙古謂之綽爾齊綽爾齊者胡笳奏曲人謂其聲似故名之天然南北限雄邉中庭地白傳陳語曰和眀君撥四絃聞蟬癸未氣候北來遲一月塞林今日始聞蟬舉頭密葉尋不見但見流隂旋去聲旋遷聞蟬乙未萬物憑生各趨時率因暄寒為早遲山莊今日始聞蟬南北氣候殊若斯詎惟氣候殊聲音亦異其北蟬聲雄粗且野南蟬聲細清以淒大抵氣稟分人性而衆生類咸隨之蒙古遂謂綽爾齊關外蟬音較內地宏而直蒙古謂之綽爾齊綽爾齊者胡笳奏曲人也以蟬聲相似故名之曲項蘆管和去聲以吹有時頗叶韻髙低然而彼此兩不知豈非幕天席地中若人若物同蒙大造同熙怡小哉俞琰席上腐談獨舉昭君笑其渾不似而又訛為火不思詠蟬丙申塞外蟬聲殊塞內元音太古綽爾平聲齊塞外蟬與內地稍異蒙古呼為為綽爾齊謂其似歌曲也報秋律合商兮羽飲露韻諧髙與低松下花間常入聼排衙喝道漫嘲題山中鼓吹流清響意謂斯猶勝孔圭聞蟬辛丑御園五月蜩昨于御園有聞蜩詩山莊六月蟬一二本難辨實有先後焉一解南者亮以清北者宏而壯物異人豈同強固因殊狀二解蒙古無巧語直呼綽爾齊蒙古呼蟬為綽爾齊綽爾齊者胡笳奏曲人也以蟬聲壯似之故以為名云聲頗中宫商而蟬豈自知三解時至彼自鳴夫豈有不平意謂昌黎序略失之琢情四解山中嫌寂歷流響出林蓊設以鼓吹方謂當勝彼孔五解粗韻為金石細韻為絲絃聆餘囅然笑恐人號官蟬六解官蟬塞外聞此事亦稀有芚蒙鄙彼癡怵愓勵豫守七解聞蟬壬寅秋蟬關內夥關外曽未聞山莊所有者綽爾齊之倫塞外之蟬其聲宏壯與口內清亮者有别蒙古呼為綽爾齊蓋謂胡笳奏曲音也今朝忽聞蟬其聲迥不羣既亮凄以清訝聼如遏雲風髙揚逾逺露重飲益神比似御園噪園明園秋蟬甚多反覺聒耳兹數年皆于山莊度秋今兹偶聞之為之心耳俱爽濶久喜聆新綽爾齊收聲如慚下里紛吾昔詠氣候謂自南北遷叶以今始聞蟬誠有如所云堯夫雖怪語塞上氣候自南而北向為氣候詩云大都草年中暖必以漸遷又云卲子天津橋怪語非正詮或者人煙輳以致默轉旋今以所聞蟬音證之益信卲子語雖非正論要可存為鑒戒云率應戒為君蟋蟀崔豹古今注曰蟋蟀一名吟蛩一名蛩秋初生得寒則鳴爾雅注曰蟋蟀今促織也蓋蟋蟀與絡緯皆有促織之名而其類各别御製詩月夜聞蛩甲戌漾舟逗星渚凄吟發露坡塞夕已颯沓塞月猶婆娑歐陽賦未就是聲來則那嫠婦怨别離孤客悲蹉跎於我何有焉也覺秋懷多聞蛩癸未漾舟廣寒宇取適非取疾沿傍葦岸間數聲揚唧唧吁嗟胡為來觸景增蕭瑟韶芳每遲候商調斯縮律塞外之恆情山莊詎能尼獨喜暑意遙何妨秋信出絡緯即莎雞也爾雅曰螒天雞注云小蟲黑身赤頭一名莎雞陸璣詩疏曰莎雞如蝗而斑色其翅正赤六月中飛而振羽索索作聲崔豹古今注曰莎雞一名促織一名絡緯促織謂鳴聲如急織絡緯謂鳴聲如紡績也一名紡績今塞外有一種形小而色緑與常産特異御製詩興安絡緯至小而色緑率筆圖之兼題以句丁卯依稀果螺負螟蛉塞草霏黃尚作青可惜徐黃曾未覩為傳蠕動補蟲經莎坂蒼煙動股鳴雲間天淡磧垣清若教賦質渝關裡答響流黃更覺情跂跂脈脈露華枝欲上寒英意轉遲大小略殊牟益畫牟益搗衣圖續入石渠寶笈中神品也風流渾脫惠連詩何必花棚草舍尋一畨畫取更長吟間聽靜想評形似氊室清宵冷逼衾絡緯己巳塞上秋蟲夥紛鳴抱露榛那曽催懶婦却解動征人風物渾如昔煙花且自新剡藤親貌取前嵗塞上曽圖之以歸並成詩四首俯仰便成陳榛蟈周禮蟈氏及月令螻蟈鳴注皆以蟈為蛙唐韻亦以蟈為蛙之别名玉篇集韻蟈字皆以蝦蟇為訓惟廣雅有蟧蟈馬蜩也然馬蜩乃蟬屬今塞外所産榛蟈則係絡緯蟋蟀之類善以翼鳴土人呼為呌蟈蟈盛以小籠置之暖室經冬猶有作聲者御製詩榛蟈甲戌啾啾榛蟈抱煙鳴亘野黃雲入望平雅似長安銅雀噪一般農候報西成蛙生水族蟈生陸振羽秋叢解促寒蟈氏去蛙因錯注至今名象混秋官按蟈蟈乃絡緯蟋蟀之類周禮蟈氏去蛙黽原不指一物而言注謂蟈今御所食蛙夫蛙乃蝦蟇不可食黽亦其類俗名田雞尚可食至蟈蟈則斷無可食之理不精考而錯注以訛傳訛蓋不少矣蝶崔豹古今注曰蛺蝶一名野蛾一名風蝶有大如蝙蝠者或黑色或青斑今熱河所産有黑花蝶大四五寸許蜂爾雅有土蜂木蜂之别疏謂土蜂又名馬蜂今塞外馬蜂視常蜂較大亦有蜜蜂元史興州有採密提舉司元一統志曰大寧路龍山縣惠州土産蜜及蠟螢塞外流螢極大光可燭三尺許蜥蜴塞外山中蜥蜴長四寸許頭以下色如翡翠有紋如魚鱗尾作金色吐氣如雲土人稱之為雲虎魚之屬箬漠􅱛塞外諸溪澗中皆有之狀似鱸細鱗重唇身有黑斑伊遜河所産尤多御製詩箬漠􅱛乙未魚名出口外諸溪澗中狀似鱸而味鮮美過之國語謂之箬漠􅱛蒙古語謂之集伯格然尚不如吉林之赭鱸也偶爾成咏以備方言九曲伊遜平聲水有依莘尾魚細鱗秋撥剌巨口浪吹噓隂益食單美輕嗤漁譜迹還應問張翰所憶定何如鯉灤河有之味較內地尤肥美鯽灤河及瀑河皆有之灤鯽以灤州偏涼汀所産為佳此為灤水上流熱河東南灤水中舊有鯽魚坑水深魚肥鮎塞外溪河有之有斑無鱗柘緑魚色微緑産灤河中滑子魚長五寸許形狹而修産平泉州山溪中蟲魚一名尖口魚大盈尺許鋭口細鱗産平泉州氷窖山溪中居民于二三月網取之鬻于市按遼史多載釣魚土河今土河所産蓋鮮古今地氣異也惟據今所有者載之如右至于行宫湖中則鱗族最繁有石磯觀魚及知魚磯牣魚亭諸勝御製捕魚網魚諸詩俱駐蹕山莊時所作往往取諸外湖以實內湖故鰷鱨鰋鯉品類充牣焉御製詩灤河捕魚辛酉野灘片片起鴐鵝蕩槳中流樂意多髣佛江鄉三月景西風紅葉小灤河灤河水自上都流順水行如風送舟最是關同得意筆蒼山野渡正初秋觀漁伊松河水秋日澄伊松河岸秋風清岸側停鞭聊復憩但見波光日影爭晶明漁人弄網中流迎鴐鵝雁鴨驚飛鳴我聞任公獨垂釣不釣鯤鮞釣長鯨湯網祝禽未祝魚渭濵無乃存空名不如乘興觀漁樂興盡輒逝無留停涼颸獵獵催歸轡鳶魚飛躍隨其情釣魚癸亥一川金紫明斜照清溪翠壁天然妙竿絲偶弄非夢羆瀺灂逰鱗俯可眺今來古往釣魚人不知却被魚兒釣敖漢捕魚一水帶龍岡三秋理釣航蒹葭颭寒渚鷗鷺貌江鄉樂事漁同獵嘉魚鰋共鱨便途資衆餉莫漫比如棠玉鏡澄秋浦林巒入照佳不綱仁未逮結網念常懷獻獲甘誰後頒恩與衆偕鳴榔歌快豫齊泊白雲涯把釣乙丑秋湖魚鮮餌把釣意如何愛此空眀景如聞欵乃歌釣魚己巳跂石弄竿線蓼波漾煙翠豈乏釡鬵烹為愛滄浪意垂釣辛未富春以釣隱磻溪以釣顯亦各適其適何繫竿與線叶跂石臨澄渚秋水泠然善垂絲致喁嘬豈為烹鬵甗隱顯非我為躍任彼轉渺瀰眄煙波興正復不淺捕魚甲戌隄分內外湖置閘期節制內湖育鱗族蒸然繁其類漏巵或旁出潛躍乃於外侵尋落野潦釡烹同浪棄乘間命罟師濊濊臨流試鯉鰋其品美生放內湖既鱧鮎其品惡逮衆盡分賜縱之斯未能挈入原有自忽憶文王囿却笑此何謂釣魚戲題三首癸未魚磯芳餌滿堆盤厯夏何曽試線竿却恐孤他勤伺候垂鈎聊試對秋灘水冷秋湖魚懶嘬片時空坐蓼花濱中涓竊議非時矣知爾誠為善釣人釣意由來非釣魚水天空濶朗如如紫溪翁與煙波叟無事希他偶似諸捕魚或曰捕魚可致雨無聊極思試為取金鈎甘餌已非時逝梁發笱徒延佇塞湖空濶潛族多中流濊濊施網罟小船深處提大網兩岸拽行衆邪許徐牽密攏近淺涯發發鱗類無所鯉鰱鱣鮪不一足強去聲立泥中其意苦觀之盛哉思之憐揀存一二悉放去吾意在雨不在魚網師竊惜空力努水寒可一不可再薄行賞賜足酬汝釣魚戲題甲申野水蒼煙曲岸濵持竿意不在求鱗了知跽餌勞勞者人匪釣魚魚釣人捕魚乙酉內河不捕魚為是肫然養外河每捕魚為恐悠然往亦弗事􅙰寒仍向內河放叶好生雖得一公物乃失兩陡憶文王囿棄罟恧以惘網魚丙戌網魚塞湖中銀鯽向稱美施罛獲藉藉從去聲人意甚喜擇碩留四五餘仍放諸水於取戒其多况原斯湖裏長大供烹鬵其期亦可指從人或後言竊漁誰禁彼肩輿過隔岸吾亦取諸此逆詐雖不為其實有此理捕魚戲言丁亥內湖不捕魚外湖常捕魚捕魚獲外湖放魚於內湖內湖鱗類孳外湖人烹諸於以示好生亦因觀水虞然魚豈得知業已殭泥塗救五於彼什蓋非彼所娛更有人竊笑盜取誰禁吾打魚壬辰數年打魚曽未為兹當長夏偶為之打魚非緣烹飪計打魚仍圖養育滋園中水自有髙下建閘斯分內外也內則常牣園湖中外則一去無留者外湖濊濊滋施罛欲以打魚置內湖大網兩岸揶揄掣近磯羣力邪許呼鯉鰱鱣鮪隨所取水盆滿置噞喁口波濤永失事則無底用長歌歎杜叟悠然而逝親見斯子産之欺誰能施取之外廄置中廄荀息之策誠非漏金石之屬魚兒石産朝陽縣西北山中石不甚堅層層可剝各有魚形隨剝隨異無相同者纎悉如畫土人名曰魚兒石聖祖御製康熙幾暇格物編四集喀爾沁地方有青白色石開發一片輒有魚形如塗雌黃或三或四鱗鰭首尾形體俱傋各長數寸與今所謂馬口魚者無異揚鰓振鬛猶作鼓浪遊泳狀朕命工琢磨以裝硯匣配以松花江石誠几案間一雅玩也嘗讀水經注及酉陽雜爼言衡陽有石魚山石具魚體宛若刻畫又池北偶談述汧陽縣有石魚溝取石破之兩兩成魚可以辟蠧故宋人石魚詩曰相傳此石能辟蠧功在琅函並玉儲然未有如斯之纎悉克肖者也其與石俱生耶抑魚之化如零陵之燕海南之蟹耶物理之不可全窮又如此御製詩魚石屏歌有序甲戌向見酉陽雜爼載衡陽湘鄉縣有石魚山山石色黑理若生雌黃開發一重輒有魚形鱗鬐首尾若畫長數寸燒之作魚腥又重慶江心有雙魚刻石上每一魚三十六鱗見則嵗豐云云夫石上刻魚世或恆見至開石自具魚形則非人力所能為疑為烏有誕論而已今過土默忒部落路南有所謂撒哈河灘者土人種田掘地得石剖之有魚形復剖之則復見大寸許小數分計銜尾比目若遊泳然乃知古人所載必有其徴誕在此實即在此製以為屏不異王振鵬魚藻圖也造物有無宗元疑石中魚形誰所為雕琢不到繪難揮又匪其中置鯤鮞擘開紋理紛鏤竒鬐甲刻畫噞喁姿永免麗罶及粘徽漫慮溉釡膾銀絲琴髙仙駕或其遺不然善眩如條枝殖瓜種樹幻術施冠鳬秋化石不移元王沉璧洛水涯化玉未聞仍孕其湘鄉竒蹤向謂虛叶事必有偶今始知詭談詫迹序若斯折中理氣繄豫思是地昔必潦水滋水退魚存僵淤泥嵗久土變石理宜試看易剖片片披宛然藻還浪吹寓形得所夀可期磨而不磷涅不緇製屏堪陳筍席垂兆維豐年念在兹前題再詠久竹青寧化難窮萬物情却看文石裏不異碧波清寫影矜鱗活知春出浪輕誰能緡餌釣底慮釡鬵烹幻體何妨脫真形永寄貞謂言在藻類可以認三生鉛平泉州境內之雅圖溝楊樹溝波羅樹等處産之康熙五十一年許內地民人及蒙古開採令每嵗納鉛入錢局以為課雍正元年悉令封閉炭宋王曽行程録曰深谷中多以燒炭為業元一統志大寧路和衆縣土産木炭蓋塞外多樹故為炭較易今所産視內地特佳鹻元戴侗六書故謂鹻為鹵之凝著者今建昌縣之南即明史大寧衛東南之大鹻場地鹽塞外食鹽皆蒙古境內所産泡子河生天然鹽不待煎熬而成蒙古用小車載以貿易博物志所謂戎鹽纍卵者是也按遼史地理志載太祖於澤州采鍊陷河銀冶又宋王曽行程録曰栁河館旁西北有鐡冶多渤海人所居就河漉沙石鍊得成鐡又元史食貨志載産金産銀産銅之所遼陽省曰大寧又産朱砂水銀之所遼陽省曰北京即大寧也元初仍金名曰北京至元七年改為大寧路又載金在遼陽者至元十年聽李德仁于龍山縣胡碧峪淘採每嵗納課金三兩銀在遼陽者延祐四年惠州洞三十六眼立提舉司辦銀課鐡在檀景等處者太宗丙申年始于北京撥户煽焉中統二年立提舉司又元史仁宗紀延祐二年四月諭晉王以先朝所賜惠州銀礦洞歸還有司七月復賜晉王惠州銀礦洞又元史史天祥傳復利州殺劉祿于銀冶又元一統志興中州有鐵冶在州西北九十里蓼子峪利州有鐵冶在州東南二百八十里牛口峪惠州有鐡冶二所一在州西北二百三十里寺子峪名灤陽冶一在州東北六十里松棚峪名寶津冶皆辦官課龍山縣有瑪瑙場在縣東北五十里興中州有瑪瑙場在州東八十里鳳凰崖下皆每嵗貢又明一統志載三衛産瑪瑙諸所産處並在承德府屬即舊熱河七廳境內也今則禾麥盈疇鋪棻錯繡各場冶俱久經封閉其鉛礦暫行開採亦即停止聖朝首重農事不貴異物即此可見故因輯諸書而附識於此器服之屬鹿角器每嵗行圍獲鹿甚多截其角材中諸器御製詩詠鹿角筆架戊寅茸長八義老蛻然去不留無從别麇麈又幾閲春秋形欲成芝朵堅將變石頭雅宜供架筆毛頴本同遊命製鹿角椅並題以句壬午獵獲八義角良工製椅能由來無棄物可以備時乘詎是仙都遺去聲從思家法承盛京貯有角椅太宗時鹿角椅山莊有也聖祖時鹿今命製此亦肯構之意夔夔戒倚側棣棣慎居興休􅑠形猶曲豐尖柔足徴底須七寶飾朴素審堪稱沈周秋風話歸圖即用其韻抑為小雅抑豳風老筆傳神意鑿空握手河梁似聞語羡君策蹇竟歸東恭詠皇祖鹿角椅癸未大獮年年幸塞沙詰戎深意讋荒遐虞人惟許獻三殺匠氏因教製八義既朴而淳供憩息匪雕以飾戒竒邪昭哉白水欽前迹鄙矣青氊詡舊家詠鹿角椅乙酉雙撑玉戟牙一具綘河槎解􅑠氣猶煦吐茸期未賖考工漏匠氏朴製創朝家小坐輒成什亦無慙八義恭詠皇祖鹿角椅癸巳製椅猶看雙角全烏號命中想當年神威詎止羣藩讋聖構應謀萬載綿不敢坐兮惟敬仰既知朴矣願捐姸盛京惟逺興州近角盛京有甲戌太宗文皇帝所貽鹿椅癸亥兩詣瞻覯曽一再恭詠兹椅為常得觀仰皇祖所製每嵗駐山莊家法欽豕益增景慕家法欽承一例然樺梌木器以樺梌木及雜樹根為之製作工巧全以雜色參錯為文如縟繡然自几案至盤匜無所不有熱河市中多鬻之聖祖御製詩用梌木杯器四集素輕珠玉器専製及時杯錯節分花影盤根别利才茂林成木癭深斧染莓苔淡泊明吾志天然見體裁皮茵褥以馬皮為之其毛色淺深相間文茵方褥俱燦然可觀熱河市中多鬻之山紬産建昌縣每年內地民携蠶種出塞養之收絲織紬其養蠶時以欂欏葉為飼故名曰欂欏繭宋曽公亮武經總要載塞外養蠶之法有與內地不同者曰收種春蠶用秋種貯以簟箔勿受風燥曰溫種冬至後以針線穿蠶種至暖室就溫勿傷蛹子曰拾蛾清明蛾出必以申酉戌三時分雌雄各置一筐曰摘對配蛾次日以指捻雌蛾腹謂之把蛾以紙羃筐貯其內置涼室中邉地春寒恐葉未發而先出子也曰斫芽插墩榖雨後出子研欂欏枝向陽嫩芽連枝葉三尺餘擇流水河邉無土沙灘不見水處掘寬二寸許深如之插芽勿使露水少提之令活曰坐墩日出後將蟻盆去蓋入墩中使與枝近曰上障四五日蠶一眠起帶葉剪取移置障上曰守場山中長欂欏處為蠶場恐蟻傷蠶置棚守護曰摘繭蠶出六十餘日成繭著葉處謂之蒂去之傷絲包絲包者各絡繭外亦謂之衫晉以織始有紋曰收繭擇春蠶為秋種置涼室曰選場蟻場宜凹下樹宜低小取其葉軟蠶場宜向陽塞外早寒非日暄不能成繭也尤忌髙山山髙則多霧霧則蠶病多風風厲每不成繭曰打鋪秋蠶出時天漸寒蠶上枝時縳置草鋪使其墮而復上曰抽繭繭成以手撚線織為紬名曰山繭按塞外器用之屬見于前史者後漢書烏桓傳謂男子能作弓矢鞍勒煆金鐡為兵器金史地里志載大定府産螺杯茱萸梳玳瑁鞍元一統志利州有細瓷窰一所在州西南棠葉務有粗瓷窰一所在州東南感化莊興中州有白瓷窰一所在州北二十里笠子堝松州西二十里有瓷窰西北有甎瓦窰又興中州建州土産紙是也塞外服用之屬見用于前史者後漢書烏桓傳謂婦人能刺葦作文繡織氀毼北史契丹傳以青􅨷為上服元一統志大寧路龍山縣利州興中州建州皆土産絲紬和衆龍山二縣利惠二州皆土産布是也諸産並在熱河府州縣境內今民間日用所需或商賈貿遷或土人造作非有特著之産故不復専列至宋曽公亮武經總要謂幣帛多書白川州稅戶所輸金史載北京嵗貢縀匹今則嵗課亦但輸額賦而已欽定熱河志卷九十六
