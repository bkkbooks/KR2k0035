  text: 欽定四庫全書欽定熱河志卷一百十五
  hash: sha256:e2e1cbdc0bae3f988285942479a83c930480bd0d8d08ca60353a01146f604108
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0035_WYG_114-1a, image: WYG0496/WYG0496-0744a.png}
body:
  text: 藝文九本朝詩恭和御製種槐元韻申甫皇仁周庶物草木念榮悴拱把帶雨移規此數弓地植根課必深布葉㸔漸概古槐自疎冷新緑宛深翠龍爪羃秋隂目展春季欣欣方向榮已作十圍計詎同樗櫟材拳曲祇滋愧恭和御製出古北口元韻嵩貴長城趨古北設險自何人蘇季始謀趙賈坐終過秦彎弓徒有戒飲馬笑餘辛今日重闗闢占風萬國親省方勤聖主扈蹕樂籓臣望幸頻沾澤觀光利用賓選徒循令典法祖舉時巡嵗嵗懷柔意長敷紫塞春前題申甫雙崖雄北塞戍守憶前人設險空占易防邉祇效秦閉闗情隔絶築怨事酸辛聖代金甌固山莊玉趾親往來如戸闥中外悉王臣從獵馳千騎每年木蘭行圍例用䝉古兵一千二百人呼嵩列九賓恭逢公皆萬夀聖節䝉古王隨班行慶賀禮邉氓安力作父老望時巡廢堞連雲處巖花嵗嵗春恭和御製味甘書屋元韻申甫結屋傍幽巖泉源在其左幾餘偶靜憩宛如天上坐開牕雲忽生拂檻風自妥芸編霏古香松濤試活火餘味喜曲包微甘殊諫果陸羽曾著經陶潛還讀我書味與茶甘悠然相印可恭和御製趣亭元韻錢載聚書藏書得佳趣趣以名亭閤邉峙其西則山東則臺碧樹扶疎石㟪􅕲峯隂轉壑壑隨澗澗響落池池益泚收將大段天一范兼取小齋京口米亭中書趣勝琴趣有弦何必無弦矣聖心妙趣與人同讀書之世胥樂此恭和御製曉行元韻申甫求衣昧旦語寜誣聖主勤民益信夫夜雨灑林朝恰止逺烟當路近㸔無瞻雲衆已駢肩集除道人忘兩足塗似聴茅檐喜相告三分額賦又蠲吾恭和御製出古北口元韻申甫我朝一統連中外耕鑿邉氓樂利貽但以雄闗存舊蹟每㸔廢堞動遐思即論勝國何能守說到秦人更可嗤畢究成城須衆志皇圖鞏固在于斯恭和御製口外元韻申甫出闗風景最清佳畫嶂分明處處皆樹色潤含前夕雨草痕青接去年荄河通一水煩頻渡雲放千峯未盡埋多少山田列方罫玉鞭遙指暢吟懷恭和御製雨中至喀喇河屯元韻申甫如絲密密灑龍旌已近仙莊但一程地喜有山兼有水到來宜雨亦宜晴烏城舊址平崗遶别墅新題健筆横詰旦仁風披曉霧泥乾祗候屬車行恭和御製至避暑山莊即事得句元韻梁國治每到雲莊咏磵阿堯年因憶翠華過深山無暑今猶昔一雨成秋信不訛夾路松聲清引鶴凌雲石徑黛旋螺花宫咫尺真如境香氣三天聴貝多恭和御製經畬書屋元韻梁國治積書連屋倚嶙峋菑穫雖勞亦勝因共仰經畬輝寳額難從藜閣逮文津雨耕好擬三餘賞風咏先慚一字貧聖徳裁成均教養力田還憫未逢人恭和御製遊獅子園元韻申甫獅峯綿亘衆峯遙法駕遄臨戒詰朝萬壑松濤烟靄動一池荷氣水痕消只今翠葆停芳榭依舊青山對綺寮毓徳沖齡懷徃事書聲隠隠徹凉宵恭和御製遊文園獅子林元韻劉墉入園風景各方隅物色分排畫幀鋪帶以雲烟離可合涵來秋月一能殊蓬山未到知應似倪叟如逢嘆不圖佳勝曾聞兼曠奥試㸔踈豁又迴迂恭和御製文園六咏元韻劉墉房結茅吳下景歸黄畫展倪迂却鎮常以瓦為之雖小異依然簡逺稱山房山山中巖壑更為山山骨清如玉鍊顏疊石天機原似畫也應盤礴出安閒水印月清凉浴日紅總涵性海一漚中誰言塞北江南異轉物能令異者同松千齡擬待風霜古五粒先資雨露新品物繁昌知帝力試從黛色騐松身魚達士知魚在濠上放言觀化翼垂雲聖心育物非齊物觸境殷懷皡皥羣蟬含簧如管趂風齊響遏行雲繞檻低林靜詎同喧沼閙日長聴徹景移圭前題申甫房瓦屋鱗鱗晩照黄茅檐竹戸宛如常塞垣亦有江南景縮地寜須費長房山黛色濃堆面面山更煩巧匠琢山顏不知疊石髙多少已有白雲相伴閒水浦面餘霞縷縷紅山光盡入水光中吳門一片春波緑聖澤深涵逺近同松雪中未試蒼麟古雨後先抽翠鬛新他日文園增氣象髙松只是稚松身魚吹波唼唼還成綺嘘氣紛紛欲作雲在藻依蒲魚自樂勝他鷗鷺一羣羣蟬髙樹鳴蟬逺緑齊殘聲曳過别枝低詩情愛向園中領聴到林梢月半圭恭和御製題秀起堂元韻申甫仙莊雲物競呈姿睿賞欣知此更竒四面峯巒開秀起九天珠玉仰文思香生蕙砌風過處凉入松牕雨歇時嵐翠滿簾濃著色畫圖如對馬和之前題百齡西峪烟林擁翠姿書堂突兀更呈竒牕中逺岫含晴態檻外仙葩發藻思境到最髙全滌暑雨能延爽恰知時天然福地成圖畫不用丹青顧愷之恭和御製懷柔道中作元韻和珅季夏欣陪輦當春想𫝊郵今春奉使滇南不獲扈從京華離未逺井里望盈眸禾黍連阡茂恩波到處浮祝釐佛且至不僅逺人柔前題董誥雨後移仙仗松牌曉記郵風光凉動𬒮山翠澹盈眸膏浥鱗原潤雲依雉堞浮塵清欣灑道信已百神柔前題杜玉林蹕路平於掌迎鑾接逺郵晨光開一色霽景豁雙眸野濶青疇潤山圍暖黛浮飄飄瞻彩仗栁外曉風柔前題國柱夜雨朝暉靜塵清蹕路郵曉風凉入袂斜月淡迎眸峪口炊烟出城隅穟影浮檀州今近邑名尚襲懷柔恭和御製出古北口元韻和珅幾年修築幾年隤不見長城見嶺嵬奉使䝉恬工力拙過秦賈傅論言該當時北客難遊牧今日南人自往來外薄垓埏聲教訖兩階干羽舞全恢前題董誥厯厯雄陴半峙隤蠮螉左折入雲嵬會歸有極經環合中外為家徳化該烟樹迴連青嶂䕶香盤爭迓翠華來鑾迴更見祥輪擁擎跪闗民慶益恢前題阿肅河衝一任岸沙隤設險何須恃磊嵬先是潮河入邉之處屢築屢圯險遂詔以中外一家無煩設闕之以受河流紫塞東西皆内屬黄圖中外久全該雲車仙仗凌霄度雪磧名王就日來親見諸藩迎道左方知聖主徳恢恢前題國柱巖城雉堞未全隤嵽嵲連雲入望嵬險詎足慿前事鑿徳原為本聖謨該人烟輻輳千屯集山勢奔趨萬馬來邁古輿圖光史牒如天道範仰恢恢恭和御製至避暑山莊駐蹕即事一律元韻和珅迎鑾紫氣自來東更見仙莊瑞靄籠錦繡旌旂千嶂裏簫韶樂舞兩階同後先奔走㸔藩翰左右趨蹌識辟公自愧才疎無寸補賡颺祝嘏切愚衷前題梁國治山莊佳氣逺升東麗正門開曙色籠無暑清涼長畫靜如天福夀大年同來瞻佛宇三千界好聴松濤十八公嵗奉宸遊賡樂愷毋咨暘雨繫淵衷恭和御製永佑寺瞻禮元韻和珅廟貌莊嚴尊永佑年年瞻拜聖躬來緬懷功徳惟髙矣敬誦宸章實大哉不匱孝同錫𩔖永至誠禮並配天陪聖躬至誠展謁與郊壇誠敬相同逺過虞舜七旬慕詩似周南樂不哀前題阿肅肅穆龍顏金地迴逶迤鳳輦翠華來孝慈克繼無憂者啟佑常昭丕顯哉縹緲香雲諸相具繽紛花雨萬靈陪琅璫風鐸聞天樂消盡前朝畫角哀前題國柱珠宫璀璨依丹地展謁年年御蹕來塔湧九天真壯矣疆恢萬里益欽哉會逢迦葉聴經至合有仙靈奉輦陪山水清音結林籟竹豪難擬况絲哀恭和御製學古堂口號元韻和珅潤屋兼能徳潤身存神過化見修純如斯聖學猶師古惟日孳孳是至人前題董誥君師道備本諸身孔思周情典學純已仰從心不踰矩依然日就月將人恭和御製溥仁寺元韻和珅佛教西方聖教東吾皇允執位方中錫名顯寓能仁意兩字心𫝊守一通治世有功同度世不空妙諦是真空皈依共祝無疆夀慶洽人天極樂衷前題阿肅天西象教偏天東妙藴昭然御榜中周溥由於無我相能仁是曰大神通禪燈慧日輝諸界定水慈雲羃逺空佛願衆生儒利達從茲聖製折其衷前題嵩貴曉日初升翠岫東莊嚴紺宇法雲中風清貝葉參三昧露净曇花印六通博愛為仁功自溥真如有諦法非空矞皇天藻輝千禩駐蹕栴檀企帝衷恭和御製札什倫布廟落成紀事元韻和珅四海須歸帝載彌感來佛子祝皇釐七旬夀洽諸天慶萬里誠昭百度熙殿聳寳光懸法象山横瑞靄列祥枝初秋便見伽藍體海會縁因妙喜為前題周煌華祝嵩呼六合彌人天今此祝鴻釐栴檀似海羣靈集日月如燈聖學熙曇缽花迎諸佛面貝林秋换萬年枝箕疇五福先徴夀建極由知帝自為恭和御製布達拉廟瞻禮用去嵗韻元韻嵇璜觀稼因之臨梵界風旛動處集鴻賓共欣法侣都迎佛那識宸衷却為人初地香隨仙仗聚諸天花映嶺雲彬神僧逺越流沙至拈示禪宗得句頻前題董誥禪宫演教規三竺王會陳圖達九賓金粟香中開慶節青蓮華上擁天人風𫝊貝葉三乘闡霞映旛幢五色彬多稼如雲呈輦路農歌衢祝聴頻頻前題國柱金地莊嚴成法界梵天歡喜集鴻賓分班瞻禮來殊域重譯梯航識聖人音振海潮凝唄誦花敷法雨現璘彬兩碑宗㫖元歸一福徳宗乘著句頻恭和御製閲稼元韻嵇璜最喜興桓八月中萬塍佳色愜皇衷即㸔秋好禾都茂不異春深麥早芃下澤雨多還有備髙田風𦂳慶常豐欣於所遇揮天藻已覺真香到桂叢前題梁國治髙下平疇極望中山莊穡事愜宸衷晩黄隴漾雲紋活曉碧塍涵露氣芃節届仲秋逢省斂農從十雨恰占豐腰䥥便聴康年頌簫鼔喧闐里社叢恭和御製八月十三日於避暑山莊行七旬慶典即事成什元韻嵇璜七旬慶典萬年仍百代前王總跨陵原福都縁天徳致淵衷還鑒往朝懲殊方共祝中天聖我佛能來異域僧夀㝢祥開王會集山莊盛事繪難勝前題梁國治寳祚延洪帝眷仍仙言十萬遍迦陵矩存自有心𫝊絜堂構如聞祖訓懲山莊新構㫖戒得堂恭讀精一御製記闡揚要仰見心𫝊人擬慶霄賡復旦佛云曼夀過阿僧古稀福徳光前載作頌南山愧未勝欽定熱河志卷一百十五
