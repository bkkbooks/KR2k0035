body:
  text: 外記三隋契丹按北魏以後突厥始強威服塞外諸國齊周皆傾府藏以給之隨初營州髙寶寧為患沙鉢略可汗與之合軍攻陷臨榆鎮隋書奚傳稱奚臣於突厥契丹傳稱契丹為突厥所逼又契丹别部皆突厥來降其託紇臣水契丹十部突厥沙鉢略遣吐屯潘垤統之則今承德府全境雖分屬奚與契丹實為突厥之屬國然沙鉢略逺居西北自在今境之外亦如檀石槐軻比能之遙制無容列入兹但録契丹部長於篇奚於隋代無名氏可考故亦缺之莫賀弗隋書髙祖紀開皇四年五月癸酉契丹主莫賀弗遣使請降九月內附契丹傳當後魏時為髙麗所侵部落萬餘口求內附止於白貔河其後為突厥所逼又以萬家寄於髙麗開皇四年率諸莫賀弗來謁五年悉其衆欵塞髙祖納之聽居其故地按白貔河北史作白狼河隋書字誤本紀稱契丹主莫賀弗請降列傳作率諸莫賀弗來謁而其先在後魏時內附者已有莫賀弗勿于疑所謂莫賀弗者如靺鞨渠帥稱大莫弗庫莫奚渠渠帥稱俟斤之類乃契丹酋長之總稱也至庫莫奚傳第二部亦曰莫賀弗其部落各别蓋名偶同耳多彌隋書髙祖紀開皇五年四月甲午契丹主多彌遣使貢方物按隋開皇四年莫賀弗內附而五年又有多彌遣貢之事其事之同異及多彌為何部酋長俱無可考出伏隋書契丹傳契丹别部出伏等背髙麗率衆內附髙祖納之唐奚按烏桓鮮卑迭盛於漢魏晉間烏桓微弱已無部落可考鮮卑之後為奚契丹又盛於唐仍錯處今承德府全境內奚後分東西二部西奚居媯州北山在今境外其酋帥見於五代史者不備載載其牙帳在吐護真河即今老河源出平泉州經赤峰建昌朝陽諸縣境者蘇支舊唐書奚傳貞觀二十二年酋長可度者率其所部內屬以可度者為右領軍兼饒樂都督封樓煩縣公賜姓李氏顯慶初又授右監門大將軍匹帝唐書奚傳顯慶間可度者死奚遂叛五年以定襄都督阿史得樞賔左武侯將軍延陀梯真居延州都督李含珠為冷陘道行軍總管明年詔尚書右丞崔餘慶持節總護定襄等三都督討之奚懼乞降斬其王匹帝李大輔舊唐書奚傳景雲元年其首領李大輔遣使貢方物睿宗嘉之宴賜甚厚延和元年左羽林將軍檢校幽州大都督孫儉率兵十二萬以襲其部落師次冷硎前軍右驍衛將軍李楷洛等與大輔會戰我師敗績儉懼不敢進救遣使矯報大輔云我奉勑來此招諭大輔曰將軍可還無相驚擾儉軍漸失部伍大輔乃率衆逼之由是大敗開元三年大輔遣其大臣粵蘇梅落來請降詔復立其地為饒樂州封大輔為饒樂郡王仍拜左金吾員外大將軍饒樂州都督五年大輔與契丹首領松漠郡王李實貴舊作失活見遼史今改正咸請於栁城依舊置營州都督府上從之其年大輔入朝詔封從外甥女辛氏為固安公主以妻之賜物一千五百匹遣右領軍將軍李濟持節送還藩按大輔新唐書作大酺舊唐書本紀開元五年亦作大酺孫儉新唐書作孫佺舊唐書孫處約傳亦作佺其作輔作儉者蓋字之訛開元三年新唐書作二年粵蘇梅落作粵蘇悔落五年尚主作二年許尚主明年入朝成昏考新舊唐書開元二年七月薛納為奚契丹所敗則是年無乞降事可知新唐書本紀開元四年八月奚契丹降則前兩年無許昏入朝事可知舊唐書本紀開元五年三月丁巳以辛景初女封為固安縣主妻於奚首領饒樂王大輔蓋乞降在三年入朝在四年八月尚主在五年三月丁巳舊唐書于此一事最為詳核新唐書契丹傳開元二年實貴來歸後二年與奚長李大酺皆來此即開元四年八月書奚契丹降時事也許尚公主當在此時魯蘇舊唐書奚傳開元八年大輔率兵救契丹戰死其弟魯蘇嗣立十年入朝詔令襲其兄饒樂郡王右金吾員外大將軍兼保塞軍經略大使賜物一千段仍以固安公主為妻而公主與嫡母未和遞相論告詔令離昏復以成安公主之女韋氏為東光公主以妻之十四年又改封魯蘇為奉誠王授右羽林軍員外將軍十八年奚衆為契丹衙官可罕于所脅後叛降突厥魯蘇不能制走投渝關公主奔歸平盧軍李詩瑣髙舊唐書奚傳開元二十年信安王禕奉詔討叛奚奚酋長李詩瑣髙等以其部落五千帳來降詔封李詩為歸義王兼特進右羽林軍大將軍同正仍充歸義州都督賜物十萬匹移其部落於幽州界安置李延寵唐書奚傳李詩死子延寵嗣又叛為幽州張守圭所困延寵降復拜饒樂都督懷信王以宗室出女楊為宜芳公主妻之延寵殺公主復叛怒皆舊唐書王忠嗣傳天寶元載與奚怒皆戰於桑乾河三敗之蘇庫舊作娑固見遼史今改正舊唐書奚傳天寶五載封其王蘇庫為昭信王仍授饒樂都督按唐有兩李蘇庫開元三年契丹首領李實貴率種落內附實貴死弟蘇庫代領其衆又天寶五載封奚國王蘇庫為昭信王兩國俱經太宗賜姓當時皆稱李氏也李日越唐書奚傳安祿山節度范陽詭邉功數鏖鬭誅其君李日越按張九齡集有勑奚都督李歸國書二篇文苑英華蕃書門亦載之歸國作歸圖其人在元宗時而新舊唐皆不載附録於此啜剌舊唐書德宗紀貞元十一年夏四月丙寅幽州劉濟奏大破奚王啜剌等六萬餘衆君梅落索氏沒辱孤唐書奚傳元和元年君梅落身入朝拜檢校司空歸誠郡王以部酋索氏為左威衛將軍檀薊州遊奕兵馬使沒辱孤平州遊奕兵馬使皆賜姓李氏按舊唐書索氏作索低無沒辱孤名檀薊州作檀薊兩州義較明茹羯唐書奚傳太和四年復盜邉盧龍李載義破之執大將二百餘人縳其帥茹羯來獻文宗賜冠帶授右驍衛將軍按舊唐書太宗紀太和四年九月以投來奚王茹羯為右驍衛將軍正同據此則茹羯是投來之王非縳獻之帥也未詳孰是匿舍朗唐書奚傳後五年太守領匿舍朗來朝太和九年也按舊唐書回紇列傳大中元年遏捻可汗有衆五千以上其食用牛羊皆取給於奚王碩舍朗新唐書回紇傳同大中初距太和末才十二年碩與匿聲相近蓋一人又李商隱為營陽公賀幽州破奚冦表稱舊奚王匿即其事亦在大中初即字當是朗字之訛脫去舍字耳突董蘇薩葛唐書奚傳咸通九年其王突董蘇使大都督薩葛入朝契丹按唐地理志營州西北一百八十里松陘嶺其西奚其東契丹故地跨今承德府境內僅十之三四然舊唐書安祿山傳渡吐護真河三百里就潢水南契丹衙與之戰則其王牙帳固在今境內也故酋帥姓名悉録於篇咄羅舊唐書契丹傳武德六年其君長咄羅遣使貢名馬豐貂摩會舊唐書契丹傳貞觀二年其君摩會率其部落來降唐書契丹傳明年摩會復入朝賜鼓纛貞觀三年窟哥祐莫離舊唐書契丹傳太宗伐髙麗至營州會其君長及老人等賜物各有差授其蕃長窟哥為左武衛將軍二十二年窟哥等部咸請內屬乃置松漠都督府以窟哥為左領軍將軍兼松漠都督府無極縣男賜姓李氏顯慶初又拜窟哥左監門大將軍其曽孫祐莫離則天時歷左衛將軍兼檢校彈汗州刺史歸順郡王按祐莫離新唐書作枯莫離傳寫之訛辱紇主曲據唐書契丹傳大酋辱紇主曲據率衆歸即其部為元州拜曲據刺史𨽻營州都督府未幾窟哥舉部內屬乃置松漠都督府以逹稽部為峭落州紇便部為彈汗州獨活部為無逢州芬問部為羽陵州突便部為日蓮州芮部部為徒河州墜斤部為萬丹州伏部為匹黎赤山二州俱𨽻松漠府即以辱紇主為之刺史按諸州乃契丹八部全境以領于二月故備録之其地則不盡在今境內也孫敖曹舊唐書契丹傳契丹有别部酋帥孫敖曹初仕隋為金紫光祿大夫武德四年與靺鞨酋長突地稽俱遣使內附詔令於營州城傍安置授雲麾將軍行遼州總管阿卜固唐書契丹傳窟哥死與奚連叛行軍總管阿史德樞賔等執松漠都督阿卜固獻東都按舊唐書薛仁貴傳與辛文陵破契丹於黑山擒契丹王阿卜固而新書言阿史德樞賔等以大帥主名也孫萬榮李盡忠唐書契丹傳窟哥孫曰盡忠為武衛大將軍松漠都督而敖曹有孫曰萬榮為歸誠刺史於是營州都督趙文翽驕奢數侵侮其下盡忠等皆怨望即共舉兵殺文翽盜營州反盡忠自號無上可汗以萬榮為將縱兵四掠所向輒下不重浹衆數萬攻崇州執討擊副使許欽寂武后怒詔鷹揚將軍曹仁師金吾大將軍張元遇右武衛大將軍李多祚司農少卿麻仁節等二十八將擊之更號萬榮曰萬斬盡忠曰滅諸將戰西峽石麞谷王師敗績元遇仁節皆為所擒進攻平州不克后乃以右武衛將軍建安王武攸宜為清邊道大總管擊契丹萬榮夜襲檀州清道副總管擊張九節募死士數百簿戰萬榮敗而走山俄而盡忠死突厥默啜襲破其部萬榮敗散兵復振使别將駱務整何阿小入冀州殺刺史陸寶積掠數千人武后聞盡忠死更詔夏官尚書王孝傑羽衛將軍蘇宏暉率十七萬討契丹戰東峽師敗孝傑死之萬榮席已勝遂屠幽州攸宜遣將討捕不能克乃命右金吾大將軍河內郡王武懿宗為神兵道大總管右肅政臺御史大夫婁師德為清邉大總管右武衛大將軍沙吒忠義為清邉道前軍總管兵凡二十萬擊賊萬榮鼓而南殘瀛州屬縣神兵道總管楊元基率奚軍掩其尾契丹大敗獲何阿小降别將李楷固駱務整收械仗如積萬榮委軍走殘隊復合與奚搏奚四面攻乃大潰萬榮左馳張九節為三伏以伺之萬榮窮與家奴輕騎走潞河東憊甚卧林下奴斬其首九節傳之東都餘衆潰契丹不能立遂附突厥按舊唐書則天皇后紀與此略同其契丹傳趙文翽作趙翽脫文字攻崇州作進逼檀州西峽黃石麞谷作西峽石谷王孝傑等所領十七萬武懿宗等所領二十萬作三十萬至盡忠死在王孝傑領兵前舊書則云在武懿宗領兵後楊元基率奚軍掩其尾舊書則云奚及突厥之衆掩擊其後紀載互殊皆當以新書為正李皆固駱務整舊唐書狄仁傑傳六月左玉鈐衛大將軍李楷固右武衛將軍駱務整討契丹餘衆擒之獻俘於含樞殿則天大悅特賜楷固姓武氏楷固務整並契丹李盡忠别師也初盡忠之作亂楷固等屢率兵以陷官軍後兵敗來降有司斷以極法仁傑議以為楷固等並有驍將之才若恕其死必能感恩效節又奏請授其官爵委以專征制並從之及楷固等凱旋則天召仁傑預宴因舉觴親勸歸賞於仁傑授楷固左玉鈐衛大將軍賜爵燕國公實貴舊作失活今改正舊唐書契丹傳開元三年其首領李實貴以默啜政衰率種落內附實貴即盡忠之從父弟也於是復置松漠都督府封實貴為松漠郡王拜左金吾衛大將軍兼松漠都督明年實貴入朝封宗室外甥生女楊氏為永樂公主以妻之遼史世表實貴元宗賜丹書鐡劵開元四年與奚長李大輔偕來六年卒蘇庫舊作娑固今改正舊唐書契丹傳實貴死實貴從父弟蘇庫代統其衆遣使册立仍令襲其兄官爵蘇庫大臣格圖肯舊作可突于今改正驍勇頗得衆心蘇庫謀欲除之格圖肯反攻蘇庫蘇庫奔營州都督許欽淡令薛泰率驍勇五百人又徴奚王李大輔者及蘇庫合衆以討格圖肯官軍不利蘇庫大輔臨庫皆為格圖肯所殺遼史世表蘇庫實貴之弟帝以蘇庫襲爵開元七年十一月蘇庫與公主來朝裕雲舊作鬱于今改正舊唐書契丹傳裕雲病死弟托雲代統其衆襲兄官爵復以燕郡公主為妻托雲與格圖肯復相猜沮開元十三年携公主來奔便不敢還改封遼陽郡王因留宿衛遼史世表托雲裕雲之弟襲官爵實古舊作卲固今改正舊唐書契丹傳開元十三年格圖肯立李盡忠弟實古為主其冬車駕東巡實古詣行在所因從至嶽下拜左羽林軍員外大將軍靜析軍經略大使改封廣化郡王又封皇從外甥女陳氏為東華公主以妻之實古還蕃十八年格圖肯殺實古遼史世表實古托雲之弟國人共立之開元十三年以陳氏為東光公主下嫁十八年為格圖肯所弒以其衆降突厥東光公主走平盧按唐書東華公主遼史作東光未知孰是庫烈舊作屈烈又作屈列今改正格圖肯舊作可突于今改正唐書契丹傳格圖肯來不為宰相李元紘所禮鞅鞅去張説曰彼獸心者惟利是尚且方持國下所附也不假以禮不來矣後三年格圖肯殺實古立庫烈為主脅奚衆共突厥遼史世表庫烈不知其世系格圖肯立之開元二十二年六月幽州節度使張守圭大破格圖肯十二月又破之斬庫烈及格圖肯等傳首東都餘衆散走山谷按庫烈張九齡集作據埒聲轉成訛故紀載互殊耳李克珍舊作李過折今改正拉恰舊作剌乾今改正唐書契丹傳衙官李克珍與格圖肯內不平守圭使客王悔隂邀以兵圍格圖肯克珍夜斬格圖肯庫烈支黨數十人自歸守圭使克珍統其部拜北平郡王為松漠都督遼史世表克珍本契丹部長為松漠府衙官斬格圖肯及庫烈歸唐幽州節度使張守圭立之封北平郡王是年格圖肯餘黨聶埒弒克珍屠其家一子拉恰走安東拜左驍衛將軍自此契丹中衰逹呼哩舊作大賀今改正氏附庸於奚王以通於唐聶埒舊作泥禮今改正遼史世表聶埒耶律儼遼史書為涅里陳大任書為雅里蓋遼太祖之始祖也按張九齡集作涅禮開元中為松漠都督右金吾衛大將軍拒破突厥涅禮涅里雅里皆聶埒之訛也李懷秀霞魯舊作楷洛今改正努爾蘇舊作耨里思今改正唐書契丹傳天寶四年契丹大酋李懷秀降拜松漠都督封崇順王以宗室出女獨孤為靜樂公主妻之是嵗殺公主叛去范陽節度使安祿山討破之更封其酋霞魯為恭仁王代松漠都督遼史世表逹呼哩氏微别部長克珍代之克珍尋滅德哷勒舊作迭剌今改正部長聶哷立逹年蘇爾舊作迪輦組里今改正為蘇爾威汗舊作阻午可汗今改正更號約尼舊作遙輦今改正氏唐賜國姓曰李懷秀既而懷秀叛唐更封霞魯為王而聶哷之後曰努爾蘇者左右懷秀霞魯至於齊蘇舊作屈戍今改正幾百年國勢復振悔落拽何舊唐書契丹傳貞元十年遣使來朝大首領悔落拽何以下各授官放還熱蘇舊唐書契丹傳貞元十一年大首領熱蘇等二十五人來朝齊蘇舊作屈戍今改正唐書契丹傳會昌二年回鶻破契丹酋齊蘇始復內附拜雲麾將軍守右武衛將軍遼史世表契丹王齊蘇是為伊蘭舊作耶瀾今改正可汗張仲武奏契丹舊用回鶻印乞賜聖造詔以奉國契丹為文錫勒舊作習爾今改正遼史世表契丹王錫勒是為巴爾汗舊作巴剌可汗今改正欽德唐書契丹傳光啓時方天下盜興北疆多故乃鈔奚室韋小小部種皆役服之欽德晚節政不競其八部大人法常三嵗代時耶律安巴堅舊作阿保機今改正建鼓旗為一部不肯代自號為王而有國逹呼哩氏遂亡五代史四夷附録契丹後分為八部部之長號大人而常推一大人建旗鼓以統八部至其嵗久或其國有災疾而畜牧衰則八部聚議以旗鼓立其次而代之某部大人約尼次立時劉仁恭據有幽州數出兵摘星嶺攻之每嵗秋霜落則燒其野草契丹馬多飢死即以良馬賂仁恭求市牧地請聽盟約甚謹八部以為約尼不任事選於其衆以安巴堅代之遼史世表契丹王欽德錫勒之族也是為哈陶津汗舊作痕德堇可汗今改正按與劉仁恭盟者唐書以為欽德五代史以為約尼蓋唐之契丹王自窟哥至實古為逹呼哩氏自李懷秀至欽德為約尼氏遼太祖安巴堅則世里氏也遼史太祖本紀云哈陶津汗殂羣臣奉遺命請立太祖其世表云努爾蘇之孫曰安巴堅功業勃興號世里氏是為遼太祖於是世里氏與逹呼哩約尼號三耶律然則唐書稱安巴堅自號為王而有國逹呼哩氏遂亡殆未詳考逹呼哩及約尼之世次歟又按遼史稱潢河以西土河以北皆奇善汗舊作奇首可汗今改正故壤蓋契丹始祖也遼滅奚後奚王支裔尚存蘇轍詩注記奚君宅在中京南遼史所載奚部族及奚王實默等名猶可考然非自為一國故不録欽定熱河志卷一百五
