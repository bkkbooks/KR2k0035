  text: 欽定四庫全書欽定熱河志卷四十九
  hash: sha256:829f76a2169046ed974bd1b0f7401e3a7019a51966624e40217368975a01f5d2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0035_WYG_049-1a, image: WYG0495/WYG0495-0817a.png}
body:
  text: 疆域一熱河全境舊設五廳中曰熱河廳西南曰喀喇河屯廳西北曰四旗廳東曰八溝廳又東曰塔子溝廳後析八溝廳北境為烏蘭哈逹廳析塔子溝廳東境為三座塔廳是為七廳其所轄則四旗廳專轄左翼察哈爾八溝塔子溝烏蘭哈逹三座塔諸廳兼轄內札薩克蒙古諸部各有分地聖朝休飬生息百數十餘年人民殷乂物産充盈我皇上每嵗秋狩經臨被潤澤而大豐美閭閻櫛比原隰沃衍學校既興郡邑斯建升熱河廳為承德府餘廳改一州五縣屬焉府治本境如直𨽻州制塞上神臯蔚為都會兹敘疆域首承德府次灤平縣次豐寧縣以境內行宫為巡御時駐蹕所故列平泉州前如各省府屬以縣先州也次平泉州以境視他屬較廣也次赤峯以平泉析置也次建昌次朝陽以去府較遠也每屬村莊分系四境著其方位道里其以山水名者互見山水門繪全圖一府州縣圖七各系以説便省覽云志疆域第六承德府全圖説承德府屬全境當古北口潘家口喜峯口外舊熱河道所轄熱河七廳地東西相距一千二百六十里南北境廣袤不一以平泉州赤峰縣統計相距八百十里自府治東至奉天錦州府錦縣邉門界七百五十里西至口北道屬獨石口廳界四百五十里南至順天府遵化州界一百五十里北至圍場界二百十八里東南至永平府臨榆縣界五百八十里西南至順天府密雲縣北之古北口界一百九十里東北至錦州府廣寧縣邉門界一千十五里西北至口北道屬多倫諾爾廳界五百六十里統州一曰平泉縣五曰灤平曰豐寧曰赤峰曰建昌曰朝陽規其形勢則府境居中灤平豐寧拱其右平泉赤峰建昌朝陽環其左水源山脈來自西北由圍場入境東趨南下分道縈絡圖內略為標目以著其勝至古今同異援據考證則詳後建置沿革山水諸門云餘圖倣此承德府圖説承德府舊熱河廳境也東南東北俱界平泉州西南界灤平縣西北界豐寧縣南界遵化州及永平府遷安縣邉外地北界豐寧縣熱河上承固都爾呼河茅溝河賽音河三水合而南流入灤河熱河西境為避暑山莊東北境釣魚臺黃土坎北境張三營並建行宫伊遜河從府西北境圍場入南行入豐寧縣界又西南經灤平縣界入灤河東流入府西南境至山莊南北會熱河東南行又西會前白柴桞諸河東會老牛河東南流至門子哨入遷安縣界山則磬錘羅漢天橋五指之秀拱于東風雲廣仁之勝環于西僧冠峯青松鳯凰諸嶺屏于南獅子嶺大黑山枕于北流峙巨觀咸歸襟帶至于營哨星羅屯聚鱗次一州五縣左右拱翼披圖攬勝可得其概焉灤平縣圖説灤平縣舊喀喇河屯廳境也在承德府西南隅東界府北界豐寧縣南界古北口西界獨石口縣治倚東隅當灤河北土泉上腴拱翼山莊密於咫尺嵗當巡輅經行出古北口首蒞兹邑自縣治以及巴克什營兩間房常山峪王家營行宫相望山則雙塔山葦峪嶺常山峪青石梁駝峯星龕岩偏嶺十八盤嶺尤擅形勢水則灤河經流東北興州伊遜諸河入焉潮河白河環帶西南而湯河則會入白河餘若清水河及大柴峪馮家峪諸河發源縣之西南隅並著圖內承德府各屬惟府境與灤平不涉蒙古旗地而灤平西南接內地邉牆屬古北口獨石口泛兼轄為較殊他州縣云豐寧縣圖説豐寧縣舊四旗廳境也在承德府西北隅東界府南界灤平縣西界獨石口北界圍場察哈爾鑲白旗舊治土城子今為縣治當全境南於東西為中正藍旗治黃姑屯即波羅河屯居東鑲黃旗治大閣兒居西正白旗治郭家屯居北四旗壤界錯出山則鑲白旗屬之元寶山赫山白雲山五峯山正藍旗屬之筆架峯􅌑瓏峯雲光洞苔山平頂山鑲黃旗屬之塔山湯山白雲洞十八盤嶺正白旗屬之喇嘛山大對山半壁山為尤著水則灤河從縣境西北隅圍埸入鑲黃旗北境東南流經正白旗境小灤河北來會而南行入鑲白旗境南流入灤平縣界其東則伊瑪圖川從縣境東北隅圍場入鑲白旗北境南流入正白旗境又南流入灤平縣界又東則伊遜河從縣境東北隅承德府境南入鑲白旗北境南流入正白旗境會伊瑪圖川又南流入灤平縣界又東則固都爾呼河亦從縣境東北隅承德府境入廂白旗北境南流仍入承德府界西則舍利塔拉川從正白旗西境發源東南流入鑲白旗境又南入灤平縣界又西則潮河湯河於鑲黃旗境發源南流入灤平縣界至鑲藍旗境之中關什巴爾台波羅河屯鑲白旗境之濟爾哈朗圖阿穆呼朗圖並建行宫謹按次方位約會于圖平泉州圖説平泉州舊八溝廳境也西界承德府東界建昌縣東北界朝陽縣州北境為喀喇沁右翼地喀喇沁札薩克公旗地在右翼中州治瀑河之源環焉北則猴山東則獅山映碧山又東則鳯凰嶺東南則瑙璃山南則象山紅山又南則老姥山冷嶺其最著也老河發源于州北境喀喇沁屬之霍爾霍克山合諸水東北流納林崑都楞河東流會入焉又東會烏魯蘇台河東北流入朝陽縣界州北羣山合沓而和爾博勒津山崑都楞喀喇山哈喇蘇台山為尤著南境接永平府遷安縣邉外地又南與喜峯口接圖中不繪邉墻專以本境界址為限例也赤峯縣圖説赤峯縣舊烏蘭哈逹廳境也東界建昌縣南界平泉州西界圍埸北界烏珠穆秦克什克騰諸旗地縣全境為翁牛特右翼地其北境之翁牛特左翼旗巴林旗務均𨽻縣轄赤峯縣因紅山得名山在縣治東他如北境大松山南境遮蓋山其較著者水則金英河發源圍埸從西境入會錫爾哈錫伯卓索諸河東流出縣境入建昌縣界會於老河老河上流從平泉州東北隅入縣之東南隅折而東行入建昌縣界均析會於圖自縣治至翁牛特右翼駐處一百二十里北至左翼駐處一百八十里又北至巴林旗北境五百里府屬疆域迤北境斯其最遼濶矣建昌縣圖説建昌縣舊塔子溝廳境也在承德府東南隅東界朝陽縣南界臨榆遷安縣西界平泉州北界烏珠穆秦旗地縣屬南境為喀喇沁左翼地北境為敖漢旗地中界平泉州地南北若相望然縣治當喀喇沁左翼中偏北境大凌河三源並發會而東流入朝陽縣界青龍河當南境之西流入遷安縣搜濟河當南境之東流入寧遠縣山則月華瑞雲之屬最著而布古圖之為白狼山大凌河之為白狼水尤可援今以辨古即見以徴聞北境則老河會金英東流而玉瀑名泉仰邀天藻品題地靈增勝敖漢管兵務旗務王子介居老河南北岸其貝子則析居東境巴奚里河南不分左右翼統曰敖漢旗云朝陽縣圖説朝陽縣舊三座塔廳境也在承德府西北隅東接九關臺門界錦州府義州諸境西界平泉州南界建昌縣北界科爾沁縣屬東北境為土默特左翼地西北境為土默特右翼地又北境為奈曼旗地又東北境兼轄喀爾喀庫倫兩旗地水則大凌河經流其南金英河會入老河經流其北圖爾根河南北二水同名均入大凌河凡諸河發源之山暨槐柏雲蒙著名諸山咸列圖內而鳳凰山之為古龍山尤足與龍城狼水諸遺迹相發明並彚列之為建置沿革山水諸門考證之緣起焉欽定熱河志卷四十九
