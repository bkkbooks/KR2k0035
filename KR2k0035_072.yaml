body:
  text: 水四分𨽻各屬諸水承德府即熱河廳黑龍潭在府北一百八十里唐山營山之下有洞窈然水出洞中深不可測嵐氣迷漫若潛神物故曰黑龍潭豐寧縣即四旗廳和爾圖泉在縣屬察哈爾鑲白旗西北五十五里烏蘭池漢名紅鹽池在縣屬察哈爾鑲白旗西北七十五里魁蘇池在縣屬察哈爾鑲白旗西北一百三十里錫爾哈池在縣屬察哈爾鑲白旗北一百九十里呼倫穆索和池在縣屬察哈爾正藍旗東四十里錫勒圖池在縣屬察哈爾正藍旗東南十二里渾圖池在縣屬察哈爾正藍旗南三十五里哈希穆克池在縣屬察哈爾正藍旗西南十五里固爾班烏默赫池在縣屬察哈爾正藍旗東北二十里黑倫木圖池在縣屬察哈爾正藍旗東北一百里翁衮泊在縣屬察哈爾正白旗西北一百四十里喀喇烏蘇漢名黑水濼在縣屬察哈爾正白旗西北一百四十里伊克烏蘭泉漢名大紅泉在縣屬察哈爾鑲黃旗東南一百三十里衮布拉克在縣屬察哈爾鑲黃旗西南一百二十里噶順泉漢名苦水泉在縣屬察哈爾鑲黃旗西七十里巴噶烏蘭泉漢名小紅泉在縣屬察哈爾鑲黃旗東一百二十里達布遜泉漢名鹽泉在縣屬察哈爾鑲黃旗東北一百二十里平泉州即八溝廳冷水塘在州治東北三百里八郎官東山土人云浴之已疾龍潭溝在州治西北八十里旁有泉絶清冽溫泉在州治北一百四十里魁得蘇溝口北山上旁有浴池石井在州治北一百二十里二道營山洞中水極甘寒旁有小浮圖一莫詳年代蒙克泉在州屬喀喇沁右翼西七十里烘郭爾泉在州屬喀喇沁右翼南七十里溫冷特泉在州屬喀喇沁右翼南二百里努黑圖泉在州屬喀喇沁右翼北三十里赤峰縣即烏蘭哈達廳博多克圖泉在縣屬翁牛特右翼西九十五里阿魯布拉克在縣屬翁牛特右翼東北五十里布魯都池在縣屬翁牛特左翼西五里和爾博勒津泊漢名七金泊在縣屬翁牛特左翼西南八十里建昌縣即塔子溝廳搜濟河源出縣屬喀喇沁左翼東南七十里柏樹山之毛頭泊在縣治東南一百七十里南流徑都呼喀喇山至髙臺堡門東十里入錦州府寧逺州境為六州河元一統志六州河在利州東南八十里按元時利州在今建昌縣即塔子溝廳東境縣之最東南為元瑞州地方位相合又相傳名六股河蓋以摩該圖河呼魯伯楚特河額里葉河布勒圖河四道溝河五水及搜濟之經流為六也摩該圖河源出縣屬喀喇沁左翼南三十八里之摩該圖山在縣治東南境東南流徑沙帽山入搜濟河呼魯伯楚特河源出縣屬喀喇沁左翼南七十里之呼魯伯楚特山在縣治東南境東南流入搜濟河額里葉河源出縣屬喀喇沁左翼南八十里之額里葉嶺在縣治東南境南流寬至邦門之西入寧逺州境名黑水河又南入搜濟河布勒圗河漢名寬河源出縣屬喀喇沁左翼南一百十里之布勒圗喀喇山在縣治東南境東流會額里葉河按一統志原本謂明宣德三年大破三衛之兵於寬河即此今考明宣宗實録宣德三年九月喜峰口守將馳奏烏梁海舊作兀良哈今改正侵邊已入大寧經會州將及寬河宣宗決䇿親征乙卯出喜峰口昧爽至寬河則喜峰抵寬河甚近若今會灤河之豹河亦名寬河明初嘗置寬河守禦所者别在平泉州境與此寬河方位不同舊志蓋以同而誤也四道溝河源出縣屬喀喇沁左翼南一百十五里之四道溝在縣治東南境東流入搜濟河塔本泉漢名五泉源出縣屬喀喇沁左翼東南三十五里之塔本嶺東南流入搜濟河巴奚里河源出縣屬敖漢境之瑪尼罕初東北流折而東流又折而東南流入奈曼境三面環抱下流入於沙地齊老白池在縣屬敖漢東南二十五里下流入沙河都木達納林泉在縣屬敖漢南三十里流入齊老台河烏里達扎哈納林泉在縣屬敖漢東南五十里伊瑪圖泉在縣屬敖漢南一百二十里下流入沙池庫爾竒勒泉在縣屬敖漢西南一百五十五里尼楚琿泉在縣屬敖漢西南二百里輝圖扎哈納哩特泉在縣屬敖漢西五十里朝陽縣即三座塔廳小凌河蒙古名明安河源出縣屬土默特右翼西南二百二十里之明安喀喇山在縣治東南境有三泉滙為一河初名穆壘河東北流為明安河徑土默特右翼旗之南境至松嶺子門西五里入錦州府錦縣境為錦水亦名小靈河即古參栁水也漢書地理志栁城縣參水北入海遼史地理志興中府有小靈河元一統志小陵河在興中州南一百五十里源出玉泉井溢而成川流入錦州界按漢栁城縣在今寧逺州及錦縣之西境所謂北入海者蓋自縣北而南流入海地理志臨渝縣侯水北入渝酈道元曰蓋自北而南其書法與此同例與今小凌河方位正合遼之興中府元之興中州即今朝陽縣即三座塔廳地靈之與凌則傳寫字誤耳哈栁圖河漢名水獺河源出縣屬土默特右翼南五十里之蘇巴爾噶岡在縣治東境南流徑托羅克台山入小凌河卾欽河漢名女兒河源出縣屬土默特右翼南境在縣治東境東流至新開門北六十里入錦縣境又東南流入小凌河楊柳木河源出縣屬喀爾喀左翼南境東南流沿奈曼東北境至彰武臺門亦名楊柳木門入錦州府廣寧縣境下流入遼河庫崑河源出縣屬喀爾喀左翼東流入土默特左翼北境又東流入楊柳木河烏訥蘇台河源出縣屬土默特左翼北八十里東北流會庫崑河阿哈里河源出縣屬土默特左翼北七十里東流會烏訥蘇台河蘇爾哲河漢名大堤河源出縣屬土默特左翼北三十里東南流入廣寧縣東北境烏克爾齊老泉漢名卧牛石泉源出縣屬土默特左翼東二十五里西南流會蘇爾哲河蘇巴爾噶圖河漢名石塔河源出縣屬土默特右翼境東南流入土默特左翼西八十里南流入邊按此與喀喇沁左翼境之蘇巴爾噶圖河别額里葉河漢名鷂鷹河源出縣屬土默特左翼東北八十里東南流入邊按此與喀喇沁左翼境之額里葉河别湯圖河源出縣屬土默特左翼西二十里東南流入邊和爾博勒津泉漢名七金泉在縣屬土默特左翼東北七十里兆布拉克漢名百湖在縣屬土默特左翼東六十里烏哈爾溫泉在縣屬喀喇沁左翼北一百里查木哈克泉在縣屬奈曼東五十里察罕泉在縣屬奈曼東南六十里各屬有名無考諸水陽師水北齊書文宣帝紀北討契丹辛丑至白狼城壬寅經昌黎城癸卯至陽師水後魏置陽師鎮蓋以水得名按舊唐書謂廢陽師鎮在營州東北當在今朝陽縣即三座塔廳治東北境道人溪水水經注道人溪水南流厯密雲戍東此密雲戍興邊內之密雲縣别左合孟廣硎水亂流經密雲戍城南右會大榆河即鮑邱水孟廣硎水水經注孟廣硎水出硎下西南至密雲戍東西注道人溪水按大榆河發源即今豐寧縣即四旗廳境之潮河道人溪水孟廣硎水會注大榆河處當在今豐寧縣境白楊泉水水經注白楊泉水北發白楊溪右注大榆河龍芻溪水水經注龍芻溪水自坎注大榆河按今潮河南流經灤平縣即喀喇河屯廳白楊泉水龍芻溪水注大榆河處當在今灤平縣境石城川水水經注石城川水出西南石城山東流北屈徑白鹿山西即白狼山也東注白狼水方城川水水經注在大遼水條下方城川水發川西南山下東入白狼水按白狼水即今大凌河發源建昌縣即塔子溝廳南此石城川水方城川水俱當在建昌縣南境髙平川水水經注髙平川水出西北平川東南注白狼水自魯水注經注自魯水導西北逺山東南注白狼水按白狼水下流經今朝陽縣即三座塔廳此髙平川水自魯水東南注白狼水當今朝陽縣境隂涼河遼史天祚紀天慶七年自燕至隂涼河置軍營金史地理志大定縣松山縣皆有隂涼河元一統志隂涼河在松州南四十里發源興州界女嶺經由州境流與髙州塗河即土河今名老河合按此當在今赤峰縣即烏蘭哈達廳南境發源流經平泉州即八溝廳屬喀喇心右翼西北境東南流徑大寧故城之北琵琶川曾公亮武經總要奚本丐奴别種居隂涼州後徙居琵琶川在幽州東北數百里古北口之北遼史地理志利州阜俗縣唐末契丹漸熾役使奚人遷居琵琶川統和四年置縣按利州為今建昌縣即塔子溝廳南境地則此水當亦不逺陷河遼史地理志澤州太祖俘蔚州民立寨居之採煉陷河銀台按澤州為今平泉州即八溝廳地則陷河亦當在州境松山川遼史地理志松山州松山縣有松山川按金史地理志之松山縣元史地理志及元一統志之松州皆不載松山川以松山州方位考之當亦在赤峰縣即烏蘭哈達廳境神射泉遼史地理志興中府有神射泉按元一統志謂天授皇帝嘗獵獲一香麝因名其泉曰神射當在今朝陽縣即三座塔廳境麥務川遼史地理志興中府象雷縣以麥務川置按此當在今朝陽縣即三座塔廳霿􅟶河金史世宗紀右副元帥完顔默音舊作完顔謀衍今改正敗鄂哈舊作窩斡今改正於霿􅟶河赫舍哩志寧舊作紇石烈志寧今改正傳鄂哈敗於長濼遂西走志寧追及於霿􅟶河大破之連魯古淀金史鄂哈傳鄂哈入奚部時時出兵冦速魯古淀古北口興化之間按此當在古北口外與灤平即喀喇河屯廳豐寧即四旗廳兩縣為近沁河金史地理志大定府富庶縣有沁河元一統志沁河自富庶縣西四十里小澗流經縣治西南一里許東流四十里合於凌河按富庶縣在今平泉州即八溝廳西北則沁河亦當在州西北境撤馬水元一統志撤馬水在大寧縣西北四十里濶十步遼太祖時牧馬於此因名源出撤馬哈東流經縣境一百五十里合於塗河按此當在今平泉州即八溝廳屬大寧故城北境荆水元一統志荆水自金源縣界流入建州經州東北荆山下故名下流合於凌河按此當發源今平泉州即八溝廳東北境東南流入朝陽縣即三座塔廳境碓觜河元一統志碓觜河在金源縣西三里源出寺家莊西南三十步平地涌出溢而成川流經縣西一里許東南流九十里入建州界合於凌河按此當發源平泉州即八溝廳東北境東南流入朝陽縣即三座塔廳境與荆水形勢略同青龍河元一統志青龍河發源惠和縣五十里麻場寨南二里澗流經縣南一百步又北流五十里入髙州界按此當發源建昌縣即塔子溝廳東北流入赤峰縣即烏蘭哈逹廳境虎河元一統志虎河發源武平縣西南六十里葫蘆山流經縣之霸州鋪合於遙剌河按此當在朝陽縣即三座塔廳西北境芍藥河元一統志芍藥河在利州東五十里源自芍藥莊山谷間出東流合於凌河按此當在建昌縣即塔子溝廳東境狗水元一統志狗水在惠州東一百八十里源自指頭山崖出東流一百二十里入利州界合於凌河按此當發源平泉州即八溝廳南境東流入建昌縣即塔子溝廳境百里水元一統志百里水在川州東二十里自迤北三義口經州境沿流一百里故名東流入義州界按此當在朝陽縣即三座塔廳東北境清水河元一統志清水河在川州西北五里源出西北七十里紅土寨按此當在朝陽縣即三座塔廳北境白羊河元一統志白羊河源出興州樺皮嶺流入松州與落馬河合流逹高州塗河按此當發源承德府即熱河廳北境東流入赤峰縣即烏蘭哈達廳境鋤刀河元一統志鋤刀河在松州北二十里發源興州界流經州境不與落馬河合按此亦當發源承德府即熱河廳北境東流入赤峰縣即烏蘭哈達廳境與白羊河形勢略同欽定熱河志卷七十二
