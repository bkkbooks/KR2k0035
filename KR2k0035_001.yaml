body:
  text: 欽定四庫全書欽定熱河志卷一天章一披圖巡洛之代宣豫南風其音尚已至於過沛三侯橫汾一曲章句偶傳載諸史䇿要未為風雅之極軌也我朝列聖傳心文思光被聖祖仁皇帝以熱河為清暑之所掞揚天藻寄興智仁世宗憲皇帝在藩邸時扈侍行幃鴻章丕播於今昭垂星漢光景常新皇上敏時典學御製詩文全集函括萬象裒成巨帙兹之所編皆巡幸塞外之作其間對時育物敷政綏猷崖略於兹具見而疇咨晴雨勤恤民依尤不止三致意焉敬並分年詮次志天章第一至事有所繫者則依類恭載各卷中蓋即豫遊之地而聖學相承治源共貫真足典謨雅頌昭示無極矣聖祖御製文七詢四集體元主人膺期運撫寰海紀星次者垂七十年臨雲陛者周六十載常以薰風應律梅雨戒塗駐驆興州之域棲神無暑之區追疇昔感居諸意怫鬱乎其不舒也自沖嵗承基弱齡親政敬天明威察民視聽夙寤晨興慮慚前聖更歷多艱無忘執競有若三藩叛命尾大必芟氛連海嶠烽起西南選熊虎鉏豺犴驅以雷掃以電神􅋃彎而天狼落枉矢飛而妖鳥散覩六幕之塵清費八年之廟算黃淮并溢決岸潰茭波漂百室道阻千艘翠華頻省橇檋周遭然後息桃花之怒浪平竹箭之驚濤人歸廬井帆接亭臯安知候之寒暑而躬之焦勞也西戎跳踉窺我藩籞張皇王師陵厲禁旅再嵗三征雲屯颷舉越瀚海度磧鹵忘飢渴均甘苦夫乃馘冒頓服侯㹪紫燕徐入朱鷺凱還雖守成之述事等締造之艱難也至於户口繁滋禆瀛表裏地震天災習聞前史豈有遐遺痌癏在已晝膳弗甘宵眠屢起恩不踰晷澤必下行牂羊靡嘆鴻雁輟鳴民咸安其居而後釋然於中情也躬不遑息心不自逸於兹五紀常如一日內則畏天閔人勤身恤物外則沐雨櫛風衝霜犯雪擾靈府損精和榮衛結轖神氣消磨年芳冉冉星髮皤皤勞稍涉而輒倦步方跬而慮蹉思每短於再審事旋忘於既過來日不可期去日已苦多矢乾乾以時行恐菁華之莫繼彼羲馭之既中異東隅之初麗將息意而燕遊凛鴻業之攸繫誡一簣之功虧寧始勤而終替疲形竭智永思長吟歷年久而慮愈逺閲事多而憂彌深冀家給而人足財未阜於虞琴語風移與俗易化未致夫儀禽慕視履之元吉知上佑之難諶其何以寬無窮之煩念發垂老之深心於是左右侍臣文武有位二氏緇黃九流方伎奔走輦下負曝獻暄願言舒志錫福元元主人乃博采不遺從容顧問俾無忌諱各攄厥蘊近侍之臣進曰竊聞帝王之為樂也祕苑間宫遊晏有所班輸是營千門萬户閣通往來樓迷去住亭名臨月臺稱粘雨黃金作屋玳瑁為梁文榱繡栱漆瓦雕牆間以沉檀飾以璿璫曉日照而後庭流影微風起而數里聞香則有夏宫妹喜殷室有蘇異扇搖其丹鵲嬖人獻於赤烏龍漦褒艷驪戎晉姝修明辭越夷光貢吳戚姫偏寵邢尹並都協律女弟謳者子夫帳中狀若月之蛤枕前分不夜之珠璣絶巧工針神善製蟬飛薄鬢星髙髻思香競媚點膏逾麗羊車戀竹葉之扉馬射簇芙蓉之騎舍利穆婢小憐馮家蓮上玉兒桂邊麗華長娥賜果憨女司花太真之鮮葩解語窅娘之新月乍斜莫不秀發穠姿橫生逸態顧影有雙當時無對别有班姑偼妤左妹修儀蘭英獻賦上官評詩采蘋樂府花蕊宫詞咸摛華以待詔或稱美於占辭爾其熊毛席緑象牙簟白時窺綺窗遙映紅壁鈿綴金蟲釧裁琥珀袍飛瓊以流翠纎綃而染碧時則蘭苕繞露梧樹未霜紛瑤臺之窈窕度扣砌以徜徉喜方隅之宴清感節序之回換貴人生之行樂及良時而酣宴爰有龍膏始釀馬乳初來翠濤百榼紫霞千杯麒䏖麕髓猩唇豹胎雲鶬澤鵠淵鱗江鰓錯窮四海珍貢九垓蓐收動桂勾芒調梅於是衆伎俱陳八音齊舉笙鳴鳯翼筝移雁柱酆琅折柳之笛朋肯催花之鼓篳篥則桃皮含商琵琶則檀槽促羽雜沓繁會激揚清謳新翻水調唱徹涼州韻細而脣珠微粲聲淒而眉黛暗愁隨紅牙之緩緩協赤玉之悠悠彩雲仙隊素霓舞列長袖吸華輕𥚑回雪叉漸搖以逐步珮徐鏘而應節翩鸞影以遙瞻希龍顔之豫恱及乎銀釭既爛銅漏猶遲惜餘歡之晼晚顧綵筆之葳蕤授簡尚宫歌以繫之歌曰拂巾接槃曲既揚妖姬素面華月光上為衾幬衛風霜下為履綦願同行日車永永駐扶桑千秋萬嵗樂未央若此乎徴新聲選麗色蕩樂娛心不知所極今主人乃欽欽翼翼勤而不息富有萬國而寸陰是惜泊然無以為歡臞然類於山澤盍釋萬務擷衆芳暫取以為消憂之術怡神之方乎主人曰昔嘗覽乎沫水故墟驪山荒殿始蘇之臺瓊花之觀金粉埃塵喟焉長歎階厲召禍敗德纍名宜鑑傾城之轍母招伐性之兵年之少也不留聰明今垂七十矣寧復溺志於色聲文學之臣進曰清明在躬聲色不邇惟聖右文請陳皇始龍馬示象羲作圖繫辭贊翼三古同符卲演希夷程刋輔嗣朱集厥成推本占筮事濟民用理泄天祕百篇嬴燼及漢稍傳濟南則屬讀佶屈闕里則科斗聨蜷照乘猶遺連城斯得執簡皆聖人之徒嘉言實王者之式齊韓暨魯各以詩名毛受子夏鄭繼其聲序由衛宏疏緣劉焯自西晉以孤行至南宋而啓鑰春秋五家鄒夾無聞公榖口説左據舊文洛閩未遑張胡齊轡莫參筆削之功誰炳衮鉞之義郁郁周禮制自元公書成定鼎官補考工儀禮為經禮記為傳河間之逸者已多小戴之存者未半至若史家之體祖於典謨編年紀事左氏遺模遷承談基固纂彪業振古流芳將來取法范刪衆籍陳紀三方漢之仲季何其煒煌晉書天文淳風妙解沈約詞人宋志博采伯起撰魏子顯著齊自茲厥後僅而有稽梁陳齊周志皆無述隋書效宋五朝咸悉索頭島夷交相詆誣延壽後出南北部區唐書新修歐宋分庀視劉之舊最得統紀五紀自鄶蕪而弗理卓哉廬陵庶隨腐史司馬通鑑甲子是編搜積卷於祕閣陳炯戒於經筵猗綱目之大義揭羲娥以髙懸均左右史之舊職續書春秋之薪傳若乃南薰作歌晨露流詠池上答白雲之謠沛鄉起大風之興憂民魚而瓠子功成喜天馬而流沙道敻帝京十首雄氣無儔東堂三傑睿藻偏優太和之古調清峻大中之曲晏唱酬莫不包含黼黻敲戞琳璆溯敇幾之命意同卷阿以來遊至於穗啓神農鸞徴少昊禹碑甚竒湯鼎為寶周穆紀日漢章名草宋文規模乎子敬齊髙吐納夫僧虔孝建之翰墨馳譽永明之筆力象賢梁帝觀鍾繇之意陳主品嗣真之篇逮夫貞觀妙入羲域瞻屏風而歎草聖登御牀而取飛白睿宗則五雲紛飄明皇則八分英特是皆鴻騫鶴舞虎卧龍跳寄間情於緗素絢殊采於珠韜今主人躬上聖勤下學體太極超先覺折中四府等量百王乙夜未嘗停於覽酉山無所祕其藏爰申石渠之論載廣虎觀之議考代葉之隆汚較簡䇿之同異固理熟而神融非玩物而喪志也聖又多能道兼衆藝體工六文詞髙五際逢風景之清暢矚川岫之澄幽拂宣毫之圓健試剡藤之剛柔月露吟而意逺煙雲落而勢遒韻金聲而玉振象日字與奎鈎豈不興酣情逸俾彌性而優遊乎主人曰經觀大義毋為華葉史貴徴信匪誇涉獵入聖之階梯具在臨人之鑑戒斯慿允平生之所好慮垂耋之弗勝未免披吟亦事楮墨不爭文士之長寧詡書家之則聊抒寫於一時何余情之可釋介胄之臣進曰文以飾治武乃申威雕蟲之技壯夫不為請論我國家軍容之赫赫武功之巍巍也風后握竒力牧為將蛇鳥連營貔貅列仗殳執星廬戈環玉帳扛鼎誇雄翹關示壯甲胄則飾貝齒綴朱綅精皆浴鐡麗悉縲金百疊之蛇鱗護臂重環之鮫鎧當心劍戟則蘭葉凝霜蓮花舞雪龍訝津騰鯢驚水截雍狐之鍔千攢湛盧之鋒萬列努矢則燕山之角朔漠之篷削夏箭規唐弓鯨牙耀日鶉尾迎風羽橫空而蝟黑鏑卷地而塵紅若乃驥産烏孫駒來赤水坰滿丹髦谷量緑耳六印聨珠三花散綺駕兹白於輈轅豢乘黃於鹿麂貢道通戎政理芻牧攸宜蕃庶莫紀爰分錦埒並鞚金羈珊瑚之鞭霞舉玫瑰之轡星馳左御周廬右陳殷輅樊纓則五色紛垂闟戟則崇牙畢駐於時塞樹初丹沙茅盡白彤雲籠帳殿之髙素月吐邊牆之隙八校清塗九斿照陌斾獵獵而穿林馬蕭蕭而度磧萬騎密布兩翼斜張火明逈野角轉遙岡陳合而潮聲乍捲圍圓而虹影何長車邊獒猛縧畔鷹蒼脛隨草偃爪挾風揚毛飄飄其漸下足躍躍而全僵於是武士奏能蒸徒雄發或拉豹以摧斑或拳貒而磔骨哂狼顧之尾疐喜熊掙而掌滑飲嗾而蒼鹿羣呼投罟而銀獐早蹶至若芳洲日霽春渚氷消狩南畿之廣澱按五色於輕橈舟聨鵝鸛之形浪蹙翼箕之勢弋必待飛繳無及細習水戰之神機授澤虞之節制家祕珠玉之鈐士擁戈矛之鋭既令一而力齊亦恩深而忠勵且我皇朝拓宇紘極來同羅地天之上下包日月之西東絶漠在籓籬之內荒服盡庭廡之中蠢茲孽醜恃其遐逖蛙謂井寬螳張臂力我軍乃經無皂歷不毛水名寒暑山號鏖鏊瘴煙晝滅訛火夜燒然而勇思敵愾義奮同袍度危輕於飛鳥攀險捷於懸猱歡聲動油幕和氣逐星旄刀刺而甘泉湧旗展而毒氛消驚從天而忽下紛穴地以潛逃俯瑤池之浩蕩陟普陀之岧嶤渡金沙而拔幟定三危以鳴鐃是則域絶梯航名遺圖史昔阻殊方今為同軌六師告捷萬方送喜功髙涿野化嫓虞階扈征不逮殷武莫儕寧不足以鳴億代之愷樂釋一人之憂懷乎主人曰天有雷霆功同風雨聖作􅋃矢道濟干羽安不忘危訓兹貔虎率由周禮嵗有搜苗摶犀兕以作氣冒風雪以習勞羽林兮親率雕弓兮手操垂老兮不懈匪樂此兮遊遨感唐宗之殪豕猶技癢而自豪何雄心之欲逞而英武之難韜八荒在闥七德有征不得已而後用計萬全而謀成雖屢聞于露布長戚然其靡寧固不恃太平而弛備亦非矜逺略而佳兵釋氏之流進曰佛道崇虛不以威力常生歡喜之心必在清淨之域粵自日升法界雲散梵天古來證聖今劫當賢善慧夙願羅衛因緣夢占白象胎置金蓮徒衆則降生百億光明則遍燭大千發念四門凝神十地脫屣王城披緇林際安步而青雀環飛跏趺而火龍戢勢當明星之出時應執月而度世其為道也戒行為本禪那為趨精進何勇忍辱如愚惟一真之自在忘色相之有無懸靈臺之澄鏡出濁水之明珠誕先登於慧岸乃永超乎迷塗離欲塵而皓潔變苦海為歡愈其為教也大極羣生普濟萬有三乘可階六度是牖雷鼓揚聲霜鐘虛受灑甘露以息心聞妙音而稽首意樹生夫善果情田薅夫害莠照暗室以芳苡擢汙池之瑞藕禆王化之淳和躋黎元於老壽爾其騰輝周室皎像漢庭蘇由識兆傅通靈天竺寫範石室緘經法顯於邁遍覺遐征訪雞足之故迹啓鹿苑之舊扃竹簡志其周歷松枝感其専誠則貝文自兹盛出金字於焉流行矣又有伊存初授迦羅始輯趙地宗澄秦都禮什宣譯大藏淵思祕笈跋陀栖蹤於少林難提摹影於洛邑此則法雨之東被而禪風之西入也然乃律論雖著心印未承逹磨逺屆爰示真乘珈梨轉付機契斯憑北宗神秀南派慧能花開五葉焰發千燈是皆默悟妙圓深通聖諦受如來之法眼嗣大士之苗裔夫其超九劫而授記繼六佛而仰瞻現白毫之功德顯紫色之莊嚴天上天下其尊無對世出世間此道為貴是以帝釋皎依人王崇事元魏則一萬三千所江左亦四百八十寺莫不塔規雀離宇肖鷲峰花林藹藹蘭若叢叢須彌巍殿兜率淨宫盤乘團露鐸和髙風六牙殊狀九級神功升堂則月容霄表躡梯則人語天中亦有剪綵刻檀雕銀鏤玉香剎之金翠二丈幢幡之珍寶百斛龍鱗敷席鳯毛隱褥薦瓊膏而乳融焚瑶髓而煙馥現路衢之慶雲耀坊市之華燭洵佛事其煥儼轉法輪於大覺熙萬年之鴻祚頌五位之茀祿今主人無量壽相種大福因修成億劫宏濟兆民隨喜法喜能仁當仁邁應聲之前迹猗感運而降神願闡真如之教永綏極樂之身主人曰釋氏之教湛然虛淨脫離六根明心見性無惡無善豈逹性命義之不存又安能敬順動靜以循環匪偏枯於寂定包理數其紛羅何談空而作聖雖了徹乎三生亦奚禆于國政既塵芥夫山河寧存心於萬姓拾身同泰迎骨鳯翔垂鑒前史曷云其臧敬而逺之聖言孔彰道家之流進曰釋開覺路老合儒宗直窺元奧大啓仙蹤原夫有物混成冥冥窈窈先天地生字之曰道陰陽亙根坎離相抱本氣祖於太虛藴谷神之至寶綘宫爣烺玉房逶迤木公金母姹女嬰兒龍虎森列昴畢交馳神資滲雪妙合希夷維導引法為養生主樞動不蠧水流曷腐搖天柱擊天鼓熊經鷮息猿攀鳥舞戲五禽而榮昌祛三蟲而輕舉六齋清淨十戒精嚴元關自扄尺宅長緘澄空鏡皎活水波恬戕身之斧罔觸爽口之味奚沾心欲葆真鼻先視白息由意調氣緣思積抱一兮探珠守中兮拱璧存想而槖籥開內照而津梁闢爾乃納新吐故吞景含光絪緼太始呼吸元陽丹田鬱鬱氣海泱泱紫霧騰於上谷黃芽茁於中央乃有華池旁流璇露寶液瀠洄瓊漿布濩六府潛踈百骸畢注汲醴井而難枯灌靈根而永固若乃九三列鼎六一和沙煙浮金竈乳吐瑶葩刀圭散雪鉛汞蒸霞充糧而煮白石擲米而成丹砂别有氷園之瓜玉文之棗瀹术同調茹芝共搗籛鏗啜桂以綿齡務光哺薤而壽考偓佺食松而飛行南嶽采苓而助姣王興換骨於菖蒲鳯綱咀華於卉草餌八石而方瞳服一丸而紫腦所以至人稟二氣運三真按七候具五因保戊巳守庚申朝吸鬱儀夕采結璘內則九還育性外則寸匕回春煉形為氣化氣成神烈焰莫灼弱水難淪金玉其色日月其身緑毛不稿頳頰長新則有赤松雨師崆洞親訪作歌黃竹授書河上笙吹緱嶺袖挹浮邱竇令乘龍而上下琴髙控鯉而遨遊時而矯舉層霄遙征瀛海眺圓嶠之崚嶒憩方壺之爽塏九色之鴻蹁躚三素之雲靉靆霓旌荏苒以排煙螭衣陸離而絢彩芝童導舞桂女擎觴雉羮箸膩麟脯盤香鶴奏延年之曲鸞吟益壽之章揮三千之琅簡十二之文凰懸圃之景光自愛蕊宫之娛樂偏長今主人體乾元握太乙凝剛健之精造沖虛之室簡幾務之焦勞導皇躬以寧謐元始道合淡漠無為養一心之和暢致八極於雍熙固性命之真樂仁壽之良基不得謂太上道妙與聖治而兩岐也主人曰道法自然為天地根老氏之學能養其真流而成弊刑名放蕩長生久視語益惝恍况神仙之杳渺氣歷劫而難聚縱白日兮飛升與世道乎奚補慨秦漢之往事求方藥而何愚用清淨而獲效寧化美於皇初養身壽人儒者有道保合太和何取黃老醫術之臣進曰衆家紛綸各有所宜導和釋結常守惟醫雖方技之小道誠親切而神竒自古炎農始宣藥品形色必區性味攸審亦越軒轅繼作內經運氣惟敘部候聿明岐彭扁俞振揚輔導君臣佐使之相須神聖工巧之畢到勒諸玉版典在靈蘭遭嬴禁而無恙嫓羲易而永傳爾乃鸑鷟鳴岐姬公制禮職領天官務寧王體調和食飲滋息本根精神欲其內守政事先乎理身左氏作傳載秦和之疹視馬遷述史序倉公之證治備演鴻術兼表竒事嗣是長沙賢守垂金匱之要句漏仙令集玉函之妙華陽别録太白千金遞相授學不輟披尋猶復從壺中之幽叟搜肘後之祕藏門帶杏林而霏雪宅留橘井而浮香三世之名著十全之實彰以臣愚管仰揣聖躬非有陰陽勝負侵其外喜怒嗜欲伐其中特以懷萬古之永圖鍾四表之遙情憂慮太逺則費神智計過周則耗精默識成性偶難憶於忽遺通微必睿時或不屬於思維得上藥以為助自壯盛而不衰西土浮陽作甘美草式和羣品首資國老瑤光散彩人參具形恆騰紫氣亦聞呼聲彤絲上布晧苓下生松腴不朽伏菟通靈草名小草本為逺志醒心是賴出處非異堯韭天降昌陽引年百陰感氣九節蟠根隰産惟苄地髓凝黃從下會意沉者尤良令應金蘂族辨苦薏延齡妙用露裛佳色薯藇修脆月盤煮糜生則膩滑乾收乃宜龍眼繁實燦若驪珠蜜脾無滓益智有餘斯皆可以開心安神填精輔志久服輕身近驗強記他若忘憂樹之丹棘合歡贈以青棠猶以力微效淺未敢貢於上方也至於筋力小勩血氣異候樂不疲而覺強足容重而嫌後固無事於按蹻更靡假於針灸虋冬蔓茂經驗紫微日行三百有過鶱飛天精地骨枸杞還壯吠尨隱叢仙人作杖交藤如斗山翁成瑞髮重鬒黑步逾便利伊仙靈輔足最神柳詩所歌不越盈旬穗象郗蟬性著逐馬丹參曽試蕭炳非假以之湯液去患若風之吹雲醪醴取益若寒之回春凡臣所陳氣擇其平味簡其良品無迂避用必經常屏金石之多悍捨禽獸之微毒先嘗奚待乎九折奏御方迓乎百福煩悁渙釋動作輕安加由繹而思彌永循端未而記益全襟舒兮懷暢色澤兮體胖何必髙居深念鬱悒心顔乎主人曰古帝垂經以原其本良師立方以使之平能回氣化有禆生生止祛疾疢匪駐年齡食惟榖味滋以薑桂若服藥之過多反五藏之為纍况乎出産殊地採造愆期質同效異物是時非試不獲應久愈失宜嘗探求者歷載猶影似而未真欲綜覽以著書恐貽誤於後人思邈有逹言飬性先自慎寧以憂畏為本勿惟藥用是信於是有巖阿一老皓髯朴貌擊壤行歌韜華祕耀稽首山莊之門上獻芻蕘之言曰諸臣所論惡足以知主人哉昔者唐虞三代之治也堯德曰欽君臣之大虞廷交吁動色警戒夏后克艱其政乃乂成湯栗栗臨淵是慨文王蒸哉敬止不懈武受丹書户牖銘誡謨誥雅頌歷古相傳於赫天命明徵聖言匪四海之為富將康濟夫黎元匪九重之為貴將仰答夫蒼旻理庶官而無曠躬萬幾而不勤思艱巨之負荷雖細微而靡捐不以天下為樂惟知為君之難今主人稽正學披往牒溯百世之緒繫億年之業撫幅員之廣博覩民物之繁稠日方中而恐悚雨未至而綢繆譬朽索之馭馬喻洪波之載舟覽青史以申鑒紆黃屋之深籌何一夫之可勝何一事之不可憂乎乃若內外建官賢才是樹用牧閭閻用治軍賦廢耳目而任心豈英髦之可遇爰詢訪於羣僚曷由消夫黨附或顯名於卑秩逮位髙而改度倘審察之未精將輕信而成誤又若蠲租賙食益下之經先時峙備廪庾宜盈本常平之良規參社倉之遺軌非綱紀之得人徒名存而實詭及臨時而設施貴周密於條理茍奉行之不臧竟何禆於井里法惟禁暴德在好生律令不用道化以貞自親民之守令已莫必其得情况受讞於槐棘慿案牘之權衡罰雖薄而求當乃克慎乎祥刑每登中於嵗杪占貫索之空澄若此者自非主人離照不遺乾綱獨運則何以肅官方解民慍作元命申清問百工允釐有條而不紊乎主人曰隱者之言美矣然終奚以釋吾懷耶對曰王者之道父乾母坤嚴恭寅畏罔間晨昏維天之怒風烈雷焞側身修行言省其愆維天之喜景星慶雲惋容愈色以承其歡視無形而若見聽無聲而如聞嚴精禋於二郊通志氣於兩間命變化其靡定福不可以幸干恆局蹐而齊栗敢戲渝以自寬代天治物綏御遐邇眷此蒼生實吾赤子彼鞠育之慈恩同疴癢其一體崇責任於元后曽何分乎毛裏縱遙隔於帝閽如號啼之在耳果誠心而求瘼斯致頌於樂只宜乎舉膳踰昃求衣待旦苦身勞形耄期在倦卜天行之泰否審人情之萃渙善罔小而祥基惡罔大而禍臶履虎尾以操心涉春氷而慮患笑與嚬其不假處間燕而齋莊恐潛移夫威福杜窺伺之在旁治與亂其倚伏逮明盛而思防炳幾先以逺照用鞏固夫苞桑信盈虛之有數修人事以為常筮艱貞以旡咎豈晏安之可嘗感晚節之易改永垂警於怠荒期初終以如一運不已之陽剛雖齒髮之就衰尚黽勉以自強縱精力之漸耗詎惕厲之可忘是則主人之憂勤也天高地下與之偕極日往月來周而無息舉天下之人莫可與分其責而又何日以自歡何時之能釋主人曰隱者之言實獲我心有志未逮我思益深夙披誦夫尚書攬帝王之金鏡君子所以無逸裕大猷以立政又觀玩夫周易綜微言於四聖能恐懼以致福兹得中而履正憂殷勞勩習與性成學於古訓不敢荒寧前途之計後世之寄疇勤疇恤翳余是視兢兢業業不知老之將至御製文皇祖聖祖仁皇帝恩賜御書記樂善堂集憶自年十二時隨皇祖聖祖仁皇帝駕往熱河避暑朝夕隨侍皇祖萬幾之暇輒流覽書史或親灑宸翰從旁竊觀心慕而未敢以請也皇祖顧諭曰汝愛吾書乎賜長幅一復賜橫幅一扇一皆持以告我皇父寶而藏之其年冬龍馭上賓哀痛沉篤每展閲御筆手澤猶存涕涔涔下乃肅容拜手而為之記曰嗚呼皇祖之孫百餘人其中聰明才識好學博聞年長於孫臣而任事於朝者彬彬濟濟孫臣年甫弱齡性復鈍魯顧特被恩寵逈異他人者豈非我皇祖推愛我皇父之心比諸孫有獨摯乎今雖八載聖訓慈顔宛然如昨豈徒杯棬之慟已哉若歐陽修作宋仁宗飛白記謂仁宗德澤涵濡於天下者四十餘年田夫野老猶悲歌思慕况得望清光而承恩寵者尤相與流涕不置我皇祖君臨天下六十餘年聖德之廣大化被之宏深享年之有永過於仁宗萬萬歐陽修不過受知近臣為僚采作記尚流連咨嗟慨想而不能自禁况孫臣日侍晨夕誨愛特深親侍皇祖之揮毫躬受錫豫其流連咨嗟慨慕更當何如因書以志不忘云古長城説壬申木蘭自東至西延袤數百里中橫亘若城塹之狀依山連谷每四五十里輒有斥堠屯戌舊迹問之蒙古及索倫皆云此古長城也東至黑龍江西至於流沙類然夫蒙恬起臨洮而屬之遼東者今其城猶存乃去此數百里而南且東西又不若是其遼也則古長城者豈循蜚疏仡時所為者耶山海括地所未載於無意中得之荒略口傳而借余以垂其名豈非造物者之靈迹久晦而必彰耶嘗苦載籍傳記浮夸多偽固不若芚蒙無文者世代相沿指實以道之無褒貶豫奪於其間也則秦之所築為擴邊乎為讓地乎於古無聞而今傳者吾安知天下之似此未傳者當復幾何乎又安知今經豫傳而必保其後此之不又失傳乎或曰此非城也蓋天地自然生此所以限南北也夫天地既生此以限南北則秦為之長城益可笑矣欽定熱河志卷一
