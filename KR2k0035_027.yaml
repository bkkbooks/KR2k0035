body:
  text: 行宫三四面雲山北枕雙峰西嶺晨霞錘峰落照南山積雪梨花伴月曲水荷香風泉清聼四面雲山山莊西北隅最髙處一峰拔地搆亭其上聖祖御題額曰四面雲山聫曰山髙先得月嶺峻自來風是亭切漢凌霄羣山拱揖各開生面東眺天橋雲垂簷際南則玉冠諸峰望如屏列北則金山黑山屹峙廣仁嶺迤西諸峰盤礴案衍絡繹奔赴憑虛縱覽萬景天全伏讀御製諸什信乎乾坤清景秀寫無雙矣聖祖御製詩四面雲山三集澄泉繞石迤西過泉源盤岡紆嶺有亭翼然出衆山之巔諸峰羅列若揖若拱天氣清朗數百里外巒光雲影皆可逺矚亭中長風四逹伏暑時蕭爽如秋殊狀崔嵬裏蘭衢入好詩逺岑如競秀近嶺似爭竒雨過風來緊山寒日落遲亭遙先得月樹密顯髙枝潮平無湧浪霧淨少多岐脈脈金明液溶溶積翠池常憂思解愠樂志餘清悲素學臣鄰老耆年自不知登四面雲山四集雲梯石磴逼巃嵸倚杖旁觀衆壑同更上一層圖逺望奈何樹雜與煙籠御製詩四面雲山恭和皇祖聖祖仁皇帝御製元韻辛酉攀躋步崇嶺摩詰畫中詩岑壑依然在川原望裏竒重來猶切切欲去更遲遲孤鶴唳層巘孫梧擢老枝苔紋迷近砌鹿迹印斜岐座靜來青黛窗虗浸曲池懷恩常撫迹憶昔更含悲當日乾乾意身肩始得知題四面雲山亭子乙丑四柱搆峰巔松蘿作扉闥詰曲頻攀躋造極心乃豁一覽衆山小左挹雲容活鶴唳與鹿呦饒伊相問答山中無朝暮行漏丁丁報東峰尚夕陽西嶺已落照秋雲淡逺天萬里縱清眺有時噫氣作于喁號萬竅而我亦會心憑虛一長嘯我有山水癖耽詩殊未厭此地况迥絶衆壑歸包函峰翠經雨洗楓丹著露添掃苔坐石頭凌霧振衣衫自覺勝前秋饒有吟髭拈登四面雲山亭子己巳雨過千峰濯黛青乘涼縱目坐山亭尋常樹色猶遮望到此山容無遁形絶頂平臨北斗齊座中惟覺萬山低林禽饋客爭銜果澗鹿迎人淺印泥霽空寥濶早秋清邈爾拈豪暢快生底事成吟多警句會心逺處鮮凡情登四面雲山亭子中峯千丈拔地起特據其巔搆亭子初秋薈蔚尚連林登臨未露山容美重來木葉已半落惟餘老翠及嫩紫精神氣韻莫不獻纂組刻峭無能擬三旬飽看塞垣山嶊崣綺錯固佳矣萬景天全結搆精又盡善焉乃在此四面雲山壬申軒忩徹四面巖谷俯千重奚數荆關迹堪尋佺羡蹤林踈為風拂峰現忽雲封策騎遵﨑棧時看白鹿逢登四面雲山亭子亭子雲山最髙處停鑾未肯頻臨駐聞之地靈神所都隱虞為我勞仙馭崇壇案衍實佳哉能辭偶爾一徘徊屈指六年登六度每登必有風雨來今朝秋宇澄新霽林扉跋馬鳴璁轡孤亭小坐未俄延前楹倐復煙絲綴飛空掠樹不踰時長天一碧懸清暉千秋葉葉翠難狀萬峰濯濯青偏竒風為車兮雲為馬山之靈兮翩其下洞庭張樂信然乎何必曲髙和者寡登四面雲山亭子六韻甲戍跋馬遵﨑棧楓香路幾盤忽看一笠近儼據萬螺端夏似將秋易心因縱目寬竒峰雲四宇活畫樹千巒避暑最髙處披襟生峭寒青瑶蔚逺近何必綴稜丹登四面雲山亭子恭賦皇祖山髙先得月之句峻嶺切雲漢孤亭俯渤瀛氷輪才湧出玉砌早光明培塿難為障姮娥若可迎有林皆一桂無界不三清盈手寒何礙流睎魄倍晶兔原龍塞物鹿作羽衣聲谷口猶燈火河邉辨畛營萬方歸朗照辭見聖人情登四面雲山亭子作歌亭子諸峯最髙處以不常來如始遇秋風策騎一遨逰巖樹澗葩皆興助金山西北黑山東天橋對面當亭中我欲因之詣彼岸佺僑之輩其相逢佺僑仙術無濟世寄意則可難從事黍原蕎巘皆本圖外靖內安尋至計煌煌聖藻石屏懸齊年却識辛卯年回思承訓御座前敢不蘉乎佛時肩登四面雲山亭子庚辰中峯迥出羣一笠與平分四面雲山態八音天籟聞山齋俯創得創得齋在深山邃谷隱不見惟此亭標最髙峯俯視如在咫尺大塊有真文亦欲無言去其如伺懋勤登四面雲山亭子辛巳清秋雲散碧天露策馬遂造最髙處谷中婪熱尚覺炎峰頂峭寒不禁遽幾畨畫意徒凝眸今朝親到興始酬樹猶張王二字皆去聲依巖緑泉自清涼羃石流近村逺墅都結攬黍髙稻下黃雲染關外秋成乃爾佳豫民被潦頓遙感登四面雲山亭子壬午策馬蘭蹊不礙涼虗亭憩坐敞秋光逺山似揖近山拱楓葉初丹槲葉黃西北諸峰倚天近東南一水入瀛長年年舊句鄰新句徒曰忘言那易忘登四面雲山亭子作歌癸未山莊中山最髙處千峯萬嶺莫與齊金山黑山山城外雖髙於此望覺低避暑夲自無暑到夏不厭涼語可稽乘間策馬試登陟濃青深翠盤雲蹊每值嘉蔭輒止憩為恐僕從勞攀躋到來一笠冠絶頂天風拂拂吹天䨑有時晴光搖草樹有時晦影沈巖豀吾知之矣起豫思便與作歌亭柱題登四面雲山亭子待月即景四首過望東峯月遲上欲圖早見陟西峰谷中摸索光明者豈識先他四刻逢慣厭中涓早備釭千巒夕景正無雙天橋驀看氷輪湧訝是嵩髙玉女窗東界今宵淨斂雲呈全體不掩毫分底須轉句衡前夕自是髙山迥出羣滿目為眀滿意虗林光巒影總如如松扉繫馬歸齋閣載得金波到碧疏登四面雲山亭子待月夏夕登亭曽待月新秋轉瞬望仍過底因識得無遷處依舊清光映女蘿氷輝萬里朗澄鮮􅎟杪何須計欠圓最是山髙先得月亭子聫句山髙先得月嶺峻自來風皇祖御筆也聖人留句示神詮天橋正對碾輪移素影旋看碧宇披幾點螢光流樹底勞哉却笑爾何為楓林莎坂影依稀載得銀蟾並馬歸所以略殊前度者夜涼山靜欲添衣登四面雲山亭子甲申到來彌月始言登曰不迹慵信孰憑半為少間半艱詠因他地占最髙層縱目朗然更蕼然萬山髙下拱階前凌空颯沓天風落疑是廣寒奏管絃秋宇寥蕭秋日晶秋雲片片逐風行今朝一踐秋山約萬樹當秋自賦聲啓蹕眀當往木蘭索酬吟興陟崇巒笑他玉局非精詣髙處瓊樓何礙寒登四面雲山亭子以題為韻四絶句乙酉山莊半月駐亭子今初至迥出界以三俯望海為四尋常雲際看入峪轉不見一二灑天花是日微雨梵典以雨雪皆為天花迎客開生面巖葩不識名襲人多淨芬却顧來時路隱現於白雲邇日頗覺熱涼生瞥眼間下臨萬壑深乃悟居髙山登四面雲山亭子丙戌盤峰數息亮輿登千里河山座下憑頗覺生衣怯涼籟諸天之上玉壺氷乍隂忽霽益增景近壑遙巒畢獻佳煙火萬家鋪廣甸俯臨都為去聲計安懷亭柱詩屏挂欲周便因嵗月驗從頭掞箋不慮天風拂喜與山靈作倡酬太古以來即有此迥情誰復費安排椒蹊索與遲遲下為愛新涼滿意佳登四面雲山亭子作歌丁亥碧天如洗秋陽皛不涼不暄風物好蘭蹊策馬登最髙興會今朝霄漢表霄漢之表搆虗亭依稀如到廣寒庭桂花未作金粟色萬山枝葉交濃青濃青疊翠開生面風過霓裳聲遞按此而無語頓置歸恐防山靈笑踈慢登四面雲山亭子戊子崿嶂傾崖幾曲盤到來俯視萬峰攢唅呀更復天風鼓座上添衣七月寒青楓翠柏眼前羅棧齴猶看蒼鹿過風籟渾疑華山頂明星玉女按雲和亭子雲端不屢登登欣曠志共秋澄短長詩句題簷柱也喜同人年嵗增登四面雲山亭子己丑今朝處暑曝秋陽婪尾蒸炎反異常數息肩輿才造頂天風透體䪺生涼山莊一至一番登亭柱題詩嵗嵗增却是陳言難盡去清新俊逸又何曽上祇天髙下絶羣不遮憑覽靜巖氛若云萬里歸眼底那見滇南萬里軍登四面雲山亭子辛卯早晚峭寒卓午熱山中無定有其常敞亭底識最髙處向日坐來猶覺涼畫屏攢簇衆嶙峋碧落秋澄迥暢神却憶去年遲駐蹕歷觀題柱闕庚寅每嵗至山莊必登此亭登必有詩題柱昨嵗因朕六旬慶典中秋後始啓鑾至熱河駐蹕四日即幸木蘭未及登此遂闕題詠四面虛明俯萬巒真教逰目緑雲端摛毫句擬新鄰舊欲去陳言戞戞難登四面雲山亭子壬辰林海湯湯泛碧瀛中央亭子聳簷楹恰如身到蓬萊島俯視波瀾總翠瓊雲山四面若無隙夏木千章最有神梯几天風度搖刖衣裳飄拂絶微塵秋令來多夏令少兹來夏月亦如秋祝融便擬設孤注到此金官勝一籌登四面雲山亭子作癸巳昨欣驟雨暑全湔極嶺登臨忽隔年望去天光千里外遞來秋信五朝前是月十九日立秋擅乾坤內無雙景奪造化工有獨權坐此應教諸慮靜依然馳念到金川登四面雲山亭子甲午亭子尚未登時炎幾暇少兹逢雨後爽弗濘緣山道肩輿數息至萬葉夕陽皎天衣一縷無虛言造雲表玊鏡已挂空却匪遲去聲之早心凝形亦釋於何覓懷抱去嵗與今朝一例漏聲杳登四面雲山亭子乙未塞天過雨碧於藍塞谷落風寒非冷因緣時節不可孤便以筍輿尋勝境立秋雖未巳秋月皓日金颸報秋景數步一憩陟巉巖樹杪虛亭見崇嶺左右鹿隊何逍遙髙下蟬聲亦清警玉宇直欲换祫衣林海又疑泛野艇我到山莊已逾月超几妙趣今方領遐哉崆洞拜下風小矣勾漏尋丹井登四面雲山亭子作歌丙申登培塿起衡霍心遊涓澮發江湖思而况靈區髙峙煙霞表兼之茂林湧現滄溟意矗玉筍之崢嶸幻翠波以溶㵝登斯亭者如泛海上之槎蓬萊方丈之仙不招而自至登四面雲山亭子用兩韻回文體避暑山莊暑亦過設恆無暑奈田何然而涼處暑可避斯則山莊有獨多避暑莫若此亭子髙處不勝寒是矣至却月餘未曽登則慮恐勞僕從耳今朝立秋秋信多光隂荏苒真無何常時望中給念者是宜乘爽言經過不須命騎命輿耳數息駕言亦至矣千巖萬樹在眼中眼中吾老吟杜子登四面雲山亭子庚子夏月忽忽過秋朝得得來萬山青昊近四面碧雲開㿩雨真稱協髙寒此暫陪吟題闕丁戊歷年登亭子無不刻木牌留詩獨闕丁酉戊戌二年未至耳追憶愴神哉登四面雲山亭子作歌辛丑亭子雲山最髙處一年祇臨一兩度秋晴風爽試攀躋倐見四面英英布園中此可稱靈山海喇汗頗似興安塞外山靈異者蒙古率謂之海喇汗而興安為最凡車騎過此輒雨俗云洗山丁丑經興安雨有海喇汗常靈應明易為雨亦易為晴之句略霏細􅉈旋開霽神樞孰得窺其端薈蔚乍為寥朗宇天橋錘峰近可睹萬景幻化供眺吟千古詩人誰水乳登四面雲山亭子壬寅亭據巍巔到不頻秋朝緩陟又簷巡諸峰近逺拜風下一榻髙眀俯景新緑樹叢中紅點畫碧山空外白書紳去天尺五心寥濶得句應知逈入神北枕雙峯山莊內直北山嶺有亭焉斗拔竦起與西北金山東北黑山頡頑鼎峙聖祖御題曰北枕雙峰其勢排空屹向如天門雙闕對拱簷楹亭前兩石笋秀削青瑶矗立雲際上鐫聖祖詩皇上和章糾縵雲霞含吐日月伏覩天文垂象益徴地靈鍾秀云聖祖御製詩北枕雙峯三集環山莊皆山也山形至北尤髙亭之西北一峰峻出勢陂陀而逶迤者金山也其東北一峯拔起勢雄偉而崒嵂者黑山也兩峰翼抱與兹亭相鼎峙焉嶔竒岡岫紫宸關乾地金峰坎黑山苦熱雲生雙嶺腹盆傾瞬自落溪灣御製詩北枕雙峰恭和皇祖聖祖仁皇帝御製元韻辛酉欲排雲霧叩仙關咫尺羅天即此山却喜晴明聊縱目灤河如帶一灣灣北枕雙峰壬申雙峰金與黑西北金山東北黑山拱揖若來恭嶊崣天光接𡨕濛雲氣涵鸞音愧阮籍鶴度肖蘇耽反照千林紫吟情落碧潭西嶺晨霞自雲航月舫右行傑閣巋然臨波面岫一鑑渟瀅千林薈蔚紫霞晨映在雲岑木杪之間至其倐忽變幻錦文繡錯十色五光難以名狀聖祖御題額曰西嶺晨霞聫曰鶯留花下立鶴引水邉行皇上御書聨曰雲卧天窺無不可風清月白致多佳又曰窗外逺山如黛色檻邉列樹作濤聲聖祖御製詩西嶺晨霞三集傑閣臨波軒窗四出朝霞初焕林影錯繡西山麗景入几案間始登閣若履平地忽緣梯而降方知上下樓也雨歇更闌斗柄東成霞聚散四方風時光豈在凌雲句寡過清談宜守中御製詩西嶺晨霞恭和皇祖聖祖仁皇帝御製元韻辛酉翔陽騰曉海門東似颭紅旗錦揚風何必暮山誇返照試看西嶺畫屏中西嶺晨霞壬申窗户含西嶺晨霞亦可稱恍如赤城畔髙出白雲層映日真還幻隨風散復凝今朝凖為雨農諺有明徴農諺晚霞晴朝霞雨錘峰落照山莊東五里許為磬錘峰酈氏注所謂武列水歷石挺下挺在層巒之上孤石雲舉臨崖危峻可髙百餘仭者也聖祖賜名錘峰就山莊西嶺構亭與四面雲山亭相望東界諸峰悉在指顧每紅輪西下返照在東衆山蒼然暮色而是峰逈出孤髙揚暉天末煙嵐變幻金碧陸離題額曰錘峰落照聨曰嵐氣濕青屏天際遙看煙樹色水光燃素練風中時聽石泉聲聖祖御製詩錘峯落照三集平岡之上敞亭東向諸峯橫列于前夕陽西映紅紫萬狀似展黃公望浮嵐暖翠圖有山矗然倚天特作金碧色者磬錘峰也縱目湖山千載留白雲枕澗報深秋巉岩自有爭佳處未若此峰景最幽御製詩錘峰落照恭和皇祖聖祖仁皇帝御製元韻辛酉獵罷途經羽蓋留錘峯落日正深秋白雲紅樹參差處疑有寒山結宇幽錘峰落照己巳西日隱東峯天光入水底披襟松籟寒千林紛翠紫錘峰落照壬申曽愛文皇句唐太宗有初晴落景詩髙標物外情照亭浮檻晃燭浦漾瀾明理境資強立神工謝巧營倚天森玉柱擬待勒誰名賦得錘峰落照甲戌一柱標雲漢千峯最上層亭亭明夕照煜煜蔚霞蒸落景連空翠騰光入碧澄西崖翻直影東戶引間慿何必憂騷客端宜悟苾僧送將朱鳥隱挂得玉蟾升逸趣發菁藻餘輝帶綘繒神錘工體物惟是聖人能南山積雪亭在山莊正北髙據山巔南望諸峰環揖拱向塞地髙寒杪秋雪下環視樓閣髙下皎然寒玉光中謝賦所稱重璧連璐者蓋兼其勝聖祖御題額曰南山積雪山莊每峰頂各冠以亭南則錘峰落照其左為北枕雙峰少北而西則四面雲山東北則南山積雪也四亭列峙各擅佳勝而千岩之秀擷矣四時之氣偹矣聖祖御製詩南山積雪三集山莊之南復嶺環拱嶺上積雪經時不消於北亭遙望皓潔凝映晴日朝鮮瓊瑶失素峩眉明月西崑閬風差足比擬圖畫難成邱壑容濃籹淡抹耐寒松水心山骨依然在不改氷霜積雪冬御製詩南山積雪恭和皇祖聖祖仁皇帝御製元韻辛酉芙蓉十二列峰容最喜寒英綴古松此景祗宜詩想像留觀直待到深冬南山積雪壬申嶤峯何所異積素雅宜看朔氣干霄白清威羃地寒塞梅粘樹樹凍玉咽灘灘歌郢誰家子應來曲裏彈梨花伴月山莊西北曰梨樹峪以所産得名入峪平岡逶迤不覺近逺惟聞幽澗潺鳴迸落石罅行里許靜深繚曲漸入敻邃奧如窈如不知此中壺天勝界也時當春日萬樹梨花素艷幽香清輝不隔聖祖御題額曰梨花伴月內為永恬居更內則素尚齋聖祖御製詩梨花伴月三集入梨樹峪過三岔口循澗西行可里許依岩架屋曲廊上下層閣參差翠嶺作屏梨花萬樹微雲淡月時清景尤絶雲忩倚石壁月宇伴梨花四季風光麗千岩土氣嘉瑩情如白日託志結丹霞夜靜無人語朝來對客誇梨樹峪道中步輦口占四集入谷橋分三岔路傍崖步輦景何深山中獨見松林影時有清流助鼓琴其二一溪展轉見山花步步石苔楊栁斜試看目前將熟果青榛郁李並堪誇御製詩梨花伴月恭和皇祖聖祖仁皇帝御製元韻辛酉誰道邉關外春時亦有花寒香雪添豔淡影月增嘉雅稱峰頭雨何須谷口霞塗山千萬樹蹤迹漫相誇梨花伴月盤徑入深秀雲居得𤱔平春來花正放壺裏月偏眀香色雙清境希夷一晌情神仙惟自度詎必藉金莖曲水荷香亭南向在北山麓竒石參差鱗次瓦疊澗水潺潺隨石折為小沼中植芙蕖亭亭萬柄翠蓋紅葩自然香逺聖祖御題額曰曲水荷香舊在暖澑暄波北今移于此聖祖御製詩曲水荷香三集碧溪清淺隨石盤折流為小池藕花無數緑葉髙低每新雨初過平堤水足落紅波面貼貼如泛杯蘭亭觴詠無此天趣荷氣參差逺益清蘭亭曲水亦虛名八珍旨酒前賢戒空設流觴金玉羹御製詩曲水荷香恭和皇祖聖祖仁皇帝御製元韻辛酉當年睿志尚髙清非慕濓溪癖愛名重憶瓊筵陪色笑金匙常飽手調羹曲水荷香壬申鏡面鋪霞錦芳飈習習輕花常留待賞每到山莊雖深秋亦有荷花香是逺來清緗蓋迎秋直珠囊帶露擎楚人休製服同此樂衢亨風泉清聼松鶴清越之西置三楹曰風泉清聼有泉出兩山間注溪穿竇風來澗谷則聼益清逺與松聲鶴韻相答聖祖奉寧夀宫問安時所憩故有瑶池芝殿之句內為秋澄齋皇上御書聫曰素影寫波澄境原無暑清風拂林爽氣最宜秋聖祖御製詩風泉清聼三集兩峰之間流泉潏潏微風披拂滴石作琴築音與鶴鳴松韻相應泉味甘馨怡神養夀恰合章孝標松下泉詩注瓶雲母滑潄齒茯苓香瑶池芝殿老萊心涌出新泉萬籟吟芳檻倚欄蒸靈液南山近指奏清音御製詩風泉清聼恭和皇祖聖祖仁皇帝御製元韻辛酉物物都歸大造心風泉亦解奏清吟熙和六十一年化編簡猶垂雅頌音風泉清聼出石泉惟冽因風響益清虹垂飲澗勢琴譜號鐘聲江海他時赴雲霞此處生當年川上意仰識在民情題秋徴齋甲申山齋秋日坐秋景恰方徴爽氣在蘭沼霽光浮槲陵有雲惟點綴無宇不寬𢎞設問安心處玉壺都是氷秋澄齋丙戌枕上西風曉屋涼澄來碧宇滿秋光夾衣喜著單衣换吟務那侵幾務忙邇日炎暄避何有晚田雨潤望難忘京畿却報宜暘好銅雀聲中待築場秋􅊹齋丁亥氣蕭碧宇無邉淨潦盡寒潭徹底清俯察仰觀心有會奉時惟是應時行秋􅊹齋己丑天朗雲無一片凝果然碧宇到秋澄空齋恆得消斯景偶坐因之興亦騰題秋澄齋己亥今朝秋信甚分明舉目天髙氣已清雖有雲生惟覺淡每欣日照必含晶間來那計兩年别偶坐堪探六義精研淨甌香諸慮靜山齋真是副嘉名秋􅊹齋八韻辛丑氣澄天碧落時澄地溽收山澄雲斂谷川澄水淨流人澄暑退夷物澄毛毨柔一澄無弗澄而總皆緣秋我適坐髙齋灑然會心悠其中閲今昔不覺光隂遒代謝由化工推遷誰能留惟是祝宜暘西成近可酬題秋澄齋壬寅昨日立秋時值晚昨六月二十九日戌時立秋今朝即景晚來臨果然一夜分秋夏颯爾入忩暢詠吟喜是滿天開素宇幸猶三伏未愁霖副名合共蕭齋慶澄矣全消芥蒂心欽定熱河志卷二十七
