body:
  text: 物産四禽之屬鶴山莊內多蓄之有松鶴清越及放鶴亭之勝御製詩鶴鹿庚辰鶴鹿雖異類胥足助山景鶴則賦之糧惟取聲露警鹿每挾矢尋芩野寧容騁材與不材間漆園語堪省園鶴辛巳園鶴年年飽稻粱每因尋鹿試神鎗一般都是仙家畜無可欲惟爾所長聞鶴鳴三首癸未放出籠中才閲年塞山敻不讓青田因風吹送雲間響祗覺其音特自然高飛雲表落巖城疑似山莊即玊京擬問昌黎戛然者是因何不得其平原是山莊原有鶴翦翎何必檻中留遂生性復芻糧省一舉端知兩得收翥鶴三首甲申翥鶴翩􅗁掠過軒不低還復不高鶱分明自適雲山樂亦自未忘粱稻恩山城飛出又飛來大異籠中大快哉一舉吾因獲兩得何曾少却羽仙陪養成羽翼那長往祇繞山莊鳴戛然不是東坡遊赤壁揖豫宛遇皓衣仙嘲鶴鶴翼已長成翔翥皆由已朝騰山城外暮宿山城裏如此清涼境信足安汝止而何意忽遷竟自忘歸矣啄粟山田間夜遇守田子捕捉將來獻鶴顙愧有泚因憶昌黎言歆羡古之士或於周不可秦楚可之仕彼其熱中流尚識去無地叶咄哉青田姿胡乃昧此理鶴三首乙酉不教翦翮作羈縻詄蕩山莊任所之伏卵成禽有佳報放鶴將子山莊益致佳趣誰云羽類乏良知飛去飛來記昨年將雛更不出牆邊風清月白一聲唳其意肫然亦灑然澗實山葩勝稻粱天空林密任翱翔有時彳亍庭沙步印出雲章不可詳欵鶴四首丙戌放去胎禽雪翼毸回翔何不可招來王倪齧缺寧須道者箇佳賓乃稱去聲陪來往瑤臺意自仙一聲清唳徹雲天漫言縻爵心猶在霞表相延屬偶然有雪霜儀宜伴侣無煙火氣得清臞何當喚起唐伯虎為我揮毫寫入圖唐寅有欵鶴圖向入石渠寶笈上等去亦不追來不拒空聽為翥宇為翔了知欲入新詩句豈是翻因戀稻粱鶴二首丁亥飲啄何曾去逺揚翱翔原祇在山莊笑他翦翅牢籠者拂物性還費稻粱嘹唳風清還月白徘徊水裔更山椒有時樂意翩然舞曲盡形容繪鮑昭鶴戊子鶴不翦雙翅亦不逺飛揚深林大壑中瀟灑恣翱翔溪毛與澗實飽啄勝稻粱今來孚卵罷率子繞野塘其馴弗待教其喜殊異常乃悟順物性知良能自良鶴癸巳放翅聽飛去愛山仍復還山莊有放鶴亭並有詩那期稻粱報常伴渚洲間唳月聲非怨梳風態自間使無清介格亦豈異乎鷴鶴昔時放鶴深山峭一罷鶴糧與鶴料且免刀剪更籠囚大壑茂林從所樂後來復有貢鶴人賦糧給料仍因循云不如此鶴將去其實竊饋從中分養鶴則喜放鶴苦鶴雖知飢不能語廏有肥馬孟子言謂彼時人心尚古孟子云以意逆志是為得之即如廏有肥馬之言亦戒厚斂於民以養禽獸而已余作鶴詩謂彼時人心尚古者則指廏人不竊馬之饋以肥已如今之養鶴者耳然如孟子所云狗彘食人食而不知檢塗有餓莩而不知發其意當以有餓莩而不知發為重若夫狗尚或食肉彘之所食則粳粃及糞豈人所食哉且今之鷹狗監無不豫以月銀俾貫敗肉飼鷹狗而分其料使鷹狗餓斃如養鶴者有之矣使放鷹犬減其料必有竊嘆如養鶴者然且即減此瑣碎細費其所濟亦幾何固不如使天下有司明知不諱災必妥賑之為救民無窮也吁讀書者明理達政而不為章句所誤者其亦鮮矣因用孟子語故推類而言之鸕鷀山莊湖中多有之爾雅注曰觜頭曲如鈎食魚宋陸佃埤雅曰鸕鷀水鳥似鶂而黑本草謂一名水老鴉御製詩鸕鷀丁亥鸕鷀食魚鳥又弗中釜鬵觜頭曲如鈎伺鱗沙水潯人以其無用亦弗矰繳侵因惡全其生審非愛物襟持鋭偶即鹿葦叢見隱深可以試神器一發馥成禽鹿大鸕鷀小艱中去聲譬尺尋古人示其理飛衛貫蝨心鴈來賓較關內為早古稱鴈磧雁塞雁本朔漠所産今關外秋風初厲嘹唳滿空千百為羣御製詩秋夜聞鴈辛酉龍堆月白鴈聲寒氊屋清宵玊漏殘憶昨題詩坐松榭深秋見爾落沙灘早乘霜露傳邊信夜渡星河避彈丸此日賢王爭扈從不須書寄漢廷看鴈癸亥去嵗畿南人送鴈今年塞北鴈迎人因知此地寒常早却比他秋景倍新唳月有情驚客枕衝煙無意戀霜津衡陽故國三千里底事勞勞來往頻射雁彎弓射雁行雁落弓猶滿無能笑虞人底事高張罕聞雁丁卯暖氣泛楚江肅肅鴈北鄉北人謂之來南人謂之往叶塞垣寒氣早雁赴衡陽期北人謂之往南人謂之來叶乃知往來無定論隨陽豈解分主賓霜夜嘹嘹數聲度又是一畨詩意新聞雁己巳旃廬清夜分候雁數聲聞霜落才傳信塞上早霜故云沙平淺印文早來應挈子春時雁北去至極涼處換羽育雛至秋攜之以南可羡未離羣木葉洞庭下何須怨楚雲聞鴈庚辰不寐夜如何秋鴻送響多昨驚霜乍落今聽雨中過沙漠夏棲止瀟湘冬寢訛順時奚揀擇踵事有吟哦鷹爾雅翼曰在南為鷂在北為鷹一云大為鷹小為鷂考爾雅以鷹為鷞鳩又有鷣負雀注云鷂也是鷹與鷂本為二種本草曰鷹出遼海者上北地次之唐段成式酉陽雜俎記諸鷹出處有曰漠北白者身長且大細斑短脛生沙漠之北曰東道白者腹背俱白生盧龍和龍以北元一統志謂松州每嵗貢納鷹鶻又建州土産皂鷹細鷹􅱜兒􅱜兒者廣韻謂其似鷹而小能捕雀亦鷹類也今塞外山中多有之御製詩鷹癸未白露為霜秋氣冷蒼鷹祭鳥雙眸炯錦韝玉絡忽在臂回思故處失林嶺飢飽由人不由已目窮碧落常懷騁鷹師養鷹識鷹性惟以飲食司其柄不使過飽力有餘籋雲一去無回影過飢復難任擊搏追逐雉兔弗鷙猛發縱指使固如是為叢驅爵尤堪省飼鷹乙酉飼鷹良有法飢飽貴得宜飽則逺揚去飢則力難支今之飼鷹人弗令飽令飢固無愁逸揚在臂翼已垂縱之使撮雉神惢艱迅飛猛氣徒懷嗟雄技安能施以是為得計孰弗可鷹師如皋非所論但幸隼在羈食不盡其材所以昌黎悲雉本草曰雉雄者文彩而尾長雌者文暗而尾短爾雅釋雉有十四種今土人但呼尾長者為雉雞尾短者為野雞塞外凡山谷間悉有之御製詩放雉行丁亥大搜之便亦設羅有雉罹焉獲實多籠收車載率生致淹寒重試叨則那山莊林泉清且美取諸於彼放諸此開籠飛去任所之悠然逝若縱壑鯉憑觀自欣繼自笑瀕死幸生雉豈料煦嫗為仁詎所期愛物應須識其要鸝詩義疏曰黃鳥鸝鶹也或謂黃栗留幽州謂之黃鴦今無此名土人但呼曰黃鸝爾雅釋鳥中凡四見曰皇黃鳥注云俗呼黃離留一名搏黍又曰倉庚商庚注云即鵹黃也又曰鵹黃楚雀注云即倉庚也又曰倉庚鵹黃也注云其色鵹黑而黃因名皆指是鳥也御製詩黃鸝癸未候較清和一月遲山中今日囀黃鸝此聲太古自如此寧待戴顒來聽之雀本草曰雀短尾小鳥也故字從小從佳佳音錐短尾也棲宿簷瓦之間故名瓦雀俗呼老而斑者為麻雀小而黃口者為黃雀御製詩瓦雀甲申瓦雀信何謂其性依屋居有屋處有雀無屋雀亦無萬物具性靈易簡成中孚夢醒尚昧爽啅窗前呼始悟宿行宫曉景非氊廬寒雀乙酉寒雀身雖寒不離庭院間決起偶出牆率場啄粟還啁啾頗自得誰知紇那干野鴨説文云鶩野鳬尸子曰野鴨為鳬家鴨為鶩陸璣詩疏謂鳬狀如鴨而小雜白青色肥而耐寒塞外水泊中多有之御製詩野鴨乙酉野鴨亦鳬類塞灘聊且止忽罹虞人羅淹寒佐庖旨雲鶴不入烹飛宿自由已火雞亦雉類宋陸佃埤雅曰鶡似雉而大黑黃色本草謂青黑色者名䲸今塞外山中所産火雞黑身白尾紅冠赤足即鶡雞之屬御製詩火雞庚辰火雞特異雉足觀不足食修尾拖紳白通身染黛黑昻藏亦頭角璘㻞亦羽翼於野昧三嗅言家乏五德吐火幻詎真破敵術非直無須羅網施已見雌雄得宣付上林官飼養俾孳息雕埤雅曰雕似鷹而大黑色俗呼皂雕本草曰皂雕即鷲也出北地青雕出遼東鷂説文但以鷂為鷙鳥陸璣詩疏以隼為鷂埤雅曰鷹之搏噬不能無失獨隼有凖鶻廣韻曰鶻鷹屬埤雅曰鶻拳大如彈丸俯擊鳩鴿食之元一統志曰建州土産鶻鸛陸璣詩疏曰鸛似鴻而大樹上作巢大如車輪本草曰似鵠而巢樹者為白鸛黑色曲頸者為烏鸛燕羅蘋路史注引張采使遼録曰中京牛山館北去羣燕飛翔大如鳩鴿本草曰燕有兩種紫胸輕小者是越燕有黑斑而聲大者是胡燕今熱河諸處燕至秋後不復他去輒蟄入土隄沙磧中按宋無張採使遼事當是張浮休使遼録脫一休字又訛浮為采耳烏元周伯琦上京途中紀事詩曰鳴鴉大似鷹金史曰活羅漢語慈烏也北方有之狀如大雞善啄物見牛馬駱駝背間有瘡啄食之若飢不得食雖沙石亦食之鵲其一種土人稱為山喜鵲者狀似鵲而尾長如綬毛羽可觀鳩其類甚多左氏所謂雎鳩鵊鳩皆大鳥埤雅以鳲鳩為布穀以鶻鳩為鳴鳩亦作鷽鳩以祝鳩為隼亦作鳻鳩今土人呼為斑鳩本草曰斑鳩有有斑者有無斑者有灰色者有大者有小者其一種喚雨者為鵓鳩鴿居人畜之亦有野鴿本草曰名品雖多大要不過青白皂緑鵲斑數色鶉山谷草間多有之本草曰鵪與鶉兩物也形狀相似俱黑色無斑者為鵪爾雅釋鳥曰鴽鴾毌注云䳺也又曰鷯鶉其雄鶛雌痺注云䳺屬又曰鶉子鳼鴽子鸋今土人總稱為鵪鶉灤平縣境內有鵪鶉溝以多産鶉故名白翎雀元陶宗儀輟耕録曰白翎雀生於烏桓沙漠之地雄雌和鳴自得其樂世皇因命伶人碩德閭製曲以名之楊允孚灤京雜詠詩曰白翎隨馬呌晴空注云白翎草地所産是也蒿雀本草曰蒿雀似雀青黑色在蒿間塞外彌多食之美於諸雀山畫眉善鳴與他處所産不甚殊獨卵珍大僅如蓮子緑如松石亦有白色及斑褐文者土人鎔蠟實其中以為簮珥之飾鬻於關內沙雞古名鵽鳩其色淡黃形如鴿爪有毛爾雅曰鵽鳩寇雉注云大如鴿似雌鴙鼠腳無後趾岐尾為鳥憨急羣飛出北方沙漠地亦名哭厥雀唐書突厥傳鳴鵽羣飛入塞吏曰所謂突厥雀者是也本朝天聰七年八月鵽鳩羣集遼東國人皆曰遼東素無此鳥今蒙古之雀來必蒙古歸順之兆明年察哈爾額哲來降今豐寧縣等處有之啄木鳥異物志曰此鳥有大小褐色者雌斑者雄本草曰一種青黑色頭上有紅毛為山啄木御製詩山鳥乙酉山鳥山棲不自藏啁啾簷角復牆匡分明似話秋光舊解語何須藉冶長獸之屬鹿塞山産鹿最盛其角自兩義四乂六乂至八乂年久則數至八乂以外蒙古謂鹿為布古今圍場中地及府屬州縣內之山多有稱布古圖者皆以有鹿處得名每嵗行圍時獲鹿不可勝計山莊內孶息更蕃有馴鹿坡之勝御製詩尋鹿六韻己卯園內富麋鹿尋蹤遵􅜓逵步行常十里手銃那雙施一鎗即中不須再也大澤深山處習勞奮武為無虞自可耳同往且卑之所育戒多取原係園中育物亦不多傷物命也圖餐豈藉斯繩先具深義樂此不為疲尋鹿癸未麋毛毨且斑秋氣爽孱顔挾矢堪尋麌乘欙聊趂間虞無還獲鹿朋得並逢山寧為鮮肥計心存溫故間待鹿丙戌日之夕矣鹿下來命侣羣飲溪水隈山中行久識其性靜待如可招而徠斜陽漸下隂鋪地莎草如茵坐蔥翠一以延涼圖熱消一以暢觀取適意徐見麌麌􅜓蹊走小者在前大者後牝牡作隊各分朋異路居然彼亦有待之之意意如何物適其適皆太和重華尚矣詎能愛觀或類羲之鵝遲鹿丁亥遲去聲待也鹿乘餘暇徘徊亦可欣樹翻延爽籟山出護霜雲奎踽依林見􅊯咿隔嶂聞誰知思獲處詩意與平分放鹿戊子或有獻鹿者檻中籠觳觫開檻命放之山谷恣逰逐無何持鋭出林中尋跧伏牛羊何擇焉况是同為鹿仁術在擴充夔然增忸恧鹿癸巳靈囿無不有伊尼梵語謂鹿特牣焉革希領子出角解異羣跧鹿自五月解角後牝牡即别羣而處未是供庖候因非挾矢前忘機近左右寧獨海鷗然山鹿壬寅山鹿似海鷗傍人咫尺逰秋肥學虞即逺見便林投按圍場內畜産孶息名類繁夥每年木蘭秋獮上親御諸武具殪獲甚多御製有前後哨鹿賦及哨鹿獲麅殪虎射熊諸詩皆敬編入圍場卷中茲不復列麅形似麞角似鹿而短僅一兩乂塞山多有之每嵗於圍場中所獲甚多蒙古謂麅為朱爾今圍場中地及府屬境內之山多有稱朱爾圖者皆以有麅處得名其白色者尤珍御製詩瑞麅詩六韻有序辛未辛未秋獮塞上蒙古台吉必力滚達賴以此來獻色純白如雪目睛如丹砂抱朴子稱鹿夀千嵗滿五百嵗則色白此殆其類今年恭遇聖母皇太后六旬萬夀適靈獸應時而至爰命曰瑞麅而紀以詩質稟庚辛色珠躔應夀星天心慶花甲德産祝慈寧豈意甡甡屬偏成翯翯形乍辭鹿食野可比鳳儀庭性自仙人馴讀如訓見史記圖呈動物靈無須稽獸譜永此驗祥經麋與鹿相似毛作梅花斑者為麋爾雅釋鹿曰牡麚牝麀其子麛絶有力釋麋曰牡麔牝麎其子䴠絶有力狄蓋一類而二種也圍場內多鹿麅少麋迤南始有之舊説以鹿角解於仲夏麋角解於仲冬我皇上考驗物候以解角仲冬者係麈而非麋特為更正月令之誤馬史記胸奴傳曰其畜多馬新唐書奚傳曰其馬善登五代史奚附録曰馬􅦇前蹄堅善走其登山逐獸上下如飛遼史曰契丹舊俗其富以馬今豐寧縣之西即接上都達布遜諾爾牧場故馬最蕃息其蒙古諸部皆習於畜牧每嵗行圍進宴時陳詐馬教駣之觀牧事之盛古所未有蒙古取其湩與牛羊酪並資飲食而挏酒尤佳元許有壬上京十詠所謂馬酒者是也御製詩閲馬辛酉上都即元上都地鹽海答不遜腦兒即漢言鹽海也地寬平芻牧年年龍種生此日材官羣扈蹕當秋田馬並銜聲雲岡萬隊鋪霞錦露草千蹄踏玉英侍從藩王咸眩目空懷少傅作歌情閲馬癸亥肥壤挾川阿名駒恣寢訛魯詩空賦駉唐牧漫誇多比色猶鋪錦分馳似捲波太平無戰伐憑眺意如何槖駝史記胸奴傅曰其奇畜則槖駝韋昭謂背肉似槖故云槖駝漢書作槖他師古謂能負槖囊而馱物也槖駝本塞外之産漢時中土罕見故以為竒畜宋王曽行程録曰深谷中時見畜牧牛馬橐駝爾雅翼謂今云駱駝蓋音之轉蒙古謂駝為特墨飼秣得宜最為蕃息御製詩橐駝癸酉種繁鄯善多封牛食少任重其性柔畜中良産內地鮮謬稱馬狀羊為頭塞程橐載無過此色有蒼白或黃紫而今市販亦知用鈴聲替戾行連尾􅕫鳴嗜栁俗云駱駝嗜栁蒙古嗜酒不肯前長繩穿鼻騎以牽征囊百務一身具蹄胝背腫誰則憐鵝􅖪低昻過磧川圖展塞景胡瓌傳避風跑泉語乃誕漢書西域傳謂燉煌往外國流沙千餘里無水有伏流駝遇其處以足跑地掘之常得水又青海北夏有熱風傷行旅風將至駝先以鼻口匿沙中人見之則以氊擁蔽口面避其患常詢之青海諸部皆無其事少見多怪理實然詠駝癸未駝有懶乳者忽復厭其駒踶齧不肯哺弱難飼以芻待凍斃行將棄諸塗惟彼特墨赤蒙古謂駝為特墨特墨赤牧駝者也識性計有餘胡笳奏其旁哀腔鳴嗚嗚感駝心生憐乳駒乃如初藁鹽旋長成致逺收良圖口詢非耳聞此事信匪誣嗚呼駝獨非獸乎凱風之母獸不如青羊宋王曾行程録曰契丹多青羊格物論曰羊有青者南人所罕見今塞上多有之善走厜㕒間為山羊之一種御製詩青羊庚辰青羊善緣壁四蹄利如鑷躑躅巑岏間虎狼不能躡一朝失所據生捕被虞獵神惢豈跳踉喙息惟伏帖何必貪肥腯爰命育蹇苶誰辨梓樹化謾擬成都接隨圍霍集斯驚觀笑囅頰飛狐鋭頭缺口耳小尾長毛深褐色肉翅連四足其前足三爪後足五爪聖祖御製康熙幾暇格物編四集飛狐産於口外密樹林中形似狐肉翅連四足及尾能飛但能下而不能上續博物志云飛狐亦名飛生今山陜有飛狐嶺飛狐口當時必以物産得名而名勝志曰有狐食五粒松子遂成飛仙其説荒誕皆因未知天下有所謂飛狐也飛鼠首及尾皆似鼠翅與飛狐同聖祖御製康熙幾暇格物編四集口外又飛鼠與飛狐相類特頭尾似鼠形體小於狐荀子所謂鼯鼠五技而窮也虎元史稱松州知州布薩圖格舊作僕散秃哥今改正前後射虎以萬計以是知口外産虎自昔為衆今塞山多有之蒙古謂虎為巴爾圍場中地及府屬境內諸山多有稱巴爾圖者皆以有虎處得名每嵗駐蹕山莊常命虎鎗人殺虎至行圍時親御虎神鎗殪及射獲者數尤不可勝舉豹唐書地里志曰營州土貢豹尾今塞山多有之以金錢文者為貴艾葉文者次之宋沈括夢溪筆談曰豹東胡呼失刺孫今舍利孫與豹本為二類沈氏殆因舍利孫一名土豹而訛耳熊唐段成式酉陽雜爼曰豬熊其形似豬馬熊似馬今塞山多有之小者為狗熊一種大者為人熊本草謂即羆絶有力而不常見狼宋陸佃埤雅曰狼大如狗青色善逐獸今塞山多有之蒙古謂狼為綽諾府境屬內之山有稱綽諾圖者皆以有狼處得名麞形似鹿而無角説文以麕為麞崔豹古今注亦謂麞一名麕爾雅釋麕所謂牡麌牝麜其子麞絶有力豜者是也麝唐書地理志曰營州檀州俱土貢麝香五代史奚附録曰奚常採北山麝香今塞山有之爾雅注所謂腳似麕有香者是也野馬後漢書鮮卑傳曰禽獸異於中國者有野馬考爾雅釋畜有野馬注云如馬而小出塞外又云有騊駼狀如馬色青疏引字林云北狄良馬也一曰野馬是野馬即為騊駼史記胸奴傳所謂竒畜則騊駼郭璞騊駼贊所謂騊駼野駿産自北域者是也又胸奴傳有驒騱徐廣謂巨虛之屬索隱引説文云野馬屬考逸周書王會解曰孤竹巨虛孔朝注云巨虛驢騾屬然塞外不産驢騾所謂驒騱巨虛蓋野馬之類野騾崔豹古今注曰驢牡馬牝生騾考塞外無驢故無畜騾惟野騾則有之産沙磧中蒙古謂耳為齊克特野騾耳長故以名之驢塞外向不産驢今迤南之地亦有之蒙古部落惟喀喇沁有驢以承平日久復有內地連界故有其種按史記稱胸奴竒畜則驢騾又載單于與漢戰不利乘六騾馳去古之胸奴即今之蒙古也恭讀御批通鑑輯覽單于乘六騾條及御製野騾詩以驢父馬母而生騾驢非塞産故塞外無騾若野騾雖沙漠所有然野獸不可乘洵足以正前史相傳之謬牛史記胸奴傳曰其畜多牛明葉向高四裔考曰烏梁海産青牛黃牛明一統志於三衛土産下亦列青牛黃牛考明實録載朵顔三衛求入關市牛者不一蓋其時多以剽掠為業牧産不蕃也今則塞外多畜之耕犍乳牸産類繁息蒙古資其湩酪用充飲食為酥餅尤可行逺又金史地里志謂大定府産酥乳餅元一統志謂大寧路武平縣川州土産酥乳酪蓋塞外所製尤勝內地也野牛後漢書鮮卑傳曰有角端牛以角為弓俗謂之角端弓史記司馬相如傳作角􅗧郭璞謂角􅗧似貊角在鼻上堪作弓李陵嘗以此弓十張遺蘇武既云角可為弓自當為常見之獸而又稱角在鼻上殊未可信至宋書符瑞志謂角端日行萬八千里元史謂元太祖至東印度有一角獸形如鹿而馬尾其色緑作人言耶律楚材曰其名角端能四方語者此係神獸不常見後漢書鮮卑所産之角端乃野牛之類羊史記胸奴傳曰其畜多羊新唐書奚傳曰其羊黑五代史奚附録曰地多黑羊宋洪澔松漠紀聞曰羊生達靼者大如驢尾巨而厚類扇自脊至尾或重五斤或膋脂以為假熊白唐楊煜膳夫經手録曰羊之大者不過五十斤奚中所産者百餘斤元許有壬上京十詠有秋羊詩曰塞上寒風起庖人急尚供戎鹽舂玉碎肥羜壓花重肉淨煙脂透膏凝琥珀濃年年神御殿頒餕每霑儂今塞外多畜之秋冬風戾其肉謂之風羊內地以為珍味其乳與牛酪同用元楊允孚灤京雜詠詩所謂不須白粲偹晨吹乳酪羊酥塞北竒者是也山羊塞山多有之鹿身而細毛兩角盤背上有蹙紋後漢書鮮卑傳有原羊考爾雅釋獸曰羱如羊注云羱羊似吳羊而大角埤雅曰羱羊狀若騾而羣行暑天塵露在其角生草戴行代郡賦所謂羱羊養草以盤旋是也本草謂山羊有二種一種大角盤旋肉至百斤所謂盤羊者殆即羱羊也又一種毛作深黃色者為黃羊亦係野産元許有壬上京十詠有黃羊詩曰草美秋先腯沙平夜不藏解絛文豹健臠炙宰夫忙元楊允孚灤京雜詠詩曰北陲異品是黃羊注云黃羊北方所産者是也蒙古謂山羊為伊瑪圍場中地及府屬境內之山多有稱伊瑪圖者皆以有山羊處得名野豬塞山多有之宋王曾行程録曰契丹多黃豕蓋亦野豕之類蒙古謂豬為噶海圍場中地及府屬境內之山多有稱噶海圖者皆以有野豬處得名獾塞外多有之爾雅謂之猯注云豚也一名獾字林曰似豕而肥今土人呼為豬獾其小者為狗獾獺宋陸佃埤雅曰似狐而小青黑色是物本有山獺水獺二種今塞外所産者大抵皆山獺之類土人呼旱獺田犬善捕野獸塞外多畜之元周伯琦上京途中紀事詩所謂獵犬髙於鹿者是也山谷間處處有之有褐及白黑數色蒙古謂為洮賴府屬境內之山多有稱洮賴圖者皆以有處得名狐種類不一毛長而黃者曰草狐短而􆅼者曰沙狐並出蒙古其皮皆可為裘蒙古謂狐為烏納格府屬境內之山多有稱烏納格圖者皆以有狐處得名鼦與貂同爾雅翼謂貂本鼠屬故字亦作鼦東觀漢記曰建武二十五年烏桓獻貂豹皮詣闕朝貢金史地理志曰大定府産鼦鼠鼲後漢書鮮卑傳曰有貂豽鼲子皮毛柔軟天下以為名裘章懷太子注曰豽音女滑反鼲音胡昆反鼦鼲並鼠屬豽猴屬也許慎説文解字曰鼲鼠出丁零胡皮可作裘又曰豽鼠屬善旋陸德明經典釋文又稱貀一作豽考爾雅釋獸貀無前足注謂似狗豹文有角兩足疏引吕忱字林謂獸無前足似虎而黑者名貀則是異獸之名非可以為裘者寇宗奭等本草衍義又以海狗當之然所云前腳似獸尾即魚身亦與皮毛柔軟之説不合矣考晉書稱夫餘國出善馬貂豽唐書稱黠戛斯服貴貂豽陳藏器本草稱骨豽獸出西方突厥國似狐而大長尾綜核諸説似豽為今之舍利孫而鼲子蓋今灰鼠之類也至唐書地理志稱營州土貢骨􅒸一作骨咄而不詳其為何物或疑其即為骨豽然唐書於黠戛斯傳既有貂豽而又稱其獸有野馬骨咄知必非一物松漠紀聞載契丹重骨咄犀紋如象牙黃色知骨咄乃野牛之名與豽固迥異矣黃鼠元許有壬上京十詠有黃鼠詩楊允孚灤京雜詠詩注曰黃鼠灤京奇品劉績霏雪録謂北方黃鼠穴處各有配匹秋時畜黍菽及草木之實以禦冬各為小窖别而貯之天氣晴和時出坐穴口見人則拱前腋如揖狀即入穴味極肥美元朝恆為玉食之獻置官守其處人不得擅取也黃鼠之名古來所稱互異宋刁約使契丹為北語詩曰密賜十貔貍注云形如鼠而大穴居食榖粱嗜肉北朝以為珍膳味如豚肉而脆宋周密齊東野語引澠水燕談謂契丹國産大鼠曰毗狸形類鼠而足短極肥其國以為殊味穴地取之以供國王之膳自公相以下皆不得嘗常以羊乳飼之傾北使嘗擕至京烹以進御本朝使其國者亦皆得食蓋極珍重之此物亦竹􅥡獾狸之類又宋張浮休使遼録曰有令邦者以其肉一臠置之食物之鼎則立麋爛是以愛重考張舜民畫墁録曰南使至北帳前見畢密賜肥羖十枚毗黎邦十頭毗黎邦大鼠也據此則貔貍也令邦也毗黎邦也實是一物譯語有緩急輕重耳明李時珍本草綱目乃稱黃鼠古謂之鼲鼠遼人呼為貔貍亦名令邦皮可為裘領然諸書所載黃鼠俱無别名鼲子之説亦無皮可為裘之事時珍蓋臆説也欽定熱河志卷九十五
