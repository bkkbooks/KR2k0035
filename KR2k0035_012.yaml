body:
  text: 口外己亥啓程前之雨口外由來小禾黍原緑芃麥却未收了黃雲蔚滿野吐穗灌漿飽雨不雨皆可農功隨路考教養雖並重養較教為要叶居今言教難而養不可少所以切孜孜祈年祝萬寶雨五月草一日七日途間總遇晴歡娛僕役利行程固因收麥宜晹喜頗為去聲新禾望雨縈連夜達晨兹渥霈髙原下隰遍滋榮已霑便冀以時霽我亦同人無定情喜晴五月草三日霽晨已自散山雲卓午復陰細雨紛既渥遂愁或過也望晴實切不寧云夕陽忽照一天碧殢霧全消四嶺分自覺戚欣失涵養緣關稼穡太殷勤夜雨五月草六日四日連晴一夜雨逮時行候審無妨松軒聽有落簷瀑紗帳送來拂席涼憶得麥囷已收定數上聲餘蓮漏幾聲長亷纎過午勢將歇却望雲開朗夕陽喜晴昨晚晴猶夜微雨今晨雨止晚開雲雖非霪􅉈終為懼兹朗霽曦乃覺欣苔篆鹿蹤庭際見羽衣鶴唱嶺邊聞閣章待久遲時刻昨京城所發閣章應於今日未時到山莊兹遲至一時有餘蓋因雨後山河水漲阻滯耳應值山溪水漲濆六月朔日作昨日雖晴夜猶雨縱微終覺不如無今晨四宇陰仍重卓午一天雲散都正值朔辰真幸也言逢時霽實佳乎人多經事乃多畏怵惕因心敢放吾熱數日不雨赤曦敲浮雲幾片歸岫消懼雨念轉為盼雨人意何嘗有定標山莊避暑未易避戶煙輳集暖氣招鬱蒸禾黍正怒長岡田露重如濡澆大凡一利具一弊從人旅舍煩炎熇豈如廣厦據爽塏茂樹下時送涼颷適已忘衆非美德逭暑摛句當去聲解嘲御門引見月官有作月官銓部選攸殷正印要殊雜職分正合躬親重器使雜惟依擬免勞紛月選官員文職知縣以上武職守備以上令吏兵二部帶至熱河引見其佐雜等官則命留京王大臣驗看放行以省微員往來勞費雖然子羽失應戒底藉山公譽有聞今月選之例悉按班次銓除曹司胥吏無從上下其手最為公允若由部臣擇擬或出自廷推難免偏徇黨援之弊雖引對甄核定于片時然察其言動而衡之柄不下移紀綱清肅臣下不能擅竊威福所當萬世遵守也已定章程斯盡善守而弗易勉公勤夜雨六月十二日十日已快晴一雨實恰當傍晚峯吐雲入夜􅒴飛嶂炎歊忽淨滌涼爽侵帷帳細而調笙絲壯而傾盆盎其聲尚可擬其形未容狀於稼信何礙於溪或有漲然亦塞山常擇髙村無恙河工待水增順溜應可放儀封工次王家莊引河現已挑成專俟伏汛一到河流增長即可相機啓放以掣大溜日來盼望甚切二千里外心遙遙寄惆悵喜晴夜雨朝猶密布雲辰牌微霔細絲棼四山過午全開霽念到農田慰以欣熱土潤溽暑時晴蒸即覺熱山田賴有此苗怒長上聲穗結早晚仍爽涼斯則塞景别於人於稼穡兩利無乖節地是聖人貽恩實天公設對時育萬物勉敬始終徹夜雨口號六月十四日邇日蒸炎知有雨夜窗滴瀝聽簷鳴由來適可還應止況是才逢兩日晴喜晴夜雨曉猶霔油然欲作霖雖云應暑節無那望晴心卓午密雲散中天皎日臨撫兹諸事吉慰以倍生欽留京王大臣奏晴雨應時詩以志慰昨近常逢陳雨優幸而即霽每紓愁所欣京縣亦時若却悉大田卜嵗收留京王大臣奏自六月初九日雨後旋即晴霽十二三等日連得陳雨時作時止十五日天色朗晴誠可謂雨暘時若并差探四鄉大田雖土膏滋潤而炎蒸之候得此雨澤並不覺其過多低窪處亦無積水於雜糧蔬果均為有益低處並稱無積水菜畦兼可望登秋奏章各省多佳信近日山東河南陜西各省陸續奏報均于五月中下二旬雨水霑足而豫東二省則六月初六得透雨矣得此何修勵已修見虹無端復雨復憂忡傍晚雲收幸見虹可卜定晴宜暑月還希催溜暢淒風儀封工次新挑王家莊引河已成專候伏汛水長并趂西南風逼溜之勢相機啓放至今尚未奏及盼望益切逺源漲落武列北空宇橋拖蝃蝀東天地何當有淫氣失言難諱紫陽翁虹乃日光雨氣相簿而成朱子於衛風蝃蝀篇注以虹為天地之淫氣殊害於理曾於咏七十二候虹始見章詳辨之立秋六月二卜七日邇日時陰晦幸非落􅉈皆今晨忽朗霽秋節慶真諧不雨何妨掉俗以立杕日不雨則秋月雨少謂之秋掉又作秋弔亦有以立秋日雨為秋弔者收雲果是佳農謡屢徵驗農占以立秋日晴為西成豐稔之徴試之屢驗即景且紓懷七月朔日作秋節甫過秋月臨時光代謝祗侵尋氣清曦霽有餘朗天淡雲間無片陰榆宇縱觀知漢轉莎隄緩步得蛩音晶陽午曝仍婪熱催報西成亦愜心七夕萬嶂菁蔥生翠煙碧霄銀漢指坤天恰當鵲駕逢七夕又早蛛筵濶兩年那有間情為祕誓可無新詠付華篇宫中巧節長城外也得人間佳話傳熱昨近忽作涼塞外固如是長此竟安窮今朝復熱矣熱乃宜山田黃雲熟穗始天地生物心相土氣機委而人意無定逐境為戚喜安能克己私坦然順化理中元日有感例以中元祭各陵駐兹神御拜瞻憑永佑寺恭奉中元皇祖詣瞻皇考神御兹以節敬禮次因松鶴叩如在松鶴齋為前叩謁音聖母舊時寢宫今於禁悲寶座容莫覯倐越三年曷痛近憶丙申悲不勝節事徒教陳梵網秋湖無興看河燈早知空色非空色者箇難忘慙慧能夜雨七月望日晚雲閣雨勢巧讓水燈明燈事甫言罷雨絲立至傾霽來彌半月潤意愜深更滌盡邇婪熱明當爽氣迎山中二首山中四季各為風最是金􅒫致不同驅暑拒霜成萬寶小哉空説楚王雄右風山中秋半露華鮮太古林巒太古天設向人間論甲子老於寶甕紀堯年右露雨半月秋陽曝旭暉昨宵好雨曉猶霏不徐不疾真藴藉忽密忽疏孰指揮宿麥已欣播種易晚菘更喜亞畦肥隨時隨處廑農務以是為吾民所依晴秋仲非秋孟為霖每易晴散雲歸岫逺澄宇露曦晶鹿過仍留篆鵲鳴似捻笙若時真愜意以此倍欽生題唐寅採蓮圖採蓮曲始壽承藏繼得為圖伯虎唐技癢不禁項元汴見項元汴圖中識語卒成三絶各爭強江鄉景稱採蓮圖此事由來塞苑無一著饒他八月杪緑雲紅玉滿平湖塞湖荷花至八月杪猶然開放以苑中有溫泉也風土麥牟之收穫先南後北漸禾黍之收穫先北而後南關內關外所習見復北亦復以次覘山莊晚田兹始熟札薩地早事腰鐮熱河早稼七月下旬已收晚稼則八月初始刈中秋前方可畢工而諸札薩克所植田禾則七月俱登埸圃詢之蒙古王公所言僉同蓋近北霜早非早穫不為功而禾稼亦較向南者先熟非特此也哨門之地較熱河秋收約早旬日關內早稼較關外晚稼刈穫更遲又向所目覩者即此可驗風土寒暄物性早晚之不同矣得之親訊匪傳聞風土農務率可占禾黍不禁霜使非早熟其何堪麥牟本耐涼晚熟於北豈竒談不同之同乃大同造物賦物性各含寄語譜植稼穡者如斯之事其曾諳賦得鴻雁來得時字鄉試題物皆具靈性雁豈不知時適值仲秋節遂辭朔漠陲北殊雨水候候雁北在正月雨水候賔異露寒期九月寒露候為鴻雁來賔與此異月令凡四舉長言乃各摛月令大寒候又云雁北鄉蓋其時雁自南已向北至雨水節遂北歸此云來乃自北而南先至者為主寒露來賔則以後至者為賔也所言雁凡四見義各不同昨為七十二候詩並分晰闡詠之山莊如迎先兩字皆去聲帝里覺來遲雁南來此處必先見關內當遲數日也叫宇聲猶澀照波影尚疑授衣廑織婦登榖幸農師協紀關民瘼重儓且漫嗤中秋日作塞苑中秋兩度違依然圓魄發清輝酉年此日收烏什未嵗今朝克勒圍乙酉二月烏什小伯克賴黑木圖扯等聚衆生孌明瑞時為伊犂將軍聞而赴援即命其督兵攻𠞰賊衆拒守六月餘勢漸窮蹙明瑞掄鋭登陴奮擊遂於八月十五日攻克其城烏什復平定西將軍阿桂統兵征𠞰金川所向克敵乙未秋進薄勒烏圍其地為促誛最要𠞰穴寨密碉堅阻負河阿桂相機布置官軍如法築柵泅水拽橋設伏選勇分攻至夜半衆皆蜂擁而入殱賊殆盡遂克勒烏圍亦八月十五日也勒烏圍急讀之則為勒圍是均於此度節籌軍務而在木蘭聞捷者敢謂詰戎繩祖烈那重養志侍慈徽每逢佳節思親倍句憶右丞淚暗揮夜雨八月十五日佳節行成祠月筵塞天雲淨玉輪圓陰晴萬里例同夕使燕録載蘇東坡曰故人史生為豫言嘗見海賈云中秋之月雖相去萬里他日會合相問陰晴無不同者低迥千峰總一仙却到夜中醒枕夢忽聞窗外滴簷泉逾旬覺燥霑時澤愜意欣然倍悚然雨八月十八日䇿馬剛過筆架峰行宫波羅河屯平野到來重鳴鞭已喜雲容重去聲稅駕遂看雨意濃似錦滿庭霑落葉如珠幾樹貫長松此方秋麥雖弗種南望遙同慰老農雨六月初三日庚子剛覺山田微待澤大雲過午雨棼絲無聲入夜有聲繼潤物及時普物滋聽徹五更眠不忍思周千里慰應知曉來頓異昨朝景滌盡炎歊峭爽披山中一雨山中頓似秋敕幾餘暇試為遊昨嫌坂色黃如濯今攬岡容翠欲流弗啻三農歌澤渥應知萬物沭恩稠更欣逺繾江南境都報霑膏速置郵北五省直隸河南山東山西陜西均奏報於五月得雨優渥祗甘肅未據報到而江南今據薩載吳壇閔鶚元先後馳報通省甘霖大霈處處霑足秋成可期一律豐稔云云實為欣慰連陰連陰三日雨絲絲自六月初八日至初十日弗不及還弗過之時間去聲時霏真意稱去聲既優既渥得心怡山溪灧灧無暴漲苑樹青青喜濯枝此景塞中實艱至塞山逢暴雨則溪流湍激奔騰下注今連陰三日時作時止水緩溪平未至漲潦膏潤林麓實寒上艱至之事也快晴今晚正相宜雨六月十二日滯雨晴才間去聲兩日自晨達晚落絲銀每看急陳催無止却慮渥膏勢已頻經事多因成畏事愛民久故切憂民雲渝霞忽夕陽見額手慰餘益惕寅陳雨六月十八日邇日欲作霖時霏時復止幸而未致甚意已盼晴矣傍晚生族雲勢自西北起電鞭催雷車擁雨傾盆灑叶來速過亦速快霽虹拖紫寥天斂纎翳吾心淨同此喜晴六月草九日暑節而喜晴足知雨多耳然實非過多慮多豫愁已昨近每作雲時細霏即止今曉勢似盛簷溜鳴不已適值時行際踊躍恐長此卓午雲漸散逮申無餘縷叶晶陽啓光明碧天淨如洗更當夏月盡秋孟明朝始時烜兆西成變愁乃為喜七月朔日昨日璿璣判半年流陰迅勝逝波川所欣一夜達晨霽散盡片雲淨逺天夕照向東看張王二字皆作去聲讀日向西邉則山之樹陰向東長露光為武布芊眠邇來略簡拈題興裝本黃綾欲滿篇常年黃綾詩本率上下兩册今嵗因南巡題詠較多分裝三本今下本亦祗剩二十餘葉矣題項元汴東井硯項家東井猶餘硯豈是五星所聚曾閣亦山莊額天籟避暑山莊內有閣亦顔曰天籟殊其間雅用非應夜雨七月初八日夜雨符秋節是日立秋中宵枕上聽拂衾覺爾爽隔牖想其形湔暑誠云好宜農可號靈洗車思杜句恨煞是雙星杜牧七夕詩最恨明朝洗車雨不教回腳渡天河蓋嵗時雜記云七月八日雨曰洗車也夜雨七月十八日晴經數日熱重蒸微雨雖頻霖未曾夜霔方長炎似滌秋霪虞勝懼還仍都無十日得恆喜以有萬幾斯亦應定暴山溪增潦水遲來閣報是明徴翼日閣本當至薄暮尚無音信自因山水漲發故遲驛邀耳喜晴夜雨既優渥曉晴更爽朗風從西北來雲向東南騁叶意甫懼霖綿目乍欣霽象黍禾已吐穗秋陽暴資長獨是漲潦盛行旅稽來往何事不關心為之增敞恍中秋日作細雲閣雨厯終朝傍晚翳氛喜淨消萬里陰晴同此日十分圓滿又今宵平鋪塞宇全無滓朗燭錘峰不待招林外鹿鳴才遞響訝疑何處玉人簫微雨八月十九日慶節都過縟禮紛閙餘頗以靜為欣塞山靄靄雲旋布秋宇􅓴􅓴雨細棼慮匪潦途勞跋涉思當麥坂利耕耘將盈詩本疏吟咏今嵗黃綾詩本以南巡題咏較多分裝三册兹第三册已盈百葉吟咏略疏於往時無乃吾心略懈勤喜晴辛丑邇來恆喜晴所幸雨非甚京近麥收定塞外猶待稔霖久虞發青將得患失凜此晴實利麥行旅逭潦踸兩得慰一心惕承益勤恁野橋野橋架蘆囤易成亦易毁前朝西北陰此晴彼雨矣傍晚暴漲來橋即墮於水水過餘細流昨即輿梁起過河禮祗園所遲一日耳每至山莊必於次日詣溥仁寺瞻禮以皇祖所貽佛宇也依例命徹收過河詣溥仁寺拈香畢即命依例徹橋以防伏雨盛漲仍俟秋涼再架俾省繁費惜物力亦理熱山莊避暑處早晚必爽涼今嵗更副名卓午爽如常邇日始覺熱應催麥登場早或御夾紗午乃換單裳樹陰坐颯籟炎歊原若忘四山蒸為雲便雨審何妨雨閏五月十九日自至山莊連日晴雖非望雨雨欣情濯枝潤葉相容與急灑徐霏互變更梧几披藝暑全滌松簷落瀑爽新生過河咋見麥收畢禾黍優霑慶長成篋韘用癸巳恭題皇祖御用韘詩韻門前呈射年十二壬寅嵗余年十二侍每邀皇祖於宫門前呈射發矢連中恩奬仰惟十有家法肄勤尚射癸巳嵗敬以垂示皇祖御用韘二弆之篋衍川昭手澤萬年云蒙奬深恩識至今劼毖幸惟無忝澤覲掦敢或有渝心步艱中鵠已常愧自庚辰臂病後步射艱於持滿命中每引為愧而行圍藉馬力控射持仍以為常也馳可殪麋衆聽欽篋弆詞賡舊韻永懷寧為寶球琳即事天晴聊作問山遊倐忽飛來落雨稠五步一楓十步桕避霖勝彼閣還樓喜雨閏五月草四日夏日雨多何致喜喜雨知其為時矣自至山莊率逢晴便有陳雲霏即已昨夜連纎遂達晨厯辰卓午疏密繼叶是誠優渥利大田麥收况入倉囷裏而豫未免有後言魯論注云適可止喜晴閏五月草六日時作時止雨連朝恐至霪霖意已焦君子之德貴涵養似我未免失之恌尋思此實因民耳籌農祈嵗心誠勞今晨日朗雲盡散碧天如洗迥泬寥額手慰哉慰繼懼夏長秋收時尚遙熱山莊名避暑本自多爽涼邇來户口滋煙火盛倍常以是每致熱而熱却非長刀耕火種者况已遍巖岡頗藉日為暄鬱蒸乃致穰是熱寧可無對時農務詳林下披颯風亦每炎歊忘雨六月初二日閏五下浣雨逮此將十日其間偶作解非久亦非疾今曉乃霈霑占協京房吉山田正勃長髙下芃一律內地虞過多馳諭詢其實熱河竟日暑雨正於山田有益而近畿一帶又或恐有過多之慮因降旨馳詢留京王大臣等令其迅速覆奏晴昨日雨至中間亦時作止然恐為霪霖已切望晴矣傍晚雲遂散徹夜間晴美晨復雲而輕逮已雲盡徙落落碧天髙愁消繼以喜驟雨肩輿出巗齋碧霄本晴朗東北一片雲視之猶天壤輿人和雨來沿谷速行往汝速那如雲瞥眼雴􅒴放叶竪灑復橫排繁聲及急響疊溪陡巗間落瀑紛漭沆盡態與極妍千變更萬狀叶摩醯不知數關同安能倣宋劉克莊題閲同驟雨圖詩云四山昏昏如潑墨行人對而不相覿又云異哉煙霏變態中山川墟市明厯厯其摹寫殆不遺餘力然以視塞山陰晴倐忽變現之真景猶未能倣佛一二也我繖猶濕衣衆豈免鞅掌倐霽一事無因教薄行賞留京王大臣奏報雨不過多陰晴適均詩以志慰恐致霪霖驛問之前以熱河竟日暑雨降旨馳詢留京王大臣據奏邇日京畿一帶陰晴相間雨水不致過多於田禾並無妨礙云云報來晴雨恰宜時豈能一晌無生慰却見雲興乂惕斯望晴大暑原值時行候作霖實亦難免爾一雨晝夜三日連斷續疾徐率未止膩雲欲散旋復聚晦而幸明落更駛山田易泄固不妨所慮低田關以裏馳諭大吏問情形連日雨勢未已因念關內低田或致雨水過多馳諭袁守侗詢問近日保定一帶是否不致有妨田畝并日內永定河水勢增長各情形迅速覆奏更厪永定可循軌徘徊露立亟望晴萬姓之憂切一已陰金可畏乃若此其穰未誠誠易水稱老昔也吾不忍稱老謂六十七嵗以前傷哉其意過已藐今也我却可稱老惕哉末路恐難保復憶曾為壽者詠願老悲老愚之道丙戌嵗詠金剛四相夀者云幾多願老還悲老云此非愚愚竟誰古之六帝我居七考古帝王年逾七十者漢武帝梁髙祖唐明皇宋髙宗元世祖明太祖凡六帝元明二祖為創業之君禮樂政刑有未遑焉其餘四帝不足為法詳見古稀説及七旬慶典詩彼豈盡能保泰好臨蒞􅕊六年以久敢曰輕車熟路造萬畿或一之弗謹失毫釐謬千里杳邇日正書抑之戒彼諸候耳我亦曉嵐靄嵐本山之氣靄則雲之容所以靄從雨而嵐斯從風朝嵐夕靄語泛用原可通設定分朝夕謂嵐必朝而靄必夕則不可格物理未窮嵐乃山夕涼謝靈運王維語誠工謝靈運射堂詩夕曛嵐氣陰王維逍遙谷宴某序羣山夕嵐之語皆謂嵐氣為夕商隱移之朝李商隱詩徒望朝嵐與夕曛是定嵐為朝氣前此未有也實未識山中國語謂鴉阿精注嵐所從謂晚風息後降谷涼氣衝設終風弗息是日嵐無逢山莊日驗之此事人知同悉端倪為什莫非造化功立秋日作六月十八日快霽連朝實愜心自十一日晴後雖每作雲而未雨十四日陳雨出虹遂快霽至今又逢白帝報初臨西南吉協占風此每遇四立二分二至靈臺按例必報占風率逢吉占風本無定況百里不同未必可信然今日熱河則實西南風也季夏早緣遇閏今避暑已欣天曠朗入秋更覺氣蕭森陰金惟慮多生水寧可過晴弗願霖俗以立秋日大雨為秋儍主三秋多雨若竟日晴為秋釣主三秋少雨今年太嵗在辛夏間雨水霑足禾黍已極暢遂正資晴晒結實為農慶耳雨六月二十日立秋雖不雨應節弗踰三昨十八日立秋晚稼猶資潤終朝未致酣滌炎真是爽慮甚豈非貪酉刻雲容斂晴光朗萬嵐曉昨日秋霖晚快晴曉來雲盡碧天晶滿川露氣青無灧一嶺曦光白靄橫禾黍長成徹根潤菜蕎種後仰頭榮將登萬寶侯非逺此際持盈懼益并策馬䇿馬出山莊閲隄還閲稼隄緣圖安居稼實關豐化何一非為民可以深居罷大田已吐穗晚種苗芃亞武列流無定相勢籌防㵼躬勘並疇咨一行兩資藉無逸而有為晝長況餘暇平旦孟子言平旦惟戒人梏亡豈知曲阿明所被遍圓方粵宛鼓太和清明含百昌夜氣於旦見匪謂陰勝陽晝陽而夜陰謂夜氣清明人以睡夢不覺旦氣清明人以接物而梏亡之則可若謂夜氣勝旦氣則是謂陰勝於陽矣讀孟子者宜思此我每因宵衣逢斯於山莊金烏扶桑枝滄滄復涼涼露光堪淺蕪其芳襲人香林禽與原獸各自適其常何所容好惡人物胥同良出王及遊衍亦懷抑戒章山中山中秋信得來真樹張去聲清陰風爽神鳥似有情依客語鹿知無害向人親隨緣遇處皆成趣觸緒拈時總絶塵自謂勝他唐宋者六家詠未入詩醇豫選唐宋詩醇凡六家其詩中總未及此地也雨六月二十九日今日三寅餞明朝七月臨逮旬不妨雨昨二十日雨今將及旬雨固無礙但明日為七月朔日宜暘方協農占將朔恐為霖以此切思霽無聊屢視陰晚來雲散盡慰矣倍生欽七月朔日作早矣火星流月兹真箇秋塞雲山腹斂玉露草頭浮且喜心神爽那辭光景遒傍申隮薈蔚未免又關愁雨七月初二日徹夜間雲薄質明零雨微雖云逭朔忌七月朔日宜晴方協農占昨初一日幸無雨恐作霖霏聽響徐還疾看陰密也稀天衣傍午捲額慶朗晴暉喜晴小雨旋晴詠喜晴可知喜自畏中生一年能得幾回笑百嵗都過大半程空宇蔚藍無點翳秋陽騰赤有餘晶不惟逭潦兼資潤菜圃蕎町正發榮留京王大臣奏晴雨應時西成可望詩以志慰去年畿輔潦秋雨猶是辛金惕在心此每作雲必寄問今嵗自到山莊每逢暑雨必馳諭留京王大臣詢問近畿雨水情形以辛金易生水恐復似去年秋潦也昨七月初二日因熱河陰雨復經馳詢據奏前月自十六日至二十八日天氣俱極晴朗是夜至初二日得雨二次勢甚微細為時不久現在天已大晴田禾茂盛豐實其低地前經大雨者尚可趕種蕎麥不至失收民情歡悅等語為之稍慰今稱久霽悉佳音黍禾逮熟觀銍艾蕎菜補栽長去聲蔚森不啻逭霖希有嵗倉箱未納倍生欽七夕小雨即佳晴洗車暫副名不能略節物況是喻蠶耕漢苑神仙事唐宫兒女情寄邪及褻狎徒惹後人評雨七月十九日快晴將十日小雨不多時七月中旬雖二三次小雨然皆旋止不成分寸今曉濃陰布過晨細霔披已看颯景潤更喜晚田滋適可還應止綿延踊懼之晴徹夜仍微􅉈達晨未散雲因之盻時霽乍喜斂濃氛目共諸山朗心依晚稼欣多愁緣望嵗難可識為君新月一例人間月中秋月可人隔年望已久西宇見生新璜影雲霞表氷光山水勻錘峰屈指數上聲幾日麗團輪中秋日作散盡輕雲天四垂清輝萬里慶同披隨時遇景聊成賞舊日承歡有所思酉嵗戌年却孤此是二年以在二十七月中未至避暑山莊亥秋子節又踰其己亥以後仍至山莊逮今度中秋又三嵗矣電光三載幻如是桂魄七言詠可遲九日登髙作歌九日登髙傳自古興來今日吟杜甫笑他未識此中佳藍水玉山奚足伍塞峰蒼翠天泬寥潭清武列翻銀濤俯仰間可會萬理詎惟即景恣清遨試云萬理如何會髙字其義所包大天之髙也日月運地之髙也嵩岱最奉兹三者曰惟君君之髙也仍藉民徒恃厥髙弗恤下危乎危哉髙將淪名之髙者實或墮言之髙者行難隨曲髙六律和必寡堂髙數仭終就卑僂數上聲斯其小者耳然則欲髙有何美一覽七字促成章登髙降下仍兹理關外壬寅昨日雨由東北過雲腳行山亦恆理凹坂漸車略餘濘紗衣破塞度迤麗溪弗致漲田受益髙下禾黍芃如洗雖為澤惜欠渥優每不知足自責已潔矩人情胡不然為君難此一端耳山雨五月十七日山雨渾無定可期昨宵今曉疊霏絲逮今又復一時灑入地原艱二寸滋却已霑衣羣僕怨幾曾潤稼老農嘻人情忖度為田處無定心如之望之晚雨晚雨作止凡數陳頓盈溝澮瀲蹄涔雖云其涸可立待究滋禾頴與麥針入夕雲捲東南去過望月上喬松陰不足為慰仍增眄僕從却喜無潦浸留京王大臣奏報得雨詩以志慰邇看雲起每從南得雨兹欣啓奏函春夏霑膏內勝外西東度寸二和三今年春夏之間京南已被膏雨近京雖兩次被雨尚欠優渥然關內較勝關外兹留京王大臣奏京城於十七日亥時至十八日寅時得雷雨數陳城西約有二寸城東約三寸餘麥收已畢禾滋長早象雖消豐敢談批摺正斯對嘉􅉈從來於澤豈辭貪山雨五月十九日山雨自西南今畨勢甚酣厯時已過二度寸不惟三激地噴銀沫飛空掩翠嵐沃心愁略釋稼穡作真甘咏木刻屏有鶴山莊不剪翎任其飛去任居停胎仙惜此經雕刻木雁同他却肖形右鶴角弗解而毛弗毨食蘋林下自相尋似呼窗外呦呦者勝爾全無避害心右鹿熱六月朔日作初至山莊得陳􅉈渥潤三寸已不啻其後雷雨縱間作旋落旋晴日三四塞外春夏之交旱小霑究仍欠優暨侵尋弗雨又過旬竟覺炎歊騰暵勢禾黍雖已拔苗齊五日不雨將萎地近京畿南屢報澤留京王大臣及順天府尹直隸總督屢據奏報雨澤而此間經旬炎暵殊切盻望逺澤安能為近濟適來適值為民憂斯吾責豈他人事晚雨六月初一日向晚山雲四面鋪盆傾片刻霽斯須平岡劚土剛霑寸不為去聲慰哉祗益吁夜雨六月初四日昨晴已無望夜雨忽驚夢乙更至戌籌時疏時密羾殷雷空宇聞颯爽輕帷送忽覺瓦簷間琴築紛響弄疑夢欣却真曉庭土香貢朝晴夙興不能眠那待農圃問命人關地看入土霑四寸兹乃山岡上平川更無論禾黍苗已齊回蘇助長迅餘澤及原鹿新草飽芳潤今嵗塞外覺旱草未長齊此雨不惟益農蓋無物不被澤也偶見肩輿問景傍山行偶見羍麑樹根委試尋其母那見蹤應畏人多避林裏弱毛淋滲尚帶濕脆支竛竮未能徙終日無乳將餓斃設遇野狐且囓死命人遙立護視之待其母來領去耳其或牝鹿忘相尋抱去乳育亦誠美才過半時視者報牝鹿出林旋顧子舐之哺之腓字之須臾能行隨去矣吁嗴獸尚有天倫儼若人害弗知是於物不忍有若斯況敢酷吏聽用彼時臨大暑思及此赤子心皇祖避暑山莊詩辛卯同我七十二二十皇祖避暑山莊六景詩成於康熙辛卯計今七十二年矣而我十二扈蹕來即今花甲正周暨康熙壬寅嵗余年十二扈見晴蹕至此今瞬息又周壬寅詳碧亭憶舊詩其間憂樂實紛哉緑水青山本無事雖然聖日照萬年谷陵豈共光陰逝願言不失赤子心羹墻恆見亹繩繼喜雨六月十三日昨曉即生雲終日陰醖釀入夜始細霏今晨更酣暢時密復時疏過午晴未放既優亦既渥盈尺殊難狀回憶己卯嵗值旱驗陽亢三冬既闕雪春夏徒雨望步禱謁南郊蒙佑嘉􅉈貺其日同兹日己卯嵗六月十一日躬舉雨正大雩回自南郊於十二日得與今嵗月日相同而今嵗上年冬雪既優春夏亦屢得雨澤不過未十分霑足耳是以並未舉行大雩之禮兹自十二日夜雨達旦至次日未申間未止更為霑足恰與己卯同日云而兹實勝向屢雨春夏逢所欠霑足償此畨乃大霈厯久被應廣京畿及北塞秋收庶其諒額手至益懼祈年勤輔相喜晴一晝夜雨適可矣今日快晴良足喜朝猶聚散雲霏絲卓午西北風隨起薈蔚漸斂露曦光天宇空澄翠藍洗剛逭懼旱虞作霖一心無定自咎爾雖然躁急鮮雍容勤民不知疲樂此點竄張照書聫語二句因口占促成侍臣聫句猶粘壁前席無端略憶初似此精神能永注每看照書如甫就墨瀋未乾此精神所注非趙董所能也謂他趙孟俯董其昌或難如兩言即景未詳熟照書聫云四面有山皆入畫一年無日不看花不知誰所作也五字返躬因易豫四海有民皆視子一年無日不看書起句易四字對句祇易一字陳雨六月望日昨朝雲散盡今曉日騰光傍晚陰西北驅風雨霈雱旋晴真是幻當夏此其常碧宇新藍蔚生衣切嫩涼留京王大臣奏報京畿晴雨應時詩以志慰此間暘雨協遙繾念京師是日即郵報曰時占若宜早秧已勃長晚種亦興耔留京王大臣等奏報京師自十三日以前得有透雨後即於十四日晴霽早禾芃茂晚禾亦及時趕種農民甚為欣悅既慰還因懼秋成尚久遲驟雨六月十八日山雲霮䨴挾雨來始如處女後脫兔恰值肩輿谷中行倒峽傾盆紛布濩退實無當進或過油繖支撑向前赴製衣雨衣也不漏莫如瓦猶喜茂林作蔽護須臾亦復歸山齋僕役淋濕例賞素因思行軍有若斯遲疑萬事率成誤曉晴入夜猶細霔凌晨遂快晴萬山歸靉靅四宇濯光晶心以籌農慰興緣即景生拈毫成五字兩目乍因明白玉鳩頭杖口號白玉鳩頭刻杖扶即今健步尚非須山莊置待耆艾用耆艾猶能至此無批摺批摺敕時幾政務關綦要而於籌雨晹更切農功劭今年江以南大率時若告山陜及甘肅亦不愁旱潦京畿接齊豫三省蓋同調春末至夏初縱雨勿優膏逮六月上旬盈尺澤方樂此地近外藩俱已渥霈報熱河及蒙古札薩克地方均於六月初八并十三等日得有透雨十分霑足京城并直隸各屬亦據奏報一律普霑齊豫較却逺陸續兹奏到昨富勒渾奏報豫省六月十一二日大雨雱霈連宵達旦十分透足今據孫士毅奏東省於六月初七八及十二三等日連得雨澤各屬亦陸續具報入土深透秋成可卜等語大田及晚種均可秋成約更幸每快晴未致愁霖淖雖然秋尚遙惟慎志敢傲上駟院名司御馬上駟有執司殷勤調御馬卿郎分等級僕役亦弗寡天間數甚多本自殊髙下御馬為最髙尊上禮固也愛之異羣駑盡心護珍若叶細秣與生芻勤飼無時舍雖未至筐蜃僕緣實於夏却非掩不意馬喜勿驚訝叶然而習之安過猶弗及惹鞍轡值施乘平聲誰為蠅拂把偶過市以行蚊蠅紛至且他馬故如常謂扈蹕衆人之習以為常不避蚊蠅御馬難禁者未免或抵突騎熟原安雅笑而謂上駟此愛可弗假謂愛馬也即事格物理語異莊生寫按莊子人間世篇云愛馬者以筐盛矢以蜄盛溺適有蚉虻僕緣而拊之不時則缺銜毁首碎胸者蓋言蚉虻噆馬僕御因而拊之不時也刻本注音僕為普木反為撲向秀注云僕傼然蚊虻緣馬稠穊之貌又引崔撰語音如字訓僕僕御是古本有僕御之説夫掌馬之官曰太僕御車者亦曰僕音訓甚明緣即因也若如向注僕僕然不特文義支離且拊者屬之何人蓋因刻本以蚊虻僕緣讀斷是以強為牽附若韻府因讀為撲竟直書為撲緣則又訛以傳訛矣今以適有蚉虻為斷句讀則下文僕緣而拊之不時句訓解了然因詠上駟詩憶及此語郵致內府所藏宋本莊子詳加校正有此兩説而崔説所云僕御義較明晰實為先得我心因命改正韻府本并附識於此熱快晴將逮旬朱明勢騰暑興州人煙湊熱亦較前鼓山莊林木佳原有風涼所却慮扈來人豈盡得廣宇大田縱芃長上聲曝曦葉微俯以此雖自爽念衆為之憮巗雲傍午濃時行庶霈雨雨六月二十七日岡坂甫覺乾炎蒸近頗遽常年望晴際轉為望雨處四山蔚垂雲倐忽飛嘉􅉈傾倒復悠掦瀰漫亟布濩須臾簷瓦間紛落如瀑布既以湔溽暑亦更利農務旋霽颯爽涼兩得欣一遇立秋日作六月二十九日立秋無雨恐雨短雨而無止虞雨多短為不及多為過與其過寧不及嘉叶秋愁雨多弗愁短今年況值三白科俗稱九宫三白落地多雨是年七月值三白在下夏行雱霈已霑足時陽實幸宜黍禾朝來白藏正入律金風皓日輝巗阿協時惟是慰為惕七言聊當占農歌晴爽七月初二日農諺有常談勤農時記心不畏初一雨却畏初二隂昨晚作細雨入夜簷泉斟踴懼明不止為去聲之弗安衾何期五鼓晴詰曉雲歸岑徐觀石挺邊曈曨旭日臨爽氣拂素宇輕籟吹密林新秋景信佳對時開懷襟開襟詎敢驕額手謝為吟秋光秋光日日深秋氣肅千林露綴枝凝白風翻葉閃金曉寒愛初旭午熱逐濃陰霽景饒旬浹微生望雨心晚雨七月二十二日傍晚山雲四面生細絲雄竹一時傾庭前劚土剛成寸再霈為佳更繾情喜雨七月二十七日秋愁雨滯弗愁稀今嵗無端望雨霏三白方虞兆霪沴俗稱九宫中三白落地為多雨今嵗七月值之方虞雨多乃多晴望雨亦稀事也旬餘却畏熾炎暉族雲四宇乍濃布嘉􅉈萬行旋暢飛蕎菜回蘇應勃發拈吟惟是切民依爽秋孟月將盡秋炎嵗所稀幸因一雨滌合有五言揮午熱辭廣厦晨寒欲夾衣復虞霜早降塞外地寒恐八月降霜亦礙晚稼又為厪念君子貴知幾留京王大臣及順天府奏報雨詩以志慰昨覺山莊乃望霖京畿何若更縈心誰知問澤才馳信遂有霑膏來報音昨因晴霽日久恐京師望雨馳諭詢問留京王大臣及順天府兹據奏報二十七日京城得有雷雨勢甚綿密城外約入土五寸秋禾得此甘澍結實倍為堅好蕎萊均有禆益重穋晚禾粟資飽壠蕎圃菜穎蘇森吉占祈嵗能無慰慰即虞驕祗益欽秋熱秋雨今年遲秋熱今年永雨遲稼長慢熱永稼熟等秀實穎而粟有獲農家幸旱晚原爽涼山莊實仙境食蘋鹿漸肥物亦知時景中秋日作是日日食早是靈臺算法呈時前節供例申誠欽天監奏八月十五日亥時月蝕是日為中秋節應修供醮於月初上時以在初虧時前以例行之不書詎可若無事月姊謂當同日兄此次月食禮部以時值中秋節奏請文武各官朝服救護余以日月薄蝕非經行常度向於宫中皆素服拈香行禮百官亦應素服將事因降旨嗣後遇此等事雖當應穿朝服之時亦仍用素服行禮著為令更平聲過何妨喻君子修刑兼以憶齊卿須臾端正人皆仰鏡水屏山倍朗明雨八月十八日侵曉四山薈蔚皆辰過風雨遂湝湝濯枝潤葉非雄放苗菜秀蕎正渥諧且罷乘輿入深樾恰宜點筆坐虛齋解災灑道真稱吉今年八月十五日月食欽天監奏按占書八月月食秋微旱魚鹽貴又曰三日內有雨則解兹十八日得雨恰符三日之占又明日木蘭啓蹕灑道清塵尤為便利適可還應止更佳欽定熱河志卷十二
