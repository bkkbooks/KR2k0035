香松翠早秋朝縱目長天淨泬寥更愛笠亭臨絶壁便扶朱楯度飛橋座席常隨嘉蔭移山風送爽颯纎絺隱蘆鷗鷺窺垂釣擲樹鼪鼯聽詠詩玉筍平陵架小亭好山常占四時青間雲不繫悠然影野卉無名越樣馨日照孤峰生翠煙灤河水共碧空鮮寄語山靈好看待莫教佳景讓江天小金山每到小金山心神頓曠間秋深逾覺好塞上薄言還霜葉繽紛落煙蘿取次攀石橋凌碧漢擬欲叩仙關小金山作己巳徑入緑榆逺軒憑碧浪高秋初尚濃蔭雨過亂鳴濤舊句題四壁重來有二毛景光不殊昔底事足牢騷雲標披颯爽天外眺蒼茫最愛登臨美渾忘衣袂涼喬松風度籟野草露生香為問曹唐句遊仙苐幾章引水成湖面為亭據石頭略教加點綴便可學滄洲山鳥能延客莎蛩特韻秋昔年吟嘯處厯厯記清遊小金山歌辛未灤江衮衮西北來東將入海歸溟渤源逺流長故遜岷隂吸陽噓或如浙叶岷江浙江我適觀灤江此閲新秋寒新秋不異前秋景得近忘逺逸興遄河有砥柱山有金欲赴且止其意深此間嵽嵲肖浮玉惜無頭陀裴氏開叢林底須金山四面包華屋廣陵之濤似神而非者三亦惟天下獨會心濠濮樂在兹樹態峰姿况周足刻削翠影落澄波時有鼪鼯擲林木江天竒境有如此浮名小大何嗔喜倣佛山靈如是云勝彼虛詞吟不止小金山壬申縈回波淡徹踞峙峰砐硪煙散容披榛風來時落果棲巖搆虛軒每到必憩坐聖人錫嘉名勝彼屋包裹饒占山水幽何事香花妥一晌悟南華分疏了不可小金山癸酉灤江固覺非揚子試問金山是異同兩水會歸溟海後根源總在大圓中小金山甲戌巖齋颯爽試棲遲㶁湱江聲過雨時小大試將浮玊較南華齊物笑人癡題小金山戊寅蓊然嘉蔭入林閭一朵芙蓉頂結廬既豁而寥宜眺聽匪今伊昔閲居諸來原朅爾去無約下是滄江上碧虛浮玉昨年同異處澄觀了不可分疏登小金山己邜嘗聞天地間物必有對待金山峙揚子小者於斯在棗葉及須彌一真空性海翻覆手掌耳名象究誰宰忘言遊希夷放步登􅪾嶵小金山庚辰露草煙蘿步屧披三間虛榭坐移時江聲已自空去聲人意唧唧蛩音又底為石簇階基樹拂簷小軒還據小山尖偶然把鏡星星見似與題詩逐嵗添世間何物不浮名大小金山弟與兄又為民艱罷巡蹕時以高寶興泰數州縣被水申命南省官吏専心賑務詔緩辛嵗南巡石簰且復寄遙情小金山壬午秋孟匆匆去曽無題句留重陽苒苒過言復駐旌遊葉落山容瘐漲消水態柔今春浮玊上視此有遷不小金山癸未灤江東去海歸墟獨峙中流浮玉如不讀莊生齊物論每從小大擬分疏虛軒峰頂祗三間那許樓臺包却山昨嵗石簰景猶記嬴將一著是幽間山鼯跳樹如添翼山鳥銜花自引雛習習爽風拂巖落往年秋意了無殊小金山甲申每至山軒必有言上懸碧宇下江翻似茲聲色摐摐地何處著他衆妙門欄杆迥據玉芙蓉落落階前百尺松若與石簰論大小須彌棗葉早稱宗繞階石古點莓苔山果因風落幾枚底事今朝頗覺喜為看一路好秋來小金山乙酉芙蓉一朵出晴江三架踈軒俯碧淙木葉蒙蘢誰為去聲織虛舟却訝挂煙䉶露香藜藋徑偏幽開著雲窗聽水流若擬灤江拖玉帶賺襌也勝印公留小金山丙戌朴斫三楹踞石磯妙高一例是耶非灤江設更較揚子也覺居然具體微林岑擲樹有鼯鼪趂暇幽尋暢逺情剛訝虛無逮仙境隔江野店聽雞鳴小金山丁亥平臨天泬漻下俯江渺㵿既因逈為高亦因迥謂小石罅擲鼪鼯可見不可尋一叢山丹花色是雙南金景喜三秋孟暇值萬幾間一時飛逸興直到頭陀山小金山戊子有樹則槎丫有峰則岨峿一拳肖浮玉勝之以小許放眼鴻濛外彼金亦粒􅎟小金山二首己丑硉矹江中聳一洲三間蕘榭俯清秋較於浮玉斯誠小天姥嬴他作夢遊午熱原欣大田熟究宜此處坐乘涼水風爽可罷搖扇更喜吹來花草香小金山己亥臨灤一拳石稱曰金山小一亭三間屋棲巖俯浩渺我亦久未到題詩殊欠少到斯難恝置引興頗覺好拈毫試吟搜上下空明皛如在琉璃界不塵徹裏表遐想浮玉景原繫吾懷抱而吾居箇中稱小豈明道何必舉莊周物物自了了題翠雲堂庚辰四株松樹四時翠一坐書堂一賞雲何必山嵐將谷靄怒濤細浪總氤氲翠雲堂壬午鬱鬱青松列四株庭前虬蓋翠隂扶秋臨復此乘涼好月上何曽對影孤過去片時即萬古未來百嵗待斯須崇山設以商顔擬不入留侯計裏趨翠雲堂戊子别墅築灤陽依巖復搆堂有雲都是翠無樹不含蒼遊目屬空廓研精寓縹緗雨過風益峭納得八窗涼題翠雲堂壬寅階下蕭槮列四松飄然皓友又相逢衣巾不覺當夜冷枝幹寧須過雨濃近砌如張青繖蓋逺峰猶露緑芙蓉翠雲設與山雲合尺澤應教蘇渴農虬蓋亭辛巳千嶂通單徑一亭具四臨納涼成小坐延趣省幽尋寒益清秋景響含灤水音不須張翠蓋虬幹有佳音虬蓋亭甲申就松築山亭亭久松益久盤盤蓋越張矯矯虬疑走名象如風月蓋自太古有不盡復不竭用則隨人取獨是亭與松此意亦知否虬蓋亭丙戌結宇依松松十尋童童饒得布嘉隂披涼謖聽巖風入訝是何人調玉琴虬蓋亭戲題丁亥小亭隂借老松義松下風來特地嘉漫誚尋常煞風景雖然張蓋未排衙虬蓋亭戊子四面橫拖嵐翠半空平捲秋聲眺聽今朝大愜都為宜時快晴虬蓋亭壬辰四柱山亭就老松布隂罨翠自重重籟聲泛出濤如海却訝蒼虬欲化龍虬蓋亭甲午黃繖無須此處張松隂亭子稱乘涼翼然漫擬歐陽語上有青鸞儼欲翔虬蓋亭乙未紅日高遮夏亦寒灤江座下俯雄瀾頗同𢎞景青霞挹不作嗣宗白眼看虬蓋亭丙申種松已作老虬枝小坐旋看蓋影移因悟世稱百年者憬然害不視乎斯虬蓋亭己亥虬幹由來早成蓋盤盤益復翠隂森到斯便與乘涼坐那更無端計丈尋虬蓋亭壬寅一笠孤亭别幾