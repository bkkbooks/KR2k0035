body:
  text: 行宫十九喀喇河屯行宫喀喇河屯行宫地本古興州治在避暑山莊西南三十五里當山莊未建康熙十六年聖祖肇興巡典駐蹕於此嗣是歲以為常宫門南嚮五楹御題額曰秀野軒聫曰天宇晴開青嶂外人家煙起翠微中中楹恭懸聖祖御題聨曰吟詠之間兼泉清山碧以成趣畫圖所會蓋樹色雲光而入神宫基中界灤河依山帶水比之京口浮玉故有小金山之號西上則灤陽别墅水木清華景物明瑟外則萬家煙井鱗次櫛比熱河以南此為勝境規矩亦整百餘年來巡御所經榜題最富而我皇上紹庭繼事遊泳滋多蓋遵皇澗之止基匪特神臯之鍾秀也御製詩喀喇河屯行宫辛酉離宫别館接岩阿颯爽金風此一過勝地開軒山迤邐經年成蔭樹婆娑秋濃槲葉添丹綺雲斂峯尖矗黛螺猶憶當時承渥澤幾回清咏愴神多重陽日喀喇河屯行宫侍皇太后登逍遙樓褘鞠雲凝瑞靄光離宫侍輦值重陽檻臨平楚嵐煙淡窗入遙峯樹色蒼逺墅幾家荒柴閉小橋獨木野流長最欣度節邊關外也有黃花獻夀觴喀喇河屯行宫即景癸亥樓觀圖雲倚翠微苔封芝徑接巖扉入簾水態漾珠網映座山容罨琑闈天上仙鸞真可駕人間别苑那堪妃伯駒畫裏憶曽見圓嵩方壺是也非喀喇河屯行宫疊舊韻乙丑重來宛憶舊卷阿列嶂攢青雨急過山鳥似迎人箇箇野花偏對客娑娑夢猶未醒枝藏蝶篆不成文壁走螺咫尺林泉濠濮想賦詩還道不須多駐蹕喀喇河屯行宫偶作丁卯昭邱結宇敞軒楹贏得嵐光四面并花冒露開剛席展山迎客到正秋清雨霏繡壤禾添馥風度單椒樹有聲一路西成經快覩得教巖館暫怡情回鑾至喀喇河屯作己巳深秋回蹕駐灤河山館紛紛落葉多兩月風光異爾許一畨往返覺無何蒼峰㠍嶫精神健丹地蜵蜎景色和納稼築場完次第相去聲㫪還聽野人歌喀喇河屯行宫對雪閏九月十三日丙子施慶柔遐蕆事旋灤陽駐頓忽經年吉行五十較猶近喀喇河屯去避暑山莊才三十餘里冬令三朝報在前是月十五日立冬玉積峯巒迎座秀花粘林木勝春妍山容水態由來慣點綴寒霙特地鮮喀喇河屯行宫作停鞭看寶穡逐頓駐離宫况本無忙務何妨此憩躬寒潭已斂潦翠嶺間標紅舊詠聨新什光隂默忖中熱河啓蹕駐喀喇河屯行宫作庚辰習武柔遐蕆事并安輿虔奉返神京兩彌月已屆嚴節三十里而遙吉行喀喇河屯去熱河三十餘里别館卷阿依舊好寒林平逺入冬清流澌却慮拏舟冷興寄灤陽與目成是日未渡河至灤陽别墅故云駐蹕喀喇河屯行宫作辛巳暑氣入秋澄昨日草四過處署候嵐光依塞凝巖宫騎馬到松牖望山憑地逈市聲逺嵗和農務登興州沿革迹文獻有誰徴喀喇河屯行宫懷古壬午往事徴難信猶傳此黑城喀喇河屯蒙古語為黑城也軒庭新嵗月闉郭舊榛荆北界夫何藉山田已遍耕致茲詎容易益凛守基情回蹕駐喀喇河屯行宫作灤上離宫駐御輪深秋風物賞清真一彈指頃經兩月幾疊山曽見古人杞樹臨江留枿莽菊花過節尚精神塞田納稼常歌稔慙愧今來鮮碩囷駐蹕喀喇河屯行宫作癸未香風禾􅎟拂行旌按頓今朝駐黑城喀喇河屯漢語為黑城也萬疊塞山惟北拱一條灤水鎮東征松濤檻外飄音颯蘿雨巖前作點輕羽扇罷搖心地爽分明避暑報先聲至喀喇河屯行宫作甲申一谷芃芃華􅎟風依山高下見行宫良農所望惟銅雀司圉呈來總駿驄上駟於四月間徐驅獵馬至此牧養以備行圍車駕到時牽至行宫門前呈覽亦舊例也披霽心懷真是爽當秋意氣不期雄列藩路左迎鑾至都説嘉禾處處同喀喇河屯行宫作乙酉葦峪行過北轉東外藩迎駕畢來同且遲上塞秋搜狩先問今年稼穡豐蒙古向以畜牧為業今內扎薩克多有勤耕種資生計者月駟雲螭呈內廄上駟院例以春月即驅御馬至此牧養以備行圍屏山帶水駐離宫羲文猶自光楣梠昔日恩暉想像中至喀喇河屯行宫作丙戌一夜西風送峭寒曉行秋意拂征鞍前朝炎熱忘何所勝境清涼報有端按轡到來留信宿憑軒望去賞巖巒先聲真覺娛人意颯颯泠泠樹杪看至喀喇河屯即事丁亥葦峪北經寬甸平外藩依例道旁迎未遵近旨遲來惠益見同心向上誠蒙古王公每嵗在喀喇河屯覲謁今年遇閏駐山莊日久預傳諭於八月間來集以示體恤茲諸藩仍如往例逺迎且云瞻戀情切故未遵前旨云染色稼雲皆喜色作聲蛩露是秋聲午曦駐馬蒸炎熱驟雨吹涼便朗晴駐喀喇河屯戊子建置伊誰此黑城蒙古語喀喇謂黑河屯謂城喀喇河屯黑城也又訓為舊城云興恆舊迹究難明即今埤堄無從覔便是岡巒已遍耕緑蔚良田苗滋雨黃蒸實栗喜新晴山莊近矣明朝到行館依然且駐旌喀喇河屯行宫作己丑按轡觀農至黑城喀喇河屯國語及蒙古語同謂之黑城云興州沿革率難明在遼金元代當在興州境一川禾􅎟秀而實萬户耕桑樂且亨細察長官清慎績最憐赤子敬親情百年古屋新秋景不忍翹瞻睿額橫熱河回鑾駐喀喇河屯行宫即景慶典圍期胥蕆成安輿肅奉啓歸程行宫丗里駐宜近築圃九秋幸報盈潦盡灤江現洲渚雲生塞宇幻隂晴倐飛泠雨倐開霽玉積遙峯一坐橫駐蹕喀喇河屯即事壬辰早行亦早駐已半到行宫未熱先稅駕就隂都放驄黍苗含露潤麥穗向陽烘兆矣穫猶逺望殷慰覽中熱河回蹕至喀喇河屯作出以先驅蹕路清歸當後扈奉前行明知十日趨承近中小皇太后於十二日啓鑾按途行宫駐憩計草一日可至石槽兹朕於十六日自山莊回蹕按常程而行亦同日駐石槽即可詣行殿詢安詰晨恭奉回鑾違侍不過旬日而依戀之誠倍切於衷不盡萬齡祈祝誠回視山莊雲嶺外早臨灤墅錦林橫錯紅綜緑緣秋暖露重猶滋麥始萌至喀喇河屯行宫作癸巳葦峪落川平吉驄按轡行麥原方逮穫黍阪始看萌野老田間問近藩路左迎止之畢來覲前經諭令外藩王公等均於七月杪至山莊兹喀爾沁王喇特納錫苐巴林王巴圖喀爾沁貝子瑚圖凌阿敖漢公羅卜藏錫喇布等以部落較近仍來此迎謁其親上之誠有足嘉者因令其至山莊後即回俟期再來集扈圍親上足嘉誠熱河回蹕至喀喇河屯行宫即事麗正門前送鳯輿候程饒此數朝居宫於皇太后安輿緩行並駐小行草一日至石槽行宫朕於十六日啓程亦於草一日至石槽行宫問依去安草二日同至御園以小行宫不能容多人駐宿年例也今晨適返六飛矣四月恰消一瞬如背指雲莊虛擬外前覘秋野飽收餘黑城喀喇河屯即漢語黑城也計里由旬近暖日欣明點筆疏至喀喇河屯行宫作甲午襟帶灤江向野寬黑城今復駐鳴鑾昔年建置無心考此日農桑著意觀嶺樹因遙望惟緑川波雖弱勢猶漫納涼嘉蔭仍炎熾便冀蒸雲作雨􅟎雨中至喀喇河屯乙未夜霔垂簷曉發旌漸車無礙就山程農夫襏襫欣方渥僕役泥塗盼亟晴近失峰容雲角豎微侵涼氣雨絲橫藩王路左紛來接惜爾霑衣命賞行蒙古王公等逺來迎駕雨濕行衣因命分賞羽縀氊呢黃褂以示體恤至喀喇河屯行宫作丙申曉涼步輦厯平川葦峪經過翠嶺巔循例雖然仍易馬向年自啓蹕乘馬至木蘭圍畢始間御輿輦故有跋馬却輿輦草年一例便之句六旬以後時乘輿輦而行雖偶易馬不過行十餘里即至行宫耳對時却自懶催鞭行宫到以昨年似稅駕欣於午刻前别墅依然河那畔便教問景渡蘭船九月十六日避暑山莊回驆駐喀喇河屯行宫作丙申翠羽平明轉蹕輪河干别館駐逡巡憶來林態才仲夏重到山光釀小春瞥眼便為經歲事問心底是惜隂人甌香研淨多清暇點筆聊因紀此辰至喀喇河屯行宫作己亥亦復乘輿亦騎馬年雖望七敢偷安灤平得號欣稱縣昨歲升熱河廳為承德府其餘六廳改為州縣𨽻之喀喇河屯今稱灤平縣札薩迎途虔謁鑾惠近柔遐恆志切撫今思昔暗心酸分明翼日山莊到夏凊全殊著句難至喀喇河屯作庚子此日灤平縣當年舊黑城喀喇滿洲語謂黑蒙古語同或謂舊革沿原可考稱謂亦頻更破曉因啓輦趂涼早駐旌凡事豫則立是語義含精至喀喇河屯行宫辛丑分明設縣號灤平乾隆四十一年升熱河廳為承德府統轄六廳並改為州縣比喀喇河屯廳為灤平縣故熱河紀事詩有丙申升府繼先蘉之句仍舊貫原稱黑城國語喀喇謂黑河屯謂城蒙古語亦約相倣葦峪行行背後指松岡在行宫墻內款款面前迎巖齋小憩真神謐月户間開任景呈希雨望晴題四壁無非一念為民生至喀喇河屯按頓行程有定期平泉駐蹕冒煙絲山蹊􅧧迤何妨濘黍壠青蔥亦頗滋呈馬驪黃多繹繹向例上駟院於春月即驅御馬至此牧養以偹行圍故乙酉詩有月駟雲螭呈內廄之句迎鑾賔客總嘻嘻雨兼年老乘輿至一詠舊詩却愧之昔年自啓駕至行圍皆乘馬故有跋馬却輿輦草年一例便之句今年逾古稀又適遇雨因罷策騎灤陽别墅辛酉槐栁成隂别墅開軒庭人靜鎖莓苔虛窗饒織蠨蛸網略彴猶支灔澦堆山卉無名偏有艷野流東去復西回兩峯雲斂高空迥彌望川原絶點埃灤陽别墅癸亥臨水背山地青紗白板齋徑蹊將俗逺几席與清皆峯色翠當户松隂緑到階若非章奏至自許傲無懷一自前秋别經年未到山愛伊仍荔徑引我闢雲關落葉驚禽起徂雲帶日還詩人易看待最喜是蕭間稍坐松下石松聲涼謖謖露濡今秋花峰挂千年瀑天地自空濶山川多靜淑靈均會此趣所居無須卜本是廟堂人宵衣未解憂却饒山水趣佳景輒為留琴書靜白晝臺館張高秋長揖謝安羡煙霞不可儔㠍嶢矗黛螺淨沐雨初過堤色留新漲溪聲送逝波窗虛延月桂地僻足煙蘿吟興前秋似前秋人若何題灤陽别墅乙丑精舍枕溪流更復背林麓尋徑披煙蘿支窗折幽竹當秋几席清過雨花藥馥本無塵著懷自覺靜謀目興倦欲澆書石泉亦堪掬阪芷芳未歇崖楓色待丹颯然微風至侵我衣袂寒略彴欹斷岸野艇繫河干一假新秋景可以暫遊盤掃榻坐虛榭對山開綺疏觸目與靜會悠然清皓俱爽氣拂襟袖澄潭鑑眉鬚本非山中客而耽山水居把卷對古人安羡以為徒灤陽别墅丁卯玉露金風候背山臨水居捎簷青筍籜罨牖紫芙蕖泉響尋源聽詩成鑿壁書名山有宿約隔歲一相於湍流無略彴濟渡一舟通每到消塵念從知祕化工川巖獨鍾秀天地不言功欲學軒轅訪瞪乎拜下風灤陽别墅巖齋瀟灑暫棲遲回蹕欣當秋杪時岸際潦澄知水性林間葉落見山姿俯暢遙吟天宇寬捎簷竹籟戞輕寒宜人只有霜楓好添得中峯幾疊丹落葉驚風階砌填深秋煙景劇堪憐黃花不為重陽度露染霜皴著意鮮暗流激石鳴幽澗翠影扶松上綺窗洗滌塵根歸靜所好參聲色自摐摐秋色隨宜境趣賖越於深處見清嘉萬山九月三間屋不惹間情長道芽灤陽别墅己巳又來别墅早秋天未啓間齋向二年草木依然成薈蔚光隂底識有推遷濤增古柏急鳴籟潦退潨流緩滙川忽憶雲窗同眺處愁懷欲遣倍凄然灤陽别墅辛未别墅蕭間灤水陽到來依舊間秋光拏青古茂松千尺環碧高低山一房時聽鹿聲還隔嶺每看蝶影或踰牆墨壺琴薦都清潔消得敲吟引興長朝晡涼爽午猶炎節候初秋塞外占葉始作紅仍隱緑潦將就減乍平添報寒野蟈常依砌餉蜜山蜂不離去聲簷應接翻嫌略無暇峰容波態此中兼灤陽别墅作校獵言旋駐葆旗蕭間山館偶棲遲明看緑葉添紅葉默識來時作往時秋意已隨月西轉溪聲那共水東馳虛窗點筆消蘭篆不構文瀾引靜思灤陽别墅壬申疊樹層椒盡態青灤江如帶瀉清泠湧金何事稱圖畫浮玉端知在户庭四季風光無盡藏百城古帙有餘馨栖遲欲去還教住山鳥留人亦可聽灤陽别墅别館九秋清飛蓋一時駐黛色參逺山籟聲􅊹古樹