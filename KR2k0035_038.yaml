body:
  text: 行宫敞晴齋秀起堂敞晴齋山莊西北隅縁岡冠嶺構室其上御題額曰敞晴齋遊目披襟因高得逈秋空氣朗蒼碧千里於晴宜也門外有橋奇石嶔嵜高下前列古松童童如青盖左曰清綺書屋右曰繪韻樓御製詩題敞晴齋辛巳一壑自綜妙三間正敞晴適來欣霽景便與勒新名雲散若無力山迎最有情吾心喜猶别多稼近西成再題敞晴齋辛巳今日快晴實異常今朝始覺有秋光風來谷口全含峭泉出蜂腰半帶涼萬木清暉入葱舊三霄空翠落晶陽詎予獨暢遊山興多稼將登喜若暘敞晴齋即目辛巳尋勝行行陟翠椒山齋驀到敞晴霄騁懐真是欣新霽憩倦因之坐野寮啼樹閒禽疑對語隔峯馴鹿若堪招夕陽滿谷催寒靄下磴言歸過石橋敞晴齋口號辛巳皜日蕭風霽景澄層峯疊嶂翠稜稜予心亦與晴空敞方信高齋忖度能敞晴齋辛巳極北深山别一區樓臺總覺是清都秋高越致晴光敞谷奥偏留樹色殊既不常來太懶矣仍教亟去底為乎曰予猶望門牆者孔席慙同暇暖無敞晴齋壬午尋鹿到山深松齋倚碧岑敞晴真及節宿雨弗留隂紫翠難為狀笙竽總入吟不言圖意會其奈景開襟九日敞晴齋壬午崇椒策馬不知逺敞榭騁眸畢攬遐豈必題糕誇博雅真看置鹿卜休嘉出嵗時記餻上置鹿寓食禄意秋風滿谷寒千樹斜日平岡暖數家懶佩茱萸随節令法經詔我久閑邪敞晴齋癸未倚巖得迥榭對户有蒼松澗水白猶細峯林翠越濃雨圖爽人意晴喜利田農亟雨亟晴好較量實幸逢新秋敞晴齋癸未秋之徳雨雨宜晴即景巖齋敞逸情滿峪西風中伏爽時尚屬中㐲半山斜照萬林明策馬縁山不覺高迎門謖謖泛松濤野花有艷無名色知待何人作廣騷夕陽漸上樹梢頭摘句不期片刻留好趂晩涼下山去一川風色更清遒再題敞晴齋癸未前旬來敞晴秋新覺晴好今日來敞晴秋半晴久了山齋曾無愛憎情愛憎殊視因人生千峯霽烟正詄蕩不能快意翻怦怦敞晴齋甲申傍晩嵐氣爽䇿馬聊山行遂造山中齋其名曰敞晴一天朗霽煙千里近虚楹低谷色已暝高峯照猶晶所得殊勝常真足欣予情情欣詎在茲多稼将西成再題敞晴齋甲申夜雨必朝晴敞齋真暢情霽煙幻峯嶺爽籟舞榛荆庭鶴飛還落石泉響處明晩歸那須燭新月正相迎敞晴齋乙酉立馬可待晴秋山有如是既晴齋亦佳跋馬原來此蘭蹊不致濘林闗時滴水晶然晃陽光罨牖生煙紫前朝緑雲叢今日訝成綺敞晴齋丙戌巒谷斯為敞秋曦正爾晴露枝垂㶑灧風葉舞晶明能使餘炎忘去聲每欣峭爽迎菜蕎方待潤無取副茲名題敞晴齋丙戌前月常殷望雨情齋慿霽景輒怦怦秋深無可無不可乃喜晴嵐四面迎敞晴齋丁亥崇巒複岫直北隈茂林疎處開書齋山莊駐已過半月笑我今日方言來一以鮮暇一境僻似此構築胡為哉去嵗題詩宛在壁頗覺嫌晴望雨迫茲來即景乃大欣信是人情無定適敞晴齋戊子今秋時雨復時晴朅至山齋信敞情萬樹吟風籟添爽千峰照日黛含晶鶴如忽下還飛上鹿不見形祗聴聲小坐促成章便去那更格調致閒評敞晴齋己丑秋雨霑即佳無事為霖久今朝快霽定雲浄掃如帚乘涼可遊山緩轡入林藪凹處棲巖齋岰㠡隠軒牖千嶂烘晴煙心目敞虚受即景得初來來亦言旋走敞晴齋庚寅常時曠望白雲端數入聲息登來實暢觀落盡葉林山骨瘦歛開嵐岫宇情寛明牕浄几值餘暇大壑崇巖了不寒較雨量晴都過矣惟欣暖日烘去聲吟安敞晴齋壬辰石棧過雨弗作泥筍輿欸欸為攀躋四鄰雲歛樹姿現一徑煙開花氣迷山莊駐久茲始到一到適然得吾好誰云不得平則鳴試聴蟬吟與鵲噪敞晴齋即景癸巳逾月方言至敞晴却欣齋閣善循名風來林下惟披爽日上牕前持耀晶促織當秋欲吟凛野花帶露尚含榮雖然悶與閒雲散仍繾軍書煩緒縈題敞晴齋甲午恰喜秋雲晴已淨遂臨巖館敞而清不因以暇來責實那識於斯善副名萬里天光惟一碧九霄曦御莫雙晶宜暘火迫山田熟片晌依遲亦暢情題敞晴齋乙未快霽遊山至敞晴巖齋恰喜善循名到經廿日披幽徑那見㣲雲㸃太清林下有風都送爽葉間無露不含晶雨頻未致為霖幸即境拈吟畧暢情遊敞晴齋丙申邇日隂無雨今朝遂敞晴遊齋縁即景憩座喜循名秋意徐徐入雲容片片征摛毫鮮滯句心與境俱清題敞晴齋己亥敞晴雅合快晴來石棧縈紆澗㡬迴萬嶂寥蕭爽籟落千林軮軋霽煙開一時得趣真佳矣兩嵗别情亦幻哉却為去聲籌農心畧慰流隂那問遞相催再題敞晴齋己亥邇來每作雲雖雲而不雨晩田已穫畢秋菘方在圃聞之雲䕶霜雲隂則弗霜故止霜之法惟求雲於菘霜實補况茲駐山莊亦無礙行旅雲弗雲皆可即景欣晴覩萬嶂朗霽輝一牕納爾許題敞晴齋庚子巖齋幽夐弗恒到每趂快晴必一來磵戸致深意為入雲衣散浄閟同開林濃珠落人霑露泥潤篆留鹿過隈嵗有新題鄰舊句陳言戛戛去難哉題敞晴齋辛丑毎至敞晴必暢情暢情都大為去聲農耕愁懷率與徂雲浄霽景欣於慰眼呈白屋由他四羙具碧山是我二難并千峯落瀑紫煙蔚興異青蓮亦句成題敞晴齋壬寅升高降下㡬盤迴石戸巖齋坦蕩開過雨敞懷置他徃快晴即景例斯陪峯如新濯芙蓉嫩瀑似平添絃管催欲問空空生白者解増吟思待誰來清綺書屋辛巳蘿蹊縈繆石泉潺書屋蕭然得此間松籟有聲真避暑芸編無射最消閒言清見說元祠部練綺不希李義山䇿馬漫随夕靄下崇椒迴望失林闗清綺書屋辛巳一株老松當牖盤奇形翠色傲嵗寒書屋雖然號清綺了知元稹李商隠不如韓愈清綺書屋壬午老松籠屋彴横溪雨過山蹊印鹿蹄此處徵詩合虞夏三唐清綺類醯雞清綺書屋癸未野花襍樹襲香風静以為佳塞以通人謂詩評入清綺好山祗覺不言工清綺書屋癸未蒼松泛籟清野花飲露綺以之譜金石端合詩人㫖清不傷於儉綺不傷於靡賈孟二李商隠賀輩未足與言此清綺書屋甲申山房不在多高下即殊致捲幔逈延眺據榻静澄思秋花紛綺錯秋意惟清寄小憩夕照明涼靄落巖翠含青齋隔谷還可跋遊騎清綺書屋乙酉書屋秋清候巖林霞綺時纈紅還帶緑入畫復宜詩披爽愜遐望開雲引静思喬松當户翠不改嵗寒枝清綺書屋丙戌山中書屋稱清綺澗葉巖葩牕尸裏案頭詩集列三唐㡬人此道誠臻美文章大塊自天然小哉奚足數温李每來芸榻輒延停藉欲箇中悟妙㫖清綺書屋丁亥插架芸編吐浄芬神心妙會謝云云便教著句皆清綺那及當前大塊文清綺書屋己丑開牕落落納松風太古山情孰與同不涉言辭契倪筦小哉清綺詡張融清綺書屋庚寅佳山既沿縁佳處亦徙倚書屋率有書所愧研精㫖蜃牕一憑眺或復同其理松針後彫翠楓葉前餘紫即目玩景光實覺清而綺清綺書屋壬辰几有琴樽架有書獨無多暇此幽居囅然笑謂林間鹿替我尋常守碧疏清綺書屋癸巳棧道尋幽徑高齋倚碧峯入門欣白屋當戸峙青松圖畫張神趣詩書伴静供今朝有餘暇稽古畧從容清綺書屋甲午徒清斯太簡過綺亦傷淳試悟相資用堪窺以蔽津偶來秋始霽小坐浄無塵五字吟安處賢寧四十人清綺書屋乙未曲廊宛轉通有屋更齋東壁是圖書府牕延松柏風綺傷俗斯厭清積健為雄兩字味題額詩詮括箇中清綺書屋丙申綺或近乎麗濟之清乃佳誰云弗資境斯實足澄懐塵念於何得仙期宛可諧蒼松森户外每到未衙排清綺書屋己亥書屋齋敞晴樓繪韻一院中各題名便不相同觸懷頗悟詩示法攬景還知畫鮮工綺或傷纎自成麗清宜戒嗇亦非豐三唐閱遍誰能此心醉惟應蜀杜翁清綺書屋辛丑書屋小年又一時翠巖過雨罨牕披若於兩字論詩品句憶玉溪斯有之清綺書屋壬寅綺類奢不遜清近儉則固子云與其寧訓人著章句書屋曰清綺酌劑得中處綺亦弗傷華清亦勿傷素砥行及屬文相資式如玉叶俯仰契静會詎惟山水趣繪韻樓辛巳繪事奚稱佳氣韻貴生動然實人所為靈機出心孔豈如造化工無為無不總時行與物生肖翹荷天寵因悟六法兼益凛三無奉繪韻樓辛巳别墅無多據緑椒樓牕更俯萬峯標林巒迴薄皆神韻不藉丹青繪獨超繪韻樓辛巳高樓萬山裏繪事擅神工清聽去聲泉淙澗仙聲巖落風真堪娱耳目那更數青紅六法天然具升堂王氏蒙繪韻樓癸未兩架山樓接敞晴開牕萬景畢來晴畫中詩與詩中畫欲倩東坡著定評繪韻樓癸未千峯生翠霽光迎開著樓牕畫意呈借問今為何氣韻宜人端是繪金行繪韻樓甲申小小山樓纔兩間千巖萬壑座中攀畫家妙訣無多子一字曰惟於韻閑繪韻樓甲申開著樓牕納萬山丹青妙處豈人間試㸔氣韻含生動筆法羞他王蒙與闗仝繪韻樓丙戌秋山六法是誰𫝊生動超超氣韻全開著樓牕㸔活畫倪黄軸那更須懸繪韻樓丁亥六法吾亦知最艱惟氣韻即使臻其極終屬人工進豈如造物神無為無不運請看雨後晴林密及嶺峻有形兼有聲含光復含潤付之王摩詰笑失落筆分繪韻樓戊子峯姿樹態總風流氣韻居然近仲秋此景問誰能繪得素先應讓此山樓繪韻樓己丑繪事貴氣韻十知九弗到惟有化工筆無為而臻妙固非樓所能虚受足觀徼唐宋多名家不少擅形肖較斯總下風鏡影神光照繪韻樓口號庚寅底須設色資丹緑太古雲巖展面前韻語若還擬詩格郊寒島瘦或應然繪韻樓壬辰一天霽景朗新秋山若清揚林若流繪事由來稱氣韻韻生繪特在斯樓繪韻樓癸巳曦照階前花有態籟翻林表樹無閒設云繪事貴氣韻生動應難及此間繪韻樓乙未罨牖林巒霽景鮮濯青拖碧總天然寄言摹倣倪黄者生動當知氣韻先繪韻樓丙申一牖所納無盡四時之景不同將以概曰韻事誰能繪惟化工繪韻樓口號己亥二籟于喁落翠崚聴來律吕總相應大家不少獨步者為問繪斯若箇能繪韻樓辛丑畫所難工處曰惟繪韻焉色斯其生動聲則勝絲絃却匪丹青染本來林壑詮告他嗜古者絹㡧豈須懸繪韻樓壬寅拾級書樓偶趁閒開牕朗景對晴山天然六法非渲染氣韻超於生動間秀起堂西峪中峰特起列岫層巒奔趨拱極據峯為堂備攬諸勝其始循崖而上者曰經畬書屋芸香霏座恍如宛委藏書東北樓曰振藻拾級再上乃陟堂階四面嵐開翠合萬朶青蓮如生足底登臨振衣疑在天半也御題額曰秀起堂堂外石橋横度碧溜斜通曲檻周遭迴廊高下堂後山如屏障雲際一亭額曰眺逺俯視但空濛一氣御風憑虚而堂返在下矣御製詩題秀起堂壬午去年西峪此探尋山趣悠然稱我心搆舍取幽不取廣開牕宜畫復宜吟諸峯秀起標高朗一室包涵恱静深莫訝題詩縁創得崇情蓄久發從今秀起堂壬午碧嶺四圍全作障中峯秀起獨成堂牕間見鹿任眠跂林下無禽不頡頏著色畫張楓葉紫宜時風送桂花香得詩便擬肩輿去却笑勞勞有底忙小憩秀起堂得句壬午雨過寥天喜快晴肩輿聊作問山行路從西峪得猶創堂據中峯業已成泉出澗邉幽脈益風來林下颯涼生起予愛此真佳處秀占人間有玉京秀起堂癸未中峯忽秀起朗榭似懸居爰處宜四季周流觀六虚鹿蹤來近砌鳥語隔斜疏巖下風含爽時堪一檢書題秀起堂癸未西峪連朝因熱置曉涼偶作問山來高齋恰是新秋到萬嶂欣㸔過雨纔潤溽之中含颯爽雲霄以上與徘徊鳴林鹿報金􅒫喜不識人間宋玉才秀起堂癸未曲徑中宏達好山四面迎爽風披茈虒皜日耀峥嶸雖曰引遐睇而皆契静情分明稱秀起安得置吟評秀起堂甲申四圍翠合遙拖嶺中間秀起獨成堂石級高攀遂據榻山村望見還隔牆萬頃與翼兆稔嵗一天寥朗澄秋光信筆書之欣所遇何須故事徴縹緗再題秀起堂甲申一逕翠中分山堂逈出羣何當坐九夏無事讀三墳劚土已成石嘘煙便作雲忽㸔盆桂設去嵗此清芬題秀起堂乙酉駐蹕聊欣一晌閒心儀秀起事躋攀山容匹鮮行輿易詩句題多落筆艱嵒齬有花皆露滿林岑無樹不雲閒最佳詎可生留戀罔克攸分大合閑秀起堂口號乙酉秋老意特秀山空望若起而我坐書堂會心亦在此秀起堂丙戌萬嶂蔥朧中起秀一區廓落似懸居尋常漫擬清無比俯仰方欣静有餘庭際鶴寧藉車載林間鹿不掛牌書河源雨過憑牕㸔嵒齬從新濯翠蕖秀起堂丙戌待欲言竒轉復竒千巖起秀座中披雲霞以上崇情寄俯仰之間陳迹為林下常來諳鹿性牕邊閒坐愛山姿遣懐聊爾三唐攬此妙憐他無一知秀起堂丁亥西峪最佳䖏山堂逈若懸牕中數上聲麋鹿砌下吐雲煙露坂鋪紅錦晴峯矗翠蓮句非秀以起亦可置吟篇秀起堂戊子秀起衆山頭到茲必憩留舊年如昨日今嵗又新秋萬樹嗚相荅千峯翠互流適來清蹕路一髪見西溝坐堂中廣仁嶺及西溝皆可望見秀起堂己丑西峪茲初到書堂據逈厜果然秀無比率致起遐思空翠罒隣落秋雲一縷馳留當作雨好蕎菜待霑滋秀起堂對雨己丑肩輿入巖雲過午復作雨迥堂小憩坐連纎織空宇素色挾颯聲艱繪誰能譜山雀避瓦簷野鹿翳林莽目涼炎若忘意澹静堪侣茍不跋濘蹊此景得何所秀起堂庚寅中隆岧岪若懸居拱揖羣峯盡俯諸紅葉知從緑葉染秋山覺比夏山虚鹿聲聞尚隔叢樾黛色㸔如入朗疏此日昨年漫論彼行雲流水例酬予秀起堂辛夘先至其他姑舍諸山堂真比衆超如近峯逺嶺秀無盡秘思研辭起有餘将擬披襟頓延爽試教搴幌迥含虚拈毫得句肩輿去孤負誰㸔架上書秀起堂壬辰秀起不可孤坐來景實殊風前九夏冷雨後萬山濡縱目無塵趣契心有道樞隨縁荅五字亦豈費拈鬚秀起堂癸巳四圍山色鬱蒼蒼秀起中央迥築堂今嵗喜纔今日到昔題多共昔年忘峯姿樹態張圖畫目撃心存伴縹緗習習巖風拂檐梠襟披夏五頓生涼再題秀起堂欲知秀起絶妙䖏興趣番番致弗同恰似饑餐渇飲者不離動會静觀中千章牕外巖林緑㡬簇階前野卉紅迴占嶺巔碧霄近咄哉大禹慙去聲卑宫題秀起堂甲午西峪最深且最高騁懷因迥得於韜故知蓄極發必勝亦戒欣斯傲以豪一宇平臨白寥泬千林俯捲碧波濤古來手筆多難數惜彼拈吟未此遭秀起堂乙未四鄰圍秀中岡起適有書堂構於此輿來頗覺路幽深床據乃欣山在底青縈碧邏指顧間縱目其表徹其裏是理窟乎是文津我亦悠然㕘厥㫖題秀起堂丙申千巖葉態與枝姿總是書堂秀起奇淺翠濃青資造化詩裁畫格入神思殊觀應識自太古此遇欣於又一時每到山莊斯據榻欲因啟秘遞吟之題秀起堂己亥往嵗初來即有詩向年莅山莊之日率即至此堂題什今年距初到半月餘始至西峪於堂中憩詠其遲非無故也今年閱半月云遲已因涉新景無暇如廣元宫山近軒皆丁酉戊戌未來所新成者又因明嵗班禪額爾徳尼喇嘛來此祝奉為之建須彌福夀之廟尚未成亦時去閲工更恐攬陳迹惹悲佳䖏豈終弗一到此時誰識有千思即看四壁粘吟翰多是承歡掖輦詞秀起堂有感庚子到此年年有句留茲來那可恝然不風聲虚牖凉常度山色空庭翠若浮隔嶂鹿鳴音未壯鹿至八月相鬭其聲始壯拂花蝶舞態偏柔題詩四壁驗今昔待欲巡吟怯舉頭題秀起堂辛丑肩輿得得陟崔嵬片刻山堂亦到來七字詩情同夏永四隣畫趣共雲開超然自與他峯别美矣偏宜對席陪泐壁題楣新舊錯艱乎著句慮重儓題秀起堂壬寅西峪斯堂稱最高不恒至慮衆人勞可無逸句酬超景却異閒情著廣騷露潤風涼心畧慰林青坂緑意方豪自經課雨量晴裏一嵗舒眉得㡬遭經畬書屋壬午面山書屋號經畬詠有山泉閲有書不是研田擬唐庚墾欲因義路效兒寛鋤五車學富何希彼兩字君難足起予㡬度來來消㡬刻箇中安得樂三餘經畬書屋疊前韻壬午塞山如罫孰為畬書屋高無須蠧書每事惜隂較分寸常思克已擬耘鋤芸牕旦夕堪容與靈囿煙雲恒跋予設以農功喻學業祇求多稼不求餘經畬書屋癸未到處有書屋深山中最宜芸香霏四座經訓絶多歧稽古常企彼居今毎愧斯何當不出户滌慮讀農羲經畬書屋癸未書屋四時宜夏徂秋始之因翻青簡在益惜白駒馳過雨瀑千澗斂雲天一涯璿璣運不息圓蓋本無私經畬書屋甲申古帙清秋宛可親優游饜飫静無塵忽然欲問經畬者誰是不徇名利人經畬書屋丙戌借問菑畬何所攻五三六九詎皆通吾惟切已求真益一部言經用不窮經畬書屋丁亥灑然書屋宜久坐新與為知故與温却弗恒來來便去顧名豈不愧斯言經畬書屋戊子峯巒岞崿一牕虚到即言旋那久於書屋似應顧予笑㡬曾經訓此菑畬經畬書屋己丑有容恒是得神寧不陋休誇惟徳馨戸外山容疊方罫是菑畬者定何經經畬書屋壬辰就山高下構軒楹題額因之輒異名入室隨方堪象玩據床返已愧經横潤增巒巘初過雨爽挹衣衫喜快晴一晌斯之未能信㡬曾枕葄細研精經畬書屋即事癸巳遺書搜索佐文治大典因題永樂時昨下詔訪求遺書安徽學政朱筠言翰林院貯有永樂大典中多秘藉及檢閲果然惜其依韻旁羅貪多濫列體裁不能精當因𣲖翰林等分校命内廷大學士等總其成悉取大典所載完善本及内府舊儲外省採購各種詳為校勘分别應刋應抄案經史子集分部彚目名曰四庫全書並取大典所載世所罕見之書以次呈閲仍酌其醇駁題詩卷端評正之特簡綸臣任總校並掄翰苑各分司十年為限程寛矣四庫雖殊經本之士不通經不足用况予身繫作君師經畬書屋甲午書軒擇向建到亦坐移時無暇峯圖攬有閒芸簡披鹵耕彼當戒絜矩我應知貧士經畬者酬豐責在誰經畬書屋乙未三間樸屋倚嶙峋額以經畬亦有因如罫層巒研田界欲斟垂瀑墨池津韋家不羨滿籯富徐氏無慙負耒貧四庫而今經檢勘斯文知在讀書人經畬書屋丙申振藻樓廊接書屋屋檐却自額經畬箇中誰識端倪具求藻應於經始諸經畬書屋己亥有册在棐几有函在竹格而我儻然來坐每不温席安得饜飫暇味此經史籍無異荒唐耕孤茲寸隂璧念彼傭書人遑耽晏遊適振藻樓壬午樸堂既高豁曲樓復窈窕平陵入屋中縁梯降雲表景奇意亦新顔之曰振藻巒情將樹態興會殊不少却笑錦囊人較此𣺌乎少振藻樓壬午淺紫深紅緝萬枝書樓即事引清思春華秋實胥權置請㸔東平振藻時題振藻樓癸未澗卉巖葩織錦紋箇中饒是挹清芬寄言振藻求工者争似天然大塊文振藻樓癸未山樓何有有詩書新景空澄意與舒秋實方來真覺好春華試比定何如振藻樓甲申每嵗來巡必值秋千山朗日翠煙浮問誰欲繼歐陽賦振藻應須陟此樓振藻樓丙戌秋曉巖林布嘉䕃風前埭卉舞芳㽔文章大塊蜚真藻公幹還嗤費綺思振藻樓丁亥山樓出樹杪亦復有山包境自古今爾理叅動静交含英期實得振藻貴虚抛設畀杜工部無心作解嘲振藻樓戊子山樓萬景固常披皜日清風又一時占却仙莊七十二避暑山莊前三十六景後三十六景凡七十二皆有詩行將振藻始於斯振藻樓己丑林態峯姿總入竒鋪霞摛藻恰相宜層樓隠似無言笑太古山中那有斯振藻樓口號壬辰開著樓牕萬景披流青飛翠互偨池等閒不擬拈湘管大塊文章振藻時振藻樓口號甲午憑攬書樓又一時逺峯近壑總呈竒祇應黙坐休輕詠以静存之意㑹之振藻樓乙未拾級高樓萬景披亦清真也亦雄竒於斯祇合擱吟筆富媪方當振藻時振藻樓丙申振為流動藻為華詩品亦惟備一家三字箴如悟根柢不多些子在無邪振藻樓口號己亥四壁題詩率已多别生清㑹㑹如何日中則昃月盈蝕振藻知當戒太過振藻樓辛丑拾級偶當㡬暇時㑹心七字促成之眼前藻繢天然景添足何須抽秘思振藻樓口號壬寅雖云果實由花藻花用應輸果用資樓額振誠因即景家丞庶子尚當思眺逺亭作歌壬辰趁爽更復躋崇椒樹葉翻風涼意滿雖然亦眷勞輿人恰憩山亭顔眺逺眺逺詎止玩山林絜矩之道古應斟衣食大欲民可畏雨𤾉時若天難諶况茲金川正有事遙遙西望常厪意禁暴安民不易籌旰宵企待㨗音至欽定熱河志卷三十八
