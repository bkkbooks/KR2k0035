body:
  text: 欽定四庫全書欽定熱河志卷十四巡典二四十一年六月己未上奉皇太后啓蹕巡幸塞外丙寅出古北口閏六月甲午駐蹕熱河下營七月壬子上自熱河啓鑾行圍八月戊子駐蹕都呼岱昻阿翁牛特郡王班第來朝第所居上以班地舊名營谷不佳因勒錐圖賜名巴顔諤甲辰入古北口戊申上奉皇太后回宫四十二年五月己巳上啓蹕巡幸塞外六月丁丑出古北口己亥駐蹕喀喇河屯癸卯入古北口七月乙巳朔上回宫是月庚戌上啓蹕再幸塞外癸丑出古北口丁卯駐蹕熱河上營甲子幸湯泉丁卯回駐熱河上營辛未上自熱河啓鑾行圍八月甲午回駐土城丁酉賜來朝喀喇沁翁牛特敖漢奈曼扎嚕特烏珠穆沁浩齊特蘇尼特喀爾喀諸王貝勒貝子公額駙台吉等銀幣鞍馬及隨圍喀喇沁官兵銀幣有差九月辛酉入古北口甲子上回宫四十三年六月乙亥上啓蹕巡幸塞外壬午出古北口壬辰駐蹕喀喇河屯七月壬寅上幸樺榆溝辛亥回駐喀喇河屯乙卯上御行宫門親灑宸翰扈從大學士翰林等侍上曰朕自幼好臨池每日寫千餘字從無間斷凡古人之墨迹石刻無不細心臨摹積今三十餘年實亦性之所好即朕清書亦素敏速從無錯悮凡批答督撫摺子及硃筆上諭皆朕親書並不起稿其事之稍有關係者雖歲月經久亦不遺忘故批發之旨俱存所司朕處全無底稿也時扈從大學士翰林等奏與書臣皇上巡幸塞外幾餘遊藝惟射等日侍神射發無不中伏懇所請賜仰瞻上允御書時並宫門大御行小字頃刻數十紙諸臣聚觀無不驚喜丙辰駐蹕熱河上營八月乙亥上自喀喇河屯啓鑾行圍癸巳駐蹕英必喇南岸甲午翁牛特郡王額駙倉津等進宴賜倉津及所屬官兵銀幣有差九月辛亥駐蹕汗特穆爾逹巴罕昻阿賜來朝科爾沁翁牛特巴林土默特敖漢奈曼阿嚕科爾沁克什克騰烏珠穆沁浩齊特阿巴噶蘇尼特諸王貝勒貝子公台吉等衣服銀幣鞍馬及隨圍喀喇沁官兵銀縀布匹有差己未入古北口癸亥上回宫四十四年五月丙戌上啓蹕巡幸塞外庚寅出古北口六月丙辰駐蹕熱河上營七月乙亥駐蹕喀喇河屯己卯上自喀喇河屯啓鑾行圍八月丁巳駐蹕固爾班庫德哩賜來朝科爾沁喀喇沁翁牛特土默特敖漢奈曼阿嚕科爾沁烏珠穆沁阿巴噶阿巴給納爾蘇尼特四子部落鄂爾多斯喀爾喀諸王貝勒貝子公額駙台吉等銀幣鞍馬及隨圍喀喇沁官兵銀縀布匹有差己未回駐博羅河屯庚申上自博羅河屯啓行閲各處孳生牧羣及左翼四旗察哈爾等生計己巳入張家口九月丙子上回暢春園四十五年五月戊寅上啓蹕巡幸塞外乙酉出古北口七月庚申駐蹕熱河上營庚午駐蹕喀喇河屯庚辰上自喀喇河屯啓鑾行圍壬午駐蹕拉們噶山命天津總兵官師懿德宣化總兵官康泰等校射賜三等侍衛哈逹納護軍校金保住等衣各一襲癸巳幸巴顔諤勒錐圖是日翁牛特諸台吉及衆蒙古列跪道左奏言臣等翁牛特地方生計素艱蒙皇上遣官訓以謀生禁止盜賊又加養育賜孳生牛羊臣等俱各得所今公主下嫁郡王倉津又蒙榮無此合詞迎聖駕親臨光駕歡聲動地丙午駐蹕赳和洛命大學士會同內務府總管議建喀喇河屯駐防官兵營房因兵部奏官兵營房議令古北口提督設法建造上以提督設法必至扣餉纍兵故有是命九月戊辰回駐拉們噶山賜來朝科爾沁喀喇沁翁牛特巴林土默特奈曼烏珠穆沁阿巴噶蘇尼特喀爾喀諸王公額駙台吉等衣縀及隨圍喀喇沁官兵銀幣有差己巳回駐喀喇河屯甲戌入古北口己卯上回暢春園是年十一月甲戌上啓蹕恭謁孝陵再幸熱河甲申出喜峯口十二月戊子行圍殪虎駐蹕三道河己丑行圍殪虎駐蹕中六溝庚寅行圍殪虎駐蹕二溝壬辰行圍殪虎駐蹕黃土坎癸巳行圍殪豹駐蹕熱上營甲午行圍殪虎駐蹕喀喇河屯丁酉行圍殪豹二駐蹕恩額穆噶山戊戌行圍殪虎一豹一駐蹕三岔口己亥入古北口壬寅上回宫四十六年六月丁亥上啓蹕巡幸塞外庚寅出古北口七月壬子駐蹕熱河上營壬戌駐蹕喀喇河屯丁卯上自喀喇河屯啓行巡視諸蒙古地方賜來朝科爾沁郭爾羅斯都爾伯特扎賚特翁牛特巴林土默特敖漢阿嚕科爾沁烏珠穆沁浩齊特阿巴噶阿巴給納爾蘇尼特四子部落烏喇特鄂爾多斯喀爾喀諸王貝勒貝子公額駙台吉等衣縀有差十月乙酉駐蹕拜甡台蒙古王公台吉等各率所部進獻馬駝上却之衆頓首固請奏言臣等祖父以來數世受所及臣聖主隆恩撫恤豢養俾各得等遭噶爾丹之變父母兄弟妻子不能相保蒙口皇上軫念特遣大臣收養離散人又種比年頒賞銀米布帛牲畜使永立生業教之播馬匹蕃滋衣食豐足高厚之恩萬難仰報今收納則聖駕巡視邊塞臣等進獻生息之物倘蒙仰沐洪福嗣後馬匹愈加蕃盛矣奏入諭曰朕今教養爾等人皆富庶物盡蕃滋爾等竭誠進獻朕心嘉悅即與收納無異嗣後爾等其益勤生計圖維滋息始副朕愛養至意庚寅回駐熱河上營乙未入古北口戊戌上回宫四十七年五月丙戌上啓蹕巡幸塞外己丑出古北口六月丁未至熱河行宫七月壬辰駐蹕喀喇河屯乙未自喀喇河屯啓鑾行圍九月壬午回駐喀喇河屯乙酉入古北口乙丑上回宫四十八年四月丁卯上啓蹕巡幸塞外庚午出古北口五月甲戌至熱河行宫辛巳幸上板城壬午回駐熱河行宫丙戌幸上板城戊子回駐熱河行宫六月癸卯駐蹕喀喇河屯乙巳回駐熱河行宫七月戊戌自熱河啓鑾行圍九月丙子回駐博羅河屯賜來朝科爾沁郭爾羅斯扎賚特土默特敖漢奈曼扎嚕特阿嚕科爾沁烏珠穆沁浩齊特阿巴噶阿巴哈納爾蘇尼特四子部落鄂爾多斯喀爾喀厄魯特諸王貝勒貝子公額駙台吉等冠服銀幣及隨圍蒙古官兵銀布有差戊寅回駐熱河行宫甲申自熱河回鑾丁亥入古北口庚寅上回暢春園四十九年五月乙丑上啓蹕巡幸塞外戊辰出古北口癸酉駐蹕樺榆溝閲吉林黑龍江官兵射丁丑至熱河行宫命內侍侍衛等恭請皇太后避暑塞外六月乙未朔命諸王子恭迎皇太后駕於王家營丁酉上自熱河行宫至樺榆溝恭迎皇太后駕戊戌上奉皇太后駕至喀喇河屯是日上先行至熱河行宫己亥皇太后駕至熱河行宫七月甲寅上自熱河啓鑾行圍八月甲申回駐博羅河屯賜來朝科爾沁喀喇沁翁牛特巴林土默特阿嚕科爾沁烏珠穆沁阿巴噶阿巴哈納爾蘇尼特鄂爾多斯喀爾喀諸王貝勒貝子公台吉等銀幣鞍馬及隨圍蒙古官兵銀布有差丙戌回駐熱河行宫九月甲午上奉皇太后自熱河回鑾戊戌入古北口辛丑上奉皇太后回暢春園是年十一月乙巳上啓蹕恭謁孝陵再幸熱河戊午出喜峯口庚午至熱河行宫賜隨圍蒙古官兵銀布有差壬申自熱河回鑾乙亥入古北口戊寅上回暢春園五十年四月庚辰上奉皇太后啓蹕巡幸塞外丙戌出古北口五月己丑至熱河行宫七月丙辰上自熱河啓鑾行圍九月己丑回駐博羅河屯賜來朝科爾沁喀喇沁翁牛特扎嚕特烏珠穆沁浩齊特阿巴噶阿巴哈納爾蘇尼特烏喇特鄂爾多斯喀爾喀厄魯特諸王貝勒貝子公額駙台吉等銀幣鞍馬有差庚寅駐蹕中關賜隨圍蒙古官兵銀布有差辛卯回駐熱河行宫辛丑上奉皇太后自熱河回鑾乙巳入古北口戊申上奉皇太后回暢春園是年十一月辛丑上啓蹕恭謁孝陵再幸熱河辛亥出喜峯口十二月乙丑至熱河行宫丁卯上自熱河回鑾庚午入古北口癸酉上回宫五十一年四月丙子上奉皇太后啓蹕巡幸塞外己卯出古北口壬午至熱河行宫五月壬辰上自熱河幸湯泉丁酉回駐熱河行宫八月癸丑上自熱河啓鑾行圍九月庚寅駐蹕納木桑扎塞賜來朝科爾沁喀喇沁翁牛特巴林土默特敖漢扎嚕特阿嚕科爾沁烏珠穆沁浩齊特阿巴噶蘇尼特鄂爾多斯喀爾喀厄魯特青海哈密諸王貝勒貝子公額駙台吉等銀幣鞍馬及隨圍蒙古官兵銀布有差癸巳回駐熱河行宫壬寅上奉皇太后自熱河回鑾丁未入古北口庚戌上奉皇太后回暢春園是年十一月甲辰上啓蹕恭謁孝陵再幸熱河十二月壬子駕出喜峯口丙寅至熱河行宫賜科爾沁翁牛特諸王貝勒貝子公台吉等銀幣鞍馬及隨圍蒙古官兵銀兩有差戊辰上自熱河回鑾辛未入古北口甲戌上回宫五十二年五月丙戌上奉皇太后啓蹕巡幸塞外己丑出古北口壬申至熱河行宫閏五月乙卯賜熱河耆老銀兩有差己未上自熱河幸湯泉甲子回駐熱河行宫七月丙寅上自熱河啓鑾行圍九月己酉回駐博羅河屯賜來朝科爾沁喀喇沁翁牛特巴林敖漢奈曼阿嚕科爾沁克什克騰烏珠穆沁阿巴噶阿巴哈納爾蘇尼特鄂爾多斯喀爾喀厄魯特諸王貝勒貝子公台吉等冠服銀幣鞍馬及隨圍蒙古官兵銀布有差辛亥回駐熱河行宫丁巳上奉皇太后自熱河回鑾辛酉入古北口甲子上奉皇太后回暢春園是年十一月丁巳上啓蹕恭謁孝陵再幸熱河戊辰出喜峯口十二月甲申至熱河行宫丙戌上自熱河回鑾己丑入古北口壬辰上回暢春園五十三年四月辛卯上奉皇太后啓蹕巡幸塞外戊戌出古北口五月辛丑朔至熱河行宫七月丙午上自熱河幸湯泉壬子回駐熱河行宫八月乙亥上自熱河啓鑾行圍九月壬子回駐熱河行宫乙卯賜來朝科爾沁扎賚特喀喇沁翁牛特巴林土默特敖漢克什克騰烏珠穆沁阿巴哈納爾浩齊特蘇尼特喀爾喀厄魯特諸王貝勒貝子公額駙台吉等銀幣鞍馬及隨圍蒙古官兵銀布有差戊午上奉皇太后自熱河回鑾壬戌入古北口丙寅上奉皇太后回暢春園是年十一月丙辰上啓蹕再幸塞外辛酉出古北口十二月癸酉駐蹕卜克賜隨圍蒙古官兵銀幣有差辛巳回駐熱河行宫癸未上自熱河回鑾丙戌入古北口己丑上回暢春園五十四年四月辛卯上奉皇太后啓蹕巡幸塞外五月丙申朔出古北口己亥至熱河行宫八月癸酉上自熱河啓鑾行圍九月戊申回駐博羅河屯賜來朝科爾沁喀喇沁翁牛特土默特敖漢扎嚕特阿嚕科爾沁烏珠穆沁浩齊特阿巴噶喀爾喀諸王貝勒貝子公台吉等銀幣鞍馬及隨圍蒙古官兵銀布有差庚戍回駐熱河行宫十月壬申上奉皇太后自熱河回鑾丙子入古北口辛巳上奉皇太后回暢春園五十五年四月癸卯上奉皇太后啓蹕巡幸塞外己酉出古北口乙卯至熱河行宫六月辛丑以熱河雨澤未足命齋戒祈雨傳諭禮部京城一體祈禱丙辰上自熱河幸湯泉七月辛酉回駐熱河行宫癸未上自熱河啓鑾行圍九月己未回駐博羅河屯賜來朝科爾沁郭爾羅斯喀喇沁翁牛特土默特敖漢奈曼阿嚕科爾沁烏珠穆沁浩齊特阿巴噶喀爾喀諸王貝勒貝子公台吉等銀幣鞍馬及隨圍蒙古官兵銀布有差壬戌回駐熱河行宫壬申上奉皇太后自熱河回鑾丙辰入古北口甲申上奉皇太后回暢春園是年十一月戊辰上啓蹕恭謁孝陵再幸熱河辛巳出喜峯口十二月庚子至熱河行宫壬寅上自熱河回鑾乙巳入古北口己酉上回暢春園五十六年四月辛丑上奉皇太后啓蹕巡幸塞外戊申出古北口壬子至熱河行宫五月乙未上自熱河幸湯泉庚申回駐熱河行宫八月壬午朔上自熱河啓鑾行圍九月癸亥駐蹕扎哈烏里雅蘇台賜來朝科爾沁郭爾羅斯都爾伯特喀喇沁翁牛特巴林土默特敖漢奈曼扎嚕特烏珠穆沁阿巴噶蘇尼特鄂爾多斯喀爾喀諸王貝勒貝子公台吉等銀幣鞍馬及隨圍蒙古官兵銀布有差已已回駐熱河行宫十月己丑上奉皇太后自熱河回鑾甲午入古北口庚子上奉皇太后回暢春園五十七年四月辛卯上啓蹕巡幸塞外壬寅出古北口五月乙酉朔至熱河行宫八月戊子上自熱河啓鑾行圍九月丁丑