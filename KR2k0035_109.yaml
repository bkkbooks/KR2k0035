body:
  text: 欽定四庫全書欽定熱河志卷一百十藝文四本朝詩乙酉五月扈從過青石梁新開路查慎行髙入雲端俯作梁中間鑿石得康莊松聲落澗風泉合藥氣浮山露草香馬為重經成熟路人貪早度取微涼詞臣例飽天厨膳已有中官候道旁發黃甲營喜晴查慎行青浮翠積氣氤氲曉色俄從霽色分馬首已迎初上日雕翎猶帶未歸雲峯皆似染供屏幛樹不論年絶斧斤曾記上畨隨蹕候灤河新漲隔山聞癸未六月過此連值大雨駐蹕樺榆溝特給官房止宿感恩恭紀查慎行千帳連雲並出關受㕓何幸預清班炎埃氣隔無三伏覆載恩深抵萬間新瓦鱗鱗宜聼雨短牆面面好看山風餐露宿原臣分每被殊榮輒汗顔發樺榆溝從新開石梁至喀喇河屯查慎行鑿開峭壁轉龍腰髙棧中縈線一條石吻仰噴泉作霧雲根倒拔樹千霄向來紆徑千盤作此去前村十里遙真覺太平民樂業山南山北盡漁樵召遊行宫後苑賜宴恭紀十二首查慎行銀河西繞翠微岡紫界東連宛轉牆一片樓臺先入望蓬瀛遙在水中央天然圖畫引躋攀盡出宸衷指點間巖壑不須多架構下因流水上因山神川過雨氣溟濛沙土無痕井脈通欲識泉源深幾許轆轤聲轉白雲中坡陀幾曲接􅈨頭漸入仙源境漸幽忽漫孤雲生兩角小欄低檻盡如樓煌煌禁扁麗中天楹帖分題兩兩懸萬丈光芒爭耀眼不知旁有好山川松鶴隂從積翠生泉蘿煙月一時清每經御墨留題處記得栴檀别殿名帶峯傍石布芳筵夾岸鏗鏘奏管絃山水清音消不得况從天上聽鈞天一道清流合兩河釃渠中有半開荷分明太液池邊種重沐天家萬里波插架排籖滿禁林御牀左右列森森行宫仍是圗書府清暑時時惜寸隂水精簾幕緑莎茵行過星橋别有津除却澆花無汛掃就中何處著纎塵疊砌平階茁露芽近看如錦逺如霞塞垣小草生何幸開作長春苑裏花華貂環座盡公侯特許詞臣與宴遊滿引金樽歌既醉謝恩齊上木蘭舟隨駕行興安嶺上查慎行橫亘東西路幾千直從遼海控居延盡消伏莽山無樹不斷靈源地涌泉羣牧牛羊量論谷諸蕃廬帳列如㕓聖朝不畫長成界一道平岡是九邉山莊雜詠有序查慎行山莊者我皇上避暑行宫之統名也臣以草茅新進再塵扈從自夏徂秋往反各閲百餘日其間山川風土之美草木禽魚之狀一一俱蒙恩指示凡耳之所聞目之所覩口不勝述則紀以小詩合成三十首用備忘遺不揣蕪詞並呈御覽朝涼夕爽絶氛霾畫裏山川處處佳聖德如堯惟尚儉采椽不斫土為階古北口外雘行宫八所皆無丹之飾章奏多從驛騎馳行宫勤政日孜孜三更樺燭明如晝又是宵衣乙覽時溪䔩山肴味有餘慈幃時逹問安書往來中使頻相望何異宫庭侍起居每得新蔬輒遣中使馳送皇太后宫阡陌橫從蒔藝區豳風七月繪成圖瓜瓤豆莢田家味帶露朝朝進御厨煙光濃淡寫晴空多少旌旗掩映中大抵無峯無好樹一峯不與一峯同幾暇濡毫有萬行臨池無體不飛翔蛟龍噴作巖頭雨千澗流來墨瀋香畫鹿宫門樹射棚冬膠秋幹試初呈靜中人籟皆天籟朱鷺單傳中的聲嶺復岡重不記名石矼隨處㵼琮琤濛濛薄霧沾衣潤雲縷多從水靣生小雨初過月未升浮浮空翠暖如蒸不知濕氣消何處萬竈炊煙萬帳燈林幽谷邃暗霏微過午人人換夾衣預卜明朝天色好相風微動柘黃旗松蓋年深雨露滋茯苓琥珀化應遲太平是物爭呈瑞枯枿先看出紫芝赤芝産落葉松根灤水清流比漆沮霽潭潑潑漾菰蒲細鱗柘緑皆堪鱠不數紅鰓巨口鱸細鱗魚重唇身有黑斑柘緑魚色微緑皆濼所産泡子何淤潟鹵開霜華彌望白皠皠邊民聽食天然利只禁鹽車入口來泡子河生天然鹽不待煎熱而成蒙古用小車載以貿易煜煜蒼龍尾角蟠小星如沸閙林端乍驚三尺飛光度螢火大於金彈丸塞外流螢極大光可燭三尺許泥金細縷簇龍鱗首尾中分翡翠紋頗訝賦形同蠍虎試看噓氣却成雲山中蜥蝎長四尺許頭以下色如翡翠有紋如魚鱗尾作金色吐氣為雲土人呼為雲虎多年沙土養竒材照夜渾疑吐蚌胎可是水中真藴火但生涼焰不然灰山杏根入水千年光如水精夜置暗室中毫髮畢見鋭頭長尾口如䨲肉翅旁連四足俱猜是千年老蝙蝠問名方始識飛狐飛狐蛻頭缺口耳小尾長毛深褐色翅如鱉裙四足生翅中前三爪後五瓜能飛不踰尋丈叢間朴􅈪葉先枯歐李駢睛似火珠長路微甘供解渴馬鞭爭挂紫珊瑚歐李一名烏喇奈子如櫻桃而大味微甘而醡青楓烏桕自喬柯映日多成錦繡窩片片丹砂開障扇就中椵葉得霜多椵樹葉大如團扇初生時可裏粉餅蒸食秋月經霜鮮紅可愛山梨微澀杞漿酸崖密煎從翠釡頒珍重蓬萊金醴味不傳方法向人間山梨枸杞汁經煉成膏味皆鮮美上嘗以賜近臣榛實初生似栗蓬秋來采掇出低叢雞頭剝玉差相並餖飣曽無一顆空俗云十榛几空塞外所産不爾也難憑本草考豨苓異卉竒葩眼未經滿地根株移不得金蓮垂實菌收釘地産金蓮花及猴頭麻姑官馬如雲盡上膘便經霜雪也肥饒地黃苜蓿人人識何以連山盡藥苖千盤百折上興安寒燠平分咫尺間忽見萬松齊落葉人言山後是隂山落葉松生興安嶺北秋冬凋落與凡木同道是山鄉又水鄉四時多半領秋光西風欲起駝爭􅕫早雪將飛麝退香雲端千仭跨晴空真是飛梁亘彩虹畨語漫傳生吉佳名新賜玉玲瓏逹顔嶺東北四十餘里山顛巨石百餘丈中通一門望若飛橋蒙古謂之生吉兔皇上改名玲瓏山晨隨羽衛愛山行夜宿周廬傍幔城自入秋來常起早挈壺攢點最分明詞臣帳房在欽行宫南門外五十餘步天監司漏處也畫屏環繞直廬傍草色常先柳色黃八月初頭風力緊夜來傳旨禁燒荒塞外草枯禁野火犯者法綦重蝗不成災嵗有秋直從畿甸到邉頭更教州縣除蝻子預計來年睿慮周秋來蝗不為災所在遍皇上為明年慮命畿輔掘蝻子溪流經雨雜清渾茗碗頻霑雨露恩日給大官泉一斛秪應亦思源自發喀喇河屯恐河流渾濁至傷脾氣賜臣等官厨水石一石丙戍七月扈從曉發熱河度嶺至喀喇河屯天尚未明查慎行塞天暑亦涼矧此秋候變披衣起我早熟路馬重踐羣峯競髙低孤月遞隱現參差樹交影斷續雲流片長風從西來過耳劇嚆箭行行得平地星火遙可辨嵐霧滃然蒸橫前鋪白練道旁有雙塔隔手不復見澗絶賴橋通泉鳴知徑轉忽聽一聲鐘微茫識行殿口外無佛老之宫帷烏城霄行宫之旁有新創穹覽寺及琳觀上入山行圍射獲白鹿一頭恭紀查慎行白鹿非凡種仙山嵗月長出當時有道瑞叶壽無疆洞口眠時月原頭望處霜明明開射的皎皎入圍場碧砮千鈞鏃瑶星一道芒最宜豜並獻肯與豹深藏至潔斑同雪如膏色勝蒼皮能留素質草不療金創雕爼充庖味銀毫耀眼光謬慚陪羽獵作頌比麟祥重過玲瓏嶺看霜林作查慎行犖確重來路秋容最好時往年輕雪早今嵗得霜遲二月花相似千林景特竒問名難辨種設色故多姿濃淡丹黃葉交加爛熳枝簇來成綺繡疏處度旌旗換眼層層别回鞭步步隨已憐侵暮色還與發華滋粧點江南畫鋪張塞外詩偏宜晴旭映未受峭塞欺好事何人賞登髙此地宜丁寧朔風候旦晚莫狂吹雪後隨駕度汗特穆爾嶺查慎行校獵秋初罷回鑾雪乍零雲峯晴皛皛風磴曉泠泠換景供吟筆收圖入畫屏萬株枯樹頂獨愛一松青發波羅河屯至籃旗營查慎行劍分一嶺隔西東自駱駝嶺束北為校獵之區其西南則山莊也半月風光逈不同沙磧人歸黃落後山家煙起翠微中年豐障塞秋先獲水落浮橋路盡通誰信古來甌脫地築場樊圃入豳風自星龕巖歸至烏城道中重見霜林再疊前韻查慎行過眼當搖落繁華又一時地非千里逺候較兩旬遲晒日晨猶麗烘霞暖更竒黃留將雪景紅發未霜姿秀拔多喬木輪囷乏醜枝似燒原上火愛映酒邉旗猶憶衝炎去曽經緩轡隨緑隂晴借爽潤色雨添滋忽換登髙屐來題看葉詩含情如見待有信不吾欺榮悴天難主姸媸分各宜本非松與柏那免受風吹重陽後十日扈從入古北口查慎行踏遍雲中雪外山敝裘重脫柳重攀寒花過節如迎客朔雁先期已度關官馬散隨黃犢卧戌兵秋較老農間書生幸厠鸞鑣後默數三年六往還熱河紀事六首勵廷儀蜿蜒環嶺塢睨睨建宫垣拱極千山脈朝宗萬壑源邊風多朴厚土物日孳蕃總被陽和澤冬泉氣自溫地占佳山水離宫闢一隅花繁知溜暖榖稔喜田腴耨獲民依切隂晴睿念紆爭看文囿裏稼穡繪豳圖風土敦龎地天教界兩京詩篇酬勝景圖畫錫嘉名雨後銜芝鹿風前選樹鶯幾回登島嶼不復羡崑瀛好景帝開先從遊逾十年鶴鳴莎徑軟魚躍藻紋圓曲岸回蘭棹繁隂覆錦韉迎恩邀一盼萬彚儼登仙屋斜無定向隨意築林邱爽氣千峯逼濃煙萬井稠含毫增逸思振轡足清遊伏暑崇朝雨迎涼敵九秋清切趨仙直宏文啓别廬溪雲霑硯席巖翠滴衣裾性與煙霞愜身依霄漢居自慚還自喜故舊得應徐扈從出古北口張廷玉曉日未出山煙昏冷風直透重綿溫長鞭鞭馬過峻嶺綵幡近指南天門線路不足容兩軌狰獰怪石狼虎蹲攬轡髙吟頴濵句前途山色非中原長城直與鳥巢似雲邊隱見頺垣存前朝防戍疲士卒峯頭髙下連營屯一聲羌笛霜月苦枕戈荷戟忘寒暄青磷散野白骨聚至今想像猶銷魂聖朝聲教逺莫外黃支烏弋皆稱藩堠臺不設亭障罷窮邉往往如庭垣年年避暑厯兹土笑迎鑾輅山花繁書生珥筆良厚幸趨隨清蹕邀殊恩朝嵐夕靄供覽矚巉巖危磴從攀援盛事真足傲千古昔人出塞安足論扈從自喀喇河屯至樺榆溝張廷玉馬蹄侵曉發烏城衣透涼風溽暑清嵐氣千峯疑翠滴煙光一縷似雲生幕連沙尾髙低見路鑿山腰曲折行最愛沿溪三十里奔流不斷雪濤聲扈從喀喇河屯蒙恩召入行宫賜宴遍覽苑中諸勝恭紀四首張廷玉槖筆羣叨錫宴榮簮裾連步到蓬瀛雙溪水繞平橋逺萬壑雲依曲檻生臺檄參差隨地築山川環立自天成閬風換盡塵凡骨俯仰都教耳目清盡收好景在庭除一幅豳風總不如湛露無邉滋稼穡萬幾餘暇玩圖書天淵體道鳶魚趣山水怡情仁智居五色宸毫光萬丈仰瞻銀榜麗瓊琚層臺髙陟若凌空人在苔痕樹影中夾岸林巒含宿霧隔溪歌吹逐微風芊芊草拂漁磯緑點點花飛釣艇紅到此始知文囿樂時當秋肅若春融承恩更泛木蘭船特設芳茵御座前法醖自天傾石髓宫庖隔岸送瓊筵幾人得聽金璈曲兩袖都攜玉篆煙自是太平多盛事塞垣同賦蓼蕭篇召遊行宫後苑恭紀張廷玉澗草巖花映碧蘿五雲長護萬年柯迎涼樓閣依山逈避暑軒窗傍水多卧石幾重橫玉几飛流千尺瀉銀河誰言天漢無人到已許乘槎六度過是年遊覽凡思命六次塞外扈從紀事四首張廷玉六御逢秋獮關山驛路通昨朝霜始白一夜樹全紅馬踏千林葉駝嗚萬壑風解鞍吟短句難寫塞壖雄舉頭天尺五真愧受恩偏朝食分仙饌宵燈接御筵臣等帪幕東南最命安設於黃幄近處獵場容緩轡行帳每烹鮮勺水皆液如傾第一泉地偶乏水奉厨取給命於御圍場遙在望虎旅若雲騰分隊旗雙引穿林騎一層草遮傷箭鹿風送脫韝鷹古禮三畋重書生見未曽返照連山紫重圍合又分馬蹄冝淺草豹尾帶殘雲木葉翩翻下溪流斷續聞不愁岐路晚身傍羽林軍雨後扈從出古北口張廷玉衆木吟風送晚晴振衣關口覺身輕螺尖滴翠千重岫雉堞蟠雲萬里城澗湧清泉珠噴欱橋穿白石玉峥嶸升平鎖鑰無勞設長許書生欵假行雪霽隨獵張廷玉嚴寒一夜雪霏霏早起氷花點客衣千樹凍時瓊蕊密四山還處玉塵飛雲銜曉日迎仙仗路絶纎塵合御圍正是前岡風力徑天􅓡頻中仰天威扈從塞外蒙恩召入行宫泛舟觀荷遍覽諸勝賜宴於流杯亭恭紀二首張廷玉經年未踏三山路此日重登太乙舟錦蕚千層圍兩岸紅雲一片在中流空明潭影全消霧雜沓泉聲欲送秋宛轉蘭橈向何處遍隨鷗鷺過汀洲橋藏深樹路穿花次第探竒到日斜廊廡髙低因水石軒窗朝暮納雲霞連畦特植雙歧榖亞架還懸五色瓜為是恩波最優渥遊仙更與飯胡麻扈從進古北口張廷玉如雲千騎散髙原扈蹕人歸自塞垣九折岡巒分內外一重關隘隔寒暄新霜未改青林色宿雨猶滋碧蘚痕指點溪橋皆舊識不愁前路暮煙昏扈從度嶺行張廷玉鞭鐙連雲度嶺東荻花如雪舞秋風山橫豹尾龍旗外路在楓林槲葉中野兔避人依荗草飢鷹擊雉上晴空書生見獵心先喜躍馬髙原也自雄秋日隨獵紀事十二首張廷玉穿林跨壑騎如飛健卒連岡正布圍龍馭逺從山頂過丹楓髙映柘黃旗霜林濃處獸成羣待合圍時日半曛一騎直追奔鹿去控弦深入數重雲萬竈炊煙暮色催終朝登陟試龍煤忽聞鐵騎歡聲動又向前山殺虎來幾務偶間披萬卷健行不息愛三餘秋原射獵歸來晚帳殿懸燈尚校書聖朝威德遍遐荒紫塞天開畜牧場芻粟不需民力省養成牛馬谷難量諸畨部長逺迎鑾膜拜呼嵩夾道歡布幕居中車四繞傍山新立小營盤狂風未見卷飛沙信是陽和近翠華共説今年天氣暖中秋方見雪飛花興安嶺與碧雲齊徑路盤旋信馬蹄地勢漸髙渾不覺直登峯頂萬峯低裁綃剪綺樹鋪紅吹散霜林大漠風一谷隂晴太無定漫天雪片日光中獵罷歸營月未升四山如霧晚煙凝馬前錯落流星影萬帳齊明萬點燈莫道書生欵假遲天間分與驌驦姿路人爭看牙牌上細寫蕃王入貢時懸牌記恩賜名馬於項下外蕃進貢年月布幕髙懸俯碧溪夜深燈火望還迷向來此景無人道月白山空萬馬嘶隨獵張廷玉珊瑚鞭指日東升人在岡巒最上層逐電愛看千里駿摩空齊縱九秋鷹弓彎明月形常滿旗捲寒雲影共騰慚愧年年扈清蹕長楊欲賦歎何能康熙五十二年五月二十五日蒙恩宣賜筵宴得遊避暑行宫懷恩紀事詩二十首湯右曽苑籞紅泉繞翠岑萬幾餘暇始登臨寧知清暑迎涼地盡是誠民阜物心入宫門搖溶桂楫漾蘭舟青雀晴飛彩鷁浮欲到蓬萊三萬里應從瀛海更乘流登舟碧樹周阿夏景清三才萬物厪皇情每尋解愠歌薰句已覺涼颸殿角生無暑凊涼軒窗靣靣納虹霓左是丹臺右玉梯每惜寸隂勤乙覽晨霞紅映數峰西西嶺晨霞殊形特似産芝房行盡雲根别有莊橫截一隄銀漢繞大羅天在水中央芝徑雲繞夾鏡澄明到碧虛四山晴翠繞周廬分明圖畫西湖景此景西湖較不如雙湖夾鏡穿蒲戲藻自遊行集網垂鈎了不驚自是至仁周萬物一鱗一鬛總生成石磯觀魚稻垂麥仰足隂陽土厚泉甘草木香會吐雙歧銜九穗一星天上應農祥稻田麥隴波回芷岸接菱汀曲水流杯眼乍經總為帝書真第一恍從蘭渚到蘭亭曲水流觴遙青不斷緑雲鋪萬木蒼然總畫圖對靣千林有瑶島蓬壺髙處望方壺萬樹園洑流噴薄雪成堆潤物資生一竇開直送恩波到東海俱從天上發源來趵突泉聖心原自合天心誠敬由來昭格深此日髙居瞻綘節六時仙樂海潮音上帝閣曽從廬阜尋巖瀑憶到黃華問水簾今日銀河天半落恍疑兩地一時兼瀑布回崖沓嶂翠浮空峭壁巉巉插水中直是五丁開不得天然疊出錦屏風石壁仙巖時有絳雲封槲葉隂邉自養茸待到千年毛盡白仍驂赤驥御蒼龍馴鹿將雛挾子共因依瑶草金沙翠羽肥從此隨陽天直壯年年更不要南飛候鷹移根幸植玉階旁寶地蓮臺萬品香天與十分端正色承恩先借御袍黃金蓮花龍沙小草孕瓊漿賜出金盤得共嘗一自嘉名天錫與海南不記荔枝香草荔枝青絲籠裏盛猶早白玉盤中看不殊每向上蘭宫樹望勻圓萬顆水精珠白櫻桃仙人六膳出珠宫九奏簫韶率舞同百子池頭萬年樹侍臣身在彩雲中筵宴閏五月初二日二十日復蒙恩賜膳兩遊避暑行宫紀恩詩四首湯右曽君恩重許到行宫復嶺澄湖望不窮仍泛靈槎渡河漢復驂法駕上崆洞神臯路迥環仙境福地天開養聖躬常願萬年調玉燭五雲樓閣翠微中謳歌東陌復西阡瑞麥嘉禾滿塞壖人慶六旬逢聖節天教九域遍豐年中和氣與隂陽會易簡心通造化先昨日山靈出時雨為迎仙蹕到溫泉松風别殿倚層岑寶字瓊章許遍尋孝養陔華崇帝德阜成民物見天心文包理數圖書祕詩叶咸韶雅頌音揮翰萬言成頃刻由來聖學至髙深籠蔥佳氣接芳原淑景晴開閶闔門三謁帝臺當晝永每承宸幄似春溫風前紅蕚穿波出檻外金英耀日繁小草亦蒙天地德微材難報聖朝恩黃土梁劉巖後嶺連前嶺天根倚石根峭稜熊耳蕚穹洞虎牢門鳥路穿雲逈驂蹄踏霧昏中原回睇處寧獨華嵩尊鞍子嶺劉巖天畔插山稜盤盤幾百層石危循磴歇峰峭撥雲登朔吹旋崖瀑寒聲裂竇氷未曽鐫姓字孤負碧崚嶒熱河山莊四季應制王敬銘珠杓回淑氣韶景麗仙家緑展扶輪草紅鋪簇仗花曉山明似黛晴囿望成霞睿思同春盎非徒攬物華春九夏調槐序涼從别館生庭移葵日靜沼拂芰風清鷺立金沙影蟬回翠樾聲始知無暑地塞景自天成夏地勝涼颸早天髙爽氣多蘚階蛩自語楓坂鹿頻過暗露初塗玉纎雲半捲羅西成徴上瑞文囿熟嘉禾秋嵗屆安寧節天隨日馭回書雲占玉宇映雪上瑶臺密室香猶護回塘凍未開璇筒生意轉芳信已相催冬欽定熱河志卷一百十
