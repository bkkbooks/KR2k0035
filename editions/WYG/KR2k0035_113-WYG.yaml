body:
  text: 藝文八本朝詩恭和御製遥亭行宫晩坐元韻于敏中頓次黄圖信宿經第三行館按程停度闗駝影峯前黑因次日過南天門車馱俱于日晡先行連帳炊煙栁外青景繪秋塍鋪迤邐詩催夜漏遞玎玲朝晴未礙聴宵雨既愜農歡復旅寧前題國柱路轉山㘭翠䍐經天開仙館玉驂停門前多稼連雲碧檻外交柯接地青氣霽烟林秋澹沱雨晴蘿嶂石瓏玲物華元不闗宸賞萬寳時登萬國寧恭和御製出古北口元韻國柱劍作雙崖壁作闗馬頭翠叠石孱顔前驅羽騎鳴鞘上風勁琱弓月半彎嚴闗瑞氣望如龍雉堞連雲苔蘚封歌咏太平邊地樂年年恩澤到秋濃昔時塹鑿誇重險今日耕畬慶屢豐髙下黄雲凝逺目築場納稼厪宸𠂻恭和御製兩間房行宫即景元韻尹繼善恰在濃陰古木間數椽清淨接通闤環村曲引溪中水入戸平㸔屋裏山只愛桑麻饒野趣還容童叟近天顔誰知五夜𫝊銀箭猶凛時㡬未肯閒前題于敏中塞堤迴望翠微間行籞連村帶隧闤兩桁涼移槖駝樹兩宫門内植樹行足資涼蔭一房雲渲大癡山是處山屏極似黄公望畫法堆盤珍品叨頒獲鹿臣上于後山鎗殪一得䝉分賜列坐榮階荷賜顔䝉閲古北口技勇兵于前宫門時臣賜坐列于御侍衛之次早捧研朱詩帖下聖人真惜寸陰閒前題觀保熙熙景繪往來間真有衢尊酌市闤路折平沙逢古戍是日過古城川烟消一角露秋山對時慶協農夫願較藝懽騰猛士顔仰見分陰珍尺璧還將睿藻答㡬閒聊消御製冇著句片刻閒句恭和御製至喀喇河屯即事元韻觀保原隰畇畇頌既平翰屛肅肅馬頭迎緩期特沛如春澤閲嵗偏殷就日誠髙樹欲遮雲去跡遥村忽遞雨來聲時驟雨即止拍隄漲水流方急又聴山蟬噪晩晴恭和御製至避暑山莊即事得句元韻嵩貴勝地何年始剔鬘清流逺映市分闗最佳閏在新秋月信羙莊為避暑山卜稔正欣暘雨若承歡更適凊温間來遊總為同民樂有喜詩傳有喜顔恭和御製清舒山館元韻雙慶依然川觀與巖居水石玲瓏映碧疏曲磵細生雲䕶硯平林遥帶月臨書地當舒曠遥峯列秋到清佳玉宇虛共識宸􅇆勤茂育㡬閒還自凛咨予恭和御製遥亭行宫晩坐元韻觀保吉行三日程紅橋帶仙館筠檻列櫹槮紅泉映清淺至人心鏡澄秘閣温飈遣坐㸔夕曛移靜對餘霞展覽風軫休助秋獮勤邦典恭和御製南天門攬勝軒作元韻錢維城去天尺五豁鴻逵勝㮣當軒一覽披初日髙涵晴漢影曉烟低渲逺山姿頻來碧落經行處快是青雲得附時呼吸可通閶闔近上頭旌斾見如兹前題邊繼祖天門一線闢雲逵攬勝臨觀曉霧披樓堞萬千環逺勢岡巒七二聳雄姿山自太行來凡七十二㘭蜿蜒二千里盛朝聲教通南朔邊嵗安恬厯嵗時自是徳城同覆載八荒我闥信今兹恭和御製出古北口原韻于敏中嚴闗洞敞蹕郵遵塞外猶然甸服民笑彼長城紛繕築孰為魏趙孰燕秦秦築長城史稱其因邊山險塹可繕者繕之而魏恵王趙武靈王燕昭王亦皆有築長城事莭臨處暑露微涼是日為處暑前一日禾黍鋪棻近拂裳萬騎騰驤環擁衛共瞻良吉御飛黄良吉黄馬也上所御名雲開留斡度遥蹊藩部迎鑾鞠􅎽齊比似雁臣孚徳信何人不奉大車輗恭和御製駐喀喇河屯元韻于敏中當時元魏建方城舊跡淆訛辨始明舊時以喀喇河屯等為白檀諸縣地今遵所不㫖枝輯熱河志乃知長城以外實漢晉郡縣及惟北魏始於建安州治方城縣益信此説之誤萬姓板升成土著百年沃壤變刀耕灤河東繞宫牆碧葦峪西來輦路晴向晩灑塵微雨過鳴鳩不用載前旌恭和御製題冝照齋元韻莊存與髙齋妙得新秋景為喜秋光户向西夕霽林含疎潤致晩涼山畫淡閒題巧當簾額餘霞綺却上簷牙新月低御筆捧來冰雪句清詞應共玉壺攜恭和御製夜遊山月作歌元韻于敏中太古塞上太古月碧落秋光靜相寄霞標矗化須彌巓一鏡飛淩大輪四乘驄迎月縁丹梯超出尋常泛湖例􅗥哉溪數登虬龍何有東坡務赤壁玉清七寳光映鞍俯視壺鴻朗厓際蟾蜍爬沙亦吐輝桂華窅窊本無翳雲螭直躡最上層返轡環州指如意還語纖阿策飈騎碾向天心景全萃恭和御製濬溪元韻錢維城苑溪漲急雨雨過流不奮疏之利用鍤湱爾去其填新淤既漸通前源乃徐進出山濁復清繞岸曲而迅舟豈泛堂㘭橋寧滓泥印晝夜活活來不猛亦不悋聖人利濟仁視此一川濬恭和御製出古北口元韻劉星煒雙旌獵獵度重門夾道周廬拱塞垣跪受白金文綺賚虎毛壯士最銜恩古北口兵衣虎文衣者尤稱健銳山農也效夕葵情染彩為臺一簣成萬嵗舞來天亦笑呼龍乞與六時晴仄徑迢迢方軌過謾言盤馬似旋螺偏槍嶺上堆濃緑留為金源訂語訛名藩膜拜官日蒙古王公于是日迎駕裨販腰纒服賈時古北口例不征底事郅都矜守險屬車載筆有奚斯恭和御製千尺雪元韻李中簡知是銀河第㡬灣架岩叠瀑㺯潺湲分明一段寒山色風雨飛來碧落間滙作平流逺派長前溪添得芰荷香六花不散青峰頂自送桐軒碾玉涼恭和御題冝照齋元韻申甫天半霞標似赤城捲簾疎快暢皇情靜無不照能涵動雨亦殊佳豈但晴逺岫列窻多畫意飛泉潄石作琴聲智仁山水原相契勝賞千秋有定評前題李中簡山如屏障樹如城昕夕徘徊愜聖情香逗嫩黄岩桂午影翻涼碧井梧晴縁階苔蘚無塵跡隔屋笙簧有澗聲一自嘉名署冝照清光髙下入吟評恭和御製秀起堂元韻于敏中仙莊冝畫復冝居西峪登臨盡攬諸四面屏圍皆罨翠中天堂冠欲淩虛雲蒸樹角㸔成采秋澹峯眉許列疏應有山靈喜相語來游先得慰傒予毎年年初駐蹕數日後方至秀起堂今莅山莊即至其處前題申甫層巒秀起對山居寳翰垂光義取諸邱壑逺多蔵曲折雲烟髙不礙空虚山㘭樹色千章靜嶺背泉聲一脈疏敬仰宸􅁭通造化茂時育物總闗予恭和御製木蘭行圍自熱河起蹕作元韻奉寛宿霧齊收放曉晴髙秋講武紀初程山河影裏櫜鞬隊禾黍香中士女情雁齒橋平虹乍偃龍鱗樹古鬛方生最欣挾纊羅藩騎早有期門獻獸迎恭和御製入崖口元韻劉統勲崖外穀登場崖中雉網張霜留千樹白日轉萬峰黄驅任前禽去蹄寧得兎忘明朝𫝊大獵宛馬試騰驤恭和御製儀鎗行元韻莊存與傳聞搏虎掣虎騎卞莊巧以兩虎刺匹婦奪拳不顧身戾蟲磨牙竟潜避國家教士必使能奎踽令手鎗自衛一二超足殿其曹虎鎗抽作儀鎗備韜鋒詎若錐處嚢乃如麟有角不試循名責實多所慙不愆于儀便榮賜聖人辨職爰作歌更考古文詳指事前題申甫練影如飛馳突騎捋虎之鬚工擊刺空林黄葉響秋風白額踆踆逺相避六龍整馭法乾行七萃如雲盛儀衛其中亦有虎鎗人白挺長矛器良備彼知奔走效前驅較藝真難一一試奎章敬誦儀鎗行轉幸流傳拜榮賜官厨飽啖聚儔侣變色驚談刺虎事恭和御製闗外元韻奉寛雨後山情分外佳蔭程桞碧望中皆此來寳穡茨梁密行見茅檐比櫛排蝶翅輕翻三逕草豆花碎㸃半扉柴潦餘不礙西成好極目田原慰聖懷恭和御製秀起堂元韻金甡懸圃瓊臺信有諸倚天拔地復誰如髙居特起絳霄上秀色還分碧落餘衹覺星垣羅象緯何殊月府傍清虛仙毫拈出嫏嬛秘想像人間未見書前題申甫秋澄似水映方諸秀起堂前益湛如即論此間應第一儘多佳處是其餘嵐光潑翠涵清景山勢淩空逗碧虚更與編年垂聖藻五雲深䕶御屏書恭和御製玉岑精舍元韻金甡精廬不厭入山深森竦瑶簮仰百尋閒送岫雲兼吐納靜聆谷鳥學謳吟逍遥自足娛真性冲穆偏冝飬道心鐫刻永垂天藻麗玉峰晴色煥苔岑恭和御製題桄榔木盂元韻程景伊摩挲舊物厯年存敬仰先朝樸素敦塞外園亭傳守器海南風月想蟠根劚由巧匠疑山骨挹向清溪識水源就裏會心含至道神孫觸處感鴻恩前題金甡南邦底貢厥名存彛器常陳古所敦斑駁紛呈疑鏟甲輪囷旁茁似蟠根模成本寓方圓象酌取還分涇渭源銘重盤盂揚祖訓獻琛薄海總懷恩前題申甫孔甲銘惟字體存山莊舊物古風敦覆盂安益懷前烈刳木成還念本根園外梅花吟卧樹亭邊月色近靈源摩挲質理堅如鐵多少栽培造就恩恭和御製即事元韻申甫藕汀蘭沚愜清娛四面山疑碧玉郛拳足偶㸔林際鶴梳翎時見水中鳬泉因雨後如珠濺花到秋來似錦鋪動靜總教徵樂夀宸懷契亦在兹乎恭和御製賦得片雲舒卷元韻國柱舒卷無心岫影東片雲髙並翠螺崇早㸔普蔭寰瀛裏時復騰輝磵壑中共仰璇題紅日映漫誇舊詠絳紗籠晴空㵳泬秋容淡浩浩天懷孰許同恭和御製熱河啟蹕幸木蘭行圍之作申甫嶺雲極北接興安邊塞雄逾古賀蘭蒐典正乘秋氣肅林霏微逗曉光寒梯航逺至皇風暢禾黍初登野望寛計日鳴梢入崖口翠巖千尺畫中觀恭和御製口外元韻竇光鼐古北雄闗外千山應接多峰迴常礙日路轉每循河省嵗籌晹雨連雲見麥禾好風資長飬輕拂翠旗過前題國柱近塞居人聚黄雲入望多擘沙閒作隴引水自成河緑潤千章木青分夾嶺禾西成今嵗好帝蹕喜經過恭和御製塞湖載月之作元韻申甫至人心若鏡隨地得清景矧兹塞上湖不知㡬千頃濊濊聖澤涵洋洋天趣領少焉明月出桂輪掛松嶺水光與月光㒺非真實境輕舟載月行水中見舟影但覺水與月湛然同一靜宸懷於此豁道妙相與永遥夜岸風涼玉衡低素綆前題竇光鼐寒山歛夕霏涼館延浩景明湖碧無烟㶑灧餘百頃具舟倚南磯目遊心已領維時月㡬望皓然上岑嶺蘭槳邀素輝沿泛足佳境汗漫琉璃界浮動山河影棹移輪猶遲纜結練逾靜睿思寄廣寒雲漢相與永觀海欲溯瀾汲深愧短綆恭和御製熱河初建城隍廟元韻申甫棟宇新崇勑保庸通神明徳本無壅赤烏久紀專祠建紫塞今欣廟食供八蜡報功稽祀典五章錫命著褒封興桓民物慿呵䕶嶽凟精英助協恭禮接人天諸佛近熱河新建普陀宗乘廟職分彰癉有司從兩廡列善惡二司捍災禦患威靈逺省嵗觀成盛事逢熙皞益徵安土俗盈寧永與庇耕農貞珉奕奕奎文炳寳翰欽瞻墨妙宗恭和御製詠荷元韻􅄞璜浦荷有意迎清蹕較比常年及早開新沐毫端珠露潤陋他凡卉盡輿臺未離色相已離塵華頂移來銀漢濵欣侍玉皇香案側定知太乙是仙人前題蔣元益田田正屆蕤賔莭如意洲邊作意開最是碧虚澄逺翠波心紅影上重臺麗色曉明霞綺外清姿夕寫鏡湖濵花猶解識摛華早何況深霑湛露人恭和御製恭詠皇祖鹿角椅元韻申甫星角雙撑取用全深山不記養茸年切磋敬仰成勞著位置常瞻祖徳綿玉樹倒垂含潤澤蓮臺髙湧並清妍行宫法物同豐鎬尚象因材本自然恭和御製逰獅子園憶舊元韻嵇璜獅園舊傍塞園陪萬丈榮光勝境開庭際穉松今合抱道旁耆老昔童孩有那最憶前規逺無逸長遵家法来望裏青峯羅佛髻頻經宿雨净炎埃恭和御製過九松山元韻梁國治松勢迴翔萬壑低青田黄鶴𣺌難稽即㸔黛色縈丹嶂遂有濤聲卷碧溪近塞雲封依咫尺下山苔徑乍東西九株指㸃知焉是路轉林深入望齊恭和御製永佑寺瞻禮元韻梁國治孫謀纉武協時行瞻就年年此展誠四塞河山維禹蹟九重堂構自天成秋田載斾依前典神御垂衣感聖情扈特歸從二萬里共球來賀樂昇平恭和御製題秀起堂元韻梁國治堂開西峪接雲髙晻靄還冝萬景韜天外綺霞銜日末雲端烟樹㸃秋毫晴髙欲下千年鶴松籟微聞萬頃濤秀色欲名難比似四山空翠影周遭恭和御製永安莽喀元韻于敏中場選榆林迤右邊語大營榆樹駐海拉蘇台䝉古謂冇處也圍場在大營西南白沙紅樹景天然寳騮到處頻呼雋連中上乘寳吉騮馳射四鹿衆皆歡呼華褶頒來儼序賢是日䝉古王公有於翎四人御前射鹿者蒙賜黄褶二人花以旌其能圍凖十三初發軔今嵗自永安莽喀至塔里雅圖凡十三圍場騎掄千二各彎弦擇肥馳進慈寧饍前侍上以親射鹿衛馳進皇遣御太后纘武承歡例萬年前題梁國治涼風白露翠微邊沙苑重岡尚宛然塞上選徒因習武圍中數獲即觀賢名藩一一欣隨轡御箭雙雙㸔應弦此日晨鮮飛騎進萬年長奉似初年欽定熱河志卷一百十四
