body:
  text: 行宫四濠濮間想天字咸暢暖溜暄波泉源石壁青楓緑嶼鶯囀喬木香逺益清金蓮映日逺近泉聲濠濮間想澄湖之北構亭凡四面如意洲曰濠濮間想聖祖御書額也東曰甫田叢樾西曰鶯囀喬木又西曰水流雲在迴環列布倒影波間兹亭居其中前臨芳洲後翳宻䕃水木明瑟魚鳥因依茂對殷懷用徵咸若濠濮之樂亦寓焉而已聖祖御製詩濠濮間想三集青流素練緑岫長林好鳥枝頭遊魚波際無非天適會心處在南華秋水矣茂林臨止水間想託身安飛躍禽魚静神情欲狀難御製詩濠濮間想恭和皇祖聖祖仁皇帝御製元韻辛酉曾聞古衲子問師覓心安我是無心客轉覺會心難濠濮間想壬申水木翳然處真堪會此心有懷虛以静無俗􅆼而深風度隨花蝶霜酣餉果禽天都元在此那更數華林天宇咸暢湖之東岸有阜巍然搆殿宇其上中天積翠絳莭髙居額曰天宇咸暢殿後建閣三重額曰皇穹永佑再重祀真武額曰元武威靈三重奉玉皇曰天髙聴卑皆聖祖御書閣下山趾巨石林立縱横天詞御詠並摩崕恭勒焉聖祖御製詞天宇咸暢調萬斯年曲三集湖中一山突兀頂有平臺架屋三楹北即上帝閣也仰接層霄俯臨碧水如登妙髙峰上北固烟雲海門風月皆歸一覽通閣斷霞應卜居人烟不到麗晴虛雲葉淡巧萬峰明雁過初賓鴻侣鷗雨秋花遍洲嶼御製詞天宇咸暢恭和皇祖聖祖仁皇帝御製元韻調萬斯年曲辛酉琪樹瓊田封陟居元君駐駕玩清虛旋促鶴御返瑶池别離初神仙侶曽訴幽情立烟嶼御製詩天宇咸暢壬申洞府玉虗宇林扉守百靈三天無别路五嶽有真形青鳥憑𫝊信紫鸞時駐軿瑶函降真誥聞説是黄庭暖溜暄波熱河以水得名近東北門之隅有牐焉水自宫墻折入蓋湯泉餘潤也建閣其上聖祖御題額曰暖溜暄波觱沸潛蒸演迤屈注踰牐口循清渠濺玉跳珠溶漾傾瀉含甘潄潤蠲欝除煩天然功徳水焉閣前叠石為岸立雙碣恭勒聖製並皇上和章聖祖御製詩暖溜暄波三集水源暖溜輒蠲疴涌出隂陽滌蕩多懷保分流無近逺窮檐盡頌自然歌御製詩暖溜暄波恭和皇祖聖祖仁皇帝御製元韻辛酉靈泉清泚滌煩疴功徳由來利物多况是御園分恵澤祗今猶頌澗􅈆歌暖溜暄波壬申遥源蒼嶠中暖溜早稱功滌蕩蒸雲似靈竒仙藥同醴泉聞建武温谷豔新豐利物天然澤無誇闢沼官泉源石壁北山之麓危崖直下數仭旁無路蹊古樹根盤迸出石罅蒼苔紫蘚沿蔓繡澀壁間懸流百丈飛注所謂泉源者也磨崖恭勒御書泉源石壁四字大徑二尺西為半月湖更西有亭曰矚朝霞皆聖祖御題聖製元韻皇上和章並鐫石壁上聖祖御製詩泉源石壁三集獅徑之北岡嶺蜿蜒數里翠崖如壁下映流泉泉水静深尋源徙倚咏朱子問渠那得清如許為有源頭活水來之句悠然有會水源依石壁雜沓至河隈清鏡分霄漢層波濺碧苔日長定九數髪白考三才天貺名猶鄙居心思道該御製詩泉源石壁恭和皇祖聖祖仁皇帝御製元韻辛酉泉源丹嶠側石壁玉河隈汀雁人為字岩屏衣是苔雲心原不繫水鏡豈須才􅃡想無為治巍巍造化該泉源石壁己巳奔流迅澓縈竒石上有松崖倚白雲山鳥飲泉林際下帶將松子落紛紛泉源石壁壬申錦流依繡壁霽色正開時喧寂均堪悟縱横皆合宜遊松擾麏􅝤唼藻下鳬鷖聖蹟光巖穴翹瞻切企思泉源癸未泉源嵗久致湮淤拔草除泥事剔疏况有神堯遺跡在泉源石壁為三十六景之一皇祖御題泐巖間引流導澤益殷予半月湖半月湖中印半月合如滿相玉輪圓主賔半滿有為法照徹三千與大千半月池甲申沙溪易咉咽嵗久賴䟽治一以漲潦容一以灌輸資昨夏駐山莊畫長多暇時剔鬟去淤壅成此半月池今來益澄泓巖風落漣漪飲鹿喜羣友樂魚育鯤鮞玉輪方上弦相暎清光披半月湖倒壁影青螺名應藉玉娥汀蒲尚䓗翠岸柳自婆娑飲去聲鹿來蹤夥遊魚樂趣多列谿山水發不月湧金波半月湖䟽淤仍復舊池塘潦盡兼看新水光舉首上弦蟾魄好半輪影亦正相當半月湖半月湖圖月未圓一彎印却影澄鮮碧霄輪廓三千里容此湖將逮萬千青楓緑嶼越泉源石壁而北跨山巔面南三楹額曰青楓緑嶼聨曰笙簧響入踈松裏錦繡雲從翠壁來殿五楹額曰風泉滿清聴門外三楹面西額曰霞標聨曰踈幕㡬重當畫卷遥山三面送青來皆聖祖御筆殿東嚮四楹皇上御題額曰吟紅榭雲忩月牖掩映楓林淺碧濃青逺邇一色每輕霜乍染萬葉皆赬錦樹分叢丹霞競彩蓋寒山石徑光景彌新矣聖祖御製詩青楓緑嶼三集北嶺多楓葉荗而美䕃其色油然不減梧桐芭蕉也踈忩掩映虛凉自生蘿蔦交枝垂掛崖畔水似青羅帯山如碧玉簪竒境在戸牖間矣石磴髙盤處青楓引物華聞聲知樹宻見景絶紛譁緑嶼臨忩牖晴雲趂綺霞忘言清靜意頻望羣生嘉御製詩青楓緑嶼恭和皇祖聖祖仁皇帝御製元韻辛酉遊豫諸侯度非關玩物華山莊幽事足林塢鳥聲譁列嶼仍含黛經霜想作霞羣生被苞育微木摠清嘉青楓緑嶼壬申青楓多秀色乍可傲霜朝樓榭惟存意烟霞儘許招司勳權閣筆王子欲吹簫却望丹邱迥何當過石橋賦得風泉滿清聴丁丑璇題標五字巖室䕶千靈度牖秋風颯侵階泉水泠自然相問答雅合託髙㝠契理皆堪會忘言頓入聽漪瀾猶習習含籟復渟渟觸景􅃡堯軌非關企孟亭吟紅榭霜染横林沓嶂巔開忩遥對畫圖懸聊欣爛熳峯頭纈莫慢飄零谷口填晚照每看霞影亂曉凉常浥露華鮮徘徊欲詠還停筆兩杜先予早着鞭吟紅榭己夘霜蹊風谷薄人寒散步﨑嶇出衆攢纔到山齋便得句為他入牖幾枝丹吟紅榭庚辰緑蔚青標畫􅖵横權當倚榭閣吟情山靈偏是具神解一樹當窓恰染成霞標室戊寅書室千峯表金秋八月清時八月朔日招凉在懐袖寫霧出檐楹便欲望銀海何須擬赤城風泉清聼滿室中有題皇祖額云風泉清聼滿常見聖人情霞標己夘雲窓攬鏡中月宇駐依空得趣真無比澄觀復不窮屏山遥拱北帶水俯臨東孫綽天台賦我心先獲同霞標乙未降西復陟東待月向時同兩宇奎章迥萬年景仰中林端幾㸃赩天末一􅁝紅實境得真景文通造化工賦得霞標八韻丙申冠嶺棲書室奎章兩字該錢詩稱玉壘孫賦詠天台顥氣相磅礴羲光與廓恢參差縈且繆縹渺往而迴豈必乾元殿王勃乾元殿頌兼山配極照鸞闕於霞標云云居然日觀臺金烏定堪揖仙鹿每為陪的爍丹楓映徘徊綵筆裁於斯清萬慮將以叶三才霞摽壬辰霞標真是據霞標兩字題檐聖蹟昭修阻山蹊步恒鮮徘徊齋閣意斯超巖禽窺戸鳴如訴松䑕穿林疾若飄東壁有䑓供逺望錘峰月上正堪招夜遊山月癸酉夜遊山月當秉燭水月恒同山月獨踈枝宻葉錯玲瓏横嶺側峯互繚曲燈筵錫罷雲居遥輕輿緩度升崇椒緱山笙鶴儼若接興來擬欲招王喬楓烟榛露凄清甚湧金劍峽晶光淰廣寒底用駕虹橋虛無幻境寕容審山靈有意助姮娥慶霄歛盡纎雲羅即景後賦勝前賦我心先獲惟東坡夜遊山月作歌甲戌乗凉徙倚崇岡巔畢景暮色來蒼然巖樹偨池漸欲隠我亦因之拂錦韀迴頭下視東海水一輪氷鏡從中起如聞七寳宫闕間纎阿謂我行且止崖枝澗葉重光輝隂嶺陽巘幻益竒石泉輞水㶑上下宿鳥繞樹聲參差髙處雖寒逺麀垢左招吳質洪厓右早嗤羽客術已勞却憐爝火光何有雲莊松塢言歸來琉璃界裏行龍媒湧金閃玉莫可狀絲轡珊鞭且慢催却憶年年遊上苑蘭舟桂掉遲且緩北人使馬南人船欣兹本色得何晩夜遊山月歌癸未夜遊休秉燭那窮巖阿與溪曲夜遊休乗輦雙輪轣轆艱動轉聴我夜遊山月歌金鞭珠勒便利多崇峯峻嶺任遨衍而却不出山莊石城之遮羅此情蓄以九閲載因縁此夕興百倍寥天疊嶂如有期明月清風不用買山鳥啾啾山鹿呦呦聽如仙樂勝撥箜篌既弗為太白手捉之狂逸亦弗取知微借酒之幻術取之無盡用不竭得得随人茂林出載月以舟右寧可僂指數自謂策騎廣寒曽未聞於古中庭即或有其人鮮見上馬而觀下馬歌而譜記憶細故其焉窮東坡踞虎豹登虬龍祗宜傲二客耳安能蹀躞驅青驄登髙臺而待明月癸未登髙臺而待明月剏見不可無言紀滿川斜陽倐上山須㬰山亦蒼然矣山之凹處漸生光光中一㸃金星委是時依凹有片雲雲忽數層㸃綴美星為鈎復鈎為璜鎏彩萬狀莫能擬過雲擎出爛銀盤盈袖天香露華綺紫磨身月華子千秋萬嵗山莊裏登髙臺而待月丙戌登髙臺而待月於望後為相宜臺更西山巔東山座中披乗凉送夕陽颯沓延爽颸須㬰斜照落萬樹蒼然暮色剛熹微錘峰南側金色拖眉忽鈎忽半璧忽呈全體空中飛是時流雲㸃綴乍隠現未覺謝重所言全屬非登髙臺而待月賞今夕之遇竒月夜山遊四首髙臺延月月已上䇿馬聊為汗漫遊同是廣寒明鏡裏豈殊雲海泛虛舟澗葉巖葩態盡藏緩過殊勒靜聞香千秋欲問載月客此景曽知在此鄉松濤石瀑空中聽蔓壑枝峯鏡裏尋識得晦原有明趣更於何處覔塵心夜山真覺靜而佳不害端知鹿可偕出谷攜將林杪月蘭舟原待水之涯夜月山遊四首丁亥既望應知月出遲東山臺迥坐延之錘峯一縷金絲現倐湧氷輪祗片時已愜崇情復暢觀誰云髙處不勝寒徘徊蓮漏聼逾刻適可言歸控玉鞍登東迎月降西背比出平林宛又逢却笑拘墟較里許碧山滄海自重重嶺態峯姿漾若浮聞聲不見鹿呦呦陸離田地光明境筞馬真成汗漫遊夜遊山月作歌戊子我昨御園泛秋月塞館山遊興已寄昨在御園有行將駐塞館䇿騎更山遊之句望前到此原宜舟即景短章吟以四近於山莊泛月得四絶句侵尋過望月出遲登山延待循前例邇年䇿騎山遊率先登山待月之上山髙更上一層臺果早氷輪見東壁叶東壁初拖一線金瞥眼圓光湧天際據鞍載月下崇椒乍見峯凹乍林翳離竒變幻莫可狀豈識銀蟾本無意亦可乗舟亦䇿騎雙佳並美山莊萃登臺待月之作壬辰過望月上遲載月遲開舟我欲早見之登臺舊例由向晚陟霞標暑消凉風颼斯已天半髙臺更髙一籌錘峯正當東夕陽滿峰頭須㬰暮色上蒼然暗川溝樹未忽不辨都如碧海浮左界漸生光横嶺如岸陬金輪欲飛騰復被錘峯留錘峯安能留全體露轉眸下臺仍據鞍䇿馬為山遊夜遊山月十六夜因用十六月字湖月藉山佳山月佳可想下臺月共來筞馬月同徃入谷疑月藏陟巘披月朗月情誰則知月光衆斯仰月雲月宇消月風月林盪對月吟月詩問月容月賞夜遊山月二首癸巳過望月遲升登臺例待曽錘峰纔漸吐璇宇倐飛騰遊月有别談嚲鞭真絶勝廣寒近尺五縁在最髙層金碧光無定千林漾若流夜明豈行暗山實訝乗浮出谷還屏燭中人例以燭來迎却之到湖仍泛舟遂將青雀舫山莊載月舟名幻作謝家樓夜遊山月歌甲午遊湖必以船黄頭盪漿實逸耳遊山則以馬紫騮控轡微勞矣人情喜逸而惡勞我意乃覺殊乎彼逸斯忘善勞斯思文伯母言具至理銀蟾光照無私偏豈揀擇乎湖與山湖之漭沆止一水山之嶊崣多崇巒崇巒掩映互吞吐隨步換形人各為覩急不可捉緩已失景特異其平挹金波慢摇櫓過望夕月升遲往例登臺以待兹待兹而升益親切遂與共載玉鞍窮幽竒出山湖岸艤蘭舸下馬依然泛瀛坐北人馬及南人船一夕兩兼無不可夜遊山月四首乙未過望氷輪遲上天登臺遼待例依前須㬰東壁光生處一縷金絲拖嶺巔絲矣而眉眉半璧忽為圎璧掛錘峯屈伸臂頃幻如是陶惜焉能覔此宗便教乗馬下崇椒屏却銀燈朗燭霄詎是艷誇北人慣箇中妙處習相調髙下都非塵世界林巒總是碧琉璃廣寒輪廓三千里䇿馬遊中却阿誰夜遊山月雜詠己亥望舒按轡上應遲仍陟霞標坐待之髙處不遮山現早一端窮理見於斯待月之昇共月行巖岡徐下馬蹄輕别來斯景兩寒暑昨日今宵瞥眼呈風閃林光銀葉翻網淪筑韻瀑聲喧底須研練成新句癸未長歌已備言峻坂原非直馳下徘徊月宇緩鳴鞭清遨略寓習勞意望七人猶未歇肩霞標用己亥夜遊山月四首韻辛丑霞標今畨去聲到來遲既到何妨小憩之己亥詩兹辛丑和流隂三嵗迅如斯磵道肩輿緩緩行拂林秋籟颯寒輕山軒迥出諸峰表翠邏青圍眼底呈隨處芸編閒可翻雅宜靜會逺塵喧却因博覽得其要祗在躬行不在言待月常年原有例今年弗試夜行鞭向年夜遊山月每乗馬至霞標坐待月上遂䇿騎遊山而下故己亥詩有清遨畧寓習勞意望七人猶未歇肩之句今年逾古稀園中每肩輿緩行不復事夜間跂馬之遊矣畧餘精力勤㡬勑天下時仔正在肩霞標弗待月壬寅霞標弗待月去嵗斯已然往年夜遊山月每于望後登霞標之平臺坐待月升跂馬而下昨嵗即未如向例故有待月常年原有例今年弗試夜行鞭之句萬山之中夜跋馬自覺罄控艱周旋有如銜橛亦何要身先去聲習武寧渠謂此言霞標弗待月肩輿卓午宛蒞止適纔雖有言或者好逸為遊語叶即景婆娑興不淺未免見獵心猶喜心喜其如力勿從古稀天子誠老矣四壁勒有夜遊山月詩歴吟祗益增慚耳鶯囀喬木亭當萬樹園之陽翠榦凌雲濃隂宻布聖祖御題額曰鶯囀喬木于時春也倉庚于飛睍睆下上斯亭近俯清波逺連叢樾和風澹沲載好其音嚮時之鳥蔭託上林嚶鳴共樂蓋萬物各得其天不獨山光悦鳥性也聖祖御製詩鶯囀喬木三集甫田叢樾之西夏木千章濃隂數里晨曦始旭宿露未晞黄鳥好音與薰風相和流聲逸韻山中一部笙簧也昨日聞鶯鳴栁樹今朝閲馬至崇杠朱英紫脱平原緑月駟雲錯落駹御製詩鶯囀喬木恭和皇祖聖祖仁皇帝御製元韻辛酉再歴仙居遊似夢重瞻睿作筆如杠靈臺却在榆關外博望無勞更出駹鶯囀喬木壬申山深悦鳥性喬木早遷鶯最愛清和節頻聞睍睆聲雙柑思舊韻一部錫新名山中一部笙簧也聖祖小序中語欹案觀宵雅嚶嚶倍有情香逺益清萬樹園東南金山之隂搆殿數重曲沼漣漪凉軒明净緑房紫菂芳菲襲人當雨過風來生香逺挹對之覺心境雙清前殿五楹聖祖御題額曰香逺益清聨曰逺見波光來玉澗近臨山翠入書忩後殿三楹額曰紫浮稍西置八楹額曰依緑齋聨曰喬木拂窓連嶺翠澄波映檻接天光齋左有亭御題額曰含澄景聖祖御製詞香逺益清調栁梢青三集曲水之東開凉軒前後臨池中植重臺千葉諸名種翠蓋臨波朱房含露流風冉冉芳氣竟谷出水漣漪香清益逺不染偏竒沙漠龍堆青湖芳草疑是誰知移根各地參差歸何處那分公私樓起千層荷占數頃炎景相宜御製詞香逺益清恭和皇祖聖祖仁皇帝御製元韻調栁稍青辛酉俯弄清漪平臨錦繡净植含竒華嶽峰頭西施湖畔幽艷誰知秋來老幹差差芳菲歇造物無私詩擬丰標圖摹體態多少便宜御製詩香逺益清壬申春光六月天照臨濯清漣逸韻風前别生香雨後鮮揚漪明塞日標倩暗溪烟松島蓮花寺空聞十景𫝊依緑齋甲戌依樹開軒榭嘉隂緑滿窻階前書帶裊墻外玉琹淙梁燕窺巢舊山鼯掇果雙掞毫期擬古花讓筆生江金蓮映日金蓮花本出五臺移植山莊體物肖形載賡天藻曼陀優鉢無以逾兹延薫山館之右有殿五楹西向是花環蒔葉亞枝交含風浥露每晨光唘牖旭影臨鋪金彩鮮新爛然匝地牓曰金蓮映日旁室三楹御題額曰川巖明秀爽塏髙明實綜覽湖山勝㮣云聖祖御製詩金蓮映日三集廣庭數畝植金蓮花萬本枝葉髙挺花面圓徑二寸餘日光照射精彩煥目登樓下視直作黄金布地觀正色山川秀金蓮出五臺塞北無梅竹炎天映日開御製詩金蓮映日恭和皇祖聖祖仁皇帝御製元韻辛酉輝煌麗曉日璀璨映重臺布地黄金滿祗園此處開金蓮映日玉井曽標秀金臺别擅竒輝輝争日色灼灼動風枝銀氣常蔥蔚晶光自陸離清凉慢相訝古佛實都兹逺近泉聲縁長隄而北石路半里許漸聞水聲鳴湍響澗滙音橋畔摐金戛玉水樂琅然殿三楹南嚮聖祖御題額曰逺近泉聲其東二楹額曰聚香齋聨曰四圍山色連雲漢一徑林邊去暑風殿後為亭額曰聴瀑蓋瀑布最勝處也聨曰四面浮青開日景一泓澄碧見天心殿外三楹面南髙敞水際風來泠然善也御題額曰招凉榭聖祖御製詩逺近泉聲三集北為趵突泉涌地觱沸西為瀑布銀河倒㵼晶簾映崖微風斜捲珠璣散空前後池塘白蓮萬朶花芬泉響直入廬山勝境矣引泉開瀑布迸水起飛珠鏘玉雲巖應色空有若無御製詩逺近泉聲恭和皇祖聖祖仁皇帝御製元韻辛酉飛流疑掛玉濺沫似噴珠舊識題崖字於今半有無逺近泉聲壬申鑿石布垂瀑釃流帛裂湖泉堪傲虎趵峰得號香罏偶在參天一閒憑味道腴醉魚時蹙浪上下濺明珠招凉榭甲戌嘉䕃之下芳草多塞水無定流成河西峯遮夕陽北谷來風凉三間虛榭堪徜徉萬民疾苦吾心藏於此聊以騐嵗月亦不自道傲羲皇招凉榭戊寅傍午小炎蒸山田正資長秋長利在農豈計礙遊賞近西得陰早信步尋凉徃豁然水雲榭適可恱俯仰襟袖覺颯寒眉目為清朗舉頭見題額副實誠不爽招凉榭己夘地近西山得隂早秋來婪熱藉招凉詎因颯爽清煩慮却幸西成候正長戯題招凉榭􅏤辰突兀千林山寂寥坐來謖聴落崖飈偶然題句還呵凍榭號招凉懶更招招凉榭辛巳午熱圖延爽因之水榭虚緑隂風果陗藍尾暑全袪欣為秋宜稼愁虞兩致洳愁欣渾不定臨眺且躊躇招凉榭癸未山莊無處不招凉此處招凉最異常已謝葛衣坐來換便拚紈扇篋中藏階臨緑水袪塵逺簷拂蒼松引籟長何必對時稱畏日可知多稼正宜𤾉招凉榭甲申午熱復覺熾言憩招凉榭便自清風來副名信堪訝西峯本無縫喬樹則有罅延颸而蔽曦妙境奪造化然予引餘思嬗代弗相假即看颯颯秋已謝炎炎夏奚用更招凉且此欣宜稼招凉榭丙戌婪暑劇難勝招凉榭可憑林踈延籟入峯峻致隂増體爽亦何有農祥還欲徵山田新得兩萬寳藉暄登招凉榭丁丑敞榭􅇈嘉䕃秋凉聊復招近西隂得速臨水爽來遥果覺衣増颯竟堪扇罷摇心懐别有喜催熟晩田苗招凉榭乙丑山髙日先下川闊風偏來敞榭搆其間招凉信宜哉昨近午熱劇鬱燠猶未囘明知利稼穡陽曝實栗催延縁至此間頓覺暑氣摧心神為灑然㸃筆稱去聲清陪招凉榭口號壬辰借問凉從何處招招為能即凉為所虚榭空空付不知坐來人自饒緒語招凉榭癸巳仙莊稱避暑水榭更招凉雲巘列峭蒨烟波鋪𣺌茫砌芳動輕籟阪樹逺斜陽妙趣非言會忘言趣越長招凉榭甲午曉凉午熱恒山莊不常之常乃真常今朝卓午頗覺熱肩輿因即來招凉虛榭果然有獨擅隂濃風颯信白藏炎熇不知避何處生衣欲換紗衣裳有喜鮎筆不在此在彼山田實票晅秋陽招凉榭乙未避暑那無暑招凉便有凉了知他所異原是此間長喬樹延爽籟嶤峯隠夕陽祇須置班詠紈扇早斯藏招凉榭丙申盤磴降於原有榭仍近水谷風從北來拂水爽無比峭壁峙在西得隂斯早已山莊少炎熱偶熱即憩此招凉底用招聽其自至耳招凉榭己亥都名避暑莊而暑亦恒有是處招凉榭惟凉暑則否其故謂云何五字可得剖西壁髙百尋峯隂每早取前林羅衆木摇風爽常受而况帯以溪澄澈逺塵垢弗招凉自致曰招饒滕口招凉榭立秋前一日作庚子明日當立秋今日猶夏節晴曦發數朝鬱蒸為酷熱炎官設孤注金帝讓餘烈宜暘共農欣招凉適已悦在彼在此際吾意向誰説招凉榭辛丑已覺秋凉何必招却因婪尾略餘歊笑他熱似老來徤例我吟如債合消日轉西峰隂得早風翻喬樹爽偏邀便蒸為雨應無碍農候三庚正利蕎招凉榭二首壬寅上伏于斯稱憩陪緑隂碧草净無埃新凉問作何招得昨近都縁過雨來漫云心静自然凉心静還因恊雨𤾉今日方知榭佳處水風清拂葛衣裳聚香齋壬午衆香國土光明鏡題額當年緬掞毫書按墨林清晝暇不開帙此讀離騷聼瀑亭子作癸未瀑自有源惟地靈溪原無定藉人營剔除泥滓疏新水始得泉聲副昔名逺近泉聲為山莊三十六景之一聴瀑亭子在其側皆皇祖御題也瀑固如常溪則年久沙淤茲因䟽剔始得復舊觀云溪分髙下作聲繁瀑落雲中峽底翻一例空去聲人凡耳目那更平聲伯仲藉量論欽定熱河志卷二十八
