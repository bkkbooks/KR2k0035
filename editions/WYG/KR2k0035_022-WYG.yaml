body:
  text: 欽定四庫全書欽定熱河志卷二十二廵典十御製詩己亥幸避暑山荘唘程之作有序典具如初法駕展七程之始禮循乎古吉行踰兩載而遥􅃡祖制之常遵秋蒐仍飭歎慈歡之夙奉夏凊難追時則栁陌微涼梅霖正霽爰御驄而曉發習勞還似當年憶扶輦以徐臻紀事頓殊前度歴山郵而臨避暑北道依然排星罕以指清河東門詄若撫盈眸之禾黍劭農藉用慰焉接撲面之雲嵐顧我何為情也適來行館合有新吟朅爾宣毫忍披舊什長言誌感小引抒懐又是常年避暑時由來兩嵗未行斯分明似昔全殊境展轉於懐那措詞經國深猷述祖徳奉輿欽養􅃡慈儀山荘指日蹕将駐踊懼難為即景詩出古北口兩年未此度巖闗昔嵗情懐想像間戎詰敢因忘祖制歡承那再奉慈顔閭閻滋庶籌衣食市肆無征任往還古北口雖設闗門啇賈出入例不征稅承徳府新興學校兼觀士習可雍嫻至避暑山荘得句承徳新陞以府名四民歡忭路旁迎山河自是萬古閱寒暑忽教兩嵗更雖曰勵躬法祖志傷哉廻首養親情初來例有詩篇紀慙愧無端七字成熱河唘蹕木蘭行圍之作中秋節過唘蒐程祖制昭垂奕葉明肯以長年有所倦亦惟勵已不渝誠乍驚兩嵗倥􅘓閱益切諸藩愛戴情廻望難堪追憶處幾曾清曉問安行向年唘蹕幸木蘭日必先詣情出告之禮於今追憶實難為慈闈請安申木蘭廻蹕至避暑山荘作往還原自向年同疊樹高低緑變紅稅駕徒然駐塞苑問安那復謁慈宫即今對景淡無味憶昔承歡恨不竆清夜芸齋頻有夢夢醒其奈總成空四十四年五月乙未上唘蹕廵幸塞外是日駐蹕石槽行宫降㫖蠲免所過地方額賦十分之三戊戌出古北口辛丑至熱河行宫丁未上詣文廟行釋奠禮詳見學校門七月丙午上御卷阿勝境賜扈從王公大臣蒙古王公台吉茶果丁未巳酉亦如之庚戌閱歩踏八月甲寅上御卷阿勝境賜扈從王公大臣蒙古王公台吉茶果凡六日乙卯土爾扈特貝子竒布坦等入覲丁巳杜爾伯特札薩克台吉伯拜等入覲並賜茶果癸亥亦如之甲子上萬夀聖節御澹泊敬誠殿扈從王公文武大臣官員䝉古王公台吉及土爾扈特貝子杜爾伯特札薩克台吉等行慶賀禮御卷阿勝境賜王公大臣䝉古王公台吉及土爾扈特貝子杜爾伯特札薩克台吉等茶果凡三日戊辰上唘蹕行圍木蘭丙子駐蹕穆逹烏拉岱䝉古王公進御宴閱馬戲丁丑行圍殪虎駐蹕巴顔布爾哈蘓台九月甲申行圍殪虎駐蹕伊遜河丙戌駐蹕張三營賜䝉古王公台吉及土爾扈特貝子杜爾伯特札薩克台吉等飯己丑上廻熱河行宫甲午上唘蹕自熱河廻鑾丁酉入古北口庚子上廻圓明園御製詩庚子幸避暑山荘啟程之作祭澤𫝊臚遴庶士蕆諸務益敬勤增廵方歸未半月閱避暑諏惟吉日應鷺序鴛行列班聚玉鞭珠勒啟行仍古稀天子猶乘馬廻蹕旬日各官北郊殿試㪚館選翰林引見文武諸務次第悉舉即於二十一日啟程幸避暑山荘􅇒暑䇿騎控御如常雖年已七十未覺鞍馬煩勞也無逸幾去聲垂元與曾出古北口千載巖城雖就隤亦餘埤堄枕崔嵬藉㸔歴代興亡蹟不外一言徳險該禾黍青䓤經雨後黔黎踴躍識鑾來守斯足矣為門户慚愧伊犂萬里恢至避暑山荘駐蹕即事一律過嶺廣仁遙㸔日上東山荘萬木翠雲籠右祠城隍廟左廟文廟胥瞻曁後海先河此意同避暑兼因避曠典朕五旬六旬大慶之年皆於宫中御殿受賀後乃啟蹕來熱河今年有所不欲故照常例五月即啟行致閒返以致躋公熱河官吏兵民乃畧有綴景為迎鑾慶夀之舉雖事已成然非所喜也雖然昨嵗曾經駐切切懐思未解𠂻八月十三日於避暑山荘行七旬慶典即事成什御殿庚寅禮未仍每嵗誕辰率在山荘逢大慶始於京師御殿受賀故庚寅嵗有十年一度一臨軒之句今嵗以不能似庚寅率羣臣於舉行慈寕宫行禮故不忍御殿受賀祇在山荘照例山荘聊聽慶岡陵七旬屈指數上聲今古六帝因心騐法懲三代以後帝王享國年逾七旬者六帝漢武帝梁高祖唐明皇宋高宗元世祖明太祖其中可法者惟元世祖明太祖然亦不能無遺憾焉其餘皆予所鄙以為戒者北塞駢田朝衆部西天歡喜祝神僧班禪額爾徳呢自後藏逺來慶祝各䝉古王公台吉喀爾喀衛拉特等一聞其来無不歡忭踴躍實為我國家吉祥盛事宜言吉日弗言慽東望松齋慽不勝正殿之左即率羣松鶴齋為昔年逢萬夀節臣行禮之處避暑山荘廻鑾謁陵駐蹕喀喇河屯之作踐祚之初廿五曾居諸忽逮七旬増未其隕越深䝉業用是東西敬謁陵蹙蹕罷圍非少懈今年予七旬初度禮應㳟謁即於兩陵䖍申展謁因罷木蘭行圍八月二十八日自熱河啟行計廽蹕至圓明園仍在九月下旬初指荘豫訂勵丕承灤陽别墅行來近穏度輿梁衆喜仍昨因夏潦浮橋難立往來行人問渡稽滯兹秋爽連晴輿梁穩度扈從人等並無䟦渉之苦入古北口敬以謁陵清蹕旋巖闗入乃早常年寥寥空宇净雲氣昨夜微雨矗矗諸峰朗霽烟石彴紫橋歛秋潦崇墉比櫛獲山田迤南窪地多遭沴繾彼忘兹祇􅍀然四十五年五月己亥上啟蹕廵幸塞外是日駐蹕石槽行宫降㫖蠲免所過地方額賦十分之三壬寅出古北口乙巳至熱河行宫七月癸巳年班回部葉爾𦍑三品阿竒木伯克貝子色提布阿爾第等又杜爾伯特親王䇿楞悟巴什土爾扈特貝子沙拉扣肯等㳟祝萬夀及喀什噶爾四品噶咱納齊伯克愛逹爾之子烏曽克等入覲上御依清曠殿並召見賜茶甲午木坪宣慰司堅木恭囊康及各上司土舎頭日等入覲於惠廸吉門外丁酉班禪額爾徳呢自後藏至詳見徠逺門於澹泊敬誠殿跪請聖安上御依清曠殿賜坐賜茶果命班禪額爾徳呢至須彌福夀之廟居住庚子上御萬樹園賜班禪額爾徳呢等並扈從王公大臣䝉古王公台吉及回部阿竒木伯克貝子杜爾伯特親王土爾扈特貝子及木坪宣慰司等宴賞賚金幣有差辛丑杜爾伯特汗嗎克蘇爾札布等土爾扈特郡王色楞等恭祝萬夀入覲上御卷阿勝境並召見命同班禪額爾徳呢等並扈從王公大臣䝉古王公台吉及回部阿竒木伯克貝子杜爾伯特親王土爾扈特貝子及木坪宣慰司等賜茶果壬寅悟梁海㪚秩大臣伊素特等恭祝萬夀入覲上御卷阿勝境召見命同扈從王公大臣䝉古王公台吉及回部阿竒木伯克貝子杜爾伯特汗土爾扈特郡王及木坪宣慰司等賜茶果癸卯甲辰乙巳皆如之丙午閱步踏八月戊申上御卷阿勝境賜扈從王公大臣䝉古王公台吉及回部郡王阿竒木伯克貝子杜爾伯特汗土爾扈特郡王悟梁海㪚秩大臣及木坪宣慰司等茶果乙酉上御卷阿勝境賜班禪額爾徳呢等及扈從王公大臣䝉古王公台吉回部郡王阿竒木伯克貝子杜爾伯特汗土爾扈特郡王及木坪宣慰司等茶果庚戌辛亥皆如之丁巳上御避暑山荘宫門土爾扈特汗䇿凌那木札爾等及朝鮮正使錦城尉朴明源等同時入覲恭祝萬夀跪請聖安戊午上御卷阿勝境賜班禪額爾徳呢等並扈從王公大臣䝉古王公台吉回部郡王阿竒木伯克貝子杜爾伯特汗土爾扈特汗朝鮮正使及木坪宣尉司等茶果己未上萬夀聖節御澹泊敬誠殿扈從王公大臣文武官員䝉古王公大臣貝勒台吉回部郡王阿竒木伯克貝子杜爾伯特汗土爾扈特汗朝鮮正使悟梁海㪚秩大臣及木坪宣慰司等行慶賀禮並命隨至卷阿勝境賜茶果庚申上御卷阿勝境復賜茶果是晩上御萬樹園賜班禪額爾徳呢等並扈從王公大臣䝉古王公台吉回部郡王及阿竒木伯克貝子杜爾伯特汗土爾扈特汗朝鮮正使及木坪宣慰司等觀火戲辛酉上御卷阿勝境賜扈從王公大臣䝉古王公台吉等茶果壬戌亦如之是晩上御萬樹園賜班禪額爾徳呢等並扈從王公大臣䝉古王公台吉等觀火戲乙丑上御萬樹園賜班禪額爾徳呢等並扈從王公大臣䝉古王公台吉等宴甲戍上自熱河廻鑾謁陵九月丁丑入古北口乙未上廻圓明園御製詩辛丑幸避暑山荘啟蹕之作通宵雲凈曉晴豪避暑行廵例向遭衣用袷紗破晨爽㡌垂釐毳却炎饕東門依舊千官送廣甸懐新多稼叨袖嚲玉鞭控珠勒珠勒雖為鞍轡用語然國語及䝉古語皆為小歩馬之稱即俗所為走馬也敢為圖逸謝年高出古北口按頓行宫清蹕移巖闗度處爽風披今來古徃供詩料敗壘殘垣入畫姿萬里原非一時舉一心恒繋萬年思固知不藉兹為守却恐侵尋或守兹至避暑山荘駐蹕即事得句山荘避暑例依前是日行旌涖止便皜日揚輝瀼麥露輕風拂爽引槐烟經營敬迎垂奕世䟦渉寧當謝長上聲年仍擬木蘭親校獵徒云即鹿豈其然八月十六日避暑山荘啟蹕徃木蘭之作去嵗罷圍因大慶今年行獮例依常中秋甫過餅𤓰節上塞非遙麅鹿塲幾度溪橋消野漲歴觀村圃得中穰近年塞外雨雖勤然旋雨旋霽不致大潦尚有三䮒之收古稀有一仍䋲武不息體乾勵自强木蘭廻蹕至避暑山荘作廻㸔射鹿木蘭邉千里雲收淨碧天蒞止山荘秋又季搜吟書屋景當前峯容林態自終古安問歡承異昔年不可無言紀時日有言祇益意悽然四十六年閏五月庚戍上啟蹕廵幸塞外是日駐蹕石槽行宫降㫖蠲免所過地方額賦十分之三癸丑出古北口丙辰至熱河行宫七月辛酉安南國使臣阮維宏等於惠廸吉門外道旁瞻覲天顔上加賞該國王縀疋及使臣等銀幣有差乙丑上御卷阿聖境賜扈從王公大臣䝉古王公貝勒額駙台吉等茶果凡五日庚午閱歩踏入月壬申上御卷阿勝境賜扈從王公大臣䝉古王公貝勒台吉等茶果癸酉甲戌皆如之乙亥上御卷阿勝境土爾扈特台吉額爾徳呢等入覲召見賜茶並命同扈從王公大臣䝉古王公貝勒台吉等賜茶果丙子亦如之丁丑哲布尊丹巴胡土克圖入覲上御依清曠殿召見賜茶戊寅杜爾伯特扎薩克台吉布爾布逹爾濟等入覲於惠迪吉門外跪迎聖駕庚辰上御萬樹園賜扈從王公大臣䝉古王公貝勒台吉等及哲布尊丹巴胡土克圖並土爾扈特台吉杜爾伯特札薩克台吉等宴是晩上御萬樹園賜扈從王公大臣䝉古王公貝勒台吉等及哲布尊丹巴胡土克圖並土爾扈特台吉杜爾伯特札薩克台吉等茶果觀火戲壬午上御卷阿勝境賜扈從王公䝉古王公貝勒台吉等及土爾扈特杜爾伯特等茶果癸未上萬夀聖節御澹泊敬誠殿扈從王公大臣文武官員等行慶賀禮御卷阿勝境賜扈從王公大臣䝉古王公貝勒台吉等及土爾扈特台吉杜爾伯特台吉等茶果甲申上御卷阿勝境賜扈從王公大臣䝉古王公貝勒台吉及土爾扈特台吉杜爾伯特台吉等茶果乙酉亦如之丙戍上唘蹕行圍木蘭庚寅行圍殪虎駐蹕海拉蘇台己亥行圍殪虎駐蹕阿穆巴究溝口喀拉沁郡王那特納錫第恭進御宴閱馬戲九月庚子朔行圍殪虎駐蹕烏蘭哈達癸卯駐蹕張三營賜䝉古王公貝勒台吉等飯丙午上廻熱河行宫乙卯上唘蹕自熱河廻鑾戊午入古北口壬寅上廻圓明園御製詩壬寅幸避暑山莊啟蹕之作老年人率不禁暑避暑誠應每嵗行况是山莊貽聖祖遂教吉日發都京前朝炎熱兹更平聲爽左近霑霖此却晴歩出東門仍御馬旣勤已亦愜輿情出古北口詠事古北今城夜戸開山莊避暑復兹來有懐莫致雄關守無黨惟欣王道恢沙壓水衝餘廢址巖梯嶺冠尚存臺弗資民力那能此似此勞民信可咍至避暑山莊即事得句宿雨清塵度嶺郵府今承德昔興州人勤農賈滋而庶户有絃歌教以脩學政金士松嵗試承徳府生童甫畢率令諸生於是日迎駕冉問孔云斯正合李唐趙宋此能不撫時益切持盈志曰奉無私莫外求啟蹕木蘭之作霽景川原麗曉晴撰辰却喜發虞旌自强一已仍乗馬扈蹕諸藩衣是鶯扈駕衆蒙古賜黄祫者多眞一朶黄雲也幾曲野橋新漲到滿空清􅄜嫩凉輕秋收非稔亦非歉三鬴差堪慰細氓木蘭廽蹕至避暑山莊作徃還廿日覺無何颯景山莊換幾多已是丹楓贏翠桞却㸔黄菊伴紅荷雀如話别簷頭噪雁解傳霜嶺外過詩本黄綾頁將滿合饒黙賞閣吟哦四十七年五月戊申上啟蹕廵幸塞外是日駐蹕石槽行宮降㫖蠲免所過地方額賦十分之三辛亥出古北口甲寅至熱河行宫七月己未上御卷阿勝境賜扈從王公大臣䝉古王公貝勒台吉等茶果凡五日甲子閱步踏八月戊辰上御卷阿勝境土爾扈特頭等台吉阿拉克巴等入覲召見賜茶命同扈從王公大臣䝉古王公貝勒台吉等賜茶果並賞冠服金幣有差己巳土爾扈特協理台吉德爾德史等入覲上御卷阿勝境召見賜茶並命同扈從王公大臣䝉古王公貝勒台吉等及土爾扈特頭等台吉等賜茶果並賜冠服金幣有差庚午上御卷阿勝境賜扈從王公大臣䝉古王公貝勒台吉及土爾扈特台吉等茶果辛未上御卷阿勝境都爾伯特貝子羅卜藏薩木坦等入覲召見賜茶並命同扈從王公大臣䝉古王公貝勒台吉等並土爾扈特台吉等賜茶果並賜冠服金幣有差壬申上御卷阿勝境賜扈從王公大臣䝉古王公貝勒台吉等並土爾扈特台吉都爾伯特貝子等茶果丙子亦如之丁丑上萬夀聖節御澹泊敬誠殿王公大臣文武官員等行慶賀禮御卷阿勝境賜扈從王公大臣䝉古王公貝勒台吉等並土爾扈特台吉都爾伯特貝子等茶果戊寅上御卷阿勝境賜扈從王公大臣䝉古王公貝勒台吉等並土爾扈特台吉都爾伯特貝子等茶果癸未上啟蹕行圍木蘭甲午行圍殪虎駐蹕額勒蘇什那九月乙未朔駐蹕阿穆巴究溝口喀拉沁郡王納特那鍚第恭進御宴閱馬戲丙申行圍殪虎駐蹕烏蘭哈達己亥駐蹕張三營賜䝉古王公貝勒台吉等飯壬寅上廻熱河行宫庚戍上啟蹕自熱河廻鑾甲寅入古北口丙辰上廻圓明園欽定熱河志卷二十二
