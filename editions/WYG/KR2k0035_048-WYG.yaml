body:
  text: 圍場四哨鹿哨鹿以秋分前後為期鹿性於秋前牝牡各為羣中秋後則牝分羣而求牡也哨鹿擇林壑深幽獸羣總萃之所至期上於昧爽前出營旌門外燎火以俟隨從侍衛以次而留從者不過數十騎皆屏息單行不聞聲響既至其所各戴鹿首為導其哨以木為之隨機達變低昂應聲鹿即隨至上每親發神鎗殪之伏讀御製前後哨鹿賦研精物理義藴賅備可以騐氣機可以通道妙非蠡管可能窺也既竣事回行營或即其地啟蹕焉御製賦哨鹿賦有序己巳賦者古詩之流詩以言志其有不能盡言之志則賦可以申之我皇祖昔喜哨鹿朕沖齡隨侍習聞其事年來乃親試為之嘉其有合於聖經顧古人無賦之者故不愧無文其辭曰伊白露宵中之候正伊尼孶尾之時生不息焉洪鈞運而難測物雖蠢也氣機至而咸知故三序春夏冬則牝牡各從其類謂牝隨牝羣牡逐牡侣惟中去聲秋斯牝牡各嫓其妃謂牝各分羣而匹牡强有力者不惟挾兩而累十弱無能者或乏獨匹以相隨或依林而命侣或據嶺而分畿或悍害而傲衆或謹守而自持或豪敓而攘彼或竊取以私其萬態紛其莫窮一以音而宣之於是虞人善因聲以察情爰體情以斆聲喜金風之颯爽値玉宇之晶明霜重而不言其冷露濃而那覺其零陵嶮㠊而如登祍席冐䝉茸而不異户庭慮吾遊之晏起虞原獸之怠鳴鹿迨晨則􅂴鳴哨亦不進故哨鹿者恒於未曙前即往夙戒僕而奚從欣戴月而披星舎彼寛衣宜兹短服荷長哨於左肩以木為哨鹿之具呦呦以鳴出象首於右簏象鹿之首人戴之則鹿不疑躐嶒陟嵕沿谿寄谷攀蘿兮豈辭胼手履石兮何妨馗足蓋以暢兹心神詎惟饕其口腹於焉蹵乎崔嵬軼彼嵾嵳上干丹楓之巘下視白雲之隈上風餮切之避忘陽林晃耀則紆迴就叢薄之蔽翳反􅆩裘而毰毸衆條理焉畢會乃得傑雄之争匹者呦踉蹌而徐來角八乂兮嶷嶷耳雙聳兮濕濕挺强項兮莫攖矗靈鼻兮善䶋始赫侣兮自閑乃妬異兮矜急既漎漎兮疾赴復兮少戢蓋屢試兮絶猜遂鋭志兮直入爾其動林無形匪風有響適其將至撇爾懼往奮角思觸瀏睨争長則在夫能哨者善達變以隨機比用中而執兩或激其怒兮使進或示以弱兮令放惟察情之喜怒乃應聲而􅊠仰蓋用心於既專斯通靈而不爽既然矣無動無慮不徐不遽驀黶合之前陳陡應叱而少住屛營收息量卑揣髙傍斗窺星鎗上施星斗所以審高低度分以毫審度發機馥焉中膏命處擇肥登于大庖若夫多疑旁剔既進中止膽劣心狷狐猜狼視未交戰而長跳敺叢樾而如駛則亦比之窮㓂之莫追又何必焚林而盡取哉蓋嘗研精哨鹿之理而知五徳焉取一以新匪二以頻仁也逆者斃之去者寘之義也爰登簠簋爰嘏福履禮也招之即至獲之即遂智也呼哨以進射宿凛訓信也如是者蓋有合於聖人之洪道而又豈潘岳耽盤流遁之所誡相如子虚上林之所嘲也哉後哨鹿賦癸酉或問哨鹿之時之法之義蓋已藴賅前賦矣若夫冐凛冽之霜晨衝䝉翳之林薄踐岞㠋之巉峰涉沮洳之幽壑十哨未必一來十來未必一獲獲乃心忻失斯興索多見其勞鮮聞其樂則何不張堂堂之圍按徐徐之度收籍籍之富免皇皇之謔而故為是寒征而曉作者何哉曰吁是何言耶是何言耶見土障葛燈而􅅓為己過者非忘其先也耶逸則淫而勞則思季氏之婦猶聞之固可弛其惕乾耶或曰惕乾者蓋不若是矣意者慎大寶居法宫屏九御接三公劭農政熈天工豈謂當即鹿於隍中耶曰子知其一未知其二坐吾語汝賦以見兹若夫高談堯舜深處廟廊文恬武嬉内弱外强孰不喜夫逸體而庸詎知其頺綱也哉且也身歴其難者告之以人之難而知而不知人之餒者方謂何不食肉糜也是以神區天闢後法先垂詰戎習衆謹度節時圍以示正哨以出竒得之艱者趣斯永躬其勞者樂亦隨蓋理境之當窮可絜短而深思也於是秋木蕭辰塞猶凄所宵風定兮林静曉月上兮山阻儦儦者妬羣俟俟者擕侣遵彼􅜓􅜓之蹊如或殷殷而佇吹長哨以通情似應聲而答語去亦弗追來亦弗拒則有强者捍捩弱者趦趄猜者飄瞥怯者踟躇慷慨者恲性昬瞀者糢糊雖人情之萬態亦奚有以異諸縁輳物來獲一勝百其來也亦惟去之是慮其獲也夫何失之足惜去與來固難期之儻然失與獲亦無定之屢易吾因以參如幻於現前愛景光而為適也爾其問夜宵衣據鞍䇿馬萬帳燈明七萃聲寡是則始出營而覽離竒晃耀之狀也若夫炬影漸逺夜色猶暝峯嶺纔分林樹未形乍如夢遊玉樓十二仙人京乃其曉蟾初吐或半或圓隔葉㶑露度水翻瀾又如虹橋可攝徑欲造廣寒髙山出雲雲去山在變幻頃刻步移觀改則何異夫黄山之海赤烏扶桑霧歛氛開玫瑰靺鞈熊熊回回又奚數其初陽之臺于焉入深樾凌崇巒宻容單騎疎見線天千年落葉鱗祴谷填色作黄金風吹不翻臭如沉水履若􅄢氊㣶徊乎静真乎忽訝夫身入布地之園而伊尼之羣方且左右前後與人周旋失兮獲兮勞兮樂兮率已相忘於無何有之禪矣問者茫然不知所謂懡㦬跼蹐唯唯而退御製詩哨鹿丁夘呦鹿鳴深秋虞人哨致之格物有會心祇縁聲應隨哨鹿古未聞差如鶴雉媒深澗一聲鳴麌麌争長來曉起登崇山山下止頓所萬燈如列星秋池浸天宇即鹿以類招偶一試其技鹿來固欣然鹿去亦可喜哨鹿己巳曉蟾駐魄碧光流哨鹿時惟八月秋䆳谷試呼來得得虞人真解學呦呦耽盤媒翳嗤剛挂閒放綸竿任釣舟朱鳥旋升開曉色塞中隨意作清遊哨鹿十韻壬申凌曉出帷城羽林簇隊行歴登千嶂迥俯視萬燈明宿處踪將逺虞人技各呈扈隨留次第哨鹿之法貴減從無聲故隨從之人以次而留翳伏展長聲纔辨林分色俄聞鹿荅鳴最嫌心卞急要在氣和平强弱微窺勢去來仍體情從禽非浪漫付物有權衡連獲何須詡偶空亦豈怦豪遊真絶勝一覽衆嵐清哨鹿己卯白露雖已過二三十年前鹿鳴以白露前後為候今率以秋分前後為候蓋天道自南而北氣漸暄暖云氣暄鹿鳴遲天道自南北一端此可譬山莊過中秋應候呦聲試哨必有定所松巖特佳地札克丹鄂佛洛漢語即松巖也蓋宜哨之處亦不多得松巖其一也披星出御營霜坂䟦輕騎一暢尋樂懐一寓習勞意習勞以身先與衆無不同仄徑步屴崱短衣披䝉茸叢薄影白月絶壁下陗風低語學銜枚鋭進擬襲攻回頭語額駙去歳追賊蹤去歳固倫額駙塞卜騰班珠爾隨將軍兆惠追噶爾咱忒賊人恩克圖至庫隴奎地方以力戰受傷命回京兹隨哨鹿天甫黎明正同襲賊之候馬上詢及之誠不負教養讀書曾深宫深宫寧不逸塞野有㡳好繩武貴弗忘是中有要道晏起在所戒冐冷天將曉減從四五人攀陟窮峯㟽八义忽作聲餮切羊腸繞一鎗立斃之今日機縁巧縁巧匪恒逢未勞實鮮味圓中馳逐之鹿其肉勞而無味鎗斃者乃新鮮味佳也取佳進慈寧髙擎馳飛騎所餘命剥割野食頒衆暨人擅屠坦工斤斧髖髀試芒刃固不缺是謂善乗勢陡然憶西師㨗音尚待至哨鹿六韻聯步披蔥蒨人皆單行以防作響隨聲鹿聲也入翠㣲巴顔真富地巴顔木墩者富岡之謂也傳聞是名皇祖一日獲十二鹿於此故錫岱爾正争妃䝉古謂牡鹿為岱爾其來也為争其妃也命處端星的鳥鎗之尾有星首有斗所以審的命中者也屏營發火機横陳成振落跳去那騰飛玉馬欣然返明駝載以歸南山豐大特較此遜祥輝行營乾隆二十年定駐蹕大營内方外圓度地從二十丈六尺横十七丈四尺建黄幔城外加網城結繩為之黄色貫之以網髙六尺濶八尺凡百六十有六距幔城東西南各十八丈北十五丈設連帳百七十有五為内城啟旌門三門各建纛東鑲黄西正黄南正白各一纛以緞為之鑲黄鑲白鑲藍以紅縁鑲紅以白縁正黄正白正藍不加縁皆正幅銷金雲龍縿徑四尺八寸斿徑五寸杆長一丈四尺五寸周建内城旗四十有一旗以黄緞為之紅縁斜幅銷金雲龍縿徑二尺二寸斿徑三尺三寸斜幅罒尺杆長六尺七寸朱旄宿衛帳九距網城十有二丈為外城設連帳二百五十有四啟旌門四門各建纛東鑲白西鑲紅南正藍鑲藍浹日逓建之北正紅周建外城旗六十東北鑲黄西北正黄東南正白西南正紅各十有五旗縿徑三尺斿徑三尺餘如内城旗之制宿衛帳四外城東旁設内閣六部都察院提督等衙門官帳或東靣地狹則設外城南距外城六十丈周設警蹕帳四十各建䕶軍旗一東北鑲白西北鑲紅東南正藍西南鑲藍各十旗以緞為之俱斜幅不施繪繡縿徑一尺六寸斿徑一尺七寸斜徑二尺三寸杆長五尺五寸朱旄惟正紅旗黒旄重門拱衛星廬環布黄幔城正中御幄在焉幄髙二丈徑三丈四寸上為穹葢以攢竹杆百六十分搘之牆髙五尺六寸門前後各髙四尺六寸濶二尺三寸幄正中設御座髙一尺六寸五分縱三尺九寸五分横五尺七寸五分幄内左右懸佩刀櫜鞬鳥鎗各一庭左右各設圓幄一髙九尺五寸徑一丈五尺牆髙四尺五寸座後長幄髙七尺六寸縱一丈二尺横八尺直樑横棟簷左右垂髙五尺四方啟門後達帳殿横列三楹髙一丈一尺縱一丈三尺横三丈額曰四宜居東西室皆啟忩更後為圓幄三幔城外左右連帳茶膳儲偫各庀其事停蹕頓營外設黄幔城門南向如大營内城之制黄幔城中設圓幄一縱横各一丈六尺墻髙四尺門髙三尺七寸濶二尺三寸前後左右共設帳房八架凡㸔城之制與頓營同聖祖御製詩賦得帳殿鬱崔嵬四集茂林葉未黄賔雁始成行後隊分山岀前旌越嶺揚鹿鳴秋草盛人喜菊花香日暮帷宫近風髙暑氣藏其二清露知時轉纎雲却暑回豫遊臨石磴雜踏過河隈潭靜魚吹沫林踈鹿印苔秋成良可賦為此共徘徊御製詩御行營作乙丑行宫行盡御行營蒼莽秋原駐蹕清獨據地中巍廣殿忍從天上落曾城馬尋坡草羣連絆人覓氊廬各認旌依舊巡邊前歳景吟髭饒得幾多莖行營丁卯峻嶺天城野甸寛幔廬帳殿鬱龍蟠千軍牧圉如星拱萬幕旌旂入畵㸔行漏逺過計里鼓挈壺傑􅆆相風竿省方脩武欽先制創守還思孰易難氊廬不陋非奢慶有那移行惟藉一封駝年華就裏常如舊詩思於中强半多金鴨篆紋垂燄穂紙忩月影裊烟蘿每叅性理消清暇即境還同安樂窩行營己巳曠甸御行營蘭臯秋氣清細旃中建殿連網外為城部署明分張去聲各部皆有行帳大書以别之私廬各認旌讙譁禁逸度歡樂驗輿情野水人人汲青山靣靣迎年來兹室裏爾許好詩成入幕今猶昨搴簾樹與山牛車來晩市例許䝉古互市率驅牛車以來鈴索謹宵闗前鋒營掌卞路之事以鈴繫索為界人不得私越水號羊腸曲峰凝螺黛彎雪鷹金捍臂蒼犬玉重環雲澹秋情迥天空塞景閒古來稱大漠此日是仙寰氊廬辛未張拂常稱便止遷隨所如天臨萬象濶山入一牕虚罷獵支牀憇成詩就燭書泉明先得句吾亦愛吾廬御行營壬申蒐狩恰宜秋行營廣甸留荅陽方審靣計日又從頭萬帳星辰拱九重規制侔習勞兼示度匪為宴安謀氊廬懷居何必尚金鋪息體凝神愜所須一室四隅常不改開忩日日㸔山殊御行營六韻甲戍崖巍帳殿鬱蘭坡星拱周􅇜萬幕羅豈限幅員分内外亦陳斥堠不譙呵繹思厥度期無斁到處其居慶有那視膳寢門欣一例􅃯幾午夜協中和掃除扎薩咸惟謹䝉古四十九旗各有扎薩克領其衆警蹕金吾底用多長白吉林佳氣繞敢忘天作烈文歌氊廬叠舊作韻乙亥磧坂連韁􅕫者那輕馱拂室過明駝芋寧且喜三間足結搆剛消半刻多向野堦惟事剪艾倚巖忩得號延蘿年來飽識其中味雁塞龍沙風月窩行檠疊舊作韻豈無山月映松枝愛此熒熒氊室宜汲古時懷照若彼勑㡬宵每慎於兹惜隂常自評今昔喻法還因悟即離江硯宣毫當偶靜玊蟲綴處發新思氊廬丁丑居安青嶂入選勝白雲平不漏原勝平聲瓦匪雕那藉甍蒼林禦風峭綠野坐霜清逐日張還拂於何著繫情駐行營戊寅今年獵場向迤東崖口外即行營駐曉涼羣已換旃冠背指離宫猶驛路輕驄得得進圍界漸逺村莊多野趣四十八家率獵騎櫜鞬供役咸來赴牛牟駞􅕫滿谷中乳餅馬湩隨意酤厄魯驚歎有如是伊犂較此難言富山莊㡬日陪宴賞宫室衣冠非所諭古來北部輕南朝今日歸新原勝故我聞此語心為怡延美孰非祖烈貽共搢紳士議兵革與介胄士談書詩以水投石昔所譬枘鑿弗入其奚疑習勞繩武益懃懇一家中外綿丕基御行營癸未武帳詰戎師朝家典制垂方圓天地撰凡行營外圍以列帳兩層其象圓内設以黄布幔城其象方髙廣棟梁規風雨以時蔽今明逐日移紙忩舒卷榻復此待吟詩御行營乙酉萬幕拱黄城千山繞御營朝家脩武備藩部輸去聲衷誠逺向郊蕪色靜聞牧馬聲氊廬亦棐几復覺引吟情氊廬丁亥茨階茅土漫相譽張拂程途任所如南北東西一行幄秋冬春夏四宜居底須防漏偏稱瓦適可消閒便展書拱䕶亦多單布帳斯之未覺獨安予氊廬即景己丑收圍坐毳室四宇布山雲日御須臾掩雨􅁝颯㳫棼筑琴增峽響錦繡隐峯紋恰閱京中報優霑益慰欣京兆奏京城八月二十日自午時起宻雨徹夜二十一日復自辰至亥細雨綿匀通計入土五寸餘菜蕎等極為霑潤扈從守衛官兵凡駕幸木蘭嚮導大臣俱由御前乾清門隨往率嚮導官兵等掌除道清軌度地建營之事欽𣲖前鋒䕶軍統領率領營總三員隨扈御用輜重叅領二員䕶軍十五人司輜重叅領三員䕶軍二十四人領三旗纛叅領一員䕶軍八人建幔城叅領八員䕶軍八十人頓營幔城叅領二員䕶軍三十人司䝉古卡倫叅領二員䕶軍二十人卡倫叅領四員䕶軍一百人守􅀫衛帳叅領十九員䕶軍百九十人司警蹕帳房叅領八員䕶軍百四人後䕶叅領二員䕶軍二十人司市叅領二員䕶軍八人司刈草叅領一員䕶軍十五人三旗虎鎗營總領各二員虎鎗長七人副長九人虎鎗兵百六十人學習虎鎗四十人凡大駕行圍皆從各司其事䝉古隨圍王公等凡内扎薩克四十九旗王貝勒貝子公台吉塔布囊分三班御前行走乾清門行走之王公台吉額駙等分二班閑散行走之額駙分三班喀爾喀四部及青海之王公台吉分四班皆隨圍木蘭其未分班之厄魯特王公等聽其詣木蘭請安喀爾喀四部未岀痘王公等以莫爾根十人隨圍由定邊左副將軍酌派舊例各王公等令於波羅河屯祗候迎駕比年各䝉古瞻覲情切於喀喇河屯恭迎聖駕隨至熱河恭祝萬夀又乾隆十九年都爾伯特部來歸三十六年土爾扈特部來歸各三公等每年分班於熱河朝覲後亦令隨圍木蘭與舊扎薩克等䝉古佈圍兵丁喀爾沁翁牛特共一千人敖漢五十人巴林克什克騰共一百人科爾沁一百人合一千二百五十人凡圍場佈圍皆用之又喀喇沁隨圍鎗手十二人打鹿鎗手四十人哈瑪爾三十人喀喇沁翁牛特土黙特嚮導一百人長鎗手一百六十人察哈爾厄魯特共派巴爾呼八十人總管二員皆以供圍場之役䝉古進宴凡行圍木蘭䝉古卓索圖昭烏逹二盟長喀喇沁土黙特二部盟所曰卓索圖翁牛特敖漢奈曼巴林克什克騰阿嚕科爾沁喀爾喀扎嚕特八部盟所曰昭烏逹例進御宴舊凡公宴家宴數次皇上命合為一次以示體䘏設䝉古包六座白駱駝十八鞍馬十八驏馬百六十二牛十八羊一百六十二酒八十一罈倉品二十七席布庫國語相撲也二十人什榜䝉古樂名九十人騎生駒二十人生駒無定數呈技馬二百五十匹先期行在理藩院奏聞䝉古諸部王公職名請􅉽一人進爵届期武備院恭設所進䝉古包帳房於行營門外列駝馬牛羊於道左駕至理藩院官引䝉古王公台吉等跪迎駕升帳殿寶座理藩院官引帳殿内應坐之䝉古王公等入列左右坐餘分坐兩旁䝉古包上進茶諸王公等興行一叩禮次賜諸王公茶復叩飲畢坐上進膳所司恭捧御爵進爵者接爵恭進御座前退復位跪一叩衆皆跪叩進爵者興復詣御座前接爵退所司承㫖賜進爵者酒進爵者跪飲畢復叩首興復原坐處次賜䝉古王公台吉等食侍衛等分逓酒各以次徧綽爾齊䝉古謂胡笳奏曲人人及什榜人以次入侑上進膳畢獻茶陳相撲之戯次觀䝉古王公子弟騎生駒宴畢上還行營諸王公台吉跪送如儀御製詩塞宴四事庚辰詐馬詐馬為䝉古舊俗今漢語俗所謂跑等者也然元人所云詐馬實咱馬之誤䝉古語謂掌食之人為咱馬盖呈馬戯之後則治筵以賜食耳所云只孫乃馬之毛色即今䝉古語所謂積蘇者是亦屬魚魯兹扎薩克於進宴時擇名馬數百列二十里外結束鬉尾去覊韉馳用㓜童皆取其輕㨗致逺以鎗聲為節逓施傳響則衆騎齊騁驫䮅山谷騰躍爭先不踰晷刻而達掄其先至者三十六騎優賚有差所以柔逺人講武事也名王詐馬存遺風獻筵備陳表敬恭廿里以外列駿驄置郵傳命聽發蹤宣教施銃星火紅連聲逓令頃刻通砰磕萬雷忽落空翩若驚鴻逸若龍雲屯飇歘倒吕洪旁唐閃霍復舂容振林駭谷躪嵏平沙草軟淨􅅽塳駃騠束尾綰其鬉輕方致速騎以童㨗足獨岀傑且䧺選三十六惟良駥按第行賞務從豐只孫古俗想像中和樂還因寓詰戎什榜什榜䝉古樂名用以侑食今俗所謂十番或因此楊萬里詩有全番長笛横腰鼓一曲春風岀塞聲之句盖樂曲名番本塞外語而傳譌耳其器則笳管箏琶絃阮火不思之類將進酒輙於筵前鞠􅎽奏之鼓喉而歌龢羅赴節有太古之遺音焉平原擇向圓幕張酪酥乳酒湘黄羊名王捧觴起上夀較漢公卿禮數詳渾撥四火不思曲長􅃋管如鞭吹鳴羽發徴氣内運叩角動商響外披初奏君馬黄大海之水不可量曲首句繼作善哉行無貳無虞式糓友朋誰云朔漠無古樂絶勝鄭衛為新聲我惟中外一家用聮上下情亦不侈談有虞氏四裔之樂舞於庭相撲相撲之戯䝉古所最重筵宴時必陳之國朝亦以是練習健士謂之布庫䝉古語謂之布克脫㡌短褠兩兩相角以搏踤仆地決勝負勝者勞以巵酒厄魯特則袒裼而撲雖蹶不釋必控首屈肩至地乃為勝彼嘉其壯賜之羊臛則拱臂探掬顧盻呿吞聲若飲歠其舊俗如此因以示惠云健兒揎袖短後衣席前相撲呈雄嬉捭拖拗拉矜扲掑跮踱踞蹋蹍且䠑乗間伺怠出以竒恧然躓蹶力不支勝者賜酒跽飲之别有厄魯均新附其撲法乃異舊部露身赤脚惟著袴撇捩􅞶踔空拳赴失計忽仆伏地據騰跳翻作康王跨兩肩著地頭倒豎方得謂之決勝負勝者揚揚意實歡負者反求㣲靦顔宣傳典屬呼來前上方肥羊出厨盤長胾碩臛如舉山匕箸不設俾恣餐誰識不足君所言快哉大嚼真壯觀豈對屠門空望懸跪振雙臂攫且摶右哆左噏直下咽倐似長鯨吸百川意氣自若殊昂軒均令染指果腹便小哉食肥張齊賢是蓋衛拉舊俗傳示恩􅅄勇一試旃食罷命前􅆕詢焉弗兹食者閱十年據云凖噶爾自喇嘛達爾扎搆釁以來日就凋敝不得如此飽啖者十年於兹矣教駣教駣攻駒周禮雖載然後世僅知攻駒而不能教駣䝉古則熟習其灋謂之騎額爾敏達駻馬三嵗以上曰達駻額爾敏則未施鞍勒者也每嵗扎薩克於所部驅生馬多羣至宴所散逸原野諸王公子弟雄傑者執長竿馳縶之加以覊鞴始則怒騁駴趯或豨突人立嘶齧靁殷馭者騰趠而上控掣自如須㬰調良率得名馬二嵗為駒不勝鞍三嵗為駣始堪教夏官廋人早失傳未若朔漠存古調扎薩獻宴必備觀分羣别色陳平原氊廬賜食較擈罷按轡一覽同名藩名藩子弟皆吉服上馬執竿好結束馭生馬者必馳騎逐之襭衣綰帶持尋丈竿繋革絙其上以為控縶俗名套馬竿敺來萬錦歘披前光采陸離紛奪目薄言駉者有驈皇騂騏駠駱駰􅷫黄縶之維之取傑驁絏絆未及先跳梁齕草飲水本天性鞿鞚乍拘自覺病驚軼狂擲詎能無處之以暇堪力勝牽來蹀躞人争騎驀跨那待覊馽施擢足軒立忽落地翻身騰騗㨗於飛盡態極變不可狀駻突雄驅若飜浪毛龍逸虎旋就馴人有餘閒據馬上馳驟寧供耳目娛駃騠騄耳中掄諸憑閲考牧悟至理不教而成事所無於巴雅爾鄂爾衮溝䝉古王公等進宴即席得句巴雅爾者䝉古語謂喜鄂爾衮則寛也昨嵗於此地接將軍阿桂攻克勒烏圍紅旗㨗至因此以名之丙申嵗嵗寛溝備宴同每嵗䝉古王公等備宴率於此鄂爾衮溝以其地寛敞可詐馬也嘉名増錫識成功仍看列就九駝白宴前例進九白駝為䝉古最尊重嘉貢雖不収喜其徵瑞也那忘飛來一騎紅將士凱旋多扈蹕金川成功將士阿桂留京辦事豐昇額係御前大臣海蘭察奎林和隆武福康安普爾普皆御前侍衛餘亦乾清門侍衛居多因其久著勞績概命在家休息數月直至八月初始赴山莊今皆扈從行圍藩屛威仰問從戎䝉古王公見豐昇額等輙問畨地險峻形勢及將士超越直上攻碉奪隘殱賊情形聞者莫不驚服筵前次第陳四事塞宴四事為詐馬榜相撲教駣向曽有詩詠之太古王庭溯舊風宴賚䝉古凡隨圍䝉古王公等在圍場隨時宴賚無定制上行圍畢出哨後第一程東道於張三營西道於阿穆呼朗圖賜䝉古王公以下及兵丁等食因以次頒賞其賞賚之典乾隆十二年定親王郡王賞上用蟒緞一疋大緞二疋彭緞二疋貝勒貝子公賞官用蟒緞一疋大緞一疋官用緞二疋額駙賞官用蟒緞一疋官用緞二疋扎薩克台吉塔布囊等賞官用蟒緞一疋官用緞一疋兵丁等各賞白金布疋有差頒賜既徧遣歸諸部落御製詩停蹕癸巳停蹕齊爾伯庫嶺野甸霜華如玉艷湏㬰東壁吐陽烏滄滄涼涼寒始瞰待圍武帳憇僕從聚衆晨餐觀健啗推牛大享固無藉厨人齊和聊親勘鹽梅指示頗得宜舊藩新部胥飡饜自行營度嶺甫七里即停蹕傳饍因賜扈從近臣及隨圍䝉古王公并入覲之土爾扈特等朝飡以羮膾雜烹作飯饔人調味親為指授劑和俾皆饜飫射生炙肥成往事向每於圍中射得肥鹿即燃松枝炙食並親割以賜扈行近御諸臣及扎薩克王公等今不行此者四五年矣邇年弗為斯補欠聯情示惠有權宜欲普霑無向隅憾飢寒戚而飽暖怡因之率可人情騐然兹小試實則易艱哉安得寰宇萬民同此被優贍欽定熱河志卷四十八
