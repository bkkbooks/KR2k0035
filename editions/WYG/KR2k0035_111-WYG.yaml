body:
  text: 藝文六本朝詩㳟和御製山莊燈詞八首元韻汪由敦萬樹天花燦遠空燈筵例比禁園中仙莊夏景過元夜大地歡聲内外同寶幢光摇五色雲踏歌聲裏漏聲聞尋橦宛轉新翻樣馬伎驍騰舊絶羣夏宵山近氣㣲寒萬盞燈疑九陌㸔絶勝昨秋三五夜桂輪氷凈露珠團零露恩濃賦蓼蕭丹霞百尺建神標人間天上渾難辨不夜城中第一宵鈞天日聽琅璈樂良夜還燒錦帶燈拜舞遥稱無量壽琉璃寶界集神僧花㪚千枝驚豔𤼵光流百道絶空緣虹橋幻出通仙跡寶字排成拱御筵巖嵐林影紛成彩絳闕琳宫慶此宵瀛海蓬山能似否鬱蕭臺上列仙朝千枝渠盌帳前陳西域休誇百轉輪豈獨名王䝉遠耀祥光朗照萬方人前題王際華玉塞宵凉碧宇空離宫景乍度天中來賔新得焉耆長錫宴元宵事例同萬綠叢中散火雲雷轟電激四山聞映波百道金蛇掣彷彿紅旗競渡羣纔挹冰漿瑪瑙寒魚龍百戱儘教㸔忽驚火樹銀花發映月連星并作團喜對薫風詠蓼蕭雲霞繞幕赤城標芳園已過黄梅雨月色燈光又此宵綠樹隂中雙鳯輦紅蕖池畔九華燈光明界即蓮花界照徹三千現古僧來從雁磧天西遠還結鼇山海上縁湛露三宵霑毳幕華林萬帳共芳筵正是星橋初啟處莫教玉漏易催宵龍光日日榮三接綘幘𫝊呼又早朝花開頃刻幻俱陳燈影旋移轉玉輪忭舞西來諸部曲從今常作太平人前題錢維城萬樹園開朗太空放燈如在上元中覲光初接狼㬻部應與朝正舊例同萬㸃攅星五色雲空中雷轉遠山聞鼔聲未驟紅初結火鳯銀龍各一羣不知明月水晶寒并對晴山火齊㸔夜氣自澄天宇凈鏡光融徹錦輪團初聞烟氣若燔蕭旋有霞光似建標嘉會勝情都不减藕花香裏試燈宵錦幄還垂五綵線蓮花合作九華燈更㸔寶樹玲瓏墖疑有琉璃界裏僧烏滸亦登同樂苑素娥偏結蕊珠緣已過仙艾靈絲節重預𫝊柑􅐰荔筵到來玉塞招凉地猶是金吾放禁宵麗正門開千隊入山莊仍設正衙朝魚龍曼衍畢分陳歡洽終宵轉玉輪好語西戎全入覲來同上國踏歌人㳟和御製金蓮花元韻汪由敦灼爍爭㸔爛綺霞𫝊來嘉種自龍沙御袍拂處風初定玉砌開時日未斜浄植寜慚君子徳清芬故在法王家承恩撤炬休相比不是尋常設色花㳟和御製清舒山館元韻嵩壽登臨到處皆堪賞入夏尤於山館宜擎葢有香蓮吐萼繁隂似織柳垂絲哢晴好鳥無心喚欲雨閑雲作意遲靜裏天機隨領畧晚來明月入簾窺前題陳惪華是地炎歊從不到此中邱壑總相宜棲林鶴起驚松籟出岫雲來帶雨絲臨水能教塵􅅽浄㸔山不覺夕陽遲靜便何處煩囂著只許蟾光入夜窺前題國柱别館招凉當妙境三庚引興最為宜扇裁圓月氷為骨衣製輕雲雪作絲雨氣一簾蒼蘚潤風飄半篆翠烟遲紅塵萬斛飛難到惟有松間白鶴窺㳟和御製題大寧墖元韻汪由敦大寧城廢名徒存賸峙孤墖臨荒原疑有梵筵開舍衛空𫝊詞賦説梁園舍利金剛縱靈異難鎮燕都天子氣北顧全無拊背憂南下方知翻手易踴來多寶定先知曾見潜師席卷時替戾秃當鈴自語長江髙閣重疇咨寧王後改封南昌珠簾碧瓦早沉消宿莾烟榛影動摇耕牛牧馬歸殘壘可識昇平嵗月遥六龍東指時躋陟清曉陽烏纔展翼雲來雲去乍迷離路隔空濠近城北亭亭可望不可登黙數飛簷叠幾層駐馬踟蹰無片碣欲問誰建何由能龍沙卓立幾經秋爾日忻遭聖藻畱廣漠野逍遥遊慿眺應銷萬古愁職貢而今此置郵㳟和御製板升元韻汪由敦巢居苦風穴苦雨象取大壯肇棟宇疆畛所限習俗殊氊作穹廬恒聚處平沙廣漠格爾多駞馬滿谷羊滿阿誰教架構作籬落遂闢村莊藝麥禾候吏無呵容轉徙塞山到處營疆理或齊或晉失業民接踵栖依挈妻子一家中外樂時平舊史堪嗤詫板升祇今烟火通隣里當日風塵擾甲兵輸幣嵗增虧帑用馬市纔成旋請封拜甡契塔為冦資䝉古稱漢人為契墖葢契丹之訛遼宋接境故以此為通稱耳隱然敵國聲勢重名藩内屬餘百年不逐水草事力田從獵公徒隨弭鞬迎鑾除道待行邊懷柔布徳聖化宣板升更賴天藻𫝊㳟和御製魚石屏歌元韻汪由敦少見多怪紛然疑偉哉造物能爾為由融而結誰指揮異石片片羅鯤鮞頑礦乃復藏神奇宛見綠波游泳􅐾出聽豈繄聞絃徽銜鈎那待投竿絲乍疑妙繪網箋遺啖花影㺯垂柳枝或乃匠巧神工施刻畫鬐鬛分􅞟移想當秋水無津涯鱗鱗潑潑時紛其曝腮跋浪凌空虛叶此樂未許恵子知滄桑何代倐若斯帶還為礪匪夷思炎飈皜日漢沫滋大鈞飛燄陶青泥一氣所到理異宜石凝水態層層披魚為石質息不吹麻源螺蚌有先期製屏不藉丹青緇重以天章琬琰垂酉陽博物驗在兹㳟和御製䝉古土風雜詠十二首元韻錢陳羣乳筩孰論得髓孰得皮以莢何曾一矢遺毛孔直㕘無漏義元霜要悟欲流時最憐初逹先知跪羊初生求乳必跪其母只恐生駒未受羈候火定教通味外醍醐應向此中移荒田偶紆翠蹕雲中騎來㸔黄沙雨後田試厯塞垠無棄地方知聖澤本同天縱横自屬東南外樹藝仍居遊牧前力作不勞成嵗事昇平一飽故依然卾博叠成齒齒復磷磷此是山川正直神便有攝儀行過客何曾施敬路旁人由來樸魯無淫祀終古祈求有嵗申挏乳炙牛存典禮居然風俗譜岐豳革囊一笈從來抵一奴行旅諺語摒擋家具此焉俱為筐不用裁江竹盛飥何妨當飯盂利涉亂流傳古法考工紉製陋諸儒蕭然囊槖隨行李自笑真成濩落軀柴車聞説紫芝乘此隱而今遺法塞垣多元徳秀罷官後嘗乘柴車徃來陸渾山中不巾不輻偏行遠非櫓非篙亦渡河載月吚鴉同小艇拖泥穏便比輕駝曾叨扈從陪車後沙路相逢一簇過骨占神占即可號神羊火象於焉義取掦灼炙既從呈坼兆仔肩如響定禨祥繁昌早驗明年牧近止能知遠戍郎魚亦問晴鷄問卜乾坤至奥豈終藏馬竿孑孑緌緌及腹繩駃騠未許縱驍騰若非竿勢先馴致那得鞭絲便奏能罷釣任公時拂水脱族蘇相偶踰陵盡驅天馬來天廐絶技材官庶足稱兒版乳花啼笑劇堪憐韋紉雙縧貼兩肩不用歌詞𫝊靧靣豈因束縛礙呑拳牌頭籍免添丁税臂上絲穿長命錢更指熊祥牀寢地壁間弧矢正髙懸灰簡布白編韋可代言結繩而後此苞元新陳遞嬗人稱便開闔虛中道可存春蚓秋蛇無定跡剡藤魚子不分門學書紙費成徒語執簡應同𫝊笏論竹筆如錐蘸墨便能揮老健中書未放歸豈假象犀稱玉笋敢邀湯沐著紅衣苕霅間製筆有名大紅袍者透來紙背方知是認去毫端只恐非倘得幾餘親一試行間鸞鳯會同飛口琴獨絃琴是口中吹匠氏偏工以冶為老眼㸔來真似鑷春葱撥去恰成絲聲廻合節筝應讓舌轉如流鶯未知行殿薫風𫝊解愠雷門布鼔笑閼氏轉經磨兠妙義自無文佛力風行衆所欣清浄輪迴原自在波羅宻諦本難聞萬縁旋轉空王國一手扶摇大地垠象教由來能䕶國焚修莫説誦持勤㳟和御製出古北口元韻嵇璜一峯畱斡控羣山古塞蠮螉是北闗秋嶺風迴雲氣合邊牆雨潰土花殷來庭遠服通軺𫝊迎輦歡聲動市闤底事長城誇設險八荒已在戸庭間前題夢麟馬足輕塵馬首山翠㣲堆裏逹嚴闗雁沙風掃連雲白綺樹林髙帶雨殷烟静丹梯閒畫角天開碧嶂見通闤聖朝不用丸泥塞萬里伊犁指顧間㳟和御製烏沙爾器元韻汪由敦丹㽔不逐塞榆飄火齊星攅壓翠翹若向西京論賦手君遷平仲是同寮荅遝何曾到上林龍沙秋色曉森森故知遠軼嵇含狀果譜新添有睿吟靈砂㸃就神丹轉靺鞈奩開寶氣豪應笑朱方數紅豆漫勞西域問蒲桃前題劉綸好鳥榆闗啄蕋飄離離星影綴雲翹相於合有北天竺妙鬘華纓結浄寮上蘭仙種擅珠林甆斗分叢䕶碧森五雅釋箋都可廢品題乙夜入清吟赬虬探頷由來幻火齊傾柈詎足豪到眼吳儂慚物色料量郁李比含桃前題觀保芳樷疑有暗香飄朱顆圓匀壓翠翹道是珊瑚生貝闕何時移得傍山寮託根榆塞自成林材可為弓老幹森旖旎詎隨凡草木應將紅豆入新吟丹砂色綻堪同豔火齊光懸足並豪最是巗疆多異種引來山鳥誤含桃恭和御製常山峪行宫疊舊作元韻汪由敦雲軒青嶂外霞磴纈林前大獮方行令勲為定邊遵塗屇靈囿頓宿撫文筵迴憶初臨日俄經十五年製舊御韻作於辛酉是年初㳟和幸木蘭臣叨與扈從曾元韻烟嵐猶滃蔚風日更清妍八景披吟處御行宫有詩製八景新松正及肩前題董邦逹睿略馳方遠宸遊跡憶前行宫重駐蹕諸將近收邊秋色迎鑾輅山光拱御筵慿軒增勝槩觀稼樂豐年舊墨龍蛇勁新題􅇨采妍計程山館邇蕃部集駢肩㳟和御製熱河啟蹕幸木蘭之作元韻汪由敦乘時肄武舊章循白露初過呦鹿甡峰指玲瓏林􅌄窱雲垂糺縵曉輪囷疇咨封事郵函速志喜宸萹㸃筆頻那待周阹誇遠服天威早懾大宛人前題劉綸灤河繞塞首塗循雉介風高聽鹿甡迎勒草香聞晻藹展圍山勢㸔盤囷大宛選騎調良並穆納旋轅送喜頻兩嵗陪筵許三接奉琛還待後來人時聞哈薩克陪臣將次入覲㳟和御製出古北口詠古元韻汪由敦北門雄鎻鑰設險有嚴闗一綫通戎索千重矗塞山雉樓空曲上鳥道翠微間徃昔藩籬重防秋士馬難時清邊備逺民晏古風還羽騎駸駸度雲峰相對閒前題紀昀翠輦臨邊塞檀州有故闗南來通一綫北顧見羣山連弩思前代偏槍近此間飛猱行尚怯高鳥度應艱蘇轍題詩出王曾奉使還何如今一統秋曉戍樓閒㳟和御製至避暑山莊即事元韻裘曰修山莊到處秋如畫勝日來時境是仙壯士扈行親校射名王入覲嵗開筵謀深帷幄皆長算吟到禽魚有夙縁此地只如房闥内年年清蹕與周旋前題錢大昕到處林亭宜入畫望來巗壑宛疑仙澄泓水展空明鏡峭蒨山當翰墨筵滿眼禽魚皆至樂會心草木有真緣昇平中外承嘉讌好待秋深羽葆旋㳟和御製熱河啟蹕之作元韻裘曰修小駐還當啟蹕時曈曈初日照通逵人言白草黄沙地身到青山綠水涯八月田功觀晩穫三秋花事賞芳蕤塞垣未覺西風冷閏嵗應知節稍遲前題紀昀武列河頭雁過時勾陳羽衛啟通逵紅飄霜葉楓千樹綠繞寒澌水一涯蹀躞花驄隨日馭玲瓏芝葢㪚雲蕤如聞蕃落諸渠長會獵梁鄒到恐遲㳟和御製雨獵元韻劉統勲獵以肄武𫝊有哉中權直冐秋霖來掦威制勝在弧矢非弩非網非繇媒軍聲已動不遽止轟雷激電難比擬膠霑弦濕中轉奇白羽落處蒼鹿起沾濡無愁得雋喜氣挾風霆運臂指乃知聖意戒遲回弛者難張張易弛朂哉勇决重戎行蠡測管窺見如此前題裘曰修長林豐草何遼哉平時獵騎不敢來奔狐擾鹿叢虎跡館熊窟兔驕雉媒大獮乘秋行至止鵞鸛魚麗安足擬左縈右拂射疊雙毛驚角駭圍中起挽水天河真兆喜雨脚垂垂近堪指弦鳴彌覺㸃聲麤弓勁不愁膠力弛須知師律寓行圍號令如山今見此㳟和御製行圍即事元韻汪由敦半嶺霜風颯颯來萬山高處絶纎埃欲齊衆志羅千騎應識天生用五材白㲲乍迎朝日上黄旗高捲朔雲開據鞍批荅軍郵速那待飛書趣入聲召枚馬騰弓勁稱行秋極目穹窿遠勢遒猛虎伏崖林霧暗驚禽躍澗日光浮細尋伊遜河流曲遥辯長城古蹟畱即景拈吟待圍合飛箋曾不費冥搜屬櫜列纛力恢張險越厜㕒躪紀堂潮海沇溶迴地軸風雲翕集揭乾綱繩聯碁布行無跡環合規圍制有常肄武正勤籌遠略大風歌就興飛掦前題劉統勲紫氣黄雲匝地來寒山影裏動纎埃平添西極追風足饒有東丹射鹿材賦就長楊難自炫營連細栁不輕開蕭蕭静聽鳴鞭響我士無譁底用枚縈回玉勒詠新秋馬上萹章韻更遒黄葉試茶新火活蒼鷹趂兔片雲浮凸凹巗壑如常履窈窕林泉為少畱何物擇人行舐掌佽飛矛利勅重搜蕃部旌旄左右張躬桓先已會明堂行行隊似星分野井井條如網在綱箭殪天狼隨指嗾芝啣銀鹿見尋常便從羽獵圖王會吉日車攻漫頌揚前題裘曰修仗外圍嚴斷徃來萬蹄蹴踏不生埃黄衫煜煜文昌將翠羽翹翹武庫材耳後鴟鳴飛箭過懷中月滿引弓開詞臣屬目旌門下欵段追隨揖馬枚樹樹金鳯葉葉秋饑鷹直下力初遒雲排兩翼呼聲合日麗中權御氣浮馳道龍旗遥掩冉㸔城鸞輅小遲畱賡吟毎捧瑶牋出獨愧枯腸韻苦搜絡海包山大翕張神機猶是運朝堂華夷共戴環辰極文武兼資揭帝綱眼底風雲生咫尺草間狐只尋常即㸔一矢天狼殪凱奏西來喜氣掦前題錢大昕森嚴羽仗自天來雨霽重嵐掃碧埃控鶴三千神策士飛龍十二上襄材令懸旌斾和門合陣布風雲大幕開講武六軍皆整肅不煩司馬戒銜枚野濶天髙九日秋伊松河上塞風遒玉鞭乍到輕烟拂紫幄初開瑞靄浮雲入望中皆澹蕩山當佳處暫停留廣成欲進詞臣頌詰屈空慙短韻搜彌山絡野勢分張變化神機自廟堂蕃部傾心瞻法仗降王泥首懾天綱握奇齊列龍蛇陳懷徳遥迎日月常頻見玉門西奏㨗欃槍掃盡國威掦前題紀昀長林豐草射生來石逕清無半㸃埃冀馬於今皆逸足燕犀自古是良材行分鵞鸛雙旌動氣逐風雲萬里開聖主臨邊軍令肅無譁不用更銜枚獵獵風聲大漠秋高原塞馬力初遒旌旗影帶寒雲捲組練光含曉日浮霜隼盤空爭搏擊天狼避箭敢遲畱巾黄奮欲摧彫虎荷㦸深嚴更一搜雲罕天弧嵗嵗張儒生何用戒垂堂諸蕃震疊星從斗七萃森嚴網在綱蹴踏崑崙猶奮迅鞭笞頡利只尋常銘勲尚薄岐陽鼔􅃒莫區區侈馬揚㳟和御製山村元韻汪由敦塞外常苦寒種禾取其早地瘠既遲發雨稀復易槁行行傍山村結穂實堅好彌望但黄茂攬之粒俱飽婦孺各恬熙鷄豚亦馴擾宸遊信多樂勝賞滿馳道前題董邦逹八月納禾稼塞外西城早山田黄盡匀熟異科上槁穈芑種自嘉結粒堅且好遠邊成樂土八口終年飽婦子皆優游鷄犬不相擾得此功誰歸蕩平頌王道㳟和御製谷中元韻汪由敦谷裏人家成小聚火耕嵗乆地迴涼曲依巗壑搘為屋平碾坡坨掃作埸經嵗吏呼曾不到中田婦饁亦相莊從遊恍見康衢象民氣知無莠種妨㳟和御製入崖口元韻觀保區脱天開屹兩崖到來眼底得清佳疊屏山訝駞峯似度嶺人㸔蟻垤皆嵐氣毎於雲氣合松聲時與水聲諧習勞不為游觀樂好景偏如竚睿懷㳟和御製氊廬元韻汪由敦白㲲剪裁潔文筠插架平自然成廣厦寕用侈雕甍霜隔簾衣重香凝黼座清由來陶復製存古見深情㳟和御製題小金山元韻蔣溥中央小朶即飛閭絶頂蓮花建紫廬秋水似雲圍曲檻孤峯如畫映方諸綺明練静滄江遠樹隱樓開碧澗虚睿思不殊浮玉勝勝於浮玉轉清疎㳟和御製清舒山館元韻蔣溥鶴捧爐香燕拂書清秋山館日長舒結為塵外烟霞窟移就村間水竹居林靄乍霏朝旭潤茶聲輕颺午風徐惜隂檢㸃禽魚樂詩地分明筆力餘㳟和御製塞山元韻劉綸穆納嵐光繪嫩涼餘歊浄滌快褰裳磧中野水穿沙響莊畔髙禾出屋長夜拭玉蟾遲遠榭晴摩霜隼趂平岡木蘭萬頃如香海崖口懸知葉未黄前題觀保塞外山多氣早凉如花紅葉已裳裳雲開諸嶺駝峯出雨洗寥空鳥道長榆栁數家依曲澗牛羊千隊散平岡秋光到處邀宸豫况是陂陀稼已黄㳟和御製含粹齋元韻劉綸一區架構有餘清納納虚檐出厂平與顥氣俱非假象得天倪露是含精太元著草亭空峙秋水成萹檻漫横會取名齋真義蘊兼含孔思復周情前題張泰開窈窕山齋萬象清朝嵐夕翠與檐平試㸔飛躍天機活便識行生道體精石落沙明秋水净雲歸岫複夕陽横天題妙括羲經義俯仰髙深契睿情㳟和御製駐行營元韻劉統勲興桓之北松漠南肅肅勾陳羽衛駐疊嶂遥連紫塞垠行程却指紅雲路崔嵬帳殿臨髙原丹林翠壑天然趣大海蕩蕩水所歸諸蕃來似百川赴馬牛恒以山谷量酮乳時論斛石酤燒當無弋肩摩從駭愕中華強且富昆彌動色相顧盼贊普𫝊言互告諭此間氣象真堂堂絶漠威行良有故軍容嚴整神融怡疆域式廓帝命貽欲將王會入畫圖豈但石鼓陳歌詩葢地之圗驂白鹿聞風而至其奚疑聲靈震疊邁䆳古大哉玉檢明堂基前題劉綸一重兩重碧嶂開千騎萬騎黄城駐星廬匼匝翊帷宫髙下風竿辯蹊路行行設枑更通橋秋原延矚無邊趣司盟舊部馳𫝊來屬吏新藩踐更赴根移苜蓿抽嫩芻種獻蒲桃壓清酤佳名沃壤多巴顔徳産從知饒羙富扈圍西旅競懽呼义手脱㡌難言諭金牙瀚海㘴日嗤甫草上蘭空掌故時畋悉率皇情怡允文允武家法貽鋪叙不數陳倉碣典則寧誇勅勒詩膚功已奏繕軍實登三咸五夫何疑和門珥筆請為紀時萬時億恢鴻基㳟和御製九日元韻劉統勲黄花開放趂秋陽黼幄平臨射雉埸侍從欲陳豳蜡羙蕃渠新識糗梁香紫萸盞泛爭承露白雁聲多欲落霜更喜寒山都似畫登高一望翠低昻㳟和御製出崖口元韻劉統勲講武連旬舉大蒐六飛親涉道途修已陳虎旅行松漠競擁龍旗渡索頭伊遜河即水經注之索頭水此地諸蕃爭送輦古來長塹笑防秋躬桓濟濟陪嘉宴取次金罇湛露稠前題劉綸磨崖大字紀親蒐旋軫渾忘路阻修翠嶂雙排開石骨朱闌一折界雲頭迴瞻雁砦鴻天晩直指烟村水市秋此際觀風知倍喜坻京比似去時稠前題董邦逹寶鞈彫弧罷講蒐六龍迴蹕引途修千行灌木縈旗首一路仙雲簇馬頭攬轡共知循舊徑㸔山又是近深秋鵷行扈從重經過回望林巒萬疊稠㳟和御製萬樹園賜布魯特觀烟火元韻劉統勲列溪秋水夜盈盈月色燈光倍有情萬里㫋裘聯隊入千枝火樹照人明直將玉燭通銀漢㘴覺琉璃湧化城料得𫝊言徧西域聞風爭拜䕶羌營前題劉綸交光燈月一時盈敷㘴擎觴共洽情舞入魚龍隨隱現篆成蟲鳥更分明騰聲合到無雷國散彩疑遊不夜城使者來從星宿海底教瞠目屢怔營㳟和御製塞田元韻蔣溥阪田競髙低迤邐接塞外入夏土􅍺乾播種尚有待宵旰勞聖心甘澤還立沛良苗何油油陂塘互縈帶慮歉轉獲穰三農慶應最碧溪水潺湲未為秋稼害明昭帝所貽穎栗民斯頼塞天霜氣遲自卜收穫倍想見築埸時萬井農情快㳟和御製峽琴軒元韻于敏中軒前動操衆山皆攫醳無心韻自諧悟徹匣中兼指上聽從挂壁復横階𫝊聲谷遞清和奏入律風調解阜懷相賞更餘真意在天然松石軫徽排㳟和御製滄浪嶼元韻于敏中芳嶼臨清流秀色在階砌動影冲融間倒侵翠微翠迴風澹漪瀾觸景紛妙詣歌從孺子聆亭仿詩人置淵懷湛然澄一理涵萬事㳟和御製登四靣雲山亭子作歌元韻于敏中四山環合雲深處繚白縈青泊然遇笠亭螺徑凌嶕嶢吟朗煙霄若神助層雲盪胸西復東卑之列岫羅牕中逸情遠出陶謝上活色恍與倪黄逢閬風嶈嶈俯塵世聚米周知八鴻事居髙視遠覼縷呈臚列川原可數計秋山明嫿秋日懸黄雲鋪隴覘豐年腰䥥行刈霜信前擔歸囷鹿人頳肩㳟和御製射元韻蔣溥節應騶虞樂備官九重神藝許齊㸔良遊詎數華林射至徳真同矍相觀彀滿雕弧風力勁堋開豹的月光團共知聖武超前古朱鷺聲𫝊萬象歡前題劉綸簽名行殿引材官御射先容列侍㸔法祖天弓神所授序賢臣鵠徳為觀骹飛簉羽穿長埒的暈聯珠破小團按部蕃王能入彀賜衣鞠􅎽奉宸歡㳟和御製瀑源元韻劉統勲靈源通地􅍺懸瀑穿天孔曲徑落㟏岈危磴圍穹嵸雨晴沫濺􅅂秋入雲飛隴披榛若搴幃刈蔓如開籠魚逰力上溯鳥過影倒覂崕張一𣲖垂峽隘千條攏空手照皛皛顥氣浮滃滃資深詎待濬奔凑知難壅此中澒洞含其下波濤洶皓魄滿欲流素奩寒不動象為石甕注周作嶽蓮聳根極四溟會鑿謝五丁勇萬古玉膏流半夜神光湧前題于敏中懸洪瀉曾青噴薄冺罅孔萌柢坱無垠天瓢􅆽穹嵸權輿導江沱濫觴溯岷隴織路奥復峭潜㕎翳若籠近􅓊䟽窐寥霅然始發覂㳫訝湯釡沸漉詫竹篘攏綫澑巗脚穿匹練雲根滃游潗既以泄黝鯈不得壅驥渴欻驫䮅雷輥殷訇洶突窔盪相摩緘紐静即動毖惟蹇滻欱􅈭或崷崪聳氣毋所胚凝抝勢如養勇天倪闢鴻濛言泉萬𣲖湧欽定熱河志卷一百十二
