body:
  text: 建置沿革七金金金為北京路大定府利州兼得義州瑞州地興中府建州全州興州兼得臨潢府地及西京路桓州地今承德府本境西為興州之興化縣地東境為大定府之神山縣地灤平縣為興州興化縣宜興縣豐寧縣南境為興化縣宜興縣地西北境兼得西京路桓州地平泉州為大定府大定縣長興縣富庶縣金源縣神山縣赤峯縣為大定府之三韓縣松山縣静封縣全州安豐縣兼得臨潢府之臨潢縣盧川縣建昌縣南境為利州阜俗縣龍山縣西南境為大定府之和衆縣東南境兼得瑞州之海濵縣地北境為大定府之恵和縣兼得三韓縣地朝陽縣為興中府興中縣永德縣宜民縣南境為建州永霸縣東境兼得義州宏政縣同昌縣西北境為大定府之武平縣地金史地理志大定府北京留守司遼統和二十五年建為中京國初因稱之海陵貞元元年更為北京置留守司都轉運司警巡院縣十一鎮二按金初之北京即遼之上京今赤峯縣北巴林旗地熈宗天眷元年八月以遼上京為北京是也至海陵天德二年改為臨潢府其時大定府尚稱中京至貞元元年三月始改中京為北京大定府治即今平泉州治也大定倚遼縣舊名有土河七金山隂凉河鎮一恩化按大定縣之恩化鎮即遼之恩州恩化縣元一統志謂廢於金天眷二年金史未詳是金大定縣兼有遼恩州地今自平泉州治至州北境皆大定縣地也長興有塗河按元一統志金廢勸農縣析其地屬長興金史未詳是金長興縣兼有遼勸農縣地今平泉州西北境皆長興縣地也富庶有沁河鎮一文安按遼文定升平歸化三縣至金皆廢此富庶縣之文安鎮當即遼時置縣之地縣在今平泉州東北境兼有遼時文定升平歸化三縣地金源遼開㤗二年置以地有金甸為名有駱駝山按金源縣仍遼舊為平泉州最西北境惠和皇統三年以遼恵州惠和縣置按遼惠和縣領於惠州元一統志謂金天輔五年罷州金史未詳考惠和本為遼縣而金史謂皇統三年置者當是先廢於天輔五年而復置於皇統三年也在今建昌縣北境武平遼築城杏堝初名新州統和間更為武安州皇統三年降為武安縣來屬大定七年更名承安三年𨽻高州泰和四年復來按金武平縣即遼武安州沃野縣地在今朝陽縣西北境特初名武安縣後改武平初𨽻高州後改𨽻大定府耳和衆遼榆州和衆縣皇統三年罷州來屬按縣在今建昌縣南境之西北本與平泉州接壤故罷榆州後即西屬於大定府也神山遼澤州神山縣遼太祖俘蔚州之民置章宗承安二年嘗置恵州升孩兒館為灤陽縣以𨽻之泰和四年罷州及灤陽縣按遼神山縣領於澤州元一統志謂金天輔元年罷州金史未詳又考遼澤州領神山灤河二縣金之神山縣本仍遼舊在今承德府南境其灤陽一縣乃升孩兒館置疑即為灤河縣故地在今灤平縣東南境也三韓遼伐高麗遷馬韓辰韓弁韓三國民為縣置高州太祖天輔七年以高州置節度使皇統三年廢為縣承安三年復升為高州置刺史為全州支郡分武平松山静封三縣𨽻焉泰和四年廢有落馬河塗河按三韓為遼舊縣在今赤峯縣南境金志於大定縣下注有土河於長興縣三韓縣下别注有塗河似以土河塗河為二水今以元一統志所載塗河之源流方位考之元一統志内有塗河無土河知塗河即土河今亦稱老河其實一水也又元一統志稱高州東至武平縣東南至惠和縣武平在今朝陽縣西北境恵和在今建昌縣北境金廢高州存三韓縣知縣境跨今建昌縣北境在患和縣之北故能東與武平縣接壤承安三年復升為州時得分武平以𨽻之也松山遼松山州勝安軍松山縣開泰中置舊置刺史太祖天輔七年置觀察使皇統三年廢州來屬承安三年𨽻高州太和四年復有隂涼河落馬河静封承安二年以胡設務置𨽻全州三年𨽻高州泰和四年來屬按金大定府所屬諸縣多為遼之舊縣惟静封縣乃金所新設静封初屬全州又屬高州當在全州之南大定府之北元一統志作静豐謂静豐廢城在松州東五十里是松山静封境界毗連為今赤峯縣屬翁牛特旗境利州遼統和十六年置縣二鎮一寨一阜俗遼統和四年置今因之龍山遼故潭州廣潤軍縣故名熈宗皇統三年廢州來屬有榆河寨一蘭州鎮一漆河按龍山在今建昌縣西南境本東北與阜俗接壤故金廢潭州後即近屬利州也興州寧朔軍本遼北安州興化軍興化縣承安五年升為興州置節度軍名寧朔改利民寨為利民縣撥穆爾堅河舊名梅堅河今改正圖們必罕舊作徒門必罕今改正寧江蘇瑪拉舊作寧江速馬剌今改正三明安舊作猛安今改正𨽻焉貞祐二年四月僑置於宻雲縣縣二按金興州以遼北安州地改置遼北安州有利民縣無興化縣詳見前卷北安州條下遼利民縣至金即廢金之興州在遼北安州南境今灤平縣地非即遼之故城也興化倚遼舊縣皇統三年降興化軍置𨽻大定府承安五年建興州於縣為倚郭舊有白檀鎮按金興化縣為興州治故城即今喀喇河屯在今灤平縣治西南一里餘其東即承德府南境亦興州地也宜興本興化縣白檀鎮泰和三年升為縣來屬按金之白檀鎮與漢白檀縣異漢白檀自在邊内特取名偶同猶宻雲戍之非即宻雲縣也宜興故城在灤平縣西北七十五里地名小城子其南與古北口相直又金時興州之西即接桓州桓州故城在今多倫諾爾㕔境開平衛故城之西南别屬西京道今豐寧縣南境尚屬興州地其西北境兼得桓州地興中府本唐營州城遼太祖遷漢民以實之曰霸州彰武軍重熈十一年升為府更今名金因之縣四鎮三在今境之縣三其興城一縣本遼嚴州之屬縣在今錦州府界興中南有凌河鎮一黔城按興中縣之黔城鎮當即遼之黔州蓋廢於金初又考遼興中府領興中營邱象雷閭山四縣元一統志謂金省二縣惟存興中營邱尋又更營邱為洪寧縣知金所省者惟象雷閭山尚有洪寧縣金史未詳是金興中縣實兼有遼黔州及象雷閭山二縣之境今朝陽縣西南境皆興中縣地永德遼安徳州化平軍安徳縣世宗大定七年更今名北有凌河鎮一阜安按永德即遼安德縣在今朝陽縣東南境遼安德縣本屬德安州金大定中改名永德時當即廢州而後來屬於興中府也金史不言州廢乃記載之踈宜民遼川州長寧軍會同中嘗名白川州天祿五年去白字國初因之與同昌縣皆𨽻焉大定六年降為宜民縣𨽻懿州承安二年復置川州改徽川寨為徽川縣為懿州支郡奉和四年罷州及徽川縣來屬鎮一咸康遼縣也國初廢為鎮按遼史太宗紀㑹同三年八月戊申以安端私城為白川州乙夘置白川州官屬其後去白字但稱川州金志謂在遼天祿五年元一統志亦同然考遼聖宗統和八年七月置白川州宏理縣又遼開泰二年石幢猶稱白川州並在遼世宗天祿之後知天祿五年尚未改稱川州也遼紀載開泰七年四月賑川饒二州饑知白川州之改為川州當在開泰二年之後七年之前金志以為天祿五年者誤又按元一統志金天眷二年川州屬懿州三年廢咸康為鎮入宜民大定初州廢𨽻咸平府承安二年復置川州治宜民縣仍升徽川寨為徽川縣以𨽻之復割屬懿州惟存宜民縣蓋遼之宜民縣及宏理縣皆屬於川州而川州自治咸康縣至遼末廢宏理縣金初廢咸康縣惟存宜民一縣承安時改置川州即治宜民縣雖同在今朝陽縣境而金之川州與遼異治至廢州之後宜民一縣實兼有遼時咸康宏理二縣地建州保靖軍遼初名軍曰武寧後更金因之縣一永霸按遼建州領永霸永康二縣金志惟載永霸縣知永康縣為當時併省是今朝陽縣南境皆永霸縣地元一統志則謂金併省後復置一縣曰建平與金史互異瑞州歸德軍縣三鎮一兼得今境之縣一海濱本慕容皝集寧縣地遼隰州海平軍故縣皇統三年廢州來屬按金瑞州即遼隰州其故地為今寧遠州不屬熱河境惟海濱一縣在今建昌縣東南境又東接寧遠州界義州崇義軍縣三鎮一兼得今境之縣二宏政有凌河同昌遼成州興府軍縣故名國初𨽻川州大定六年罷川州𨽻懿州承安二年復𨽻川州泰和四年來屬按金義州即遼宜州其故城在今錦州府屬之義州不𨽻熱河境惟宏政同昌二縣在今朝陽縣東北境宏政為遼宜州屬縣同昌為遼成州屬縣遼志成州互見於上京中京道初𨽻上京道時無屬縣後改𨽻中京始置同昌縣金因之而改𨽻義州耳全州盤安軍節度使承安二年置改胡設務為靖封縣黑河舖為盧川縣撥北京三韓賚呼舊對音烈虎今改正等五明安以𨽻焉貞祐二年四月嘗僑置於薊州縣一安豐承元元年十月改豐州鋪為安豐縣𨽻臨潢府三年置全州盤安軍節度使治有潢河黑河按三韓縣在赤峯縣境見本卷大定府條下靖封盧川二縣舊與三韓縣同𨽻全州知其境界毗接靖封即静封後改𨽻大定府知其居南盧川改𨽻臨潢知其近北均在今赤峯縣境而安豐縣下亦注有黄河里河是全州故境當在今赤峯縣北巴林旗地也臨潢府總管府地名西樓遼為上京國初因稱之天眷元年改為北京天德二年改為臨潢府路大定後罷路併入大定府路貞祐二年四月嘗僑置於平州縣五在今境之縣二臨潢倚有金粟河盧川承安二年以黑河鋪升𨽻全州後復來屬有潢河按金之臨潢府臨潢縣皆仍遼舊為今赤峯縣北巴林旗地其盧川縣以黑河舖升復有潢河亦當在今巴林旗北境欽定熱河志卷六十一
