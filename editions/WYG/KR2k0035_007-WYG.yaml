  text: 欽定四庫全書欽定熱河志卷七天章七御製詩
  hash: sha256:21452d4a2fe2d19386d9a4cae425911701ac521b001d19ec1f7c50e0338d2706
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0035_WYG_007-1a, image: WYG0495/WYG0495-0118a.png}
body:
  text: 口號甲申山北片雲霏雨山南秋宇懸曦比似人情無定澷言塞景獨竒細雨巖雲生傍晩細雨灑閒庭落宇惟知白藏山如䕶青久晴宜􅎟隴繼潤利蕎町無可無不可此時心暫寜晴宵雨曉來晴秋陽更益晶衆情欣路坦多稼待西成疊嶂雲端翠一蟬樹杪聲蒸炎定何礙風處有涼迎午熱午熱今朝劇樹隂坐屢遷無妨延爽籟所喜熟山田仍換單衣好重持秋扇捐明當處暑節婪尾故應然山雨七月廿四日山雨欲來滿谷凉斜飛倐忽藏山光常侍肩輿方技癢駿奔㨗走誰辭忙淋漓濕衣仍弗免巖齋未至曦放陽爾足詎較雲行速小勤可喜不可長夜雨七月廿五日爾日山中雖細雨為時弗久輒復晴屈指快霽過半月正需一雨滋晩耕夜半簷響落霶霈欹枕聼處衾涼生後車千乘率已到更無須厪漸石情但祝宜𤾉曝皎日佇待萬寶歌西成處暑今朝處暑節一氣遍九州豈識山莊竟原無暑可留落雨絲絲涼披風樹樹秋昨午忽騰熱故知孤注投排日吟詠間不覺嵗月遒晩晴徹日秋雨踈復密既優既渥利晩田便教入夜定何礙予情究顧速霽焉似此求美復求善無厭欲實因農牽申末酉初雲欲散西北風吹逐以全東山高處夕陽朗凉颸爽氣澄滿川巖齋㸃筆意為快坐對宵景星斗懸宜雨宜𤾉太如意益戒滿盈勵惕乾曉五更覺衾寒忩影猶未明假寐復醒來庭樹禽送聲昒昕旋大朗東山朱鳥騰晨嵐落峭凉棉衣渾恰勝閣本間兩朝限於置郵程𠡠幾則無間况有日奏呈閣本例隔兩日馳至而各處驛逓奏摺及行在軍機辦理之事原無間日也雖云偃軍旅方將籌牧耕問政敢懈心協時彌厪情即景每愛棉衣禦曉寒午暄圖爽重去聲更單寒暄無定原有定催熟山田萬寶攢八月朔日作四野纎雲净一天爽氣浮星虚當半夜日納識中秋退暑人心惬毨毛獸色柔木蘭行已近慶節為遲留夜雨八月初四日欹枕聞簷響雨零夜未央那乖十日節恰送滿齋凉蕎坂花湔白􅎟岡穗沃黄明朝晴益好宜潤不宜長午晴曉煙猶覺戀秋空卓午飛來西北風幾縷輕雲随泮散一天皜日喜晴烘曰蕎曰菜晩田潤時雨時𤾉造化工眼見康年歌玉塞繾懷闗内可相同肩輿肩輿徐復向西尋衣漸生涼山漸深不是逰懷太酣放情知創得齋名待予吟襍言西峯夕照漸漸低東峯夕照漸漸高淺澗流水聲激越深澗流水聲藏韜無心即鹿近偏狎有心即鹿逺已跳山中所得率如此萬物皆備於我矣新月􅆟喜中秋月年年見塞山片雲浄碧宇斜漢露新彎桂影婆娑外蟾光醖釀間嵐寒落湖水逰舫繋須閒題董邦逹山水畫高嶺隆崇下有溪林煙杳靄望中迷天然枉轡郊端杜為問何人此隠棲右煙磴寒林山莊展畫乃漁莊野水平槁帶草堂不是無端作生面應縁熟處未能忘右漁莊野彴山行即景四首茂林之下常停步曲澗其間足洗心試問山莊絶勝處解能物物效深沈一片浮雲蔽日光紗衣頓覺滿山涼須臾雲過原蒸熱無定寒暄自有常雨過山蹊蹤印鹿秋薫花氣翅迷蜂翠微深處笄頭似定有廣成驀地逄谷惟温藉連天静峯益清超抜地竒祇惜唐人鮮到此曽誰留得一章詩荷露烹茶花草皆浥露不如擎以荷荷露是處美美莫山莊過塞天蒸沆瀣顆顆珠光摩取之既不盡用之不竭多與茶投氣味煮鼎雲成窠清華沁心神安藉金盤他體物春花暖則開秋花寒則放得氣異金木物物與无妄待暖易為煦禁寒艱相入聲抗以此衡厥品春較秋應讓魏徴猶娬媚董宣特强項叶花有人豈無摛詞寫其狀千山千山秋未深曦光颺明翠散步入叢樾谷夐越佳致本因即鹿來翻似友鹿至重華厯下居東坡赤壁莅沛然實所欽洒然亦所愧我非煙霞人意愛煙霞寄熱仲秋如仲夏候長向所無黄雲禾穂登白雪蕎花鋪單衣卓午更嘉䕃披風殊早晩原爽涼何礙清逰娯似此太如願得母心放乎子輿善言學曰收一字模氣候氣候自南北其言將無然予年十一二仲秋必木蘭其時鹿已呦皮衣冐雪寒及世一二際依例往塞山鹿期已覺早高峯雪偶觀今五十三四山莊駐蹕便哨鹿待季秋否則弗鳴焉都大廿年中暖必以漸遷語罷自復疑得半非得全此固宇宙來所有山與川太古至今日不知幾魄淵審如向所云暖過北溟壖邵子天津橋怪語非正詮或者人煙輳以致黙轉旋協時將育物不息惟惕乾中秋夕走筆成什輕隂通晩忽開晴月與中秋太有情乍上錘峯猶隠現旋臨鈞宇大光明萬家鐙火今宵盛小部笙歌蒨例呈如此清涼如此節可能恝爾置吟評細雨八月十六日細雨有聲不見絲千林惟覺潤含滋旬餘快霽資收穫蔬圃欣茲又及時清風迎面吹來濕且涼泠泠淰淰颺煙光茂林避雨權教坐解送山花一段香晴昨朝徹日雨忽密忽踈霏侵曉驅雲散蠲炎送爽歸農夫將穫稼獵騎逮行圍豈不欣時若怵哉盛滿機詠古吕氏著春秋其言頗近理出車入則輦佁蹷機由此枚乘作七發猶不失斯㫖高誘何務竒翻謂乗謬鄙蹷機訓門内曾未聞經史既曰出與入豈門内而已佁為癡騃貎蹷逆疾同痿乘辭實警佚誘注未精揣按枚乘七發出輿入輦命曰蹷痿之機正引吕氏春秋取務以自佚之指為楚太子下砭而高誘好竒改注乃以蹷機訓門内之位其説於經籍既無可据而所稱宫中㳺翔於出入云云尤極矛盾即謂乗改吕氏佁蹷之機為蹷痿之機文似小變然攷佁字集韻曰固滯貎説文曰癡貌讀如騃而吕氏原書又有處足為蹷為痿之語不惟於義無閡抑且於文允符誘强作曉事恐貽誤方來不可以不辨而李善輩收入選註亦可謂失精核矣山中恒步行盖欲自砭耳懷古詠其事文固難言矣留京王大臣奏報得雨並秋成豐稔詩以誌慰自春徂夏逮新秋時若情知將稔收未及登場尚繾念近作有眼見康年歌玉塞繾懷闗内可相同之句乍披奏牘喜盈眸横陳糧價皆稱減王大臣及府尹奏到各種糧價單較核上月每石自減一錢至二錢五分不等迴憶心期幸已酬嘉霔更欣霑五寸翻犁尤利種冬麰輕隂輕隂忽送一川涼雲過旋披暖異常近墅菜蔬葉芃緑遍山禾􅎟穂埀黄虞人殪虎村民喜濟爾哈朗圖旁近山勢陗􅃨有虎傷犬豕及人前驅連斃其二一尤大前掌側厹村民言向所見蹤良是巨害永除莫不稱快春種驅牛秋穫償誰曰塞蒐特行樂幾多農務藉諮詳霜八月廿九日秋暄逮北哨青女始行霜亦不須鴻信本無礙雁行謂獵騎佈圍也欣催鹿期到鹿必待霜降天涼而後荅鳴初覺繭衣涼繢事誠後素千林錦旋去聲張古長城延古長城東西數萬里其説出蒙古克勒木迤邐蒙古語謂城墻為克勒木漢書稱龍堆仿彿疑即此蜿蜒走山川見田豈謬擬向曾為之記淺言抉深理天地自然生南北限以是設云人力為早應就墮圯然今果限誰内外一家矣重九日作詰旦仙廬侍膳迴芳筵重九列藩陪恰欣紅葉迎霜染漫惜黄花背節開嶺峙巴顔秋富麗蒙古語巴顔謂富西嶺之名即明日獵埸峯圍哈納石崔嵬蒙古包圍墻謂哈納是峯似之故得名駐營即在峯下欲詢千古登高客誰到興安頂上來暖興安草猶緑細毳獵中原曉祇輕霜㸃午常暖日温鹿聲雖遲去聲待也冷馬牧實資暄暄則草緑而肥宜牧馬南望耕桑地宜農不待言雨九月十二日木蘭九月雨秋暖實殊常萬嶺迷煙意千林翻濕光佈圍難更罷閑獵審何妨片刻風雲捲晴生滿谷涼微雨七月十二日乙酉名山經過每致雨試之屢騐非傳聞境潔地靈通呼吸五嶽或未如是云石梁大嶺綿福脈青石梁東南綿延數百里為霧靈山福地祖脈蒙古語所謂海喇汗即漢語聖境云昨宵朗霽朝生雲按轡從容已過嶺傍午乃落煙絲棼輜重何嘗勞跋涉却利蕎菜真堪欣曰暘曰雨總時若盛滿之懼吾惟􅇻曉行即景微雨昨朝釀薄涼行行東宇露陽光已欣蕎坂潤含白雅稱去聲禾田熟染黄雲戀高峯如繋帶寒侵空谷欲添裳年年蹕路渾經慣計里何須問短長聞京師得雨誌事秋令今年晴雨時晩田繼潤亦寜辭恰欣過嶺微絲㸃早是近畿四寸滋十二日過青石梁至常山峪後微雨洒塵行稱便而京師則據報是日自寅至午宻􅒴霑沛入地四寸餘蕎菜並資潤溉歌舞農夫喜行路奏聞京兆慰疇咨却思盛滿埀明戒懼以為承敬以持驟雨七月十五日西峯乍聞雷東峯驟落雨其勢如建瓴其迅突發弩仙莊息輜重誰賦漸石苦却為去聲偶逰山輕輿下嶇峿蘭坡􅅺滑刺駭汗愁内豎急㸃翻涼風十步九蹷跙須臾千蹊壑暴漲如湘浦指揮就淺濟跋涉竟無阻一勞静以泰衆逸歌還舞傍晩霞捲晴前事忘何所中元夕放河燈山雨過原速夕陽喜大晴了知多稼美得放衆燈明在水看星㸃雖蓮不藕生既觀如是法今昔那須評熱出口迫來迎面涼連朝熱已駐山莊未嫌無定暄寒變却喜能催禾􅎟黄樹有佳隂原趁爽卉多餘豔亦稱芳蒨題新詠年年益識去聲我祈農一意長夜雨七月二十日秋熱情知弗耐長􅓴􅓴夜雨頓生涼攬衾何礙且無寐隔牖遥聴正未央打落樝棃疑巨㸃潤浮菘菜沃甘漿曉來四宇雲容散又喜山田時若𤾉即事山莊借問有何宜那弗宜宜􅆟是詩設復無端鄭綮遇定當不數㶚橋時午熱秋熱渾同夏暑天莊稱避暑尚如煎豈無嘉䕃席堪布便有清風扇未捐誰曰居高斯塞磧所欣催熟此山田夕舂定是巖嵐落原覺微涼意灑然乘涼乘涼谷口或林中上塞清時避暑宫奚必九成誇傑構所欣五糓屢綏豐澗方過雨争乘瀑樹解遮曦不礙風自是聖人心造化精微敬仰意何窮雨七月廿九日秋熱情知釀秋雨山莊喜為利山田霑膏便是高原渥披爽偏宜婪暑湔水漲羊腸帶沙落峯標僧㡌與雲連闗中聞屢時霖被歸轡應看麥隴芊晴今嵗夏秋亦常雨雨霑即晴真是竒高下原隰皆渥潤更喜皎日為晅之邇來炎熱望快霔以夜繼日時霏絲情知便霖定何礙究願朗霽尤稱宜卓午西風吹雲散碧天如水寒光披曰暘而暘太適意益凛宥器曽聞欹八月朔日作秋仲每於此朔朝兹復臨一天霽景朗萬壑曉嵐沈荷朶紅將褪樹隂翠尚森山田觀銍艾勒馬暢予心秋雨八月初五日秋山易為雨亦復易為晴􅎟坂將全穫蔬畦方向榮霜遲卜地潤地潤則生雲常雲則霜遲霽好愛風輕太覺如人意慎哉慮或盈新月月􅆟中秋好輪惟向滿佳披光寒不礙入意静為皆蕩漾荷花浦徘徊榆樹街去年如是景今嵗那殊懷山雨八月十一日山雨飄風掠濕絲不樓盡出許渾詩早田晩稼都收畢煙景惟看峯態竒中秋即景清光滿塞川霽景正澄鮮地逈知天近秋中慶月圓餅𤓰頒節賜歌舞㑹賔筵挂漏嵗時紀誰當補舊編村行三首高下山田總報穰腰䥥無暇畆棲糧野農那識歌綏屢但喜崇墉婦子康牆角籬邊種瓠蔬霜遲又卜穫豐餘悟無别術安黎庶祇有祈年益厪予握粟街頭不值錢家家飽食颺炊煙畧嫌糓賤傷農耳審是何妨那兩全詠古二首口外東自八溝西至土城子一帶皆良田直隸山東無業貧民出口墾種者不啻億萬此漢唐宋明所無也居今之世尚或有愁榖不足之時則彼季之民將何以謀食其驅之戌邊者更無論矣朅爾成章匪自誇實自惕耳遐想漢唐及宋明圖安祗固守長城良田億萬頃荒棄足食將何庇兆氓燕北齊東無業民嚴闗以外辟耕畇晏眠婦子常歡聚却是前朝戌守人張三營道中雨景山田早收畢晴雨適皆宜却為去聲霜遲塞雨則霜遲塞上頗以為佳兼資菜䕶籬漲波全未落煙景不妨披卓午亦停蹕秋軒簷捲絲八月廿三日皇考忌辰書懐遺詔欽循三十年初心益勵益酸然至於隕越幸無耳以曰顯承何有焉敷政真慙仁必世撫時惟覺逝如川神馳閟寢遥瞻禮祗恨重重隔嶺煙霜過閏塞山涼仲秋看平聲降霜明留鹿􅜓輕稱去聲馬騰驤青女出常早周公戒已詳北南自然候何必問京房京房易傳未免穿鑿如云不教而誅其霜反在草下夫霜落草上亦必落草下曦光所照草上者必先化於政教何涉耶即事八月行綿霖蘭中鮮逢此盖因六七月應時雨即止仲秋致連隂是固盈虚理稔收率登場菜圃豐尤喜霑潤地含膏宿麥又播矣稍惟佈圍艱尋思何礙耳風半夜西風作怒號平聲萬竅强驅雲同振落放日俾騰光正喜披新霽何妨迫峭凉豐隆昨朝勢變幻底為常山行雪景半夜同雲灑霰花曉來鶴毳益交加昨吟高巘皴銀母今見平田積玉沙獵騎無湏虞滑刺輕輿耐可破紛揉搴帷不礙氊衣濕冷趣寒光恰相入聲投僧舍茶煙細有無村壚酒望逺糢糊此中大有詩情在何必山隂始入圖萬樹重看花葉敷高原下隰總霑濡塞寒惜不播秋麥為憶京畿似此無走筆偶然佳興㑹深山走筆成吟峭蒨間常侍却嫌詩速就小休消未片時閒聞京師得雨誌懷丙戌閣本今日到得雨稱優渥不惟利晩田颯爽暑如濯塞垣雨固同獨是蒸炎熇北暖較南甚南凉乃北若是理不易窮炙轂難斟酌列藩東北來迎鑾詢大畧率云夏月旱望霖潤墝埇聞亦為之憂萬㝢奉一􅃋適可此應止及時彼願落巡方所廑多孰謂徒行樂夜雨七月十三日葦峪過來雨勢小問知山稼尚需膏即欣夜霔巖齋聼正利晩田農恵叨隔户遥思舞松柏落簷還訝罥波濤多人漸石應難免輕重相權慶此遭晩晴終日雨晴恰相間去聲晩來雲歛碧虚寛草頭露戴含新潤松下風過平聲覺峭寒現出光華月幾望照惟澄澈水微瀾更予喜處乾泥潦山市明當迓鳯鑾中元夕放河鐙風定閒雲歛秋池若鏡平分舟佈銀炬貼水燦金英夜鹿巖藏侣寒蛩岸照鳴錘峯升寶月孰更比光明午熱午熱全非前日比寛衣林下有涼颸雨霑山稼需蒸曬聞説農家正喜斯處暑金令逾旬入炎官餘氣收庭曦尚婪尾樹籟已交頭消息疊為運推遷信不留谷中夕靄落頓覺峭涼浮題董邦達畫卷猗猗萬玉淡煙低逕轉春泉不作泥記是去年巡蹕路驀前即便到雲棲右倣唐寅竹泉煙靄雲若流泉松若藻天開竒想妙難摹漫言世上無斯境覿面山莊似此夫右倣陸廣松壑雲濤偶題山行數息樹邊身不為去聲已勞為衆人設使浪仙獨臨此驀前寜復肯逡巡秋熱秋熱今年實異常情知催熟晩田穰夕陽西下方逰步谷口風來故有涼秀實誠宜皜日歊又聞雨後種新蕎因之為去聲望滋甘霔不為延涼逰興饒即景齋閣倚西山門對東山敞夕照正映座林光業底朗西嶺拖横隂自下旋旋上初補崖脚細倐羃峯腰廣逝水莫喻速禹惜誠不爽塞垣塞垣此日是卷阿綴景樓臺底藉多鑿土嵗深成石壁䟽泉沙淺得溪河忩間不礙山禽入林下常逢野鹿過庾鮑清新還俊逸藩籬未覷奈斯何山雲山雲忽晦忽開晴秋月翻殷望雨情菜圃蕎塍需繼潤随時随地厪民生夕雨傍夕山行罷山雲落雨絲纔看茵砌濕忽聴筑簷垂秋熱於焉滌晩田藉以滋渥霶應益好惜未久經時曉起牕色曉蒼蒼庭柯雀噪忙晏眠欽有戒問政勵無遑幾片雲飄縷一輪曦露光究因微雨後頓覺切晨涼聞京師得雨誌懷前晩雨寸餘頗望再優洎京畿亦斯日四寸乃渥被闗内逮秋成雨不雨一致闗外近始霑繼潤為翹企何地非吾民目前更厪意如此逺必遺失哉益深惴即事每愛從東陟西嶺嶺隂送爽熱全消降西斜日原東照創得齋涼却不遥八月朔日作嬗代無停運初蓂朔又更中秋判西陸午日入南榮蝶急花前影蛩争草底聲山雲雖屢作其奈每開晴意行意行那約馬弓輿峻嶺崇山適所如雲一片飛隂作爽風無形嘯谷含虚且前林下宛逢鹿便到溪邊不釣魚箇裏塵心消欲盡但餘吟興未全除西峯西峯隂就東峯上高樹風從低樹翻叢壑乘涼得真趣不親到者不能言新月一年十二度新月月是中秋新益佳􅆟喜因縁逢上塞且看隠現暎高槐無心圓缺自古若通體晶涼與意皆日日旋移就東壁人間𤓰餅正安排雨八月初十日山雲易作雨今嵗乃多晴我慮秋收歉人言米價平空絲兹始織簷瀑遂如傾蕎菜欣霑潤還殷益霈情晴疊前雨韻徹夜秋雲宻侵晨却放晴颯涼身縱適惜望意難平祗覺筆帖􅂴何當盆繼傾曽誰知足是然此實常情中秋即事巡守嵗為常中秋避暑莊介禧祝文母慶節集藩王高朗塞垣景團圞寶月光桂花隂屬詠得句亦天香在京王大臣奏報西成已定晴雨應時喜而誌懷京畿綏屢實三年又報秋霖潤麥田此慶豈其人力致益因心慰益兢䖍夜雨八月廿一日塞雨今年短秋霖入夕濃蘭臯報潤溽氊室聴􅓴􅜾徹夜方無射迤南可遍逢曉雲猶落㸃罷獵得從容雨九月初三日雲佈崇朝雨意含罷圍飛霔遂沈酣望峯翠訝疊藏幾劚土潤欣寸過三詩句似吟許氏閣畫情恰展米家嵐由來草地無不可農圃因之憶迤南村行三首西北雲生曦影藏無何風作露陽光據鞍迴望得神解補送蘭中一段涼木蘭今嵗秋暖異常出崖口後連日涼氣頗劇似補哨地所未及雖屬創觧然消息之理或應爾也將謂秋田欠食充喜觀納稼得中豐東西闗外數千里能否如斯慮莫窮前此深厪塞田或因夏雨未足致減秋成兹見連村囷鹿充積仍屬中豐然闗外壤地遼濶能否一律普登欣慰之餘益為覽所未及者遥切綣念山墅家家有盖藏京畿綏屢價翻昂畿輔嵗事屢豐而京兆所報都城糧價轉增於前月因諭舒赫徳方觀承等訪求其故昨據奏稱因山東被水州縣收成稍歉多有估舶運販以致市值驟踊亦有奸商藉此居竒牟利者復勅擇其尤者懲治一二以儆之問知販濟齊東歉移粟慙如梁恵王欽定熱河志卷七
