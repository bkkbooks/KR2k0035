body:
  text: 欽定四庫全書欽定熱河志卷一百十一藝文五本朝詩虎神鎗歌有序汪由敦虎神鎗者聖祖仁皇帝嘗御以殪虎命曰神鎗志異也皇上行圍所至􅉏御負之以從猛獸當之無不摧斃今年秋岳樂圍中於三百餘步外殪洞中伏虎御製文紀其事臣竊謂鎗固神抑由智勇天亶用之者神也敬為之歌塞垣嵱嵷伏虎多壓山壯士排長戈斑斑白額恃牙爪獨踞深洞藏巖阿巖阿百尺徑路絶隔谷獵徒來指説天子前岡正合圍手舉神鎗纔一瞥電掣横飛星火流雷轟直劈蒼崖裂怒吼狂跳强負嵎陷腦洞胸俄掃穴神鎗竒中此最竒精良溯自聖祖貽軼才狡獸惟所施發無不貫無不糜火攻猛烈豈輕試除殘去惡理則宜獵埸引滿日飛鞚藩部萬人争目送幽陰黶合往輒摧共仰天威本天縱詰戎纉武法守昭兹事由來邦政重琱戈埀矢典册陳夏鼎商盤謨誥誦寶𫝊武庫鎮五兵神器善承須善用扈從觀獵恭紀汪由敦龍沙繡嶺秋早霜天留奥區作獵埸順時行獮神武揚藩部選徒千二百萃傱沇溶盡賁獲蜚遽㳺梟手能格霜蹄蹴踏披雲根雙搴風纛排天閽包嵕蔽崿氣可吞駭鹿驚麕困奔仆希間突衝横錯􅘅堵牆櫛比餘抝怒黄間滿彀動有神呼聲楓拉􅇒髙旻一開生路昭皇仁霧散塵飛各騰驀獻尾旌門如獻馘車箱駝背紛他藉上林羽獵矜竒觀扈㳺異數容據鞍承恩一洗書生酸塞外雜咏進呈蔣溥氊廬千人可坐帳伊那棟宇居然載以駝牆似編籬風陣入葢疑張繖雨聲多到門一任生青草捲幔偏宜對碧蘿别有雙簷人字様都稱安樂得行窩駝裝貼地何曽千里駝遥裝不慮塞程多載將家具還行具度盡危坡與淺坡沙際奔泉蹄印濶栁邊作隊項鈴過歸來雉兔紛他藉負重須防偶一蹉馬絆分將官馬足驅馳維縶休教起遯思耳後風生來玉埒脊端霜重立金覊竿為閑廐繩為皁水滿山前草滿陂竊轡詭銜防夜逸一聲嘶向夢中知風竿入望髙低各颭摇竿頭斜曳颺層霄危檣亂矗風帆挂山店初開酒斾招圖就忽翻前度様燈明認取舊時標影収人卧周廬静夜􅈀沉沉響徹宵雨溝不同積潦塔兒頭雨集皆盈底用愁深淺但消一勺水縱横如界十夫溝掘成我僕痡瘏力學得伊孫詰曲流卓帳未安先命鍤端知前事有綢繆設卡星廬萬帳簇紅雲人絶譁聲地少氛御路兩旁雙卡立大營四面八旗分其風無敢收逋馬入夜先呵越隊軍部勒森嚴兵法合圍間數獲足論勲地竈掘得團瓢三尺土煨將榾柮一鑪深不須曲直先防突但取圍圓可駕􅑄夕􅄿晨炊經再用燎薪揚火未全黔若教祭竈比隣請日日招邀繼自今安市昨於何去適何來論價争贏咲語豗小聚空場半日事坐㕓列肆一時開生涯但逐行人便竒貨難居日用材征税不輸恩例乆萬人歌舞塞垣囘征衣寛博誰言利走趨裁縫熨貼趂征途長裾斷處剛容膝短後穿來恰半軀最喜逐熊誇捷步偏宜騎馬向平蕪路旁争羡鵞黄褶豹尾斑中按隊俱銅晷十二辰中别正初不須測影土圭如璣衡運轉原銅鑄度數分明匪筆書妙製創由泰西法遺規傳得指南餘行人按候尤稱便起頓無諐汝與予頒鹿俟俟儦儦或友羣獻豜豳雅意䖍申豈知雨血風毛後偏逮調弓執㦸人拜賜榮霑誇部落分甘恩許洽臣隣罷圍按簿如山積未渫猶㸔士怒嗔和詩圍間宣示捧新詩馬上吟成帳下披日月三霄光莫繪韶咸九奏響難追盛時雅頌誠多幸上聖文章附見知後乘鄒枚羣槖筆毎賡天藻自慚媸前題錢陳羣氊廬過眼川原一刹那亭名擇勝付輕駝牕開北牖迎風逺幔卷西偏得月多雪重乍融連雨㸃草長縁隟入晴蘿無窮烟景隨時領不羡堯夫安樂窝駝裝檢㸃行裝上駱駝笑看家具亦無多山根逺望疑危石栁外斜堆似亂坡鼻孔絲穿雲際擁蹄涔沙印水邊過行人立馬遙相待更戒相將慎勿蹉馬絆周防騄駬莫長馳逸足從來有逺思利用繩之三尺法聊云與以片時覊低頭且喜加官草緩歩何妨近澤陂要使調良馴本姓籋雲只恐未能知風竿風時欲舞意飄摇環衛周廬傍九霄夜月偶依人影亂夕陽一向馬頭招四時花草凴翻様萬族禽魚各自標更映紅燈燦珠斗酒家帘已落清宵雨溝一聲琴筑落牀頭髙枕無煩旅客愁畚鍤加功資蕩㵼淺深得法合涂溝彎環偷得羊腸様活潑渾如鶯脰流帳下兒童須省録要知未雨好綢繆設卡皇居往往覆祥雲四面貔貅净逺氛豁聞千林連野澗綿延兩翼引繩分星羅直似長楊道壁立寧同細栁軍遥指射鵰烟靄靄更傳殪兕早書勲地竈不是燒丹探火候寧同掘井及泉深春厨尚要芟秋草塞外春時尚無草色故竈欣看試舊鬵間有歸途行厨即用去時舊竈者豈必代庖方可治何須曲突始能黔偶然增減尋常事史册陳謀豈似今安市趁市隨行若子來日中逐逐復豗豗蘆簾葦席排偏宻馬後車前擁不開一夕所需無賸物千家資用有餘材塞垣老幼歌休助共説皇程去即囘征衣豹尾班中逐隊趨家家裝束事長途博寛最笑蹣跚歩短小偏宜精悍軀涴處袖中丹禁筆香痕襟上塞垣蕪歸來好付閨人手更待明年扈從俱銅晷姬旦南車是太初候陰觀象孰之如銅圭恰合西洋製玉尺兼傳南正書九行去聲納來懷袖裏五方辨出雨晴餘一人行殿猶宵旰尚曰分陰實起予今人雅合分陰惜陶侃名言實起予御製詩中句也頒鹿按簿如陵頒或羣頒來右膘自天申拖全下拜趨君長割肉歸遺屬小人貫串隨車紛餽嵗炙燔促坐洽比隣餘波早沐投醪賜厮養衘恩孰敢嗔和詩鈞韶天上出新詩傳冩詞臣五夜披復旦歌成情自愜卷阿遊罷景堪追捷如上每作詩皆即景成章天授從臣應詔賡和往往遲一二日恭繳九重朗照誰邀賞一字能安便受知迴憶屬車曾珥筆無鹽自笑老逾媸避暑山莊感恩紀事十六首尹繼善塞上峯青霽景鮮重來正值早秋天山莊記得曾陪宴彈指光隂十二年好雨恰隨鑾輅至已看渥澤遍山田誰知宵旰勤民意猶待霶􅑛望逺天避暑時聞帝作歌新題舊詠揭巍峩皇心總在同民樂得句攸闗稼穡多曾誇白下有卷阿江南攝山卷阿御題白下紀勝留題睿藻多山色松濤猶入夢此間風景更如何蒙瞻卷恩得阿勝境蓬瀛深處許從逰㸃㸃芙蕖引御舟錦䌫徐牽明鏡裏清香不斷緑隂稠曽侍至如御舟意洲一片澄泓映碧空窗明水殿引涼風鴛行列坐筵開處四面雲山在眼中延薰山館賜宴蕊榜懸􅋃目未經古稀年過喜添丁嘉魚湛露歌初罷又譜新聲一笑聼今嵗典試春圍今演上以似初生子調之入新劇翠石環階樹繞廊嘉名迪吉舊山房䝉恵迪恩逰吉玻瓈鏡映峯千疊勝景渾如屋裏藏白鹿泉邊夕照樓曾聞彷彿此清幽江南棲霞日行宫有夕佳小樓迪吉上云似恵而今得入方壺裏不向棲霞憶舊逰髙下亭臺倚翠螺凝眸西望樹尤多西有萬樹園緑隂深處紅塵少曲徑時時見鹿過講武承平示典型特教圖寫付丹青衰年見獵心彌喜未得隨班入畫屏瞻殿壁張木蘭圖閲實深欣羡宫牆數仞入門難體恤恩深得一觀多少林巒探未遍又從堤外促歸鞍柔逺頻看禮數加諸藩列侍雁行斜分嘗賜饌歡聲動中外於今總一家無才叨領御前班步履滿跚亦赧顔日接君王難解語都疑隊内有南蠻蠻子上以臣似戱告諸藩㳺藝咸欽妙入神每從釣弋見施仁御厨珍味頻頒賜獲鹿尤先及近臣䝉鹿肉賜公餘退食正風凉荔子瓶開滿院香嶺嶠一年來一度白頭能得幾囘嘗䝉荔枝賜木蘭隨圍感恩紀事十六首尹繼善霓旌動處武維揚猛士聲喧共陟岡信是天威能逺播道旁拜舞盡名王山頭搏獸競追奔緩步偏邀體恤恩指向諸藩頻笑語南蠻今日亦櫜鞬萬騎歡騰繞玉驄駑駘有興亦嘶風氷競一路防顛仆時在天顔顧盻中行圍四面宛如牆暫歇金鞍坐曉涼得鹿燔柴先告祭圍中得鹿先祭山神近臣拜賜共分嘗路遶層巒入塞雲麕麋連中躍千軍從知聖智由天縱寧止多能迥出羣從心應手共稱竒下馬旋催和御詩試問詞臣與猛將乃文乃武孰能師遼東猶記常隨獵五十餘年竟未曾指示開弓親駐馬偶然倖中豈臣能射到疲麅已可慚况容矢發再而三那知帶箭還馳去老不如人一笑堪風入蹄輕句豈虚驊騮進止自安舒上駟屢得良驥均賜嘉名同邀秣飼供驅策駑鈍依然愧不如鞭絲直上撥雲開林外聲聞兩翼催顧問登山還懼否垂憐真似䕶嬰孩風生一嘯動林隈獵騎飛馳報虎來祗為蒼生除猛獸不辭策馬上崔嵬飛鎗百步信如神殪虎横拖嶺上陳時向貔貅申告戒恐教輕進或傷人獸中猛力數封熊與鹿同逰傍石叢共訝神鎗聲震處一齊應響殪林中中熊上施神鎗並中一鹿麋鹿羣殷望澤情奔騰四野向人鳴得䝉一面開仁網豐草長林獲再生圍中圏鹿或過多之上命開一面放収圍行殿集藩王四面雲開翠幕張樂奏清平頒厚賞同聲忭舞慶重陽重陽調清平賜宴演李白賞賫諸藩一路西風馬上催年衰何幸此畨來賜腥賜食恩難數並得雲山飽看囘恭和御製常山峪行宫原韻汪由敦碧嶂開行殿宸逰廿載前文孫掦大烈法駕閲重邊駐輦循軒檻分甘憶几筵貽謀全盛日休養屢豐年積嵗林增宻經秋壑更妍宸章攄至孝繩武頌時肩恭和御製謁陵便道駐蹕皇祖避暑山莊曷勝今昔之感元韻梁詩正大孝謁陵園西風度板原橋山瞻列祖巖館感文孫避暑曾開築當秋一息轅追思擕抱樂彌訝景光奔清澗長流淼重林美䕃緐龍文題額煥鶴步印莎存事往頻増憶腸迴黙自論更殷堂構念貽厥永銜恩恭和御製出古北口元韻錢陳羣蠮螉左折限燕遼一線天門矗半霄逺勢晴添蒼集健輕程秋與紫駝驕千盤迴互山容浄十館更畨士氣調遼史自古北口東北迤􅆔七百里内凡列館十扶杖闗民低笑語共𫝊日顙𩔖神堯恭和御製出古北口元韻沈起元嚴闗非漢月非秦村落雲連古戍堙紫塞漫𫝊重險地青山長住太平人磵泉漲後聲猶壯農户豐時俗盡淳邊草邊花承輦道欣將膏露灑清塵恭和御製圖興安絡緯兼題以句元韻梁詩正露草依栖伴蟓蛉馬蹄乍蹴趯來青興安小種曾傳説前度秋風眼始經臣於乾隆八年扈之駕出口始一見早警凉秋唧唧鳴風晨雨夕助淒清兒童一例編籠貯水飲􅆶餐别有情凌寒蠕動上花枝寫入仙毫秋意遲為補豳風圖未備七言新製塞原詩行行香夢杳難尋幔屋寒聽蟋蟀吟識取聖人詩畫意要憐征士苦單衾恭和御製曉行二首元韻史貽直仗外青峯峙翠標六龍法駕啟晴朝初暾半映玲瓏壑淺水斜通迤邐橋巖樹緑低風動樾野花紅亞露垂翹村民遥識停鸞馭時有天香夾道飄澗泉迴繞碧磷磷㸃綴涼波𤼵渚蘋隐隠曉鴉開逺寺遥遥嘶馬渡前津如枰塞畆多嘉穎似沐秋林絶㸃塵足慰皇𠂻唯稔嵗倉箱寧患小民貧前題蔣溥疏星幾㸃逗林標塞意將添白露朝修黛自環深淺谷偃虹頻接短長橋山田穗重懸珠顆沙㟁花明濕翠翹却望層霄多霽色龍旗展處瑞烟飄蒼霞片片石磷磷欲采秋芳向澗蘋金菡萏光分疊巘玉宗琤響㵼迴津烟中翠刹初開署雨後青楓不染塵碌碡村村場圃築睿懷猶軫塞農貧恭和御製波羅河屯作元韻汪由敦行殿清秋曲葢停嵐光環繞翠為屏百年藩部䝉恩澤萬里邊陲慶乂寧樂奏廣筵羅毳幕歡騰夾陛拜珠庭鴻猷逺紹神堯烈雨露頻霑塞草馨恭和御製行營元韻汪由敦千帳拱星營如弦御路清黄中開法座璧合儼重城列部仍聫署分門各建旌風雲入睿想箕畢協羣情甫草宜言狩屏藩會逺迎車攻邁周雅宸藻更天成秋迥蒼茫野天低平逺山鉤陳肅周衛壁壘警嚴闗風幕千燈聚霜􅋃半月彎遥雲横作帶近澗曲如環班馬凌晨發明駞向夕間咸欽聲教訖絶塞達瀛寰前題劉綸帳殿啟連營邊垣入望清魁杓區九野華葢接重城掌舍傳施枑行人識抗旌徼荒來按部琛賮競輸情夜竈烟光散晨裝爽氣迎昇平如可繪王會佇圖成侍從千廬合臨流復面山龍光依日馭虎旅衛天闗燈幌明星麗弓衣寶月彎知時壺漏永戒道㦸枝環列肆柴車便長芻􅌴馬間共欣隨豹尾勝絶擅人寰恭和御製登興安大嶺歌元韻汪由敦昔聞興安大嶺上可摩蒼天粤自鴻濛作判五嶽五鎮奠方域洩雲致雨造化分命司其權秋視三公旅四望祠官典禮自古然兹山傑峙大漠外山經失志莫識其從前聖祖神武爍四表幅員所際逺軼太古先龍沙清蹕偶經此武陵果有桃花源神樷奥區塵跡不可到飛黄在御振鬛登崇巔彷彿金支翠旓互摩戞底事滄瀛縹緲求神仙我皇丕膺鴻緒繼祖武紹庭上下夙夜加勤􅐚四經大獵横紫塞緬溯遣蹟親舉白玉鞭旋御虎帳灑奎藻謂身所厯非僅竹素之𫝊言興安大嶺上可摩蒼天前年曾謁五臺之浄域昨年曽登㤗岱之名山應真膜拜嶽祗導􅊏雲不起浄卷兠羅綿兹來旭杲騰躍扶桑外靉靆瀰漫倐若干步帷幙亘接連宓妃玉女星軿逺障蔽不比浮邱揚袂洪崖許拍肩金戈鐵馬出飛棧鯨波鷺濤盪驚川霓裳羽衣嫋翩􅗁玉徽流水儷幽蘭蒼茫不測厚坤意神竒變幻詎可常理詮無乃效靈酬貺荅肸嚮上干天筆勒此煒煌卓犖之大篇不然何為詰旦遽明霽陽開陰闔殊判焉宸章一讀一咋舌屈宋李杜頫首臣僕間雲隨飛龍降霄氣卷舒一氣交盤旋惟見白榆厯厯舉手摘素䨲玉杵守廣寒又見白虎敦圉驂金官踆烏皜皜迥晴暄俯視齊烟九㸃復有九經營晹谷濛汜耕芝田洞庭窈窕張廣樂湘靈瑶瑟廿五絃塗山圭璧集萬國葱珩鞭琫垂紛繙神心晃朗大圓鏡垓埏蟠際羅其全談天雕龍陋衍奭崑崙靈宫何侈㫋興安大嶺上可摩蒼天仰頼雲漢章萬古長流傳前題劉綸􅗥哉乎興安幾不知天山之上復有天域中名勝區三百六古來登封代七十二對此難與刌度而銖權蕃王别部厥號翁牛特唯見蟠龍揷翠拱者頫者跂者各各獻狀兒孫然水如伊遜疋練未足纓其側峯如大青瓦螺詎能睨其前孰亭毒是孕毓是乾經坤絡開必先伏聞皇撫疆索四至八到窮流源綏服之臣再拜請納地文囿直跨陰崖巔至今懸樁設蕞儼如畫神臯黋朗宜有祖氣窟宅圜靈仙靈仙之縡亦遼邈烏在視公視侯秩孔䖍土人告語嶺頭草樹有手不敢指薦以鄂博羅供帨幢笴箙或弭鞭或云上通帝座之一炁或云下俯齊州之九㸃雖辯士猶絀於喻言噫吁􅐵幾不知天山之上復有天􅘈爽肸嚮理莫詧謂天非天山非山雨不待呼龍燒燕廣野甘溜霑芊綿電不待投壺天笑玉虚散景紛翩連大塊者何飌伯不得堙其竅布鼓者何阿香不得弛其肩有時晻㫲發逺曜有時濎濙迴長川乃知取精用物闢奥窔奚趐姬之甫草漢上蘭朔野巃嵸實巨鎮披圖按牒誰釋詮聖時懷柔固無外奎章况軼摩崖篇欲四三謨三二典以升介邱寧闕焉從官嗛嗛口皆禁有生但識岱東華西衡南恒北嵩中間醯雞舞甕鼃坐井又若摩牛踏迹空盤旋帝曰往哉疇作繪是日善張迴蹕繪圖命賛若澄丹青滿㡧収髙寒期門受餐翊前導手排宿霧延清暄麻皮䑕跡互攅簇肯留半掌為平田邊陲壯觀兹第一上之當宁繹繹馳道來如絃髣髴諸真欲報貺霓旌羽葆纚纚而繙繙即看繩行􅔑懸表雄峙職方之誌匪獨寰中全至人有徳不在險搜神述異咸舍㫋噫吁􅐵幾不知天山之上復有天陳詩跼縮竊愧盧仝馬異劉义傳恭和御製囘鑾至喀喇河屯作元韻劉綸輦路迴環繞塞河山莊僅隔一程多雙懸墖影清如昨獨秀錘峯逺若何月屇授衣應薦爽風過落㡌尚囘和離宫應識天懷愜蕃部先聞擊壤歌經時扈從喜騰軒駑質行慚駿足奔古牒青猶環馬首秋葩紅已綻雲根新符不待郵傳換舊帳重尋卓歇存取次入闗三宿近盡擕行卷紀恩言恭和御製入古北口元韻史貽直誰言天險出神工中外今知雨露同秋入闗城清輦路日臨仙仗絢霜楓萬家殷阜人烟聚百雉巍峩地勢雄多少邊民深愛戴鑾迴遮拜繡旂風恭和御製寒𤓰元韻阿克敦寒𤓰别種亦常蔬風雨田間採録餘縷縷繩牽縈蔓後離離實好繫門初麤梁欣得餐能佐甘瓠烹來味儘如七月詩中應補入不愁老圃食無魚恭和御製山田元韻嵇璜凡民務生計詎宜禁所之闗外山可田嵗乆蕪不治䝉古事畜收肥瘠俱所遺邊氓窺此利招攜來窮黎連塍及寸壤人力無不齊幸兹風雨時辛苦慰一犂磽确變腴土游曠兩有資分疆或興議帝命下所司務俾中外安民隠若察眉前題金徳瑛髙低皆犖确有人疆場之斷石闢荆棘始覺蕪穢治當昔生齒寡土或有曠遺五方今雜聚招徠憫窮黎老幼攜筐餉丁壯用力齊颯然山雨過頳汗把一犁艱難且勿説猶勝全無資拊循冺争奪疆界慎職司庶幾磽瘠壤樂業咸開眉恭和御製永恬居元韻劉綸東巖花發晨西嶺雲歸暮居常與之恬山亦水其趣聖性皆天遊停鑣竚清路此中一邱壑太古心已具於焉契真詮象外得言寤靈臺及卷阿名義資補注恭和御製山莊起程之作元韻梁詩正山館兩宵資憇息塞程初軔樹麾旌宜秋薄霧方侵曉解事西風乍作晴翠挹青螺峯逺近香飄華黍畆縱横佇看重譯賢王集望拜前騶效欵誠恭和御製氊廬元韻梁詩正度地搘持穏隨程舒卷如延青窗半敞生白室中虛乙夜明然燭重簾䕶展書莫論寛與窄天地一籧廬恭和御製即事元韻阿克敦帷宫隨事洽清歡霧氣初凝木石寒列嶂依營詩境逺髙原縱轡獵場寛水筒行汲泉還繞樵斧聲聞路曲盤自是游情契真宰江南塞北豈殊觀恭和御製於木蘭作元韻劉綸朔野古區脱置頓若鄉縣四十有八部三年歌載見不待披黄圖要荒等候甸因資軍實脩用使巗疆奠泉甘而草肥樂此羣材囿賓服敢自封獻地供蒐狩伐樹禁射生育物與時茂土名多巴顔富也徳産信云富巗花候慈輩向暖争斕斑秋風未滿斾令序遲初寒簡卒佐㳺激負弩來𫝊餐聖孝調六膳捦解喜登盤鍵闗設枑木地利匪専美表界蕃落間避馬行且止天山成上苑往牒罕倫比逺馭在堂階前猷隆至理文武常兼資伊古垂令譽我皇勤玉趾習勞溯厥初穆納控興桓指掌羅方隅邊垣饒稌黍蹴踏防前驅申旦集徒御洞壑開深幽講武協天行蓐収正司秋驩嘑知獲雋彳亍紛攀留捎鞍見頒禽戢戢多駢頭郵籖促封匭問夜闗堯心復此寸隂惜罷獵先成吟詞臣如望洋㣲涓慚酌斟嗤彼上林賦矢此卷阿音一舎便移徙萬竈騰烟光柴車行叱叱作市牽牛羊懽迎衆君長諏日咸擎觴上壽聴山呼錫祚垂鴻龎時巡考虞典罙阻通四隩陳風更觀物性天徴所樂暗雲歛天未萬笏揷清昊願言勒貞珉紀實崇典要恭和御製塞上秋蒐奉皇太后自圓明園啟蹕六韻元韻徳保玉輦天邊發行看塞上秋時巡遵祖訓講武展皇猷乾惕深行幄恩波遍宿郵蘭輿承色笑蔀屋入詢諏宫栁迎清蹕宸章記舊逰馬前隨指㸃佳氣擁山頭恭和御製聞淮南得雨元韻徳保時霖優渥急封函報道淮南水盡甘灌溉已聞勒夏五空濛端可賀秋三樂憂有序心常惕風雨無愆徳不慚比戸定知沾聖澤非闗財賦在東南恭和御製長城元韻徳保長城設險勢方豪空憶亡羊尚補牢但使雄闗分内外遂教滄海動波濤金墉不解蕭牆患粉堞會同束馬勞千古人來城上望笑他堅壘敵弓刀恭和御製灤陽别墅元韻徳保烟抹崇巒草色青灤河環抱碧泠泠檻依幽壑風當户座俯清流月在庭試馬正逢秋隼健開軒偏愛野芳馨吾皇茂對添佳興隠約秋聲静裏聴恭和御製凉元韻徳保輕葛無端欲改為秋風乍引劇紛披祗因人在層巒上頓覺凉生七月時深徑曉行綿易早小橋徐渡水流遲節隨地變寒暄異茂對還聞繫睿思恭和御製小金山元韻徳保緬思浮玉山嶒嶸勢砐硪下臨萬里江上結千年果何如此峯秀數椽適延坐藉彼以金名無須錦繡裹登臨仰聖蹤結搆天成妥即小作大觀山靈􅀿許可恭和御製桂元韻徳保丹桂當秋帶露鮮香飄御座恰開筵月輪枝滿逢嘉慶山館聲和􅀿睿篇影向髙􅊠千樹合花看中外一家連秋來多少延齡蕊㪚馥無如此卉賢恭和御製霧元韻徳保大塊文章險以奇雲氣變幻山可移塞上山多常隠豹飛烟縹緲無東西沾衣欲濕疑細雨妙哉嘘吸伊誰為我皇登山初校獵從官雷動瞻旂旗樹木森布匹練染絲絲縷縷縈虬枝仙人空中起樓閣圖畫天然臨碧池頃刻九霄如綿墜恍行萬馬羣奔馳谷嵐捲散青天現羽林屹立麕麚迷神武天縱君王備祖法垂裕昭繩其道旁文臣失逺路按轡遣使交詢咨走筆冩出千萬象下馬齊讀軒轅詩恭和御製行圍獲白麅詩元韻徳保車駕動仙靈瑶光散碧星舎貞馴在野應瑞獻於庭潔愛秋雲壑游宜上苑亭出羣標素質養性飽芳苓得不煩彤矢歸看映玉軿夀仁徴物象何必著丹經恭和御製行圍四詠元韻徳保撒圍千二百軍士分旂逐隊行不知山崱屴秪凛令嚴明左右飛雙翼迴還列五旌恭勤諸部落踴躍洽皇情待圍箕斗天邊下停鞭立水涯自知収縱得無不往來宜霜逈盤鵰路風髙射虎時攻車猶未合吉日早歌詩合圍髙低縁谷勢密布網堪稱整似縱横陣嚴如戒律僧三驅士同力壹發聖多能講武皇猷盛秋蒐舊典仍罷圍圍罷烟雲捲情聫中外歡頒恩到藩服觀獵及彈冠育物仁開網陳牲孝奉盤喜承文母宴愛日上風竿恭和御製行圍四詠元韻介福撒圍獵騎衝霜動深林踏葉行乍看初日起漸覺萬山明馬度梯雲路人呼出樹旌諸蕃忻效命踴躍奉皇情待圍山半行城列圍來逺澗涯令同嚴陣日典與詰戎宜一線綿聫處雙旌合抱時㣲臣忻從獵吉日續賡詩合圍塞外秋蒐候寧同羽獵稱霜寒明似雪石古瘦於僧撇捩弦聲發超騰馬力能一圍更一嶺樂意不相仍罷圍恩威式蕃服逰豫博慈歡摰羽歸鷹架天閑卸馬冠腥頒中使騎賜重大官盤拜澤歸廬晩燈光認逺竿恭和御製九日元韻蔣溥獵場此日恰周遭塞外風雲氣象豪排檻山光千疊秀生花天藻九秋髙茰囊佩處香盈袖菊盞斟來色映袍從古獲熊占得士侍臣紀實喜抽豪圍場熊次皇上親射二日京師發榜恭和御製罷獵出崖口元韻汪由敦歸程經谷口獵騎散千羣氣尚從公壯情縁拜賜欣懐柔先烈逺纉述聖心殷一讀豐碑句乾坤煥大文恭和御製波羅行宫作元韻汪由敦輦路逶迤候獵歸離宫閒敞暫相違菊花過節留餘􅃩時重陽後二日松翠淩空散逺暉弭節偶閒從味道詰戎深意在防㣲山莊隔日􅀿重到坐攬朝嵐與夕霏恭和御製灤陽别墅元韻秦蕙田水勢山容一攬収翠華臨幸正清秋四圍烟樹紛無數百道風泉在上頭奇境得來因地設藻思溢出似川流碧波清嶂幽尋處嵗嵗榮經御墨留恭和御製雙墖山元韻嵇璜􅌥堵波明入畫圖雙尖馬耳故應殊一鞭重指灤河北絶勝扁舟西子湖前題徳保寶鐸連峯儼畫圖誰參慧業象文殊西來一曲灤河水彷彿靈蹤鎮五湖恭和御製汲伊遜水烹茶元韻汪由敦秘製三清稱絶品竹爐風雅名髙甚佳泉往往天作合相得益彰精鍳審皇都玉泉塞伊遜下澤藴奇鍾異禀崑山傍玉石抵鵲行汲尋常付厨廩一後真賞逹至尊第一之名斯共稔行秋哨鹿入木蘭溯源百曲頻咨諗撒圍虎帳試注兹味别淄澠入無朕松枝石銚活火煎雲膄雋永清不凛雖云地逺遐荒隔那比玉泉依席衽金漿甘醴何足方半月程供大官飪㳟和御製灤陽别墅元韻王際華别苑緑隂稠鸞旂此暫留人間方入暑天上已迎秋當牖髙峯列侵階激水流窈然多静賞花木正修修欽定熱河志卷一百十一
