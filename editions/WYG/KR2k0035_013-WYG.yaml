body:
  text: 欽定四庫全書欽定熱河志卷十三巡典一粤昔觀河遊華巡典聿興逮夫夏諺美豫遊之度周詩揚裒對之休展義宣風嵗時臨幸亦近在畿甸而已聖朝聲教廣訖邉闗以外與中土郡邑無異而木蘭圍場草木之茂禽獸之多秋田獮狩若苑囿然所以習武功于徼塞所以盛王㑹于遐藩徳莫隆焉威莫重焉洪惟世祖章皇帝清蹕肇臨聖祖仁皇帝六飛時御于苗典則昭示來兹我皇上迪閳前光以嵗辛酉親􅊩行圍嗣乃間嵗一至後遂定為秋巡令典毎諏期戒道敬奉安輿闗門士庶瞻仰光華藩部名王嵗時來辟施惠行慶朝覲宴賚之禮于是乎行焉謹排次年月志巡典第二至夫巡覽經臨㡬餘遊詠山川煥采雲日増輝恭録聖祖御製巡行諸詩敬冠卷端我皇上巡幸篇什分年編次用光懋典若夫行圍射獵之詳則别載圍塲門云聖祖御製詩巡幸出喜峯口過黄土巖初集紫塞雙厓出丹梯百尺懸草香遮細路樹老卧晴烟地為時巡到山當隘口徧何年留石室駐馬望層巔塞上諸宴藩龍沙長宴塞雲收帳外連營散酒籌萬里車書皆屬國一時劍珮列通候天高大漠圍青嶂日午微風動綵斿聲教無私疆域逺省方随處示懐柔入喜峯口一道鳴鑾度三驅振旅還莓苔天半石松栝雨中山險設闗門壮時清堠火閒孝陵佳氣近縹緲翠微間夏日奉太皇太后避暑興安玉輦親扶出鳯城青霄遥指五雲生鳴鑾日映中天永避暑風來北塞清萬里山河通逺徼九邉形勝抱神京登臨但得慈顔喜長侍瑶臺嵗嵗行曉發古北口望霧靈山流吹凌晨發長旓出塞分逺峯猶見月古木半籠雲地迴疎人跡山迴簇馬羣觀風當夏景澗草自含薰駐蹕興安八首并序出古北口岡巒盤互地形漸高行五百里至興安峻嶺竦峙自張家口蜿蜓而來横亘塞外南北諸山盡出其下地當䝉古諸部道里之中為曩昔枕戈擐甲戰争之所迨我列祖肇握乾符恢廓天緒徳威所被四十八部罔不傾心内附古之甌脫今𨽻方輿癸亥夏六月奉太皇太后避暑來游駐蹕于此炎歊不至清風滿林山雨既濡萬卉齊發于是逺邇大小藩臣各率其屬趨侍行殿既于苗以講武事復燕衎以懐逺人撫此遐陬在禹迹方行之外聲教四訖皆祖功宗徳之貽朕今紹祚獲際昇平能無永念乎即事書懐徳詩六首祖徳隆三后天心廓九圍謳歌通毳幕風雨想戎衣一自車書合長㸔職貢歸黄圖無内外時邁有光輝其二特奉仙輿出晴巒駐羽旄鳯多停彩扇驛逺進冰桃麗草金蓮湧塞上多金蓮花較清涼山尤勝濃隂碧樹高墉臺新月上廣樂奏雲璈其三重嶺疊雲烟旌旗拂塞天草香薰翠幄花暖接紅川雁磧長城外龍荒勝地𫝊回瞻亭障逺千里抱幽燕其四六月浮埃淨高居暑氣消千山低接帳萬木迴凌霄地擁邉沙濶天臨塞曲遥封章達行在銀燭秉凉宵其五虎㦸間清候逍遥覽物華烟籠千樹栁暑發四時花風土暄凉異山川道里賖濯枝新雨歇皎皎散飛霞其六地脉連荒服山形赴上陘炎歊移月令分野别星經樺屋參覃白松林㫁續青雲沙一萬里屬國盡來庭其七邉雲澄霽色山翠㸃行衣馬引雕弓過禽連羽箭飛旌旗開一面草樹入長圍我武當蒐狩非因耀徳威其八紫塞行巡日琱輿問俗年大庖陳折爼仙醴秩初筵屏翰金湯壮光華賜予宣示慈良有意裒對在敷天巡厯塞北雜詠四首叠嶂層崖一綫開草􅀷徑路絶塵埃龍沙雨後灤河水日夜朝宗入塞來其二雲開灌木萬山清縹緲前旌拂曉星漫道窮荒人跡少㡬家烟火簇邉庭其三職方風土有遺書問俗今還一駐車禾黍近來耕稼滿烟鋤雲鍤遍新畬其四塞北風多露氣凉幔城坐聴漏聲長只今六月渾無暑已見飄來木葉黄迴鑾抵古北口黄谷清河古戍間鑾車此日省方還長林曲抱千溪水小徑斜通萬仭山地扼襟喉趨朔漠天留鎻鑰枕雄闗時平不用誇形勝雲物秋澄斥堠間塞外省覽風俗莫道巖闗險要荒總一家戍樓無鼓角戰罍是桑麻野静知民樂時清見物華林中歸徑晩旌斾滿烟霞再至紅川避暑塞外留鑾蹕長林帳殿幽乍㸔南火厯已動北山秋露冷輕葵箑花寒御綺裘重來欣勝賞斯地即丹邱迴鑾至鰭鬛口秋雨初霽對月纎月高林動輝輝古塞長冰輪初濯露桂影欲飄香鳥鵲聲頻起闗河色共涼旌門唫眺逺萬國自清光出古北口二集年年秋獮此經過硝石天成險隘多沙漠名王皆屬國但留形勝壮山河将之山荘四首三集畏暑心何勝平明出玉墀萬㡬豈歇息臨政有疇咨其二暖溜自平地風光此日佳暄波由近發浩澤無津涯其三駐輦相風竿臨書羡五𫝊情瀾分暑節疏爽須葵扇其四霖雨消塵蹟輕霞照野荆詞臣毎扈從上賞賦昆明迴鑾四集獵罷迴鑾塞冷時昊天今嵗落霜遲圍人競帶甘肥脯田叟爭收高下􅓱榖賤共知欣有食物多須記守長規西成盈野倉箱滿闗内依然是所思順治八年四月乙卯上啟蹕巡幸塞外癸亥出獨石口五月甲申駐蹕上都河丁亥駐蹕喀喇河屯己丑入古北口癸巳上迴宫康熈十六年九月甲申上啟蹕㳟謁孝陵禮成巡幸塞外己丑出喜峯口乙未駐蹕和爾和克必喇丙申迴駐喀喇河屯賜來朝喀喇沁郡王扎什鎮國公烏特巴拉等弓矢庚子駐蹕達什喇卜齊昻阿先是命喀喇沁郡王扎什鎮國公烏特巴拉一等塔布囊什逹及三十二塔布嚢精竒尼哈畨副都統等以兵一千五百名來為嚮導是日上御幔城外各賜冠服鞾帶銀幣有差壬寅入喜峯口是日蘓黙見駕經逹蘭遒旁卧者遣侍衛往問覆奏民人王某自邉外傭工歸乏食僵卧不能起上曰誰非朕赤子可食以粥並杜昇資命喜峯口逰擊送回籍十月癸丑上迴宫二十年三月癸酉上奉太皇太后啟蹕幸遵化州湯泉因巡幸塞外四月庚寅出喜峯口丙申駕至拜察丁酉駐蹕和爾和戊戌駐蹕必爾罕己亥迴駐烏蘭岡安丁未入喜峯口五月乙卯上奉太皇太后迴宫二十二年六月癸未上奉太皇太后啟蹕巡幸塞外丁亥出古北口戊戌駐蹕烏拉岱庚子以天旱命建壇祈雨是日丼霖大沛丙午巡視英錫爾哈等處甲寅還駐烏拉岱庚申奉太皇太后幸拜察丙寅御黄幄設儀仗賜來朝科爾沁喀喇沁翁牛特土黙特敖漢奈曼克什克騰阿巴噶喀爾喀諸王貝勒貝子公額駙台吉及蒙古官兵等宴頒賜䝉古王公及管領圍場各王公等冠服鞾帶有差七月庚午朔御黄幄賜管領圍場阿嚕科爾沁郡王色楞額駙巴特瑪及台吉等宴是日奉太皇太后自拜察迴鑾駐蹕胡土克圖布拉克賜色楞等冠服鞾帶弓矢及官兵等銀幣有差辛未諭各䝉古王公額駙台吉及官兵等曰今阿嚕科爾沁翁牛特二旗盜賊甚衆為盗賊而致富者能有㡬人身被惡名被獲則死凡富貴皆由天命違理妄求能必得乎爾等各遵法守分有一二牲畜者擇水草善地畜牧能耕田者勤于耕種則各得生理天亦佑之倘有貧困至極無以聊生者該管之主宜加撫恤使之得所朕本内外一視並無分别爾外國遇年嵗荒歉朕即運粮米賑濟或有困乏即賜牲畜縀匹無非慮爾等失所此畨巡幸爾等或有過犯朕並不報法治罪且頻加賞賚嗣後爾等宜遵守教諭革除惡習以副朕好生之意科爾沁親王班第等率官兵等懽忭奏謝庚寅入古北口甲午上奉太皇太后迴宫二十三年五月甲申上啟蹕巡幸塞外丁亥出古北口戊子于偏嶺西山行圍殪虎癸巳駐蹕阿里瑪台賜八旗䕶軍校等牛羊六月壬寅駐蹕蘓拜昻阿伯勒齊爾諭扈從諸臣禁踐踏禾苖癸卯駐蹕庫克哈達乙巳賜扈從八旗章京護軍及䝉古察哈爾䕶軍等牛羊丁未於錫爾哈摩琳阿林行圍殪虎壬子駐蹕額爾通色欽先是庚戌扈從諸臣奏水草多駕將幸牧地烏蘭哈達等處饒獸請便道行圍軍士便從行上以其地艱樵採不命别擇地以聞甲寅諭副都統巴圖等曰邉外八旗䝉古與内八旗一體今朕巡行之次見其衣食常乏深為惻然著通行曉諭所過地方䝉古人等有鰥寡孤獨老病不得其所者今其來見加恩賞賚且因其來見朕亦可以悉其生計嗣是諸䝉古人等日扶老擕㓜泥首年齒行宫前叩首命曉事者進見詳詢生理降㫖賜上飲食量給銀布有差乙夘駐蹕額爾通阿拉御黄幄閱馬駝牛羊牧羣賜温郡王延夀自擇内廐馬二匹扈從内大臣都統前鋒統領䕶軍統領等内廐馬各一匹侍衞前鋒叅領䕶軍叅領以下至八旗前鋒䕶軍察哈爾䝉古官兵及執事人等各馬一匹時前鋒叅領錫圖塔爾岱以効力行間人材壯健命加賜内廐馬一匹以奨之辛酉于哈馬爾阿林行圍殪虎七月乙丑朔駐蹕昆都倫拉克賜扈從八旗官兵及䝉古察哈爾官兵牛羊癸酉駕至拜察乙亥賜克什克騰都統叅領佐領驍騎校等蟒袍綢縀及兵丁等銀布有差八月乙未駐蹕烏拉岱丁酉賜科爾沁端敏公主翁牛特和碩郡主蘓尼特和碩郡主縀匹鞍轡巴林王納木達克貝子烏爾占温春冠服金帶弓矢鞍轡額駙阿喇卜坦台吉格哷勒圖等以下䕶衞典儀以上並扈從都統副都統官兵等冠服鞾帶弓矢銀幣布匹有差壬寅駐蹕僧機圖哈達賜扈從八旗官兵牛羊丙午入古北口戊申上迴宫二十四年六月乙巳上啟蹕巡幸塞外癸丑出古北口七月丙寅駐蹕都呼岱浩齊特郡王䇿卜登奏嵗饑請賑上諭理藩院遣官赴浩齊特速察饑民户口以聞己巳駕至拜察癸酉駐蹕錫布赫海塔哈理藩院以浩齊特饑民户口奏聞命以拜察儲粟一千石運徃賑之八月癸巳駐蹕齊老圖賜察哈爾官兵衣幣銀布有差丙申駐蹕伊瑪圖諭八旗察哈爾官兵曰爾等自太宗皇帝時皆編旗分佐領愛養有年今朕巡行邉外講習武備見爾等人材壯健頗諳體制與京師八旗無異朕所以奨勵爾等不分内外一視同仁嗣後各宜善為畜牧力勤農事謹守成法勿為盗賊如此不特人皆得所即朕任使亦有禆益矣察合爾㳺牧總管及各官兵等皆懽忭奏謝己亥駐蹕僧機圖昻阿庚子賜來朝科爾沁翁牛特巴林敖漢諸王貝勒額駙台吉等衣服鞾帶及官兵銀縀布匹有差壬寅駐蹕烏拉岱丙午駐蹕拜布哈昻阿賜翁牛特修路官兵銀縀布匹有差乙卯駐蹕烏爾格蘓台丙辰賜哈喇沁郡王扎什以下及官兵等冠服鞾帶銀縀布匹有差九月戊午朔上自博羅河屯迴鑾己未上迴宫二十五年七月辛亥上啟蹕巡幸塞外八月癸丑朔出古北口己未駐蹕烏拉岱辛未駐蹕烏爾格蘓台賜喀喇沁郡王扎什翁牛特郡王必里衮達賚及各台吉等冠服鞾銀縀布有差甲戊入古北口丙子上迴宫二十六年八月己酉上啟蹕巡幸塞外辛亥出古北口癸丑行圍殪虎二駐蹕愽羅河屯庚申駐蹕烏拉岱壬戌駕至巴隆桑阿蘓台甲戌迴駐博羅河屯賜喀喇沁郡王扎什翁牛特郡王之母和碩公主及郡王必里衮達賚各台吉等銀幣有差乙亥行圍殪虎駐蹕伊遜必喇九月丁丑入古北口己卯上迴宫二十七年七月丙戌上啟蹕巡幸塞外戊子出古北口壬辰駐蹕喀爾必哈哈達是峯舊名納哈里狀如浮圖髙百餘丈上率文武諸臣仰射連發數矢皆過峯頂侍衛桑格納拉善射僅至巔餘不能至上駐蹕賜名喀爾必哈哈達八月癸卯行圍殪虎駐蹕巴顔溝癸丑駐蹕伊瑪圖聞浩齊特貧困命以拜察米五百石銀千兩量給之甲寅賜随圍八旗察哈爾官兵等銀縀布匹有差壬戌駐蹕烏拉岱和洛癸亥駐蹕烏里雅蘓台達巴罕喀爾喀洪豁爾岱青台吉等率屬來朝上以御用珊瑚數珠賜之嘉其先報厄魯特軍情又首率衆台吉來謁也賜來朝翁牛特巴林土黙特敖漢扎噌特阿巴噶喀爾喀諸王貝勒貝子公台吉塔布囊等並扈從諸王文武大臣八旗官兵等宴丙寅駕迴駐烏拉岱和洛九月戊子入古北口辛卯上迴宫二十八年八月癸酉上啟蹕巡幸塞外丙子出古北口諭扈從諸臣曰前諸王大臣以朕因嵗旱之故抑􅉱靡寧兼遇喪事體加勞瘁再三懇請行幸郊外以養朕躬朕允所請而行内地荒旱已遣官徃察今觀口外田畆亦因旱歉收故朕于此處貧民悉行補助又聞此地馬斃甚多恐無知者罔識朕心乃謂朕以游嬉而來也是日賜口外居民銀兩丁丑駐蹕富勒堅噶山上以諸䝉古嵗旱乏食命内大臣大學士等㑹議運米各口分賑各扎薩克清察户口王台吉等親督領米喀喇沁翁牛特巴林為一起土黙特敖漢奈漫為一起蘓尼特察哈爾八旗為一起扎嚕特阿嚕科爾沁為一起核實散給戊寅駐蹕博羅河屯賜什巴爾台居民銀米己卯至張三營賜居民銀米丙戍至巴隆桑阿蘓台戊子駐蹕烏拉岱昻阿九月戊戌駐蹕拜察和洛以喀爾喀信順額爾克岱青等六台吉所屬嵗饑遣官察視行賑辛丑入古北口癸卯上迴宫二十九年七月癸卯上啟蹕巡行塞外丙午出古北口諭大學士伊桑阿尚書顧八代曰朕沿途閱視見所踐田禾過于朕初時諭㫖部中丈量者惟恩格木噶山以南過此並未丈量何地非朕赤子可令侍郎賽必罕即自口以北至坡賚噶山凡所踐田禾作速明悉丈量己酉駐蹕博羅河屯壬子自博羅河屯迴鑾八月庚寅入古北口乙丑上迴宫三十年四月丁卯上啟蹕巡幸塞外察視各䝉古生計又以喀爾喀土謝圖汗等率屬來歸親臨撫綏安輯壬申出古北口甲申駐蹕海拉蘓台自海拉蘓台及編旗幸多倫諾爾凡喀爾喀入覲宴賚錫爵諸典禮皆於多倫諾爾舉行五月辛卯自多倫諾爾迴鑾己亥入古北口癸卯上迴宫閏七月乙亥上啟蹕再幸塞外辛巳出古北口乙未駐蹕烏拉岱九月丁巳入喜峯口乙丑上迴宫三十一年七月乙亥上啟蹕巡幸塞外八月己卯出古北口癸巳駐蹕烏拉岱壬寅駐蹕永安湃達巴罕癸卯賜來朝喀爾喀哲卜尊丹巴胡土克圖土謝圖汗親王䇿旺扎布貝勒錫第錫哩台多吉爾濟額爾徳尼阿海等宴頒賜冠服蟒縀弓矢有差九月庚戍駐蹕熱河湯泉以喀喇沁行圍効力賜郡王扎什以下及官兵等冠服蟒縀弓矢銀兩有差丙辰入古北口己未上迴宫三十二年八月癸未上啟蹕巡幸塞外丁亥出古北口己亥駐蹕錫伯必喇賜來朝科爾沁喀喇沁翁牛特巴林土黙特敖漢阿巴哈納爾諸王貝勒貝子公額駙台吉塔布囊等並扈從文武大臣八旗官兵等宴賜随圍喀喇沁塔布囊以下及官兵等冠服鞾帶銀縀布匹有差九月丁未駐驆烏拉岱癸丑駐驆僧機圖哈逹昻阿賜喀爾喀哲卜尊丹巴胡土克圖土謝圖汗諸王貝勒台告等冠服蟒縀鞾帶弓矢刀鞍有差丙辰駐蹕齊老圖昻阿賜喀爾喀郡王昆都倫博碩克圖衮布等冠服鞾帶有差庚申駐蹕巴達喇噶山賜翁牛特貝勒額勒徳卜台吉鄂齊爾土黙特貝勒額爾徳木圖喀喇沁鎮國公善巴喇錫等及随圍喀喇沁塔布囊以下官兵等冠服鞾帶弓矢銀縀布匹有差甲子入古北口丁卯上迴宫三十三年七月庚寅上啟蹕巡幸塞外甲午出古北口八月乙未駐蹕拜布哈昻阿賜喀爾喀哲卜尊丹巴胡土克圖等冠服蟒縀有差九月癸酉駐蹕喇嘛洞賜喀喇沁郡王扎什等冠纓蟒縀銀兩有差乙亥入古北口己卯上迴宫三十四年八月壬辰上啟蹕巡幸塞外乙未出古北口戊戌駐蹕博羅河屯上以巴林翁牛特嵗不登命學士喇錫前往察視分别詳奏辛亥駐蹕札哈烏里雅蘓台賜喀喇沁郡王扎什等冠服縀匹有差乙卯駐蹕噶海圖賜喀爾喀哲卜尊丹巴胡土克圖土謝圖汗郡王敦多卜多爾濟等冠服縀匹有差九月戊寅入古北口辛巳上迴宫三十六年七月丁未上啟蹕巡幸塞外八月庚戌出古北口乙亥駐蹕畢圖舎哩賜來朝喀喇沁翁牛特喀爾喀諸王貝勒額駙台吉等銀幣有差九月甲申駐蹕汗特穆爾達巴罕厄魯特台吉丹濟拉來降至御營朝見辛卯入古北口甲午上迴宫三十七年七月甲戌上以噶爾丹蕩平躬詣盛京謁陵告祭時以山海闗一帶秋禾在地命取道口外前往辛丑奉皇太后啟行甲辰出古北口戊申自唐三營前詣盛京癸丑駐蹕喀喇沁和碩端静公主第和碩端静公主和碩額駙噶勒臧進宴甲寅喀喇沁郡王扎什等進宴賜和碩端静公主和碩額駙噶勒臧銀幣庚申駐蹕哈喇托海敖漢郡王扎木蘓等進宴壬戌駐蹕珠爾噶岱哈達敖漢和碩額駙齊倫巴圖爾等進宴自科爾沁境詣成由山海闗盛京禮迴鑾十一月癸未上奉皇太后自盛京迴宫三十八年閏七月癸丑上啟蹕巡幸塞外丙辰出古北口己未駕臨沙喇諾海達巴罕賜名阿布達爾八月甲申駐蹕齊老圖昻阿賜來朝科爾沁喀喇沁巴林敖漢阿嚕科爾沁烏珠穆沁浩齊特阿巴噶阿巴給納爾喀爾喀諸王貝勒貝子公額駙台吉等冠服銀帶鞍馬有差乙酉駐蹕庫爾竒哷必喇賜随圍喀喇沁官兵銀幣有差己未迴駐博羅河屯九月庚子自多倫諾爾入張家口乙巳上迴暢春園三十九年七月丁巳上啟蹕巡幸塞外八月辛酉朔出古北口癸亥行圍殪熊駐蹕喇嘛洞丙寅駐蹕納木桑扎塞賜多羅僖郡王岳希喀喇沁王扎什公福善台吉鄂齊爾弓各一丁卯駐蹕英圖和洛賜翁牛特都稜郡王班第馬八百匹以資生息癸酉駐蹕齊老圖先是遣往敖漢教養䝉古生計之黄茂等來奏耕穫榖數諭大學士馬齊𣲖章京等前徃察視所獲未榖各部落教養䝉古官員等随相繼入覲上皆詳問䝉古生計雨水情形及各旗耕獲榖數己丑行圍殪熊駐蹕扎哈烏里雅蘓台九月辛卯行圍殪虎駐蹕汗特穆爾達巴罕昻阿丁酉入古北口辛丑上迴宫四十年十一月丁未上啟蹕恭謁孝陵禮成巡幸塞外十二月乙卯出喜峯口己未行圍殪虎駐蹕七溝壬戌行圍殪虎駐蹕喀喇河屯乙丑行圍殪豹二迴駐兩間房丙寅入古北口己巳上廻宫欽定熱河志卷十三
