body:
  text: 行宫十八獅子園獅子園園以傍獅子嶺得名我世宗憲皇帝在藩邸扈從賜居於此中多世宗題額園額乃聖祖賜書也東西宫門五楹其南碧水廻還北岸亭三楹額曰翠柏蒼松逾橋而南㳟懸聖祖仁皇帝賜額前五楹額曰芳蘭砌書院東環以廻廊中峙方亭又東南殿三楹額曰水情月意後殿三楹東有亭聖祖御書額曰環翠橋之北為正殿有待月亭在殿東南前殿五楹世祖御書聨曰日往月來明至道花香鳥語露眞機皇上御書聨曰西屏翠嶂常堪挹北户清風不礙塵後殿三楹東五楹額曰片雲舒巻又東北三楹為䕶雲莊我皇上御書額西北七楹額曰羣山環翠東北為草房又東北曲徑􅆼深殿五楹額曰澄懐更内五楹庭前植松柏各一額曰松柏室後三楹為忘言館其西跨澗為小堂三楹曰秋水澗兩額並我皇上御書斯地當園東北隅景最幽邃西南為妙高堂㳟懸聖祖題額堂五楹踞山峯最高處皇上御書聨曰風吹縠靣文章好詩托峯眉氣象舒其南為法林寺殿三楹有鐘樓峙其旁殿後佛樓三楹額曰普門隨現聨曰妙蓮峯對青山峙甘露林成紫竹環寺内聨額皆皇上御書洪惟列聖繼承治臻巍煥奎文寳翰雲日留輝我皇上念篤紹庭嵗時展詣慕思所積題詠尤多㳟讀世宗聖製皇上御製詩仰見授受淵微心𫝊有自所由覲光掦烈至於億萬年也世宗御製詩熱河園中避暑别業遥連上苑邊承恩避暑興怡然蘭舟曉泛晴波裏荷盖擎珠顆顆圓園中即景林亭幽静晩風涼水氣侵衣荇藻香好景片時期莫負開忩披巻意徜徉中元登獅子嶺感懐晩登獅子嶺四望浄雲煙葉落瘦崖樹雨過響澗泉人顔移嵗月秋色老山川令節須酬賞天空月正圓妙高堂碧峯頂上結茆廬可擬巢由物外居雲變白衣眼底事風翻貝葉案頭書性天融會無今古心月圓明徹太虚睡起北忩時一嘯千山答響自如如獅子園夏日石屋荆扉枕翠岡煙巒朝夕鬱丹蒼棋敲緑樹隂中局酒泛紅薇架下觴珠箔晝摇新竹影玉池晩送嫩荷香居閒謾謂全無事一榻臨風蠂夢長御製詩獅子園即事辛酉避暑山莊之北有獅子嶺嶺下建園因以獅子名皇考藩邸時扈駕來此所居之賜園也乾隆六年秋八月因塞外行圍廻道至此曷勝趨庭之感即事書懐爰成長律憶昔趋庭日重經避暑園壁題餘手澤孺慕想親恩閱嵗階梧古丁年書室存塵生煮茗具菌茁玩花軒廵狩今方始桮棬此重捫無從窺領膩莫可展冬温永念劬勞至空驚日月奔徘徊瞻碧落神愴向誰言獅子園二首癸亥軒榭啟清秋溪池尚碧流虚無餘想像清暇此淹留梧䕃惟添宻蛩音更助愁趨庭空有憶視膳竟無由壁有曾題字齋無向讀書苔青增砌古山静覺牕虚幻景歸蕉葉流隂駭日車獅峯誠善吼不動只如如獅子園三首有序丙戍辛酉秋初至避暑山莊曾詣園一逰不勝雲日之感後以分賜果親王弗復往者廿餘年矣茲聞園頺廢特甚而王又已背世念此地為皇考舊日所興息且吾少小問安讀書處也不可以有山莊而聽其荒落無存仍命奉宸重事修葺復舊觀而止䇿馬相視因成三律誌懐獅園弗重到瞥眼廿餘年藩邸曾分賜佳城又棄捐荒頺茲已甚修葺可仍延少小聞詩處廻翹倍黯然牆裏收燕麥階前長兔葵無端偶遊渉不忍重去聲追思列水逺縈帶獅峯近嵂嵜倪家林適合宗旨彼奚窺樓擬名華萼園非例奉誠罥楹鳥衝葛食野鹿銜苹迅矣嵗時閱幻兮興廢更精藍重平聲搆築藉欲悟無生重葺獅子園落成奉皇太后逰覽詩以誌事丁亥去嵗斯園偶訪之兔葵燕麥景淒其因教葺築復舊觀去聲宛㸔落成如向為峯峙千秋善獅吼境同昔日躍龍池奉慈豈不心深慶聖藻重瞻有所思獅峯不是㬅殊此現身如何獅子靣前馴箇間祇合忘諸慮稽首皈依清浄因再逰獅子園獅峯崒嵂屋檐前避暑山莊隔一川臺榭維新適此日林泉依舊憶當年境無俗韻入圖畫鳥有佳音勝管絃記得黄園工位置倪瓉獅子林今為蘇州黄氏園亭園中樹石皆雲林結搆并自為之圖其圖今蔵石渠寳笈倪迂小巧詎天然獅子園襍詠山色㡬年不見佛頭青依舊葱朧翠滿庭悟到色空眞寂所身標清浄鎭亭亭鐘聲山寺從新葺法林一聲鐘響七條音旣云本是無生滅何事悽然又繾心砌花秋芳浥露自葳㽔年去年來付不知記得童時閒鬬草偏於色様覔新竒庭樹無情庭樹亦婆娑高拂簷雲淺覆莎秋月春風凡㡬度不因今昔較如何水月繞堂野水正澄鮮新月依然掛碧天入影􅄼論滿與半當年曾暎指頭禪松風盤拏虬盖峙階墀颯㳫偏宜風入之應為去聲吾心有所感特教寒籟掃無遺鳥語庭樹棲禽窺畫堂今來不似昨荒涼分明是説廢興閲解語何須藉冶長蛩音椿叢鼓脇作聲長露與為清風與揚一晌憑欄聽唧唧助予或亦似歐陽遊獅子園戊子維新成去嵗重至又今秋聖日如常照隙駒眞是遒山園時景颯書屋古香留佔畢髫年處居然已白頭獅子園六詠山色山色借林色林生賴山生一二二而一無情與有情溪聲溪聲雨後壯萬籟鳴都收轟湱音恒在不共水東流鳥語樹宻致鳥喜鳴非不得平誰能解其義惟愛聽其聲蛩吟鼓脇草叢中可聞不可見兒童甕為城乃復督之戰砌花秋花饒野意紅紫紛丁星不謂無人賞風前也吐馨庭草誰曾工織罽翠毯庭前披示儉觀生意皆堪唘廸思㳟奉皇太后遊獅子園金風皜日仲秋天欣奉慈遊坻苑便鳯輦鎭㸔祥擁䕶獅峯如獻夀因縁手調甘旨叨加進目覩山川覺倍妍膝下依依承色笑不殊四十六年前遊獅子園己丑靣挹澄波背倚峯清遊䇿騎偶從容今來歲月寧殊昔獅吼園林本躍龍澗口野流㣲帶冷墀頭嘉䕃越加濃不堪仰首高空望雲白山青聳叠重恭奉皇太后遊獅子園獅園近非逺飬志奉來臨最是童遊處越生孺慕心花香知露重樹古得隂深歡喜承慈諭千秋例自今恭奉皇太后遊獅子園即景成什庚寅嫩暖輕寒逮小春是日立冬十月節山園咫尺稱去聲遊廵聖慈憶舊増歡豫興慶依前美奐輪雪積巖隂横鏤玉氷垂泉表直流銀鴒原本是樂羣地何事居然獨六旬㳟奉皇太后遊獅子園即景成什辛卯昨霄㣲雨曉来晴早協涓辰侍輦行路浄塵埃足底迅園生歡喜靣前迎溪聲過漲為音細花色當秋作意榮獻壽南山近可指萬年不盡共予情夏日遊獅子園壬辰獅子園無六里遙曉遊到亦不崇朝叠溪過雨聲雄澗峻嶺收雲朗徹霄一晌風涼生簟席四圍山色入松寮趨庭頓忘垂髫况五十年来白髪饒恭奉皇太后遊獅子園即景成什玉露金風爽仲秋獅園龍沼奉慈遊倪家圖畫誠小矣唐邸亭臯可匹不到處懿歡承繞膝此間孺慕境從頭六旬餘子八旬母往事奚稱潁蜀侯逰獅子園憶舊癸巳山莊仁祖豫逰陪此處獅園慈父開據座曼殊瞻即佛趨庭鯉也憶猶孩祇今避暑仍如昔有暇乗驄必一來五十餘年彈指頃碧峯依舊净無埃㳟奉皇太后逰獅子園石棧雲逵不藉尋邸居安輦奉來臨萬年恒侍慈顔豫此地益增孺慕心曲澗清音繞砌下雄峯翠影落庭隂御園疊石勞摹擬昨嵗於長春園隙地仿倪瓉獅子林之意叠石為假山構臺榭以肖之曾題詩以紀勝兹坐對獅峯不啻米芾臨書所謂眞者在前矣那及天然獅子林逰獅子園有作甲午布達拉西獅子峯普陀宗乗之廟在獅子園東是日瞻禮路便一逰畨語布達拉華言切音謂普陀譯之則靈鷲也舊園逰憩一從容青山萬古標靈鷲碧水當年起躍龍聞禮聞詩恩昔􅃡曰乾曰惕已今恭那辭雙鬢星星㸃祇㸔鱗蒼階下松㳟奉聖母逰獅子園甲午嵗嵗今朝奉豫廵近年來率以八月初十日奉聖母逰此並賜食欣陪賜食笑言申南山獻夀方當靣西母延禧自有神耳順年庚慕同孺秋中風日藹疑春膝前歡喜承恩諭恒例如斯訂約頻逰獅子園乙未邸園乗暇一逰廵山色波光若相入聲親説法門前舊獅子種松户外老龍鱗長上聲年偏憶少年事今日原同昔日人書室設還刮目待愧哉語著阿䝉眞㳟奉皇太后逰獅子園因成長句乙未厯嵗承歡秋仲天每嵗以八月初十日㳟奉聖母侍饍於此邸園賜食懿恩宣金風玉露景逾美山峙川流算益綿古柏不期覆簷茂塞花恒是繞階妍六齡始此學佔畢子六嵗時即隨皇考居此瞥眼光隂六十年逰獅子園丙申咫尺獅園路不遥言逰聊趂爽涼朝初來憶過六旬嵗憶予六齡時初隨六十皇考居此園忽忽不覺度年矣重到那堪七字消舞象忽殊彼綵服聞詩未異此松寮思量欲弗負期望惟有孜孜愼旰宵㳟奉聖母遊獅子園是日聖母賜食喜成長句誌事丙申賜食恒於嘉節前毎嵗俱於八月初十日㳟奉食於聖母幸獅子園逰覽並䝉賜此因十二以後即富於巻阿勝境奉聖母陳慶節宴賞也邸園陪豫渥恩宣幾曾昔日殊斯日却是今年非昨年愛景直思駐羲馭承歡永願奉雲軿舊藩新部齊隨扈成教都欣到漠堧獅子園襍詠丙申山色横嶺豎峯圖畫間今朝得句以幾閒當年庭訓叅崖畧書院分明號樂山園中有樂山書院皇祖所賜額也鐘聲魚静梵吟鯨發響招提原不住僧家七言成在一聲裏拙速寜須詡八义砌花春花以樹秋花草戍削丁星别有情漫惜能言鳥不下試聽根底露蛩聲庭樹作隊庭柯雙映堂秋中葉色已含霜魯卿猶自勤封植而我於斯可恝忘水月千江一印悟禪徒楊葉機鋒亦識乎設以片雲遮碧宇水中影亦費撈摸松風太古松應不計嵗九秋風入實生寒此聲此色公天下𢎞景高情量未寛鳥語婆娑塞樹對雲軒棲鳥何時不解言縱鮮紅花有紅葉迷離也不讓春園蛩音少小於斯觀彼鬬中年曾是賦其詩昔嘗作鬬蟋蟀長歌見樂善堂全集而今覺得都無味但一聞聲一惜時獅子園即事己亥北山一帶列精藍瞻禮便因邸籞探冬夏别兹忽經二嵗年計則已為三松隂竹籟撫如故月宇雲居歩尚諳向憶椿今萱並憶即斯景况對何堪獅子園疊丙申舊作韻己亥底事斯來廻異前靣增皴皺髪增宣居憂雖度憂縁境撫已惟慙已長年賜食依然㸔象席每嵗八月初十日㳟奉食於聖母幸獅子園逰覽並䝉賜此今邸園如舊而憶晨復至追慈豫難陪轉瞬三年兹昔時情事曷勝悲戚侍遊那再掖翬軿悲吟七字廣前韻埋恨千秋誌塞堧遊獅子園庚子邸園咫尺山莊北具體而微饒僻清是日輕輿一尋勝無端舊蹟毎牽情漫參貝葉經中句不異金閶書裏行謂倪瓉獅子林今春駐蘇州曾一遊設以獅峯近相較園外南山獅子峯與園正相對以此得名贏他假藉祗𫝊名遊獅子園辛丑獅子峯隂居賜昔額題仍是御毫揮有懐因便為一豫無逸敢皇懈萬㡬頻問郵籖心不懌閏五月廿三日據阿桂奏十五日大舉攻勦將賊匪卡子四座攻得復乗賊散回攻得賊人大卡殱戮賊匪甚多隨於左近四靣拏卡聨絡接應海蘭察將明亮等即帶兵駐守次日天明又佔得兩處山包並賊營迤西本布爾廟燒燬殺賊甚多現在官兵接連佔至黄河邊兩岸俱有兵丁水手防範賊勢窮蹙不日可勦除净盡等語今又隔數日惟晝夜盼望㨗音耳忍㸔畫障景如依詩成數首旋歸去行漏曾非四刻違遊獅子園壬寅六嵗時初來此居予自六嵗時初隨十餘皇考居此園計今六年何當七十二還餘老年偏憶少年事今日仍猶昔日予内聖外王學瞠若祖功宗德任肩諸獅園敬仰前題額園名賜額皇祖御筆也重搆獅林學恧如近肖倪瓉呉中獅子林於山莊并倣其圖弆之樂山書院丁亥舊蹟園林在承歡事可稽當時曾賜額樂山書院辛卯年賜皇祖額也此日重去聲瞻題􅆟愜仁之樂從知静者倪問堂成久近年與我同齊樂山書院戊子額是堯年賜堂猶舜日臨樂山仁者静自昔訓於今涼籟下喬樹晴光蕩逺岑片時鳴蹕返無那欲留心樂山書院己丑書齋懸賜額每至仰奎光忩納峯還嶺畫過平聲倪與黄朝煙纔欲泮秋樹未全蒼仁者樂山趣體仁垂訓長樂山書院壬辰書院廻溪上當年賜額顔宸章厯三代眞畫納千山樂可占仁德遊惟值政閒那無會心處家法在斯間樂山書院有會癸巳勲華家法賜臨池題額於斯因惠之即景樂山惟趣永寓言愛物要仁施孰非訓也今猶昔豈外復哉克以為字裏行間皆至道尊聞仍貴在行知樂山書院甲午書院依然在樂山題柍桭放勲親賜額尼父昔詮仁雨後峯姿濯風前林態皴偶憑堪體驗欲去且逡廵樂山書院乙未階前渌溪繞忩外好山羅書院厯年古幾閒此日過樂思仁者静修擬石之磨不必縹緗展幽研資益多樂山書院丙申書院皇考成額名皇祖賜孫臣今日來敢懈繼繩志爾時多伯叔問誰能此類以此益勉旃恐負心傳意為君止於仁樂山仁之事樂山書院己亥重來書院坐兩字樂山標毎覩堯文麗便思孔語昭聖功明以示王道豈其遥鑚仰夫誰事末由徒自焦樂山書院辛丑樂山意豈在山也當日趨庭景逼眞問禮問詩都且置為君􅃡示止於仁題樂山書院壬寅樂山仁者事山以静為德静亦仁之端三一一三即仁静存乎心山實為境域心境更非二渾一在己克樂豈繫峯林五言識規則䕶雲莊戊子靈山解出雲雲出山還蔵韓愈有佳文其意頗可方巖居雖不多高下如仙莊寫楹挹靉靅帶几霑衣裳觀雲似圖畫對雲成詩章西成兹已定晴雨胥無妨斂忽一空碧變却萬頃黄䕶雲莊己丑浄歛天衣一片無村莊近逺眼前俱腰䥥銍艾黄雲遍即此寜非䕶者乎䕶雲莊癸巳夏雲正作竒峯際峯䕶莊如雲䕶莊恰目滃濛岰㠡入不因分别見眞常䕶雲莊甲午夏山能出雲雲出山還䕶莊在萬山中䕶雲此其故容容幻高低靄靄紛布濩膏澤旣已霑繼霑豈辭屢分明㸃筆處廻望失歸路䕶雲莊有會乙未名山能出雲雲出仍䕶山莊塢倚山搆䕶雲莊則然譬之君愛民民亦親君焉相資相得彰是理本易詮彼其秦越視如浮雲蔽天有會因成謡此謡非等閒䕶雲莊丙申雲䕶及䕶雲一二二而一從龍雲龍從昌黎言豈失負山構雲莊三楹架書室容容與為入英英與為出安得無事坐其理探精宻䕶雲莊己亥偶步䕶雲莊雲無朗霽光雖非望霖際頗覺值晴長夏日方騰赫巖風忽似藏何當名副實一雨變新涼䕶雲莊口號庚子屈指雨過十餘日炎風暑氣熾如熏雖非亟望然需澤自二十一日雨後晴霄十餘日山田又不免待澤矣分付巖莊莫䕶雲謂莫䕶而不使出為雨也草房丁亥草堂棲碧岑樸構稱去聲山林蕭緯仰如在茅茨示到今秋風來席颯日影入簾深小坐旋言去惟留五字吟草房戊子豈乏樓臺高下披草房乃覺與山宜翻書恰得嘉樹傳昔日今朝有所思草房己丑草房據崥崹四面羅巖谷昔非寓茅茨今實勝華屋軒庭俯空濶暢可縱遥目不遑曰怡情惟是思敦樸草房壬辰巖屋三間號草房樸敦儉示訓垂長偶來却愧茨茅者嵐靄恒斯納景光草房癸巳黄州竹樓記重覆得廿稔草更脆於竹五十餘年審盖因易以瓦而草名猶恁愛生忩前觀示儉階際品流水與行雲時光共苒荏草房瓦屋依舊草房名楣梠樸淳筆研清新構御園斯數典今熙春園􅈽樸草堂之旁可構草房盖取法於此承先示儉總闗情草房乙未雖非土階􅓏歩登誅茅自昔草房稱漫疑㸃綴增巖景哀伯還云清廟曾草房丙申應匪茨茅當日心我綴景皇考於潛邸時建此草房無過尚樸原無茅茨土階之想也誰知階土訓垂今草堂抱樸御園搆丁亥年於圓明園搆草堂名之曰抱樸實數典自此鼻祖却從此處尋草房己亥不敢輕因易瓦為依然三架以茅茨閒庭小立餘深思黄屋非堯志早垂草房辛丑房草猶然示儉垂閒庭到惜去遲遲量包四海三間屋寜渠茅簷學樂飢草房壬寅巖房猶自號誅茅筮得天山上九爻却憶窮簷多凍餒憂同饑溺那能抛松柏室丁亥名室以松柏收㡡惟縹緗觸懐每生慕憶昔􅄼能忘石古苔痕重山秋樹色涼喬柯無改度倚巘鎮蒼蒼松柏室戊子兩樹嘉隂滿院披吟風垂露景凄其誰知松柏逾拱把却憶同予共長時松柏室己丑謖籟悠然户外𫝊童童階際碧叅天種時伯仲清暉閣圓明園清暉閣前松遭回禄曽有喬松歎之作却以山中養大年松柏室辛卯庭前植雙樹一柏一蒼松形作龍鱗老影蟠虬盖重春秋閱年度朝暮伴雲封擬欲諮詩禮徘徊竟莫從松柏室壬辰庭前松柏翠深沉一陣涼風滿院隂對峙於斯恒落落感懐那識不言心松柏室癸巳峙松種柏昔時意仰漢瞻雲此日心五十年前景如昨欲抛悲緒不能禁松柏室甲午東溝書室更清竒棧道溪橋厯訪之柏翠松青鎭如是翹瞻霄漢引清悲松柏室乙未獅子園來此必來聞詩聞禮望悠哉階前松柏森森老同我髫年培植材松柏室丙申松柏雖異種性同節並堅强晳邑中黔不害皆為賢鬱鬱植庭際童童䕃簷前可識聖人意如讀高士篇山楓及谷柳於汝何有焉松柏室己亥一柏恒㸔對一松交枝佈葉翠隂濃元方之側季方立餘者其間可漫容松柏室口號辛丑庭間不種其他樹足識當年育物心六十餘年貽手澤試㸔滿院佈嘉隂松柏室壬寅松是向長柏禽慶分明異姓弟和兄笑他五嶽名山到謂向禽玉塞獅峯可識名妙高堂辛酉虚堂搆峯巓樷樾羊腸繞平臨出岫雲俯視歸林鳥百里如目前溪壑殊了了庭饒白鹿遊塵借清風掃我來已深秋萬木丹黄老身依泉石間興寄煙霞表妙高堂丁亥逈臨已是高無二俯視還欣妙入虚我亦金山撫蘇蹟金山有蘇東坡題妙高臺壤霄􅄼更較何如妙高堂壬辰園裏有山此最高奎章興擬大蘇豪易金何必招提建留帶還嫌名象操雲外一峯現獅吼風前萬樹捲松濤兩言意永奚煩綴繹詠徒勞首重去聲搔妙高堂癸巳園内斯堂逈騁眸萬景開林巒供俯照霄漢與平陪碧海分明是金山仿彿猜妙高誠在此玉局小乎哉妙高堂甲午妙高所以妙高處更誰同萬景無遁象太虚有不空不空之空出梵典身將心共適機與物皆融奮迅蹲獅子如聞善吼雄妙高堂乙未園内㝡高處諸峯莫與齊直臨半空白俯暢一川低顥氣堪平吸浮邱可右擕是宜諸慮浄憶舊每悽兮妙高堂丙申堂名肖浮玉所異山與水俯視林海翻鯨波豈殊此詎必舳艫泛時有烟雲起乃知奎章垂額名筆書皇祖御賜初非出虚擬欲喚彼東坡斟酌其間理妙高堂己亥不到凡塵處惟應顥氣俱近山都拜下一室若棲無觀妙寜須李稱高欲笑蘇明春伏牛上試與問同殊妙高堂叠去嵗韻庚子散懐一峯逈入望四鄰俱山色今原古雲容有若無畧同徃雉兎豈必禁樵蘇昨甫登浮玉澄觀了不殊妙高堂辛丑園内最高山每來必陟攀人間塵不到松下鶴常還禪悦􅃡隨喜昔年即取皇考喜開示禪理妙高東坡金山之意云今題怡昔顔東坡造初地不擬透重關妙高堂壬寅高言山之體妙言山之用體固逈出羣用亦堪娯衆出羣自静標娯衆在清供體用本互資清静原相共設非澄懐對率難契幽綜忘言館入齋極幽僻開牖對崚嶒葉有紅相緑雲時散復凝隠非學顔闔嘯似聽孫登合此蠲諸慮忘言得未能忘言館辛丑巖館最深處林巒互吐呑静當冺外務悦可駐高奔讓棗無存弟少時於此比肩者為和親王後以此園賜果親王居之今皆早棄世矣含飴有弄孫觸懐偏憶舊夫那得忘言忘言館壬寅書館稱樸不稱華小斲三間而已矣背峙翠屏嶻嶭山靣樸素帶清泠水智仁合撰趋有餘放彌巻退妙無已曰合忘言未易忘舊詠新題紛視此法林寺戱題辛酉書齋禪室杳然清午静時聞鐘磬聲此日經過重想像當年佔􅖶一儒生秋水澗戊子小堂跨澗臨崔嵬名之秋水意悠哉莫訝涸壑無曲注欲㸔潺湲雨後來澄懐堂戊子書堂搆東崦曲徑窈而深昔日澄懐處今朝想像臨幾曾窺理窟藉此見天心小立渾忘去松風颯滿襟待月亭口號壬寅遊山馳驛屢吟詩余於遊覽寓意不留尹繼善嘗有馳驛觀山之喻向曾屢詠及之寓意不留語素知小坐須行消半刻㡬曾巖月待於斯賦得片雲舒巻辛卯片雲飛作影西東四字題楣寓意崇當日蕭閒樂無盡後時糺縵藴其中即㸔出岫舒還巻依舊寫楹散復籠一嵗獅峯遊一度去來不繋或堪同欽定熱河志巻四十二
