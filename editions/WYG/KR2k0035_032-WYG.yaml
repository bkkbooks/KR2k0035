body:
  text: 行宫八蘋香沜萬樹園試馬埭嘉樹軒樂成閣宿雲簷澄觀齋翠雲巖罨畫牕蘋香沜萬樹園之東南湖水分流出依緑齋後一鑑澄澈中多青蘋茸淺蔚每微風乍起清香襲人水濱殿三楹南向聖祖御題曰蘋香沜昔輞川有茱萸沜裴迪詩云飄香亂椒桂布葉間檀欒伏讀御製香風緑波之句迪所見猶隔一塵恭誦再三覺詠言有餘馨也御製詩蘋香沜甲戊度橋而北迴望烟水淼瀰碧藻青蘋溶漾可數涼風微度袖拂餘馨何必芳洲杜若香風搖蕩緑波涵花正芳時伏數三詞客闗山月休怨來看塞北有江南萬樹園北倚山南臨湖其中平原數千畆御書碣曰萬樹園不樊不垣嘉木羅植成菌列幕者不可指數自西師蕆役功成錫宴觀燈馬伎咸在茲園御製山莊燈詞備紀其盛園中萬樹擬之南山有桑北山有楊云御製詩萬樹園甲戌北枕雙峯之南平原徑數千餘畆灌樹成帷幄緑草鋪茵毯雖以園名不施土木今年都爾伯特部長入覲即園中張穹幕集名藩錫燕燒燈陳馬伎火戯燕樂之為時盛事原田每每曽聞傳麀鹿麌麌載詠詩秀木佳隂塵不到乘涼㸃筆合於詩試馬埭萬樹園西南草柔地曠馳道如弦大駕巡幸於此考牧焉御書題碣曰試馬埭國家攷牧之法逺軼前制孶息繁庶雲錦成羣時惟秋也萬騎齊陳騰驤沛艾顧盼矜雄逺至哈薩克拔達克諸部並貢天閑服皂乘黄實彰瑞應以視騋牝駉牡歌風獻頌盖逺過之矣御製詩試馬埭甲戊我朝馬政超越往代每當秋獮出塞考牧别羣相其駑駿而調試之故知金埒編錢直是兒戯試馬榆隂錦埭平流珠歕玉祇虚名驪黄牝牡皆形相九方臯相馬在牝牡之外然馬必騙而後得良牝牡皆不適用此盖列子假藉之詞騏驥惟當識性情嘉樹軒園東老樹輪園垂䕃數十畆皆百年前物因樹為軒凡三楹南嚮御題曰嘉樹軒秀木清䕃長榮永鬯顔以嘉樹取左氏傳語也山莊為聖祖豫遊所憩一草一木咸沾天澤祚棫斯拔松栢斯兌我皇上敬承祖徳封殖無忘攬筆命篇會心觸目如見堯年寳露於枝葉間也御製詩嘉樹軒癸酉搆軒就嘉樹樹已百年餘蔚然軒亦古秀䕃籠庭除既因悟所託寧云懷厥居牕户碧紗圓常延月入虚嘉樹軒甲戌萬樹園之東檜栝蔚蔥老幹蟉枝童童垂䕃搆軒其下取無忘封殖之義就樹搆軒隂易得軒前種樹待隂遲因知事半功惟倍契理皆然詎止斯嘉樹軒丙子落葉蕭蕭下廣除甌香研浄一相於雖然秀木嘉隂斂贏得横斜牕影疎嘉樹軒己邜建木非南北大椿是弟兄就隂軒剏造擷秀句因成朔地自今古塞天忘槁榮輪囷覺私幸未冐漢唐名嘉樹軒庚辰就樹開軒䕃緑雲堯年寳露葉間紛設方武子甘棠賦我亦寧忘封殖勤嘉樹軒辛巳一樹當軒翠鬱森搆成樸斵就嘉隂因知事半功常倍理趣逢源總可尋嘉樹軒壬午就樹昔年搆清秋勝日尋輪囷一株古蔽芾滿庭隂有月皆澄照無風亦朗吟何當風月下恒此坐觀心嘉樹軒癸未搆軒傍樹得嘉隂意在延涼徑每尋名教中何非樂地逢源頗亦藉資深嘉樹軒甲申就樹搆虛軒樹古軒亦然就軒將種樹樹長知何年事半得功倍規摩貴通權塞風未振落緑隂猶團團偶來坐匡牀爽氣澄秋鮮觸目有會心攬筆命蕐篇嘉樹軒丙申樹以千年計軒惟十笏餘金風吹籟古素月透雲虚荒略傳曽孰森蕭賞偶予長上聲於季氏者宣子那容譽樂成閣嘉樹軒之上重閣五楹一重額曰開襟霄漢再重額曰樂成閣皆御書塞田逺近崇墉比櫛皇上厪念民依課雨占晴悉闗霄旰當夫禾稼備登千塍露積每臨天矚顧而樂之黄童白叟慶塞豐而酬力穡洵乎遹駿有聲遹觀厥成者焉御製詩樂成閣塞田晚播早收屆白露即已銍艾登場正秋巡行獮期也閣踞城牆壠畆參差黄雲彌望三時憂憫於斯稍慰近逺山田一望彌秋巡恒值樂成時璇題寳篆垂眀訓稼穡艱難尚可知樂成閣庚辰樂成真樂成如坻復如京納稼千村喜輸公百畆輕勤農茲示度析嵗敢誇盈古有言民者亦誠曲盡情題樂成閣辛巳巍閣芳園萬樹旁逺吞山靄俯宫牆一溪熱水今還昔温泉過中闗合武列水經山莊東南入灤河熱河得名以此四野平川耕與桒每慶塞豐酬力穡亦開鎬宴惠來王五年籌筆拓疆萬成武庶㡬樂未遑樂成閣壬午因迥得為高城樓縱目遨錘峯陵碧漢列水捲寒濤如仕銀蟾界堪揮顧兔豪秋成纔半熟不樂首頻搔題樂成閣癸未傑閣翬飛枕繚垣山田穡事攬層軒芃芃佳矣西成逺先節由來戒滿言樂成閣甲申村村比櫛更崇墉攬景城樓喜動容今嵗秋成真可樂又聞糓賤歎傷農樂成閣丙申樂成雖是額檐楣艱致西成樂屢綏歴夏至秋計以日曰𤾉與雨幸惟時敢因覩近而忘逺今嵗各省雨𤾉時若可望有秋督撫等豫報收成分數俱在九分以上惟甘肅臯籣等廿九州縣夏間被旱四川打箭爐七月中猝被山水衝損城垣官廨湖南永興來陽二縣六月内山水􅈝發傷及民居雖皆一隅偏災並飭大吏率屬加意撫䘏母使失所自審何修以遇斯更早武功奏耆定持盈祇益勵謙寅宿雲簷宫城東北隅山盡處當惠迪吉門因勢高敞搆平臺以攬勝曰宿雲簷南向聯曰雲容自在舒還卷山色何妨有若無又曰牕含逺景正無盡筆㸃諸峯自有神皆皇上御筆雲氣往來若宿巖際縈紆繚繞時出層簷如王維詩云不知洞裏雲去作人間雨者也御製詩宿雲簷癸酉寫楹纔見一絲鋪近巘遙巒乍有無五里張公真小矣千年米老尚存乎衣衫常慮霑霉潤步武偏教繞徑紆何必虞臣進歌頌山莊攬結作清娱宿雲簷甲戊平臺因逈為高逺峙雲表滃溹朝飛奇峯四起暝歸擁樹縈繚簷端即景命名正山中所有也出楹寫霧還歸宿薈蔚常看顥氣通却訝稚圭非至此如何先獲我心同宿雲簷丙子昨日晴明今日雨烟絲風片霏林楚珠簾捲不去溟濛宿雲妙趣參爾許妙趣宿雲匪今夫朅來欣遇謂向無世間萬事率如此不為去聲物轉其誰乎宿雲簷丁丑蔚若真猶幻悠然散復凝白雲應笑我常宿此何曽宿雲簷庚辰山房倚翠巖簷虚雲每寄氣霽景澄候豐隆早收技偶來坐清畫聊結氤氲意如將霏六花謝賦還能試宿雲簷口號癸未翠雲巖畔宿雲簷雲假雲真兩不嫌我却何曽來一宿空尋名象屢吟拈宿雲簷秋來天淡與雲閒那見英英宿棟間却為晩田猶待澤思量膚寸爾何慳題宿雲簷甲申時零夜雨便朝晴於潤於暄總愜情似此宿雲真大當既叨實惠任循名宿雲簷乙酉最欣秋霽敞山扉一縷天邉去若飛莫謂英英曽不見據􅇃猶覺潤沾衣宿雲簷丁亥天畔閒雲去若飛何曽簷際有雲歸邇來雨不雨皆可消得崇情閲化機宿雲簷口號乙亥秋日何宜宜快晴高標羲御曝光晶憑牕滿野西成近分付雲簷漫副名澄觀齋宫城東北殿五楹西南曰惠迪吉聖祖御書其前檐額曰澄觀齋則皇上御書當暖澑暄波之北山莊諸水入焉綠波翠色於此交滙聖祖臨駐山莊召儒臣於齋内較閲御纂諸書皇上㡬暇臨觀吟咏所形寫天心而符道筦澄觀之時義大矣御製詩題澄觀齋癸酉過水尋幽逕依巖搆逈齋常教鶴守户時下鹿書牌翰墨香為侣琴尊静者諧澄懐觀道妙益覺此間佳澄觀齋甲戌山莊林巒水石在在仙都嵐翠波光逺近交暎炎歊為之盡滌足令胸次灑然豈唯騁懷遊目背山臨水搆清齋翠䕃簷端綠繞階别裁去聲不期句成逈閒居每致意為佳澄觀齋丙子雲軒據水源月牖含巖壁潦盡鳴峽寒葉落歸根寂何必懷菁蔥於焉識闔闢少憶堯年不殊讀周易澄觀齋對雨丁丑㡬架倚崚􅜤出塵秀絶勝衆觀呈静會吾意與秋澄細雨歇還落殢雲散更凝所欣滋晩稼無礙峭凉増題澄觀齋戊寅萬物到秋澄斯齋獨擅稱天高雲影淡樹疊籟聲層緑牖虛延爽玉壺都是冰從來宜此句拈出向何曽澄觀齋諸峯嶊崣錦開軒一水潺湲玉映門入畫林泉真恰當迎人松菊喜猶存尋常物態皆含理妙合天倪欲忘去聲言寳額重瞻惠迪吉聖人眀示此探源齋内有山莊皇祖題額惠迪吉三字又是處據諸水上流故末句及之題澄觀齋己夘面勢得巖齋曠朗宜延佇雲山叅動静圖書鑑今古六情不期澄於何識茹吐著句亦偶然聊因壁空去聲補澄觀齋庚辰人號齋云澄齋亦澄人意乃知心與境非一而非二綠水復蒼山自是饒静致颯然風滿牕秋空快新霽未可便忘言毫素摛遐思澄觀齋觀乃人之能澄亦境之所能所兩相忘澄觀實緒語其忘如未臻佳境允宜處譬彼莊嶽間不期齊變楚澄觀齋辛巳緑水階前帶翠岩簷後屏虚齋信生白秋樹尚餘青鹿跡留沙軟鶴聲警露泠澄觀觀底事色色復形形澄觀齋壬午山莊小駐盤秋仲又將闌此地非常地澄觀果足觀歸根紛葉落結露報霜寒指日重陽到黄花開繞欄題澄觀齋癸未山莊到五日今日始來齋本是無多暇難言每暢懷種松高出屋留草緑侵階觀物思澄理欣惟與静皆澄觀齋甲申萬物到秋澄巖齋名獨稱水清必見底雲歛若無眀目不礙空寄心惟與静凝覔觀竟難得何處問南能澄觀齋即景乙酉宅據水源處牕臨壁峭間無心不與静有句必稱閒草露蛩鳴脇林秋鹿過斑逺山朝雨霽新漲到潺湲澄觀齋老屋九秋静虚軒四望通峯高照日紫葉落積階紅霜重溪波澈雲輕天宇空澄觀聖無迹櫽括纂書中康熙年間纂諸皇祖日與儒臣校閱御書皆於此齋召見澄觀齋丙戌階坦弗勞登牕虛恰可憑長空白㵳泬背壁翠崚嶒樹静籟無作溪恬波不興諦觀景與物畢竟是心澄題澄觀齋丁亥不亟到林廬到斯心意舒懸崖雲向翠後倚翠雲巖也皇祖御題落澗潦全祛借曰澄今習吾寧觀古初桂蕐放清馥聞復翳根除澄觀齋曲水門前面層山齋後頭適當九秋對不著一塵留㳫嶂鳴蒼鹿野灘下白鷗澄觀觀既静以待萬㡬酬題澄觀齋戊子一水門前帶書齋倚碧崚因遙弗恒到偶至了宜憑錦繡開雲慣鼪鼯織樹能止觀雖未得觀則不期澄澄觀齋己丑砟硌後張屏瀎潏前拖帶山莊景最清斯乃清之最八百眼功徳三千心世界曰澄澄底事是觀觀自在奚必更著言於焉以神會澄觀齋辛夘氣寒因地迴雲歛覺天寛寥泬廓眼界虛眀契性湍瑤林猶纈緑錦壁漸含丹觀至澄觀處無澄那有觀澄觀齋六韻壬辰灑落書堂迴山莊東北隅背峯標嶻薛面水帶縈紆緬想憩仁聖於斯集宿儒通習皇祖昔駐山莊時常集儒臣等之算法者於此編輯數理精藴一書行天親為指授釐定鏤版頒下萬世得永奉尺程天文親攷騐數理晰精麤敬授萬方典恢宏百世模政常猶竭蹶景仰秪瞠乎題澄觀齋癸巳心與物皆澄書堂觀恰應足令忘芥蔕那更較淄澠潦盡潭呈底林稀峯露層三言惠廸吉堂顔惠廸吉三字皇祖御筆也舉要示雲礽澄觀齋甲午巖齋北門裏出入憩猶應有會莫非静無觀不與澄瑤圖披下界奎畫泐高層往往逢前蹟孜孜勉後承澄觀齋乙未目之官為觀心之官則思觀以外物引思因内㡬馳外物静可拒内㡬動不時内實要於外曰澄乃無為其觀亦自息精一有訓辭澄觀齋丙申因至澄觀齋深繹澄觀義澄實近無為觀乃鄰有事修巳以治人安民與察吏何弗藉乎觀那盡澄而置然羲傳有言百慮原一致有事處無為聊因存此意澄觀齋己亥渡河稼事細周看返轡園門倚碧巒本少奏章待批理遂教齋閣試盤桓偶從舊作重檢㸃頓濶流光四燠寒兩嵗有憂並無樂一時即景付澄觀澄觀齋有會庚子於物觀為所於我觀為能能所俱鄰妄祛妄要在澄澄觀忘物我其妄亦弗興詎祇教外𫝊明道識此曽動定静亦定復性斯可徴題澄觀齋辛丑山莊駐月餘岩齋乃初閲一以㡬少暇一以遊怯熱坐亦如昨日那覺隔年别翠壁隂佈長清溪流已潔金風落林端颯爽真可悦萬物對澄觀于秋更親切澄觀齋壬寅設曰觀為能則澄應是所即如我與物相資如律吕言同尚勿當言異更不可在我曰觀物在物曰澄我叶物我兩忘時澄觀誠緒語翠雲巖澄觀齋之後敞亭一皇祖御題曰翠雲巖晨霞暮靄絢紫霏青巖巒交複雲氣特多我皇上崇情所寄真機妙㫖精契知仁亭後摩崖勒聖祖御書大字曰雲巖雲章糺縵煥乎天文㐲誦聖製動豈我知静豈我為明月今夕流水昔時之句始覺化工賦物非人間筆墨所能窺也聖祖御製詩雲巖丙集三庚不用碧筩酒九井何貪消暑珠自有雲峯來澍雨巉巖風颯到茅廬御製詩雲巖歌甲戌雲之巖巖生雲霮䨴氤復氲巖之雲雲籠巖嶾嶙􅏭嶭崿且嵁巖為體兮雲為衣雲中君兮憺翠微雲為輿兮巖為盖巖之仙兮頺如醉芳有時而春韶翠有時而秋消閲菀枯兮四序含動静兮終古動豈我知静豈我為明月今夕流水昔時翠雲巖山莊東北多重巒複嶺遊雲往來嵐翠欲滴虚簷四眺正在千巖萬壑中嶻嶭横拖一縷斜濃青細白蔚槎枒有形變態無形韻粉本真堪示畫家翠雲巖乙亥英英今日吐來稀借問雲閒是也非莫謂羃巖滃蔚少丹青片片剪天衣翠雲巖戊寅虛榭三間面􅆆峯交枝薈蔚葉丰茸雖然已是雲閒候却看氤氲翠上濃千尋石壁聳嶔嵜拖地眉毛能爾為若向是間知悟處翠雲還笑宋雲癡翠雲巖己夘絶壁崔巍實壯哉清秋又此索吟來若無雲氣為浮盪安識剛柔萬變賅翠雲巖庚辰昨夜密雨今朝霽秋雲歛盡無留形只有翠巖越蓊蔚配藜靉靆標濃青戱題翠雲巖辛巳疊葉堆枝互簇攢端知飛翠勝流丹昨來殊厭觀雲矣却是巖前不厭觀翠雲巖壬午纈緑霏青看已久新紅渲染訝誰加背西斜日輝平野翻壁忽成一片霞翠雲巖癸未葉姿枝態鎖層峯織翠流青色正濃習習天風拂巖落人間煩暑覔何從翠雲巖口號甲申曰已雲閒亦有雲緑縈青邏尚縝紛數聲山鳥非絲竹疑是八琅空際聞翠雲巖乙酉㡬層疊嶂薈氛氲一翠連天望若雲聖藻千秋同糺縵曰予何有解尊聞翠雲巖丙戌秀巖拱千仞一色翠菁葱可望那可陟作雲還作風不期身自爽最與意相融更有誰堪匹惟應付碧空翠雲巖丁亥出岫去還浮斯雲巖鎮留濃青思舊色疊翠亦新流漫擬立冬到行將活畫収驪珠光兩顆巖上泐雲兩皇祖御書翠字恒此照千秋翠雲巖戊子峭壁峥嶸早得隂前庭樹影復蕭森坐來已是秋光滿更落天風萬籟吟翠雲巖己丑重重翠鎖髻螺紋不斷清香撲鼻聞風拂露蕐紛墜雨是容容者豈非雲翠雲巖辛夘雖覺菁蔥翠尚鮮層雲意漸向紅偏昨年已是孤題句未可今秋更置然去嵗以過中秋始來山莊駐蹕日少此處未經題句林岑風拂互低昻日日輕雲作䕶霜此意分明具神解畫工應惜緑琳瑯翠雲巖壬辰刻削雲巖濯翠螺翻風葉墜露珠多欲知閲世為乆近題壁宸章隱薜蘿敞榭無牕虛受峯不雲亦自翠容容偶遊適可結清想那擬佺期驀地逢翠雲巖二首癸巳滿壁緑瓊鋪斐萋祗能騁望不能躋邇來率懶吟雲字今日聊因一翠題蒼岩日照閃光晶颯颯冷冷忽有聲拈筆不須著文賦歐陽先我盡其情翠雲巖甲午葉縟枝撐不計層翹瞻渾似緑雲興忽逢蒼鹿其間卧借問可殊面壁僧八伯何曽見此雲不為糺縵祇氤氲大沖今日難成句峭蒨菁蔥兩莫分翠雲巖乙未菁蔥總不分是巖氣抑是雲雰嗣宗迷目艱青白一翠連天迴莫羣四大家難著筆成雲興無礙碧天晴全身裏許翠巖現那更眉毛示永明翠雲巖丙申澄觀齋後翠雲巖每到山莊題句咸多以少増檐勒滿雄因健積境超凡色不可圖權曰翠形難為狀假名雲天風翻下千尋壁中有八音六律聞翠雲巖己亥石態樹姿無不奇夏過秋到得詩遲箇中意倩何人解七字恐難畢肖之林之始豈有雲稱曰翠更隣蛇足増却是崇巖不分别饒他茈虒䕶崚嶒翠雲巖庚子謂翠原非雲所知而雲忽有翠稱奇却於林葉無交渉稱謂形容定始誰白雲為主翠為賔白自翠流翻似鄰試問居停屬誰是層巖無語只嶙峋翠雲巖辛丑石壁􅣯閜砢扶詩難著語畫難圖翠其色也真還幻雲彼形乎有若無太古以來原有此所遇一時信佳矣而此不容擬議間笑我歴年吟未已翠雲巖壬寅層巖有樹樹如雲生翠誰為㸃染紛石自不知林自若安名立字任云云實以為虛有若無何曽定相去聲許人摹箇中如有君稱者傳號應從楚左徒罨畫牕自青楓綠嶼折而東曲室􅆼深疎櫺洞啟皇上御題額曰罨畫牕高據山椒峭壁斗削牕嵌其巔峯嶺林泉咸在几席昔名畫家王維山水論李成山水訣郭熙山水訓於渲皴濃淡闡發靡遺似此隂晴旦暮殊態異觀殆非卷軸煙雲所能彷彿焉矣御製詩罨畫牕癸酉下臨無地一牕虛帶水屏山攬結餘最愛錘峯剛對坐羲皇前物起吟予罨畫牕横嶺如曲屏霞標一室據其勝前為平臺牕列逺岫題曰罨畫董巨荆闗誰能辦此霞標雲閣小延停異草仙葩撲鼻馨凉峭塞天初過雨近峯逺嶺總來青罨畫牕丙子寒林古木翠微間積素依稀皴逺山設問畫家應去聲誰氏所披彷彿似荆闗罨畫牕戊寅室據山高來不頻偶來便爾暢心神一天秋景雲牕外大似王蒙荷葉皴見説佳山是真畫或稱佳畫即真山世情定論曽誰是我亦疑黂於此間題畫牕己夘高處霞標小憩居錘峯濡水俯臨餘㡬櫺紗牖誰為畫十笏山房恰受虛生色丹青是楓槲有情活潑在禽魚賦詩何必多思歇其奈當前每起予罨畫牕庚辰近嶺遙峯面面呈㟏岈瀟落最多情今朝所會又殊特直展寒林閲李成石渠實笈有李成寒林圖罨畫牕癸未濃青濕翠羅孱顔生動氣韻虛牕間四時展畫各殊致今朝直掲高房山到處題名厯可數圓明園玉泉山及塔灣行官皆有此名納奇觀此為鼻祖漢唐真蹟已莫覩况是丹青遺太古罨畫牕甲申凌虛書屋枕崇巒畫意當牕無盡觀今日居然欣剏見岧嶤穹塔緑雲端罨畫牕乙酉㡬盤雲逕萬峯晴小閣凌虛暢逺情今日憑牕真是喜一川多稼報秋成罨畫牕壬辰牕稱罨畫罨何畫不是倪黄非范王便被四家真蹟展未能含照朗斜陽罨畫牕癸巳山田千畆又逢豐聖藻當年聨語同千畆山田待嵗豐語也皇祖山莊中所題聨俯以石渠畫展馬馬和之詩經圖入石渠寳笈辨為真蹟合弆學詩堂者凡十二卷豳風圖在焉移來塞外此豳風罨畫牕爓爓平川夕照斜開牕林巘納無遮將軍金碧倪黄韻所喜不名其一家罨畫牕㸃砌葉多林漸空箇閒活景畫難工却饒無盡烟雲意收入憑忩黙會中罨畫牕庚子肩輿􅧧迤入霞標書室東廊接小寮牕俯林巒活畫意問誰黄范得能描罨畫牕辛丑春風秋月景非同朝靄夕嵐畫豈工四扇蜃窗隨分納清供眺詠興無窮欽定熱河志卷三十二
