  text: 寺廟六天靈寺在青雲山距天平寺東五里今存舊址禪林寺在青雲山距天平寺西五里今存舊址静安寺在大寧故城南十家兒村遼咸雍間蘭陵郡蕭夫人建碑字漫漶不可讀寺址尚存資聖院金劉子初靈峰院千佛洞碑稱靈峰院遭兵火後於皇統辛酉歲請中京資聖院僧遵説嗣興之遼中京大定府至金為北京皇統時尚未改故碑文仍稱中京也院當與大寧故城相近今遺址無考會禪寺金趙秉文有重九登會禪寺冷翠軒詩云明朝却望登眺處城中惟見白雲封知此寺當在大寧故城外今遺址無考大定府文廟元一統志曰宣聖廟在大定府東南隅虎臣坊謹按遼金之大定府即元大寧路今八溝東北有大寧故城凡大定府諸寺廟當在八溝東北境今屬赤峰縣玉清觀元一統志玉清觀在大定府東南隅致用坊遼統和二年建興聖寺元一統志興聖寺在大定府致用坊金明昌六年建頭陀禪院元一統志頭陀禪院即永安禪院在大定府致用坊萬頭陀所建翰林學士李磐撰碑圓宗寺元一統志圓宗寺在大定府東北隅豐實坊遼統和二年建華陽宫元一統志華陽宫在大定府豐實坊遼統和二年建感聖寺元一統志感聖寺在大定府豐實坊有佛舎利塔遼統和四年建咸聖寺元一統志咸聖寺在大定府豐實坊有甎塔金皇統二年建崇寶寺元一統志崇寶寺在大定府豐實坊金皇統二年建太子寺元一統志太子寺在大定府豐實坊金貞元二年建楞嚴寺元一統志楞嚴寺在大定府豐實坊金大定二年建大覺禪寺元一統志大覺禪寺在大定府豐實坊金大定二年建翰林學士鄭子􅔶撰碑䕶國寺元一統志䕶國寺在大定府豐實坊金泰和元年建三皇廟元一統志三皇廟在大定府西南隅貨遷坊報聖寺元一統志報聖寺在大定府貨遷坊遼統和八年建五嶽觀元一統志五嶽觀在大定府西南隅利通坊浄安寺元一統志浄安寺在大定府利通坊金皇統八年建城隍廟元一統志城隍廟在大定府西北隅世恩坊甲申歲建崔府君廟元一統志崔府君廟在大定府世恩坊甲申歳建東嶽廟元一統志東嶽廟在大定府世恩坊丁酉嵗建白鶴宫元一統志白鶴宫在大定府世恩坊庚子歳建𫝊教寺元一統志𫝊教寺在大定府西北隅勸善坊金皇統七年建白蓮寺元一統志白蓮寺在大定府南闗金明昌六年建三靈侯廟元一統志三靈侯廟在大定府南闗乙酉歲建龍王廟元一統志龍王廟在大定府南闗外塗河即土河之濵乙酉歲建遇旱禱雨即應鎮國寺元一統志鎮國寺在大定府西闗有鐵塔遼統和三年建義勇武安王廟元一統志義勇武安王廟在大定府西闗壬子歳建翠㣲寺元一統志翠㣲寺在大寧縣西謹按元大寧縣即大寧路治凡大寧縣諸寺廟當在八溝屬喀喇沁境内今為平泉州赤峰縣地㒺極寺元一統志罔極寺在大寧縣西靈感寺元一統志靈感寺在大寧縣西二里金趙秉文詩塗河岸北白蓮東法鼓驚飛碣石鴻知寺在土河之北又金承安五年精嚴禪寺圓葢和尚墓銘為北京靈感禪寺沙門崇顯立石則此寺在金承安前三學寺與狼山之三學寺别元一統志三學寺在大寧縣北十五里七金山遼咸雍元年建有碑後罹兵火碑字剥落難辨金趙秉文詩刳簷額蠧蝸涎象教塵埃閲百年知寺在金時已毁明一統志烏梁海七金山下亦載此寺名昊天寺元一統志昊天寺在大寧縣西一百里香臺山遼乾統七年建金泰和六年杜元撰碑華嚴寺元一統志華嚴寺在富庶縣謹按元富庶縣在大寧東南境富庶縣之寺廟當在八溝屬喀喇沁東南境即今平泉州地玉清觀與大定府之玉清觀别元一統志玉清觀在金源縣西北隅謹按元金源縣在大寧東境金源縣之寺廟當在八溝屬喀喇沁東境内恵州文廟元一統志文廟在恵州西北隅謹按元恵州在大寧南今為八溝接塔子溝南境凡恵州城内及西境南境當在八溝今屬平泉州東林寺元一統志東林寺在恵州東南隅開祐寺元一統志開祐寺在恵州西南隅興福寺元一統志興福寺在恵州西南隅大清觀元一統志大清觀在恵州西北隅神山廟元一統志神山廟在恵州西南十五里黄崖寺元一統志黄崖寺在恵州南一百三十里高州文廟元一統志高州文廟至元二十年郡侯楊僧喜創建謹按元高州在大寧北境凡高州諸寺廟當在八溝喀喇沁北接翁牛特境内今屬赤峰縣紫㣲宫元一統志紫㣲宫在高州辛酉嵗道士士李清風建感聖寺與大定府之感聖寺别元一統志感聖寺在高州癸夘嵗僧性聰建東華宫元一統志東華宫在高州甲寅歳王崇貞建元都觀元一統志元都觀在高州丁巳歳建福田寺元一統志福田寺在松州南闗有古佛大像謹按元松州在大寧西北境凡松州諸寺廟當在八溝喀喇沁西北接翁牛特境今屬赤峰縣廣濟寺元一統志廣濟寺在松州南闗外有塔二座望京山寺元一統志松州東八十里望京山有寺石佛像香臺山寺元一統志松州南八十里香臺山有石井五峰山寺元一統志松州西南九十里五峰山有古寺龍翔寺慕容燕建十六國春秋前燕録有黑龍白龍各一見於龍山慕容皝親率羣僚觀之立龍翔佛寺水經注作龍翔祠龍山在今塔子溝㕔屬土黙特右翼東南境今寺址無考堯祠北魏建魏書地形志昌黎郡龍城縣有堯祠龍城縣為今三座塔地今祠址無考白鹿山祠北魏建魏書地形志建徳郡石城縣有白鹿山祠白鹿山在今塔子溝㕔屬喀喇沁左翼東境今祠址無考精嚴禪寺在塔子溝東北大城子土人掘地得金碑一為利州精嚴禪寺第一代葢公和尚墓銘承直郎北京路轉運度支判官趙秉文撰并書承安五年八月望北京靈感禪寺住持𫝊法嗣祖沙門小師崇顯立石文稱僧圓葢於大定六年始開堂於精嚴禪寺為第一代知精嚴寺為金世宗時剏建元一統