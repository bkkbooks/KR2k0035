body:
  text: 山二平泉州即八溝㕔鳯凰嶺在平泉州東五十里􅃨嶂中開為州東境之門戸嶺上山桃極盛春時逺望如紅霞其東即建昌縣界映碧山在平泉州東八里高五里廣三里瑙瓈山在平泉州東稍南三十里山陽有石洞中搆屋祀泰山神有二泉一自髙巖下注一自山麓湧出流遶山下獅山在平泉州南稍東六里高三里廣二里山勢雄偉作狻猊昻首形其東峭壁石色全赭土人稱為紫霞峰象山在平泉州南五里以山形似象得名其東與獅山相對為州境之形勝豹河流經兩山間冷嶺在平泉州南八十里明史地理志㑹州衛有冷嶺按冷嶺在㑹州城南六十里與明史地理志相符又考明宣宗實錄載親征烏梁海丙辰駐寛河明日至冷嶺又明日駐㑹州今冷嶺在寛河城北三十里所載方位亦合應即此山也金沙溝山在平泉州南一百里以沙色如金故名紅山在平泉州西南十里高二里廣一里老姥山在平泉州西南三十里猴山在平泉州西稍北五里高六里餘廣二里危峰孤峙髙出雲際毎朔雪初晴皚如積玉土人所謂猴山積雪也烏勒呼瑪梁在平泉州北六十里喀喇沁右翼境有山泉滙流南入豹河黄土梁在平泉州東北四十里喀喇沁右翼境烏勒呼瑪梁之東南豹河𤼵源於此石佛溝山在平泉州東北一百二十里喀喇沁右翼境石壁上鑴佛像一喀卜齊爾東山在平泉州東北一百六十里喀喇沁右翼境有洞深三丈餘洞外石筍矗立有泉清鑒毛髮上建龍神祠和爾圖崑都楞喀喇山在平泉州属喀喇沁右翼東二十里畢齊克圖達巴罕在平泉州属喀喇沁右翼東四十里烏爾圖納蘓圖波羅山漢名萬夀山在平泉州属喀喇沁右翼東七十里額卜特山漢名秋鷹山在平泉州属喀喇沁右翼東八十里伊瑪岱山在平泉州属喀喇沁右翼東九十五里錫納喀喇山在平泉州属喀喇沁右翼東一百五里和爾博勒津山漢名七金山在平泉州属喀喇沁右翼東一百二十里遼史地理志聖宗過七金山土河之濱南望雲氣有郛郭楼闕之狀因議建都又中京大定府有七金山金史地理志北京大定府有七金山元一統志七金山在大寧縣北十五里東西長十里南北廣五里山有七峯因名遼時嘗建三學寺於中按遼金大定府即今平泉州境之大寧故城元大寧縣即遼金大定府属之大定縣詳建置沿革門今和爾博勒津山漢名與古相同在老河即古土河東岸西南距大寧故城不逺知為古七金山矣明一統志稱烏梁海有七金山應亦指此超圖喀喇山在平泉州属喀喇沁右翼東一百二十餘里哈特哈山漢名妬山在平泉州属喀喇沁右翼東一百五十里烏巴河𤼵源於此巴顔烏蘭山漢名大紅螺山在平泉州属喀喇沁右翼東一百八十五里按明史朶顔傳有紅羅山羅與螺音同疑即此山托來圖山漢名兒山在平泉州属喀喇沁右翼東南九十五里又右翼東南一百五十里有托來山巴圖察罕山漢名柞山在平泉州属喀喇沁右翼東南一百餘里喀喇和碩山亦名大斧山在平泉州属喀喇沁右翼東南一百五里伯爾克河𤼵源於此巴顔喀喇山漢名大青山在平泉州属喀喇沁右翼東南一百十五里蒐克哈達山在平泉州属喀喇沁右翼東南一百二十餘里摩勒津陀羅海山在平泉州属喀喇沁右翼東南一百二十五里庫克碩卜和爾山在平泉州属喀喇沁右翼東南一百四十里錫黙特山在平泉州属喀喇沁右翼東南一百八十里圖爾根河發源於此博爾多克山在平泉州属喀喇沁右翼東南一百八十餘里達爾罕陀羅海山在平泉州属喀喇沁右翼東南一百九十里察罕齊巴噶山在平泉州属喀喇沁右翼東南二百里圖爾罕陀羅海山在平泉州属喀喇沁右翼東南二百三十里哈特呼朗台山亦名雞冠山在平泉州属喀喇沁右翼南九十五里山石如雞冠故名霍爾霍克巴達罕亦名霍爾霍克阿圭山以山洞得名在平泉州属喀喇沁右翼南一百二十餘里有二洞皆僧所居依洞架楹搆精舍於其側户牗旁通隨山向背其東則霍爾霍克河出焉其西則賽音河發源於此即熱河之東源克依斯庫哈達在平泉州属喀喇沁右翼南一百三十里伊瑪圖哈達漢名羳羊山在平泉州属喀喇沁右翼南一百三十五里呼察察罕陀羅海山在平泉州属喀喇沁右翼南一百四十里呼察河𤼵源於此察爾吉山在平泉州属喀喇沁右翼南一百四十餘里拜察山漢名神山在平泉州属喀喇沁右翼南一百五十里遼史地理志中京澤州有神山元一統志神山在恵州西南十三里東西長十里南北廣八里中有古廟按元惠州即遼澤州在今平泉州南境與此方位相合當即古神山也巴顔山漢名富山在平泉州属喀喇沁右翼南一百七十里拉克圖爾山在平泉州属喀喇沁右翼南一百八十五里永安山漢名馬盂山在平泉州属喀喇沁右翼南一百九十里地産鉛砂老河發於此遼史地理志中京大定府有馬盂山元一統志馬盂山在大寧縣西六十里中有一峰形𩔖馬盂故云按遼史元志所載馬盂山與今州属之永安山方位相合且漢名馬盂當即此山宋王曽行程錄稱富谷館東望馬雲山山多禽獸林木國主多於此打圍馬盂與馬雲乃音之轉實一山也歐陽修詩曰馬盂山西看落霞應即指此特卜什山漢名方山在平泉州属喀喇沁右翼南一百九十里昌吉爾岱山在平泉州属喀喇沁右翼南二百里青龍河發源於此額林畢老圖達巴罕在昌吉爾岱山之西南英圖谷在平泉州属喀喇沁右翼南二百餘里都呼喀喇山在平泉州属喀喇沁右翼南二百十里克勒達巴罕漢名鴉嶺在平泉州属喀喇沁右翼南二百二十里拉克拉哈爾山在平泉州属喀喇沁右翼南二百三十里台吉喀卜齊爾谷在平泉州属喀喇沁右翼南二百四十里昆都楞喀喇山在平泉州属喀喇沁右翼西南八十里察罕齊老圖山漢名白