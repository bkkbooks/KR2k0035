body:
  text: 欽定四庫全書欽定熱河志卷十七巡典五御製詩戊寅恭奉皇太后口外行圍起程日書事氣爽時當大獮候世平塞是外虞陲國朝武備千秋獨仁祖勤勞萬禩貽迤邐楊村復栁莊停鞭問瘼不妨詳老安保赤厪宵旰萬嵗千齡奉夀康黍隴禾塍近熟秋實堅實好蔚如油可知夏五憂偏劇纔博今來少釋愁出古北口莫問臨洮及滄海愛看雲白與山青出闗爽氣迎人靣入畫秋光惬性靈何代隄防此乗障常時來往似行庭可知守徳勝守險益凜冰淵祝太寧至避暑山莊作䖍奉慈輿又駐兹堯年寳額至今垂本予起愛起敬處值此宜風宜月時蟲是秋音喧砌角山猶古色罨簾眉也知吟興行将發且復從容藴蓄之中秋侍皇太后宴嵗嵗時行奉大安山莊慶節侍慈歡光明徧照恒沙界端正何須七寳攢髙下巖楓疑桂馥友羣野鹿共蟾看底縁益覺中秋好地逈樓䑓近廣寒熱河啟蹕木蘭行圍之作山莊行慶中秋度呦鹿鳴時可重去聲遲野水寒灘循迤邐舊藩新附盡追隨幾重平聲塞樹含霜色一縷村煙起曉炊更有予心誠慰處告成多稼幸如茨木蘭迴蹕駐避暑山莊之作木蘭脩獮薄言廻小駐山莊鎬宴開未久秋風催轡去訝同日影上窗來千層錦樹紅兼緑一道玉溪漩復洄尋鹿得欣否亦可園中麋鹿甚多時鎗獲之為他巖景耐徘徊二十三年七月庚子上奉皇太后啟蹕巡幸塞外降㫖蠲免所過地方額賦十分之三癸夘出古北口丙午至熱河行宫辛亥上奉皇太后于卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉等茶果凡三日八月丙辰復賜王公大臣䝉古王公台吉等茶果凡六日乙丑上侍皇太后膳丙寅上萬夀聖節詣皇太后行宫行禮御澹泊敬誠殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台吉等宴丁夘亦如之戊辰中秋節上侍皇太后膳賜扈從王公大臣䝉古王公台吉等宴己巳上行圍木蘭奉皇太后自熱河啟行癸未行圍殪虎駐蹕鄂爾楚克哈達九月丙戌駐蹕布祜圖東布魯特使臣車里克齊等入覲賜扈從王公大臣及布魯特使臣等宴丁亥行圍殪虎駐蹕庫庫英圖己丑駐蹕薩爾巴里哈達東布魯特使臣舎爾伯克等入覲賜扈從王公大臣及布魯特使臣等宴庚寅駐蹕按巴鳩和洛䝉古諸王公等恭進御宴上奉皇太后閲馬戲辛夘駐蹕烏蘭哈達東布魯特使臣舒庫爾等入覲賜扈從王公大臣及布魯特使臣等宴壬辰重陽節上詣皇太后行殿侍膳賜扈從王公大臣䝉古王公台吉及布魯特使臣等宴是日駐蹕阿貴圖癸巳駐蹕張三營賜扈從王公大臣䝉古王公台吉及布魯特使臣等並隨圍兵丁等飯丙申迴熱河行宫丁酉上侍皇太后膳賜扈從王公大臣䝉古王公台吉及布魯特使臣等宴御萬樹園賜觀火戲及健鋭營兵立馬技戊戌復御萬樹園賜觀火戲己亥上奉皇太后自熱河迴鑾壬寅入古北口乙巳上奉皇太后迴圓明園御製詩已夘恭奉皇太后幸避暑山莊曉秋啟駕秋蒐武緯亦文經例事山莊數日停玉露金風排法駕千秋萬嵗奉慈寧諸部行將奉屬車巖闗古北是門閭朝家武備超千古顧語兒孫慎守諸芃芃禾黍遍原田轉歉希豐實賴天兩月景光異爾許向來曽未敢期然出古北口前朝霖雨潮河漲浮橋促就待馬上輜重一一命徐渡爭進擁擠反無當巡狩從來寓習軍何妨小試善将将塞闗嵗嵗常經過居民識熟無煩訶闗外輿梁駕未得避潦有路遵巖阿塞田不與内地同最慮山水當其衝低粱髙黍胥芃芃山水驟過沙壓蓬一隅亦厪災民窮惟期九㝢均歌豐恭奉皇太后駐蹕避暑山莊山莊避暑建堯年每至山莊暑已蠲却是秋髙尚婪熱要知天佑為遲田今年得雨夏至後俙種甚遲常虞節凉霜早乃今秋炎熱異常禾黍得以實堅實好誠感帡幪大造之賜率欣即景輒掞筆可緩行蒐慢著鞭遇閏節早原擬七月過望即往木蘭行圍兹以婪熱鹿未呦鳴故改期仍過八月望啟行色養武繩莫非事敢因逰豫弛乾乾中秋日侍皇太后宴獻夀東朝祝南極承歡北塞擬西池以天下養樂莫大值秋月佳景更竒動桂浮蘭彼徒爾慶霄綺節此為宜由來家法貽千禩松鶴延齡昔有詩三十六景中松鶴清越乃后處皇祖奉養寧夀宫皇太也避暑山莊啟蹕木蘭行圍之作候暄程為改節過獵斯宜呦鹿云将發行驄豈重遲霜霏山路迥潦退野橋支納稼村村接秋成歴閲之木蘭迴蹕駐避暑山莊作木蘭廿日事秋蒐臨樂何曾忘去聲運籌去盼佳音迴尚爾今看美景昨如流疊峰錦樹紅贏緑落峽琴泉沈且浮似此溪山可孤負三朝合著翠華留進古北口兩月行秋翠蹕旋石城埤堄進雄邊天時寒暖一朝異地脈東西萬里延昨過溪山已古物再來風月指明年翹農意乃無終始宿麥行將閲野田二十四年七月壬子上奉皇太后啟蹕巡幸塞外降㫖蠲免所過地方額賦十分之三丙辰出古北口己未至熱河行宫丁夘上奉皇太后于卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉等茶果凡十日八月己丑上侍皇太后膳賜扈從王公大臣及䝉古王公台吉等宴庚寅上萬夀聖節詣皇太后行宫行禮御澹泊敬誠殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台吉等宴辛夘亦如之壬辰中秋節上侍皇太后膳賜扈從王公大臣及䝉古王公台吉等宴癸巳上行圍木蘭奉皇太后自熱河啟行甲午駐蹕博羅河屯䝉古王公等恭迎聖駕辛丑駐蹕布爾哈蘓台壬寅駐蹕巴顏溝䝉古王公等恭進御宴上奉皇太后閲馬戲癸夘行圍殪虎駐蹕鄂爾楚克哈達甲辰賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯九月庚戌行圍殪虎駐蹕齊爾博庫昂阿甲寅駐蹕哈里雅爾賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯乙夘行圍殪虎駐蹕巴顏托羅海丙辰重陽節駐蹕舒隆哈達上詣皇太后行殿侍膳賜扈從王公大臣䝉古王公台吉等飯丁巳駐蹕濟爾哈朗圖賜扈從王公大臣䝉古王公台吉等飯庚申迴熱河行宫癸亥上奉皇太后自熱河迴鑾丙寅入古北口己巳上奉皇太后迴圓明園御製詩庚辰八月十八日恭奉皇太后木蘭行圍啟蹕之作每嵗金秋舉獮苗悠悠旌斾馬蕭蕭承歡内外都無間繩武覲揚亦孔昭示法子孫從啟蹕每嵗木蘭行圍諸皇子皇孫畢從俾習勞也隨圍賓客扈來朝今年䝉古諸賓客以祝萬夀來京者衆即由此扈駕而行新攜回部鶻師赤囬部霍集斯等皆令隨圍彼中放雕鶻者謂之鶻師赤如元史稱司鷹者謂之錫保赤之𩔖髙處興安試放雕雕鶻宜於髙處就下放之滿洲䝉古以騎射為重若回部厄魯特則以此為重云降㫖免經過州縣納賦經過賦免十分三今嵗還敎依往例秋豐任土正所當於民傷恩寧傷義掃除罷受僱錢歸築納完更無餘事衹虞中飽澤鮮均申命有司察蠧吏出古北口得詩四首年年獮狩此經過外戸何須亟禁訶天捲秋雲歸塞嶺潦収川水退潮河綏豐闗外可能同馬上昨猶卜度中佳象今朝真目擊村村比櫛更崇墉從征新附賦歸歟樂土興州安室廬凖噶爾渠帥達什達瓦部衆於乙亥年内附屢遷至山莊普寧寺前為建室廬俾得聚聚族安居從征効力回部有功凱旋歸里今隨該管大臣臣等迎駕至古北口外齊禮漸敎遵式度䖍隨典屬迎去聲鑾輿口北耕民來往熟不譏更不必言征試詢慣事逰辭者應作何為塞上行至避暑山莊六韵昨夜雨而晴金曦曉更晶沿途塵氣淨過嶺樹姿迎仁祖豫逰地慈親奉養情閭閻欣輻輳部落扈旄旌信是仙莊美常逢秋景清今年遲鹿候信宿便登程熱河啟蹕幸木蘭作慶典今年舉帝京秋蒐因致緩登程衹敎仙苑一朝駐消得清詩廿首成新附羣蕃道旁送遠來諸部馬前迎可知遊豫無非事侯度懷柔永厪情重陽日侍皇太后膳今朝乃重九佳節不宜孤月日均陽數川原逼上都登髙隨處可獻夀與山俱紫塞如丹禁千秋奉懿娛䝉古王公等進宴即席得句木蘭嵗嵗秋圍舉東道名藩許獻芹舊例木蘭行圍扎薩克盟長等進公宴家宴凡數次朕命合數宴為一所貢之馬駝牛羊並却不納既以聯中外一家之情兼寓體恤之意云幕設崇岡菊節度是日重九席聯新部雁行分隨圍之都爾伯特親王䇿凌烏巴什等回部郡王霍集斯伯克等並命預宴列坐湯羊美勝八珍膳詐馬催來千錦羣諸伎畢陳行賞罷一家和樂萬方聞至張三營行宫賜宴諸䝉古疊丁丑舊作韵示逺圍期兩日加罷圍依舊見黄華曦迎暖谷人披襖雪㸃嶤峰樹戴花自為驅馳聊布惠可知中外總為家洛那有宴仍敎預丁丑此宴哈薩克陪臣亦適預嘉彼鱗流仰集遐木蘭迴蹕至避暑山莊作鹿期促駕駐兩日塞上行圍倐又迴美土如斯可漫去逺人爾許况攜來時回部郡王霍集斯伯克等自京隨駕都爾伯特親王䇿凌烏巴什等以入覲扈從秋蒐而哈薩克陪臣都勒特赫勒等亦赴木蘭朝謁既命觀圍並攜至山莊錫宴從容宴樂應敎預假藉清涼得久陪繩武惠遐綿奕葉山莊嘉兆自天開入古北口秋仲經過冬孟還流隂瞥眼往來間敷恩示度無非事暮詠朝披亦未閒向暖鸞鈴入閭左就荒雉堞鎖孱顔千村納稼饒衣褐幸慰吾民卒嵗艱二十五年八月己丑上奉皇太后啟蹕巡幸塞外降㫖蠲免所過地方額賦十分之三壬辰出古北口丙申至熱河行宫戊戌上行圍木蘭奉皇太后自熱河啟行己亥駐蹕博羅河屯䝉古王公等恭迎聖駕辛丑駐蹕舒隆哈達賜扈從王公大臣䝉古王公台吉等飯九月甲辰駐蹕哈里雅爾乙巳行圍殪虎丙午行圍殪虎駐蹕吉蘭烏里雅蘓庚戌重陽節上詣皇太后行殿侍膳䝉古王公等恭進御宴上奉皇太后閲馬戲是日行圍殪虎駐蹕薩爾巴里哈達甲寅駐蹕鄂爾楚克哈達賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯癸亥駐蹕木壘喀喇沁左部哈薩克使臣都勒特赫勒等入覲賜扈從王公大臣䝉古王公台吉都爾伯特親王䇿凌烏巴什囘部郡王霍集斯伯克及哈薩克使臣等宴丙寅駐蹕張三營賜䝉古王公台吉及哈薩克使臣等並隨圍兵丁等飯己巳迴熱河行宫十月癸酉上奉皇太后於卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉都爾伯特親王回部郡王及哈薩克使臣等茶果凡十日癸未御萬樹園賜扈從王公大臣及䝉古王公台吉等觀火戲甲申亦如之乙酉上奉皇太后自熱河迴鑾戊子入古北口辛夘上奉皇太后迴圓明園御製詩辛巳七月十七日幸熱河以雨濘命諴親王恭扈皇太后駕俟路燥後行雨中登程跋馬成什撰良啟駕早𫝊宣可以秋霖遽易旃敬念慈寧登大慶雅宜安樂養髙年親藩扈蹕候塗治宫眷隨行視膳便涉潦何妨徐按轡習勞更欲閲農田出古北口即事四首千山雨過水歸壑五日晴浮爽拂人古北年年雖熟路一番秋景一番新潮河波湧搆橋艱野舫乘浮過石灘負捆牽䭾爭問渡滿川旅况駐驄㸔山蹊避潦昔曽經廿里行宫午憩停厄魯興州來扈駕哈邦弗著戴花翎厄魯特舊著哈爾邦帽今居熱河者皆易中國冠服來接駕哈爾急呼之則為一字云隔河迎駕畢招來奔走宣勞實壯哉一百年前此闗外却看頺廢有屯臺至避暑山莊即事三朝秋潦暫稽程䇿渡輕裝趁快晴咫尺仙莊亦莅止萬千寳穡可登盈堯年家法依然仰任馭輿梁已就成侍衞馳來知悦豫慰哉懸切寸心誠七月晦日恭迎皇太后駕至避暑山莊因成長句時巡減從敬前驅令日安輿登坦途溫凊旬餘濶萱戺起居十里迓蘭衢仙莊依例鶴齋憩松鶴齋即殿聖母寢佳景欽承鳳輦扶澗葉巖葩都瑞色千秋萬嵗奉慈娱熱河啟蹕幸木蘭作山莊留駐俟橋搘鹿候秋分難再遲幾縷雲徂澄碧落數灣漲退露蒼涯舊圍喀喇沁遼待新附烏梁海並隨示度頒恩均有事此行寧衹為逰嬉木蘭迴蹕至避暑山莊作仲秋啟蹕返深秋彌月無何駒影遒迴望木蘭雲共逺到來仙苑景還稠楓丹每向松邊見泉響偏於風處流如此佳山可漫置合敎數日翠華留入古北口作緑樹看從闗外迴暖延秋序倍長哉徃嵗迴鑾時闗外林空關内復見緑樹今秋倍暖關外樹葉依然未落云總縁慈慶因而篤信是天庥栽者培邊計古休問守禦民生今祇懋匡徕迎鑾祝嘏輿情聴古北提督及直𨽻總兵等備經壇祝聖母夀因聴之陽月欣臨夀域開二十六年七月癸丑上啟蹕巡幸塞外時以雨潦命和碩諴親王允袐恭扈皇太后駕俟天晴擇吉啟行上沿途周視派大臣侍衛督官兵等修治輦路奉迎安輿降㫖蠲免所過地方額賦十分之三己未出古北口庚申駐蹕常山峪是日皇太后駕自圓明園啟行壬戌上至熱河行宫丙寅上詣廣仁嶺恭迎皇太后駕至熱河行宫戊辰上奉皇太后於卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉等茶果凡七日丙子復賜茶果凡三日己夘上萬夀聖節詣皇太后行宫行禮御澹泊敬誠殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台吉等宴凡三日甲申乙酉亦如之辛夘上行圍木蘭奉皇太后自熱河啟行壬辰駐蹕博羅河屯䝉古王公等恭迎聖駕甲午駐蹕阿貴圖乙未駐蹕海拉蘓台九月丁酉行圍殪虎駐蹕納喇蘓台辛丑駐蹕巴顏溝䝉古王公等恭進御宴上奉皇太后閲馬戲癸夘駐蹕鄂爾楚克哈達甲辰重陽節上詣皇太后行殿侍膳賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯是日駐蹕扎克丹鄂佛洛乙巳行圍殪虎二豹一駐蹕伊綿峪丁未行圍殪虎駐蹕博羅昂阿己酉駐蹕庫庫英圖賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯癸丑行圍殪虎駐蹕永安拜昂阿丁巳駐蹕濟爾哈朗圖賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯庚申迴熱河行宫乙丑上奉皇太后自熱河迴鑾十月戊辰入古北口辛未上奉皇太后迴圓明園欽定熱河志卷十七
