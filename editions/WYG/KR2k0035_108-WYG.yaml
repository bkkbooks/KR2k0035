body:
  text: 欽定四庫全書欽定熱河志卷一百九藝文三本朝詩辛酉扈從出喜峯口髙士竒清蹕出雄關鳴笳厯荒徼夾嶂真天開壁立盡竒峭往時設重戍藉此為險要戰壘虚風生孤城斜日照年年荷戈人未得息征調自從被至徳逺近奉明詔遂使邉隅民不用驚烽燎喜隨萬乗來快哉肆登眺晚宿白臺髙士竒塞行未十里塞景已殊異入目多荆榛亂峯含紫翠翹首睇長城萬載嚴邉備連幕宿山陽迢逕横晩吹虎嘯巖谷鳴颯颯風隨至幕火􅄆繁星周廬環七萃來朝屬車塵應抗凌雲志過嶺髙士竒六龍乘曉發萬騎陟重岡灌木翳青天亂石縈羊腸縱横澗水流隠約山花香山花非一狀紅紫含芬芳更有青楓樹嘉隂凝衣裳仰面觀竒峯怪石紛低昻時當四月初猶覺山風凉曠然心眼豁不似披遐荒兼旬實壯遊塵慮為之忘黄土巖髙士竒何年鑿山骨屹立疑千尋徙倚不可即駐馬空沉吟藤梢與葛刺䝉宻何隂森懸崖支一木㣲徑通􅏟嶔巖扉有遺跡邈矣煙霞深杳靄青松際白雲迷至今駐蹕寛城北五里水次髙士竒省方入逺疆駐蹕蒼崖裏崖下俯長河波瀾最清駛娟娟三兩峯掩映雲霞紫㣲風馨磵松殘陽下流水幽賞平生懐對此翻然喜捲幔息銀燭愛看山月起將出逹什喇卜齊爾口作髙士竒衆山向背殊峯峯自迴互石上漾清泉山根叢茂樹咫尺誤行蹤往來遵細路彎環數十轉潺湲八九渡林花雜春夏風景變朝暮勝覽意不忘塞行有深趣駕出逹什喇卜齊爾口喀喇沁諸部落率其所屬伏迎道左髙士竒直北幽崖早向誠不須更築受降城職方記載梯船路王會𫝊呼拜舞聲紅綻邊花迎雉扇碧摇巖樹轉龍旌太平遊幸非征伐應笑元封自勒兵從獵髙士竒蒼山萬疊雨初晴從獵朝看塞景清月兔射來誇技絶星狼追得鬬身輕班聨翡翠翎中坐隊入鵞黄褶裏行十二羽林皆健將只容欵段一書生臣班在親隨侍衛之列駐蹕巴爾漢湯泉泉較遵化更熱髙士竒夕照下西嶺平楚生荒烟旌旗散晩獵萬馬奔前川忽看碧草際一水流濺濺深澗轉澄澈暖氣如沸煎少坐濯塵纓云是古湯泉逺聽鐃吹發帟幕燈光懸四望盡暝色圓月明山巔射虎行并序髙士竒巡徼者報夜來虎至營中傷一驪馬尚在山前上率侍衛往射殪之恭紀皇輿蕩蕩界䝉古玉輦時巡厯兹土迴岡巨壑叢棘多隂森林木不知午干乘萬騎排空來夜張行幄山之塢月上忽聞羣馬驚𫝊道山前出猛虎曉看一馬果摧殘殷血淋漓在兩股龍鑣飛鞚陟層崖衛士騰驤齊負羽摉巖剔藪無幾時一箭横胷洞肺腑逺人手額復戰栗跽言此虎為患苦道傍白日每捕人傷􅆷行旅莫可數幸兹惡劣得剪除聖主當陽真神武從來射虎多耳聞何似臣今得目覩因歎蠢頑本不靈貪饕無厭乃自取不然長林豐草間餐眠何畏施弓弩殺人安人王者心即此推之澤自普扈從雜紀四首髙士竒古人邊塞吟但道沙塲苦誰知逺徼外峯崖更參伍地腴苜蓿肥山幽松樹古若令勤耕織其益豈小補穹幕山之陽終嵗牧牛羖近稍敦禮義漸漸識䂓矩傴僂謁道隅趨蹌申拜舞欣看古甌脱今受大化撫空山狐兔羣終嵗少人跡叢條蔽逺岡墮葉堆荒澤首夏猶苦寒邊風日將夕夜雨聲瀟瀟燈光暗油碧雲黒峯巒沉但見炊烟白喬松干餘株枝枝盡竒矯逺望青岑邊似在白雲表雨過林壑清天空初日曉羽騎來驂驔霓旌更縹緲迤邐入山谷細路厯深窅終日臨髙峯嶔﨑復盤遶回首顧榆闗萬山青不了方知地軸雄結構非藐小人生宇宙間志願當何如不行萬里路即讀萬卷書早嵗慕五嶽中年困窮居耳目苦未廣懐抱慙空虚鳴鑣随禹載攬轡觀皇輿出境雖不遥閲厯皆異墟朝朝扈蹕行非是勞征車詩成傲徃彦徒見征伐餘賜宴喀喇沁諸部落恭紀髙士竒黄幄髙張羽衛陳遐方述職盡稱臣金螺酒醴頒三爵寶碗茶膏遍一巡問俗逺同虞出狩要盟欲笑漢和親長城有險休重設至治從來守四鄰賜賚喀喇沁諸部落恭紀髙士竒帝澤遥敷到八埏精鏐文織散窮邊應羞使者通西域何用將軍欵右賢錦繡平添林嶠色雲霞四映塞垣天賈生五餌終迂論何似懐柔大化宣過大石磯行雨中高士竒流雲浮皛皛山川雜烟霧出没多竒峯穹窿各吞吐驅馬上懸崖崖傾馬驚顧百里盡䝉宻杳靄失前路古道㡬登頓亂流繞深樹活活雨脚低隠隠雷聲布澗外起長虹旌斿閃薄暮曉行將入喜峯口新霽高士竒雲際露山頂青林來日光曉從六龍行髙下逾重岡巖花落未殘磵道餘芬芳鳥聲辨關樹人語如故鄉鐃歌清吹𤼵逺風旌斾掦鏨鑿萬仭餘鬱岪臨大荒厯兹戰鬬地壯士顔慨慷願施造化功處處知耕桑癸亥扈從出古北口古鎮青山口雙崖對面削綫路通兩軌峯如犬牙錯險阻自天成何人施鏨鑿怪石虎狼蹲硤角馬驚愕盛世尚柔逺邊陲乆開拓葳㽔列雲旓金支耀叢薄憶昨經榆關山川恣搜索春來望雁門千里窮寥廓懐抱早超然當暑再持橐出色起長謠皇心在經畧十八盤嶺髙士竒塞行不厭山騁望少平陸北上更岧嶤鳥徑繚而曲前旌趨平岡後隊出灌木籠蔥巖䕃繁滴􅅹磵泉足火雲照衣裳炎景近初伏馳驅萬馬蹄蓊匌走深谷向午聞鳴蜩凌風振輕縠塞花勵杜訥姹紫嫣紅鬬午晴韶光彷彿是春明近天雨露均霑潤徧地芳菲不辨名異種合教鵞絹寫濃香長傍馬頭生盛朝茂育真無外百卉邊陲共向榮塞草勵杜訥萋萋磵石復巖腰和雨和烟色最饒軟碧迎來袍影舊芳茵襯處馬蹄驕多因地僻膏偏沃為喜風和翠未凋生長幸承雕輦路蘢蔥小草並含韶塞外觀月勵杜訥乍湧氷輪萬里清光騰行幄儼瑤京遲他五夜晶初滿坐到三更魄倍明此夕似疑邊地雪當年曽照漢家營龍沙盡繪昇平景侍輦多慚謝賦精野芍藥勵杜訥山坡逺望見花枝宛似豐臺綽約姿野質未曽登上苑芳名猶自號將離喜逢化雨霑濡日得有臨風爛漫時塞植盡皆㴠聖澤莫云草木便無知扈從出口山川景物觸目賞心恭紀十首陳元龍土羙從人說身輕始稔知清泉甘似醴豐草滑如脂不信風霜厲還看物産滋小臣誠厚幸策馬自忘疲山行深更好恍在畫圖中絶巘千㝷碧疎林萬樹紅原禽棲茂草仙鹿出芳叢目賞真難給朝朝景不同靈液不知源涓涓逺石根臨流清可覽潤物氣常暄沁骨能祛疾充腸更滌煩南陽空記異菊水漫稱尊綿亘山無極鳴鞭入紫烟凌寒花自滿映日翠逾妍樹杪雙旌出雲中六轡連巨靈何日擘巡幸待堯年竒花難問種珍果不知名艷若鋪霞錦香疑襲杜蘅金光隨手摘火實傍車迎漫道江南好霜柑㡬樹盈近塞羊初羙髙原雉正肥擊鮮真足樂下豉漫相譏珍豈誇婁膳貧還笑朔饑徒縈鰕菜慕嘗此味全非旦暮寒暝異終朝備四時午風初夏好斜日晩秋宜春服隨人著冬裘入夜披自然安作息雲卧不須疑青崖多植黍䓤鬱自成叢不費耘耔力無勞灌溉功餘糧棲畆畔滯穗樂年豐擊壤皆熙皞猶存上古風誰言沙漠地鎮曰作山遊嵐翠侵衣濕溪聲傍枕流汲泉烹苦茗撥火試新篘自愧詩萹拙難題塞上秋堯封應未及禹貢㡬曾收景物移三島輿圖隘九州山從高掌拓水載廣輪浮不是倍仙蹕疇能快壯遊熱河記事四首陳元龍干山環紫塞一水䕶丹邱土沃風猶古農耕户已稠地靈迎日馭天意待宸逰隨蹕重過此清凉五月秋行殿無雕繢山原有性情髙卑因地勝簡樸儼天成林壑千重䕶烟雲四面生寰中新樂土嵗嵗駐霓旌官自文章舊恩因顧問新地𫝊真閬苑人識老儒臣高厚難酬主衰殘未乞身摩挲雙眼暗開卷每逡巡僦舍三間潔移花一院香新泉烹茗啜野菜入􅃵嘗室淺風翻帙墻低月滿床七年塵土夢到此暫心凉熱河髙其倬好景天開古塞垣百靈翹首奉行軒峯迴翠黛烟長䕶水孕丹砂氣自温五色雲來知入夏萬家人聚喜成村年年雨露隨雕輦千里桑麻接廣原熱河山莊髙其倬昆圃原宜苑神山自有樓烟雲開紫塞職覲近皇州壑邃炎難到湖平澹不流聖人行處好翠色十分秋渡灤河髙其倬天晴渡灤河漲落水初縮古岸留舊痕磷磷沙映玉迴思夏潦盈萬騎走平陸重來㡬何時波静颺輕縠青山亦多情千里同迴曲返照上遥鬟秋影落蛾緑纎鱗依鏡遊晚路抱烟宿清賞惜須臾摇鞭轉前麓扈從出古北口二首蔣廷錫詰旦飛雲霓連峯忽中鑿蜿蜒一線開青蔥下縈薄山城據雄勢睥睨俯萬壑聖人大無外天險非楗鑰居民儼廬井闗吏静鈐柝乃知至治世元化自寥廓和風迎面來逺烟吹漠漠石路車聲髙青林深且邃重山互回抱淡日照空翠小橋架潺湲恍然闢天地裌衣生微寒頓覺氣候異書生處海濵見聞僅一二竒觀新耳目羙景豁胸次多幸事聖明談笑竦輕轡夜光木蔣廷錫乍見星芒映室中喜看藜火照窻櫳夜明簾簿來西域徑寸珠圓出海宫清似晶融還貫月碎如螢散逺隨風此身恍入琉璃界寜羡金蓮蠟炬紅䨇塔峯歌蔣廷錫逺山月落天鷄唱長峯吹雪度層嶂霧花作雨十里香扶桑鞭促金烏上斷雲忽露兩峯尖半隠半明失顧瞻太陽髙照隂靄散塔影雙挿驚排籖紅雲一握遞迎送糝金石色光浮動誰將玉斧中劈開比肩而立相伯仲左峯彷彿生紫烟鏤開三穴皆天然山根疑與鑿圭竇上穴大小珠窩圓日光直射圓鏡赤玲瓏透漏仇池天右峯稍低如拱揖浮圖相對神功全須臾馬首齊向東兩峯體合如一峯石屏方正卓然起峯巔緑樹隂濛濛行行二里山脚走右峯轉左左轉右嵌空突兀亦非常面面皆驚峯勢陡憶從先臣宦粤省梅花村上羅浮頂百二十里老人峯没膝黄雲盤石磴復記前年登華山蓮花朶朶雲霓間仙人掌冷挹紫瀣玉女盆虚圍翠鬟今朝所見真大觀半空落下青琅玕山迴溪轉雙塔隠行人馬上回頭看生平足跡探竒秘飽眼山川皆帝賜愧無米芾畫石筆冩出雙峯掛帆勢上幸海拉蘇臺大獵恩賜觀圍恭紀蔣廷錫秋髙弓勁萬馬肥千山紅葉連霞飛外藩部長率帳落來奉君王大合圍平川㡬㸃人如豆漸見烏闌畫逺岫青旗引路時飄揚四無人聲約歩驟峯腰變出常山蛇羣馬班駁雜五花陣脚欲轉勢未合草間出没驚麏麚東偏飛騎下林麓山頂人排城堵矗圍塲圓放十里寛四面回還衣帯束儦儦俟俟何處來長角大耳跳蒿萊倉皇急欲突圍走掦鞭噪逐喧春雷羽林掠圍静無擾馬宻人齊圍轉小雲麾五色八門開盤屈遊龍頭尾繞十尋黄纛吹長風晴天皎日光曈曈山祗地靈共鞭策悉率羣友居圍中繡玉勒疾馳騁乾草霜蹄逐風影天威手挽八石弓十四把長餘箭鋌前鹿已中金僕姑雕翎灑血紅糢糊後鹿一發中其項髙坡仰僕鳴嗚嗚須臾連射二十鹿箭服曽無遺一鏃天網還開三面恩下馬撤圍教止戮秋冬獮狩古所𫝊維皇聖武縱自天仁風已捲鶴麗陣勇氣尚掛魚須㫋外藩健兒千二百忽掃雲屯散無迹疾徐進退心力齊知是吾君恩所格始信天下一家語絶域遐邊總畿輔小臣袖手得賜鮮敬繼岐陽歌石鼓上命登興安髙處眺恭紀四首蔣廷錫馬蹄得得踏寒莎日色雲光兩盪摩穏立興安最髙處青天左界看山河花飛短荻雲千疊葉落喬松玉萬株無數春蠶沙上卧絶勝平逺范寛圖掠掠風從脚下生始知身已接空㝠真將目力窮千里著地天垂一線青沙痕奔馬晴還捲風力􅌉雕怒自號此處重陽無㡬日山頭先已賜登髙上親射金錢豹恭紀蔣廷錫朔塞雲深候南山霧隠年韜文蔵白草焕采發寒烟爪利騰張猛身輕跳躍便志貪全鹿飽路值六龍旋木落千林矗塵飛一騎先出房金鏃疾彎月寶弓圓鷙性思拏肉天威易縛綿奔逃方股慄僵仆見腢穿置負明駝背携歸行殿前驚看人聚堵環立衆摩肩鬚勁垂霜潔毫班帶血鮮舊曽聞艾葉今始識金錢雪照胸間色風腥口上涎真堪雄並虎寧止倍於豜孔武羔裘句長楊射獵篇幸隨豹尾後窺管頌秋田癸未六月扈從出古北口查慎行太行蜿蜒二千里七十二㘭連首尾東趨遼碣西冷陘留斡一門屹中疊古北口一名留斡嶺見金史巨靈擘石如擘雲雲根俯插黄花軍烟氛突過掃無迹風雨欲來天半聞出關彌望神州壤六飛清暑頻來往髙墉已斷山不斷無數芙蓉列仙掌川迴岡轉輦路長涼亭舊驛今村莊元時避暑沿路多凉亭賜東西凉亭軍士粮鈔見文宗本紀帝獵北涼亭見趙世延傳明洪武之之名二十七年置古北口十四驛猶存東涼亭驛禽魚共識天顔喜草木中含御氣香小臣多年客燕代夢想何曽踰紫塞自謂遭逢老更竒停鞭飲馬長城外兩間房直廬作查慎行隨班番直又晨興金鑰銜魚轉數層延閣日長無箇事坐消清簟一壺氷過青石梁查慎行天豁新開嶺鸞旗曉向東古藤攀石度絶壁過雲通鳥啄山花雨蟬嘶槲葉風林巒行不盡長在畫圖中駐驆鞍子嶺連雨驟凉查慎行複磴中涵金碧姿小青山外蹕初移愛迎嵐翠晨趨直貪傍燈明夜咏詩泉脈曲通行帳外雨聲渾似滴蓬時水晶宫殿清凉國𫝊語人間總未知賦夜光木查慎行積水生神木俄登几案旁四時無改火五夜必騰光近暎藜輝淡遥分桂魄凉頓教虚室白臨卷勝螢囊五更隨駕𤼵鞍子嶺行至三道梁天始明查慎行金壺虬箭響登登霽月流天景漸澄谷罨一重環翠幙雲移雙仗識紅燈風輪暗激飛梁轉松頂遲看旭日升滿篋纎絺長什襲此來何處有煩蒸駕幸釣臺召臣等随行賜膳釣魚恭紀六首查慎行髙臺俯瞰樺榆溝指示灤河最上流記得銀絲繪鮮鯽欣從塞外識源頭已刻水下流上樓召臣等至指臺諭曰此灤河上流也魚藻池邊輦路平直隨仙仗到蓬瀛官厨初飫紅蓮飯御饌仍分碧澗􅅅午刻米飯栁賜御饌紅蓮根魚􅅅山莊一帯並河壖人衆如魚盡力田要與周詩占吉夢早開埸圃待豐年一條羅帯水拖藍只少魚舟着兩三滿眼丹青輸畫手鶯聲栁色似江南文鱗躍處起漣漪水族沾恩樂此時不是網罛施不得為留餘澤及鯤鮞佳名原自栁根來魚名栁根赤葢栁根之色赤此魚好噉栁根故名釣得仍將栁貫腮分賜詞臣三百尾挿竿騎馬雨中回直廬磁瓶草花查慎行澗草巖花摘小叢秘磁􅆽水愛青紅不教開落塵沙畔只似栽培雨露中映壁數枝開曉日入簾雙蝶帯西風誰將蟋蟀籬邊景移向灤河避暑宫賦野杏根查慎行古根埋不爛搜剔豈能辭斑剥舊苔蘚槎枒新菌芝乾坤無棄物研席得竒姿自有天然質何煩斧鑿為雙塔峯歌查慎行灤河之水鳴淙淙晨光欲透草木蓊千巖浮動萬壑充十里霧濕三光鬉陽烏展翅烟攄虹倒射石壁紛青紅中有兩峯迥不同向人騰躍比祝融厥初生時誰所礱分而為二疑靊窿自從巨斧開鴻濛勢欲復合難彌縫小者為霍大者宫前髙後亞兒隨翁其顛石笋各卓空如窣堵波劖圓穹其旁老松垂薤蔥雨露已費千年功初從南麓瞻崇隆恍然御氣乘罡風青天一碧懸雙篷仙舟出没波濤洪形隨徑轉日在東併作髙柱孤巄嵷首末稍歛中微豐異哉三竅何玲瓏下空一門拆崆峒中央一線星光通最上一穴磨青銅團團皎月非朦朧洞貫腹背豈羿弓誰與人力争天工須臾位置移怱怱左右互易驚愚矇漸行漸逺漸不窮回頭依舊蔵霾雺我思佛力大且雄含利所在塔廟崇十方照耀開盲聾僧伽興廢會有終豈如兹山嫓華嵩巍峩俯闢荆榛叢綿亘古塞接蠮螉刼火不壊況兵戎地雖僻左秀獨鍾昔名未彰今始䝉吾皇盛徳邁帝鴻盡攝六合歸牢籠年年雅詩賦車攻山莊近在封域中已獲顧盼邀重瞳何須秩祀偕三公小臣作歌逹聖聰特與此日慶遭逢塞田雙穗嘉榖恭紀查慎行屬車到處瑞徴竒嘉榖俗呼小米子欣看燕尾垂異畆比禾皆九穗連畦如麥總雙歧澤流膏雨珠兼玉譜入豳風畫亦詩從此康年豈勝紀太平天子是農師駐蹕巴龍桑阿蘇台上於附近山中行圍賜臣等全鹿恭紀查慎行雉尾雞翹曉望分旌旗髙捲萬山雲威加草木秋行令禮重貙膢畫掩羣從獸總歸司馬法回鑣如策凱旋勲只慚未効三驅力拜賜長先七校軍駕幸海拉蘇臺大獵賜臣等觀圍恭紀查慎行聖朝雄畧彌宇宙四海為家同在宥行宫直過大青山纉武年年寓巡守川原蕃膴少甌脱邊障清寧罷峯堠盡收種落當郊樊大展岡巒作靈囿凉秋八月商飈發霜氣凝嚴氷未溜朝來下詔大合圍草淺林䟱宜往狩三干虎旅移前帳十萬龍驤出華廐竒毛箇箇五花文表貉揚旜徧巖岫層層葉幄絢紅紫面面山屏圍錦繡前行十里雪初晴千歩場如築新僦遙看數騎林西麓畫裏依微人比豆鴈行齒序列後先魚貫班聨随長㓜綿綿翼翼逺不斷整整斜斜近相凑須臾旋繞山之東觀者同時盡迴首舉鞭初可一二數錯落星文排列宿長松冠嶺嶺插空人馬從空俄下走呼聲㡬處震虚谷驚起雕翎落飛狖此時已有鹿斯奔闌入圍埸孤引脰東跳西顧迷所向首鼠張皇等鼯鼬魚麗鸛翼頃刻成變幻圓方詎能究陣圖本是邱井法旌立和門嚴介胄合圍漸𦂳壤漸平匝布叢攅勢相繆不知鹿羣何處來俟俟儦儦紛邂逅麏麚麞麝麋麖麑麅􅪲麜麎麔希間偵伺前復却防内怔惶駭而驟渴舌長如飲澗垂野心思民重圍透天威奮武臨咫尺頓轡齊鑣不容竇神機獨握舉大綏衆志成城鹿為鍭虹流電掣忽飛鞚月滿弓開胥入彀逸足公然帯箭馳先聲所至隨弦仆一人獲雋萬人歡羣祝君王千萬壽大弨旋韔不盡發餘勇猶浮衮龍袖網開一面頌皇慈節應騶虞叶仁獸雲收霧捲圍乍撤萬騎如風散晴晝小試真同掃塞氛盈庖豈獨充飣餖觀兵耀徳典彌崇行賞頒餘功孰懋竊聞上古有大甸秋獮相𫝊本由舊青邱自行吞雲夢吉日先須卜庚戊漆沮甫草偶于畋悉率從王惟左右今之健兒千二百來自諸蕃踰尉候大同兵䝉古兵一千二百五十人皆出喀喇沁諸部落期門將士但旁觀山力何曽技輕奏此皆至尊善撫馭同軌歸誠車輻輳國家恩澤浩如天蕃部寜非天所覆自然忭舞羣用命王用三驅此其又車攻寧數小雅材羽獵應嗤西漢陋矢詩槖筆本臣職況着征衣隨短後雖慚無力効殳鋋盛事千秋幸親覯駐蹕興安嶺有㫖命臣等登絶頂逺眺恭紀四首查慎行崇岡斗起杳難攀翠䍐華旌嵗往還六合一家寕恃險九邊三面總無關龍沙展勢提封外鳥道盤空霄漢間詔許重登峯頂望始知髙出萬層山忽開眼界向層巔指掌圖成立馬前東走陪京山委浪北踰瀚海地黏天牛羊白散千屯雪草木青回萬竈烟四十九藩齊望幸呼嵩聲徹半空𫝊甲帳辰旗紫邏長極天晴色辨微芒黄榆不斷庭方路白日能消氷雪光獵騎嘶風争北向野鷹隨鴈亦南翔西山蒼靄遥相椄直似登臨在帝鄉輿圖逺闢古興安鳳舞龍迴氣鬱蟠半嶺出雲鋪大漠喬松落葉倚髙寒嶺以北松皆落葉丹青不數東南秀俯仰方知覆載寛萬里乾坤千里目欣從竒險得竒觀駐蹕伊遜河源上親射石熊以熊掌頒賜臣等恭紀查慎行千峯萬峯争落木秋聲蕭蕭氣肅肅連朝纉武大掩羣殪盡山中雪斑鹿西風捲地餘怒號虎豹股栗豺狼逃老熊何物敢自匿出林獨叫求其曹天威赫業掦雲䍐搗穴直窮熊所館公然人立向人啼正值琱弓彀初滿皮毛與石孰比堅不聞射石石亦穿須臾三發三命中摇尾大似求哀憐忽看趫㨗如猿鳥騰上千年松樹杪神機别以火器攻霹􅋬斜飛貫其腦半空拗折青珊瑚松耶熊耶墮地俱皇心因材有生殺倔强那得逃天誅雉飛兔走清林莽重馬䭾來徧行賞驁性寧非恃爪牙焚身竟至因蹯掌駞蹏鹿尾猩猩唇舊𫝊此味配八珍大庖袛合供御饌榮施何幸加詞臣臣聞南山之下渭水濵從禽搏獸空鋪陳賦家漫誇三十六終日射侯原非真豈如吾皇勇且仁除兇服猛胥躬親已靖六合無纎塵山林兼使異獸馴他年珥管紀上瑞郊藪行見逰麒麟上親射金錢豹恭紀查慎行朔漠回鑾候君王罷獵時忽聞山下豹正逐草間麋詎縱顔行抗還將餘勇施三驅争効命七校復揚旗金鏃霜花淬飛龍電影追應弦疑樹鵠拔箭已連骴直作摧窮冦真如殪伏雌右髃充上殺全質少微疵貍首斑斑血猫睛䁡䁡眵鬚雄粗縮蝟爪利善蔵錐自匿荆榛窟初含霧雨姿氣曽吞虎兕力肯讓熊羆緩死俄無路偷生詎有期但令供獮狩猶得壯威儀鎗桿風搖尾鞍橋錦冒皮呈文留炳蔚取用及捐糜師武當關險兵韜示象竒小臣慚獻頌何異管中窺駕𤼵藍旗營乗舟網魚命臣等沿河騎隨賜鮮鯉人各一尾恭紀查慎行雪光皛皛山稜稜千山映雪朝日升灤河之水暖不氷刳舟剡楫凌空去三尺黄龍帝親御川后前驅風伯助峽形漸束波愈清潜鮮帖帖何敢驚人聲不聞聞水聲須臾船重皇情樂啣尾駢頭來繹絡八紘一張魚載躍鰷鱨鰋鯉㫖且多義不盡取收網羅滿渠新漲餘天波詞臣拜恩已無算復賜紅鱗長尺半馬上擕歸萬人看命侍衛射虎召臣等同觀恭紀查慎行後射豹前射熊隂方凛凛生寒風既殺熊復殺虎積雪皠皠暎强弩君王威徳彌寰宇坐致遐方歌樂土闢田築室藝稷黍猛獸寧容此偪處爾牙如鋸我鏃銛焚林盪谷期盡殱溪東距溪西相望十餘里忽聞響應徹山巔天語遥𫝊順風耳西洋人所製六飛所幸成坦途㝠頑何物乃負嵎期門壯士能手搏奉令何異天行誅天生聖人能格物檮杌窮竒情狀悉耳端一缺戕一人厥罪昭然何待詰自從殺此虎邊牧蕃雞豚自從殺此虎莊户長子孫黄熊赤豹同噬吞腥風掃盡無一存小臣稸眼嗟未見談虎尋常色為變此來快覩三害除直似倍遊向畿甸扈從入古北口查慎行金支影轉翠微間萬馬驕嘶並入關雉堞連雲軍角壯虎牙憑險戍旗閒西風漸老河邊栁積雪回看塞外山正是清秋好時節六龍行狩扈南還欽定熱河志卷一百九
