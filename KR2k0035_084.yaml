十曰美爾溝站曰錫爾哈站曰阿梅溝站曰卓索站曰陳都布站曰來色呼都克站曰西拉木倫站曰噶察克站曰海拉察克站曰阿魯噶木爾站由喜峰口者十六曰五十家站曰克斯呼站曰拖和圖站曰百爾克站曰轟郭圖站曰沙拉諾爾站曰庫庫車爾站曰賽音哈克站曰西納郭爾站曰䕫蘇布拉克站曰博羅額爾几站曰諾穆齊站曰哈沙圖站曰阿爾坦克勒蘇特站曰鍾對站曰海代罕站凡口外驛站自古北口至烏珠穆沁等旂自喜峰口至扎賚特等旂按烏珠穆沁扎賚特本在承德府即熱河㕔境外但由古北口者則經灤平縣即喀喇河屯㕔豐寧縣即四旂㕔等境由喜峰口者則經平泉州即八溝㕔建昌縣即塔子溝㕔等境所有設站地方多在熱河所屬各䝉古之内謹詳列於篇謹按乾隆十九年駕自熱河幸盛京以向例軍營事件進張家口出古北口行走紆迴命於張家口外第三四站起酌量安設臺站直抵熱河以便馳送隨宜改設不為定例謹附識云遼古北口外各驛謹按宋史劉敞傳敞奉使契丹自古北口至柳河囘曲殆千里譯人曰通好以來置驛如是不敢變也知古北口以外遼時皆置有驛自中京以南則有王曾行程錄所載之新館臥如來館柳河館打造部落館牛山館鹿兒館峽館鐵漿館富谷館通天館自中京以北則有富弼行程錄所載之臨都館官窰館松山館崇信館廣寧館姚家寨館咸寧館保和館宣化館長泰館蓋皆當時之驛也金時於口外諸州縣多仍遼舊則置驛亦當如遼而史無可考元花道驛元史世祖中統二年諸王塔察爾舊作塔察兒今改正使臣庫庫楚舊作濶濶出今改正至北京花道驛手殺驛吏郝用郭和尚花道之地在大寧故城東其驛當在今平泉州即八溝㕔東境高州二驛元史世祖至元五年立高州北二驛高州為今翁牛特地其驛當在今平泉州即八溝㕔北境建州四驛元史至元二十五年復立咸平置建州四驛建州為今土黙特右翼地其驛當在今建昌縣即塔子溝㕔境灤陽寛河二驛元史仁宗皇慶元年遼陽省增置灤陽寛河驛當在今承德府即熱河㕔南境明古北口外至開平衞各驛明太祖洪武二十七年於開平衞置馬驛接大寧古北口自開平南五十里曰東凉亭又四十里曰沈河又五十里曰扒八又六十里曰黄崖又五十里曰灤河又五十里曰灰嶺又六十里曰古城又五十里曰青松又南五十六里至古北口宣德時廢謹按開平衞為今之多倫諾爾㕔其東為豐寧縣即四旂㕔界所云黄崖灤河灰嶺古城青松諸驛皆當在今豐寧縣灤平縣即喀喇河屯㕔等境欽定熱河志卷八十四
