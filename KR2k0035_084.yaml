body:
  text: 兵防驛遞附熱河北界興安東接遼左漢魏以來諸部分爭罕有寧宇控禦之道無聞焉唐平盧道設東軍北口等守捉遼金及元略具兵防明則棄大寧徙衛所諸軍於內地遂視同外域矣我朝幅員無外威德遐暢塞垣之地不異腹裏於熱河編立營伍分置戍邏以駐防八旗官兵隸於副都統以內府三旗漢軍官兵隸於總管以河屯協官兵隸於提標以捕盜官兵隸於督標肄練以法徼巡以時經制周密可垂久遠志兵防第十五若夫郵傳之設或隸古北口站員或隸承德府州縣每屆翠華巡蒞閣部章奏咸三日一達行在晷刻不稽至於諸部朝貢奏報兼設蒙古驛站用彰同軌之盛治並以次附列于左云熱河等處駐防八旗官兵鎮守熱河等處地方副都統一員駐防熱河滿洲鑲黃正白二旗協領一員駐防熱河正黃正紅二旗協領一員駐防熱河鑲白正藍二旗協領一員駐防熱河鑲紅鑲藍二旗協領一員駐防喀喇河屯蒙古右翼正黃正紅鑲紅鑲藍四旗協領一員駐防樺榆溝滿洲鑲黃旗佐領二員防禦二員驍騎校二員駐防熱河正黃旗佐領二員防禦二員驍騎校二員駐防熱河正白旗佐領二員防禦二員驍騎校二員駐防熱河正紅旗佐領二員防禦二員驍騎校二員駐防熱河鑲白旗佐領二員防禦二員驍騎校二員駐防熱河正藍旗佐領二員防禦二員驍騎校二員駐防熱河鑲紅旗佐領二員防禦二員驍騎校二員駐防喀喇河屯鑲藍旗佐領二員防禦二員驍騎校二員駐防喀喇河屯蒙古鑲黃正白二旗佐領一員防禦一員驍騎校一員駐防樺榆溝鑲白正藍二旗佐領一員防禦一員驍騎校一員駐防樺榆溝正黃正紅二旗佐領一員防禦一員驍騎校一員駐防熱河鑲紅鑲藍二旗佐領一員防禦一員驍騎校一員駐防熱河筆帖式二員初隸總管衙門今隸副都統衙門駐防兵二千名一千四百名駐防熱河四百名駐防喀喇河屯二百名駐防樺榆溝右熱河等處駐防雍正二年初設總管一員副總管二員佐領十六員驍騎校十六員筆帖式二員兵八百名分駐熱河喀喇河屯樺榆溝三處乾隆三年裁總管副總管改設副都統一員增置協領六員三十八年裁蒙古左翼四旗協領一員防禦二十員又增佐領四員驍騎校四員兵一千二百名今現額副都統一員協領五員佐領二十員內五員係協領兼管防禦二十員驍騎校二十員筆帖式二員兵二千名俱隸熱河副都統熱河總管所轄內府三旗漢軍官兵熱河總管二員苑副三員熱河行宮守衛千總十一員副千總二十二員喀喇河屯行宮守衛千總一員副千總一員王家營行宮守衛副千總一員長山峪行宮守衛千總一員副千總一員兩間房行宮守衛千總一員副千總一員古北口行宮守衛千總一員副千總一員釣魚臺行宮守衛千總一員黃土坎行宮守衛副千總一員中關行宮守衛千總一員副千總一員什巴爾台行宮守衛副千總一員博羅河屯行宮守衛千總一員副千總一員濟爾哈朗圖行宮守衛千總一員副千總一員阿穆呼朗圖行宮守衛千總一員副千總一員張三營行宮守衛千總一員副千總一員熱河溥仁寺普樂寺安遠廟普寧寺普陀宗乘廟殊像寺廣安寺羅漢堂八處守衛千總五員副千總六員把總四員守衛兵九百九名右熱河總管所轄漢軍掌守衛口外行宮康熙四十二年初設總管先後簽移奉天黑龍江吉林烏喇茅溝等處人户安置熱河分衛行宮雍正二年準總管尚書赫奕奏改設兵六百十一名舊制守備二員千總十四員雍正十年改守備缺亦為千總共千總十六員副千總二十六員乾隆三十五年增置苑副三員嗣因各處添建行宮寺廟先後添設千總九員副千總十五員把總四員兵二百九十八名今現額總管二員苑副三員千總二十五員副千總四十一員把總四員兵九百九名俱隸熱河總管直隸提督標所轄河屯協各營官兵河屯協副將一員駐劄熱河河屯協中軍兼管左營事都司一員千總一員把總二員駐劄熱河分防喀喇河屯汛千總一員馬圈子汛把總一員中關汛把總一員下板城汛把總一員新嶂子汛外委一員七間房外委把總一員三道梁外委把總一員河屯協右營土城子守備一員千總一員把總一員分防僧機圖汛千總一員郭家屯把總一員上黃旗汛把總一員大閣汛把總一員虎什哈汛把總一員博羅淖爾汛外委把總一員四坌口汛外委把總一員河屯協八溝營都司一員千總一員把總二員分防龍鬚門汛千總一員雅圖溝汛把總一員中六溝汛把總一員二溝汛把總一員茅溝汛把總一員七溝汛外委千總一員暖泉汛外委把總一員博羅樹汛外委把總一員河屯協唐三營守備一員千總一員分防黃姑屯汛千總一員白虎溝汛把總一員喇嘛洞汛把總一員大店子汛把總一員紅旗汛外委把總一員荒地汛外委把總一員河屯協四營馬步守兵一千一百九十九名右河屯協四營康熙四十五年初設河屯營守備駐劄喀喇河屯四十八年移駐熱河雍正元年添設河屯營參將九年改原設守備為中軍守備十年設八溝營守備唐三營守備各一員增置辨兵乾隆二年準直隸提督瞻桂奏改河屯營參將為參將添設左右二營改中軍守備為中軍都司兼管左營事設左右土城子守備一員改八溝營守備為八溝營都司仍與原設之唐三營守備統歸河屯協管轄自副將以下並聽熱河駐防大臣調遣其巡哨之制千總把總外委每月與鄰汛會哨一次都司守備每季會哨一次副將每年春冬巡查一次今現額河屯協副將一員都司二員守備二員千總八員外委千總三員把總十九員外委把總七員實操馬步兵一千一百九十九名俱隸直隸提督標直隸總督標所轄捕盜官兵承德府即熱河廳屬熱河捕盜把總一員額外外委一員平泉州即八溝廳屬喀爾沁捕盜千