body:
  text: 欽定四庫全書欽定熱河志卷十八巡典六御製詩壬午七月八日恭奉皇太后木蘭行圍啟蹕之作通閏由來秋氣早孟秋初吉啟龍旃懸知瞻就迎諸部最喜康强奉大年按頓依然息衆力逐程特厪閲農田黍稌遭澇稀垂穗帑濟租蠲遑忍延出古北口作秦代長城太古秋清時來徃習秋蒐刀耕火種率由出壘敗垣頺那藉修真是不征譏亦簡凡關皆有稅惟古北自康熈年間即不征稅至今因之幸因弗澇穫還稠度關多稼欣逢慶一百年前有此不恭奉皇太后至避暑山莊即事一律遼退今秋早半月大安日日奉同行去嵗阻澇因先啟蹕隨路視槁道俱妥始命諴親王恭奉聖母就道高年康健真堪慶祖德恢鴻益厪情地自清涼聽午熱是日微熱黍方秀實利西成廣仁嶺度山莊近恰有排班哈薩迎時哈薩克汗阿布賚遣陪臣蘇爾統都勒特赫勒等入覲適至山莊即於嶺前迎接避暑山莊啟蹕木蘭行圍之作白露今年早中元度啟程野橋取路直潦水落潭平晩稼偏冝熱秋空正快晴貴山求宿衞笑許鑒葵誠哈薩克汗阿布賚遣使請安為其所遣陪臣鄂莫爾色楞白特爾二人懇留備羽林之屬因命為乾凊門侍衞遷徃伊犁木蘭迴蹕駐避暑山莊作圍期今嵗促廿五日云旋行慶兼施惠秋清正月圓天香屋有桂霜勒浦餘蓮晩熱蒸為雨聽之言發泉萬樹園賜宴即席得句叢樾中間甫野長甫田叢樾為三十六景之一又名萬樹園清秋嘉宴拂廬張北宛西海胥來賀祖德宗功正未央詎曰銷兵應凱樂益欽守器慎幾康訓恭儉亦示慈惠幣帛均頒實篚箱重陽日侍皇太后宴皓氣澄秋日日加山莊重九更堪誇登高全攬川原美獻壽欣當風物嘉綺嶺低昂綴紅葉芳階錯落綻黄花宮中行樂真行樂玉塞彤庭總一家雪九月十四日是日入古北口夜報塞天同起雲凌晨玉葉遂翩紛無林不作銀花影有嶂皆成氷綺紋酒店旗飄近方見僧房鐘響遠猶聞入關廿里原秋雨南北寒暄一嶺分二十七年七月戊辰上奉皇太后啟蹕巡幸塞外降㫖以夏雨過多加恩蠲免所過地方額賦十分之五辛未出古北口甲戌至熱河行宮哈薩克使臣蘇爾統都勒特赫勒等入覲丙子上行圍木蘭奉皇太后自熱河啟行丁亥駐蹕伊緜峪賜扈從王公大臣䝉古王公台吉及哈薩克使臣等宴八月丁酉駐蹕張三營賜扈從王公大臣䝉古王公台吉及哈薩克使臣等並隨圍兵丁等飯庚子迴熱河行宮壬寅上奉皇太后於卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉及哈薩克使臣等宴癸夘上萬壽聖節詣皇太后行宮行禮御澹泊敬誠殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台吉等宴凡三日丙午御萬樹園賜宴觀火戲及健鋭營兵丁馬技丁未御延薰山館賜軍機大臣御前侍衞等飯戊申上侍皇太后膳賜扈從王公大臣䝉古王公台吉及哈薩克使臣等茶果凡四日甲寅復賜茶果凡四日九月戊辰重陽節上奉皇太后于延薰山館侍膳庚午上奉皇太后自熱河迴鑾癸酉入古北口丙子上奉皇太后迴圓明園御製詩癸未恭奉皇太后啟蹕幸避暑山莊作有序麥風扇牖北至正爾迎旬霉雨收林南訛於焉叶序佇園齋之待葺志奉慈娯臨塞館以來遊言循祖制同朝啟駕率衞士以前驅按頓徐征命親藩而扈從時也青黄稍接茒簷餠餌香新晹雨維時清甽稑穜穎擢汙菜已滌觀民而誌輯河渠輸輓無勞阜俗則經籌食貨倉粟散因陳之積頒逮周廬窖煤資挹取之供直平近市仙莊宜避暑前郵即迓安輿秘殿稱延薰駐蹕疇咨法從披六曹之政牘排日封函掄九品之選人閲時輪對幾餘典學寧孤修晷於長嬴農隙詰戎更跂高秋於大野因詹吉斾用冠行編有事園齋待葺修山莊先節奉慈遊毎嵗秋月啟駕兹以修葺園齋啟程較早月餘按程徐進高年適避暑真宜夏凊留稍喜青黄資食接更看高下蔚苗稠長途歴歴觀農况敢為巡行忽本謀降㫖免經過州縣賦十分之五詩以誌事歴嵗來巡例免三昨年加二為遭渰正當元氣未復際仍與優恩普被湛夏長已佳誠滿望秋成待至敢輕談閭閻已自無征調近畿歉收州縣應行蠲緩各項已屢經降㫖格外蠲緩命嵗二月内復命將勘不成灾之處本年應徵錢粮㮣緩至秋成後再行酌量帶徴是二麥收穫時催租之吏可以掃迹矣二麥登埸任負擔出古北口浮翠千巒烘曉晴觀民按轡出長城天然龍幹分南北便覺爽風拂面迎潮河如帶向南流敗壘頺垣不事修設待修兹為守禦繫桑已是失長謀關外從來禾􅎟佳夏田飽看蔚苗皆歉餘况復秋成逺不敢欣懷祗懼懷興州厄魯例來迎効力馳驅各盡誠三十年前皆勁敵念兹惟益凛持盈至避暑山莊駐蹕作山莊避暑祖功深待葺園齋用早臨綠嶼青峯新景色對時育物舊神心欲慿福地遣煩緒自有雲山啟静吟明日慈輿便言至歡迎夏凊仰徽音出麗正門㳟迎皇太后駕至山莊策驄山市迓金輿七日翹心一日紓仙地清凉冝攝飬雲齋松鶴奉興居山莊内殿名皇太后所御内松鶴齋愛看畫影偏遲砌便有炎風解避䟽食履高年増健旺樂同天下始從予秋日奉皇太后遊山作遊山秋最冝延爽謝炎時千嶂安輿導六宮寳馬隨佳隂猶翠葉清馥在紅㽔行樂真行樂寰中許共知熱河啟蹕幸木蘭作秋蒐雖例事啟蹕又從新桂節纔方過鸞旗此重去聲陳鹿音遥接待馬意近精神且復覘心願村村納稼巡䝉古王公等進宴即席得句大野涼秋皜日晶筵張黄幕傍行營千羣馬集英姿試九白駝牽吉兆呈例事詎惟遵典屬歡言恒是鑒抒誠漢唐此地寧有此益凛氷淵戒滿盈賜䝉古王公等宴並頒賞執役者獵期不欲久半月適應還程喜行宮近筵開駐蹕閒笙簧洽有秩幣帛與均頒詎止循常例懷柔切此間木蘭迴蹕至避暑山莊仲秋啟蹕返深秋紫翠林光頓改眸隔嶂鹿鳴全似喚上窻駒影信如流引成渠水聲添冷吐得巖嵐幻益浮到此精㣲契神處可能五日不為平聲畱入古北口見閭閻秋成有象詩以誌慰雄闗詎止此提對壁壘猶看架嶺重四閲月惟消一瞬㡬章詩耳付千峯魚鱗塍幸秋成好馬首路欣暖景逢洊饉閭閻藉稍濟敢言元氣復吾農二十八年五月甲戌上奉皇太后啟蹕巡幸塞外是日皇太后駐蹕湯泉行宮上駐蹕石槽行宮因駐蹕皇太后懿㫖于啟鑾日湯泉後至山莊一日程較緩馳詣上遵奉皇太后慈諭每日或間日遣侍衞等行宮請安遂為嵗例云降㫖以上年被災之後仍加恩蠲免所過地方額賦十分之五丁丑出古北口庚辰至熱河行宮辛巳上詣廣仁嶺恭迎皇太后駕至熱河行宮癸未降㫖賞給管守熱河行宮千總太監及兵丁等錢糧有差八月丙戌上奉皇太后於卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉等茶果凡七日甲午丙申亦如之丁酉上萬壽聖節詣皇太后行宮行禮御澹泊敬誠殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台吉等宴凡三日辛丑上行圍木蘭奉皇太后自熱河啟行丙午行圍殪虎駐蹕呼魯蘇台戊申駐蹕納喇蘇台達巴罕䝉古王公等恭進御宴上奉皇太后閲馬戲己酉駐蹕都穆逹烏拉岱壬子行圍殪虎駐蹕鄂爾楚克哈達甲寅行圍殪虎駐蹕扎克丹鄂佛洛九月丁巳行圍殪虎駐蹕薩爾巴里哈逹辛酉駐蹕烏穆呼朗圖賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯癸亥重陽節上詣皇太后行殿侍膳是日駐蹕愽羅河屯乙丑迴熱河行宮庚午上奉皇太后自熱河迴鑾癸酉入古北口丙子上奉皇太后迴圓明園御製詩甲申恭奉皇太后啟蹕幸避暑山莊作爽颸皎日曉秋天蘭上行將試大畋敬奉慈輿循後頓向毎日奉夏月慈輦逐程而進以便問懿㫖安自去嵗幸山莊奉皇太后欲同日起程是日駐湯泉較近而後一日至山莊例則程既緩而隨從諸人至均適便朕欽遵遂以為爰驅清蹕啟前旃浮橋潦水收新漲彌野香風拂甫田嵗嵗塞巡觀寳穡最佳寳穡是今年降㫖免經過州縣賦十分之三詩以誌事北巡經赤縣例免三弗取去嵗及前年乃至十之五誠以遭洊饑民艱厪心苦兩熟幸去嵗去嵗麥既收秋田亦頗稔元氣復未覩今夏麥勝昨大田若晹雨按轡所經歴翼翼芃稷􅎟登埸在指日審足資三鬴可以按恒例免三增惠汝其實賦幾何寧如遇豐廡天恩信博濟人事終小補出古北口作昨夜㣲陰詰旦晴千山翠色益晶明今朝秋末三庚盡便有涼風馬上迎雉堞依然棲絶峯亡秦寧可恃提封若無竟海巖巖者今日誰因笑祖龍因山為市操去聲奇嬴列販從來不事征凡闗口例有稅惟古北獨無盖地民皇祖欲加㤙此至今遵以為例百嵗老人歌厚徳街旁一例執香迎高下秋田苖總芃果然闗外勝闗中宜晹邇日心誠慰因慰翻殷懼滿衷至避暑山莊駐蹕成什每嵗臨秋避暑莊逮云至止暑先藏去年曾一觀其妙去嵗夏月即㳟奉皇太后駐此夏凊真稱樂以長預此清塵成例典見前作明當愛日仰康强幾閒那得饒清靜不盡吟題正待償出麗正門㳟迎皇太后駕至山莊昨宵霏細雨誠恐礙輿行半夜全開霽歡生䇿馬迎康强緣大德遊豫喜西成自益無疆夀詎惟必得名熱河啟蹕徃木蘭作雨過沙溪潦水收川原銍艾喜迎眸興飛捺鉢初排駕願愜甌窶幸滿篝守吏分疆遞來接村民生計自為謀輕於什一山田賦莫慢催科事苦求八月廿六日䝉古王公等獻宴即席得句資生四種既繁稠䝉古以馬駝牛馬四種為資生之具更喜谷間稼稔收内扎薩克今亦大半種藝并招致農民收田租之利矣朋酒稱觥遵徃嵗霽雲覆幕讌中秋千山錦繡高低疊一水笙簧宛轉流綽爾齊終䝉古彈火不思吹笳奏曲謂之綽爾齊觀灑馬即詐馬俗謂之騎逹駻古風偏愛以時修迴蹕至避暑山莊作乗時大獮木蘭迴三日仙莊擬暫陪擬於此駐蹕三日憇衆彌月看他纔眼瞥百年例此得心開樹餘綠葉因山暖菊有黄華傍砌栽靄靄明窻上曦影箇中依舊引吟裁入古北口即事溯游潮水又迴轅萬壑羣山鎖隘門塞上秋猶不覺冷關中曦故喜披温行看綠幕連前路徃嵗塞外葉落入關猶見綠樹今嵗秋暖塞外樹亦尚未凋饒積黄墉接野村剛為吾民慶逢稔何來穀賤有煩言畿輔今嵗秋成為數十年所罕遇而民間反有傷農之歎可見人心太不知足其何以承之憮天佑耶為然二十九年七月丁夘上奉皇太后啟蹕巡幸塞外是日皇太后駐蹕湯泉行宮上駐蹕石槽行宮降㫖蠲免所過地方額賦十分之三庚午出古北口癸酉至熱河行宮上詣廣仁嶺恭迎皇太后駕至熱河行宮丁丑上奉皇太后于卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉等茶果凡三日八月辛巳復賜茶果凡七日辛夘上侍皇太后膳賜扈從王公大臣及䝉古王公台吉等宴壬辰上萬壽聖節詣皇太后行宮行禮御澹泊敬誠殿扈從王公文武大臣官員及䝉古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台吉等宴凡三日戊戌上行圍木蘭奉皇太后自熱河啟行乙巳駐蹕永安拜昂阿䝉古王公等恭進御宴上奉皇太后閲馬戲己酉駐蹕永安拜色欽賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯九月辛亥行圍殪豹駐蹕庫爾圖察罕乙夘行圍殪豹駐蹕伊緜峪丙辰行圍殪虎二駐蹕扎克丹卾佛洛戊午重陽節上詣皇太后行殿侍膳賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯是日駐蹕鄂爾楚克哈逹丙寅駐蹕張三營賜扈從王公大臣䝉古王公台吉並隨圍兵丁等飯己巳迴熱河行宮癸酉上奉皇太后自熱河迴鑾丙子入古北口十月丙戌上奉皇太后迴圓明園御製詩乙酉恭奉皇太后啟蹕幸避暑山莊作撰吉秋巡啟析旌宜人風物叶金行寒浮曉氣波間漾朗射初陽樹底明按例康輿循後頓清塵快馬肅前程高低近逺良苗秀額慶西成卜屢成出古北口作曉色滄涼滿谷寒髙峯纔見日三竿昨朝午熱知何處水抱山縈隔幾盤鎻鑰尋常壯北門栖巖秦壘至今存戒嚴守此應遲矣貽笑那堪更僕論多稼今秋内外同未登埸敢道綏豐山村却報迎人象老㓜都㸔喜氣融至避暑山莊作萬疊螺峯蔚霽光行秋又復駐山莊蔽波荷錦猶呈綺徧野禾雲欲作黄歴看塞田眞有幸毎居巖館勵無荒今宵數問應何礙為是明朝迓夀康出麗正門恭迎皇太后駕至山莊駐蹕七朝行殿隔十里榮驄迎固是起居悉途間隔日馳使請適安知起居安寜紓懸企誠仙莊開詄蕩愛日仰光明寳穡沿途好知堪豫懿情木蘭啟蹕紀事有序桂輪香滿剛澄塞上之華楓板紅新恰繪蘭巾之景迺薫館駐經匝月當秋而獵騎方嫺繄慶霄酺逮連朝既望而貉郵宜表溯昔祖謨敬繼掖安輿以廵幸為常迨今慈夀益増居文囿而頥和斯當皇妃皇子留代温凊之忱塞水塞山近奉豫遊之樂移頓鼓循記里問安則驛置恒馳周阹圖按司虞數獲則鮮肥可逹顧今歲豐符留熟篝車紓省歛之懐矧此行觀侍員渠櫜犍識從公之義詰戌習衆身先弗獲辭勞養志娯親體適袛期履㤗雖曰鹿町苹露兩旬餘之定省偶暌敬惟鶴逕松風萬千歲之居寜伊始爰永言以識事同吉日之命篇秋蒐意寓聖人深無逸詰戎聨衆心一已自應勵朝夕髙齡却合豫園林鹿鳴鶴舞供清玩水驛山郵報吉音逾廿徃還兹啟蹕萬斯年例始斯今雨中䝉古王公等進宴詩以誌事穹幕華筵備已齊來臨那避雨雲低大都事欲從人願于是言寜藉象鞮侑酒不妨歌一闋所謂綽爾多宻者䝉古備宴必用之教駣音陶可罷馬千蹏即騎逹駻也是日以雨濘命罷之行營歸轡原非遠煙景諸峯恰入題重九日張三營行宫賜䝉古王公等宴賚即事得句蒐成依例賚藩翰毎値重陽興倍歡此地値重九宴賚者逮兹凡三度矣執役雖無過廿日施恩要欲遍千官輕雲綴宇魚鱗碎積雪依峯玉色寒獨是今番踈獻節南山遥望祝釐安木蘭迴蹕至避暑山莊請皇太后安恭悉起居和適欣成長句書懐快霽兼欣息夜風蒐迴問寢祖時同康熈年間園必自木蘭迴皇祖奉詣問安慈寕駐蹕山莊親兹敬遵其例云松留舊緑如新緑楓染深紅及淺紅翹企慰哉心切切康强悉矣喜融融敬遵慈訓兹成例䝉間成例聖母諭以自此將歲循康熈年欽承之下曷勝欣依於萬斯年願豈窮入古北口作石城埤堄倚雲開渡去潮河又渡廻稔歲圃場無隙地前朝鎻鑰有髙臺今秋收更昨秋勝出口看周入口來綏屢同民樂飽暖何修慶遇益欽哉三十年七月辛巳上奉皇太后巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宮壬午降㫖蠲免所過地方額賦十分之三甲申出古北口丁亥至熱河行宮戊子上詣廣仁嶺恭迎皇太后駕至熱河行宮辛丑上奉皇太后於卷阿勝境侍膳賜扈從王公大臣䝉古王公台吉等茶果凡三日八月乙巳復賜王公大臣䝉古王公台吉等茶果凡七日癸丑上奉皇太后於萬樹園侍膳賜䝉古王公台吉及都爾伯特親王䇿凌烏巴什等宴乙邜上侍皇太后膳賜扈從王公大臣䝉古王公台吉及都爾伯特親王策凌烏巴什等宴丙辰上萬壽聖節詣皇太后行宮行禮御澹泊敬誠殿扈從王公文武大臣官員䝉古王公吉吉及都爾伯特親王策凌烏巴什等行慶賀禮上侍皇太后膳賜王公大臣䝉古王公台吉及都爾伯特親王策凌烏巴什等宴凡三日己未上啟蹕行圍木蘭皇太后仍駐熱河行宮增上以命皇妃皇太后聖壽益皇子留侍山莊請等上啟行後間日遣侍衞安進鮮嵗以為例癸亥行圍殪熊駐蹕海拉蘇台甲子行圍殪熊駐蹕呼魯蘇台丁夘駐蹕都穆逹烏拉岱䝉古王公等恭進御宴九月己夘行圍殪虎駐蹕布爾哈蘇台壬午駐蹕張三營賜䝉古王公台吉並隨圍兵丁等飯甲申迴熱河行宮恭請皇太后安己丑上奉皇太后自熱河迴鑾壬辰入古北口乙未上奉皇太后迴圓明園欽定熱河志卷十八
