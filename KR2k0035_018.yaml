body:
  text: 欽定四庫全書欽定熱河志卷十八巡典六御製詩壬午七月八日恭奉皇太后木蘭行圍啓蹕之作通閏由來秋氣早孟秋初吉啓龍旃懸知瞻就迎諸部最喜康強奉大年按頓依然息衆力逐程特厪閲農田黍稌遭潦稀垂穗帑濟租蠲遑忍延出古北口作秦代長城太古秋清時來往習秋搜刀耕火種率由出壘敗垣頺那藉修真是不征譏亦簡凡關皆有稅惟古北自康熙年間即不征稅至今因之幸因弗潦穫還稠度關多稼欣逢慶一百年前有此不恭奉皇太后至避暑山莊即事一律遼退今秋早半月大安日日奉同行去嵗阻潦因先啓蹕隨路視稿道俱妥始命諴親王恭奉聖母就道高年康健真堪慶祖德恢鴻益厪情地自清涼聽午熱是日微熱黍方秀實利西成廣仁嶺度山莊近恰有排班哈薩迎時哈薩克汗阿布賚遣陪臣蘇爾統都勒特赫勒等入覲適至山莊即於嶺前迎接避暑山莊啓蹕木蘭行圍之作白露今年早中元度啓程野橋取路直潦水落潭平晚稼偏冝熱秋空正快晴貴山求宿衛笑許鑒葵誠哈薩克汗阿布賚遣使請安為其所遣陪臣鄂莫爾色楞白特爾二人懇留備羽林之屬因命為乾凊門侍衛遷往伊犁木蘭回蹕駐避暑山莊作圍期今嵗促草五日云旋行慶兼施惠秋清正月圓天香屋有桂霜勒浦餘蓮晚熱蒸為雨聽之言發泉萬樹園賜宴即席得句叢樾中間甫野長甫田叢樾為三十六景之一又名萬樹園清秋嘉宴拂廬張北宛西海胥來賀祖德宗功正未央詎曰銷兵應凱樂益欽守器慎幾康訓恭儉亦示慈惠幣帛均頒實篚箱重陽日侍皇太后宴皓氣澄秋日日加山莊重九更堪誇登高全攬川原美獻壽欣當風物嘉綺嶺低昂綴紅葉芳階錯落綻黃花宮中行樂真行樂玉塞彤庭總一家雪九月十四日是日入古北口夜報塞天同起雲凌晨玉葉遂翩紛無林不作銀花影有嶂皆成氷綺紋酒店旗飄近方見僧房鐘響遠猶聞入關草里原秋雨南北寒暄一嶺分二十七年七月戊辰上奉皇太后啓蹕巡幸塞外降旨以夏雨過多加恩蠲免所過地方額賦十分之五辛未出古北口甲戌至熱河行宮哈薩克使臣蘇爾統都勒特赫勒等入覲丙子上行圍木蘭奉皇太后自熱河啓行丁亥駐蹕伊綿峪賜扈從王公大臣蒙古王公台吉及哈薩克使臣等宴八月丁酉駐蹕張三營賜扈從王公大臣蒙古王公台吉及哈薩克使臣等並隨圍兵丁等飯庚子回熱河行宮壬寅上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉及哈薩克使臣等宴癸卯上萬壽聖節詣皇太后行宮行禮御淡泊敬誠殿扈從王公文武大臣官員及蒙古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉等宴凡三日丙午御萬樹園賜宴觀火戲及健鋭營兵丁馬技丁未御延薰山館賜軍機大臣御前侍衛等飯戊申上侍皇太后膳賜扈從王公大臣蒙古王公台吉及哈薩克使臣等茶果凡四日甲寅復賜茶果凡四日九月戊辰重陽節上奉皇太后于延薰山館侍膳庚午上奉皇太后自熱河回鑾癸酉入古北口丙子上奉皇太后回圓明園御製詩癸未恭奉皇太后啓蹕幸避暑山莊作有序麥風扇牖北至正爾迎旬黴雨收林南訛於焉叶序佇園齋之待葺志奉慈娛臨塞館以來遊言循祖制同朝啓駕率衛士以前驅按頓徐征命親藩而扈從時也青黃稍接茒簷餅餌香新晹雨維時清甽稑穜穎擢汙菜已滌觀民而志輯河渠輸挽無勞阜俗則經籌食貨倉粟散因陳之積頒逮周廬窖煤資挹取之供直平近市仙莊宜避暑前郵即迓安輿祕殿稱延薰駐蹕疇咨法從披六曹之政牘排日封函掄九品之選人閲時輪對幾餘典學寧孤修晷於長嬴農隙詰戎更跂高秋於大野因詹吉斾用冠行編有事園齋待葺修山莊先節奉慈遊每嵗秋月啓駕兹以修葺園齋啓程較早月餘按程徐進高年適避暑真宜夏凊留稍喜青黃資食接更看高下蔚苗稠長途歷歷觀農况敢為巡行忽本謀降旨免經過州縣賦十分之五詩以志事歷嵗來巡例免三昨年加二為遭淹正當元氣未復際仍與優恩普被湛夏長已佳誠滿望秋成待至敢輕談閭閻已自無征調近畿歉收州縣應行蠲緩各項已屢經降旨格外蠲緩命嵗二月內復命將勘不成災之處本年應徵錢糧概緩至秋成後再行酌量帶徴是二麥收穫時催租之吏可以掃迹矣二麥登埸任負擔出古北口浮翠千巒烘曉晴觀民按轡出長城天然龍幹分南北便覺爽風拂面迎潮河如帶向南流敗壘頺垣不事修設待修兹為守禦繫桑已是失長謀關外從來禾􅎟佳夏田飽看蔚苗皆歉餘况復秋成逺不敢欣懷祗懼懷興州厄魯例來迎效力馳驅各盡誠三十年前皆徑敵念兹惟益凛持盈至避暑山莊駐蹕作山莊避暑祖功深待葺園齋用早臨緑嶼青峯新景色對時育物舊神心欲慿福地遣煩緒自有雲山啓靜吟明日慈輿便言至歡迎夏凊仰徽音出麗正門恭迎皇太后駕至山莊策驄山市迓金輿七日翹心一日紓仙地清涼冝攝飬雲齋松鶴奉興居山莊內殿名皇太后所御內松鶴齋愛看畫影偏遲砌便有炎風解避疏食履高年增健旺樂同天下始從豫秋日奉皇太后遊山作遊山秋最冝延爽謝炎時千嶂安輿導六宮寶馬隨佳隂猶翠葉清馥在紅㽔行樂真行樂寰中許共知熱河啓蹕幸木蘭作秋搜雖例事啓蹕又從新桂節才方過鸞旗此重去聲陳鹿音遙接待馬意近精神且復覘心願村村納稼巡蒙古王公等進宴即席得句大野涼秋皓日晶筵張黃幕傍行營千羣馬集英姿試九白駝牽吉兆呈例事詎惟遵典屬歡言恆是鑒抒誠漢唐此地寧有此益凛氷淵戒滿盈賜蒙古王公等宴並頒賞執役者獵期不欲久半月適應還程喜行宮近筵開駐蹕間笙簧洽有秩幣帛與均頒詎止循常例懷柔切此間木蘭回蹕至避暑山莊仲秋啓蹕返深秋紫翠林光頓改眸隔嶂鹿鳴全似喚上窗駒影信如流引成渠水聲添冷吐得巖嵐幻益浮到此精微契神處可能五日不為平聲留入古北口見閭閻秋成有象詩以志慰雄關詎止此提對壁壘猶看架嶺重四閲月惟消一瞬幾章詩耳付千峯魚鱗塍幸秋成好馬首路欣暖景逢洊饉閭閻藉稍濟敢言元氣復吾農二十八年五月甲戌上奉皇太后啓蹕巡幸塞外是日皇太后駐蹕湯泉行宮上駐蹕石槽行宮因駐蹕皇太后懿旨于啓鑾日湯泉後至山莊一日程較緩馳詣上遵奉皇太后慈諭每日或間日遣侍衛等行宮請安遂為嵗例云降旨以上年被災之後仍加恩蠲免所過地方額賦十分之五丁丑出古北口庚辰至熱河行宮辛巳上詣廣仁嶺恭迎皇太后駕至熱河行宮癸未降旨賞給管守熱河行宮千總太監及兵丁等錢糧有差八月丙戌上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉等茶果凡七日甲午丙申亦如之丁酉上萬壽聖節詣皇太后行宮行禮御淡泊敬誠殿扈從王公文武大臣官員及蒙古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉等宴凡三日辛丑上行圍木蘭奉皇太后自熱河啓行丙午行圍殪虎駐蹕呼魯蘇台戊申駐蹕納喇蘇台達巴罕蒙古王公等恭進御宴上奉皇太后閲馬戲己酉駐蹕都穆逹烏拉岱壬子行圍殪虎駐蹕鄂爾楚克哈達甲寅行圍殪虎駐蹕扎克丹鄂佛洛九月丁巳行圍殪虎駐蹕薩爾巴里哈逹辛酉駐蹕烏穆呼朗圖賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯癸亥重陽節上詣皇太后行殿侍膳是日駐蹕博羅河屯乙丑回熱河行宮庚午上奉皇太后自熱河回鑾癸酉入古北口丙子上奉皇太后回圓明園御製詩甲申恭奉皇太后啓蹕幸避暑山莊作爽颸皎日曉秋天蘭上行將試大畋敬奉慈輿循後頓向每日奉夏月慈輦逐程而進以便問懿旨安自去嵗幸山莊奉皇太后欲同日起程是日駐湯泉較近而後一日至山莊例則程既緩而隨從諸人至均適便朕欽遵遂以為爰驅清蹕啓前旃浮橋潦水收新漲彌野香風拂甫田嵗嵗塞巡觀寶穡最佳寶穡是今年降旨免經過州縣賦十分之三詩以志事北巡經赤縣例免三弗取去嵗及前年乃至十之五誠以遭洊飢民艱厪心苦兩熟幸去嵗去嵗麥既收秋田亦頗稔元氣復未覩今夏麥勝昨大田若晹雨按轡所經歷翼翼芃稷􅎟登埸在指日審足資三釜可以按恆例免三增惠汝其實賦幾何寧如遇豐廡天恩信博濟人事終小補出古北口作昨夜微陰詰旦晴千山翠色益晶明今朝秋末三庚盡便有涼風馬上迎雉堞依然棲絶峯亡秦寧可恃提封若無竟海巖巖者今日誰因笑祖龍因山為市操去聲奇嬴列販從來不事征凡關口例有稅惟古北獨無蓋地民皇祖欲加恩此至今遵以為例百嵗老人歌厚德街旁一例執香迎高下秋田苖總芃果然關外勝關中宜晹邇日心誠慰因慰翻殷懼滿衷至避暑山莊駐蹕成什每嵗臨秋避暑莊逮云至止暑先藏去年曾一觀其妙去嵗夏月即恭奉皇太后駐此夏凊真稱樂以長預此清塵成例典見前作明當愛日仰康強幾間那得饒清靜不盡吟題正待償出麗正門恭迎皇太后駕至山莊昨宵霏細雨誠恐礙輿行半夜全開霽歡生䇿馬迎康強緣大德遊豫喜西成自益無疆夀詎惟必得名熱河啓蹕往木蘭作雨過沙溪潦水收川原銍艾喜迎眸興飛捺鉢初排駕願愜甌窶幸滿篝守吏分疆遞來接村民生計自為謀輕於什一山田賦莫慢催科事苦求八月草六日蒙古王公等獻宴即席得句資生四種既繁稠蒙古以馬駝牛馬四種為資生之具更喜谷間稼稔收內扎薩克今亦大半種藝并招致農民收田租之利矣朋酒稱觥遵往嵗霽雲覆幕宴中秋千山錦繡高低疊一水笙簧宛轉流綽爾齊終蒙古彈火不思吹笳奏曲謂之綽爾齊觀灑馬即詐馬俗謂之騎逹駻古風偏愛以時修回蹕至避暑山莊作乘時大獮木蘭回三日仙莊擬暫陪擬於此駐蹕三日憩衆彌月看他才眼瞥百年例此得心開樹餘緑葉因山暖菊有黃華傍砌栽靄靄明窗上曦影箇中依舊引吟裁入古北口即事溯遊潮水又回轅萬壑羣山鎖隘門塞上秋猶不覺冷關中曦故喜披溫行看緑幕連前路往嵗塞外葉落入關猶見緑樹今嵗秋暖塞外樹亦尚未凋饒積黃墉接野村剛為吾民慶逢稔何來穀賤有煩言畿輔今嵗秋成為數十年所罕遇而民間反有傷農之歎可見人心太不知足其何以承之憮天佑耶為然二十九年七月丁卯上奉皇太后啓蹕巡幸塞外是日皇太后駐蹕湯泉行宮上駐蹕石槽行宮降旨蠲免所過地方額賦十分之三庚午出古北口癸酉至熱河行宮上詣廣仁嶺恭迎皇太后駕至熱河行宮丁丑上奉皇太后于卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉等茶果凡三日八月辛巳復賜茶果凡七日辛卯上侍皇太后膳賜扈從王公大臣及蒙古王公台吉等宴壬辰上萬壽聖節詣皇太后行宮行禮御淡泊敬誠殿扈從王公文武大臣官員及蒙古王公台吉等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉等宴凡三日戊戌上行圍木蘭奉皇太后自熱河啓行乙巳駐蹕永安拜昂阿蒙古王公等恭進御宴上奉皇太后閲馬戲己酉駐蹕永安拜色欽賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯九月辛亥行圍殪豹駐蹕庫爾圖察罕乙卯行圍殪豹駐蹕伊綿峪丙辰行圍殪虎二駐蹕扎克丹卾佛洛戊午重陽節上詣皇太后行殿侍膳賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯是日駐蹕鄂爾楚克哈逹丙寅駐蹕張三營賜扈從王公大臣蒙古王公台吉並隨圍兵丁等飯己巳回熱河行宮癸酉上奉皇太后自熱河回鑾丙子入古北口十月丙戌上奉皇太后回圓明園御製詩乙酉恭奉皇太后啓蹕幸避暑山莊作撰吉秋巡啓析旌宜人風物叶金行寒浮曉氣波間漾朗射初陽樹底明按例康輿循後頓清塵快馬肅前程高低近逺良苗秀額慶西成卜屢成出古北口作曉色滄涼滿谷寒髙峯才見日三竿昨朝午熱知何處水抱山縈隔幾盤鎖鑰尋常壯北門栖巖秦壘至今存戒嚴守此應遲矣貽笑那堪更僕論多稼今秋內外同未登埸敢道綏豐山村却報迎人象老幼都看喜氣融至避暑山莊作萬疊螺峯蔚霽光行秋又復駐山莊蔽波荷錦猶呈綺遍野禾雲欲作黃歷看塞田真有幸每居巖館勵無荒今宵數問應何礙為是明朝迓夀康出麗正門恭迎皇太后駕至山莊駐蹕七朝行殿隔十里榮驄迎固是起居悉途間隔日馳使請適安知起居安寧紓懸企誠仙莊開詄蕩愛日仰光明寶穡沿途好知堪豫懿情木蘭啓蹕紀事有序桂輪香滿剛澄塞上之華楓板紅新恰繪蘭巾之景乃薰館駐經匝月當秋而獵騎方嫺繄慶霄酺逮連朝既望而貉郵宜表溯昔祖謨敬繼掖安輿以巡幸為常逮今慈夀益增居文囿而頥和斯當皇妃皇子留代溫凊之忱塞水塞山近奉豫遊之樂移頓鼓循記里問安則驛置恆馳周阹圖按司虞數獲則鮮肥可逹顧今歲豐符留熟篝車紓省斂之懷矧此行觀侍員渠櫜犍識從公之義詰戌習衆身先弗獲辭勞養志娛親體適袛期履泰雖曰鹿町蘋露兩旬餘之定省偶暌敬惟鶴徑松風萬千歲之居寧伊始爰永言以識事同吉日之命篇秋搜意寓聖人深無逸詰戎聨衆心一已自應勵朝夕髙齡却合豫園林鹿鳴鶴舞供清玩水驛山郵報吉音逾草往還兹啓蹕萬斯年例始斯今雨中蒙古王公等進宴詩以志事穹幕華筵備已齊來臨那避雨雲低大都事欲從人願于是言寧藉象鞮侑酒不妨歌一闋所謂綽爾多密者蒙古備宴必用之教駣音陶可罷馬千蹄即騎逹駻也是日以雨濘命罷之行營歸轡原非遠煙景諸峯恰入題重九日張三營行宫賜蒙古王公等宴賚即事得句搜成依例賚藩翰每值重陽興倍歡此地值重九宴賚者逮兹凡三度矣執役雖無過草日施恩要欲遍千官輕雲綴宇魚鱗碎積雪依峯玉色寒獨是今番踈獻節南山遙望祝釐安木蘭回蹕至避暑山莊請皇太后安恭悉起居和適欣成長句書懷快霽兼欣息夜風搜回問寢祖時同康熙年間園必自木蘭回皇祖奉詣問安慈寧駐蹕山莊親兹敬遵其例云松留舊緑如新緑楓染深紅及淺紅翹企慰哉心切切康強悉矣喜融融敬遵慈訓兹成例蒙間成例聖母諭以自此將歲循康熙年欽承之下曷勝欣依於萬斯年願豈窮入古北口作石城埤堄倚雲開渡去潮河又渡回稔歲圃場無隙地前朝鎖鑰有髙臺今秋收更昨秋勝出口看周入口來綏屢同民樂飽暖何修慶遇益欽哉三十年七月辛巳上奉皇太后巡幸塞外是日皇太后駐蹕湯泉行宫上駐蹕石槽行宮壬午降旨蠲免所過地方額賦十分之三甲申出古北口丁亥至熱河行宮戊子上詣廣仁嶺恭迎皇太后駕至熱河行宮辛丑上奉皇太后於卷阿勝境侍膳賜扈從王公大臣蒙古王公台吉等茶果凡三日八月乙巳復賜王公大臣蒙古王公台吉等茶果凡七日癸丑上奉皇太后於萬樹園侍膳賜蒙古王公台吉及都爾伯特親王䇿凌烏巴什等宴乙邜上侍皇太后膳賜扈從王公大臣蒙古王公台吉及都爾伯特親王策凌烏巴什等宴丙辰上萬壽聖節詣皇太后行宮行禮御淡泊敬誠殿扈從王公文武大臣官員蒙古王公吉吉及都爾伯特親王策凌烏巴什等行慶賀禮上侍皇太后膳賜王公大臣蒙古王公台吉及都爾伯特親王策凌烏巴什等宴凡三日己未上啓蹕行圍木蘭皇太后仍駐熱河行宮增上以命皇妃皇太后聖壽益皇子留侍山莊請等上啓行後間日遣侍衛安進鮮嵗以為例癸亥行圍殪熊駐蹕海拉蘇台甲子行圍殪熊駐蹕呼魯蘇台丁卯駐蹕都穆逹烏拉岱蒙古王公等恭進御宴九月己卯行圍殪虎駐蹕布爾哈蘇台壬午駐蹕張三營賜蒙古王公台吉並隨圍兵丁等飯甲申回熱河行宮恭請皇太后安己丑上奉皇太后自熱河回鑾壬辰入古北口乙未上奉皇太后回圓明園欽定熱河志卷十八
